name: Publish catalogue

on:
  workflow_dispatch:

concurrency:
  group: publish-catalogue
  cancel-in-progress: true

jobs:
  rebuild-carlab:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_AUTO_SERVICE }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    defaults:
      run:
        working-directory: apps/auto-service
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/deployed/auto-service
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm exec vercel pull --yes --environment=production
      - run: pnpm exec vercel build --prod
      - run: pnpm exec vercel deploy --prebuilt --prod --archive=tgz
