name: Publish catalogue

on:
  workflow_dispatch:
    inputs:
      app:
        description: Site to rebuild
        type: choice
        options: [auto-service, detailing, approved-rs]
        default: auto-service
      ref:
        description: Commit to build instead of the deployed one, for a release CI cannot pass
        required: false

concurrency:
  group: publish-${{ inputs.app }}
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    environment: site-${{ inputs.app }}
    permissions:
      contents: read
    concurrency:
      group: deploy-site-${{ inputs.app }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || format('refs/tags/deployed/{0}', inputs.app) }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: workflow
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/cache@v4
        with:
          path: apps/${{ inputs.app }}/node_modules/.astro
          key: astro-${{ inputs.app }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: astro-${{ inputs.app }}-${{ github.ref_name }}-
      - name: Build and deploy
        env:
          SITE_SECRETS: >-
            {"CRON_SECRET": ${{ toJSON(secrets.CRON_SECRET || '') }},
            "GOOGLE_PLACES_API_KEY": ${{ toJSON(secrets.GOOGLE_PLACES_API_KEY || '') }},
            "KEYSTATIC_GITHUB_CLIENT_ID": ${{ toJSON(secrets.KEYSTATIC_GITHUB_CLIENT_ID || '') }},
            "KEYSTATIC_GITHUB_CLIENT_SECRET": ${{ toJSON(secrets.KEYSTATIC_GITHUB_CLIENT_SECRET || '') }},
            "KEYSTATIC_SECRET": ${{ toJSON(secrets.KEYSTATIC_SECRET || '') }},
            "MEDUSA_PUBLISHABLE_KEY": ${{ toJSON(secrets.MEDUSA_PUBLISHABLE_KEY || '') }},
            "META_CAPI_TEST_CODE": ${{ toJSON(secrets.META_CAPI_TEST_CODE || '') }},
            "META_CAPI_TOKEN": ${{ toJSON(secrets.META_CAPI_TOKEN || '') }},
            "SHOP_CLIENT_SECRET": ${{ toJSON(secrets.SHOP_CLIENT_SECRET || '') }},
            "SHOP_EVENTS_SECRET": ${{ toJSON(secrets.SHOP_EVENTS_SECRET || '') }},
            "SHOP_LEAD_SECRET": ${{ toJSON(secrets.SHOP_LEAD_SECRET || '') }},
            "SHOP_LEAD_SECRET_PREVIOUS": ${{ toJSON(secrets.SHOP_LEAD_SECRET_PREVIOUS || '') }},
            "SHOP_ORDER_OUTCOME_SECRET": ${{ toJSON(secrets.SHOP_ORDER_OUTCOME_SECRET || '') }},
            "SHOP_PREVIEW_TOKEN": ${{ toJSON(secrets.SHOP_PREVIEW_TOKEN || '') }},
            "SHOP_VISITOR_SEARCHES_SECRET": ${{ toJSON(secrets.SHOP_VISITOR_SEARCHES_SECRET || '') }},
            "TELEGRAM_ADMIN_ID": ${{ toJSON(secrets.TELEGRAM_ADMIN_ID || '') }},
            "TELEGRAM_BOT_TOKEN": ${{ toJSON(secrets.TELEGRAM_BOT_TOKEN || '') }},
            "TELEGRAM_CAPTURE_BOT_TOKEN": ${{ toJSON(secrets.TELEGRAM_CAPTURE_BOT_TOKEN || '') }},
            "TELEGRAM_CAPTURE_BOT_TOKEN_CARLAB": ${{ toJSON(secrets.TELEGRAM_CAPTURE_BOT_TOKEN_CARLAB || '') }},
            "TELEGRAM_CAPTURE_BOT_TOKEN_DETAILS": ${{ toJSON(secrets.TELEGRAM_CAPTURE_BOT_TOKEN_DETAILS || '') }},
            "TELEGRAM_CAPTURE_WEBHOOK_SECRET": ${{ toJSON(secrets.TELEGRAM_CAPTURE_WEBHOOK_SECRET || '') }},
            "TELEGRAM_GROUP_ID": ${{ toJSON(secrets.TELEGRAM_GROUP_ID || '') }},
            "TELEGRAM_OWNER_ID": ${{ toJSON(secrets.TELEGRAM_OWNER_ID || '') }},
            "TELEGRAM_WEBHOOK_SECRET": ${{ toJSON(secrets.TELEGRAM_WEBHOOK_SECRET || '') }}}
          SITE_VARS: ${{ toJSON(vars) }}
          VPS_HOST: ${{ secrets.AUTO_SERVICE_SHOP_VPS_HOST }}
          VPS_USER: ${{ secrets.AUTO_SERVICE_SHOP_VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.AUTO_SERVICE_SHOP_VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.AUTO_SERVICE_SHOP_VPS_KNOWN_HOSTS }}
          APP: ${{ inputs.app }}
        run: |
          sha=$(git rev-parse HEAD)
          sh workflow/.github/scripts/upload-site.sh "$APP" "$sha-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
