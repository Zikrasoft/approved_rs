name: Publish catalogue

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to build instead of the deployed one, for a storefront release CI cannot pass
        required: false
        default: refs/tags/deployed/auto-service

concurrency:
  group: publish-catalogue
  cancel-in-progress: true

jobs:
  rebuild-carlab:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    environment: site-auto-service
    permissions:
      contents: read
    concurrency:
      group: deploy-site-auto-service
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'refs/tags/deployed/auto-service' }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: workflow
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/cache@v4
        with:
          path: apps/auto-service/node_modules/.astro
          key: astro-carlab-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: astro-carlab-${{ github.ref_name }}-
      - name: Build and deploy
        env:
          SITE_SECRETS: ${{ toJSON(secrets) }}
          SITE_VARS: ${{ toJSON(vars) }}
          VPS_HOST: ${{ secrets.AUTO_SERVICE_SHOP_VPS_HOST }}
          VPS_USER: ${{ secrets.AUTO_SERVICE_SHOP_VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.AUTO_SERVICE_SHOP_VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.AUTO_SERVICE_SHOP_VPS_KNOWN_HOSTS }}
        run: |
          sha=$(git rev-parse HEAD)
          sh workflow/.github/scripts/deploy-site.sh auto-service "$sha-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
