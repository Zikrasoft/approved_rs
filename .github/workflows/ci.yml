name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Deploy every app, whatever the tags say (tests still run only for what changed)
        type: boolean
        default: false
      skip_check:
        description: Skip the test jobs (lint and tests) to ship a hotfix faster
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  SHOP_IMAGE: ghcr.io/zikrasoft/podbor-auto-service-shop
  CADDY_IMAGE: ghcr.io/zikrasoft/podbor-carlab-caddy
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12

jobs:
  static:
    if: ${{ !inputs.skip_check }}
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm lint
      - run: pnpm exec prettier --check .
      - run: node --experimental-strip-types .github/scripts/yaml-content-valid.ts
      - run: node --experimental-strip-types .github/scripts/russian-copy-hygiene.ts
      - run: sh .github/scripts/migrations-frozen.sh apps/auto-service-shop 'src/modules/*/migrations/*.ts' 'src/migration-scripts/*.ts'
        env:
          FROZEN_BASE: ${{ github.event.before }}
      - run: sh .github/scripts/migrations-frozen.sh packages/lead-crm 'prisma/migrations/*/migration.sql'
        env:
          FROZEN_BASE: ${{ github.event.before }}
      - run: sh .github/scripts/pinned-deps.sh
      - run: sh .github/scripts/security-headers-drift.sh
      - id: affected
        uses: ./.github/actions/affected
      - if: steps.affected.outputs.shop == 'true'
        uses: ./.github/actions/setup-auto-service-shop-env
      - env:
          BASE: ${{ steps.affected.outputs.base }}
        run: pnpm exec turbo run typecheck ${BASE:+"--filter=...[$BASE]"}
      - name: Clean up
        if: always()
        run: docker compose -f apps/auto-service-shop/docker-compose.test.yml down -v

  sites:
    if: ${{ !inputs.skip_check }}
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
      - id: affected
        uses: ./.github/actions/affected
      - env:
          BASE: ${{ steps.affected.outputs.base }}
        run: pnpm exec turbo run test ${BASE:+"--filter=...[$BASE]"} --filter='!@podbor/auto-service-shop'
      - if: steps.affected.outputs.sites != ''
        env:
          PUBLIC_PHONE_NUMBER: '381000000000'
          PUBLIC_WHATSAPP_NUMBER: '381000000000'
          PUBLIC_VIBER_NUMBER: '381000000000'
          PUBLIC_THREADS_CHANNEL: check
          MEDUSA_PUBLISHABLE_KEY: pk_check
          SITES: ${{ steps.affected.outputs.sites }}
        run: |
          read -ra sites <<<"$SITES"
          filters=()
          dists=()
          for site in "${sites[@]}"; do
            filters+=("--filter=@podbor/$site")
            dists+=("apps/$site/dist/client")
          done
          pnpm turbo run build "${filters[@]}"
          node --experimental-strip-types .github/scripts/contact-placement.ts "${dists[@]}"
          node --experimental-strip-types .github/scripts/caddy-split.ts "${sites[@]}"

  infra:
    if: ${{ !inputs.skip_check }}
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
      - id: affected
        uses: ./.github/actions/affected
      - if: steps.affected.outputs.shop == 'true'
        run: sh infra/auto-service-shop/test/scripts.test.sh
      - if: steps.affected.outputs.shop == 'true'
        run: sh infra/auto-service-shop/test/caddy-tag.test.sh
      - if: steps.affected.outputs.shop == 'true'
        run: sh infra/auto-service-shop/test/compose.test.sh
      - if: steps.affected.outputs.shop == 'true'
        run: sh infra/auto-service-shop/test/sites.test.sh
      - if: steps.affected.outputs.shop == 'true' && runner.os == 'Linux'
        run: sh infra/auto-service-shop/test/logs.test.sh
      - if: steps.affected.outputs.shop == 'true'
        run: sh infra/auto-service-shop/test/crawler-role.test.sh
      - if: steps.affected.outputs.shop == 'true'
        run: sh infra/auto-service-shop/test/crm-role.test.sh
      - if: steps.affected.outputs.shop == 'true'
        run: sh infra/auto-service-shop/test/harden-ssh.test.sh
      - run: sh .github/scripts/migrations-frozen.test.sh
      - run: sh .github/scripts/check-base.test.sh
      - run: sh .github/scripts/shop-backend-up.test.sh
      - run: sh .github/scripts/shop-ci-env.test.sh
      - run: sh .github/scripts/upload-site.test.sh
      - run: >-
          node --experimental-strip-types --test
          .github/scripts/ci-gates.test.ts .github/scripts/shop-shards.test.ts .github/scripts/shop-affected.test.ts
          .github/scripts/russian-copy-hygiene.test.ts .github/scripts/shop-slow-issue.test.ts
          .github/scripts/site-env.test.ts .github/scripts/env-to-github.test.ts .github/scripts/caddy-split.test.ts
      - run: >-
          docker run --rm -v "$PWD:/repo" -w /repo --entrypoint shellcheck "$ACTIONLINT_IMAGE"
          .github/scripts/*.sh infra/auto-service-shop/*.sh infra/auto-service-shop/test/*.sh
      - run: docker run --rm -v "$PWD:/repo" -w /repo "$ACTIONLINT_IMAGE" -color

  shop:
    if: ${{ !inputs.skip_check }}
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: affected
        run: echo "shop=$(sh .github/scripts/shop-affected.sh)" >>"$GITHUB_OUTPUT"
      - if: steps.affected.outputs.shop == 'true'
        uses: ./.github/actions/setup-pnpm
      - if: steps.affected.outputs.shop == 'true'
        uses: ./.github/actions/setup-auto-service-shop-env
      - if: steps.affected.outputs.shop == 'true'
        env:
          SHOP_SHARDS: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: pnpm exec turbo run test --filter=@podbor/auto-service-shop
      - name: Clean up
        if: always() && steps.affected.outputs.shop == 'true'
        run: docker compose -f apps/auto-service-shop/docker-compose.test.yml down -v

  shop-drift:
    if: ${{ !inputs.skip_check }}
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: affected
        run: echo "shop=$(sh .github/scripts/shop-affected.sh)" >>"$GITHUB_OUTPUT"
      - if: steps.affected.outputs.shop == 'true'
        uses: ./.github/actions/setup-pnpm
      - if: steps.affected.outputs.shop == 'true'
        uses: ./.github/actions/setup-auto-service-shop-env
      - name: Shop migrations match the models
        if: steps.affected.outputs.shop == 'true'
        run: |
          pnpm exec turbo run build --filter='@podbor/auto-service-shop^...'
          docker compose -f apps/auto-service-shop/docker-compose.test.yml exec -T postgres sh -c "dropdb -U postgres --if-exists migration_drift && createdb -U postgres migration_drift"
          DATABASE_URL=postgres://postgres:postgres@127.0.0.1:${SHOP_TEST_DB_PORT:-55432}/migration_drift sh .github/scripts/shop-migration-drift.sh
      - name: Clean up
        if: always() && steps.affected.outputs.shop == 'true'
        run: docker compose -f apps/auto-service-shop/docker-compose.test.yml down -v

  shop-slow:
    if: github.event_name == 'push'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/setup-auto-service-shop-env
      - run: pnpm exec turbo run test:slow --filter=@podbor/auto-service-shop
      - name: Report the failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node --experimental-strip-types .github/scripts/shop-slow-issue.ts "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Clean up
        if: always()
        run: docker compose -f apps/auto-service-shop/docker-compose.test.yml down -v

  translate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm

      - name: Translate every app's content that changed
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          status=0
          for app in apps/*/; do
            for script in translate-cases translate-works translate-i18n; do
              [ -f "$app/scripts/$script.ts" ] || continue
              echo "::group::$app$script"
              (cd "$app" && node --experimental-strip-types "scripts/$script.ts") || status=1
              echo "::endgroup::"
            done
          done
          exit $status

      - name: Commit translations, if any
        id: commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          pnpm exec prettier --write apps/*/src/content
          git add apps/*/src/content
          if git diff --cached --quiet; then
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Auto-translate content"
          git pull --rebase
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify:
    needs: translate
    if: "!cancelled() && needs.translate.result == 'success'"
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.scope.outputs.changed || '[]' }}
      sites: ${{ steps.scope.outputs.sites || '[]' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.translate.outputs.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
      - id: retest
        env:
          TRANSLATED: ${{ needs.translate.outputs.sha }}
        run: |
          if [ "$TRANSLATED" = "$GITHUB_SHA" ]; then
            echo "Nothing was translated: the test jobs already tested $GITHUB_SHA."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.retest.outputs.needed == 'true'
        uses: ./.github/actions/setup-auto-service-shop-env
      - if: steps.retest.outputs.needed == 'true'
        run: pnpm exec turbo run test --filter="...[$GITHUB_SHA]"

      - id: scope
        if: github.ref == 'refs/heads/main'
        env:
          TURBO_TELEMETRY_DISABLED: '1'
          FORCE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail

          app_changed() {
            local app="$1" base="$2" verdict
            verdict=$(pnpm exec turbo run build --filter="...[$base]" --dry=json \
              | jq -r --arg p "@podbor/$app" \
                  'if (.packages | type) == "array"
                   then ((.packages | index($p)) != null) else "?" end')
            case "$verdict" in
              false) return 1 ;;
              true) return 0 ;;
              *) echo "::warning::could not diff $app against $base — deploying anyway" ;;
            esac
          }

          changed='[]'
          for path in apps/*/; do
            app=$(basename "$path")
            base=$(git rev-parse -q --verify "refs/tags/deployed/$app^{commit}" || true)
            if [ "$FORCE" = 'true' ]; then
              reason='forced from workflow_dispatch'
            elif [ -z "$base" ]; then
              reason='no deployed/ tag yet'
            elif ! git merge-base --is-ancestor "$base" HEAD; then
              reason="deployed/$app ($base) is not an ancestor of HEAD"
            elif sh .github/scripts/root-changed.sh "$base"; then
              reason='root build config changed'
            elif [ "$app" = auto-service-shop ] && ! git diff --quiet "$base" HEAD -- infra/auto-service-shop; then
              reason='infra/auto-service-shop changed'
            elif app_changed "$app" "$base"; then
              reason="changed since $base"
            else
              echo "- $app is current in production ($base)"
              continue
            fi
            echo "+ $app will deploy — $reason"
            changed=$(jq -cn --argjson c "$changed" --arg a "$app" '$c + [$a]')
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "sites=$(jq -c '.sites | keys' .github/scripts/site-env.json)" >> "$GITHUB_OUTPUT"

  shop-image:
    needs: [translate, verify]
    if: >-
      !cancelled() &&
      needs.verify.result == 'success' &&
      (github.ref != 'refs/heads/main' ||
       contains(fromJSON(needs.verify.outputs.changed), 'auto-service-shop'))
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    env:
      SHA: ${{ needs.translate.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.translate.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/isolate-runner

      - name: Build
        run: |
          docker buildx build --load --platform linux/amd64 \
            --file infra/auto-service-shop/Dockerfile \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$SHOP_IMAGE:$SHA" \
            .
          docker image inspect "$SHOP_IMAGE:$SHA" --format 'image size: {{.Size}} bytes'
          CADDY_TAG=$(sh infra/auto-service-shop/caddy-tag.sh)
          echo "CADDY_TAG=$CADDY_TAG" >>"$GITHUB_ENV"
          if docker manifest inspect "$CADDY_IMAGE:$CADDY_TAG" >/dev/null 2>&1; then
            echo "Caddy image $CADDY_TAG is already published, not building it."
          else
            docker buildx build --load --platform linux/amd64 \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --tag "$CADDY_IMAGE:$CADDY_TAG" \
              infra/auto-service-shop/caddy-image
          fi

      - name: Migrate a blank database and boot to healthy
        run: |
          docker compose -f apps/auto-service-shop/docker-compose.test.yml up -d --wait
          sh .github/scripts/shop-ci-env.sh >"$RUNNER_TEMP/shop.env"
          docker run --rm --network host --env-file "$RUNNER_TEMP/shop.env" "$SHOP_IMAGE:$SHA" \
            node_modules/.bin/medusa db:migrate --execute-safe-links --all-or-nothing
          docker rm -f "${COMPOSE_PROJECT_NAME:-podbor}-shop" >/dev/null 2>&1 || true
          docker run -d --name "${COMPOSE_PROJECT_NAME:-podbor}-shop" --network host --env-file "$RUNNER_TEMP/shop.env" "$SHOP_IMAGE:$SHA"
          for _ in $(seq 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "${COMPOSE_PROJECT_NAME:-podbor}-shop")
            case "$status" in
              healthy | unhealthy) break ;;
            esac
            [ "$(docker inspect --format '{{.State.Running}}' "${COMPOSE_PROJECT_NAME:-podbor}-shop")" = true ] || break
            sleep 3
          done
          docker logs "${COMPOSE_PROJECT_NAME:-podbor}-shop" 2>&1 | tail -40
          [ "$status" = healthy ]

      - name: Migrate a blank CRM database with the image's Prisma CLI
        run: |
          docker compose -f apps/auto-service-shop/docker-compose.test.yml exec -T postgres \
            sh -c "dropdb -U postgres --if-exists crm_check && createdb -U postgres crm_check"
          docker run --rm --network host -e CHECKPOINT_DISABLE=1 \
            -e CRM_DATABASE_URL="postgres://postgres:postgres@127.0.0.1:${SHOP_TEST_DB_PORT:-55432}/crm_check" \
            -w /server/node_modules/@podbor/lead-crm "$SHOP_IMAGE:$SHA" node_modules/.bin/prisma migrate deploy

      - name: Push
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VPS_HOST: ${{ secrets.AUTO_SERVICE_SHOP_VPS_HOST }}
          VPS_USER: ${{ secrets.AUTO_SERVICE_SHOP_VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.AUTO_SERVICE_SHOP_VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.AUTO_SERVICE_SHOP_VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ] || [ -z "$VPS_KNOWN_HOSTS" ]; then
            echo "AUTO_SERVICE_SHOP_VPS_* secrets are not set, nothing will deploy the image, so it is not pushed."
            exit 0
          fi
          DOCKER_HOST=$(docker context inspect --format '{{.Endpoints.docker.Host}}')
          export DOCKER_HOST
          export DOCKER_CONFIG="$RUNNER_TEMP/docker"
          mkdir -p "$DOCKER_CONFIG"
          auth=$(printf '%s:%s' "$GITHUB_ACTOR" "$GH_TOKEN" | base64 | tr -d '\n')
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "$auth" >"$DOCKER_CONFIG/config.json"
          docker push "$SHOP_IMAGE:$SHA"
          if docker image inspect "$CADDY_IMAGE:$CADDY_TAG" >/dev/null 2>&1; then
            docker push "$CADDY_IMAGE:$CADDY_TAG"
          fi

      - name: Clean up
        if: always()
        run: |
          docker rm -f "${COMPOSE_PROJECT_NAME:-podbor}-shop" >/dev/null 2>&1 || true
          docker compose -f apps/auto-service-shop/docker-compose.test.yml down -v

  deploy-shop:
    needs: [static, shop, shop-drift, infra, translate, verify, shop-image]
    if: >-
      !cancelled() &&
      (inputs.skip_check || (needs.static.result == 'success' && needs.shop.result == 'success' &&
       needs.shop-drift.result == 'success' && needs.infra.result == 'success')) &&
      needs.shop-image.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      contains(fromJSON(needs.verify.outputs.changed), 'auto-service-shop')
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    environment: production
    permissions:
      contents: read
      packages: read
    outputs:
      deployed: ${{ steps.result.outputs.deployed }}
    env:
      SHA: ${{ needs.translate.outputs.sha }}
      VPS_HOST: ${{ secrets.AUTO_SERVICE_SHOP_VPS_HOST }}
      VPS_USER: ${{ secrets.AUTO_SERVICE_SHOP_VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.AUTO_SERVICE_SHOP_VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.AUTO_SERVICE_SHOP_VPS_KNOWN_HOSTS }}
    steps:
      - id: guard
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ] || [ -z "$VPS_KNOWN_HOSTS" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "AUTO_SERVICE_SHOP_VPS_* secrets are not set, skipping the shop deploy."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.deploy == 'true'
        with:
          ref: ${{ needs.translate.outputs.sha }}
          persist-credentials: false
      - name: SSH identity
        if: steps.guard.outputs.deploy == 'true'
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" >~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" >~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          echo "TARGET=$VPS_USER@$VPS_HOST" >>"$GITHUB_ENV"
          echo "SSH=ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPath=$RUNNER_TEMP/cm -o ControlPersist=300" >>"$GITHUB_ENV"
      - name: Ship the stack files
        if: steps.guard.outputs.deploy == 'true'
        run: |
          sh infra/auto-service-shop/caddy-tag.sh >infra/auto-service-shop/caddy-tag
          tar -C infra/auto-service-shop -cf - caddy-tag docker-compose.yml caddy/Caddyfile deploy.sh backup.sh restore.sh crawler-role.sh crm-role.sh move-static-to-s3.sh \
            logs-export.sh loki/config.yaml alloy/config.alloy grafana deploy-site.sh reminders.sh caddy/security-headers.caddy \
            | $SSH "$TARGET" 'tar -C /srv/carlab -xf -'
      - name: Deploy
        if: steps.guard.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | $SSH "$TARGET" \
            "docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin"
          $SSH "$TARGET" "/srv/carlab/deploy.sh $SHA"
      - name: Log the host out of GHCR
        if: always() && steps.guard.outputs.deploy == 'true'
        run: |
          $SSH "$TARGET" 'docker logout ghcr.io' || true
          $SSH -O exit "$TARGET" 2>/dev/null || true
      - id: result
        if: steps.guard.outputs.deploy == 'true'
        run: echo "deployed=true" >> "$GITHUB_OUTPUT"

  record-shop:
    needs: [translate, deploy-shop]
    if: "!cancelled() && needs.deploy-shop.outputs.deployed == 'true'"
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write
    steps:
      - name: Record what is live
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.translate.outputs.sha }}
          APP: auto-service-shop
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/deployed/$APP" \
              -f sha="$SHA" -F force=true \
            || gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/deployed/$APP" -f sha="$SHA"

  deploy-site:
    needs: [static, sites, translate, verify, shop-image, deploy-shop]
    if: >-
      !cancelled() &&
      (inputs.skip_check || (needs.static.result == 'success' && needs.sites.result == 'success')) &&
      needs.verify.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      needs.verify.outputs.changed != '[]'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    environment: site-${{ matrix.app }}
    permissions:
      contents: write
    concurrency:
      group: deploy-site-${{ matrix.app }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.verify.outputs.sites) }}
    env:
      APP: ${{ matrix.app }}
      SHA: ${{ needs.translate.outputs.sha }}
    steps:
      - id: guard
        env:
          CHANGED: ${{ needs.verify.outputs.changed }}
          SHOP: ${{ needs.deploy-shop.result }}
          SHOP_IMAGE_RESULT: ${{ needs.shop-image.result }}
        run: |
          if [ "$SHOP" = failure ] || [ "$SHOP_IMAGE_RESULT" = failure ] \
             || { [ "$SHOP" != success ] && jq -e 'index("auto-service-shop")' <<<"$CHANGED" >/dev/null 2>&1; }; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The shop image or deploy failed or did not run, so the CRM migrations it carries may not have run: $APP is not deployed; deployed/$APP stays put."
          elif ! jq -e 'type == "array"' <<<"$CHANGED" >/dev/null; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "::warning::unreadable changed list, deploying $APP anyway"
          elif ! jq -e --arg a "$APP" 'index($a)' <<<"$CHANGED" >/dev/null; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "$APP is current in production, skipping."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.deploy == 'true'
        with:
          ref: ${{ needs.translate.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        if: steps.guard.outputs.deploy == 'true'
      - uses: actions/cache@v4
        if: steps.guard.outputs.deploy == 'true' && matrix.app == 'auto-service'
        with:
          path: apps/auto-service/node_modules/.astro
          key: astro-carlab-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: astro-carlab-${{ github.ref_name }}-
      - id: deploy
        if: steps.guard.outputs.deploy == 'true'
        env:
          SITE_SECRETS: >-
            {"CRON_SECRET": ${{ toJSON(secrets.CRON_SECRET || '') }},
            "GOOGLE_PLACES_API_KEY": ${{ toJSON(secrets.GOOGLE_PLACES_API_KEY || '') }},
            "KEYSTATIC_GITHUB_CLIENT_ID": ${{ toJSON(secrets.KEYSTATIC_GITHUB_CLIENT_ID || '') }},
            "KEYSTATIC_GITHUB_CLIENT_SECRET": ${{ toJSON(secrets.KEYSTATIC_GITHUB_CLIENT_SECRET || '') }},
            "KEYSTATIC_SECRET": ${{ toJSON(secrets.KEYSTATIC_SECRET || '') }},
            "MEDUSA_PUBLISHABLE_KEY": ${{ toJSON(secrets.MEDUSA_PUBLISHABLE_KEY || '') }},
            "META_CAPI_TEST_CODE": ${{ toJSON(secrets.META_CAPI_TEST_CODE || '') }},
            "META_CAPI_TOKEN": ${{ toJSON(secrets.META_CAPI_TOKEN || '') }},
            "SHOP_CLIENT_SECRET": ${{ toJSON(secrets.SHOP_CLIENT_SECRET || '') }},
            "SHOP_EVENTS_SECRET": ${{ toJSON(secrets.SHOP_EVENTS_SECRET || '') }},
            "SHOP_LEAD_SECRET": ${{ toJSON(secrets.SHOP_LEAD_SECRET || '') }},
            "SHOP_LEAD_SECRET_PREVIOUS": ${{ toJSON(secrets.SHOP_LEAD_SECRET_PREVIOUS || '') }},
            "SHOP_ORDER_OUTCOME_SECRET": ${{ toJSON(secrets.SHOP_ORDER_OUTCOME_SECRET || '') }},
            "SHOP_PREVIEW_TOKEN": ${{ toJSON(secrets.SHOP_PREVIEW_TOKEN || '') }},
            "SHOP_VISITOR_SEARCHES_SECRET": ${{ toJSON(secrets.SHOP_VISITOR_SEARCHES_SECRET || '') }},
            "TELEGRAM_ADMIN_ID": ${{ toJSON(secrets.TELEGRAM_ADMIN_ID || '') }},
            "TELEGRAM_BOT_TOKEN": ${{ toJSON(secrets.TELEGRAM_BOT_TOKEN || '') }},
            "TELEGRAM_CAPTURE_BOT_TOKEN": ${{ toJSON(secrets.TELEGRAM_CAPTURE_BOT_TOKEN || '') }},
            "TELEGRAM_CAPTURE_BOT_TOKEN_APPROVED": ${{ toJSON(secrets.TELEGRAM_CAPTURE_BOT_TOKEN_APPROVED || '') }},
            "TELEGRAM_CAPTURE_BOT_TOKEN_DETAILS": ${{ toJSON(secrets.TELEGRAM_CAPTURE_BOT_TOKEN_DETAILS || '') }},
            "TELEGRAM_CAPTURE_WEBHOOK_SECRET": ${{ toJSON(secrets.TELEGRAM_CAPTURE_WEBHOOK_SECRET || '') }},
            "TELEGRAM_GROUP_ID": ${{ toJSON(secrets.TELEGRAM_GROUP_ID || '') }},
            "TELEGRAM_OWNER_ID": ${{ toJSON(secrets.TELEGRAM_OWNER_ID || '') }},
            "TELEGRAM_WEBHOOK_SECRET": ${{ toJSON(secrets.TELEGRAM_WEBHOOK_SECRET || '') }}}
          SITE_VARS: ${{ toJSON(vars) }}
          VPS_HOST: ${{ secrets.AUTO_SERVICE_SHOP_VPS_HOST }}
          VPS_USER: ${{ secrets.AUTO_SERVICE_SHOP_VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.AUTO_SERVICE_SHOP_VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.AUTO_SERVICE_SHOP_VPS_KNOWN_HOSTS }}
        run: |
          status=0
          sh .github/scripts/upload-site.sh "$APP" "$SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" || status=$?
          if [ "$status" -eq 75 ]; then
            echo "::warning::The shop backend does not answer /health, so auto-service is not deployed; deployed/auto-service stays put and the next run retries. The live site keeps serving."
            exit 0
          fi
          [ "$status" -ne 0 ] || echo "live=true" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Record what is live
        if: steps.deploy.outputs.live == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/deployed/$APP" \
              -f sha="$SHA" -F force=true \
            || gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/deployed/$APP" -f sha="$SHA"
