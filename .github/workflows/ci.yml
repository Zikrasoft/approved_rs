name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      force:
        description: Deploy every app, whatever the tags say
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm lint
      - run: pnpm exec prettier --check .
      - run: node --experimental-strip-types .github/scripts/yaml-content-valid.ts
      - uses: ./.github/actions/setup-carlab-shop-env
      - run: pnpm typecheck
      - run: pnpm test
      - run: sh .github/scripts/pinned-deps.sh
      - run: sh .github/scripts/redirects-drift.sh

      # The two sites that prerender without a backend, so the markup contracts
      # site-kit owns are checked against real HTML rather than a grep.
      - env:
          PUBLIC_PHONE_NUMBER: '381000000000'
          PUBLIC_WHATSAPP_NUMBER: '381000000000'
          PUBLIC_VIBER_NUMBER: '381000000000'
          PUBLIC_THREADS_CHANNEL: check
        run: >-
          pnpm turbo run build
          --filter=@podbor/approved-rs --filter=@podbor/detailing
      - run: >-
          node --experimental-strip-types .github/scripts/contact-placement.ts
          apps/approved-rs/dist/client apps/detailing/dist/client

      - run: >-
          docker run --rm -v "$PWD:/repo" -w /repo --entrypoint shellcheck "$ACTIONLINT_IMAGE"
          .github/scripts/*.sh
      - run: docker run --rm -v "$PWD:/repo" -w /repo "$ACTIONLINT_IMAGE" -color

  translate:
    needs: check
    if: >-
      needs.check.result == 'success' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm

      - name: Translate every app's content that changed
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          status=0
          for app in apps/*/; do
            for script in translate-cases translate-works translate-i18n; do
              [ -f "$app/scripts/$script.ts" ] || continue
              echo "::group::$app$script"
              (cd "$app" && node --experimental-strip-types "scripts/$script.ts") || status=1
              echo "::endgroup::"
            done
          done
          exit $status

      - name: Commit translations, if any
        id: commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          pnpm exec prettier --write apps/*/src/content
          git add apps/*/src/content
          if git diff --cached --quiet; then
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Auto-translate content"
          git pull --rebase
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify:
    needs: translate
    if: needs.translate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.scope.outputs.changed || '[]' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.translate.outputs.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/setup-carlab-shop-env
      - run: pnpm test

      - id: scope
        if: github.ref == 'refs/heads/main'
        env:
          TURBO_TELEMETRY_DISABLED: '1'
          FORCE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail

          app_changed() {
            local app="$1" base="$2" verdict
            verdict=$(pnpm exec turbo run build --filter="...[$base]" --dry=json \
              | jq -r --arg p "@podbor/$app" \
                  'if (.packages | type) == "array"
                   then ((.packages | index($p)) != null) else "?" end')
            case "$verdict" in
              false) return 1 ;;
              true) return 0 ;;
              *) echo "::warning::could not diff $app against $base — deploying anyway" ;;
            esac
          }

          changed='[]'
          for path in apps/*/; do
            app=$(basename "$path")
            base=$(git rev-parse -q --verify "refs/tags/deployed/$app^{commit}" || true)
            if [ "$FORCE" = 'true' ]; then
              reason='forced from workflow_dispatch'
            elif [ -z "$base" ]; then
              reason='no deployed/ tag yet'
            elif ! git merge-base --is-ancestor "$base" HEAD; then
              reason="deployed/$app ($base) is not an ancestor of HEAD"
            elif ! git diff --quiet "$base" HEAD -- \
                 pnpm-lock.yaml pnpm-workspace.yaml turbo.json package.json \
                 .npmrc .node-version .pnpmfile.cjs \
                 .github/actions/setup-pnpm/action.yml; then
              reason='root build config changed'
            elif app_changed "$app" "$base"; then
              reason="changed since $base"
            else
              echo "- $app is current in production ($base)"
              continue
            fi
            echo "+ $app will deploy — $reason"
            changed=$(jq -cn --argjson c "$changed" --arg a "$app" '$c + [$a]')
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [translate, verify]
    if: >-
      !cancelled() &&
      needs.verify.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      contains(fromJSON(needs.verify.outputs.changed), 'approved-rs')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    defaults:
      run:
        working-directory: apps/approved-rs
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.translate.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm exec vercel pull --yes --environment=production
      - run: pnpm exec vercel build --prod
      - run: pnpm exec vercel deploy --prebuilt --prod --archive=tgz
      - name: Record what is live
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.translate.outputs.sha }}
          APP: approved-rs
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/deployed/$APP" \
              -f sha="$SHA" -F force=true \
            || gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/deployed/$APP" -f sha="$SHA"

  deploy-brand-site:
    needs: [translate, verify]
    if: >-
      !cancelled() &&
      needs.verify.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      needs.verify.outputs.changed != '[]'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - app: detailing
            project_secret: VERCEL_PROJECT_ID_DETAILING
          - app: auto-service
            project_secret: VERCEL_PROJECT_ID_AUTO_SERVICE
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets[matrix.project_secret] }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - id: guard
        working-directory: .
        env:
          CHANGED: ${{ needs.verify.outputs.changed }}
          APP: ${{ matrix.app }}
        run: |
          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.project_secret }} is not set — skipping the $APP deploy."
          elif ! jq -e 'type == "array"' <<<"$CHANGED" >/dev/null; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "::warning::unreadable changed list — deploying $APP anyway"
          elif ! jq -e --arg a "$APP" 'index($a)' <<<"$CHANGED" >/dev/null; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "$APP is current in production — skipping."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.deploy == 'true'
        with:
          ref: ${{ needs.translate.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        if: steps.guard.outputs.deploy == 'true'
      - run: pnpm exec vercel pull --yes --environment=production
        if: steps.guard.outputs.deploy == 'true'
      - run: pnpm exec vercel build --prod
        if: steps.guard.outputs.deploy == 'true'
      - run: pnpm exec vercel deploy --prebuilt --prod --archive=tgz
        if: steps.guard.outputs.deploy == 'true'
      - name: Record what is live
        if: steps.guard.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.translate.outputs.sha }}
          APP: ${{ matrix.app }}
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/deployed/$APP" \
              -f sha="$SHA" -F force=true \
            || gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/deployed/$APP" -f sha="$SHA"
