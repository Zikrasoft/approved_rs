name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      force:
        description: Deploy every app, whatever the tags say
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  MEDUSA_IMAGE: ghcr.io/zikrasoft/podbor-medusa
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm lint
      - run: pnpm exec prettier --check .
      - run: pnpm typecheck
      - run: pnpm test
      - run: sh .github/scripts/catalog-stale.test.sh
      - run: sh infra/medusa/test/scripts.test.sh
      - run: sh infra/medusa/test/compose.test.sh
      - run: >-
          docker run --rm -v "$PWD:/repo" -w /repo --entrypoint shellcheck "$ACTIONLINT_IMAGE"
          .github/scripts/*.sh infra/medusa/*.sh infra/medusa/test/*.sh
      - run: docker run --rm -v "$PWD:/repo" -w /repo "$ACTIONLINT_IMAGE" -color

  medusa-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medusa
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s
          --health-timeout 5s --health-retries 30
      redis:
        image: redis:7.4.9-alpine
        ports: ['56379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s
          --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm turbo run build --filter=@podbor/medusa^...
      - run: pnpm --filter @podbor/medusa test:integration:http

  translate:
    needs: check
    if: >-
      needs.check.result == 'success' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm

      - name: Translate every app's content that changed
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          status=0
          for app in apps/*/; do
            for script in translate-cases translate-works translate-i18n; do
              [ -f "$app/scripts/$script.ts" ] || continue
              echo "::group::$app$script"
              (cd "$app" && node --experimental-strip-types "scripts/$script.ts") || status=1
              echo "::endgroup::"
            done
          done
          exit $status

      - name: Commit translations, if any
        id: commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          pnpm exec prettier --write apps/*/src/content
          git add apps/*/src/content
          if git diff --cached --quiet; then
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Auto-translate content"
          git pull --rebase
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify:
    needs: translate
    if: needs.translate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.scope.outputs.changed || '[]' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.translate.outputs.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm test

      - id: scope
        if: github.ref == 'refs/heads/main'
        env:
          TURBO_TELEMETRY_DISABLED: '1'
          FORCE: ${{ inputs.force || false }}
          MEDUSA_URL: ${{ vars.MEDUSA_URL }}
          MEDUSA_PUBLISHABLE_KEY: ${{ secrets.MEDUSA_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          app_changed() {
            local app="$1" base="$2" verdict
            verdict=$(pnpm exec turbo run build --filter="...[$base]" --dry=json \
              | jq -r --arg p "@podbor/$app" \
                  'if (.packages | type) == "array"
                   then ((.packages | index($p)) != null) else "?" end')
            case "$verdict" in
              false) return 1 ;;
              true) return 0 ;;
              *) echo "::warning::could not diff $app against $base — deploying anyway" ;;
            esac
          }

          changed='[]'
          for path in apps/*/; do
            app=$(basename "$path")
            catalog=''
            base=$(git rev-parse -q --verify "refs/tags/deployed/$app^{commit}" || true)
            if [ "$FORCE" = 'true' ]; then
              reason='forced from workflow_dispatch'
            elif [ -z "$base" ]; then
              reason='no deployed/ tag yet'
            elif ! git merge-base --is-ancestor "$base" HEAD; then
              reason="deployed/$app ($base) is not an ancestor of HEAD"
            elif ! git diff --quiet "$base" HEAD -- \
                 pnpm-lock.yaml pnpm-workspace.yaml turbo.json package.json \
                 .npmrc .node-version .pnpmfile.cjs \
                 .github/actions/setup-pnpm/action.yml; then
              reason='root build config changed'
            elif [ "$app" = medusa ] && ! git diff --quiet "$base" HEAD -- infra/medusa; then
              reason='infra/medusa changed'
            elif app_changed "$app" "$base"; then
              reason="changed since $base"
            elif [ "$app" = auto-service ] && ! catalog=$(.github/scripts/catalog-stale.sh); then
              reason="catalog: $catalog"
            else
              echo "- $app is current in production ($base)${catalog:+ — $catalog}"
              continue
            fi
            echo "+ $app will deploy — $reason"
            changed=$(jq -cn --argjson c "$changed" --arg a "$app" '$c + [$a]')
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  medusa-image:
    needs: [translate, verify, medusa-integration]
    if: >-
      needs.verify.result == 'success' &&
      needs.medusa-integration.result == 'success' &&
      (github.ref != 'refs/heads/main' ||
       contains(fromJSON(needs.verify.outputs.changed), 'medusa'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medusa
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s
          --health-timeout 5s --health-retries 30
      redis:
        image: redis:7.4.9-alpine
        ports: ['56379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s
          --health-timeout 5s --health-retries 30
    env:
      SHA: ${{ needs.translate.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.translate.outputs.sha }}
          persist-credentials: false

      - name: Build
        run: |
          docker buildx build --load \
            --file infra/medusa/Dockerfile \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$MEDUSA_IMAGE:$SHA" \
            .
          docker image inspect "$MEDUSA_IMAGE:$SHA" --format 'image size: {{.Size}} bytes'

      - name: Migrate a blank database and boot to healthy
        run: |
          {
            echo "DATABASE_URL=postgres://postgres:postgres@127.0.0.1:55432/medusa"
            echo "REDIS_URL=redis://127.0.0.1:56379"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "COOKIE_SECRET=$(openssl rand -hex 32)"
            echo "MEDUSA_BACKEND_URL=https://api.carlab.test"
          } >"$RUNNER_TEMP/medusa.env"
          docker run --rm --network host --env-file "$RUNNER_TEMP/medusa.env" "$MEDUSA_IMAGE:$SHA" \
            node_modules/.bin/medusa db:migrate --execute-safe-links --all-or-nothing
          docker run -d --name medusa --network host --env-file "$RUNNER_TEMP/medusa.env" "$MEDUSA_IMAGE:$SHA"
          for _ in $(seq 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' medusa)
            [ "$status" = healthy ] && break
            sleep 3
          done
          docker logs medusa 2>&1 | tail -40
          [ "$status" = healthy ]

      - name: Push
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VPS_HOST: ${{ secrets.MEDUSA_VPS_HOST }}
        run: |
          if [ -z "$VPS_HOST" ]; then
            echo "MEDUSA_VPS_HOST is not set — nothing will deploy the image, so it is not pushed."
            exit 0
          fi
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$MEDUSA_IMAGE:$SHA"

  deploy-medusa:
    needs: [translate, verify, medusa-image]
    if: >-
      needs.medusa-image.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      contains(fromJSON(needs.verify.outputs.changed), 'medusa')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      packages: read
    env:
      SHA: ${{ needs.translate.outputs.sha }}
      VPS_HOST: ${{ secrets.MEDUSA_VPS_HOST }}
      VPS_USER: ${{ secrets.MEDUSA_VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.MEDUSA_VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.MEDUSA_VPS_KNOWN_HOSTS }}
    steps:
      - id: guard
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ] || [ -z "$VPS_KNOWN_HOSTS" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "MEDUSA_VPS_* secrets are not set — skipping the medusa deploy."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.deploy == 'true'
        with:
          ref: ${{ needs.translate.outputs.sha }}
          persist-credentials: false
      - name: SSH identity
        if: steps.guard.outputs.deploy == 'true'
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" >~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" >~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          echo "TARGET=$VPS_USER@$VPS_HOST" >>"$GITHUB_ENV"
      - name: Ship the stack files
        if: steps.guard.outputs.deploy == 'true'
        run: |
          tar -C infra/medusa -cf - docker-compose.yml caddy/Caddyfile deploy.sh backup.sh restore.sh \
            | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$TARGET" 'tar -C /srv/carlab -xf -'
      - name: Deploy
        if: steps.guard.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$TARGET" \
            "docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$TARGET" "/srv/carlab/deploy.sh $SHA"
      - name: Log the host out of GHCR
        if: always() && steps.guard.outputs.deploy == 'true'
        run: ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$TARGET" 'docker logout ghcr.io' || true
      - name: Record what is live
        if: steps.guard.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APP: medusa
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/deployed/$APP" \
              -f sha="$SHA" -F force=true \
            || gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/deployed/$APP" -f sha="$SHA"

  deploy:
    needs: [translate, verify]
    if: >-
      needs.verify.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      contains(fromJSON(needs.verify.outputs.changed), 'approved-rs')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    defaults:
      run:
        working-directory: apps/approved-rs
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.translate.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm exec vercel pull --yes --environment=production
      - run: pnpm exec vercel build --prod
      - run: pnpm exec vercel deploy --prebuilt --prod --archive=tgz
      - name: Record what is live
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.translate.outputs.sha }}
          APP: approved-rs
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/deployed/$APP" \
              -f sha="$SHA" -F force=true \
            || gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/deployed/$APP" -f sha="$SHA"

  deploy-brand-site:
    needs: [translate, verify, deploy-medusa]
    if: >-
      !cancelled() &&
      needs.verify.result == 'success' &&
      needs.deploy-medusa.result != 'failure' &&
      github.ref == 'refs/heads/main' &&
      needs.verify.outputs.changed != '[]'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - app: detailing
            project_secret: VERCEL_PROJECT_ID_DETAILING
          - app: auto-service
            project_secret: VERCEL_PROJECT_ID_AUTO_SERVICE
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets[matrix.project_secret] }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - id: guard
        working-directory: .
        env:
          CHANGED: ${{ needs.verify.outputs.changed }}
          APP: ${{ matrix.app }}
        run: |
          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.project_secret }} is not set — skipping the $APP deploy."
          elif ! jq -e 'type == "array"' <<<"$CHANGED" >/dev/null; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "::warning::unreadable changed list — deploying $APP anyway"
          elif ! jq -e --arg a "$APP" 'index($a)' <<<"$CHANGED" >/dev/null; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "$APP is current in production — skipping."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.deploy == 'true'
        with:
          ref: ${{ needs.translate.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        if: steps.guard.outputs.deploy == 'true'
      - run: pnpm exec vercel pull --yes --environment=production
        if: steps.guard.outputs.deploy == 'true'
      - run: pnpm exec vercel build --prod
        if: steps.guard.outputs.deploy == 'true'
      - run: pnpm exec vercel deploy --prebuilt --prod --archive=tgz
        if: steps.guard.outputs.deploy == 'true'
      - name: Record what is live
        if: steps.guard.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.translate.outputs.sha }}
          APP: ${{ matrix.app }}
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/deployed/$APP" \
              -f sha="$SHA" -F force=true \
            || gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/deployed/$APP" -f sha="$SHA"
