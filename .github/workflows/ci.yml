name: CI

on:
  push:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm lint
      - run: pnpm exec prettier --check .
      - run: pnpm typecheck
      - run: pnpm test

  translate:
    needs: check
    if: >-
      needs.check.result == 'success' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm

      - name: Translate every app's content that changed
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          status=0
          for app in apps/*/; do
            for script in translate-cases translate-works translate-i18n; do
              [ -f "$app/scripts/$script.ts" ] || continue
              echo "::group::$app$script"
              (cd "$app" && node --experimental-strip-types "scripts/$script.ts") || status=1
              echo "::endgroup::"
            done
          done
          exit $status

      - name: Commit translations, if any
        id: commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/*/src/content
          if git diff --cached --quiet; then
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Auto-translate content"
          git pull --rebase && git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: translate
    if: needs.translate.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    defaults:
      run:
        working-directory: apps/approved-rs
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.translate.outputs.sha }}
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm exec vercel pull --yes --environment=production
      - run: pnpm exec vercel build --prod
      - run: pnpm exec vercel deploy --prebuilt --prod --archive=tgz

  deploy-brand-site:
    needs: translate
    if: needs.translate.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - app: detailing
            project_secret: VERCEL_PROJECT_ID_DETAILING
          - app: auto-service
            project_secret: VERCEL_PROJECT_ID_AUTO_SERVICE
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets[matrix.project_secret] }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - id: guard
        working-directory: .
        run: |
          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.project_secret }} is not set — skipping the ${{ matrix.app }} deploy."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.configured == 'true'
        with:
          ref: ${{ needs.translate.outputs.sha }}
      - uses: ./.github/actions/setup-pnpm
        if: steps.guard.outputs.configured == 'true'
      - run: pnpm exec vercel pull --yes --environment=production
        if: steps.guard.outputs.configured == 'true'
      - run: pnpm exec vercel build --prod
        if: steps.guard.outputs.configured == 'true'
      - run: pnpm exec vercel deploy --prebuilt --prod --archive=tgz
        if: steps.guard.outputs.configured == 'true'
