name: carlab

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:
  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 512m
    security_opt: ['no-new-privileges:true']
    networks: [data]
    environment:
      POSTGRES_USER: carlab
      POSTGRES_DB: carlab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'carlab', '-d', 'carlab']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7.4.9-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m
    security_opt: ['no-new-privileges:true']
    networks: [data]
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  medusa:
    image: ${MEDUSA_IMAGE:-ghcr.io/zikrasoft/podbor-medusa}:${MEDUSA_TAG:?}
    restart: unless-stopped
    logging: *logging
    mem_limit: 1536m
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [data, edge]
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://carlab:${POSTGRES_PASSWORD:?}@postgres:5432/carlab
      REDIS_URL: redis://redis:6379
      NODE_OPTIONS: --max-old-space-size=1024
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
    volumes:
      - static:/server/static

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 128m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ['no-new-privileges:true']
    networks: [edge]
    environment:
      API_HOST: ${API_HOST:-api.carlab.rs}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    depends_on:
      medusa:
        condition: service_started
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddydata:/data
      - caddyconfig:/config
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-q',
          '-O',
          '/dev/null',
          'http://127.0.0.1:2019/config/',
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

networks:
  data:
    internal: true
  edge:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:ca7:1ab::/64

volumes:
  pgdata:
  redisdata:
  static:
  caddydata:
  caddyconfig:
