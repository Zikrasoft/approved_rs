<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#fbfbfc"/>
      <stop offset="1" stop-color="#e4e7ec"/>
    </radialGradient>
    <linearGradient id="media" x1="0" x2="1">
      <stop offset="0" stop-color="#f3ead2"/>
      <stop offset="1" stop-color="#d8c9a0"/>
    </linearGradient>
    <pattern id="pleats" width="28" height="10" patternUnits="userSpaceOnUse">
      <rect width="28" height="10" fill="url(#media)"/>
      <path d="M0 0 v10" stroke="#b9a676" stroke-width="3"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <path d="M150 560 l120 -260 h440 l-120 260 z" fill="#1d2430" opacity=".22" filter="url(#soft)"/>
  <path d="M120 520 l120 -260 h440 l-120 260 z" fill="#2f343b"/>
  <path d="M160 500 l100 -220 h380 l-100 220 z" fill="url(#pleats)"/>
  <path d="M120 520 h440 v30 h-440 z" fill="#1d2127"/>
  <path d="M560 520 l120 -260 v30 l-120 260 z" fill="#15181c"/>
  <text x="400" y="680" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="44" fill="#3c4450">{{brand}}</text>
  <text x="400" y="722" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#6b7480">{{label}}</text>
</svg>
