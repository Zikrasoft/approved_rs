name: carlab-demo
services:
  postgres:
    image: postgres:16.15-alpine
    container_name: carlab-demo-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medusa
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:55444:5432'
    healthcheck:
      test: ['CMD', 'pg_isready', '-h', 'localhost', '-U', 'postgres']
      interval: 2s
      timeout: 5s
      retries: 30
  typesense:
    image: typesense/typesense:30.2
    container_name: carlab-demo-ts
    environment:
      TYPESENSE_API_KEY: xyz
      TYPESENSE_DATA_DIR: /data
    volumes:
      - typesense-data:/data
    ports:
      - '127.0.0.1:58444:8108'
    healthcheck:
      test:
        [
          'CMD',
          'bash',
          '-c',
          'exec 3<>/dev/tcp/localhost/8108 && printf "GET /health HTTP/1.0\r\n\r\n" >&3 && grep -q "\"ok\":true" <&3',
        ]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  postgres-data:
  typesense-data:
