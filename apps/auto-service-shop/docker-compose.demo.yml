name: carlab-demo
services:
  postgres:
    image: postgres:16.15-alpine
    container_name: carlab-demo-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medusa
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:55444:5432'
    healthcheck:
      test: ['CMD', 'pg_isready', '-h', 'localhost', '-U', 'postgres']
      interval: 2s
      timeout: 5s
      retries: 30
  typesense:
    image: typesense/typesense:30.2
    container_name: carlab-demo-ts
    environment:
      TYPESENSE_API_KEY: xyz
      TYPESENSE_DATA_DIR: /data
    volumes:
      - typesense-data:/data
    ports:
      - '127.0.0.1:58444:8108'
    healthcheck:
      test:
        [
          'CMD',
          'bash',
          '-c',
          'exec 3<>/dev/tcp/localhost/8108 && printf "GET /health HTTP/1.0\r\n\r\n" >&3 && grep -q "\"ok\":true" <&3',
        ]
      interval: 2s
      timeout: 5s
      retries: 30
  s3:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: carlab-demo-s3
    command: ['server', '/data']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-carlab-demo}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-carlab-demo-secret}
      MC_HOST_local: http://${S3_ACCESS_KEY_ID:-carlab-demo}:${S3_SECRET_ACCESS_KEY:-carlab-demo-secret}@localhost:9000
    volumes:
      - s3-data:/data
    ports:
      - '127.0.0.1:59444:9000'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mc mb --ignore-existing local/${S3_PUBLIC_BUCKET:-carlab-public} local/${S3_PRIVATE_BUCKET:-carlab-private} && mc anonymous set download local/${S3_PUBLIC_BUCKET:-carlab-public}',
        ]
      interval: 5s
      timeout: 10s
      retries: 30
volumes:
  postgres-data:
  typesense-data:
  s3-data:
