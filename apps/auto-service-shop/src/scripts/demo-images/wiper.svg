<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#fbfbfc"/>
      <stop offset="1" stop-color="#e4e7ec"/>
    </radialGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c525b"/>
      <stop offset="1" stop-color="#1c1f24"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <ellipse cx="400" cy="520" rx="330" ry="22" fill="#1d2430" opacity=".25" filter="url(#soft)"/>
  <path d="M90 470 q310 -150 620 -150 l6 26 q-306 0 -616 150 z" fill="url(#blade)"/>
  <path d="M98 492 q308 -148 614 -148" fill="none" stroke="#0f1114" stroke-width="6"/>
  <rect x="360" y="352" width="110" height="40" rx="10" transform="rotate(-14 415 372)" fill="#2b2f36"/>
  <path d="M120 450 q290 -136 570 -140" fill="none" stroke="#ffffff" stroke-width="4" opacity=".2"/>
  <text x="400" y="640" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="44" fill="#3c4450">{{brand}}</text>
  <text x="400" y="682" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#6b7480">{{label}}</text>
</svg>
