<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#fbfbfc"/>
      <stop offset="1" stop-color="#e4e7ec"/>
    </radialGradient>
    <radialGradient id="steel" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#e9ecf0"/>
      <stop offset=".6" stop-color="#9ca4ae"/>
      <stop offset="1" stop-color="#5f6772"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <circle cx="410" cy="410" r="250" fill="#1d2430" opacity=".22" filter="url(#soft)"/>
  <g transform="translate(400 390)" fill="url(#steel)">
    <circle r="220"/>
    <g id="t"><rect x="-28" y="-254" width="56" height="60" rx="8"/></g>
    <use href="#t" transform="rotate(30)"/><use href="#t" transform="rotate(60)"/><use href="#t" transform="rotate(90)"/><use href="#t" transform="rotate(120)"/><use href="#t" transform="rotate(150)"/><use href="#t" transform="rotate(180)"/><use href="#t" transform="rotate(210)"/><use href="#t" transform="rotate(240)"/><use href="#t" transform="rotate(270)"/><use href="#t" transform="rotate(300)"/><use href="#t" transform="rotate(330)"/>
  </g>
  <circle cx="400" cy="390" r="120" fill="#7c848f"/>
  <circle cx="400" cy="390" r="64" fill="#2a2f36"/>
  <text x="400" y="740" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="34" fill="#5d6773">{{brand}} {{label}}</text>
</svg>
