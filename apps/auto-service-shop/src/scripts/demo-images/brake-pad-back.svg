<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#fbfbfc"/>
      <stop offset="1" stop-color="#e4e7ec"/>
    </radialGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4d9e0"/>
      <stop offset=".55" stop-color="#9199a5"/>
      <stop offset="1" stop-color="#5d6571"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <ellipse cx="400" cy="600" rx="290" ry="36" fill="#1d2430" opacity=".26" filter="url(#soft)"/>
  <path d="M110 330 q290 -170 580 0 l-20 230 q-270 -90 -540 0 z" fill="url(#plate)"/>
  <rect x="100" y="380" width="40" height="70" rx="12" fill="#6b7380"/>
  <rect x="660" y="380" width="40" height="70" rx="12" fill="#6b7380"/>
  <path d="M220 390 q180 -80 360 0 l-8 110 q-172 -48 -344 0 z" fill="#2f6f5e" opacity=".88"/>
  <path d="M250 420 h300" stroke="#ffffff" stroke-width="4" opacity=".35"/>
  <path d="M260 455 h280" stroke="#ffffff" stroke-width="4" opacity=".35"/>
  <circle cx="300" cy="320" r="14" fill="#4b525c"/>
  <circle cx="500" cy="320" r="14" fill="#4b525c"/>
  <path d="M560 300 q60 10 90 60" fill="none" stroke="#c7ccd3" stroke-width="10" stroke-linecap="round"/>
  <text x="400" y="690" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="44" fill="#3c4450">{{brand}}</text>
  <text x="400" y="732" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#6b7480">{{label}}</text>
</svg>
