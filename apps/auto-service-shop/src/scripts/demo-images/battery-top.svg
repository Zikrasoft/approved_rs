<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#fbfbfc"/>
      <stop offset="1" stop-color="#e4e7ec"/>
    </radialGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#555b65"/>
      <stop offset="1" stop-color="#2e3238"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <rect x="122" y="252" width="580" height="330" rx="18" fill="#1d2430" opacity=".25" filter="url(#soft)"/>
  <rect x="110" y="235" width="580" height="330" rx="18" fill="url(#lid)"/>
  <rect x="140" y="265" width="520" height="270" rx="10" fill="none" stroke="#6b717a" stroke-width="3"/>
  <circle cx="200" cy="320" r="38" fill="#9b1c1c"/><circle cx="200" cy="320" r="22" fill="#d9dde2"/>
  <circle cx="600" cy="320" r="38" fill="#2b2f35"/><circle cx="600" cy="320" r="22" fill="#d9dde2"/>
  <text x="200" y="395" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="40" fill="#e05252">+</text>
  <text x="600" y="395" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="40" fill="#c6cbd2">−</text>
  <g fill="#3a3f46"><rect x="300" y="300" width="200" height="16" rx="8"/><rect x="300" y="332" width="200" height="16" rx="8"/></g>
  <circle cx="400" cy="450" r="36" fill="#1f2328"/><circle cx="400" cy="450" r="24" fill="#2f9a5b"/>
  <text x="400" y="650" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="36" fill="#5d6773">{{brand}} {{label}}</text>
</svg>
