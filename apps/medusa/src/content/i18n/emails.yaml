orderPlaced:
  subject: Заказ №{displayId} принят — CarLab
  heading: Заказ №{displayId} принят
  intro: Спасибо! Заказ у нас. Мы свяжемся с вами, чтобы договориться, когда его забрать.
  itemsHeading: Состав заказа
  totalLabel: Итого
  pickupHeading: Самовывоз из сервиса
  pickupNote: Оплата при получении в сервисе.
  holdNote: Держим заказ 3 дня. Если не заберёте, заказ отменится, а детали вернутся в продажу.
translations:
  sr:
    orderPlaced:
      subject: Porudžbina br. {displayId} primljena — CarLab
      heading: Porudžbina br. {displayId} primljena
      intro: Hvala! Porudžbina je kod nas. Javićemo vam se da se dogovorimo kada da je preuzmete.
      itemsHeading: Sadržaj porudžbine
      totalLabel: Ukupno
      pickupHeading: Preuzimanje u servisu
      pickupNote: Plaćanje prilikom preuzimanja u servisu.
      holdNote: Držimo porudžbinu 3 dana. Ako je ne preuzmete, porudžbina će biti otkazana, a delovi će se vratiti u prodaju.
  en:
    orderPlaced:
      subject: 'Order #{displayId} Confirmed — CarLab'
      heading: 'Order #{displayId} Confirmed'
      intro: Thank you! We have received your order. We'll contact you to arrange pickup.
      itemsHeading: Order Details
      totalLabel: Total
      pickupHeading: Pickup from Workshop
      pickupNote: Payment upon pickup at the workshop.
      holdNote: We will hold your order for 3 days. If not picked up, it will be canceled and the parts will go back on sale.
