paint-protection-film:
  name: Защитная плёнка (PPF)
  short: Прозрачная полиуретановая броня против камней, песка и щёток на мойке.
  metaTitle: Оклейка защитной плёнкой PPF в Белграде — Details
  metaDescription: 'Оклейка кузова прозрачной защитной плёнкой в Белграде: перёд, полная оклейка, заворот кромок. Плёнки XPEL и SunTek. Гарантия до 10 лет от производителя.'
  heroEyebrow: Защита кузова
  heroTitle: Плёнка, которую не видно, и сколы, которых не будет
  heroLead: Полиуретан толщиной 190 микрон принимает на себя камни с трассы, песок и следы от щёток. Краска под ним остаётся заводской — а это то, что смотрят при продаже.
  priceFrom: от 690 € за перёд
  duration: 2–6 дней
  warranty: до 10 лет от производителя
  bodyHeading: Что это даёт
  body: |
    Главная ценность плёнки — не «блеск», а сохранённая заводская краска. Перекрашенное крыло видно любым толщиномером, и на осмотре перед покупкой это сразу минус к цене. Плёнка держит удар вместо лака: мелкие царапины на ней затягиваются сами на солнце, глубокие остаются на плёнке, а не на кузове.

    Мы режем выкройку под конкретный кузов на плоттере, а сложные места — бамперы, зеркала, стойки — подгоняем руками. Там, где панель позволяет, заворачиваем край внутрь: так стык не собирает грязь и не выдаёт себя тонкой серой полоской через год.

    Плёнку берём у XPEL и SunTek. Какая из них пойдёт на вашу машину, называем на осмотре — до того, как вы согласитесь на смету.
  includesHeading: Что входит
  includes:
    - Двухэтапная мойка, глина и обезжиривание перед наклейкой
    - Точечная полировка дефектов, которые иначе запечатались бы под плёнкой
    - Выкройка под вашу модель, ручная подгонка сложных элементов
    - Заворот кромок там, где геометрия панели это позволяет
    - Разбор ручек, зеркал и фонарей, если зона того требует
    - Контрольный осмотр через неделю после выдачи
  forWhomHeading: Кому это нужно
  forWhom:
    - Новая машина, которую хочется сохранить в заводском состоянии
    - Тёмный или матовый цвет, на котором видно каждую риску
    - Много трассы между городами и щебень на обочинах
    - Машина в лизинге или под скорую продажу, где важен отчёт по краске
  honestHeading: Когда мы отговариваем
  honest: 'Если машина уже перекрашена дешёвым лаком или на панели видны следы шпаклёвки — плёнку класть нельзя: при снятии она заберёт покрытие с собой. В таком случае мы честно скажем об этом на осмотре и предложим сначала привести лак в порядок.'
colour-change-wrap:
  name: Смена цвета плёнкой
  short: Новый цвет без покраски — и с возможностью вернуть заводской.
  metaTitle: Смена цвета автомобиля плёнкой в Белграде — Details
  metaDescription: 'Полная оклейка цветной плёнкой в Белграде: мат, сатин, глянец, текстуры. Обратимо, без перекраски, с сохранением заводского лака. Образцы на вашей машине.'
  heroEyebrow: Цвет
  heroTitle: Другой цвет. Тот же заводской лак под ним.
  heroLead: Плёнка меняет машину полностью, но остаётся обратимой. Через два года можно снять её и получить ту же краску, что была с завода, — чего не даст ни одна покраска.
  priceFrom: от 1 900 € за кузов
  duration: 4–7 дней
  warranty: 3–5 лет на плёнку
  bodyHeading: Почему плёнка, а не покраска
  body: |
    Покраска — это навсегда и это запись в истории автомобиля. Плёнка — это решение на несколько лет, которое можно отменить. При продаже вы снимаете её и отдаёте машину в родном цвете, с родным лаком под ней.

    Выбор цвета мы всегда делаем на вашей машине, а не по каталогу на столе: кладём образцы на кузов при дневном свете и смотрим, как цвет ведёт себя на ваших изгибах. Матовый на одной модели выглядит дорого, а на другой — плоско, и это видно только вживую.

    Цветные плёнки берём у 3M и HEXIS. Какую именно кладём, фиксируем в смете вместе с ценой и сроком.
  includesHeading: Что входит
  includes:
    - Подбор цвета образцами на вашем кузове при дневном свете
    - Разбор ручек, молдингов, фонарей и решёток
    - Оклейка с заворотом кромок в проёмах
    - Проклейка стыков и обработка углов феном
    - Инструкция по уходу за матом или сатином
    - Бесплатная правка мелких отслоений в первый месяц
  forWhomHeading: Кому это нужно
  forWhom:
    - Хочется другой цвет, но без потери заводской краски
    - Нужен мат, сатин или текстура, которых не бывает с завода
    - Машина в лизинге, где перекраска запрещена договором
    - Коммерческий автомобиль, который должен выглядеть узнаваемо
  honestHeading: Что нужно знать заранее
  honest: Плёнка не прячет вмятины и волны на кузове — наоборот, матовая подчёркивает их сильнее, чем глянец. Если на панелях есть геометрические дефекты, сначала кузовной ремонт, потом цвет. Мы скажем об этом на осмотре, а не после оклейки.
polishing-ceramic:
  name: Полировка и керамика
  short: Снимаем риски и паутинку, закрываем результат керамикой на годы.
  metaTitle: Полировка кузова и керамика в Белграде — Details
  metaDescription: Многоэтапная полировка с замером толщины лака и керамическое покрытие на 2–5 лет. Смотрим лак под лампой и показываем замеры. Студия Details, Белград.
  heroEyebrow: Лак
  heroTitle: Сначала убрать риски. Только потом что-то наносить.
  heroLead: Керамика поверх непрополированного лака просто консервирует паутинку на несколько лет. Мы сначала выводим дефекты, а покрытие кладём уже на готовую поверхность.
  priceFrom: от 450 € за автомобиль
  duration: 2–3 дня
  warranty: 2–5 лет на покрытие
  bodyHeading: Как это устроено
  body: |
    Полировка — это снятие тончайшего слоя лака вместе с рисками. Слой не бесконечный, поэтому мы начинаем с толщиномера: замеряем каждую панель и считаем, сколько запаса есть. Если на крыше или крыльях лак уже тонкий — работаем мягче или не трогаем панель вовсе.

    Дальше два или три прохода: режущий состав снимает основные дефекты, финишный убирает голограммы от машинки. Результат смотрим под лампой, которая показывает то, чего не видно на улице. И только после этого — обезжиривание и керамика. Полируем составами Koch-Chemie, керамику кладём Gtechniq.
  includesHeading: Что входит
  includes:
    - Замер толщины лака по всем панелям с записью результатов
    - Двух- или трёхэтапная полировка под контролем лампы
    - Обезжиривание поверхности перед нанесением
    - Керамическое покрытие с выдержкой в боксе
    - Обработка стёкол водоотталкивающим составом
    - Фотоотчёт до и после в одинаковом свете
  forWhomHeading: Кому это нужно
  forWhom:
    - Машина после нескольких лет автоматических моек
    - Тёмный цвет, на котором паутинка видна на любом солнце
    - Подготовка к продаже, когда важна первая секунда впечатления
    - Свежепригнанный автомобиль после перевозки и стоянок
  honestHeading: Когда мы отговариваем
  honest: Если толщиномер показывает критично тонкий лак, полировать нельзя — можно протереть до грунта. В такой ситуации мы предложим мягкий вариант без съёма или только защитное покрытие, и объясним, что именно увидели на замерах.
steering-wheel-restoration:
  name: Реставрация руля
  short: Затёртая кожа, лоснящийся обод и облезший пластик — в исходное состояние.
  metaTitle: Реставрация руля и перетяжка кожи в Белграде — Details
  metaDescription: 'Восстановление кожи руля в Белграде: перекраска, перетяжка, ремонт пластика и кнопок. Снимаем и ставим руль с подушкой безопасности. 2–3 дня.'
  heroEyebrow: Салон
  heroTitle: Первое, к чему прикасаются. И первое, что стареет.
  heroLead: 'Руль изнашивается быстрее всего салона: пот, солнце и крем для рук вытирают краску за пару лет. Восстановление стоит несоизмеримо дешевле нового руля и выглядит как заводской.'
  priceFrom: от 150 €
  duration: 2–3 дня
  warranty: 1 год
  bodyHeading: Что мы с ним делаем
  body: |
    Сначала снимаем руль целиком — аккуратно, с отключением аккумулятора и подушки безопасности. Дальше зависит от состояния: если кожа цела и вытерлась только краска, мы её очищаем, восстанавливаем фактуру и перекрашиваем составом, который не липнет и не пачкает руки. Если кожа порвана или прошивка разошлась — перетягиваем заново, с ручной прошивкой по оригинальному рисунку.

    Заодно приводим в порядок то, что обычно портится рядом: облезшие кнопки, потёртый пластик подрулевых накладок, глянец на лепестках.
  includesHeading: Что входит
  includes:
    - Снятие и установка руля с корректной работой с подушкой безопасности
    - Очистка и восстановление фактуры кожи
    - Перекраска или полная перетяжка с ручной прошивкой
    - Восстановление кнопок и пластиковых накладок
    - Подбор цвета и типа строчки под ваш салон
    - Проверка индикатора подушки после сборки
  forWhomHeading: Кому это нужно
  forWhom:
    - Обод вытерся до блестящего пластика или сменил цвет
    - Кожа потрескалась или разошлась по шву
    - Машина готовится к продаже, а руль выдаёт пробег
    - Хочется другой материал — например, алькантару на верхнем секторе
  honestHeading: Что нужно знать заранее
  honest: Мы не берёмся за рули со сработавшей подушкой безопасности или следами её замены без сервисной истории — это вопрос вашей безопасности, а не косметики. В таком случае сначала сервис, потом мы.
translations:
  sr:
    indexMetaTitle: 'Usluge detailing-a u Beogradu: PPF, poliranje, volan — Details'
    indexMetaDescription: Zaštitna folija PPF, promena boje, poliranje sa keramičkim premazom i restauracija volana. Cene, termini i poštena ograničenja po svakoj usluzi.
    indexEyebrow: Usluge
    indexHeading: Četiri pravca, u svakom — do kraja
    indexLead: 'Za svaku uslugu u nastavku postoji posebna stranica: šta uključuje, koliko traje, kome odgovara i kada mi iskreno odlažemo.'
    specsPriceLabel: Cena
    specsDurationLabel: Trajanje
    specsWarrantyLabel: Garancija
    paint-protection-film:
      name: Zaštitna folija (PPF)
      short: Prozirna poliuretanska zaštita protiv kamenja, peska i četki na pranju.
      metaTitle: Oklapanje zaštitnom folijom PPF u Beogradu — Details
      metaDescription: 'Oklapanje karoserije prozirnom zaštitnom folijom u Beogradu: prednja, kompletna oklapanja, uvijanje ivica. Folije XPEL i SunTek. Garancija do 10 godina od proizvođača.'
      heroEyebrow: Zaštita karoserije
      heroTitle: Folija koja se ne vidi, i oštećenja koja neće biti
      heroLead: Poliuretan debljine 190 mikrona prima kamenčiće sa puta, pesak i tragove od četki. Boja ispod nje ostaje fabrička — a to je ono na što se gleda pri prodaji.
      priceFrom: od 690 € za prednju stranu
      duration: 2–6 dana
      warranty: do 10 godina od proizvođača
      bodyHeading: Šta to donosi
      body: |-
        Glavna vrednost folije — nije „sjaj”, već očuvana fabrička boja. Prekrečeno krilo se vidi bilo kojim mernim instrumentom, i na pregledu pre kupovine to odmah čini minus u ceni. Folija trpi udarce umesto laka: sitne ogrebotine se same zatežu na suncu, a duboke ostaju na foliji, a ne na karoseriji.

        Mi režemo šablon prema konkretnoj karoseriji na plotteru, a složena mesta — branici, ogledala, stubići — prilagođavamo ručno. Tamo gde panel dozvoljava, uvijamo ivicu unutra: tako spoj ne skuplja prljavštinu i ne otkriva se tankom sivom linijom nakon godinu dana.

        Foliju nabavljamo od XPEL i SunTek. Koja će od njih otići na vašu mašinu, kažemo na pregledu — pre nego što se složite sa procenom.
      includesHeading: Šta uključuje
      includes:
        - Dvofazno pranje, glina i odmašćivanje pre lepljenja
        - Taktna poliranja defekata koji bi inače ostali pod folijom
        - Šablon prema vašem modelu, ručna prilagodba složenih elemenata
        - Uvijanje ivica tamo gde geometrija panela to dozvoljava
        - Rastavljanje ručki, ogledala i svetala, ako to zona zahteva
        - Kontrolni pregled nedelju dana nakon isporuke
      forWhomHeading: Kome je ovo potrebno
      forWhom:
        - Nova mašina koju želite da sačuvate u fabričkom stanju
        - Tamna ili mat boja na kojoj se vidi svaka ogrebotina
        - Mnogo autoputa između gradova i šljunak na rubnim delovima
        - Mašina u lizingu ili pred brzu prodaju, gde je važan izveštaj o boji
      honestHeading: Kada odustajemo
      honest: 'Ako je mašina već prefarbana jeftinim lakom ili na panelima su vidljivi tragovi maltera — foliju ne možemo staviti: pri skidanju će povući premaz sa sobom. U tom slučaju ćemo iskreno reći o tome na pregledu i predložiti da prvo dovedete lak u red.'
    colour-change-wrap:
      name: Promena boje folijom
      short: Nova boja bez farbanja — i sa mogućnošću vraćanja fabričke.
      metaTitle: Promena boje automobila folijom u Beogradu — Details
      metaDescription: 'Kompletno oklapanje u boji folijom u Beogradu: mat, satin, sjaj, teksture. Obratno, bez farbanja, sa očuvanjem fabričkog laka. Uzorci na vašoj mašini.'
      heroEyebrow: Boja
      heroTitle: Druga boja. Isti fabrički lak ispod nje.
      heroLead: Folija potpuno menja automobil, ali ostaje obrnuta. Nakon dve godine možete je skinuti i dobiti istu boju koja je bila iz fabrike — što nijedna farba ne može pružiti.
      priceFrom: od 1 900 € za karoseriju
      duration: 4–7 dana
      warranty: 3–5 godina na foliju
      bodyHeading: Zašto folija, a ne farba
      body: |-
        Farbanje — to je zauvek i to je zapis u istoriji automobila. Folija — to je rešenje na nekoliko godina koje se može poništiti. Pri prodaji skidate je i predajete auto u fabričkoj boji, sa fabričkim lakom ispod nje.

        Izbor boje uvek radimo na vašem automobilu, a ne po katalogu na stolu: stavljamo uzorke na karoseriju pri dnevnoj svetlosti i gledamo kako se boja ponaša na vašim oblinama. Mat na jednom modelu deluje skupo, dok na drugom deluje ravno, i to se vidi samo uživo.

        Boje folije nabavljamo od 3M i HEXIS. Koju tačno stavljamo, beležimo u ponudi zajedno sa cenom i rokom.
      includesHeading: Šta uključuje
      includes:
        - Odabir boje uzorcima na vašoj karoseriji pri dnevnoj svetlosti
        - Rastavljanje ručki, aluminijumskih lajsni, svetala i rešetki
        - Oklapanje sa uvijanjem ivica u otvorima
        - Lepivanje spojeva i obrada uglova fenom
        - Uputstvo za negu mat ili satina
        - Besplatna korekcija sitnih odlepljivanja u prvom mesecu
      forWhomHeading: Kome je ovo potrebno
      forWhom:
        - Želite drugu boju, ali bez gubitka fabričkog laka
        - Potrebna je mat, satin ili tekstura koje ne postoje iz fabrike
        - Mašina u lizingu, gde je farbanje zabranjeno ugovorom
        - Komercijalno vozilo koje treba da izgleda prepoznatljivo
      honestHeading: Šta treba znati unapred
      honest: Folija ne skriva udubljenja i talasanje na karoseriji — naprotiv, mat jače naglašava nego sjaj. Ako na panelima postoje geometrijski defekti, prvo karoserijski popravak, zatim boja. O tome ćemo reći na pregledu, a ne nakon oklapanja.
    polishing-ceramic:
      name: Poliranje i keramika
      short: Uklanjamo ogrebotine i paučinu, pokrivamo rezultat keramikom na godine.
      metaTitle: Poliranje karoserije i keramika u Beogradu — Details
      metaDescription: Višefazno poliranje sa merenjem debljine laka i keramički premaz na 2–5 godina. Proučavamo lak pod lampom i prikazujemo merenja. Studio Details, Beograd.
      heroEyebrow: Lak
      heroTitle: Prvo ukloniti ogrebotine. Tek onda nešto nanositi.
      heroLead: Keramika preko neprerađenog laka jednostavno konzervira paučinu na nekoliko godina. Mi prvo ispravljamo defekte, a premaz stavljamo već na gotovu površinu.
      priceFrom: od 450 € za automobil
      duration: 2–3 dana
      warranty: 2–5 godina na premaz
      bodyHeading: Kako to funkcioniše
      body: |-
        Poliranje — to je uklanjanje najtanjeg sloja laka zajedno sa ogrebotinama. Sloj nije beskonačan, pa počinjemo sa debljinomerom: merimo svaku ploču i računamo koliko je rezervi. Ako je lak na krovu ili krilima već tanak — radimo pažljivije ili uopšte ne dodirujemo panel.

        Zatim dva ili tri prolaza: rezni sastav uklanja glavne defekte, fini premaz uklanja holograme sa mašine. Rezultat posmatramo pod lampom koja pokazuje ono što nije vidljivo napolju. I tek posle toga — odmašćivanje i keramika. Poliramo sastavima Koch-Chemie, keramiku stavljamo Gtechniq.
      includesHeading: Šta uključuje
      includes:
        - Merenje debljine laka po svim panelima sa beleženjem rezultata
        - Dvo- ili trofazno poliranje pod kontrolom lampe
        - Odmašćivanje površine pre nanošenja
        - Keramički premaz sa izdržavanjem u boksu
        - Obrada stakala vodootpornim sastavom
        - Fotoizveštaj pre i posle u istom svetlu
      forWhomHeading: Kome je ovo potrebno
      forWhom:
        - Mašina posle nekoliko godina automatskog pranja
        - Tamna boja na kojoj je paučina vidljiva na bilo kom suncu
        - Priprema za prodaju, kada je važna prva sekunda utiska
        - Sveže prebačen automobil nakon transporta i parkiranja
      honestHeading: Kada odustajemo
      honest: Ako debljinomer pokazuje kritično tanak lak, polirati ne možemo — može se izgrebati do osnove. U takvoj situaciji ćemo ponuditi blažu opciju bez skidanja ili samo zaštitni premaz, i objasniti šta smo tačno videli na merenjima.
    steering-wheel-restoration:
      name: Restauracija volana
      short: Istrošena koža, sjajan obruč i oljušten plastika — u izvorno stanje.
      metaTitle: Restauracija volana i presvlačenje kože u Beogradu — Details
      metaDescription: 'Obnovu kože volana u Beogradu: farbanje, presvlačenje, popravka plastike i dugmadi. Skidamo i postavljamo volan sa vazdušnim jastuком. 2–3 dana.'
      heroEyebrow: Salon
      heroTitle: Prvo na šta se dodiruje. I prvo što stari.
      heroLead: 'Volan se troši najbrže u salonu: znoj, sunce i krema za ruke brišu boju za par godina. Obnova košta nesrazmerno manje od novog volana i izgleda kao fabrički.'
      priceFrom: od 150 €
      duration: 2–3 dana
      warranty: 1 godina
      bodyHeading: Šta radimo s njim
      body: |-
        Prvo skidamo volan kompletno — pažljivo, sa isključenjem akumulatora i vazdušnog jastučića. Dalje zavisi od stanja: ako je koža neozleđena i samo je boja izbrisana, čistimo je, obnavljamo teksturu i farbamo sastavom koji se ne lepi i ne uprlja ruke. Ako je koža pocepana ili se šav razdvojio — presvlačimo iznova, sa ručnom šavom prema originalnom uzorku.

        Uz to dovedemo u red ono što se obično pokvari u okolini: oljuštena dugmad, izgrebana plastika ispod volana, sjaj na dugmadi.
      includesHeading: Šta uključuje
      includes:
        - Skidanje i postavljanje volana uz ispravno funkcionisanje sa vazdušnim jastučićem
        - Čišćenje i obnavljanje teksture kože
        - Farbanje ili potpuno presvlačenje sa ručnom šavom
        - Obnova dugmadi i plastičnih lajsni
        - Odabir boje i tipa šava prema vašem salonu
        - Provera indikatora vazdušnog jastučića nakon sklapanja
      forWhomHeading: Kome je ovo potrebno
      forWhom:
        - Obruč se istrošio do sjajnog plastike ili promenio boju
        - Koža je napukla ili se po šavu otvorila
        - Mašina se priprema za prodaju, a volan pokazuje pređene kilometre
        - Želite drugi materijal — na primer, alkantar na gornjem delu
      honestHeading: Šta treba znati unapred
      honest: Ne uzimamo se za volane sa aktiviranim vazdušnim jastučićem ili tragovima njegove zamene bez servisne istorije — to je pitanje vaše sigurnosti, a ne kozmetike. U tom slučaju prvo servis, zatim mi.
  en:
    indexMetaTitle: 'Detailing Services in Belgrade: PPF, Polishing, Steering Wheel — Details'
    indexMetaDescription: Paint protection film (PPF), colour change wraps, machine polishing with ceramic coating, and steering wheel restoration. Prices, duration, and honest limitations for each service.
    indexEyebrow: Services
    indexHeading: Four Areas, Each to the Fullest
    indexLead: 'Each service below has a separate page: what’s included, how long it takes, who it’s for, and when we honestly recommend against it.'
    specsPriceLabel: Price
    specsDurationLabel: Duration
    specsWarrantyLabel: Warranty
    paint-protection-film:
      name: Paint Protection Film (PPF)
      short: Clear polyurethane armor against stones, sand, and car wash brushes.
      metaTitle: PPF Installation in Belgrade — Details
      metaDescription: 'Installation of clear protective film on the body in Belgrade: front, full wrap, edge tuck. XPEL and SunTek films. Up to 10-year manufacturer warranty.'
      heroEyebrow: Body Protection
      heroTitle: The Invisible Film That Prevents Chips
      heroLead: 190-micron thick polyurethane takes on stones from the road, sand, and brush marks. The paint underneath remains factory fresh — and that's what buyers look for.
      priceFrom: from €690 for the front
      duration: 2–6 days
      warranty: up to 10 years from the manufacturer
      bodyHeading: What It Offers
      body: |-
        The main value of the film isn’t the 'shine', but rather the preserved factory paint. Repainted panels can be identified by any thickness gauge, which can lead to a lower price during a pre-purchase inspection. The film absorbs impacts instead of the clear coat: minor scratches self-heal in the sun, while deeper ones remain on the film, not the body.

        We cut templates specifically for your vehicle using a plotter, and for complex areas — bumpers, mirrors, pillars — we fit them by hand. Where the panel allows, we tuck the edge inward: this prevents dirt accumulation and avoids showing a thin grey line after a year.

        We source our films from XPEL and SunTek. We'll let you know which film is suitable for your car during the inspection — before you agree to the quote.
      includesHeading: What’s Included
      includes:
        - Two-step wash, clay treatment, and degreasing before application
        - Spot polishing of defects that would otherwise be sealed under the film
        - Custom template for your model, hand-fitting of complex elements
        - Edge tuck where panel geometry permits
        - Removal of handles, mirrors, and lights if necessary
        - Follow-up inspection one week after delivery
      forWhomHeading: Who Needs This
      forWhom:
        - A new car you want to keep in factory condition
        - A dark or matte color that shows every scratch
        - Frequent highway driving with gravel on the roadside
        - A leasing car or a vehicle for quick resale, where paint condition is crucial
      honestHeading: When We Recommend Against It
      honest: 'If the car has already been repainted with cheap paint or if there are signs of body filler on the panel — the film cannot be applied: removing it will take the paint with it. In this case, we’ll honestly inform you during the inspection and suggest restoring the clear coat first.'
    colour-change-wrap:
      name: Colour Change Wrap
      short: A new color without repainting — and with the option to revert to factory.
      metaTitle: Car Colour Change Wrap in Belgrade — Details
      metaDescription: 'Complete wrapping in colored film in Belgrade: matte, satin, gloss, textures. Reversible, without repainting, preserving the factory finish. Samples on your car.'
      heroEyebrow: Colour
      heroTitle: A Different Colour. The Same Factory Paint Underneath.
      heroLead: The wrap transforms the entire car while remaining reversible. After two years, it can be removed, revealing the same factory paint — which no repaint can provide.
      priceFrom: from €1,900 for the body
      duration: 4–7 days
      warranty: 3–5 years on the film
      bodyHeading: Why Choose Film Instead of Painting
      body: |-
        Painting is permanent and recorded in the vehicle's history. The wrap is a decision for several years, which can be reversed. Upon resale, you remove it and sell the car in its original color, with the original clear coat underneath.

        We always choose the color on your vehicle, not from a catalog on a table: we lay samples on the body in natural light and observe how the color behaves on your curves. Matte may look luxurious on one model but flat on another, and this can only be appreciated in person.

        We source our colored films from 3M and HEXIS. The specific film we’ll apply is documented in the quote along with the price and duration.
      includesHeading: What’s Included
      includes:
        - Color selection using samples on your body in natural light
        - Removal of handles, moldings, lights, and grilles
        - Wrapping with edge tucking in openings
        - Sealing seams and heat treating corners
        - Care instructions for matte or satin finishes
        - Free touch-up for minor peeling in the first month
      forWhomHeading: Who Needs This
      forWhom:
        - Wants a different color without losing the factory paint
        - Needs matte, satin, or textures not available from the factory
        - Leased vehicle where repainting is prohibited by contract
        - Commercial vehicle that needs to look recognizable
      honestHeading: What You Need to Know in Advance
      honest: The film does not hide dents and waves on the body — on the contrary, matte highlights them more than gloss. If the panels have geometric defects, body repair should be done first, then the wrap. We'll inform you about this during the inspection, not after application.
    polishing-ceramic:
      name: Polishing and Ceramic Coating
      short: We remove scratches and swirls, seal the result with ceramic for years.
      metaTitle: Car Polishing and Ceramic Coating in Belgrade — Details
      metaDescription: Multi-step polishing with paint thickness measurement and a ceramic coating lasting 2-5 years. We inspect the paint under a lamp and show measurements. Studio Details, Belgrade.
      heroEyebrow: Paint
      heroTitle: First Remove Scratches. Then Apply Anything.
      heroLead: Ceramic over unpolished paint simply preserves the swirls for years. We first eliminate defects, and then apply the coating to the ready surface.
      priceFrom: from €450 for a car
      duration: 2–3 days
      warranty: 2–5 years on the coating
      bodyHeading: How It Works
      body: |-
        Polishing involves removing the thinnest layer of paint along with scratches. The layer is not infinite, so we begin with a thickness gauge: we measure each panel and calculate the remaining material. If the paint on the roof or fenders is already thin, we’ll work gentler or avoid the panel altogether.

        Next, we perform two or three passes: a cutting compound removes the main defects, and a finishing compound eliminates holograms from the machine. We evaluate the result under a lamp that reveals what isn’t visible outside. Only after this do we proceed with degreasing and applying ceramic coating. We use Koch-Chemie compounds for polishing and lay Gtechniq ceramic.
      includesHeading: What’s Included
      includes:
        - Thickness measurement of paint on all panels with record of results
        - Two or three-step polishing under lamp control
        - Degreasing the surface before application
        - Ceramic coating with curing in a booth
        - Treatment of windows with a water-repellent compound
        - Photo report before and after in the same lighting
      forWhomHeading: Who Needs This
      forWhom:
        - A car after several years of automatic washes
        - A dark color where swirls are visible in any sunlight
        - Preparing for sale, where the first impression counts
        - A freshly imported car after transport and storage
      honestHeading: When We Recommend Against It
      honest: If the thickness gauge shows critically thin paint, polishing is not possible — you might rub down to the primer. In such cases, we will suggest a gentler option without removal or just a protective coating, and explain what we observed during measurements.
    steering-wheel-restoration:
      name: Steering Wheel Restoration
      short: Worn leather, shiny rim, and peeling plastic — returned to original state.
      metaTitle: Steering Wheel Restoration and Leather Reupholstery in Belgrade — Details
      metaDescription: 'Restoring the leather of the steering wheel in Belgrade: repainting, reupholstering, repairing plastic and buttons. We remove and reinstall the steering wheel with the airbag. 2–3 days.'
      heroEyebrow: Interior
      heroTitle: The First Thing You Touch. And the First to Age.
      heroLead: 'The steering wheel wears out faster than any other part of the interior: sweat, sun, and hand cream wear away the paint in just a couple of years. Restoration costs immeasurably less than a new steering wheel and looks factory fresh.'
      priceFrom: from €150
      duration: 2–3 days
      warranty: 1 year
      bodyHeading: What We Do With It
      body: |-
        First, we remove the steering wheel entirely — carefully, disconnecting the battery and airbag. Next, it depends on its condition: if the leather is intact and only the paint is worn, we clean it, restore the texture, and repaint with a formula that doesn't stick or stain hands. If the leather is torn or the stitching has unraveled — we reupholster it, with hand-stitching in the original pattern.

        We also take care of the adjacent areas that usually get damaged: peeling buttons, worn plastic on the steering column trim, gloss on the paddle shifters.
      includesHeading: What’s Included
      includes:
        - Removing and reinstalling the steering wheel with correct airbag functioning
        - Cleaning and restoring the leather texture
        - Repainting or complete reupholstery with hand-stitching
        - Repairing buttons and plastic trims
        - Selecting color and stitching type to match your interior
        - Checking airbag indicator after reassembly
      forWhomHeading: Who Needs This
      forWhom:
        - The rim has worn down to shiny plastic or changed color
        - The leather is cracked or the stitching has unraveled
        - The car is being prepared for sale and the steering wheel shows mileage
        - Wants a different material — for example, Alcantara on the upper section
      honestHeading: What You Need to Know in Advance
      honest: We do not take on steering wheels with deployed airbags or signs of previous deployments without a service history — this concerns your safety, not just cosmetics. In such cases, service first, then us.
