paint-protection-film:
  name: Защитная плёнка (PPF)
  short: Прозрачная полиуретановая броня против камней, песка и щёток на мойке.
  metaTitle: Оклейка защитной плёнкой PPF в Белграде — Details
  metaDescription: 'Оклейка кузова прозрачной защитной плёнкой в Белграде: перёд, полная оклейка, заворот кромок. Плёнки XPEL и SunTek. Гарантия до 10 лет от производителя.'
  heroEyebrow: Защита кузова
  heroTitle: Плёнка, которую не видно, и сколы, которых не будет
  heroLead: Полиуретан толщиной 200 микрон принимает на себя камни с трассы, песок и следы от щёток. Краска под ним остаётся заводской — а это то, что смотрят при продаже.
  priceFrom: от 690 € за перёд
  duration: 2–6 дней
  warranty: до 10 лет от производителя
  bodyHeading: Что это даёт
  body: |
    Главная ценность плёнки — не «блеск», а сохранённая заводская краска. Перекрашенное крыло видно любым толщиномером, и на осмотре перед покупкой это сразу минус к цене. Плёнка держит удар вместо лака: мелкие царапины на ней затягиваются сами на солнце, глубокие остаются на плёнке, а не на кузове.

    Мы режем выкройку под конкретный кузов на плоттере, а сложные места — бамперы, зеркала, стойки — подгоняем руками. Там, где панель позволяет, заворачиваем край внутрь: так стык не собирает грязь и не выдаёт себя тонкой серой полоской через год.

    Плёнку берём у XPEL и SunTek. Какая из них пойдёт на вашу машину, называем на осмотре — до того, как вы согласитесь на смету.
  includesHeading: Что входит
  includes:
    - Двухэтапная мойка, глина и обезжиривание перед наклейкой
    - Точечная полировка дефектов, которые иначе запечатались бы под плёнкой
    - Выкройка под вашу модель, ручная подгонка сложных элементов
    - Заворот кромок там, где геометрия панели это позволяет
    - Разбор ручек, зеркал и фонарей, если зона того требует
    - Контрольный осмотр через неделю после выдачи
  forWhomHeading: Кому это нужно
  forWhom:
    - Новая машина, которую хочется сохранить в заводском состоянии
    - Тёмный или матовый цвет, на котором видно каждую риску
    - Много трассы между городами и щебень на обочинах
    - Машина в лизинге или под скорую продажу, где важен отчёт по краске
  honestHeading: Когда мы отговариваем
  honest: 'Если машина уже перекрашена дешёвым лаком или на панели видны следы шпаклёвки — плёнку класть нельзя: при снятии она заберёт покрытие с собой. В таком случае мы честно скажем об этом на осмотре и предложим сначала привести лак в порядок.'
colour-change-wrap:
  name: Смена цвета плёнкой
  short: Новый цвет без покраски — и с возможностью вернуть заводской.
  metaTitle: Смена цвета автомобиля плёнкой в Белграде — Details
  metaDescription: 'Полная оклейка цветной плёнкой в Белграде: мат, сатин, глянец, текстуры. Обратимо, без перекраски, с сохранением заводского лака. Образцы на вашей машине.'
  heroEyebrow: Цвет
  heroTitle: Другой цвет. Тот же заводской лак под ним.
  heroLead: Плёнка меняет машину полностью, но остаётся обратимой. Через два года можно снять её и получить ту же краску, что была с завода, — чего не даст ни одна покраска.
  priceFrom: от 1 900 € за кузов
  duration: 4–7 дней
  warranty: 3–5 лет на плёнку
  bodyHeading: Почему плёнка, а не покраска
  body: |
    Покраска — это навсегда и это запись в истории автомобиля. Плёнка — это решение на несколько лет, которое можно отменить. При продаже вы снимаете её и отдаёте машину в родном цвете, с родным лаком под ней.

    Выбор цвета мы всегда делаем на вашей машине, а не по каталогу на столе: кладём образцы на кузов при дневном свете и смотрим, как цвет ведёт себя на ваших изгибах. Матовый на одной модели выглядит дорого, а на другой — плоско, и это видно только вживую.

    Цветные плёнки берём у 3M и HEXIS. Какую именно кладём, фиксируем в смете вместе с ценой и сроком.
  includesHeading: Что входит
  includes:
    - Подбор цвета образцами на вашем кузове при дневном свете
    - Разбор ручек, молдингов, фонарей и решёток
    - Оклейка с заворотом кромок в проёмах
    - Проклейка стыков и обработка углов феном
    - Инструкция по уходу за матом или сатином
    - Бесплатная правка мелких отслоений в первый месяц
  forWhomHeading: Кому это нужно
  forWhom:
    - Хочется другой цвет, но без потери заводской краски
    - Нужен мат, сатин или текстура, которых не бывает с завода
    - Машина в лизинге, где перекраска запрещена договором
    - Коммерческий автомобиль, который должен выглядеть узнаваемо
  honestHeading: Что нужно знать заранее
  honest: Плёнка не прячет вмятины и волны на кузове — наоборот, матовая подчёркивает их сильнее, чем глянец. Если на панелях есть геометрические дефекты, сначала кузовной ремонт, потом цвет. Мы скажем об этом на осмотре, а не после оклейки.
polishing-ceramic:
  name: Полировка и керамика
  short: Снимаем риски и паутинку, закрываем результат керамикой на годы.
  metaTitle: Полировка кузова и керамика в Белграде — Details
  metaDescription: Многоэтапная полировка с замером толщины лака и керамическое покрытие на 2–5 лет. Смотрим лак под лампой и показываем замеры. Студия Details, Белград.
  heroEyebrow: Лак
  heroTitle: Сначала убрать риски. Только потом что-то наносить.
  heroLead: Керамика поверх непрополированного лака просто консервирует паутинку на несколько лет. Мы сначала выводим дефекты, а покрытие кладём уже на готовую поверхность.
  priceFrom: от 450 € за автомобиль
  duration: 2–3 дня
  warranty: 2–5 лет на покрытие
  bodyHeading: Как это устроено
  body: |
    Полировка — это снятие тончайшего слоя лака вместе с рисками. Слой не бесконечный, поэтому мы начинаем с толщиномера: замеряем каждую панель и считаем, сколько запаса есть. Если на крыше или крыльях лак уже тонкий — работаем мягче или не трогаем панель вовсе.

    Дальше два или три прохода: режущий состав снимает основные дефекты, финишный убирает голограммы от машинки. Результат смотрим под лампой, которая показывает то, чего не видно на улице. И только после этого — обезжиривание и керамика. Полируем составами Koch-Chemie, керамику кладём Gtechniq.
  includesHeading: Что входит
  includes:
    - Замер толщины лака по всем панелям с записью результатов
    - Двух- или трёхэтапная полировка под контролем лампы
    - Обезжиривание поверхности перед нанесением
    - Керамическое покрытие с выдержкой в боксе
    - Обработка стёкол водоотталкивающим составом
    - Фотоотчёт до и после в одинаковом свете
  forWhomHeading: Кому это нужно
  forWhom:
    - Машина после нескольких лет автоматических моек
    - Тёмный цвет, на котором паутинка видна на любом солнце
    - Подготовка к продаже, когда важна первая секунда впечатления
    - Свежепригнанный автомобиль после перевозки и стоянок
  honestHeading: Когда мы отговариваем
  honest: Если толщиномер показывает критично тонкий лак, полировать нельзя — можно протереть до грунта. В такой ситуации мы предложим мягкий вариант без съёма или только защитное покрытие, и объясним, что именно увидели на замерах.
steering-wheel-restoration:
  name: Реставрация руля
  short: Затёртая кожа, лоснящийся обод и облезший пластик — в исходное состояние.
  metaTitle: Реставрация руля и перетяжка кожи в Белграде — Details
  metaDescription: 'Восстановление кожи руля в Белграде: перекраска, перетяжка, ремонт пластика и кнопок. Снимаем и ставим руль с подушкой безопасности. 2–3 дня.'
  heroEyebrow: Салон
  heroTitle: Первое, к чему прикасаются. И первое, что стареет.
  heroLead: 'Руль изнашивается быстрее всего салона: пот, солнце и крем для рук вытирают краску за пару лет. Восстановление стоит несоизмеримо дешевле нового руля и выглядит как заводской.'
  priceFrom: от 150 €
  duration: 2–3 дня
  warranty: 1 год
  bodyHeading: Что мы с ним делаем
  body: |
    Сначала снимаем руль целиком — аккуратно, с отключением аккумулятора и подушки безопасности. Дальше зависит от состояния: если кожа цела и вытерлась только краска, мы её очищаем, восстанавливаем фактуру и перекрашиваем составом, который не липнет и не пачкает руки. Если кожа порвана или прошивка разошлась — перетягиваем заново, с ручной прошивкой по оригинальному рисунку.

    Заодно приводим в порядок то, что обычно портится рядом: облезшие кнопки, потёртый пластик подрулевых накладок, глянец на лепестках.
  includesHeading: Что входит
  includes:
    - Снятие и установка руля с корректной работой с подушкой безопасности
    - Очистка и восстановление фактуры кожи
    - Перекраска или полная перетяжка с ручной прошивкой
    - Восстановление кнопок и пластиковых накладок
    - Подбор цвета и типа строчки под ваш салон
    - Проверка индикатора подушки после сборки
  forWhomHeading: Кому это нужно
  forWhom:
    - Обод вытерся до блестящего пластика или сменил цвет
    - Кожа потрескалась или разошлась по шву
    - Машина готовится к продаже, а руль выдаёт пробег
    - Хочется другой материал — например, алькантару на верхнем секторе
  honestHeading: Что нужно знать заранее
  honest: Мы не берёмся за рули со сработавшей подушкой безопасности или следами её замены без сервисной истории — это вопрос вашей безопасности, а не косметики. В таком случае сначала сервис, потом мы.
translations:
  sr:
    indexMetaTitle: 'Usluge detaljinga u Beogradu: PPF, poliranje, volan — Details'
    indexMetaDescription: Zaštitna folija PPF, promena boje, poliranje sa keramičkim premazom i restauracija volana. Cene, rokovi i poštena ograničenja za svaku uslugu.
    indexEyebrow: Usluge
    indexHeading: Četiri pravca, u svakom — do kraja
    indexLead: 'Za svaku uslugu ispod postoji posebna stranica: šta uključuje, koliko traje, kome odgovara i kada vas iskreno odvratimo.'
    specsPriceLabel: Cena
    specsDurationLabel: Rok
    specsWarrantyLabel: Garancija
    paint-protection-film:
      name: Zaštitna folija (PPF)
      short: Prozirna poliuretanska zaštita protiv kamenčića, peska i četki sa pranja.
      metaTitle: Oblaganje zaštitnom folijom PPF u Beogradu — Details
      metaDescription: 'Oblaganje karoserije prozirnom zaštitnom folijom u Beogradu: prednja strana, potpuno oblaganje, preklapanje ivica. Folije XPEL i SunTek. Garancija do 10 godina od proizvođača.'
      heroEyebrow: Zaštita karoserije
      heroTitle: Folija koja se ne vidi, i oštećenja koja neće biti
      heroLead: Poliuretan debljine 200 mikrona apsorbuje kamenčiće sa puta, pesak i tragove od četki. Boja ispod nje ostaje fabrička — a to je ono što se gleda pri prodaji.
      priceFrom: od 690 € za prednju stranu
      duration: 2–6 dana
      warranty: do 10 godina od proizvođača
      bodyHeading: Šta to donosi
      body: |
        Glavna vrednost folije — nije "sjaj", već očuvana fabrička boja. Prefarbana krila se vide svakim mernim uređajem, i na pregledu pre kupovine to odmah smanjuje cenu. Folija upija udarce umesto laka: sitne ogrebotine na njoj se same zacepljuju na suncu, duboke ostaju na foliji, a ne na karoseriji.

        Pravite kroj za konkretan automobil na ploteru, a složene delove — branike, retrovizore, stubove — prilagođavamo rukama. Tamo gde panel dozvoljava, preklapamo ivicu unutra: tako spojevi ne skupljaju prljavštinu i ne izdaju se tankom sivom trakom nakon godine dana.

        Folije uzimamo od XPEL i SunTek. Koja će konkretno ići na vaš auto, kažemo na pregledu — pre nego što se složite sa predračunom.
      includesHeading: Šta uključuje
      includes:
        - Dvostepeno pranje, glina i odmašćivanje pre lepljenja
        - Tačkasta poliranja nedostataka koji bi inače ostali pod folijom
        - Kroj prema vašem modelu, ručno prilagođavanje složenih elemenata
        - Preklapanje ivica gde geometrija panela to dozvoljava
        - Rastavljanje ručica, retrovizora i svetala, ako zona to zahteva
        - Kontrolni pregled nedelju dana nakon isporuke
      forWhomHeading: Kome je to potrebno
      forWhom:
        - Nova mašina koju želite da sačuvate u fabričkom stanju
        - Tamna ili mat boja, na kojoj se vide svaka ogrebotina
        - Mnogo puta između gradova i šljunak na ivicama puta
        - Auto u lizingu ili pred brzu prodaju, gde je važan izveštaj o boji
      honestHeading: Kada vas odvratimo
      honest: 'Ako je auto već prefarban jeftinim lakom ili se na panelima vide tragovi blata — foliju staviti ne možemo: prilikom skidanja, ona će uzeti i premaz. U tom slučaju ćemo iskreno reći o tome na pregledu i ponuditi prvo da dovedemo lak u red.'
    colour-change-wrap:
      name: Promena boje folijom
      short: Nova boja bez farbanja — i sa mogućnošću da se vrati fabrička.
      metaTitle: Promena boje automobila folijom u Beogradu — Details
      metaDescription: 'Potpuno oblaganje u boji folijom u Beogradu: mat, satin, sjaj, teksture. Obnovivo, bez farbanja, uz očuvanje fabričkog laka. Uzorci na vašem autu.'
      heroEyebrow: Boja
      heroTitle: Druga boja. Isti fabrički lak ispod nje.
      heroLead: Folija menja auto potpuno, ali ostaje obnoviva. Nakon dve godine možete je skinuti i dobiti istu boju kakva je bila iz fabrike — što nijedno farbanje ne može da pruži.
      priceFrom: od 1 900 € za karoseriju
      duration: 4–7 dana
      warranty: 3–5 godina na foliju
      bodyHeading: Zašto folija, a ne farbanje
      body: |
        Farbanje — to je zauvek i to je zapis u istoriji automobila. Folija — to je rešenje na nekoliko godina, koje se može poništiti. Pri prodaji skidate je i predajete auto u originalnoj boji, sa originalnim lakom ispod nje.

        Izbor boje uvek radimo na vašem autu, a ne po katalogu na stolu: postavljamo uzorke na karoseriju pri dnevnom svetlu i gledamo kako se boja ponaša na vašim izbočinama. Mat na jednom modelu izgleda skupo, a na drugom — nezanimljivo, i to se vidi samo u stvarnosti.

        Obojene folije uzimamo od 3M i HEXIS. Koju tačno stavljamo, fiksiramo u predračunu zajedno sa cenom i rokom.
      includesHeading: Šta uključuje
      includes:
        - Odabir boje uzorcima na vašoj karoseriji pri dnevnom svetlu
        - Rastavljanje ručica, obloga, svetala i rešetki
        - Oblaganje uz preklapanje ivica u otvorima
        - Zalivanje spojeva i obrada uglova fenom
        - Uputstvo za negu mat ili satina
        - Besplatna korekcija sitnih odvođenja u prvom mesecu
      forWhomHeading: Kome je to potrebno
      forWhom:
        - Želite drugu boju, ali bez gubitka fabričkog laka
        - Potrebno vam je mat, satin ili tekstura koji ne postoje iz fabrike
        - Auto u lizingu, gde je farbanje zabranjeno ugovorom
        - Komercijalni automobil, koji treba da izgleda prepoznatljivo
      honestHeading: Šta treba znati unapred
      honest: Folija ne sakriva udubljenja i talase na karoseriji — naprotiv, mat više naglašava nego sjaj. Ako na panelima postoje geometrijski nedostaci, prvo karoseriski popravak, zatim boja. O tome ćemo reći na pregledu, a ne posle oblaganja.
    polishing-ceramic:
      name: Poliranje i keramika
      short: Uklanjamo ogrebotine i paučinu, prekrivamo rezultat keramikom na godinama.
      metaTitle: Poliranje karoserije i keramika u Beogradu — Details
      metaDescription: Višestepeno poliranje sa merenjem debljine laka i keramički premaz na 2–5 godina. Gledamo lak pod lampom i pokazujemo merenja. Studio Details, Beograd.
      heroEyebrow: Lak
      heroTitle: Prvo ukloniti ogrebotine. Samo nakon toga nešto nanositi.
      heroLead: Keramika preko nepoličanog laka samo konzervira paučinu na nekoliko godina. Prvo ispravljamo nedostatke, a premaz stavljamo na gotovu površinu.
      priceFrom: od 450 € za automobil
      duration: 2–3 dana
      warranty: 2–5 godina na premaz
      bodyHeading: Kako to funkcioniše
      body: |
        Poliranje — to je uklanjanje najtanjeg sloja laka zajedno sa ogrebotinama. Sloj nije beskonačan, tako da počinjemo sa debljinomerom: merimo svaku ploču i računamo koliko rezerve ima. Ako je lak na krovu ili krilima već tanak — radimo blaže ili ne diramo panel uopšte.

        Zatim dva ili tri prolaza: rezačka smesa uklanja glavne nedostatke, završna uklanja holograme od mašine. Rezultat gledamo pod lampom koja pokazuje ono što se ne vidi napolju. I samo nakon toga — odmašćivanje i keramika. Poliramo smesama Koch-Chemie, keramiku stavljamo Gtechniq.
      includesHeading: Šta uključuje
      includes:
        - Merenje debljine laka po svim panelima sa beleženjem rezultata
        - Dvostepeno ili trostepeno poliranje uz nadzor lampom
        - Odmašćivanje površine pre nanošenja
        - Keramički premaz sa zadržavanjem u boksu
        - Obrada stakala vodoodbojnim sastavom
        - Fotoizveštaj pre i posle u istom svetlu
      forWhomHeading: Kome je to potrebno
      forWhom:
        - Auto posle nekoliko godina automatskog pranja
        - Tamna boja, na kojoj je paučina vidljiva na svakoj sunčevoj svetlosti
        - Priprema za prodaju, kada je važna prva sekunda utiska
        - Svežepreveden automobil nakon prevoza i parkiranja
      honestHeading: Kada vas odvratimo
      honest: Ako debljinski merač pokazuje kritično tanak lak, polirati ne možemo — može se skinuti do osnove. U toj situaciji ponudićemo blažu varijantu bez skidanja ili samo zaštitni premaz, i objasniti šta smo konkretno videli na merenju.
    steering-wheel-restoration:
      name: Restauracija volana
      short: Izgorela koža, sjajan obod i pohabana plastika — u izvorno stanje.
      metaTitle: Restauracija volana i presvlačenje kože u Beogradu — Details
      metaDescription: 'Obnova kože volana u Beogradu: farbanje, presvlačenje, popravka plastike i dugmadi. Skidamo i vraćamo volan sa vazdušnom jastučićem. 2–3 dana.'
      heroEyebrow: Salon
      heroTitle: Prvo, čim se dodiruje. I prvo, što stari.
      heroLead: 'Volan se najbrže troši od celog enterijera: znoj, sunce i krema za ruke brisu boju za nekoliko godina. Obnova košta neuporedivo manje od novog volana i izgleda kao fabrički.'
      priceFrom: od 150 €
      duration: 2–3 dana
      warranty: 1 godina
      bodyHeading: Šta radimo s njim
      body: |-
        Prvo skidamo volan u celosti — pažljivo, sa isključivanjem akumulatora i vazdušne jastučiće. Zatim zavisi od stanja: ako je koža netaknuta i samo je boja nestala, čistićemo je, obnavljamo teksturu i farbamo smesom koja ne lepi i ne prlja ruke. Ako je koža pocepan ili se šav razdvojio — presvučemo ponovo, sa ručnom šavom po originalnom uzorku.

        U isto vreme dovedemo u red ono što obično propada pored: pohabana dugmad, izgrebana plastika ispod volana, sjaj na laticama.
      includesHeading: Šta uključuje
      includes:
        - Skidanje i postavljanje volana sa ispravnim radom vazdušne jastučiće
        - Čišćenje i obnova teksture kože
        - Farbanje ili potpuno presvlačenje sa ručnom šavom
        - Obnova dugmadi i plastičnih obloga
        - Odabir boje i tipa šavova prema vašem enterijeru
        - Provera indikatora vazdušne jastučiće nakon sastavljanja
      forWhomHeading: Kome je to potrebno
      forWhom:
        - Obod se istrošio do sjajne plastike ili promenio boju
        - Koža se pocepala ili je šav razdvojen
        - Auto se priprema za prodaju, a volan otkriva pređenu distancu
        - Želite drugi materijal — na primer, alkanataru na gornjem delu
      honestHeading: Šta treba znati unapred
      honest: Ne preuzimamo volane sa aktivnim vazdušnim jastučićem ili tragovima njene zamene bez servisne istorije — to je pitanje vaše bezbednosti, a ne kozmetike. U takvom slučaju prvo servis, a zatim mi.
  en:
    indexMetaTitle: 'Detailing Services in Belgrade: PPF, Polishing, Steering Wheel — Details'
    indexMetaDescription: Paint protection film, color change wraps, polishing with ceramic coating, and steering wheel restoration. Prices, durations, and honest limitations for each service.
    indexEyebrow: Services
    indexHeading: Four areas, each one thoroughly covered
    indexLead: 'Each service below has a separate page: what’s included, how long it takes, who it’s for, and when we honestly recommend against it.'
    specsPriceLabel: Price
    specsDurationLabel: Duration
    specsWarrantyLabel: Warranty
    paint-protection-film:
      name: Paint Protection Film (PPF)
      short: Transparent polyurethane armor against stones, sand, and washing brushes.
      metaTitle: PPF Installation in Belgrade — Details
      metaDescription: 'Installation of transparent paint protection film in Belgrade: front, full coverage, edge wrapping. XPEL and SunTek films. Up to 10 years warranty from the manufacturer.'
      heroEyebrow: Body Protection
      heroTitle: A film you can't see, and chips that won't appear
      heroLead: 200-micron polyurethane takes on debris from the road, sand, and brush marks. The paint beneath it remains factory fresh — a crucial point during resale.
      priceFrom: from 690 € for the front
      duration: 2–6 days
      warranty: up to 10 years from the manufacturer
      bodyHeading: What it offers
      body: |-
        The main value of the film lies not in 'shine,' but in preserving the factory paint. Repainted fenders can be detected by any thickness gauge, and during a pre-purchase inspection, it immediately reduces the value. The film takes the hit instead of the clear coat: minor scratches self-heal in the sun, while deep ones remain on the film, not on the body.

        We cut the pattern for your specific vehicle on a plotter, and we manually fit complex areas like bumpers, mirrors, and pillars. Where the panel allows, we wrap the edge inside: this way, the seam doesn’t collect dirt and avoid showing a thin gray line after a year.

        We source our films from XPEL and SunTek. Which one goes on your car is decided during the inspection — before you agree to the estimate.
      includesHeading: What's included
      includes:
        - Two-step wash, clay, and degreasing before application
        - Spot polishing of defects that would otherwise be sealed under the film
        - Custom pattern for your model, manual fitting of complex elements
        - Edge wrapping where panel geometry permits
        - Disassembly of handles, mirrors, and lights if the area requires it
        - Follow-up inspection a week after delivery
      forWhomHeading: Who needs this
      forWhom:
        - A new car that you want to keep in factory condition
        - Dark or matte colors that show every scratch
        - Frequent long drives and gravel on the roadside
        - A car under lease or for quick resale, where paint condition matters
      honestHeading: When we advise against it
      honest: If the car has already been repainted with cheap clear coat or there are signs of filler on the panel, the film cannot be applied — removing it will take the coating with it. In that case, we will honestly inform you during the inspection and suggest restoring the clear coat first.
    colour-change-wrap:
      name: Color Change Wrap
      short: A new color without repainting — and the option to return to factory.
      metaTitle: Vehicle Color Change Wrap in Belgrade — Details
      metaDescription: 'Full wrapping with colored film in Belgrade: matte, satin, gloss, textures. Reversible, without repainting, preserving the factory clear coat. Samples on your vehicle.'
      heroEyebrow: Color
      heroTitle: A different color. The same factory clear coat underneath.
      heroLead: The wrap completely changes the car, but remains reversible. After two years, you can remove it and get the original paint, which no repainting can guarantee.
      priceFrom: from 1,900 € for the body
      duration: 4–7 days
      warranty: 3–5 years on the film
      bodyHeading: Why wrap instead of repainting
      body: |-
        Repainting is permanent and becomes part of the vehicle's history. A wrap is a several-year solution that can be undone. When selling, you remove the wrap and offer the car in its original color, with the original clear coat underneath.

        We always choose the color on your car, not from a catalog on the table: we place samples on the body in daylight and observe how the color behaves on your contours. Matte on one model can look expensive, while on another it appears flat, and this is only evident in person.

        We source colored films from 3M and HEXIS. The specific one we use will be documented in the estimate along with the price and duration.
      includesHeading: What's included
      includes:
        - Color selection with samples on your vehicle under daylight
        - Disassembly of handles, trims, lights, and grilles
        - Wrapping with edge folding in the openings
        - Sealing of seams and heat treatment of corners
        - Care instructions for matte or satin finishes
        - Free touch-ups for minor delaminations in the first month
      forWhomHeading: Who needs this
      forWhom:
        - Wanting a different color but without losing the factory paint
        - Need matte, satin, or textures that aren't available from the factory
        - A vehicle under lease where repainting is prohibited by contract
        - A commercial vehicle that needs to look recognizable
      honestHeading: What to know in advance
      honest: The film does not hide dents and waves on the body — on the contrary, a matte finish accentuates them more than gloss. If there are geometric defects on the panels, first body repair, then color change. We will point this out during the inspection, not after wrapping.
    polishing-ceramic:
      name: Polishing and Ceramic Coating
      short: We remove scratches and swirls, sealing the result with ceramic for years.
      metaTitle: Body Polishing and Ceramic Coating in Belgrade — Details
      metaDescription: Multistage polishing with thickness measurement and ceramic coating lasting 2–5 years. We check the clear coat under light and show measurements. Details Studio, Belgrade.
      heroEyebrow: Clear Coat
      heroTitle: First remove the scratches. Only then apply anything.
      heroLead: Ceramic applied over unpolished clear coat simply preserves the swirl marks for several years. We first eliminate defects, and only then apply the coating on a prepared surface.
      priceFrom: from 450 € per vehicle
      duration: 2–3 days
      warranty: 2–5 years on the coating
      bodyHeading: How it works
      body: |-
        Polishing involves removing a very thin layer of clear coat along with scratches. The layer is not infinite, so we start with a thickness gauge: measuring each panel and assessing how much depth is left. If the clear coat on the roof or fenders is already thin, we work more gently or don’t touch the panel at all.

        Next, we perform two or three passes: cutting compound removes major defects, while finishing polish eliminates holograms from the machine. We check the result under a light that reveals what isn’t visible outdoors. Only after this do we proceed to degreasing and ceramic application. We use Koch-Chemie compounds for polishing and apply Gtechniq for the ceramic coating.
      includesHeading: What's included
      includes:
        - Thickness measurement of the clear coat on all panels with documented results
        - Two- or three-stage polishing controlled by light
        - Degreasing the surface before application
        - Ceramic coating with a curing period in the box
        - Glass treatment with a water-repellent solution
        - Photo report before and after in similar light conditions
      forWhomHeading: Who needs this
      forWhom:
        - A car after several years of automatic washes
        - Dark colors where swirls are visible in any sunlight
        - Preparation for sale, where first impressions matter
        - Recently imported vehicles after transport and storage
      honestHeading: When we advise against it
      honest: If the thickness gauge shows critically thin clear coat, polishing is not advisable — it may rub down to the primer. In such cases, we will offer a gentler option without removal or just a protective coating, explaining what we observed during measurements.
    steering-wheel-restoration:
      name: Steering Wheel Restoration
      short: Worn leather, shiny rim, and peeling plastic — restored to original condition.
      metaTitle: Steering Wheel Restoration and Leather Reupholstery in Belgrade — Details
      metaDescription: 'Restoration of leather steering wheels in Belgrade: repainting, reupholstery, plastic and button repair. We safely remove and install the steering wheel with the airbag. 2–3 days.'
      heroEyebrow: Interior
      heroTitle: The first thing you touch. And the first to age.
      heroLead: 'The steering wheel wears out faster than any interior part: sweat, sunlight, and hand creams wear off the paint in just a couple of years. Restoration costs significantly less than a new steering wheel and looks factory-fresh.'
      priceFrom: from 150 €
      duration: 2–3 days
      warranty: 1 year
      bodyHeading: What we do with it
      body: |-
        First, we fully remove the steering wheel — carefully, disconnecting the battery and airbag. What we do next depends on the condition: if the leather is intact but the paint has worn off, we clean it, restore the texture, and repaint it with a compound that doesn't stick or stain hands. If the leather is torn or the stitching has come loose, we reupholster it with hand stitching following the original design.

        We also tidy up what usually gets damaged nearby: peeling buttons, worn plastic on steering column trims, and gloss on paddles.
      includesHeading: What's included
      includes:
        - Removal and installation of the steering wheel ensuring proper airbag functionality
        - Cleaning and texture restoration of the leather
        - Repainting or complete reupholstery with hand stitching
        - Repairing buttons and plastic trims
        - Color and stitching type selection matched to your interior
        - Airbag indicator check after assembly
      forWhomHeading: Who needs this
      forWhom:
        - The rim has worn down to shiny plastic or changed color
        - The leather has cracked or the stitching has come undone
        - The car is being prepared for sale, and the steering wheel reveals the mileage
        - Wanting a different material — for example, alcantara on the top section
      honestHeading: What to know in advance
      honest: We do not take on steering wheels with deployed airbags or signs of airbag replacement without service history — it’s a matter of your safety, not just cosmetics. In such cases, service comes first, then we.
