paint-protection-film:
  name: Защитная плёнка (PPF)
  short: Прозрачная полиуретановая броня против камней, песка и щёток на мойке.
  metaTitle: Оклейка защитной плёнкой PPF в Белграде — Details
  metaDescription: 'Оклейка кузова прозрачной защитной плёнкой в Белграде: перёд, полная оклейка, заворот кромок. Плёнки XPEL и SunTek.'
  heroEyebrow: Защита кузова
  heroTitle: Плёнка, которую не видно, и сколы, которых не будет
  heroLead: Полиуретан толщиной 190 микрон принимает на себя камни с трассы, песок и следы от щёток. Краска под ним остаётся заводской — а это то, что смотрят при продаже.
  priceFrom: от 690 € за перёд
  duration: 2–6 дней
  bodyHeading: Что это даёт
  body: |
    Главная ценность плёнки — не «блеск», а сохранённая заводская краска. Перекрашенное крыло видно любым толщиномером, и на осмотре перед покупкой это сразу минус к цене. Плёнка держит удар вместо лака: мелкие царапины на ней затягиваются сами на солнце, глубокие остаются на плёнке, а не на кузове.

    Мы режем выкройку под конкретный кузов на плоттере, а сложные места — бамперы, зеркала, стойки — подгоняем руками. Там, где панель позволяет, заворачиваем край внутрь: так стык не собирает грязь и не выдаёт себя тонкой серой полоской через год.

    Плёнку берём у XPEL и SunTek. Какая из них пойдёт на вашу машину, называем на осмотре — до того, как вы согласитесь на смету.
  includesHeading: Что входит
  includes:
    - Двухэтапная мойка, глина и обезжиривание перед наклейкой
    - Точечная полировка дефектов, которые иначе запечатались бы под плёнкой
    - Выкройка под вашу модель, ручная подгонка сложных элементов
    - Заворот кромок там, где геометрия панели это позволяет
    - Разбор ручек, зеркал и фонарей, если зона того требует
    - Контрольный осмотр через неделю после выдачи
  forWhomHeading: Кому это нужно
  forWhom:
    - Новая машина, которую хочется сохранить в заводском состоянии
    - Тёмный или матовый цвет, на котором видно каждую риску
    - Много трассы между городами и щебень на обочинах
    - Машина в лизинге или под скорую продажу, где важен отчёт по краске
  honestHeading: Когда мы отговариваем
  honest: 'Если машина уже перекрашена дешёвым лаком или на панели видны следы шпаклёвки — плёнку класть нельзя: при снятии она заберёт покрытие с собой. В таком случае мы честно скажем об этом на осмотре и предложим сначала привести лак в порядок.'
colour-change-wrap:
  name: Смена цвета плёнкой
  short: Новый цвет без покраски — и с возможностью вернуть заводской.
  metaTitle: Смена цвета автомобиля плёнкой в Белграде — Details
  metaDescription: 'Полная оклейка цветной плёнкой в Белграде: мат, сатин, глянец, текстуры. Обратимо, без перекраски, с сохранением заводского лака. Образцы на вашей машине.'
  heroEyebrow: Цвет
  heroTitle: Другой цвет. Тот же заводской лак под ним.
  heroLead: Плёнка меняет машину полностью, но остаётся обратимой. Через два года можно снять её и получить ту же краску, что была с завода, — чего не даст ни одна покраска.
  priceFrom: от 1 900 € за кузов
  duration: 4–7 дней
  bodyHeading: Почему плёнка, а не покраска
  body: |
    Покраска — это навсегда и это запись в истории автомобиля. Плёнка — это решение на несколько лет, которое можно отменить. При продаже вы снимаете её и отдаёте машину в родном цвете, с родным лаком под ней.

    Выбор цвета мы всегда делаем на вашей машине, а не по каталогу на столе: кладём образцы на кузов при дневном свете и смотрим, как цвет ведёт себя на ваших изгибах. Матовый на одной модели выглядит дорого, а на другой — плоско, и это видно только вживую.

    Цветные плёнки берём у 3M и HEXIS. Какую именно кладём, фиксируем в смете вместе с ценой и сроком.
  includesHeading: Что входит
  includes:
    - Подбор цвета образцами на вашем кузове при дневном свете
    - Разбор ручек, молдингов, фонарей и решёток
    - Оклейка с заворотом кромок в проёмах
    - Проклейка стыков и обработка углов феном
    - Инструкция по уходу за матом или сатином
    - Бесплатная правка мелких отслоений в первый месяц
  forWhomHeading: Кому это нужно
  forWhom:
    - Хочется другой цвет, но без потери заводской краски
    - Нужен мат, сатин или текстура, которых не бывает с завода
    - Машина в лизинге, где перекраска запрещена договором
    - Коммерческий автомобиль, который должен выглядеть узнаваемо
  honestHeading: Что нужно знать заранее
  honest: Плёнка не прячет вмятины и волны на кузове — наоборот, матовая подчёркивает их сильнее, чем глянец. Если на панелях есть геометрические дефекты, сначала кузовной ремонт, потом цвет. Мы скажем об этом на осмотре, а не после оклейки.
polishing-ceramic:
  name: Полировка и керамика
  short: Снимаем риски и паутинку, закрываем результат керамикой на годы.
  metaTitle: Полировка кузова и керамика в Белграде — Details
  metaDescription: Многоэтапная полировка с замером толщины лака и керамическое покрытие на 2–5 лет. Смотрим лак под лампой и показываем замеры. Студия Details, Белград.
  heroEyebrow: Лак
  heroTitle: Сначала убрать риски. Только потом что-то наносить.
  heroLead: Керамика поверх непрополированного лака просто консервирует паутинку на несколько лет. Мы сначала выводим дефекты, а покрытие кладём уже на готовую поверхность.
  priceFrom: от 450 € за автомобиль
  duration: 2–3 дня
  bodyHeading: Как это устроено
  body: |
    Полировка — это снятие тончайшего слоя лака вместе с рисками. Слой не бесконечный, поэтому мы начинаем с толщиномера: замеряем каждую панель и считаем, сколько запаса есть. Если на крыше или крыльях лак уже тонкий — работаем мягче или не трогаем панель вовсе.

    Дальше два или три прохода: режущий состав снимает основные дефекты, финишный убирает голограммы от машинки. Результат смотрим под лампой, которая показывает то, чего не видно на улице. И только после этого — обезжиривание и керамика. Полируем составами Koch-Chemie, керамику кладём Gtechniq.
  includesHeading: Что входит
  includes:
    - Замер толщины лака по всем панелям с записью результатов
    - Двух- или трёхэтапная полировка под контролем лампы
    - Обезжиривание поверхности перед нанесением
    - Керамическое покрытие с выдержкой в боксе
    - Обработка стёкол водоотталкивающим составом
    - Фотоотчёт до и после в одинаковом свете
  forWhomHeading: Кому это нужно
  forWhom:
    - Машина после нескольких лет автоматических моек
    - Тёмный цвет, на котором паутинка видна на любом солнце
    - Подготовка к продаже, когда важна первая секунда впечатления
    - Свежепригнанный автомобиль после перевозки и стоянок
  honestHeading: Когда мы отговариваем
  honest: Если толщиномер показывает критично тонкий лак, полировать нельзя — можно протереть до грунта. В такой ситуации мы предложим мягкий вариант без съёма или только защитное покрытие, и объясним, что именно увидели на замерах.
steering-wheel-restoration:
  name: Реставрация руля
  short: Затёртая кожа, лоснящийся обод и облезший пластик — в исходное состояние.
  metaTitle: Реставрация руля и перетяжка кожи в Белграде — Details
  metaDescription: 'Восстановление кожи руля в Белграде: перекраска, перетяжка, ремонт пластика и кнопок. Снимаем и ставим руль с подушкой безопасности. 2–3 дня.'
  heroEyebrow: Салон
  heroTitle: Первое, к чему прикасаются. И первое, что стареет.
  heroLead: 'Руль изнашивается быстрее всего салона: пот, солнце и крем для рук вытирают краску за пару лет. Восстановление стоит несоизмеримо дешевле нового руля и выглядит как заводской.'
  priceFrom: от 150 €
  duration: 2–3 дня
  bodyHeading: Что мы с ним делаем
  body: |
    Сначала снимаем руль целиком — аккуратно, с отключением аккумулятора и подушки безопасности. Дальше зависит от состояния: если кожа цела и вытерлась только краска, мы её очищаем, восстанавливаем фактуру и перекрашиваем составом, который не липнет и не пачкает руки. Если кожа порвана или прошивка разошлась — перетягиваем заново, с ручной прошивкой по оригинальному рисунку.

    Заодно приводим в порядок то, что обычно портится рядом: облезшие кнопки, потёртый пластик подрулевых накладок, глянец на лепестках.
  includesHeading: Что входит
  includes:
    - Снятие и установка руля с корректной работой с подушкой безопасности
    - Очистка и восстановление фактуры кожи
    - Перекраска или полная перетяжка с ручной прошивкой
    - Восстановление кнопок и пластиковых накладок
    - Подбор цвета и типа строчки под ваш салон
    - Проверка индикатора подушки после сборки
  forWhomHeading: Кому это нужно
  forWhom:
    - Обод вытерся до блестящего пластика или сменил цвет
    - Кожа потрескалась или разошлась по шву
    - Машина готовится к продаже, а руль выдаёт пробег
    - Хочется другой материал — например, алькантару на верхнем секторе
  honestHeading: Что нужно знать заранее
  honest: Мы не берёмся за рули со сработавшей подушкой безопасности или следами её замены без сервисной истории — это вопрос вашей безопасности, а не косметики. В таком случае сначала сервис, потом мы.
translations:
  sr:
    indexMetaTitle: 'Usluge detaljinga u Beogradu: PPF, poliranje, volan — Details'
    indexMetaDescription: Zaštitna folija PPF, promena boje, poliranje s keramickim premazom i restauracija volana. Cene, rokovi i poštena ograničenja za svaku uslugu.
    indexEyebrow: Usluge
    indexHeading: Četiri pravca, u svakom — do kraja
    indexLead: 'Za svaku uslugu u nastavku postoji posebna stranica: šta uključuje, koliko traje, kome odgovara i kada smo pošteni u odbijanju.'
    specsPriceLabel: Cena
    specsDurationLabel: Rok
    paint-protection-film:
      name: Zaštitna folija (PPF)
      short: Prozirna poliuretanska zaštita protiv kamenčića, peska i četki na pranju.
      metaTitle: Oklapanje zaštitnom folijom PPF u Beogradu — Details
      metaDescription: 'Oklapanje karoserije prozirnom zaštitnom folijom u Beogradu: prednji deo, potpuno oklapanje, zavrtnja ivica. Folije XPEL i SunTek.'
      heroEyebrow: Zaštita karoserije
      heroTitle: Folija koja se ne vidi, i oštećenja koja neće biti
      heroLead: Poliuretan debljine 190 mikrona prihvata kamenčiće s puta, pesak i tragove od četki. Boja ispod nje ostaje fabrička — a to je ono što se gleda prilikom prodaje.
      priceFrom: od 690 € za prednji deo
      duration: 2–6 dana
      bodyHeading: Šta to donosi
      body: |-
        Glavna vrednost folije nije „sjaj”, već očuvana fabrička boja. Prefarbano krilo može se videti bilo kojim mernim instrumentom, i na pregledu pre kupovine to odmah vodi ka manjku cene. Folija apsorbuje udarce umesto laka: sitne ogrebotine na njoj same se zarastaju na suncu, dok dublje ostaju na foliji, a ne na karoseriji.

        Izrađujemo uzorak pod tačno određenu karoseriju na plotteru, a složene delove — branike, ogledala, stubove — prilagođavamo ručno. Tamo gde panel to dozvoljava, uvijamo ivicu unutra: tako spoj ne skuplja prljavštinu i ne otkriva se tankom sivom linijom nakon godinu dana.

        Folije uzimamo od XPEL i SunTek. Koja od njih ide na vaš auto, saopštavamo na pregledu — pre nego što pristnete na budžet.
      includesHeading: Šta uključuje
      includes:
        - Dvofazno pranje, glina i odmašćivanje pre lepljenja
        - Tačkasto poliranje nedostataka koji bi inače ostali ispod folije
        - Uzorak za vaš model, ručna prilagodba složenih delova
        - Uvijanje ivica gde geometrija panela to dozvoljava
        - Rasklapanje ručki, ogledala i svetala, ako zona to zahteva
        - Kontrolni pregled nedelju dana nakon predaje
      forWhomHeading: Kome je ovo potrebno
      forWhom:
        - Nova mašina koju želite da sačuvate u fabričkom stanju
        - Tamna ili mat boja na kojoj se vidi svaka ogrebotina
        - Puno puta između gradova i šljunak na ivicama
        - Auto u lizingu ili na brzom prodaju gde je važan izveštaj o boji
      honestHeading: Kada vas odbijamo
      honest: 'Ako je auto već prefarban jeftinim lakom ili su na panelu vidljivi tragovi smese — foliju ne možemo staviti: prilikom skidanja uzela bi sa sobom premaz. U tom slučaju, pošteno ćemo vam reći o tome na pregledu i ponudićemo prvo da sredimo lak.'
    colour-change-wrap:
      name: Promena boje folijom
      short: Nova boja bez farbanja — i s mogućnošću vraćanja fabričkog.
      metaTitle: Promena boje automobila folijom u Beogradu — Details
      metaDescription: 'Potpuno oklapanje obojenom folijom u Beogradu: mat, saten, sjaj, teksture. Obnovljivo, bez farbanja, uz očuvanje fabričkog laka. Uzorci na vašem autu.'
      heroEyebrow: Boja
      heroTitle: Druga boja. Ista fabrička boja ispod.
      heroLead: Folija potpuno menja auto, ali ostaje obrnuta. Nakon dve godine može se skinuti i dobiti istu boju koja je bila s fabrike — što nijedno farbanje ne može dati.
      priceFrom: od 1 900 € za karoseriju
      duration: 4–7 dana
      bodyHeading: Zašto folija, a ne farba
      body: |-
        Farba je zauvek i to je zapis u istoriji automobila. Folija je rešenje na nekoliko godina koje se može otkazati. Prilikom prodaje skidate je i predajete auto u svojoj boji, s originalnim lakom ispod.

        Izbor boje uvek radimo na vašem automobilu, a ne po katalogu na stolu: stavljamo uzorke na karoseriju pri dnevnom svetlu i gledamo kako se boja ponaša na vašim krivinama. Mat na jednom modelu izgleda skupo, dok na drugom izgleda ravno, i to se vidi samo uživo.

        Obojene folije nabavljamo od 3M i HEXIS. Koju tačno stavljamo, beležimo u budžetu zajedno s cenom i rokom.
      includesHeading: Šta uključuje
      includes:
        - Biranje boje uzorkom na vašoj karoseriji pri dnevnom svetlu
        - Rasklapanje ručki, letvica, svetala i rešetki
        - Oklapanje s uvijanjem ivica na otvorima
        - Završavanje spojeva i obrada uglova fenom
        - Uputstvo za održavanje mata ili satena
        - Besplatna korekcija sitnih odlepljenja u prvom mesecu
      forWhomHeading: Kome je ovo potrebno
      forWhom:
        - Želi drugačiju boju, ali bez gubitka fabričke boje
        - Potrebni mat, saten ili teksture koje ne dolaze iz fabrike
        - Auto u lizingu gde je farbanje zabranjeno ugovorom
        - Komercijalni auto koji mora izgledati prepoznatljivo
      honestHeading: Šta treba znati unapred
      honest: Folija ne sakriva udubljenja i talase na karoseriji — naprotiv, mat još više naglašava nego sjaj. Ako na panelima postoje geometrijske greške, prvo karoserijski popravak, pa boja. O tome ćemo vam reći na pregledu, a ne posle oklapanja.
    polishing-ceramic:
      name: Poliranje i keramika
      short: Uklanjamo ogrebotine i paučinu, zatvaramo rezultat keramikom na godine.
      metaTitle: Poliranje karoserije i keramika u Beogradu — Details
      metaDescription: Višestepeno poliranje s merenjem debljine laka i keramički premaz na 2–5 godina. Gledamo lak pod lampom i pokazujemo merenja. Studio Details, Beograd.
      heroEyebrow: Lak
      heroTitle: Prvo ukloniti ogrebotine. Tek onda nešto nanositi.
      heroLead: Keramika preko nepoliranog laka jednostavno konzervira paučinu na nekoliko godina. Prvo uklanjamo nedostatke, a premaz postavljamo na spremnu površinu.
      priceFrom: od 450 € za automobil
      duration: 2–3 dana
      bodyHeading: Kako to funkcioniše
      body: |-
        Poliranje je uklanjanje najtanjeg sloja laka zajedno s ogrebotinama. Sloj nije beskonačan, stoga počinjemo s mernim instrumentom: merimo svaku panel i računamo koliko imamo viška. Ako je na krovu ili krilima lak već tanak — radimo pažljivije ili se panel uopšte ne dotičemo.

        Dalje dva ili tri prolaza: rezni sastav uklanja osnovne nedostatke, završni uklanja holograme od mašine. Rezultat gledamo pod lampom koja pokazuje ono što nije vidljivo napolju. I tek nakon toga — odmašćivanje i keramika. Poliramo sastavima Koch-Chemie, keramiku stavljamo Gtechniq.
      includesHeading: Šta uključuje
      includes:
        - Merenje debljine laka po svim panelima s beleženjem rezultata
        - Dvo- ili trofazno poliranje pod kontrolom lampe
        - Odmašćivanje površine pre nanošenja
        - Keramički premaz s zadržavanjem u boxu
        - Obrada stakala vodoodbojnim sastavom
        - Fotoizveštaj pre i posle u istom svetlu
      forWhomHeading: Kome je ovo potrebno
      forWhom:
        - Automobil posle nekoliko godina automatskog pranja
        - Tamna boja, na kojoj je mrežica vidljiva na svakom suncu
        - Priprema za prodaju, kada je važna prva sekunda utiska
        - Svežepreveden automobil posle transporta i parkiranja
      honestHeading: Kada vas odbijamo
      honest: Ako debljinomer pokazuje kritično tanki lak, poliranje nije moguće – može se oštetiti do osnove. U takvoj situaciji ponudićemo blagu opciju bez skidanja ili samo zaštitni premaz, i objasnićemo šta smo tačno videli na merenju.
    steering-wheel-restoration:
      name: Restauracija volana
      short: Izgubljena koža, sjajan obod i oljušteni plastika – u prvobitno stanje.
      metaTitle: Restauracija volana i presvlačenje kože u Beogradu – Details
      metaDescription: 'Obnova kože volana u Beogradu: prefarbavanje, presvlačenje, popravka plastike i dugmadi. Skidamo i postavljamo volan sa vazdušnim jastučićem. 2–3 dana.'
      heroEyebrow: Salon
      heroTitle: Prvo, što se dodiruje. I prvo, što stari.
      heroLead: 'Volan se troši brže od ostatka enterijera: znoj, sunce i krem za ruke skidaju boju za par godina. Obnova je neuporedivo jeftinija od novog volana i izgleda kao fabrički.'
      priceFrom: od 150 €
      duration: 2–3 dana
      bodyHeading: Šta radimo s njim
      body: |-
        Prvo skidamo volan u celini – pažljivo, sa isključenim akumulatorom i vazdušnim jastučićem. Dalje zavisi od stanja: ako je koža cela i samo je boja izbledela, čistimo je, obnavljamo teksturu i prefarbavamo sastavom koji se ne lepi i ne prlja ruke. Ako je koža pocepana ili su šavovi popustili – presvlačimo ponovo, sa ručnom šavom prema originalnom uzorku.

        Pored toga, dovedemo u red ono što obično propada pored: oljuštene dugmadi, pohabana plastika oko volana, sjaj na papučicama.
      includesHeading: Šta uključuje
      includes:
        - Skidanje i postavljanje volana sa pravilnim radom vazdušnog jastučića
        - Čišćenje i obnova teksture kože
        - Prefarbavanje ili potpuno presvlačenje sa ručnom šavom
        - Obnova dugmadi i plastičnih delova
        - Odabir boje i vrste šava prema vašem enterijeru
        - Provera indikatora vazdušnog jastučića posle montaže
      forWhomHeading: Kome je ovo potrebno
      forWhom:
        - Obod je izbrušen do sjajnog plastike ili je promenio boju
        - Koža je ispucala ili su šavovi popustili
        - Automobil se priprema za prodaju, a volan otkriva pređene kilometre
        - Želite drugi materijal – na primer, alkantru na gornjem delu
      honestHeading: Šta treba znati unapred
      honest: Ne preuzimamo volane sa aktiviranim vazdušnim jastučićem ili tragovima njegove zamene bez servisne istorije – to je pitanje vaše sigurnosti, a ne estetike. U tom slučaju prvo servis, pa onda mi.
  en:
    indexMetaTitle: 'Detailing Services in Belgrade: PPF, Polishing, Steering Wheel – Details'
    indexMetaDescription: PPF, colour-change wrap, machine polishing with ceramic coating, and steering wheel restoration. Prices, timelines, and honest limitations for each service.
    indexEyebrow: Services
    indexHeading: Four specializations, each taken to the limit
    indexLead: 'For each service below, there is a separate page: what it includes, how long it takes, who it suits, and when we honestly advise against it.'
    specsPriceLabel: Price
    specsDurationLabel: Duration
    paint-protection-film:
      name: Paint Protection Film (PPF)
      short: Transparent polyurethane shield against stones, sand, and car wash brushes.
      metaTitle: Paint Protection Film Installation in Belgrade – Details
      metaDescription: 'Installation of transparent protective film in Belgrade: front, full coverage, edge wrapping. XPEL and SunTek films.'
      heroEyebrow: Body Protection
      heroTitle: Invisible film, no chips
      heroLead: 190-micron thick polyurethane absorbs stones from the road, sand, and marks left by brushes. The paint underneath remains factory original — that's what matters when selling.
      priceFrom: from 690 € for the front
      duration: 2–6 days
      bodyHeading: What It Offers
      body: |-
        The main value of the film is not the 'shine', but the preserved factory paint. Repainted panels can be detected by any thickness gauge, which will lower the price during pre-purchase inspection. The film absorbs impacts instead of the clear coat: minor scratches heal themselves in sunlight, while deeper ones remain in the film, not on the body.

        We cut the pattern for your specific model on a plotter, and difficult areas like bumpers, mirrors, and pillars are adjusted by hand. Where the panel allows, we tuck the edge inwards: this prevents dirt buildup at the seam and avoids a thin gray line appearing after a year.

        We use films from XPEL and SunTek. We will recommend which one is suitable for your car during the inspection — before you agree to the estimate.
      includesHeading: What’s Included
      includes:
        - Two-stage wash, clay treatment, and degreasing before application
        - Spot polishing of defects that would otherwise be sealed under the film
        - Pattern tailored to your model, hand adjustment of complex elements
        - Edge wrapping where the panel geometry allows it
        - Disassembly of handles, mirrors, and lights if required
        - Follow-up inspection one week after delivery
      forWhomHeading: Who Needs This
      forWhom:
        - New car that you want to keep in factory condition
        - Dark or matte paint that shows every scratch
        - A lot of highway driving with gravel on the sides
        - Cars on lease or those intended for quick sale, where paint report is important
      honestHeading: When We Advise Against It
      honest: 'If the car has already been repainted with cheap paint or shows signs of filler on the panel — the film should not be applied: removing it will take the coating with it. In this case, we will honestly inform you during the inspection and suggest bringing the paint back in order first.'
    colour-change-wrap:
      name: Colour Change Wrap
      short: New color without repainting — and the option to revert back to factory.
      metaTitle: Colour Change of Your Car with Wrap in Belgrade – Details
      metaDescription: 'Full wrap with colored film in Belgrade: matte, satin, glossy, textures. Reversible, no repaint required, preserving factory paint. Samples on your vehicle.'
      heroEyebrow: Color
      heroTitle: A different color. The same factory paint underneath.
      heroLead: The wrap completely changes the car but remains reversible. After two years, it can be removed to reveal the same paint that was factory standard — something no paint can offer.
      priceFrom: from 1,900 € for the body
      duration: 4–7 days
      bodyHeading: Why Film, Not Paint
      body: |-
        Painting is forever and is recorded in the car's history. The wrap is a temporary solution that can be undone. When selling, you remove the wrap and present the car in its original color, with the original clear coat underneath.

        We always choose the color on your car, not from a catalog on the table: we place samples on the body in daylight and see how the color behaves on your curves. Matte on one model looks expensive, while on another it appears flat, which is only visible in person.

        We source colored films from 3M and HEXIS. The specific film we use is documented in the estimate along with the price and timeline.
      includesHeading: What’s Included
      includes:
        - Color selection using samples on your vehicle in daylight
        - Disassembly of handles, moldings, lights, and grilles
        - Wrapping with edge tucking in openings
        - Seam taping and heat sealing of corners
        - Care instructions for matte or satin finishes
        - Free touch-ups for small lifts in the first month
      forWhomHeading: Who Needs This
      forWhom:
        - Wanting a different color without sacrificing factory paint
        - Need matte, satin, or textures not available from the factory
        - Leased cars where repainting is prohibited by contract
        - Commercial vehicles that need to look distinguishable
      honestHeading: What You Need to Know in Advance
      honest: The film does not hide dents and waves on the body — on the contrary, matte emphasizes them more than gloss. If there are geometric defects on the panels, body repair is needed first, then color. We will inform you of this during the inspection, not after wrapping.
    polishing-ceramic:
      name: Polishing and Ceramic Coating
      short: We remove scratches and swirls, sealing the result with ceramic for years.
      metaTitle: Body Polishing and Ceramic Coating in Belgrade – Details
      metaDescription: Multi-stage polishing with thickness measurement of the clear coat and ceramic coating lasting 2–5 years. We inspect the clear coat under light and present measurements. Studio Details, Belgrade.
      heroEyebrow: Clear Coat
      heroTitle: First eliminate the scratches. Only then apply something.
      heroLead: Ceramic over unpolished clear coat simply conserves swirls for years. We first eliminate defects and then apply the coating to a finished surface.
      priceFrom: from 450 € per vehicle
      duration: 2–3 days
      bodyHeading: How It Works
      body: |-
        Polishing involves removing a very thin layer of clear coat along with scratches. The layer is not infinite, so we start with a thickness gauge: measuring each panel and calculating how much material is left. If the roof or fenders have thin clear coat, we either work more gently or leave the panel untouched.

        Next, two or three passes: cutting compound removes the major defects, while finishing polish eliminates holograms from the machine. We inspect the result under a lamp that reveals what is invisible outdoors. Only after this do we proceed to degreasing and applying ceramic coating. We polish using Koch-Chemie products and apply Gtechniq ceramic.
      includesHeading: What’s Included
      includes:
        - Thickness measurement of the clear coat on all panels with recorded results
        - Two or three-stage polishing under lamp supervision
        - Degreasing the surface before application
        - Ceramic coating with cure time in the booth
        - Glass treatment with a water-repellent solution
        - Before and after photo report in the same lighting
      forWhomHeading: Who Needs This
      forWhom:
        - A car after several years of automatic washes
        - A dark color where swirls are visible in any sunlight
        - Preparation for sale when the first impression matters
        - A freshly imported car after transport and parking
      honestHeading: When We Advise Against It
      honest: If the thickness gauge shows critically thin paint, polishing is not possible — it can wear down to the primer. In such cases, we will suggest a gentle option without removal or only a protective coating, explaining what exactly we saw in the measurements.
    steering-wheel-restoration:
      name: Steering Wheel Restoration
      short: Worn leather, shiny rim, and peeling plastic — returning to original condition.
      metaTitle: Steering Wheel Restoration and Leather Reupholstering in Belgrade — Details
      metaDescription: 'Steering wheel leather restoration in Belgrade: repainting, reupholstering, plastic and button repairs. We remove and install the steering wheel with the airbag. 2–3 days.'
      heroEyebrow: Interior
      heroTitle: The first thing you touch. And the first thing to age.
      heroLead: 'The steering wheel wears out faster than the rest of the interior: sweat, sunlight, and hand cream wear off the paint in just a couple of years. Restoration is incomparably cheaper than a new steering wheel and looks factory-fresh.'
      priceFrom: from 150 €
      duration: 2–3 days
      bodyHeading: What we do with it
      body: |-
        First, we completely remove the steering wheel — carefully, disconnecting the battery and the airbag. What comes next depends on its condition: if the leather is intact and only the paint is worn, we clean it, restore the texture, and repaint with a non-sticky, non-staining solution. If the leather is torn or the stitching has come apart — we reupholster it with hand stitching following the original pattern.

        At the same time, we take care of what usually gets damaged nearby: worn buttons, scratched plastic covers, and gloss finish on the paddles.
      includesHeading: What’s Included
      includes:
        - Removal and installation of the steering wheel with proper airbag operation
        - Cleaning and texture restoration of the leather
        - Repainting or complete reupholstering with hand stitching
        - Restoration of buttons and plastic covers
        - Color selection and stitching type to match your interior
        - Checking the airbag indicator after assembly
      forWhomHeading: Who Needs This
      forWhom:
        - The rim has worn down to shiny plastic or changed color
        - The leather is cracked or has split seams
        - The car is being prepared for sale, and the steering wheel shows wear
        - Looking for a different material — for example, alcantara on the upper segment
      honestHeading: What You Need to Know in Advance
      honest: We do not take on steering wheels with deployed airbags or signs of their replacement without service history — this is a matter of your safety, not just cosmetics. In such cases, first the service, then us.
