paint-protection-film:
  name: Защитная плёнка (PPF)
  short: Прозрачная полиуретановая броня против камней, песка и щёток на мойке.
  metaTitle: Оклейка защитной плёнкой PPF в Белграде — PRIZMA
  metaDescription: 'Оклейка кузова прозрачной защитной плёнкой в Белграде: перёд, полная оклейка, заворот кромок. Плёнки XPEL, SunTek, 3M. Гарантия до 10 лет.'
  heroEyebrow: Защита кузова
  heroTitle: Плёнка, которую не видно, и сколы, которых не будет
  heroLead: Полиуретан толщиной 200 микрон принимает на себя камни с трассы, песок и следы от щёток. Краска под ним остаётся заводской — а это то, что смотрят при продаже.
  priceFrom: от 690 € за перёд
  duration: 2–6 дней
  warranty: до 10 лет от производителя
  bodyHeading: Что это на самом деле даёт
  body: |
    Главная ценность плёнки — не «блеск», а сохранённая заводская краска. Перекрашенное крыло видно любым толщиномером, и на осмотре перед покупкой это сразу минус к цене. Плёнка держит удар вместо лака: мелкие царапины на ней затягиваются сами на солнце, глубокие остаются на плёнке, а не на кузове.

    Мы режем выкройку под конкретный кузов на плоттере, а сложные места — бамперы, зеркала, стойки — подгоняем руками. Там, где панель позволяет, заворачиваем край внутрь: так стык не собирает грязь и не выдаёт себя тонкой серой полоской через год.
  includesHeading: Что входит
  includes:
    - Двухэтапная мойка, глина и обезжиривание перед наклейкой
    - Точечная полировка дефектов, которые иначе запечатались бы под плёнкой
    - Выкройка под вашу модель, ручная подгонка сложных элементов
    - Заворот кромок там, где геометрия панели это позволяет
    - Разбор ручек, зеркал и фонарей, если зона того требует
    - Контрольный осмотр через неделю после выдачи
  forWhomHeading: Кому это нужно
  forWhom:
    - Новая машина, которую хочется сохранить в заводском состоянии
    - Тёмный или матовый цвет, на котором видно каждую риску
    - Много трассы между городами и щебень на обочинах
    - Машина в лизинге или под скорую продажу, где важен отчёт по краске
  honestHeading: Когда мы отговариваем
  honest: 'Если машина уже перекрашена дешёвым лаком или на панели видны следы шпаклёвки — плёнку класть нельзя: при снятии она заберёт покрытие с собой. В таком случае мы честно скажем об этом на осмотре и предложим сначала привести лак в порядок.'
colour-change-wrap:
  name: Смена цвета плёнкой
  short: Новый цвет без покраски — и с возможностью вернуть заводской.
  metaTitle: Смена цвета автомобиля плёнкой в Белграде — PRIZMA
  metaDescription: 'Полная оклейка цветной плёнкой в Белграде: мат, сатин, глянец, текстуры. Обратимо, без перекраски, с сохранением заводского лака. Образцы на вашей машине.'
  heroEyebrow: Цвет
  heroTitle: Другой цвет. Тот же заводской лак под ним.
  heroLead: Плёнка меняет машину полностью, но остаётся обратимой. Через два года можно снять её и получить ту же краску, что была с завода, — чего не даст ни одна покраска.
  priceFrom: от 1 900 € за кузов
  duration: 4–7 дней
  warranty: 3–5 лет на плёнку
  bodyHeading: Почему плёнка, а не покраска
  body: |
    Покраска — это навсегда и это запись в истории автомобиля. Плёнка — это решение на несколько лет, которое можно отменить. При продаже вы снимаете её и отдаёте машину в родном цвете, с родным лаком под ней.

    Выбор цвета мы всегда делаем на вашей машине, а не по каталогу на столе: кладём образцы на кузов при дневном свете и смотрим, как цвет ведёт себя на ваших изгибах. Матовый на одной модели выглядит дорого, а на другой — плоско, и это видно только вживую.
  includesHeading: Что входит
  includes:
    - Подбор цвета образцами на вашем кузове при дневном свете
    - Разбор ручек, молдингов, фонарей и решёток
    - Оклейка с заворотом кромок в проёмах
    - Проклейка стыков и обработка углов феном
    - Инструкция по уходу за матом или сатином
    - Бесплатная правка мелких отслоений в первый месяц
  forWhomHeading: Кому это нужно
  forWhom:
    - Хочется другой цвет, но без потери заводской краски
    - Нужен мат, сатин или текстура, которых не бывает с завода
    - Машина в лизинге, где перекраска запрещена договором
    - Коммерческий автомобиль, который должен выглядеть узнаваемо
  honestHeading: Что нужно знать заранее
  honest: Плёнка не прячет вмятины и волны на кузове — наоборот, матовая подчёркивает их сильнее, чем глянец. Если на панелях есть геометрические дефекты, сначала кузовной ремонт, потом цвет. Мы скажем об этом на осмотре, а не после оклейки.
polishing-ceramic:
  name: Полировка и керамика
  short: Снимаем риски и паутинку, закрываем результат керамикой на годы.
  metaTitle: Полировка кузова и керамическое покрытие в Белграде — PRIZMA
  metaDescription: Многоэтапная полировка с замером толщины лака и керамическое покрытие 2–5 лет. Фотоотчёт под лампой до и после. Студия PRIZMA, Белград.
  heroEyebrow: Лак
  heroTitle: Сначала убрать риски. Только потом что-то наносить.
  heroLead: Керамика поверх непрополированного лака просто консервирует паутинку на несколько лет. Мы сначала выводим дефекты, а покрытие кладём уже на готовую поверхность.
  priceFrom: от 450 € за автомобиль
  duration: 2–3 дня
  warranty: 2–5 лет на покрытие
  bodyHeading: Как это устроено
  body: |
    Полировка — это снятие тончайшего слоя лака вместе с рисками. Слой не бесконечный, поэтому мы начинаем с толщиномера: замеряем каждую панель и считаем, сколько запаса есть. Если на крыше или крыльях лак уже тонкий — работаем мягче или не трогаем панель вовсе.

    Дальше два или три прохода: режущий состав снимает основные дефекты, финишный убирает голограммы от машинки. Результат смотрим под лампой, которая показывает то, чего не видно на улице. И только после этого — обезжиривание и керамика.
  includesHeading: Что входит
  includes:
    - Замер толщины лака по всем панелям с записью результатов
    - Двух- или трёхэтапная полировка под контролем лампы
    - Обезжиривание поверхности перед нанесением
    - Керамическое покрытие с выдержкой в боксе
    - Обработка стёкол водоотталкивающим составом
    - Фотоотчёт до и после в одинаковом свете
  forWhomHeading: Кому это нужно
  forWhom:
    - Машина после нескольких лет автоматических моек
    - Тёмный цвет, на котором паутинка видна на любом солнце
    - Подготовка к продаже, когда важна первая секунда впечатления
    - Свежепригнанный автомобиль после перевозки и стоянок
  honestHeading: Когда мы отговариваем
  honest: Если толщиномер показывает критично тонкий лак, полировать нельзя — можно протереть до грунта. В такой ситуации мы предложим мягкий вариант без съёма или только защитное покрытие, и объясним, что именно увидели на замерах.
steering-wheel-restoration:
  name: Реставрация руля
  short: Затёртая кожа, лоснящийся обод и облезший пластик — в исходное состояние.
  metaTitle: Реставрация руля и перетяжка кожи в Белграде — PRIZMA
  metaDescription: 'Восстановление кожи руля в Белграде: перекраска, перетяжка, ремонт пластика и кнопок. Снимаем и ставим руль с подушкой безопасности. 2–3 дня.'
  heroEyebrow: Салон
  heroTitle: Первое, к чему прикасаются. И первое, что стареет.
  heroLead: 'Руль изнашивается быстрее всего салона: пот, солнце и крем для рук вытирают краску за пару лет. Восстановление стоит несоизмеримо дешевле нового руля и выглядит как заводской.'
  priceFrom: от 150 €
  duration: 2–3 дня
  warranty: 1 год
  bodyHeading: Что мы с ним делаем
  body: |
    Сначала снимаем руль целиком — аккуратно, с отключением аккумулятора и подушки безопасности. Дальше зависит от состояния: если кожа цела и вытерлась только краска, мы её очищаем, восстанавливаем фактуру и перекрашиваем составом, который не липнет и не пачкает руки. Если кожа порвана или прошивка разошлась — перетягиваем заново, с ручной прошивкой по оригинальному рисунку.

    Заодно приводим в порядок то, что обычно портится рядом: облезшие кнопки, потёртый пластик подрулевых накладок, глянец на лепестках.
  includesHeading: Что входит
  includes:
    - Снятие и установка руля с корректной работой с подушкой безопасности
    - Очистка и восстановление фактуры кожи
    - Перекраска или полная перетяжка с ручной прошивкой
    - Восстановление кнопок и пластиковых накладок
    - Подбор цвета и типа строчки под ваш салон
    - Проверка индикатора подушки после сборки
  forWhomHeading: Кому это нужно
  forWhom:
    - Обод вытерся до блестящего пластика или сменил цвет
    - Кожа потрескалась или разошлась по шву
    - Машина готовится к продаже, а руль выдаёт пробег
    - Хочется другой материал — например, алькантару на верхнем секторе
  honestHeading: Что нужно знать заранее
  honest: Мы не беремся за рули со сработавшей подушкой безопасности или следами её замены без сервисной истории — это вопрос вашей безопасности, а не косметики. В таком случае сначала сервис, потом мы.
translations:
  sr:
    indexMetaTitle: Usluge detailinga u Beogradu — PRIZMA
    indexMetaDescription: Zaštitna PPF folija, promena boje, poliranje sa keramičkom zaštitom i restauracija volana. Cene, rokovi i iskrena ograničenja za svaku uslugu.
    indexEyebrow: Usluge
    indexHeading: Četiri pravca, svaki do kraja
    indexLead: 'Za svaku uslugu postoji zasebna stranica: šta je uključeno, koliko traje, kome odgovara i kada vas iskreno odgovaramo.'
    specsPriceLabel: Cena
    specsDurationLabel: Rok
    specsWarrantyLabel: Garancija
    paint-protection-film:
      name: Zaštitna folija (PPF)
      short: Providan poliuretanski oklop protiv kamenčića, peska i četki na perionici.
      metaTitle: Zaštitna PPF folija u Beogradu — PRIZMA
      metaDescription: 'Postavljanje providne zaštitne folije u Beogradu: prednji deo, cela karoserija, prepust preko ivica. Folije XPEL, SunTek, 3M. Garancija do 10 godina.'
      heroEyebrow: Zaštita karoserije
      heroTitle: Folija koja se ne vidi i ogrebotine kojih neće biti
      heroLead: Poliuretan od 200 mikrona prima kamenčiće sa puta, pesak i tragove četki umesto vašeg laka. Boja ispod ostaje fabrička — a to je ono što se gleda pri prodaji.
      priceFrom: od 690 € za prednji deo
      duration: 2–6 dana
      warranty: do 10 godina od proizvođača
      bodyHeading: Šta to zaista donosi
      body: |
        Prava vrednost folije nije „sjaj“, nego sačuvana fabrička boja. Prefarban blatobran vidi svaki merač debljine, i na pregledu pre kupovine to odmah obara cenu. Folija prima udarac umesto laka: sitne ogrebotine na njoj same nestaju na suncu, a duboke ostaju na foliji, ne na karoseriji.

        Kroj režemo ploterom prema konkretnom modelu, a složena mesta — branike, retrovizore, stubove — doterujemo rukom. Tamo gde panel dozvoljava, ivicu prepuštamo unutra: tako spoj ne skuplja prljavštinu i ne oda se tankom sivom linijom posle godinu dana.
      includesHeading: Šta je uključeno
      includes:
        - Pranje u dve faze, glina i odmašćivanje pre postavljanja
        - Tačkasto poliranje defekata koji bi inače ostali zapečaćeni ispod folije
        - Kroj za vaš model i ručno doterivanje složenih delova
        - Prepust preko ivica gde geometrija panela to dozvoljava
        - Skidanje kvaka, retrovizora i svetala kada zona to traži
        - Kontrolni pregled nedelju dana posle predaje
      forWhomHeading: Kome ovo treba
      forWhom:
        - Nov automobil koji želite da zadržite u fabričkom stanju
        - Tamna ili mat boja na kojoj se vidi svaka ogrebotina
        - Mnogo vožnje magistralom i tucanik pored puta
        - Auto na lizingu ili pred prodaju, gde je izveštaj o laku bitan
      honestHeading: Kada vas odgovaramo
      honest: 'Ako je auto već prefarban jeftinim lakom ili se na panelu vide tragovi kita, folija ne sme da ide: pri skidanju će poneti premaz sa sobom. U tom slučaju ćemo vam to iskreno reći na pregledu i predložiti da se lak prvo dovede u red.'
    colour-change-wrap:
      name: Promena boje folijom
      short: Nova boja bez farbanja — uz mogućnost da se vrati fabrička.
      metaTitle: Promena boje automobila folijom u Beogradu — PRIZMA
      metaDescription: 'Potpuna promena boje folijom u Beogradu: mat, saten, sjaj, teksture. Reverzibilno, bez farbanja, uz očuvan fabrički lak. Uzorci na vašem automobilu.'
      heroEyebrow: Boja
      heroTitle: Druga boja. Isti fabrički lak ispod nje.
      heroLead: Folija menja automobil iz temelja, ali ostaje reverzibilna. Za dve godine možete je skinuti i dobiti isti lak koji je izašao iz fabrike — što vam nijedno farbanje ne daje.
      priceFrom: od 1.900 € za karoseriju
      duration: 4–7 dana
      warranty: 3–5 godina na foliju
      bodyHeading: Zašto folija, a ne farbanje
      body: |
        Farbanje je trajno i ostaje zapisano u istoriji automobila. Folija je rešenje na nekoliko godina koje možete poništiti. Pri prodaji je skinete i predate auto u originalnoj boji, sa originalnim lakom ispod.

        Boju uvek biramo na vašem automobilu, a ne iz kataloga na stolu: stavljamo uzorke na karoseriju po dnevnom svetlu i gledamo kako se boja ponaša na vašim linijama. Mat na jednom modelu izgleda skupo, a na drugom ravno, i to se vidi samo uživo.
      includesHeading: Šta je uključeno
      includes:
        - Izbor boje uzorcima na vašoj karoseriji po dnevnom svetlu
        - Skidanje kvaka, lajsni, svetala i maski
        - Postavljanje folije sa prepustom preko ivica u otvorima
        - Zatvaranje spojeva i obrada uglova fenom
        - Uputstvo za održavanje mat ili saten površine
        - Besplatno doterivanje sitnih odlepljenja u prvom mesecu
      forWhomHeading: Kome ovo treba
      forWhom:
        - Želite drugu boju, ali bez gubitka fabričkog laka
        - Treba vam mat, saten ili tekstura kakve nema iz fabrike
        - Auto je na lizingu gde je farbanje zabranjeno ugovorom
        - Komercijalno vozilo koje mora da bude prepoznatljivo
      honestHeading: Šta treba znati unapred
      honest: Folija ne skriva udubljenja i talase na limu — naprotiv, mat ih naglašava jače nego sjaj. Ako na panelima ima geometrijskih nepravilnosti, prvo limarija, pa onda boja. To ćemo vam reći na pregledu, a ne posle postavljanja.
    polishing-ceramic:
      name: Poliranje i keramika
      short: Skidamo ogrebotine i paučinu, pa rezultat zatvaramo keramikom na godine.
      metaTitle: Poliranje karoserije i keramička zaštita u Beogradu — PRIZMA
      metaDescription: Višefazno poliranje sa merenjem debljine laka i keramička zaštita 2–5 godina. Foto-izveštaj pod lampom pre i posle. Studio PRIZMA, Beograd.
      heroEyebrow: Lak
      heroTitle: Prvo skinuti ogrebotine. Tek onda bilo šta nanositi.
      heroLead: Keramika preko neispoliranog laka samo konzervira paučinu na nekoliko godina. Mi prvo izvučemo defekte, a premaz stavljamo na već gotovu površinu.
      priceFrom: od 450 € po automobilu
      duration: 2–3 dana
      warranty: 2–5 godina na premaz
      bodyHeading: Kako to funkcioniše
      body: |
        Poliranje je skidanje najtanjeg sloja laka zajedno sa ogrebotinama. Taj sloj nije neiscrpan, pa počinjemo meračem debljine: merimo svaki panel i računamo koliko rezerve ima. Ako je na krovu ili blatobranima lak već tanak, radimo mekše ili panel uopšte ne diramo.

        Zatim idu dva ili tri prolaza: gruba pasta skida glavne defekte, finišna uklanja hologram od mašine. Rezultat gledamo pod lampom koja pokazuje ono što se napolju ne vidi. I tek posle toga — odmašćivanje i keramika.
      includesHeading: Šta je uključeno
      includes:
        - Merenje debljine laka na svim panelima uz zapisane rezultate
        - Poliranje u dve ili tri faze pod kontrolom lampe
        - Odmašćivanje površine pre nanošenja
        - Keramička zaštita sa odležavanjem u boksu
        - Obrada stakala vodoodbojnim preparatom
        - Foto-izveštaj pre i posle pri istom svetlu
      forWhomHeading: Kome ovo treba
      forWhom:
        - Auto posle nekoliko godina automatskih perionica
        - Tamna boja na kojoj se paučina vidi na svakom suncu
        - Priprema za prodaju, gde je prva sekunda utiska presudna
        - Sveže uvezen automobil posle transporta i parkinga
      honestHeading: Kada vas odgovaramo
      honest: Ako merač pokaže kritično tanak lak, ne sme se polirati — može se probiti do temelja. U toj situaciji predložićemo blagu varijantu bez skidanja ili samo zaštitni premaz, i objasnićemo šta smo tačno videli na merenjima.
    steering-wheel-restoration:
      name: Restauracija volana
      short: Izlizana koža, sjajni obruč i oljušten plastika — nazad u prvobitno stanje.
      metaTitle: Restauracija volana i presvlačenje kože u Beogradu — PRIZMA
      metaDescription: 'Obnova kože volana u Beogradu: prefarbavanje, presvlačenje, popravka plastike i tastera. Skidamo i vraćamo volan sa vazdušnim jastukom. 2–3 dana.'
      heroEyebrow: Enterijer
      heroTitle: Prvo čega se dotaknete. I prvo što ostari.
      heroLead: 'Volan se troši brže od celog enterijera: znoj, sunce i krema za ruke skinu boju za par godina. Obnova košta neuporedivo manje od novog volana, a izgleda fabrički.'
      priceFrom: od 150 €
      duration: 2–3 dana
      warranty: 1 godina
      bodyHeading: Šta radimo sa njim
      body: |
        Prvo skidamo ceo volan — pažljivo, uz isključen akumulator i vazdušni jastuk. Dalje zavisi od stanja: ako je koža čitava a skinula se samo boja, čistimo je, vraćamo teksturu i prefarbavamo preparatom koji se ne lepi i ne prlja ruke. Ako je koža pukla ili se šav razišao — presvlačimo je iznova, sa ručnim šavom po originalnom uzorku.

        Usput sredimo i ono što obično strada u blizini: oljuštene tastere, izlizanu plastiku maski ispod volana i sjaj na pločicama menjača.
      includesHeading: Šta je uključeno
      includes:
        - Skidanje i vraćanje volana uz ispravan rad sa vazdušnim jastukom
        - Čišćenje i obnova teksture kože
        - Prefarbavanje ili potpuno presvlačenje sa ručnim šavom
        - Obnova tastera i plastičnih maski
        - Izbor boje i tipa konca prema vašem enterijeru
        - Provera lampice vazdušnog jastuka posle sklapanja
      forWhomHeading: Kome ovo treba
      forWhom:
        - Obruč se izlizao do sjajne plastike ili promenio boju
        - Koža je ispucala ili se razišla po šavu
        - Auto se sprema za prodaju, a volan odaje kilometražu
        - Želite drugi materijal — na primer alkantaru na gornjem delu
      honestHeading: Šta treba znati unapred
      honest: Ne prihvatamo volane sa aktiviranim vazdušnim jastukom ili tragovima njegove zamene bez servisne istorije — to je pitanje vaše bezbednosti, ne kozmetike. U tom slučaju prvo servis, pa onda mi.
  en:
    indexMetaTitle: Detailing services in Belgrade — PRIZMA
    indexMetaDescription: Paint protection film, colour-change wraps, machine polishing with ceramic coating, and steering-wheel restoration. Prices, timelines and honest limits for each.
    indexEyebrow: Services
    indexHeading: Four things, each one properly
    indexLead: 'Each service has its own page below: what is included, how long it takes, who it suits, and when we honestly talk you out of it.'
    specsPriceLabel: Price
    specsDurationLabel: Timeline
    specsWarrantyLabel: Warranty
    paint-protection-film:
      name: Paint protection film (PPF)
      short: Clear polyurethane armour against stones, grit and car-wash brushes.
      metaTitle: Paint protection film in Belgrade — PRIZMA
      metaDescription: 'Clear paint protection film in Belgrade: front end, full body, wrapped edges. XPEL, SunTek and 3M films. Manufacturer warranty up to 10 years.'
      heroEyebrow: Body protection
      heroTitle: Film you cannot see, chips you will not get
      heroLead: Two hundred microns of polyurethane take the motorway stones, the grit and the brush marks instead of your paint. What is underneath stays factory — and that is what buyers check.
      priceFrom: from €690 for the front end
      duration: 2–6 days
      warranty: up to 10 years from the maker
      bodyHeading: What it actually buys you
      body: |
        The real value of film is not "shine", it is the factory paint you still have. A resprayed wing shows on any paint gauge, and at a pre-purchase inspection that knocks money straight off the price. Film takes the hit instead of the clear coat: light scratches heal themselves in the sun, deep ones stay on the film rather than the body.

        We plot the pattern for your exact model and hand-fit the awkward areas — bumpers, mirrors, pillars. Wherever the panel allows it, we wrap the edge around: the seam then collects no dirt and does not give itself away as a thin grey line a year later.
      includesHeading: What is included
      includes:
        - Two-stage wash, clay and degreasing before anything goes on
        - Spot correction of defects that would otherwise be sealed under the film
        - A pattern cut for your model, with awkward parts fitted by hand
        - Edges wrapped wherever the panel geometry allows
        - Handles, mirrors and lights removed when the area calls for it
        - A follow-up check a week after handover
      forWhomHeading: Who it is for
      forWhom:
        - A new car you want to keep in factory condition
        - A dark or matte colour where every mark shows
        - Long motorway runs and loose chippings on the shoulder
        - A leased car or a near-term sale where the paint report matters
      honestHeading: When we talk you out of it
      honest: 'If the car has already been resprayed in cheap lacquer, or a panel shows filler, film must not go on: it will lift the coating when it comes off. We will say so at the inspection and suggest sorting the paint out first.'
    colour-change-wrap:
      name: Colour change wrap
      short: A new colour without a respray — and the factory one still underneath.
      metaTitle: Colour change car wrap in Belgrade — PRIZMA
      metaDescription: 'Full colour-change wraps in Belgrade: matte, satin, gloss and textured films. Reversible, no respray, factory paint preserved. Samples on your own car.'
      heroEyebrow: Colour
      heroTitle: A different colour. The same factory paint under it.
      heroLead: A wrap changes the car completely and stays reversible. In two years you can peel it off and get back the paint that left the factory — something no respray will ever give you.
      priceFrom: from €1,900 for the body
      duration: 4–7 days
      warranty: 3–5 years on the film
      bodyHeading: Why a wrap and not a respray
      body: |
        A respray is permanent and it goes into the car's history. A wrap is a decision for a few years that you can undo. When you sell, you peel it off and hand the car over in its original colour, with its original paint underneath.

        We always choose the colour on your car, never from a catalogue on a desk: samples go on the body in daylight so you can see how the colour behaves over your own curves. Matte looks expensive on one model and flat on the next, and that only shows in person.
      includesHeading: What is included
      includes:
        - Colour chosen from samples on your own body panels in daylight
        - Handles, trim, lights and grilles taken off
        - Film laid with edges wrapped into the openings
        - Seams sealed and corners heat-set
        - Care instructions for matte or satin finishes
        - Free correction of any small lifting in the first month
      forWhomHeading: Who it is for
      forWhom:
        - You want a different colour without losing the factory paint
        - You want matte, satin or a texture that no factory offers
        - The car is leased and the contract rules out respraying
        - A commercial vehicle that has to be instantly recognisable
      honestHeading: What to know upfront
      honest: Film does not hide dents or waves in the panels — matte actually makes them more obvious than gloss does. If the bodywork has geometry problems, that comes first and colour second. We will tell you at the inspection, not after the wrap.
    polishing-ceramic:
      name: Polishing and ceramic
      short: Cut out the swirls and scratches, then lock the result in for years.
      metaTitle: Paint correction and ceramic coating in Belgrade — PRIZMA
      metaDescription: Multi-stage paint correction with clear-coat gauging and a 2–5 year ceramic coating. Before and after photos under the light. PRIZMA studio, Belgrade.
      heroEyebrow: Paint
      heroTitle: Cut the defects first. Only then coat anything.
      heroLead: Ceramic over uncorrected paint simply preserves the swirls for several years. We pull the defects out first and lay the coating on a finished surface.
      priceFrom: from €450 per car
      duration: 2–3 days
      warranty: 2–5 years on the coating
      bodyHeading: How it works
      body: |
        Polishing removes the thinnest layer of clear coat along with the scratches in it. That layer is finite, so we start with a gauge: every panel measured, and the remaining headroom calculated. If the roof or the wings are already thin, we work softer or leave the panel alone.

        Then two or three passes: a cutting compound takes out the main defects, a finishing one removes the machine holograms. We check the result under a light that shows what daylight hides. Only after that comes degreasing and the ceramic.
      includesHeading: What is included
      includes:
        - Clear-coat thickness measured and recorded on every panel
        - Two or three stage correction checked under the light
        - Surface degreasing before anything is applied
        - Ceramic coating with proper curing time in the bay
        - Glass treated with a water-repellent coating
        - Before and after photos shot in identical light
      forWhomHeading: Who it is for
      forWhom:
        - A car after a few years of automatic car washes
        - A dark colour where swirls show in any sunlight
        - Preparing for a sale, where the first second decides the impression
        - A freshly imported car after transport and long stays on lots
      honestHeading: When we talk you out of it
      honest: If the gauge shows critically thin clear coat, polishing is off the table — it can burn through to primer. We will offer a light, non-abrasive option or coating only, and show you exactly what the measurements said.
    steering-wheel-restoration:
      name: Steering wheel restoration
      short: Worn leather, a shiny rim and flaking plastic, put back the way it was.
      metaTitle: Steering wheel restoration and re-trim in Belgrade — PRIZMA
      metaDescription: 'Steering wheel leather restored in Belgrade: re-dyeing, re-trimming, plastic and button repair. We remove and refit the wheel with its airbag. 2–3 days.'
      heroEyebrow: Interior
      heroTitle: The first thing you touch. The first thing to age.
      heroLead: 'A steering wheel wears faster than the rest of the interior: sweat, sun and hand cream strip the finish within a couple of years. Restoring it costs a fraction of a new wheel and looks factory.'
      priceFrom: from €150
      duration: 2–3 days
      warranty: 1 year
      bodyHeading: What we do to it
      body: |
        First the whole wheel comes off — carefully, with the battery and airbag disconnected. What follows depends on the condition: if the leather is intact and only the finish has gone, we clean it, restore the grain and re-dye it with a coating that neither stays tacky nor marks your hands. If the leather has split or the stitching has opened, we re-trim it and hand-stitch it to the original pattern.

        While it is off, we also sort out what usually ages alongside it: flaking buttons, worn column shrouds and glossed-up paddles.
      includesHeading: What is included
      includes:
        - Wheel removed and refitted with the airbag handled correctly
        - Leather cleaned and its grain restored
        - Re-dyed or fully re-trimmed with hand stitching
        - Buttons and plastic shrouds restored
        - Colour and thread chosen to match your interior
        - Airbag warning light verified after reassembly
      forWhomHeading: Who it is for
      forWhom:
        - The rim has worn down to shiny plastic or changed colour
        - The leather has cracked or split along a seam
        - The car is going up for sale and the wheel gives the mileage away
        - You want a different material, such as alcantara on the top section
      honestHeading: What to know upfront
      honest: We do not take on wheels with a deployed airbag, or signs of one being replaced without service history — that is a safety question, not a cosmetic one. Service first, us second.
