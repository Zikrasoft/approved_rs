indexMetaDescription: Защитная пленка PPF, смена цвета, полировка с керамическим покрытием и реставрация руля. Цены, сроки и честные ограничения по каждой услуге.
indexEyebrow: Услуги
indexHeading: Четыре направления, в каждом до конца
indexLead: 'По каждой услуге ниже есть отдельная страница: что входит, сколько занимает, кому подходит и когда мы честно отговариваем.'
