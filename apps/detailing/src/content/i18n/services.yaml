paint-protection-film:
  name: Защитная плёнка (PPF)
  short: Прозрачная полиуретановая броня против камней, песка и щёток на мойке.
  metaTitle: Оклейка защитной плёнкой PPF в Белграде — Details
  metaDescription: 'Оклейка кузова прозрачной защитной плёнкой в Белграде: перёд, полная оклейка, заворот кромок. Плёнки XPEL и SunTek. Гарантия до 10 лет от производителя.'
  heroEyebrow: Защита кузова
  heroTitle: Плёнка, которую не видно, и сколы, которых не будет
  heroLead: Полиуретан толщиной 190 микрон принимает на себя камни с трассы, песок и следы от щёток. Краска под ним остаётся заводской — а это то, что смотрят при продаже.
  priceFrom: от 690 € за перёд
  duration: 2–6 дней
  warranty: до 10 лет от производителя
  bodyHeading: Что это даёт
  body: |
    Главная ценность плёнки — не «блеск», а сохранённая заводская краска. Перекрашенное крыло видно любым толщиномером, и на осмотре перед покупкой это сразу минус к цене. Плёнка держит удар вместо лака: мелкие царапины на ней затягиваются сами на солнце, глубокие остаются на плёнке, а не на кузове.

    Мы режем выкройку под конкретный кузов на плоттере, а сложные места — бамперы, зеркала, стойки — подгоняем руками. Там, где панель позволяет, заворачиваем край внутрь: так стык не собирает грязь и не выдаёт себя тонкой серой полоской через год.

    Плёнку берём у XPEL и SunTek. Какая из них пойдёт на вашу машину, называем на осмотре — до того, как вы согласитесь на смету.
  includesHeading: Что входит
  includes:
    - Двухэтапная мойка, глина и обезжиривание перед наклейкой
    - Точечная полировка дефектов, которые иначе запечатались бы под плёнкой
    - Выкройка под вашу модель, ручная подгонка сложных элементов
    - Заворот кромок там, где геометрия панели это позволяет
    - Разбор ручек, зеркал и фонарей, если зона того требует
    - Контрольный осмотр через неделю после выдачи
  forWhomHeading: Кому это нужно
  forWhom:
    - Новая машина, которую хочется сохранить в заводском состоянии
    - Тёмный или матовый цвет, на котором видно каждую риску
    - Много трассы между городами и щебень на обочинах
    - Машина в лизинге или под скорую продажу, где важен отчёт по краске
  honestHeading: Когда мы отговариваем
  honest: 'Если машина уже перекрашена дешёвым лаком или на панели видны следы шпаклёвки — плёнку класть нельзя: при снятии она заберёт покрытие с собой. В таком случае мы честно скажем об этом на осмотре и предложим сначала привести лак в порядок.'
colour-change-wrap:
  name: Смена цвета плёнкой
  short: Новый цвет без покраски — и с возможностью вернуть заводской.
  metaTitle: Смена цвета автомобиля плёнкой в Белграде — Details
  metaDescription: 'Полная оклейка цветной плёнкой в Белграде: мат, сатин, глянец, текстуры. Обратимо, без перекраски, с сохранением заводского лака. Образцы на вашей машине.'
  heroEyebrow: Цвет
  heroTitle: Другой цвет. Тот же заводской лак под ним.
  heroLead: Плёнка меняет машину полностью, но остаётся обратимой. Через два года можно снять её и получить ту же краску, что была с завода, — чего не даст ни одна покраска.
  priceFrom: от 1 900 € за кузов
  duration: 4–7 дней
  warranty: 3–5 лет на плёнку
  bodyHeading: Почему плёнка, а не покраска
  body: |
    Покраска — это навсегда и это запись в истории автомобиля. Плёнка — это решение на несколько лет, которое можно отменить. При продаже вы снимаете её и отдаёте машину в родном цвете, с родным лаком под ней.

    Выбор цвета мы всегда делаем на вашей машине, а не по каталогу на столе: кладём образцы на кузов при дневном свете и смотрим, как цвет ведёт себя на ваших изгибах. Матовый на одной модели выглядит дорого, а на другой — плоско, и это видно только вживую.

    Цветные плёнки берём у 3M и HEXIS. Какую именно кладём, фиксируем в смете вместе с ценой и сроком.
  includesHeading: Что входит
  includes:
    - Подбор цвета образцами на вашем кузове при дневном свете
    - Разбор ручек, молдингов, фонарей и решёток
    - Оклейка с заворотом кромок в проёмах
    - Проклейка стыков и обработка углов феном
    - Инструкция по уходу за матом или сатином
    - Бесплатная правка мелких отслоений в первый месяц
  forWhomHeading: Кому это нужно
  forWhom:
    - Хочется другой цвет, но без потери заводской краски
    - Нужен мат, сатин или текстура, которых не бывает с завода
    - Машина в лизинге, где перекраска запрещена договором
    - Коммерческий автомобиль, который должен выглядеть узнаваемо
  honestHeading: Что нужно знать заранее
  honest: Плёнка не прячет вмятины и волны на кузове — наоборот, матовая подчёркивает их сильнее, чем глянец. Если на панелях есть геометрические дефекты, сначала кузовной ремонт, потом цвет. Мы скажем об этом на осмотре, а не после оклейки.
polishing-ceramic:
  name: Полировка и керамика
  short: Снимаем риски и паутинку, закрываем результат керамикой на годы.
  metaTitle: Полировка кузова и керамика в Белграде — Details
  metaDescription: Многоэтапная полировка с замером толщины лака и керамическое покрытие на 2–5 лет. Смотрим лак под лампой и показываем замеры. Студия Details, Белград.
  heroEyebrow: Лак
  heroTitle: Сначала убрать риски. Только потом что-то наносить.
  heroLead: Керамика поверх непрополированного лака просто консервирует паутинку на несколько лет. Мы сначала выводим дефекты, а покрытие кладём уже на готовую поверхность.
  priceFrom: от 450 € за автомобиль
  duration: 2–3 дня
  warranty: 2–5 лет на покрытие
  bodyHeading: Как это устроено
  body: |
    Полировка — это снятие тончайшего слоя лака вместе с рисками. Слой не бесконечный, поэтому мы начинаем с толщиномера: замеряем каждую панель и считаем, сколько запаса есть. Если на крыше или крыльях лак уже тонкий — работаем мягче или не трогаем панель вовсе.

    Дальше два или три прохода: режущий состав снимает основные дефекты, финишный убирает голограммы от машинки. Результат смотрим под лампой, которая показывает то, чего не видно на улице. И только после этого — обезжиривание и керамика. Полируем составами Koch-Chemie, керамику кладём Gtechniq.
  includesHeading: Что входит
  includes:
    - Замер толщины лака по всем панелям с записью результатов
    - Двух- или трёхэтапная полировка под контролем лампы
    - Обезжиривание поверхности перед нанесением
    - Керамическое покрытие с выдержкой в боксе
    - Обработка стёкол водоотталкивающим составом
    - Фотоотчёт до и после в одинаковом свете
  forWhomHeading: Кому это нужно
  forWhom:
    - Машина после нескольких лет автоматических моек
    - Тёмный цвет, на котором паутинка видна на любом солнце
    - Подготовка к продаже, когда важна первая секунда впечатления
    - Свежепригнанный автомобиль после перевозки и стоянок
  honestHeading: Когда мы отговариваем
  honest: Если толщиномер показывает критично тонкий лак, полировать нельзя — можно протереть до грунта. В такой ситуации мы предложим мягкий вариант без съёма или только защитное покрытие, и объясним, что именно увидели на замерах.
steering-wheel-restoration:
  name: Реставрация руля
  short: Затёртая кожа, лоснящийся обод и облезший пластик — в исходное состояние.
  metaTitle: Реставрация руля и перетяжка кожи в Белграде — Details
  metaDescription: 'Восстановление кожи руля в Белграде: перекраска, перетяжка, ремонт пластика и кнопок. Снимаем и ставим руль с подушкой безопасности. 2–3 дня.'
  heroEyebrow: Салон
  heroTitle: Первое, к чему прикасаются. И первое, что стареет.
  heroLead: 'Руль изнашивается быстрее всего салона: пот, солнце и крем для рук вытирают краску за пару лет. Восстановление стоит несоизмеримо дешевле нового руля и выглядит как заводской.'
  priceFrom: от 150 €
  duration: 2–3 дня
  warranty: 1 год
  bodyHeading: Что мы с ним делаем
  body: |
    Сначала снимаем руль целиком — аккуратно, с отключением аккумулятора и подушки безопасности. Дальше зависит от состояния: если кожа цела и вытерлась только краска, мы её очищаем, восстанавливаем фактуру и перекрашиваем составом, который не липнет и не пачкает руки. Если кожа порвана или прошивка разошлась — перетягиваем заново, с ручной прошивкой по оригинальному рисунку.

    Заодно приводим в порядок то, что обычно портится рядом: облезшие кнопки, потёртый пластик подрулевых накладок, глянец на лепестках.
  includesHeading: Что входит
  includes:
    - Снятие и установка руля с корректной работой с подушкой безопасности
    - Очистка и восстановление фактуры кожи
    - Перекраска или полная перетяжка с ручной прошивкой
    - Восстановление кнопок и пластиковых накладок
    - Подбор цвета и типа строчки под ваш салон
    - Проверка индикатора подушки после сборки
  forWhomHeading: Кому это нужно
  forWhom:
    - Обод вытерся до блестящего пластика или сменил цвет
    - Кожа потрескалась или разошлась по шву
    - Машина готовится к продаже, а руль выдаёт пробег
    - Хочется другой материал — например, алькантару на верхнем секторе
  honestHeading: Что нужно знать заранее
  honest: Мы не берёмся за рули со сработавшей подушкой безопасности или следами её замены без сервисной истории — это вопрос вашей безопасности, а не косметики. В таком случае сначала сервис, потом мы.
translations:
  sr:
    indexMetaTitle: 'Usluge detailing-a u Beogradu: PPF, poliranje, volan — Details'
    indexMetaDescription: Zaštitna folija PPF, promena boje, poliranje s keramikom i restauracija volana. Cene, rokovi i poštene informacije o svakoj usluzi.
    indexEyebrow: Usluge
    indexHeading: Četiri pravca, u svakom — do kraja
    indexLead: 'Za svaku uslugu ispod postoji posebna stranica: šta uključuje, koliko traje, kome odgovara i kada vas iskreno odvratimo.'
    specsPriceLabel: Cena
    specsDurationLabel: Rok
    specsWarrantyLabel: Garancija
    paint-protection-film:
      name: Zaštitna folija (PPF)
      short: Prozirna poliuretanska brana protiv kamenčića, peska i četki na pranju.
      metaTitle: Oklopna zaštitna folija PPF u Beogradu — Details
      metaDescription: 'Oklapanje karoserije prozračnom zaštitnom folijom u Beogradu: prednji deo, potpuno oklapanje, preklapanje ivica. Folije XPEL i SunTek. Garancija do 10 godina od proizvođača.'
      heroEyebrow: Zaštita karoserije
      heroTitle: Folija koja se ne vidi, i kamenčići koji ne postoje
      heroLead: Poliuretan debljine 190 mikrona prima udarce kamenčića s puta, peska i tragove od četki. Boja ispod ostaje fabrička — a to je ono što se gleda pri prodaji.
      priceFrom: od 690 € za prednji deo
      duration: 2–6 dana
      warranty: do 10 godina od proizvođača
      bodyHeading: Šta to donosi
      body: |-
        Glavna vrednost folije — nije «sjaj», već očuvana fabrička boja. Prefarbano krilo je vidljivo svakom mernom aparatu, i na pregledu pre kupovine to odmah smanjuje cenu. Folija primenjuje udarce umesto laka: sitne ogrebotine se same zategnu na suncu, duboke ostaju na foliji, a ne na karoseriji.

        Pravimo šablon pod vašu karoseriju na plotteru, a složene delove — branike, ogledala, nosače — podešavamo ručno. Tamo gde panel dozvoljava, preklapamo ivicu unutra: tako spoj ne sakuplja prljavštinu i ne pokazuje se kao tanka siva linija nakon godinu dana.

        Folije nabavljamo kod XPEL i SunTek. Koja od njih će ići na vaš automobil, saopštavamo na pregledu — pre nego što se složite sa troškovnikom.
      includesHeading: Šta uključuje
      includes:
        - Dvostepeno pranje, glina i odmašćivanje pre lepljenja
        - Fokusirano poliranje grešaka koje bi inače bile pod folijom
        - Šablon prema vašem modelu, ručno podešavanje složenih elemenata
        - Preklapanje ivica gde geometrija panela to omogućava
        - Demontaža ručki, ogledala i svetala, ako područje to zahteva
        - Kontrolni pregled nedelju dana nakon predaje
      forWhomHeading: Kome je to potrebno
      forWhom:
        - Nova mašina koju želite sačuvati u fabričkom stanju
        - Tamne ili mat boje na kojima se vidi svaka ogrebotina
        - Mnogi putevi između gradova i šljunak na ivicama
        - Automobil u lizingu ili za brzu prodaju, gde je izveštaj o boji važan
      honestHeading: Kada vas odvratimo
      honest: 'Ako je automobil već prefarban jeftinim lakom ili se na panelu vide tragovi mase — foliju ne možemo staviti: prilikom skidanja, ona će odnijeti pokriće sa sobom. U takvom slučaju, iskreno ćemo vam to reći na pregledu i predložiti prvo da dovedemo lak u red.'
    colour-change-wrap:
      name: Promena boje folijom
      short: Nova boja bez farbanja — i sa mogućnošću vraćanja fabričkog.
      metaTitle: Promena boje automobila folijom u Beogradu — Details
      metaDescription: 'Potpuno oklapanje obojenom folijom u Beogradu: mat, satenski, sjajni, teksture. Povratni proces, bez farbanja, sa očuvanjem fabričnog laka. Uzorci na vašem automobilu.'
      heroEyebrow: Boja
      heroTitle: Druga boja. Taj isti fabrički lak ispod.
      heroLead: Folija menja automobil u potpunosti, ali ostaje povratna. Posle dva godine možete je skinuti i dobiti istu boju koja je bila iz fabrike — što nijedno farbanje ne može dati.
      priceFrom: od 1 900 € za karoseriju
      duration: 4–7 dana
      warranty: 3–5 godina na foliju
      bodyHeading: Zašto folija, a ne farbanje
      body: |-
        Farbanje — to je zauvek i to je upis u istoriju automobila. Folija — to je rešenje na nekoliko godina, koje možete opozvati. Pri prodaji, skidate je i ostavljate automobil u svom originalnom koloritu, sa originalnim lakom ispod.

        Izbor boje radimo uvek na vašem automobilu, a ne po katalogu na stolu: stavljamo uzorke na karoseriju pri dnevnom svetlu i gledamo kako se boja ponaša na vašim oblinama. Mat na jednom modelu izgleda skupo, a na drugom — ravno, i to je vidljivo samo uživo.

        Obojene folije nabavljamo kod 3M i HEXIS. Koju tačno stavljamo, fiksiramo u troškovniku zajedno sa cenom i rokom.
      includesHeading: Šta uključuje
      includes:
        - Odabir boje uzorcima na vašoj karoseriji pri dnevnom svetlu
        - Demontaža ručki, lajsni, svetala i rešetki
        - Oklapanje sa preklapanjem ivica u prolazima
        - Zalivanje spojnih tačaka i obrada uglova fenom
        - Instrukcija za održavanje mat ili satena
        - Besplatna korekcija sitnih odvojenih delova u prvom mesecu
      forWhomHeading: Kome je to potrebno
      forWhom:
        - Želite drugu boju, ali bez gubitka fabrične boje
        - Potrebna vam je mat, satenska ili tekstura koja ne postoji iz fabrike
        - Automobil u lizingu, gde je farbanje zabranjeno ugovorom
        - Komercijalni automobil koji treba da izgleda prepoznatljivo
      honestHeading: Šta treba znati unapred
      honest: Folija ne sakriva udubljenja i talase na karoseriji — naprotiv, mat povremeno naglašava više nego sjajni. Ako postoje geometrijski defekti na panelima, prvo karoserijska popravka, a zatim boja. O tome ćemo vas obavestiti na pregledu, a ne nakon oklevanja.
    polishing-ceramic:
      name: Poliranje i keramika
      short: Uklanjamo ogrebotine i paučinu, pokrivamo rezultat keramikom na godine.
      metaTitle: Poliranje karoserije i keramika u Beogradu — Details
      metaDescription: Višestepeno poliranje s merenjem debljine laka i keramičkim premazom na 2–5 godina. Gledamo lak pod lampom i pokazujemo merenja. Studio Details, Beograd.
      heroEyebrow: Lak
      heroTitle: Prvo ukloniti ogrebotine. Tek potom nešto nanositi.
      heroLead: Keramika preko nepripremljenog laka jednostavno konzervira paučinu na nekoliko godina. Prvo otklanjamo greške, a premaz stavljamo na gotovu površinu.
      priceFrom: od 450 € za automobil
      duration: 2–3 dana
      warranty: 2–5 godina na premaz
      bodyHeading: Kako to funkcioniše
      body: |-
        Poliranje — to je uklanjanje najtanjeg sloja laka zajedno sa ogrebotinama. Sloj nije beskrajan, stoga počinjemo s mernim aparatom: merimo svaku panel i računamo koliko imamo rezervi. Ako je na krovu ili krilima lak već tanak — radimo nežnije ili uopšte ne dodirujemo panel.

        Zatim dva ili tri prolaza: rezni sastav uklanja glavne greške, završni skida holograme od mašine. Rezultat gledamo pod lampom koja pokazuje ono što nije vidljivo napolju. I tek nakon toga — odmašćivanje i keramika. Poliramo sastavima Koch-Chemie, keramiku stavljamo Gtechniq.
      includesHeading: Šta uključuje
      includes:
        - Merenje debljine laka po svim panelima s zapisom rezultata
        - Dvostepeno ili trostepeno poliranje pod kontrolom lampe
        - Odmašćivanje površine pre nanošenja
        - Keramički premaz s odmorom u boksu
        - Obrada stakala vodoodbojnim sastavom
        - Fotoizveštaj pre i posle u istom svetlu
      forWhomHeading: Kome je to potrebno
      forWhom:
        - Automobil nakon nekoliko godina automatskih pranja
        - Tamna boja na kojoj se paučina vidi na svakom suncu
        - Priprema za prodaju, kada je prvi utisak važan
        - Svež instaliran automobil nakon prevoza i parkiranja
      honestHeading: Kada vas odvratimo
      honest: Ako merni aparat pokazuje kritično tanak lak, ne može se polirati — može se proći do temelja. U takvoj situaciji, ponudićemo blagu opciju bez skidanja ili samo zaštitni premaz, i objasnićemo šta smo videli na merenjima.
    steering-wheel-restoration:
      name: Restauracija volana
      short: Poderana koža, sjajni obod i oljušteni plastika — u prvobitno stanje.
      metaTitle: Restauracija volana i prekrivanje kože u Beogradu — Details
      metaDescription: 'Obnova kože volana u Beogradu: prefarbanje, prekrivanje, popravka plastike i dugmadi. Skidamo i vraćamo volan s vazdušnom jastučićem. 2–3 dana.'
      heroEyebrow: Enterijer
      heroTitle: Prvo na što se dodiruje. I prvo što stari.
      heroLead: 'Volan se troši najbrže u enterijeru: znoj, sunce i krem za ruke brišu boju za nekoliko godina. Obnova je nesrazmerno jeftinija od novog volana i izgleda kao fabrički.'
      priceFrom: od 150 €
      duration: 2–3 dana
      warranty: 1 godina
      bodyHeading: Šta radimo s njim
      body: |-
        Prvo skidamo volan u celini — pažljivo, s isključenim akumulatorom i vazdušnom jastučićem. Dalje zavisi od stanja: ako je koža netaknuta i samo je boja izbrisana, čistimo je, obnavljamo teksturu i prefarbamo sastavom koji se ne lepi i ne prlja ruke. Ako je koža poderana ili šavovi su se raspali — prekrivamo ponovo, s ručnom šavom po originalnom uzorku.

        Usput, dovedemo u red ono što obično propada pored: oljuštena dugmad, pohabana plastika na preklopnim delovima, sjaj na papučicama.
      includesHeading: Šta uključuje
      includes:
        - Skidanje i postavljanje volana s ispravnim radom vazdušne jastučića
        - Čišćenje i obnova teksture kože
        - Prefarbanje ili potpuno prekrivanje s ručnom šavom
        - Obnova dugmadi i plastičnih delova
        - Odabir boje i tipa šava pod vaš enterijer
        - Provera indikatora vazdušne jastučića nakon sklapanja
      forWhomHeading: Kome je to potrebno
      forWhom:
        - Obod se istrošio do sjajnog plastike ili je promenio boju
        - Koža je ispucala ili se raspala po šavu
        - Automobil se priprema za prodaju, a volan pokazuje pređene kilometre
        - Želite drugi materijal — na primer, alkantru na gornjem sektoru
      honestHeading: Šta treba znati unapred
      honest: Ne preuzimamo obavezu za volane s aktiviranim vazdušnim jastučićem ili tragovima njegovog zamene bez servisne istorije — to je pitanje vaše bezbednosti, a ne estetike. U tom slučaju prvo servis, a zatim mi.
  en:
    indexMetaTitle: 'Detailing Services in Belgrade: PPF, Polishing, Wheel — Details'
    indexMetaDescription: Paint protection film, colour-change wraps, polishing with ceramic coating, and steering wheel restoration. Prices, timelines, and honest limitations for each service.
    indexEyebrow: Services
    indexHeading: Four Directions, Each to Completion
    indexLead: "Each service below has a dedicated page: what it includes, how long it takes, who it's for, and when we honestly advise against it."
    specsPriceLabel: Price
    specsDurationLabel: Duration
    specsWarrantyLabel: Warranty
    paint-protection-film:
      name: Paint Protection Film (PPF)
      short: Transparent polyurethane shield against stones, sand, and car wash brushes.
      metaTitle: PPF Installation in Belgrade — Details
      metaDescription: 'Body covered with transparent protective film in Belgrade: front, full coverage, edge wrapping. XPEL and SunTek films. Warranty up to 10 years from the manufacturer.'
      heroEyebrow: Body Protection
      heroTitle: Invisible Film that Prevents Chips
      heroLead: 190 microns of polyurethane absorbs road debris, sand, and brush marks. The paint underneath remains factory-fresh — that's what matters when selling.
      priceFrom: from 690 € for the front
      duration: 2–6 days
      warranty: up to 10 years from the manufacturer
      bodyHeading: What It Provides
      body: |
        The main value of the film is not the shine, but the preserved factory paint. Repainted panels can be detected by any thickness gauge, and this will significantly reduce the price during a pre-purchase inspection. The film absorbs impacts instead of the clear coat: minor scratches heal in sunlight, while deep ones stay on the film, not the body.

        We cut patterns for specific body types on a plotter, and we fit complex areas like bumpers, mirrors, and pillars by hand. Where the panel allows, we wrap the edge inside: this way, the seam doesn’t collect dirt and doesn’t reveal itself as a thin gray line after a year.

        We source our film from XPEL and SunTek. We specify which one will go on your car during the inspection — before you agree to the estimate.
      includesHeading: What's Included
      includes:
        - Two-stage wash, clay treatment, and degreasing before application
        - Spot polishing of defects that would otherwise be trapped under the film
        - Pattern cut for your model, manual fitting of complex elements
        - Edge wrapping where panel geometry allows
        - Disassembly of handles, mirrors, and lights if required
        - Follow-up inspection one week after delivery
      forWhomHeading: Who Needs This
      forWhom:
        - A new car that you want to keep in factory condition
        - Dark or matte colors that show every scratch
        - Frequent highway driving and gravel on the shoulders
        - Leased or soon-to-sell cars where paint reports matter
      honestHeading: When We Advise Against It
      honest: 'If the car has already been repainted with cheap lacquer or if there are signs of filler on the panel — we cannot apply the film: removing it will take the coating with it. In such cases, we will honestly inform you during the inspection and recommend repairing the paint first.'
    colour-change-wrap:
      name: Colour Change Wrap
      short: A new color without repainting — and the possibility of returning to factory.
      metaTitle: Car Colour Change Wrap in Belgrade — Details
      metaDescription: 'Full vehicle wrap with colored film in Belgrade: matte, satin, gloss, textures. Reversible, without repainting, preserving the factory paint. Samples on your car.'
      heroEyebrow: Color
      heroTitle: A Different Color. The Same Factory Paint Underneath.
      heroLead: The film completely transforms the car but remains reversible. After two years, it can be removed, revealing the original paint — something no repaint can offer.
      priceFrom: from 1,900 € for the body
      duration: 4–7 days
      warranty: 3–5 years on the film
      bodyHeading: Why Film and Not Paint
      body: |
        Painting is forever and permanently changes the car's history. A film is a temporary solution for a few years that can be undone. When selling, you strip it away and return the car in its original color, with the original clear coat underneath.

        We always choose the color on your vehicle, not from a catalog on the table: we lay samples on the body in daylight and observe how the color behaves on your curves. Matte may look rich on one model and flat on another; this becomes clear only in person.

        We source colored films from 3M and HEXIS. We fix which one to use in the estimate along with the price and timeline.
      includesHeading: What's Included
      includes:
        - Color selection with samples on your body in daylight
        - Disassembly of handles, moldings, lights, and grilles
        - Wrapping edges in openings
        - Sealing joints and heat application for corners
        - Care instructions for matte or satin
        - Free correction of minor peeling in the first month
      forWhomHeading: Who Needs This
      forWhom:
        - Desires a different color without sacrificing factory paint
        - Needs matte, satin, or textures unavailable from the factory
        - Leased vehicles where repainting is prohibited by contract
        - Commercial vehicles that need to look recognizable
      honestHeading: What to Know in Advance
      honest: Film does not hide dents and waves on the body — in fact, matte emphasizes them more than gloss. If there are geometric defects on the panels, body repair must precede color application. We will inform you about this during the inspection, not after the wrap.
    polishing-ceramic:
      name: Polishing and Ceramic Coating
      short: We remove scratches and swirls, sealing the result with ceramic for years.
      metaTitle: Body Polishing and Ceramic Coating in Belgrade — Details
      metaDescription: Multi-stage polishing with paint thickness measurement and ceramic coating for 2–5 years. We inspect the paint under the lamp and show measurements. Studio Details, Belgrade.
      heroEyebrow: Clear Coat
      heroTitle: First, Remove Scratches. Only Then Apply Anything.
      heroLead: Applying ceramic over unpolished paint merely preserves swirls for several years. We first correct the defects, then apply the coating to the prepared surface.
      priceFrom: from 450 € per vehicle
      duration: 2–3 days
      warranty: 2–5 years for the coating
      bodyHeading: How It Works
      body: |
        Polishing involves removing the finest layer of clear coat along with scratches. The layer is not infinite, so we begin with a thickness gauge: we measure each panel and assess how much is left. If the roof or fenders have thin clear coat, we work with gentler methods or don't touch the panel at all.

        Then we perform two or three passes: cutting compound removes major defects, finishing removes holograms from the machine. The result is observed under a lamp that reveals what’s invisible outdoors. Only after that do we degrease and apply ceramic. We use Koch-Chemie compounds for polishing and Gtechniq for ceramic coating.
      includesHeading: What's Included
      includes:
        - Thickness measurement on all panels with recorded results
        - Two or three stage polishing under lamp control
        - Degreasing the surface before application
        - Ceramic coating with curing in the box
        - Application of water-repellent treatment on windows
        - Before and after photo report in the same lighting
      forWhomHeading: Who Needs This
      forWhom:
        - A car after several years of automatic washing
        - Dark paint that shows swirls in any sunlight
        - Preparation for sale, when the first impression is crucial
        - A freshly imported vehicle after transportation and parking
      honestHeading: When We Advise Against It
      honest: If the gauge shows critically thin clear coat, polishing is not possible — it could sand down to the primer. In such a case, we will offer a gentler option without removal or only a protective coating and explain what we observed in the measurements.
    steering-wheel-restoration:
      name: Steering Wheel Restoration
      short: Worn leather, shiny rim, and peeling plastic — returned to original condition.
      metaTitle: Steering Wheel Restoration and Leather Reupholstery in Belgrade — Details
      metaDescription: 'Steering wheel leather restoration in Belgrade: repainting, reupholstering, plastic and button repair. We remove and reattach the wheel with an airbag. 2–3 days.'
      heroEyebrow: Interior
      heroTitle: The First Thing You Touch. And the First to Age.
      heroLead: 'The steering wheel wears out the fastest: sweat, sunlight and hand cream wear off the finish in a few years. Restoration is immeasurably cheaper than a new wheel and looks like factory.'
      priceFrom: from 150 €
      duration: 2–3 days
      warranty: 1 year
      bodyHeading: What We Do
      body: |
        First, we carefully remove the steering wheel, disconnecting the battery and airbag. After that, it depends on the condition: if the leather is intact but the finish is worn, we clean it, restore the texture, and repaint with a non-sticky, non-staining compound. If the leather is torn or the stitching has come apart — we reupholster it with hand stitching, following the original pattern.

        While we're at it, we also tidy up what usually gets worn nearby: peeling buttons, worn plastic under the steering covers, and gloss on the paddles.
      includesHeading: What's Included
      includes:
        - Removal and installation of the steering wheel with proper work on the airbag
        - Cleaning and restoring the leather texture
        - Repainting or complete reupholstery with hand stitching
        - Restoring buttons and plastic trim
        - Color and stitching type selection to match your interior
        - Checking the airbag indicator after reassembly
      forWhomHeading: Who Needs This
      forWhom:
        - The rim is worn down to shiny plastic or has changed color
        - The leather is cracked or stitching has unraveled
        - The car is prepared for sale, and the steering wheel reveals mileage
        - Wants a different material — for example, alcantara on the upper section
      honestHeading: What to Know in Advance
      honest: We do not take on wheels with deployed airbags or signs of airbag replacement without service history — it's a matter of your safety, not just cosmetics. In such cases, first service, then we.
