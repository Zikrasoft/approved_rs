paint-protection-film:
  name: Защитная плёнка (PPF)
  short: Прозрачная полиуретановая броня против камней, песка и щёток на мойке.
  metaTitle: Оклейка защитной плёнкой PPF в Белграде — Details
  metaDescription: 'Оклейка кузова прозрачной защитной плёнкой в Белграде: перёд, полная оклейка, заворот кромок. Плёнки XPEL и SunTek. Гарантия до 10 лет от производителя.'
  heroEyebrow: Защита кузова
  heroTitle: Плёнка, которую не видно, и сколы, которых не будет
  heroLead: Полиуретан толщиной 190 микрон принимает на себя камни с трассы, песок и следы от щёток. Краска под ним остаётся заводской — а это то, что смотрят при продаже.
  priceFrom: от 690 € за перёд
  duration: 2–6 дней
  warranty: до 10 лет от производителя
  bodyHeading: Что это даёт
  body: |
    Главная ценность плёнки — не «блеск», а сохранённая заводская краска. Перекрашенное крыло видно любым толщиномером, и на осмотре перед покупкой это сразу минус к цене. Плёнка держит удар вместо лака: мелкие царапины на ней затягиваются сами на солнце, глубокие остаются на плёнке, а не на кузове.

    Мы режем выкройку под конкретный кузов на плоттере, а сложные места — бамперы, зеркала, стойки — подгоняем руками. Там, где панель позволяет, заворачиваем край внутрь: так стык не собирает грязь и не выдаёт себя тонкой серой полоской через год.

    Плёнку берём у XPEL и SunTek. Какая из них пойдёт на вашу машину, называем на осмотре — до того, как вы согласитесь на смету.
  includesHeading: Что входит
  includes:
    - Двухэтапная мойка, глина и обезжиривание перед наклейкой
    - Точечная полировка дефектов, которые иначе запечатались бы под плёнкой
    - Выкройка под вашу модель, ручная подгонка сложных элементов
    - Заворот кромок там, где геометрия панели это позволяет
    - Разбор ручек, зеркал и фонарей, если зона того требует
    - Контрольный осмотр через неделю после выдачи
  forWhomHeading: Кому это нужно
  forWhom:
    - Новая машина, которую хочется сохранить в заводском состоянии
    - Тёмный или матовый цвет, на котором видно каждую риску
    - Много трассы между городами и щебень на обочинах
    - Машина в лизинге или под скорую продажу, где важен отчёт по краске
  honestHeading: Когда мы отговариваем
  honest: 'Если машина уже перекрашена дешёвым лаком или на панели видны следы шпаклёвки — плёнку класть нельзя: при снятии она заберёт покрытие с собой. В таком случае мы честно скажем об этом на осмотре и предложим сначала привести лак в порядок.'
colour-change-wrap:
  name: Смена цвета плёнкой
  short: Новый цвет без покраски — и с возможностью вернуть заводской.
  metaTitle: Смена цвета автомобиля плёнкой в Белграде — Details
  metaDescription: 'Полная оклейка цветной плёнкой в Белграде: мат, сатин, глянец, текстуры. Обратимо, без перекраски, с сохранением заводского лака. Образцы на вашей машине.'
  heroEyebrow: Цвет
  heroTitle: Другой цвет. Тот же заводской лак под ним.
  heroLead: Плёнка меняет машину полностью, но остаётся обратимой. Через два года можно снять её и получить ту же краску, что была с завода, — чего не даст ни одна покраска.
  priceFrom: от 1 900 € за кузов
  duration: 4–7 дней
  warranty: 3–5 лет на плёнку
  bodyHeading: Почему плёнка, а не покраска
  body: |
    Покраска — это навсегда и это запись в истории автомобиля. Плёнка — это решение на несколько лет, которое можно отменить. При продаже вы снимаете её и отдаёте машину в родном цвете, с родным лаком под ней.

    Выбор цвета мы всегда делаем на вашей машине, а не по каталогу на столе: кладём образцы на кузов при дневном свете и смотрим, как цвет ведёт себя на ваших изгибах. Матовый на одной модели выглядит дорого, а на другой — плоско, и это видно только вживую.

    Цветные плёнки берём у 3M и HEXIS. Какую именно кладём, фиксируем в смете вместе с ценой и сроком.
  includesHeading: Что входит
  includes:
    - Подбор цвета образцами на вашем кузове при дневном свете
    - Разбор ручек, молдингов, фонарей и решёток
    - Оклейка с заворотом кромок в проёмах
    - Проклейка стыков и обработка углов феном
    - Инструкция по уходу за матом или сатином
    - Бесплатная правка мелких отслоений в первый месяц
  forWhomHeading: Кому это нужно
  forWhom:
    - Хочется другой цвет, но без потери заводской краски
    - Нужен мат, сатин или текстура, которых не бывает с завода
    - Машина в лизинге, где перекраска запрещена договором
    - Коммерческий автомобиль, который должен выглядеть узнаваемо
  honestHeading: Что нужно знать заранее
  honest: Плёнка не прячет вмятины и волны на кузове — наоборот, матовая подчёркивает их сильнее, чем глянец. Если на панелях есть геометрические дефекты, сначала кузовной ремонт, потом цвет. Мы скажем об этом на осмотре, а не после оклейки.
polishing-ceramic:
  name: Полировка и керамика
  short: Снимаем риски и паутинку, закрываем результат керамикой на годы.
  metaTitle: Полировка кузова и керамика в Белграде — Details
  metaDescription: Многоэтапная полировка с замером толщины лака и керамическое покрытие на 2–5 лет. Смотрим лак под лампой и показываем замеры. Студия Details, Белград.
  heroEyebrow: Лак
  heroTitle: Сначала убрать риски. Только потом что-то наносить.
  heroLead: Керамика поверх непрополированного лака просто консервирует паутинку на несколько лет. Мы сначала выводим дефекты, а покрытие кладём уже на готовую поверхность.
  priceFrom: от 450 € за автомобиль
  duration: 2–3 дня
  warranty: 2–5 лет на покрытие
  bodyHeading: Как это устроено
  body: |
    Полировка — это снятие тончайшего слоя лака вместе с рисками. Слой не бесконечный, поэтому мы начинаем с толщиномера: замеряем каждую панель и считаем, сколько запаса есть. Если на крыше или крыльях лак уже тонкий — работаем мягче или не трогаем панель вовсе.

    Дальше два или три прохода: режущий состав снимает основные дефекты, финишный убирает голограммы от машинки. Результат смотрим под лампой, которая показывает то, чего не видно на улице. И только после этого — обезжиривание и керамика. Полируем составами Koch-Chemie, керамику кладём Gtechniq.
  includesHeading: Что входит
  includes:
    - Замер толщины лака по всем панелям с записью результатов
    - Двух- или трёхэтапная полировка под контролем лампы
    - Обезжиривание поверхности перед нанесением
    - Керамическое покрытие с выдержкой в боксе
    - Обработка стёкол водоотталкивающим составом
    - Фотоотчёт до и после в одинаковом свете
  forWhomHeading: Кому это нужно
  forWhom:
    - Машина после нескольких лет автоматических моек
    - Тёмный цвет, на котором паутинка видна на любом солнце
    - Подготовка к продаже, когда важна первая секунда впечатления
    - Свежепригнанный автомобиль после перевозки и стоянок
  honestHeading: Когда мы отговариваем
  honest: Если толщиномер показывает критично тонкий лак, полировать нельзя — можно протереть до грунта. В такой ситуации мы предложим мягкий вариант без съёма или только защитное покрытие, и объясним, что именно увидели на замерах.
steering-wheel-restoration:
  name: Реставрация руля
  short: Затёртая кожа, лоснящийся обод и облезший пластик — в исходное состояние.
  metaTitle: Реставрация руля и перетяжка кожи в Белграде — Details
  metaDescription: 'Восстановление кожи руля в Белграде: перекраска, перетяжка, ремонт пластика и кнопок. Снимаем и ставим руль с подушкой безопасности. 2–3 дня.'
  heroEyebrow: Салон
  heroTitle: Первое, к чему прикасаются. И первое, что стареет.
  heroLead: 'Руль изнашивается быстрее всего салона: пот, солнце и крем для рук вытирают краску за пару лет. Восстановление стоит несоизмеримо дешевле нового руля и выглядит как заводской.'
  priceFrom: от 150 €
  duration: 2–3 дня
  warranty: 1 год
  bodyHeading: Что мы с ним делаем
  body: |
    Сначала снимаем руль целиком — аккуратно, с отключением аккумулятора и подушки безопасности. Дальше зависит от состояния: если кожа цела и вытерлась только краска, мы её очищаем, восстанавливаем фактуру и перекрашиваем составом, который не липнет и не пачкает руки. Если кожа порвана или прошивка разошлась — перетягиваем заново, с ручной прошивкой по оригинальному рисунку.

    Заодно приводим в порядок то, что обычно портится рядом: облезшие кнопки, потёртый пластик подрулевых накладок, глянец на лепестках.
  includesHeading: Что входит
  includes:
    - Снятие и установка руля с корректной работой с подушкой безопасности
    - Очистка и восстановление фактуры кожи
    - Перекраска или полная перетяжка с ручной прошивкой
    - Восстановление кнопок и пластиковых накладок
    - Подбор цвета и типа строчки под ваш салон
    - Проверка индикатора подушки после сборки
  forWhomHeading: Кому это нужно
  forWhom:
    - Обод вытерся до блестящего пластика или сменил цвет
    - Кожа потрескалась или разошлась по шву
    - Машина готовится к продаже, а руль выдаёт пробег
    - Хочется другой материал — например, алькантару на верхнем секторе
  honestHeading: Что нужно знать заранее
  honest: Мы не берёмся за рули со сработавшей подушкой безопасности или следами её замены без сервисной истории — это вопрос вашей безопасности, а не косметики. В таком случае сначала сервис, потом мы.
translations:
  sr:
    indexMetaTitle: 'Usluge detailing-a u Beogradu: PPF, poliranje, volan — Details'
    indexMetaDescription: Zaštitna folija PPF, promena boje, poliranje sa keramikom i restauracija volana. Cene, rokovi i iskrena ograničenja po svakoj usluzi.
    indexEyebrow: Usluge
    indexHeading: Četiri pravca, u svakom — do kraja
    indexLead: 'Za svaku uslugu u nastavku postoji posebna stranica: šta uključuje, koliko traje, kome odgovara i kada iskreno odgađamo.'
    specsPriceLabel: Cena
    specsDurationLabel: Rok
    specsWarrantyLabel: Garancija
    paint-protection-film:
      name: Zaštitna folija (PPF)
      short: Prozirna poliuretanska zaštita protiv kamenčića, peska i četkica pri pranju.
      metaTitle: Oklejavanje zaštitnom folijom PPF u Beogradu — Details
      metaDescription: 'Oklejavanje karoserije prozirnom zaštitnom folijom u Beogradu: prednji deo, kompletno oklevanje, uvrtanje ivica. Folije XPEL i SunTek. Garancija do 10 godina od proizvođača.'
      heroEyebrow: Zaštita karoserije
      heroTitle: Folija koja nije vidljiva, a oštećenja koja neće biti
      heroLead: Poliuretan debljine 190 mikrona apsorbuje kamenčiće s puta, pesak i tragove od četkica. Boja ispod ostaje fabrička — a to je ono što se gleda pri prodaji.
      priceFrom: od 690 € za prednji deo
      duration: 2–6 dana
      warranty: do 10 godina od proizvođača
      bodyHeading: Šta to daje
      body: |-
        Glavna vrednost folije nije ‘sjaj’, već očuvana fabrička boja. Prefarbano krilo može se lako uočiti bilo kojim mernim uređajem, a na pregledu pred kupovinu to odmah umanjuje cenu. Folija ublažava udarce umesto laka: sitne ogrebotine se same zaceljuju na suncu, a duboke ostaju na foliji, a ne na karoseriji.

        Pravimo izrezak pod konkretni model na plotter-u, a složene delove — branike, ogledala, stubove — prilagođavamo ručno. Tamo gde je ploča omogućava, uvijamo ivicu unutra: tako spoj ne skuplja prljavštinu i ne otkriva se tankom sivom linijom kroz godinu.

        Folije uzimamo od XPEL i SunTek. Koja od njih će ići na vašu mašinu, kažemo na pregledu — pre nego što se složite sa troškovnikom.
      includesHeading: Šta se uključuje
      includes:
        - Dvostepeno pranje, glina i odmašćivanje pre lepljenja
        - Tačkasto poliranje defekata, koji bi inače ostali pod folijom
        - Izrezak pod vaš model, ručna prilagodba složenih elemenata
        - Uvijanje ivica tamo gde geometrija panela to omogućava
        - Razmontiranje ručki, ogledala i svetala, ako zona to zahteva
        - Kontrolna proba nedelju dana nakon isporuke
      forWhomHeading: Kome je to potrebno
      forWhom:
        - Nova mašina koju želite da sačuvate u fabričkom stanju
        - Tamna ili mat boja, na kojoj se vidi svaka ogrebotina
        - Mnogo vožnje između gradova i šljunak na ivicama
        - Automobil u lizingu ili za brzu prodaju, gde je važan izveštaj o boji
      honestHeading: Kada odgađamo
      honest: 'Ako je automobil već prefarban jeftinim lakom ili se na panelu vide tragovi spaklovanja — foliju ne možemo postaviti: pri skidanju, ona će oduzeti premaz sa sobom. U tom slučaju, iskreno ćemo o tome reći na pregledu i predložiti prvo da dovedemo lak u red.'
    colour-change-wrap:
      name: Promena boje folijom
      short: Nova boja bez farbanja — i s mogućnošću vraćanja fabričkoj.
      metaTitle: Promena boje automobila folijom u Beogradu — Details
      metaDescription: 'Kompletno oklevanje obojenom folijom u Beogradu: mat, saten, sjaj, teksture. Povratno, bez farbanja, uz očuvanje fabričkog laka. Uzorci na vašoj mašini.'
      heroEyebrow: Boja
      heroTitle: Druga boja. Isti fabrički lak ispod.
      heroLead: Folija potpuno menja automobil, ali ostaje promenljiva. Posle dve godine može se skinuti i dobiti istu boju koja je bila sa fabrike — što nijedno farbanje ne može pružiti.
      priceFrom: od 1 900 € za karoseriju
      duration: 4–7 dana
      warranty: 3–5 godina na foliju
      bodyHeading: Zašto folija, a ne farbanje
      body: |-
        Farbanje je zauvek i to je upisano u istoriju automobila. Folija je rešenje na nekoliko godina, koje se može ukinuti. Prilikom prodaje skidate je i predajete auto u domaćoj boji, sa domaćim lakom ispod.

        Izbor boje uvek radimo na vašoj mašini, a ne iz kataloga na stolu: stavljamo uzorke na karoseriju pri dnevnom svetlu i gledamo kako se boja ponaša na vašim oblinama. Mat na jednom modelu izgleda skupo, a na drugom — ravno, i to se vidi samo uživo.

        Obojene folije uzimamo od 3M i HEXIS. Koju tačno stavljamo, fiksiramo u troškovniku zajedno sa cenom i rokom.
      includesHeading: Šta se uključuje
      includes:
        - Odabir boje uzorcima na vašoj karoseriji pri dnevnom svetlu
        - Razmontiranje ručki, moldinga, svetala i rešetki
        - Oklevanje sa uvrtanjem ivica u otvorima
        - Pružno lepljenje spojeva i obrada uglova fenom
        - Uputstvo za negu mat ili satena
        - Besplatno ispravljanje sitnih odvođenja u prvom mesecu
      forWhomHeading: Kome je to potrebno
      forWhom:
        - Želite drugu boju, ali bez gubitka fabričkog laka
        - Potrebni su mat, saten ili teksture koje nisu dostupne sa fabrike
        - Automobil u lizingu, gde je farbanje zabranjeno ugovorom
        - Komercijalni automobil koji treba da izgleda prepoznatljivo
      honestHeading: Šta treba znati unapred
      honest: Folija ne prikriva udubljenja i talase na karoseriji — naprotiv, mat naglašava ih jače nego sjaj. Ako na panelima postoje geometrijski defekti, prvo karoserijski popravak, pa boja. O tome ćemo reći na pregledu, a ne nakon oklevanja.
    polishing-ceramic:
      name: Poliranje i keramika
      short: Sklanjamo ogrebotine i paučinu, zatim pokrivamo rezultat keramikom na godine.
      metaTitle: Poliranje karoserije i keramika u Beogradu — Details
      metaDescription: Višestepeno poliranje sa merenjem debljine laka i keramičko premazivanje na 2–5 godina. Gledamo lak pod lampom i pokazujemo merenja. Studio Details, Beograd.
      heroEyebrow: Lak
      heroTitle: Prvo ukloniti ogrebotine. Tek tada nešto nanositi.
      heroLead: Keramika preko nepolihranog laka samo konzervira paučinu na nekoliko godina. Prvo uklanjamo defekte, a premaz stavljamo na gotovu površinu.
      priceFrom: od 450 € za automobil
      duration: 2–3 dana
      warranty: 2–5 godina na premaz
      bodyHeading: Kako to funkcioniše
      body: |-
        Poliranje je uklanjanje najtanjeg sloja laka zajedno s ogrebotinama. Sloj nije beskonačan, zato počinjemo sa mernim uređajem: merimo svaku panel i računamo koliko ima rezerva. Ako je na krovu ili krilima lak već tanak — radimo nežnije ili ne dodirujemo panel uopšte.

        Zatim dva ili tri prolaza: rezni sastav uklanja osnovne defekte, završni uklanja holograme od mašine. Rezultat gledamo pod lampom, koja prikazuje ono što nije vidljivo napolju. I tek nakon toga — odmašćivanje i keramika. Poliramo sastavima Koch-Chemie, keramiku postavljamo Gtechniq.
      includesHeading: Šta se uključuje
      includes:
        - Merenje debljine laka po svim panelima sa beleženjem rezultata
        - Dvofazna ili trofazna poliranje pod kontrolom lampe
        - Dezinficiranje površine pre nanošenja
        - Keramička zaštita sa stajanjem u boksu
        - Obrada stakala sastavom za odbijanje vode
        - Foto izveštaj pre i posle u istom svetlu
      forWhomHeading: Kome je to potrebno
      forWhom:
        - Automobil nakon nekoliko godina automatskog pranja
        - Tamne boje, na kojima je paučina vidljiva na svakom suncu
        - Priprema za prodaju, kada je važan prvi utisak
        - Svežeprebačen automobil posle transporta i parkiranja
      honestHeading: Kada odgađamo
      honest: Ako merni instrument pokazuje kritično tanak lak, poliranje nije moguće — moglo bi da se skine do osnove. U takvoj situaciji, ponudićemo blagu varijantu bez skidanja ili samo zaštitu, i objasniti šta smo videli na merenju.
    steering-wheel-restoration:
      name: Restauracija volana
      short: Izgrižena koža, sjajan obruč i oštećena plastika — vraćamo u prvobitno stanje.
      metaTitle: Restauracija volana i presvlačenje kože u Beogradu — Details
      metaDescription: 'Obnova kože volana u Beogradu: farbanje, presvlačenje, popravka plastike i dugmadi. Skidamo i montiramo volan s vazdušnom jastučićem. 2-3 dana.'
      heroEyebrow: Interijer
      heroTitle: Prvo na šta se dodiruje. I prvo što se stari.
      heroLead: 'Volan se troši brže od ostatka interijera: znoj, sunce i krema za ruke brišu boju u roku od par godina. Obnova košta neuporedivo manje od novog volana i izgleda kao sa fabrike.'
      priceFrom: od 150 €
      duration: 2–3 dana
      warranty: 1 godina
      bodyHeading: Šta radimo s njim
      body: |-
        Prvo skidamo volan u celosti — pažljivo, s isključivanjem akumulatora i vazdušne jastučića. Dalje zavisi od stanja: ako je koža netaknuta i samo je boja izubijena, čistimo je, obnavljamo teksturu i farbamo sastavom koji se ne lepi i ne umaže ruke. Ako je koža pocepana ili je šav puhao — presvučemo ponovo, s ručnim šavom po originalnom uzorku.

        Usput, dovedemo u red ono što obično propada pored: oštećena dugmad, izgrizeni plastika na delovima upravljača, sjaj na laticama.
      includesHeading: Šta se uključuje
      includes:
        - Skidanje i postavljanje volana s pravilnim radom vazdušne jastučića
        - Čišćenje i obnova teksture kože
        - Farbane ili potpuno presvučene s ručnim šavom
        - Obnova dugmadi i plastičnih obloga
        - Izbor boje i tipa šava prema vašem interijeru
        - Provera indikatora vazdušne jastučića nakon sklapanja
      forWhomHeading: Kome je to potrebno
      forWhom:
        - Obruč se izlizao do sjajne plastike ili je promenio boju
        - Koža se iskrzala ili je šav puhao
        - Automobil se priprema za prodaju, a volan otkriva pređene kilometre
        - Želite drugi materijal — na primer, alkantaru na gornjem sektoru
      honestHeading: Šta treba znati unapred
      honest: Ne uzimamo volane sa aktivnom vazdušnom jastučićem ili tragovima zamene bez servisne istorije — to je pitanje vaše sigurnosti, a ne estetike. U tom slučaju prvo servis, pa tek onda mi.
  en:
    indexMetaTitle: 'Detailing Services in Belgrade: PPF, Polishing, Wheel — Details'
    indexMetaDescription: PPF, color change wraps, polishing with ceramic coating and steering wheel restoration. Prices, duration, and honest limitations for each service.
    indexEyebrow: Services
    indexHeading: Four Directions, Each Fully Covered
    indexLead: 'There is a separate page for each service below: what’s included, how long it takes, who it’s suitable for, and when we honestly advise against it.'
    specsPriceLabel: Price
    specsDurationLabel: Duration
    specsWarrantyLabel: Warranty
    paint-protection-film:
      name: Paint Protection Film (PPF)
      short: Transparent polyurethane shield against stones, sand, and wash brushes.
      metaTitle: PPF Installation in Belgrade — Details
      metaDescription: 'Installation of transparent protective film in Belgrade: front, full wrap, edge curling. XPEL and SunTek films. Warranty up to 10 years from the manufacturer.'
      heroEyebrow: Body Protection
      heroTitle: Invisible Film, No Chips
      heroLead: 190-micron thick polyurethane absorbs stones from the road, sand, and brush marks. The paint beneath remains factory quality — a crucial factor when selling.
      priceFrom: from 690 € for the front
      duration: 2–6 days
      warranty: up to 10 years from the manufacturer
      bodyHeading: Benefits
      body: |-
        The main value of the film is not the gloss, but the preservation of the factory paint. A repainted fender is visible with any thickness gauge, and during the pre-purchase inspection, it immediately lowers the price. The film absorbs impacts instead of the clear coat: minor scratches self-heal in sunlight, while deep marks remain on the film, not on the body.

        We cut the pattern for each specific car using a plotter, and for complex areas — bumpers, mirrors, pillars — we tailor it by hand. Where the panel allows, we tuck the edge inward: this way, the seam doesn’t collect dirt or reveal itself as a thin gray line after a year.

        We source our films from XPEL and SunTek. The specific type suitable for your car is determined during the inspection, before you agree to the estimate.
      includesHeading: What’s Included
      includes:
        - Two-step wash, clay treatment, and degreasing before application
        - Spot polishing of defects that would otherwise become encapsulated under the film
        - Custom pattern for your model, manual fitting of complex elements
        - Edge curling where the panel geometry allows
        - Disassembly of handles, mirrors, and lights if the area requires it
        - Follow-up inspection one week after delivery
      forWhomHeading: Who Needs This
      forWhom:
        - A new car you want to keep in factory condition
        - A dark or matte color that shows every scratch
        - Frequent highway driving with gravel on the shoulders
        - A leased car or one you plan to sell quickly, where paint condition is crucial
      honestHeading: When We Advise Against It
      honest: 'If the car is already repainted with cheap clear coat or shows signs of body filler, the film cannot be applied: removing it will take the coating with it. In this case, we will honestly inform you during the inspection and suggest repairing the paint first.'
    colour-change-wrap:
      name: Color Change Wrap
      short: New color without repainting — and reversible to factory finish.
      metaTitle: Car Color Change with Film in Belgrade — Details
      metaDescription: 'Full wrap with colored film in Belgrade: matte, satin, gloss, textures. Reversible, without repainting, preserving factory clear coat. Samples on your vehicle.'
      heroEyebrow: Color
      heroTitle: Different Color. Same Factory Clear Coat Beneath.
      heroLead: The film completely transforms your vehicle, but remains reversible. After two years, you can remove it and get the original paint back — a benefit that no repaint can provide.
      priceFrom: from 1,900 € for the body
      duration: 4–7 days
      warranty: 3–5 years on the film
      bodyHeading: Why Film Instead of Paint
      body: |-
        Painting is permanent and marks a car’s history. Film is a temporary solution that can be undone. When you sell, you remove it and present the car in its original color, with its original clear coat underneath.

        We always choose the color on your car, not from a catalog on the table: we place samples on the body in daylight to see how the color behaves on your curves. Matte looks luxurious on one model but flat on another, and this is only visible in person.

        We source colored films from 3M and HEXIS. The specific type we use is noted in the estimate along with the price and timeline.
      includesHeading: What’s Included
      includes:
        - Color selection with samples on your body in daylight
        - Disassembly of handles, moldings, lights, and grilles
        - Wrapping with edge curling in openings
        - Sealing of joints and edge treatment with a heat gun
        - Care instructions for matte or satin finishes
        - Free minor repairs for peeling within the first month
      forWhomHeading: Who Needs This
      forWhom:
        - Wanting a different color, but without losing the factory paint
        - Need matte, satin, or textures that are not factory available
        - Leased vehicle where repainting is prohibited by contract
        - Commercial vehicle that needs to remain recognizable
      honestHeading: What You Should Know in Advance
      honest: The film does not hide dents and waves on the body — in fact, matte emphasizes them more than gloss. If panels have geometric defects, bodywork repair should be done first, then color. We will inform you about this during the inspection, not after the wrap.
    polishing-ceramic:
      name: Polishing and Ceramic Coating
      short: We remove scratches and swirls, sealing the result with ceramic coating for years.
      metaTitle: Body Polishing and Ceramic Coating in Belgrade — Details
      metaDescription: Multi-step polishing with clear coat thickness measurement and ceramic coating lasting 2–5 years. We inspect the clear coat under a light and show you the measurements. Studio Details, Belgrade.
      heroEyebrow: Clear Coat
      heroTitle: First, Remove Scratches. Only Then, Apply Anything.
      heroLead: Ceramic coating over an unpolished clear coat simply preserves swirls for years. We first correct defects, then apply the coating to a prepared surface.
      priceFrom: from 450 € per vehicle
      duration: 2–3 days
      warranty: 2–5 years on the coating
      bodyHeading: How It Works
      body: |-
        Polishing involves removing the thinnest layer of the clear coat along with imperfections. The layer isn’t unlimited, so we start with a thickness gauge: measuring each panel and calculating how much material is left. If the clear coat is already thin on the roof or fenders, we work more gently or leave the panel untouched.

        Next, we use two or three passes: cutting compound removes major defects, while finishing compound eliminates holograms from the machine. We inspect the result under a light that reveals what’s not visible outside. Only after this do we degrease and apply ceramic coating. We polish with Koch-Chemie compounds and apply Gtechniq ceramic coating.
      includesHeading: What’s Included
      includes:
        - Clear coat thickness measurement on all panels with documentation of results
        - Two- or three-stage polishing under lamp control
        - Degreasing the surface before application
        - Ceramic coating cured in the box
        - Application of a water-repellent treatment on the glass
        - Photo report before and after in consistent lighting
      forWhomHeading: Who Needs This
      forWhom:
        - Vehicle after several years of automatic washes
        - Dark colors where spider webbing shows under any sunlight
        - Preparation for sale, where the first impression counts
        - Freshly imported vehicle after transport and parking
      honestHeading: When We Advise Against It
      honest: If the thickness gauge shows critically thin clear coat, polishing is not possible—it could rub through to the primer. In such situations, we will suggest a gentle option without material removal or only a protective coating and explain what we observed during measurements.
    steering-wheel-restoration:
      name: Steering Wheel Restoration
      short: Worn leather, shiny rim, and peeling plastic—restored to original condition.
      metaTitle: Steering Wheel Restoration and Leather Reupholstery in Belgrade — Details
      metaDescription: 'Restoring steering wheel leather in Belgrade: repainting, reupholstering, plastic and button repair. We remove and reinstall the wheel with the airbag. 2–3 days.'
      heroEyebrow: Interior
      heroTitle: The first thing you touch. And the first to wear out.
      heroLead: 'The steering wheel wears out faster than the rest of the interior: sweat, sun, and hand cream wear off the paint within a couple of years. Restoration costs significantly less than a new wheel and looks factory-fresh.'
      priceFrom: from 150 €
      duration: 2–3 days
      warranty: 1 year
      bodyHeading: What We Do
      body: |-
        First, we remove the steering wheel completely—carefully, disconnecting the battery and airbag. What follows depends on its condition: if the leather is intact and only the paint has worn off, we clean it, restore the texture, and repaint it with a non-sticky formula that won’t soil your hands. If the leather is torn or the stitching has come apart, we reupholster it, hand-stitching according to the original pattern.

        Additionally, we address areas that typically wear out alongside: peeling buttons, scuffed plastic around the steering column, and gloss on the paddles.
      includesHeading: What’s Included
      includes:
        - Removal and installation of the steering wheel with proper airbag handling
        - Cleaning and restoration of leather texture
        - Repainting or complete reupholstery with hand stitching
        - Restoration of buttons and plastic overlays
        - Matching color and stitching type to your interior
        - Airbag indicator check after assembly
      forWhomHeading: Who Needs This
      forWhom:
        - Rim worn down to shiny plastic or changed color
        - Leather cracked or stitching has come undone
        - Vehicle being prepared for sale, and the steering wheel shows wear
        - Desire for a different material—such as Alcantara on the top section
      honestHeading: What You Should Know in Advance
      honest: We do not take on wheels with deployed airbags or evidence of airbag replacement without a service history—this is a matter of safety, not just aesthetics. In such cases, service first, then us.
