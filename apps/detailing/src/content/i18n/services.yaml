paint-protection-film:
  name: Защитная плёнка (PPF)
  short: Прозрачная полиуретановая броня против камней, песка и щёток на мойке.
  metaTitle: Оклейка защитной плёнкой PPF в Белграде — Details
  metaDescription: 'Оклейка кузова прозрачной защитной плёнкой в Белграде: перёд, полная оклейка, заворот кромок. Плёнки XPEL и SunTek.'
  heroEyebrow: Защита кузова
  heroTitle: Плёнка, которую не видно, и сколы, которых не будет
  heroLead: Полиуретан толщиной 190 микрон принимает на себя камни с трассы, песок и следы от щёток. Краска под ним остаётся заводской — а это то, что смотрят при продаже.
  priceFrom: от 690 € за перёд
  duration: 2–6 дней
  bodyHeading: Что это даёт
  body: |
    Главная ценность плёнки — не «блеск», а сохранённая заводская краска. Перекрашенное крыло видно любым толщиномером, и на осмотре перед покупкой это сразу минус к цене. Плёнка держит удар вместо лака: мелкие царапины на ней затягиваются сами на солнце, глубокие остаются на плёнке, а не на кузове.

    Мы режем выкройку под конкретный кузов на плоттере, а сложные места — бамперы, зеркала, стойки — подгоняем руками. Там, где панель позволяет, заворачиваем край внутрь: так стык не собирает грязь и не выдаёт себя тонкой серой полоской через год.

    Плёнку берём у XPEL и SunTek. Какая из них пойдёт на вашу машину, называем на осмотре — до того, как вы согласитесь на смету.
  includesHeading: Что входит
  includes:
    - Двухэтапная мойка, глина и обезжиривание перед наклейкой
    - Точечная полировка дефектов, которые иначе запечатались бы под плёнкой
    - Выкройка под вашу модель, ручная подгонка сложных элементов
    - Заворот кромок там, где геометрия панели это позволяет
    - Разбор ручек, зеркал и фонарей, если зона того требует
    - Контрольный осмотр через неделю после выдачи
  forWhomHeading: Кому это нужно
  forWhom:
    - Новая машина, которую хочется сохранить в заводском состоянии
    - Тёмный или матовый цвет, на котором видно каждую риску
    - Много трассы между городами и щебень на обочинах
    - Машина в лизинге или под скорую продажу, где важен отчёт по краске
  honestHeading: Когда мы отговариваем
  honest: 'Если машина уже перекрашена дешёвым лаком или на панели видны следы шпаклёвки — плёнку класть нельзя: при снятии она заберёт покрытие с собой. В таком случае мы честно скажем об этом на осмотре и предложим сначала привести лак в порядок.'
colour-change-wrap:
  name: Смена цвета плёнкой
  short: Новый цвет без покраски — и с возможностью вернуть заводской.
  metaTitle: Смена цвета автомобиля плёнкой в Белграде — Details
  metaDescription: 'Полная оклейка цветной плёнкой в Белграде: мат, сатин, глянец, текстуры. Обратимо, без перекраски, с сохранением заводского лака. Образцы на вашей машине.'
  heroEyebrow: Цвет
  heroTitle: Другой цвет. Тот же заводской лак под ним.
  heroLead: Плёнка меняет машину полностью, но остаётся обратимой. Через два года можно снять её и получить ту же краску, что была с завода, — чего не даст ни одна покраска.
  priceFrom: от 1 900 € за кузов
  duration: 4–7 дней
  bodyHeading: Почему плёнка, а не покраска
  body: |
    Покраска — это навсегда и это запись в истории автомобиля. Плёнка — это решение на несколько лет, которое можно отменить. При продаже вы снимаете её и отдаёте машину в родном цвете, с родным лаком под ней.

    Выбор цвета мы всегда делаем на вашей машине, а не по каталогу на столе: кладём образцы на кузов при дневном свете и смотрим, как цвет ведёт себя на ваших изгибах. Матовый на одной модели выглядит дорого, а на другой — плоско, и это видно только вживую.

    Цветные плёнки берём у 3M и HEXIS. Какую именно кладём, фиксируем в смете вместе с ценой и сроком.
  includesHeading: Что входит
  includes:
    - Подбор цвета образцами на вашем кузове при дневном свете
    - Разбор ручек, молдингов, фонарей и решёток
    - Оклейка с заворотом кромок в проёмах
    - Проклейка стыков и обработка углов феном
    - Инструкция по уходу за матом или сатином
    - Бесплатная правка мелких отслоений в первый месяц
  forWhomHeading: Кому это нужно
  forWhom:
    - Хочется другой цвет, но без потери заводской краски
    - Нужен мат, сатин или текстура, которых не бывает с завода
    - Машина в лизинге, где перекраска запрещена договором
    - Коммерческий автомобиль, который должен выглядеть узнаваемо
  honestHeading: Что нужно знать заранее
  honest: Плёнка не прячет вмятины и волны на кузове — наоборот, матовая подчёркивает их сильнее, чем глянец. Если на панелях есть геометрические дефекты, сначала кузовной ремонт, потом цвет. Мы скажем об этом на осмотре, а не после оклейки.
polishing-ceramic:
  name: Полировка и керамика
  short: Снимаем риски и паутинку, закрываем результат керамикой на годы.
  metaTitle: Полировка кузова и керамика в Белграде — Details
  metaDescription: Многоэтапная полировка с замером толщины лака и керамическое покрытие на 2–5 лет. Смотрим лак под лампой и показываем замеры. Студия Details, Белград.
  heroEyebrow: Лак
  heroTitle: Сначала убрать риски. Только потом что-то наносить.
  heroLead: Керамика поверх непрополированного лака просто консервирует паутинку на несколько лет. Мы сначала выводим дефекты, а покрытие кладём уже на готовую поверхность.
  priceFrom: от 450 € за автомобиль
  duration: 2–3 дня
  bodyHeading: Как это устроено
  body: |
    Полировка — это снятие тончайшего слоя лака вместе с рисками. Слой не бесконечный, поэтому мы начинаем с толщиномера: замеряем каждую панель и считаем, сколько запаса есть. Если на крыше или крыльях лак уже тонкий — работаем мягче или не трогаем панель вовсе.

    Дальше два или три прохода: режущий состав снимает основные дефекты, финишный убирает голограммы от машинки. Результат смотрим под лампой, которая показывает то, чего не видно на улице. И только после этого — обезжиривание и керамика. Полируем составами Koch-Chemie, керамику кладём Gtechniq.
  includesHeading: Что входит
  includes:
    - Замер толщины лака по всем панелям с записью результатов
    - Двух- или трёхэтапная полировка под контролем лампы
    - Обезжиривание поверхности перед нанесением
    - Керамическое покрытие с выдержкой в боксе
    - Обработка стёкол водоотталкивающим составом
    - Фотоотчёт до и после в одинаковом свете
  forWhomHeading: Кому это нужно
  forWhom:
    - Машина после нескольких лет автоматических моек
    - Тёмный цвет, на котором паутинка видна на любом солнце
    - Подготовка к продаже, когда важна первая секунда впечатления
    - Свежепригнанный автомобиль после перевозки и стоянок
  honestHeading: Когда мы отговариваем
  honest: Если толщиномер показывает критично тонкий лак, полировать нельзя — можно протереть до грунта. В такой ситуации мы предложим мягкий вариант без съёма или только защитное покрытие, и объясним, что именно увидели на замерах.
steering-wheel-restoration:
  name: Реставрация руля
  short: Затёртая кожа, лоснящийся обод и облезший пластик — в исходное состояние.
  metaTitle: Реставрация руля и перетяжка кожи в Белграде — Details
  metaDescription: 'Восстановление кожи руля в Белграде: перекраска, перетяжка, ремонт пластика и кнопок. Снимаем и ставим руль с подушкой безопасности. 2–3 дня.'
  heroEyebrow: Салон
  heroTitle: Первое, к чему прикасаются. И первое, что стареет.
  heroLead: 'Руль изнашивается быстрее всего салона: пот, солнце и крем для рук вытирают краску за пару лет. Восстановление стоит несоизмеримо дешевле нового руля и выглядит как заводской.'
  priceFrom: от 150 €
  duration: 2–3 дня
  bodyHeading: Что мы с ним делаем
  body: |
    Сначала снимаем руль целиком — аккуратно, с отключением аккумулятора и подушки безопасности. Дальше зависит от состояния: если кожа цела и вытерлась только краска, мы её очищаем, восстанавливаем фактуру и перекрашиваем составом, который не липнет и не пачкает руки. Если кожа порвана или прошивка разошлась — перетягиваем заново, с ручной прошивкой по оригинальному рисунку.

    Заодно приводим в порядок то, что обычно портится рядом: облезшие кнопки, потёртый пластик подрулевых накладок, глянец на лепестках.
  includesHeading: Что входит
  includes:
    - Снятие и установка руля с корректной работой с подушкой безопасности
    - Очистка и восстановление фактуры кожи
    - Перекраска или полная перетяжка с ручной прошивкой
    - Восстановление кнопок и пластиковых накладок
    - Подбор цвета и типа строчки под ваш салон
    - Проверка индикатора подушки после сборки
  forWhomHeading: Кому это нужно
  forWhom:
    - Обод вытерся до блестящего пластика или сменил цвет
    - Кожа потрескалась или разошлась по шву
    - Машина готовится к продаже, а руль выдаёт пробег
    - Хочется другой материал — например, алькантару на верхнем секторе
  honestHeading: Что нужно знать заранее
  honest: Мы не берёмся за рули со сработавшей подушкой безопасности или следами её замены без сервисной истории — это вопрос вашей безопасности, а не косметики. В таком случае сначала сервис, потом мы.
translations:
  sr:
    indexMetaTitle: 'Usluge detaljinga u Beogradu: PPF, poliranje, volan — Details'
    indexMetaDescription: Zaštitna folija PPF, promjena boje, poliranje s keramičkim premazom i restoracija volana. Cene, rokovi i poštena ograničenja za svaku uslugu.
    indexEyebrow: Usluge
    indexHeading: Četiri oblasti, svaka do kraja
    indexLead: 'Za svaku uslugu u nastavku postoji posebna stranica: šta uključuje, koliko traje, kome odgovara i kada vas iskreno odvratimo.'
    specsPriceLabel: Cena
    specsDurationLabel: Rok
    paint-protection-film:
      name: Zaštitna folija (PPF)
      short: Prozirna poliuretanska zaštita protiv kamenčića, peska i četki na pranju.
      metaTitle: Oklapanje zaštitnom folijom PPF u Beogradu — Details
      metaDescription: 'Oklapanje karoserije prozirnom zaštitnom folijom u Beogradu: prednji deo, kompletno oklapanje, savijanje ivica. Folije XPEL i SunTek.'
      heroEyebrow: Zaštita karoserije
      heroTitle: Folija koja se ne vidi i ogrebotine koje neće biti
      heroLead: Poliuretan debljine 190 mikrona preuzima kamenčiće sa puta, pesak i tragove od četki. Boja ispod ostaje fabrička — i to je ono što se gleda prilikom prodaje.
      priceFrom: od 690 € za prednji deo
      duration: 2–6 dana
      bodyHeading: Šta to donosi
      body: |-
        Glavna vrednost folije nije „sjaj“, već očuvana fabrička boja. Prekrečena krila su vidljiva svakom mernom uređaju, i na pregledu pre kupovine to odmah zalazi cenu. Folija preuzima udarce umesto laka: male ogrebotine se same zarastaju na suncu, duboke ostaju na foliji, a ne na karoseriji.

        Mi sečemo uzorak prema konkretnoj karoseriji na plotteru, a složena mesta — branici, ogledala, stubovi — prilagođavamo ručno. Tamo gde panel dozvoljava, savijamo ivicu unutra: tako spojevi ne skupljaju prljavštinu i ne iznose se tankom sivom linijom kroz godinu.

        Foliju uzimamo od XPEL i SunTek. Koja od njih će ići na vaš auto, kažemo na pregledu — pre nego što se saglasite sa troškovnikom.
      includesHeading: Šta uključuje
      includes:
        - Dvofazno pranje, glina i odmašćivanje pre lepljenja
        - Tačkasto poliranje nedostataka koji bi se inače zapečatili pod folijom
        - Uzorak za vaš model, ručna prilagodba složenih elemenata
        - Savijanje ivica tamo gde geometrija panela to dozvoljava
        - Razmontiranje ručica, ogledala i svetala ako zona to zahteva
        - Kontrolni pregled kroz nedelju dana nakon isporuke
      forWhomHeading: Kome je ovo potrebno
      forWhom:
        - Nova mašina koju želite da sačuvate u fabričkom stanju
        - Tamna ili mat boja na kojoj se vidi svaka ogrebotina
        - Mnoge trase između gradova i šljunak na ivicama
        - Auto u lizingu ili za brzu prodaju, gde je važno izveštavanje o boji
      honestHeading: Kada vas odvratimo
      honest: 'Ako je auto već prekrečen jeftinim lakom ili se na panelu vide tragovi spaklovanja — foliju ne možemo lepit: prilikom skidanja oduzećemo premaz sa sobom. U tom slučaju ćemo vam iskreno reći o tome na pregledu i predložiti prvo da dovedemo lak u red.'
    colour-change-wrap:
      name: Promena boje folijom
      short: Nova boja bez farbanja — i s mogućnošću vraćanja fabričkoj.
      metaTitle: Promena boje automobila folijom u Beogradu — Details
      metaDescription: 'Kompletno oklapanje obojenom folijom u Beogradu: mat, satenski, sjajni, teksturni. Povratno, bez farbanja, s čuvanjem fabričnog laka. Uzorci na vašem autu.'
      heroEyebrow: Boja
      heroTitle: Drugačija boja. Isti fabrički lak ispod nje.
      heroLead: Folija potpuno menja auto, ali ostaje obrnuta. Kroz dve godine može se skinuti i dobiti istu boju kao sa fabrike — što nijedno farbanje ne može pružiti.
      priceFrom: od 1 900 € za karoseriju
      duration: 4–7 dana
      bodyHeading: Zašto folija, a ne farbanje
      body: |-
        Farbanje je zauvek i to je upisano u istoriju automobila. Folija je rešenje na nekoliko godina koje se može opozvati. Prilikom prodaje skidate je i predate auto u njegovoj izvornoj boji, sa originalnim lakom ispod.

        Izbor boje uvek radimo na vašem vozilu, a ne iz kataloga na stolu: stavljamo uzorke na karoseriju pri dnevnoj svetlosti i gledamo kako se boja ponaša na vašim krivinama. Mat na jednom modelu izgleda skupo, a na drugom — ravno, i to se vidi samo uživo.

        Obojene folije uzimamo od 3M i HEXIS. Koju tačno stavljamo, fiksiramo u troškovniku zajedno s cenom i rokom.
      includesHeading: Šta uključuje
      includes:
        - Odabir boje uzorcima na vašoj karoseriji pri dnevnoj svetlosti
        - Razmontiranje ručica, lajsni, svetala i rešetki
        - Oklapanje s savijanjem ivica u otvorima
        - Završno lepljenje spojeva i obrada uglova fenom
        - Uputstvo za negu mat ili satena
        - Besplatna korekcija malih odvajanja u prvom mesecu
      forWhomHeading: Kome je ovo potrebno
      forWhom:
        - Želite drugu boju, ali bez gubitka fabričnog laka
        - Potrebna vam je mat, satin ili tekstura koji ne postoje kod fabrike
        - Auto u lizingu, gde je farbanje zabranjeno ugovorom
        - Komercijalno vozilo koje mora izgledati prepoznatljivo
      honestHeading: Šta treba znati unapred
      honest: Folija ne prikriva udubljenja i valove na karoseriji — naprotiv, mat još više naglašava nego sjaj. Ako na panelima postoje geometrijski nedostaci, prvo karoserijski popravak, zatim boja. O tome ćemo vam reći na pregledu, a ne nakon oklapanja.
    polishing-ceramic:
      name: Poliranje i keramika
      short: Uklanjamo ogrebotine i paukove, pokrivamo rezultat keramikom na godine.
      metaTitle: Poliranje karoserije i keramika u Beogradu — Details
      metaDescription: Višefazno poliranje sa merenjem debljine laka i keramičkim premazom na 2–5 godina. Gledamo lak pod lampom i pokazujemo merenja. Studio Details, Beograd.
      heroEyebrow: Lak
      heroTitle: Prvo ukloniti ogrebotine. Samo onda nešto nanosimo.
      heroLead: Keramika na nepolirom lak jednostavno konzervira paukovu mrežu na nekoliko godina. Prvo izvlačimo nedostatke, a premaz stavljamo na gotovu površinu.
      priceFrom: od 450 € za automobil
      duration: 2–3 dana
      bodyHeading: Kako to funkcioniše
      body: |-
        Poliranje je uklanjanje najtanjeg sloja laka zajedno s ogrebotinama. Sloj nije beskonačan, zato počinjemo sa mernim uređajem: merimo svaku panju i računamo koliko imamo rezerve. Ako je lak na krovu ili krilima već tanak — radimo nežnije ili ne diramo panel uopšte.

        Zatim dva ili tri prolaza: rezački sastav uklanja osnovne nedostatke, fini završava sa hologramima od mašine. Rezultat gledamo pod lampom, koja pokazuje ono što nije vidljivo napolju. I tek nakon toga — odmašćivanje i keramika. Poliramo s proizvodima Koch-Chemie, keramiku stavljamo Gtechniq.
      includesHeading: Šta uključuje
      includes:
        - Merenje debljine laka po svim panelima uz beleženje rezultata
        - Dvofazno ili trofazno poliranje pod kontrolom lampe
        - Odmašćivanje površine pre nanošenja
        - Keramički premaz sa zadržavanjem u boksu
        - Obrada stakala vodoodbojnim sastavom
        - Fotoizveštaj pre i posle u istom svetlu
      forWhomHeading: Kome je ovo potrebno
      forWhom:
        - Automobil nakon nekoliko godina automatskih pranja
        - Tamna boja koja pokazuje paučinaste tragove na svakom suncu
        - Priprema za prodaju kada je važna prva sekunda utiska
        - Sveže dovezen automobil nakon transporta i parkiranja
      honestHeading: Kada vas odvratimo
      honest: Ako merni uređaj pokazuje kritično tanki lak, poliranje nije moguće — može se doći do osnovnog sloja. U takvoj situaciji ponudićemo blagu opciju bez skidanja ili samo zaštitni premaz i objasnićemo šta smo tačno primetili na merenjima.
    steering-wheel-restoration:
      name: Restauracija volana
      short: Isceđena koža, sjajni obod i oštećena plastika — u prvobitno stanje.
      metaTitle: Restauracija volana i presvlačenje kože u Beogradu — Details
      metaDescription: 'Obnova kože volana u Beogradu: prefarbanje, presvlačenje, popravka plastike i dugmadi. Skidamo i postavljamo volan sa vazdušnim jastukom. 2–3 dana.'
      heroEyebrow: Enterijer
      heroTitle: Prvo, čega se dodiruje. I prvo, što stari.
      heroLead: 'Volan se istroši brže od ostatka enterijera: znoj, sunce i krema za ruke skidaju boju u roku od nekoliko godina. Obnova košta nesrazmerno manje od novog volana i izgleda kao fabrički.'
      priceFrom: od 150 €
      duration: 2–3 dana
      bodyHeading: Šta radimo sa njim
      body: |-
        Prvo skidamo volan u celini — pažljivo, uz isključivanje akumulatora i vazdušnog jastuka. Dalje zavisi od stanja: ako je koža netaknuta i samo je boja izbleđena, čistimo je, obnavljamo teksturu i prefarbavamo sastavom koji se ne lepi i ne prlja ruke. Ako je koža pocepana ili šav se razdvojio — presvučemo ponovo, sa ručnom šavom po originalnom uzorku.

        Ujedno dovedemo u red ono što obično propada pored: oštećena dugmad, izlizana plastika pored volana, sjaj na laticama.
      includesHeading: Šta uključuje
      includes:
        - Skidanje i postavljanje volana uz ispravnu upotrebu vazdušnog jastuka
        - Čišćenje i obnavljanje teksture kože
        - Prefarbanje ili kompletno presvlačenje sa ručnom šavom
        - Obnova dugmadi i plastičnih obloga
        - Odabir boje i tipa šava prema vašem enterijeru
        - Provera indikatora vazdušnog jastuka nakon sastavljanja
      forWhomHeading: Kome je ovo potrebno
      forWhom:
        - Obod se istrošio do sjajne plastike ili promenio boju
        - Koža se iskrzala ili razdvojila po šavu
        - Automobil se priprema za prodaju, a volan pokazuje pređeni put
        - Želite drugi materijal — na primer, alkantara na gornjem delu
      honestHeading: Šta treba znati unapred
      honest: Ne prihvatamo volane sa aktivnim vazdušnim jastukom ili tragovima zamene bez servisne istorije — to je pitanje vaše sigurnosti, a ne estetike. U tom slučaju prvo servis, a onda mi.
  en:
    indexMetaTitle: 'Detailing Services in Belgrade: PPF, Polishing, Steering Wheel — Details'
    indexMetaDescription: PPF, colour-change wraps, machine polishing with ceramic coating and steering wheel restoration. Prices, durations and honest limitations on each service.
    indexEyebrow: Services
    indexHeading: Four Specialties, Each Fully Explored
    indexLead: "Each service below has a dedicated page: what’s included, how long it takes, who it's suitable for, and when we sincerely advise against it."
    specsPriceLabel: Price
    specsDurationLabel: Duration
    paint-protection-film:
      name: Paint Protection Film (PPF)
      short: Transparent polyurethane shield against stones, sand, and wash brushes.
      metaTitle: PPF Installation in Belgrade — Details
      metaDescription: 'Body wrap with transparent protective film in Belgrade: front, full wrap, edge rounding. XPEL and SunTek films.'
      heroEyebrow: Body Protection
      heroTitle: Invisible Film, No Chips
      heroLead: 190-micron polyurethane absorbs stones from the road, sand, and brush marks. The paint beneath remains factory-fresh—critical during resale.
      priceFrom: from 690 € for front
      duration: 2–6 days
      bodyHeading: What It Provides
      body: |-
        The main value of the film is not 'shine,' but preserved factory paint. Repainted fenders are detectable by any thickness gauge, and this is an immediate price deduction during inspection before purchase. The film absorbs impacts instead of the clear coat: minor scratches on it self-heal in sunlight, deep scratches remain on the film, not on the body.

        We cut patterns specific to your vehicle using a plotter, and for complex areas—bumpers, mirrors, pillars—we fit manually. Where the panel allows, we tuck the edge inside: this way, the seam doesn’t collect dirt and doesn’t reveal itself with a thin gray stripe after a year.

        We source films from XPEL and SunTek. We will specify which one suits your car during the inspection—before you agree to the estimate.
      includesHeading: What's Included
      includes:
        - Two-stage wash, clay, and degreasing before application
        - Spot polishing of defects that would otherwise be sealed under the film
        - Custom pattern for your model, manual fitting of complex elements
        - Edge rounding where the geometry of the panel allows
        - Dismantling of handles, mirrors, and lights if the area requires it
        - Check-up one week after delivery
      forWhomHeading: Who Needs This
      forWhom:
        - A new car you want to keep in factory condition
        - A dark or matte color where every scratch is visible
        - Frequent highway driving and gravel on the shoulders
        - A car in leasing or for quick sale, where paint report is important
      honestHeading: When We Advise Against It
      honest: 'If the car has already been repainted with cheap clear coat or there are signs of body filler on the panel—film application is not advisable: removing it will take the coating with it. In such a case, we will honestly advise this during the inspection and suggest fixing the clear coat first.'
    colour-change-wrap:
      name: Colour Change Wrap
      short: A new color without repainting—and with the option to revert to factory.
      metaTitle: Car Colour Change Wrap in Belgrade — Details
      metaDescription: 'Full wrapping with colored film in Belgrade: matte, satin, gloss, textures. Reversible, without repainting, preserving factory clear coat. Samples on your car.'
      heroEyebrow: Colour
      heroTitle: A Different Color. The Same Factory Clear Coat Underneath.
      heroLead: The film completely changes the car, but remains reversible. After two years it can be removed to reveal the original factory paint, which no repaint can achieve.
      priceFrom: from 1,900 € for the body
      duration: 4–7 days
      bodyHeading: Why Film Instead of Paint
      body: |-
        Painting is permanent and recorded in the car's history. Film is a temporary solution that can be reversed. When selling, you remove it and present the car in its original color with its original clear coat underneath.

        We always choose the color on your car, not from a catalog on the table: we place samples on the body in daylight and observe how the color behaves on your curves. Matte looks luxurious on one model, but flat on another, and only live viewing reveals this.

        We source colored films from 3M and HEXIS. The specific film used will be recorded in the estimate along with its price and duration.
      includesHeading: What's Included
      includes:
        - Color selection with samples on your body in daylight
        - Dismantling of handles, moldings, lights, and grilles
        - Wrapping with edge rounding in openings
        - Seam gluing and heat gun processing of corners
        - Care instructions for matte or satin finishes
        - Free touch-ups for minor peeling in the first month
      forWhomHeading: Who Needs This
      forWhom:
        - Want a different color without losing factory paint
        - Need matte, satin, or textures unavailable from the factory
        - A leasing car where repainting is prohibited by contract
        - A commercial vehicle that needs to look recognizable
      honestHeading: What to Know in Advance
      honest: The film does not hide dents and waves on the body—in fact, matte emphasizes them more than gloss. If there are geometric defects on the panels, first perform body repair, then apply color. We will inform you of this during the inspection, not after wrapping.
    polishing-ceramic:
      name: Polishing and Ceramic Coating
      short: We remove scratches and swirls, sealing the result with ceramic coating for years.
      metaTitle: Body Polishing and Ceramic Coating in Belgrade — Details
      metaDescription: Multi-stage polishing with thickness measurement and ceramic coating lasting 2–5 years. We inspect the paint under a lamp and show measurements. Studio Details, Belgrade.
      heroEyebrow: Clear Coat
      heroTitle: First Remove Scratches. Only Then Apply Anything.
      heroLead: Ceramic on unpolished clear coat simply seals in swirls for years. First, we fix defects, then we apply the coating on a ready surface.
      priceFrom: from 450 € per vehicle
      duration: 2–3 days
      bodyHeading: How It Works
      body: |-
        Polishing involves removing the thinnest layer of clear coat along with the scratches. This layer is not endless, so we start with a thickness gauge: we measure each panel and assess how much material is left. If the clear coat is already thin on the roof or fenders—we work more gently or leave the panel untouched.

        Next, we perform two or three passes: a cutting compound removes major defects, and a finishing compound eliminates holograms from the machine. The result is inspected under a lamp, which reveals what is not visible outdoors. Only after this do we degrease and apply ceramic. We use Koch-Chemie compounds for polishing, and apply Gtechniq for the ceramic.
      includesHeading: What's Included
      includes:
        - Measurement of clear coat thickness across all panels with recorded results
        - Two or three-stage polishing under lamp control
        - Degreasing the surface before application
        - Ceramic coating with curing in the box
        - Glass treatment with a water-repellent solution
        - Before and after photo report in the same lighting
      forWhomHeading: Who Needs This
      forWhom:
        - A car after several years of automatic washes
        - Dark color where spider webs are visible in any sun
        - Preparing for sale, where the first impression matters
        - A freshly imported car after transport and parking
      honestHeading: When We Advise Against It
      honest: If the thickness gauge shows critically thin paint, polishing is not possible — it can wear down to the primer. In such cases, we will offer a gentle option without removal or just a protective coating, and explain what we saw in the measurements.
    steering-wheel-restoration:
      name: Steering Wheel Restoration
      short: Worn leather, shiny rim, and peeling plastic — brought back to original condition.
      metaTitle: Steering Wheel Restoration and Leather Reupholstery in Belgrade — Details
      metaDescription: 'Steering wheel leather restoration in Belgrade: repainting, reupholstering, and plastic repairs. We remove and reinstall the wheel with the airbag. 2–3 days.'
      heroEyebrow: Interior
      heroTitle: The first thing you touch. And the first thing to age.
      heroLead: 'The steering wheel wears out faster than the interior: sweat, sun, and hand cream wear away the paint in just a couple of years. Restoration costs significantly less than a new steering wheel and looks factory fresh.'
      priceFrom: from 150 €
      duration: 2–3 days
      bodyHeading: What we do with it
      body: |-
        We first carefully remove the steering wheel — disconnecting the battery and airbag. What follows depends on its condition: if the leather is intact and only the paint has worn off, we clean it, restore the texture, and repaint with a non-sticky formula that won’t stain your hands. If the leather is torn or the stitching has come apart, we reupholster it, hand-stitching to the original pattern.

        We also take care of what typically gets damaged nearby: worn buttons, scuffed plastic around the steering column, and glossy surfaces on the paddles.
      includesHeading: What's Included
      includes:
        - Removal and installation of the steering wheel with correct airbag functionality
        - Cleaning and restoration of leather texture
        - Repainting or full reupholstering with hand stitching
        - Restoration of buttons and plastic trim
        - Color and stitch type matching to your interior
        - Airbag indicator check after reassembly
      forWhomHeading: Who Needs This
      forWhom:
        - The rim has worn down to shiny plastic or changed color
        - The leather has cracked or the stitching has come apart
        - The car is being prepared for sale, and the steering wheel shows wear
        - You want a different material — for example, alcantara on the upper sector
      honestHeading: What to Know in Advance
      honest: We do not take on steering wheels with deployed airbags or signs of replacement without a service history — this is a matter of your safety, not aesthetics. In such cases, first service, then us.
