paint-protection-film:
  name: Защитная плёнка (PPF)
  short: Прозрачная полиуретановая броня против камней, песка и щёток на мойке.
  metaTitle: Оклейка защитной плёнкой PPF в Белграде — Details
  metaDescription: 'Оклейка кузова прозрачной защитной плёнкой в Белграде: перёд, полная оклейка, заворот кромок. Плёнки XPEL и SunTek.'
  heroEyebrow: Защита кузова
  heroTitle: Плёнка, которую не видно, и сколы, которых не будет
  heroLead: Полиуретан толщиной 190 микрон принимает на себя камни с трассы, песок и следы от щёток. Краска под ним остаётся заводской — а это то, что смотрят при продаже.
  priceFrom: от 690 € за перёд
  duration: 2–6 дней
  bodyHeading: Что это даёт
  body: |
    Главная ценность плёнки — не «блеск», а сохранённая заводская краска. Перекрашенное крыло видно любым толщиномером, и на осмотре перед покупкой это сразу минус к цене. Плёнка держит удар вместо лака: мелкие царапины на ней затягиваются сами на солнце, глубокие остаются на плёнке, а не на кузове.

    Мы режем выкройку под конкретный кузов на плоттере, а сложные места — бамперы, зеркала, стойки — подгоняем руками. Там, где панель позволяет, заворачиваем край внутрь: так стык не собирает грязь и не выдаёт себя тонкой серой полоской через год.

    Плёнку берём у XPEL и SunTek. Какая из них пойдёт на вашу машину, называем на осмотре — до того, как вы согласитесь на смету.
  includesHeading: Что входит
  includes:
    - Двухэтапная мойка, глина и обезжиривание перед наклейкой
    - Точечная полировка дефектов, которые иначе запечатались бы под плёнкой
    - Выкройка под вашу модель, ручная подгонка сложных элементов
    - Заворот кромок там, где геометрия панели это позволяет
    - Разбор ручек, зеркал и фонарей, если зона того требует
    - Контрольный осмотр через неделю после выдачи
  forWhomHeading: Кому это нужно
  forWhom:
    - Новая машина, которую хочется сохранить в заводском состоянии
    - Тёмный или матовый цвет, на котором видно каждую риску
    - Много трассы между городами и щебень на обочинах
    - Машина в лизинге или под скорую продажу, где важен отчёт по краске
  honestHeading: Когда мы отговариваем
  honest: 'Если машина уже перекрашена дешёвым лаком или на панели видны следы шпаклёвки — плёнку класть нельзя: при снятии она заберёт покрытие с собой. В таком случае мы честно скажем об этом на осмотре и предложим сначала привести лак в порядок.'
colour-change-wrap:
  name: Смена цвета плёнкой
  short: Новый цвет без покраски — и с возможностью вернуть заводской.
  metaTitle: Смена цвета автомобиля плёнкой в Белграде — Details
  metaDescription: 'Полная оклейка цветной плёнкой в Белграде: мат, сатин, глянец, текстуры. Обратимо, без перекраски, с сохранением заводского лака. Образцы на вашей машине.'
  heroEyebrow: Цвет
  heroTitle: Другой цвет. Тот же заводской лак под ним.
  heroLead: Плёнка меняет машину полностью, но остаётся обратимой. Через два года можно снять её и получить ту же краску, что была с завода, — чего не даст ни одна покраска.
  priceFrom: от 1 900 € за кузов
  duration: 4–7 дней
  bodyHeading: Почему плёнка, а не покраска
  body: |
    Покраска — это навсегда и это запись в истории автомобиля. Плёнка — это решение на несколько лет, которое можно отменить. При продаже вы снимаете её и отдаёте машину в родном цвете, с родным лаком под ней.

    Выбор цвета мы всегда делаем на вашей машине, а не по каталогу на столе: кладём образцы на кузов при дневном свете и смотрим, как цвет ведёт себя на ваших изгибах. Матовый на одной модели выглядит дорого, а на другой — плоско, и это видно только вживую.

    Цветные плёнки берём у 3M и HEXIS. Какую именно кладём, фиксируем в смете вместе с ценой и сроком.
  includesHeading: Что входит
  includes:
    - Подбор цвета образцами на вашем кузове при дневном свете
    - Разбор ручек, молдингов, фонарей и решёток
    - Оклейка с заворотом кромок в проёмах
    - Проклейка стыков и обработка углов феном
    - Инструкция по уходу за матом или сатином
    - Бесплатная правка мелких отслоений в первый месяц
  forWhomHeading: Кому это нужно
  forWhom:
    - Хочется другой цвет, но без потери заводской краски
    - Нужен мат, сатин или текстура, которых не бывает с завода
    - Машина в лизинге, где перекраска запрещена договором
    - Коммерческий автомобиль, который должен выглядеть узнаваемо
  honestHeading: Что нужно знать заранее
  honest: Плёнка не прячет вмятины и волны на кузове — наоборот, матовая подчёркивает их сильнее, чем глянец. Если на панелях есть геометрические дефекты, сначала кузовной ремонт, потом цвет. Мы скажем об этом на осмотре, а не после оклейки.
polishing-ceramic:
  name: Полировка и керамика
  short: Снимаем риски и паутинку, закрываем результат керамикой на годы.
  metaTitle: Полировка кузова и керамика в Белграде — Details
  metaDescription: Многоэтапная полировка с замером толщины лака и керамическое покрытие на 2–5 лет. Смотрим лак под лампой и показываем замеры. Студия Details, Белград.
  heroEyebrow: Лак
  heroTitle: Сначала убрать риски. Только потом что-то наносить.
  heroLead: Керамика поверх непрополированного лака просто консервирует паутинку на несколько лет. Мы сначала выводим дефекты, а покрытие кладём уже на готовую поверхность.
  priceFrom: от 450 € за автомобиль
  duration: 2–3 дня
  bodyHeading: Как это устроено
  body: |
    Полировка — это снятие тончайшего слоя лака вместе с рисками. Слой не бесконечный, поэтому мы начинаем с толщиномера: замеряем каждую панель и считаем, сколько запаса есть. Если на крыше или крыльях лак уже тонкий — работаем мягче или не трогаем панель вовсе.

    Дальше два или три прохода: режущий состав снимает основные дефекты, финишный убирает голограммы от машинки. Результат смотрим под лампой, которая показывает то, чего не видно на улице. И только после этого — обезжиривание и керамика. Полируем составами Koch-Chemie, керамику кладём Gtechniq.
  includesHeading: Что входит
  includes:
    - Замер толщины лака по всем панелям с записью результатов
    - Двух- или трёхэтапная полировка под контролем лампы
    - Обезжиривание поверхности перед нанесением
    - Керамическое покрытие с выдержкой в боксе
    - Обработка стёкол водоотталкивающим составом
    - Фотоотчёт до и после в одинаковом свете
  forWhomHeading: Кому это нужно
  forWhom:
    - Машина после нескольких лет автоматических моек
    - Тёмный цвет, на котором паутинка видна на любом солнце
    - Подготовка к продаже, когда важна первая секунда впечатления
    - Свежепригнанный автомобиль после перевозки и стоянок
  honestHeading: Когда мы отговариваем
  honest: Если толщиномер показывает критично тонкий лак, полировать нельзя — можно протереть до грунта. В такой ситуации мы предложим мягкий вариант без съёма или только защитное покрытие, и объясним, что именно увидели на замерах.
steering-wheel-restoration:
  name: Реставрация руля
  short: Затёртая кожа, лоснящийся обод и облезший пластик — в исходное состояние.
  metaTitle: Реставрация руля и перетяжка кожи в Белграде — Details
  metaDescription: 'Восстановление кожи руля в Белграде: перекраска, перетяжка, ремонт пластика и кнопок. Снимаем и ставим руль с подушкой безопасности. 2–3 дня.'
  heroEyebrow: Салон
  heroTitle: Первое, к чему прикасаются. И первое, что стареет.
  heroLead: 'Руль изнашивается быстрее всего салона: пот, солнце и крем для рук вытирают краску за пару лет. Восстановление стоит несоизмеримо дешевле нового руля и выглядит как заводской.'
  priceFrom: от 150 €
  duration: 2–3 дня
  bodyHeading: Что мы с ним делаем
  body: |
    Сначала снимаем руль целиком — аккуратно, с отключением аккумулятора и подушки безопасности. Дальше зависит от состояния: если кожа цела и вытерлась только краска, мы её очищаем, восстанавливаем фактуру и перекрашиваем составом, который не липнет и не пачкает руки. Если кожа порвана или прошивка разошлась — перетягиваем заново, с ручной прошивкой по оригинальному рисунку.

    Заодно приводим в порядок то, что обычно портится рядом: облезшие кнопки, потёртый пластик подрулевых накладок, глянец на лепестках.
  includesHeading: Что входит
  includes:
    - Снятие и установка руля с корректной работой с подушкой безопасности
    - Очистка и восстановление фактуры кожи
    - Перекраска или полная перетяжка с ручной прошивкой
    - Восстановление кнопок и пластиковых накладок
    - Подбор цвета и типа строчки под ваш салон
    - Проверка индикатора подушки после сборки
  forWhomHeading: Кому это нужно
  forWhom:
    - Обод вытерся до блестящего пластика или сменил цвет
    - Кожа потрескалась или разошлась по шву
    - Машина готовится к продаже, а руль выдаёт пробег
    - Хочется другой материал — например, алькантару на верхнем секторе
  honestHeading: Что нужно знать заранее
  honest: Мы не берёмся за рули со сработавшей подушкой безопасности или следами её замены без сервисной истории — это вопрос вашей безопасности, а не косметики. В таком случае сначала сервис, потом мы.
translations:
  sr:
    indexMetaTitle: 'Usluge detaljinga u Beogradu: PPF, poliranje, volan — Details'
    indexMetaDescription: Zaštitna folija PPF, promena boje, poliranje sa keramičkim premazom i restauracija volana. Cene, rokovi i poštena ograničenja za svaku uslugu.
    indexEyebrow: Usluge
    indexHeading: Četiri pravca, u svakom — do kraja
    indexLead: 'Za svaku uslugu ispod postoji posebna stranica: šta uključuje, koliko traje, kome odgovara i kada ćemo vas iskreno odvratiti.'
    specsPriceLabel: Cena
    specsDurationLabel: Rok
    paint-protection-film:
      name: Zaštitna folija (PPF)
      short: Prozirna poliuretanska zaštita protiv kamenčića, peska i četki na perionici.
      metaTitle: Oklanjanje zaštitnom folijom PPF u Beogradu — Details
      metaDescription: 'Oklanjanje karoserije prozirnom zaštitnom folijom u Beogradu: prednji deo, kompletno oklanjanje, savijanje ivica. Folije XPEL i SunTek.'
      heroEyebrow: Zaštita karoserije
      heroTitle: Folija koja se ne vidi, i kamenčići koji neće biti
      heroLead: Poliuretan debljine 190 mikrona upija kamenčiće sa puta, pesak i tragove od četki. Boja ispod ostaje fabrička — a to je ono što se gleda pri prodaji.
      priceFrom: od 690 € za prednji deo
      duration: 2–6 dana
      bodyHeading: Šta to donosi
      body: |-
        Osnovna vrednost folije nije 'sjaj', već očuvana fabrička boja. Prefarbana krila se mogu primetiti svakim mernim uređajem, i na inspekciji pred kupovinu to odmah smanjuje cenu. Folija podnosi udarce umesto laka: sitne ogrebotine na njoj se same zatvaraju na suncu, a dublje ostaju na foliji, a ne na karoseriji.

        Izrezujući kalup za konkretnu karoseriju na plotteru, a teže delove — branike, retrovizore, stubove — prilagođavamo rukama. Gde panel dopušta, savijamo ivicu unutra: tako spoj ne skuplja prljavštinu i ne pokazuje se kao tanka siva linija kroz godinu.

        Folije uzimamo od XPEL i SunTek. Koja od njih će ići na vašu mašinu, kažemo na inspekciji — pre nego što pristnete na ponudu.
      includesHeading: Šta uključuje
      includes:
        - Dvostruko pranje, glina i odmašćivanje pre lepljenja
        - Tačkasto poliranje nedostataka koji bi inače bili zapečeni pod folijom
        - Kalup za vaš model, ručno prilagođavanje teških elemenata
        - Savijanje ivica gde geometrija panela to dopušta
        - Rasparivanje ručki, retrovizora i svetala, ako zona toga zahteva
        - Kontrolna inspekcija nedelju dana nakon isporuke
      forWhomHeading: Kome je to potrebno
      forWhom:
        - Nova mašina koju želite da sačuvate u fabričkom stanju
        - Tamna ili mat boja na kojoj se vide svaka ogrebotina
        - Puno vožnje između gradova i šljunak na ivicama
        - Automobil u lizingu ili za brzu prodaju, gde je važan izveštaj o boji
      honestHeading: Kada odvratimo
      honest: 'Ako je mašina već prefarbana jeftinim lakom ili na panelu su vidljivi tragovi špakhla — foliju ne možemo staviti: prilikom skidanja uzimaće sa sobom premaz. U tom slučaju ćemo iskreno reći to na inspekciji i predložiti da prvo dovedemo lak u red.'
    colour-change-wrap:
      name: Promena boje folijom
      short: Nova boja bez farbanja — i sa mogućnošću vraćanja fabričkoj.
      metaTitle: Promena boje automobila folijom u Beogradu — Details
      metaDescription: 'Kompletno oklanjanje obojenom folijom u Beogradu: mat, satenski, sjaj, teksture. Obnovljivo, bez farbanja, uz očuvanje fabričkog laka. Uzorci na vašoj mašini.'
      heroEyebrow: Boja
      heroTitle: Druga boja. Isti fabrički lak ispod nje.
      heroLead: Folija potpuno menja automobil, ali ostaje obrnuta. Nakon dve godine možete je skinuti i dobiti istu boju koja je bila sa fabrike — što nijedno farbanje ne može dati.
      priceFrom: od 1 900 € za karoseriju
      duration: 4–7 dana
      bodyHeading: Zašto folija, a ne farbanje
      body: |-
        Farbanje je zauvek i to je beleženje u istoriji automobila. Folija je rešenje na nekoliko godina koje možete opozvati. Pri prodaji skidate je i predajete automobil u svojoj boji, sa fabričkim lakom ispod nje.

        Izbor boje uvek radimo na vašoj mašini, a ne po katalogu na stolu: postavljamo uzorke na karoseriju pri dnevnoj svetlosti i gledamo kako se boja ponaša na vašim zakrivljenjima. Mat na jednom modelu izgleda skupo, a na drugom — ravno, i to se vidi samo uživo.

        Obojene folije uzimamo od 3M i HEXIS. Koju tačno stavljamo, fiksiramo u ponudi zajedno sa cenom i rokom.
      includesHeading: Šta uključuje
      includes:
        - Izbor boje uzorcima na vašoj karoseriji pri dnevnoj svetlosti
        - Rasparivanje ručki, lajsni, svetala i rešetki
        - Oklanjanje sa savijanjem ivica u otvorima
        - Zalepiti spojeve i obraditi uglove fenom
        - Uputstvo za negu mat ili satena
        - Besplatno ispravljanje sitnih odlepljanja u prvom mesecu
      forWhomHeading: Kome je to potrebno
      forWhom:
        - Želi se druga boja, ali bez gubitka fabričke boje
        - Potrebna je mat, satenska ili tekstura koje ne postoje u fabričkom izdanju
        - Automobil u lizingu, gde je farbanje zabranjeno ugovorom
        - Komercijalni automobil koji treba da izgleda prepoznatljivo
      honestHeading: Šta treba znati unapred
      honest: Folija ne sakriva udubljenja i talase na karoseriji — naprotiv, mat ih više naglašava nego sjaj. Ako na panelima postoje geometrijske greške, prvo popravka karoserije, zatim boja. Reći ćemo vam to na inspekciji, a ne nakon oklanjanja.
    polishing-ceramic:
      name: Poliranje i keramika
      short: Uklanjamo ogrebotine i paučinu, zatvaramo rezultat keramikom na godine.
      metaTitle: Poliranje karoserije i keramika u Beogradu — Details
      metaDescription: Višestepeno poliranje sa merenjem debljine laka i keramičkim premazom na 2–5 godina. Gledamo lak pod lampom i pokazujemo merenja. Studio Details, Beograd.
      heroEyebrow: Lak
      heroTitle: Prvo ukloniti ogrebotine. Tek tada nešto nanositi.
      heroLead: Keramika preko nepripremljenog laka jednostavno konzervira paučinu na nekoliko godina. Prvo odstranjujemo nedostatke, a premaz nanosimo već na pripremljenu površinu.
      priceFrom: od 450 € za automobil
      duration: 2–3 dana
      bodyHeading: Kako to funkcioniše
      body: |-
        Poliranje znači uklanjanje najtanjeg sloja laka zajedno sa ogrebotinama. Sloj nije beskonačan, tako da počinjemo mjerenjem debljine: merimo svaku panel i računamo koliko imamo rezerva. Ako je na krovu ili krilima lak već tanak — radimo pažljivije ili ne diramo panel uopšte.

        Zatim dva ili tri prolaza: rezni sastav uklanja glavne nedostatke, završni uklanja holograme od mašine. Rezultat pregledamo pod lampom koja pokazuje ono što nije vidljivo napolju. I samo nakon toga — odmašćivanje i keramika. Poliramo sastavima Koch-Chemie, keramiku stavljamo Gtechniq.
      includesHeading: Šta uključuje
      includes:
        - Merenje debljine laka na svim panelima sa beleženjem rezultata
        - Dvostepeno ili trost stepino poliranje pod kontrolom lampe
        - Odmašćivanje površine pre nanošenja
        - Keramički premaz uz stajanje u boksu
        - Obrada stakala vodoodbojnim sastavom
        - Fotoizveštaj pre i posle u istom svetlu
      forWhomHeading: Kome je to potrebno
      forWhom:
        - Automobil posle nekoliko godina automatskih pranja
        - Tamna boja na kojoj se paučinasti tragovi vide na svakom suncu
        - Priprema za prodaju, kada je važna prva sekunda utiska
        - Sveže uvezen automobil posle transporta i parkiranja
      honestHeading: Kada odvratimo
      honest: Ako debljinskomer pokazuje kritično tanki lak, poliranje nije moguće — može se doći do temeljnog sloja. U takvoj situaciji ponudićemo blagu varijantu bez skidanja ili samo zaštitni premaz, i objasniti šta smo tačno videli na merenjima.
    steering-wheel-restoration:
      name: Restauracija volana
      short: Izlizana koža, sjajan obod i oštećen plastika — vraćamo u prvobitno stanje.
      metaTitle: Restauracija volana i presvlačenje kože u Beogradu — Details
      metaDescription: 'Obnova kože volana u Beogradu: prefarbavanje, presvlačenje, popravka plastike i dugmadi. Skidamo i postavljamo volan s vazdušnom jastučićem. 2–3 dana.'
      heroEyebrow: Saloon
      heroTitle: Prvo na što se dodiruje. I prvo što se stari.
      heroLead: 'Volan se najbrže troši u salonu: znoj, sunce i krem na rukama brišu boju za nekoliko godina. Obnova košta nesrazmerno manje od novog volana i izgleda kao fabrički.'
      priceFrom: od 150 €
      duration: 2–3 dana
      bodyHeading: Šta mi radimo sa njim
      body: |-
        Najpre skidamo volan u celosti — pažljivo, sa isključenim akumulatorom i vazdušnim jastučićem. Dalje zavisi od stanja: ako je koža cela i samo je boja izbledela, očistimo je, obnavljamo teksturu i prefarbavamo sastavom koji se ne lepi i ne prlja ruke. Ako je koža pocepana ili šav se razdvojio — presvlačimo ponovo, s ručnom šavom po originalnom uzorku.

        Usput sređujemo ono što obično propada pored: oštećena dugmad, istrošena plastika na obodima volana, sjaj na dugmadima.
      includesHeading: Šta uključuje
      includes:
        - Skidanje i postavljanje volana uz pravilno rukovanje vazdušnim jastučićem
        - Čišćenje i obnova teksture kože
        - Prefarbavanje ili potpuno presvlačenje s ručnom šavom
        - Obnova dugmadi i plastičnih detalja
        - Odabir boje i tipa šava u skladu s vašim salonom
        - Provera indikatora vazdušnog jastučića nakon sastavljanja
      forWhomHeading: Kome je to potrebno
      forWhom:
        - Obod se izlizao do sjajne plastike ili promenio boju
        - Koža se pocepala ili razdvojila po šavu
        - Automobil se priprema za prodaju, a volan otkriva pređenu kilometražu
        - Želite drugi materijal — na primer, alkantaru na gornjem delu
      honestHeading: Šta treba znati unapred
      honest: Ne prihvatamo volane sa aktiviranim vazdušnim jastučićem ili tragovima njegove promene bez servisne istorije — to je pitanje vaše sigurnosti, a ne kozmetike. U tom slučaju prvo servis, pa onda mi.
  en:
    indexMetaTitle: 'Detailing Services in Belgrade: PPF, Polishing, Steering Wheel — Details'
    indexMetaDescription: PPF, colour-change wrap, machine polishing with ceramic coating, and steering wheel restoration. Prices, durations, and honest limitations for each service.
    indexEyebrow: Services
    indexHeading: Four Directions, Each Thoroughly Covered
    indexLead: 'Each service below has its own page: what’s included, how long it takes, who it suits, and when we honestly advise against it.'
    specsPriceLabel: Price
    specsDurationLabel: Duration
    paint-protection-film:
      name: Paint Protection Film (PPF)
      short: Clear polyurethane armor against stones, sand, and wash brushes.
      metaTitle: PPF Installation in Belgrade — Details
      metaDescription: 'Installation of clear protective film in Belgrade: front, full coverage, edge wrapping. XPEL and SunTek films.'
      heroEyebrow: Body Protection
      heroTitle: Invisible Film, No Chips
      heroLead: 190-micron thick polyurethane takes the hit from road stones, sand, and brush marks. The paint underneath stays factory-fresh — which matters when selling.
      priceFrom: from 690 € for the front
      duration: 2–6 days
      bodyHeading: What It Offers
      body: |-
        The main value of the film isn’t the 'shine', but the preserved factory paint. A repainted fender shows up on any thickness gauge, which will decrease the price during a pre-sale inspection. The film absorbs impacts instead of the clear coat: minor scratches self-heal in sunlight, while deep ones remain on the film, not on the body.

        We cut the pattern specific to your vehicle on a plotter, and we tailor difficult areas — bumpers, mirrors, pillars — by hand. Where the panel allows, we wrap the edge inward: this way, the seam doesn’t collect dirt and doesn’t show a thin gray line after a year.

        We source our films from XPEL and SunTek. We’ll advise which one is suitable for your vehicle during the inspection — before you agree to the estimate.
      includesHeading: What’s Included
      includes:
        - Two-stage wash, clay treatment, and degreasing before application
        - Spot polishing of defects that would otherwise be sealed under the film
        - Pattern specific to your model, hand fitting complex elements
        - Edge wrapping where the panel geometry allows
        - Dismantling of handles, mirrors, and lights if necessary
        - Inspection after one week post-application
      forWhomHeading: Who Needs This
      forWhom:
        - A new car that you want to keep in factory condition
        - Dark or matte colors that show every scratch
        - A lot of highway driving and gravel on the shoulders
        - A leased vehicle or one for quick sale, where paint condition matters
      honestHeading: When We Advise Against It
      honest: 'If the car has already been painted with cheap clear coat or if there are signs of body filler on the panel — applying the film is not possible: upon removal it will take the coating with it. In such cases, we’ll honestly state this during the inspection and suggest first getting the clear coat in order.'
    colour-change-wrap:
      name: Colour Change Wrap
      short: A new color without painting — and with the option to revert to the factory finish.
      metaTitle: Colour Change Wrap in Belgrade — Details
      metaDescription: 'Full colour wrap in Belgrade: matte, satin, gloss, textures. Reversible, no repainting, retains factory coating. Samples on your vehicle.'
      heroEyebrow: Colour
      heroTitle: A Different Colour. The Same Factory Finish Underneath.
      heroLead: The wrap completely transforms the car while remaining reversible. After two years, it can be removed, revealing the same paint that was there from the factory — something no repaint can guarantee.
      priceFrom: from 1,900 € for the body
      duration: 4–7 days
      bodyHeading: Why Wrap Instead of Paint
      body: |-
        Painting is permanent and records the car's history. A wrap is a temporary solution that can be undone. Upon sale, you remove it and deliver the car in its original color, with the original coating underneath.

        We always choose the color on your vehicle, not from a swatch book: we place samples on the body in daylight to see how the color behaves on your curves. Matte on one model looks premium, but on another it can appear flat, which is only noticeable in person.

        We source our colour films from 3M and HEXIS. The specific film we use is recorded in the estimate along with the price and duration.
      includesHeading: What’s Included
      includes:
        - Choosing color samples on your body in daylight
        - Dismantling handles, moldings, lights, and grilles
        - Wrapping with edge turning in door openings
        - Sealing joints and heating corners with a hairdryer
        - Care instructions for matte or satin finishes
        - Free fixing of minor peeling in the first month
      forWhomHeading: Who Needs This
      forWhom:
        - Wanting a different color but without losing the factory paint
        - Need matte, satin, or textures that are unavailable from the factory
        - A leased car where repainting is prohibited by the contract
        - A commercial vehicle that should look recognizable
      honestHeading: What You Need to Know in Advance
      honest: The wrap doesn’t hide dents and waves on the body — on the contrary, matte can highlight them more than gloss. If there are geometric defects on the panels, first perform bodywork, then apply color. We will address this at the inspection, not after the wrapping.
    polishing-ceramic:
      name: Polishing and Ceramic Coating
      short: We eliminate scratches and spider-webbing, sealing the result with ceramic for years.
      metaTitle: Body Polishing and Ceramic Coating in Belgrade — Details
      metaDescription: Multi-step polishing with clear coat thickness measurement and ceramic coating for 2–5 years. We check the clear coat under a lamp and show measurements. Studio Details, Belgrade.
      heroEyebrow: Clear Coating
      heroTitle: First Remove Scratches. Only Then Apply Anything.
      heroLead: Ceramic on unpolished clear coat simply seals in spider-webbing for years. We first fix defects, and only then apply the coating on a prepared surface.
      priceFrom: from 450 € for the car
      duration: 2–3 days
      bodyHeading: How It Works
      body: |-
        Polishing involves removing the thinnest layer of clear coat along with scratches. The layer is not infinite, so we start with a thickness gauge: measuring each panel and checking how much reserve is available. If the clear coat on the roof or fenders is already thin, we work more gently or not touch the panel at all.

        Then we perform two or three passes: a cutting compound removes major defects, and a finishing compound eliminates holograms from the machine. The result is checked under a light that reveals what’s invisible outdoors. Only after this do we degrease and apply the ceramic. We use Koch-Chemie compounds for polishing and Gtechniq for ceramic coating.
      includesHeading: What’s Included
      includes:
        - Clear coat thickness measurement on all panels with recorded results
        - Two or three-step polishing under lamp control
        - Degreasing the surface before application
        - Ceramic coating with curing time in the box
        - Glass treatment with hydrophobic coating
        - Before and after photo report in the same lighting
      forWhomHeading: Who Needs This
      forWhom:
        - A car that has undergone several years of automatic washes
        - A dark color where swirls are visible in any sunlight
        - Preparation for sale when the first impression matters
        - A freshly imported vehicle after transport and parking
      honestHeading: When We Advise Against It
      honest: If the thickness gauge shows critically thin lacquer, polishing is not possible—it could wear down to the primer. In such cases, we will suggest a gentle option without sanding or just a protective coating, and explain what we observed during measurements.
    steering-wheel-restoration:
      name: Steering Wheel Restoration
      short: Worn leather, shiny rim, and peeling plastic—back to original condition.
      metaTitle: Steering Wheel Restoration and Leather Reupholstering in Belgrade — Details
      metaDescription: 'Restoring steering wheel leather in Belgrade: repainting, reupholstering, plastic and button repairs. We remove and reinstall the steering wheel with airbag. 2–3 days.'
      heroEyebrow: Interior
      heroTitle: The first thing you touch. And the first to age.
      heroLead: 'The steering wheel wears out faster than the rest of the interior: sweat, sunlight, and hand cream rub off the paint in a couple of years. Restoration is incomparably cheaper than a new wheel and looks factory-fresh.'
      priceFrom: from 150 €
      duration: 2–3 days
      bodyHeading: What We Do
      body: |-
        First, we completely remove the steering wheel—carefully, disconnecting the battery and airbag. Then it depends on the condition: if the leather is intact and only the paint is worn, we clean it, restore the texture, and repaint with a non-sticky, non-smudging compound. If the leather is torn or the stitching has come apart, we will reupholster it, with hand stitching using the original pattern.

        At the same time, we also take care of what usually deteriorates nearby: peeling buttons, worn plastic on the steering column covers, and gloss on the paddles.
      includesHeading: What’s Included
      includes:
        - Removal and installation of the steering wheel with proper airbag functionality
        - Cleaning and restoring the texture of the leather
        - Repainting or complete reupholstering with hand stitching
        - Restoration of buttons and plastic covers
        - Color and stitch type matching to your interior
        - Airbag indicator check after assembly
      forWhomHeading: Who Needs This
      forWhom:
        - The rim has worn down to shiny plastic or changed color
        - The leather has cracked or come apart at the seam
        - The car is being prepared for sale, but the steering wheel shows wear
        - Looking for a different material—like Alcantara on the upper sector
      honestHeading: What You Need to Know in Advance
      honest: We do not take on steering wheels with deployed airbag or signs of prior replacement without service history—this is a matter of your safety, not just cosmetics. In such cases, service first, then us.
