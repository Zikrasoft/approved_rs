paint-protection-film:
  name: Защитная пленка (PPF)
  short: Прозрачная полиуретановая броня против камней, песка и щеток на мойке.
  metaTitle: Оклейка защитной пленкой PPF в Белграде | Details
  metaDescription: 'Оклейка кузова прозрачной защитной пленкой в Белграде: передняя часть, полная оклейка, заворот кромок. Пленки XPEL и SunTek.'
  heroEyebrow: Защита кузова
  heroTitle: Пленка, которую не видно, и сколы, которых не будет
  heroLead: Полиуретан толщиной 190 микрон принимает на себя камни с трассы, песок и следы от щеток. Краска под ним остается заводской, а именно ее смотрят при продаже.
  priceFrom: от 690 € за перед
  duration: 2–6 дней
  bodyHeading: Что это дает
  body: |
    Главная ценность пленки не «блеск», а сохраненная заводская краска. Перекрашенное крыло видно любым толщиномером, и на осмотре перед покупкой это сразу минус к цене. Пленка держит удар вместо лака: мелкие царапины на ней затягиваются сами на солнце, глубокие остаются на пленке, а не на кузове.

    Мы режем выкройку под конкретный кузов на плоттере, а сложные места (бамперы, зеркала, стойки) подгоняем руками. Там, где панель позволяет, заворачиваем край внутрь: так стык не собирает грязь и не выдает себя тонкой серой полоской через год.

    Пленку берем у XPEL и SunTek. Какая из них пойдет на вашу машину, называем на осмотре, до того, как вы согласитесь на смету.
  includesHeading: Что входит
  includes:
    - Двухэтапная мойка, глина и обезжиривание перед наклейкой
    - Точечная полировка дефектов, которые иначе запечатались бы под пленкой
    - Выкройка под вашу модель, ручная подгонка сложных элементов
    - Заворот кромок там, где геометрия панели это позволяет
    - Разбор ручек, зеркал и фонарей, если зона того требует
    - Контрольный осмотр через неделю после выдачи
  forWhomHeading: Кому это нужно
  forWhom:
    - Новая машина, которую хочется сохранить в заводском состоянии
    - Темный или матовый цвет, на котором видно каждую риску
    - Много трассы между городами и щебень на обочинах
    - Машина в лизинге или под скорую продажу, где важен отчет по краске
  honestHeading: Когда мы отговариваем
  honest: 'Если машина уже перекрашена дешевым лаком или на панели видны следы шпаклевки, пленку класть нельзя: при снятии она заберет покрытие с собой. В таком случае мы честно скажем об этом на осмотре и предложим сначала привести лак в порядок.'
colour-change-wrap:
  name: Смена цвета пленкой
  short: Новый цвет без покраски, с возможностью вернуть заводской.
  metaTitle: Смена цвета автомобиля пленкой в Белграде | Details
  metaDescription: 'Полная оклейка цветной пленкой в Белграде: мат, сатин, глянец, текстуры. Обратимо, без перекраски, с сохранением заводского лака. Образцы на вашей машине.'
  heroEyebrow: Цвет
  heroTitle: Другой цвет. Тот же заводской лак под ним.
  heroLead: Пленка меняет машину полностью, но остается обратимой. Через два года можно снять ее и получить ту же краску, что была с завода, чего не даст ни одна покраска.
  priceFrom: от 1 900 € за кузов
  duration: 4–7 дней
  bodyHeading: Почему пленка, а не покраска
  body: |
    Покраска делается навсегда и остается записью в истории автомобиля. Пленка же решение на несколько лет, которое можно отменить. При продаже вы снимаете ее и отдаете машину в родном цвете, с родным лаком под ней.

    Выбор цвета мы всегда делаем на вашей машине, а не по каталогу на столе: кладем образцы на кузов при дневном свете и смотрим, как цвет ведет себя на ваших изгибах. Матовый на одной модели выглядит дорого, а на другой плоско, и это видно только вживую.

    Цветные пленки берем у 3M и HEXIS. Какую именно кладем, фиксируем в смете вместе с ценой и сроком.
  includesHeading: Что входит
  includes:
    - Подбор цвета образцами на вашем кузове при дневном свете
    - Разбор ручек, молдингов, фонарей и решеток
    - Оклейка с заворотом кромок в проемах
    - Проклейка стыков и обработка углов феном
    - Инструкция по уходу за матом или сатином
    - Бесплатная правка мелких отслоений в первый месяц
  forWhomHeading: Кому это нужно
  forWhom:
    - Хочется другой цвет, но без потери заводской краски
    - Нужен мат, сатин или текстура, которых не бывает с завода
    - Машина в лизинге, где перекраска запрещена договором
    - Коммерческий автомобиль, который должен выглядеть узнаваемо
  honestHeading: Что нужно знать заранее
  honest: Пленка не прячет вмятины и волны на кузове. Наоборот, матовая подчеркивает их сильнее, чем глянец. Если на панелях есть геометрические дефекты, сначала кузовной ремонт, потом цвет. Мы скажем об этом на осмотре, а не после оклейки.
polishing-ceramic:
  name: Полировка и керамика
  short: Снимаем риски и паутинку, закрываем результат керамикой на годы.
  metaTitle: Полировка кузова и керамика в Белграде | Details
  metaDescription: Многоэтапная полировка с замером толщины лака и керамическое покрытие на 2–5 лет. Смотрим лак под лампой и показываем замеры. Студия Details, Белград.
  heroEyebrow: Лак
  heroTitle: Сначала убрать риски. Только потом что-то наносить.
  heroLead: Керамика поверх непрополированного лака просто консервирует паутинку на несколько лет. Мы сначала выводим дефекты, а покрытие кладем уже на готовую поверхность.
  priceFrom: от 450 € за автомобиль
  duration: 2–3 дня
  bodyHeading: Как это устроено
  body: |
    Полировка снимает тончайший слой лака вместе с рисками. Слой не бесконечный, поэтому мы начинаем с толщиномера: замеряем каждую панель и считаем, сколько запаса есть. Если на крыше или крыльях лак уже тонкий, работаем мягче или не трогаем панель вовсе.

    Дальше два или три прохода: режущий состав снимает основные дефекты, финишный убирает голограммы от машинки. Результат смотрим под лампой, которая показывает то, чего не видно на улице. И только после этого обезжиривание и керамика. Полируем составами Koch-Chemie, керамику кладем Gtechniq.
  includesHeading: Что входит
  includes:
    - Замер толщины лака по всем панелям с записью результатов
    - Двух- или трехэтапная полировка под контролем лампы
    - Обезжиривание поверхности перед нанесением
    - Керамическое покрытие с выдержкой в боксе
    - Обработка стекол водоотталкивающим составом
    - Фотоотчет до и после в одинаковом свете
  forWhomHeading: Кому это нужно
  forWhom:
    - Машина после нескольких лет автоматических моек
    - Темный цвет, на котором паутинка видна на любом солнце
    - Подготовка к продаже, когда важна первая секунда впечатления
    - Свежепригнанный автомобиль после перевозки и стоянок
  honestHeading: Когда мы отговариваем
  honest: Если толщиномер показывает критично тонкий лак, полировать нельзя, можно протереть до грунта. В такой ситуации мы предложим мягкий вариант без съема или только защитное покрытие, и объясним, что именно увидели на замерах.
steering-wheel-restoration:
  name: Реставрация руля
  short: Затертую кожу, лоснящийся обод и облезший пластик возвращаем в исходное состояние.
  metaTitle: Реставрация руля и перетяжка кожи в Белграде | Details
  metaDescription: 'Восстановление кожи руля в Белграде: перекраска, перетяжка, ремонт пластика и кнопок. Снимаем и ставим руль с подушкой безопасности. 2–3 дня.'
  heroEyebrow: Салон
  heroTitle: Первое, к чему прикасаются. И первое, что стареет.
  heroLead: 'Руль изнашивается быстрее всего салона: пот, солнце и крем для рук вытирают краску за пару лет. Восстановление стоит несоизмеримо дешевле нового руля и выглядит как заводской.'
  priceFrom: от 150 €
  duration: 2–3 дня
  bodyHeading: Что мы с ним делаем
  body: |
    Сначала снимаем руль целиком, аккуратно, с отключением аккумулятора и подушки безопасности. Дальше зависит от состояния: если кожа цела и вытерлась только краска, мы ее очищаем, восстанавливаем фактуру и перекрашиваем составом, который не липнет и не пачкает руки. Если кожа порвана или прошивка разошлась, перетягиваем заново, с ручной прошивкой по оригинальному рисунку.

    Заодно приводим в порядок то, что обычно портится рядом: облезшие кнопки, потертый пластик подрулевых накладок, глянец на лепестках.
  includesHeading: Что входит
  includes:
    - Снятие и установка руля с корректной работой с подушкой безопасности
    - Очистка и восстановление фактуры кожи
    - Перекраска или полная перетяжка с ручной прошивкой
    - Восстановление кнопок и пластиковых накладок
    - Подбор цвета и типа строчки под ваш салон
    - Проверка индикатора подушки после сборки
  forWhomHeading: Кому это нужно
  forWhom:
    - Обод вытерся до блестящего пластика или сменил цвет
    - Кожа потрескалась или разошлась по шву
    - Машина готовится к продаже, а руль выдает пробег
    - Хочется другой материал, например, алькантару на верхнем секторе
  honestHeading: Что нужно знать заранее
  honest: Мы не беремся за рули со сработавшей подушкой безопасности или следами ее замены без сервисной истории. Это вопрос вашей безопасности, а не косметики. В таком случае сначала сервис, потом мы.
translations:
  sr:
    indexMetaTitle: 'Detailing u Beogradu: PPF, poliranje, volan | Details'
    indexMetaDescription: PPF zaštitna folija, promena boje, poliranje sa keramičkom zaštitom i restauracija volana. Cene, rokovi i iskreno o ograničenjima svake usluge.
    indexEyebrow: Usluge
    indexHeading: Četiri usluge, svaka do poslednjeg detalja
    indexLead: 'Za svaku uslugu ispod postoji posebna stranica: šta obuhvata, koliko traje, kome je namenjena i kada je iskreno ne preporučujemo.'
    specsPriceLabel: Cena
    specsDurationLabel: Trajanje
    paint-protection-film:
      name: Zaštitna folija (PPF)
      short: Providni poliuretanski oklop protiv kamenčića, peska i četki u auto-perionici.
      metaTitle: Ugradnja PPF zaštitne folije u Beogradu | Details
      metaDescription: 'Providna zaštitna folija za karoseriju u Beogradu: prednji deo ili celo vozilo, sa podvijanjem ivica. Koristimo XPEL i SunTek folije.'
      heroEyebrow: Zaštita karoserije
      heroTitle: Folija koja se ne vidi. Oštećenja od kamenčića koja ne nastaju.
      heroLead: Poliuretan debljine 190 mikrona prima udarce kamenčića sa puta, pesak i tragove četki. Fabrička boja ispod ostaje sačuvana, a upravo se ona proverava pri prodaji.
      priceFrom: od 690 € za prednji deo
      duration: 2–6 dana
      bodyHeading: Šta dobijate
      body: |
        Glavna vrednost folije nije sjaj, već očuvana fabrička boja. Prefarban blatobran otkriva svaki merač debljine laka, a pri pregledu pre kupovine to odmah obara cenu. Folija prima udarce umesto laka: sitne ogrebotine na njoj same se povlače na suncu, dok duboke ostaju na foliji, a ne na karoseriji.

        Foliju sečemo na ploteru prema šablonu za konkretan model, a zahtevne delove, poput branika, retrovizora i stubova, prilagođavamo ručno. Gde oblik panela to dozvoljava, ivice podvijamo ka unutra. Tako se na spojevima ne skuplja prljavština i posle godinu dana nema tanke sive linije koja otkriva foliju.

        Koristimo XPEL i SunTek folije. Koju ćemo postaviti na vaš automobil, kažemo vam na pregledu, pre nego što prihvatite ponudu.
      includesHeading: Šta je uključeno
      includes:
        - Pranje u dve faze, dekontaminacija glinom i odmašćivanje pre postavljanja folije
        - Lokalno poliranje oštećenja koja bi inače ostala zarobljena ispod folije
        - Šablon za vaš model i ručno prilagođavanje zahtevnih delova
        - Podvijanje ivica gde geometrija panela to dozvoljava
        - Demontaža kvaka, retrovizora i svetala kada je to potrebno
        - Kontrolni pregled nedelju dana nakon preuzimanja
      forWhomHeading: Kome je namenjeno
      forWhom:
        - Vlasnicima novih automobila koji žele da sačuvaju fabričko stanje
        - Vlasnicima automobila tamne ili mat boje, na kojoj se vidi svaka ogrebotina
        - Onima koji često voze na otvorenom putu, uz rizik od kamenčića sa bankine
        - Za automobile na lizing ili pred prodaju, kada je važno dokumentovano stanje laka
      honestHeading: Kada je ne preporučujemo
      honest: 'Ako je automobil već prefarban nekvalitetnim lakom ili se na panelu vide tragovi gita, foliju ne treba postavljati: pri skidanju može povući i premaz. To ćemo vam otvoreno reći na pregledu i predložiti da se prvo sanira lak.'
    colour-change-wrap:
      name: Promena boje folijom
      short: Nova boja bez farbanja, uz mogućnost povratka na fabričku.
      metaTitle: Promena boje automobila folijom u Beogradu | Details
      metaDescription: 'Oblaganje vozila folijom u boji u Beogradu: mat, saten, sjaj i teksture. Bez farbanja, uz očuvan fabrički lak. Uzorke biramo na vašem automobilu.'
      heroEyebrow: Boja
      heroTitle: Druga boja. Isti fabrički lak ispod.
      heroLead: Folija potpuno menja izgled automobila, ali ta promena nije trajna. Za dve godine možete je skinuti i ponovo imati istu fabričku boju, što nijedno farbanje ne omogućava.
      priceFrom: od 1 900 € za celu karoseriju
      duration: 4–7 dana
      bodyHeading: Zašto folija, a ne farbanje
      body: |
        Farbanje je trajno i ostaje deo istorije automobila. Folija je, s druge strane, rešenje za nekoliko godina koje možete ukloniti. Pre prodaje je skinete i automobil predajete u originalnoj boji, sa fabričkim lakom.

        Boju uvek biramo na vašem automobilu, a ne iz kataloga na stolu: uzorke postavljamo na karoseriju pri dnevnom svetlu i gledamo kako boja izgleda na njenim linijama. Mat završnica na jednom modelu deluje luksuzno, a na drugom bezizražajno. To se vidi tek uživo.

        Koristimo folije u boji brendova 3M i HEXIS. Tačnu foliju navodimo u ponudi, zajedno sa cenom i rokom izrade.
      includesHeading: Šta je uključeno
      includes:
        - Izbor boje pomoću uzoraka na vašoj karoseriji pri dnevnom svetlu
        - Demontaža kvaka, lajsni, svetala i maski
        - Oblaganje folijom uz podvijanje ivica u otvorima karoserije
        - Učvršćivanje spojeva i termička obrada uglova fenom
        - Uputstvo za održavanje mat ili satenske folije
        - Besplatno popravljanje manjih odlepljivanja tokom prvog meseca
      forWhomHeading: Kome je namenjeno
      forWhom:
        - Želite drugu boju, ali bez gubitka fabričkog laka
        - Želite mat, saten ili teksturu koji nisu u fabričkoj ponudi
        - Imate automobil na lizing čiji ugovor ne dozvoljava farbanje
        - Imate poslovno vozilo koje treba da bude prepoznatljivo
      honestHeading: Šta treba znati unapred
      honest: Folija ne skriva udubljenja i neravnine na karoseriji. Naprotiv, mat folija ih ističe više nego sjajna. Ako paneli nisu ravni, prvo je potrebna limarska popravka, pa tek onda promena boje. To ćemo vam reći na pregledu, a ne nakon postavljanja folije.
    polishing-ceramic:
      name: Poliranje i keramička zaštita
      short: Uklanjamo ogrebotine i kružne tragove, a rezultat čuvamo keramičkom zaštitom godinama.
      metaTitle: Poliranje i keramička zaštita u Beogradu | Details
      metaDescription: Višestepeno poliranje uz merenje debljine laka i keramička zaštita na 2–5 godina. Lak pregledamo pod lampom i pokazujemo rezultate merenja. Details, Beograd.
      heroEyebrow: Lak
      heroTitle: Prvo uklanjamo ogrebotine. Tek onda nanosimo zaštitu.
      heroLead: Keramika preko neispoliranog laka samo zarobi kružne tragove na nekoliko godina. Zato prvo uklanjamo oštećenja, a zaštitu nanosimo tek na pripremljenu površinu.
      priceFrom: od 450 € po automobilu
      duration: 2–3 dana
      bodyHeading: Kako radimo
      body: |
        Poliranjem se uklanja izuzetno tanak sloj laka zajedno sa ogrebotinama. Debljina tog sloja je ograničena, zato počinjemo meračem debljine laka: merimo svaki panel i procenjujemo koliko prostora imamo za korekciju. Ako je lak na krovu ili blatobranima već tanak, biramo blaži postupak ili taj panel uopšte ne poliramo.

        Zatim slede dve ili tri faze poliranja: abrazivna pasta uklanja glavna oštećenja, a završna uklanja holograme od mašinskog poliranja. Rezultat proveravamo pod lampom koja otkriva ono što se napolju ne vidi. Tek nakon toga slede odmašćivanje i keramička zaštita. Poliramo pastama Koch-Chemie, a za keramičku zaštitu koristimo Gtechniq.
      includesHeading: Šta je uključeno
      includes:
        - Merenje debljine laka na svim panelima uz beleženje rezultata
        - Poliranje u dve ili tri faze uz kontrolu pod lampom
        - Odmašćivanje površine pre nanošenja zaštite
        - Nanošenje keramičke zaštite uz vreme za očvršćavanje u radionici
        - Nanošenje vodoodbojnog premaza na stakla
        - Fotografije pre i posle, pod istim osvetljenjem
      forWhomHeading: Kome je namenjeno
      forWhom:
        - Automobil koji je godinama pran u automatskim perionicama
        - Tamna boja na kojoj se mreža sitnih ogrebotina vidi čim izađe na sunce
        - Priprema za prodaju, kada je prvi utisak presudan
        - Tek uvezen automobil, nakon transporta i stajanja na placevima
      honestHeading: Kada je ne preporučujemo
      honest: Ako merač debljine laka pokaže da je lak kritično tanak, poliranje nije bezbedno jer se može probiti sloj sve do prajmera. U tom slučaju predložićemo blag tretman bez skidanja laka ili samo zaštitni premaz i objasniti šta smo tačno utvrdili merenjem.
    steering-wheel-restoration:
      name: Restauracija volana
      short: Pohabanoj koži, uglancanom obruču i oljuštenoj plastici vraćamo prvobitan izgled.
      metaTitle: Restauracija i presvlačenje volana u Beogradu | Details
      metaDescription: 'Obnova kože volana u Beogradu: farbanje, presvlačenje, popravka plastike i tastera. Demontaža i montaža volana sa vazdušnim jastukom. Rok: 2–3 dana.'
      heroEyebrow: Enterijer
      heroTitle: Prvo što dodirnete. I prvo na čemu se vide godine.
      heroLead: 'Volan se haba brže od ostatka enterijera: znoj, sunce i krema za ruke istroše boju za svega nekoliko godina. Obnova košta višestruko manje od novog volana, a vraća mu fabrički izgled.'
      priceFrom: od 150 €
      duration: 2–3 dana
      bodyHeading: Kako obnavljamo volan
      body: |
        Najpre pažljivo skidamo ceo volan, uz prethodno odvajanje akumulatora i bezbednu demontažu vazdušnog jastuka. Dalji postupak zavisi od stanja: ako je koža čitava, a istrošena je samo boja, čistimo je, obnavljamo teksturu i farbamo premazom koji nije lepljiv i ne ostavlja tragove na rukama. Ako je koža pocepana ili su šavovi popustili, presvlačimo volan novom kožom i ručno šijemo po originalnom uzorku.

        Usput sređujemo i delove koji se obično habaju zajedno s njim: oljuštene tastere, izlizane plastične obloge i uglancane polugice za menjanje brzina.
      includesHeading: Šta je uključeno
      includes:
        - Demontaža i montaža volana uz bezbedno rukovanje vazdušnim jastukom
        - Čišćenje i obnova teksture kože
        - Farbanje ili kompletno presvlačenje uz ručno šivenje
        - Obnova tastera i plastičnih obloga
        - Usklađivanje boje i vrste šava sa enterijerom vašeg automobila
        - Provera lampice vazdušnog jastuka nakon montaže
      forWhomHeading: Kome je namenjeno
      forWhom:
        - Obruč je izlizan, sjaji se poput plastike ili je promenio boju
        - Koža je ispucala ili se razdvojila na šavu
        - Automobil se priprema za prodaju, a volan odaje kilometražu
        - Želite drugi materijal, na primer alkantaru na gornjem delu obruča
      honestHeading: Šta treba znati unapred
      honest: Ne radimo volane sa aktiviranim vazdušnim jastukom niti one na kojima postoje tragovi njegove zamene bez dokumentovane servisne istorije. To je pitanje vaše bezbednosti, a ne estetike. U tom slučaju prvo posetite servis, pa dođite kod nas.
  en:
    indexMetaTitle: 'Detailing in Belgrade: PPF, Polishing, Steering Wheels'
    indexMetaDescription: PPF, colour-change wraps, machine polishing with ceramic coating and steering-wheel restoration. Prices, turnaround times and honest advice on each service.
    indexEyebrow: Services
    indexHeading: Four specialisms. No half measures.
    indexLead: Each service below has its own page covering what's included, how long it takes, who it's for and when we'll honestly advise against it.
    specsPriceLabel: Price
    specsDurationLabel: Turnaround
    paint-protection-film:
      name: Paint protection film (PPF)
      short: Clear polyurethane protection against stone chips, road grit and car wash brush marks.
      metaTitle: Paint Protection Film (PPF) in Belgrade | Details
      metaDescription: 'Clear paint protection film in Belgrade: front-end packages, full-car coverage and wrapped edges. XPEL and SunTek films.'
      heroEyebrow: Paint protection
      heroTitle: Film you won't see. Stone chips you won't get.
      heroLead: 190-micron polyurethane takes the impact of motorway stones, road grit and car wash brushes. The factory paint underneath stays intact, and that's what buyers check.
      priceFrom: from €690 for the front end
      duration: 2–6 days
      bodyHeading: What you gain
      body: |
        The real value of PPF isn't extra shine. It's preserving the factory paint. Any paint thickness gauge will reveal a resprayed wing, and that can immediately reduce the price at a pre-purchase inspection. The film takes the impact instead of your clear coat: light scratches self-heal in the sun, while deeper ones stay in the film rather than reaching the paintwork.

        We plotter-cut patterns for your specific model and hand-fit complex areas such as bumpers, mirrors and pillars. Wherever the panel allows, we wrap the edges around to the inside. This keeps dirt out of the edges and prevents that telltale thin grey line appearing a year later.

        We use XPEL and SunTek films. At the inspection, before you approve the quote, we'll tell you exactly which film we recommend for your car.
      includesHeading: What's included
      includes:
        - Two-stage wash, clay decontamination and degreasing before installation
        - Spot polishing of defects that would otherwise be sealed beneath the film
        - Model-specific patterns with hand fitting on complex panels
        - Wrapped edges wherever the panel shape allows
        - Removal of handles, mirrors and lights where access requires it
        - Follow-up inspection one week after collection
      forWhomHeading: Who it's for
      forWhom:
        - You have a new car you want to keep in factory condition
        - Your car has dark or matte paint that shows every scratch
        - You do plenty of motorway driving or encounter loose gravel
        - Your car is leased or due to be sold soon, and its paint condition matters
      honestHeading: When we advise against it
      honest: "If the car has been resprayed with poor-quality clear coat or a panel shows signs of body filler, we won't apply film: removing it could lift the paint with it. We'll flag this during the inspection and recommend putting the paintwork right first."
    colour-change-wrap:
      name: Colour-change wrap
      short: A new colour without a respray, with the option to return to the factory finish.
      metaTitle: Colour-Change Car Wraps in Belgrade | Details
      metaDescription: 'Full colour-change wraps in Belgrade: matte, satin, gloss and textured finishes. Reversible, preserving factory paint. Samples viewed on your car.'
      heroEyebrow: Colour
      heroTitle: A different colour. The same factory paint underneath.
      heroLead: A wrap transforms your car without making the change permanent. Two years later, you can remove it to reveal the original factory paint. No respray can offer that.
      priceFrom: from €1,900 for a full wrap
      duration: 4–7 days
      bodyHeading: Why wrap rather than respray?
      body: |
        A respray is permanent and becomes part of the car's history. A wrap is a change for a few years that you can reverse. When it's time to sell, you can remove it and hand over the car in its original colour, with its factory paint intact.

        We always choose the colour on your car, not from a catalogue on a desk. We place samples against the bodywork in daylight to see how the colour works with its curves. Matte can look premium on one model and flat on another. You only see the difference in person.

        We use colour-change films from 3M and HEXIS. The exact film is listed in your quote, alongside the price and turnaround time.
      includesHeading: What's included
      includes:
        - Colour selection using samples on your car in daylight
        - Removal of handles, mouldings, lights and grilles
        - Installation with edges wrapped into panel openings
        - Secure seams and heat-gun finishing around corners
        - Care instructions for matte or satin finishes
        - Free correction of minor lifting during the first month
      forWhomHeading: Who it's for
      forWhom:
        - You want a different colour without sacrificing the factory paint
        - You want a matte, satin or textured finish not offered by the factory
        - Your lease agreement prohibits respraying
        - Your business vehicle needs a distinctive, recognisable look
      honestHeading: What to know before you book
      honest: A wrap won't hide dents or ripples in the bodywork. In fact, matte film highlights them more than gloss. If the panels aren't straight, body repairs come first, then the colour change. We'll tell you at the inspection, not after wrapping the car.
    polishing-ceramic:
      name: Machine polishing and ceramic coating
      short: We remove scratches and swirl marks, then protect the finish with a ceramic coating for years to come.
      metaTitle: Car Polishing & Ceramic Coating in Belgrade | Details
      metaDescription: Multi-stage polishing with paint thickness checks and ceramic protection for 2–5 years. We inspect under detailing lights and share readings. Details, Belgrade.
      heroEyebrow: Paintwork
      heroTitle: Remove the scratches first. Apply protection second.
      heroLead: Ceramic coating over unpolished paint simply seals in swirl marks for years. We correct the defects first, then apply the coating to the properly prepared finish.
      priceFrom: from €450 per car
      duration: 2–3 days
      bodyHeading: How it works
      body: |
        Polishing removes a very thin layer of clear coat along with the scratches. There's only so much clear coat to work with, so we start with a paint thickness gauge, measuring every panel to assess the margin available. If the finish on the roof or wings is already thin, we take a gentler approach or leave that panel untouched.

        Next come two or three polishing stages: a cutting compound removes the main defects, then a finishing polish removes machine-induced holograms. We check the result under a detailing light that reveals defects you wouldn't see outdoors. Only then do we degrease the surface and apply the ceramic coating. We polish with Koch-Chemie products and use Gtechniq ceramic coatings.
      includesHeading: What's included
      includes:
        - Paint thickness readings across all panels, with results recorded
        - Two- or three-stage machine polishing, checked under detailing lights
        - Surface degreasing before coating application
        - Ceramic coating application with indoor curing time
        - Water-repellent treatment for the glass
        - Before-and-after photos taken under the same lighting
      forWhomHeading: Who it's for
      forWhom:
        - Cars that have spent years going through automatic car washes
        - Dark paint that shows swirl marks whenever the sun comes out
        - Preparing a car for sale, when first impressions matter
        - Newly imported cars after transport and storage
      honestHeading: When we advise against it
      honest: 'If paint depth readings indicate critically thin clear coat, polishing is not safe: it could cut through to the primer. In that case, we will suggest a gentle, non-abrasive treatment or a protective coating alone, and explain exactly what the readings showed.'
    steering-wheel-restoration:
      name: Steering wheel restoration
      short: We restore worn leather, shiny rims and peeling plastic to their original finish.
      metaTitle: Steering Wheel Restoration & Retrimming Belgrade | Details
      metaDescription: 'Steering wheel leather restoration in Belgrade: recolouring, retrimming, plastic and button repairs. Safe removal and refitting with airbag. 2–3 days.'
      heroEyebrow: Interior
      heroTitle: The first thing you touch. The first to show its age.
      heroLead: 'Your steering wheel wears faster than the rest of the interior: sweat, sunlight and hand cream can wear away the colour in just a couple of years. Restoration costs a fraction of a new wheel and delivers a factory-style finish.'
      priceFrom: from €150
      duration: 2–3 days
      bodyHeading: What we do
      body: |
        First, we carefully remove the complete steering wheel, disconnecting the car battery and airbag safely. What happens next depends on its condition: if the leather is intact and only the colour has worn away, we clean it, restore the grain and recolour it with a finish that will not feel sticky or transfer onto your hands. If the leather is torn or the stitching has come apart, we retrim it and hand-stitch it to match the original pattern.

        We also restore the parts around it that tend to wear: peeling buttons, scuffed plastic trim and paddle shifters worn shiny.
      includesHeading: What's included
      includes:
        - Steering wheel removal and refitting with safe airbag handling
        - Leather cleaning and grain restoration
        - Recolouring or a full retrim with hand stitching
        - Button and plastic trim restoration
        - Colour and stitching style matched to your interior
        - Airbag warning light check after reassembly
      forWhomHeading: Who it's for
      forWhom:
        - The rim has worn smooth and shiny or changed colour
        - The leather has cracked or split at the seam
        - You are preparing the car for sale, but the steering wheel gives away its mileage
        - You want a different material, such as Alcantara on the upper section
      honestHeading: What to know before you book
      honest: We do not work on steering wheels with a deployed airbag or signs of an airbag replacement without a documented service history. This is about your safety, not appearance. In that case, have a qualified workshop inspect it before bringing it to us.
