paint-protection-film:
  name: Защитная пленка (PPF)
  short: Прозрачная полиуретановая броня против камней, песка и щеток на мойке.
  metaTitle: Оклейка защитной пленкой PPF в Белграде | Details
  metaDescription: 'Оклейка кузова прозрачной защитной пленкой в Белграде: передняя часть, полная оклейка, заворот кромок. Пленки XPEL и SunTek.'
  heroEyebrow: Защита кузова
  heroTitle: Пленка, которую не видно, и сколы, которых не будет
  heroLead: Полиуретан толщиной 190 микрон принимает на себя камни с трассы, песок и следы от щеток. Краска под ним остается заводской, а именно ее смотрят при продаже.
  priceFrom: от 690 € за перед
  duration: 2–6 дней
  bodyHeading: Что это дает
  body: |
    Главная ценность пленки не «блеск», а сохраненная заводская краска. Перекрашенное крыло видно любым толщиномером, и на осмотре перед покупкой это сразу минус к цене. Пленка держит удар вместо лака: мелкие царапины на ней затягиваются сами на солнце, глубокие остаются на пленке, а не на кузове.

    Мы режем выкройку под конкретный кузов на плоттере, а сложные места (бамперы, зеркала, стойки) подгоняем руками. Там, где панель позволяет, заворачиваем край внутрь: так стык не собирает грязь и не выдает себя тонкой серой полоской через год.

    Пленку берем у XPEL и SunTek. Какая из них пойдет на вашу машину, называем на осмотре, до того, как вы согласитесь на смету.
  includesHeading: Что входит
  includes:
    - Двухэтапная мойка, глина и обезжиривание перед наклейкой
    - Точечная полировка дефектов, которые иначе запечатались бы под пленкой
    - Выкройка под вашу модель, ручная подгонка сложных элементов
    - Заворот кромок там, где геометрия панели это позволяет
    - Разбор ручек, зеркал и фонарей, если зона того требует
    - Контрольный осмотр через неделю после выдачи
  forWhomHeading: Кому это нужно
  forWhom:
    - Новая машина, которую хочется сохранить в заводском состоянии
    - Темный или матовый цвет, на котором видно каждую риску
    - Много трассы между городами и щебень на обочинах
    - Машина в лизинге или под скорую продажу, где важен отчет по краске
  honestHeading: Когда мы отговариваем
  honest: 'Если машина уже перекрашена дешевым лаком или на панели видны следы шпаклевки, пленку класть нельзя: при снятии она заберет покрытие с собой. В таком случае мы честно скажем об этом на осмотре и предложим сначала привести лак в порядок.'
colour-change-wrap:
  name: Смена цвета пленкой
  short: Новый цвет без покраски, с возможностью вернуть заводской.
  metaTitle: Смена цвета автомобиля пленкой в Белграде | Details
  metaDescription: 'Полная оклейка цветной пленкой в Белграде: мат, сатин, глянец, текстуры. Обратимо, без перекраски, с сохранением заводского лака. Образцы на вашей машине.'
  heroEyebrow: Цвет
  heroTitle: Другой цвет. Тот же заводской лак под ним.
  heroLead: Пленка меняет машину полностью, но остается обратимой. Через два года можно снять ее и получить ту же краску, что была с завода, чего не даст ни одна покраска.
  priceFrom: от 1 900 € за кузов
  duration: 4–7 дней
  bodyHeading: Почему пленка, а не покраска
  body: |
    Покраска делается навсегда и остается записью в истории автомобиля. Пленка же решение на несколько лет, которое можно отменить. При продаже вы снимаете ее и отдаете машину в родном цвете, с родным лаком под ней.

    Выбор цвета мы всегда делаем на вашей машине, а не по каталогу на столе: кладем образцы на кузов при дневном свете и смотрим, как цвет ведет себя на ваших изгибах. Матовый на одной модели выглядит дорого, а на другой плоско, и это видно только вживую.

    Цветные пленки берем у 3M и HEXIS. Какую именно кладем, фиксируем в смете вместе с ценой и сроком.
  includesHeading: Что входит
  includes:
    - Подбор цвета образцами на вашем кузове при дневном свете
    - Разбор ручек, молдингов, фонарей и решеток
    - Оклейка с заворотом кромок в проемах
    - Проклейка стыков и обработка углов феном
    - Инструкция по уходу за матом или сатином
    - Бесплатная правка мелких отслоений в первый месяц
  forWhomHeading: Кому это нужно
  forWhom:
    - Хочется другой цвет, но без потери заводской краски
    - Нужен мат, сатин или текстура, которых не бывает с завода
    - Машина в лизинге, где перекраска запрещена договором
    - Коммерческий автомобиль, который должен выглядеть узнаваемо
  honestHeading: Что нужно знать заранее
  honest: Пленка не прячет вмятины и волны на кузове. Наоборот, матовая подчеркивает их сильнее, чем глянец. Если на панелях есть геометрические дефекты, сначала кузовной ремонт, потом цвет. Мы скажем об этом на осмотре, а не после оклейки.
polishing-ceramic:
  name: Полировка и керамика
  short: Снимаем риски и паутинку, закрываем результат керамикой на годы.
  metaTitle: Полировка кузова и керамика в Белграде | Details
  metaDescription: Многоэтапная полировка с замером толщины лака и керамическое покрытие на 2–5 лет. Смотрим лак под лампой и показываем замеры. Студия Details, Белград.
  heroEyebrow: Лак
  heroTitle: Сначала убрать риски. Только потом что-то наносить.
  heroLead: Керамика поверх непрополированного лака просто консервирует паутинку на несколько лет. Мы сначала выводим дефекты, а покрытие кладем уже на готовую поверхность.
  priceFrom: от 450 € за автомобиль
  duration: 2–3 дня
  bodyHeading: Как это устроено
  body: |
    Полировка снимает тончайший слой лака вместе с рисками. Слой не бесконечный, поэтому мы начинаем с толщиномера: замеряем каждую панель и считаем, сколько запаса есть. Если на крыше или крыльях лак уже тонкий, работаем мягче или не трогаем панель вовсе.

    Дальше два или три прохода: режущий состав снимает основные дефекты, финишный убирает голограммы от машинки. Результат смотрим под лампой, которая показывает то, чего не видно на улице. И только после этого обезжиривание и керамика. Полируем составами Koch-Chemie, керамику кладем Gtechniq.
  includesHeading: Что входит
  includes:
    - Замер толщины лака по всем панелям с записью результатов
    - Двух- или трехэтапная полировка под контролем лампы
    - Обезжиривание поверхности перед нанесением
    - Керамическое покрытие с выдержкой в боксе
    - Обработка стекол водоотталкивающим составом
    - Фотоотчет до и после в одинаковом свете
  forWhomHeading: Кому это нужно
  forWhom:
    - Машина после нескольких лет автоматических моек
    - Темный цвет, на котором паутинка видна на любом солнце
    - Подготовка к продаже, когда важна первая секунда впечатления
    - Свежепригнанный автомобиль после перевозки и стоянок
  honestHeading: Когда мы отговариваем
  honest: Если толщиномер показывает критично тонкий лак, полировать нельзя, можно протереть до грунта. В такой ситуации мы предложим мягкий вариант без съема или только защитное покрытие, и объясним, что именно увидели на замерах.
steering-wheel-restoration:
  name: Реставрация руля
  short: Затертую кожу, лоснящийся обод и облезший пластик возвращаем в исходное состояние.
  metaTitle: Реставрация руля и перетяжка кожи в Белграде | Details
  metaDescription: 'Восстановление кожи руля в Белграде: перекраска, перетяжка, ремонт пластика и кнопок. Снимаем и ставим руль с подушкой безопасности. 2–3 дня.'
  heroEyebrow: Салон
  heroTitle: Первое, к чему прикасаются. И первое, что стареет.
  heroLead: 'Руль изнашивается быстрее всего салона: пот, солнце и крем для рук вытирают краску за пару лет. Восстановление стоит несоизмеримо дешевле нового руля и выглядит как заводской.'
  priceFrom: от 150 €
  duration: 2–3 дня
  bodyHeading: Что мы с ним делаем
  body: |
    Сначала снимаем руль целиком, аккуратно, с отключением аккумулятора и подушки безопасности. Дальше зависит от состояния: если кожа цела и вытерлась только краска, мы ее очищаем, восстанавливаем фактуру и перекрашиваем составом, который не липнет и не пачкает руки. Если кожа порвана или прошивка разошлась, перетягиваем заново, с ручной прошивкой по оригинальному рисунку.

    Заодно приводим в порядок то, что обычно портится рядом: облезшие кнопки, потертый пластик подрулевых накладок, глянец на лепестках.
  includesHeading: Что входит
  includes:
    - Снятие и установка руля с корректной работой с подушкой безопасности
    - Очистка и восстановление фактуры кожи
    - Перекраска или полная перетяжка с ручной прошивкой
    - Восстановление кнопок и пластиковых накладок
    - Подбор цвета и типа строчки под ваш салон
    - Проверка индикатора подушки после сборки
  forWhomHeading: Кому это нужно
  forWhom:
    - Обод вытерся до блестящего пластика или сменил цвет
    - Кожа потрескалась или разошлась по шву
    - Машина готовится к продаже, а руль выдает пробег
    - Хочется другой материал, например, алькантару на верхнем секторе
  honestHeading: Что нужно знать заранее
  honest: Мы не беремся за рули со сработавшей подушкой безопасности или следами ее замены без сервисной истории. Это вопрос вашей безопасности, а не косметики. В таком случае сначала сервис, потом мы.
translations:
  sr:
    indexMetaTitle: 'Usluge detaljinga u Beogradu: PPF, poliranje, volan | Details'
    indexMetaDescription: Zaštitna folija PPF, promjena boje, poliranje s keramičkim premazom i restauracija volana. Cene, rokovi i fair ograničenja po svakoj usluzi.
    indexEyebrow: Usluge
    indexHeading: Četiri pravca, u svakom do kraja
    indexLead: 'Svaka usluga ima svoju stranicu: šta uključuje, koliko traje, kome odgovara i kada se iskreno odričemo.'
    specsPriceLabel: Cena
    specsDurationLabel: Trajanje
    paint-protection-film:
      name: Zaštitna folija (PPF)
      short: Prozirna poliuretanska zaštita protiv kamenčića, peska i četkica na pranju.
      metaTitle: Oklapanje zaštitnom folijom PPF u Beogradu | Details
      metaDescription: 'Oklapanje karoserije prozirnom zaštitnom folijom u Beogradu: prednja strana, bilo kakvo oklapanje, uvlačenje rubova. Folije XPEL i SunTek.'
      heroEyebrow: Zaštita karoserije
      heroTitle: Folija koja se ne vidi, i oštećenja kojih neće biti
      heroLead: Poliuretan debljine 190 mikrona preuzima udarce kamenčića, peska i tragova četkica. Boja ispod ostaje fabrička, a ta se gleda prilikom prodaje.
      priceFrom: od 690 € za prednju
      duration: 2–6 dana
      bodyHeading: Šta to donosi
      body: |-
        Glavna vrednost folije nije „sjaj”, već očuvana fabrička boja. Prekrečeno krilo se može uočiti svakim mernim uređajem, i na pregledu pre kupovine to odmah umanjuje cenu. Folija apsorbuje udarce umesto laka: sitne ogrebotine se same zaceljuju na suncu, duboke ostaju na foliji, a ne na karoseriji.

        Šijemo uzorak po konkretnom vozilu na plotteru, a složena mesta (bumpere, retrovizore, stubove) prilagođavamo rukama. Tamo gde panel dozvoljava, uvlačimo rub unutra: tako spoj ne skuplja prljavštinu i ne izdvaja se tankom sivom trakom posle godine.

        Foliju uzimamo od XPEL i SunTek. Koja će od njih odgovarati vašem vozilu, kažemo na pregledu, pre nego što se složite sa troškovnikom.
      includesHeading: Šta uključuje
      includes:
        - Dvostepeno pranje, glina i odmašćivanje pre lepljenja
        - Tačkasta polirka defekata koji bi inače ostali pod folijom
        - Izrez pod vaš model, ručna prilagodba komplikovanih delova
        - Preklapanje ivica gde geometrija panela to dozvoljava
        - Rastavljanje ručki, ogledala i svetala, ako je potrebno
        - Kontrolni pregled nedelju dana nakon izrade
      forWhomHeading: Kome je to potrebno
      forWhom:
        - Nova mašina, koju želite da sačuvate u fabričkom stanju
        - Tamna ili mat boja na kojoj se vide svake ogrebotine
        - Mnogo vožnje između gradova i šljunak na ivicama
        - Automobil u lizingu ili za brzu prodaju, gde je važan izveštaj o boji
      honestHeading: Kada se odričemo
      honest: 'Ako je automobil već prefarban jeftinim lakom ili su na panelu vidljivi tragovi špaka, foliju ne možemo postaviti: pri skidanju oduzeće i premaz. U tom slučaju ćemo vam iskreno reći na pregledu i predložiti da prvo dovedete lak u red.'
    colour-change-wrap:
      name: Promena boje folijom
      short: Nova boja bez farbanja, sa mogućnošću vraćanja fabrike.
      metaTitle: Promena boje automobila folijom u Beogradu | Details
      metaDescription: 'Potpuno oklapanje bojnom folijom u Beogradu: mat, satenski, sjajni, teksture. Oborivo, bez farbanja, uz čuvanje fabričnog laka. Uzorci na vašem vozilu.'
      heroEyebrow: Boja
      heroTitle: Druga boja. Isti fabrički lak ispod.
      heroLead: Folija kompletno menja automobil, ali ostaje obrnuta. Posle dve godine može se skinuti i dobiti istu boju koja je bila iz fabrike, što nijedno farbanje ne može da pruži.
      priceFrom: od 1 900 € za karoseriju
      duration: 4–7 dana
      bodyHeading: Zašto folija, a ne farbanje
      body: |-
        Farbanje se radi zauvek i ostaje zabeleženo u istoriji automobila. Folija je rešenje na nekoliko godina koje se može poništiti. Prilikom prodaje skidate je i predajete automobil u originalnoj boji, s originalnim lakom ispod.

        Izbor boje uvek radimo na vašem automobilu, a ne po katalogu na stolu: stavljamo uzorke na karoseriju pri dnevnoj svetlosti i gledamo kako boja izgleda na vašim krivinama. Mat na jednom modelu izgleda skupo, a na drugom ravno, i to se vidi samo uživo.

        Bojne folije uzimamo od 3M i HEXIS. Koju tačno stavljamo, zabeležimo u troškovniku zajedno s cenom i rokom.
      includesHeading: Šta uključuje
      includes:
        - Odabir boje uzorcima na vašoj karoseriji pri dnevnom svetlu
        - Rasklapanje ručica, lajsni, svetala i rešetki
        - Oklapanje s uvlačenjem rubova u otvorima
        - Zalepljenje spojeva i obrada uglova fenom
        - Uputstvo za negu mat ili satinskih površina
        - Besplatna korekcija sitnih otpada u prvom mesecu
      forWhomHeading: Kome je to potrebno
      forWhom:
        - Želite drugu boju, ali bez gubitka fabričnog laka
        - Potrebni su mat, satin ili tekstura koje nema iz fabrike
        - Automobil u lizingu, gde je prefarbanje zabranjeno ugovorom
        - Komercijalni automobil, koji mora izgledati prepoznatljivo
      honestHeading: Šta treba znati unapred
      honest: Folija ne prikriva udubljenja i talase na karoseriji. Naprotiv, mat jače naglašava njih nego sjaj. Ako na panelima postoje geometrijski defekti, prvo karoserijski popravak, pa boja. Reći ćemo vam to na pregledu, a ne posle oklapanja.
    polishing-ceramic:
      name: Poliranje i keramika
      short: Sklanjamo ogrebotine i paukovu mrežu, prekrivamo rezultat keramikom na godinama.
      metaTitle: Poliranje karoserije i keramika u Beogradu | Details
      metaDescription: Višestepeno poliranje sa merenjem debljine laka i keramičkim premazom na 2–5 godina. Proučavamo lak pod lampom i pokazujemo merenja. Studio Details, Beograd.
      heroEyebrow: Lak
      heroTitle: Prvo ukloniti ogrebotine. Tek onda nešto nanositi.
      heroLead: Keramika na površini nepoliranog laka samo konzervira paučinu na nekoliko godina. Prvo ispravljamo defekte, a premaz stavljamo na spremnu površinu.
      priceFrom: od 450 € za automobil
      duration: 2–3 dana
      bodyHeading: Kako to funkcioniše
      body: |-
        Poliranje skida najtanji sloj laka zajedno s ogrebotinama. Sloj nije beskonačan, zato počinjemo s debljinom: merimo svaku panel i računamo koliko imamo rezervi. Ako je lak na krovu ili krilima već tanak, radimo pažljivije ili ne diramo panel uopšte.

        Nakon toga slede dva ili tri prolaza: rezni sastav skida osnovne defekte, finalni uklanja holograme od mašine. Rezultat gledamo pod lampom koja pokazuje ono što se ne vidi napolju. I tek posle toga demašćivanje i keramika. Poliramo sastavima Koch-Chemie, keramiku stavljamo Gtechniq.
      includesHeading: Šta uključuje
      includes:
        - Merenje debljine laka po svim panelima sa zapisom rezultata
        - Dvo- ili trostepeno poliranje pod kontrolom lampe
        - Dezinficiranje površine pre nanošenja
        - Keramička zaštita sa sušenjem u boksu
        - Obrada stakala vodoodbojnim sastavom
        - Foto izveštaj pre i posle u istom svetlu
      forWhomHeading: Kome je to potrebno
      forWhom:
        - Automobil posle više godina automatskog pranja
        - Tamna boja, na kojoj se paučina vidi na svakom suncu
        - Priprema za prodaju, kada je važna prva sekunda utiska
        - Sveže unet automobil posle transporta i parkiranja
      honestHeading: Kada se odričemo
      honest: Ako merač debljine pokazuje kritično tanak lak, poliranje nije dozvoljeno, možete doći do osnovnog sloja. U toj situaciji predložićemo blažu opciju bez skidanja ili samo zaštitni premaz, i objasnićemo šta smo tačno primetili tokom ispitivanja.
    steering-wheel-restoration:
      name: Restauracija volana
      short: Istrošenu kožu, sjajni obod i oštećenu plastiku vraćamo u originalno stanje.
      metaTitle: Restauracija volana i presvlačenje kože u Beogradu | Details
      metaDescription: 'Obnova kože volana u Beogradu: prefarbavanje, presvlačenje, popravka plastike i dugmadi. Skidamo i stavljamo volan sa vazdušnim jastuakom. 2-3 dana.'
      heroEyebrow: Salon
      heroTitle: Prvo, čega se dodirujete. I prvo, što se stari.
      heroLead: 'Volan se najbrže troši od celog enterijera: znoj, sunce i krema za ruke brišu boju za par godina. Obnova košta nesrazmerno manje od novog volana i izgleda kao fabrički.'
      priceFrom: od 150 €
      duration: 2–3 dana
      bodyHeading: Šta mi radimo s njim
      body: |-
        Prvo skidamo volan u celini, pažljivo, s isključenim akumulatorom i vazdušnim jastukom. Dalje zavisi od stanja: ako je koža cela i samo je farba istrošena, čisti je, obnavljamo teksturu i prefarbavamo sastavom koji se ne lepi i ne prlja ruke. Ako je koža pocepana ili je šivanje popustilo, ponovo presvlačimo, s ručnim šivanjem po originalnom uzorku.

        Uz to dovedemo u red ono što se obično pokvari oko: oštećene dugmadi, istrošena plastika na obodima, sjaj na perajama.
      includesHeading: Šta uključuje
      includes:
        - Skidanje i postavljanje volana sa pravilnim radom sa vazdušnim jastuakom
        - Čišćenje i obnova teksture kože
        - Prefarbavanje ili potpuno presvlačenje sa ručnom šavom
        - Obnova dugmadi i plastičnih panela
        - Odabir boje i tipa šava prema vašem enterijeru
        - Provera indikatora vazdušnog jastuaka nakon sastavljanja
      forWhomHeading: Kome je to potrebno
      forWhom:
        - Obod se istrošio do sjajne plastike ili je promenio boju
        - Koža je napukla ili se raspala po šavu
        - Automobil se priprema za prodaju, a volan otkriva pređene kilometre
        - Želi se drugi materijal, na primer, alkantara na gornjem sektoru
      honestHeading: Šta treba znati unapred
      honest: Ne preuzimamo volane sa aktiviranim vazdušnim jastukom ili tragovima njegove zamene bez servisne istorije. To je pitanja vaše bezbednosti, ne estetike. U tom slučaju prvo servis, pa onda mi.
  en:
    indexMetaTitle: 'Detailing Services in Belgrade: PPF, Polishing, Wheel | Details'
    indexMetaDescription: Paint protection film, colour-change wraps, polishing with ceramic coating and steering-wheel restoration. Prices, timelines, and honest limitations for each service.
    indexEyebrow: Services
    indexHeading: Four Directions, Each Fully Explored
    indexLead: "Each service has its own page below: what's included, how long it takes, who it's suitable for, and when we honestly advise against it."
    specsPriceLabel: Price
    specsDurationLabel: Duration
    paint-protection-film:
      name: Paint Protection Film (PPF)
      short: Clear polyurethane armor against stones, sand, and wash brushes.
      metaTitle: PPF Paint Protection Film Installation in Belgrade | Details
      metaDescription: 'Bodywork wrapped with clear paint protection film in Belgrade: front, full wrap, edge wrapping. XPEL and SunTek films.'
      heroEyebrow: Body Protection
      heroTitle: Invisible Film, No Chips
      heroLead: 190-micron polyurethane takes the hits from stones, sand, and brush marks. The paint below remains factory fresh, which is what matters during resale.
      priceFrom: from 690 € for the front
      duration: 2–6 days
      bodyHeading: What It Provides
      body: |-
        The primary value of the film is not its shine, but the preserved factory paint. Repainted panels can be detected by any thickness gauge, and during a pre-purchase inspection, that's an immediate price deduction. The film absorbs impacts instead of the clear coat: minor scratches self-heal in the sun, while deeper ones remain on the film, not on the body.

        We cut a template specifically for your vehicle using a plotter and handle complex areas (bumpers, mirrors, pillars) manually. Where the panel allows, we wrap the edge inside: this way, the seam doesn't collect dirt and won't show a thin gray line after a year.

        We source our films from XPEL and SunTek. We'll identify the best fit for your car during the inspection before you approve the estimate.
      includesHeading: What's Included
      includes:
        - Two-stage wash, clay treatment, and degreasing before application
        - Spot polishing defects that would otherwise be trapped under the film
        - Custom pattern for your model, manual fitting for complex elements
        - Edge wrapping where the panel geometry allows
        - Removal of handles, mirrors, and lights if necessary
        - Follow-up inspection one week after delivery
      forWhomHeading: Who Needs This
      forWhom:
        - A new car that you want to keep in factory condition
        - Dark or matte colors that reveal every scratch
        - Frequent highways and gravel on the roadside
        - Leased vehicles or cars for quick sale where paint condition matters
      honestHeading: When We Advise Against It
      honest: 'If a vehicle has been repainted with cheap clear coat or shows signs of body filler, we cannot apply the film: removing it will take the covering with it. In such cases, we will honestly inform you during the inspection and suggest fixing the clear coat first.'
    colour-change-wrap:
      name: Colour Change Wrap
      short: New colour without painting, with an option to revert to original.
      metaTitle: Car Colour Change Wrap in Belgrade | Details
      metaDescription: 'Full colour wrap in Belgrade: matte, satin, gloss, textures. Reversible, no repaint, preserving original clear coat. Samples on your car.'
      heroEyebrow: Color
      heroTitle: Different Color. Same Factory Paint Beneath.
      heroLead: The wrap completely transforms the car but is reversible. After two years, it can be removed to reveal the original paint, which no paint job can offer.
      priceFrom: from 1,900 € for the body
      duration: 4–7 days
      bodyHeading: Why Wrap Instead of Paint
      body: |-
        Painting is permanent and becomes part of the car's history. A wrap is a temporary solution that can be undone. When selling, you remove it and present the car in its original colour with the original clear coat underneath.

        We always choose the colour on your car, not from a desk catalog: we lay samples on the body in daylight and observe how the colour behaves on your curves. Matte looks high-end on one model, flat on another, which is only evident in person.

        We source coloured films from 3M and HEXIS. The specific one we apply is noted in the estimate along with the price and timeline.
      includesHeading: What's Included
      includes:
        - Color selection with samples on your body in daylight
        - Disassembly of handles, trims, lights, and grilles
        - Wrapping with edge folding in openings
        - Sealing seams and heat treating corners
        - Care instructions for matte or satin finishes
        - Free touch-ups for minor detachment within the first month
      forWhomHeading: Who Needs This
      forWhom:
        - Want a different color but without losing factory paint
        - Need a matte, satin, or texture finish not available from the factory
        - Leased car where repainting is prohibited by contract
        - Commercial vehicle that must look recognizable
      honestHeading: What You Need to Know in Advance
      honest: Wraps do not conceal dents and ripples on the body. In fact, matte finishes accentuate them more than gloss. If there are geometric defects on the panels, we recommend body repair first, then colour change. We will inform you of this during the inspection, not after wrapping.
    polishing-ceramic:
      name: Polishing and Coating
      short: We remove scratches and swirls, sealing the result with ceramic for years.
      metaTitle: Body Polishing and Ceramic Coating in Belgrade | Details
      metaDescription: Multi-stage polishing with measuring of clear coat thickness and ceramic coating for 2–5 years. We check the clear coat under a lamp and show the measurements. Details Studio, Belgrade.
      heroEyebrow: Clear Coat
      heroTitle: First Remove Scratches. Only Then Apply Anything.
      heroLead: Ceramic on unpolished clear coat simply preserves the swirls for years. We first correct the defects, then apply the coating to a prepared surface.
      priceFrom: from 450 € per vehicle
      duration: 2–3 days
      bodyHeading: How It Works
      body: |-
        Polishing removes a thin layer of clear coat along with imperfections. The layer is not infinite, so we start with a thickness gauge: measuring each panel to assess how much clear coat remains. If the roof or fenders have a thin clear coat, we proceed cautiously or avoid that panel altogether.

        Next, we perform two or three passes: a cutting compound removes the major defects, and a finishing polish eliminates holograms from the machine. We evaluate the result under a light that reveals details not visible outdoors. Only after that do we degrease and apply the ceramic coating. We use Koch-Chemie polishes and apply Gtechniq ceramic coating.
      includesHeading: What's Included
      includes:
        - Measurement of clear coat thickness on all panels with recorded results
        - Two or three-stage polishing under light control
        - Degreasing the surface before application
        - Ceramic coating with a curing time in the box
        - Glass treatment with a hydrophobic solution
        - Photo report before and after in consistent lighting
      forWhomHeading: Who Needs This
      forWhom:
        - A car after several years of automatic washes
        - Dark colours where swirls are visible in any sunlight
        - Preparation for sale, when the first impression matters
        - A freshly imported car after transport and parking
      honestHeading: When We Advise Against It
      honest: If the thickness gauge shows critically thin clear coat, polishing is not possible without risking to the base coat. In such situations, we will suggest a mild treatment without removal or just a protective coating and explain what we observed during measurements.
    steering-wheel-restoration:
      name: Steering Wheel Restoration
      short: We restore worn leather, glossy edges, and peeling plastic to their original condition.
      metaTitle: Steering Wheel Restoration and Leather Reskinning in Belgrade | Details
      metaDescription: 'Steering wheel leather restoration in Belgrade: repainting, reupholstery, plastic and button repairs. We remove and replace the steering wheel with the airbag. 2–3 days.'
      heroEyebrow: Interior
      heroTitle: The first thing you touch, and the first to age.
      heroLead: 'The steering wheel wears out faster than any other part of the interior: sweat, sunlight, and hand cream wear away the finish within a few years. Restoration costs far less than a new steering wheel and looks factory-fresh.'
      priceFrom: from 150 €
      duration: 2–3 days
      bodyHeading: What we do with it
      body: |-
        First, we remove the steering wheel completely, carefully, disconnecting the akumulator and airbags. Next steps depend on the condition: if the leather is intact with only worn paint, we clean it, restore the texture, and repaint with a non-sticky, non-messy compound. If the leather is torn or the stitching is undone, we rewrap it with hand-stitching following the original pattern.

        We also take care of typically damaged areas nearby: worn buttons, scratched plastics of the steering column covers, and gloss on the paddles.
      includesHeading: What's Included
      includes:
        - Removal and installation of the steering wheel with correct airbag operation
        - Cleaning and restoring the leather texture
        - Repainting or full reupholstery with hand stitching
        - Restoration of buttons and plastic covers
        - Matching color and stitching type to your interior
        - Airbag indicator check after reassembly
      forWhomHeading: Who Needs This
      forWhom:
        - Rim worn down to glossy plastic or changed color
        - Leather cracked or seam has come undone
        - The car is being prepared for sale, and the steering wheel shows mileage
        - Desire for a different material, such as alcantara on the upper section
      honestHeading: What You Need to Know in Advance
      honest: We do not accept steering wheels with deployed airbags or signs of prior deployment without service history. This is a safety issue, not just cosmetics. In such cases, we first recommend service, then restoration.
