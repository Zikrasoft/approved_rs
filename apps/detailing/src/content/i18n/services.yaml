paint-protection-film:
  name: Защитная пленка (PPF)
  short: Прозрачная полиуретановая броня против камней, песка и щеток на мойке.
  metaTitle: Оклейка защитной пленкой PPF в Белграде | Details
  metaDescription: 'Оклейка кузова прозрачной защитной пленкой в Белграде: передняя часть, полная оклейка, заворот кромок. Пленки XPEL и SunTek.'
  heroEyebrow: Защита кузова
  heroTitle: Пленка, которую не видно, и сколы, которых не будет
  heroLead: Полиуретан толщиной 190 микрон принимает на себя камни с трассы, песок и следы от щеток. Краска под ним остается заводской, а именно ее смотрят при продаже.
  priceFrom: от 690 € за перед
  duration: 2–6 дней
  bodyHeading: Что это дает
  body: |
    Главная ценность пленки не «блеск», а сохраненная заводская краска. Перекрашенное крыло видно любым толщиномером, и на осмотре перед покупкой это сразу минус к цене. Пленка держит удар вместо лака: мелкие царапины на ней затягиваются сами на солнце, глубокие остаются на пленке, а не на кузове.

    Мы режем выкройку под конкретный кузов на плоттере, а сложные места (бамперы, зеркала, стойки) подгоняем руками. Там, где панель позволяет, заворачиваем край внутрь: так стык не собирает грязь и не выдает себя тонкой серой полоской через год.

    Пленку берем у XPEL и SunTek. Какая из них пойдет на вашу машину, называем на осмотре, до того, как вы согласитесь на смету.
  includesHeading: Что входит
  includes:
    - Двухэтапная мойка, глина и обезжиривание перед наклейкой
    - Точечная полировка дефектов, которые иначе запечатались бы под пленкой
    - Выкройка под вашу модель, ручная подгонка сложных элементов
    - Заворот кромок там, где геометрия панели это позволяет
    - Разбор ручек, зеркал и фонарей, если зона того требует
    - Контрольный осмотр через неделю после выдачи
  forWhomHeading: Кому это нужно
  forWhom:
    - Новая машина, которую хочется сохранить в заводском состоянии
    - Темный или матовый цвет, на котором видно каждую риску
    - Много трассы между городами и щебень на обочинах
    - Машина в лизинге или под скорую продажу, где важен отчет по краске
  honestHeading: Когда мы отговариваем
  honest: 'Если машина уже перекрашена дешевым лаком или на панели видны следы шпаклевки, пленку класть нельзя: при снятии она заберет покрытие с собой. В таком случае мы честно скажем об этом на осмотре и предложим сначала привести лак в порядок.'
colour-change-wrap:
  name: Смена цвета пленкой
  short: Новый цвет без покраски, с возможностью вернуть заводской.
  metaTitle: Смена цвета автомобиля пленкой в Белграде | Details
  metaDescription: 'Полная оклейка цветной пленкой в Белграде: мат, сатин, глянец, текстуры. Обратимо, без перекраски, с сохранением заводского лака. Образцы на вашей машине.'
  heroEyebrow: Цвет
  heroTitle: Другой цвет. Тот же заводской лак под ним.
  heroLead: Пленка меняет машину полностью, но остается обратимой. Через два года можно снять ее и получить ту же краску, что была с завода, чего не даст ни одна покраска.
  priceFrom: от 1 900 € за кузов
  duration: 4–7 дней
  bodyHeading: Почему пленка, а не покраска
  body: |
    Покраска делается навсегда и остается записью в истории автомобиля. Пленка же решение на несколько лет, которое можно отменить. При продаже вы снимаете ее и отдаете машину в родном цвете, с родным лаком под ней.

    Выбор цвета мы всегда делаем на вашей машине, а не по каталогу на столе: кладем образцы на кузов при дневном свете и смотрим, как цвет ведет себя на ваших изгибах. Матовый на одной модели выглядит дорого, а на другой плоско, и это видно только вживую.

    Цветные пленки берем у 3M и HEXIS. Какую именно кладем, фиксируем в смете вместе с ценой и сроком.
  includesHeading: Что входит
  includes:
    - Подбор цвета образцами на вашем кузове при дневном свете
    - Разбор ручек, молдингов, фонарей и решеток
    - Оклейка с заворотом кромок в проемах
    - Проклейка стыков и обработка углов феном
    - Инструкция по уходу за матом или сатином
    - Бесплатная правка мелких отслоений в первый месяц
  forWhomHeading: Кому это нужно
  forWhom:
    - Хочется другой цвет, но без потери заводской краски
    - Нужен мат, сатин или текстура, которых не бывает с завода
    - Машина в лизинге, где перекраска запрещена договором
    - Коммерческий автомобиль, который должен выглядеть узнаваемо
  honestHeading: Что нужно знать заранее
  honest: Пленка не прячет вмятины и волны на кузове. Наоборот, матовая подчеркивает их сильнее, чем глянец. Если на панелях есть геометрические дефекты, сначала кузовной ремонт, потом цвет. Мы скажем об этом на осмотре, а не после оклейки.
polishing-ceramic:
  name: Полировка и керамика
  short: Снимаем риски и паутинку, закрываем результат керамикой на годы.
  metaTitle: Полировка кузова и керамика в Белграде | Details
  metaDescription: Многоэтапная полировка с замером толщины лака и керамическое покрытие на 2–5 лет. Смотрим лак под лампой и показываем замеры. Студия Details, Белград.
  heroEyebrow: Лак
  heroTitle: Сначала убрать риски. Только потом что-то наносить.
  heroLead: Керамика поверх непрополированного лака просто консервирует паутинку на несколько лет. Мы сначала выводим дефекты, а покрытие кладем уже на готовую поверхность.
  priceFrom: от 450 € за автомобиль
  duration: 2–3 дня
  bodyHeading: Как это устроено
  body: |
    Полировка снимает тончайший слой лака вместе с рисками. Слой не бесконечный, поэтому мы начинаем с толщиномера: замеряем каждую панель и считаем, сколько запаса есть. Если на крыше или крыльях лак уже тонкий, работаем мягче или не трогаем панель вовсе.

    Дальше два или три прохода: режущий состав снимает основные дефекты, финишный убирает голограммы от машинки. Результат смотрим под лампой, которая показывает то, чего не видно на улице. И только после этого обезжиривание и керамика. Полируем составами Koch-Chemie, керамику кладем Gtechniq.
  includesHeading: Что входит
  includes:
    - Замер толщины лака по всем панелям с записью результатов
    - Двух- или трехэтапная полировка под контролем лампы
    - Обезжиривание поверхности перед нанесением
    - Керамическое покрытие с выдержкой в боксе
    - Обработка стекол водоотталкивающим составом
    - Фотоотчет до и после в одинаковом свете
  forWhomHeading: Кому это нужно
  forWhom:
    - Машина после нескольких лет автоматических моек
    - Темный цвет, на котором паутинка видна на любом солнце
    - Подготовка к продаже, когда важна первая секунда впечатления
    - Свежепригнанный автомобиль после перевозки и стоянок
  honestHeading: Когда мы отговариваем
  honest: Если толщиномер показывает критично тонкий лак, полировать нельзя, можно протереть до грунта. В такой ситуации мы предложим мягкий вариант без съема или только защитное покрытие, и объясним, что именно увидели на замерах.
steering-wheel-restoration:
  name: Реставрация руля
  short: Затертую кожу, лоснящийся обод и облезший пластик возвращаем в исходное состояние.
  metaTitle: Реставрация руля и перетяжка кожи в Белграде | Details
  metaDescription: 'Восстановление кожи руля в Белграде: перекраска, перетяжка, ремонт пластика и кнопок. Снимаем и ставим руль с подушкой безопасности. 2–3 дня.'
  heroEyebrow: Салон
  heroTitle: Первое, к чему прикасаются. И первое, что стареет.
  heroLead: 'Руль изнашивается быстрее всего салона: пот, солнце и крем для рук вытирают краску за пару лет. Восстановление стоит несоизмеримо дешевле нового руля и выглядит как заводской.'
  priceFrom: от 150 €
  duration: 2–3 дня
  bodyHeading: Что мы с ним делаем
  body: |
    Сначала снимаем руль целиком, аккуратно, с отключением аккумулятора и подушки безопасности. Дальше зависит от состояния: если кожа цела и вытерлась только краска, мы ее очищаем, восстанавливаем фактуру и перекрашиваем составом, который не липнет и не пачкает руки. Если кожа порвана или прошивка разошлась, перетягиваем заново, с ручной прошивкой по оригинальному рисунку.

    Заодно приводим в порядок то, что обычно портится рядом: облезшие кнопки, потертый пластик подрулевых накладок, глянец на лепестках.
  includesHeading: Что входит
  includes:
    - Снятие и установка руля с корректной работой с подушкой безопасности
    - Очистка и восстановление фактуры кожи
    - Перекраска или полная перетяжка с ручной прошивкой
    - Восстановление кнопок и пластиковых накладок
    - Подбор цвета и типа строчки под ваш салон
    - Проверка индикатора подушки после сборки
  forWhomHeading: Кому это нужно
  forWhom:
    - Обод вытерся до блестящего пластика или сменил цвет
    - Кожа потрескалась или разошлась по шву
    - Машина готовится к продаже, а руль выдает пробег
    - Хочется другой материал, например, алькантару на верхнем секторе
  honestHeading: Что нужно знать заранее
  honest: Мы не беремся за рули со сработавшей подушкой безопасности или следами ее замены без сервисной истории. Это вопрос вашей безопасности, а не косметики. В таком случае сначала сервис, потом мы.
translations:
  sr:
    indexMetaTitle: 'Auto detailing usluge u Beogradu: PPF, poliranje, volan | Details'
    indexMetaDescription: Zaštitna PPF folija, promena boje, poliranje s keramičkom zaštitom i restauracija volana. Cene, rokovi i iskreno o ograničenjima svake usluge.
    indexEyebrow: Usluge
    indexHeading: Četiri usluge, svaku radimo do kraja
    indexLead: 'Svaka usluga ima svoju stranicu: šta obuhvata, koliko traje, kome odgovara i kada vam iskreno savetujemo da odustanete.'
    specsPriceLabel: Cena
    specsDurationLabel: Rok
    paint-protection-film:
      name: Zaštitna PPF folija
      short: Providna poliuretanska zaštita od kamenčića, peska i četki u perionici.
      metaTitle: Ugradnja PPF zaštitne folije u Beogradu | Details
      metaDescription: 'Ugradnja providne zaštitne folije u Beogradu: prednji deo, celo vozilo, uvlačenje ivica. XPEL i SunTek folije.'
      heroEyebrow: Zaštita karoserije
      heroTitle: Folija koja se ne vidi i bez ogrebotina od kamenčića
      heroLead: Poliuretan debljine 190 mikrona štiti od kamenčića s puta, peska i tragova četki. Lak ispod nje ostaje fabrički, a upravo njega gledaju pri prodaji.
      priceFrom: od 690 € za prednji deo
      duration: 2–6 dana
      bodyHeading: Šta dobijate
      body: |
        Najveća prednost folije nije "sjaj", već očuvan fabrički lak. Prefarbano krilo otkrije svaki merač debljine laka, a na pregledu pre kupovine to odmah obara cenu. Folija prima udarce umesto laka: sitne ogrebotine na njoj same zarastaju na suncu, a dublje ostaju na foliji, ne na karoseriji.

        Foliju sečemo po meri konkretnog modela na kateru, a složene delove, poput branika, retrovizora i stubova, prilagođavamo ručno. Gde god oblik panela dozvoljava, uvlačimo ivicu unutra: spoj tako ne skuplja prljavštinu i ne odaje se tankom sivom linijom posle godinu dana.

        Koristimo XPEL i SunTek folije. Koju ćemo staviti na vaš automobil, reći ćemo vam na pregledu, pre nego što prihvatite ponudu.
      includesHeading: Šta je uključeno
      includes:
        - Dvofazno pranje, dekontaminacija glinom i odmašćivanje pre ugradnje
        - Lokalno poliranje oštećenja koja bi inače ostala zarobljena ispod folije
        - Kroj po meri vašeg modela i ručno prilagođavanje složenih delova
        - Uvlačenje ivica gde to oblik panela dozvoljava
        - Demontaža kvaka, retrovizora i svetala po potrebi
        - Kontrolni pregled nedelju dana nakon preuzimanja
      forWhomHeading: Kome je namenjena
      forWhom:
        - Nov automobil koji želite da sačuvate u fabričkom stanju
        - Tamna ili mat boja na kojoj se vidi svaka ogrebotina
        - Česta vožnja između gradova i rizla uz put
        - Automobil na lizing ili pred prodajom, kada je bitan izveštaj o laku
      honestHeading: Kada vam savetujemo da odustanete
      honest: 'Ako je automobil već prefarban nekvalitetnim lakom ili se na panelu vide tragovi gitovanja, folija se ne sme postavljati: pri skidanju može povući lak sa sobom. To ćemo vam iskreno reći na pregledu i predložiti da prvo sredimo lak.'
    colour-change-wrap:
      name: Promena boje folijom
      short: Nova boja bez farbanja, uz mogućnost vraćanja na fabričku.
      metaTitle: Promena boje automobila folijom u Beogradu | Details
      metaDescription: 'Kompletno oblaganje vozila folijom u Beogradu: mat, saten, sjaj i teksture. Može da se ukloni, bez farbanja i uz očuvan fabrički lak. Uzorci na vašem automobilu.'
      heroEyebrow: Boja
      heroTitle: Druga boja. Ispod nje isti fabrički lak.
      heroLead: Folija potpuno menja izgled automobila, ali može da se ukloni. Posle dve godine možete je skinuti i dobiti isti lak koji je automobil imao iz fabrike, što farbanje ne može da omogući.
      priceFrom: od 1 900 € za karoseriju
      duration: 4–7 dana
      bodyHeading: Zašto folija, a ne farbanje
      body: |
        Farbanje je trajno i ostaje zabeleženo u istoriji vozila. Folija je rešenje na nekoliko godina koje možete da poništite. Kada prodajete automobil, skinete je i predate vozilo u originalnoj boji, sa fabričkim lakom ispod.

        Boju biramo na vašem automobilu, a ne iz kataloga na stolu: postavljamo uzorke na karoseriju na dnevnom svetlu i gledamo kako izgledaju na njenim linijama. Mat na jednom modelu izgleda luksuzno, a na drugom ravno, što se vidi samo uživo.

        Koristimo folije u boji proizvođača 3M i HEXIS. Tačan tip folije navodimo u ponudi, zajedno sa cenom i rokom.
      includesHeading: Šta je uključeno
      includes:
        - Izbor boje uzoraka na vašoj karoseriji, na dnevnom svetlu
        - Demontaža kvaka, lajsni, svetala i maski
        - Postavljanje folije sa uvlačenjem ivica u otvore
        - Obrada spojeva i zagrevanje uglova fenom
        - Uputstvo za održavanje mat ili saten folije
        - Besplatna popravka sitnih odlepljenih delova tokom prvog meseca
      forWhomHeading: Kome je namenjena
      forWhom:
        - Želite drugu boju, ali ne želite da izgubite fabrički lak
        - Želite mat, saten ili teksturu koji ne postoje fabrički
        - Automobil je na lizing, a ugovor zabranjuje farbanje
        - Komercijalno vozilo koje mora da ostane prepoznatljivo
      honestHeading: Šta treba unapred da znate
      honest: Folija ne skriva udubljenja ni neravnine na karoseriji. Mat folija ih čak više ističe nego sjajna. Ako paneli imaju deformacije, prvo je potreban limarski popravak, pa tek onda promena boje. Reći ćemo vam to na pregledu, ne nakon postavljanja folije.
    polishing-ceramic:
      name: Poliranje i keramička zaštita
      short: Uklanjamo ogrebotine i paučinu, pa rezultat štitimo keramikom na više godina.
      metaTitle: Poliranje karoserije i keramika u Beogradu | Details
      metaDescription: Višefazno poliranje uz merenje debljine laka i keramička zaštita na 2–5 godina. Pregledamo lak pod lampom i pokazujemo rezultate merenja. Details, Beograd.
      heroEyebrow: Lak
      heroTitle: Prvo uklanjamo ogrebotine. Tek onda nanosimo zaštitu.
      heroLead: Keramička zaštita preko neisprepoliranog laka samo će konzervirati paučinu na nekoliko godina. Prvo uklanjamo oštećenja, a zaštitu nanosimo tek na pripremljenu površinu.
      priceFrom: od 450 € po automobilu
      duration: 2–3 dana
      bodyHeading: Kako radimo
      body: |
        Poliranjem se skida najtanji sloj laka zajedno sa ogrebotinama. Taj sloj nije beskonačan, zato počinjemo merenjem debljine laka: proveravamo svaki panel i utvrđujemo kolika je rezerva. Ako je lak na krovu ili krilima već tanak, radimo blaže ili taj panel uopšte ne diramo.

        Zatim sledi dva ili tri prolaza: abrazivna pasta uklanja glavna oštećenja, a završna uklanja holograme od mašinskog poliranja. Rezultat proveravamo pod lampom koja otkriva ono što se napolju ne vidi. Tek tada odmašćujemo površinu i nanosimo keramičku zaštitu. Poliramo pastama Koch-Chemie, a keramičku zaštitu nanosimo proizvodima Gtechniq.
      includesHeading: Šta je uključeno
      includes:
        - Merenje debljine laka na svim panelima i beleženje rezultata
        - Dvofazno ili trofazno poliranje pod kontrolom lampe
        - Odmašćivanje površine pre nanošenja zaštite
        - Keramička zaštita uz vreme potrebno za sušenje u radionici
        - Tretman stakala sredstvom za odbijanje vode
        - Fotografije pre i posle, snimljene pod istim osvetljenjem
      forWhomHeading: Kome je namenjena
      forWhom:
        - Automobil posle nekoliko godina pranja u automatskim perionicama
        - Tamna boja na kojoj se paučinaste ogrebotine vide na svakom suncu
        - Priprema za prodaju, kada je prvi utisak najvažniji
        - Tek uvezen automobil posle transporta i stajanja
      honestHeading: Kada vam savetujemo da odustanete
      honest: Ako merač debljine laka pokaže da je lak kritično tanak, poliranje nije bezbedno jer možemo da probijemo do prajmera. U tom slučaju predložićemo blažu opciju bez skidanja sloja laka ili samo zaštitni premaz, i objasniti šta smo tačno utvrdili merenjem.
    steering-wheel-restoration:
      name: Restauracija volana
      short: Istrošenu kožu, uglačan obruč i oljuštenu plastiku vraćamo u prvobitno stanje.
      metaTitle: Restauracija volana i presvlačenje kože u Beogradu | Details
      metaDescription: 'Obnova kože na volanu u Beogradu: farbanje, presvlačenje, popravka plastike i dugmića. Demontaža i montaža volana sa airbagom. 2-3 dana.'
      heroEyebrow: Enterijer
      heroTitle: Prvo što dodirnete. I prvo što stari.
      heroLead: 'Volan se najbrže haba od svih delova enterijera: znoj, sunce i krema za ruke skidaju boju za svega nekoliko godina. Obnova košta neuporedivo manje od novog volana, a izgleda kao fabrički.'
      priceFrom: od 150 €
      duration: 2–3 dana
      bodyHeading: Šta radimo
      body: |
        Najpre pažljivo demontiramo ceo volan, uz isključivanje akumulatora i airbaga. Dalji postupak zavisi od stanja: ako je koža cela, a pohabana je samo boja, čistimo je, obnavljamo teksturu i nanosimo novu boju koja se ne lepi i ne ostavlja tragove na rukama. Ako je koža pocepana ili se šav rašio, presvlačimo volan novom kožom i ručno šijemo po originalnom uzorku.

        Usput sređujemo i delove koji se obično oštete u blizini: oljuštene dugmiće, izgrebanu plastiku na oblogama oko volana i sjaj na ručicama za menjanje brzina.
      includesHeading: Šta je uključeno
      includes:
        - Demontaža i montaža volana uz pravilno rukovanje airbagom
        - Čišćenje kože i obnova njene teksture
        - Farbanje ili potpuno presvlačenje uz ručno šivenje
        - Obnova dugmića i plastičnih obloga
        - Usklađivanje boje i vrste šava sa enterijerom
        - Provera lampice airbaga nakon sklapanja
      forWhomHeading: Kome je namenjena
      forWhom:
        - Obruč je pohaban do sjajne plastike ili je promenio boju
        - Koža je ispucala ili se šav rašio
        - Automobil se priprema za prodaju, a volan odaje kilometražu
        - Želite drugačiji materijal, na primer alkantaru na gornjem delu volana
      honestHeading: Šta treba unapred da znate
      honest: Ne radimo volane sa aktiviranim airbagom niti one na kojima se vide tragovi zamene airbaga bez servisne istorije. To je pitanje vaše bezbednosti, a ne estetike. U tom slučaju prvo posetite servis, pa onda nas.
  en:
    indexMetaTitle: 'Detailing Services in Belgrade: PPF, Polishing, Wheels | Details'
    indexMetaDescription: Paint protection film, colour-change wraps, machine polishing with ceramic coating, and steering-wheel restoration. Prices, turnaround times, and honest advice for each service.
    indexEyebrow: Services
    indexHeading: Four services, each done right
    indexLead: "Each service has its own page below: what's included, how long it takes, who it's for, and when we'll honestly advise against it."
    specsPriceLabel: Price
    specsDurationLabel: Turnaround
    paint-protection-film:
      name: Paint protection film (PPF)
      short: Clear polyurethane protection against stones, grit, and car-wash brushes.
      metaTitle: Paint Protection Film in Belgrade | Details
      metaDescription: 'Clear paint protection film in Belgrade: front-end coverage or full-body wraps, with wrapped edges. XPEL and SunTek films.'
      heroEyebrow: Paint protection
      heroTitle: A film you can't see, and stone chips you won't get
      heroLead: 190-micron polyurethane takes the hit from road stones, grit, and brush marks. The factory paint stays intact, and that's what buyers check when you sell.
      priceFrom: from €690 for the front end
      duration: 2–6 days
      bodyHeading: What it does
      body: |
        The real value of paint protection film isn't 'shine', it's preserving the factory paint. A repaint shows up on any paint depth gauge, and that's an immediate knock to the price during a pre-purchase inspection. The film takes the impact instead of the clear coat: fine scratches in the film self-heal in the sun, while deeper ones stay in the film, not the paintwork.

        We plot the pattern for your specific model on a cutting plotter, then hand-fit complex areas such as bumpers, mirrors, and pillars. Where the panel shape allows, we wrap the edges underneath. That keeps dirt out of the joins and avoids a thin grey line giving the film away a year later.

        We use films from XPEL and SunTek. We'll tell you which one is right for your car during the inspection, before you agree to the quote.
      includesHeading: What's included
      includes:
        - Two-stage wash, clay bar treatment, and degreasing before installation
        - Spot polishing of defects that would otherwise be sealed beneath the film
        - A pattern cut for your model, with complex areas hand-fitted
        - Wrapped edges wherever the panel shape allows
        - Removal of handles, mirrors, and lights where needed
        - A follow-up inspection one week after collection
      forWhomHeading: Who it's for
      forWhom:
        - A new car you want to keep in factory condition
        - Dark or matte paint, where every mark shows
        - Frequent motorway driving and loose gravel on the roads
        - A leased car or one you're planning to sell soon, where the paint condition report matters
      honestHeading: When we'll advise against it
      honest: "If the car has been repainted with low-quality clear coat or there are signs of body filler, we can't install film: it may pull the finish off when removed. We'll be upfront about this during the inspection and recommend getting the paintwork sorted first."
    colour-change-wrap:
      name: Colour-change wrap
      short: A new colour without repainting, and the option to go back to the original.
      metaTitle: Colour-Change Car Wraps in Belgrade | Details
      metaDescription: 'Full colour-change wraps in Belgrade: matte, satin, gloss, and textured finishes. Reversible, with no repainting and factory paint preserved. See samples on your car.'
      heroEyebrow: Colour
      heroTitle: A different colour. The same factory paint underneath.
      heroLead: A wrap transforms your car, but it's reversible. Remove it in two years and you'll have the same factory paint as before. No repaint can offer that.
      priceFrom: from €1,900 for the body
      duration: 4–7 days
      bodyHeading: Why wrap instead of repaint
      body: |
        A repaint is permanent and becomes part of the car's history. A wrap is a choice you can undo after a few years. When it's time to sell, remove it and return the car to its original colour, with the factory paint underneath.

        We always choose the colour on your car, not from a catalogue on a desk: we place samples on the bodywork in daylight and see how the colour works with its curves. Matte can look premium on one model and flat on another. You can only tell in person.

        We use colour-change films from 3M and HEXIS. The exact film is listed in your quote, along with the price and turnaround time.
      includesHeading: What's included
      includes:
        - Colour selection using samples on your car in daylight
        - Removal of handles, trim, lights, and grilles
        - Wrap installation with edges tucked into the door shuts
        - Sealed joins and heat-treated corners
        - Care instructions for matte or satin finishes
        - Free repair of minor lifting during the first month
      forWhomHeading: Who it's for
      forWhom:
        - You want a different colour without losing the factory paint
        - You want a matte, satin, or textured finish not offered from the factory
        - Your leased car's contract doesn't allow repainting
        - A commercial vehicle that needs to stay recognisable
      honestHeading: What to know beforehand
      honest: A wrap won't hide dents or ripples in the bodywork. Matte film can actually make them more noticeable than gloss. If the panels have shape defects, get the bodywork repaired before changing the colour. We'll tell you during the inspection, not after the wrap is installed.
    polishing-ceramic:
      name: Machine polishing and ceramic coating
      short: We remove scratches and swirl marks, then protect the finish with a long-lasting ceramic coating.
      metaTitle: Machine Polishing and Ceramic Coating | Details
      metaDescription: Multi-stage polishing with paint depth measurements, plus ceramic coating lasting 2–5 years. We inspect the paint under a lamp and show you the readings. Details, Belgrade.
      heroEyebrow: Paintwork
      heroTitle: Remove the scratches first. Then apply the protection.
      heroLead: Ceramic coating over unpolished paint simply seals swirl marks in for years. We correct the defects first, then apply the coating to the prepared surface.
      priceFrom: from €450 per car
      duration: 2–3 days
      bodyHeading: How it works
      body: |
        Machine polishing removes an extremely thin layer of clear coat along with the scratches. That layer isn't unlimited, so we start with a paint depth gauge: we measure every panel and check how much clear coat is available. If the paint is already thin on the roof or wings, we use a gentler approach or leave that panel alone.

        Next come two or three polishing stages: a cutting compound removes the main defects, and a finishing polish clears up machine holograms. We inspect the result under a detailing lamp that reveals what daylight can hide. Only then do we degrease the surface and apply ceramic coating. We polish with Koch-Chemie compounds and apply Gtechniq ceramic coating.
      includesHeading: What's included
      includes:
        - Paint depth measurements across all panels, with results recorded
        - Two- or three-stage polishing under a detailing lamp
        - Surface degreasing before application
        - Ceramic coating, cured in the studio
        - Glass treated with a water-repellent coating
        - Before-and-after photo report under the same lighting
      forWhomHeading: Who it's for
      forWhom:
        - Cars that have spent years going through automatic car washes
        - Dark paint, where swirl marks show in any sunlight
        - Cars being prepared for sale, where first impressions matter
        - Recently imported cars after transport and time in storage
      honestHeading: When we'll advise against it
      honest: "If the paint thickness gauge shows critically thin paint, polishing is not an option: it could cut through to the primer. In that case, we'll recommend a gentler option that removes no paint, or apply a protective coating only. We'll explain exactly what we found in the measurements."
    steering-wheel-restoration:
      name: Steering Wheel Restoration
      short: We restore worn leather, a shiny steering wheel rim and peeling plastic to their original condition.
      metaTitle: Steering Wheel Restoration in Belgrade | Details
      metaDescription: 'Steering wheel leather restoration in Belgrade: recolouring, reupholstery, plastic and button repairs. Airbag-safe removal and refitting. 2-3 days.'
      heroEyebrow: Interior
      heroTitle: The first thing you touch. And the first thing to show its age.
      heroLead: 'The steering wheel wears faster than any other part of the interior: sweat, sun and hand cream can wear away the finish in just a couple of years. Restoration costs far less than a new steering wheel and looks factory-fresh.'
      priceFrom: from 150 €
      duration: 2–3 days
      bodyHeading: What we do
      body: |
        First, we remove the steering wheel carefully, disconnecting the battery and airbag. The next steps depend on its condition: if the leather is intact and only the finish has worn away, we clean it, restore its texture and recolour it with a finish that won't feel sticky or stain your hands. If the leather is torn or the stitching has come apart, we reupholster it with hand stitching that matches the original pattern.

        We also restore parts that commonly wear alongside it: peeling buttons, worn plastic trim around the steering column and glossy paddle shifters.
      includesHeading: What's included
      includes:
        - Steering wheel removal and refitting, with proper airbag handling
        - Leather cleaning and texture restoration
        - Recolouring or full reupholstery with hand stitching
        - Button and plastic trim restoration
        - Colour and stitching matched to your interior
        - Airbag warning light check after reassembly
      forWhomHeading: Who it's for
      forWhom:
        - The rim is worn through to shiny plastic or has changed colour
        - The leather is cracked or split along the seam
        - The car is being prepared for sale and the steering wheel gives away its mileage
        - You'd like a different material, such as Alcantara on the upper section
      honestHeading: What to know beforehand
      honest: We don't work on steering wheels with deployed airbags or signs of airbag replacement without a service history. This is about your safety, not cosmetics. In that case, have it checked by a service centre first, then bring it to us.
