      metaDescription: Address, hours, and phone number of Details car detailing studio in Belgrade. Schedule an inspection via phone, WhatsApp, Viber, or Telegram.
      eyebrow: Contacts
      heading: Visit Us to See the Box
      lead: 'We don’t sell over the phone. The best way is to drop by for fifteen minutes: we’ll look at your car together and discuss what it actually needs.'
      addressLabel: Address
      hoursLabel: Opening Hours
      phoneLabel: Phone
