    privacy:
      metaTitle: Politika privatnosti — Details
      metaDescription: Koje podatke prikuplja sajt studija detailing Details, zašto i koliko dugo ih čuva.
      heading: Politika privatnosti
      lastUpdated: Ažurirano 12. septembra 2026
      sections:
        - title: Koje podatke prikupljamo
          text: Samo ono što vi sami unesete u obrazac zahteva — ime, kontakt, i komentar — kao i adresu stranice s koje je zahtev poslat, i anonimni identifikator pregledača. Ovaj identifikator je slučajan, čuva se u vašem pregledaču i služi samo da ne bismo napravili tri kartice za isti zahtev.
        - title: Zašto su nam ti podaci
          text: Da bismo se povezali s vama po zahtevu i vodili evidenciju o kontaktima. Ne koristimo ih za slanje obaveštenja i ne prenosimo trećim stranama u reklamne svrhe.
        - title: Gde se čuvaju
          text: Zahtevi se čuvaju u enkriptovanoj bazi našeg hosting provajdera i dupliraju se u naš unutrašnji radni chat. Pristup imaju samo zaposleni u studiju.
        - title: Koliko dugo ih čuvamo
          text: Do dve godine od poslednjeg kontakta. Na vaš zahtev, uklonićemo ih ranije.
        - title: Kolačići
          text: Sajt koristi tehnički kolačić s odabranim jezikom interfejsa i analitičke (Google Analytics i Yandex.Metrica). Analitika se pokreće pri prvom učitavanju stranice; u banneru na dnu ekrana možete se odjaviti, a tada se pri sledećem učitavanju ne uključuje. Yandex.Metrica bilježi sesije (pokret kursora, pomeranje i klikove). Formu zahteva smo isključili iz snimanja, njen sadržaj ne ulazi tamo. Reklamnih kolačića koji prate vas na drugim sajtovima ovde nema. Ako ste došli putem reklame i niste se odjavili od analitike, sajt pamti to — izvor i kampanju — 30 dana, da bismo znali koja reklama dovodi do zahteva.
        - title: Vaša prava
          text: Možete zatražiti kopiju svojih podataka, njihovo ispravljanje ili brisanje. Dovoljno je da nam se javite u bilo kom messenger-u ili pozovete.
      contactTitle: Pitanja o podacima
      contactBefore: Pišite ili pozovite nas, kontakti su na stranici
