    privacy:
      metaTitle: Politika privatnosti | Details
      metaDescription: Koje podatke prikuplja sajt detailing studija Details, zašto ih prikuplja i koliko dugo ih čuva.
      heading: Politika privatnosti
      lastUpdated: Ažurirano 12. novembra 2026.
      sections:
        - title: Koje podatke prikupljamo
          text: Samo podatke koje sami unesete u obrazac za upit (ime, kontakt i komentar), kao i adresu stranice sa koje je upit poslat i anonimni identifikator pregledača. Identifikator se nasumično generiše, čuva u vašem pregledaču i služi samo da ne bismo otvorili tri kartice za isti upit.
        - title: Zašto nam trebaju ovi podaci
          text: Da bismo vam odgovorili na upit i vodili evidenciju o komunikaciji. Ne koristimo ih za slanje reklamnih poruka i ne prosleđujemo ih trećim licima u marketinške svrhe.
        - title: Gde se čuvaju
          text: Upiti se čuvaju u šifrovanom prostoru našeg hosting provajdera i kopiraju u naš interni poslovni čet. Pristup imaju samo zaposleni u studiju.
        - title: Koliko dugo ih čuvamo
          text: Do dve godine od poslednjeg kontakta. Na vaš zahtev možemo ih obrisati i ranije.
        - title: Kolačići
          text: Sajt koristi tehnički kolačić za izabrani jezik interfejsa i analitičke alate (Google Analytics i Yandex Metrica). Analitika se pokreće pri prvom učitavanju stranice. Možete je odbiti u baneru na dnu ekrana, nakon čega se neće pokretati pri sledećem učitavanju. Yandex Metrica beleži sesije (kretanje kursora, pomeranje stranice i klikove). Obrazac za upit je izuzet iz snimanja, tako da se njegov sadržaj ne beleži. Sajt ne koristi reklamne kolačiće koji vas prate na drugim sajtovima. Ako ste došli preko oglasa i niste odbili analitiku, sajt 30 dana pamti izvor i kampanju kako bismo videli koji oglasi donose upite. Anonimni identifikator pregledača čuva se u memoriji pregledača i u našem kolačiću visitor_id. Ako odbijete analitiku u baneru, identifikator i kolačić se brišu.
        - title: Vaša prava
          text: Možete da zatražite kopiju svojih podataka, njihovu ispravku ili brisanje. Dovoljno je da nam pišete putem bilo kog mesindžera ili da nas pozovete.
      contactTitle: Pitanja o podacima
      contactBefore: Pišite nam ili nas pozovite. Kontakt podatke možete pronaći na stranici
