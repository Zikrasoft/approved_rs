      metaDescription: Hvala na zahtevu. Javićemo se u radno vreme i dogovoriti pregled.
      eyebrow: Gotovo
      heading: Zahtev je kod nas
      body: Javićemo vam se u radno vreme — obično u roku od sat vremena. Ako je pitanje hitno, pišite u messenger, tu brže odgovaramo.
