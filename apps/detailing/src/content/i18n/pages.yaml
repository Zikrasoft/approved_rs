    privacy:
      metaTitle: Privacy Policy — Details
      metaDescription: What data the Details detailing studio website collects, why, and how long it is stored.
      heading: Privacy Policy
      lastUpdated: Updated September 12, 2026
      sections:
        - title: What Data We Collect
          text: Only what you enter in the application form — name, contact details, and comments — as well as the address of the page from which the application was submitted and an anonymous browser identifier. This identifier is random, stored in your browser, and is solely for ensuring we don’t create multiple entries for the same request.
        - title: Why We Need This Data
          text: To contact you regarding your application and maintain a record of communications. We do not use it for newsletters and do not share it with third parties for advertising purposes.
        - title: Where It Is Stored
          text: Applications are stored in an encrypted repository of our hosting provider and are duplicated in our internal work chat. Access is restricted to our studio staff.
        - title: How Long We Store It
          text: Up to two years from the last contact. We will delete it sooner upon your request.
        - title: Cookies
          text: The website uses a technical cookie for the selected interface language and analytics (Google Analytics and Yandex.Metrica). Analytics starts upon the first page load; you can decline via the banner at the bottom of the screen, and it will be disabled for the next load. Yandex.Metrica records sessions (mouse movements, scrolling, and clicks). The application form is excluded from the recording; its content is not captured. There are no advertising cookies that track you on other sites. If you came via an ad and did not decline analytics, the site retains this information — the source and campaign — for 30 days, so we can see which ads generate applications.
        - title: Your Rights
          text: You can request a copy of your data, its correction, or deletion. It's enough to message us on any messenger or call.
      contactTitle: Questions About Data
      contactBefore: Message or call us; contact information is available on the page.
