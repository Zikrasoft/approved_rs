      sitemapHeading: What's on the site
      worksCountLabel: Projects in our portfolio
      servicesCountLabel: Services listed
      contentHeading: Where our content comes from
      contentText: Every project on the site is photographed in our studio after the work is complete. We don't use stock photos. Our team writes the copy in Russian, and it is automatically translated into Serbian and English.
