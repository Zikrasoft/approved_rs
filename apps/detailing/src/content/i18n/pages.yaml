    privacy:
      metaTitle: Privacy Policy — Details
      metaDescription: What data the Details detailing studio website collects, why and how long it’s stored.
      heading: Privacy Policy
      lastUpdated: Last Updated September 12, 2026
      sections:
        - title: What Data We Collect
          text: Only what you enter in the application form — name, contact, and comments — as well as the page address from which the application was sent, and an anonymous browser identifier. This identifier is random, stored in your browser, and needed only to prevent multiple cards for the same request.
        - title: Why We Need This Data
          text: To contact you regarding your application and maintain a history of inquiries. We do not use it for newsletters or share it with third parties for advertising.
        - title: Where It’s Stored
          text: Applications are stored in an encrypted repository by our hosting provider and are duplicated in our internal work chat. Access is limited to studio staff.
        - title: How Long We Keep It
          text: Up to two years from the last contact. We will delete it earlier at your request.
        - title: Cookies
          text: The site uses a technical cookie for the selected interface language and an analytical one — Google Analytics. The analytics start when the page is first loaded; you can decline in the banner at the bottom of the screen, and then it won't activate on your next visit. There are no advertising cookies that track you on other sites. If you arrived via an ad and did not opt out of analytics, the site remembers this — the source and campaign — for 30 days, so we can see which ads generate requests.
        - title: Your Rights
          text: You can request a copy of your data, corrections, or deletion. Just message us on any of the messengers or call.
      contactTitle: Data Questions
      contactBefore: Write or call us, contact details are on the page.
