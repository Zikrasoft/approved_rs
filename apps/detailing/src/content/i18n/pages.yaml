    privacy:
      metaTitle: Privacy Policy — Details
      metaDescription: What data the Details detailing studio collects, why, and how long it is retained.
      heading: Privacy Policy
      lastUpdated: Updated September 12, 2026
      sections:
        - title: What Data We Collect
          text: Only what you enter in the application form — name, contact, and comments — as well as the page address from which the application was submitted, and an anonymous browser identifier. This identifier is random, stored in your browser, and is only needed to avoid creating multiple cards for the same request.
        - title: Why We Need This Data
          text: To contact you regarding your application and maintain a history of inquiries. We do not use it for newsletters and do not share it with third parties for advertising purposes.
        - title: Where It Is Stored
          text: Applications are stored in encrypted storage with our hosting provider and are duplicated in our internal chat. Only studio employees have access.
        - title: How Long We Keep It
          text: Up to two years from the last contact. We can delete it sooner upon your request.
        - title: Cookies
          text: The site uses a technical cookie for the selected interface language and an analytical one — Yandex.Metrica. Analytics starts on the first page load; you can opt-out in the banner at the bottom of the screen, and then it will not activate on subsequent loads. Metrica records sessions — cursor movement, scrolling, and clicks — but we have excluded the application form from the records. There are no advertising cookies that track you across other sites. If you came through an ad and did not decline analytics, the site remembers this — source and campaign — for 30 days, so we can see which ads generate applications.
        - title: Your Rights
          text: You can request a copy of your data, its correction, or deletion. Just write to us via any messaging app or call.
      contactTitle: Questions About Data
      contactBefore: Write or call us, contact details are on the page
