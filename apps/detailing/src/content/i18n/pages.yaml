      metaDescription: Address, working hours, and phone number for the Details car detailing studio in Belgrade. Schedule an inspection by phone, WhatsApp, Viber, or Telegram.
      eyebrow: Contacts
      heading: Come and check out the box
      lead: 'We don’t sell over the phone. The best way is to stop by for fifteen minutes: we’ll look at the car together and discuss what it really needs.'
      addressLabel: Address
