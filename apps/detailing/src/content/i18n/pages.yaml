      metaTitle: Politika privatnosti — Details
      metaDescription: Koje podatke prikuplja sajt studija detaljinga Details, zašto i koliko dugo ih čuva.
      heading: Politika privatnosti
      lastUpdated: Ažurirano 12. septembra 2026
      sections:
        - title: Koje podatke prikupljamo
          text: Samo ono što sami upisujete u obrazac prijave — ime, kontakt i komentar, kao i adresu stranice sa koje je prijava poslana i anonimni identifikator pregledača. Ovaj identifikator je slučajan, čuva se u vašem pregledaču i koristi se samo da bismo izbegli pravljenje tri kartice za isti zahtev.
        - title: Zašto su nam ti podaci
          text: Da bismo se povezali s vama povodom prijave i vodili istoriju kontaktiranja. Ne koristimo ih za slanje obaveštenja i ne prenosimo ih trećim stranama u reklamne svrhe.
        - title: Gde se čuvaju
          text: Prijave se čuvaju u enkriptiovanoj bazi podataka našeg hosting provajdera i dupliraju se u naš interno radni chat. Pristup imaju samo zaposleni studija.
        - title: Koliko dugo ih čuvamo
          text: Do dve godine od poslednjeg kontakta. Na vaš zahtev možemo obrisati ranije.
        - title: Kolačići
          text: Sajt koristi tehnički kolačić sa odabranim jezikom interfejsa i analitički — Google Analytics. Analitika se pokreće pri prvom učitavanju stranice; u baneru na dnu ekrana možete da se odjavite, i tada se pri sledećem učitavanju više ne pokreće. Ovdje nema reklamnih kolačića koji prate vas na drugim sajtovima. Ako ste došli preko reklame i niste se odjavili od analitike, sajt pamti to — izvor i kampanju — na 30 dana, kako bismo videli koja reklama donosi prijave.
        - title: Vaša prava
          text: Možete zatražiti kopiju svojih podataka, njihovo ispravljenje ili brisanje. Dovoljno je da nam pišete u bilo kojem od mesendžera ili da pozovete.
      contactTitle: Pitanja o podacima
      contactBefore: Pišite ili pozovite nas, kontakti su na stranici
