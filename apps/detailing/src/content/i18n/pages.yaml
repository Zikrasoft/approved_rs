  lead: Никаких стоковых кадров. Каждая карточка — автомобиль, который стоял у нас в боксе, снятый после работы.
  filterAll: Все
  detailMetaSuffix: Details
  detailCtaHeading: Хотите так же?
  detailCtaBody: Приезжайте на осмотр или пришлите фото своей машины — посчитаем и назовём срок.
  doorHeading: Нравится результат?
  doorText: Пришлите фото своей машины — посчитаем стоимость и срок.
  doorButtonLabel: Рассчитать стоимость
contact:
