privacy:
  metaTitle: Политика конфиденциальности | Details
  metaDescription: Какие данные собирает сайт студии детейлинга Details, зачем и как долго они хранятся.
  heading: Политика конфиденциальности
  lastUpdated: Обновлено 12 ноября 2026
  sections:
    - title: 'Какие данные мы собираем'
      text: Только то, что вы сами вводите в форму заявки (имя, контакт и комментарий), а также адрес страницы, с которой заявка отправлена, и анонимный идентификатор браузера. Этот идентификатор случайный, хранится в вашем браузере и нужен лишь для того, чтобы мы не завели три карточки на один и тот же запрос.
    - title: 'Зачем нам эти данные'
      text: Чтобы связаться с вами по заявке и вести историю обращения. Мы не используем их для рассылок и не передаем третьим лицам в рекламных целях.
    - title: 'Где они хранятся'
      text: Заявки хранятся в зашифрованном хранилище нашего хостинг-провайдера и дублируются в наш внутренний рабочий чат. Доступ есть только у сотрудников студии.
    - title: 'Сколько мы их храним'
      text: До двух лет с момента последнего контакта. По вашему запросу удалим раньше.
    - title: 'Куки'
      text: Сайт использует техническую куку с выбранным языком интерфейса и аналитические (Google Analytics и Яндекс.Метрику). Аналитика запускается при первой загрузке страницы; отказаться можно по ссылке «Настройки cookie» внизу сайта, и тогда со следующей загрузки она не включается. Яндекс.Метрика записывает сессии (движение курсора, прокрутку и клики). Форму заявки мы из записи исключили, ее содержимое туда не попадает. Рекламных кук, которые следят за вами на других сайтах, здесь нет. Если вы пришли по рекламе и не отказались от аналитики, сайт запоминает это (источник и кампанию) на 30 дней, чтобы мы видели, какая реклама приводит заявки. Анонимный идентификатор браузера хранится в памяти браузера и в нашей собственной куке visitor_id. Если отказаться, идентификатор и кука удаляются.
    - title: 'Ваши права'
      text: Вы можете запросить копию своих данных, их исправление или удаление. Достаточно написать нам в любой из мессенджеров или позвонить.
  contactTitle: Вопросы по данным
  contactBefore: Напишите или позвоните нам, контакты есть на странице
