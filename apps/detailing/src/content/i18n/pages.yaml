works:
  metaTitle: Работы студии детейлинга в Белграде — Details
  metaDescription: 'Машины, которые прошли через наш бокс на Звездаре: оклейка защитной плёнкой PPF, бронирование фар, полная оклейка кузова. Свои фото по каждой работе.'
  eyebrow: Работы
  heading: Машины, которые прошли через наш бокс
  lead: Никаких стоковых кадров. Каждая карточка — автомобиль, который стоял у нас в боксе, снятый после работы.
  filterAll: Все
  detailMetaSuffix: Details
  detailCtaHeading: Хотите так же?
  detailCtaBody: Приезжайте на осмотр или пришлите фото своей машины — посчитаем и назовём срок.
contact:
  metaTitle: Контакты студии детейлинга в Белграде — Details
  metaDescription: Адрес, часы работы и телефон студии детейлинга Details в Белграде. Запись на осмотр по телефону, в WhatsApp, Viber или Telegram.
  eyebrow: Контакты
  heading: Приезжайте посмотреть бокс
  lead: 'Мы не продаём по телефону. Лучший способ — заехать на пятнадцать минут: посмотрим машину вместе и скажем, что ей действительно нужно.'
  addressLabel: Адрес
  hoursLabel: Часы работы
  phoneLabel: Телефон
  mapHeading: Как нас найти
  mapNote: Заезд со двора, ворота с вывеской. Парковка перед боксом.
  arrivalHeading: Перед приездом
  arrival:
    - Машину мыть не нужно — мы всё равно моем сами перед работой.
    - 'Если есть время, приезжайте днём: лак честнее видно при дневном свете.'
    - Возьмите с собой ключи от всех замков, включая секретки на колёсах.
thanks:
  metaTitle: Заявка отправлена — Details
  metaDescription: Спасибо за заявку. Мы свяжемся в рабочее время и договоримся об осмотре.
  eyebrow: Готово
  heading: Заявка у нас
  body: Мы свяжемся с вами в рабочее время — обычно в течение часа. Если вопрос срочный, напишите в мессенджер, там отвечаем быстрее.
  note: Если ответа нет дольше рабочего дня, значит сообщение потерялось. Напишите ещё раз, мы не обидимся.
  cta: Вернуться на главную
privacy:
  metaTitle: Политика конфиденциальности — Details
  metaDescription: Какие данные собирает сайт студии детейлинга Details, зачем и как долго они хранятся.
  heading: Политика конфиденциальности
  lastUpdated: Обновлено 12 сентября 2026
  sections:
    - title: 'Какие данные мы собираем'
      text: Только то, что вы сами вводите в форму заявки — имя, контакт и комментарий, — а также адрес страницы, с которой заявка отправлена, и анонимный идентификатор браузера. Этот идентификатор случайный, хранится в вашем браузере и нужен лишь для того, чтобы мы не завели три карточки на один и тот же запрос.
    - title: 'Зачем нам эти данные'
      text: Чтобы связаться с вами по заявке и вести историю обращения. Мы не используем их для рассылок и не передаём третьим лицам в рекламных целях.
    - title: 'Где они хранятся'
      text: Заявки хранятся в зашифрованном хранилище нашего хостинг-провайдера и дублируются в наш внутренний рабочий чат. Доступ есть только у сотрудников студии.
    - title: 'Сколько мы их храним'
      text: До двух лет с момента последнего контакта. По вашему запросу удалим раньше.
    - title: 'Куки'
      text: Сайт использует техническую куку с выбранным языком интерфейса и аналитическую — Яндекс.Метрику. Аналитика запускается при первой загрузке страницы; в баннере внизу экрана можно отказаться, и тогда со следующей загрузки она не включается. Метрика записывает сессии — движение курсора, прокрутку и клики, — но форму заявки из записи мы исключили. Рекламных кук, которые следят за вами на других сайтах, здесь нет.
    - title: 'Ваши права'
      text: Вы можете запросить копию своих данных, их исправление или удаление. Достаточно написать нам в любой из мессенджеров или позвонить.
  contactTitle: Вопросы по данным
  contactBefore: Напишите или позвоните нам, контакты есть на странице
