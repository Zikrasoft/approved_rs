    contact:
      metaTitle: Kontakti detailing studija u Beogradu — Details
      metaDescription: Adresa, radno vreme i telefon detailing studija Details u Beogradu. Zakazivanje pregleda putem telefona, WhatsApp-a, Vibera ili Telegrama.
      eyebrow: Kontakti
      heading: Dođite da pogledate boks
      lead: 'Ne prodajemo preko telefona. Najbolji način je da se zadržite petnaest minuta: zajedno ćemo pogledati automobil i reći šta mu zaista treba.'
      addressLabel: Adresa
      hoursLabel: Radno vreme
