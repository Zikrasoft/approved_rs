  sr:
    works:
      metaTitle: Radovi detailing studija u Beogradu — Details
      metaDescription: 'Automobili koji su prošli kroz naš boks na Zvezdari: PPF obloge, zaštita farova, kompletna obloga karoserije. Vaše fotografije za svaki rad.'
      eyebrow: Radovi
