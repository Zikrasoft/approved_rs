    thanks:
      metaTitle: Application Submitted — Details
      metaDescription: Thank you for your application. We'll get back to you during business hours to arrange an inspection.
      eyebrow: Done
      heading: We Received Your Application
      body: We will contact you during business hours — usually within an hour. If it’s urgent, please message us; we respond faster there.
      note: If there’s no response by the end of the business day, your message might have been lost. Please write again; we won’t be offended.
      cta: Return to Home
    privacy:
      metaTitle: Privacy Policy — Details
      metaDescription: The data collected by the Details car detailing website, why it's needed, and how long it's stored.
      heading: Privacy Policy
      lastUpdated: Updated September 12, 2026
      sections:
        - title: What Data We Collect
          text: Only what you enter in the application form — name, contact information, and comments — as well as the URL of the page from which the application was submitted and an anonymous browser identifier. This identifier is random, stored in your browser, and needed just so we don't create three cards for the same request.
        - title: Why We Need This Data
          text: To contact you regarding your application and keep a record of your inquiries. We do not use it for mailing lists and do not share it with third parties for advertising purposes.
        - title: Where It’s Stored
          text: Applications are stored in encrypted storage provided by our hosting provider and are duplicated in our internal work chat. Only studio staff have access.
        - title: How Long We Keep It
          text: Up to two years from the last contact. We will delete it sooner upon your request.
        - title: Cookies
          text: The site uses one technical cookie — the selected interface language. There are no advertising or analytical cookies tracking you on other sites.
        - title: Your Rights
          text: You can request a copy of your data, have it corrected, or deleted. Just write to us through any messaging platform or call us.
      contactTitle: Questions About Your Data
      contactBefore: Write or call us; contact details are on the page.
