    privacy:
      metaTitle: Privacy Policy — Details
      metaDescription: What data the Details detailing studio website collects, why, and how long it is stored.
      heading: Privacy Policy
      lastUpdated: Updated September 12, 2026
      sections:
        - title: What Data We Collect
          text: Only what you personally enter in the application form — your name, contact, and comments — as well as the address of the page from which the application was submitted and an anonymous browser identifier. This identifier is random, stored in your browser, and only exists so we don't create multiple entries for the same request.
        - title: Why We Need This Data
          text: To contact you regarding your application and maintain a history of inquiries. We do not use it for newsletters and do not share it with third parties for advertising purposes.
        - title: Where It Is Stored
          text: Applications are stored in an encrypted vault by our hosting provider and are duplicated in our internal work chat. Access is limited to studio staff only.
        - title: How Long We Keep It
          text: Up to two years from the last contact. We can delete it earlier upon your request.
        - title: Cookies
          text: The site uses a technical cookie for the selected interface language and analytical cookies (Google Analytics and Yandex.Metrics). Analytics is activated on first page load; you can decline it via the banner at the bottom of the screen, and it won’t be activated on your next visit. Yandex.Metrics records sessions (mouse movement, scrolling, and clicks). The application form is excluded from recording, its content is not captured. There are no advertising cookies that track you on other websites. If you arrived through an ad and did not decline analytics, the site remembers your source and campaign for 30 days to help us see which ads generate applications.
        - title: Your Rights
          text: You can request a copy of your data, its correction, or deletion. Just message us through any of the messengers or give us a call.
      contactTitle: Data Questions
      contactBefore: Message or call us, contact details are available on the page
