        - Ponesite ključeve od svih brave, uključujući i brave na točkovima.
    thanks:
      metaTitle: Zahtev poslat — Details
      metaDescription: Hvala na zahtevu. Javićemo se tokom radnog vremena i dogovoriti pregled.
      eyebrow: Gotovo
      heading: Zahtev je kod nas
      body: Javićemo se u radno vreme — obično u roku od sata. Ako je pitanje hitno, pišite u messenger, tamo brže odgovaramo.
      note: Ako nema odgovora duže od radnog dana, obavestite nas ponovo, poruka se možda izgubila. Nećemo se uvrediti.
      cta: Vrati se na početnu
    privacy:
      metaTitle: Politika privatnosti — Details
      metaDescription: Koje podatke prikuplja sajt detailing studija Details, zašto i koliko dugo se čuvaju.
      heading: Politika privatnosti
      lastUpdated: Ažurirano 12. septembra 2026
      sections:
        - title: Koje podatke prikupljamo
          text: Samo ono što sami upisujete u obrazac zahteva — ime, kontakt i komentar — kao i adresu stranice sa koje je zahtev poslat, i anonimni identifikator pregledača. Ovaj identifikator je slučajan, čuva se u vašem pregledaču i potreban je samo da ne bismo imali tri kartice za isti zahtev.
        - title: Zašto nam ti podaci
          text: Da bismo se kontaktirali u vezi sa zahtevom i vodili istoriju obraćanja. Ne koristimo ih za slanje obaveštenja i ne prenosimo trećim stranama u marketinške svrhe.
        - title: Gde se čuvaju
          text: Zahtevi se čuvaju u enkriptovanoj bazi našeg hosting provajdera i dupliraju se u našu internu radnu chat grupu. Pristup imaju samo zaposleni studija.
        - title: Koliko ih čuvamo
          text: Do dve godine od poslednjeg kontakta. Na vaš zahtev možemo ih obrisati ranije.
        - title: Kolačići
          text: Sajt koristi tehnički kolačić sa izabranim jezikom interfejsa i analitički — Yandex.Metrika. Analitika se aktivira prilikom prvog učitavanja stranice; u baneru na dnu ekrana možete odbiti, a onda se prilikom sledećeg učitavanja ne uključuje. Metrika beleži sesije — kretanje kursora, skrolovanje i klikove — ali je forma zahteva isključena iz zapisa. Ovdje nema marketinških kolačića koji vas prate na drugim sajtovima.
        - title: Vaša prava
          text: Možete zatražiti kopiju svojih podataka, njihovo ispravljanje ili brisanje. Dovoljno je da nas kontaktirate u bilo kojem messenger-u ili pozovete.
      contactTitle: Pitanja u vezi podataka
      contactBefore: Pišite ili nazovite nas, kontakti su na stranici
    notFound:
      metaTitle: Stranica nije pronađena — Details
      heading: Ova stranica ne postoji
      body: Možda je link zastareo ili je došlo do greške u adresi. Posetite glavnu ili pogledajte radove.
      cta: Na glavnu
