      heading: Svratite da pogledate radionicu
      lead: 'Ne prodajemo usluge preko telefona. Najbolje je da svratite na petnaestak minuta: zajedno ćemo pogledati automobil i reći vam šta mu je zaista potrebno.'
      addressLabel: Adresa
