      metaTitle: Politika privatnosti — Details
      metaDescription: Koje podatke prikuplja sajt detailing studija Details, zašto i kako dugo ih čuva.
      heading: Politika privatnosti
      lastUpdated: Ažurirano 12. septembra 2026
      sections:
        - title: Koje podatke prikupljamo
          text: Samo ono što sami unosite u obrazac — ime, kontakt i komentar, kao i adresu stranice sa koje je zahtev poslat, i anonimni identifikator pretraživača. Ovaj identifikator je nasumičan, čuva se u vašem pretraživaču i potreban je samo kako ne bismo kreirali tri kartice za isti zahtev.
        - title: Zašto su nam ti podaci
          text: Da bismo se povezali s vama u vezi zahteva i vodili istoriju komunikacije. Ne koristimo ih za slanje i ne predajemo trećim stranama u reklamne svrhe.
        - title: Gde se čuvaju
          text: Zahtevi se čuvaju u enkriptovanoj bazi podataka našeg hosting provajdera i dupliraju se u naš intern chat. Pristup imaju samo zaposleni studija.
        - title: Koliko ih čuvamo
          text: Do dve godine od poslednjeg kontakta. Na vaš zahtev ćemo ih obrisati ranije.
        - title: Kolačići
          text: Sajt koristi tehnički kolačić sa izabranim jezikom sučelja i analitičke (Google Analytics i Yandex.Metrica). Analitika se pokreće prilikom prvog učitavanja stranice; u banneru na dnu ekrana možete se odjaviti, a tada se pri sledećem učitavanju ne uključuje. Yandex.Metrica snima sesije (pokret kursora, scroll i klikove). Obrazac zahteva smo iz snimka isključili, njegov sadržaj ne ulazi u to. Ovdje nema reklamnih kolačića koji vas prate na drugim sajtovima. Ako ste došli preko reklame i niste se odjavili od analitike, sajt pamti to — izvor i kampanju — na 30 dana, tako da vidimo koja reklama donosi zahteve.
        - title: Vaša prava
          text: Možete zatražiti kopiju svojih podataka, njihovo ispravljanje ili brisanje. Dovoljno je da nam napišete u bilo kojem od messengera ili pozovete.
      contactTitle: Pitanja o podacima
      contactBefore: Napišite ili nazovite nas, kontakti su na stranici
