    thanks:
      metaTitle: Request Submitted — Details
      metaDescription: Thank you for your request. We will get in touch during working hours to arrange an inspection.
      eyebrow: Done
      heading: We have your request
      body: We will contact you during working hours — usually within an hour. If it's urgent, message us directly; we respond faster there.
      note: If you haven't received a reply by the end of the working day, the message may have been lost. Please write to us again, we won’t mind.
      cta: Return to Home
    privacy:
      metaTitle: Privacy Policy — Details
      metaDescription: What data is collected by the Details detailing studio website, why it is collected, and how long it is stored.
      heading: Privacy Policy
      lastUpdated: Updated September 12, 2026
      sections:
        - title: What Data We Collect
          text: Only what you enter in the request form — name, contact information, and comments — as well as the page address from which the request was sent, and an anonymous browser identifier. This identifier is random, stored in your browser, and is only needed so we don’t create three cards for the same request.
        - title: Why We Need This Data
          text: To contact you regarding your request and maintain a record of inquiries. We do not use it for newsletters and do not share it with third parties for advertising purposes.
        - title: Where It Is Stored
          text: Requests are stored in an encrypted repository of our hosting provider and duplicated in our internal work chat. Access is granted only to studio staff.
        - title: How Long We Store It
          text: Up to two years from the last contact. We can remove it earlier at your request.
        - title: Cookies
          text: The site uses one technical cookie — the selected interface language. There are no advertising or analytical cookies that track you on other sites.
        - title: Your Rights
          text: You can request a copy of your data, its correction or deletion. Just message us on any of the messengers or call.
      contactTitle: Questions About Data
      contactBefore: Write or call us, contact information is available on the page.
