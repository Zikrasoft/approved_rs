works:
  metaTitle: Работы студии детейлинга в Белграде — Details
  metaDescription: 'Машины, которые прошли через наш бокс на Звездаре: оклейка защитной плёнкой PPF, бронирование фар, полная оклейка кузова. Свои фото по каждой работе.'
