    privacy:
      metaTitle: Politika privatnosti — Details
      metaDescription: Koje podatke prikuplja sajt studija detaljinga Details, zašto i koliko dugo ih čuva.
      heading: Politika privatnosti
      lastUpdated: Ažurirano 12. septembra 2026
      sections:
        - title: Koje podatke prikupljamo
          text: Samo ono što vi sami unesete u obrazac zahteva — ime, kontakt i komentar — kao i adresa stranice sa koje je zahtev poslat i anonimni identifikator pretraživača. Ovaj identifikator je nasumičan, čuva se u vašem pretraživaču i potreban je samo kako bismo izbegli da stvorimo tri kartice za isti zahtev.
        - title: Zašto su nam ti podaci
          text: Da bismo kontaktirali vas povodom zahteva i vodili istoriju komunikacije. Ne koristimo ih za slanje promotivnih materijala i ne prenosimo trećim licima u marketinške svrhe.
        - title: Gde se čuvaju
          text: Zahtevi se čuvaju u enkriptovanoj bazi podataka našeg hosting provajdera i dupliraju se u naš interni radni čat. Pristup imaju samo zaposleni studija.
        - title: Koliko dugo ih čuvamo
          text: Do dve godine od poslednjeg kontakta. Na vaš zahtev možemo ih ukloniti ranije.
        - title: Kolačići
          text: Sajt koristi tehnički kolačić za odabrani jezik interfejsa i analitički — Yandex.Metrika. Analitika se pokreće prilikom prvog učitavanja stranice; u baneru na dnu ekrana možete se odjaviti, i tada se pri sledećem učitavanju ne uključuje. Metrika beleži sesije — kretanje kursora, skrolovanje i klikove — ali obrazac zahteva nije uključen u zabeleženo. Ovde nema reklamnih kolačića koji vas prate na drugim sajtovima. Ako ste došli preko reklame i niste se odjavili od analitike, sajt pamti to — izvor i kampanju — 30 dana, kako bismo znali koja reklama donosi zahteve.
        - title: Vaša prava
          text: Možete zatražiti kopiju svojih podataka, njihovo ispravljenje ili brisanje. Dovoljno je da nam pišete u bilo kojem od messengera ili pozovete.
      contactTitle: Pitanja o podacima
      contactBefore: Pišite ili zovite nas, kontakti su dostupni na stranici
