translations:
  sr:
    works:
      metaTitle: Radovi detailing studija u Beogradu — Details
      metaDescription: 'Automobili koji su prošli kroz naš boks na Zvezdari: zaštita farova folijom PPF, full wrap, mašinsko poliranje sa keramičkom zaštitom. Fotografije svake naše usluge.'
      eyebrow: Radovi
      heading: Automobili u našem boksu
      lead: Bez stock fotografija. Svaka kartica predstavlja automobil koji je bio kod nas i snimljen nakon obavljenog posla.
      filterAll: Sve
      detailMetaSuffix: Details
      detailCtaHeading: Želite takođe?
      detailCtaBody: Dođite na pregled ili pošalite fotografije svog automobila — izračunaćemo cenu i rok.
    contact:
      metaTitle: Kontakti detailing studija u Beogradu — Details
      metaDescription: Adresa, radno vreme i telefon studija detailing Details u Beogradu. Zakazivanje pregleda putem telefona, WhatsApp-a, Vibera ili Telegram-a.
      eyebrow: Kontakti
      heading: Posetite nas da pogledate boks
      lead: 'Ne prodajemo telefonom. Najbolji način je da svratite na petnaest minuta: pogledamo automobil zajedno i kažemo šta mu je zaista potrebno.'
      addressLabel: Adresa
      hoursLabel: Radno vreme
      phoneLabel: Telefon
      mapHeading: Kako nas pronaći
      mapNote: Ulaz iz dvorišta, kapija sa natpisom. Parking ispred boksa.
      arrivalHeading: Pre dolaska
      arrival:
        - Ne morate da perete automobil — mi to radimo sami pre rada.
        - 'Ako imate vremena, dođite tokom dana: lak se bolje vidi na dnevnom svetlu.'
        - Ponesite ključeve od svih bravica, uključujući i sigurnosne matice na točkovima.
    thanks:
      metaTitle: Zahtev poslat — Details
      metaDescription: Hvala na zahtevu. Javićemo se u radno vreme i dogovoriti se za pregled.
      eyebrow: Gotovo
      heading: Zahtev je kod nas
      body: Javićemo se u radno vreme — obično u roku od sat vremena. Ako imate hitno pitanje, pišite na menteri, tu brže odgovaramo.
      note: Ako nema odgovora duže od radnog dana, verovatno je poruka izgubljena. Pišite ponovo, nećemo se naljutiti.
      cta: Vrati se na početnu
    privacy:
      metaTitle: Politika privatnosti — Details
      metaDescription: Koje podatke prikuplja sajt studija detailing Details, zašto i koliko dugo ih čuva.
      heading: Politika privatnosti
      lastUpdated: Ažurirano 12. septembra 2026.
      sections:
        - title: Koje podatke prikupljamo
          text: Samo ono što sami unesete u formu zahteva — ime, kontakt i komentar, kao i adresu stranice sa koje je zahtev poslat, i anonimni identifikator pretraživača. Ovaj identifikator je slučajan, čuva se u vašem pretraživaču i potreban je samo da ne otvorimo tri kartice za isti zahtev.
        - title: Zašto su nam ti podaci
          text: Da bismo se povezali sa vama povodom zahteva i vodili evidenciju o kontaktima. Ne koristimo ih za slanje obaveštenja i ne delimo ih trećim licima u marketinške svrhe.
        - title: Gde se čuvaju
          text: Zahtevi se čuvaju u enkriptovanoj arhivi našeg hosting provajdera i dupliraju se u naš unutrašnji radni chat. Pristup imaju samo zaposleni studija.
        - title: Koliko ih čuvamo
          text: Do dve godine od poslednjeg kontakta. Na vaš zahtev možemo ih obrisati ranije.
        - title: Kolačići
          text: Sajt koristi jedan tehnički kolačić — izabrani jezik interfejsa. Ovde nema reklamnih i analitičkih kolačića koji vas prate na drugim sajtovima.
        - title: Vaša prava
          text: Možete zatražiti kopiju svojih podataka, njihovo ispravljenje ili brisanje. Dovoljno je da nam se obratite u bilo kojem od menteri ili da pozovete.
      contactTitle: Pitanja o podacima
      contactBefore: Pišite ili pozovite nas, kontakti su na stranici
    notFound:
      metaTitle: Stranica nije pronađena — Details
      heading: Ova stranica ne postoji
      body: Možda je veza zastarela ili je u adresi greška. Pogledajte na početnu ili proverite radove.
      cta: Na početnu
