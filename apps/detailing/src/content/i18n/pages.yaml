    privacy:
      metaTitle: Privacy Policy | Details
      metaDescription: What data the Details car detailing studio website collects, why we collect it and how long we keep it.
      heading: Privacy Policy
      lastUpdated: Updated November 12, 2026
      sections:
        - title: What data we collect
          text: Only the information you enter in the request form (name, contact details and comment), along with the page address the request was sent from and an anonymous browser identifier. The identifier is random, stored in your browser and used only to avoid creating multiple records for the same request.
        - title: Why we need this data
          text: To contact you about your request and keep a record of our communications. We don't use your data for marketing emails or share it with third parties for advertising purposes.
        - title: Where it's stored
          text: Requests are stored in encrypted storage with our hosting provider and copied to our internal work chat. Only studio staff have access.
        - title: How long we keep it
          text: For up to two years from our last contact. We'll delete it sooner if you ask.
        - title: Cookies
          text: The site uses a technical cookie to remember your selected language, as well as analytics tools (Google Analytics and Yandex Metrica). Analytics starts when the page first loads. You can opt out using the banner at the bottom of the screen; if you do, analytics won't run from your next page load. Yandex Metrica records sessions (cursor movement, scrolling and clicks). We've excluded the request form from these recordings, so its contents aren't captured. We don't use advertising cookies that track you across other sites. If you arrived through an ad and haven't opted out of analytics, the site remembers the source and campaign for 30 days so we can see which ads bring in requests. The anonymous browser identifier is stored in your browser's memory and in our own visitor_id cookie. If you opt out using the banner, the identifier and cookie are deleted.
        - title: Your rights
          text: You can request a copy of your data, ask us to correct it or ask us to delete it. Just message us on any of our messaging apps or give us a call.
