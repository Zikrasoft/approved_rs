    privacy:
      metaTitle: Privacy Policy | Details
      metaDescription: What data the Details car detailing studio website collects, why we collect it and how long we keep it.
      heading: Privacy policy
      lastUpdated: Updated 12 September 2026
      sections:
        - title: What data we collect
          text: Only what you enter in the enquiry form (your name, contact details and message), along with the address of the page you submitted it from and an anonymous browser identifier. This identifier is randomly generated, stored in your browser and used only to prevent us from creating duplicate records for the same enquiry.
        - title: Why we need this data
          text: To contact you about your enquiry and keep a record of our correspondence. We don't use it for mailing lists or share it with third parties for advertising purposes.
        - title: Where we store it
          text: Enquiries are kept in encrypted storage with our hosting provider, with a copy sent to our internal team chat. Only studio staff have access.
        - title: How long we keep it
          text: For up to two years after our last contact with you. We'll delete it sooner if you ask.
        - title: Cookies
          text: The site uses a functional cookie to remember your chosen language and analytics cookies (Google Analytics and Yandex Metrica). Analytics starts when you first load a page. You can opt out using the banner at the bottom of the screen, and analytics will stop running from the next page load. Yandex Metrica records sessions, including cursor movements, scrolling and clicks. We've excluded the enquiry form from these recordings, so its contents are not captured. We don't use advertising cookies that track you across other websites. If you arrive via an ad and haven't opted out of analytics, the site remembers the source and campaign for 30 days so we can see which ads generate enquiries.
        - title: Your rights
          text: You can request a copy of your data or ask us to correct or delete it. Simply contact us through any of our messaging apps or give us a call.
      contactTitle: Questions about your data
      contactBefore: Message or call us. You'll find our details on the page
    about:
