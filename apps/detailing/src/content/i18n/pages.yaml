  sr:
    works:
      metaTitle: Radovi detaliziranja automobila u Beogradu — Details
      metaDescription: 'Automobili koji su prošli kroz naš boks na Zvezdari: zaštitna folija PPF, zaštita farova, potpuno oblaganje karoserije. Svoje fotografije za svaki rad.'
      eyebrow: Radovi
      heading: Automobili koji su prošli kroz naš boks
      lead: Nema stock fotografija. Svaka kartica — automobil koji je bio kod nas u boksu, snimljen nakon rada.
      filterAll: Sve
      detailMetaSuffix: Details
      detailCtaHeading: Želite i vi tako?
      detailCtaBody: Dovedite automobil na pregled ili pošaljite fotografije vaše mašine — izračunaćemo i reći ćemo vam rok.
    contact:
      metaTitle: Kontakti studije detaliziranja u Beogradu — Details
      metaDescription: Adresa, radno vreme i telefon studije detaliziranja Details u Beogradu. Zakazivanje pregleda putem telefona, WhatsApp, Viber ili Telegrama.
      eyebrow: Kontakti
      heading: Dođite da pogledate boks
      lead: 'Ne prodajemo preko telefona. Najbolji način je da svratite na petnaest minuta: pogledajmo zajedno automobil i kažemo šta mu zaista treba.'
      addressLabel: Adresa
      hoursLabel: Radno vreme
      phoneLabel: Telefon
      mapHeading: Kako nas pronaći
      mapNote: Ulaz iz dvorišta, kapija sa natpisom. Parkiranje ispred boksa.
      arrivalHeading: Pre dolaska
      arrival:
        - Nema potrebe da perete automobil — mi ga već peremo pre rada.
        - 'Ako imate vremena, dođite tokom dana: lak se poštenije vidi na dnevnom svetlu.'
        - Ponesite ključeve od svih brava, uključujući i skrivene na točkovima.
    thanks:
      metaTitle: Zahtev je poslat — Details
      metaDescription: Hvala na zahtevu. Javićemo se u radno vreme i dogovoriti pregled.
      eyebrow: Gotovo
      heading: Zahtev kod nas
      body: Javićemo vam se u radno vreme — obično u roku od sat vremena. Ako je pitanje hitno, napišite u messenger, tamo odgovaramo brže.
      note: Ako nema odgovora duže od radnog dana, to znači da je poruka izgubljena. Napišite ponovo, nećemo se ljutiti.
      cta: Vratite se na početnu
    privacy:
      metaTitle: Politika privatnosti — Details
      metaDescription: Koje podatke sakuplja sajt studije detaliziranja Details, zašto i koliko dugo se čuvaju.
      heading: Politika privatnosti
      lastUpdated: Ažurirano 12. septembra 2026.
      sections:
        - title: Koje podatke sakupljamo
          text: Samo ono što vi sami unosite u obrazac zahteva — ime, kontakt i komentar — kao i adresu stranice s koje je zahtev poslat, i anonimni identifikator pretraživača. Ovaj identifikator je slučajan, čuva se u vašem pretraživaču i potreban je samo da ne bismo napravili tri kartice za jedan i isti zahtev.
        - title: Zašto su nam ti podaci
          text: Da bismo se povezali sa vama u vezi zahteva i vodili istoriju obraćanja. Ne koristimo ih za slanje reklama i ne prenosimo trećim licima u promotivne svrhe.
        - title: Gde se čuvaju
          text: Zahtevi se čuvaju u šifrovanom skladištu našeg hosting provajdera i dupliraju se u našem internom radnom čatu. Pristup imaju samo zaposleni studije.
        - title: Koliko ih čuvamo
          text: Do dve godine od poslednjeg kontakta. Na vaš zahtev ćemo ih obrisati ranije.
        - title: Kolačići
          text: Sajt koristi jedan tehnički kolačić — izabrani jezik interfejsa. Reklamnih i analitičkih kolačića koji prate vas na drugim sajtovima ovde nema.
        - title: Vaša prava
          text: Možete zatražiti kopiju svojih podataka, njihovo ispravljenje ili brisanje. Dovoljno je da nam pišete u bilo kojem messengeru ili pozovete.
      contactTitle: Pitanja o podacima
      contactBefore: Pišite ili nazovite nas, kontakti se nalaze na stranici
    notFound:
      metaTitle: Stranica nije pronađena — Details
      heading: Ova stranica ne postoji
      body: Verovatno je link zastareo ili ima grešku u adresi. Pogledajte na početnoj ili promenite radove.
      cta: Na početnu
