      contentHeading: Odakle potiče sadržaj
      contentText: Svaki rad prikazan na sajtu fotografisan je u našoj radionici po završetku radova. Ne koristimo fotografije sa interneta. Tekstove piše tim studija na ruskom, a na srpski i engleski prevode se automatski.
      ownerHeading: Kome pripada sajt
      ownerText: Sajt pripada detailing studiju Details. Kako postupamo sa podacima posetilaca opisano je u odeljku
      contactsHeading: Kontakt
