    privacy:
      metaTitle: Privacy Policy — Details
      metaDescription: What data the Details car detailing studio website collects, why, and how long it is stored.
      heading: Privacy Policy
      lastUpdated: Last Updated September 12, 2026
      sections:
        - title: What Data We Collect
          text: Only what you enter in the application form — name, contact information, and comments — as well as the address of the page from which the application was sent and an anonymous browser identifier. This identifier is random, stored in your browser, and is only used so we don't create three entries for the same request.
        - title: Why We Need This Data
          text: To contact you regarding your application and maintain a record of inquiries. We do not use this data for mailing lists and do not share it with third parties for advertising purposes.
        - title: Where It Is Stored
          text: Applications are stored in encrypted storage with our hosting provider and are also duplicated in our internal work chat. Only studio staff have access.
        - title: How Long We Keep It
          text: Up to two years from the last contact. We can delete it sooner upon your request.
        - title: Cookies
          text: The website uses a technical cookie for the chosen interface language and an analytical one — Google Analytics. The analytics tool is activated on the first page load; it can be declined via the banner at the bottom of the screen, and it will not be activated on subsequent visits. There are no advertising cookies tracking your activity on other websites. If you came through an advertisement and did not decline analytics, the site remembers this — the source and campaign — for 30 days, so we can see which ads lead to applications.
        - title: Your Rights
          text: You can request a copy of your data, corrections, or deletion. Just message us on any of the messengers or call.
      contactTitle: Data Questions
      contactBefore: Write or call us, contact details are on the page.
