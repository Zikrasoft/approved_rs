      metaDescription: Koje podatke prikuplja sajt studija detaljinga Details, zašto i koliko dugo se čuvaju.
      heading: Politika privatnosti
      lastUpdated: Ažurirano 12. septembra 2026
      sections:
        - title: Koje podatke prikupljamo
          text: Samo ono što sami unosite u obrazac prijave — ime, kontakt i komentar, kao i adresu stranice sa koje je prijava poslata, i anonimni identifikator pregledača. Ovaj identifikator je slučajan, čuva se u vašem pregledaču i potrebna je samo da ne napravimo tri kartice za isti zahtev.
        - title: Zašto nam ti podaci
          text: Da bismo se javili vam povodom prijave i vodili istoriju kontakta. Ne koristimo ih za slanje e-pošte i ne prosleđujemo ih trećim licima u reklamne svrhe.
        - title: Gde se čuvaju
          text: Prijave se čuvaju u enkriptovanoj bazi našeg hosting provajdera i dupliraju se u naš unutrašnji radni chat. Pristup imaju samo zaposleni studija.
        - title: Koliko ih čuvamo
          text: Do dve godine od poslednjeg kontakta. Na vaš zahtev ćemo ih obrisati ranije.
        - title: Kolačići
          text: Sajt koristi tehnički kolačić sa odabranim jezikom interfejsa i analitički — Google Analytics. Analitika se aktivira pri prvom učitavanju stranice; u baneru na dnu ekrana možete odbiti, i tada se prilikom sledećeg učitavanja ne uključuje. Reklamni kolačići koji vas prate na drugim sajtovima ovde ne postoje. Ako ste došli putem reklame i niste odbili analitiku, sajt pamti to — izvor i kampanju — u trajanju od 30 dana, kako bismo videli koja reklama donosi zahteve.
        - title: Vaša prava
          text: Možete zatražiti kopiju svojih podataka, njihovu ispravku ili brisanje. Dovoljno je da nam pišete u bilo kojem od messengera ili pozovete.
