thanks:
  metaTitle: Заявка отправлена | Details
  metaDescription: Спасибо за заявку. Мы свяжемся в рабочее время и договоримся об осмотре.
  eyebrow: Готово
  heading: Заявка у нас
  body: Мы свяжемся с вами в рабочее время, обычно в течение часа. Если вопрос срочный, напишите в мессенджер, там отвечаем быстрее.
  note: Если ответа нет дольше рабочего дня, значит сообщение потерялось. Напишите еще раз, мы не обидимся.
