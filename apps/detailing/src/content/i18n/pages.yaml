    privacy:
      metaTitle: Privacy Policy — Details
      metaDescription: The information collected by the Details detailing studio website, its purpose, and retention period.
      heading: Privacy Policy
      lastUpdated: Updated September 12, 2026
      sections:
        - title: What Data We Collect
          text: Only what you enter in the application form — name, contact info, and comments — as well as the page URL from which the application was submitted, and an anonymous browser identifier. This identifier is random, stored in your browser, and is only needed so we don’t create multiple entries for the same request.
        - title: Why We Need This Data
          text: To contact you regarding your application and keep a record of the correspondence. We don’t use it for newsletters and don’t share it with third parties for advertising.
        - title: Where It Is Stored
          text: Applications are stored in the encrypted database of our hosting provider and are duplicated in our internal chat. Access is limited to studio staff.
        - title: How Long We Keep It
          text: Up to two years from the last contact. We can delete it sooner upon your request.
        - title: Cookies
          text: The site uses a technical cookie for the selected interface language and an analytical cookie — Yandex.Metrica. Analytics is activated on the first page load; you can consent to it in the banner at the bottom of the screen, and it won’t activate on subsequent visits if you opt out. Metrica tracks sessions — mouse movement, scrolling, and clicks — but we have excluded application form data from the recording. There are no advertising cookies that track you on other sites.
        - title: Your Rights
          text: You can request a copy of your data, its correction, or deletion. Just message us in any messenger or call.
      contactTitle: Questions About Data
      contactBefore: Message us or call, contacts are available on the page
