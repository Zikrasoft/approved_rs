        - Ponesite ključeve za sve brave, uključujući i ključ za sigurnosne šrafove na točkovima.
    thanks:
      metaTitle: Upit je poslat | Details
      metaDescription: Hvala na upitu. Javićemo vam se u toku radnog vremena da dogovorimo pregled.
      eyebrow: Gotovo
      heading: Primili smo vaš upit
      body: Javićemo vam se u toku radnog vremena, obično u roku od sat vremena. Ako je hitno, pišite nam preko neke od aplikacija za poruke, tamo brže odgovaramo.
      note: Ako odgovor ne stigne u roku od jednog radnog dana, verovatno se poruka izgubila. Slobodno nam pišite ponovo.
      cta: Povratak na početnu
    privacy:
      metaTitle: Politika privatnosti | Details
      metaDescription: Koje podatke prikuplja sajt detailing studija Details, zašto ih prikupljamo i koliko dugo ih čuvamo.
      heading: Politika privatnosti
      lastUpdated: Ažurirano 12. septembra 2026.
      sections:
        - title: Koje podatke prikupljamo
          text: Samo ono što sami unesete u obrazac za upit (ime, kontakt i komentar), kao i adresu stranice sa koje je upit poslat i anonimni identifikator pregledača. Taj identifikator je nasumično generisan, čuva se u vašem pregledaču i služi samo da isti upit ne bismo evidentirali tri puta.
        - title: Zašto su nam ti podaci potrebni
          text: Da bismo vam se javili povodom upita i vodili evidenciju komunikacije. Ne koristimo ih za slanje promotivnih poruka niti ih prosleđujemo trećim licima u reklamne svrhe.
        - title: Gde se podaci čuvaju
          text: Upiti se čuvaju u šifrovanom skladištu podataka našeg hosting provajdera, a njihove kopije se šalju u naš interni poslovni čet. Pristup imaju samo zaposleni u studiju.
        - title: Koliko dugo čuvamo podatke
          text: Do dve godine od poslednjeg kontakta. Na vaš zahtev obrisaćemo ih i ranije.
        - title: Kolačići
          text: Sajt koristi tehnički kolačić koji pamti izabrani jezik interfejsa i analitičke kolačiće (Google Analytics i Yandex Metrica). Analitika se pokreće pri prvom učitavanju stranice. Možete je odbiti u baneru pri dnu ekrana, nakon čega se neće pokretati od sledećeg učitavanja. Yandex Metrica snima sesije (pomeranje kursora, skrolovanje i klikove). Obrazac za upit isključili smo iz snimanja, pa se njegov sadržaj ne beleži. Ovde nema reklamnih kolačića koji vas prate na drugim sajtovima. Ako ste došli preko oglasa i niste odbili analitiku, sajt pamti izvor i kampanju 30 dana kako bismo videli koji oglasi donose upite.
        - title: Vaša prava
          text: Možete zatražiti kopiju svojih podataka, njihovu ispravku ili brisanje. Dovoljno je da nam pišete preko bilo koje aplikacije za poruke ili da nas pozovete.
      contactTitle: Pitanja o podacima
      contactBefore: Pišite nam ili nas pozovite, kontakt podaci su na stranici
    about:
      metaTitle: O sajtu details.rs, sajtu detailing studija Details
      metaDescription: Šta sadrži sajt detailing studija Details u Beogradu, odakle su fotografije radova, kome pripada sajt i kako da nas kontaktirate.
      heading: Sajt studija Details
      lead: Ovde ćete pronaći sve o detailing studiju Details u Beogradu. Usluge, naše radove, adresu i načine zakazivanja.
