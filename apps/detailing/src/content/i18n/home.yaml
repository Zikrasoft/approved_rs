    servicesHead:
      eyebrow: What we do
      heading: Four areas, each done to perfection
      body: We intentionally avoid taking on everything. It's better to excel in four areas than to claim we can do twenty things mediocrely.
    compare:
      eyebrow: Before and after
      heading: A difference you can see without a lamp
      body: 'Slide the slider. On the left — how it arrived, on the right — how it left. No retouching: same spot, same light, same camera.'
    process:
      eyebrow: How the process works
      heading: From inspection to delivery
      body: Transparent and without surprises in the bill. We provide a quote after inspection, not off the cuff over the phone.
      steps:
        - title: Inspection and measurements
          text: We inspect paint under a lamp, measure thickness, and discuss what’s truly needed and what is just extra costs.
        - title: Estimate and timeline
          text: We document the scope of work, price, and delivery date. The price remains fixed thereafter.
        - title: Preparation
          text: Two-step wash, clay treatment, and degreasing. Skipping this step means sealing dirt under the film.
        - title: Work and delivery
          text: Film, polishing, ceramics — all as planned. We hand you the car in daylight and show the results together.
    honest:
      eyebrow: Honesty
      heading: Sometimes the right answer is to not take the job
      body: Declining a job is also a result of inspection. We communicate these cases before you pay, not afterwards.
      items:
        - title: Paint at its limit
          text: If the thickness gauge shows critically thin paint, polishing cannot be done—it could wear down to the primer. We'll offer a gentle alternative without removal or just protective coating and show you measurements that reflect this.
        - title: The car has been repainted
          text: "You can't apply film on cheap repair paint: it will take the coating off upon removal. We first restore the paint, then return to the film."
        - title: Dents and waves on panels
          text: Film doesn’t hide the geometry of the body, and a matte finish emphasizes it more than a glossy one. Body repair comes first, then color.
        - title: Steering wheel with deployed airbag
          text: 'Without a service history, we won’t touch such a steering wheel. This is a matter of your safety, not just cosmetics: service first, then us.'
    materials:
      eyebrow: Materials
      heading: We only work with what can withstand the Serbian summer
      body: "Film and compounds are consumables where you can't cut corners: cheap materials yellow in a season and come off with the paint. We keep a stocked inventory of trusted brands and always inform you what will be applied to your vehicle."
