    process:
      eyebrow: How We Work
      heading: From Inspection to Delivery
      body: Transparent and without surprises on the bill. We quote the price after inspection, not randomly over the phone.
      steps:
        - title: Inspection and Measurements
          text: We examine the paint under the lamp, measure thickness, and discuss what’s truly necessary versus unnecessary expenses.
        - title: Estimate and Timeline
          text: We fix the scope of work, price, and delivery date. The price doesn’t increase afterward.
        - title: Preparation
          text: Two-step wash, clay, degreasing. Skipping this step means sealing dirt under the film.
        - title: Work and Delivery
          text: Film, polishing, ceramic — according to plan. We hand over the car in daylight and review the results together with you.
    honest:
      eyebrow: Honesty
      heading: Sometimes the right answer is to walk away
      body: Refusing work is also an inspection outcome. We communicate these cases before you pay, not after.
      items:
        - title: Paint at the limit
          text: If the thickness gauge shows critically thin paint, polishing isn’t an option — you could sand down to the primer. We’ll suggest a gentle option without removal or only a protective coating and show measurements that indicate this.
        - title: Car Already Repainted
          text: "You can't apply film over cheap repair paint: removing it will take the coating with it. First we’ll restore the paint, then return to the film."
        - title: Dents and Waves on Panels
          text: Film doesn’t hide the geometry of the body, while matte finishes emphasize it more than gloss. First we do bodywork, then the color.
        - title: Steering Wheel with Deployed Airbag
          text: 'Without a service history, we won’t take that steering wheel. This is a matter of your safety, not just cosmetics: first service, then us.'
    materials:
