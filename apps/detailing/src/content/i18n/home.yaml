    faq:
      - q: How long will my car be with you?
        a: Polishing with ceramic coating takes two to three days. Front with film takes two days. Full body wrap takes from five days. We give an exact timeframe during inspection and adhere to it.
      - q: Will the film damage the factory paint?
        a: 'No, if the paint is factory and the film is removed in time and correctly. We always check with a thickness gauge to see if the car has been repainted: film cannot be applied to fresh or cheap repair paint, and we will inform you before starting work.'
      - q: Can I wrap only the hood and bumper?
        a: 'Yes, partial areas — hood, bumper, fenders, mirrors, pillars, thresholds — are the most common choice: they cover the 90% of stone chips that really occur on the road.'
      - q: What about ceramic coating in winter and at washes?
        a: Ceramic is resistant to salt and brushes, but lasts longer with touchless washes using pH-neutral chemicals. Come for a free annual inspection of the coating — we'll suggest if any renewal is needed.
      - q: Do you offer steering-wheel restoration separately from other services?
        a: Yes, this is a standalone service. We remove the steering wheel, reupholster or repaint the leather, and reassemble it with the airbag. It usually takes two to three days.
      - q: What determines the price?
        a: It depends on the size of the vehicle, the condition of the paint, and the amount of preparation needed. Complicated bumpers, disassembling optics, and paint defects that need to be addressed before applying film can drive the price up. We provide a price range for your vehicle right at the inspection, before starting work, and it won't change afterwards.
      - q: Protective film or color change — which should I choose?
        a: "These serve different purposes. Clear PPF preserves the factory color and takes on stones and scratches — it's chosen when you want to keep the vehicle intact. Color wraps change the appearance: matte, satin, texture. They can also be removed without damaging the factory paint, but they are more expensive and take longer to apply — 4 to 7 days compared to 2 to 6. There are also color films with a protective layer — satin wraps that change the look while also protecting the paint."
      - q: Do you work with vehicles that have foreign plates?
        a: Yes, quite often. No additional documents are needed for detailing — just come as you are.
