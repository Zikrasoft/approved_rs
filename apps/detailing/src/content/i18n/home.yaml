    process:
      eyebrow: How We Work
      heading: From inspection to delivery
      body: Transparent and without surprises on the bill. We name the price after inspection, not based on a guess over the phone.
      steps:
        - title: Inspection and Measurements
          text: We inspect the lacquer under the lamp, measure the thickness, and discuss what’s truly needed and what might be unnecessary expense.
        - title: Estimate and Timeline
          text: We confirm the scope of work, price, and delivery date. From then on, the price doesn't increase.
        - title: Preparation
          text: Two-stage washing, clay bar treatment, and degreasing. Skipping this step means sealing dirt under the film.
        - title: Execution and Delivery
          text: Film, polishing, ceramic — all by plan. We hand over the car in daylight and showcase the results together with you.
    honest:
      eyebrow: Honesty
      heading: Sometimes the right answer is to walk away
      body: Declining work is also an outcome of inspection. We inform you of these cases before you pay, not after.
      items:
        - title: Lacquer at its limit
          text: If the thickness gauge shows critically thin lacquer, polishing isn’t an option — we could sand down to the primer. We’ll suggest a gentle option without removal or just a protective coating and show you the measurements that demonstrate this.
        - title: The car has already been repainted
          text: 'You can’t apply film over cheap repair lacquer: removal will take the paint with it. First, we’ll restore the lacquer, then we can proceed with the film.'
        - title: Dents and waves on panels
          text: Film doesn't hide the geometry of the body, and matte finish emphasizes it more than gloss. First, body repair, then color.
        - title: Steering wheel with deployed airbag
          text: "Without service history, we won't work on such a wheel. This is a matter of your safety, not just cosmetics: first service, then we step in."
    materials:
      eyebrow: Materials
      heading: We only work with what can withstand Serbian summers
      body: 'Film and compounds are consumables where you can’t cut corners: cheap materials turn yellow in one season and come off with the lacquer. We maintain a stock of trusted brands and always specify exactly what we’ll put on your car.'
