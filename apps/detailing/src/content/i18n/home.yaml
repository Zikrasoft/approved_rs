    process:
      eyebrow: How the process works
      heading: From inspection to delivery
      body: Transparent and without surprises in pricing. We give a price after inspection, not a random quote over the phone.
      steps:
        - title: Inspection and measurements
          text: We inspect the paint under the lamp, measure thickness, and discuss what’s truly necessary versus unnecessary expenses.
        - title: Estimate and timeline
          text: We document the scope of work, the price, and the completion date. The price won’t increase after this.
        - title: Preparation
          text: Two-stage wash, clay bar treatment, and degreasing. Skipping this step means sealing in dirt under the film.
        - title: Execution and delivery
          text: Film, polishing, ceramic—all according to plan. We hand over the car in daylight and showcase the result with you.
    honest:
      eyebrow: Honesty
      heading: Sometimes the right answer is to decline
      body: Declining work is also a result of inspection. We identify these cases before you pay, not after.
      items:
        - title: Clear coat at its limit
          text: If the thickness gauge indicates critically thin clear coat, polishing is not an option—it may wear down to the primer. We’ll suggest a gentle option without removal or only a protective coating and show you the measurements.
        - title: Car already repainted
          text: 'You can’t apply film over cheap repair paint: during removal, it can take the coating with it. First, we’ll restore the paint, then return to the film.'
        - title: Dents and waves on the panels
          text: Film does not hide body geometry, and matte surfaces emphasize it more than gloss. First, body repairs, then color.
        - title: Steering wheel with deployed airbag
          text: 'Without a service history, we won’t take on that wheel. This is about your safety, not cosmetics: first service, then us.'
