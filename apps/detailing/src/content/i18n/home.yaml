    intro:
      eyebrow: Why Details
      heading: Detailing isn't a car wash. It's surface care.
      body: The difference between a quick wash and shine and proper detailing is hours under an inspection light. We measure paint thickness, remove scratches in multiple passes and protect the finish so it lasts for years, not just until the first rain.
      points:
        - title: One car at a time
          text: Our bay isn't a production line. While your car is with us, your specialist works on it alone.
        - title: Measured, not guessed
          text: Before polishing, we measure paint thickness across every panel. If there isn't enough to work with safely, we'll tell you straight and won't risk your paint.
        - title: Photos at every stage
          text: You can see exactly what we've done to your car, even if you haven't stopped by.
    protocol:
      eyebrow: Paint measurements
      heading: A paint thickness gauge knows your paint better than you do
      body: Before polishing, we measure the paint on every panel and record the readings. You keep the report, including our decision on which panels to leave untouched.
      sheetTitle: Paint thickness report
      sample: BMW 530i, 2019
      unit: µm
      thinLabel: Thin
      verdictOk: Two-pass polish
      verdictStop: No cutting on the roof
      rows:
        - panel: Bonnet
          value: 132
        - panel: Roof
          value: 78
          thin: true
        - panel: Front wing
          value: 124
        - panel: Front door
          value: 141
        - panel: Rear door
          value: 146
        - panel: Boot lid
          value: 128
    servicesHead:
      eyebrow: What we do
      heading: Four specialities. No half measures.
      body: We deliberately don't offer everything. We'd rather do four things exceptionally well than claim we can do twenty.
    compare:
      eyebrow: Before and after
      heading: A difference you can see without an inspection light
      body: 'Drag the slider. On the left, how it arrived. On the right, how it left. No retouching: same spot, same light, same camera.'
    process:
      eyebrow: How it works
      heading: From inspection to handover
      body: Clear from the start, with no surprises on the bill. We quote after inspecting your car, not by guessing over the phone.
      steps:
        - title: Inspection and measurements
          text: We inspect the paint under a light, measure its thickness and discuss what it really needs and what would be money wasted.
        - title: Quote and timescale
          text: We agree on the work, the price and the collection date. The price doesn't go up from there.
        - title: Preparation
          text: Two-stage wash, clay decontamination and degreasing. Skip this step and you're sealing dirt beneath the film.
        - title: The work and handover
          text: Film, polishing and ceramic coating, as agreed. We hand your car back in daylight and walk you through the results.
    honest:
      eyebrow: An honest approach
      heading: Sometimes the right answer is not to take the job
      body: An inspection can also mean advising against the work. We flag these issues before you pay, not afterwards.
      items:
        - title: Clear coat at its limit
          text: If the gauge shows critically thin paint, polishing risks cutting through to the primer. We'll suggest a gentle, non-abrasive treatment or a protective coating alone, and show you the readings that explain why.
        - title: Previously repainted panels
          text: "Film shouldn't go over a poor-quality refinish: removing it can pull the paint off too. The paint needs sorting first, then we can revisit the film."
        - title: Dents and ripples in the panels
          text: A wrap won't hide uneven bodywork, and a matte finish can highlight it even more than gloss. Body repairs first, colour second.
        - title: A steering wheel with a deployed airbag
          text: "We won't work on it without a documented repair history. This is about your safety, not appearance: a qualified repairer comes first, then us."
    materials:
      eyebrow: Materials
      heading: Only materials that can handle a Serbian summer
      body: "Film and detailing products aren't the place to cut costs: cheap film can yellow in a single season and pull off paint when removed. We stock proven brands and always tell you exactly what we're putting on your car."
      brands:
        - name: XPEL
          purpose: Paint protection film (PPF)
        - name: SunTek
          purpose: Paint protection film (PPF)
        - name: 3M
          purpose: Colour-change wraps
        - name: HEXIS
          purpose: Colour-change wraps
        - name: Gtechniq
          purpose: Ceramic coating
        - name: Koch-Chemie
          purpose: Polishing compounds
    prices:
      eyebrow: Pricing
      heading: Clear price ranges. A firm quote after inspection.
      body: Below are realistic price ranges for Belgrade. The final quote depends on paint condition, vehicle size and how much preparation is needed before the work begins.
      note: Prices include materials, labour and VAT. We provide a firm quote after inspecting your car.
      plans:
        - name: Paint protection film
          price: from €690
          unit: front end · full body from €2,400
          features:
            - Patterns tailored to your car, with no seams in visible areas
            - Wrapped edges wherever possible
            - Self-healing top coat
        - name: Polishing and ceramic coating
          price: from €450
          unit: per car
          features:
            - Paint thickness measurements across every panel
            - Two- or three-stage machine polishing
            - Ceramic coating with 2–5 years of protection
            - Before-and-after photos under an inspection light
        - name: Colour-change wraps
          price: from €1,900
          unit: full body
          features:
            - Matte, gloss, satin and textured films
            - Handles, lights and trim removed for fitting
            - Removable without damaging factory paint
            - Colour samples on your car before we start
    worksHead:
      eyebrow: Our work
      heading: Cars we've worked on
      body: Every car shown here has been in our bay. All photos are our own, with no stock images or borrowed shots.
    faq:
      - q: How long will you need my car?
        a: Polishing with ceramic coating takes two to three days. Front-end PPF takes two days. A full-body wrap takes at least five days. We confirm the timescale at inspection and stick to it.
      - q: Will film damage the factory paint?
        a: No, provided the paint is original and the film is removed properly and within its service life. We always use a paint thickness gauge to check for repainted panels. Film shouldn't be applied over fresh or poor-quality refinishing, and we'll tell you before work begins.
      - q: Can you cover just the bonnet and bumper?
        a: Yes. Partial coverage of the bonnet, bumper, wings, mirrors, pillars or sills is our most popular option. It protects the areas that take around 90% of stone impacts on the motorway.
      - q: How does ceramic coating hold up in winter and at car washes?
        a: Ceramic coating stands up to road salt and brushes, but lasts longer with touchless washes and pH-neutral products. Come in once a year for a free coating inspection, and we'll let you know if it needs refreshing.
      - q: Can I book steering wheel restoration on its own?
        a: Yes, it's a standalone service. We remove the steering wheel, retrim or recolour the leather, then refit it with the airbag. It usually takes two to three days.
      - q: What affects the price?
        a: The size of the car, the condition of the paintwork and how much preparation is needed. Complex bumper shapes, removing light assemblies and correcting paint defects before applying film all add to the cost. We'll give you a price range at the inspection, before any work starts, and stick to it.
      - q: 'Paint protection film or a colour-change wrap: which should I choose?'
        a: "They serve different purposes. Clear PPF preserves the factory colour and takes the impact of stone chips and scratches. It's ideal if you want to keep your car looking as it is, while protecting it. A colour-change wrap transforms the look with matte, satin or textured finishes. It can also be removed without damaging the factory paintwork, but costs more and takes longer to apply: 4–7 days rather than 2–6. Coloured paint protection films are also available, including satin finishes that change the look while protecting the paintwork."
      - q: Do you work on cars with foreign plates?
        a: Yes, quite often. No extra paperwork is needed for detailing. Just bring your car in.
    finalCta:
      eyebrow: Book a visit
      heading: Show us your car. We'll take it from there.
      body: Bring your car in for an inspection or send us photos via a messaging app. We'll give you an honest assessment of what it needs and what you can skip.
      cta: Send an enquiry
