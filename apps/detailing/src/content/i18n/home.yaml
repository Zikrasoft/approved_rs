          text: Ako merač debljine pokazuje kritično tanak lak, poliranje nije dozvoljeno - može se doći do temeljnog sloja. Ponudićemo blagu opciju bez uklanjanja ili samo zaštitni premaz i prikazaćemo merenja gde je to vidljivo.
