faq:
  - q: 'Сколько времени машина будет у вас?'
    a: Полировка с керамикой занимает два-три дня. Передняя часть в пленке занимает два дня. Полная оклейка кузова от пяти дней. Точный срок называем при осмотре и держим его.
  - q: 'Пленка испортит заводскую краску?'
    a: 'Нет, если краска заводская и пленка снимается вовремя и правильно. Мы всегда проверяем толщиномером, не крашена ли машина: на свежий или дешевый ремонтный лак пленку класть нельзя, и мы об этом скажем до начала работ.'
  - q: 'Можно оклеить только капот и бампер?'
    a: 'Можно. Частичные зоны (капот, бампер, крылья, зеркала, стойки, пороги) самый частый вариант: закрывает те 90% ударов камнями, которые реально случаются на трассе.'
  - q: 'Что с керамикой зимой и на мойках?'
    a: Керамика не боится соли и щетки, но живет дольше на бесконтактной мойке с pH-нейтральной химией. Раз в год приезжайте на бесплатный осмотр покрытия, подскажем, нужно ли обновление.
  - q: 'Делаете ли вы реставрацию руля отдельно от остального?'
    a: Да, это самостоятельная услуга. Снимаем руль, перешиваем или перекрашиваем кожу, собираем обратно с подушкой безопасности. Обычно занимает два-три дня.
  - q: 'От чего зависит цена?'
    a: 'От размера кузова, состояния лака и объема подготовки. Вверх цену двигают сложные бамперы, разбор оптики и дефекты лака, которые нужно убрать до пленки. Вилку по вашей машине называем сразу на осмотре, до начала работ, и дальше она не растет.'
  - q: 'Защитная пленка или смена цвета: что выбрать?'
    a: 'Это разные задачи. Прозрачная PPF сохраняет заводской цвет и принимает на себя камни и царапины, ее берут, когда машину хочется оставить как есть, но целой. Цветная меняет вид: мат, сатин, текстура. Она тоже снимается без вреда для заводского лака, но стоит дороже и клеится дольше: 4–7 дней против 2–6. Бывают и цветные пленки с защитным слоем, например сатин, который и меняет вид, и защищает лак.'
  - q: 'Вы работаете с машинами на иностранных номерах?'
    a: Да, и довольно часто. Никаких дополнительных документов для детейлинга не нужно, приезжайте как есть.
