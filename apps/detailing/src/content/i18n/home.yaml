process:
  eyebrow: Как проходит работа
  heading: От осмотра до выдачи
  body: Прозрачно и без сюрпризов в счете. Цену называем после осмотра, а не по телефону наугад.
  steps:
    - title: 'Осмотр и замеры'
      text: Смотрим лак под лампой, меряем толщину, обсуждаем, что реально нужно, а что будет лишними деньгами.
    - title: 'Смета и срок'
      text: Фиксируем объем работ, цену и дату выдачи. Дальше цена не растет.
    - title: 'Подготовка'
      text: Мойка в два этапа, глина, обезжиривание. Пропустить этот шаг значит запечатать грязь под пленкой.
    - title: 'Работа и выдача'
      text: Пленка, полировка, керамика по плану. Отдаем машину при дневном свете и показываем результат вместе с вами.
honest:
  eyebrow: Честно
  heading: Иногда правильный ответ в том, чтобы не браться
  body: Отказ от работы тоже результат осмотра. Эти случаи мы называем до того, как вы заплатите, а не после.
  items:
    - title: 'Лак на пределе'
      text: Если толщиномер показывает критично тонкий лак, полировать нельзя, можно протереть до грунта. Предложим мягкий вариант без съема или только защитное покрытие и покажем замеры, на которых это видно.
    - title: 'Машина уже перекрашена'
      text: 'На дешевый ремонтный лак пленку класть нельзя: при снятии она заберет покрытие с собой. Сначала приводим лак в порядок, потом возвращаемся к пленке.'
    - title: 'Вмятины и волны на панелях'
      text: Пленка не прячет геометрию кузова, а матовая подчеркивает ее сильнее глянца. Сначала кузовной ремонт, потом цвет.
    - title: 'Руль со сработавшей подушкой'
      text: 'Без сервисной истории мы за такой руль не беремся. Это вопрос вашей безопасности, а не косметики: сначала сервис, потом мы.'
