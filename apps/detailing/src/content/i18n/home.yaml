    faq:
      - q: Koliko će vremena automobil biti kod vas?
        a: Poliranje s keramikom — dva do tri dana. Prednji deo u foliji — dva dana. Potpuno oblepljenje karoserije — od pet dana. Tačan rok navodimo pri pregledu i držimo ga.
      - q: Hoće li folija pokvariti fabričku boju?
        a: 'Ne, ako je boja fabrička i folija se skida na vreme i pravilno. Uvek proveravamo debljinomerom da li je auto farban: na svež ili jeftin popravni lak foliju stavljati ne može, i mi ćemo to reći pre početka radova.'
      - q: Može li se oblepi samo hauba i branik?
        a: 'Može. Delimične zone — hauba, branik, krila, ogledala, stubovi, pragovi — najčešća opcija: pokriva onih 90% udaraca kamenčićima koji se stvarno događaju na putu.'
      - q: Šta sa keramikom zimi i na pranju?
        a: Keramika se ne boji soli i četkica, ali duže traje uz beskontaktno pranje s pH-neutralnom hemijom. Jednom godišnje dođite na besplatnu prolepsu premaz, reći ćemo vam da li je potrebna obnova.
      - q: Da li vršite restauraciju volana odvojeno od ostalog?
        a: Da, to je samostalna usluga. Skidamo volan, presvučemo ili prefarbamo kožu, vraćamo nazad uz vazdušni jastučić. Obično traje dva do tri dana.
      - q: Od čega zavisi cena?
        a: Od veličine karoserije, stanja laka i obima pripreme. Cenu podižu kompleksne branike, demontaža svetala i oštećenja laka koja treba ukloniti pre filma. Opseg za vaše vozilo preciziramo odmah na pregledu pre početka radova, i više se ne menja.
      - q: Zaštitna folija ili promena boje — šta odabrati?
        a: 'To su različiti zadaci. Prozirna PPF čuva fabričku boju i štiti od kamenčića i ogrebotina — uzima se kada želite da auto ostane kao što jeste, ali očuvan. Bojena menja izgled: mat, satenski, tekstura. Takođe se može skinuti bez oštećenja fabričkog laka, ali je skuplja i lepši se duže — 4–7 dana naspram 2–6. Postoje i bojene folije sa zaštitnim slojem — satin, koji menja izgled i štiti lak.'
      - q: Da li radite s automobilima sa stranim registarskim tablicama?
        a: Da, prilično često. Nema dodatnih dokumenata potrebnih za detailing — dođite kako jeste.
    finalCta:
