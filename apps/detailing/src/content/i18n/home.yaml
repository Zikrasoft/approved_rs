          thin: true
        - panel: Front fender
          value: 124
        - panel: Front door
          value: 141
        - panel: Rear door
          value: 146
        - panel: Trunk lid
          value: 128
    servicesHead:
      eyebrow: What we do
      heading: Four specialities, done right from start to finish
      body: We don't take on every job. We'd rather do four things exceptionally well than claim we can do twenty.
    compare:
      eyebrow: Before and after
      heading: A difference you can see without inspection lights
      body: 'Drag the slider. On the left, the car as it arrived. On the right, as it left. No retouching: same spot, same light, same camera.'
    process:
      eyebrow: How it works
      heading: From inspection to handover
      body: No surprises on the bill. We give you a price after inspecting the car, not a guess over the phone.
      steps:
        - title: Inspection and measurements
          text: We inspect the paint under lights, measure its thickness, and discuss what the car really needs and what would be money wasted.
        - title: Quote and schedule
          text: We agree on the work, price, and collection date. The price won't go up later.
        - title: Preparation
          text: Two-stage wash, clay-bar treatment, and degreasing. Skip this and you seal dirt under the film.
        - title: Work and handover
          text: Film, polishing, and ceramic coating, as agreed. We hand the car back in daylight and walk you through the results.
    honest:
      eyebrow: Straight talk
      heading: Sometimes the right answer is to turn down the job
      body: Turning down a job is part of the inspection too. We'll explain these situations before you pay, not after.
      items:
        - title: Paint is too thin
          text: If the gauge shows critically thin paint, polishing could cut through to the primer. We'll suggest a gentler option that removes no paint, or a protective coating only, and show you the readings behind our recommendation.
        - title: The car has been repainted
          text: "Film shouldn't go on cheap repair paint: when removed, it can take the paint with it. We recommend sorting out the finish first, then coming back for the wrap."
        - title: Dents and ripples in the panels
          text: Film won't hide bodywork imperfections, and matte finishes show them even more than gloss. Repair the bodywork first, then change the colour.
        - title: Steering wheel with a deployed airbag
          text: "Without a service history, we won't work on that steering wheel. This is about your safety, not cosmetics: get it checked by a service centre first, then come to us."
    materials:
      eyebrow: Materials
      heading: Materials that stand up to a Serbian summer
      body: "Film and coatings are materials you can't afford to skimp on: cheap products can yellow in a season and come off with the paint. We stock trusted brands and always tell you exactly what we're using on your car."
      brands:
        - name: XPEL
          purpose: Paint protection film (PPF)
