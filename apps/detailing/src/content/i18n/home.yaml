      body: Svaka kartica je auto koji je bio kod nas u boksu. Vlastite fotografije, bez stockova i tuđih kadrova.
    faq:
      - q: Koliko će vremena auto biti kod vas?
        a: Poliranje sa keramikom — dva do tri dana. Napred u foliji — dva dana. Kompletno oblepljenje karoserije — od pet dana. Tačan rok javljamo prilikom pregleda i držimo ga.
      - q: Da li folija kvari fabričku boju?
        a: 'Ne, ako je boja fabrička i folija se skida na vreme i pravilno. Uvek proveravamo merenjem debljine, da li je auto farban: na svež ili jeftin popravni lak foliju stavljati ne možemo, i o tome ćemo vas obavestiti pre početka radova.'
      - q: Može li se oblepiti samo hauba i branik?
        a: 'Može. Delimične zone — hauba, branik, krila, ogledala, stubovi, pragovi — najčešće varijante: pokriva onih 90% udaraca kamenjem koji se zaista dešavaju na putu.'
      - q: Šta sa keramikom zimi i na pranjima?
        a: Keramika se ne boji soli i četki, ali duže traje na beskontaktnoj pranjima sa pH-neutralnom hemijom. Jednom godišnje dođite na besplatni pregled premaza — reći ćemo vam da li je potrebno osveženje.
      - q: Da li radite restauraciju volana odvojeno od ostalog?
        a: Da, to je samostalna usluga. Skidamo volan, presvlačimo ili prefarbamo kožu, i vraćamo nazad sa vazdušnim jastučićem. Obično traje dva do tri dana.
      - q: Od čega zavisi cena?
        a: Od veličine karoserije, stanja laka i obima pripreme. Cena raste sa komplikovanim branama, razmontiranjem farova i oštećenjima laka koja treba popraviti pre lijepljenja folije. Opseg po vašem vozilu određujemo odmah prilikom pregleda, pre nego što počnemo radove, i kasnije se ne povećava.
      - q: Zaštitna folija ili promena boje — šta odabrati?
        a: 'To su različiti zadaci. Prozirna PPF čuva fabričku boju i štiti od kamenčića i ogrebotina — uzima se kada želite da auto ostane kakav jeste, ali ceo. Boja menja izgled: mat, satenski, tekstura. Takođe se skida bez oštećenja fabričnog laka, ali je skuplja i lepi se duže — 4–7 dana u odnosu na 2–6. Ima i obojenih folija sa zaštitnim slojem — satenske, koja menja izgled i štiti lak.'
      - q: Da li radite sa automobilima na stranim registracijama?
        a: Da, i prilično često. Nema dodatnih dokumenata za detailing — dođite kako jeste.
    finalCta:
