    worksHead:
      eyebrow: Works
      heading: Cars that have been with us
      body: Each card represents a car that stood in our box. Our photos, no stock or external images.
    faq:
      - q: How long will my car be with you?
        a: Polishing with ceramics takes two to three days. Front with film takes two days. Full body wrap takes at least five days. We provide an exact timeframe during the inspection and stick to it.
      - q: Will the film ruin the factory paint?
        a: 'No, as long as the paint is factory and the film is removed correctly and on time. We always check with a gauge whether the car has been repainted: film cannot be applied to fresh or cheap repair paint, and we will inform you before starting the work.'
      - q: Can I wrap just the hood and the bumper?
        a: 'Yes. Partial areas—hood, bumper, fenders, mirrors, pillars, thresholds—are the most common options: they cover 90% of rock chips that typically happen on the road.'
      - q: What about ceramics in winter and at washes?
        a: Ceramics are not afraid of salt and brushes, but last longer with touchless washes using pH-neutral chemicals. Come once a year for a free coating inspection—we’ll advise if an update is needed.
      - q: Do you restore steering wheels separately from the rest?
        a: Yes, this is a standalone service. We remove the steering wheel, reupholster or repaint the leather, and then reassemble it with the airbag. This usually takes two to three days.
      - q: What affects the price?
        a: It depends on the body size, the condition of the paint, and the amount of preparation needed. Complicated bumpers, disassembly of lighting, and paint defects that need to be fixed before applying the film will increase the price. We will give you a price range for your car right away during the inspection, before work begins, and it won't go up from there.
      - q: Protective film or color change – which one should I choose?
        a: 'These serve different purposes. Transparent PPF preserves the factory color and takes on stones and scratches – it is chosen when you want to keep the car as is, but intact. A color change changes the appearance: matte, satin, texture. It can also be removed without damaging the factory paint but is pricier and takes longer to apply – 4 to 7 days compared to 2 to 6. There are also colored films with a protective layer – satin, which changes appearance and protects the paint as well.'
      - q: Do you work with cars that have foreign plates?
        a: Yes, quite often. No additional documents are needed for detailing – just come as you are.
