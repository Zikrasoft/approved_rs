    faq:
      - q: Koliko vremena će auto biti kod vas?
        a: Poliranje s keramikom — dva do tri dana. Prednji deo u foliji — dva dana. Potpuno omotavanje karoserije — od pet dana. Tačno vreme kažemo prilikom pregleda i držimo se toga.
      - q: Da li folija kvari fabričku boju?
        a: 'Ne, ako je boja fabrička i folija se skida na vreme i pravilno. Uvek proveravamo meračem debljine da li je auto farban: na svež ili jeftin repariran lak foliju staviti ne može, i o tome ćemo reći pre početka radova.'
      - q: Može li se obaviti samo hauba i branik?
        a: 'Može. Delimične zone — hauba, branik, krila, ogledala, stubovi, pragovi — najčešći izbor: pokriva onih 90% udaraca kamenčića koji se stvarno dešavaju na putu.'
      - q: Šta je s keramikom zimi i na pranjima?
        a: Keramika se ne boji soli i četaka, ali duže traje na beskontaktnoj pranju sa pH-neutralnom hemijom. Jednom godišnje dolazite na besplatan pregled premaza — reći ćemo vam treba li obnova.
      - q: Da li radite restauraciju volana odvojeno od ostalog?
        a: Da, to je samostalna usluga. Skidamo volan, presvlačimo ili farbamo kožu, ponovo sastavljamo sa vazdušnim jastučićem. Obično traje dva do tri dana.
      - q: Od čega zavisi cena?
        a: Od veličine karoserije, stanja laka i obima pripreme. Težinske cene pomeraju složeni branici, skidanje staklenih elemenata i oštećenja laka koja treba ukloniti pre folije. Opseg po vašem automobilu govorimo odmah prilikom pregleda, pre početka radova, i onda ona ne raste.
      - q: Zaštitna folija ili promena boje — šta izabrati?
        a: 'To su različiti zadaci. Providna PPF zadržava fabričku boju i uzima kamenje i ogrebotine na sebe — uzima se kada želite da auto ostane kao što jeste, ali ceo. Ob Color menja izgled: mat, satin, tekstura. Ona se takođe skida bez štete za fabričku lak, ali je skuplja i lepi se duže — 4–7 dana nasuprot 2–6. Postoje i boje folije sa zaštitnim slojem — satin, koji menja izgled i štiti lak.'
      - q: Da li radite s mašinama sa stranim registracijama?
        a: Da, i prilično često. Nema dodatnih dokumenata za detaljiranje — dođite kako jeste.
