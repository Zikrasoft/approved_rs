    faq:
      - q: Koliko vremena će automobil biti kod vas?
        a: Poliranje s keramikom — dva do tri dana. Napred u foliji — dva dana. Puna obloga karoserije — od pet dana. Tačan rok navodimo prilikom pregleda i držimo ga.
      - q: Hoće li folija oštetiti fabričku boju?
        a: 'Ne, ako je boja fabrička i folija se skida na vreme i pravilno. Uvek proveravamo dijagnostikom da li je automobil krečen: na svježem ili jeftinom reparativnom laku foliju nije moguće postaviti, i o tome ćemo vas obavestiti pre početka radova.'
      - q: Može li se obložiti samo hauba i branik?
        a: 'Može. Delimične zone — hauba, branik, krila, ogledala, stubovi, pragovi — najčešći su izbor: pokrivaju onih 90% udaraca kamenjem koji se zapravo dešavaju na putu.'
      - q: Šta je s keramikom zimi i na perilicama?
        a: Keramika se ne boji soli i četki, ali duže traje na bezkontaktnoj pranju s pH-neutralnom hemijom. Jednom godišnje dođite na besplatan pregled premaza — savetovaćemo vam je li potrebno obnoviti.
      - q: Da li radite restauraciju volana odvojeno od ostalog?
        a: Da, to je zasebna usluga. Skidamo volan, presvučemo ili prefarbamo kožu, vraćamo ga nazad s vazdušnim jastukom. Obično traje dva do tri dana.
      - q: Od čega zavisi cena?
        a: Od veličine karoserije, stanja laka i obima pripreme. Cenu podižu složeni branici, rasklapanje svetala i oštećenja laka koja treba ukloniti pre polaganja folije. Opredeljujemo cenu za vašu mašinu odmah pri pregledu, pre početka radova, i dalje se ne menja.
      - q: Zaštitna folija ili promjena boje — šta odabrati?
        a: 'To su različiti zadaci. Providna PPF čuva fabričku boju i štiti od kamenčića i ogrebotina — uzima se kada želite da auto ostane kakav je, ali bez oštećenja. Boja menja izgled: mat, satin, tekstura. Takođe se može skinuti bez štete po fabrični lak, ali je skuplja i duže se lepi — 4–7 dana naspram 2–6. Postoje i obojene folije s zaštitnim slojem — satin koji menja izgled i štiti lak.'
      - q: Da li radite s automobilima na stranim registarskim tablicama?
        a: Da, i prilično često. Nema dodatnih dokumenata za detailing — dođite kako jeste.
    finalCta:
