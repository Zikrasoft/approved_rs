    process:
      eyebrow: How the process works
      heading: From inspection to delivery
      body: Transparent and without surprises in billing. We provide pricing after inspection, not just over the phone.
      steps:
        - title: Inspection and measurements
          text: We examine the paint under the lamp, measure thickness, and discuss what’s really needed versus what’s unnecessary.
        - title: Estimate and timeline
          text: We fix the scope of work, price, and delivery date. After this, the price doesn’t increase.
        - title: Preparation
          text: Two-stage wash, clay treatment, and de-greasing. Skipping this step means sealing dirt under the film.
        - title: Execution and delivery
          text: Film, polishing, ceramics as planned. We hand over the car in daylight and show the results together with you.
    honest:
      eyebrow: Honesty
      heading: Sometimes the right answer is to walk away
      body: Declining work is also a result of inspection. We communicate these cases before you pay, not after.
      items:
        - title: Clear coat at its limit
          text: If the thickness gauge shows critically thin paint, polishing is not an option; it can wear down to the primer. We will suggest a gentle option without removal or just a protective coating and show you the measurements that confirm this.
        - title: Car already repainted
          text: "You can't apply film over cheap repair paint: it will lift the coating when removed. First, we restore the paint and then return to the film."
        - title: Dents and waves on the panels
          text: Film doesn’t conceal the body’s geometry, and matte finishes highlight it more than gloss. First body repair, then color change.
        - title: Steering wheel with deployed airbag
          text: 'Without a service history, we won’t take on such a steering wheel. This is about your safety, not aesthetics: service comes first, then we do our part.'
    materials:
