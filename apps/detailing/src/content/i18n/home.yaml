intro:
  eyebrow: Почему мы
  heading: Детейлинг не мойка. Это работа с поверхностью.
  body: Между «помыли и натерли» и настоящим детейлингом разница в часах под лампой. Мы измеряем толщину лака, снимаем риски в несколько проходов и закрываем результат так, чтобы он держался годы, а не до первого дождя.
  points:
    - title: 'Одна машина за раз'
      text: Бокс не превращается в конвейер. Пока ваш автомобиль у нас, мастер занят только им.
    - title: 'Толщиномер, а не «на глаз»'
      text: Перед полировкой замеряем лак по всем панелям. Если запаса нет, скажем прямо и не будем рисковать вашей краской.
    - title: 'Фотоотчет по каждому этапу'
      text: Вы видите, что происходило с машиной, даже если не приезжали смотреть.
protocol:
