          purpose: Polishing compounds
    prices:
      eyebrow: Pricing
      heading: Clear price ranges, exact quote after inspection
      body: These are real price ranges for Belgrade. The final price depends on the paint's condition, the size of the car, and how much prep is needed beforehand.
      note: Prices include materials and labour. VAT included. We provide an exact quote after inspecting the car.
      plans:
        - name: Paint protection film
          price: from €690
          unit: front end · full car from €2,400
          features:
            - Cut to fit your car, with no visible seams
            - Edges wrapped wherever possible
            - Self-healing top layer
        - name: Polishing and ceramic coating
          price: from €450
          unit: per car
          features:
            - Paint thickness measured on every panel
            - Two- or three-stage machine polish
            - Ceramic coating rated for 2-5 years
            - Before-and-after photos under inspection lights
        - name: Colour-change wraps
          price: from €1,900
          unit: full car
          features:
            - Matte, gloss, satin, and textured films
            - Handles, lights, and trim removed for fitting
            - Removes cleanly without damaging factory paint
            - Colour samples on your car before we start
    worksHead:
      eyebrow: Our work
      heading: Cars we've worked on
      body: Every card shows a car that has been in our bay. Our own photos, no stock images or someone else's work.
    faq:
      - q: How long will my car be with you?
        a: Polishing with ceramic coating takes two to three days. Front-end PPF takes two days. A full-car wrap takes at least five days. We'll confirm the exact schedule at inspection and stick to it.
      - q: Will film damage the factory paint?
        a: No, as long as the paint is factory-original and the film is removed properly and on time. We always check the paint with a thickness gauge. Film shouldn't go on fresh or low-quality repair paint, and we'll tell you before work begins.
      - q: Can you wrap just the hood and bumper?
        a: Yes. Partial coverage (hood, bumper, fenders, mirrors, pillars, and sills) is our most popular option. It protects against around 90% of the stone chips you're likely to get on the highway.
      - q: How does ceramic coating hold up in winter and at car washes?
        a: Ceramic coating can handle road salt and brush washes, but lasts longer with touchless washes and pH-neutral products. Come in once a year for a free coating inspection, and we'll let you know if it needs refreshing.
      - q: Can you restore a steering wheel on its own?
        a: Yes, it's a standalone service. We remove the steering wheel, reupholster or recolour the leather, then reinstall it with the airbag. It usually takes two to three days.
      - q: What affects the price?
        a: The size of the car, the condition of the paint and how much preparation it needs. Complex bumpers, removing trim around the lights and paint defects that need correcting before film installation can increase the price. We'll give you a price range for your car during the inspection, before work begins, and it won't go up after that.
      - q: 'Paint protection film or a colour-change wrap: which should I choose?'
        a: 'They serve different purposes. Clear PPF preserves the factory colour and takes the impact of stone chips and scratches. Choose it if you want to keep your car looking the same, but protect the paint. Colour-change film changes the look, with finishes such as matte, satin and textured. It can also be removed without damaging the factory paint, but costs more and takes longer to install: 4-7 days instead of 2-6. Some colour films also have a protective layer, such as satin film, which changes the look and protects the paint.'
      - q: Do you work on cars with foreign licence plates?
        a: Yes, quite often. You don't need any additional documents for detailing, just bring the car as it is.
    finalCta:
      eyebrow: Book an appointment
      heading: Show us your car, and we'll take it from there
      body: Come in for an inspection or send us photos in a messaging app. We'll tell you honestly what needs doing and what you can skip.
      cta: Send an enquiry
