    worksHead:
      eyebrow: Radovi
      heading: Automobili koji su prošli kod nas
      body: Svaka kartica - automobil koji je bio kod nas u boksu. Njihove fotografije, bez stockova i tuđih kadrova.
    faq:
      - q: Koliko vremena će automobil biti kod vas?
        a: Poliranje sa keramikom - dva do tri dana. Prednja strana u foliji - dva dana. Puna obloga karoserije - od pet dana. Tačan rok nazivamo prilikom pregleda i držimo ga.
      - q: Hoće li folija pokvariti fabričku boju?
        a: 'Ne, ako je boja fabrička i folija se skida na vreme i na pravi način. Uvek proveravamo meračem debljine, da li je automobil farban: foliju ne možemo postaviti na svež ili jeftin popravljen lak, a o tome ćemo vas obavestiti pre nego što započnemo rad.'
      - q: Može li se obložiti samo hauba i branik?
        a: 'Može. Delimične zone - hauba, branik, krila, retrovizori, stubovi, pragovi - najčešća opcija: pokriva onih 90% udaraca kamenjem koji se stvarno događaju na putu.'
      - q: Šta s keramikom zimi i na pranjima?
        a: Keramika se ne boji soli i četki, ali duže traje na bezkontaktnoj pranju sa pH-neutralnom hemijom. Posetite nas jednom godišnje na besplatan pregled premaza - daćemo savet da li je potrebno osvežiti.
      - q: Da li radite restauraciju volana odvojeno od ostalog?
        a: Da, to je samostalna usluga. Skidamo volan, presivamo ili prebojavamo kožu, ponovo ga sastavljamo sa vazdušnom jastučićem. Obično traje dva do tri dana.
      - q: Od čega zavisi cena?
        a: Od veličine karoserije, stanja laka i obima pripreme. Cenu povećavaju složeni bumperi, demontaža optike i defekti laka koji se moraju ukloniti pre postavljanja folije. Opseg po vašem vozilu navodimo odmah prilikom pregleda, pre početka radova, i dalje ne raste.
      - q: Zaštitna folija ili promena boje — šta izabrati?
        a: 'To su različiti zadaci. Providna PPF čuva fabričku boju i apsorbuje kamenčiće i ogrebotine — uzima se kada želite da vozilo ostavite netaknuto. Obložna folija menja izgled: mat, satin, tekstura. Takođe se skida bez štete za fabrički lak, ali košta više i traži više vremena za postavljanje — 4–7 dana naspram 2–6. Postoje i obložne folije sa zaštitnim slojem — satin, koji menja izgled i štiti lak.'
      - q: Radite li sa vozilima na stranim registarskim oznakama?
        a: Da, i prilično često. Nema dodatne dokumentacije za detaljiranje — dođite kako jeste.
    finalCta:
      eyebrow: Zakazivanje
      heading: Pokažite nam auto — dalje ide lakše
      body: Dođite na pregled ili pošaljite fotografije na messenger. Iskreno ćemo reći šta je potrebno, a šta možete da izostavite.
      cta: Ostavite prijavu
  en:
    meta:
