      body: Svaka kartica to je auto koje je bilo kod nas u boksu. Sve naše fotografije, bez stokova i tuđih kadrova.
    faq:
      - q: Koliko vremena će automobil biti kod vas?
        a: Poliranje s keramikom traje dva do tri dana. Prednji deo u foliji traje dva dana. Puna obloga karoserije od pet dana. Tačan rok navodimo pri pregledu i držimo ga.
      - q: Hoće li folija oštetiti fabričku boju?
        a: 'Ne, ako je boja fabrička i folija se skida na vreme i na pravi način. Uvek proveravamo debljinomera, nije li auto farban: na svež ili jeftin reparatorski lak ne stavljamo foliju i o tome ćemo vas obavestiti pre početka radova.'
      - q: Može li se oblepiti samo hauba i branik?
        a: 'Može. Djelimične zone (hauba, branici, blatobrani, retrovizori, stubovi, pragovi) su najčešći varijanta: pokriva onih 90% udaraca kamenjem koji se stvarno dešavaju na putu.'
      - q: Šta je s keramikom zimi i na pranju?
        a: Keramika se ne plaši soli i četki, ali duže traje na bezkontaktno pranje s pH-neutralnom hemijom. Jednom godišnje dolazite na besplatan pregled premaza, reći ćemo vam da li je potrebno osveženje.
      - q: Da li radite restauraciju volana odvojeno od ostalog?
        a: Da, to je samostalna usluga. Skidamo volan, presvlačimo ili farbamo kožu, ponovo sastavljamo sa vazdušnim jastučićem. Obično to traje dva do tri dana.
      - q: Šta utiče na cenu?
        a: Od veličine karoserije, stanja laka i obima pripreme. Cena se povećava komplikovanim branicima, razmontiranjem optike i defektima laka koje treba ukloniti pre folije. Opseg za vaš auto navodimo odmah pri pregledu, pre početka radova, i dalje ne raste.
      - q: 'Zaštitna folija ili promena boje: šta izabrati?'
        a: 'To su različiti zadaci. Prozirna PPF čuva fabričku boju i preuzima kamenčiće i ogrebotine, uzima se kada želite da auto ostane kao što jeste, ali ceo. Ob Color varijante menja izgled: mat, satin, tekstura. Takođe se skida bez štete po fabrički lak, ali je skuplja i lepi se duže: 4–7 dana naspram 2–6. Postoje i obojene folije s zaštitnim slojem, na primer satin koji menja izgled i štiti lak.'
      - q: Da li radite sa automobilima na stranim registarskim tablicama?
        a: Da, i prilično često. Nema dodatnih dokumenata za detaljiranje, dođite kako jeste.
