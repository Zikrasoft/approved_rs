process:
  eyebrow: Как проходит работа
  heading: От осмотра до выдачи
  body: Прозрачно и без сюрпризов в счёте. Цену называем после осмотра, а не по телефону наугад.
  steps:
    - title: 'Осмотр и замеры'
      text: Смотрим лак под лампой, меряем толщину, обсуждаем, что реально нужно, а что — лишние деньги.
    - title: 'Смета и срок'
      text: Фиксируем объём работ, цену и дату выдачи. Дальше цена не растёт.
    - title: 'Подготовка'
      text: Мойка в два этапа, глина, обезжиривание. Пропустить этот шаг — значит запечатать грязь под плёнкой.
    - title: 'Работа и выдача'
      text: Плёнка, полировка, керамика — по плану. Отдаём машину при дневном свете и показываем результат вместе с вами.
honest:
  eyebrow: Честно
  heading: Иногда правильный ответ — не браться
  body: Отказ от работы — тоже результат осмотра. Эти случаи мы называем до того, как вы заплатите, а не после.
  items:
    - title: 'Лак на пределе'
      text: Если толщиномер показывает критично тонкий лак, полировать нельзя — можно протереть до грунта. Предложим мягкий вариант без съёма или только защитное покрытие и покажем замеры, на которых это видно.
    - title: 'Машина уже перекрашена'
      text: 'На дешёвый ремонтный лак плёнку класть нельзя: при снятии она заберёт покрытие с собой. Сначала приводим лак в порядок, потом возвращаемся к плёнке.'
    - title: 'Вмятины и волны на панелях'
      text: Плёнка не прячет геометрию кузова, а матовая подчёркивает её сильнее глянца. Сначала кузовной ремонт, потом цвет.
    - title: 'Руль со сработавшей подушкой'
      text: 'Без сервисной истории мы за такой руль не берёмся. Это вопрос вашей безопасности, а не косметики: сначала сервис, потом мы.'
