    intro:
      eyebrow: Why Choose Us?
      heading: Detailing is not just washing. It's surface work.
      body: There’s a significant difference between a simple wash and real detailing, measured in hours under a lamp. We measure the thickness of the clear coat, mitigate imperfections in several passes, and seal the results to last for years, not just until the first rain.
      points:
        - title: One car at a time
          text: Our bay does not become a conveyor. While your car is with us, the technician focuses solely on it.
        - title: Measuring tool, not just estimation
          text: Before polishing, we measure the clear coat across all panels. If there’s no sufficient thickness, we will be straightforward and won’t risk your paint.
        - title: Photo report at every stage
          text: You can see what happened to your car, even if you didn’t come to check in person.
    protocol:
      eyebrow: Measurements
      heading: Our thickness gauge knows more about your paint than you do
      body: Before polishing, we measure the clear coat on each panel and document the results. The protocol stays with you — along with the decision on which panel will not be treated.
      sheetTitle: Measurement Protocol
      sample: BMW 530i, 2019
      unit: μm
      thinLabel: Thin
      verdictOk: Polishing in two passes
      verdictStop: We won't cut the roof
      rows:
        - panel: Hood
          value: 132
        - panel: Roof
