          thin: true
        - panel: Front fender
          value: 124
        - panel: Front door
          value: 141
        - panel: Rear door
          value: 146
        - panel: Trunk lid
          value: 128
    servicesHead:
      eyebrow: Our Services
      heading: Four specialties, each done to the max
      body: We intentionally don’t do everything. It’s better to excel in four areas than to pretend to do twenty.
    compare:
      eyebrow: Before and After
      heading: A difference visible without a lamp
      body: 'Drag the slider. On the left — how it came in, on the right — how it left. No retouching: the same spot, same light, same camera.'
    process:
      eyebrow: How We Work
      heading: From inspection to delivery
      body: Clear and surprise-free pricing. We provide the price after the inspection, not as a guess over the phone.
      steps:
        - title: Inspection and Measurements
          text: We examine the clear coat under a lamp, measure the thickness, and discuss what is really needed and what could be unnecessary expenses.
        - title: Estimate and Timing
          text: We fix the scope of work, the price, and the delivery date. The price doesn’t increase afterward.
        - title: Preparation
          text: Two-phase wash, clay bar, and degreasing. Skipping this step means sealing dirt under the film.
        - title: Work and Delivery
          text: Film application, polishing, ceramic coating — as planned. We hand over the car in daylight and show you the result together.
    honest:
      eyebrow: Honesty
      heading: Sometimes the right answer is to walk away
      body: Refusing a job is also a result of the inspection. We inform you of these cases before you pay, not after.
      items:
        - title: Clear coat at its limit
          text: If the gauge shows critically thin clear coat, polishing is not possible — it may wear down to the primer. We’ll suggest a gentle option without removal or just a protective coating and show the measurements that explain this.
        - title: The car has been repainted already
          text: 'You cannot apply film to cheap repair paint: when removed, it will take the coating with it. First, we restore the clear coat, then return to the film.'
        - title: Dents and waves on panels
          text: Film does not hide body geometry, and matte surfaces emphasize it more than glossy. First is body repair, then color.
        - title: Steering wheel with a deployed airbag
          text: 'Without a service history, we do not take on such a steering wheel. This is a matter of your safety, not cosmetics: service first, then we.'
    materials:
      eyebrow: Materials
      heading: We work only with materials that withstand the Serbian summer
      body: 'Film and compounds are consumables you shouldn’t skimp on: cheap materials yellow in a season and come off with the clear coat. We stock only proven brands and always specify what we will use on your vehicle.'
      brands:
        - name: XPEL
          purpose: Protective Film (PPF)
        - name: SunTek
          purpose: Protective Film (PPF)
        - name: 3M
          purpose: Color Change Film
        - name: HEXIS
          purpose: Color Change Film
        - name: Gtechniq
          purpose: Ceramic Coating
        - name: Koch-Chemie
          purpose: Polishing Chemicals
    prices:
      eyebrow: Prices
      heading: Clear ranges, exact price after inspection
      body: Below are the actual price ranges in Belgrade. The final price depends on the condition of the clear coat, the size of the vehicle, and how much needs to be corrected before, not after.
      note: Prices include materials and labor. VAT is included. We provide an exact estimate after inspecting the vehicle.
      plans:
        - name: Protective Film
          price: from 690 €
          unit: front · full body — from 2,400 €
          features:
            - Template tailored to your vehicle, no seams in visible areas
            - Edge folding where possible
            - Self-healing layer
        - name: Polishing and Ceramic
          price: from 450 €
          unit: per vehicle
          features:
            - Clear coat thickness measurement on all panels
            - Two or three-step polishing
            - Ceramic coating lasting 2–5 years
            - Photo report under light before and after
        - name: Color Change
          price: from 1,900 €
          unit: full body
          features:
            - Matte, glossy, satin, and textured films
            - Removing handles, lights, and trims
            - Can be removed without damage to factory paint
            - Color samples on your car before starting
    worksHead:
      eyebrow: Our Work
      heading: Cars we've detailed
      body: Each card features a car that has been through our bay. Our own photos, no stock or third-party images.
    faq:
      - q: How long will my car be with you?
        a: Polishing with ceramic takes two to three days. Front with film takes two days. Full car wrapping takes from five days. We provide exact timing during the inspection and stick to it.
      - q: Will the film damage the factory paint?
        a: 'No, provided the paint is factory and the film is removed on time and correctly. We always check with a thickness gauge to ensure the car is not repainted: film cannot be applied to fresh or cheap repair paint, and we will inform you of this before starting.'
      - q: Can I wrap just the hood and bumper?
        a: 'Yes. Partial areas — hood, bumper, fenders, mirrors, pillars, sills — are the most common choice: they cover about 90% of the stone chips that actually happen on the road.'
      - q: What about ceramic coating in winter and at washes?
        a: Ceramic coating is not afraid of salt and brushes, but lasts longer with contactless washing using pH-neutral chemistry. Come for a free inspection of the coating once a year — we’ll advise you on whether it needs updating.
      - q: Do you restore steering wheels separately from other services?
        a: Yes, this is a standalone service. We remove the steering wheel, reupholster or repaint the leather, and reassemble it with the airbag. This usually takes two to three days.
      - q: What does the price depend on?
        a: It depends on the size of the vehicle, the condition of the paint, and the amount of preparation needed. Complex bumpers, disassembly of lights, and paint defects that need to be addressed before applying the film can increase the price. We provide a price range for your vehicle during the inspection before starting work, and it won't increase afterwards.
      - q: Protective film or color change — what should I choose?
        a: 'These are different tasks. Clear PPF preserves the original color and protects against stones and scratches — it’s chosen when you want to keep the car as it is but in good condition. Colored wraps transform the appearance: matte, satin, textured. They can also be removed without damaging the factory paint, but they are more expensive and take longer to apply — 4–7 days compared to 2–6 for PPF. There are also colored films with a protective layer — satin, which alters the appearance while protecting the paint.'
      - q: Do you work with cars that have foreign plates?
        a: Yes, we do this quite often. No additional documents are needed for detailing — just come as you are.
    finalCta:
      eyebrow: Register Now
      heading: Show us your car — it gets easier from here
      body: Come for an inspection or send a photo via messenger. We'll honestly tell you what needs to be done and what can be skipped.
      cta: Submit an Inquiry
