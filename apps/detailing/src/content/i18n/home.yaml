    meta:
      title: 'Car Detailing in Belgrade: PPF, Polish, Ceramic | Details'
      description: Belgrade detailing studio. PPF, colour-change wraps, machine polishing with ceramic coating, and steering-wheel leather restoration. Results you can see up close.
