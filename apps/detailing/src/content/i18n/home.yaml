      heading: Cars we’ve worked on
      body: Each card represents a car that spent time in our box. Our own photographs, no stock or third-party images.
    faq:
      - q: How long will my car be with you?
        a: Polishing with ceramic takes two to three days. Front protection film — two days. Full body wrap — from five days. We provide the exact timeline during the inspection and stick to it.
      - q: Will the film damage the factory paint?
        a: 'No, if the paint is factory and the film is removed on time and properly. We always check with a thickness gauge if the car has been repainted: film cannot be applied to fresh or cheap repair paint, and we’ll communicate this before starting work.'
      - q: Can I wrap just the hood and bumper?
        a: 'Yes. Partial zones — hood, bumper, fenders, mirrors, pillars, sills — are the most common option: they cover about 90% of the stone chips that typically happen on the highway.'
      - q: What about ceramic in winter and at washes?
        a: Ceramic is not afraid of salt and brushes but lasts longer with touchless washes using pH-neutral chemicals. Come once a year for a free inspection of the coating — we’ll let you know if a refresh is needed.
      - q: Do you offer steering wheel restoration separately?
        a: Yes, it's a standalone service. We remove the wheel, reupholster or repaint the leather, and reassemble it with the airbag. Usually takes two to three days.
      - q: What determines the price?
        a: The size of the body, the condition of the lacquer, and the amount of preparation needed. Prices go up with complex bumpers, disassembly of optics, and lacquer defects that need fixing before applying the film. We provide a price range based on your car during the inspection, before any work begins, and that price remains fixed.
      - q: Should I choose protective film or a color change?
        a: "These serve different purposes. Clear PPF preserves the factory color and absorbs stone chips and scratches — it's chosen when you want to keep the car the way it is but intact. Colored film changes the look: matte, satin, texture. It can also be removed without damaging the factory paint, but it’s pricier and takes longer to apply — 4–7 days versus 2–6. There are colored films with a protective layer too — satin that changes the look and protects the lacquer."
      - q: Do you work with cars with foreign plates?
        a: Yes, and quite often. No additional documents are needed for detailing — come as you are.
    finalCta:
      eyebrow: Get in Touch
      heading: Show us your car — the rest is easy
      body: Come for an inspection or send photos via messenger. We’ll be honest about what’s necessary and what can wait.
