    faq:
      - q: How long will my car be with you?
        a: Polishing with ceramics takes two to three days. The front section wrapped takes two days. Full body wrap from five days. We provide an exact timeframe during inspection and adhere to it.
      - q: Will the film ruin the factory paint?
        a: 'No, if the paint is original and the film is removed on time and correctly. We always check with a thickness gauge to ensure the car hasn’t been repainted: we can’t apply film on fresh or cheap repair paint, and we will mention this before starting work.'
      - q: Can I wrap just the hood and bumper?
        a: 'Yes, it can. Partial zones (hood, bumper, fenders, mirrors, pillars, sills) are the most common option: it covers 90% of rock impact, which often occurs on the road.'
      - q: What about ceramic in winter and at washes?
        a: Ceramics are resistant to salt and brushes but last longer with touchless washing and pH-neutral chemicals. Once a year, come for a free coating inspection, and we’ll advise if an update is needed.
      - q: Do you restore steering wheels separately?
        a: Yes, this is a standalone service. We remove the steering wheel, re-stitch or repaint the leather, and reassemble it with the airbag. It usually takes two to three days.
      - q: What determines the price?
        a: It depends on the size of the body, paint condition, and the amount of preparation required. Complicated bumpers, disassembly of optics, and paint defects that need fixing before film application increase costs. We provide a range for your car immediately during the inspection, before starting work, and it won’t rise thereafter.
      - q: 'Protective film or color change: which to choose?'
        a: 'These are different tasks. Transparent PPF preserves the factory color and takes on stones and scratches; it’s selected when you want to keep the car as it is, but intact. Color film changes the appearance: matte, satin, texture. It also removes without harming the factory paint, but it costs more and takes longer to apply: 4–7 days versus 2–6. There are colored films with a protective layer, like satin, which change the look and protect the paint.'
      - q: Do you work with vehicles that have foreign plates?
        a: Yes, and quite often. No additional documents are needed for detailing; just come as you are.
