    intro:
      eyebrow: Why choose us
      heading: Detailing is not washing. It’s working with surfaces.
      body: There’s a significant difference in hours spent under the lamp between just ‘washed and polished’ and true detailing. We measure paint thickness, mitigate risks across multiple passes, and lock in results that last for years, not just until the next rain.
      points:
        - title: One car at a time
          text: Our box doesn’t turn into an assembly line. While your car is with us, the master is focused solely on it.
        - title: Thickness gauge, not 'by eye'
          text: Before polishing, we measure paint thickness on all panels. If there isn't enough thickness, we’ll be upfront and won’t risk damaging your paint.
        - title: Photo report for every stage
          text: You’ll see what’s happening to your car, even if you’re not present.
