    process:
      eyebrow: How we work
      heading: From inspection to handover
      body: Clear and without surprises in the bill. We quote the price after inspection, not randomly over the phone.
      steps:
        - title: Inspection and measurements
          text: We check the paint under the lights, measure thickness, and discuss what’s actually needed and what might waste your money.
        - title: Quote and timeline
          text: We fix the scope of work, price, and handover date. After that, the price won’t increase.
        - title: Preparation
          text: Two-step wash, clay bar treatment, degreasing. Skipping this step means sealing dirt under the film.
        - title: Work and handover
          text: Film, polishing, ceramic coating — as planned. We hand over the car in daylight and show you the results together.
    honest:
      eyebrow: Honesty
      heading: Sometimes the right answer is to walk away
      body: Declining work is also a result of inspection. We notify you in these cases before you pay, not after.
      items:
        - title: Paint at its limit
          text: If the thickness gauge shows critically thin paint, polishing is not an option — it could scrub down to the primer. We’ll suggest a gentle option without removing or just a protective coating and show you measurements that prove it.
        - title: Car already repainted
          text: "You can't put film over cheap repair paint: removing it will take the coating with it. First, we bring the paint up to standard, then we’ll return to the film."
        - title: Dents and waves on panels
          text: Film does not hide the shapes of the body, and matte finishes accentuate them more than gloss. First bodywork repair, then color.
        - title: Steering wheel with deployed airbag
          text: "Without service history, we won't take on such a wheel. This is a matter of your safety, not just cosmetics: first service, then us."
    materials:
      eyebrow: Materials
      heading: We only work with what withstands the Serbian summer
      body: 'Film and compounds are consumables where you cannot cut corners: cheap materials yellow within a season and peel off with the paint. We keep a stock of trusted brands and always disclose what we’ll use on your car.'
