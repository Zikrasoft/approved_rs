      eyebrow: Radovi
      heading: Automobili koje smo radili
      body: Svaki prikazani automobil bio je u našem boksu. Naše fotografije, bez stock fotografija i tuđih snimaka.
    faq:
      - q: Koliko dugo će automobil biti kod vas?
        a: Poliranje s keramičkom zaštitom traje dva do tri dana. Zaštitna folija na prednjem delu traje dva dana. Kompletno oblepljivanje karoserije traje najmanje pet dana. Tačan rok dogovaramo na pregledu i držimo ga se.
      - q: Da li će folija oštetiti fabričku boju?
        a: Ne, ako je boja fabrička i folija se skine na vreme i pravilno. Uvek proveravamo meračem debljine da li je automobil prefarban. Folija ne sme da se postavlja na sveže ili jeftino reparirane površine i to ćemo vam reći pre početka radova.
      - q: Može li da se oblepe samo hauba i branik?
        a: Može. Delimična zaštita haube, branika, krila, retrovizora, stubova i pragova najčešći je izbor. Ona štiti od 90% udaraca kamenčića koji se zaista dešavaju na putu.
      - q: Šta je s keramičkom zaštitom zimi i na autopraonicama?
        a: Keramička zaštita podnosi so i četke, ali duže traje ako se automobil pere beskontaktno, pH-neutralnim sredstvima. Jednom godišnje dođite na besplatan pregled zaštite, pa ćemo vam reći da li je potrebno osvežavanje.
      - q: Da li restaurirate volan i zasebno?
        a: Da, to je samostalna usluga. Skidamo volan, presvlačimo kožu ili je bojimo, pa ga vraćamo na mesto zajedno sa vazdušnim jastukom. Obično traje dva do tri dana.
      - q: Od čega zavisi cena?
        a: Od veličine karoserije, stanja laka i obima pripreme. Složeni branici, demontaža svetala i oštećenja laka koja treba ukloniti pre postavljanja folije povećavaju cenu. Okvirnu cenu za vaš automobil saopštavamo odmah na pregledu, pre početka radova, i ona se kasnije ne menja.
      - q: 'Zaštitna folija ili promena boje: šta da izaberem?'
        a: 'Reč je o različitim rešenjima. Providna PPF folija čuva fabričku boju i štiti od kamenčića i ogrebotina. Biraju je oni koji žele da zadrže postojeći izgled automobila, ali da ga zaštite. Folija u boji menja izgled: mat, saten ili tekstura. Može da se ukloni bez oštećenja fabričkog laka, ali je skuplja i postavlja se duže: 4-7 dana, u poređenju sa 2-6 dana. Dostupne su i folije u boji sa zaštitnim slojem, na primer satenske, koje istovremeno menjaju izgled i štite lak.'
      - q: Da li radite automobile sa stranim registarskim tablicama?
        a: Da, i to prilično često. Za detailing nisu potrebna nikakva dodatna dokumenta, dođite kao što jeste.
    finalCta:
      eyebrow: Zakažite termin
      heading: Pokažite nam automobil, posle je sve lakše
      body: Dođite na pregled ili nam pošaljite fotografije putem aplikacije za dopisivanje. Iskreno ćemo vam reći šta treba uraditi, a šta možete da preskočite.
      cta: Pošaljite upit
