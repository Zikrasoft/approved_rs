    faq:
      - q: How long will my car be with you?
        a: Polishing with ceramic takes two to three days. Front with film takes two days. Full body wrap takes at least five days. We’ll provide a precise timeline during the inspection.
      - q: Will the film damage the factory paint?
        a: 'No, as long as the paint is factory and the film is removed on time and correctly. We always check with a thickness gauge to see if the car has been repainted: film should not be applied to fresh or cheap repair paint, and we’ll inform you of this before starting any work.'
      - q: Can I wrap just the hood and bumper?
        a: 'Yes, partial areas — hood, bumper, fenders, mirrors, pillars, thresholds — are the most common options: covering 90% of stone chips that actually occur on the road.'
      - q: What about ceramic in winter and at car washes?
        a: Ceramic coatings are resistant to salt and brushes, but they last longer with contactless washes using pH-neutral chemicals. Come in for a free inspection once a year — we’ll let you know if an update is necessary.
      - q: Do you offer steering wheel restoration separately?
        a: Yes, this is a standalone service. We remove the steering wheel, reupholster or repaint the leather, and reassemble it with the airbag. This usually takes two to three days.
      - q: What determines the price?
        a: It depends on the body size, the condition of the paint, and the amount of preparation needed. Prices go up for complex bumpers, disassembly of lights, and paint defects that must be fixed before applying film. We provide a price range for your vehicle immediately during the inspection, before work begins, and it won’t increase afterward.
      - q: Protective film or color change — what should I choose?
        a: "These serve different purposes. Clear PPF preserves the factory color and protects against rocks and scratches — it's ideal if you want to keep the car looking new. Color wraps change the appearance: matte, satin, or textured. They can also be removed without damaging the factory paint, but they are more expensive and take longer to apply — 4 to 7 days compared to 2 to 6. There are also colored films with a protective layer — satin, which changes the look while protecting the paint."
      - q: Do you work with cars with foreign license plates?
        a: Yes, quite often. No additional documents are required for detailing — just come as you are.
