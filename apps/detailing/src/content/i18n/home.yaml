    intro:
      eyebrow: Why choose us
      heading: Detailing is more than washing. It's about surface treatment.
      body: There’s a world of difference between 'washed and wiped' and true detailing, taking hours under proper light. We measure paint thickness, address imperfections through multiple passes, and seal the results to last for years, not just until the first rain.
      points:
        - title: One car at a time
          text: Our box doesn’t turn into an assembly line. While your car is with us, the master is focused solely on it.
        - title: Thickness gauge, not 'by eye'
          text: We measure paint thickness across all panels before polishing. If there's not enough clear coat, we’ll be upfront about it and won’t risk your paint.
        - title: Photo report at every stage
          text: You’ll see what’s happening to your car, even if you’re not present.
