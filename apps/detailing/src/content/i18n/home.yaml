    worksHead:
      eyebrow: Naši radovi
      heading: Automobili koji su prošli kroz naš studio
      body: Svaka kartica prikazuje automobil koji je bio u našem boksu. Naše fotografije, bez stock slika i tuđih kadrova.
    faq:
      - q: Koliko dugo automobil ostaje kod vas?
        a: Poliranje sa keramičkom zaštitom traje dva do tri dana. Postavljanje folije na prednji deo traje dva dana. Oblaganje cele karoserije traje najmanje pet dana. Tačan rok dajemo na pregledu i poštujemo ga.
      - q: Da li folija oštećuje fabričku boju?
        a: 'Ne, ako je boja fabrička, a folija se skine na vreme i pravilno. Meračem debljine laka uvek proveravamo da li je automobil prefarban: folija se ne postavlja na svež ili nekvalitetan reparaturni lak. Na to ćemo vam ukazati pre početka radova.'
      - q: Može li folija samo na haubu i branik?
        a: 'Može. Zaštita pojedinih delova, poput haube, branika, krila, retrovizora, stubova i pragova, najčešći je izbor: pokriva mesta koja prime 90% udaraca kamenčića na autoputu.'
      - q: Kako se keramika ponaša zimi i u perionicama?
        a: Keramički premaz je otporan na so i četke, ali duže traje uz beskontaktno pranje pH-neutralnim sredstvima. Jednom godišnje svratite na besplatnu kontrolu premaza, reći ćemo vam da li ga treba obnoviti.
      - q: Da li restauraciju volana radite i kao zasebnu uslugu?
        a: Da, to je zasebna usluga. Skidamo volan, menjamo ili farbamo kožu, pa ga vraćamo zajedno sa vazdušnim jastukom. Obično je potrebno dva do tri dana.
      - q: Od čega zavisi cena?
        a: Od veličine karoserije, stanja laka i potrebne pripreme. Cenu povećavaju branici složenog oblika, demontaža farova i oštećenja laka koja treba sanirati pre postavljanja folije. Raspon cene za vaš automobil dobijate odmah na pregledu, pre početka radova, i on se kasnije ne povećava.
      - q: 'Zaštitna folija ili promena boje: šta izabrati?'
        a: 'To su dve različite namene. Providna PPF folija čuva fabričku boju i štiti od udaraca kamenčića i ogrebotina. Birate je kada želite da automobil zadrži svoj izgled, a lak ostane neoštećen. Folija u boji menja izgled: mat, saten ili tekstura. I ona se skida bez oštećenja fabričkog laka, ali košta više i postavljanje traje duže: 4–7 dana umesto 2–6. Postoje i folije u boji sa zaštitnim slojem, recimo sa satenskom završnicom, koje istovremeno menjaju izgled i štite lak.'
      - q: Da li radite i automobile sa stranim tablicama?
        a: Da, i to prilično često. Za detailing nisu potrebna nikakva dodatna dokumenta, samo dovezite automobil.
    finalCta:
      eyebrow: Zakazivanje
      heading: Pokažite nam automobil, ostalo je lako
      body: Dođite na pregled ili nam pošaljite fotografije putem poruke. Iskreno ćemo vam reći šta treba uraditi, a šta možete da preskočite.
      cta: Pošaljite upit
  en:
    meta:
      title: 'Car Detailing Belgrade: PPF, Polish & Ceramic | Details'
      description: Premium car detailing in Belgrade. PPF, colour-change wraps, polishing with ceramic coating and steering-wheel restoration. Quality that stands up to a close look.
    hero:
      eyebrow: Detailing studio · Belgrade
      titleTop: A car you'll
      titleAccent: be proud
      titleBottom: to show up close
      lead: Paint protection film, colour-change wraps, polishing with ceramic coating and leather restoration. One bay, one specialist per car, and no rushing.
