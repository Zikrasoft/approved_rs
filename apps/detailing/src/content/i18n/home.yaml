    intro:
      eyebrow: Why choose us
      heading: Detailing isn't a car wash. It's surface care.
      body: The difference between a quick wash and real detailing is hours under the inspection lights. We measure paint thickness, remove defects in several passes, then protect the finish so it lasts for years, not just until the first rain.
      points:
        - title: One car at a time
          text: Our bay isn't a production line. While your car is with us, your detailer works only on it.
        - title: Paint gauge, not guesswork
          text: We measure paint thickness across every panel before polishing. If there's not enough paint to work with, we'll tell you and won't risk your finish.
        - title: Photos at every stage
          text: You'll see what we did to your car, even if you couldn't visit during the work.
    protocol:
      eyebrow: Measurements
      heading: A paint gauge knows more about your finish than you do
      body: Before polishing, we measure the paint on every panel and record the results. You keep the report, along with our recommendation on which panels we should leave untouched.
      sheetTitle: Paint thickness report
      sample: BMW 530i, 2019
      unit: µm
      thinLabel: Thin
      verdictOk: Two-stage polish
      verdictStop: No cutting the roof
