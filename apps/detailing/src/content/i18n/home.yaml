    intro:
      eyebrow: Why us
      heading: Detailing is not just washing. It’s surface work.
      body: There’s a vast difference between a quick wash and authentic detailing, often taking hours under the lamp. We measure paint thickness, eliminate imperfections over multiple passes, and seal results to last for years, not just until the first rain.
      points:
        - title: One car at a time
          text: Our box doesn’t turn into a conveyor belt. While your car is with us, the master focuses solely on it.
        - title: Thickness gauge, not just eye measurement
          text: Before polishing, we measure paint thickness on all panels. If it’s too thin, we’ll be direct and won’t risk your paint.
        - title: Photo report at each stage
          text: You can see what happened to your car, even if you didn’t come to check in person.
    protocol:
      eyebrow: Measurements
      heading: The thickness gauge knows more about your paint than you do
      body: Before polishing, we measure paint thickness on each panel and document the results. The protocol stays with you, along with the decision about which panel we won’t touch.
