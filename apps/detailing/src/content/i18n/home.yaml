  eyebrow: Что мы делаем
  heading: Четыре направления, в каждом — до конца
  body: Мы сознательно не берём всё подряд. Лучше делать четыре вещи на уровне, чем двадцать «тоже умеем».
compare:
  eyebrow: До и после
