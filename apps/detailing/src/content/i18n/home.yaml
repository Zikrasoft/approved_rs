      heading: Detailing is not just washing. It’s surface treatment.
      body: There’s a world of difference between a simple wash and true detailing — hours under the lamp. We measure lacquer thickness, reduce risks through multiple passes, and seal results so they last for years, not just until the first rain.
      points:
        - title: One car at a time
