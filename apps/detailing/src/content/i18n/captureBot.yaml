greeting: Здравствуйте! Спасибо, что написали. Мы уже видим ваше обращение и скоро ответим.
lookingFor: Расскажите, какая у вас машина и что хотелось бы сделать (оклейка пленкой, полировка, керамика или что-то другое).
phoneAsk: У вас в Telegram нет имени пользователя (username), поэтому менеджер не сможет вам написать. Оставьте номер телефона, чтобы мы могли связаться.
phoneButton: 📱 Поделиться номером
thanks: Спасибо! Передали менеджеру, он скоро с вами свяжется.
received: Приняли, менеджер увидит ваше сообщение.
menu:
  text: Чем можем помочь? Выберите, что вас интересует.
  back: « Назад
services:
  button: Услуги
  text: Вот что мы делаем в студии. Выберите услугу, и мы покажем цену, сроки и что входит.
card:
  request: 📝 Оставить заявку
  site: Подробнее на сайте
contacts:
  button: Контакты
  text: Мы в Белграде, ждем вас в студии.
  hours: Пн–Сб, 09:00–19:00
manager:
  button: 👤 Написать менеджеру
  text: Напишите ваш вопрос одним сообщением, менеджер ответит здесь же.
  handoff: Менеджер на связи в Telegram. Нажмите, чтобы открыть чат.
  chat: Открыть чат с менеджером ↗
partners:
  button: Партнеры
  text: Наши партнеры. Выберите, кому написать.
request:
  button: 📝 Оставить заявку
  car: Какая у вас машина? Напишите марку, модель и год.
  service: Что хотите сделать с машиной? Отметьте одну или несколько услуг или напишите своими словами.
  done: Готово →
  unsure: Не знаю, нужна консультация
language:
  button: 🌐 Язык
  text: Выберите язык, на котором вам удобнее общаться.
profile:
  description: 'Детейлинг-студия в Белграде: оклейка пленкой, полировка, керамика. Нажмите «Старт» и расскажите, что хотите сделать с машиной, менеджер ответит здесь же. Удобнее без бота? Напишите менеджеру напрямую: {manager}'
  shortDescription: 'Детейлинг-студия в Белграде: пленка, полировка, керамика. Менеджер: {manager}'
  menuCommand: Главное меню
  langCommand: Сменить язык
