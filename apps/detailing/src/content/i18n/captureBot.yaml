greeting: Здравствуйте! Спасибо, что написали — мы уже видим ваше обращение и скоро ответим.
lookingFor: Расскажите, какая у вас машина и что хотелось бы сделать — оклейка плёнкой, полировка, керамика или что-то другое.
phoneAsk: У вас в Telegram нет имени пользователя (username), поэтому менеджер не сможет вам написать. Оставьте номер телефона, чтобы мы могли связаться.
phoneButton: 📱 Поделиться номером
thanks: Спасибо! Передали мастеру — он скоро с вами свяжется.
received: Приняли, мастер увидит ваше сообщение.
menu:
  text: Чем можем помочь? Выберите, что вас интересует.
  back: « Назад
services:
  button: Услуги
  text: Вот что мы делаем в студии. Выберите услугу — покажем цену, сроки и что входит.
card:
  request: 📝 Оставить заявку
  site: Подробнее на сайте
contacts:
  button: Контакты
  text: Мы в Белграде, ждём вас в студии.
  hours: Пн–Сб, 09:00–19:00
manager:
  button: 👤 Написать мастеру
  text: Напишите ваш вопрос одним сообщением — мастер ответит здесь же.
  handoff: Мастер на связи в Telegram — нажмите, чтобы открыть чат.
  chat: Открыть чат с мастером ↗
partners:
  button: Партнёры
  text: Наши партнёры — выберите, кому написать.
request:
  button: 📝 Оставить заявку
  car: Какая у вас машина? Напишите марку, модель и год.
  service: Что хотите сделать с машиной? Отметьте одну или несколько услуг — или напишите своими словами.
  done: Готово →
  unsure: Не знаю, нужна консультация
language:
  button: 🌐 Язык
  text: Выберите язык, на котором вам удобнее общаться.
profile:
  description: Детейлинг-студия в Белграде — оклейка плёнкой, полировка, керамика. Нажмите «Старт» — расскажите, что хотите сделать с машиной, и мастер ответит здесь же.
  shortDescription: Детейлинг-студия в Белграде — плёнка, полировка, керамика
  menuCommand: Главное меню
  langCommand: Сменить язык
