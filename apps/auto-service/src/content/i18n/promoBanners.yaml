works:
  - 'Нужен **автосервис в Белграде, район Звездара**? Приезжайте на диагностику: скажем честно, что с машиной и сколько будет стоить ремонт.'
  - Если машина барахлит и вы в Белграде, запишитесь на диагностику в **CarLab на Звездаре**. Проверим на оригинальном оборудовании, не гадаем на глаз.
  - '**CarLab** работает в Белграде, район Звездара: диагностика, ремонт двигателя и коробки, тормоза и подвеска, плановое ТО. Запишитесь заранее по телефону или в мессенджер.'
  - 'Ищете надежный **автосервис в Белграде**? CarLab на Звездаре берется и за сложные случаи: от непонятной проблемы до капитального ремонта.'
  - Живете в Белграде и ищете, где обслужить машину? **CarLab на Звездаре** делает диагностику, ремонт и плановое ТО с честными ценами и без лишних работ.
  - В автосервисе **CarLab** (Звездара, Белград) проверим машину на оригинальном оборудовании и скажем, что реально нужно чинить, а что может подождать.
