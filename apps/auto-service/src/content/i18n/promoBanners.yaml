translations:
  sr:
    works:
      - 'Treba vam **autoservis u Beogradu, naselje Zvezdara**? Dođite na dijagnostiku: iskreno ćemo vam reći šta je sa vašim automobilom i koliko će koštati popravka.'
      - Ako vam automobil ne radi kako treba i nalazite se u Beogradu, rezervišite dijagnostiku u **CarLab-u na Zvezdari**. Proverićemo na originalnoj opremi, ne nagađamo.
      - '**CarLab** radi u Beogradu, naselje Zvezdara: dijagnostika, popravka motora i menjača, kočnice i suspenzija, redovni servis. Rezervišite unapred telefonom ili putem mesendžera.'
      - 'Tražite pouzdan **autoservis u Beogradu**? CarLab na Zvezdari se bavi i komplikovanim slučajevima: od neobjašnjivih problema do generalnog popravka.'
      - Živite u Beogradu i tražite gde da servisirate automobil? **CarLab na Zvezdari** obavlja dijagnostiku, popravku i redovni servis sa poštenim cenama i bez nepotrebnog rada.
      - U autoservisu **CarLab** (Zvezdara, Beograd) proverićemo automobil na originalnoj opremi i reći šta zaista treba popraviti, a šta može da sačeka.
  en:
    works:
      - "Need a **car service in Belgrade, Zvezdara district**? Come for diagnostics: we'll be honest about what's wrong with your car and how much the repairs will cost."
      - Is your car acting up and you're in Belgrade? Schedule a diagnostic at **CarLab in Zvezdara**. We'll check it with original equipment—we don't just guess.
      - '**CarLab** operates in Belgrade, Zvezdara district: diagnostics, engine and gearbox repairs, brakes and suspension, scheduled servicing. Book in advance by phone or messenger.'
      - 'Looking for a reliable **car service in Belgrade**? CarLab in Zvezdara takes on tough cases: from vague problems to major repairs.'
      - Living in Belgrade and looking for a place to service your car? **CarLab in Zvezdara** offers diagnostics, repairs, and scheduled servicing with honest prices and no unnecessary work.
      - At **CarLab** (Zvezdara, Belgrade), we'll check your car with original equipment and tell you what truly needs fixing and what can wait.
