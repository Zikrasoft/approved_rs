translations:
  sr:
    works:
      - 'Treba vam **autoservis u Beogradu, oblast Zvezdara**? Dođite na dijagnostiku: da budemo iskreni, znamo šta je problem sa vašim automobilom i koliko će koštati popravka.'
      - Ako vaš automobil pravi probleme i nalazite se u Beogradu, zakazujte dijagnostiku u **CarLab na Zvezdari**. Proverićemo na originalnoj opremi, bez nagađanja.
      - '**CarLab** radi u Beogradu, oblast Zvezdara: dijagnostika, popravka motora i menjača, kočnice i suspenzija, redovno održavanje. Zakazujte unapred putem telefona ili u mesendžeru.'
      - 'Tražite pouzdan **autoservis u Beogradu**? CarLab na Zvezdari se bavi i složenim slučajevima: od neobjašnjivih problema do generalnog popravka.'
      - Živite u Beogradu i tražite gde da servisirate automobil? **CarLab na Zvezdari** vrši dijagnostiku, popravke i redovno održavanje po poštenim cenama, bez suvišnih radova.
      - U autoservisu **CarLab** (Zvezdara, Beograd) proverićemo vaš automobil na originalnoj opremi i reći šta zaista treba popraviti, a šta može da sačeka.
  en:
    works:
      - "Need a **car service in Belgrade, Zvezdara district**? Come in for a diagnostic: let's be honest about what's wrong with your car and how much the repair will cost."
      - Is your car acting up and you're in Belgrade? Book a diagnostic at **CarLab in Zvezdara**. We'll check it with original equipment, no guessing.
      - '**CarLab** operates in Belgrade, Zvezdara district: diagnostics, engine and gearbox repairs, brakes and suspension, scheduled servicing. Schedule an appointment by phone or messenger.'
      - 'Looking for a reliable **car service in Belgrade**? CarLab in Zvezdara handles complex cases: from baffling issues to major repairs.'
      - Living in Belgrade and looking to service your car? **CarLab in Zvezdara** offers diagnostics, repairs, and scheduled servicing at honest prices without unnecessary work.
      - At **CarLab** (Zvezdara, Belgrade), we'll check your car with original equipment and tell you what's actually needed for repairs and what can wait.
