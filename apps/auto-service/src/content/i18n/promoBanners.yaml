translations:
  sr:
    works:
      - 'Potreban vam je **autoservis u Beogradu, na Zvezdari**? Dođite na dijagnostiku: iskreno ćemo vam reći šta nije u redu s automobilom i koliko će popravka koštati.'
      - Ako vam automobil pravi probleme, a u Beogradu ste, zakažite dijagnostiku u **servisu CarLab na Zvezdari**. Proveravamo originalnom dijagnostičkom opremom, ne nagađamo.
      - '**CarLab** je servis u Beogradu, na Zvezdari: dijagnostika, popravka motora i menjača, kočnice i trap, redovno održavanje. Zakažite unapred telefonom ili porukom.'
      - 'Tražite pouzdan **autoservis u Beogradu**? CarLab na Zvezdari rešava i složene kvarove: od problema kojima je teško naći uzrok do generalne popravke.'
      - Živite u Beogradu i tražite gde da servisirate automobil? **CarLab na Zvezdari** nudi dijagnostiku, popravke i redovno održavanje po poštenim cenama, bez nepotrebnih radova.
      - U autoservisu **CarLab** (Zvezdara, Beograd) proverićemo vaš automobil originalnom dijagnostičkom opremom i reći vam šta zaista treba popraviti, a šta može da sačeka.
  en:
    works:
      - Need a **car service in Zvezdara, Belgrade**? Bring your car in for diagnostics. We'll give you an honest assessment of what's wrong and how much the repairs will cost.
      - Car playing up in Belgrade? Book a diagnostic check at **CarLab in Zvezdara**. We use manufacturer diagnostic equipment, not guesswork.
      - '**CarLab** in Zvezdara, Belgrade offers diagnostics, engine and gearbox repairs, brake and suspension work, and scheduled servicing. Book ahead by phone or message.'
      - Looking for a reliable **car service in Belgrade**? CarLab in Zvezdara tackles the tough jobs too, from hard-to-pinpoint faults to full rebuilds.
      - Live in Belgrade and need somewhere to service your car? **CarLab in Zvezdara** offers diagnostics, repairs and scheduled servicing at honest prices, with no unnecessary work.
      - At **CarLab** in Zvezdara, Belgrade, we'll check your car with manufacturer diagnostic equipment and tell you what really needs fixing and what can wait.
