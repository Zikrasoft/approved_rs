translations:
  sr:
    works:
      - 'Treba vam **autoseris u Beogradu, deo Zvezdara**? Dođite na dijagnostiku: recimo iskreno, šta je sa autom i koliko će koštati popravka.'
      - Ako auto pravi probleme i nalazite se u Beogradu, zakažite dijagnostiku u **CarLab na Zvezdari**. Proverićemo na originalnoj opremi, ne nagađamo.
      - '**CarLab** radi u Beogradu, deo Zvezdara: dijagnostika, popravka motora i menjača, kočnice i suspenzija, redovni servisi. Zakažite unapred putem telefona ili u messengeru.'
      - 'Tražite pouzdan **autoseris u Beogradu**? CarLab na Zvezdari se prihvata i složenih slučajeva: od nejasnog problema do generalne popravke.'
      - Živite u Beogradu i tražite gde da servisirate auto? **CarLab na Zvezdari** radi dijagnostiku, popravku i redovne servise sa poštenim cenama i bez suvišnih radova.
      - U autoserisu **CarLab** (Zvezdara, Beograd) proverićemo auto na originalnoj opremi i reći šta je stvarno potrebno popraviti, a šta može da sačeka.
  en:
    works:
      - "Need a **car service in Belgrade, Zvezdara district**? Come in for a diagnostic: let's be honest about what's wrong with your vehicle and how much the repair will cost."
      - Is your car acting up and you're in Belgrade? Book a diagnostic at **CarLab in Zvezdara**. We'll check it with original equipment, no guessing here.
      - '**CarLab** operates in Belgrade, Zvezdara district: diagnostics, engine and gearbox repairs, brakes and suspension, routine maintenance. Schedule in advance by phone or messenger.'
      - 'Looking for a reliable **car service in Belgrade**? CarLab in Zvezdara handles even the tough cases: from unclear issues to major repairs.'
      - Living in Belgrade and searching for a place to service your car? **CarLab in Zvezdara** offers diagnostics, repairs, and routine maintenance with honest pricing and no unnecessary work.
      - At **CarLab** (Zvezdara, Belgrade), we will check your car with original equipment and inform you about what really needs fixing and what can wait.
