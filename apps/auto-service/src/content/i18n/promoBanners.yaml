translations:
  sr:
    works:
      - 'Trebate **autoservis u Beogradu, okrug Zvezdara**? Dođite na dijagnostiku: da budemo iskreni, reći ćemo šta je s autom i koliko će koštati popravka.'
      - Ako auto ima problema i nalazite se u Beogradu, zakazujte dijagnostiku u **CarLab na Zvezdari**. Proverićemo na originalnoj opremi, ne pogađamo.
      - '**CarLab** radi u Beogradu, okrug Zvezdara: dijagnostika, popravka motora i menjača, kočnice i suspenzija, redovno održavanje. Zakazujte unapred telefonom ili putem messengera.'
      - 'Tražite pouzdan **autoservis u Beogradu**? CarLab na Zvezdari se bavi i složenim slučajevima: od nejasnog problema do generalne popravke.'
      - Živite u Beogradu i tražite gde da servisirate auto? **CarLab na Zvezdari** obavlja dijagnostiku, popravke i redovno održavanje po poštenim cenama i bez suvišnih radova.
      - U autoservisu **CarLab** (Zvezdara, Beograd) proverićemo auto na originalnoj opremi i reći ćemo šta stvarno treba popraviti, a šta može da sačeka.
  en:
    works:
      - "Need a **car service in Belgrade, Zvezdara district**? Come in for a diagnostics check: we'll tell you honestly what's wrong with your car and how much the repair will cost."
      - If your car is acting up and you're in Belgrade, book a diagnostics check at **CarLab in Zvezdara**. We'll assess it with original equipment, no guesswork.
      - '**CarLab** operates in Belgrade, Zvezdara district: diagnostics, engine and gearbox repairs, brakes and suspension, scheduled servicing. Make an appointment in advance by phone or messenger.'
      - 'Looking for a reliable **car service in Belgrade**? CarLab in Zvezdara can handle complex issues: from unclear problems to major repairs.'
      - Living in Belgrade and searching for a place to service your car? **CarLab in Zvezdara** offers diagnostics, repairs, and scheduled servicing with honest prices and no unnecessary work.
      - At **CarLab** (Zvezdara, Belgrade), we'll check your car using original equipment and let you know what really needs fixing and what can wait.
