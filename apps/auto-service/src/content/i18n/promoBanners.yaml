translations:
  sr:
    works:
      - 'Potrebna vam je **autopopravka u Beogradu, okrug Zvezdara**? Dođite na dijagnostiku: reći ćemo vam iskreno šta nije u redu sa automobilom i koliko će koštati popravka.'
      - Ako auto pravi probleme i nalazite se u Beogradu, prijavite se na dijagnostiku u **CarLab na Zvezdari**. Proverićemo na originalnoj opremi, ne nagađamo.
      - '**CarLab** posluje u Beogradu, okrug Zvezdara: dijagnostika, popravka motora i menjača, kočnice i suspenzija, planirano održavanje. Prijavite se unapred putem telefona ili u poruci.'
      - 'Tražite pouzdanu **autopopravku u Beogradu**? CarLab na Zvezdari se bavi i složenim slučajevima: od nejasnog problema do generalne popravke.'
      - Živite u Beogradu i tražite gde da servisirate automobil? **CarLab na Zvezdari** radi dijagnostiku, popravke i planirano održavanje sa poštenim cenama i bez suvišnih radova.
      - U servisu **CarLab** (Zvezdara, Beograd) proverićemo auto na originalnoj opremi i reći ćemo vam šta stvarno treba da se popravi, a šta može da sačeka.
  en:
    works:
      - "Need a **car service in Belgrade, Zvezdara district**? Come in for diagnostics: we'll be honest about what's wrong with your car and how much the repairs will cost."
      - If your car is acting up and you're in Belgrade, book a diagnostics appointment at **CarLab in Zvezdara**. We check it with original equipment, no guessing involved.
      - '**CarLab** operates in Belgrade, Zvezdara district: diagnostics, engine and gearbox repairs, brakes and suspension, scheduled maintenance. Book in advance by phone or messenger.'
      - 'Looking for a reliable **car service in Belgrade**? CarLab in Zvezdara can handle even complex cases: from obscure issues to major repairs.'
      - Live in Belgrade and looking for a place to service your car? **CarLab in Zvezdara** offers diagnostics, repairs, and scheduled maintenance with honest prices and no unnecessary work.
      - At **CarLab** (Zvezdara, Belgrade), we'll check your car with original equipment and let you know what truly needs fixing and what can wait.
