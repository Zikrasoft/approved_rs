    commentLabel: Napomena uz porudžbinu (nije obavezno)
    commentPlaceholder: Na primer, kada vam odgovara preuzimanje
    submitLabel: Pošalji porudžbinu
    consentError: Bez saglasnosti ne možemo da prihvatimo porudžbinu
    submitError: Porudžbina nije poslata. Proverite vezu i pokušajte ponovo
    submitErrorContacts: 'Ili pošaljite porudžbinu putem WhatsApp-a, spisak je već u poruci. Možete nas i pozvati ili nam pisati preko druge aplikacije:'
    orderMessage: 'Dobar dan! Želim da poručim:'
    checkoutBlocked: 'Trenutno nije moguće kupiti: {names}. Uklonite stavku ili pošaljite upit za nju da biste mogli da pošaljete porudžbinu.'
    notices:
      priceChanged: Imamo vaš kontakt i spisak delova, naš saradnik će vam se javiti. Dok ste slali porudžbinu, cena se promenila, pa smo ažurirali korpu. Možete i da proverite ukupan iznos i ponovo pošaljete porudžbinu.
      unavailable: Imamo vaš kontakt i spisak delova, naš saradnik će vam se javiti. Jedan od artikala više nije dostupan u traženoj količini. Možete i da ga uklonite i ponovo pošaljete porudžbinu.
      unreachable: Imamo vaš kontakt i spisak delova, naš saradnik će vam se javiti. Porudžbina trenutno nije uspela. Možete i da pokušate ponovo za minut.
      expired: Imamo vaš kontakt i spisak delova, naš saradnik će vam se javiti. Ova korpa više nije važeća i porudžbina nije poslata.
      gone: Ova korpa više nije važeća, pa smo delove iz nje prebacili u upit. Pošaljite upit, a mi ćemo vam javiti cenu i rok nabavke.
      invalid: Kontakt nije prepoznat. Unesite broj telefona ili korisničko ime na Telegramu i ponovo pošaljite porudžbinu.
      cartChanged: Imamo vaš kontakt i spisak delova, naš saradnik će vam se javiti. Korpa je izmenjena u drugoj kartici pregledača. Možete i da proverite artikle i ukupan iznos i ponovo pošaljete porudžbinu.
      repriced: Cena se promenila od vaše poslednje posete. Proverite iznos pre slanja porudžbine.
      offline: Prodavnica nije odgovorila, korpa je ostala nepromenjena. Pokušajte ponovo za minut.
      stockLimit: Nema više komada ovog dela na stanju. U korpi je već cela dostupna količina.
      orderLimit: Dostigli ste maksimalnu količinu za ovaj deo po porudžbini. Ako vam treba više, pišite nam, naručićemo posebno.
      moved: Stavka je prebačena u upit. Pošaljite ga i javićemo vam cenu i rok isporuke.
      movedCta: Otvori upit
    orderedHeading: Porudžbina je primljena
    orderedBody: Naš saradnik će proveriti dostupnost, a zatim vam poslati poruku ili vas pozvati da potvrdi porudžbinu i termin preuzimanja. Plaćanje gotovinom pri preuzimanju.
    orderNumberTemplate: 'Broj porudžbine: {number}'
    orderedNext: Potvrdićemo dostupnost i vreme preuzimanja, obično u roku od sat vremena tokom radnog vremena.
