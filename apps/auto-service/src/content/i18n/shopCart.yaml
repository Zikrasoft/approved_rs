  en:
    metaTitle: Cart | CarLab
    metaDescription: Parts you've selected from the CarLab catalogue. Pay in cash when you collect from our workshop in Belgrade.
    heading: Cart
    cartLink: Cart
    partsListNote: Parts without a price are kept in your enquiry, separate from your cart. Send the enquiry and we'll confirm prices and lead times.
    loading: Checking prices and availability
    emptyHeading: Your cart is empty
    emptyBody: Open a part's page in the catalogue and click "Add to cart".
    emptyCta: Browse parts
    emptyInquiry: Can't find the part you need? Send an enquiry and we'll find it for you.
    emptyInquiryCta: Send an enquiry
    unitTemplate: '{price} each'
    increaseLabel: Add one more
    decreaseLabel: Remove one
    toInquiryLabel: Send as an enquiry
    lowerToTemplate: Keep {count} pcs
    unavailableTag: The quantity you need isn't currently available. Reduce the quantity, remove the item or send it as an enquiry.
    removeLabel: Remove from cart
    totalLabel: Total
    addonTemplate: 'Add: {service}'
    addonPickup: We'll do this at the CarLab workshop when you collect your order
    addonInCart: You can add this service in your cart.
    installationLabel: Fitting at the CarLab workshop
    installationFree: Free fitting
    installationInCart: You can add fitting in your cart.
    addonsInCart: You can add both services in your cart.
    freeLabel: Free
    priceChangeTemplate: '{name}: was {before}, now {after}'
    summaryHeading: Your order
    summaryCountTemplate: Parts, {count} pcs
    summaryAddons: Services on collection
    contactStep: Contact details
    pickupStep: Collection
    pickupMethod: Collection from the CarLab workshop
    paymentStep: Payment
    paymentMethod: Cash on collection
    extrasToggle: Add a VIN or comment
    submitNote: Our team will confirm availability and when your order will be ready to collect.
    commentLabel: Order comment (optional)
    commentPlaceholder: For example, when you'd like to collect
    submitLabel: Place order
    consentError: We can't place your order without your consent
    submitError: Your order wasn't sent. Check your connection and try again
    submitErrorContacts: 'Or send your order via WhatsApp, the parts list is already in the message. You can also call us or use another messaging app:'
    orderMessage: "Hello! I'd like to order:"
    checkoutBlocked: 'Currently unavailable to buy: {names}. Remove the item or send it as an enquiry to proceed with your order.'
    notices:
      priceChanged: We have your contact details and parts list, and our team will get in touch. A price changed while you were checking out, so we've updated your cart. Check the total and place your order again.
      unavailable: We have your contact details and parts list, and our team will get in touch. One of the items is no longer available in the quantity you need. Remove it and place your order again.
      unreachable: We have your contact details and parts list, and our team will get in touch. Your order couldn't be placed just now. Try again in a minute.
      expired: We have your contact details and parts list, and our team will get in touch. This cart has expired and no order has been placed.
      gone: This cart has expired, so we've moved its parts to an enquiry. Send the enquiry and we'll confirm prices and lead times.
      invalid: We couldn't recognise your contact details. Enter a phone number or Telegram username and place your order again.
      cartChanged: We have your contact details and parts list, and our team will get in touch. Your cart was changed in another tab. Check the items and total, then place your order again.
      repriced: A price has changed since your last visit. Check the total before placing your order.
      offline: The shop didn't respond. Your cart is unchanged. Try again in a minute.
      stockLimit: There are no more of this part available right now. Your cart already contains all the stock we have.
      orderLimit: You've reached the limit for this part in a single order. If you need more, contact us and we'll arrange a separate order.
      moved: We've moved the item to your enquiry. Send it and we'll confirm the price and lead time.
      movedCta: View enquiry
    orderedHeading: Order received
    orderedBody: Our team will check availability, then message or call you to confirm your order and collection time. Payment is in cash on collection.
    orderNumberTemplate: 'Order number: {number}'
    orderedNext: We'll confirm availability and collection time, usually within an hour during opening hours.
    orderedContact: "We'll message you on {channel}: {contact}"
    orderedCall: "We'll call you: {contact}"
    orderedCta: Back to catalogue
    receiptQuantityTemplate: '{count} pcs'
    stickyCta: Checkout
    fallbackHeading: The shop is currently unavailable
    fallbackBody: Your cart has been saved. Try opening it again in a minute, or send the parts as an enquiry and we'll confirm prices and lead times.
    fallbackRetry: Try again
    fallbackCta: Send as an enquiry
    noscriptBody: The cart requires JavaScript. Send an enquiry and we'll confirm prices and lead times.
