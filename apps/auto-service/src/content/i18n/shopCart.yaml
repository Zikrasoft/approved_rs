notices:
  priceChanged: 'Ваш контакт и список у нас: менеджер напишет сам. Пока вы оформляли заказ, цена изменилась, и мы обновили корзину. Проверьте сумму и оформите заказ заново.'
  unavailable: 'Ваш контакт и список у нас: менеджер напишет сам. Одной из позиций больше нет в нужном количестве. Уберите ее и оформите заказ заново.'
  unreachable: 'Ваш контакт и список у нас: менеджер напишет сам. Заказ сейчас не оформился. Попробуйте еще раз через минуту.'
