    removeLabel: Remove from cart
    totalLabel: Total
    addonTemplate: 'Add: {service}'
    addonPickup: Done when you collect at the CarLab workshop
    addonInCart: You can add this service in your cart.
    installationLabel: Fitting at the CarLab workshop
    installationFree: Free fitting
    installationInCart: You can add fitting in your cart.
    addonsInCart: You can add both services in your cart.
    freeLabel: Free
    priceChangeTemplate: '{name}: was {before}, now {after}'
    summaryHeading: Your order
    summaryCountTemplate: 'Parts: {count}'
    summaryAddons: Work on collection
    contactStep: Contact details
    pickupStep: Collection
    pickupMethod: Collect from the CarLab workshop
    paymentStep: Payment
    paymentMethod: Cash on collection
    extrasToggle: Add a VIN or comment
    submitNote: Our team will confirm availability and when you can collect.
    commentLabel: Order comment (optional)
