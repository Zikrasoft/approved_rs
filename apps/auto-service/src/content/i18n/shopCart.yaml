translations:
  sr:
    metaTitle: Korpa, CarLab
    metaDescription: Delovi koje ste izabrali u katalogu CarLab. Plaćanje gotovinom prilikom preuzimanja na SSO u Beogradu.
    heading: Korpa
    cartLink: Korpa
    loading: Proveravamo cene i dostupnost
    emptyHeading: Korpa je prazna
    emptyBody: Otvorite stranicu delova u katalogu i kliknite na „U korpu“.
    emptyCta: U katalog delova
    unitTemplate: '{price} po kom.'
    increaseLabel: Dodati još jedan
    decreaseLabel: Ukloniti jedan
    toInquiryLabel: Poslati upit
    unavailableTag: Trenutno nije dostupno u potrebnom količini. Uklonite stavku ili je pošaljite putem upita.
    removeLabel: Ukloniti iz korpe
    totalLabel: Ukupno
    addonTemplate: 'Dodati: {service}'
    addonPickup: Izvršava se prilikom izdavanja u servisu CarLab
    addonInCart: Uslugu možete dodati u korpu.
    priceChangeTemplate: '{name}: bilo {before}, sada {after}'
    summaryHeading: Vaša narudžbina
    summaryCountTemplate: Delovi, {count} kom.
    summaryAddons: Radovi prilikom izdavanja
    contactStep: Kontakt
    pickupStep: Preuzimanje
    pickupMethod: Samostalno preuzimanje iz SSO CarLab
    paymentStep: Plaćanje
    paymentMethod: Gotovina prilikom preuzimanja
    extrasToggle: Dodati VIN ili komentar
    submitNote: Menadžer će potvrditi dostupnost i vreme kada možete preuzeti.
    commentLabel: Komentar na narudžbinu (nije obavezno)
    commentPlaceholder: Na primer, kada je zgodno preuzeti
    submitLabel: Oporaviti narudžbinu
    consentError: Bez pristanka ne možemo obraditi narudžbinu
    submitError: Narudžbina nije poslata. Proverite vezu i pokušajte ponovo
    checkoutBlocked: 'Sada nije moguće kupiti: {names}. Uklonite stavku ili je pošaljite putem upita, i narudžbinu možete izvršiti.'
    notices:
      priceChanged: Dok ste obradili narudžbinu, cena se promenila. Ažurirali smo korpu, proverite iznos i ponovo izvršite narudžbinu.
      unavailable: Jedna od stavki više nije dostupna u potrebnoj količini. Uklonite je i ponovo izvršite narudžbinu.
      unreachable: Nije uspelo da se izvrši narudžbina. Pokušajte ponovo za minut.
      expired: Ova korpa je istekao, i narudžbina nije izvršena. Ponovo dodajte delove sa stranica kataloga.
      invalid: Nije uspelo da se prepozna kontakt. Unesite broj telefona ili korisničko ime na Telgramu i ponovo izvršite narudžbinu.
      cartChanged: Korpa se promenila u drugoj kartici. Proverite stavke i iznos i ponovo izvršite narudžbinu.
      repriced: Cena se promenila od poslednjeg puta. Proverite iznos pre nego što izvršite narudžbinu.
      offline: Prodavnica nije odgovorila, korpa je ostala kao što je bila. Pokušajte ponovo za minut.
      stockLimit: Više nema ove stavke. U korpi su već svi dostupni delovi.
      moved: Premestili smo stavku u upit. Pošaljite je i javićemo cenu i rok.
      movedCta: Otvoriti upit
    orderedHeading: Narudžbina prihvaćena
    orderedBody: Menadžer će proveriti dostupnost, a zatim će vam pisati ili zvati da potvrdi narudžbinu i vreme preuzimanja. Plaćanje gotovinom prilikom preuzimanja.
    orderNumberTemplate: 'Broj narudžbine: {number}'
    orderedCta: Vratite se u katalog
    receiptQuantityTemplate: '{count} kom.'
    stickyCta: Za narudžbinu
    fallbackHeading: Prodavnica nije dostupna
    fallbackBody: Korpa je sačuvana. Pokušajte da je otvorite ponovo za minut ili pošaljite delove putem upita, i mi ćemo vas obavestiti o ceni i roku.
    fallbackRetry: Pokušati ponovo
    fallbackCta: Poslati upit
  en:
    metaTitle: Cart, CarLab
    metaDescription: Parts you selected from the CarLab catalog. Cash at pickup at the service in Belgrade.
    heading: Cart
    cartLink: Cart
    loading: Checking prices and availability
    emptyHeading: Your cart is empty
    emptyBody: Visit the parts catalog and click 'Add to Cart'.
    emptyCta: Go to parts catalog
    unitTemplate: '{price} each'
    increaseLabel: Add one more
    decreaseLabel: Remove one
    toInquiryLabel: Send as inquiry
    unavailableTag: Currently not available in the required quantity. Remove the item or send it as an inquiry.
    removeLabel: Remove from cart
    totalLabel: Total
    addonTemplate: 'Add: {service}'
    addonPickup: We’ll do this at the service pickup
    addonInCart: You can add the service in the cart.
    priceChangeTemplate: '{name}: was {before}, now {after}'
    summaryHeading: Your order
    summaryCountTemplate: Parts, {count} pcs.
    summaryAddons: Services at pickup
    contactStep: Contact
    pickupStep: Pickup
    pickupMethod: Self-pickup from CarLab
    paymentStep: Payment
    paymentMethod: Cash on pickup
    extrasToggle: Add VIN or comment
    submitNote: The manager will confirm availability and the time for pickup.
    commentLabel: Order comment (optional)
    commentPlaceholder: For example, when you can pick it up
    submitLabel: Place order
    consentError: Without consent, we can't place the order
    submitError: Order did not go through. Check your connection and try again
    checkoutBlocked: "You can't purchase now: {names}. Remove the item or send it as an inquiry to place the order."
    notices:
      priceChanged: While you were placing the order, the price changed. We've updated the cart, check the total and reorder.
      unavailable: One of the items is no longer available in the required quantity. Remove it and reorder.
      unreachable: The order could not be placed. Please try again in a minute.
      expired: This cart has expired and the order was not placed. Please add parts again from the catalog pages.
      invalid: Could not recognize the contact. Please provide a phone number or Telegram username and reorder.
      cartChanged: The cart was changed in another tab. Check the items and total and reorder.
      repriced: The price has changed since your last visit. Check the total before placing your order.
      offline: The store did not respond, the cart remains unchanged. Please try again in a minute.
      stockLimit: There are no more of this part available now. The cart already has everything in stock.
      moved: The item has been moved to the inquiry. Send it, and we will inform you of the price and timeline.
      movedCta: Open inquiry
    orderedHeading: Order placed
    orderedBody: The manager will check availability and then write or call to confirm the order and pickup time. Cash at pickup.
    orderNumberTemplate: 'Order number: {number}'
    orderedCta: Return to catalog
    receiptQuantityTemplate: '{count} pcs.'
    stickyCta: Proceed to checkout
    fallbackHeading: The store is currently unavailable
    fallbackBody: The cart has been saved. Please try to open it again in a minute or send the parts as an inquiry, and we will inform you of the price and timeline.
    fallbackRetry: Try again
    fallbackCta: Send as inquiry
