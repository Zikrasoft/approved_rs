    stickyCta: Nastavi na poručivanje
    fallbackHeading: Prodavnica trenutno nije dostupna
    fallbackBody: Korpa je sačuvana. Pokušajte da je ponovo otvorite za minut ili pošaljite upit za delove, pa ćemo vam javiti cenu i rok isporuke.
    fallbackRetry: Pokušaj ponovo
    fallbackCta: Pošalji upit
    noscriptBody: Korpa radi samo kada je JavaScript uključen. Pošaljite upit, pa ćemo vam javiti cenu i rok isporuke.
  en:
    metaTitle: Your cart, CarLab
    metaDescription: Parts you've selected from the CarLab catalogue. Pay cash on collection at our workshop in Belgrade.
    heading: Your cart
    cartLink: Your cart
    partsListNote: Parts without a price are in your inquiry and won't be included in this order. Send the inquiry separately and we'll confirm pricing and availability.
    loading: Checking prices and availability
    emptyHeading: Your cart is empty
    emptyBody: Open a part in the catalogue and click "Add to cart".
    emptyCta: Browse parts
    emptyInquiry: Can't find the part you need? Send us an inquiry and we'll help you find it.
    emptyInquiryCta: Send an inquiry
    unitTemplate: '{price} each'
    increaseLabel: Add one more
    decreaseLabel: Remove one
    toInquiryLabel: Move to parts enquiry
    lowerToTemplate: Keep {count}
    unavailableTag: The requested quantity isn't available right now. Reduce the quantity, remove the item or send an inquiry for it.
    removeLabel: Remove from cart
    totalLabel: Total
    addonTemplate: 'Add: {service}'
    addonPickup: Done when you collect at the CarLab workshop
    addonInCart: You can add this service in your cart.
    installationLabel: Fitting at the CarLab workshop
    installationFree: Free fitting
    installationInCart: You can add fitting in your cart.
    addonsInCart: You can add both services in your cart.
    freeLabel: Free
    priceChangeTemplate: '{name}: was {before}, now {after}'
    summaryHeading: Your order
    summaryCountTemplate: 'Parts: {count}'
    summaryAddons: Work on collection
    contactStep: Contact details
    pickupStep: Collection
    pickupMethod: Collect from the CarLab workshop
    paymentStep: Payment
    paymentMethod: Cash on collection
    extrasToggle: Add a VIN or comment
    submitNote: Our team will confirm availability and when you can collect.
    commentLabel: Order comment (optional)
    commentPlaceholder: For example, when you'd like to collect
    submitLabel: Place order
    consentError: We need your consent to place the order
    submitError: Your order wasn't sent. Check your connection and try again
    submitErrorContacts: 'Or send your order via WhatsApp. Your parts list is already in the message. You can also call us or use another messaging app:'
    orderMessage: "Hi! I'd like to order:"
    checkoutBlocked: 'Currently unavailable to buy: {names}. Remove the item or move it to a parts enquiry to place your order.'
    notices:
      priceChanged: We have your contact details and parts list, and our team will get in touch. A price changed while you were placing your order, so we've updated your cart. You can also check the total and place your order again.
      unavailable: We have your contact details and parts list, and our team will get in touch. One item is no longer available in the quantity you need. You can also remove it and place your order again.
      unreachable: We have your contact details and parts list, and our team will get in touch. Your order couldn't be placed just now. You can also try again in a minute.
      expired: We have your contact details and parts list, and our team will get in touch. This cart has expired, and the order hasn't been placed.
      gone: This cart has expired, so we've moved the parts to an inquiry. Send the inquiry, and we'll confirm the price and lead time.
      invalid: We couldn't recognise your contact details. Enter a phone number or Telegram username and place your order again.
      cartChanged: We have your contact details and parts list, and our team will get in touch. Your cart was changed in another tab. You can also check the items and total and place your order again.
      repriced: A price has changed since your last visit. Check the total before placing your order.
      offline: The shop didn't respond. Your cart hasn't changed. Please try again in a minute.
      stockLimit: There are no more of this part available right now. Your cart already contains all available stock.
      orderLimit: You've reached the limit for this part in a single order. If you need more, message us and we'll arrange a separate order.
      moved: Item moved to your parts enquiry. Send it and we'll confirm the price and lead time.
      movedCta: Open parts enquiry
    orderedHeading: Order received
    orderedBody: Our team will check availability, then message or call you to confirm your order and collection time. Pay cash on collection.
    orderNumberTemplate: 'Order number: {number}'
    orderedNext: We'll confirm availability and when you can collect, usually within an hour during business hours.
    orderedContact: "We'll message you on {channel}: {contact}"
    orderedCall: "We'll call you: {contact}"
    orderedCta: Back to catalogue
    receiptQuantityTemplate: 'Qty: {count}'
    stickyCta: Checkout
    fallbackHeading: The shop is currently unavailable
    fallbackBody: Your cart has been saved. Try opening it again in a minute, or send the parts as an enquiry and we'll confirm the price and lead time.
    fallbackRetry: Try again
    fallbackCta: Move to parts enquiry
    noscriptBody: The cart requires JavaScript. Send us a parts inquiry and we'll get back to you with a price and lead time.
