  en:
    metaTitle: Cart | CarLab
    metaDescription: Parts you've picked from the CarLab catalogue. Pay cash on collection at our Belgrade workshop.
    heading: Cart
    cartLink: Cart
    partsListNote: Parts without a price are saved in your enquiry, separate from the cart. Send the enquiry and we'll let you know the price and lead time.
    loading: Checking prices and availability
    emptyHeading: Your cart is empty
    emptyBody: Open a part page in the catalogue and click "Add to cart".
    emptyCta: Browse parts
    emptyInquiry: Can't find the part you need? Send us an enquiry and we'll find it for you.
    emptyInquiryCta: Send an enquiry
    unitTemplate: '{price} per pc'
    increaseLabel: Add one more
    decreaseLabel: Remove one
    toInquiryLabel: Send as an enquiry
    lowerToTemplate: Keep {count} pcs
    unavailableTag: Not enough in stock right now. Reduce the quantity, remove this item, or send it as an enquiry.
    removeLabel: Remove from cart
    totalLabel: Total
    addonTemplate: 'Add: {service}'
    addonPickup: We'll do it at CarLab when you collect your order
    addonInCart: You can add the service in the cart.
    installationLabel: Installation at CarLab
    installationFree: Free installation
    installationInCart: You can add installation in the cart.
    addonsInCart: You can add both services in the cart.
    freeLabel: Free
    priceChangeTemplate: '{name}: was {before}, now {after}'
    summaryHeading: Your order
    summaryCountTemplate: Parts, {count} pcs
    summaryAddons: Work at collection
    contactStep: Contact
    pickupStep: Collection
    pickupMethod: Collect from CarLab
    paymentStep: Payment
    paymentMethod: Cash on collection
    extrasToggle: Add VIN or a comment
    submitNote: Our team will confirm availability and when you can collect your order.
    commentLabel: Order comment (optional)
    commentPlaceholder: For example, when you'd like to collect
    submitLabel: Place order
    consentError: We need your consent to place the order
    submitError: Your order couldn't be sent. Check your connection and try again.
    submitErrorContacts: 'Or send your order via WhatsApp. The parts list is already in the message. You can also call or message us on another app:'
    orderMessage: "Hello! I'd like to order:"
    checkoutBlocked: "You can't order these right now: {names}. Remove the item or send it as an enquiry, then you can place your order."
    notices:
      priceChanged: We have your contact details and parts list. Our team will get in touch. The price changed while you were placing your order, so we've updated your cart. Check the total and place your order again.
      unavailable: We have your contact details and parts list. Our team will get in touch. One of the parts is no longer available in the quantity you need. Remove it and place your order again.
      unreachable: We have your contact details and parts list. Our team will get in touch. Your order couldn't be placed just now. Please try again in a minute.
      expired: We have your contact details and parts list. Our team will get in touch. This cart has expired, so your order wasn't placed.
      gone: This cart has expired, so we've moved its parts to your enquiry. Send the enquiry and we'll let you know the price and lead time.
      invalid: We couldn't recognise your contact details. Enter a phone number or Telegram username and place your order again.
      cartChanged: We have your contact details and parts list. Our team will get in touch. Your cart changed in another tab. Check the items and total, then place your order again.
      repriced: The price has changed since your last visit. Check the total before placing your order.
      offline: The shop didn't respond, so your cart is unchanged. Please try again in a minute.
      stockLimit: There's no more of this part in stock right now. Your cart already has the available quantity.
      orderLimit: You can't add more of this part to one order. If you need more, get in touch and we'll order it separately.
      moved: We've moved the item to your enquiry. Send it and we'll let you know the price and lead time.
      movedCta: View enquiry
    orderedHeading: Order received
    orderedBody: Our team will check availability, then message or call you to confirm your order and collection time. Pay cash on collection.
    orderNumberTemplate: 'Order number: {number}'
    orderedNext: We'll confirm availability and collection time, usually within an hour during business hours.
    orderedContact: "We'll message you on {channel}: {contact}"
    orderedCall: "We'll call: {contact}"
    orderedCta: Back to the catalogue
    receiptQuantityTemplate: '{count} pcs'
    stickyCta: Checkout
    fallbackHeading: The shop is temporarily unavailable
    fallbackBody: Your cart is saved. Try opening it again in a minute, or send the parts as an enquiry and we'll let you know the price and lead time.
    fallbackRetry: Try again
    fallbackCta: Send as an enquiry
    noscriptBody: The cart only works with JavaScript enabled. Send an enquiry and we'll let you know the price and lead time.
