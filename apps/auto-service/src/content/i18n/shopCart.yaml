    submitError: Order did not go through. Check your connection and try again
    checkoutBlocked: 'You cannot purchase right now: {names}. Remove the item or send it as an inquiry, and you can place your order.'
    notices:
      priceChanged: While you were placing your order, the price changed. We updated the cart, please check the total and place your order again.
      unavailable: One of the items is no longer in the required quantity. Please remove it and place your order again.
