notices:
  priceChanged: Пока вы оформляли заказ, поставщик изменил цену. Мы обновили корзину, проверьте сумму и оформите заказ еще раз.
  unavailable: У поставщика больше нет нужного количества одной из позиций. Уберите ее и оформите заказ еще раз.
  unreachable: Не получилось оформить заказ. Попробуйте еще раз через минуту.
  expired: Эта корзина устарела, и заказ по ней не оформлен. Добавьте запчасти заново со страниц каталога.
  invalid: Не получилось распознать контакт. Укажите номер телефона или ник в Telegram и оформите заказ еще раз.
  cartChanged: Корзина изменилась в другой вкладке. Проверьте позиции и сумму и оформите заказ еще раз.
  repriced: С прошлого раза поставщик изменил цену. Проверьте сумму перед оформлением.
  offline: Магазин не ответил, корзина осталась как была. Попробуйте еще раз через минуту.
  stockLimit: Больше этой запчасти у поставщика нет. В корзине уже все, что есть.
  moved: Перенесли позицию в заявку. Отправьте ее, и мы сообщим цену и срок.
  movedCta: Открыть заявку
