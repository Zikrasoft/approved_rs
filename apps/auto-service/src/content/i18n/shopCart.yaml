    heading: Korpa
    cartLink: Korpa
    partsListNote: Delovi bez cene su u upitu i neće biti uključeni u ovu porudžbinu. Pošaljite upit zasebno, pa ćemo vam javiti cenu i rok isporuke.
    loading: Proveravamo cene i dostupnost
