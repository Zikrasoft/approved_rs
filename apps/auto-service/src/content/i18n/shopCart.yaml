  invalid: Не получилось распознать контакт. Укажите номер телефона или ник в Telegram и оформите заказ еще раз.
  cartChanged: 'Ваш контакт и список у нас: менеджер напишет сам. Корзина изменилась в другой вкладке. Проверьте позиции и сумму и оформите заказ заново.'
  repriced: С прошлого раза цена изменилась. Проверьте сумму перед оформлением.
  offline: Магазин не ответил, корзина осталась как была. Попробуйте еще раз через минуту.
  stockLimit: Больше этой запчасти сейчас нет. В корзине уже все, что есть.
  orderLimit: Больше этой запчасти в один заказ не поместится. Если нужно больше, напишите нам, закажем отдельно.
  moved: Перенесли позицию в заявку. Отправьте ее, и мы сообщим цену и срок.
