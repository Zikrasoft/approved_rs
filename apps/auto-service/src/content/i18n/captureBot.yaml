greeting: Здравствуйте! Спасибо, что написали — заявка у нас, мастер скоро ответит.
lookingFor: Расскажите, какая у вас машина — марка, модель, год — и что с ней случилось или какие работы нужны.
phoneAsk: У вас в Telegram нет имени пользователя (username), поэтому мастер не сможет вам написать. Оставьте номер телефона, чтобы мы могли связаться.
phoneButton: 📱 Поделиться номером
thanks: Спасибо! Передали мастеру — он скоро с вами свяжется.
received: Приняли, мастер увидит ваше сообщение.
menu:
  text: Чем можем помочь? Выберите, что вас интересует.
  back: « Назад
services:
  button: Услуги
  text: Вот что мы делаем в сервисе. Выберите услугу — покажем цену, сроки и что входит.
card:
  request: 📝 Оставить заявку
  site: Подробнее на сайте
contacts:
  button: Контакты
  text: Мы в Белграде, ждём вас в сервисе.
  hours: Пн–Пт 08:00–18:00 · Сб 09:00–14:00
manager:
  button: 👤 Написать мастеру
  text: Напишите ваш вопрос одним сообщением — мастер ответит здесь же.
  handoff: Мастер на связи в Telegram — нажмите, чтобы открыть чат.
  chat: Открыть чат с мастером ↗
partners:
  button: Партнёры
  text: Наши партнёры — выберите, кому написать.
request:
  button: 📝 Оставить заявку
  car: Какая у вас машина? Напишите марку, модель и год.
  service: Какие работы нужны? Отметьте одну или несколько.
  done: Готово →
  unsure: Не знаю, нужна консультация
language:
  button: 🌐 Язык
  text: Выберите язык, на котором вам удобнее общаться.
profile:
  description: 'Автосервис в Белграде: диагностика, ремонт и обслуживание. Нажмите «Старт» и расскажите, что с машиной, мастер ответит здесь же. Удобнее без бота? Напишите мастеру напрямую: {manager}'
  shortDescription: 'Автосервис в Белграде: диагностика, ремонт, обслуживание. Мастер: {manager}'
  menuCommand: Главное меню
  langCommand: Сменить язык
