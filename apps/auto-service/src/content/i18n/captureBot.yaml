greeting: Здравствуйте! Спасибо, что написали — заявка у нас, мастер скоро ответит.
lookingFor: Расскажите, какая у вас машина — марка, модель, год — и что с ней случилось или какие работы нужны.
budget: На какой бюджет на ремонт ориентируетесь? Если пока не знаете, так и напишите — посчитаем после диагностики.
phoneAsk: Чтобы мастер мог с вами связаться, поделитесь номером телефона — или пропустите этот шаг.
phoneOffer: Если удобнее созвониться, поделитесь номером, и мастер вам позвонит. Если нет, просто пропустите.
phoneButton: Поделиться номером
phoneSkip: Пропустить
thanks: Спасибо! Передали мастеру — он скоро с вами свяжется.
received: Приняли, мастер увидит ваше сообщение.
menu:
  text: Чем можем помочь? Выберите, что вас интересует.
  back: « Назад
services:
  button: Услуги
  text: Вот что мы делаем в сервисе. Выберите услугу — покажем цену, сроки и что входит.
card:
  request: Оставить заявку
  site: Подробнее на сайте
partners:
  button: Партнёры
  text: Наши партнёры — выберите, кому написать.
translations:
  sr:
    greeting: Zdravo! Hvala što ste nam pisali — upit je kod nas i majstor će vam se uskoro javiti.
    lookingFor: Recite nam koji automobil vozite — marka, model i godište — i šta se dešava s njim ili koji radovi su potrebni.
    budget: Koji budžet za popravku imate na umu? Ako još ne znate, slobodno tako i napišite — procenićemo nakon dijagnostike.
    phoneAsk: Podelite broj telefona da bi majstor mogao da vas kontaktira — ili preskočite ovaj korak.
    phoneOffer: Ako vam više odgovara poziv, podelite broj pa će vas majstor pozvati. Ako ne, slobodno preskočite.
    phoneButton: Podeli broj
    phoneSkip: Preskoči
    thanks: Hvala! Proslijedili smo majstoru — uskoro će vas kontaktirati.
    received: Primili smo, majstor će videti vašu poruku.
  en:
    greeting: Hello! Thanks for getting in touch — we have your enquiry and a mechanic will reply shortly.
    lookingFor: Tell us which car you drive — make, model and year — and what is wrong with it or what work it needs.
    budget: What repair budget do you have in mind? If you are not sure yet, just say so and we will quote after the diagnostics.
    phoneAsk: Share your phone number so a mechanic can reach you — or skip this step.
    phoneOffer: If a call suits you better, share your number and a mechanic will ring you. If not, just skip it.
    phoneButton: Share my number
    phoneSkip: Skip
    thanks: Thank you! I’ve passed your message to the technician — he’ll be in touch with you shortly.
    received: Got it, a mechanic will see your message.
