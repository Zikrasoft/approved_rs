      arrival:
        - The service book, if you have one — it saves time on diagnostics.
        - The key for wheel locks, if installed.
        - If the issue is intermittent, come with the car cold, as it's easier to diagnose.
    thanks:
      metaTitle: Application Received — CarLab
      metaDescription: Thank you for your application. We will call you back during working hours to arrange your visit.
      eyebrow: Done
      heading: We Have Your Application
      body: We will call you back during working hours — usually within an hour. If your car is not operational, please let us know via messenger, and we can advise on towing.
      note: If we can't reach you after two attempts, we will message you — don't lose track of us.
      cta: Return to the Homepage
    privacy:
      metaTitle: Privacy Policy — CarLab
      metaDescription: What data the CarLab website collects, why, and how long it is stored.
      heading: Privacy Policy
      lastUpdated: Updated on September 12, 2026
      sections:
        - title: What Data We Collect
          text: Only what you enter in the form — your name, phone number, problem description, and vehicle information — as well as the address of the page from which the application was submitted and an anonymous browser identifier. The identifier is random, stored in your browser, and needed to ensure the same application doesn't turn into three cards.
        - title: Why We Need This Data
          text: To call you back regarding your application, schedule an appointment, and maintain the service history of your vehicle. We do not use it for newsletters and do not share it with third parties for advertising purposes.
        - title: Where It Is Stored
          text: In the encrypted storage of our hosting provider and in a closed working chat of the service. Access is restricted to staff only.
        - title: How Long We Store It
          text: For up to three years from the date of the last visit — the service history helps with future repairs. We will delete it sooner upon your request.
        - title: Cookies
          text: The site sets one technical cookie — the chosen language. There are no advertising or analytical cookies here. The cart and the anonymous identifier are stored in the browser's memory (localStorage) and do not leave to our server by themselves.
        - title: Your Rights
          text: You can request a copy of your data, its correction, or deletion. Just call or write to us in any messenger.
      shopSections:
        - title: Spare Parts Orders
          text: The order from the cart is sent along with the application so we know what to prepare. We do not collect payment data — payment is made at the service.
      contactTitle: Questions About Data
      contactBefore: Call or write to us, contact information is available on the page.
    notFound:
      metaTitle: Page Not Found — CarLab
      heading: This Page Does Not Exist
      body: The link may be outdated or there may be a typo in the address. Check out our services or write to us — we can help.
      cta: Go to Homepage
