    privacy:
      metaTitle: Politika privatnosti - CarLab
      metaDescription: Koje podatke prikuplja sajt auto servisa CarLab, zašto i koliko dugo ih čuva.
      heading: Politika privatnosti
      lastUpdated: Ažurirano 12. oktobra 2026
      sections:
        - title: Koje podatke prikupljamo
          text: Samo ono što sami unesete u formu - ime, telefon, opis problema i podaci o automobilu - kao i adresu stranice sa koje je poslat zahtev, i anonimni identifikator pregledača. Identifikator je nasumičan, čuva se u vašem pregledaču i služi da se isti zahtev ne pretvori u tri kartice.
        - title: Zašto su nam ti podaci
          text: Da bismo se javili u vezi sa zahtevom, dogovorili vreme i vodili istoriju servisa vašeg automobila. Ne koristimo ih za slanje reklama niti ih prosleđujemo trećim stranama u marketinške svrhe.
        - title: Gde se čuvaju
          text: U šifrovanom skladištu našeg provajdera hostinga i u zatvorenom radnom četu servisa. Pristup imaju samo zaposleni.
        - title: Koliko ih čuvamo
          text: Do tri godine od poslednje posete - istorija servisa pomaže prilikom sledeće popravke. Na vaš zahtev ćemo obrisati ranije.
        - title: Kolačići
          text: Sajt postavlja tehnički kolačić sa izabranim jezikom, analitički — Google Analytics — i reklamni — Meta piksel. Analitika i piksel se aktiviraju prilikom prvog učitavanja stranice; možete ih onemogućiti putem banera na dnu ekrana, i tada se pri sledećem učitavanju neće uključivati. Piksel obaveštava Meta o pregledu stranice i o tome da ste poslali upit, kontaktirali nas ili napravili porudžbinu — tako vidimo koja reklama na Facebook-u i Instagram-u dovodi klijente. Sadržaj forme se ne prenosi. Ako nakon korišćenja sajta nastavite sa našim Telegram botom i ostavite tamo upit, naš server će obavestiti Meta samo o samom postojanju upita — bez sadržaja i vaših kontakt podataka. Korpa i anonimni identifikator se čuvaju u memoriji pretraživača (localStorage) i sami ne idu na naš server.
        - title: Vaša prava
          text: Možete zatražiti kopiju svojih podataka, njihovo ispravljenje ili brisanje. Dovoljno je da nas pozovete ili napišete u bilo kojem messengeru.
      shopSections:
        - title: Naručivanje rezervnih delova
          text: Sadržaj narudžbine iz korpe šalje se zajedno sa zahtevom, kako bismo znali šta da pripremimo. Platne podatke ne prikupljamo - uplata se vrši u servisu.
      contactTitle: Pitanja o podacima
      contactBefore: Nazovite ili napišite, kontakti su na stranici
