works:
  metaTitle: Примеры работ автосервиса в Белграде — CarLab
  metaDescription: Что нашли на диагностике, что сделали и сколько это заняло. Реальная работа автосервиса CarLab в Белграде.
  eyebrow: Примеры работ
  heading: Что мы делали и чем это закончилось
  lead: 'Разбор конкретных случаев из нашего автосервиса в Белграде: с чем приехала машина, что нашли на диагностике, что сделали и сколько это заняло.'
  detailMetaSuffix: CarLab
  detailCtaHeading: Похожая проблема?
  detailCtaBody: Опишите симптомы — скажем, на что это похоже и сколько будет стоить диагностика.
contact:
  metaTitle: Контакты автосервиса CarLab в Белграде — адрес и телефон
  metaDescription: Адрес, часы работы и телефон автосервиса CarLab в Белграде. Запись на диагностику и ремонт по телефону, в WhatsApp или Viber.
  eyebrow: Контакты
  heading: Приезжайте — посмотрим машину вместе
  lead: Первичный осмотр бесплатный и занимает минут пятнадцать — это не диагностика, а быстрый взгляд на машину при приёме. Этого обычно хватает, чтобы понять, что с машиной и сколько будет стоить ремонт.
  addressLabel: Адрес
  hoursLabel: Часы работы
  mapHeading: Как доехать
  mapNote: Ориентируйтесь на точку на карте — навигатор доводит до места. Есть парковка для клиентов.
  arrivalHeading: Что взять с собой
  arrival:
    - Сервисную книжку, если она есть — это экономит время на диагностике.
    - Ключ от секреток на колёсах, если ставили.
    - Если проблема плавающая — приезжайте на «холодной» машине, так её проще поймать.
thanks:
  metaTitle: Заявка принята — CarLab
  metaDescription: Спасибо за заявку. Перезвоним в рабочее время и согласуем время визита.
  eyebrow: Готово
  heading: Заявка у нас
  body: Перезвоним в рабочее время — обычно в течение часа. Если машина не на ходу, напишите об этом в мессенджер, подскажем по эвакуатору.
  note: Если мы не дозвонились дважды, то напишем в мессенджер — не теряйтесь.
  cta: Вернуться на главную
privacy:
  metaTitle: Политика конфиденциальности — CarLab
  metaDescription: Какие данные собирает сайт автосервиса CarLab, зачем и как долго они хранятся.
  heading: Политика конфиденциальности
  lastUpdated: Обновлено 12 сентября 2026
  sections:
    - title: Какие данные мы собираем
      text: Только то, что вы сами вводите в форму — имя, телефон, описание проблемы и данные автомобиля, — а также адрес страницы, с которой отправлена заявка, и анонимный идентификатор браузера. Идентификатор случайный, хранится в вашем браузере и нужен, чтобы одна и та же заявка не превратилась в три карточки.
    - title: Зачем нам эти данные
      text: Чтобы перезвонить по заявке, согласовать время и вести историю обслуживания вашей машины. Мы не используем их для рассылок и не передаём третьим лицам в рекламных целях.
    - title: Где они хранятся
      text: В зашифрованном хранилище нашего хостинг-провайдера и в закрытом рабочем чате сервиса. Доступ есть только у сотрудников.
    - title: Сколько мы их храним
      text: До трёх лет с момента последнего визита — сервисная история помогает при следующем ремонте. По вашему запросу удалим раньше.
    - title: Куки
      text: Сайт ставит одну техническую куку — выбранный язык. Рекламных и аналитических кук здесь нет. Корзина и анонимный идентификатор хранятся в памяти браузера (localStorage) и на наш сервер сами по себе не уходят.
    - title: Ваши права
      text: Вы можете запросить копию своих данных, их исправление или удаление. Достаточно позвонить или написать нам в любой мессенджер.
  shopSections:
    - title: Заказы запчастей
      text: Состав заказа из корзины уходит вместе с заявкой, чтобы мы понимали, что готовить. Платёжных данных мы не собираем — оплата происходит в сервисе.
  contactTitle: Вопросы по данным
  contactBefore: Позвоните или напишите, контакты есть на странице
notFound:
  metaTitle: Страница не найдена — CarLab
  heading: Такой страницы нет
  body: Возможно, ссылка устарела или в адресе опечатка. Посмотрите услуги или напишите нам — подскажем.
  cta: На главную
translations:
  sr:
    works:
      metaTitle: Primeri radova auto servisa u Beogradu — CarLab
      metaDescription: Šta smo našli na dijagnostici, šta smo uradili i koliko je to trajalo. Stvarni rad auto servisa CarLab u Beogradu.
      eyebrow: Primeri radova
      heading: Šta smo radili i kako je završilo
      lead: 'Analiza konkretnih slučajeva iz našeg auto servisa u Beogradu: sa čim je auto došao, šta smo našli na dijagnostici, šta smo uradili i koliko je to trajalo.'
      detailMetaSuffix: CarLab
      detailCtaHeading: Slično pitanje?
      detailCtaBody: Opišite simptome — recimo, na šta to liči i koliko bi dijagnostika mogla koštati.
    contact:
      metaTitle: Kontakti auto servisa CarLab u Beogradu — adresa i telefon
      metaDescription: Adresa, radno vreme i telefon auto servisa CarLab u Beogradu. Zakazivanje za dijagnostiku i popravku putem telefona, WhatsApp-a ili Viber-a.
      eyebrow: Kontakti
      heading: Dođite — pogledajmo auto zajedno
      lead: Prvi pregled je besplatan i traje oko petnaest minuta — to nije dijagnostika, već brz uvid u auto prilikom prijema. Obično je to dovoljno da shvatimo šta nije u redu i koliko bi popravka mogla koštati.
      addressLabel: Adresa
      hoursLabel: Radno vreme
      mapHeading: Kako doći
      mapNote: Orijentirajte se prema tački na mapi — navigacija vas dovodi do mesta. Postoji parking za klijente.
      arrivalHeading: Šta poneti sa sobom
      arrival:
        - Servisnu knjigu, ako je imate — to štedi vreme na dijagnostici.
        - Ključ od sigurnosnih šrafova na točkovima, ako ste ih postavljali.
        - Ako je problem nepredvidljiv — dođite sa 'hladnim' autom, tako je lakše uhvatiti.
    thanks:
      metaTitle: Zahtev primljen — CarLab
      metaDescription: Hvala na zahtevu. Pozvaćemo vas u radno vreme i dogovoriti termin posete.
      eyebrow: Gotovo
      heading: Zahtev je kod nas
      body: Javićemo se u radno vreme — obično u roku od sata. Ako auto nije u voznom stanju, javite nam to u poruci, preporučićemo vam nešto u vezi sa šlep službom.
      note: Ako se ne javimo dva puta, poslaćemo poruku u aplikaciji — ne gubite se.
      cta: Povratak na početnu
    privacy:
      metaTitle: Politika privatnosti — CarLab
      metaDescription: Koje podatke prikuplja sajt auto servisa CarLab, zašto i koliko dugo ih čuva.
      heading: Politika privatnosti
      lastUpdated: Ažurirano 12. septembra 2026
      sections:
        - title: Koje podatke prikupljamo
          text: Samo ono što sami unesete u formular — ime, telefon, opis problema i podaci o automobilu, — kao i adresa stranice sa koje je poslat zahtev, i anonimni identifikator pretraživača. Identifikator je nasumičan, čuva se u vašem pretraživaču i potreban je da isti zahtev ne postane tri kartice.
        - title: Zašto nam ti podaci
          text: Da bismo vas pozvali u vezi zahteva, dogovorili vreme i vodili istoriju održavanja vašeg automobila. Ne koristimo ih za slanje poruka i ne prenosimo trećim licima u reklamne svrhe.
        - title: Gde se čuvaju
          text: U enkriptovanoj bazi našeg hosting provajdera i u zatvorenom radnom čatu servisa. Pristup imaju samo zaposleni.
        - title: Koliko ih čuvamo
          text: Do tri godine od poslednje posete — istorija servisa pomaže prilikom sledeće popravke. Na vaš zahtev, obrišemo ih ranije.
        - title: Kolačići
          text: Sajt postavlja jedan tehnički kolačić — izabrani jezik. Ovdje nema reklamnih i analitičkih kolačića. Korpa i anonimni identifikator čuvaju se u memoriji pretraživača (localStorage) i ne odlaze na naš server sami od sebe.
        - title: Vaša prava
          text: Možete zatražiti kopiju svojih podataka, njihovo ispravljenje ili brisanje. Dovoljno je da nas pozovete ili napišete putem bilo koje aplikacije.
      shopSections:
        - title: Porudžbine delova
          text: Sadržaj porudžbine iz korpe odlazi zajedno sa zahtevom, kako bismo znali šta da pripremimo. Ne prikupljamo podatke o plaćanju — plaćanje se vrši u servisu.
      contactTitle: Pitanja o podacima
      contactBefore: Pozovite ili napišite, kontakt podaci su na strani
    notFound:
      metaTitle: Stranica nije pronađena — CarLab
      heading: Ova stranica ne postoji
      body: Moguće je da je link istekao ili da je u adresi greška. Pogledajte usluge ili nam pišite — pomoći ćemo.
      cta: Na početnu
  en:
    works:
      metaTitle: Examples of Car Service Work in Belgrade — CarLab
      metaDescription: What we found during diagnostics, what we did, and how long it took. Real work from CarLab in Belgrade.
      eyebrow: Work Examples
      heading: What We Did and How It Turned Out
      lead: 'An analysis of specific cases from our car service in Belgrade: what issues the car had upon arrival, what we found during diagnostics, what work was done, and how long it took.'
      detailMetaSuffix: CarLab
      detailCtaHeading: Similar Problem?
      detailCtaBody: Describe the symptoms — for example, what it feels like and how much you think diagnostics will cost.
    contact:
      metaTitle: Contact CarLab Auto Service in Belgrade — Address and Phone Number
      metaDescription: Address, working hours, and phone number of CarLab auto service in Belgrade. Schedule diagnostics and repairs by phone, WhatsApp, or Viber.
      eyebrow: Contact
      heading: Come on Over — Let's Take a Look at Your Car Together
      lead: The initial inspection is free and takes about fifteen minutes — this isn't a full diagnostic, just a quick glance at the car upon arrival. This is usually enough to understand the car's condition and estimate the repair costs.
      addressLabel: Address
      hoursLabel: Working Hours
      mapHeading: How to Get Here
      mapNote: Use the map point as a reference — your GPS will guide you. There's parking available for customers.
      arrivalHeading: What to Bring with You
      arrival:
        - Your service book, if you have one — this saves time during diagnostics.
        - The key for wheel lock nuts, if applicable.
        - If the issue is intermittent, please come in with a 'cold' car, as this makes it easier to diagnose.
    thanks:
      metaTitle: Application Received — CarLab
      metaDescription: Thank you for your application. We will call you back during business hours to confirm your visit time.
      eyebrow: Done
      heading: We've Got Your Application
      body: We'll call back during business hours — usually within an hour. If your car isn't operational, please mention this in your message, and we'll provide advice on towing.
      note: If we can't reach you after two attempts, we'll send a message — don't worry.
      cta: Return to the Homepage
    privacy:
      metaTitle: Privacy Policy — CarLab
      metaDescription: What data the CarLab auto service website collects, why it is collected, and how long it is stored.
      heading: Privacy Policy
      lastUpdated: Updated on September 12, 2026
      sections:
        - title: What Data We Collect
          text: Only what you enter in the form — your name, phone number, description of the problem, and vehicle details — along with the address of the page from which the application was sent, and an anonymous browser identifier. The identifier is random, stored in your browser, and is needed to ensure that one application doesn't become three entries.
        - title: Why We Need This Data
          text: To return your call regarding the application, coordinate a time, and maintain a service history for your vehicle. We do not use this data for mailing lists or share it with third parties for advertising purposes.
        - title: Where It Is Stored
          text: In an encrypted storage provided by our hosting partner and in a secured work chat of our service. Only employees have access.
        - title: How Long We Keep It
          text: Up to three years from the last visit — service history helps with future repairs. We will delete it earlier upon your request.
        - title: Cookies
          text: The site sets one technical cookie — the chosen language. There are no advertising or analytical cookies here. The cart and anonymous identifier are stored in the browser's memory (localStorage) and do not go to our server.
        - title: Your Rights
          text: You can request a copy of your data, its correction, or deletion. Just give us a call or send us a message on any messenger.
      shopSections:
        - title: Parts Orders
          text: The order composition from the cart goes along with the application so we know what to prepare. We do not collect payment information — payment occurs at the service.
      contactTitle: Questions About the Data
      contactBefore: Call or write to us, contact details are available on the page
    notFound:
      metaTitle: Page Not Found — CarLab
      heading: This Page Does Not Exist
      body: Perhaps the link has expired or there is a typo in the address. Check our services or drop us a message — we'll assist you.
      cta: Go to Homepage
