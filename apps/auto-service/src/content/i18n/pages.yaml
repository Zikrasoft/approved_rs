      metaDescription: Address, hours, and phone number of CarLab in Belgrade. Schedule diagnostics and repairs via phone, WhatsApp, or Viber.
      eyebrow: Contact
      heading: Come by - Let’s Take a Look Together
      lead: The initial inspection is free and takes about fifteen minutes - it's not a full diagnostics, just a quick look at the car upon arrival. This is usually enough to understand what’s wrong and the estimated repair cost.
