    privacy:
      metaTitle: Politika privatnosti — CarLab
      metaDescription: Koje podatke prikuplja sajt auto servisa CarLab, zašto i koliko dugo ih čuva.
      heading: Politika privatnosti
      lastUpdated: Ažurirano 12. oktobra 2026
      sections:
        - title: Koje podatke prikupljamo
          text: Samo ono što sami unosite u formu — ime, telefon, opis problema i podatke o vozilu — kao i adresu stranice sa koje je poslat zahtev i anonimni identifikator pretraživača. Identifikator je nasumičan, čuva se u vašem pretraživaču i potreban je da isti zahtev ne postane tri kartice.
        - title: Zašto nam ti podaci
          text: Kako bismo vam se javili povodom zahteva, dogovorili vreme i vodili istoriju održavanja vašeg vozila. Ne koristimo ih za slanje oglasa i ne prenosimo ih trećim licima u reklamne svrhe.
        - title: Gde se čuvaju
          text: U šifrovanom skladištu našeg hosting provajdera i u zatvorenom radnom četu servisa. Pristup imaju samo zaposleni.
        - title: Koliko ih čuvamo
          text: Do tri godine od poslednjeg dolaska — istorija servisa pomaže prilikom sledeće popravke. Na vaš zahtev možemo ih obrisati ranije.
        - title: Kolačići
          text: Sajt postavlja tehnički kolačić sa izabranim jezikom, analitičke — Google Analytics i Yandex.Metrika — i reklamni — Meta piksel. Analitika i piksel se aktiviraju prilikom prvog učitavanja stranice; u baneru na dnu ekrana možete se odjaviti, a onda se prilikom sledećeg učitavanja neće uključiti. Yandex.Metrika beleži sesije (pokret kursora, skrolovanje i klikove). Formu za prijavu smo iz beleženja isključili, njeno sadržaj se ne prenosi. Piksel obaveštava Meta o pregledanju stranice i o tome da ste poslali prijavu, napisali nam ili izvršili narudžbinu — tako vidimo koja reklama na Facebooku i Instagramu dovodi klijente. Sadržaj forme se njemu ne prenosi. Ako nakon sajta nastavite u našem Telegram botu i ostavite tamo prijavu, naš server će obavestiti Meta samo o samom trenutku prijave — bez njenog sadržaja i bez vaših kontakt podataka. Korpa i anonimni identifikator se čuvaju u memoriji pretraživača (localStorage) i na naš server se sami ne šalju.
        - title: Vaša prava
          text: Možete zatražiti kopiju svojih podataka, njihovo ispravljanje ili brisanje. Dovoljno je da nas pozovete ili pišete u bilo koju aplikaciju.
      contactTitle: Pitanja o podacima
      contactBefore: Pozovite ili pišite, kontakti su na stranici
