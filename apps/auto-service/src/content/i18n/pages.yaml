    thanks:
      metaTitle: Application Received - CarLab
      metaDescription: Thank you for your application. We will call you back during business hours to confirm the visit time.
      eyebrow: Done
      heading: We Have Your Application
      body: We will call back during business hours - usually within an hour. If your car is not drivable, let us know via messenger, and we’ll advise on towing.
