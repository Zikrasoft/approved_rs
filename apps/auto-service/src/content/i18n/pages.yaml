    thanks:
      metaTitle: Application Received - CarLab
      metaDescription: Thank you for your application. We will call you back during business hours to confirm the visit time.
      eyebrow: Done
      heading: We Have Your Application
      body: We will call back during business hours - usually within an hour. If your car is not drivable, let us know via messenger, and we’ll advise on towing.
      note: If we can't reach you twice, we’ll message you - don’t worry.
      cta: Return to Home
    privacy:
      metaTitle: Privacy Policy - CarLab
      metaDescription: What data the CarLab website collects, why, and how long it is stored.
      heading: Privacy Policy
      lastUpdated: Last Updated October 12, 2026
      sections:
        - title: What Data We Collect
          text: Only what you enter into the form - name, phone, description of the issue, and vehicle details - as well as the address of the page from which the application was sent and an anonymous browser identifier. The identifier is random, stored in your browser, and needed to prevent a single application from turning into three records.
        - title: Why We Need This Data
          text: To return the call regarding your application, arrange the time, and maintain a service history for your vehicle. We don’t use it for newsletters and do not share it with third parties for advertising purposes.
        - title: Where It Is Stored
          text: In the encrypted storage of our hosting provider and in a closed working chat. Access is limited to staff only.
        - title: How Long We Store It
          text: Up to three years from the last visit - service history helps with future repairs. We will delete it sooner upon your request.
        - title: Cookies
          text: The site sets a technical cookie with the selected language, an analytical cookie for Google Analytics, and an advertising one - a Meta pixel. Analytics and pixel activate on the first page load; you can refuse in the banner at the bottom of the screen, and from the next load, they won’t be enabled. The pixel notifies Meta of page views and whether you submitted an application, messaged us, or placed an order - this way we see which ads on Facebook and Instagram bring in clients. The contents of the form are not sent to it. If you continue to our Telegram bot after the site and leave an application there, our server will only inform Meta of the fact of the application - without its content or your contact details. The cart and the anonymous identifier are stored in the browser's memory (localStorage) and do not leave to our server alone.
        - title: Your Rights
          text: You can request a copy of your data, its correction, or deletion. Just call or message us on any messenger.
      contactTitle: Questions About Data
      contactBefore: Call or message us, our contacts are on the page
