    privacy:
      metaTitle: Privacy policy | CarLab
      metaDescription: What data CarLab's website collects, why we collect it and how long we keep it.
      heading: Privacy policy
      lastUpdated: Updated 12 November 2026
      sections:
        - title: What data we collect
          text: Only the information you enter in a form (your name, phone number, problem description and car details), along with the page address the enquiry was sent from and an anonymous browser ID. The ID is generated at random, stored in your browser and used to prevent one enquiry from creating three records. It also lets us see which cars you've searched for by VIN when we reply to your enquiry.
        - title: Why we need this data
          text: To call you back about your enquiry, arrange a time and keep a service history for your car. We don't use your data for marketing emails or share it with third parties for advertising.
        - title: Where we store it
          text: In encrypted storage with our hosting provider and in the garage's private work chat. Only our staff have access.
        - title: How long we keep it
          text: For up to three years after your last visit, because your service history can help with future repairs. You can ask us to delete it sooner. We keep the VIN you enter when searching for parts, along with the full vehicle details decoded from it, for 90 days after your last search. After that, we delete the VIN and decoded details, keeping only the manufacturer's code (the first three VIN characters), the car's make and model. The anonymous browser ID is stored with the VIN search for the same 90 days, then deleted.
        - title: Cookies
          text: The site sets a technical cookie to remember your selected language, analytics cookies (Google Analytics and Yandex Metrica), and an advertising cookie (Meta Pixel). Analytics and the pixel start on the first page load. You can opt out using the "Cookie settings" link at the bottom of the site. If you do, they won't run from your next page load. Yandex Metrica records sessions, including cursor movement, scrolling and clicks. We exclude the enquiry form from these recordings, so its contents are never recorded. The pixel tells Meta when you view a page, send an enquiry, message us or place an order. This helps us see which Facebook and Instagram ads bring in customers. The form contents are not shared with the pixel. If you continue to our Telegram bot after visiting the site and send an enquiry there, our server tells Meta only that an enquiry was sent, not its contents or your contact details. Your cart is stored in your browser's memory (localStorage) and is not sent to our server on its own. An anonymous identifier is stored in your browser's memory and in our own visitor_id cookie. It is sent to our server when you search for parts by VIN. We use it to link your enquiries in our CRM to the cars you've searched for by VIN, so our manager can see which car you have straight away. If you opt out, the identifier and cookie are deleted.
        - title: Your rights
          text: You can ask for a copy of your data, or request that we correct or delete it. Just call or message us using any messenger app.
      contactTitle: Questions about your data
      contactBefore: Call or message us. You'll find our contact details on the
