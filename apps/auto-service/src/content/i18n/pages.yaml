    thanks:
      metaTitle: Application Received — CarLab
      metaDescription: Thank you for your application. We will call back during working hours to confirm your visit.
      eyebrow: Done
      heading: We Have Your Application
      body: We will call back during working hours — usually within an hour. If the car isn't operational, please inform us via messenger, and we will assist with towing.
      note: If we couldn't reach you after two attempts, we'll message you instead — don't lose touch.
      cta: Return to Home
    privacy:
      metaTitle: Privacy Policy — CarLab
      metaDescription: What data the CarLab service website collects, why, and how long it is stored.
      heading: Privacy Policy
      lastUpdated: Updated October 12, 2026
      sections:
        - title: What Data We Collect
          text: Only what you input in the form — name, phone, issue description, and vehicle details — along with the page address from which the application was sent, and an anonymous browser identifier. The identifier is random, stored in your browser, and necessary to prevent the same application from creating multiple entries.
        - title: Why We Need This Data
          text: To call back regarding the application, arrange a time, and maintain a service history for your vehicle. We do not use this data for newsletters and do not share it with third parties for advertising purposes.
        - title: Where It Is Stored
          text: In the encrypted storage of our hosting provider and in a closed service chat. Access is restricted to staff only.
        - title: How Long We Store It
          text: Up to three years from the last visit — the service history helps with future repairs. We can delete it sooner upon your request.
        - title: Cookies
          text: The site sets a technical cookie for the selected language, an analytical one — Google Analytics — and a marketing one — the Meta pixel. Analytics and the pixel are activated on the first page load; you can opt out through the banner at the bottom of the screen, and they will not be enabled on your next visit. The pixel reports to Meta when a page is viewed and when you submit a request, contact us, or place an order — this helps us see which ads on Facebook and Instagram bring in customers. The content of the form is not transmitted to them. If you continue in our Telegram bot after visiting the site and leave a request there, our server will inform Meta only of the fact that a request was made — without its content or your contact details. The cart and anonymous identifier are stored in the browser's memory (localStorage) and do not leave our server by themselves.
        - title: Your Rights
          text: You can request a copy of your data, have it corrected, or delete it. Just call us or message us on any platform.
      shopSections:
        - title: Parts Orders
          text: The contents of the order from the cart are sent with the application so we understand what to prepare. We do not collect payment information — payment occurs at the service.
      contactTitle: Data Questions
      contactBefore: Call or message us, the contact details are on the page
