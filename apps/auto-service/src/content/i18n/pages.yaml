privacy:
  metaTitle: Политика конфиденциальности | CarLab
  metaDescription: Какие данные собирает сайт автосервиса CarLab, зачем и как долго они хранятся.
  heading: Политика конфиденциальности
  lastUpdated: Обновлено 2 ноября 2026
  sections:
    - title: Какие данные мы собираем
      text: Только то, что вы сами вводите в форму (имя, телефон, описание проблемы и данные автомобиля), а также адрес страницы, с которой отправлена заявка, и анонимный идентификатор браузера. Идентификатор случайный, хранится в вашем браузере и нужен, чтобы одна и та же заявка не превратилась в три карточки.
    - title: Зачем нам эти данные
      text: Чтобы перезвонить по заявке, согласовать время и вести историю обслуживания вашей машины. Мы не используем их для рассылок и не передаем третьим лицам в рекламных целях.
    - title: Где они хранятся
      text: В зашифрованном хранилище нашего хостинг-провайдера и в закрытом рабочем чате сервиса. Доступ есть только у сотрудников.
    - title: Сколько мы их храним
      text: До трех лет с момента последнего визита, потому что сервисная история помогает при следующем ремонте. По вашему запросу удалим раньше. VIN, который вы вводите в поиске запчастей, и полную расшифровку автомобиля по нему мы храним 90 дней с последнего поиска. Затем VIN и расшифровка удаляются, остаются только код производителя (первые три знака VIN), марка и модель машины.
    - title: Куки
      text: Сайт ставит техническую куку с выбранным языком, аналитические (Google Analytics и Яндекс.Метрику) и рекламную (пиксель Meta). Аналитика и пиксель запускаются при первой загрузке страницы; в баннере внизу экрана можно отказаться, и тогда со следующей загрузки они не включаются. Яндекс.Метрика записывает сессии (движение курсора, прокрутку и клики). Форму заявки мы из записи исключили, ее содержимое туда не попадает. Пиксель сообщает Meta о просмотре страницы и о том, что вы отправили заявку, написали нам или оформили заказ, так мы видим, какая реклама в Facebook и Instagram приводит клиентов. Содержимое формы ему не передается. Если после сайта вы продолжите в нашем Telegram-боте и оставите там заявку, наш сервер сообщит Meta только сам факт заявки, без ее содержания и без ваших контактов. Корзина и анонимный идентификатор хранятся в памяти браузера (localStorage) и на наш сервер сами по себе не уходят.
    - title: Ваши права
      text: Вы можете запросить копию своих данных, их исправление или удаление. Достаточно позвонить или написать нам в любой мессенджер.
  contactTitle: Вопросы по данным
  contactBefore: Позвоните или напишите, контакты есть на странице
