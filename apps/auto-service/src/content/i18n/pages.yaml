    privacy:
      metaTitle: Privacy Policy - CarLab
      metaDescription: What data the CarLab website collects, why, and how long it is stored.
      heading: Privacy Policy
      lastUpdated: Last updated October 12, 2026
      sections:
        - title: What Data We Collect
          text: Only what you enter in the form — name, phone, problem description, and vehicle details — as well as the page address from which the application was submitted, and an anonymous browser identifier. The identifier is random, stored in your browser, and is needed to ensure the same application does not create multiple records.
        - title: Why We Need This Data
          text: To return your call regarding the application, schedule an appointment, and maintain a service history for your vehicle. We do not use this data for mailing lists or share it with third parties for advertising purposes.
        - title: Where It Is Stored
          text: In an encrypted storage of our hosting provider and in a private work chat for the service. Access is restricted to employees only.
        - title: How Long We Keep It
          text: Up to three years from the last visit — the service history is useful for the next repair. We will delete it sooner upon your request.
        - title: Cookies
          text: The site sets a technical cookie for the chosen language, an analytical one — Yandex.Metrica — and a marketing one — Meta pixel. The analytics and pixel activate upon the first page load; you can decline it in the banner at the bottom of the screen, and it will not activate again on the next load. Metrica tracks sessions — mouse movements, scrolls, and clicks — but we exclude the application form from the recording. The pixel notifies Meta about page views and when you submitted an application, contacted us, or placed an order — this helps us track which ads on Facebook and Instagram bring in customers. The form contents are not sent to it. If you continue in our Telegram bot after the website and leave an application there, our server will inform Meta only about the submission without its content or your contact details. The cart and anonymous identifier are stored in the browser’s local storage and do not leave to our server by themselves.
        - title: Your Rights
          text: You can request a copy of your data, its correction, or deletion. Just call or write to us on any messenger.
      shopSections:
        - title: Parts Orders
          text: Order details from the cart are sent along with the application, so we understand what to prepare. We do not collect payment data — payment is made at the service.
      contactTitle: Questions About Data
      contactBefore: Call or write, contact info is available on the page.
