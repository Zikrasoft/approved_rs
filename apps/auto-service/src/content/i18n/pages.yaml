    thanks:
      metaTitle: Application Received — CarLab
      metaDescription: Thank you for your application. We will call you during business hours to arrange a visit time.
      eyebrow: Done
      heading: We've Got Your Application
      body: We'll call you during business hours — usually within an hour. If the car is immobile, please mention that in the messenger, and we'll advise you regarding towing.
      note: If we can't reach you after two attempts, we'll send a message in the messenger — don't worry.
      cta: Return to Homepage
    privacy:
      metaTitle: Privacy Policy — CarLab
      metaDescription: What data the CarLab car service website collects, why, and how long they are stored.
      heading: Privacy Policy
      lastUpdated: Updated September 12, 2026
      sections:
        - title: What Data We Collect
          text: Only what you enter in the form — name, phone number, issue description, and vehicle information — as well as the page address from which the application is submitted, and an anonymous browser identifier. The identifier is random, stored in your browser, and needed to ensure that the same application doesn't turn into three cards.
        - title: Why We Need This Data
          text: To call back regarding the application, agree on a time, and keep a service history for your car. We do not use it for mailing lists and do not share it with third parties for advertising purposes.
        - title: Where It Is Stored
          text: In the encrypted storage of our hosting provider and in a closed working chat for the service. Access is only available to employees.
        - title: How Long We Store It
          text: Up to three years from the last visit — service history helps with future repairs. We will delete it earlier upon your request.
        - title: Cookies
          text: The site sets a technical cookie for the selected language and an analytical one — Yandex.Metrica. Analytics start on the first page load; you can refuse it in the banner at the bottom of the screen, and then it won't activate on the next load. The metrics record sessions — cursor movement, scrolling, and clicks — but we excluded the application form from the recording. There are no advertising cookies here. The cart and anonymous identifier are stored in the browser's memory (localStorage) and do not leave our server by themselves.
        - title: Your Rights
          text: You can request a copy of your data, their correction, or deletion. Just call or message us on any messenger.
      shopSections:
        - title: Parts Orders
          text: The order from the cart is sent along with your application, so we know what to prepare. We do not collect payment information — payments are made at the service.
      contactTitle: Data Questions
      contactBefore: Call or message us, contacts are available on the page
    notFound:
      metaTitle: Page Not Found — CarLab
      heading: This Page Does Not Exist
      body: The link may be outdated or there could be a typo in the address. Check out our services or message us — we can help.
      cta: Go to Homepage
