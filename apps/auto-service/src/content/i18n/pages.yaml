    privacy:
      metaTitle: Politika privatnosti | CarLab
      metaDescription: Koje podatke prikuplja sajt auto-servisa CarLab, zašto ih prikuplja i koliko dugo ih čuva.
      heading: Politika privatnosti
      lastUpdated: Ažurirano 12. oktobra 2026.
      sections:
        - title: Koje podatke prikupljamo
          text: Samo ono što sami unesete u obrazac (ime, telefon, opis problema i podatke o vozilu), kao i adresu stranice sa koje je upit poslat i anonimni identifikator pregledača. Identifikator se nasumično generiše, čuva se u vašem pregledaču i služi da isti upit ne bude zaveden tri puta.
        - title: Zašto su nam ovi podaci potrebni
          text: Da bismo vas pozvali povodom upita, dogovorili termin i vodili servisnu istoriju vašeg automobila. Ne koristimo ih za slanje promotivnih poruka i ne prosleđujemo ih trećim licima u reklamne svrhe.
        - title: Gde se podaci čuvaju
          text: U šifrovanom skladištu našeg hosting provajdera i u zatvorenoj grupi za poslovnu komunikaciju servisa. Pristup imaju samo zaposleni.
        - title: Koliko dugo čuvamo podatke
          text: Do tri godine od poslednje posete, jer servisna istorija pomaže pri sledećoj popravci. Na vaš zahtev obrisaćemo ih i ranije.
        - title: Kolačići
          text: Sajt postavlja tehnički kolačić za izabrani jezik, analitičke kolačiće (Google Analytics i Yandex.Metrica) i reklamni kolačić (Meta piksel). Analitika i piksel pokreću se pri prvom učitavanju stranice. Možete ih odbiti u baneru pri dnu ekrana i tada se od sledećeg učitavanja više neće pokretati. Yandex.Metrica snima sesije (pomeranje kursora, skrolovanje i klikove). Obrazac za upit isključili smo iz snimanja, pa se njegov sadržaj ne beleži. Piksel obaveštava kompaniju Meta o pregledu stranice i o tome da ste poslali upit, pisali nam ili poručili robu. Tako vidimo koji oglasi na Facebook-u i Instagram-u dovode klijente. Sadržaj obrasca mu se ne prosleđuje. Ako posle posete sajtu nastavite razgovor u našem Telegram botu i tamo ostavite upit, naš server će kompaniji Meta poslati samo informaciju da je upit poslat, bez njegovog sadržaja i vaših kontakt podataka. Korpa i anonimni identifikator čuvaju se u memoriji pregledača (localStorage) i sami po sebi se ne šalju na naš server.
        - title: Vaša prava
          text: Možete zatražiti kopiju svojih podataka, njihovu ispravku ili brisanje. Dovoljno je da nas pozovete ili nam pišete putem bilo koje aplikacije za poruke.
