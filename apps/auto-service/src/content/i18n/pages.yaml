    thanks:
      metaTitle: Application received — CarLab
      metaDescription: Thank you for your application. We will call back during business hours to arrange your visit.
      eyebrow: Done
      heading: We've received your application
      body: We'll call back during business hours — usually within an hour. If your car is immobile, let us know via messenger and we'll advise on tow services.
      note: If we can't reach you twice, we'll message you — don’t get lost.
      cta: Return to homepage
    privacy:
      metaTitle: Privacy policy — CarLab
      metaDescription: What data CarLab collects, why, and how long it is stored.
      heading: Privacy policy
      lastUpdated: Last updated October 12, 2026
      sections:
        - title: What data do we collect
          text: Only what you enter into the form — your name, phone, problem description, and vehicle data — along with the address of the page from which the request was sent and an anonymous browser identifier. The identifier is random, stored in your browser, and needed to prevent the same request from turning into three cards.
        - title: Why do we need this data
          text: To return your call regarding the request, arrange a time, and maintain the service history of your car. We do not use it for newsletters and do not share it with third parties for promotional purposes.
        - title: Where is it stored
          text: In encrypted storage provided by our hosting service and in a closed work chat of the service. Access is restricted to employees.
        - title: How long do we store it
          text: For up to three years from your last visit — the service history is helpful for future repairs. We will remove it earlier upon your request.
        - title: Cookies
          text: The site sets a technical cookie with the selected language, analytics cookies — Google Analytics and Yandex.Metrica — and an advertising cookie — Meta pixel. Analytics and the pixel start with the first page load; you can opt-out in the banner at the bottom of the screen, and they will not load on the next visit. Yandex.Metrica records sessions (cursor movement, scrolling, and clicks). We excluded the application form from the recording, its content is not captured. The pixel informs Meta about page views and whether you submitted a request, messaged us, or placed an order — this way we track which ads on Facebook and Instagram bring clients. The form content is not shared with it. If you continue in our Telegram bot after visiting the site and leave a request there, our server informs Meta only of the request's existence — without its content and your contact details. The cart and anonymous identifier are stored in your browser’s memory (localStorage) and do not leave our server by themselves.
        - title: Your rights
          text: You can request a copy of your data, its correction, or deletion. Just call or message us on any platform.
      contactTitle: Questions regarding data
      contactBefore: Call or message us, contact details are available on the page
