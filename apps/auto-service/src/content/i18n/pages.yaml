works:
  metaTitle: Примеры работ автосервиса в Белграде — CarLab
  metaDescription: Что нашли на диагностике, что сделали и сколько это заняло. Реальная работа автосервиса CarLab в Белграде.
  eyebrow: Примеры работ
  heading: Что мы делали и чем это закончилось
  lead: 'Разбор конкретных случаев из нашего автосервиса в Белграде: с чем приехала машина, что нашли на диагностике, что сделали и сколько это заняло.'
  detailMetaSuffix: CarLab
  detailCtaHeading: Похожая проблема?
  detailCtaBody: Опишите симптомы — скажем, на что это похоже и сколько будет стоить диагностика.
contact:
  metaTitle: Контакты автосервиса CarLab в Белграде — адрес и телефон
  metaDescription: Адрес, часы работы и телефон автосервиса CarLab в Белграде. Запись на диагностику и ремонт по телефону, в WhatsApp или Viber.
  eyebrow: Контакты
  heading: Приезжайте — посмотрим машину вместе
  lead: Первичный осмотр бесплатный и занимает минут пятнадцать. Этого обычно хватает, чтобы понять, что с машиной и сколько будет стоить ремонт.
  addressLabel: Адрес
  hoursLabel: Часы работы
  mapHeading: Как доехать
  mapNote: Ориентируйтесь на точку на карте — навигатор доводит до места. Есть парковка для клиентов.
  arrivalHeading: Что взять с собой
  arrival:
    - Сервисную книжку, если она есть — это экономит время на диагностике.
    - Ключ от секреток на колёсах, если ставили.
    - Если проблема плавающая — приезжайте на «холодной» машине, так её проще поймать.
thanks:
  metaTitle: Заявка принята — CarLab
  metaDescription: Спасибо за заявку. Перезвоним в рабочее время и согласуем время визита.
  eyebrow: Готово
  heading: Заявка у нас
  body: Перезвоним в рабочее время — обычно в течение часа. Если машина не на ходу, напишите об этом в мессенджер, подскажем по эвакуатору.
  note: Если мы не дозвонились дважды, то напишем в мессенджер — не теряйтесь.
  cta: Вернуться на главную
privacy:
  metaTitle: Политика конфиденциальности — CarLab
  metaDescription: Какие данные собирает сайт автосервиса CarLab, зачем и как долго они хранятся.
  heading: Политика конфиденциальности
  lastUpdated: Обновлено 12 сентября 2026
  sections:
    - title: Какие данные мы собираем
      text: Только то, что вы сами вводите в форму — имя, телефон, описание проблемы и данные автомобиля, — а также адрес страницы, с которой отправлена заявка, и анонимный идентификатор браузера. Идентификатор случайный, хранится в вашем браузере и нужен, чтобы одна и та же заявка не превратилась в три карточки.
    - title: Зачем нам эти данные
      text: Чтобы перезвонить по заявке, согласовать время и вести историю обслуживания вашей машины. Мы не используем их для рассылок и не передаём третьим лицам в рекламных целях.
    - title: Где они хранятся
      text: В зашифрованном хранилище нашего хостинг-провайдера и в закрытом рабочем чате сервиса. Доступ есть только у сотрудников.
    - title: Сколько мы их храним
      text: До трёх лет с момента последнего визита — сервисная история помогает при следующем ремонте. По вашему запросу удалим раньше.
    - title: Куки
      text: Сайт ставит одну техническую куку — выбранный язык. Рекламных и аналитических кук здесь нет. Корзина и анонимный идентификатор хранятся в памяти браузера (localStorage) и на наш сервер сами по себе не уходят.
    - title: Ваши права
      text: Вы можете запросить копию своих данных, их исправление или удаление. Достаточно позвонить или написать нам в любой мессенджер.
  shopSections:
    - title: Заказы запчастей
      text: Состав заказа из корзины уходит вместе с заявкой, чтобы мы понимали, что готовить. Платёжных данных мы не собираем — оплата происходит в сервисе.
  contactTitle: Вопросы по данным
  contactBefore: Позвоните или напишите, контакты есть на странице
notFound:
  metaTitle: Страница не найдена — CarLab
  heading: Такой страницы нет
  body: Возможно, ссылка устарела или в адресе опечатка. Посмотрите услуги или напишите нам — подскажем.
  cta: На главную
translations:
  sr:
    works:
      metaTitle: Primeri radova auto servisa u Beogradu — CarLab
      metaDescription: Šta smo pronašli tokom dijagnostike, šta smo uradili i koliko je to trajalo. Pravi rad auto servisa CarLab u Beogradu.
      eyebrow: Primeri radova
      heading: Šta smo radili i kako se završilo
      lead: 'Razmatranje konkretnih slučajeva našeg auto servisa u Beogradu: sa čime je došao automobil, šta smo pronašli tokom dijagnostike, šta smo uradili i koliko je to trajalo.'
      detailMetaSuffix: CarLab
      detailCtaHeading: Imate sličan problem?
      detailCtaBody: Opisanite simptome — recite kako to izgleda i koliko će koštati dijagnostika.
    contact:
      metaTitle: Kontakti auto servisa CarLab u Beogradu — adresa i telefon
      metaDescription: Adresa, radno vreme i telefon auto servisa CarLab u Beogradu. Zakazivanje dijagnostike i popravki putem telefona, WhatsApp-a ili Viber-a.
      eyebrow: Kontakti
      heading: Dođite — pregledamo automobil zajedno
      lead: Prvobitna proba je besplatna i traje oko petnaest minuta. Obično je to dovoljno da shvatimo šta je sa automobilom i koliko će koštati popravka.
      addressLabel: Adresa
      hoursLabel: Radno vreme
      mapHeading: Kako doći
      mapNote: Orijentišite se prema tački na karti — navigator vas dovodi do tačne lokacije. Postoji parking za klijente.
      arrivalHeading: Šta poneti sa sobom
      arrival:
        - Servisnu knjižicu, ako je imate — to štedi vreme tokom dijagnostike.
        - Ključ od zaštitnog zaključavanja na točkovima, ako je postavljen.
        - Ako je problem povremen — dođite sa "hladnim" automobilom, tako će biti lakše da se uhvati.
    thanks:
      metaTitle: Zahtev primljen — CarLab
      metaDescription: Hvala na zahtevu. Javićemo se u radno vreme i dogovoriti vreme posete.
      eyebrow: Gotovo
      heading: Imamo vaš zahtev
      body: Javićemo se u radno vreme — obično u roku od sat vremena. Ako automobil nije u voznom stanju, javite nam to u poruci, pomoći ćemo oko vučne službe.
      note: Ako se ne javimo dva puta, poslaćemo poruku — nemojte se gubiti.
      cta: Vrati se na početnu stranu
    privacy:
      metaTitle: Politika privatnosti — CarLab
      metaDescription: Koje podatke prikuplja sajt auto servisa CarLab, zašto i koliko dugo ih čuva.
      heading: Politika privatnosti
      lastUpdated: Ažurirano 12. septembra 2026
      sections:
        - title: Koje podatke prikupljamo
          text: Samo ono što vi sami unosite u obrazac — ime, telefon, opis problema i podaci o vozilu, — kao i adresa stranice sa koje je poslat zahtev, i anonimni identifikator pretraživača. Identifikator je nasumičan, čuva se u vašem pretraživaču i potreban je da isti zahtev ne postane tri kartice.
        - title: Zašto su nam ti podaci
          text: Da bismo vam se javili u vezi sa zahtevom, dogovorili vreme i vodili evidenciju o servisiranju vašeg automobila. Ne koristimo ih za slanje obaveštenja i ne prenosimo ih trećim licima u reklamne svrhe.
        - title: Gde se čuvaju
          text: U enkriptedom skladištu našeg hosting provajdera i u zatvorenom radnom četu servisa. Pristup imaju samo zaposleni.
        - title: Koliko ih čuvamo
          text: Do tri godine od poslednje posete — istorija servisa pomaže prilikom naredne popravke. Na vaš zahtev uklonićemo ih ranije.
        - title: Kolačići
          text: Sajt postavlja jedan tehnički kolačić — izabrani jezik. Oglašivačkih i analitičkih kolačića ovde nema. Korpa i anonimni identifikator se čuvaju u memoriji pretraživača (localStorage) i sami po sebi ne odlaze na naš server.
        - title: Vaša prava
          text: Možete zatražiti kopiju svojih podataka, njihovo ispravljenje ili brisanje. Dovoljno je da nas pozovete ili pišete u bilo kojem messenger-u.
      shopSections:
        - title: Porudžbine rezervnih delova
          text: Sadržaj porudžbine iz korpe odlazi zajedno sa zahtevom, kako bismo znali šta da pripremimo. Podatke o plaćanju ne prikupljamo — plaćanje se vrši u servisu.
      contactTitle: Pitanja o podacima
      contactBefore: Pozovite ili pišite, kontakti su na stranici
    notFound:
      metaTitle: Stranica nije pronađena — CarLab
      heading: Ova stranica ne postoji
      body: Možda je link zastareo ili je u adresi greška. Pogledajte usluge ili nam pišite — pomoći ćemo vam.
      cta: Nazad na početnu
  en:
    works:
      metaTitle: Examples of Car Service Work in Belgrade — CarLab
      metaDescription: What we found during diagnostics, what we did, and how long it took. Real work from CarLab in Belgrade.
      eyebrow: Work Examples
      heading: What We've Done and the Outcome
      lead: 'A breakdown of specific cases from our car service in Belgrade: what the car came in for, what we found during diagnostics, what was done, and how long it took.'
      detailMetaSuffix: CarLab
      detailCtaHeading: Have a Similar Problem?
      detailCtaBody: Describe the symptoms — for example, what it feels like and how much the diagnostics might cost.
    contact:
      metaTitle: Contact CarLab in Belgrade — Address and Phone
      metaDescription: Address, working hours, and phone number for CarLab in Belgrade. Schedule diagnostics and repairs via phone, WhatsApp, or Viber.
      eyebrow: Contact
      heading: Stop by — Let's Check the Car Together
      lead: The initial inspection is free and takes about fifteen minutes. That's usually enough to understand what's wrong with the car and how much the repair will cost.
      addressLabel: Address
      hoursLabel: Working Hours
      mapHeading: How to Get Here
      mapNote: Use the point on the map as your guide — the navigator will lead you to the location. There is parking available for clients.
