    privacy:
      metaTitle: Politika privatnosti — CarLab
      metaDescription: Koje podatke prikuplja sajt auto servisa CarLab, zašto i koliko dugo ih čuva.
      heading: Politika privatnosti
      lastUpdated: Ažurirano 12. oktobra 2026
      sections:
        - title: Koje podatke prikupljamo
          text: Samo ono što sami unosite u formu — ime, telefon, opis problema i podaci o automobilu, kao i adresa stranice s koje je poslat zahtev i anonimni identifikator pregledača. Identifikator je nasumičan, čuva se u vašem pregledaču i potreban je da jedan te isti zahtev ne postane tri kartice.
        - title: Zašto nam ovi podaci trebaju
          text: Da bismo se javili na zahtev, dogovorili vreme i vodili istoriju servisiranja vašeg automobila. Ne koristimo ih za slanje reklama i ne prosleđujemo trećim licima u marketinške svrhe.
        - title: Gde se čuvaju
          text: U enkriptovanoj bazi podataka našeg hosting provajdera i u zatvorenom radnom čatu servisa. Pristup imaju samo zaposleni.
        - title: Koliko ih čuvamo
          text: Do tri godine od poslednje posete — servisna istorija pomaže prilikom sledeće popravke. Na vaš zahtev možemo obrisati ranije.
        - title: Kolačići
          text: Sajt postavlja tehnički kolačić s odabranim jezikom, analitičke — Google Analytics i Yandex.Metrica — i reklamni — Meta piksel. Analitika i piksel se aktiviraju pri prvom učitavanju stranice; u baneru na dnu ekrana možete odbiti, i tada se pri sledećem učitavanju ne uključuju. Yandex.Metrica snima sesije (pokret kursora, skrolovanje i klikovi). Formu zahteva isključili smo iz snimanja, njen sadržaj ne ulazi u bazu. Piksel obaveštava Meta o prikazu stranice i o tome što ste poslali zahtev, pisali nam ili poručili — tako vidimo koja reklama na Facebook-u i Instagram-u donosi klijente. Sadržaj forme se njemu ne prosleđuje. Ako nakon sajta nastavite u našem Telegram botu i ostavite zahtev, naš server obaveštava Meta samo o činjenici zahteva — bez njegovog sadržaja i bez vaših podataka. Korpa i anonimni identifikator čuvaju se u memoriji pregledača (localStorage) i na naš server sami po sebi ne odlaze.
        - title: Vaša prava
          text: Možete zatražiti kopiju svojih podataka, njihovu ispravku ili brisanje. Dovoljno je da nas nazovete ili napišete u bilo koji messenger.
