privacy:
  metaTitle: Политика конфиденциальности | CarLab
  metaDescription: Какие данные собирает сайт автосервиса CarLab, зачем и как долго они хранятся.
  heading: Политика конфиденциальности
  lastUpdated: Обновлено 12 ноября 2026
  sections:
    - title: Какие данные мы собираем
      text: Только то, что вы сами вводите в форму (имя, телефон, описание проблемы и данные автомобиля), а также адрес страницы, с которой отправлена заявка, и анонимный идентификатор браузера. Идентификатор случайный, хранится в вашем браузере и нужен, чтобы одна и та же заявка не превратилась в три карточки, а также чтобы, отвечая на заявку, мы видели, какие машины вы искали по VIN.
    - title: Зачем нам эти данные
      text: Чтобы перезвонить по заявке, согласовать время и вести историю обслуживания вашей машины. Мы не используем их для рассылок и не передаем третьим лицам в рекламных целях.
    - title: Где они хранятся
      text: В зашифрованном хранилище нашего хостинг-провайдера и в закрытом рабочем чате сервиса. Доступ есть только у сотрудников.
    - title: Сколько мы их храним
      text: До трех лет с момента последнего визита, потому что сервисная история помогает при следующем ремонте. По вашему запросу удалим раньше. VIN, который вы вводите в поиске запчастей, и полную расшифровку автомобиля по нему мы храним 90 дней с последнего поиска. Затем VIN и расшифровка удаляются, остаются только код производителя (первые три знака VIN), марка и модель машины. Анонимный идентификатор браузера хранится вместе с поиском по VIN тоже 90 дней и затем удаляется.
    - title: Куки
      text: Сайт ставит техническую куку с выбранным языком, аналитические (Google Analytics и Яндекс.Метрику) и рекламную (пиксель Meta). Аналитика и пиксель запускаются при первой загрузке страницы; отказаться можно по ссылке «Настройки cookie» внизу сайта, и тогда со следующей загрузки они не включаются. Яндекс.Метрика записывает сессии (движение курсора, прокрутку и клики). Форму заявки мы из записи исключили, ее содержимое туда не попадает. Пиксель сообщает Meta о просмотре страницы и о том, что вы отправили заявку, написали нам или оформили заказ, так мы видим, какая реклама в Facebook и Instagram приводит клиентов. Содержимое формы ему не передается. Если после сайта вы продолжите в нашем Telegram-боте и оставите там заявку, наш сервер сообщит Meta только сам факт заявки, без ее содержания и без ваших контактов. Корзина хранится в памяти браузера (localStorage) и на наш сервер сама по себе не уходит. Анонимный идентификатор хранится в памяти браузера и в нашей собственной куке visitor_id, с ней он уходит на наш сервер, когда вы ищете запчасти по VIN. По нему мы связываем ваши заявки в нашей CRM с тем, какие машины вы искали по VIN, чтобы менеджер сразу видел ваш автомобиль. Если отказаться, идентификатор и кука удаляются.
    - title: Ваши права
      text: Вы можете запросить копию своих данных, их исправление или удаление. Достаточно позвонить или написать нам в любой мессенджер.
  contactTitle: Вопросы по данным
  contactBefore: Позвоните или напишите, контакты есть на странице
