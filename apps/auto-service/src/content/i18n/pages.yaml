    privacy:
      metaTitle: Politika privatnosti | CarLab
      metaDescription: Koje podatke prikuplja sajt auto servisa CarLab, zašto su nam potrebni i koliko dugo ih čuvamo.
      heading: Politika privatnosti
      lastUpdated: Ažurirano 2. novembra 2026.
      sections:
        - title: Koje podatke prikupljamo
          text: Samo podatke koje sami unesete u obrazac (ime, telefon, opis problema i podatke o vozilu), kao i adresu stranice sa koje je upit poslat i anonimni identifikator pregledača. Identifikator je nasumičan, čuva se u Vašem pregledaču i služi da isti upit ne bude evidentiran tri puta.
        - title: Zašto su nam ovi podaci potrebni
          text: Da bismo Vas pozvali povodom upita, dogovorili termin i vodili servisnu istoriju Vašeg automobila. Ne koristimo ih za slanje promotivnih poruka i ne prosleđujemo ih trećim licima u reklamne svrhe.
        - title: Gde čuvamo podatke
          text: U šifrovanom skladištu našeg hosting provajdera i u zatvorenom poslovnom četu servisa. Pristup imaju samo zaposleni.
        - title: Koliko dugo čuvamo podatke
          text: Do tri godine od poslednje posete, jer servisna istorija pomaže pri sledećoj popravci. Na Vaš upit podatke ćemo obrisati i ranije. VIN koji unosite u pretragu delova i sve podatke o vozilu dobijene na osnovu njega čuvamo 90 dana od poslednje pretrage. Nakon toga brišemo VIN i podatke dobijene njegovim dekodiranjem, a zadržavamo samo oznaku proizvođača (prva tri znaka VIN-a), marku i model vozila.
        - title: Kolačići
          text: Sajt postavlja tehnički kolačić za izabrani jezik, analitičke kolačiće (Google Analytics i Yandex Metrica) i reklamni kolačić (Meta piksel). Analitika i piksel se pokreću pri prvom učitavanju stranice. Možete ih odbiti u baneru na dnu ekrana, nakon čega se neće pokretati od sledećeg učitavanja. Yandex Metrica snima sesije (pomeranje kursora, skrolovanje i klikove). Obrazac za upit smo isključili iz snimanja, pa se njegov sadržaj ne beleži. Piksel obaveštava kompaniju Meta da ste pregledali stranicu, poslali upit, pisali nam ili napravili porudžbinu. Tako vidimo koji oglasi na Facebooku i Instagramu dovode klijente. Sadržaj obrasca se ne prosleđuje pikselu. Ako nakon posete sajtu nastavite u našem Telegram botu i tamo ostavite upit, naš server će kompaniji Meta proslediti samo informaciju da je upit poslat, bez njegovog sadržaja i Vaših kontakt podataka. Korpa i anonimni identifikator čuvaju se u lokalnoj memoriji pregledača (localStorage) i ne šalju se automatski na naš server.
        - title: Vaša prava
          text: Možete zatražiti kopiju svojih podataka, njihovu ispravku ili brisanje. Dovoljno je da nas pozovete ili nam pišete putem bilo koje aplikacije za poruke.
