    privacy:
      metaTitle: Privacy policy | CarLab
      metaDescription: What data the CarLab workshop website collects, why we collect it and how long we keep it.
      heading: Privacy policy
      lastUpdated: Updated 12 October 2026
      sections:
        - title: What data we collect
          text: Only the details you enter in the form (your name, phone number, description of the problem and vehicle details), plus the address of the page you submitted the request from and an anonymous browser identifier. This identifier is randomly generated and stored in your browser. It helps prevent a single request from creating three separate records.
        - title: Why we need this data
          text: To call you back about your request, arrange an appointment and keep your car's service history. We don't use it for mailing lists or share it with third parties for advertising purposes.
        - title: Where we store it
          text: In encrypted storage provided by our hosting provider and in the workshop's private work chat. Only staff have access.
        - title: How long we keep it
          text: For up to three years after your last visit, because your service history helps with future repairs. We'll delete it sooner if you ask.
        - title: Cookies
          text: The site sets a functional cookie to remember your chosen language, analytics cookies (Google Analytics and Yandex Metrica) and an advertising cookie (Meta pixel). Analytics and the pixel start when you first load a page. You can opt out using the banner at the bottom of the screen, and they will stop running from the next page load. Yandex Metrica records sessions, including cursor movements, scrolling and clicks. We have excluded the enquiry form from these recordings, so its contents are not captured. The pixel tells Meta when you view a page, submit an enquiry, message us or place an order. This helps us see which Facebook and Instagram ads bring in customers. The contents of the form are not shared with the pixel. If you continue from the website to our Telegram bot and submit an enquiry there, our server tells Meta only that an enquiry was submitted, without its contents or your contact details. Your basket and anonymous identifier are stored in your browser's local storage (localStorage) and are not sent to our server on their own.
        - title: Your rights
          text: You can request a copy of your data or ask us to correct or delete it. Just call us or message us on any of our messaging apps.
      contactTitle: Questions about your data
      contactBefore: Call or message us. You'll find our details on the
