    privacy:
      metaTitle: Politika privatnosti – CarLab
      metaDescription: Koje podatke prikuplja sajt auto servisa CarLab, zašto i koliko dugo ih čuva.
      heading: Politika privatnosti
      lastUpdated: Ažurirano 12. oktobra 2026
      sections:
        - title: Koje podatke prikupljamo
          text: Samo ono što sami unesete u obrazac – ime, telefon, opis problema i podaci o automobilu, kao i adresa stranice sa koje je poslat zahtev, i anonimni identifikator pretraživača. Identifikator je nasumičan, čuva se u vašem pretraživaču i potreban je da ista prijava ne postane tri kartice.
        - title: Zašto nam ti podaci
          text: Da bismo se javili po prijavi, dogovorili vreme i vodili evidenciju o servisiranju vaše mašine. Ne koristimo ih za slanje obaveštenja i ne prosleđujemo trećim stranama u reklamne svrhe.
        - title: Gde se čuvaju
          text: U enkriptovanoj arhivi našeg hosting provajdera i u zatvorenoj radnoj grupi servisa. Pristup imaju samo zaposleni.
        - title: Koliko ih čuvamo
          text: Do tri godine od poslednje posete – servisna istorija pomaže kod sledeće popravke. Na vaš zahtev, uklonićemo ih ranije.
        - title: Kolačići
          text: Sajt postavlja tehnički kolačić sa izabranim jezikom, analitički – Yandex.Metrika – i reklamni – Meta piksel. Analitika i piksel se aktiviraju prilikom prvog učitavanja stranice; u baneru na dnu ekrana možete odbiti, a tada se prilikom sledećeg učitavanja ne aktiviraju. Metrika beleži sesije – kretanje kursora, skrolovanje i klikove, ali obrazac zahteva nisu uključili. Piksel obaveštava Meta o pregledu stranice i o tome da ste poslali zahtev, javili se ili izvršili porudžbinu – tako vidimo koja reklama na Facebook-u i Instagram-u privlači klijente. Sadržaj obrasca mu se ne prenosi. Ako nakon sajta nastavite u našem Telegram botu i ostavite zahtev, naš server će obavestiti Meta samo o samom zahtevu – bez sadržaja i bez vaših kontakata. Korpa i anonimni identifikator čuvaju se u memoriji pretraživača (localStorage) i sami ne odlaze na naš server.
        - title: Vaša prava
          text: Možete zatražiti kopiju svojih podataka, njihovo ispravljenje ili uklanjanje. Dovoljno je da nas pozovete ili napišete u bilo kojoj poruci.
      shopSections:
        - title: Porudžbine delova
          text: Sadržaj porudžbine iz korpe odlazi zajedno s zahtevom, da bismo razumeli šta da pripremimo. Podatke o plaćanju ne prikupljamo – uplata se vrši u servisu.
      contactTitle: Pitanja o podacima
      contactBefore: Pozovite ili pišite, kontakti su na stranici
