    privacy:
      metaTitle: Privacy policy | CarLab
      metaDescription: What data the CarLab website collects, why we collect it and how long we keep it.
      heading: Privacy policy
      lastUpdated: Updated 2 November 2026
      sections:
        - title: What data we collect
          text: Only the information you enter in the form (your name, phone number, description of the problem and vehicle details), along with the address of the page you sent the enquiry from and an anonymous browser identifier. This identifier is randomly generated and stored in your browser. It helps prevent the same enquiry from creating three separate records.
        - title: Why we need this data
          text: To call you back about your enquiry, arrange an appointment and keep a service history for your car. We don't use it for mailing lists or share it with third parties for advertising purposes.
        - title: Where we store it
          text: In encrypted storage provided by our hosting provider and in the workshop's private team chat. Only staff have access.
        - title: How long we keep it
          text: We keep your records for up to three years after your last visit, as your service history helps with future repairs. We will delete them sooner on request. We store the VIN you enter in the parts search and the full vehicle details decoded from it for 90 days after your last search. After that, the VIN and decoded details are deleted. We retain only the manufacturer identifier (the first three characters of the VIN), the make and the model.
        - title: Cookies
          text: The website sets a functional cookie to remember your chosen language, analytics cookies (Google Analytics and Yandex Metrica) and an advertising cookie (Meta pixel). Analytics and the pixel start when you first load a page. You can opt out using the banner at the bottom of the screen, and they will stop running from the next page load. Yandex Metrica records sessions (cursor movements, scrolling and clicks). We have excluded the enquiry form from these recordings, so its contents are not captured. The pixel tells Meta when you view a page, submit an enquiry, message us or place an order. This helps us see which Facebook and Instagram ads bring in customers. The contents of the form are not shared with it. If you continue to our Telegram bot after visiting the website and submit an enquiry there, our server will tell Meta only that an enquiry was submitted, without its contents or your contact details. Your cart and anonymous identifier are stored in your browser's localStorage and are not sent to our server on their own.
        - title: Your rights
          text: You can request a copy of your data, ask us to correct it or have it deleted. Just call us or contact us through any messaging app.
      contactTitle: Questions about your data
      contactBefore: Call or message us. You'll find our contact details on the page
