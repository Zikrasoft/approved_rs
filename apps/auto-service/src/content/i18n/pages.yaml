    privacy:
      metaTitle: Politika privatnosti — CarLab
      metaDescription: Koje podatke prikuplja sajt auto servisa CarLab, zašto i koliko dugo ih čuva.
      heading: Politika privatnosti
      lastUpdated: Ažurirano 12. oktobra 2026
      sections:
        - title: Koje podatke prikupljamo
          text: Samo ono što sami unesete u formu — ime, telefon, opis problema i podaci o vozilu, — kao i adresa stranice sa koje je poslat zahtev i anonimni identifikator pretraživača. Identifikator je nasumičan, čuva se u vašem pretraživaču i potreban je da jedan zahtev ne postane tri kartice.
        - title: Zašto su nam ti podaci
          text: Da bismo se javili povodom zahteva, dogovorili vreme i vodili istoriju održavanja vašeg vozila. Ne koristimo ih za slanje reklamnih poruka i ne prosledjujemo trećim licima u reklamne svrhe.
        - title: Gde se čuvaju
          text: U enkriptovanoj bazi podataka našeg hosting provajdera i u zatvorenom radnom četu servisa. Pristup imaju samo zaposleni.
        - title: Koliko ih čuvamo
          text: Do tri godine od poslednje posete — istorija servisa pomaže prilikom sledeće popravke. Na vaš zahtev, obrišemo ih ranije.
        - title: Kolačići
          text: Sajt postavlja tehnički kolačić sa izabranim jezikom, analitički — Yandex.Metrika — i reklamni — Meta piksel. Analitika i piksel se aktiviraju pri prvom učitavanju stranice; u baneru na dnu ekrana možete odbiti, i tada se pri sledećem učitavanju ne uključuju. Metrika beleži seanse — kretanje kursora, skrolovanje i klikove, — ali formu zahteva iz beleženja smo isključili. Piksel obaveštava Meta o pregledu stranice i o tome što ste poslali zahtev, napisali nam ili izvršili narudžbinu — tako vidimo koja reklama na Facebook-u i Instagram-u dovodi klijente. Sadržaj forme mu se ne predaje. Ako nakon sajta nastavite u našem Telegram botu i ostavite zahtev, naš server će obavestiti Meta samo o samom faktu zahteva — bez njegovog sadržaja i bez vaših kontakata. Korpa i anonimni identifikator se čuvaju u memoriji pregledača (localStorage) i na naš server sami po sebi ne odlaze.
        - title: Vaša prava
          text: Možete zatražiti kopiju svojih podataka, njihovo ispravljenje ili brisanje. Dovoljno je da nas pozovete ili napišete u bilo koji messenger.
      shopSections:
        - title: Naručivanje delova
          text: Sadržaj narudžbine iz korpe odlazi sa zahtevom, kako bismo znali šta da pripremimo. Podatke o plaćanju ne prikupljamo — plaćanje se vrši u servisu.
      contactTitle: Pitanja o podacima
      contactBefore: Pozovite ili pišite, kontakti su na stranici
