      metaTitle: Politika privatnosti | CarLab
      metaDescription: Koje podatke prikuplja sajt auto servisa CarLab, zašto i koliko dugo ih čuva.
      heading: Politika privatnosti
      lastUpdated: Ažurirano 12. novembra 2026.
      sections:
        - title: Koje podatke prikupljamo
          text: Samo podatke koje sami unesete u obrazac (ime, telefon, opis problema i podaci o automobilu), kao i adresu stranice sa koje je upit poslat i anonimni identifikator pregledača. Identifikator se nasumično generiše, čuva u Vašem pregledaču i služi da se isti upit ne pretvori u tri kartice, kao i da saradnik, dok odgovara na upit, vidi koje ste automobile tražili pomoću broja šasije.
        - title: Zašto nam trebaju ti podaci
          text: Da bismo Vas pozvali povodom upita, dogovorili termin i vodili evidenciju o servisiranju Vašeg automobila. Ne koristimo ih za slanje reklamnih poruka niti ih u reklamne svrhe prosleđujemo trećim licima.
        - title: Gde se čuvaju
          text: U šifrovanom skladištu našeg hosting provajdera i u zatvorenom radnom četu servisa. Pristup imaju samo zaposleni.
        - title: Koliko dugo ih čuvamo
          text: Do tri godine od poslednje posete, jer servisna istorija pomaže pri sledećoj popravci. Na Vaš zahtev ćemo ih obrisati ranije. Broj šasije koji unesete u pretragu auto delova i potpune podatke o automobilu dobijene na osnovu njega čuvamo 90 dana od poslednje pretrage. Zatim brišemo broj šasije i te podatke, a zadržavamo samo kod proizvođača (prva tri znaka broja šasije), marku i model automobila. Anonimni identifikator pregledača čuvamo uz pretragu po broju šasije još 90 dana, a zatim ga brišemo.
        - title: Kolačići
          text: Sajt postavlja tehnički kolačić sa izabranim jezikom, analitičke kolačiće (Google Analytics i Yandex Metrika) i reklamni kolačić (Meta piksel). Analitika i piksel pokreću se pri prvom učitavanju stranice. Možete da ih isključite putem linka "Podešavanja kolačića" pri dnu sajta, nakon čega se neće pokretati pri sledećem učitavanju. Yandex Metrika snima sesije (kretanje kursora, pomeranje stranice i klikove). Obrazac za upit smo izuzeli iz snimanja, tako da se njegov sadržaj ne beleži. Piksel obaveštava Meta o pregledima stranice i o tome da ste poslali upit, pisali nam ili napravili porudžbinu. Tako vidimo koji oglasi na Facebooku i Instagramu dovode klijente. Sadržaj obrasca se ne prosleđuje pikselu. Ako nakon posete sajtu nastavite razgovor u našem Telegram botu i tamo pošaljete upit, naš server će obavestiti Meta samo da je upit poslat, bez njegovog sadržaja i Vaših kontakt podataka. Korpa se čuva u memoriji pregledača (localStorage) i sama po sebi se ne šalje na naš server. Anonimni identifikator čuva se u memoriji pregledača i u našem kolačiću visitor_id, a sa njim se šalje na naš server kada pretražujete auto delove po broju šasije. Pomoću njega povezujemo Vaše upite u našem CRM-u sa automobilima koje ste pretraživali po broju šasije, kako bi saradnik odmah video Vaš automobil. Ako ih isključite, identifikator i kolačić se brišu.
        - title: Vaša prava
          text: Možete da zatražite kopiju svojih podataka, njihovu ispravku ili brisanje. Dovoljno je da nas pozovete ili nam pišete u bilo kojoj aplikaciji za razmenu poruka.
      contactTitle: Pitanja o podacima
      contactBefore: Pozovite nas ili nam pišite. Kontakt podatke možete pronaći na stranici
