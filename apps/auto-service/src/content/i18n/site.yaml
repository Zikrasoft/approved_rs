  notice: >-
    Мы храним в браузере анонимный идентификатор — он связывает ваши клики по кнопкам связи с отправленной заявкой, чтобы обращение не потерялось. Ещё мы используем Яндекс.Метрику, чтобы понимать, как посетители пользуются сайтом. Она записывает сессии — движение курсора, прокрутку и клики; форма заявки из записи исключена.
