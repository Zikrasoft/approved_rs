meta:
  title: 'CarLab | автосервис в Белграде: диагностика, ремонт, кузов'
  description: 'Автосервис в Белграде: компьютерная диагностика, плановое ТО и замена масла, ремонт подвески и тормозов, двигатель и коробка, кузовной ремонт после ДТП.'
hero:
  heading: Автосервис и запчасти в Белграде
  ctaPrimary: Записаться на ремонт
  ctaSecondary: Посмотреть услуги
  partsHeading: Подберем запчасть по VIN
  partsSubmit: Подобрать
  partsHint: Назовем цену и срок.
  partsInquiry: Отправить запрос менеджеру
  badges:
    - Смета до начала работ
    - Плановое ТО обычно за день
    - Работаем со страховыми
servicesHead:
  eyebrow: Услуги
  heading: Чем поможем
  body: Сколько занимает каждая работа. Смету составляем после осмотра, до начала работ.
problemPrompt:
  heading: Не знаете, что сломалось?
  body: Опишите симптомы, подскажем, с чего начать.
  cta: Описать проблему
worksHeading: Что сломалось и как починили
process:
  eyebrow: Как работаем
  heading: Без сюрпризов в счете
  body: Вы знаете, что происходит с машиной, на каждом этапе.
  steps:
    - title: Звонок или сообщение
      text: Расскажите, что с машиной, договоримся о времени.
    - title: Осмотр и диагностика
      text: Находим причину, а не симптом, и показываем ее на машине.
    - title: Смета до работ
      text: Присылаем список работ и запчастей с ценами. Начинаем только после вашего «да».
    - title: Работа и выдача
      text: Проверяем на ходу, отдаем старые детали и запись в сервисной карте.
  promises:
    - Не меняем то, чему еще рано
    - Старые детали отдаем в коробке
accident:
  eyebrow: После ДТП
  heading: Кузовной ремонт и покраска
  body: Правим геометрию и красим с подбором цвета. Работаем со страховыми и помогаем собрать документы.
  points:
    - Стапель и замер геометрии кузова
    - Подбор краски по коду и спектрофотометром
    - Помощь с документами для страховой
  cta: Прислать фото повреждений
  more: Подробнее о кузовном ремонте
faqEyebrow: Вопросы
faq:
  - q: Сколько стоит диагностика?
    a: Первичный осмотр и считывание ошибок бесплатны. Платной становится только углубленная диагностика, когда нужно разбирать узел или ставить машину на стенд; о цене предупреждаем заранее.
  - q: Можно приехать со своими запчастями?
    a: Можно. В этом случае мы отвечаем только за свою работу, а не за деталь. Это честно и работает в обе стороны.
  - q: Вы работаете со страховыми компаниями?
    a: Да, по кузовному ремонту. Поможем оформить документы и согласовать смету, а если страховая покрывает не все, сразу скажем, сколько останется на вас.
  # TODO: owner to confirm the usual booking lead time before this answer names one.
  - q: Как быстро можно попасть на ТО?
    a: Позвоните или напишите, и мы скажем ближайшее свободное время.
  - q: Машина на иностранных номерах, это проблема?
    a: Нет. Для ремонта документы о регистрации не нужны, приезжайте как есть.
  - q: На каком языке с вами говорить?
    a: По-сербски, по-русски или по-английски, как вам удобнее.
finalCta:
  eyebrow: Записаться
  heading: Расскажите, что с машиной
  body: Перезвоним в рабочее время и договоримся о визите.
  cta: Оставить заявку
translations:
  sr:
    meta:
      title: 'CarLab | Auto servis u Beogradu: dijagnostika i popravke'
      description: 'Auto servis u Beogradu: kompjuterska dijagnostika, redovan servis i zamena ulja, popravka trapa, kočnica, motora i menjača, limarija posle udesa.'
    hero:
      heading: Auto servis i auto delovi u Beogradu
      ctaPrimary: Zakažite popravku
      ctaSecondary: Pogledajte usluge
      partsHeading: Pronaći ćemo deo po broju šasije
      partsSubmit: Pronađite deo
      partsHint: Javićemo Vam cenu i rok isporuke.
      partsInquiry: Pošaljite upit saradniku
      badges:
        - Predračun pre početka radova
        - Redovan servis obično za jedan dan
        - Sarađujemo sa osiguravajućim kućama
    servicesHead:
      eyebrow: Usluge
      heading: Kako možemo da Vam pomognemo
      body: Pogledajte koliko traje svaka usluga. Predračun pripremamo nakon pregleda, pre početka radova.
    problemPrompt:
      heading: Ne znate šta je u kvaru?
      body: Opišite simptome, predložićemo odakle da počnemo.
      cta: Opišite problem
    worksHeading: Šta je bilo u kvaru i kako smo popravili
    process:
      eyebrow: Kako radimo
      heading: Bez iznenađenja na računu
      body: U svakom trenutku znate šta se dešava sa Vašim automobilom.
      steps:
        - title: Poziv ili poruka
          text: Recite nam šta se dešava sa automobilom i dogovorićemo termin.
        - title: Pregled i dijagnostika
          text: Pronalazimo uzrok, a ne samo simptom, i pokazujemo Vam ga na automobilu.
        - title: Predračun pre početka radova
          text: Šaljemo Vam spisak radova i delova sa cenama. Počinjemo tek kada odobrite.
        - title: Popravka i preuzimanje
          text: Proveravamo automobil u vožnji, vraćamo stare delove i upisujemo radove u servisnu evidenciju.
      promises:
        - Ne menjamo delove kojima još nije vreme za zamenu
        - Stare delove vraćamo u kutiji
    accident:
      eyebrow: Posle udesa
      heading: Limarija i farbanje
      body: Ispravljamo geometriju karoserije i farbamo uz precizno usklađivanje boje. Sarađujemo sa osiguravajućim kućama i pomažemo Vam da prikupite dokumentaciju.
      points:
        - Rad na stolu za izvlačenje i merenje geometrije karoserije
        - Određivanje nijanse po kodu boje i spektrofotometrom
        - Pomoć oko dokumentacije za osiguranje
      cta: Pošaljite fotografije oštećenja
      more: Saznajte više o limarskim radovima
    faqEyebrow: Pitanja
    faq:
      - q: Koliko košta dijagnostika?
        a: Početni pregled i očitavanje grešaka su besplatni. Naplaćujemo samo detaljnu dijagnostiku kada je potrebno rasklopiti sklop ili postaviti automobil na ispitni uređaj. Cenu Vam saopštavamo unapred.
      - q: Mogu li da donesem svoje delove?
        a: Možete. U tom slučaju odgovaramo samo za svoj rad, ne i za ugrađeni deo. Tako su odgovornosti jasne za obe strane.
      - q: Da li sarađujete sa osiguravajućim kućama?
        a: Da, za limarske radove i farbanje. Pomoći ćemo Vam da pripremite dokumentaciju i usaglasite predračun sa osiguranjem. Ako osiguranje ne pokriva sve troškove, odmah ćemo Vam reći koliko treba da doplatite.
      - q: Koliko brzo mogu da zakažem redovan servis?
        a: Pozovite nas ili nam pišite i reći ćemo Vam prvi slobodan termin.
      - q: Da li su strane tablice problem?
        a: Nisu. Za popravku nije potrebna saobraćajna dozvola, slobodno dođite.
      - q: Na kom jeziku možemo da razgovaramo?
        a: Na srpskom, ruskom ili engleskom, kako Vam više odgovara.
    finalCta:
      eyebrow: Zakažite termin
      heading: Recite nam šta se dešava sa automobilom
      body: Pozvaćemo Vas u toku radnog vremena i dogovoriti termin dolaska.
      cta: Pošaljite upit
  en:
    meta:
      title: CarLab | Car servicing, repairs and bodywork in Belgrade
      description: 'Car service in Belgrade: diagnostics, scheduled servicing, oil changes, suspension and brakes, engine and gearbox repairs, and accident repair.'
    hero:
      heading: Car servicing and parts in Belgrade
      ctaPrimary: Book a repair
      ctaSecondary: View services
      partsHeading: Find the right part by VIN
      partsSubmit: Find a part
      partsHint: We'll confirm the price and lead time.
      partsInquiry: Send an enquiry to our team
      badges:
        - Estimate before work starts
        - Routine servicing usually done in a day
        - We work with insurers
    servicesHead:
      eyebrow: Services
      heading: How we can help
      body: See how long each job takes. We inspect your car and prepare an estimate before any work begins.
    problemPrompt:
      heading: Not sure what's wrong?
      body: Describe the symptoms and we'll suggest where to start.
      cta: Describe the problem
    worksHeading: What went wrong and how we fixed it
    process:
      eyebrow: How we work
      heading: No surprises on your bill
      body: You'll know what's happening with your car at every stage.
      steps:
        - title: Call or message us
          text: Tell us what's wrong with your car and we'll arrange a time.
        - title: Inspection and diagnostics
          text: We find the cause, not just the symptom, and show you the problem on your car.
        - title: An estimate before we start
          text: We send you an itemised estimate for labour and parts. We only start once you approve it.
        - title: Repairs and collection
          text: We road-test your car, return the old parts and update your service record.
      promises:
        - We don't replace parts before they need it
        - We return your old parts in a box
    accident:
      eyebrow: After an accident
      heading: Body repairs and respraying
      body: We straighten bodywork and respray with colour-matched paint. We work with insurers and help you put together the paperwork.
      points:
        - Chassis jig and alignment measurement
        - Paint matching by colour code and spectrophotometer
        - Help with insurance paperwork
      cta: Send photos of the damage
      more: More about body repairs
    faqEyebrow: Questions
    faq:
      - q: How much do diagnostics cost?
        a: The initial inspection and fault code reading are free. We only charge for in-depth diagnostics that require dismantling a component or using a test rig. We'll confirm the price beforehand.
      - q: Can I bring my own parts?
        a: Yes. In that case, we guarantee our workmanship, but not the part itself. That keeps things fair for both sides.
      - q: Do you work with insurance companies?
        a: Yes, for body repairs. We'll help with the paperwork and getting the estimate approved. If your insurer doesn't cover the full cost, we'll tell you upfront how much you'll need to pay.
      - q: How soon can I book a service?
        a: Call or message us and we'll let you know our next available appointment.
      - q: Is it a problem if my car has foreign plates?
        a: Not at all. You don't need registration documents for repairs. Just bring your car in.
      - q: What languages do you speak?
        a: Serbian, Russian or English, whichever you prefer.
    finalCta:
      eyebrow: Book an appointment
      heading: Tell us what's wrong with your car
      body: We'll call you back during opening hours to arrange your visit.
      cta: Send an enquiry
