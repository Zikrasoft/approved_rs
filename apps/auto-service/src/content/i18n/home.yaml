meta:
  title: 'CarLab — автосервис в Белграде: диагностика, ремонт, кузов'
  description: 'Автосервис в Белграде: компьютерная диагностика, плановое ТО и замена масла, ремонт подвески и тормозов, двигатель и коробка, кузовной ремонт после ДТП.'
hero:
  heading: Сначала цена, потом ремонт
  lead: Считывание ошибок бесплатно, письменная смета до начала работ. Говорим, что нужно делать сейчас, а что спокойно подождёт.
  ctaPrimary: Записаться в сервис
  ctaSecondary: Посмотреть услуги
  badges:
    - Смета до начала работ
    - Работаем со страховыми
trust:
  - value: Письменно
    label: смета до начала любых работ
  - value: 1 день
    label: обычный срок планового ТО
  - value: бесплатно
    label: стоимость первичного осмотра
servicesHead:
  eyebrow: Услуги
  heading: Что мы делаем
  body: От замены масла до восстановления геометрии кузова после удара. Всё в одном месте — не нужно возить машину по трём адресам.
why:
  eyebrow: Почему к нам
  heading: Автосервис без сюрприза в счёте
  body: Главная проблема с сервисами — не цена, а непредсказуемость. Мы её убираем.
  points:
    - title: Смета до работ
      text: Сначала диагностика и письменная смета, потом ваше «да», и только потом ключи в работу.
    - title: Старые детали возвращаем
      text: Всё, что сняли с машины, отдаём в коробке. Хотите — проверяйте, действительно ли деталь была изношена.
    - title: Не навязываем
      text: Если можно доехать до следующего ТО — скажем об этом, а не продадим замену сегодня.
    - title: Пишем в карту
      text: Что меняли, какой пробег, какие запчасти. На следующем визите не начинаем с нуля.
process:
  eyebrow: Как работаем
  heading: Четыре шага без нервов
  body: Никаких «оставьте машину, потом позвоним». Вы знаете, что происходит, на каждом этапе.
  steps:
    - title: Заявка и запись
      text: Описываете проблему по телефону или в мессенджере. Подбираем время, чтобы машина не стояла в очереди.
    - title: Диагностика
      text: Находим причину, а не симптом. Показываем на машине, что именно не так.
    - title: Смета и согласование
      text: Присылаем список работ и запчастей с ценами. Работы начинаются только после вашего подтверждения.
    - title: Работа и выдача
      text: Делаем, проверяем на ходу, отдаём машину со старыми деталями и записью в сервисной карте.
accident:
  eyebrow: После ДТП
  heading: Кузовной ремонт и покраска
  body: Восстанавливаем геометрию, правим и красим с подбором цвета по коду и по факту выгорания. Работаем со страховыми — помогаем собрать документы.
  points:
    - Стапель и замер геометрии кузова
    - Подбор краски по коду и компьютерным спектром
    - Полировка перехода, чтобы не было видно границы
    - Помощь с документами для страховой
  cta: Оценить ремонт
faq:
  - q: Сколько стоит диагностика?
    a: Первичный осмотр и считывание ошибок — бесплатно. Платной становится только углублённая диагностика, когда нужно разбирать узел или ставить машину на стенд; о цене предупреждаем заранее.
  - q: Можно приехать со своими запчастями?
    a: Можно. В этом случае мы отвечаем только за свою работу, а не за деталь — это честно и работает в обе стороны.
  - q: Вы работаете со страховыми компаниями?
    a: Да, по кузовному ремонту. Поможем оформить документы и согласовать смету, а если страховая покрывает не всё — сразу скажем, сколько останется на вас.
  - q: Как быстро можно попасть на ТО?
    a: Обычно в течение двух-трёх рабочих дней, а на замену масла или аккумулятора часто удаётся взять в тот же день. Позвоните — скажем точно.
  - q: Машина на иностранных номерах — это проблема?
    a: Нет. Для ремонта документы о регистрации не нужны, приезжайте как есть.
finalCta:
  eyebrow: Записаться
  heading: Расскажите, что с машиной
  body: Перезвоним в рабочее время, уточним детали и подберём время. Если вопрос срочный — просто позвоните.
  cta: Оставить заявку
translations:
  sr:
    meta:
      title: 'CarLab — auto servis u Beogradu: dijagnostika, popravka, karoserija'
      description: 'Auto servis u Beogradu: kompjuterska dijagnostika, redovno servisiranje i zamena ulja, popravka ovjesa i kočnica, motor i menjač, popravka karoserije posle nesreće.'
    hero:
      heading: Prvo cena, zatim popravka
      lead: Učitavanje grešaka besplatno, pisana ponuda pre početka radova. Kažemo šta treba raditi odmah, a šta može da sačeka.
      ctaPrimary: Zakazati servis
      ctaSecondary: Pogledajte usluge
      badges:
        - Ponuda pre radova
        - Radimo sa osiguravajućim društvima
    trust:
      - value: Pismeno
        label: ponuda pre bilo kojih radova
      - value: 1 dan
        label: uobičajeni rok za redovno servisiranje
      - value: besplatno
        label: cena prvobitnog pregleda
    servicesHead:
      eyebrow: Usluge
      heading: Šta radimo
      body: Od zamene ulja do obnavljanja geometrije karoserije nakon udarca. Sve na jednom mestu — nije potrebno voziti auto na tri adrese.
    why:
      eyebrow: Zašto kod nas
      heading: Auto servis bez iznenađenja na računu
      body: Glavni problem sa servisima nije cena, već nepredvidivost. To mi eliminišemo.
      points:
        - title: Ponuda pre radova
          text: Prvo dijagnostika i pisana ponuda, zatim vaše 'da', i tek tada ključevi u rad.
        - title: Vraćamo stare delove
          text: Sve što skinemo sa auta vraćamo u kutiji. Ako želite — proverite da li je deo zaista bio istrošen.
        - title: Ne nudimo ništa
          text: Ako može do sledećeg servisa — reći ćemo vam, a ne prodavati zamenu danas.
        - title: Upisujemo u kartu
          text: Šta je menjano, koji je pređeni put, koje rezervne delove. Pri sledećem dolasku ne počinjemo iz početka.
    process:
      eyebrow: Kako radimo
      heading: Četiri koraka bez nervoze
      body: Nema 'ostavite auto, zovićemo vas kasnije'. Znate šta se dešava na svakom koraku.
      steps:
        - title: Prijava i zakazivanje
          text: Opisuete problem telefonom ili u porukama. Biramo vreme da auto ne čeka u redu.
        - title: Dijagnostika
          text: Pronalazimo uzrok, a ne simptom. Pokazujemo na autu šta tačno nije u redu.
        - title: Ponuda i saglasnost
          text: Šaljemo spisak radova i rezervnih delova sa cenama. Radovi počinju tek nakon vaše potvrde.
        - title: Izvršenje i predaja
          text: Radimo, proveravamo u vožnji, predajemo auto sa starim delovima i zapisom u servisnoj karti.
    accident:
      eyebrow: Posle nesreće
      heading: Popravka karoserije i lakiranje
      body: Obnavljamo geometriju, ispravljamo i lakiramo uz odabir boje po kodu i po stepenu istrošenosti. Radimo sa osiguravajućim društvima — pomažemo u sakupljanju dokumenata.
      points:
        - Stapel i merenje geometrije karoserije
        - Odabir boje po kodu i kompjuterskim spektrom
        - Poliranje prelaza, kako granica ne bi bila vidljiva
        - Pomoć sa dokumentima za osiguranje
      cta: Procena popravke
    faq:
      - q: Koliko košta dijagnostika?
        a: Prvobitni pregled i očitavanje grešaka — besplatno. Plaćena postaje samo detaljna dijagnostika, kada je potrebno demontirati sklop ili staviti auto na ispitnu platformu; o ceni upozoravamo unapred.
      - q: Mogu li doći sa svojim rezervnim delovima?
        a: Moguće je. U tom slučaju odgovaramo samo za svoj rad, a ne za deo — to je pošteno i funkcioniše u oba smera.
      - q: Radite sa osiguravajućim društvima?
        a: Da, kod popravke karoserije. Pomažemo da se urade dokumenti i usaglasi ponuda, a ako osiguranje ne pokriva sve — odmah ćemo reći koliko će ostati na vama.
      - q: Koliko brzo mogu doći na servis?
        a: Obično u roku od dva do tri radna dana, a za zamenu ulja ili akumulatora često možete doći istog dana. Pozovite — reći ćemo tačno.
      - q: Auto na stranim registarskim tablicama — da li je to problem?
        a: Ne. Za popravku nije potrebno potvrdu o registraciji, dođite kao što jeste.
    finalCta:
      eyebrow: Zakazati
      heading: Recite nam šta je sa autom
      body: Nazvaćemo vas u radno vreme, razjasniti detalje i odabrati vreme. Ako je pitanje hitno — jednostavno nazovite.
      cta: Ostaviti prijavu
  en:
    meta:
      title: 'CarLab — car service in Belgrade: diagnostics, repair, bodywork'
      description: 'Car service in Belgrade: computer diagnostics, scheduled maintenance and oil changes, suspension and brake repairs, engine and gearbox work, accident repair.'
    hero:
      heading: Price first, then repair
      lead: Error reading is free, written estimate before work starts. We tell you what needs to be done now and what can wait.
      ctaPrimary: Book a service appointment
      ctaSecondary: View services
      badges:
        - Estimate before work begins
        - We work with insurers
    trust:
      - value: In writing
        label: estimate before any work begins
      - value: 1 day
        label: standard time for scheduled maintenance
      - value: free of charge
        label: cost of initial inspection
    servicesHead:
      eyebrow: Services
      heading: What we do
      body: From oil changes to restoring body geometry after an accident. Everything in one place — no need to drive to three different locations.
    why:
      eyebrow: Why choose us
      heading: A car service without surprise costs
      body: The main issue with services isn’t the price, but unpredictability. We eliminate that.
      points:
        - title: Estimate before work
          text: First diagnostics and a written estimate, then your 'yes', and only then keys are handed over for work.
        - title: We return old parts
          text: Everything we remove from the car is returned in a box. Want to check if the part was indeed worn out? Go ahead.
        - title: No pressure to buy
          text: If you can make it to the next maintenance, we’ll let you know — we won’t push for a replacement today.
        - title: We document everything
          text: What was changed, mileage, which parts. On your next visit, we don’t start from scratch.
    process:
      eyebrow: How we operate
      heading: Four steps without hassle
      body: No 'leave the car, we’ll call you later'. You'll know what's happening at each step.
      steps:
        - title: Request and scheduling
          text: Describe the issue over the phone or in a messenger. We’ll find a time that avoids waiting in line.
        - title: Diagnostics
          text: We find the cause, not just the symptom. We'll show you exactly what’s wrong.
        - title: Estimate and approval
          text: We send a list of works and parts with prices. Work begins only after your confirmation.
        - title: Execution and delivery
          text: We perform the work, check on the go, deliver the car with old parts and an entry in the service record.
    accident:
      eyebrow: After an accident
      heading: Body repair and painting
      body: We restore geometry, straighten and paint, matching color by code and actual fading. We work with insurers and help gather documents.
      points:
        - Bench and measuring body geometry
        - Paint matching by code and computer spectrum
        - Polishing transitions to hide edges
        - Assistance with insurance documents
      cta: Evaluate repair
    faq:
      - q: How much does diagnostics cost?
        a: The initial inspection and error reading are free. Only in-depth diagnostics, which require disassembly or using a stand, will incur a charge; we’ll inform you of the cost upfront.
      - q: Can I bring my own parts?
        a: Yes. In this case, we are only responsible for our work, not the part — it's fair and works both ways.
      - q: Do you work with insurance companies?
        a: Yes, for body repairs. We’ll help with documentation and estimating costs, and if the insurance doesn’t cover everything, we’ll tell you how much is left for you.
      - q: How quickly can I get a maintenance appointment?
        a: Usually within two to three working days, and for oil changes or battery replacements, we often can take you the same day. Give us a call — we’ll tell you exactly.
      - q: Is it a problem if the car has foreign plates?
        a: No. We don’t need registration documents for repairs, just come as you are.
    finalCta:
      eyebrow: Book now
      heading: Tell us what's wrong with the car
      body: We’ll call back during business hours to clarify details and find a suitable time. If it’s urgent — just give us a call.
      cta: Submit a request
