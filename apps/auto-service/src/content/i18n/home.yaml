meta:
  title: 'CarLab — автосервис в Белграде: диагностика, ремонт, кузов'
  description: 'Автосервис в Белграде: компьютерная диагностика, плановое ТО и замена масла, ремонт подвески и тормозов, двигатель и коробка, кузовной ремонт после ДТП.'
hero:
  heading: Сначала цена, потом ремонт
  lead: Считывание ошибок бесплатно, письменная смета до начала работ, гарантия 12 месяцев. Говорим, что нужно делать сейчас, а что спокойно подождёт.
  ctaPrimary: Записаться в сервис
  ctaSecondary: Посмотреть услуги
  badges:
    - Смета до начала работ
    - Гарантия 12 месяцев
    - Работаем со страховыми
trust:
  - value: 12 мес
    label: гарантия на работы и запчасти
  - value: 1 день
    label: обычный срок планового ТО
  - value: '0 RSD'
    label: стоимость первичного осмотра
servicesHead:
  eyebrow: Услуги
  heading: Что мы делаем
  body: От замены масла до восстановления геометрии кузова после удара. Всё в одном месте — не нужно возить машину по трём адресам.
why:
  eyebrow: Почему к нам
  heading: Автосервис без сюрприза в счёте
  body: Главная проблема с сервисами — не цена, а непредсказуемость. Мы её убираем.
  points:
    - title: Смета до работ
      text: Сначала диагностика и письменная смета, потом ваше «да», и только потом ключи в работу.
    - title: Старые детали возвращаем
      text: Всё, что сняли с машины, отдаём в коробке. Хотите — проверяйте, действительно ли деталь была изношена.
    - title: Не навязываем
      text: Если можно доехать до следующего ТО — скажем об этом, а не продадим замену сегодня.
    - title: Пишем в карту
      text: Что меняли, какой пробег, какие запчасти. На следующем визите не начинаем с нуля.
process:
  eyebrow: Как работаем
  heading: Четыре шага без нервов
  body: Никаких «оставьте машину, потом позвоним». Вы знаете, что происходит, на каждом этапе.
  steps:
    - title: Заявка и запись
      text: Описываете проблему по телефону или в мессенджере. Подбираем время, чтобы машина не стояла в очереди.
    - title: Диагностика
      text: Находим причину, а не симптом. Показываем на машине, что именно не так.
    - title: Смета и согласование
      text: Присылаем список работ и запчастей с ценами. Работы начинаются только после вашего подтверждения.
    - title: Работа и выдача
      text: Делаем, проверяем на ходу, отдаём машину со старыми деталями и записью в сервисной карте.
shopTeaser:
  eyebrow: Запчасти
  heading: Аккумуляторы в наличии, с установкой за 20 минут
  body: Подбираем по марке, модели и году — не по «примерно такой же». Ставим на месте, старый забираем на утилизацию.
  cta: Подобрать аккумулятор
accident:
  eyebrow: После ДТП
  heading: Кузовной ремонт и покраска
  body: Восстанавливаем геометрию, правим и красим с подбором цвета по коду и по факту выгорания. Работаем со страховыми — помогаем собрать документы.
  points:
    - Стапель и замер геометрии кузова
    - Подбор краски по коду и компьютерным спектром
    - Полировка перехода, чтобы не было видно границы
    - Помощь с документами для страховой
  cta: Оценить ремонт
faq:
  - q: Сколько стоит диагностика?
    a: Первичный осмотр и считывание ошибок — бесплатно. Платной становится только углублённая диагностика, когда нужно разбирать узел или ставить машину на стенд; о цене предупреждаем заранее.
  - q: Можно приехать со своими запчастями?
    a: Можно. В этом случае гарантия распространяется только на нашу работу, а не на деталь — это честно и работает в обе стороны.
  - q: Вы работаете со страховыми компаниями?
    a: Да, по кузовному ремонту. Поможем оформить документы и согласовать смету, а если страховая покрывает не всё — сразу скажем, сколько останется на вас.
  - q: Как быстро можно попасть на ТО?
    a: Обычно в течение двух-трёх рабочих дней, а на замену масла или аккумулятора часто удаётся взять в тот же день. Позвоните — скажем точно.
  - q: Даёте ли вы гарантию?
    a: 'Двенадцать месяцев на выполненные работы и на установленные нами запчасти. Гарантийный случай разбираем без споров: если это наша ошибка, переделываем бесплатно.'
  - q: Машина на иностранных номерах — это проблема?
    a: Нет. Для ремонта документы о регистрации не нужны, приезжайте как есть.
finalCta:
  eyebrow: Записаться
  heading: Расскажите, что с машиной
  body: Перезвоним в рабочее время, уточним детали и подберём время. Если вопрос срочный — просто позвоните.
  cta: Оставить заявку
translations:
  sr:
    meta:
      title: 'CarLab — autoservis u Beogradu: dijagnostika, popravka, karoserija'
      description: 'Autoservis u Beogradu: računarska dijagnostika, redovno održavanje i zamena ulja, popravka vešanja i kočnica, motor i menjač, popravka karoserije nakon udesa.'
    hero:
      heading: Prvo cena, zatim popravka
      lead: Čitanje grešaka besplatno, pisana ponuda pre početka radova, garancija 12 meseci. Govorimo šta treba uraditi odmah, a šta može sačekati.
      ctaPrimary: Zakažite servis
      ctaSecondary: Pogledajte usluge
      badges:
        - Ponuda pre radova
        - Garancija 12 meseci
        - Radimo sa osiguravajućim društvima
    trust:
      - value: 12 mes
        label: garancija na radove i delove
      - value: 1 dan
        label: običan rok za redovno održavanje
      - value: 0 RSD
        label: trošak inicijalnog pregleda
    servicesHead:
      eyebrow: Usluge
      heading: Šta radimo
      body: Od zamene ulja do vraćanja geometrije karoserije nakon udarca. Sve na jednom mestu — ne morate da vozite auto na tri adrese.
    why:
      eyebrow: Zašto kod nas
      heading: Autoservis bez iznenađenja u računu
      body: Glavni problem s servisima nije cena, već nepredvidivost. Mi to uklanjamo.
      points:
        - title: Ponuda pre radova
          text: Prvo dijagnostika i pisana ponuda, zatim ваше „da“, i samo tada ključevi u rad.
        - title: Vraćamo stare delove
          text: Sve što smo skinuli s automobila vraćamo u kutiji. Ako želite — proverite da li je deo zaista bio istrošen.
        - title: Ne nudimo na silu
          text: Ako može da se vozi do sledećeg održavanja — reći ćemo vam to, a ne prodati zamenu danas.
        - title: Pišemo u karton
          text: Šta je menjano, koliki je pređen kilometrage, koji delovi. Prilikom sledeće posete ne počinjemo iznova.
    process:
      eyebrow: Kako radimo
      heading: Četiri koraka bez stresa
      body: Nema „ostavite auto, zvaćemo vas kasnije“. Znate šta se dešava na svakom koraku.
      steps:
        - title: Prijava i zakazivanje
          text: Opišete problem telefonom ili putem poruke. Pronađemo vreme da auto ne čeka u redu.
        - title: Dijagnostika
          text: Nalazimo uzrok, a ne simptom. Pokazujemo na automobilu šta to tačno nije u redu.
        - title: Ponuda i odobrenje
          text: Šaljemo listu radova i delova sa cenama. Radovi počinju samo nakon vašeg odobrenja.
        - title: Rad i predaja
          text: Radimo, proveravamo na putu, predajemo automobil sa starim delovima i zapisom u servisnoj karti.
    shopTeaser:
      eyebrow: Delovi
      heading: Baterije na skladištu, sa ugradnjom za 20 minuta
      body: Biramo prema marki, modelu i godini — ne prema „približno takvoj“. Ugrađujemo na licu mesta, stari uzimamo na reciklažu.
      cta: Izaberite bateriju
    accident:
      eyebrow: Nakon udesa
      heading: Popravka karoserije i farbanje
      body: Obnavljamo geometriju, ispravljamo i farbamo uz odabir boje prema kodu i uzimajući u obzir izbledelost. Radimo sa osiguravajućim — pomažemo u prikupljanju dokumenata.
      points:
        - Stapel i merenje geometrije karoserije
        - Odabir boje prema kodu i kompjuterskim spektrima
        - Poliranje prelaza, kako se ne bi videla granica
        - Pomoć s dokumentima za osiguranje
      cta: Procena popravke
    faq:
      - q: Koliko košta dijagnostika?
        a: Inicijalni pregled i čitanje grešaka — besplatno. Plaćena postaje samo detaljna dijagnostika, kada je potrebno rastaviti deo ili staviti automobil na test; o ceni obaveštavamo unapred.
      - q: Mogu li doći sa svojim delovima?
        a: Moguće. U tom slučaju garancija se odnosi samo na naš rad, a ne na deo — to je pošteno i funkcioniše u obe strane.
      - q: Radite li sa osiguravajućim kompanijama?
        a: Da, za popravku karoserije. Pomažemo da se urede dokumenti i saglasnost ponude, a ako osiguranje ne pokriva sve — odmah ćemo reći koliko će ostati na vama.
      - q: Koliko brzo mogu doći na redovno održavanje?
        a: Obično u roku od dva do tri radna dana, a za zamenu ulja ili baterije često se može doći istog dana. Pozovite — reći ćemo tačno.
      - q: Da li dajete garanciju?
        a: 'Dvanaest meseci na izvršene radove i na delove koje smo ugradili. Garancijski slučaj rešavamo bez rasprave: ako je to naša greška, prepravimo besplatno.'
      - q: Automobil sa stranim registarskim tablicama — da li je to problem?
        a: Ne. Za popravku dokumenti o registraciji nisu potrebni, dođite kako jeste.
    finalCta:
      eyebrow: Zakažite
      heading: Recite nam šta je s automobilom
      body: Javićemo vam se u radno vreme, razjasnićemo detalje i pronaći vreme. Ako je pitanje hitno — jednostavno pozovite.
      cta: Ostavite prijavu
  en:
    meta:
      title: 'CarLab — Car Service in Belgrade: Diagnostics, Repairs, Bodywork'
      description: 'Car service in Belgrade: computer diagnostics, routine maintenance and oil changes, suspension and brake repairs, engine and gearbox work, accident repairs.'
    hero:
      heading: Price First, Repair Next
      lead: Free error reading, written estimate before starting work, 12-month warranty. We tell you what needs immediate attention and what can wait.
      ctaPrimary: Schedule a Service
      ctaSecondary: View Services
      badges:
        - Estimate before starting work
        - 12-month warranty
        - We work with insurance companies
    trust:
      - value: 12 months
        label: warranty on work and parts
      - value: 1 day
        label: average time for routine maintenance
      - value: 0 RSD
        label: cost of initial inspection
    servicesHead:
      eyebrow: Services
      heading: What We Do
      body: From oil changes to restoring body geometry after an impact. Everything in one place — no need to drive your car to three different locations.
    why:
      eyebrow: Why Choose Us
      heading: Car Service Without Bill Surprises
      body: The main issue with services isn't the price, but unpredictability. We eliminate that.
      points:
        - title: Estimate Before Work
          text: We start with diagnostics and a written estimate, then get your ‘yes’, and only then the keys go to work.
        - title: We Return Old Parts
          text: Everything we remove from the car is returned in a box. Feel free to check whether the part was indeed worn out.
        - title: No Unnecessary Sales
          text: If you can wait until the next maintenance, we’ll let you know instead of pushing for a replacement today.
        - title: Detailed Records
          text: What was changed, mileage, what parts were used. Next visit, we don’t start from scratch.
    process:
      eyebrow: How We Work
      heading: Four Steps Without Stress
      body: No ‘leave the car, we’ll call you later’. You know what’s happening at every stage.
      steps:
        - title: Request and Appointment
          text: Describe the issue over the phone or via messenger. We’ll find a time that prevents your car from waiting in line.
        - title: Diagnostics
          text: We find the cause, not just the symptom. We show you exactly what’s wrong with the car.
        - title: Estimate and Approval
          text: We send you a list of works and parts with prices. Work only starts after your confirmation.
        - title: Work and Handover
          text: We carry out the work, test it on the road, and hand over the car along with the old parts and a record in the service card.
    shopTeaser:
      eyebrow: Parts
      heading: Batteries in Stock, Installed in 20 Minutes
      body: We match based on make, model, and year — not just 'something similar'. We install on-site and take the old one for recycling.
      cta: Find a Battery
    accident:
      eyebrow: After an Accident
      heading: Body Repair and Painting
      body: We restore geometry, straighten, and paint, matching colors based on code and actual fading. We work with insurance companies — helping you gather documents.
      points:
        - Frame and body geometry measurement
        - Paint matching by code and computer spectrometer
        - Polishing transitions to make borders invisible
        - Assistance with insurance documents
      cta: Evaluate Repair
    faq:
      - q: How much does diagnostics cost?
        a: Initial inspection and error reading are free. Only detailed diagnostics, which require disassembling a component or putting the car on a stand, become paid; we will inform you about the price upfront.
      - q: Can I bring my own parts?
        a: Yes. In this case, the warranty applies only to our work, not to the part — this is fair and works both ways.
      - q: Do you work with insurance companies?
        a: Yes, for body repairs. We help with document processing and budget approval, and if the insurance doesn’t cover everything — we will let you know how much you will need to pay.
      - q: How quickly can I get a maintenance appointment?
        a: Usually within two to three business days, and for oil or battery replacement, we often can fit you in the same day. Call us for a precise answer.
      - q: Do you offer a warranty?
        a: 'Twelve months on the work performed and parts we install. Warranty cases are handled without disputes: if it’s our mistake, we rectify it for free.'
      - q: Is a car with foreign plates a problem?
        a: No. Documents for registration are not needed for repairs, just come as you are.
    finalCta:
      eyebrow: Sign Up
      heading: Tell Us About Your Car's Issues
      body: We’ll call back during business hours, clarify details, and find a time for you. If it’s urgent — just give us a call.
      cta: Submit a Request
