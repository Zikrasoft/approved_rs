meta:
  title: 'CarLab — автосервис в Белграде: диагностика, ремонт, кузов'
  description: 'Автосервис в Белграде: компьютерная диагностика, плановое ТО и замена масла, ремонт подвески и тормозов, двигатель и коробка, кузовной ремонт после ДТП.'
hero:
  heading: Сначала цена, потом ремонт
  lead: Считывание ошибок бесплатно, письменная смета до начала работ, гарантия 12 месяцев. Говорим, что нужно делать сейчас, а что спокойно подождёт.
  ctaPrimary: Записаться в сервис
  ctaSecondary: Посмотреть услуги
  badges:
    - Смета до начала работ
    - Гарантия 12 месяцев
    - Работаем со страховыми
trust:
  - value: 12 мес
    label: гарантия на работы и запчасти
  - value: 1 день
    label: обычный срок планового ТО
  - value: бесплатно
    label: стоимость первичного осмотра
servicesHead:
  eyebrow: Услуги
  heading: Что мы делаем
  body: От замены масла до восстановления геометрии кузова после удара. Всё в одном месте — не нужно возить машину по трём адресам.
why:
  eyebrow: Почему к нам
  heading: Автосервис без сюрприза в счёте
  body: Главная проблема с сервисами — не цена, а непредсказуемость. Мы её убираем.
  points:
    - title: Смета до работ
      text: Сначала диагностика и письменная смета, потом ваше «да», и только потом ключи в работу.
    - title: Старые детали возвращаем
      text: Всё, что сняли с машины, отдаём в коробке. Хотите — проверяйте, действительно ли деталь была изношена.
    - title: Не навязываем
      text: Если можно доехать до следующего ТО — скажем об этом, а не продадим замену сегодня.
    - title: Пишем в карту
      text: Что меняли, какой пробег, какие запчасти. На следующем визите не начинаем с нуля.
process:
  eyebrow: Как работаем
  heading: Четыре шага без нервов
  body: Никаких «оставьте машину, потом позвоним». Вы знаете, что происходит, на каждом этапе.
  steps:
    - title: Заявка и запись
      text: Описываете проблему по телефону или в мессенджере. Подбираем время, чтобы машина не стояла в очереди.
    - title: Диагностика
      text: Находим причину, а не симптом. Показываем на машине, что именно не так.
    - title: Смета и согласование
      text: Присылаем список работ и запчастей с ценами. Работы начинаются только после вашего подтверждения.
    - title: Работа и выдача
      text: Делаем, проверяем на ходу, отдаём машину со старыми деталями и записью в сервисной карте.
shopTeaser:
  eyebrow: Запчасти
  heading: Аккумуляторы в наличии, с установкой за 20 минут
  body: Подбираем по марке, модели и году — не по «примерно такой же». Ставим на месте, старый забираем на утилизацию.
  cta: Подобрать аккумулятор
accident:
  eyebrow: После ДТП
  heading: Кузовной ремонт и покраска
  body: Восстанавливаем геометрию, правим и красим с подбором цвета по коду и по факту выгорания. Работаем со страховыми — помогаем собрать документы.
  points:
    - Стапель и замер геометрии кузова
    - Подбор краски по коду и компьютерным спектром
    - Полировка перехода, чтобы не было видно границы
    - Помощь с документами для страховой
  cta: Оценить ремонт
faq:
  - q: Сколько стоит диагностика?
    a: Первичный осмотр и считывание ошибок — бесплатно. Платной становится только углублённая диагностика, когда нужно разбирать узел или ставить машину на стенд; о цене предупреждаем заранее.
  - q: Можно приехать со своими запчастями?
    a: Можно. В этом случае гарантия распространяется только на нашу работу, а не на деталь — это честно и работает в обе стороны.
  - q: Вы работаете со страховыми компаниями?
    a: Да, по кузовному ремонту. Поможем оформить документы и согласовать смету, а если страховая покрывает не всё — сразу скажем, сколько останется на вас.
  - q: Как быстро можно попасть на ТО?
    a: Обычно в течение двух-трёх рабочих дней, а на замену масла или аккумулятора часто удаётся взять в тот же день. Позвоните — скажем точно.
  - q: Даёте ли вы гарантию?
    a: 'Двенадцать месяцев на выполненные работы и на установленные нами запчасти. Гарантийный случай разбираем без споров: если это наша ошибка, переделываем бесплатно.'
  - q: Машина на иностранных номерах — это проблема?
    a: Нет. Для ремонта документы о регистрации не нужны, приезжайте как есть.
finalCta:
  eyebrow: Записаться
  heading: Расскажите, что с машиной
  body: Перезвоним в рабочее время, уточним детали и подберём время. Если вопрос срочный — просто позвоните.
  cta: Оставить заявку
translations:
  sr:
    meta:
      title: 'CarLab — autoservis u Beogradu: dijagnostika, popravka, limarija'
      description: 'Autoservis u Beogradu: kompjuterska dijagnostika, redovno održavanje i zamena ulja, popravka ovSuspensiona i kočnica, motor i menjač, limarijski radovi posle nezgode.'
    hero:
      heading: Prvo cena, zatim popravka
      lead: Besplatno očitavanje grešaka, pisana ponuda pre početka radova, garancija 12 meseci. Govorimo šta treba raditi sada, a šta može da sačeka.
      ctaPrimary: Zakazati servis
      ctaSecondary: Pogledati usluge
      badges:
        - Ponuda pre radova
        - Garancija 12 meseci
        - Radimo sa osiguravajućim društvima
    trust:
      - value: 12 mes
        label: garancija na radove i delove
      - value: 1 dan
        label: uobičajeno vreme za redovno održavanje
      - value: besplatno
        label: cena prvobitnog pregleda
    servicesHead:
      eyebrow: Usluge
      heading: Šta radimo
      body: Od zamene ulja do obnavljanja geometrije karoserije posle udara. Sve na jednom mestu — nema potrebe za vožnjom automobila na tri adrese.
    why:
      eyebrow: Zašto kod nas
      heading: Autoservis bez iznenađenja u računu
      body: Glavni problem sa servisima — nije cena, već nepredvidivost. Mi to obezbeđujemo.
      points:
        - title: Ponuda pre radova
          text: Prvo dijagnostika i pisana ponuda, zatim vaše „da”, i tek tada ključevi u rad.
        - title: Stare delove vraćamo
          text: Sve što smo skinuli sa automobila vraćamo u kutiji. Ako želite — proverite da li je deo zaista bio dotrajao.
        - title: Ne forsiramo zamene
          text: Ako se može doći do sledećeg održavanja — reći ćemo vam, umesto da prodajemo zamenu danas.
        - title: Upisujemo u kartu
          text: Šta je menjano, koji pređeni put, koje delove. Prilikom sledeće posete ne počinjemo iznova.
    process:
      eyebrow: Kako radimo
      heading: Četiri koraka bez nerviranja
      body: Nema „ostavite auto, zvaćemo vas kasnije”. Znate šta se dešava na svakoj etapi.
      steps:
        - title: Prijavljivanje i zakazivanje
          text: Opisujete problem telefonom ili u poruci. Pronalazimo vreme da auto ne stoji u redu.
        - title: Dijagnostika
          text: Pronalazimo uzrok, a ne simptom. Pokazujemo na automobilu šta nije u redu.
        - title: Ponuda i odobravanje
          text: Šaljemo spisak radova i delova sa cenama. Radovi počinju samo posle vašeg odobrenja.
        - title: Rad i izdavanje
          text: Radimo, proveravamo u hodu, vraćamo auto sa starim delovima i zapisom u servisnoj knjizi.
    shopTeaser:
      eyebrow: Delovi
      heading: Akumulatori na stanju, sa ugradnjom za 20 minuta
      body: Pronalazimo po marki, modelu i godištu — ne po „približno sličnom”. Postavljamo na licu mesta, stari preuzimamo za reciklažu.
      cta: Izabrati akumulator
    accident:
      eyebrow: Posle nezgode
      heading: Limarijski radovi i farbanje
      body: Obnavljamo geometriju, ispravljamo i farbamo uz izbor boje po kodu i prema trošenju. Radimo sa osiguravajućim društvima — pomažemo u sakupljanju dokumentacije.
      points:
        - Stapel i merenje geometrije karoserije
        - Izbor boje po kodu i kompjuterskim spektrom
        - Poliranje prelaza da se granica ne vidi
        - Pomoć sa dokumentima za osiguranje
      cta: Procena popravke
    faq:
      - q: Koliko košta dijagnostika?
        a: Prvobitni pregled i očitavanje grešaka — besplatno. Plaćena postaje samo dubinska dijagnostika, kada je potrebno rastavljati deo ili stavljati auto na stanac; o ceni obaveštavamo unapred.
      - q: Mogu li doći sa svojim delovima?
        a: Možete. U tom slučaju, garancija se odnosi samo na naš rad, a ne na deo — to je pošteno i funkcioniše u oba smera.
      - q: Da li radite sa osiguravajućim kompanijama?
        a: Da, za limarijske radove. Pomažemo u obradi dokumenata i odobravanju ponude, a ako osiguranje ne pokriva sve — odmah ćemo reći koliko će ostati na vama.
      - q: Kako brzo mogu doći na održavanje?
        a: Obično u roku od dva do tri radna dana, a za zamenu ulja ili akumulatora često se uspeva uzeti u istom danu. Pozovite — reći ćemo tačno.
      - q: Da li dajete garanciju?
        a: 'Dvanaest meseci na obavljene radove i na delove koje smo sami postavili. Garancijski slučaj rešavamo bez sporova: ako je to naša greška, radimo ponovo besplatno.'
      - q: Auto na stranim tablicama — da li je problem?
        a: Ne. Za popravku dokumenta o registraciji nisu potrebna, dođite kako jeste.
    finalCta:
      eyebrow: Zakazati
      heading: Recite nam šta je sa autom
      body: Povratićemo se u radno vreme, razjasniti detalje i pronaći vreme. Ako je pitanje hitno — jednostavno pozovite.
      cta: Ostaviti prijavu
  en:
    meta:
      title: 'CarLab — car service in Belgrade: diagnostics, repairs, bodywork'
      description: 'Car service in Belgrade: computer diagnostics, scheduled maintenance, brake and suspension repairs, engine and gearbox work, accident repairs.'
    hero:
      heading: First the price, then the repair
      lead: Free error reading, written estimate before work begins, 12-month warranty. We tell you what's urgent and what can wait.
      ctaPrimary: Schedule a service
      ctaSecondary: View services
      badges:
        - Estimate before work
        - 12-month warranty
        - We work with insurance
    trust:
      - value: 12 months
        label: warranty on work and parts
      - value: 1 day
        label: average time for scheduled maintenance
      - value: free
        label: initial inspection cost
    servicesHead:
      eyebrow: Services
      heading: What we do
      body: From oil changes to restoring body geometry after a collision. Everything in one place — no need to visit three different locations.
    why:
      eyebrow: Why choose us
      heading: A car service with no surprises in the bill
      body: The main issue with services is not the price, but unpredictability. We eliminate that.
      points:
        - title: Estimate before work
          text: First diagnostics and written estimate, then your ‘yes’, and only then do we start working.
        - title: Return old parts
          text: Everything removed from your car is returned in a box. Feel free to check if the part was indeed worn out.
        - title: No upselling
          text: If you can wait until the next maintenance, we’ll let you know instead of pushing for a replacement today.
        - title: Record in service card
          text: What was replaced, mileage, which parts were used. We don’t start from scratch on your next visit.
    process:
      eyebrow: How we work
      heading: Four steps with no stress
      body: No ‘leave the car and we’ll call you later’. You know what’s happening at every stage.
      steps:
        - title: Request and booking
          text: Describe the issue over the phone or via messenger. We find a time so your car isn’t waiting in line.
        - title: Diagnostics
          text: We identify the cause, not just the symptom. We show you on the car what exactly is wrong.
        - title: Estimate and approval
          text: We send a list of work and parts along with prices. Work only begins after your confirmation.
        - title: Work and pickup
          text: We complete the work, check it on the go, and return the car with old parts and an updated service record.
    shopTeaser:
      eyebrow: Parts
      heading: Akumulator in stock, installed in 20 minutes
      body: We tailor our selection by brand, model, and year — not by ‘about the same’. We install on site and take the old one for recycling.
      cta: Find an akumulator
    accident:
      eyebrow: After an accident
      heading: Body repair and painting
      body: We restore geometry, fix and paint with color matching by code and actual fading. We work with insurance — helping you gather documents.
      points:
        - Dolly and geometry measurement
        - Color matching by code and computer spectrometer
        - Polishing transition so borders aren't visible
        - Assistance with documents for insurance
      cta: Evaluate repairs
    faq:
      - q: How much does diagnostics cost?
        a: The initial inspection and error reading are free. Only in-depth diagnostics, which require disassembly or using a stand, are chargeable; we inform you of the price in advance.
      - q: Can I come with my own parts?
        a: Yes. In this case, the warranty only covers our work, not the part — it's fair and works both ways.
      - q: Do you work with insurance companies?
        a: Yes, for body repairs. We help you prepare documents and approve the estimate, and if insurance doesn’t cover everything — we promptly inform you of the remaining costs.
      - q: How fast can I get a service appointment?
        a: Usually within two to three business days, and for an oil change or akumulator replacement, we often can take you the same day. Call us for an exact time.
      - q: Do you offer a warranty?
        a: 'Twelve months on completed work and parts we install. Warranty cases are handled without disputes: if it’s our fault, we fix it for free.'
      - q: Is having a foreign license plate a problem?
        a: No. For repairs, registration documents aren’t needed; come as you are.
    finalCta:
      eyebrow: Sign up
      heading: Tell us what's wrong with your car
      body: We’ll call back during business hours to confirm details and schedule a time. If it’s urgent, just give us a call.
      cta: Submit a request
