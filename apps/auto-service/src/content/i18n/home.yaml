meta:
  title: 'CarLab — автосервис в Белграде: диагностика, ремонт, кузов'
  description: Автосервис в Белграде. Компьютерная диагностика, плановое ТО, тормоза и подвеска, двигатель, кузовной ремонт после ДТП и покраска. Запчасти и аккумуляторы на месте.
hero:
  heading: Сначала цена, потом ремонт
  lead: Диагностика бесплатно, письменная смета до начала работ, гарантия 12 месяцев. Говорим, что нужно делать сейчас, а что спокойно подождёт.
  ctaPrimary: Записаться в сервис
  ctaSecondary: Посмотреть услуги
  badges:
    - Смета до начала работ
    - Гарантия 12 месяцев
    - Работаем со страховыми
trust:
  - value: 12 мес
    label: гарантия на работы и запчасти
  - value: 1 день
    label: обычный срок планового ТО
  - value: '0 RSD'
    label: стоимость первичного осмотра
servicesHead:
  eyebrow: Услуги
  heading: Что мы делаем
  body: От замены масла до восстановления геометрии кузова после удара. Всё в одном месте — не нужно возить машину по трём адресам.
why:
  eyebrow: Почему к нам
  heading: Автосервис без сюрприза в счёте
  body: Главная проблема с сервисами — не цена, а непредсказуемость. Мы её убираем.
  points:
    - title: Смета до работ
      text: Сначала диагностика и письменная смета, потом ваше «да», и только потом ключи в работу.
    - title: Старые детали возвращаем
      text: Всё, что сняли с машины, отдаём в коробке. Хотите — проверяйте, действительно ли деталь была изношена.
    - title: Не навязываем
      text: Если можно доехать до следующего ТО — скажем об этом, а не продадим замену сегодня.
    - title: Пишем в карту
      text: Что меняли, какой пробег, какие запчасти. На следующем визите не начинаем с нуля.
process:
  eyebrow: Как работаем
  heading: Четыре шага без нервов
  body: Никаких «оставьте машину, потом позвоним». Вы знаете, что происходит, на каждом этапе.
  steps:
    - title: Заявка и запись
      text: Описываете проблему по телефону или в мессенджере. Подбираем время, чтобы машина не стояла в очереди.
    - title: Диагностика
      text: Находим причину, а не симптом. Показываем на машине, что именно не так.
    - title: Смета и согласование
      text: Присылаем список работ и запчастей с ценами. Работы начинаются только после вашего подтверждения.
    - title: Работа и выдача
      text: Делаем, проверяем на ходу, отдаём машину со старыми деталями и записью в сервисной карте.
shopTeaser:
  eyebrow: Запчасти
  heading: Аккумуляторы в наличии, с установкой за 20 минут
  body: Подбираем по марке, модели и году — не по «примерно такой же». Ставим на месте, старый забираем на утилизацию.
  cta: Подобрать аккумулятор
accident:
  eyebrow: После ДТП
  heading: Кузовной ремонт и покраска
  body: Восстанавливаем геометрию, правим и красим с подбором цвета по коду и по факту выгорания. Работаем со страховыми — помогаем собрать документы.
  points:
    - Стапель и замер геометрии кузова
    - Подбор краски по коду и компьютерным спектром
    - Полировка перехода, чтобы не было видно границы
    - Помощь с документами для страховой
  cta: Оценить ремонт
faq:
  - q: Сколько стоит диагностика?
    a: Первичный осмотр и считывание ошибок — бесплатно. Платной становится только углублённая диагностика, когда нужно разбирать узел или ставить машину на стенд; о цене предупреждаем заранее.
  - q: Можно приехать со своими запчастями?
    a: Можно. В этом случае гарантия распространяется только на нашу работу, а не на деталь — это честно и работает в обе стороны.
  - q: Вы работаете со страховыми компаниями?
    a: Да, по кузовному ремонту. Поможем оформить документы и согласовать смету, а если страховая покрывает не всё — сразу скажем, сколько останется на вас.
  - q: Как быстро можно попасть на ТО?
    a: Обычно в течение двух-трёх рабочих дней, а на замену масла или аккумулятора часто удаётся взять в тот же день. Позвоните — скажем точно.
  - q: Даёте ли вы гарантию?
    a: 'Двенадцать месяцев на выполненные работы и на установленные нами запчасти. Гарантийный случай разбираем без споров: если это наша ошибка, переделываем бесплатно.'
  - q: Машина на иностранных номерах — это проблема?
    a: Нет. Для ремонта документы о регистрации не нужны, приезжайте как есть.
finalCta:
  eyebrow: Записаться
  heading: Расскажите, что с машиной
  body: Перезвоним в рабочее время, уточним детали и подберём время. Если вопрос срочный — просто позвоните.
  cta: Оставить заявку
translations:
  sr:
    meta:
      title: 'CarLab — autoservis u Beogradu: dijagnostika, popravka, karoserija'
      description: Autoservis u Beogradu. Računarska dijagnostika, redovni servis, kočnice i suspenzija, motor, karoserijska popravka nakon nesreće i farbanje. Delovi i akumulatori na lokaciji.
    hero:
      heading: Prvo cena, pa popravka
      lead: Dijagnostika besplatna, pisana ponuda pre početka radova, garancija 12 meseci. Objasnićemo šta treba odmah da se radi, a šta može da sačeka.
      ctaPrimary: Prijavite se za servis
      ctaSecondary: Pogledajte usluge
      badges:
        - Ponuda pre radova
        - Garancija 12 meseci
        - Radimo sa osiguravajućim društvima
    trust:
      - value: 12 mes
        label: garancija na radove i delove
      - value: 1 dan
        label: prosečan rok redovnog servisa
      - value: 0 RSD
        label: cena prvog pregleda
    servicesHead:
      eyebrow: Usluge
      heading: Šta radimo
      body: Od zamene ulja do obnavljanja geometrije karoserije nakon udarca. Sve na jednom mestu — ne morate voziti auto na tri adrese.
    why:
      eyebrow: Zašto kod nas
      heading: Autoservis bez iznenađenja na računu
      body: Glavni problem sa servisima nije cena, već nepredvidivost. Mi je uklanjamo.
      points:
        - title: Ponuda pre radova
          text: Prvo dijagnostika i pisana ponuda, zatim vaše 'da', i tek onda ključevi u rad.
        - title: Vraćamo stare delove
          text: Sve što smo sklonili sa automobila, vraćamo u kutiji. Ako želite — proverite da li je deo zaista bio istrošen.
        - title: Ne nudimo vam nešto što ne treba
          text: Ako se može čekati do narednog servisa — reći ćemo vam to, umesto da prodajemo zamenu danas.
        - title: Zapisujemo sve u karton
          text: Šta je menjano, koja je kilometraža, koji delovi. Na sledećem dolasku ne počinjemo iz početka.
    process:
      eyebrow: Kako radimo
      heading: Četiri koraka bez stresa
      body: Nema 'ostavite auto, zvaćemo vas kasnije'. Znate šta se dešava na svakom koraku.
      steps:
        - title: Prijava i zakazivanje
          text: Opisujete problem telefonom ili putem poruke. Biramo vreme kako auto ne bi stajao u redu.
        - title: Dijagnostika
          text: Nalazimo uzrok, a ne simptom. Pokazujemo na automobilu šta tačno nije u redu.
        - title: Ponuda i odobrenje
          text: Šaljemo spisak radova i delova sa cenama. Radovi počinju samo nakon vašeg odobrenja.
        - title: Rad i preuzimanje
          text: Radimo, proveravamo u hodu, predajemo automobil sa starim delovima i beleškom u servisnoj karti.
    shopTeaser:
      eyebrow: Delovi
      heading: Akumulatori dostupni, sa ugradnjom za 20 minuta
      body: Biramo po marki, modelu i godini — ne po 'približno takvom'. Ugrađujemo na licu mesta, stari preuzimamo na reciklažu.
      cta: Izabrati akumulator
    accident:
      eyebrow: Nakon nesreće
      heading: Karoserijska popravka i farbanje
      body: Obnavljamo geometriju, ispravljamo i farbamo sa izborom boje po kodu i prema oštećenju. Radimo sa osiguravajućim društvima — pomažemo u prikupljanju dokumenata.
      points:
        - Stapel i merenje geometrije karoserije
        - Izbor boje po kodu i kompjuterskim spektrom
        - Poliranje prelaza, kako ne bi bilo vidljivih granica
        - Pomoć sa dokumentima za osiguranje
      cta: Procena popravke
    faq:
      - q: Koliko košta dijagnostika?
        a: Prvi pregled i očitavanje grešaka — besplatno. Plaćena postaje samo dubinska dijagnostika, kada treba rastaviti sklop ili staviti auto na stalak; o ceni obaveštavamo unapred.
      - q: Mogu li doći sa svojim delovima?
        a: Možete. U tom slučaju, garancija se odnosi samo na naš rad, a ne na deo — to je pošteno i funkcioniše u obe strane.
      - q: Da li radite sa osiguravajućim kompanijama?
        a: Da, za karoserijske popravke. Pomoći ćemo vam da popunite dokumentaciju i usaglasimo ponudu, a ako osiguranje ne pokriva sve — odmah ćemo reći koliko će ostati na vama.
      - q: Kako brzo mogu doći na servis?
        a: Obično u roku od dva do tri radna dana, a za zamenu ulja ili akumulatora često uspemo da primimo i istog dana. Pozovite — reći ćemo tačno.
      - q: Da li dajete garanciju?
        a: 'Dvanaest meseci na izvedene radove i na delove koje mi postavljamo. Garancijski slučaj razmatramo bez rasprava: ako je to naša greška, radimo besplatno.'
      - q: Auto sa stranim registarskim tablicama — da li je to problem?
        a: Ne. Za popravku dokumenti o registraciji nisu potrebni, dođite kako jeste.
    finalCta:
      eyebrow: Prijavite se
      heading: Recite nam šta je sa autom
      body: Povratno ćemo vas kontaktirati u radno vreme, razjasniti detalje i odabrati vreme. Ako je pitanje hitno — jednostavno nazovite.
      cta: Ostaviti prijavu
  en:
    meta:
      title: 'CarLab — car service in Belgrade: diagnostics, repair, bodywork'
      description: Car service in Belgrade. Computer diagnostics, scheduled maintenance, brakes and suspension, engine, accident repair, and respraying. Parts and batteries available on site.
    hero:
      heading: Price first, then repair
      lead: Diagnostics are free, written estimates provided before work starts, 12-month warranty. We tell you what needs immediate attention and what can wait.
      ctaPrimary: Book a service appointment
      ctaSecondary: View services
      badges:
        - Estimate provided before work begins
        - 12-month warranty
        - We work with insurance companies
    trust:
      - value: 12 months
        label: warranty on work and parts
      - value: 1 day
        label: typical timeframe for scheduled maintenance
      - value: 0 RSD
        label: cost of initial inspection
    servicesHead:
      eyebrow: Services
      heading: What we offer
      body: From oil changes to restoring body geometry after a collision. Everything in one place — no need to drive your car to three different locations.
    why:
      eyebrow: Why choose us
      heading: A car service without surprise bills
      body: The main issue with services is not the price, but unpredictability. We eliminate that.
      points:
        - title: Estimate before the work
          text: First, diagnostics and a written estimate, then your 'yes', and only then the keys go to work.
        - title: We return old parts
          text: Everything we remove from your car will be returned in a box. Feel free to check if the part was indeed worn out.
        - title: No upselling
          text: If you can wait until the next scheduled maintenance, we'll tell you, instead of pushing for a replacement today.
        - title: Document everything
          text: What was changed, mileage, which parts were used. We don't start from scratch on your next visit.
    process:
      eyebrow: How we operate
      heading: Four steps without stress
      body: No 'leave your car, and we'll call you later'. You know what’s happening at every stage.
      steps:
        - title: Application and appointment
          text: Describe the issue over the phone or in a messenger. We find a time so your car isn’t left waiting.
        - title: Diagnostics
          text: We identify the cause, not just the symptoms. We'll show you on your car what exactly is wrong.
        - title: Estimate and agreement
          text: We send you a list of work and parts with prices. Work begins only after your confirmation.
        - title: Work and handover
          text: We complete the work, check everything on the go, return your car with the old parts and a service record.
    shopTeaser:
      eyebrow: Parts
      heading: Batteries in stock, installed in 20 minutes
      body: We select based on make, model, and year — not ‘kind of similar’. Installed on-site, and we take the old one for recycling.
      cta: Find a battery
    accident:
      eyebrow: After an accident
      heading: Body repair and respraying
      body: We restore geometry, fix and paint with color matching based on the code and actual fading. We work with insurance companies — we help with the documentation.
      points:
        - Frame machine and geometry measurement
        - Color matching by code and computer spectrometry
        - Polishing transitions to hide seams
        - Assistance with insurance documents
      cta: Estimate repair
    faq:
      - q: How much does diagnostics cost?
        a: The initial inspection and error reading is free. Only thorough diagnostics, requiring disassembly or a test stand, incurs a fee; we inform you of the cost in advance.
      - q: Can I bring my own parts?
        a: Yes. In this case, the warranty only covers our work, not the part — this is fair and works both ways.
      - q: Do you work with insurance companies?
        a: Yes, for body repairs. We help with document preparation and estimate approval, and if the insurance doesn’t cover everything — we’ll tell you upfront how much will be left to you.
      - q: How quickly can I get an appointment for maintenance?
        a: Usually within two to three business days, and for an oil change or battery replacement, we often can do it the same day. Call us for a precise answer.
      - q: Do you provide a warranty?
        a: 'Twelve months on completed work and parts we install. We handle warranty cases without disputes: if it’s our fault, we fix it for free.'
      - q: Is a car with foreign plates a problem?
        a: No. For repairs, registration documents are not required, just come as you are.
    finalCta:
      eyebrow: Book an appointment
      heading: Tell us what’s going on with your car
      body: We’ll call you back during business hours to clarify details and schedule a time. If it's urgent — just give us a call.
      cta: Submit your request
