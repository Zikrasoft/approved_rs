meta:
  title: 'CarLab | автосервис в Белграде: диагностика, ремонт, кузов'
  description: 'Автосервис в Белграде: компьютерная диагностика, плановое ТО и замена масла, ремонт подвески и тормозов, двигатель и коробка, кузовной ремонт после ДТП.'
hero:
  heading: Ремонт и запчасти в Белграде
  ctaPrimary: Записаться на ремонт
  ctaSecondary: Посмотреть услуги
  partsHeading: Подберем запчасть по VIN
  partsSubmit: Подобрать
  partsHint: Назовем цену и срок.
  partsInquiry: Отправить запрос менеджеру
  badges:
    - Смета до начала работ
    - Плановое ТО обычно за день
    - Работаем со страховыми
servicesHead:
  eyebrow: Услуги
  heading: Что мы делаем
  body: От замены масла до восстановления геометрии кузова после удара. Все в одном месте, не нужно возить машину по трем адресам.
why:
  eyebrow: Почему к нам
  heading: Автосервис без сюрприза в счете
  body: Главная проблема с сервисами не цена, а непредсказуемость. Мы ее убираем.
  points:
    - title: Смета до работ
      text: Сначала диагностика и письменная смета, потом ваше «да», и только потом ключи в работу.
    - title: Старые детали возвращаем
      text: Все, что сняли с машины, отдаем в коробке. Если хотите, проверьте, действительно ли деталь была изношена.
    - title: Не навязываем
      text: Если можно доехать до следующего ТО, скажем об этом, а не продадим замену сегодня.
    - title: Пишем в карту
      text: Что меняли, какой пробег, какие запчасти. На следующем визите не начинаем с нуля.
process:
  eyebrow: Как работаем
  heading: Четыре шага без нервов
  body: Никаких «оставьте машину, потом позвоним». Вы знаете, что происходит, на каждом этапе.
  steps:
    - title: Заявка и запись
      text: Описываете проблему по телефону или в мессенджере. Подбираем время, чтобы машина не стояла в очереди.
    - title: Диагностика
      text: Находим причину, а не симптом. Показываем на машине, что именно не так.
    - title: Смета и согласование
      text: Присылаем список работ и запчастей с ценами. Работы начинаются только после вашего подтверждения.
    - title: Работа и выдача
      text: Делаем, проверяем на ходу, отдаем машину со старыми деталями и записью в сервисной карте.
accident:
  eyebrow: После ДТП
  heading: Кузовной ремонт и покраска
  body: Восстанавливаем геометрию, правим и красим с подбором цвета по коду и по факту выгорания. Работаем со страховыми и помогаем собрать документы.
  points:
    - Стапель и замер геометрии кузова
    - Подбор краски по коду и компьютерным спектром
    - Полировка перехода, чтобы не было видно границы
    - Помощь с документами для страховой
  cta: Оценить ремонт
faqEyebrow: FAQ
faq:
  - q: Сколько стоит диагностика?
    a: Первичный осмотр и считывание ошибок бесплатны. Платной становится только углубленная диагностика, когда нужно разбирать узел или ставить машину на стенд; о цене предупреждаем заранее.
  - q: Можно приехать со своими запчастями?
    a: Можно. В этом случае мы отвечаем только за свою работу, а не за деталь. Это честно и работает в обе стороны.
  - q: Вы работаете со страховыми компаниями?
    a: Да, по кузовному ремонту. Поможем оформить документы и согласовать смету, а если страховая покрывает не все, сразу скажем, сколько останется на вас.
  - q: Как быстро можно попасть на ТО?
    a: Обычно в течение двух-трех рабочих дней, а на замену масла или аккумулятора часто удается взять в тот же день. Позвоните, и мы скажем точно.
  - q: Машина на иностранных номерах, это проблема?
    a: Нет. Для ремонта документы о регистрации не нужны, приезжайте как есть.
finalCta:
  eyebrow: Записаться
  heading: Расскажите, что с машиной
  body: Перезвоним в рабочее время, уточним детали и подберем время. Если вопрос срочный, просто позвоните.
  cta: Оставить заявку
translations:
  sr:
    meta:
      title: 'CarLab | Autoservis u Beogradu: dijagnostika, popravke'
      description: 'Autoservis u Beogradu: kompjuterska dijagnostika, redovan servis, zamena ulja, popravka trapa, kočnica, motora i menjača, limarski radovi posle udesa.'
    hero:
      heading: Prvo cena, pa popravka
      ctaPrimary: Zakažite servis
      ctaSecondary: Pogledajte usluge
      badges:
        - Ponuda pre početka radova
        - Sarađujemo sa osiguravajućim kućama
    servicesHead:
      eyebrow: Usluge
      heading: Šta radimo
      body: Od zamene ulja do vraćanja geometrije karoserije posle udesa. Sve na jednom mestu, bez vožnje od servisa do servisa.
    why:
      eyebrow: Zašto kod nas
      heading: Autoservis bez iznenađenja na računu
      body: Najveći problem sa servisima nije cena, već to što ne znate šta vas čeka. Kod nas znate.
      points:
        - title: Ponuda pre radova
          text: Prvo dijagnostika i pisana ponuda, zatim vaše odobrenje. Tek onda počinjemo sa radom.
        - title: Vraćamo stare delove
          text: Sve delove koje skinemo sa vozila vraćamo vam u kutiji. Ako želite, proverite i sami da li je deo zaista bio istrošen.
        - title: Bez nepotrebnih zamena
          text: Ako zamena može da sačeka sledeći servis, to ćemo vam i reći, umesto da vas ubeđujemo da je uradite odmah.
        - title: Vodimo servisnu evidenciju
          text: Beležimo šta je zamenjeno, na kojoj kilometraži i koji su delovi ugrađeni. Pri sledećoj poseti ne krećemo od nule.
    process:
      eyebrow: Kako radimo
      heading: Četiri koraka bez nerviranja
      body: Bez onog „ostavite auto, zvaćemo vas“. U svakom trenutku znate šta se dešava.
      steps:
        - title: Upit i zakazivanje
          text: Opišite problem telefonom ili porukom. Dogovaramo termin tako da vozilo ne čeka na red.
        - title: Dijagnostika
          text: Otkrivamo uzrok, ne samo simptom. Pokazujemo vam na vozilu šta tačno nije u redu.
        - title: Ponuda i odobrenje
          text: Šaljemo vam spisak radova i delova sa cenama. Radove započinjemo tek kada ih odobrite.
        - title: Popravka i preuzimanje
          text: Obavljamo radove, proveravamo vozilo u vožnji i predajemo vam ga sa starim delovima i upisanim radovima u servisnoj evidenciji.
    accident:
      eyebrow: Posle udesa
      heading: Limarski radovi i farbanje
      body: Vraćamo geometriju karoserije, ispravljamo lim i farbamo, uz usklađivanje boje prema fabričkom kodu i stvarnoj izbledelosti laka. Sarađujemo sa osiguravajućim kućama i pomažemo vam da prikupite dokumentaciju.
      points:
        - Izvlačenje na stolu i merenje geometrije karoserije
        - Određivanje nijanse prema kodu boje i spektrofotometrom
        - Poliranje prelaza za neprimetan spoj
        - Pomoć oko dokumentacije za osiguranje
      cta: Zatražite procenu popravke
    faqEyebrow: FAQ
    faq:
      - q: Koliko košta dijagnostika?
        a: Prvi pregled i očitavanje grešaka su besplatni. Naplaćuje se samo detaljna dijagnostika koja zahteva rasklapanje sklopa ili ispitivanje na testnom stolu. O ceni vas obaveštavamo unapred.
      - q: Mogu li da donesem svoje delove?
        a: Možete. U tom slučaju odgovaramo samo za svoj rad, ne i za doneti deo. Tako je pošteno za obe strane.
      - q: Da li sarađujete sa osiguravajućim kućama?
        a: Da, za limarske i farbarske radove. Pomoći ćemo vam oko dokumentacije i usaglašavanja procene troškova. Ako osiguranje ne pokriva sve, odmah ćemo vam reći koliko ostaje da platite.
      - q: Koliko brzo mogu da zakažem redovan servis?
        a: Termin je obično dostupan za dva do tri radna dana, a zamenu ulja ili akumulatora često možemo da obavimo istog dana. Pozovite nas da proverimo tačan termin.
      - q: Da li su strane registarske tablice problem?
        a: Ne. Za popravku nije potrebna saobraćajna dozvola, slobodno dođite.
    finalCta:
      eyebrow: Zakažite termin
      heading: Recite nam šta nije u redu sa vozilom
      body: Pozvaćemo vas tokom radnog vremena, proveriti detalje i dogovoriti termin. Ako je hitno, pozovite nas direktno.
      cta: Pošaljite upit
  en:
    meta:
      title: CarLab | Car servicing, repairs and bodywork in Belgrade
      description: 'Car service in Belgrade: diagnostics, scheduled servicing, oil changes, suspension and brakes, engine and gearbox repairs, and accident repair.'
    hero:
      heading: Price first, repairs second
      ctaPrimary: Book an appointment
      ctaSecondary: View services
      badges:
        - Estimate before work starts
        - We work with insurers
    servicesHead:
      eyebrow: Services
      heading: What we do
      body: From oil changes to chassis alignment after a collision. All in one place, so you don't have to take your car to three different workshops.
    why:
      eyebrow: Why choose us
      heading: Car repairs without surprise bills
      body: The biggest problem with garages isn't the price. It's not knowing what to expect. We take that uncertainty away.
      points:
        - title: An estimate before we start
          text: First, diagnostics and a written estimate. Then your approval. Only then do we pick up the tools.
        - title: We return your old parts
          text: We give you everything we remove from your car in a box. You can check the wear for yourself if you like.
        - title: No unnecessary replacements
          text: If a part can safely last until your next service, we'll tell you rather than sell you a replacement today.
        - title: We keep a service record
          text: What we replaced, the mileage and the parts fitted. So we don't start from scratch at your next visit.
    process:
      eyebrow: How we work
      heading: Four stress-free steps
      body: No vague promises to call you after you drop the car off. You'll know what's happening at every stage.
      steps:
        - title: Enquiry and booking
          text: Tell us about the problem by phone or message. We'll arrange a time so your car isn't left waiting in a queue.
        - title: Diagnostics
          text: We find the cause, not just the symptom. We'll show you exactly what's wrong on your car.
        - title: Estimate and approval
          text: We send you an itemised estimate for labour and parts. Work only starts once you've approved it.
        - title: Repairs and collection
          text: We complete the work, road-test the car and return it with your old parts and an updated service record.
    accident:
      eyebrow: After an accident
      heading: Body repairs and respraying
      body: We restore chassis alignment, repair panels and respray, matching the paint code and allowing for fading. We work with insurers and help you put the paperwork together.
      points:
        - Chassis jig and alignment measurement
        - Paint matching by colour code and spectrophotometer
        - Polished paint blends for a seamless finish
        - Help with insurance paperwork
      cta: Get a repair estimate
    faqEyebrow: FAQ
    faq:
      - q: How much do diagnostics cost?
        a: The initial inspection and fault code reading are free. We only charge for in-depth diagnostics that require dismantling a component or using a test rig. We'll confirm the price beforehand.
      - q: Can I bring my own parts?
        a: Yes. In that case, we guarantee our workmanship, but not the part itself. That keeps things fair for both sides.
      - q: Do you work with insurance companies?
        a: Yes, for body repairs. We'll help with the paperwork and getting the estimate approved. If your insurer doesn't cover the full cost, we'll tell you upfront how much you'll need to pay.
      - q: How soon can I book a service?
        a: Usually within two to three working days. We can often fit in an oil change or car battery replacement the same day. Give us a call to check availability.
      - q: Is it a problem if my car has foreign plates?
        a: Not at all. You don't need registration documents for repairs. Just bring your car in.
    finalCta:
      eyebrow: Book an appointment
      heading: Tell us what's wrong with your car
      body: We'll call you back during opening hours, go over the details and arrange a time. If it's urgent, just give us a call.
      cta: Send an enquiry
