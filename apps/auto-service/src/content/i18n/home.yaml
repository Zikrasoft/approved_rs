meta:
  title: 'CarLab | автосервис в Белграде: диагностика, ремонт, кузов'
  description: 'Автосервис в Белграде: компьютерная диагностика, плановое ТО и замена масла, ремонт подвески и тормозов, двигатель и коробка, кузовной ремонт после ДТП.'
hero:
  heading: Сначала цена, потом ремонт
  lead: Считывание ошибок бесплатно, письменная смета до начала работ. Говорим, что нужно делать сейчас, а что спокойно подождет.
  ctaPrimary: Записаться в сервис
  ctaSecondary: Посмотреть услуги
  badges:
    - Смета до начала работ
    - Работаем со страховыми
trust:
  - value: Письменно
    label: смета до начала любых работ
  - value: 1 день
    label: обычный срок планового ТО
  - value: бесплатно
    label: стоимость первичного осмотра
servicesHead:
  eyebrow: Услуги
  heading: Что мы делаем
  body: От замены масла до восстановления геометрии кузова после удара. Все в одном месте, не нужно возить машину по трем адресам.
why:
  eyebrow: Почему к нам
  heading: Автосервис без сюрприза в счете
  body: Главная проблема с сервисами не цена, а непредсказуемость. Мы ее убираем.
  points:
    - title: Смета до работ
      text: Сначала диагностика и письменная смета, потом ваше «да», и только потом ключи в работу.
    - title: Старые детали возвращаем
      text: Все, что сняли с машины, отдаем в коробке. Если хотите, проверьте, действительно ли деталь была изношена.
    - title: Не навязываем
      text: Если можно доехать до следующего ТО, скажем об этом, а не продадим замену сегодня.
    - title: Пишем в карту
      text: Что меняли, какой пробег, какие запчасти. На следующем визите не начинаем с нуля.
process:
  eyebrow: Как работаем
  heading: Четыре шага без нервов
  body: Никаких «оставьте машину, потом позвоним». Вы знаете, что происходит, на каждом этапе.
  steps:
    - title: Заявка и запись
      text: Описываете проблему по телефону или в мессенджере. Подбираем время, чтобы машина не стояла в очереди.
    - title: Диагностика
      text: Находим причину, а не симптом. Показываем на машине, что именно не так.
    - title: Смета и согласование
      text: Присылаем список работ и запчастей с ценами. Работы начинаются только после вашего подтверждения.
    - title: Работа и выдача
      text: Делаем, проверяем на ходу, отдаем машину со старыми деталями и записью в сервисной карте.
accident:
  eyebrow: После ДТП
  heading: Кузовной ремонт и покраска
  body: Восстанавливаем геометрию, правим и красим с подбором цвета по коду и по факту выгорания. Работаем со страховыми и помогаем собрать документы.
  points:
    - Стапель и замер геометрии кузова
    - Подбор краски по коду и компьютерным спектром
    - Полировка перехода, чтобы не было видно границы
    - Помощь с документами для страховой
  cta: Оценить ремонт
faq:
  - q: Сколько стоит диагностика?
    a: Первичный осмотр и считывание ошибок бесплатны. Платной становится только углубленная диагностика, когда нужно разбирать узел или ставить машину на стенд; о цене предупреждаем заранее.
  - q: Можно приехать со своими запчастями?
    a: Можно. В этом случае мы отвечаем только за свою работу, а не за деталь. Это честно и работает в обе стороны.
  - q: Вы работаете со страховыми компаниями?
    a: Да, по кузовному ремонту. Поможем оформить документы и согласовать смету, а если страховая покрывает не все, сразу скажем, сколько останется на вас.
  - q: Как быстро можно попасть на ТО?
    a: Обычно в течение двух-трех рабочих дней, а на замену масла или аккумулятора часто удается взять в тот же день. Позвоните, и мы скажем точно.
  - q: Машина на иностранных номерах, это проблема?
    a: Нет. Для ремонта документы о регистрации не нужны, приезжайте как есть.
finalCta:
  eyebrow: Записаться
  heading: Расскажите, что с машиной
  body: Перезвоним в рабочее время, уточним детали и подберем время. Если вопрос срочный, просто позвоните.
  cta: Оставить заявку
translations:
  sr:
    meta:
      title: 'CarLab — autoservis u Beogradu: dijagnostika, popravka, karoserija'
      description: 'Autoservis u Beogradu: kompjuterska dijagnostika, preventivni servis i zamena ulja, popravka vešanja i kočnica, motor i menjač, karoserijske popravke nakon udesa.'
    hero:
      heading: Prvo cena, zatim popravka
      lead: Čitanje grešaka besplatno, pisana ponuda pre početka radova. Kažemo šta treba uraditi odmah, a šta može sačekati.
      ctaPrimary: Prijavite se za servis
      ctaSecondary: Pogledajte usluge
      badges:
        - Ponuda pre radova
        - Radimo sa osiguravajućim društvima
    trust:
      - value: Pismeno
        label: ponuda pre početka bilo kojih radova
      - value: 1 dan
        label: uobičajeni rok za preventivni servis
      - value: besplatno
        label: trošak prvog pregleda
    servicesHead:
      eyebrow: Usluge
      heading: Šta radimo
      body: Od zamene ulja do vraćanja geometrije karoserije nakon udarca. Sve na jednom mestu — ne morate nositi automobil na tri adrese.
    why:
      eyebrow: Zašto kod nas
      heading: Autoservis bez iznenađenja u računu
      body: Glavni problem sa servisima — nije cena, već nepredvidivost. Mi to eliminišemo.
      points:
        - title: Ponuda pre radova
          text: Prvo dijagnostika i pisana ponuda, zatim vaše „da“, a tek onda ključevi u rad.
        - title: Vraćamo stare delove
          text: Sve što smo skinuli sa automobila vraćamo u kutiji. Ako želite — proverite da li je deo zaista bio istrošen.
        - title: Ne namećemo
          text: Ako možete da stignete do sledeće dijagnostike — reći ćemo vam to, umesto da prodamo zamenu danas.
        - title: Pišemo u karticu
          text: Šta je menjano, koja kilometraža, koji delovi. Pri sledećem posetu ne počinjemo ispočetka.
    process:
      eyebrow: Kako radimo
      heading: Četiri koraka bez nerviranja
      body: Nema „ostavite automobil, pa ćemo vas nazvati“. Znate šta se dešava na svakom koraku.
      steps:
        - title: Prijava i zakazivanje
          text: Opisujete problem telefonom ili u poruci. Biramo vreme tako da automobil ne čeka u redu.
        - title: Dijagnostika
          text: Nalazimo uzrok, a ne simptom. Pokažemo na automobilu šta tačno nije u redu.
        - title: Ponuda i saglasnost
          text: Šaljemo spisak radova i delova sa cenama. Radovi počinju tek nakon vašeg potvrđivanja.
        - title: Rad i predaja
          text: Radimo, proveravamo u pokretu, predajemo automobil sa starim delovima i zapisom u servisnoj kartici.
    accident:
      eyebrow: Nakon udesa
      heading: Karoserijske popravke i farbanje
      body: Vraćamo geometriju, pravimo i farbamo uz izbor boje prema kodu i po stvarnom izbleđenju. Radimo sa osiguravajućim društvima — pomažemo u prikupljanju dokumenata.
      points:
        - Stapel i merenje geometrije karoserije
        - Izbor boje prema kodu i kompjuterskom spektru
        - Poliranje prelaza, kako granice ne bi bile vidljive
        - Pomoć sa dokumentima za osiguranje
      cta: Procena popravke
    faq:
      - q: Koliko košta dijagnostika?
        a: Prvi pregled i čitanje grešaka — besplatno. Plaćena postaje samo dubinska dijagnostika, kada treba rastaviti sklop ili staviti automobil na parameter; o ceni obaveštavamo unapred.
      - q: Mogu li doneti svoje delove?
        a: Možete. U tom slučaju odgovaramo samo za svoj rad, a ne za deo — to je pošteno i funkcioniše u obostranu korist.
      - q: Radite li sa osiguravajućim kompanijama?
        a: Da, za karoserijske popravke. Pomoći ćemo vam da pripremite dokumente i saglasite ponudu, a ako osiguranje ne pokriva sve — odmah ćemo reći koliko ostaje na vama.
      - q: Koliko brzo mogu na servis?
        a: Obično unutar dva do tri radna dana, a na zamenu ulja ili akumulatora često možemo primiti istog dana. Pozovite — reći ćemo tačno.
      - q: Automobil sa stranim registarskim oznakama — da li je to problem?
        a: Ne. Za popravku dokumenti o registraciji nisu potrebni, dođite kako jeste.
    finalCta:
      eyebrow: Prijavite se
      heading: Recite nam šta nije u redu sa automobilom
      body: Javićemo se u radno vreme, razjasnićemo detalje i dogovoriti vreme. Ako je pitanje hitno — jednostavno nazovite.
      cta: Ostavite prijavu
  en:
    meta:
      title: 'CarLab — auto service in Belgrade: diagnostics, repairs, bodywork'
      description: 'Auto service in Belgrade: computer diagnostics, regular maintenance, and oil change, suspension and brake repairs, engine and gearbox work, accident repairs.'
    hero:
      heading: Price first, repair later
      lead: Free error reading, written estimate before work begins. We’ll tell you what needs immediate attention and what can wait.
      ctaPrimary: Book a service
      ctaSecondary: View services
      badges:
        - Estimate before work begins
        - We work with insurers
    trust:
      - value: In writing
        label: estimate before any work
      - value: 1 day
        label: standard time for regular maintenance
      - value: free
        label: cost of initial inspection
    servicesHead:
      eyebrow: Services
      heading: What we do
      body: From oil changes to restoring body geometry after a collision. Everything in one place—no need to take your car to three different locations.
    why:
      eyebrow: Why choose us
      heading: Auto service with no surprise charges
      body: The main issue with service centers isn’t the price, but the unpredictability. We eliminate that.
      points:
        - title: Estimate before work
          text: First diagnostics and a written estimate, then your 'yes', and only then do we start working.
        - title: We return old parts
          text: Everything we remove from your car goes back in a box. You can check if a part was really worn out.
        - title: No pressure
          text: If you can wait until the next maintenance, we’ll let you know instead of pushing for replacements today.
        - title: Documented in the service record
          text: What was replaced, mileage, which parts were used. During your next visit, we won't start from scratch.
    process:
      eyebrow: How we operate
      heading: Four steps, no stress
      body: No 'drop off your car, we'll call you later'. You know what's happening at every stage.
      steps:
        - title: Request and booking
          text: Describe the issue over the phone or via messenger. We pick a time so your car doesn't wait in line.
        - title: Diagnostics
          text: We identify the cause, not just the symptom. We show you on the vehicle what’s wrong.
        - title: Estimate and approval
          text: We send a list of tasks and parts with prices. Work begins only after your confirmation.
        - title: Work and delivery
          text: We complete the repairs, check everything, and return your car with the old parts and an updated service record.
    accident:
      eyebrow: After an accident
      heading: Body repair and painting
      body: We restore geometry, straighten and paint with color matching based on the code and the actual fading. We work with insurers and assist with documentation.
      points:
        - Measuring frame and body geometry
        - Paint matching by code and using computer spectrometry
        - Polishing blending to eliminate visible edges
        - Documentation assistance for insurance
      cta: Estimate repair
    faq:
      - q: How much does diagnostics cost?
        a: The initial inspection and error reading is free. Detailed diagnostics that require disassembly or a stand incurs a charge; we'll notify you about the price in advance.
      - q: Can I bring my own parts?
        a: Yes. In this case, we are only responsible for our workmanship, not the parts—it's fair and works both ways.
      - q: Do you work with insurance companies?
        a: Yes, for body repairs. We’ll help you with the paperwork and estimate approval, and if the insurer doesn’t cover everything, we'll let you know how much you'll need to pay.
      - q: How quickly can I get in for maintenance?
        a: Usually within two to three working days, and we often can accommodate oil changes or battery replacements the same day. Just call us for details.
      - q: Is it a problem if my car has foreign plates?
        a: No. You don't need registration documents for repairs; just come as you are.
    finalCta:
      eyebrow: Book a service
      heading: Tell us what’s wrong with your car
      body: We’ll call back during working hours to clarify details and schedule a time. If it’s urgent, just give us a call.
      cta: Submit a request
