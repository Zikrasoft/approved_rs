meta:
  title: 'CarLab — автосервис в Белграде: диагностика, ремонт, кузов'
  description: 'Автосервис в Белграде: компьютерная диагностика, плановое ТО и замена масла, ремонт подвески и тормозов, двигатель и коробка, кузовной ремонт после ДТП.'
hero:
  heading: Сначала цена, потом ремонт
  lead: Считывание ошибок бесплатно, письменная смета до начала работ, гарантия 12 месяцев. Говорим, что нужно делать сейчас, а что спокойно подождёт.
  ctaPrimary: Записаться в сервис
  ctaSecondary: Посмотреть услуги
  badges:
    - Смета до начала работ
    - Гарантия 12 месяцев
    - Работаем со страховыми
trust:
  - value: 12 мес
    label: гарантия на работы и запчасти
  - value: 1 день
    label: обычный срок планового ТО
  - value: бесплатно
    label: стоимость первичного осмотра
servicesHead:
  eyebrow: Услуги
  heading: Что мы делаем
  body: От замены масла до восстановления геометрии кузова после удара. Всё в одном месте — не нужно возить машину по трём адресам.
why:
  eyebrow: Почему к нам
  heading: Автосервис без сюрприза в счёте
  body: Главная проблема с сервисами — не цена, а непредсказуемость. Мы её убираем.
  points:
    - title: Смета до работ
      text: Сначала диагностика и письменная смета, потом ваше «да», и только потом ключи в работу.
    - title: Старые детали возвращаем
      text: Всё, что сняли с машины, отдаём в коробке. Хотите — проверяйте, действительно ли деталь была изношена.
    - title: Не навязываем
      text: Если можно доехать до следующего ТО — скажем об этом, а не продадим замену сегодня.
    - title: Пишем в карту
      text: Что меняли, какой пробег, какие запчасти. На следующем визите не начинаем с нуля.
process:
  eyebrow: Как работаем
  heading: Четыре шага без нервов
  body: Никаких «оставьте машину, потом позвоним». Вы знаете, что происходит, на каждом этапе.
  steps:
    - title: Заявка и запись
      text: Описываете проблему по телефону или в мессенджере. Подбираем время, чтобы машина не стояла в очереди.
    - title: Диагностика
      text: Находим причину, а не симптом. Показываем на машине, что именно не так.
    - title: Смета и согласование
      text: Присылаем список работ и запчастей с ценами. Работы начинаются только после вашего подтверждения.
    - title: Работа и выдача
      text: Делаем, проверяем на ходу, отдаём машину со старыми деталями и записью в сервисной карте.
shopTeaser:
  eyebrow: Запчасти
  heading: Аккумуляторы в наличии, с установкой за 20 минут
  body: Подбираем по марке, модели и году — не по «примерно такой же». Ставим на месте, старый забираем на утилизацию.
  cta: Подобрать аккумулятор
accident:
  eyebrow: После ДТП
  heading: Кузовной ремонт и покраска
  body: Восстанавливаем геометрию, правим и красим с подбором цвета по коду и по факту выгорания. Работаем со страховыми — помогаем собрать документы.
  points:
    - Стапель и замер геометрии кузова
    - Подбор краски по коду и компьютерным спектром
    - Полировка перехода, чтобы не было видно границы
    - Помощь с документами для страховой
  cta: Оценить ремонт
faq:
  - q: Сколько стоит диагностика?
    a: Первичный осмотр и считывание ошибок — бесплатно. Платной становится только углублённая диагностика, когда нужно разбирать узел или ставить машину на стенд; о цене предупреждаем заранее.
  - q: Можно приехать со своими запчастями?
    a: Можно. В этом случае гарантия распространяется только на нашу работу, а не на деталь — это честно и работает в обе стороны.
  - q: Вы работаете со страховыми компаниями?
    a: Да, по кузовному ремонту. Поможем оформить документы и согласовать смету, а если страховая покрывает не всё — сразу скажем, сколько останется на вас.
  - q: Как быстро можно попасть на ТО?
    a: Обычно в течение двух-трёх рабочих дней, а на замену масла или аккумулятора часто удаётся взять в тот же день. Позвоните — скажем точно.
  - q: Даёте ли вы гарантию?
    a: 'Двенадцать месяцев на выполненные работы и на установленные нами запчасти. Гарантийный случай разбираем без споров: если это наша ошибка, переделываем бесплатно.'
  - q: Машина на иностранных номерах — это проблема?
    a: Нет. Для ремонта документы о регистрации не нужны, приезжайте как есть.
finalCta:
  eyebrow: Записаться
  heading: Расскажите, что с машиной
  body: Перезвоним в рабочее время, уточним детали и подберём время. Если вопрос срочный — просто позвоните.
  cta: Оставить заявку
translations:
  sr:
    meta:
      title: 'CarLab — autoservis u Beogradu: dijagnostika, popravka, limarija'
      description: 'Autoservis u Beogradu: kompjuterska dijagnostika, redovno održavanje i zamena ulja, popravka šasije i kočnica, motor i menjač, limarski radovi nakon udesa.'
    hero:
      heading: Prvo cena, pa popravka
      lead: Provera grešaka besplatno, pisana procena pre početka radova, garancija 12 meseci. Kažemo šta treba uraditi odmah, a šta može da sačeka.
      ctaPrimary: Zakaži servis
      ctaSecondary: Pogledaj usluge
      badges:
        - Procena pre radova
        - Garancija 12 meseci
        - Radimo sa osiguranjima
    trust:
      - value: 12 mes
        label: garancija na radove i delove
      - value: 1 dan
        label: uobičajeni rok za redovno održavanje
      - value: besplatno
        label: cena prvobitne provere
    servicesHead:
      eyebrow: Usluge
      heading: Šta radimo
      body: Od zamene ulja do obnavljanja geometrije karoserije nakon udarca. Sve na jednom mestu — ne morate da vozite auto na tri adrese.
    why:
      eyebrow: Zašto kod nas
      heading: Autoservis bez iznenađenja na računu
      body: Glavni problem sa servisima nije cena, već nepredvidivost. Mi je uklanjamo.
      points:
        - title: Procena pre radova
          text: Prvo dijagnostika i pisana procena, zatim vaše „da“, i tek onda ključevi u rad.
        - title: Stare delove vraćamo
          text: Sve što je skinuto sa autom, vraćamo u kutiji. Želite — proverite, da li je deo zaista bio istrošen.
        - title: Ne namećemo
          text: Ako je moguće doći do sledećeg održavanja — reći ćemo vam, a ne prodati zamenu danas.
        - title: Pomažemo sa kartom
          text: Šta smo menjali, koji je pređeni put, koji delovi. Pri sledećoj poseti ne počinjemo ispočetka.
    process:
      eyebrow: Kako radimo
      heading: Četiri koraka bez nerviranja
      body: Nema „ostavite auto, javićemo se kasnije“. Znate šta se dešava na svakom koraku.
      steps:
        - title: Zahtev i zakazivanje
          text: Opisujete problem telefonom ili putem poruka. Usaglašavamo vreme, da auto ne čeka u redovima.
        - title: Dijagnostika
          text: Pronalažemo uzrok, a ne simptom. Pokazujemo na autu šta nije u redu.
        - title: Procena i odobrenje
          text: Šaljemo spisak radova i delova sa cenama. Radovi počinju tek nakon vašeg odobrenja.
        - title: Rad i predaja
          text: Radimo, proveravamo u vožnji, predajemo auto sa starim delovima i beleškom u servisnoj kartici.
    shopTeaser:
      eyebrow: Delovi
      heading: Akumulatori na stanju, sa ugradnjom za 20 minuta
      body: Biramo po marki, modelu i godini — ne po „približno sličnom“. Ugrađujemo na licu mesta, stari uzimamo na reciklažu.
      cta: Izaberi akumulator
    accident:
      eyebrow: Nakon udesa
      heading: Limarski radovi i farbanje
      body: Obnavljamo geometriju, ravnamo i farbamo uz odabir boje po kodu i po činjenici izbleđivanja. Radimo sa osiguranjima — pomažemo u prikupljanju dokumenata.
      points:
        - Stanica i merenje geometrije karoserije
        - Odabir boje po kodu i kompjuterskim spektrima
        - Poliranje prelaza, da se granice ne vide
        - Pomoć sa dokumentima za osiguranje
      cta: Procena popravke
    faq:
      - q: Koliko košta dijagnostika?
        a: Prvobitna provera i čitanje grešaka — besplatno. Plaćena postaje samo dublja dijagnostika, kada treba rastaviti sklop ili staviti auto na test; o ceni obaveštavamo unapred.
      - q: Mogu li doći sa svojim delovima?
        a: Možete. U tom slučaju garancija se odnosi samo na našu uslugu, a ne na deo — to je pošteno i važi za obe strane.
      - q: Radite li sa osiguravajućim kompanijama?
        a: Da, za limarske popravke. Pomažemo u izradi dokumenata i usaglašavanju procene, a ako osiguranje ne pokriva sve — odmah ćemo reći koliko ostaje na vama.
      - q: Koliko brzo mogu doći na održavanje?
        a: Obično u roku od dva do tri radna dana, a za zamenu ulja ili akumulatora često možete doći istog dana. Pozovite — reći ćemo tačno.
      - q: Da li dajete garanciju?
        a: 'Dvanaest meseci na izvršene radove i na delove koje smo mi ugradili. Garancijski slučaj rešavamo bez rasprava: ako je to naša greška, radimo besplatno.'
      - q: Auto na stranim registarskim tablicama — da li je to problem?
        a: Ne. Za popravku dokumenti o registraciji nisu potrebni, dođite kako jeste.
    finalCta:
      eyebrow: Zakaži
      heading: Recite nam šta nije u redu sa automobilom
      body: Javićemo se u radno vreme, razjasnićemo detalje i usaglasiti vreme. Ako je pitanje hitno — jednostavno pozovite.
      cta: Ostavi zahtev
  en:
    meta:
      title: 'CarLab — car service in Belgrade: diagnostics, repairs, bodywork'
      description: 'Car service in Belgrade: computer diagnostics, scheduled maintenance, brake and suspension repairs, engine and gearbox work, accident repair.'
    hero:
      heading: Price first, then repairs
      lead: Error reading is free, written estimate before work starts, 12-month guarantee. We tell you what needs immediate attention and what can wait.
      ctaPrimary: Book a service appointment
      ctaSecondary: View services
      badges:
        - Estimate before work begins
        - 12-month guarantee
        - We work with insurance companies
    trust:
      - value: 12 months
        label: guarantee on work and parts
      - value: 1 day
        label: typical scheduled maintenance duration
      - value: free of charge
        label: initial inspection cost
    servicesHead:
      eyebrow: Services
      heading: What we do
      body: From oil changes to restoring body geometry after an impact. Everything in one place—no need to drive around to three different addresses.
    why:
      eyebrow: Why choose us
      heading: A service without invoice surprises
      body: The main issue with car services isn't the price, but unpredictability. We eliminate that.
      points:
        - title: Estimate before work
          text: First diagnostics and a written estimate, then your 'yes', and only then do we start working.
        - title: We return old parts
          text: Everything removed from your vehicle will be returned in a box. Feel free to check if the part was truly worn out.
        - title: No pressure to replace
          text: If you can wait until the next scheduled maintenance, we'll let you know instead of pushing a replacement today.
        - title: We keep records
          text: What was changed, how many kilometers, what parts were used. We don't start from scratch on your next visit.
    process:
      eyebrow: Our process
      heading: Four steps without hassle
      body: No 'drop off your car and we'll call you later'. You’ll know what’s happening at every stage.
      steps:
        - title: Request and appointment
          text: Describe your problem over the phone or via messenger. We’ll schedule a time to avoid waiting.
        - title: Diagnostics
          text: We find the cause, not just the symptoms. We show you on the car what the issue is.
        - title: Estimate and approval
          text: We send a list of work and parts with prices. Work begins only after your confirmation.
        - title: Completion and delivery
          text: We perform the work, check it on the go, and return the car with old parts and an update in the service record.
    shopTeaser:
      eyebrow: Parts
      heading: Akumulator available, installed in 20 minutes
      body: We match by brand, model, and year—not just ‘a similar one’. We install on the spot and take the old one for recycling.
      cta: Find an akumulator
    accident:
      eyebrow: After an accident
      heading: Body repairs and painting
      body: We restore geometry, straighten, and paint matching the color code and actual fading. We work with insurers and help with documentation.
      points:
        - Alignment and measurement of body geometry
        - Color matching by code and computerized spectrometry
        - Polishing transitions to make borders invisible
        - Assistance with insurance paperwork
      cta: Estimate repair costs
    faq:
      - q: How much is diagnostics?
        a: The initial inspection and error reading are free. Only in-depth diagnostics requiring disassembly or on a stand incurs a charge; we inform you of the price beforehand.
      - q: Can I bring my own parts?
        a: Yes, you can. In this case, our guarantee applies only to our work, not to the part—this is fair and works both ways.
      - q: Do you work with insurance companies?
        a: Yes, for body repairs. We will help you complete the paperwork and agree on the estimate, and if the insurance doesn't cover everything, we will immediately inform you of the remaining balance.
      - q: How quickly can I get scheduled maintenance?
        a: Typically within two to three business days, and for oil or akumulator replacement, it’s often possible to do it the same day. Call us and we’ll confirm.
      - q: Do you offer a guarantee?
        a: "Twelve months on work performed and parts we installed. Warranty cases are handled without disputes: if it's our fault, we redo it for free."
      - q: Is having a foreign license plate a problem?
        a: No. For repairs, registration documents are not needed, just come as you are.
    finalCta:
      eyebrow: Book now
      heading: Tell us what's wrong with your car
      body: We'll call you back during business hours to clarify details and schedule a time. If it’s urgent, just call us.
      cta: Submit a request
