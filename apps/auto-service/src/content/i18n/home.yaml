meta:
  title: 'CarLab | автосервис в Белграде: диагностика, ремонт, кузов'
  description: 'Автосервис в Белграде: компьютерная диагностика, плановое ТО и замена масла, ремонт подвески и тормозов, двигатель и коробка, кузовной ремонт после ДТП.'
hero:
  heading: Автосервис и запчасти в Белграде
  ctaPrimary: Записаться на ремонт
  ctaSecondary: Посмотреть услуги
  partsHeading: Подберем запчасть по VIN
  partsSubmit: Подобрать
  partsHint: Назовем цену и срок.
  partsInquiry: Отправить запрос менеджеру
  badges:
    - Смета до начала работ
    - Плановое ТО обычно за день
    - Работаем со страховыми
servicesHead:
  eyebrow: Услуги
  heading: Чем поможем
  body: Сколько занимает каждая работа. Смету составляем после осмотра, до начала работ.
problemPrompt:
  heading: Не знаете, что сломалось?
  body: Опишите симптомы, подскажем, с чего начать.
  cta: Описать проблему
worksHeading: Что сломалось и как починили
process:
  eyebrow: Как работаем
  heading: Без сюрпризов в счете
  body: Вы знаете, что происходит с машиной, на каждом этапе.
  steps:
    - title: Звонок или сообщение
      text: Расскажите, что с машиной, договоримся о времени.
    - title: Осмотр и диагностика
      text: Находим причину, а не симптом, и показываем ее на машине.
    - title: Смета до работ
      text: Присылаем список работ и запчастей с ценами. Начинаем только после вашего «да».
    - title: Работа и выдача
      text: Проверяем на ходу, отдаем старые детали и запись в сервисной карте.
  promises:
    - Не меняем то, чему еще рано
    - Старые детали отдаем в коробке
accident:
  eyebrow: После ДТП
  heading: Кузовной ремонт и покраска
  body: Правим геометрию и красим с подбором цвета. Работаем со страховыми и помогаем собрать документы.
  points:
    - Стапель и замер геометрии кузова
    - Подбор краски по коду и спектрофотометром
    - Помощь с документами для страховой
  cta: Прислать фото повреждений
  more: Подробнее о кузовном ремонте
faqEyebrow: Вопросы
faq:
  - q: Сколько стоит диагностика?
    a: Первичный осмотр и считывание ошибок бесплатны. Платной становится только углубленная диагностика, когда нужно разбирать узел или ставить машину на стенд; о цене предупреждаем заранее.
  - q: Можно приехать со своими запчастями?
    a: Можно. В этом случае мы отвечаем только за свою работу, а не за деталь. Это честно и работает в обе стороны.
  - q: Вы работаете со страховыми компаниями?
    a: Да, по кузовному ремонту. Поможем оформить документы и согласовать смету, а если страховая покрывает не все, сразу скажем, сколько останется на вас.
  # TODO: owner to confirm the usual booking lead time before this answer names one.
  - q: Как быстро можно попасть на ТО?
    a: Позвоните или напишите, и мы скажем ближайшее свободное время.
  - q: Машина на иностранных номерах, это проблема?
    a: Нет. Для ремонта документы о регистрации не нужны, приезжайте как есть.
  - q: На каком языке с вами говорить?
    a: По-сербски, по-русски или по-английски, как вам удобнее.
finalCta:
  eyebrow: Записаться
  heading: Расскажите, что с машиной
  body: Перезвоним в рабочее время и договоримся о визите.
  cta: Оставить заявку
translations:
  sr:
    meta:
      title: 'CarLab | auto servis u Beogradu: dijagnostika, popravka, limarija'
      description: 'Auto servis u Beogradu: kompjuterska dijagnostika, redovan servis i zamena ulja, popravka trapa i kočnica, motora i menjača, limarija posle udesa.'
    hero:
      heading: Auto servis i auto delovi u Beogradu
      ctaPrimary: Zakažite popravku
      ctaSecondary: Pogledajte usluge
      partsHeading: Pronaći ćemo deo po broju šasije
      partsSubmit: Pronađite deo
      partsHint: Reći ćemo Vam cenu i rok.
      partsInquiry: Pošaljite upit saradniku
      badges:
        - Predračun pre početka radova
        - Redovan servis obično za jedan dan
        - Saradnja sa osiguranjima
    servicesHead:
      eyebrow: Usluge
      heading: Kako možemo da Vam pomognemo
      body: Vreme potrebno za svaki posao. Predračun pravimo nakon pregleda, pre početka radova.
    problemPrompt:
      heading: Ne znate šta se pokvarilo?
      body: Opišite simptome, pa ćemo Vam reći odakle da počnete.
      cta: Opišite problem
    worksHeading: Šta se pokvarilo i kako smo popravili
    process:
      eyebrow: Kako radimo
      heading: Bez iznenađenja na računu
      body: U svakom trenutku znate šta se dešava sa Vašim automobilom.
      steps:
        - title: Poziv ili poruka
          text: Recite nam šta se dešava sa automobilom i dogovorićemo termin.
        - title: Pregled i dijagnostika
          text: Pronalazimo uzrok, a ne samo simptom, i pokazujemo Vam problem na automobilu.
        - title: Predračun pre radova
          text: Šaljemo Vam spisak radova i delova sa cenama. Počinjemo tek kada odobrite.
        - title: Popravka i preuzimanje
          text: Proveravamo automobil u vožnji, vraćamo Vam stare delove i unosimo radove u servisnu knjižicu.
      promises:
        - Ne menjamo delove dok za to ne dođe vreme
        - Stare delove vraćamo u kutiji
    accident:
      eyebrow: Posle udesa
      heading: Limarija i farbanje
      body: Ispravljamo karoseriju i farbamo uz precizno usklađivanje boje. Sarađujemo sa osiguranjima i pomažemo Vam da prikupite dokumentaciju.
      points:
        - Ispravljanje karoserije i provera geometrije
        - Usklađivanje boje prema kodu i merenju
        - Pomoć oko dokumentacije za osiguranje
      cta: Pošaljite fotografije oštećenja
      more: Više o limariji i farbanju
    faqEyebrow: Česta pitanja
    faq:
      - q: Koliko košta dijagnostika?
        a: Osnovni pregled i očitavanje grešaka su besplatni. Plaća se samo detaljna dijagnostika, kada treba rastaviti sklop ili postaviti automobil na proveru. O ceni Vas unapred obaveštavamo.
      - q: Mogu li da dođem sa svojim auto delovima?
        a: Možete. U tom slučaju odgovaramo samo za svoj rad, ne i za deo. To je pošteno i važi za obe strane.
      - q: Da li sarađujete sa osiguravajućim kućama?
        a: Da, za limariju i farbanje. Pomažemo Vam da pripremite dokumentaciju i usaglasite predračun. Ako osiguranje ne pokriva sve troškove, odmah ćemo Vam reći koliko ćete doplatiti.
      - q: Koliko brzo mogu da zakažem servis?
        a: Pozovite nas ili pošaljite poruku i reći ćemo Vam koji je prvi slobodan termin.
      - q: Da li je problem ako automobil ima strane registarske tablice?
        a: Nije. Za popravku nisu potrebni dokumenti o registraciji, dođite kako jeste.
      - q: Na kom jeziku mogu da razgovaram sa Vama?
        a: Na srpskom, ruskom ili engleskom, kako Vam više odgovara.
    finalCta:
      eyebrow: Zakažite termin
      heading: Recite nam šta se dešava sa automobilom
      body: Pozvaćemo Vas tokom radnog vremena i dogovoriti dolazak.
      cta: Pošaljite upit
  en:
    meta:
      title: CarLab | Belgrade car service and body shop
      description: 'Car service in Belgrade: diagnostics, routine servicing and oil changes, suspension and brake repairs, engine and gearbox work, and accident repairs.'
    hero:
      heading: Car service and parts in Belgrade
      ctaPrimary: Book a repair
      ctaSecondary: View services
      partsHeading: Find a part by VIN
      partsSubmit: Find a part
      partsHint: We'll confirm the price and availability.
      partsInquiry: Send a request to our team
      badges:
        - Quote before work starts
        - Routine servicing usually takes a day
        - We work with insurers
    servicesHead:
      eyebrow: Services
      heading: How we can help
      body: See how long each job takes. We provide a quote after inspection, before work starts.
    problemPrompt:
      heading: Not sure what's wrong?
      body: Tell us what's happening and we'll suggest where to start.
      cta: Describe the problem
    worksHeading: What went wrong and how we fixed it
    process:
      eyebrow: How it works
      heading: No surprises on your bill
      body: You'll know what's happening with your car at every step.
      steps:
        - title: Call or message us
          text: Tell us what's going on with your car and we'll arrange a time.
        - title: Inspection and diagnostics
          text: We find the cause, not just the symptom, and show you what's wrong on the car.
        - title: Quote before work starts
          text: We send you a list of the work and parts, with prices. We only get started once you approve it.
        - title: Repair and collection
          text: We road-test the car, return the old parts and update your service record.
      promises:
        - We don't replace parts before they're due
        - We return old parts in a box
    accident:
      eyebrow: Accident repairs
      heading: Bodywork and respraying
      body: We straighten bodywork and match the paint to your car. We work with insurers and can help with the paperwork.
      points:
        - Chassis straightening and body alignment checks
        - Paint matching by colour code and spectrophotometer
        - Help with insurance paperwork
      cta: Send photos of the damage
      more: More about bodywork repairs
    faqEyebrow: FAQs
    faq:
      - q: How much do diagnostics cost?
        a: The initial inspection and fault-code scan are free. We only charge for in-depth diagnostics if we need to dismantle a component or put the car on a test bench. We'll let you know the cost in advance.
      - q: Can I bring my own parts?
        a: Yes. In that case, we guarantee our work, but not the parts. That's fair to both sides.
      - q: Do you work with insurance companies?
        a: Yes, for bodywork repairs. We'll help with the paperwork and agree on the quote. If your insurance doesn't cover everything, we'll tell you upfront what you'll need to pay.
      - q: How soon can I book routine servicing?
        a: Call or message us and we'll let you know our next available appointment.
      - q: My car has foreign plates. Is that a problem?
        a: No. You don't need registration documents for repairs, so just bring the car as it is.
      - q: What languages can I speak with you in?
        a: Serbian, Russian or English, whichever works best for you.
    finalCta:
      eyebrow: Book a visit
      heading: Tell us what's going on with your car
      body: We'll call you back during business hours and arrange a visit.
      cta: Send an enquiry
