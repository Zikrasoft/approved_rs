diagnostics:
  name: Компьютерная диагностика
  short: Находим, что стоит за кодом ошибки.
  metaTitle: Компьютерная диагностика автомобиля в Белграде — CarLab
  metaDescription: Диагностика двигателя, подвески и электрики в Белграде. Считывание ошибок бесплатно, причину показываем прямо на машине.
  heroEyebrow: Диагностика
  heroTitle: Код ошибки — это симптом, а не диагноз
  heroLead: Сканер скажет, какой датчик ругается. Виноват сам датчик или то, что он измеряет, сканер не покажет — это выясняется уже на машине.
  priceFrom: считывание ошибок — бесплатно
  duration: от 40 минут
  warranty: 12 месяцев на устранение
  bodyHeading: Что мы делаем на диагностике
  body: |
    Сначала разговор: когда началось, при каких условиях, что менялось до этого. Часть диагнозов ставится уже здесь: «стучит только на холодную» и «стучит постоянно» — это разные узлы.

    Потом сканер по всем блокам сразу: часто ошибка в ABS или в блоке комфорта объясняет то, на что жалуется водитель. Дальше — проверка на машине: подъёмник, люфты, осмотр под нагрузкой, при необходимости замер давления и осциллограф.

    В конце показываем причину на автомобиле и объясняем на пальцах. Если нужен ремонт, сразу считаем смету.

    Сколько это стоит: считывание ошибок — бесплатно. Платной диагностика становится только тогда, когда нужно разбирать узел или ставить машину на стенд, и цену мы называем до начала работ, а не в конце.
  includesHeading: Что входит
  includes:
    - Опрос по симптомам и истории обслуживания
    - Считывание ошибок по всем электронным блокам
    - Осмотр на подъёмнике, проверка люфтов и утечек
    - Тест-драйв с инженером, если проблема проявляется в движении
    - Устное заключение и письменная смета на ремонт
  signsHeading: Когда пора к нам
  signs:
    - Горит «чек» или другой значок на панели
    - Машина дёргается, троит или плохо заводится
    - Расход вырос без понятной причины
    - Появился новый звук, и вы не понимаете откуда
  honestHeading: Что мы не обещаем
  honest: Не каждая неисправность ловится за сорок минут. Плавающие проблемы, которые появляются раз в неделю, иногда требуют повторного визита или оставить машину на день — мы скажем об этом сразу и не станем менять детали по очереди за ваш счёт.
servicing:
  name: Плановое ТО
  short: Масло, фильтры, жидкости и осмотр — по регламенту вашего двигателя.
  metaTitle: Плановое ТО и замена масла в Белграде — CarLab
  metaDescription: 'Техническое обслуживание автомобиля в Белграде: масло, фильтры, свечи, тормозная жидкость, антифриз. По регламенту производителя, с записью в сервисную карту.'
  heroEyebrow: Обслуживание
  heroTitle: Самая дешёвая починка — та, которой не случилось
  heroLead: У каждого мотора свой интервал и свой допуск по маслу. Мы смотрим мануал на вашу машину и делаем то, что написано там, а не среднее «раз в десять тысяч».
  priceFrom: от 90 €
  duration: 2–4 часа
  warranty: 12 месяцев
  bodyHeading: Откуда берётся интервал для вашей машины
  body: |
    Интервалы замены у разных моторов отличаются в разы, а условия Белграда — пробки, пыль, лето под сорок — почти всегда попадают под «тяжёлые условия эксплуатации» с укороченным интервалом. По ним и считаем, что реально нужно вашей машине на этом пробеге.

    Заодно проверяем то, что обычно вспоминают слишком поздно: состояние ремня или цепи, тормозную жидкость на влагу, антифриз на температуру замерзания, износ колодок и дисков в миллиметрах.
  includesHeading: Что входит
  includes:
    - Масло и масляный фильтр с допуском вашего производителя
    - Воздушный и салонный фильтр, свечи по регламенту
    - Проверка тормозной жидкости на содержание влаги
    - Проверка антифриза и его температуры замерзания
    - Замер остатка колодок и дисков в миллиметрах
    - Запись всех работ и пробега в сервисную карту
  signsHeading: Когда пора к нам
  signs:
    - Подошёл пробег или год с прошлого ТО
    - Машина только куплена, а истории обслуживания нет
    - Впереди дальняя дорога
    - Загорелась лампа сервисного интервала
  honestHeading: Что мы не делаем
  honest: Не меняем то, чему ещё рано. Если фильтр отработал половину ресурса, мы его не тронем и скажем, когда приезжать.
brakes-suspension:
  name: Тормоза и подвеска
  short: Всё, что отвечает за то, остановится машина или нет.
  metaTitle: Ремонт тормозов и подвески в Белграде — CarLab
  metaDescription: 'Тормоза и подвеска в Белграде: колодки, диски, суппорты, рычаги, развал-схождение. Замеры в миллиметрах, смета до работ, гарантия 12 месяцев.'
  heroEyebrow: Ходовая
  heroTitle: Здесь ресурс считают в миллиметрах
  heroLead: 'Мотор можно дотянуть до сервиса. Тормоза — нет. Поэтому по ходовой мы не округляем и не тянем: если ресурс кончился, говорим прямо.'
  priceFrom: от 120 €
  duration: от 3 часов
  warranty: 12 месяцев
  bodyHeading: Как мы это делаем
  body: |
    Начинаем с замеров: толщина дисков и колодок в миллиметрах, биение, состояние шлангов и суппортов. По подвеске — проверка люфтов на подъёмнике и на вибростенде, осмотр пыльников и опор.

    После ремонта ходовой всегда делаем развал-схождение: даже замена одного рычага меняет геометрию, а неправильная геометрия съедает комплект резины за сезон.
  includesHeading: Что входит
  includes:
    - Замер дисков и колодок с записью результата
    - Замена колодок, дисков, шлангов, ремонт или замена суппортов
    - Прокачка и замена тормозной жидкости
    - Стойки, пружины, рычаги, сайлентблоки, опоры и подшипники
    - Развал-схождение после любого вмешательства в подвеску
    - Контрольный тест-драйв перед выдачей
  signsHeading: Когда пора к нам
  signs:
    - Скрип, писк или скрежет при торможении
    - Педаль стала мягкой или проваливается
    - Машину уводит в сторону при торможении
    - Стуки на неровностях, «плавающий» руль, неравномерный износ резины
  honestHeading: О чём предупредим
  honest: Колодки и диски — расходник, который ходит парой. Ставить новые колодки на изношенные диски можно, но ресурс колодок при этом падает, и через полгода вы приедете снова. Мы посчитаем оба варианта и оставим выбор вам.
engine-gearbox:
  name: Двигатель и коробка
  short: От замены прокладки до ремонта с разбором — с понятной сметой.
  metaTitle: Ремонт двигателя и коробки передач в Белграде — CarLab
  metaDescription: 'Ремонт двигателя и трансмиссии в Белграде: ГРМ, прокладки, сцепление, замена масла в АКПП. Диагностика до разбора, смета до работ, гарантия 12 месяцев.'
  heroEyebrow: Силовой агрегат
  heroTitle: «Капиталка» нужна не так часто, как её называют
  heroLead: 'Прежде чем что-то разбирать, мы проверяем то, что проверяется снаружи: компрессию, давление масла, ошибки, утечки.'
  priceFrom: по результатам диагностики
  duration: от 1 дня
  warranty: 12 месяцев
  bodyHeading: Порядок работы
  body: |
    Сначала измеряем: компрессия по цилиндрам, давление масла, состояние свечей, ошибки по блокам, утечки под давлением. Только после этого решаем, нужно ли вскрывать мотор.

    По коробкам смотрим состояние масла и логику переключений — у автоматов большая часть «поломок» лечится корректным обслуживанием, а не заменой агрегата. Если ремонт всё же нужен, вы получаете смету с разбивкой на работу и запчасти до того, как что-то снято.
  includesHeading: Что входит
  includes:
    - Замер компрессии и давления масла
    - Проверка на утечки под давлением, поиск подсоса воздуха
    - Замена ремня или цепи ГРМ, роликов и помпы
    - Прокладки, сальники, маслосъёмные колпачки
    - Сцепление, маховик, замена масла в механике и автомате
    - Смета с разбивкой до начала разбора
  signsHeading: Когда пора к нам
  signs:
    - Масло уходит между заменами
    - Стук, вибрация или потеря тяги
    - Рывки и задержки при переключении передач
    - Дым из выхлопа, которого раньше не было
  honestHeading: Когда мы отговариваем
  honest: Если стоимость ремонта подходит к стоимости машины, мы это скажем. Иногда правильный совет — продать как есть или искать контрактный агрегат, а не вкладывать в ремонт сумму, которую машина никогда не вернёт.
bodywork-painting:
  name: Кузов и покраска
  short: Восстановление после ДТП, правка геометрии и покраска с подбором цвета.
  metaTitle: Кузовной ремонт и покраска после ДТП в Белграде — CarLab
  metaDescription: 'Кузовной ремонт в Белграде: стапель, замер геометрии, рихтовка, покраска с компьютерным подбором цвета. Работаем со страховыми, помогаем с документами.'
  heroEyebrow: После ДТП
  heroTitle: Чтобы машина не выглядела «после удара»
  heroLead: Хороший кузовной ремонт не видно ни глазом, ни толщиномером на осмотре перед продажей.
  priceFrom: по результатам осмотра
  duration: от 3 дней
  warranty: 12 месяцев на покрытие
  bodyHeading: Что входит в восстановление
  body: |
    Сначала замеряем геометрию кузова: после удара смещения бывают там, где визуально всё цело, и именно они потом дают неравномерный износ резины и увод машины. При необходимости ставим на стапель и вытягиваем по контрольным точкам.

    Цвет подбираем дважды — по коду из документов и спектрофотометром по факту, потому что за пять лет на солнце заводской цвет уходит от паспортного. Переход полируем так, чтобы граница не читалась ни на солнце, ни под лампой.
  includesHeading: Что входит
  includes:
    - Замер геометрии кузова по контрольным точкам
    - Стапель и вытяжка при смещениях
    - Рихтовка, замена повреждённых элементов
    - Подбор цвета по коду и спектрофотометром
    - Покраска в камере с контролем температуры
    - Полировка перехода и сборка с проверкой зазоров
  signsHeading: Когда пора к нам
  signs:
    - Было ДТП, даже если повреждения выглядят мелкими
    - Неравномерные зазоры между деталями кузова
    - Машину уводит, резина изнашивается «в один край»
    - Нужно привести кузов в порядок перед продажей
  honestHeading: О страховых
  honest: Мы работаем со страховыми и помогаем с документами, но не обещаем, что страховая покроет всё. После осмотра мы сразу показываем, что попадает в страховой случай, а что нет, чтобы вы не узнали об этом в конце.
pre-purchase-inspection:
  name: Проверка перед покупкой
  short: Толщиномер, подъёмник и сканер до того, как вы отдали деньги.
  metaTitle: Проверка автомобиля перед покупкой в Белграде — CarLab
  metaDescription: 'Техническая проверка перед покупкой в Белграде: толщиномер, подъёмник, диагностика ошибок, компрессия. Письменное заключение и торг в вашу пользу.'
  heroEyebrow: Перед сделкой
  heroTitle: Что покажет толщиномер, продавец не расскажет
  heroLead: Перекрашенные панели, следы сварки, скрученный пробег, утечки снизу — за час на подъёмнике это видно, хотя в объявлении об этом не пишут.
  priceFrom: от 60 €
  duration: около 1 часа
  warranty: письменное заключение
  bodyHeading: Что мы проверяем
  body: |
    Кузов — толщиномером по всем панелям: перекрашенные элементы, шпаклёвка, следы сварки, состояние зазоров. Дальше подъёмник: подвеска, утечки, состояние выхлопа и защиты, следы ударов снизу.

    Электроника — считывание ошибок по всем блокам, включая скрученные и стёртые. По мотору — компрессия и утечки. В конце вы получаете письменное заключение со списком найденного и оценкой стоимости устранения, с которым можно торговаться.
  includesHeading: Что входит
  includes:
    - Замер толщины лака по всем панелям кузова
    - Осмотр на подъёмнике, проверка на утечки и следы ударов
    - Считывание ошибок по всем электронным блокам
    - Замер компрессии по цилиндрам
    - Проверка на признаки скрученного пробега
    - Письменное заключение с оценкой стоимости устранения
  signsHeading: Когда это нужно
  signs:
    - Покупаете машину с рук
    - Продавец торопит с решением
    - Машина привезена из-за границы, история неизвестна
    - Цена подозрительно ниже рынка
  honestHeading: Чего проверка не даёт
  honest: Мы честно скажем, что видим, но проверка не заменяет гарантию. Скрытый дефект, который не проявляется ни на подъёмнике, ни на диагностике, может всплыть позже — это ограничение метода, а не оговорка мелким шрифтом.
translations:
  sr:
    indexMetaTitle: 'Usluge autoservisa u Beogradu: popravka i TO — CarLab'
    indexMetaDescription: Dijagnostika, TO i zamena ulja, kočnice i suspenzija, motor i menjač, popravka karoserije nakon udesa, pregled pre kupovine. Cene, rokovi, garancija.
    indexEyebrow: Usluge
    indexHeading: Sve što treba vašem vozilu na jednom mestu
    indexLead: Za svaku uslugu imamo posebnu stranicu — šta je uključeno, koliko traje, po kojim simptomima treba da dođete i kada ćemo iskreno reći da to ne treba raditi.
    specsPriceLabel: Cena
    specsDurationLabel: Rok
    specsWarrantyLabel: Garancija
    diagnostics:
      name: Kompjuterska dijagnostika
      short: Otkrivamo šta se krije iza koda greške.
      metaTitle: Kompjuterska dijagnostika automobila u Beogradu — CarLab
      metaDescription: Dijagnostika motora, suspenzije i elektronike u Beogradu. Čitanje grešaka besplatno, uz objašnjenje direktno na vozilu.
      heroEyebrow: Dijagnostika
      heroTitle: Kod greške je simptom, a ne dijagnoza
      heroLead: Skener će pokazati koji senzor ima problem. Da li je u pitanju sam senzor ili ono što on meri, skener ne može da pokaže — to se otkriva na vozilu.
      priceFrom: čitanje grešaka — besplatno
      duration: od 40 minuta
      warranty: 12 meseci na otklanjanje
      bodyHeading: Šta radimo na dijagnostici
      body: |-
        Prvo razgovaramo: kada je počelo, pod kojim uslovima, šta je menjano do sada. Deo dijagnostike se postavlja već ovde: "čuje se samo kada je hladno" i "stuka se stalno" — to su različiti sklopovi.

        Zatim, skener proverava sve module odjednom: često greška u ABS-u ili modulu udobnosti objašnjava na šta se vozač žali. Nakon toga — provera na vozilu: dizalica, lufti, pregled pod opterećenjem, po potrebi merenje pritiska i oscilograf.
      includesHeading: Šta je uključeno
      includes:
        - Upit o simptomima i istoriji servisa
        - Čitanje grešaka kroz sve elektronske module
        - Pregled na dizalici, provera lufti i curenja
        - Test-vožnja sa inženjerom, ako se problem manifestuje u vožnji
        - Usmeno objašnjenje i pisana procena troškova popravke
      signsHeading: Kada treba doći kod nas
      signs:
        - Gori 'check' ili neka druga lampica na panelu
        - Automobil se trese, ima trovanje ili loše se pokreće
        - Potrošnja se povećala bez razumne potrebe
        - Pojavio se novi zvuk, a ne znate odakle dolazi
      honestHeading: Šta ne obećavamo
      honest: Nije svaka kvar može da se uhvati za četrdeset minuta. Plutajući problemi, koji se javljaju jednom nedeljno, ponekad zahtevaju ponovni poset ili ostavljanje vozila na dan — reći ćemo vam to odmah i nećemo menjati delove redom o vašem trošku.
    servicing:
      name: Planirano TO
      short: Ulje, filteri, tečnosti i pregled — prema propisima vašeg motora.
      metaTitle: Planirano TO i zamena ulja u Beogradu — CarLab
      metaDescription: 'Tehničko održavanje automobila u Beogradu: ulje, filteri, sveće, kočionu tečnost, antifriz. Prema propisima proizvođača, sa zapisom u servisnu knjigu.'
      heroEyebrow: Održavanje
      heroTitle: Najjeftinija popravka je ona koja se nije desila
      heroLead: Svaki motor ima svoj interval i svoj toleranciju za ulje. Mi gledamo priručnik za vaš automobil i radimo ono što je tamo napisano, a ne prosek 'svakih deset hiljada'.
      priceFrom: od 90 €
      duration: 2–4 sata
      warranty: 12 meseci
      bodyHeading: Kako dolazimo do intervala za vaš automobil
      body: |-
        Intervali zamene se razlikuju kod različitih motora, a uslovi Beograda — saobraćajne gužve, prašina, letnje temperature do četrdeset — gotovo uvek spadaju pod 'teške uslove korišćenja' sa skraćenim intervalima. Na osnovu njih procenjujemo šta zaista vašem automobilu treba na tom pređenom putu.

        Dodatno proveravamo ono čega se obično setimo prekasno: stanje remena ili lanca, kočionu tečnost na vlagu, antifriz na temperaturu smrzavanja, trošenje pločica i diskova u milimetrima.
      includesHeading: Šta je uključeno
      includes:
        - Ulje i uljni filter sa tolerancijom vašeg proizvođača
        - Zračni i kabinski filter, sveće prema propisima
        - Provera kočione tečnosti na sadržaj vlage
        - Provera antifriza i temperature smrzavanja
        - Merenje ostatka pločica i diskova u milimetrima
        - Zapis svih radova i pređenih kilometara u servisnu knjigu
      signsHeading: Kada treba doći kod nas
      signs:
        - Prošla kilometraža ili godina od poslednjeg TO
        - Automobil je tek kupljen, a istorija servisa ne postoji
        - Ispred je duži put
        - Zasvetlela je lampica servisnog intervala
      honestHeading: Šta ne radimo
      honest: Ne menjamo ono što još nije vreme. Ako je filter odradio polovinu svog kapaciteta, nećemo ga dirati i reći ćemo kada da dođete.
    brakes-suspension:
      name: Kočnice i suspenzija
      short: Sve što je odgovorno za to da li će se auto zaustaviti ili ne.
      metaTitle: Popravka kočnica i suspenzije u Beogradu — CarLab
      metaDescription: 'Kočnice i suspenzija u Beogradu: pločice, diskovi, kočione čeljusti, poluge, podešavanje geometrije. Merenja u milimetrima, procena pre radova, garancija 12 meseci.'
      heroEyebrow: Hodna
      heroTitle: Ovde se resurs meri u milimetrima
      heroLead: 'Motor možete da dokrajčite do servisa. Kočnice — ne možete. Zato kod hodne ne zaokružujemo i ne produžavamo: ako je resurs istekao, govorimo otvoreno.'
      priceFrom: od 120 €
      duration: od 3 sata
      warranty: 12 meseci
      bodyHeading: Kako to radimo
      body: |-
        Počinjemo sa merenjima: debljina diskova i pločica u milimetrima, devijacije, stanje creva i kočionih čeljusti. Za suspenziju — provera lufti na dizalici i vibracionom stolu, pregled gumenih zaptivki i oslonaca.

        Nakon popravke suspenzije uvek radimo podešavanje geometrije: čak i zamena jedne poluge menja geometriju, a pogrešna geometrija troši set guma za sezonu.
      includesHeading: Šta je uključeno
      includes:
        - Merenje diskova i pločica sa zapisom rezultata
        - Zamena pločica, diskova, creva, popravka ili zamena kočionih čeljusti
        - Pumpe i zamena kočione tečnosti
        - Oslonci, opruge, poluge, gumene zaptivke i ležajevi
        - Podešavanje geometrije nakon bilo kakvih intervencija u suspenziji
        - Kontrolna test-vožnja pre izdavanja
      signsHeading: Kada treba doći kod nas
      signs:
        - Škripa, pištanje ili grebanje prilikom kočenja
        - Pedala se oseća meko ili se sruši
        - Automobil skreće na stranu prilikom kočenja
        - Udari na neravnom terenu, 'plutajući' volan, neujednačeno trošenje guma
      honestHeading: O čemu ćemo vas upozoriti
      honest: Pločice i diskovi su potrošni delovi koji se menjaju u paru. Postavljanje novih pločica na istrošene diskove je moguće, ali resurs pločica pri tome opada, i za pola godine ćete ponovo doći. Računaćemo obe opcije i ostaviti izbor vama.
    engine-gearbox:
      name: Motor i menjač
      short: Od zamene brtve do popravke sa rastavljanjem — sa jasnom procenom.
      metaTitle: Popravka motora i menjača u Beogradu — CarLab
      metaDescription: 'Popravka motora i transmisije u Beogradu: GRM, brtve, kvačilo, zamena ulja u automatskom menjaču. Dijagnostika pre rastavljanja, procena pre radova, garancija 12 meseci.'
      heroEyebrow: Pogonska grupa
      heroTitle: '"Kapitalka" nije potrebna tako često kao što se zove'
      heroLead: 'Pre nego što nešto rastavimo, proveravamo ono što se može proveriti spolja: kompresiju, pritisak ulja, greške, curenja.'
      priceFrom: na osnovu dijagnostike
      duration: od 1 dana
      warranty: 12 meseci
      bodyHeading: Redosled rada
      body: |-
        Prvo mjerimo: kompresija po cilindrima, pritisak ulja, stanje sveća, greške po blokovima, curenja pod pritiskom. Tek nakon toga odlučujemo da li je potrebno otvoriti motor.

        Kod menjača gledamo stanje ulja i logiku prebacivanja — kod automatskih menjača veliki deo 'kvarova' se leči ispravnim održavanjem, a ne zamenom celog sklop. Ako je popravka ipak potrebna, dobijate procenu sa razdvajanjem na rad i delove pre nego što se nešto skine.
      includesHeading: Šta je uključeno
      includes:
        - Merenje kompresije i pritiska ulja
        - Provera na curenja pod pritiskom, traženje uvlačenja vazduha
        - Zamena remena ili lanca GRM, roličastih i pumpe
        - Brtve, zaptivači, uljne kapice
        - Kvačilo, zamašnjak, zamena ulja u mehaničkom i automatskom menjaču
        - Procena sa razdvajanjem pre početka rastavljanja
      signsHeading: Kada treba doći kod nas
      signs:
        - Ulje se smanjuje između zamena
        - Udari, vibracije ili gubitak snage
        - Cuca i zastoje prilikom prebacivanja brzina
        - Dim iz izduvne cevi koji pre nije bio prisutan
      honestHeading: Kada vas odvratimo
      honest: Ako cena popravke dostiže cenu automobila, reći ćemo to. Ponekad je pravi savet prodati ga kakav jeste ili tražiti ugovoreni agregat, a ne investirati u popravku iznos koji automobil nikada neće vratiti.
    bodywork-painting:
      name: Karoserija i lakiranje
      short: Obnavljanje nakon udesa, podešavanje geometrije i lakiranje uz izbor boje.
      metaTitle: Karoserijska popravka i lakiranje nakon udesa u Beogradu — CarLab
      metaDescription: 'Karoserijska popravka u Beogradu: stega, merenje geometrije, ispravljanje, lakiranje uz kompjuterski izbor boje. Radimo sa osiguranjima, pomažemo oko dokumenata.'
      heroEyebrow: Nakon udesa
      heroTitle: Da automobil ne izgleda 'posle udarca'
      heroLead: Dobra karoserijska popravka nije vidljiva ni okom, ni debljinometrom na pregledu pre prodaje.
      priceFrom: na osnovu pregleda
      duration: od 3 dana
      warranty: 12 meseci na premaz
      bodyHeading: Šta je uključeno u obnovu
      body: |-
        Prvo merimo geometriju karoserije: nakon udarca pomeranja se dešavaju tamo gde vizuelno sve deluje netaknuto, a upravo ona kasnije uzrokuje neujednačeno trošenje guma i skretanje automobila. Po potrebi stavljamo na stegu i ispravljamo prema kontrolnim tačkama.

        Boju biramo dvaput — po kodu iz dokumenata i spektrofotometrom u praksi, jer nakon pet godina na suncu fabrička boja bledi od pasoškog. Prelaz poliramo tako da se granica ne vidi ni na suncu, ni pod lampom.
      includesHeading: Šta je uključeno
      includes:
        - Merenje geometrije karoserije prema kontrolnim tačkama
        - Stega i ispravljanje pri pomeranjima
        - Ispravljanje, zamena oštećenih elemenata
        - Izbor boje po kodu i spektrofotometrom
        - Lakiranje u komori uz kontrolu temperature
        - Poliranje prelaza i sastavljanje uz proveru razmaka
      signsHeading: Kada treba doći kod nas
      signs:
        - Imao je udes, čak i ako su oštećenja mala
        - Neujednačeni razmaci između delova karoserije
        - Automobil skreće, guma se troši 'na jednu stranu'
        - Potrebno je srediti karoseriju pre prodaje
      honestHeading: O osiguranjima
      honest: Radimo sa osiguranjima i pomažemo oko dokumenata, ali ne obećavamo da će osiguranje pokriti sve. Nakon pregleda odmah pokazujemo šta ulazi u osigurani slučaj, a šta ne, da ne biste saznali toga na kraju.
    pre-purchase-inspection:
      name: Provera pre kupovine
      short: Tachometar, dizalica i skener pre nego što predate novac.
      metaTitle: Provera automobila pre kupovine u Beogradu — CarLab
      metaDescription: 'Tehnička provera pre kupovine u Beogradu: tachometar, dizalica, dijagnostika grešaka, kompresija. Pismeno izveštaj i pregovaranje u vašu korist.'
      heroEyebrow: Pre transakcije
      heroTitle: Šta pokazuje tachometar, prodavac ne govori
      heroLead: Preslikane panele, tragovi zavarivanja, skraćena kilometraža, curenje sa dna — za sat vremena na dizalici to je vidljivo, iako o tome u oglasu ne pišu.
      priceFrom: od 60 €
      duration: oko 1 sat
      warranty: pismeno izveštaj
      bodyHeading: Šta proveravamo
      body: |
        Karoserija — tachometrom po svim panelima: preslikani delovi, kit, tragovi zavarivanja, stanje razmaka. Zatim dizalica: suspenzija, curenja, stanje izduvnog sistema i zaštite, tragovi udaraca s dna.

        Elektronika — čitanje grešaka po svim blokovima, uključujući skraćene i obrisane. Po motoru — kompresija i curenja. Na kraju dobijate pismeno izveštaj sa spiskom pronađenog i procenom troškova otklanjanja, sa kojim možete pregovarati.
      includesHeading: Šta uključuje
      includes:
        - Merenje debljine laka po svim panelima karoserije
        - Pregled na dizalici, provera na curenja i tragove udaraca
        - Čitanje grešaka po svim elektronskim blokovima
        - Merenje kompresije po cilindrima
        - Provera na znakove skraćene kilometraže
        - Pismeno izveštaj sa procenom troškova otklanjanja
      signsHeading: Kada je ovo potrebno
      signs:
        - Kupujete auto s ruku
        - Prodavac vas žuri sa odlukom
        - Auto je donet iz inostranstva, istorija nepoznata
        - Cena sumnjivo niža od tržišne
      honestHeading: Šta provera ne daje
      honest: Iskreno ćemo reći šta vidimo, ali provera ne zamenjuje garanciju. Skriveni defekt koji se ne manifestuje ni na dizalici ni na dijagnostici može isplivati kasnije — to je ograničenje metode, a ne odricanje sitnim slovima.
  en:
    indexMetaTitle: 'Car Service in Belgrade: Repair and Maintenance — CarLab'
    indexMetaDescription: Diagnostics, maintenance, brake and suspension work, engine and gearbox, accident repair, pre-purchase inspection. Prices, timeline, warranty.
    indexEyebrow: Services
    indexHeading: Everything your car needs in one service
    indexLead: Each service has its own page — what it includes, how long it takes, signs you need to come to us, and when we honestly say that you don't need to do anything.
    specsPriceLabel: Price
    specsDurationLabel: Duration
    specsWarrantyLabel: Warranty
    diagnostics:
      name: Computer Diagnostics
      short: We find out what's behind the error code.
      metaTitle: Car Diagnostics in Belgrade — CarLab
      metaDescription: Engine, suspension, and electrical diagnostics in Belgrade. Error reading is free, and we show you the cause directly on the car.
      heroEyebrow: Diagnostics
      heroTitle: An error code is a symptom, not a diagnosis
      heroLead: The scanner will indicate which sensor is malfunctioning. Whether the sensor itself or what it measures is to blame won't show up — that is clarified on the car.
      priceFrom: error reading — free
      duration: from 40 minutes
      warranty: 12 months for repairs
      bodyHeading: What we do during diagnostics
      body: |-
        First, we converse: when it started, under what conditions, what has changed before. Some diagnoses can already be made here: "clattering only when cold" and "clattering all the time" — these are different components.

        Then we scan all the blocks at once: often, an error in the ABS or comfort module explains what the driver is complaining about. Next, we check the vehicle: lift, play, inspection under load, pressure measurement and oscillograph if necessary.

        At the end, we show the cause on the vehicle and explain it clearly. If repair is needed, we immediately estimate the costs.

        Cost: error reading — free. Paid diagnostics start only when disassembly is required or the car needs to be put on a stand, and we provide the price before starting the work, not after.
      includesHeading: What’s included
      includes:
        - Symptom and service history questionnaire
        - Error reading across all electronic blocks
        - Inspection on the lift, checking for play and leaks
        - Test drive with an engineer if the issue manifests while driving
        - Oral conclusion and written repair estimate
      signsHeading: When to come to us
      signs:
        - The check engine light or other warning light is on
        - The car jerks, misfires, or has trouble starting
        - Fuel consumption has increased without apparent reason
        - A new sound has appeared and you don’t understand where it’s coming from
      honestHeading: What we don't promise
      honest: Not every malfunction can be detected in forty minutes. Sporadic problems that occur once a week sometimes require a repeat visit or leaving the car for a day — we will inform you about this immediately and won't replace parts one after another at your expense.
    servicing:
      name: Scheduled Maintenance
      short: Oil, filters, fluids, and inspection — according to your engine's regulations.
      metaTitle: Scheduled Maintenance and Oil Change in Belgrade — CarLab
      metaDescription: 'Car maintenance in Belgrade: oil, filters, spark plugs, brake fluid, antifreeze. According to the manufacturer’s guidelines, with a record in the service book.'
      heroEyebrow: Maintenance
      heroTitle: The cheapest repair is the one that never happened
      heroLead: Each engine has its own interval and oil allowance. We check the manual for your car and do what it says, not the average "every ten thousand miles."
      priceFrom: from 90 €
      duration: 2–4 hours
      warranty: 12 months
      bodyHeading: Where the interval for your car comes from
      body: |-
        Replacement intervals vary greatly among engines, and conditions in Belgrade — traffic jams, dust, summers nearing forty degrees — almost always fall under "severe operating conditions" with shortened intervals. We assess what your car realistically needs at this mileage.

        We also check what is usually remembered too late: the condition of the timing belt or chain, brake fluid for moisture, antifreeze for freezing temperature, wear of pads and discs in millimeters.
      includesHeading: What’s included
      includes:
        - Oil and oil filter according to your manufacturer’s specification
        - Air and cabin filters, spark plugs as per regulations
        - Brake fluid moisture content check
        - Antifreeze check and freezing temperature measurement
        - Measurement of pad and disc thickness in millimeters
        - Recording all work and mileage in the service book
      signsHeading: When to come to us
      signs:
        - Mileage or year has approached since the last maintenance
        - Car was just purchased, and there is no service history
        - A long trip is ahead
        - The service interval light has come on
      honestHeading: What we don’t do
      honest: We don't replace what doesn’t need changing yet. If the filter has half its lifespan left, we won’t touch it and will tell you when to come back.
    brakes-suspension:
      name: Brakes and Suspension
      short: Everything that determines whether the car can stop or not.
      metaTitle: Brake and Suspension Repair in Belgrade — CarLab
      metaDescription: 'Brakes and suspension in Belgrade: pads, discs, calipers, arms, alignment. Measurements in millimeters, estimate before work, 12-month warranty.'
      heroEyebrow: Chassis
      heroTitle: Here we measure in millimeters
      heroLead: 'The engine can be delayed until service. The brakes cannot. Therefore, we do not round about the suspension: if the resource is depleted, we say so directly.'
      priceFrom: from 120 €
      duration: from 3 hours
      warranty: 12 months
      bodyHeading: How we do it
      body: |-
        We start with measurements: thickness of discs and pads in millimeters, runout, condition of hoses and calipers. For the suspension — checking play on the lift and on the vibration stand, inspecting dust boots and mounts.

        After repairs, we always perform wheel alignment: even replacing one arm changes geometry, and incorrect geometry can wear out a set of tires in one season.
      includesHeading: What’s included
      includes:
        - Measurement of discs and pads with recorded results
        - Replacement of pads, discs, hoses, repair or replacement of calipers
        - Bleeding and replacing brake fluid
        - Struts, springs, arms, bushings, mounts, and bearings
        - Wheel alignment after any intervention in the suspension
        - Control test drive before handing over
      signsHeading: When to come to us
      signs:
        - Squeaking, whining, or grinding when braking
        - The pedal feels soft or goes all the way down
        - The car pulls to the side when braking
        - Clunking on uneven surfaces, 'floating' steering, uneven tire wear
      honestHeading: What we will warn you about
      honest: Brake pads and discs are consumables that wear as a pair. It’s possible to install new pads on worn discs, but the lifespan of the pads decreases, and in six months you will return. We will calculate both options and leave the choice to you.
    engine-gearbox:
      name: Engine and Gearbox
      short: From gasket replacement to complete rebuilds — with a clear estimate.
      metaTitle: Engine and Transmission Repair in Belgrade — CarLab
      metaDescription: 'Engine and transmission repair in Belgrade: timing belt, gaskets, clutch, ATF change. Diagnostics before disassembly, estimate before work, 12-month warranty.'
      heroEyebrow: Powertrain
      heroTitle: Full rebuilds are needed less often than they are mentioned
      heroLead: 'Before disassembling anything, we check what can be assessed externally: compression, oil pressure, error codes, leaks.'
      priceFrom: based on diagnostic results
      duration: from 1 day
      warranty: 12 months
      bodyHeading: Work Process
      body: |-
        First, we measure: compression by cylinder, oil pressure, condition of spark plugs, error codes by block, pressure leak tests. Only after that do we decide whether the engine needs to be opened.

        For gearboxes, we check the oil condition and the logic of shifting — most 'breakdowns' in automatics can be treated with proper maintenance rather than replacing the unit. If repair is needed, you receive a detailed estimate of labor and parts before anything is removed.
      includesHeading: What’s included
      includes:
        - Compression and oil pressure measurements
        - Pressure leak tests, searching for air intake leaks
        - Timing belt or chain replacement, rollers, and pump
        - Gaskets, seals, valve seals
        - Clutch, flywheel, oil change in manuals and automatics
        - Estimate with breakdown before disassembly
      signsHeading: When to come to us
      signs:
        - Oil is being consumed between changes
        - Knocking, vibrations, or loss of power
        - Jerks and delays during gear shifting
        - Smoke from the exhaust that wasn’t present before
      honestHeading: When we advise against
      honest: If the repair cost approaches the value of the car, we will inform you. Sometimes the right advice is to sell it as is or seek a replacement unit instead of pouring money into repairs that the car will never return.
    bodywork-painting:
      name: Body and Painting
      short: Restoration after an accident, body geometry correction, and painting with color matching.
      metaTitle: Body Repair and Painting After an Accident in Belgrade — CarLab
      metaDescription: 'Body repair in Belgrade: frame straightening, geometry measurements, bodywork, painting with computer color matching. We work with insurance companies and help with paperwork.'
      heroEyebrow: After an Accident
      heroTitle: To make sure the car doesn’t look ‘after a hit’
      heroLead: Good body repair should be invisible to the eye and a thickness gauge during a pre-sale inspection.
      priceFrom: based on inspection results
      duration: from 3 days
      warranty: 12 months on paint
      bodyHeading: What’s included in the restoration
      body: |-
        First, we measure the geometry of the body: after a hit, misalignments can occur where everything visually appears intact, and these can lead to uneven tire wear and vehicle pulling. If necessary, we set it on the frame machine and pull it according to reference points.

        We match the color twice — by code from documents and using a spectrophotometer to ensure it matches because after five years in the sun, the factory color deviates from the specifications. We polish the transition so that the boundary is invisible both in sunlight and under light.
      includesHeading: What’s included
      includes:
        - Body geometry measurements according to reference points
        - Frame straightening and pulling for misalignments
        - Bodywork, replacement of damaged parts
        - Color matching by code and spectrophotometer
        - Painting in a booth with controlled temperature
        - Polishing the transition and reassembly with gap checking
      signsHeading: When to come to us
      signs:
        - There has been an accident, even if the damage looks minor
        - Uneven gaps between body parts
        - The car pulls to one side, tires wear unevenly
        - The body needs to be restored before selling
      honestHeading: About insurance
      honest: We work with insurance companies and assist with paperwork but do not promise that insurance will cover everything. After inspection, we immediately show what qualifies for a claim and what does not, so you won’t find out about it at the end.
    pre-purchase-inspection:
      name: Pre-Purchase Inspection
      short: Thickness gauge, lift, and scanner before you hand over the cash.
      metaTitle: Pre-Purchase Car Inspection in Belgrade — CarLab
      metaDescription: 'Technical inspection before purchase in Belgrade: thickness gauge, lift, error diagnostics, compression. Written report and negotiating leverage.'
      heroEyebrow: Before the deal
      heroTitle: What the thickness gauge reveals that the seller won't disclose
      heroLead: Repainted panels, signs of welding, odometer tampering, leaks underneath — all visible within an hour on the lift, though it's not mentioned in the ad.
      priceFrom: from 60 €
      duration: about 1 hour
      warranty: written report
      bodyHeading: What We Check
      body: |-
        Body — using a thickness gauge on all panels: repainted areas, filler, signs of welding, gap condition. Next, the lift: suspension, leaks, exhaust and protection condition, signs of impacts from below.

        Electronics — reading errors from all units, including tampered and erased ones. For the engine — compression and leaks. In the end, you receive a written report listing findings and estimated repair costs, which you can use for negotiation.
      includesHeading: What’s Included
      includes:
        - Thickness measurement of paint on all body panels
        - Inspection on the lift, checking for leaks and signs of impacts
        - Error reading from all electronic units
        - Compression measurement across cylinders
        - Check for signs of odometer tampering
        - Written report with estimated repair costs
      signsHeading: When It’s Necessary
      signs:
        - Buying a used car
        - Seller is rushing your decision
        - Car is imported, history is unknown
        - Price is suspiciously lower than market value
      honestHeading: What the Inspection Doesn’t Provide
      honest: We will honestly state what we see, but the inspection does not replace a warranty. A hidden defect that does not show up on the lift or diagnostics may surface later — this is a limitation of the method, not a disclaimer in fine print.
