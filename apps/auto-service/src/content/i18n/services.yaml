diagnostics:
  name: Компьютерная диагностика
  short: Находим, что стоит за кодом ошибки.
  metaTitle: Компьютерная диагностика автомобиля в Белграде | CarLab
  metaDescription: Диагностика двигателя, подвески и электрики в Белграде. Считывание ошибок бесплатно, причину показываем прямо на машине.
  heroEyebrow: Диагностика
  heroTitle: Код ошибки это симптом, а не диагноз
  heroLead: Сканер скажет, какой датчик ругается. Виноват сам датчик или то, что он измеряет, сканер не покажет, это выясняется уже на машине.
  priceFrom: считывание ошибок бесплатно
  duration: от 40 минут
  bodyHeading: Что мы делаем на диагностике
  body: |
    Сначала разговор: когда началось, при каких условиях, что менялось до этого. Часть диагнозов ставится уже здесь: «стучит только на холодную» и «стучит постоянно» это разные узлы.

    Потом сканер по всем блокам сразу: часто ошибка в ABS или в блоке комфорта объясняет то, на что жалуется водитель. Дальше проверка на машине: подъемник, люфты, осмотр под нагрузкой, при необходимости замер давления и осциллограф.

    В конце показываем причину на автомобиле и объясняем на пальцах. Если нужен ремонт, сразу считаем смету.

    Сколько это стоит: считывание ошибок бесплатно. Платной диагностика становится только тогда, когда нужно разбирать узел или ставить машину на стенд, и цену мы называем до начала работ, а не в конце.
  includesHeading: Что входит
  includes:
    - Опрос по симптомам и истории обслуживания
    - Считывание ошибок по всем электронным блокам
    - Осмотр на подъемнике, проверка люфтов и утечек
    - Тест-драйв с инженером, если проблема проявляется в движении
    - Устное заключение и письменная смета на ремонт
  signsHeading: Когда пора к нам
  signs:
    - Горит «чек» или другой значок на панели
    - Машина дергается, троит или плохо заводится
    - Расход вырос без понятной причины
    - Появился новый звук, и вы не понимаете откуда
  honestHeading: Что мы не обещаем
  honest: Не каждая неисправность ловится за сорок минут. Плавающие проблемы, которые появляются раз в неделю, иногда требуют повторного визита или оставить машину на день. Мы скажем об этом сразу и не станем менять детали по очереди за ваш счет.
servicing:
  name: Плановое ТО
  short: Масло, фильтры, жидкости и осмотр по регламенту вашего двигателя.
  metaTitle: Плановое ТО и замена масла в Белграде | CarLab
  metaDescription: 'Техническое обслуживание автомобиля в Белграде: масло, фильтры, свечи, тормозная жидкость, антифриз. По регламенту производителя, с записью в сервисную карту.'
  heroEyebrow: Обслуживание
  heroTitle: Самая дешевая починка та, которой не случилось
  heroLead: У каждого мотора свой интервал и свой допуск по маслу. Мы смотрим мануал на вашу машину и делаем то, что написано там, а не среднее «раз в десять тысяч».
  priceFrom: от 90 €
  duration: 2–4 часа
  bodyHeading: Откуда берется интервал для вашей машины
  body: |
    Интервалы замены у разных моторов отличаются в разы, а условия Белграда (пробки, пыль, лето под сорок) почти всегда попадают под «тяжелые условия эксплуатации» с укороченным интервалом. По ним и считаем, что реально нужно вашей машине на этом пробеге.

    Заодно проверяем то, что обычно вспоминают слишком поздно: состояние ремня или цепи, тормозную жидкость на влагу, антифриз на температуру замерзания, износ колодок и дисков в миллиметрах.
  includesHeading: Что входит
  includes:
    - Масло и масляный фильтр с допуском вашего производителя
    - Воздушный и салонный фильтр, свечи по регламенту
    - Проверка тормозной жидкости на содержание влаги
    - Проверка антифриза и его температуры замерзания
    - Замер остатка колодок и дисков в миллиметрах
    - Запись всех работ и пробега в сервисную карту
  signsHeading: Когда пора к нам
  signs:
    - Подошел пробег или год с прошлого ТО
    - Машина только куплена, а истории обслуживания нет
    - Впереди дальняя дорога
    - Загорелась лампа сервисного интервала
  honestHeading: Что мы не делаем
  honest: Не меняем то, чему еще рано. Если фильтр отработал половину ресурса, мы его не тронем и скажем, когда приезжать.
brakes-suspension:
  name: Тормоза и подвеска
  short: Все, что отвечает за то, остановится машина или нет.
  metaTitle: Ремонт тормозов и подвески в Белграде | CarLab
  metaDescription: 'Тормоза и подвеска в Белграде: колодки, диски, суппорты, рычаги, развал-схождение. Замеры в миллиметрах, смета до работ.'
  heroEyebrow: Ходовая
  heroTitle: Здесь ресурс считают в миллиметрах
  heroLead: 'Мотор можно дотянуть до сервиса. Тормоза нельзя. Поэтому по ходовой мы не округляем и не тянем: если ресурс кончился, говорим прямо.'
  priceFrom: от 120 €
  duration: от 3 часов
  bodyHeading: Как мы это делаем
  body: |
    Начинаем с замеров: толщина дисков и колодок в миллиметрах, биение, состояние шлангов и суппортов. По подвеске проверяем люфты на подъемнике и на вибростенде, осматриваем пыльники и опоры.

    После ремонта ходовой всегда делаем развал-схождение: даже замена одного рычага меняет геометрию, а неправильная геометрия съедает комплект резины за сезон.
  includesHeading: Что входит
  includes:
    - Замер дисков и колодок с записью результата
    - Замена колодок, дисков, шлангов, ремонт или замена суппортов
    - Прокачка и замена тормозной жидкости
    - Стойки, пружины, рычаги, сайлентблоки, опоры и подшипники
    - Развал-схождение после любого вмешательства в подвеску
    - Контрольный тест-драйв перед выдачей
  signsHeading: Когда пора к нам
  signs:
    - Скрип, писк или скрежет при торможении
    - Педаль стала мягкой или проваливается
    - Машину уводит в сторону при торможении
    - Стуки на неровностях, «плавающий» руль, неравномерный износ резины
  honestHeading: О чем предупредим
  honest: Колодки и диски это расходник, который ходит парой. Ставить новые колодки на изношенные диски можно, но ресурс колодок при этом падает, и через полгода вы приедете снова. Мы посчитаем оба варианта и оставим выбор вам.
engine-gearbox:
  name: Двигатель и коробка
  short: От замены прокладки до ремонта с разбором, с понятной сметой.
  metaTitle: Ремонт двигателя и коробки передач в Белграде | CarLab
  metaDescription: 'Ремонт двигателя и трансмиссии в Белграде: ГРМ, прокладки, сцепление, замена масла в АКПП. Диагностика до разбора, смета до работ.'
  heroEyebrow: Силовой агрегат
  heroTitle: «Капиталка» нужна не так часто, как ее называют
  heroLead: 'Прежде чем что-то разбирать, мы проверяем то, что проверяется снаружи: компрессию, давление масла, ошибки, утечки.'
  priceFrom: по результатам диагностики
  duration: от 1 дня
  bodyHeading: Порядок работы
  body: |
    Сначала измеряем: компрессия по цилиндрам, давление масла, состояние свечей, ошибки по блокам, утечки под давлением. Только после этого решаем, нужно ли вскрывать мотор.

    По коробкам смотрим состояние масла и логику переключений: у автоматов большая часть «поломок» лечится корректным обслуживанием, а не заменой агрегата. Если ремонт все же нужен, вы получаете смету с разбивкой на работу и запчасти до того, как что-то снято.
  includesHeading: Что входит
  includes:
    - Замер компрессии и давления масла
    - Проверка на утечки под давлением, поиск подсоса воздуха
    - Замена ремня или цепи ГРМ, роликов и помпы
    - Прокладки, сальники, маслосъемные колпачки
    - Сцепление, маховик, замена масла в механике и автомате
    - Смета с разбивкой до начала разбора
  signsHeading: Когда пора к нам
  signs:
    - Масло уходит между заменами
    - Стук, вибрация или потеря тяги
    - Рывки и задержки при переключении передач
    - Дым из выхлопа, которого раньше не было
  honestHeading: Когда мы отговариваем
  honest: Если стоимость ремонта подходит к стоимости машины, мы это скажем. Иногда правильный совет продать как есть или искать контрактный агрегат, а не вкладывать в ремонт сумму, которую машина никогда не вернет.
bodywork-painting:
  name: Кузов и покраска
  short: Восстановление после ДТП, правка геометрии и покраска с подбором цвета.
  metaTitle: Кузовной ремонт и покраска после ДТП в Белграде | CarLab
  metaDescription: 'Кузовной ремонт в Белграде: стапель, замер геометрии, рихтовка, покраска с компьютерным подбором цвета. Работаем со страховыми, помогаем с документами.'
  heroEyebrow: После ДТП
  heroTitle: Чтобы машина не выглядела «после удара»
  heroLead: Хороший кузовной ремонт не видно ни глазом, ни толщиномером на осмотре перед продажей.
  priceFrom: по результатам осмотра
  duration: от 3 дней
  bodyHeading: Что входит в восстановление
  body: |
    Сначала замеряем геометрию кузова: после удара смещения бывают там, где визуально все цело, и именно они потом дают неравномерный износ резины и увод машины. При необходимости ставим на стапель и вытягиваем по контрольным точкам.

    Цвет подбираем дважды: по коду из документов и спектрофотометром по факту, потому что за пять лет на солнце заводской цвет уходит от паспортного. Переход полируем так, чтобы граница не читалась ни на солнце, ни под лампой.
  includesHeading: Что входит
  includes:
    - Замер геометрии кузова по контрольным точкам
    - Стапель и вытяжка при смещениях
    - Рихтовка, замена поврежденных элементов
    - Подбор цвета по коду и спектрофотометром
    - Покраска в камере с контролем температуры
    - Полировка перехода и сборка с проверкой зазоров
  signsHeading: Когда пора к нам
  signs:
    - Было ДТП, даже если повреждения выглядят мелкими
    - Неравномерные зазоры между деталями кузова
    - Машину уводит, резина изнашивается «в один край»
    - Нужно привести кузов в порядок перед продажей
  honestHeading: О страховых
  honest: Мы работаем со страховыми и помогаем с документами, но не обещаем, что страховая покроет все. После осмотра мы сразу показываем, что попадает в страховой случай, а что нет, чтобы вы не узнали об этом в конце.
pre-purchase-inspection:
  name: Проверка перед покупкой
  short: Толщиномер, подъемник и сканер до того, как вы отдали деньги.
  metaTitle: Проверка автомобиля перед покупкой в Белграде | CarLab
  metaDescription: 'Техническая проверка перед покупкой в Белграде: толщиномер, подъемник, диагностика ошибок, компрессия. Письменное заключение и торг в вашу пользу.'
  heroEyebrow: Перед сделкой
  heroTitle: Что покажет толщиномер, продавец не расскажет
  heroLead: Перекрашенные панели, следы сварки, скрученный пробег, утечки снизу. За час на подъемнике это видно, хотя в объявлении об этом не пишут.
  priceFrom: от 60 €
  duration: около 1 часа
  bodyHeading: Что мы проверяем
  body: |
    Кузов проверяем толщиномером по всем панелям: перекрашенные элементы, шпаклевка, следы сварки, состояние зазоров. Дальше подъемник: подвеска, утечки, состояние выхлопа и защиты, следы ударов снизу.

    Электроника: считывание ошибок по всем блокам, включая скрученные и стертые. По мотору компрессия и утечки. В конце вы получаете письменное заключение со списком найденного и оценкой стоимости устранения, с которым можно торговаться.
  includesHeading: Что входит
  includes:
    - Замер толщины лака по всем панелям кузова
    - Осмотр на подъемнике, проверка на утечки и следы ударов
    - Считывание ошибок по всем электронным блокам
    - Замер компрессии по цилиндрам
    - Проверка на признаки скрученного пробега
    - Письменное заключение с оценкой стоимости устранения
  signsHeading: Когда это нужно
  signs:
    - Покупаете машину с рук
    - Продавец торопит с решением
    - Машина привезена из-за границы, история неизвестна
    - Цена подозрительно ниже рынка
  honestHeading: Чего проверка не дает
  honest: Мы честно скажем, что видим, но ни один осмотр не ловит все. Скрытый дефект, который не проявляется ни на подъемнике, ни на диагностике, может всплыть позже. Это ограничение метода, а не оговорка мелким шрифтом.
vin-parts-inquiry:
  name: Подбор запчастей
  short: Находим запчасти, которые подходят вашей машине, и называем цену до покупки.
  metaTitle: Подбор автозапчастей по VIN в Белграде - CarLab
  metaDescription: 'Подбор запчастей по VIN или номеру шасси в Белграде: оригинал и проверенные аналоги, проверка совместимости, цена до покупки. Самовывоз с СТО CarLab.'
  heroEyebrow: Запчасти
  heroTitle: Подберем запчасти, которые точно подойдут вашей машине
  heroLead: Пришлите VIN или номер шасси и напишите, что нужно. Мы проверим совместимость, найдем оригинал и проверенные аналоги и предложим лучшие варианты.
  priceFrom: называем после подбора
  duration: зависит от наличия у поставщика
  bodyHeading: Как мы подбираем запчасти
  body: |
    По VIN мы определяем точную комплектацию машины: двигатель, коробку, год и рынок, для которого она собрана. От этого зависит, какая деталь подойдет, даже если модель та же.

    Дальше ищем номер детали у производителя и проверенные аналоги, сравниваем цены и сроки у поставщиков и предлагаем вам несколько вариантов. Вы выбираете, мы заказываем, а забрать запчасти можно на нашем СТО в Белграде.

    Если нужна и установка, ее можно сделать у нас же: запчасть проверена на совместимость, и мастер знает, что ставит.
  includesHeading: Что входит
  includes:
    - Проверка совместимости по VIN или номеру шасси
    - Поиск оригинального номера детали
    - Подбор проверенных аналогов с разной ценой
    - Цена и срок до того, как вы что-то оплатили
    - Самовывоз с СТО в Белграде
  signsHeading: Когда это нужно
  signs:
    - Не знаете точное название или номер детали
    - Боитесь купить запчасть, которая не подойдет
    - Нужной детали нет в каталоге на сайте
    - Хотите сравнить оригинал и аналоги по цене
  honestHeading: Что мы не обещаем
  honest: Не каждую деталь можно найти сразу и дешево. Если запчасть редкая или идет под заказ, мы честно скажем срок и цену до покупки, а если подходящего аналога нет, не станем предлагать то, что не подойдет.
translations:
  sr:
    indexMetaTitle: 'Usluge auto servisa u Beogradu: popravka i TO | CarLab'
    indexMetaDescription: Dijagnostika, TO i zamena ulja, kočnice i suspenzija, motor i menjač, karoserska popravka posle udesa, pregled pre kupovine, izbor delova po VIN-u. Cene i rokovi.
    indexEyebrow: Usluge
    indexHeading: Sve što vašem automobilu treba, na jednom mestu
    indexLead: 'Svaka usluga ima svoju stranicu: šta uključuje, koliko traje, prema kojim znakovima je vreme da nas pozovete i kada iskreno kažemo da to ne treba raditi.'
    specsPriceLabel: Cena
    specsDurationLabel: Rok
    diagnostics:
      name: Kompjuterska dijagnostika
      short: Otkrivamo šta stoji iza koda greške.
      metaTitle: Kompjuterska dijagnostika automobila u Beogradu | CarLab
      metaDescription: Dijagnostika motora, ovjesa i elektrike u Beogradu. Čitanje grešaka besplatno, uz objašnjenje direktno na automobilu.
      heroEyebrow: Dijagnostika
      heroTitle: Kod greške je simptom, a ne dijagnoza
      heroLead: Skener će reći koji senzor daje grešku. Da li je kriv sam senzor ili ono što meri, skener to neće pokazati, to se utvrđuje na automobilu.
      priceFrom: čitanje grešaka besplatno
      duration: od 40 minuta
      bodyHeading: Šta radimo na dijagnostici
      body: |-
        Prvo razgovaramo: kada je počelo, pod kojim okolnostima, šta je menjano pre ovoga. Deo dijagnostike se postavlja već ovde: „dretulji samo na hladnom“ i „dretulji stalno“ su različiti sklopovi.

        Zatim skener preko svih blokova odjednom: često greška u ABS-u ili u bloku komfora objašnjava ono na što se vozač žali. Sledeća proba na automobilu: dizalica, praznine, pregled pod opterećenjem, po potrebi merenje pritiska i oscilograf. 

        Na kraju pokazujemo uzrok na automobilu i objašnjavamo jednostavno. Ako je potrebna popravka, odmah pravimo procenu. 

        Koliko to košta: čitanje grešaka je besplatno. Plaćena dijagnostika postaje samo kada je potrebno rastaviti sklop ili postaviti automobil na stend, a cenu mi saopštavamo pre početka radova, a ne na kraju.
      includesHeading: Šta ulazi
      includes:
        - Anketa o simptomima i istoriji servisiranja
        - Čitanje grešaka kroz sve elektronske module
        - Pregled na dizalici, provere praznina i curenja
        - Test-vožnja sa inženjerom, ako se problem manifestuje tokom vožnje
        - Usmeno zaključivanje i pisana procena za popravku
      signsHeading: Kada je vreme da nam se obratite
      signs:
        - Gori ‘češt’ ili neki drugi znak na panelu
        - Automobil se trzaju, radi na tri cilindra ili se loše pali
        - Potrošnja se povećala bez razumne osnove
        - Pojavio se novi zvuk i ne razumete odakle
      honestHeading: Šta ne obećavamo
      honest: Svaka kvar nije moguće uhvatiti za četrdeset minuta. Plutajući problemi, koji se pojave jednom nedeljno, ponekad zahtevaju ponovni dolazak ili ostavljanje automobila na dan. Odmah ćemo vam reći i nećemo menjati delove redom o vašem trošku.
    servicing:
      name: Planirano TO
      short: Ulje, filteri, tečnosti i pregled prema propisu vašeg motora.
      metaTitle: Planirano TO i zamena ulja u Beogradu | CarLab
      metaDescription: 'Tehničko održavanje automobila u Beogradu: ulje, filteri, svećice, kočiona tečnost, antifriz. Prema pravilniku proizvođača, uz zapis u servisnu kartu.'
      heroEyebrow: Održavanje
      heroTitle: Najjeftinija popravka je ona koja se nije desila
      heroLead: Svaki motor ima svoj interval i svoj dozvoljeni nivo ulja. Gledamo priručnik za vaš automobil i radimo ono što piše, a ne srednje ‘jednom na deset hiljada.’
      priceFrom: od 90 €
      duration: 2–4 sata
      bodyHeading: Kako se određuje interval za vaš automobil
      body: |
        Intervali zamene kod različitih motora razlikuju se mnogo, a uslovi u Beogradu (saobraćaj, prašina, leto do četrdeset) skoro uvek se klasifikuju kao „teški uslovi rada“ sa skraćenim intervalima. Po njima računamo šta je stvarno potrebno vašem automobilu na ovoj kilometraži.

        Uz to, proveravamo ono što se obično setimo prekasno: stanje kaiša ili lanca, kočionu tečnost na vlagu, antifriz na temperaturu smrzavanja, trošenje pločica i diskova u milimetrima.
      includesHeading: Šta ulazi
      includes:
        - Ulje i uljni filter sa odobrenjem vašeg proizvođača
        - Vazdušni i kabinski filter, svećice prema pravilniku
        - Provera kočione tečnosti na sadržaj vlage
        - Provera antifriza i njegove temperature smrzavanja
        - Merenje preostalog sloja pločica i diskova u milimetrima
        - Zapis svih radova i pređenih kilometara u servisnu kartu
      signsHeading: Kada je vreme da nam se obratite
      signs:
        - Prošla kilometraža ili godina od poslednjeg TO
        - Automobil je tek kupljen, a nema istoriju servisiranja
        - Sledeći je dug put
        - Upalila se lampica servisnog intervala
      honestHeading: Šta ne radimo
      honest: Ne menjamo ono što još nije vreme. Ako je filter odradio polovinu svog resursa, ne diramo ga i kažemo vam kada je vreme za dolazak.
    brakes-suspension:
      name: Kočnice i ovjes
      short: Sve što je odgovorno za to da li će se automobil zaustaviti ili ne.
      metaTitle: Popravka kočnica i suspenzije u Beogradu | CarLab
      metaDescription: 'Kočnice i ovjes u Beogradu: pločice, diskovi, čeljusti, poluge, geometrija. Merenja u milimetrima, procena pre radova.'
      heroEyebrow: Hodna
      heroTitle: Ovde resurs računamo u milimetrima
      heroLead: 'Motor se može izgurati do servisa. Kočnice se ne mogu. Zato za hodnu grupu ne prakticiramo okrugla rešenja i odlaganja: ako je resurs ispunjen, direktno kažemo.'
      priceFrom: od 120 €
      duration: od 3 sata
      bodyHeading: Kako to radimo
      body: |-
        Počinjemo sa merenjem: debljina diskova i pločica u milimetrima, udaranje, stanje creva i kočionih čelika. Na suspenziji proveravamo praznine na dizalici i na vibracionom stendu, pregledamo zaštitne čepove i oslonce.

        Nakon popravke hoda uvek radimo geometriju: čak i zamena jednog držača menja geometriju, a pogrešna geometrija troši set guma u sezoni.
      includesHeading: Šta ulazi
      includes:
        - Merenje diskova i pločica sa zapisanom rezultatom
        - Zamena pločica, diskova, creva, popravka ili zamena čeljusti
        - Protok i zamena kočione tečnosti
        - Amortizeri, opruge, poluge, silentblokovi, oslonci i ležajevi
        - Geometrija nakon svake intervencije u ovjesu
        - Kontrolna test-vožnja pre predaje
      signsHeading: Kada je vreme da nam se obratite
      signs:
        - Škripanje, pisak ili trljanje pri kočenju
        - Pedala je postala mekana ili propada
        - Automobil ide u stranu pri kočenju
        - Udari na neravnom terenu, ‘plutajući’ volan, nejednako trošenje pneumatika
      honestHeading: Na šta ćemo vas upozoriti
      honest: Pločice i diskovi su potrošni deo koji traje paru. Postavljanje novih pločica na istrošene diskove je moguće, ali resurs pločica pri tome opada, i za šest meseci dolazite ponovo. Mi ćemo izračunati obe opcije i ostaviti izbor vama.
    engine-gearbox:
      name: Motor i menjač
      short: Od zamene dihtunga do popravke sa rastavljanjem, uz jasnu procenu.
      metaTitle: Popravka motora i menjača u Beogradu | CarLab
      metaDescription: 'Popravka motora i menjača u Beogradu: GRM, zaptivači, kvačilo, zamena ulja u AT. Dijagnostika pre rasklapanja, procena pre radova.'
      heroEyebrow: Sila agregat
      heroTitle: „Kapitalna“ popravka nije potrebna tako često kao što je nazivaju
      heroLead: 'Pre nego što bilo šta rastavimo, proveravamo sve što se može pregledati spolja: kompresiju, pritisak ulja, greške, curenja.'
      priceFrom: prema rezultatima dijagnostike
      duration: od 1 dan
      bodyHeading: Redosled rada
      body: |-
        Prvo merimo: kompresija po cilindrima, pritisak ulja, stanje svećica, greške po blokovima, curenja pod pritiskom. Tek nakon toga odlučujemo da li je potrebno otvoriti motor.

        Za menjače gledamo stanje ulja i logiku prebacivanja: kod automatskih menjača većina "kvarova" se rešava pravilnim održavanjem, a ne zamenom sklopova. Ako popravka ipak bude potrebna, dobijate procenu sa razdvojenom cenom za rad i delove pre nego što se nešto skine.
      includesHeading: Šta ulazi
      includes:
        - Merenje kompresije i pritiska ulja
        - Proveravanje curenja pod pritiskom, traženje usisavanja vazduha
        - Zamena remena ili lanca GRM, rolnica i pumpe
        - Dihtunzi, zaptivači, zaptivni umeci
        - Kvačilo, zamašnjak, zamena ulja u mehaničkom i automatskom
        - Ponuda sa razradom pre početka rastavljanja
      signsHeading: Kada je vreme da nam se obratite
      signs:
        - Ulje odlazi između zamena
        - Udari, vibracije ili gubitak vuče
        - Zatezanje i kašnjenja prilikom prebacivanja brzina
        - Dim iz auspuha koji ranije nije bio prisutan
      honestHeading: Kada vas odvratimo
      honest: Ako cena popravke postane slična ceni automobila, reći ćemo to. Ponekad je pravi savet prodati automobil ovako ili tražiti ugovoreni sklop, a ne ulagati u popravku iznos koji automobil nikada neće vratiti.
    bodywork-painting:
      name: Karoserija i farbanje
      short: Obnova nakon saobraćajne nesreće, ispravka geometrije i farbanje sa odabirom boje.
      metaTitle: Karoserska popravka i farbanje posle udesa u Beogradu | CarLab
      metaDescription: 'Popravka karoserije u Beogradu: šablon, merenje geometrije, ravnanje, farbanje sa računarom za odabir boje. Radimo sa osiguravajućim društvima, pomažemo sa dokumentima.'
      heroEyebrow: Nakon nesreće
      heroTitle: Da ne izgleda kao „posle udarca“
      heroLead: Dobra popravka karoserije se ne vidi ni golim okom, ni mernim uređajem pri pregledu pre prodaje.
      priceFrom: prema rezultatima pregleda
      duration: od 3 dana
      bodyHeading: Šta sve uključuje obnovu
      body: |
        Prvo merimo geometriju karoserije: posle udarca pomeranja se dešavaju tamo gde vizuelno sve izgleda u redu, i to kasnije stvara nejednako trošenje guma i skretanje automobila. Po potrebi postavljamo na stapalj i izvlačimo po kontrolnim tačkama.

        Boju biramo dva puta: po kodu iz dokumenata i spektofometrom po stvarnoj boji, jer se nakon pet godina na suncu fabrička boja menja u odnosu na upisanu. Prelaz poliramo tako da granica ne bude vidljiva ni na suncu, ni pod lampom.
      includesHeading: Šta ulazi
      includes:
        - Merenje geometrije karoserije prema kontrolnim tačkama
        - Šablon i izvlačenje pri pomeranjima
        - Rihovanje, zamena oštećenih elemenata
        - Biranje boje prema kodu i spektrofotometrom
        - Farbanje u kabini uz kontrolu temperature
        - Poliranje prelaza i sastavljanje uz proveru razmaka
      signsHeading: Kada je vreme da nam se obratite
      signs:
        - Bila je saobraćajna nesreća, čak i ako su oštećenja mala
        - Neujednačeni razmaci između delova karoserije
        - Auto skreće, guma se troši „na jednu stranu“
        - Treba dovesti karoseriju u red pre prodaje
      honestHeading: O osiguranjima
      honest: Radimo sa osiguranjima i pomažemo u vezi sa dokumentacijom, ali ne obećavamo da će osiguranje pokriti sve. Nakon pregleda odmah pokazujemo šta ulazi u pokriće osiguranja, a šta ne, kako ne biste to saznali na kraju.
    pre-purchase-inspection:
      name: Proverka pre kupovine
      short: Debljinom jer samo, dizalica i skener pre nego što predate novac.
      metaTitle: Provera automobila pre kupovine u Beogradu | CarLab
      metaDescription: 'Tehnička provera pre kupovine u Beogradu: debljinomer, dizalica, dijagnostika grešaka, kompresija. Pismeno izveštaj i mogućnost pregovaranja u vašu korist.'
      heroEyebrow: Pre transakcije
      heroTitle: Šta će pokazati merni uređaj, prodavac neće reći
      heroLead: Prefarbovane panele, tragovi zavarivanja, preokrenuta kilometraža, curenja s donje strane. To se može videti za sat na dizalici, iako se u oglasu to ne piše.
      priceFrom: od 60 €
      duration: oko 1 sat
      bodyHeading: Šta proveravamo
      body: |-
        Karoseriju proveravamo debljinomerom po svim panelima: prefarbane komponente, maske, tragovi zavarivanja, stanje razmaka. Zatim dizalica: suspenzija, curenja, stanje auspuha i zaštite, tragovi udarca s donje strane.

        Elektronika: čitanje grešaka po svim blokovima, uključujući preokrenute i ogrižene. Motor: kompresija i curenja. Na kraju dobijate pismeno izveštaj sa spiskom pronađenog i procenom troškova popravke, o kojoj se može pregovarati.
      includesHeading: Šta ulazi
      includes:
        - Merenje debljine laka po svim panelima karoserije
        - Pregled na dizalici, provere curenja i tragovi udarca
        - Čitanje grešaka kroz sve elektronske module
        - Merenje kompresije po cilindrima
        - Provera na znakove lažirane kilometraže
        - Pismeno izveštaj sa procenom troškova popravke
      signsHeading: Kada je ovo potrebno
      signs:
        - Kupujete auto od privatne osobe
        - Prodavac vas žuri s odlukom
        - Auto je donet iz inostranstva, istorija nije poznata
        - Cena sumnjivo niža od tržišne
      honestHeading: Šta provera ne uključuje
      honest: Iskreno ćemo reći šta vidimo, ali nijedan pregled ne može da uhvati sve. Skriveni kvar koji se ne pojavljuje ni na dizalici, ni na dijagnostici, može kasnije isplivati. Ovo je ograničenje metode, a ne uslov napisan sitnim slovima.
    vin-parts-inquiry:
      name: Izbor delova
      short: Nalazimo delove koji odgovaraju vašem automobilu i navodimo cenu pre kupovine.
      metaTitle: Izbor auto delova po VIN-u u Beogradu - CarLab
      metaDescription: 'Izbor delova po VIN-u ili broju šasije u Beogradu: originalni i provereni analozi, provera kompatibilnosti, cena pre kupovine. Preuzimanje sa SClab.'
      heroEyebrow: Delovi
      heroTitle: Pronaći ćemo delove koji će savršeno odgovarati vašem automobilu
      heroLead: Pošaljite VIN ili broj šasije i navedite šta vam treba. Proverićemo kompatibilnost, pronaći originalne i proverene analoge i ponuditi najbolje opcije.
      priceFrom: javimo nakon pretrage
      duration: zavisi od dostupnosti kod dobavljača
      bodyHeading: Kako biramo delove
      body: |-
        Preko VIN-a utvrđujemo tačnu opremu vozila: motor, menjač, godinu i tržište za koje je napravljeno. Na osnovu toga određujemo koja komponenta odgovara, čak i ako je model isti.

        Nakon toga tražimo broj delova kod proizvođača i proverene analoge, upoređujemo cene i rokove kod dobavljača i nudimo vam nekoliko opcija. Vi birate, mi naručujemo, a delove možete preuzeti u našoj servisnoj radionici u Beogradu.

        Ako vam je potrebna i montaža, možemo to uraditi i kod nas: deo je proveren na kompatibilnost, a majstor zna šta postavlja.
      includesHeading: Šta ulazi
      includes:
        - Provera kompatibilnosti po VIN-u ili broju šasije
        - Pretraga originalnog broja dela
        - Biranje proverenih analoga sa različitim cenama
        - Cena i rok pre nego što bilo šta platite
        - Preuzimanje sa SSO u Beogradu
      signsHeading: Kada je ovo potrebno
      signs:
        - Ne znate tačan naziv ili broj dela
        - Plašite se da kupite deo koji neće odgovarati
        - Nema potrebnog dela u katalogu na sajtu
        - Želite da uporedite original i analoge po ceni
      honestHeading: Šta ne obećavamo
      honest: Nije svaku komponentu moguće odmah i jeftino pronaći. Ako je deo ređi ili ide na porudžbinu, iskreno ćemo reći rok i cenu pre kupovine, a ako ne postoji odgovarajući analog, nećemo predlagati ono što ne odgovara.
  en:
    indexMetaTitle: 'Car service in Belgrade: repairs and maintenance | CarLab'
    indexMetaDescription: Diagnostics, maintenance and oil change, brakes and suspension, engine and gearbox, accident repair, pre-purchase inspection, parts sourcing by VIN. Prices and timelines.
    indexEyebrow: Services
    indexHeading: Everything your car needs in one service
    indexLead: 'Each service has its own page: what it includes, how long it takes, signs that it’s time to come to us, and when we honestly say it’s not necessary.'
    specsPriceLabel: Price
    specsDurationLabel: Duration
    diagnostics:
      name: Computer diagnostics
      short: We find out what's behind the error code.
      metaTitle: Car diagnostics in Belgrade | CarLab
      metaDescription: Engine, suspension, and electrical diagnostics in Belgrade. Error reading is free, and we show the cause right on the car.
      heroEyebrow: Diagnostics
      heroTitle: Error code is a symptom, not a diagnosis
      heroLead: The scanner will tell you which sensor has a problem. Whether it's the sensor itself or what it's measuring won't be shown by the scanner; that needs to be determined on the car.
      priceFrom: error reading is free
      duration: from 40 minutes
      bodyHeading: What we do in diagnostics
      body: |-
        First, we have a discussion: when it started, under what conditions, what was changed before this. Some diagnoses can already be determined here: 'knocks only when cold' and 'knocks all the time' indicate different components.

        Then we scan all the control units at once: often errors in the ABS or comfort module explain what the driver complains about. Next, we check the car: lift it, check play, inspect under load, and if necessary, measure pressure and use an oscilloscope.

        At the end, we show you the issue with the car and explain it clearly. If a repair is needed, we will immediately calculate the estimate.

        Cost: error reading is free. Paid diagnostics only begins when a component needs disassembly or the vehicle is placed on stands, and we will give you the price before we start working, not at the end.
      includesHeading: What's included
      includes:
        - Symptom and service history questionnaire
        - Error reading from all electronic modules
        - Inspection on the lift, checking for play and leaks
        - Test drive with an engineer if the problem occurs while driving
        - Verbal conclusion and written repair estimate
      signsHeading: When it's time to come to us
      signs:
        - The 'check' light or another warning icon is on
        - The car jerks, misfires, or has difficulty starting
        - Fuel consumption increased without a clear cause
        - A new sound appears, and you don’t understand where it’s coming from
      honestHeading: What we don’t promise
      honest: Not every fault can be caught in forty minutes. Intermittent problems that appear once a week may require a follow-up visit or leaving the car for a day. We will tell you this right away and won't start replacing parts one by one at your expense.
    servicing:
      name: Scheduled maintenance
      short: Oil, filters, fluids, and inspection according to your engine's schedule.
      metaTitle: Scheduled maintenance and oil change in Belgrade | CarLab
      metaDescription: 'Car maintenance in Belgrade: oil, filters, spark plugs, brake fluid, antifreeze. According to manufacturer regulations, with a service record update.'
      heroEyebrow: Service
      heroTitle: The cheapest repair is the one that never happened
      heroLead: Every engine has its own interval and oil allowance. We look at your car's manual and do what's stated there, not an average of 'every ten thousand'.
      priceFrom: from 90 €
      duration: 2–4 hours
      bodyHeading: Where your car’s interval comes from
      body: |-
        Replacement intervals differ significantly between engines, and the conditions in Belgrade (traffic, dust, scorching summer) usually fall under 'severe operating conditions' with shortened intervals. We base our calculations on what your car really needs at the current mileage.

        We also check what is usually remembered too late: the condition of the timing belt or chain, the moisture level in brake fluid, the freezing point of coolant, and the wear of pads and discs in millimeters.
      includesHeading: What's included
      includes:
        - Oil and oil filter with your manufacturer’s specifications
        - Air and cabin filters, spark plugs as specified
        - Brake fluid moisture content check
        - Antifreeze check and freezing temperature
        - Measurement of pad and disc wear in millimeters
        - Updating all work and mileage in the service record
      signsHeading: When it's time to come to us
      signs:
        - Mileage or year since last maintenance has come due
        - The car has just been bought, and there's no service history
        - A long trip is ahead
        - The service interval light is on
      honestHeading: What we don’t do
      honest: We won’t change what still has life left. If a filter has half of its lifespan remaining, we won't touch it, and we'll let you know when to come back.
    brakes-suspension:
      name: Brakes and suspension
      short: Everything that determines whether the car will stop or not.
      metaTitle: Brake and suspension repair in Belgrade | CarLab
      metaDescription: 'Brakes and suspension in Belgrade: pads, discs, calipers, control arms, wheel alignment. Measurements in millimeters, estimate before work.'
      heroEyebrow: Chassis
      heroTitle: Here, wear is measured in millimeters
      heroLead: "You can stretch the engine to service. You can't do that with brakes. Therefore, we don't round things off and don't prolong: if the wear is finished, we say it straight."
      priceFrom: from 120 €
      duration: from 3 hours
      bodyHeading: How we do it
      body: |-
        We start with measurements: thickness of discs and pads in millimeters, runout, condition of hoses and calipers. For the suspension, we check play on the lift and the alignment platform, examine dust boots and mounts.

        After repairing the suspension, we always perform a wheel alignment: even replacing one arm changes the geometry, and incorrect geometry will wear out a complete set of tires in a season.
      includesHeading: What's included
      includes:
        - Measurement of discs and pads with recorded results
        - Replacement of pads, discs, hoses, repair or replacement of calipers
        - Bleeding and replacement of brake fluid
        - Struts, springs, control arms, bushings, mounts, and bearings
        - Wheel alignment after any suspension work
        - Final test drive before release
      signsHeading: When it's time to come to us
      signs:
        - Squeaking, chirping, or grinding when braking
        - The pedal feels soft or sinks
        - The car pulls to one side when braking
        - Sounds over bumps, a 'floating' steering wheel, uneven tire wear
      honestHeading: What we will warn about
      honest: Brake pads and discs are consumables that come in pairs. You can fit new pads on worn discs, but the lifespan of the pads decreases, and in six months, you'll be back again. We will calculate both options and leave the choice to you.
    engine-gearbox:
      name: Engine and gearbox
      short: From gasket replacement to repairs with disassembly, complete with a clear estimate.
      metaTitle: Engine and gearbox repair in Belgrade | CarLab
      metaDescription: 'Engine and transmission repair in Belgrade: timing systems, gaskets, clutch, oil change in automatic transmissions. Diagnostics before disassembly, estimate before work.'
      heroEyebrow: Power unit
      heroTitle: Major repairs aren’t needed as often as they say
      heroLead: 'Before taking anything apart, we check what can be checked externally: compression, oil pressure, errors, leaks.'
      priceFrom: based on diagnostic results
      duration: from 1 day
      bodyHeading: Workflow
      body: |-
        First, we measure: compression across cylinders, oil pressure, condition of spark plugs, errors in blocks, and pressure leaks. Only after this do we decide if the engine needs opening.

        For gearboxes, we check the oil condition and shifting logic: most 'breakdowns' in automatics can be resolved with proper servicing, not by replacement. If a repair is necessary, you receive an estimate itemizing labor and parts before anything is removed.
      includesHeading: What's included
      includes:
        - Compression and oil pressure testing
        - Pressure leak checks and air intake detection
        - Timing belt or chain replacement, rollers, and pump
        - Gaskets, seals, valve stem seals
        - Clutch, flywheel, oil change for manual and automatic
        - Estimate provided before disassembly begins
      signsHeading: When it's time to come to us
      signs:
        - Oil consumption between changes
        - Knocking, vibration, or loss of power
        - Stutters and delays when shifting gears
        - Smoke from the exhaust that wasn't there before
      honestHeading: When we advise against it
      honest: If the cost of repairs approaches the value of the car, we will tell you. Sometimes the best advice is to sell as is or look for a replacement unit instead of investing in repairs that the car will never recoup.
    bodywork-painting:
      name: Body and painting
      short: Restoration after an accident, frame straightening, and color matching.
      metaTitle: Body repair and painting after an accident in Belgrade | CarLab
      metaDescription: 'Body repair in Belgrade: frame alignment, geometry measurement, bodywork, and color matching. We work with insurance companies and assist with documentation.'
      heroEyebrow: After an accident
      heroTitle: To make the car look good as new
      heroLead: Good bodywork is invisible to the eye or a gauge during a pre-sale inspection.
      priceFrom: based on inspection results
      duration: from 3 days
      bodyHeading: What’s included in the restoration
      body: |-
        First, we measure the geometry of the body: after an impact, misalignments can occur where everything appears fine visually, and these then lead to uneven tire wear and vehicle pulling. If necessary, we place it on a jig and pull it back to the reference points.

        We match the color twice: based on the code from documents and with a spectrophotometer in practice, because over five years in the sun, the factory color fades from the original. We polish the transition so that the boundary is not visible either in sunlight or under the lamp.
      includesHeading: What's included
      includes:
        - Geometry measurement based on reference points
        - Frame machine and pulling for misalignments
        - Bodywork, replacement of damaged elements
        - Color matching using code and spectrophotometry
        - Painting in a controlled temperature booth
        - Polishing the transition and assembly with gap checks
      signsHeading: When it's time to come to us
      signs:
        - There has been an accident, even if the damage seems minor
        - Uneven gaps between body panels
        - The car pulls to one side, tires wear unevenly
        - The body needs fixing before a sale
      honestHeading: About insurance
      honest: We work with insurance companies and assist with documentation, but we can't promise that insurance will cover everything. After inspection, we show you right away what qualifies for insurance coverage and what does not, so you won't find out about this at the end.
    pre-purchase-inspection:
      name: Pre-purchase inspection
      short: Thickness gauge, lift, and scanner before you hand over money.
      metaTitle: Pre-purchase vehicle inspection in Belgrade | CarLab
      metaDescription: 'Technical inspection before purchase in Belgrade: thickness gauge, lift, diagnostics, compression. Written report and bargaining in your favor.'
      heroEyebrow: Before the deal
      heroTitle: What the thickness gauge reveals, the seller won’t tell you
      heroLead: Repainted panels, welding traces, rolled back mileage, leaks underneath. This is visible on the lift in an hour, even if it's not mentioned in the ad.
      priceFrom: from €60
      duration: about 1 hour
      bodyHeading: What we check
      body: |-
        We check the body with a thickness gauge on all panels: repainted elements, putty, welding traces, and condition of gaps. Next, the lift: suspension, leaks, condition of exhaust and protection, traces of impacts underneath.

        Electronics: reading errors from all units, including rolled back and erased mileage. For the engine, we check compression and leaks. In the end, you receive a written report listing the findings and an assessment of repair costs that you can use for negotiation.
      includesHeading: What's included
      includes:
        - Measuring paint thickness on all body panels
        - Inspection on the lift, checking for leaks and traces of impacts
        - Error reading from all electronic modules
        - Compression measurement by cylinder
        - Checking for signs of tampered mileage
        - Written report with estimated repair costs
      signsHeading: When it’s needed
      signs:
        - You are buying a used car
        - The seller is rushing you to make a decision
        - The car was imported, history unknown
        - The price is suspiciously lower than the market
      honestHeading: What the inspection does not guarantee
      honest: We will honestly tell you what we see, but no inspection can catch everything. A hidden defect that doesn't manifest on the lift or during diagnostics can surface later. This is a limitation of the method, not a disclaimer in fine print.
    vin-parts-inquiry:
      name: Parts sourcing
      short: We find parts that fit your car and provide the price before purchase.
      metaTitle: Parts sourcing by VIN in Belgrade - CarLab
      metaDescription: 'Parts sourcing by VIN or chassis number in Belgrade: original and verified analogs, compatibility check, price before purchase. Pickup from CarLab service.'
      heroEyebrow: Parts
      heroTitle: We will find the parts that will definitely fit your car
      heroLead: Send your VIN or chassis number and let us know what you need. We'll check compatibility, find the original part and verified alternatives, and offer the best options.
      priceFrom: provided after selection
      duration: depends on supplier availability
      bodyHeading: How we source parts
      body: |-
        Using your VIN, we determine the exact specifications of your vehicle: engine, gearbox, year, and the market for which it was assembled. This influences which part will fit, even if the model is the same.

        Next, we search for the part number from the manufacturer and reliable alternatives, compare prices and delivery times from suppliers, and present you with several options. You choose, we order, and you can pick up the parts at our service center in Belgrade.

        If you need installation too, we can handle that as well: the part is checked for compatibility, and our technician knows what they are installing.
      includesHeading: What's included
      includes:
        - Compatibility check by VIN or chassis number
        - Search for the original part number
        - Selection of verified alternatives at different prices
        - Price and delivery time before any payment
        - Pickup at our service center in Belgrade
      signsHeading: When it’s needed
      signs:
        - Not sure of the exact name or part number
        - Worried about buying a part that won't fit
        - The needed part is not in the online catalog
        - Want to compare original and alternative prices
      honestHeading: What we don’t promise
      honest: Not every part can be found quickly and cheaply. If a part is rare or needs to be ordered, we will honestly inform you of the timeframe and price before purchase, and if there’s no suitable alternative, we won’t offer something that won’t fit.
