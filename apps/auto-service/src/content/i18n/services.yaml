diagnostics:
  name: Компьютерная диагностика
  short: Находим, что стоит за кодом ошибки.
  metaTitle: Компьютерная диагностика автомобиля в Белграде | CarLab
  metaDescription: Диагностика двигателя, подвески и электрики в Белграде. Считывание ошибок бесплатно, причину показываем прямо на машине.
  heroEyebrow: Диагностика
  heroTitle: Код ошибки это симптом, а не диагноз
  heroLead: Сканер скажет, какой датчик ругается. Виноват сам датчик или то, что он измеряет, сканер не покажет, это выясняется уже на машине.
  priceFrom: считывание ошибок бесплатно
  duration: от 40 минут
  bodyHeading: Что мы делаем на диагностике
  body: |
    Сначала разговор: когда началось, при каких условиях, что менялось до этого. Часть диагнозов ставится уже здесь: «стучит только на холодную» и «стучит постоянно» это разные узлы.

    Потом сканер по всем блокам сразу: часто ошибка в ABS или в блоке комфорта объясняет то, на что жалуется водитель. Дальше проверка на машине: подъемник, люфты, осмотр под нагрузкой, при необходимости замер давления и осциллограф.

    В конце показываем причину на автомобиле и объясняем на пальцах. Если нужен ремонт, сразу считаем смету.

    Сколько это стоит: считывание ошибок бесплатно. Платной диагностика становится только тогда, когда нужно разбирать узел или ставить машину на стенд, и цену мы называем до начала работ, а не в конце.
  includesHeading: Что входит
  includes:
    - Опрос по симптомам и истории обслуживания
    - Считывание ошибок по всем электронным блокам
    - Осмотр на подъемнике, проверка люфтов и утечек
    - Тест-драйв с инженером, если проблема проявляется в движении
    - Устное заключение и письменная смета на ремонт
  signsHeading: Когда пора к нам
  signs:
    - Горит «чек» или другой значок на панели
    - Машина дергается, троит или плохо заводится
    - Расход вырос без понятной причины
    - Появился новый звук, и вы не понимаете откуда
  honestHeading: Что мы не обещаем
  honest: Не каждая неисправность ловится за сорок минут. Плавающие проблемы, которые появляются раз в неделю, иногда требуют повторного визита или оставить машину на день. Мы скажем об этом сразу и не станем менять детали по очереди за ваш счет.
servicing:
  name: Плановое ТО
  short: Масло, фильтры, жидкости и осмотр по регламенту вашего двигателя.
  metaTitle: Плановое ТО и замена масла в Белграде | CarLab
  metaDescription: 'Техническое обслуживание автомобиля в Белграде: масло, фильтры, свечи, тормозная жидкость, антифриз. По регламенту производителя, с записью в сервисную карту.'
  heroEyebrow: Обслуживание
  heroTitle: Самая дешевая починка та, которой не случилось
  heroLead: У каждого мотора свой интервал и свой допуск по маслу. Мы смотрим мануал на вашу машину и делаем то, что написано там, а не среднее «раз в десять тысяч».
  priceFrom: от 90 €
  duration: 2–4 часа
  bodyHeading: Откуда берется интервал для вашей машины
  body: |
    Интервалы замены у разных моторов отличаются в разы, а условия Белграда (пробки, пыль, лето под сорок) почти всегда попадают под «тяжелые условия эксплуатации» с укороченным интервалом. По ним и считаем, что реально нужно вашей машине на этом пробеге.

    Заодно проверяем то, что обычно вспоминают слишком поздно: состояние ремня или цепи, тормозную жидкость на влагу, антифриз на температуру замерзания, износ колодок и дисков в миллиметрах.
  includesHeading: Что входит
  includes:
    - Масло и масляный фильтр с допуском вашего производителя
    - Воздушный и салонный фильтр, свечи по регламенту
    - Проверка тормозной жидкости на содержание влаги
    - Проверка антифриза и его температуры замерзания
    - Замер остатка колодок и дисков в миллиметрах
    - Запись всех работ и пробега в сервисную карту
  signsHeading: Когда пора к нам
  signs:
    - Подошел пробег или год с прошлого ТО
    - Машина только куплена, а истории обслуживания нет
    - Впереди дальняя дорога
    - Загорелась лампа сервисного интервала
  honestHeading: Что мы не делаем
  honest: Не меняем то, чему еще рано. Если фильтр отработал половину ресурса, мы его не тронем и скажем, когда приезжать.
brakes-suspension:
  name: Тормоза и подвеска
  short: Все, что отвечает за то, остановится машина или нет.
  metaTitle: Ремонт тормозов и подвески в Белграде | CarLab
  metaDescription: 'Тормоза и подвеска в Белграде: колодки, диски, суппорты, рычаги, развал-схождение. Замеры в миллиметрах, смета до работ.'
  heroEyebrow: Ходовая
  heroTitle: Здесь ресурс считают в миллиметрах
  heroLead: 'Мотор можно дотянуть до сервиса. Тормоза нельзя. Поэтому по ходовой мы не округляем и не тянем: если ресурс кончился, говорим прямо.'
  priceFrom: от 120 €
  duration: от 3 часов
  bodyHeading: Как мы это делаем
  body: |
    Начинаем с замеров: толщина дисков и колодок в миллиметрах, биение, состояние шлангов и суппортов. По подвеске проверяем люфты на подъемнике и на вибростенде, осматриваем пыльники и опоры.

    После ремонта ходовой всегда делаем развал-схождение: даже замена одного рычага меняет геометрию, а неправильная геометрия съедает комплект резины за сезон.
  includesHeading: Что входит
  includes:
    - Замер дисков и колодок с записью результата
    - Замена колодок, дисков, шлангов, ремонт или замена суппортов
    - Прокачка и замена тормозной жидкости
    - Стойки, пружины, рычаги, сайлентблоки, опоры и подшипники
    - Развал-схождение после любого вмешательства в подвеску
    - Контрольный тест-драйв перед выдачей
  signsHeading: Когда пора к нам
  signs:
    - Скрип, писк или скрежет при торможении
    - Педаль стала мягкой или проваливается
    - Машину уводит в сторону при торможении
    - Стуки на неровностях, «плавающий» руль, неравномерный износ резины
  honestHeading: О чем предупредим
  honest: Колодки и диски это расходник, который ходит парой. Ставить новые колодки на изношенные диски можно, но ресурс колодок при этом падает, и через полгода вы приедете снова. Мы посчитаем оба варианта и оставим выбор вам.
engine-gearbox:
  name: Двигатель и коробка
  short: От замены прокладки до ремонта с разбором, с понятной сметой.
  metaTitle: Ремонт двигателя и коробки передач в Белграде | CarLab
  metaDescription: 'Ремонт двигателя и трансмиссии в Белграде: ГРМ, прокладки, сцепление, замена масла в АКПП. Диагностика до разбора, смета до работ.'
  heroEyebrow: Силовой агрегат
  heroTitle: «Капиталка» нужна не так часто, как ее называют
  heroLead: 'Прежде чем что-то разбирать, мы проверяем то, что проверяется снаружи: компрессию, давление масла, ошибки, утечки.'
  priceFrom: по результатам диагностики
  duration: от 1 дня
  bodyHeading: Порядок работы
  body: |
    Сначала измеряем: компрессия по цилиндрам, давление масла, состояние свечей, ошибки по блокам, утечки под давлением. Только после этого решаем, нужно ли вскрывать мотор.

    По коробкам смотрим состояние масла и логику переключений: у автоматов большая часть «поломок» лечится корректным обслуживанием, а не заменой агрегата. Если ремонт все же нужен, вы получаете смету с разбивкой на работу и запчасти до того, как что-то снято.
  includesHeading: Что входит
  includes:
    - Замер компрессии и давления масла
    - Проверка на утечки под давлением, поиск подсоса воздуха
    - Замена ремня или цепи ГРМ, роликов и помпы
    - Прокладки, сальники, маслосъемные колпачки
    - Сцепление, маховик, замена масла в механике и автомате
    - Смета с разбивкой до начала разбора
  signsHeading: Когда пора к нам
  signs:
    - Масло уходит между заменами
    - Стук, вибрация или потеря тяги
    - Рывки и задержки при переключении передач
    - Дым из выхлопа, которого раньше не было
  honestHeading: Когда мы отговариваем
  honest: Если стоимость ремонта подходит к стоимости машины, мы это скажем. Иногда правильный совет продать как есть или искать контрактный агрегат, а не вкладывать в ремонт сумму, которую машина никогда не вернет.
bodywork-painting:
  name: Кузов и покраска
  short: Восстановление после ДТП, правка геометрии и покраска с подбором цвета.
  metaTitle: Кузовной ремонт и покраска после ДТП в Белграде | CarLab
  metaDescription: 'Кузовной ремонт в Белграде: стапель, замер геометрии, рихтовка, покраска с компьютерным подбором цвета. Работаем со страховыми, помогаем с документами.'
  heroEyebrow: После ДТП
  heroTitle: Чтобы машина не выглядела «после удара»
  heroLead: Хороший кузовной ремонт не видно ни глазом, ни толщиномером на осмотре перед продажей.
  priceFrom: по результатам осмотра
  duration: от 3 дней
  bodyHeading: Что входит в восстановление
  body: |
    Сначала замеряем геометрию кузова: после удара смещения бывают там, где визуально все цело, и именно они потом дают неравномерный износ резины и увод машины. При необходимости ставим на стапель и вытягиваем по контрольным точкам.

    Цвет подбираем дважды: по коду из документов и спектрофотометром по факту, потому что за пять лет на солнце заводской цвет уходит от паспортного. Переход полируем так, чтобы граница не читалась ни на солнце, ни под лампой.
  includesHeading: Что входит
  includes:
    - Замер геометрии кузова по контрольным точкам
    - Стапель и вытяжка при смещениях
    - Рихтовка, замена поврежденных элементов
    - Подбор цвета по коду и спектрофотометром
    - Покраска в камере с контролем температуры
    - Полировка перехода и сборка с проверкой зазоров
  signsHeading: Когда пора к нам
  signs:
    - Было ДТП, даже если повреждения выглядят мелкими
    - Неравномерные зазоры между деталями кузова
    - Машину уводит, резина изнашивается «в один край»
    - Нужно привести кузов в порядок перед продажей
  honestHeading: О страховых
  honest: Мы работаем со страховыми и помогаем с документами, но не обещаем, что страховая покроет все. После осмотра мы сразу показываем, что попадает в страховой случай, а что нет, чтобы вы не узнали об этом в конце.
pre-purchase-inspection:
  name: Проверка перед покупкой
  short: Толщиномер, подъемник и сканер до того, как вы отдали деньги.
  metaTitle: Проверка автомобиля перед покупкой в Белграде | CarLab
  metaDescription: 'Техническая проверка перед покупкой в Белграде: толщиномер, подъемник, диагностика ошибок, компрессия. Письменное заключение и торг в вашу пользу.'
  heroEyebrow: Перед сделкой
  heroTitle: Что покажет толщиномер, продавец не расскажет
  heroLead: Перекрашенные панели, следы сварки, скрученный пробег, утечки снизу. За час на подъемнике это видно, хотя в объявлении об этом не пишут.
  priceFrom: от 60 €
  duration: около 1 часа
  bodyHeading: Что мы проверяем
  body: |
    Кузов проверяем толщиномером по всем панелям: перекрашенные элементы, шпаклевка, следы сварки, состояние зазоров. Дальше подъемник: подвеска, утечки, состояние выхлопа и защиты, следы ударов снизу.

    Электроника: считывание ошибок по всем блокам, включая скрученные и стертые. По мотору компрессия и утечки. В конце вы получаете письменное заключение со списком найденного и оценкой стоимости устранения, с которым можно торговаться.
  includesHeading: Что входит
  includes:
    - Замер толщины лака по всем панелям кузова
    - Осмотр на подъемнике, проверка на утечки и следы ударов
    - Считывание ошибок по всем электронным блокам
    - Замер компрессии по цилиндрам
    - Проверка на признаки скрученного пробега
    - Письменное заключение с оценкой стоимости устранения
  signsHeading: Когда это нужно
  signs:
    - Покупаете машину с рук
    - Продавец торопит с решением
    - Машина привезена из-за границы, история неизвестна
    - Цена подозрительно ниже рынка
  honestHeading: Чего проверка не дает
  honest: Мы честно скажем, что видим, но ни один осмотр не ловит все. Скрытый дефект, который не проявляется ни на подъемнике, ни на диагностике, может всплыть позже. Это ограничение метода, а не оговорка мелким шрифтом.
vin-parts-inquiry:
  name: Подбор запчастей
  short: Находим запчасти, которые подходят вашей машине, и называем цену до покупки.
  metaTitle: Подбор автозапчастей по VIN в Белграде - CarLab
  metaDescription: 'Подбор запчастей по VIN или номеру шасси в Белграде: оригинал и проверенные аналоги, проверка совместимости, цена до покупки. Самовывоз с СТО CarLab.'
  heroEyebrow: Запчасти
  heroTitle: Подберем запчасти, которые точно подойдут вашей машине
  heroLead: Пришлите VIN или номер шасси и напишите, что нужно. Мы проверим совместимость, найдем оригинал и проверенные аналоги и предложим лучшие варианты.
  priceFrom: называем после подбора
  duration: зависит от наличия у поставщика
  bodyHeading: Как мы подбираем запчасти
  body: |
    По VIN мы определяем точную комплектацию машины: двигатель, коробку, год и рынок, для которого она собрана. От этого зависит, какая деталь подойдет, даже если модель та же.

    Дальше ищем номер детали у производителя и проверенные аналоги, сравниваем цены и сроки у поставщиков и предлагаем вам несколько вариантов. Вы выбираете, мы заказываем, а забрать запчасти можно на нашем СТО в Белграде.

    Если нужна и установка, ее можно сделать у нас же: запчасть проверена на совместимость, и мастер знает, что ставит.
  includesHeading: Что входит
  includes:
    - Проверка совместимости по VIN или номеру шасси
    - Поиск оригинального номера детали
    - Подбор проверенных аналогов с разной ценой
    - Цена и срок до того, как вы что-то оплатили
    - Самовывоз с СТО в Белграде
  signsHeading: Когда это нужно
  signs:
    - Не знаете точное название или номер детали
    - Боитесь купить запчасть, которая не подойдет
    - Нужной детали нет в каталоге на сайте
    - Хотите сравнить оригинал и аналоги по цене
  honestHeading: Что мы не обещаем
  honest: Не каждую деталь можно найти сразу и дешево. Если запчасть редкая или идет под заказ, мы честно скажем срок и цену до покупки, а если подходящего аналога нет, не станем предлагать то, что не подойдет.
translations:
  sr:
    indexMetaTitle: 'Auto servis u Beogradu: popravke i održavanje | CarLab'
    indexMetaDescription: Dijagnostika, mali servis, kočnice i trap, motor i menjač, limarija posle udesa, pregled pre kupovine i delovi po VIN-u. Cene i rokovi.
    indexEyebrow: Usluge
    indexHeading: Sve što vašem automobilu treba, u jednom servisu
    indexLead: 'Za svaku uslugu postoji posebna stranica: šta obuhvata, koliko traje, koji znaci govore da je vreme za servis i kada vam iskreno kažemo da intervencija nije potrebna.'
    specsPriceLabel: Cena
    specsDurationLabel: Trajanje
    diagnostics:
      name: Kompjuterska dijagnostika
      short: Otkrivamo šta se krije iza koda greške.
      metaTitle: Kompjuterska dijagnostika u Beogradu | CarLab
      metaDescription: Dijagnostika motora, trapa i auto-elektrike u Beogradu. Besplatno očitavanje grešaka, a uzrok vam pokazujemo direktno na automobilu.
      heroEyebrow: Dijagnostika
      heroTitle: Kod greške je simptom, a ne dijagnoza
      heroLead: Dijagnostički uređaj pokazuje koji senzor prijavljuje grešku. Da li je problem u samom senzoru ili u onome što meri, utvrđujemo proverom na automobilu.
      priceFrom: besplatno očitavanje grešaka
      duration: od 40 minuta
      bodyHeading: Šta radimo tokom dijagnostike
      body: |
        Prvo razgovaramo: kada je problem počeo, u kojim uslovima se javlja i šta je pre toga menjano. Već tada možemo da suzimo uzrok: lupanje samo pri hladnom motoru i stalno lupanje obično upućuju na različite sklopove.

        Zatim očitavamo greške iz svih upravljačkih jedinica: greška u ABS-u ili modulu komfora često objašnjava problem koji vozač primećuje. Slede provere na automobilu: dizalica, provera zazora, pregled pod opterećenjem, a po potrebi i merenje pritiska i provera osciloskopom.

        Na kraju vam pokazujemo uzrok na automobilu i objašnjavamo ga jednostavnim rečima. Ako je potrebna popravka, odmah pripremamo predračun.

        Koliko to košta: očitavanje grešaka je besplatno. Dijagnostika se naplaćuje samo kada je potrebno rastavljanje sklopa ili ispitivanje na stendu. Cenu saopštavamo pre početka radova, a ne na kraju.
      includesHeading: Šta je uključeno
      includes:
        - Razgovor o simptomima i servisnoj istoriji
        - Očitavanje grešaka iz svih elektronskih upravljačkih jedinica
        - Pregled na dizalici, provera zazora i curenja
        - Probna vožnja sa dijagnostičarem ako se problem javlja u vožnji
        - Usmeno objašnjenje nalaza i pisani predračun za popravku
      signsHeading: Kada je vreme da dođete
      signs:
        - Svetli check engine ili druga lampica na instrument-tabli
        - Automobil trza, motor radi neravnomerno ili teško pali
        - Potrošnja goriva je porasla bez jasnog razloga
        - Čuje se nov zvuk, a ne znate odakle dolazi
      honestHeading: Šta ne obećavamo
      honest: Ne može se svaki kvar otkriti za četrdeset minuta. Povremeni problemi koji se javljaju jednom nedeljno ponekad zahtevaju ponovni dolazak ili da automobil ostane kod nas jedan dan. To ćemo vam odmah reći i nećemo redom menjati delove o vašem trošku.
    servicing:
      name: Redovan servis
      short: Ulje, filteri, tečnosti i pregled prema servisnom planu za vaš motor.
      metaTitle: Redovan servis i zamena ulja u Beogradu | CarLab
      metaDescription: 'Održavanje automobila u Beogradu: ulje, filteri, svećice, kočiona tečnost i antifriz. Prema planu proizvođača, uz upis u servisnu evidenciju.'
      heroEyebrow: Održavanje
      heroTitle: Najjeftinija popravka je ona koja nije ni bila potrebna
      heroLead: Svaki motor ima svoj servisni interval i propisanu specifikaciju ulja. Proveravamo uputstvo za vaš automobil i radimo prema njemu, a ne po opštem pravilu „na deset hiljada“.
      priceFrom: od 90 €
      duration: 2–4 sata
      bodyHeading: Kako određujemo servisni interval za vaš automobil
      body: |
        Intervali zamene mogu višestruko da se razlikuju od motora do motora, a uslovi vožnje u Beogradu (gužve, prašina, letnje temperature blizu četrdeset stepeni) gotovo uvek spadaju u otežane uslove eksploatacije, za koje važe kraći intervali. Na osnovu toga određujemo šta je vašem automobilu zaista potrebno na trenutnoj kilometraži.

        Usput proveravamo i ono čega se vozači obično sete prekasno: stanje zupčastog kaiša ili lanca, sadržaj vlage u kočionoj tečnosti, tačku smrzavanja antifriza i istrošenost pločica i diskova, izraženu u milimetrima.
      includesHeading: Šta je uključeno
      includes:
        - Ulje i filter ulja prema specifikaciji proizvođača
        - Filter vazduha, filter kabine i svećice prema servisnom planu
        - Provera sadržaja vlage u kočionoj tečnosti
        - Provera antifriza i njegove tačke smrzavanja
        - Merenje preostale debljine pločica i diskova u milimetrima
        - Upis svih radova i kilometraže u servisnu evidenciju
      signsHeading: Kada je vreme da dođete
      signs:
        - Dostigli ste predviđenu kilometražu ili je prošla godina od poslednjeg servisa
        - Tek ste kupili automobil, a nemate servisnu istoriju
        - Spremate se za duži put
        - Upalio se indikator za servis
      honestHeading: Šta ne radimo
      honest: Ne menjamo delove pre vremena. Ako je filter tek na polovini svog radnog veka, nećemo ga dirati i reći ćemo vam kada da dođete.
    brakes-suspension:
      name: Kočnice i trap
      short: Sve od čega zavisi da li će se automobil zaustaviti na vreme.
      metaTitle: Popravka kočnica i trapa u Beogradu | CarLab
      metaDescription: 'Kočnice i trap u Beogradu: pločice, diskovi, kočiona klešta, viljuške i reglaža trapa. Merenja u milimetrima, predračun pre početka radova.'
      heroEyebrow: Trap
      heroTitle: Ovde se preostali vek meri u milimetrima
      heroLead: 'Sa problemom na motoru ponekad možete stići do servisa. Sa neispravnim kočnicama ne smete rizikovati. Zato kod kočnica i trapa ne zaokružujemo mere i ne odlažemo: ako je deo za zamenu, to kažemo otvoreno.'
      priceFrom: od 120 €
      duration: od 3 sata
      bodyHeading: Kako radimo
      body: |
        Počinjemo merenjem debljine diskova i pločica u milimetrima, proverom bacanja diskova i pregledom kočionih creva i klešta. Na trapu proveravamo zazore na dizalici i treskalici, a zatim pregledamo manžetne i nosače.

        Posle popravke trapa uvek radimo reglažu: čak i zamena jedne viljuške menja geometriju, a loša geometrija može da potroši komplet guma za jednu sezonu.
      includesHeading: Šta je uključeno
      includes:
        - Merenje diskova i pločica uz beleženje rezultata
        - Zamena pločica, diskova i kočionih creva, remont ili zamena kočionih klešta
        - Odzračivanje kočionog sistema i zamena kočione tečnosti
        - Amortizeri, opruge, viljuške, silen blokovi, nosači i ležajevi
        - Reglaža trapa posle svake intervencije na vešanju
        - Kontrolna probna vožnja pre predaje vozila
      signsHeading: Kada je vreme da dođete
      signs:
        - Škripanje, cviljenje ili struganje pri kočenju
        - Pedala kočnice je postala mekana ili propada
        - Automobil vuče u stranu pri kočenju
        - Lupanje na neravninama, neprecizan volan ili neravnomerno trošenje guma
      honestHeading: Na šta ćemo vas upozoriti
      honest: Pločice i diskovi su potrošni delovi koji rade zajedno. Nove pločice mogu da se postave na istrošene diskove, ali će se tako brže potrošiti i za pola godine ćete ponovo doći. Izračunaćemo cenu obe opcije i prepustiti izbor vama.
    engine-gearbox:
      name: Motor i menjač
      short: Od zamene dihtunga do popravke uz rastavljanje, sa jasnim predračunom.
      metaTitle: Popravka motora i menjača u Beogradu | CarLab
      metaDescription: 'Popravka motora i menjača u Beogradu: zupčasti kaiš i lanac, dihtunzi, kvačilo, ulje u automatskom menjaču. Dijagnostika pre rastavljanja, predračun pre radova.'
      heroEyebrow: Pogonski sklop
      heroTitle: Generalna popravka je ređe potrebna nego što se priča
      heroLead: 'Pre nego što bilo šta rastavimo, proveravamo sve što može bez otvaranja: kompresiju, pritisak ulja, greške i curenja.'
      priceFrom: prema rezultatima dijagnostike
      duration: od 1 dana
      bodyHeading: Kako radimo
      body: |
        Prvo merimo i proveravamo: kompresiju po cilindrima, pritisak ulja, stanje svećica, greške u upravljačkim jedinicama i curenja pod pritiskom. Tek onda odlučujemo da li motor treba otvarati.

        Kod menjača proveravamo stanje ulja i kako menja brzine: veliki deo „kvarova“ automatskih menjača rešava se pravilnim servisiranjem, a ne zamenom celog sklopa. Ako je popravka ipak potrebna, dobijate predračun sa odvojeno navedenim radom i delovima pre nego što bilo šta skinemo.
      includesHeading: Šta je uključeno
      includes:
        - Merenje kompresije i pritiska ulja
        - Provera curenja pod pritiskom i uvlačenja falš vazduha
        - Zamena zupčastog kaiša ili lanca razvoda, rolera i vodene pumpe
        - Dihtunzi, semerinzi i gumice ventila
        - Kvačilo, zamajac i zamena ulja u manuelnim i automatskim menjačima
        - Detaljan predračun pre početka rastavljanja
      signsHeading: Kada je vreme da dođete
      signs:
        - Motor troši ulje između zamena
        - Lupanje, vibracije ili gubitak snage
        - Trzaji i kašnjenje pri promeni brzina
        - Dim iz auspuha koji se ranije nije pojavljivao
      honestHeading: Kada savetujemo da odustanete od popravke
      honest: Ako se cena popravke približava vrednosti automobila, to ćemo vam reći. Nekad je bolje prodati ga u zatečenom stanju ili potražiti polovan motor ili menjač, nego uložiti u popravku novac koji nikada nećete povratiti.
    bodywork-painting:
      name: Limarija i farbanje
      short: Popravka posle udesa, ispravljanje geometrije karoserije i farbanje uz uklapanje nijanse.
      metaTitle: Limarija i farbanje posle udesa u Beogradu | CarLab
      metaDescription: 'Limarija u Beogradu: izvlačenje na stolu, merenje geometrije, ispravljanje i farbanje uz kompjutersko uklapanje boje. Radimo sa osiguranjem i pomažemo oko papira.'
      heroEyebrow: Posle udesa
      heroTitle: Da se na automobilu ne vide tragovi udesa
      heroLead: Dobra limarska popravka ne primećuje se ni golim okom ni meračem debljine laka pri pregledu pre prodaje.
      priceFrom: nakon pregleda
      duration: od 3 dana
      bodyHeading: Šta obuhvata popravka
      body: |
        Prvo merimo geometriju karoserije: posle udarca pomeranja mogu da postoje i tamo gde sve izgleda neoštećeno, a upravo ona kasnije izazivaju neravnomerno trošenje guma i zanošenje vozila. Po potrebi vozilo postavljamo na sto za izvlačenje i ispravljamo prema kontrolnim tačkama.

        Boju biramo na dva načina: prema šifri iz dokumentacije i spektrofotometrom prema stvarnoj nijansi, jer posle pet godina na suncu fabrička boja više nije ista kao u katalogu. Prelaz poliramo tako da se granica ne vidi ni na suncu ni pod lampom.
      includesHeading: Šta je uključeno
      includes:
        - Merenje geometrije karoserije prema kontrolnim tačkama
        - Izvlačenje na stolu kada je geometrija pomerena
        - Ispravljanje limarije i zamena oštećenih delova
        - Uklapanje boje prema šifri i spektrofotometrom
        - Farbanje u komori uz kontrolu temperature
        - Poliranje prelaza i montaža uz proveru zazora
      signsHeading: Kada je vreme da dođete
      signs:
        - Automobil je imao udes, čak i ako oštećenja deluju sitno
        - Neujednačeni zazori između delova karoserije
        - Automobil vuče u stranu, gume se troše po jednoj ivici
        - Želite da sredite limariju pre prodaje
      honestHeading: O osiguranju
      honest: Sarađujemo sa osiguravajućim kućama i pomažemo oko dokumentacije, ali ne obećavamo da će osiguranje pokriti sve. Odmah posle pregleda pokazujemo koja oštećenja ulaze u prijavljenu štetu, a koja ne, da to ne biste saznali tek na kraju.
    pre-purchase-inspection:
      name: Pregled pre kupovine
      short: Merač debljine laka, dizalica i dijagnostika pre nego što platite automobil.
      metaTitle: Pregled automobila pre kupovine u Beogradu | CarLab
      metaDescription: 'Pregled pre kupovine u Beogradu: merenje debljine laka, dizalica, dijagnostika i kompresija. Pisani izveštaj i argumenti za pregovore o ceni.'
      heroEyebrow: Pre kupovine
      heroTitle: Merač debljine laka otkriva ono što prodavac prećuti
      heroLead: Prefarbani delovi, tragovi varenja, vraćena kilometraža, curenja ispod vozila. Za sat vremena na dizalici to se vidi, iako u oglasu ne piše.
      priceFrom: od 60 €
      duration: oko 1 sat
      bodyHeading: Šta proveravamo
      body: |
        Karoseriju proveravamo meračem debljine laka na svim panelima: prefarbane delove, git, tragove varenja i zazore. Zatim vozilo ide na dizalicu: proveravamo trap, curenja, stanje izduvnog sistema i zaštite podvozja, kao i tragove udaraca odozdo.

        Elektronika: očitavanje grešaka iz svih upravljačkih jedinica, uz proveru tragova vraćanja kilometraže i brisanja grešaka. Na motoru proveravamo kompresiju i curenja. Na kraju dobijate pisani izveštaj sa spiskom uočenih nedostataka i procenom troškova otklanjanja, koji vam daje argumente za pregovore o ceni.
      includesHeading: Šta je uključeno
      includes:
        - Merenje debljine laka na svim panelima karoserije
        - Pregled na dizalici, provera curenja i tragova udaraca
        - Očitavanje grešaka iz svih elektronskih upravljačkih jedinica
        - Merenje kompresije po cilindrima
        - Provera znakova vraćene kilometraže
        - Pisani izveštaj sa procenom troškova otklanjanja nedostataka
      signsHeading: Kada je pregled potreban
      signs:
        - Kupujete polovan automobil od privatnog lica
        - Prodavac vas požuruje da odlučite
        - Automobil je iz uvoza, a istorija mu je nepoznata
        - Cena je sumnjivo niža od tržišne
      honestHeading: Šta pregled ne može da garantuje
      honest: Iskreno ćemo vam reći šta vidimo, ali nijedan pregled ne otkriva sve. Skriveni kvar koji se ne pokazuje ni na dizalici ni na dijagnostici može da se pojavi kasnije. To je ograničenje samog pregleda, a ne ograda sitnim slovima.
    vin-parts-inquiry:
      name: Pronalaženje rezervnih delova
      short: Pronalazimo delove koji odgovaraju vašem automobilu i dajemo cenu pre kupovine.
      metaTitle: Auto-delovi po VIN broju u Beogradu - CarLab
      metaDescription: 'Auto-delovi po VIN broju ili broju šasije u Beogradu: originalni i provereni zamenski delovi, provera kompatibilnosti i cena unapred. Preuzimanje u servisu CarLab.'
      heroEyebrow: Rezervni delovi
      heroTitle: Pronaći ćemo delove koji sigurno odgovaraju vašem autu
      heroLead: Pošaljite VIN ili broj šasije i napišite šta vam treba. Proverićemo da li delovi odgovaraju, pronaći originalne i proverene zamenske delove i ponuditi najbolje opcije.
      priceFrom: cenu dajemo nakon pronalaženja delova
      duration: zavisi od dostupnosti kod dobavljača
      bodyHeading: Kako pronalazimo odgovarajuće delove
      body: |
        Na osnovu VIN broja utvrđujemo tačnu specifikaciju vozila: motor, menjač, godište i tržište za koje je proizvedeno. Od toga zavisi koji deo odgovara, čak i kada je model isti.

        Zatim pronalazimo originalni kataloški broj dela i proverene zamenske delove, upoređujemo cene i rokove isporuke kod dobavljača i nudimo vam nekoliko opcija. Vi birate, mi poručujemo, a delove možete preuzeti u našem servisu u Beogradu.

        Ako vam je potrebna i ugradnja, i to možete obaviti kod nas: već smo proverili da deo odgovara vašem vozilu, a majstor zna šta ugrađuje.
      includesHeading: Šta je uključeno
      includes:
        - Provera da li deo odgovara vozilu na osnovu VIN broja ili broja šasije
        - Pronalaženje originalnog kataloškog broja dela
        - Izbor proverenih zamenskih delova u različitim cenovnim rangovima
        - Cena i rok isporuke pre bilo kakvog plaćanja
        - Lično preuzimanje u servisu u Beogradu
      signsHeading: Kada je pregled potreban
      signs:
        - Ne znate tačan naziv ili kataloški broj dela
        - Brinete da ćete kupiti deo koji ne odgovara vašem vozilu
        - Potrebnog dela nema u katalogu na sajtu
        - Želite da uporedite cene originalnih i zamenskih delova
      honestHeading: Šta ne obećavamo
      honest: Nije svaki deo moguće nabaviti odmah i po niskoj ceni. Ako je deo redak ili se posebno poručuje, jasno ćemo vam reći cenu i rok isporuke pre kupovine. Ako nema odgovarajućeg zamenskog dela, nećemo vam nuditi nešto što ne odgovara vašem vozilu.
  en:
    indexMetaTitle: Car repairs and servicing in Belgrade | CarLab
    indexMetaDescription: Diagnostics, servicing, oil changes, brakes, suspension, engine and gearbox repairs, accident repairs, pre-purchase checks and VIN parts matching. Costs and times.
    indexEyebrow: Services
    indexHeading: Everything your car needs, under one roof
    indexLead: Each service has its own page explaining what's included, how long it takes, the signs it's time to visit and when we'll honestly tell you no work is needed.
    specsPriceLabel: Price
    specsDurationLabel: Time
    diagnostics:
      name: Computer diagnostics
      short: We find the cause behind the fault code.
      metaTitle: Car diagnostics in Belgrade | CarLab
      metaDescription: Engine, suspension and electrical diagnostics in Belgrade. Free fault code reading, with the cause shown to you on your car.
      heroEyebrow: Diagnostics
      heroTitle: A fault code is a symptom, not a diagnosis
      heroLead: A scanner tells you which sensor is flagging a fault. It won't tell you whether the sensor itself is faulty or something is wrong with what it's measuring. That takes hands-on checks.
      priceFrom: free fault code reading
      duration: from 40 minutes
      bodyHeading: What we do during diagnostics
      body: |
        We start with a conversation: when it began, under what conditions and what work was done beforehand. Sometimes that already points to the cause: a knock only when cold and a constant knock can come from different components.

        Next, we scan all control modules. A fault in the ABS or body control module can often explain the driver's complaint. Then we check the car itself: on the lift, checking for play and inspecting components under load, with pressure tests and an oscilloscope where needed.

        Finally, we show you the cause on the car and explain it in plain English. If repairs are needed, we prepare an estimate straight away.

        What it costs: fault code reading is free. Diagnostic charges only apply if we need to dismantle a component or put the car on a test rig. We tell you the price before starting, not at the end.
      includesHeading: What's included
      includes:
        - Discussion of symptoms and service history
        - Fault code reading from all electronic control modules
        - Inspection on the lift, checking for play and leaks
        - Road test with a technician if the fault occurs while driving
        - Verbal explanation of findings and a written repair estimate
      signsHeading: When to book in
      signs:
        - The check engine light or another dashboard warning is on
        - The car judders, misfires or struggles to start
        - Fuel consumption has increased for no obvious reason
        - There's a new noise and you can't tell where it's coming from
      honestHeading: What we can't promise
      honest: Not every fault can be found in forty minutes. Intermittent problems that appear once a week sometimes need a second visit, or you may need to leave the car with us for a day. We'll tell you upfront and won't replace parts one by one at your expense.
    servicing:
      name: Scheduled servicing
      short: Oil, filters, fluids and checks to suit your engine's service schedule.
      metaTitle: Car servicing and oil changes in Belgrade | CarLab
      metaDescription: "Car servicing in Belgrade: oil, filters, spark plugs, brake fluid and coolant. Following the manufacturer's schedule, with all work recorded."
      heroEyebrow: Servicing
      heroTitle: The cheapest repair is the one you never need
      heroLead: Every engine has its own service interval and oil specification. We check the manual for your car and follow it, rather than applying a blanket 'every 10,000 km' rule.
      priceFrom: from €90
      duration: 2–4 hours
      bodyHeading: How we determine your car's service interval
      body: |
        Replacement intervals vary widely between engines. Belgrade's conditions, with traffic jams, dust and summer temperatures close to 40°C, almost always qualify as severe operating conditions, calling for shorter intervals. We use those schedules to work out what your car actually needs at its current mileage.

        We also check the things that often get forgotten until it's too late: timing belt or chain condition, moisture in the brake fluid, coolant freeze protection and brake pad and disc wear, measured in millimetres.
      includesHeading: What's included
      includes:
        - Engine oil and oil filter meeting your manufacturer's specifications
        - Air filter, cabin filter and spark plugs as scheduled
        - Brake fluid moisture test
        - Coolant condition and freeze protection check
        - Measurement of remaining brake pad and disc thickness in millimetres
        - All work and mileage recorded in the service record
      signsHeading: When to book in
      signs:
        - You've reached the mileage limit or it's been a year since the last service
        - You've just bought the car and it has no service history
        - You have a long journey coming up
        - The service reminder light has come on
      honestHeading: What we don't do
      honest: We don't replace things before they're due. If a filter is only halfway through its service life, we'll leave it alone and tell you when to come back.
    brakes-suspension:
      name: Brakes and suspension
      short: Everything that makes the difference between stopping and not stopping.
      metaTitle: Brake and suspension repairs in Belgrade | CarLab
      metaDescription: 'Brakes and suspension in Belgrade: pads, discs, calipers, suspension arms and wheel alignment. Measured in millimetres, with an estimate before work starts.'
      heroEyebrow: Brakes and suspension
      heroTitle: Here, remaining life is measured in millimetres
      heroLead: "You might nurse an engine to the workshop. You can't take that chance with brakes. We don't round up measurements or put off essential work: if a component is worn out, we say so."
      priceFrom: from €120
      duration: from 3 hours
      bodyHeading: How we work
      body: |
        We start with measurements: disc and pad thickness in millimetres, disc runout, and the condition of brake hoses and calipers. We check suspension play on the lift and on a suspension test rig, then inspect dust boots and mounts.

        We always carry out wheel alignment after suspension repairs. Even replacing one suspension arm changes the geometry, and incorrect alignment can wear out a set of tyres in a single season.
      includesHeading: What's included
      includes:
        - Brake disc and pad measurements, with results recorded
        - Replacement of pads, discs and hoses, plus caliper repair or replacement
        - Brake bleeding and fluid replacement
        - Struts, springs, suspension arms, bushes, mounts and bearings
        - Wheel alignment after any suspension work
        - Final road test before handover
      signsHeading: When to book in
      signs:
        - Squeaking, squealing or grinding when braking
        - The brake pedal feels soft or sinks
        - The car pulls to one side when braking
        - Knocking over bumps, vague steering or uneven tyre wear
      honestHeading: What we'll point out
      honest: Pads and discs are wear items that work together. New pads can be fitted to worn discs, but they'll wear out sooner and you could be back in six months. We'll price up both options and leave the choice to you.
    engine-gearbox:
      name: Engine and gearbox
      short: From gasket replacement to a full strip-down and repair, with a clear estimate.
      metaTitle: Engine and gearbox repairs in Belgrade | CarLab
      metaDescription: 'Engine and transmission repairs in Belgrade: timing belts and chains, gaskets, clutches and automatic gearbox oil changes. Diagnosis and estimate before work.'
      heroEyebrow: Engine and transmission
      heroTitle: An engine rebuild is needed less often than you might think
      heroLead: 'Before taking anything apart, we check what we can from the outside: compression, oil pressure, fault codes and leaks.'
      priceFrom: quoted after diagnostics
      duration: from 1 day
      bodyHeading: How we work
      body: |
        We start with checks: compression in each cylinder, oil pressure, spark plug condition, fault codes across control modules and pressure tests for leaks. Only then do we decide whether the engine needs to come apart.

        For gearboxes, we check the oil condition and how they shift. Many automatic gearbox problems can be resolved with proper servicing rather than replacing the whole unit. If repairs are needed, you receive an estimate itemising labour and parts before anything is removed.
      includesHeading: What's included
      includes:
        - Compression and oil pressure tests
        - Pressure testing for leaks and checking for intake air leaks
        - Timing belt or chain, tensioner, idler and water pump replacement
        - Gaskets, oil seals and valve stem seals
        - Clutch and flywheel work, manual and automatic gearbox oil changes
        - Itemised estimate before dismantling
      signsHeading: When to book in
      signs:
        - Oil level drops between changes
        - Knocking, vibration or loss of power
        - Jerky or delayed gear changes
        - Exhaust smoke that was not there before
      honestHeading: When we advise against repairs
      honest: If the repair cost approaches the value of the car, we will tell you. Sometimes the right advice is to sell it as it is or look for a used replacement engine or gearbox, rather than spend money on repairs you will never recover.
    bodywork-painting:
      name: Bodywork and paint
      short: Accident repairs, chassis alignment and colour-matched respraying.
      metaTitle: Accident repairs and respraying in Belgrade | CarLab
      metaDescription: 'Body repairs in Belgrade: chassis alignment, panel beating and computer-matched respraying. We work with insurers and help with the paperwork.'
      heroEyebrow: After an accident
      heroTitle: So your car does not look like it has been in a crash
      heroLead: Good body repairs should be undetectable, whether checked by eye or with a paint thickness gauge during a pre-sale inspection.
      priceFrom: quoted after inspection
      duration: from 3 days
      bodyHeading: What the repairs include
      body: |
        We start by measuring the body alignment. An impact can cause distortion even where everything looks intact, leading to uneven tyre wear and the car pulling to one side. If needed, we put the car on a chassis alignment jig and pull it back into shape using the reference points.

        We match the colour in two ways: using the recorded paint code and measuring the actual finish with a spectrophotometer, because five years in the sun can change the original shade. We polish the blended area so the transition is invisible in sunlight or under workshop lighting.
      includesHeading: What's included
      includes:
        - Body alignment measurements at reference points
        - Chassis jig alignment and straightening where needed
        - Panel beating and replacement of damaged panels
        - Colour matching by paint code and spectrophotometer
        - Respraying in a temperature-controlled spray booth
        - Polishing blended areas and reassembly with panel gap checks
      signsHeading: When to book in
      signs:
        - The car has been in an accident, even if the damage looks minor
        - Uneven gaps between body panels
        - The car pulls to one side or tyres wear along one edge
        - You want to tidy up the bodywork before selling
      honestHeading: About insurance claims
      honest: We work with insurers and help with the paperwork, but we cannot promise that your insurer will cover everything. After the inspection, we explain straight away which damage falls within the claim and which does not, so there are no surprises at the end.
    pre-purchase-inspection:
      name: Pre-purchase inspection
      short: Paint thickness checks, a lift inspection and a diagnostic scan before you hand over any money.
      metaTitle: Pre-purchase car inspection in Belgrade | CarLab
      metaDescription: 'Pre-purchase checks in Belgrade: paint thickness, lift inspection, fault codes and compression. A written report to help you negotiate the price.'
      heroEyebrow: Before you buy
      heroTitle: A paint thickness gauge tells you what the seller will not
      heroLead: Resprayed panels, welding repairs, clocked mileage and leaks underneath. An hour on the lift can reveal what the advert leaves out.
      priceFrom: from €60
      duration: around 1 hour
      bodyHeading: What we check
      body: |
        We check every body panel with a paint thickness gauge, looking for resprays, filler, welding repairs and uneven panel gaps. Then the car goes on the lift to inspect the suspension, leaks, exhaust, underbody protection and signs of impact damage underneath.

        For the electronics, we scan all control modules for faults and look for signs of mileage tampering or cleared codes. We check engine compression and leaks. You receive a written report listing our findings and estimated repair costs, giving you a basis for negotiating the price.
      includesHeading: What's included
      includes:
        - Paint thickness measurements across all body panels
        - Lift inspection for leaks and signs of impact damage
        - Fault code reading from all electronic control modules
        - Compression test on each cylinder
        - Checks for signs of mileage tampering
        - Written report with estimated repair costs
      signsHeading: When you need it
      signs:
        - You are buying a car privately
        - The seller is rushing you into a decision
        - The car is imported and its history is unknown
        - The price is suspiciously below market value
      honestHeading: What an inspection cannot guarantee
      honest: We will tell you honestly what we find, but no inspection catches everything. A hidden fault that does not show up on the lift or during diagnostics may emerge later. That is a limitation of the inspection, not a disclaimer buried in the small print.
    vin-parts-inquiry:
      name: Parts sourcing
      short: We find parts that fit your car and quote the price before you buy.
      metaTitle: Car parts by VIN in Belgrade - CarLab
      metaDescription: 'Car parts by VIN or chassis number in Belgrade: genuine and trusted aftermarket options, fitment checks and upfront prices. Collect from CarLab.'
      heroEyebrow: Car parts
      heroTitle: We find the right parts for your car
      heroLead: Send us your VIN or chassis number and tell us what you need. We will check fitment, find genuine parts and trusted aftermarket alternatives, and recommend the best options.
      priceFrom: quoted once we find the right parts
      duration: depends on supplier availability
      bodyHeading: How we find the right parts
      body: |
        We use your VIN to identify your car's exact specification: engine, gearbox, year and the market it was built for. These details determine which part fits, even on the same model.

        We then look up the manufacturer's part number and reliable aftermarket alternatives, compare supplier prices and lead times, and offer you a few options. You choose, we order, and you collect the parts from our workshop in Belgrade.

        If you need fitting too, we can do that here: compatibility has already been checked, and the mechanic knows exactly what's being fitted.
      includesHeading: What's included
      includes:
        - Compatibility check using the VIN or chassis number
        - Original part number lookup
        - Reliable aftermarket alternatives at different price points
        - Price and lead time confirmed before you pay
        - Collection from our workshop in Belgrade
      signsHeading: When you need it
      signs:
        - You're unsure of the exact part name or number
        - You're worried about buying a part that won't fit
        - The part you need isn't in our online catalogue
        - You want to compare prices for genuine and aftermarket parts
      honestHeading: What we can't promise
      honest: Not every part is readily available or inexpensive. If a part is rare or needs to be specially ordered, we'll confirm the price and lead time before you buy. If there's no suitable aftermarket alternative, we won't offer you something that won't fit.
