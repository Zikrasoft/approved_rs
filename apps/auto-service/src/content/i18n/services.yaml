diagnostics:
  name: Компьютерная диагностика
  short: Находим, что стоит за кодом ошибки.
  metaTitle: Компьютерная диагностика автомобиля в Белграде — CarLab
  metaDescription: Диагностика двигателя, подвески и электрики в Белграде. Считывание ошибок бесплатно, причину показываем прямо на машине.
  heroEyebrow: Диагностика
  heroTitle: Код ошибки — это симптом, а не диагноз
  heroLead: Сканер скажет, какой датчик ругается. Виноват сам датчик или то, что он измеряет, сканер не покажет — это выясняется уже на машине.
  priceFrom: считывание ошибок — бесплатно
  duration: от 40 минут
  warranty: 12 месяцев на устранение
  bodyHeading: Что мы делаем на диагностике
  body: |
    Сначала разговор: когда началось, при каких условиях, что менялось до этого. Часть диагнозов ставится уже здесь: «стучит только на холодную» и «стучит постоянно» — это разные узлы.

    Потом сканер по всем блокам сразу: часто ошибка в ABS или в блоке комфорта объясняет то, на что жалуется водитель. Дальше — проверка на машине: подъёмник, люфты, осмотр под нагрузкой, при необходимости замер давления и осциллограф.

    В конце показываем причину на автомобиле и объясняем на пальцах. Если нужен ремонт, сразу считаем смету.

    Сколько это стоит: считывание ошибок — бесплатно. Платной диагностика становится только тогда, когда нужно разбирать узел или ставить машину на стенд, и цену мы называем до начала работ, а не в конце.
  includesHeading: Что входит
  includes:
    - Опрос по симптомам и истории обслуживания
    - Считывание ошибок по всем электронным блокам
    - Осмотр на подъёмнике, проверка люфтов и утечек
    - Тест-драйв с инженером, если проблема проявляется в движении
    - Устное заключение и письменная смета на ремонт
  signsHeading: Когда пора к нам
  signs:
    - Горит «чек» или другой значок на панели
    - Машина дёргается, троит или плохо заводится
    - Расход вырос без понятной причины
    - Появился новый звук, и вы не понимаете откуда
  honestHeading: Что мы не обещаем
  honest: Не каждая неисправность ловится за сорок минут. Плавающие проблемы, которые появляются раз в неделю, иногда требуют повторного визита или оставить машину на день — мы скажем об этом сразу и не станем менять детали по очереди за ваш счёт.
servicing:
  name: Плановое ТО
  short: Масло, фильтры, жидкости и осмотр — по регламенту вашего двигателя.
  metaTitle: Плановое ТО и замена масла в Белграде — CarLab
  metaDescription: 'Техническое обслуживание автомобиля в Белграде: масло, фильтры, свечи, тормозная жидкость, антифриз. По регламенту производителя, с записью в сервисную карту.'
  heroEyebrow: Обслуживание
  heroTitle: Самая дешёвая починка — та, которой не случилось
  heroLead: У каждого мотора свой интервал и свой допуск по маслу. Мы смотрим мануал на вашу машину и делаем то, что написано там, а не среднее «раз в десять тысяч».
  priceFrom: от 90 €
  duration: 2–4 часа
  warranty: 12 месяцев
  bodyHeading: Откуда берётся интервал для вашей машины
  body: |
    Интервалы замены у разных моторов отличаются в разы, а условия Белграда — пробки, пыль, лето под сорок — почти всегда попадают под «тяжёлые условия эксплуатации» с укороченным интервалом. По ним и считаем, что реально нужно вашей машине на этом пробеге.

    Заодно проверяем то, что обычно вспоминают слишком поздно: состояние ремня или цепи, тормозную жидкость на влагу, антифриз на температуру замерзания, износ колодок и дисков в миллиметрах.
  includesHeading: Что входит
  includes:
    - Масло и масляный фильтр с допуском вашего производителя
    - Воздушный и салонный фильтр, свечи по регламенту
    - Проверка тормозной жидкости на содержание влаги
    - Проверка антифриза и его температуры замерзания
    - Замер остатка колодок и дисков в миллиметрах
    - Запись всех работ и пробега в сервисную карту
  signsHeading: Когда пора к нам
  signs:
    - Подошёл пробег или год с прошлого ТО
    - Машина только куплена, а истории обслуживания нет
    - Впереди дальняя дорога
    - Загорелась лампа сервисного интервала
  honestHeading: Что мы не делаем
  honest: Не меняем то, чему ещё рано. Если фильтр отработал половину ресурса, мы его не тронем и скажем, когда приезжать.
brakes-suspension:
  name: Тормоза и подвеска
  short: Всё, что отвечает за то, остановится машина или нет.
  metaTitle: Ремонт тормозов и подвески в Белграде — CarLab
  metaDescription: 'Тормоза и подвеска в Белграде: колодки, диски, суппорты, рычаги, развал-схождение. Замеры в миллиметрах, смета до работ, гарантия 12 месяцев.'
  heroEyebrow: Ходовая
  heroTitle: Здесь ресурс считают в миллиметрах
  heroLead: 'Мотор можно дотянуть до сервиса. Тормоза — нет. Поэтому по ходовой мы не округляем и не тянем: если ресурс кончился, говорим прямо.'
  priceFrom: от 120 €
  duration: от 3 часов
  warranty: 12 месяцев
  bodyHeading: Как мы это делаем
  body: |
    Начинаем с замеров: толщина дисков и колодок в миллиметрах, биение, состояние шлангов и суппортов. По подвеске — проверка люфтов на подъёмнике и на вибростенде, осмотр пыльников и опор.

    После ремонта ходовой всегда делаем развал-схождение: даже замена одного рычага меняет геометрию, а неправильная геометрия съедает комплект резины за сезон.
  includesHeading: Что входит
  includes:
    - Замер дисков и колодок с записью результата
    - Замена колодок, дисков, шлангов, ремонт или замена суппортов
    - Прокачка и замена тормозной жидкости
    - Стойки, пружины, рычаги, сайлентблоки, опоры и подшипники
    - Развал-схождение после любого вмешательства в подвеску
    - Контрольный тест-драйв перед выдачей
  signsHeading: Когда пора к нам
  signs:
    - Скрип, писк или скрежет при торможении
    - Педаль стала мягкой или проваливается
    - Машину уводит в сторону при торможении
    - Стуки на неровностях, «плавающий» руль, неравномерный износ резины
  honestHeading: О чём предупредим
  honest: Колодки и диски — расходник, который ходит парой. Ставить новые колодки на изношенные диски можно, но ресурс колодок при этом падает, и через полгода вы приедете снова. Мы посчитаем оба варианта и оставим выбор вам.
engine-gearbox:
  name: Двигатель и коробка
  short: От замены прокладки до ремонта с разбором — с понятной сметой.
  metaTitle: Ремонт двигателя и коробки передач в Белграде — CarLab
  metaDescription: 'Ремонт двигателя и трансмиссии в Белграде: ГРМ, прокладки, сцепление, замена масла в АКПП. Диагностика до разбора, смета до работ, гарантия 12 месяцев.'
  heroEyebrow: Силовой агрегат
  heroTitle: «Капиталка» нужна не так часто, как её называют
  heroLead: 'Прежде чем что-то разбирать, мы проверяем то, что проверяется снаружи: компрессию, давление масла, ошибки, утечки.'
  priceFrom: по результатам диагностики
  duration: от 1 дня
  warranty: 12 месяцев
  bodyHeading: Порядок работы
  body: |
    Сначала измеряем: компрессия по цилиндрам, давление масла, состояние свечей, ошибки по блокам, утечки под давлением. Только после этого решаем, нужно ли вскрывать мотор.

    По коробкам смотрим состояние масла и логику переключений — у автоматов большая часть «поломок» лечится корректным обслуживанием, а не заменой агрегата. Если ремонт всё же нужен, вы получаете смету с разбивкой на работу и запчасти до того, как что-то снято.
  includesHeading: Что входит
  includes:
    - Замер компрессии и давления масла
    - Проверка на утечки под давлением, поиск подсоса воздуха
    - Замена ремня или цепи ГРМ, роликов и помпы
    - Прокладки, сальники, маслосъёмные колпачки
    - Сцепление, маховик, замена масла в механике и автомате
    - Смета с разбивкой до начала разбора
  signsHeading: Когда пора к нам
  signs:
    - Масло уходит между заменами
    - Стук, вибрация или потеря тяги
    - Рывки и задержки при переключении передач
    - Дым из выхлопа, которого раньше не было
  honestHeading: Когда мы отговариваем
  honest: Если стоимость ремонта подходит к стоимости машины, мы это скажем. Иногда правильный совет — продать как есть или искать контрактный агрегат, а не вкладывать в ремонт сумму, которую машина никогда не вернёт.
bodywork-painting:
  name: Кузов и покраска
  short: Восстановление после ДТП, правка геометрии и покраска с подбором цвета.
  metaTitle: Кузовной ремонт и покраска после ДТП в Белграде — CarLab
  metaDescription: 'Кузовной ремонт в Белграде: стапель, замер геометрии, рихтовка, покраска с компьютерным подбором цвета. Работаем со страховыми, помогаем с документами.'
  heroEyebrow: После ДТП
  heroTitle: Чтобы машина не выглядела «после удара»
  heroLead: Хороший кузовной ремонт не видно ни глазом, ни толщиномером на осмотре перед продажей.
  priceFrom: по результатам осмотра
  duration: от 3 дней
  warranty: 12 месяцев на покрытие
  bodyHeading: Что входит в восстановление
  body: |
    Сначала замеряем геометрию кузова: после удара смещения бывают там, где визуально всё цело, и именно они потом дают неравномерный износ резины и увод машины. При необходимости ставим на стапель и вытягиваем по контрольным точкам.

    Цвет подбираем дважды — по коду из документов и спектрофотометром по факту, потому что за пять лет на солнце заводской цвет уходит от паспортного. Переход полируем так, чтобы граница не читалась ни на солнце, ни под лампой.
  includesHeading: Что входит
  includes:
    - Замер геометрии кузова по контрольным точкам
    - Стапель и вытяжка при смещениях
    - Рихтовка, замена повреждённых элементов
    - Подбор цвета по коду и спектрофотометром
    - Покраска в камере с контролем температуры
    - Полировка перехода и сборка с проверкой зазоров
  signsHeading: Когда пора к нам
  signs:
    - Было ДТП, даже если повреждения выглядят мелкими
    - Неравномерные зазоры между деталями кузова
    - Машину уводит, резина изнашивается «в один край»
    - Нужно привести кузов в порядок перед продажей
  honestHeading: О страховых
  honest: Мы работаем со страховыми и помогаем с документами, но не обещаем, что страховая покроет всё. После осмотра мы сразу показываем, что попадает в страховой случай, а что нет, чтобы вы не узнали об этом в конце.
pre-purchase-inspection:
  name: Проверка перед покупкой
  short: Толщиномер, подъёмник и сканер до того, как вы отдали деньги.
  metaTitle: Проверка автомобиля перед покупкой в Белграде — CarLab
  metaDescription: 'Техническая проверка перед покупкой в Белграде: толщиномер, подъёмник, диагностика ошибок, компрессия. Письменное заключение и торг в вашу пользу.'
  heroEyebrow: Перед сделкой
  heroTitle: Что покажет толщиномер, продавец не расскажет
  heroLead: Перекрашенные панели, следы сварки, скрученный пробег, утечки снизу — за час на подъёмнике это видно, хотя в объявлении об этом не пишут.
  priceFrom: от 60 €
  duration: около 1 часа
  warranty: письменное заключение
  bodyHeading: Что мы проверяем
  body: |
    Кузов — толщиномером по всем панелям: перекрашенные элементы, шпаклёвка, следы сварки, состояние зазоров. Дальше подъёмник: подвеска, утечки, состояние выхлопа и защиты, следы ударов снизу.

    Электроника — считывание ошибок по всем блокам, включая скрученные и стёртые. По мотору — компрессия и утечки. В конце вы получаете письменное заключение со списком найденного и оценкой стоимости устранения, с которым можно торговаться.
  includesHeading: Что входит
  includes:
    - Замер толщины лака по всем панелям кузова
    - Осмотр на подъёмнике, проверка на утечки и следы ударов
    - Считывание ошибок по всем электронным блокам
    - Замер компрессии по цилиндрам
    - Проверка на признаки скрученного пробега
    - Письменное заключение с оценкой стоимости устранения
  signsHeading: Когда это нужно
  signs:
    - Покупаете машину с рук
    - Продавец торопит с решением
    - Машина привезена из-за границы, история неизвестна
    - Цена подозрительно ниже рынка
  honestHeading: Чего проверка не даёт
  honest: Мы честно скажем, что видим, но проверка не заменяет гарантию. Скрытый дефект, который не проявляется ни на подъёмнике, ни на диагностике, может всплыть позже — это ограничение метода, а не оговорка мелким шрифтом.
translations:
  sr:
    indexMetaTitle: 'Usluge autoserivisa u Beogradu: popravka i TO - CarLab'
    indexMetaDescription: Dijagnostika, TO i zamena ulja, kočnice i ogibljenje, motor i menjač, karoserijski popravak posle udesa, provera pre kupovine. Cene, rokovi, garancija.
    indexEyebrow: Usluge
    indexHeading: Sve što treba vašem automobilu na jednom mestu
    indexLead: Za svaku uslugu postoji posebna stranica — šta obuhvata, koliko traje, na koje znakove treba da obratite pažnju i kada iskreno kažemo šta ne trebate raditi.
    specsPriceLabel: Cena
    specsDurationLabel: Rok
    specsWarrantyLabel: Garancija
    diagnostics:
      name: Kompjuterska dijagnostika
      short: Otkrivamo šta se krije iza greške.
      metaTitle: Kompjuterska dijagnostika automobila u Beogradu - CarLab
      metaDescription: Dijagnostika motora, ogibljenja i elektrike u Beogradu. Čitanje grešaka besplatno, uz prikazivanje uzroka direktno na automobilu.
      heroEyebrow: Dijagnostika
      heroTitle: Kod greške je simptom, a ne dijagnoza
      heroLead: Skener će reći koji senzor pravi probleme. Da li je u pitanju senzor ili ono što meri, skener ne može pokazati — to se utvrđuje na licu mesta.
      priceFrom: čitanje grešaka - besplatno
      duration: od 40 minuta
      warranty: 12 meseci za otklanjanje
      bodyHeading: Šta radimo na dijagnostici
      body: |-
        Prvo razgovaramo: kada je počelo, pod kojim uslovima, šta se menjao pre toga. Neki dijagonza se postavlja već ovde: „zvuk se čuje samo kad je hladno” i „zvuk se čuje stalno” — to su različiti sklopovi.

        Zatim skener prolazi kroz sve module: često greška u ABS-u ili komfor modu objašnjava ono na šta se vozač žali. Dalje — proveravamo na automobilu: dizalica, luftovi, inspekcija pod opterećenjem, po potrebi merenje pritiska i oscilograf.
      includesHeading: Šta uključuje
      includes:
        - Sprovedeni razgovor o simptomima i istoriji servisiranja
        - Čitanje grešaka iz svih elektronskih modula
        - Inspekcija na dizalici, provere luftova i curenja
        - Test-vožnja sa tehničarom, ako se problem javlja u vožnji
        - Usmeno izveštavanje i pisana procena troškova za popravku
      signsHeading: Kada je vreme da dođete kod nas
      signs:
        - Gori „check” ili druga lampica na kontrolnoj tabli
        - Automobil se trese, radi na troje ili slabo startuje
        - Potrošnja je porasla bez vidnog razloga
        - Pojavio se novi zvuk, a ne znate odakle dolazi
      honestHeading: Šta ne obećavamo
      honest: Nije svaka kvar će se uočiti za četrdeset minuta. Nestabilni problemi, koji se pojavljuju jednom nedeljno, ponekad zahtevaju ponovni poset ili ostavljanje automobila na dan — odmah ćemo vas obavestiti o tome i nećemo menjati delove redom na vaš račun.
    servicing:
      name: Planirano TO
      short: Ulje, filteri, tečnosti i inspekcija - prema standardima vašeg motora.
      metaTitle: Planirano TO i zamena ulja u Beogradu - CarLab
      metaDescription: 'Tehničko održavanje automobila u Beogradu: ulje, filteri, sveće, kočiona tečnost, antifriz. Prema standardima proizvođača, uz upisivanje u servisnu knjižicu.'
      heroEyebrow: Servisiranje
      heroTitle: Najjeftinija popravka je ona koja nije bila potrebna
      heroLead: Svaki motor ima svoj interval i svoja pravila za ulje. Mi proveravamo priručnik za vaš automobil i radimo ono što piše tamo, a ne srednje „svakih deset hiljada”.
      priceFrom: od 90 €
      duration: 2–4 sata
      warranty: 12 meseci
      bodyHeading: Odakle potiče interval za vaš automobil
      body: |-
        Intervalli zamene se kod različitih motora drastično razlikuju, a uslovi u Beogradu — gužve, prašina, leti pod četrdeset — gotovo uvek spadaju pod „teške uslove korišćenja” sa skraćenim intervalom. Po njima procenjujemo šta je zaista potrebno vašem automobilu na ovoj pređenoj kilometraži.

        Takođe proveravamo ono što se obično setimo prekasno: stanje remena ili lanca, kočionu tečnost na vlagu, antifriz na temperaturu smrzavanja, trošenje pakni i diskova u milimetrima.
      includesHeading: Šta uključuje
      includes:
        - Ulje i filter za ulje prema standardu vašeg proizvođača
        - Zračni i kabinski filter, sveće prema specifikacijama
        - Provera kočione tečnosti na sadržaj vlage
        - Provera antifriza i njegove temperature smrzavanja
        - Merenje preostalog materijala pakni i diskova u milimetrima
        - Upisivanje svih radova i kilometraže u servisnu knjižicu
      signsHeading: Kada je vreme da dođete kod nas
      signs:
        - Prošao kilometraža ili godina od poslednjeg TO
        - Automobil je tek kupljen, a istorija servisiranja nije dostupna
        - Ima daleki put pred sobom
        - Zasvetlela lampica servisnog intervala
      honestHeading: Šta ne radimo
      honest: Ne menjamo ono što o tome još nije vreme. Ako je filter odradio polovinu svog resursa, nećemo ga menjati i reći ćemo kada da dođete.
    brakes-suspension:
      name: Kočnice i ogibljenje
      short: Sve što čini da se automobil zaustavi ili ne.
      metaTitle: Popravka kočnica i ogibljenja u Beogradu - CarLab
      metaDescription: 'Kočnice i ogibljenje u Beogradu: pakne, diskovi, klipovi, poluge, geometrija. Merenje u milimetrima, troškovnik pre radova, garancija 12 meseci.'
      heroEyebrow: Hodna
      heroTitle: Ovde se resurs meri u milimetrima
      heroLead: 'Motor može da se odloži. Kočnice — ne. Zato kod ogibljenja ne zaobilažimo i ne odlažemo: ukoliko je resurs istekao, govorit ćemo otvoreno.'
      priceFrom: od 120 €
      duration: od 3 sata
      warranty: 12 meseci
      bodyHeading: Kako to radimo
      body: |-
        Počinjemo s merenjima: debljina diskova i pakni u milimetrima, vibracije, stanje creva i klipova. Kod ogibljenja — provere luftova na dizalici i na vibracionoj platformi, pregled zaštitnika i nosača.

        Nakon popravke ogibljenja uvek radimo geometriju: čak i zamena jedne poluge menja geometriju, a pogrešna geometrija troši set guma za sezonu.
      includesHeading: Šta uključuje
      includes:
        - Merenje diskova i pakni sa zabeleženom vrednošću
        - Zamena pakni, diskova, creva, popravka ili zamena klipova
        - Prozračivanje i zamena kočione tečnosti
        - Amortizeri, opruge, poluge, silentblokovi, nosači i ležajevi
        - Geometrija nakon bilo kakve intervencije u ogibljenje
        - Kontrolna test-vožnja pre izručenja
      signsHeading: Kada je vreme da dođete kod nas
      signs:
        - Škripa, cviljenje ili krekecanje prilikom kočenja
        - Pedala je postala meka ili propada
        - Automobil vuče u stranu prilikom kočenja
        - Kucanje na neravnim putevima, „plutajući” volan, neujednačeno trošenje guma
      honestHeading: Na šta ćemo vas upozoriti
      honest: Pakne i diskovi su potrošni materijal koji se koriste u paru. Postavljanje novih pakni na istrošene diskove je moguće, ali resurs pakni se time smanjuje, i za pola godine ćete se ponovo vratiti. Izračunaćemo obe opcije i dati vam izbor.
    engine-gearbox:
      name: Motor i menjač
      short: Od zamene brtvila do popravke sa rastavljanjem — uz jasne troškove.
      metaTitle: Popravka motora i menjača u Beogradu - CarLab
      metaDescription: 'Popravka motora i menjača u Beogradu: GRT, dihtunzi, kvačilo, zamena ulja u automatskom menjaču. Dijagnostika pre demontaže, procena pre radova, garancija 12 meseci.'
      heroEyebrow: Pogonska jedinica
      heroTitle: „Kapitalka“ nije potrebna često kao što se misli
      heroLead: 'Pre nego što nešto otvorimo, proveravamo ono što se može proveriti spolja: kompresiju, pritisak ulja, greške, curenja.'
      priceFrom: prema rezultatima dijagnostike
      duration: od 1 dana
      warranty: 12 meseci
      bodyHeading: Redosled rada
      body: |
        Prvo meri: kompresiju po cilindrima, pritisak ulja, stanje sveća, greške po blokovima, curenja pod pritiskom. Tek nakon toga odlučujemo da li je potrebno otvarati motor.

        Kod menjača gledamo stanje ulja i logiku prebacivanja — većina „kvarova“ na automatskim menjačima se rešava pravilnim servisiranjem, a ne zamenom agregata. Ako popravka jeste potrebna, dobijate procenu sa razdvajanjem troškova rada i delova pre nego što nešto bude skinuto.
      includesHeading: Šta uključuje
      includes:
        - Merenje kompresije i pritiska ulja
        - Provera na curenja pod pritiskom, traženje usisavanja vazduha
        - Zamena remena ili lanca GRT-a, rolnički i pumpa
        - Dihtunzi, semering, mazivni poklopci
        - Kvačilo, zamašnjak, zamena ulja u mehaničkom i automatskom menjaču
        - Procena sa razdvajanjem pre početka demontaže
      signsHeading: Kada je vreme da dođete kod nas
      signs:
        - Ulje se gubi između zamena
        - Udari, vibracije ili gubitak snage
        - Trzanja i odlaganja prilikom prebacivanja brzina
        - Dim iz auspuha koji ranije nije bio
      honestHeading: Kada savetujemo protiv
      honest: Ako je trošak popravke blizu cene automobila, reći ćemo vam to. Ponekad je pravi savet da prodate kako jeste ili potražite ugovoreni agregat, a ne da ulažete u popravku iznos koji automobil nikada neće povratiti.
    bodywork-painting:
      name: Karoserija i lakiranje
      short: Obnova nakon saobraćajne nesreće, ispravka geometrije i lakiranje uz odabir boje.
      metaTitle: Karoserski popravak i lakiranje nakon saobraćajke u Beogradu — CarLab
      metaDescription: 'Karoserski popravak u Beogradu: štapelj, merenje geometrije, ispravka, lakiranje uz kompjuterski odabir boje. Radimo sa osiguravajućim kućama, pomažemo sa dokumentacijom.'
      heroEyebrow: Nakon saobraćajne nesreće
      heroTitle: Da automobil ne izgleda „posle udarca“
      heroLead: Dobar karoserski popravak nije vidljiv ni okom, ni mjeračem debljine prilikom pregođenja.
      priceFrom: prema rezultatima pregleda
      duration: od 3 dana
      warranty: 12 meseci na premaz
      bodyHeading: Šta uključuje obnova
      body: |
        Prvo merenje geometrije karoserije: nakon udara pomeranja mogu biti prisutna tamo gde se vizuelno sve čini netaknuto, i upravo ona donose neujednačeno trošenje gume i skretanje automobila. Po potrebi postavljamo na štapelj i izvlačimo prema kontrolnim tačkama.

        Boju biramo dvaput — po kodu iz dokumenata i spektrofotometrom na licu mesta, jer se vremenom fabrička boja menja pod sunčevim zracima. Prelaz poliramo tako da granica nije vidljiva ni na suncu, ni pod lampom.
      includesHeading: Šta uključuje
      includes:
        - Merenje geometrije karoserije prema kontrolnim tačkama
        - Štapelj i izvlačenje kod pomeranja
        - Ispitivanje, zamena oštećenih elemenata
        - Odabir boje prema kodu i spektrofotometrom
        - Lakiranje u komori sa kontrolom temperature
        - Poliranje prelaza i sastavljanje uz provere razmaka
      signsHeading: Kada je vreme da dođete kod nas
      signs:
        - Bila je saobraćajna nesreća, čak i ako oštećenja izgledaju mala
        - Neujednačeni razmaci između delova karoserije
        - Automobil skreće, guma se troši „u jedan kraj“
        - Potrebno je dovesti karoseriju u red pre prodaje
      honestHeading: O osiguranjima
      honest: Radimo sa osiguravajućim kućama i pomažemo sa dokumentacijom, ali ne obećavamo da će osiguranje pokriti sve. Nakon pregleda odmah pokazujemo šta ulazi u osiguravajući slučaj, a šta ne, kako ne biste saznali to na kraju.
    pre-purchase-inspection:
      name: Provera pre kupovine
      short: Merač debljine, dizalica i skener pre nego što predate novac.
      metaTitle: Provera automobila pre kupovine u Beogradu — CarLab
      metaDescription: 'Tehnička provera pre kupovine u Beogradu: merač debljine, dizalica, dijagnostika grešaka, kompresija. Pismeno mišljenje i pregovaranje u vašu korist.'
      heroEyebrow: Pre transakcije
      heroTitle: Šta će pokazati merač debljine, prodavac ne kaže
      heroLead: Prelakirani paneli, tragovi zavarivanja, obrnuti brojač kilometraže, curenja odozdo — za sat na dizalici to je vidljivo, iako o tome nije rečeno u oglasu.
      priceFrom: od 60 €
      duration: oko 1 sata
      warranty: pismeno mišljenje
      bodyHeading: Šta proveravamo
      body: |-
        Karoserija — merenje debljine laka po svim panelima: prelakirani delovi, fajl, tragovi zavarivanja, stanje razmaka. Zatim dizalica: suspenzija, curenja, stanje auspuha i zaštite, tragovi udaraca odozdo.

        Elektronika — očitavanje grešaka po svim blokovima, uključujući obrnute i izbrisane. Po motoru — kompresija i curenja. Na kraju dobijate pismeno mišljenje sa spiskom pronađenog i procenom troškova ispravke, s kojim možete pregovarati.
      includesHeading: Šta uključuje
      includes:
        - Merenje debljine laka po svim panelima karoserije
        - Pregled na dizalici, provere na curenja i tragovi udaraca
        - Čitanje grešaka iz svih elektronskih modula
        - Merenje kompresije po cilindrima
        - Provera na znakove obrnute kilometraže
        - Pismeno mišljenje sa procenom troškova ispravke
      signsHeading: Kada je ovo potrebno
      signs:
        - Kupujete auto iz ruku
        - Prodavac žuri sa odlukom
        - Auto je donet iz inostranstva, istorija nepoznata
        - Cena sumnjivo niža od tržišne
      honestHeading: Šta provera ne omogućava
      honest: Iskreno ćemo reći šta vidimo, ali provera ne zamenjuje garanciju. Skriveni kvar, koji se ne manifestuje ni na dizalici, ni na dijagnostici, može isplivati kasnije — to je ograničenje metode, a ne izjava sitnim slovima.
  en:
    indexMetaTitle: 'CarLab: Car Service in Belgrade, Repairs and Maintenance'
    indexMetaDescription: Diagnostics, scheduled servicing, brakes and suspension, engine and gearbox, accident repair, pre-purchase inspection. Prices, timeframes, warranty.
    indexEyebrow: Services
    indexHeading: Everything your car needs in one service
    indexLead: Each service has a dedicated page — what it includes, how long it takes, when to visit us, and when we genuinely advise against any work.
    specsPriceLabel: Price
    specsDurationLabel: Timeframe
    specsWarrantyLabel: Warranty
    diagnostics:
      name: Computer Diagnostics
      short: We uncover what lies behind the error code.
      metaTitle: Car Computer Diagnostics in Belgrade — CarLab
      metaDescription: Engine, suspension, and electrical diagnostics in Belgrade. Error reading is free, we show you the cause right on the car.
      heroEyebrow: Diagnostics
      heroTitle: An error code is a symptom, not a diagnosis
      heroLead: The scanner will tell you which sensor is malfunctioning. Whether the sensor itself is faulty or it's measuring something wrong won’t be revealed by the scanner — that’s determined at the car itself.
      priceFrom: error reading — free
      duration: from 40 minutes
      warranty: 12 months for repairs
      bodyHeading: What We Do in Diagnostics
      body: |
        We start with a conversation: when did it begin, under what conditions, what had been changed before. Some diagnoses are made here: ‘knocking only when cold’ and ‘knocking all the time’ indicate different components.

        Then we scan all the systems at once: often, an error in ABS or comfort system explains the driver’s complaint. Next is a check on the car: lift, play, load inspection, and if necessary, pressure measurements and oscilloscope tests.

        Finally, we show you the cause on the car and explain it clearly. If repairs are necessary, we quote the estimate right away.

        How much does it cost: error reading is free. Paid diagnostics start only when we need to dismantle a component or put the car on a stand, and we provide the price before we start the work, not afterwards.
      includesHeading: What’s Included
      includes:
        - Symptom survey and service history
        - Error reading across all electronic modules
        - Inspection on a lift, checking for play and leaks
        - Test drive with the engineer if the issue presents while driving
        - Verbal conclusion and written repair estimate
      signsHeading: When to Visit Us
      signs:
        - ‘Check’ or other warning lights on the dashboard are on
        - Car jolts, misfires or has trouble starting
        - Fuel consumption has increased without an obvious reason
        - A new sound appears, and you can’t identify the source
      honestHeading: What We Don’t Promise
      honest: Not every malfunction is detected in forty minutes. Intermittent issues that arise once a week might require a return visit or leaving the car for a day — we’ll tell you that right away and won’t replace parts sequentially at your expense.
    servicing:
      name: Scheduled Servicing
      short: Oil, filters, fluids, and inspection as per your engine's regulations.
      metaTitle: Scheduled Servicing and Oil Change in Belgrade — CarLab
      metaDescription: 'Car maintenance in Belgrade: oil, filters, spark plugs, brake fluid, coolant. According to manufacturer’s regulations, with entries in the service book.'
      heroEyebrow: Maintenance
      heroTitle: The cheapest repair is the one that doesn't happen
      heroLead: Each engine has its own interval and oil specifications. We check the manual for your car and perform what’s written there, rather than the average ‘every ten thousand.’
      priceFrom: from 90 €
      duration: 2–4 hours
      warranty: 12 months
      bodyHeading: Where Your Car's Interval Comes From
      body: |-
        Replacement intervals differ widely between engines, and conditions in Belgrade — traffic jams, dust, summer heat — typically fall under 'severe use conditions' which shorten the interval. We assess what your car actually needs based on its mileage.

        We also check things that are often remembered too late: the condition of the timing belt or chain, the moisture content of the brake fluid, the freezing temperature of the coolant, and the wear of pads and discs in millimeters.
      includesHeading: What’s Included
      includes:
        - Oil and oil filter meeting your manufacturer’s specifications
        - Air filter, cabin filter, spark plugs as per regulations
        - Brake fluid moisture content check
        - Coolant check and its freezing temperature
        - Measuring the remaining thickness of pads and discs in millimeters
        - Recording all work and mileage in the service book
      signsHeading: When to Visit Us
      signs:
        - Mileage or one year since the last service
        - Car is newly purchased, and there’s no service history
        - A long trip is ahead
        - The service interval light is on
      honestHeading: What We Don’t Do
      honest: We don't change parts if it’s too soon. If a filter has used half its lifespan, we won't touch it and will suggest when to come back.
    brakes-suspension:
      name: Brakes and Suspension
      short: Everything that determines whether your car will stop or not.
      metaTitle: Brake and Suspension Repairs in Belgrade — CarLab
      metaDescription: 'Brakes and suspension in Belgrade: pads, discs, calipers, arms, wheel alignment. Measurements in millimeters, estimate before work, 12-month warranty.'
      heroEyebrow: Chassis
      heroTitle: Here, wear is measured in millimeters
      heroLead: 'You can stretch the engine to the service. Not brakes. That’s why we don’t round up on the suspension: if the wear is gone, we say it plainly.'
      priceFrom: from 120 €
      duration: from 3 hours
      warranty: 12 months
      bodyHeading: How We Do It
      body: |
        We start with measurements: disc and pad thickness in millimeters, runout, hose and caliper condition. For the suspension — checking for play on the lift and on a vibration test bench, inspecting dust boots and mounts.

        After any suspension repair, we always perform alignment: even replacing one arm changes geometry, and incorrect geometry can wear out a set of tires in one season.
      includesHeading: What’s Included
      includes:
        - Measuring discs and pads with results recorded
        - Replacing pads, discs, hoses, repairing or replacing calipers
        - Bleeding and replacing brake fluid
        - Struts, springs, arms, bushes, mounts, and bearings
        - Wheel alignment after any suspension intervention
        - Final test drive before handover
      signsHeading: When to Visit Us
      signs:
        - Squeaking, grinding, or screeching while braking
        - Pedal is soft or sinks
        - Car pulls to one side when braking
        - Bumps on rough roads, ‘floating’ steering, uneven tire wear
      honestHeading: What We’ll Warn You About
      honest: Pads and discs are consumables that wear in pairs. You can fit new pads on worn discs, but this reduces the lifespan of the pads, and you’ll be back in six months. We’ll evaluate both options and leave the choice to you.
    engine-gearbox:
      name: Engine and Gearbox
      short: From gasket replacement to full repairs with dismantling — with a clear estimate.
      metaTitle: Engine and Gearbox Repairs in Belgrade — CarLab
      metaDescription: 'Engine and gearbox repair in Belgrade: timing belts, gaskets, clutch, oil changes in automatic transmissions. Diagnostics before disassembly, estimate before work, 12-month guarantee.'
      heroEyebrow: Powertrain
      heroTitle: Major repairs are not needed as often as people think
      heroLead: 'Before disassembly, we check accessible parameters: compression, oil pressure, faults, leaks.'
      priceFrom: based on diagnostics results
      duration: from 1 day
      warranty: 12 months
      bodyHeading: How we work
      body: |-
        First, we measure: compression across cylinders, oil pressure, spark plug condition, error codes, pressure leaks. Only after this do we decide if the engine needs opening.

        For gearboxes, we check the oil condition and shifting logic — most faults in automatic transmissions can be resolved with proper maintenance rather than replacing parts. If repair is necessary, you will receive a detailed estimate for labor and parts before anything is removed.
      includesHeading: What’s Included
      includes:
        - Compression and oil pressure measurement
        - Pressure leak checks, air intake leak detection
        - Replacement of timing belt or chain, rollers, and pump
        - Gaskets, seals, valve stem seals
        - Clutch, flywheel, oil changes in manual and automatic transmissions
        - Detailed estimate before disassembly
      signsHeading: When to Visit Us
      signs:
        - Oil loss between changes
        - Knocking, vibrations, or loss of power
        - Jumps and delays in gear shifting
        - Smoke from the exhaust that wasn't present before
      honestHeading: When we advise against repairs
      honest: If repair costs approach the car's value, we will tell you. Sometimes the right advice is to sell it as is or look for a replacement unit instead of investing in a repair that the car will never recover.
    bodywork-painting:
      name: Body and Painting
      short: Restoration after a crash, geometry correction, and color matching paint.
      metaTitle: Body repair and painting after a crash in Belgrade — CarLab
      metaDescription: 'Body repair in Belgrade: frame guidance, geometry measurement, dent removal, painting with computer color matching. We work with insurance companies and assist with paperwork.'
      heroEyebrow: After a crash
      heroTitle: So your car doesn’t look ‘after an impact’
      heroLead: Good bodywork is not noticeable to the eye or with a thickness gauge at a pre-sale inspection.
      priceFrom: based on inspection results
      duration: from 3 days
      warranty: 12 months on the coating
      bodyHeading: What’s included in restoration
      body: |-
        First, we measure the body geometry: after a crash, shifts can occur where everything looks intact visually, leading to uneven tire wear and the car pulling to one side. If necessary, we place it on a frame and pull it according to reference points.

        We match the color twice — by the code from documents and using a spectrophotometer on-site since factory colors fade from their original shade over five years of sun exposure. The transition is polished so that the boundary is not visible in sunlight or under a lamp.
      includesHeading: What’s Included
      includes:
        - Geometry measurement based on reference points
        - Frame work and pulling for offsets
        - Dent removal, replacement of damaged elements
        - Color matching by code and spectrophotometer
        - Painting in a booth with temperature control
        - Polishing the transition and reassembly with gap checks
      signsHeading: When to Visit Us
      signs:
        - There was a crash, even if damage appears minor
        - Uneven gaps between body parts
        - The car pulls to one side, tires wear unevenly
        - Need to tidy up the body before selling
      honestHeading: About insurance
      honest: We work with insurance companies and help with paperwork, but we can't promise that everything will be covered. After inspection, we immediately identify what falls under the insurance claim and what doesn't, so you won't find out about it later.
    pre-purchase-inspection:
      name: Pre-purchase Inspection
      short: Thickness gauge, lift, and scanner before you hand over the money.
      metaTitle: Car inspection before purchase in Belgrade — CarLab
      metaDescription: 'Technical inspection before purchase in Belgrade: thickness measurement, lift inspection, error diagnostics, compression check. Written report and negotiation leverage.'
      heroEyebrow: Before the deal
      heroTitle: What the thickness gauge reveals, the seller won’t tell
      heroLead: Repainted panels, welding traces, tampered mileage, leaks underneath — in an hour on the lift, these issues become apparent, even if they aren’t mentioned in the ad.
      priceFrom: from 60 €
      duration: about 1 hour
      warranty: written report
      bodyHeading: What we check
      body: |-
        Body — using a thickness gauge on all panels: repainted elements, filler, welding traces, condition of gaps. Then on the lift: suspension, leaks, exhaust and protection condition, impact traces underneath.

        Electronics — reading faults across all modules, including tampered and erased codes. Engine — compression and leaks. At the end, you receive a written report listing findings and an estimate for repairs, which can be used for negotiating.
      includesHeading: What’s Included
      includes:
        - Measurement of paint thickness on all body panels
        - Inspection on the lift, checking for leaks and impact traces
        - Error reading across all electronic modules
        - Compression measurement across cylinders
        - Check for signs of tampered mileage
        - Written report with repair cost estimate
      signsHeading: When it's needed
      signs:
        - Buying a car from a private seller
        - The seller rushes your decision
        - The car was imported, history unknown
        - The price is suspiciously below the market
      honestHeading: What the inspection doesn’t guarantee
      honest: We will honestly convey what we see, but the inspection does not substitute a guarantee. A hidden defect that does not emerge on the lift or diagnostics may surface later — this is a limitation of the method, not fine print.
