diagnostics:
  name: Компьютерная диагностика
  short: Находим, что стоит за кодом ошибки.
  metaTitle: Компьютерная диагностика автомобиля в Белграде — CarLab
  metaDescription: Диагностика двигателя, подвески и электрики в Белграде. Считывание ошибок бесплатно, причину показываем прямо на машине.
  heroEyebrow: Диагностика
  heroTitle: Код ошибки — это симптом, а не диагноз
  heroLead: Сканер скажет, какой датчик ругается. Виноват сам датчик или то, что он измеряет, сканер не покажет — это выясняется уже на машине.
  priceFrom: считывание ошибок — бесплатно
  duration: от 40 минут
  bodyHeading: Что мы делаем на диагностике
  body: |
    Сначала разговор: когда началось, при каких условиях, что менялось до этого. Часть диагнозов ставится уже здесь: «стучит только на холодную» и «стучит постоянно» — это разные узлы.

    Потом сканер по всем блокам сразу: часто ошибка в ABS или в блоке комфорта объясняет то, на что жалуется водитель. Дальше — проверка на машине: подъёмник, люфты, осмотр под нагрузкой, при необходимости замер давления и осциллограф.

    В конце показываем причину на автомобиле и объясняем на пальцах. Если нужен ремонт, сразу считаем смету.

    Сколько это стоит: считывание ошибок — бесплатно. Платной диагностика становится только тогда, когда нужно разбирать узел или ставить машину на стенд, и цену мы называем до начала работ, а не в конце.
  includesHeading: Что входит
  includes:
    - Опрос по симптомам и истории обслуживания
    - Считывание ошибок по всем электронным блокам
    - Осмотр на подъёмнике, проверка люфтов и утечек
    - Тест-драйв с инженером, если проблема проявляется в движении
    - Устное заключение и письменная смета на ремонт
  signsHeading: Когда пора к нам
  signs:
    - Горит «чек» или другой значок на панели
    - Машина дёргается, троит или плохо заводится
    - Расход вырос без понятной причины
    - Появился новый звук, и вы не понимаете откуда
  honestHeading: Что мы не обещаем
  honest: Не каждая неисправность ловится за сорок минут. Плавающие проблемы, которые появляются раз в неделю, иногда требуют повторного визита или оставить машину на день — мы скажем об этом сразу и не станем менять детали по очереди за ваш счёт.
servicing:
  name: Плановое ТО
  short: Масло, фильтры, жидкости и осмотр — по регламенту вашего двигателя.
  metaTitle: Плановое ТО и замена масла в Белграде — CarLab
  metaDescription: 'Техническое обслуживание автомобиля в Белграде: масло, фильтры, свечи, тормозная жидкость, антифриз. По регламенту производителя, с записью в сервисную карту.'
  heroEyebrow: Обслуживание
  heroTitle: Самая дешёвая починка — та, которой не случилось
  heroLead: У каждого мотора свой интервал и свой допуск по маслу. Мы смотрим мануал на вашу машину и делаем то, что написано там, а не среднее «раз в десять тысяч».
  priceFrom: от 90 €
  duration: 2–4 часа
  bodyHeading: Откуда берётся интервал для вашей машины
  body: |
    Интервалы замены у разных моторов отличаются в разы, а условия Белграда — пробки, пыль, лето под сорок — почти всегда попадают под «тяжёлые условия эксплуатации» с укороченным интервалом. По ним и считаем, что реально нужно вашей машине на этом пробеге.

    Заодно проверяем то, что обычно вспоминают слишком поздно: состояние ремня или цепи, тормозную жидкость на влагу, антифриз на температуру замерзания, износ колодок и дисков в миллиметрах.
  includesHeading: Что входит
  includes:
    - Масло и масляный фильтр с допуском вашего производителя
    - Воздушный и салонный фильтр, свечи по регламенту
    - Проверка тормозной жидкости на содержание влаги
    - Проверка антифриза и его температуры замерзания
    - Замер остатка колодок и дисков в миллиметрах
    - Запись всех работ и пробега в сервисную карту
  signsHeading: Когда пора к нам
  signs:
    - Подошёл пробег или год с прошлого ТО
    - Машина только куплена, а истории обслуживания нет
    - Впереди дальняя дорога
    - Загорелась лампа сервисного интервала
  honestHeading: Что мы не делаем
  honest: Не меняем то, чему ещё рано. Если фильтр отработал половину ресурса, мы его не тронем и скажем, когда приезжать.
brakes-suspension:
  name: Тормоза и подвеска
  short: Всё, что отвечает за то, остановится машина или нет.
  metaTitle: Ремонт тормозов и подвески в Белграде — CarLab
  metaDescription: 'Тормоза и подвеска в Белграде: колодки, диски, суппорты, рычаги, развал-схождение. Замеры в миллиметрах, смета до работ.'
  heroEyebrow: Ходовая
  heroTitle: Здесь ресурс считают в миллиметрах
  heroLead: 'Мотор можно дотянуть до сервиса. Тормоза — нет. Поэтому по ходовой мы не округляем и не тянем: если ресурс кончился, говорим прямо.'
  priceFrom: от 120 €
  duration: от 3 часов
  bodyHeading: Как мы это делаем
  body: |
    Начинаем с замеров: толщина дисков и колодок в миллиметрах, биение, состояние шлангов и суппортов. По подвеске — проверка люфтов на подъёмнике и на вибростенде, осмотр пыльников и опор.

    После ремонта ходовой всегда делаем развал-схождение: даже замена одного рычага меняет геометрию, а неправильная геометрия съедает комплект резины за сезон.
  includesHeading: Что входит
  includes:
    - Замер дисков и колодок с записью результата
    - Замена колодок, дисков, шлангов, ремонт или замена суппортов
    - Прокачка и замена тормозной жидкости
    - Стойки, пружины, рычаги, сайлентблоки, опоры и подшипники
    - Развал-схождение после любого вмешательства в подвеску
    - Контрольный тест-драйв перед выдачей
  signsHeading: Когда пора к нам
  signs:
    - Скрип, писк или скрежет при торможении
    - Педаль стала мягкой или проваливается
    - Машину уводит в сторону при торможении
    - Стуки на неровностях, «плавающий» руль, неравномерный износ резины
  honestHeading: О чём предупредим
  honest: Колодки и диски — расходник, который ходит парой. Ставить новые колодки на изношенные диски можно, но ресурс колодок при этом падает, и через полгода вы приедете снова. Мы посчитаем оба варианта и оставим выбор вам.
engine-gearbox:
  name: Двигатель и коробка
  short: От замены прокладки до ремонта с разбором — с понятной сметой.
  metaTitle: Ремонт двигателя и коробки передач в Белграде — CarLab
  metaDescription: 'Ремонт двигателя и трансмиссии в Белграде: ГРМ, прокладки, сцепление, замена масла в АКПП. Диагностика до разбора, смета до работ.'
  heroEyebrow: Силовой агрегат
  heroTitle: «Капиталка» нужна не так часто, как её называют
  heroLead: 'Прежде чем что-то разбирать, мы проверяем то, что проверяется снаружи: компрессию, давление масла, ошибки, утечки.'
  priceFrom: по результатам диагностики
  duration: от 1 дня
  bodyHeading: Порядок работы
  body: |
    Сначала измеряем: компрессия по цилиндрам, давление масла, состояние свечей, ошибки по блокам, утечки под давлением. Только после этого решаем, нужно ли вскрывать мотор.

    По коробкам смотрим состояние масла и логику переключений — у автоматов большая часть «поломок» лечится корректным обслуживанием, а не заменой агрегата. Если ремонт всё же нужен, вы получаете смету с разбивкой на работу и запчасти до того, как что-то снято.
  includesHeading: Что входит
  includes:
    - Замер компрессии и давления масла
    - Проверка на утечки под давлением, поиск подсоса воздуха
    - Замена ремня или цепи ГРМ, роликов и помпы
    - Прокладки, сальники, маслосъёмные колпачки
    - Сцепление, маховик, замена масла в механике и автомате
    - Смета с разбивкой до начала разбора
  signsHeading: Когда пора к нам
  signs:
    - Масло уходит между заменами
    - Стук, вибрация или потеря тяги
    - Рывки и задержки при переключении передач
    - Дым из выхлопа, которого раньше не было
  honestHeading: Когда мы отговариваем
  honest: Если стоимость ремонта подходит к стоимости машины, мы это скажем. Иногда правильный совет — продать как есть или искать контрактный агрегат, а не вкладывать в ремонт сумму, которую машина никогда не вернёт.
bodywork-painting:
  name: Кузов и покраска
  short: Восстановление после ДТП, правка геометрии и покраска с подбором цвета.
  metaTitle: Кузовной ремонт и покраска после ДТП в Белграде — CarLab
  metaDescription: 'Кузовной ремонт в Белграде: стапель, замер геометрии, рихтовка, покраска с компьютерным подбором цвета. Работаем со страховыми, помогаем с документами.'
  heroEyebrow: После ДТП
  heroTitle: Чтобы машина не выглядела «после удара»
  heroLead: Хороший кузовной ремонт не видно ни глазом, ни толщиномером на осмотре перед продажей.
  priceFrom: по результатам осмотра
  duration: от 3 дней
  bodyHeading: Что входит в восстановление
  body: |
    Сначала замеряем геометрию кузова: после удара смещения бывают там, где визуально всё цело, и именно они потом дают неравномерный износ резины и увод машины. При необходимости ставим на стапель и вытягиваем по контрольным точкам.

    Цвет подбираем дважды — по коду из документов и спектрофотометром по факту, потому что за пять лет на солнце заводской цвет уходит от паспортного. Переход полируем так, чтобы граница не читалась ни на солнце, ни под лампой.
  includesHeading: Что входит
  includes:
    - Замер геометрии кузова по контрольным точкам
    - Стапель и вытяжка при смещениях
    - Рихтовка, замена повреждённых элементов
    - Подбор цвета по коду и спектрофотометром
    - Покраска в камере с контролем температуры
    - Полировка перехода и сборка с проверкой зазоров
  signsHeading: Когда пора к нам
  signs:
    - Было ДТП, даже если повреждения выглядят мелкими
    - Неравномерные зазоры между деталями кузова
    - Машину уводит, резина изнашивается «в один край»
    - Нужно привести кузов в порядок перед продажей
  honestHeading: О страховых
  honest: Мы работаем со страховыми и помогаем с документами, но не обещаем, что страховая покроет всё. После осмотра мы сразу показываем, что попадает в страховой случай, а что нет, чтобы вы не узнали об этом в конце.
pre-purchase-inspection:
  name: Проверка перед покупкой
  short: Толщиномер, подъёмник и сканер до того, как вы отдали деньги.
  metaTitle: Проверка автомобиля перед покупкой в Белграде — CarLab
  metaDescription: 'Техническая проверка перед покупкой в Белграде: толщиномер, подъёмник, диагностика ошибок, компрессия. Письменное заключение и торг в вашу пользу.'
  heroEyebrow: Перед сделкой
  heroTitle: Что покажет толщиномер, продавец не расскажет
  heroLead: Перекрашенные панели, следы сварки, скрученный пробег, утечки снизу — за час на подъёмнике это видно, хотя в объявлении об этом не пишут.
  priceFrom: от 60 €
  duration: около 1 часа
  bodyHeading: Что мы проверяем
  body: |
    Кузов — толщиномером по всем панелям: перекрашенные элементы, шпаклёвка, следы сварки, состояние зазоров. Дальше подъёмник: подвеска, утечки, состояние выхлопа и защиты, следы ударов снизу.

    Электроника — считывание ошибок по всем блокам, включая скрученные и стёртые. По мотору — компрессия и утечки. В конце вы получаете письменное заключение со списком найденного и оценкой стоимости устранения, с которым можно торговаться.
  includesHeading: Что входит
  includes:
    - Замер толщины лака по всем панелям кузова
    - Осмотр на подъёмнике, проверка на утечки и следы ударов
    - Считывание ошибок по всем электронным блокам
    - Замер компрессии по цилиндрам
    - Проверка на признаки скрученного пробега
    - Письменное заключение с оценкой стоимости устранения
  signsHeading: Когда это нужно
  signs:
    - Покупаете машину с рук
    - Продавец торопит с решением
    - Машина привезена из-за границы, история неизвестна
    - Цена подозрительно ниже рынка
  honestHeading: Чего проверка не даёт
  honest: Мы честно скажем, что видим, но ни один осмотр не ловит всё. Скрытый дефект, который не проявляется ни на подъёмнике, ни на диагностике, может всплыть позже — это ограничение метода, а не оговорка мелким шрифтом.
translations:
  sr:
    indexMetaTitle: 'Usluge autoservisa u Beogradu: popravka i TO — CarLab'
    indexMetaDescription: Dijagnostika, TO i zamena ulja, kočnice i suspenzija, motor i menjač, karambolski popravak, provera pre kupovine. Cene, rokovi, garancija.
    indexEyebrow: Usluge
    indexHeading: Sve što je vašem automobilu potrebno na jednom mestu
    indexLead: Svaka usluga ima svoju stranicu — šta uključuje, koliko traje, kada je vreme da dođete kod nas i kada iskreno govorimo da nije potrebno raditi ništa.
    specsPriceLabel: Cena
    specsDurationLabel: Rok
    diagnostics:
      name: Računarska dijagnostika
      short: Otkrivamo šta stoji iza greške.
      metaTitle: Računarska dijagnostika automobila u Beogradu — CarLab
      metaDescription: Dijagnostika motora, suspenzije i elektrike u Beogradu. Čitanje grešaka besplatno, uz prikazivanje uzroka direktno na vozilu.
      heroEyebrow: Dijagnostika
      heroTitle: Kod greške je simptom, a ne dijagnoza
      heroLead: Skener će reći koji senzor ima problem. Da li je sam senzor na grešci ili ono što meri, skener ne pokazuje — to se utvrđuje na vozilu.
      priceFrom: čitanje grešaka — besplatno
      duration: od 40 minuta
      bodyHeading: Šta radimo u dijagnostici
      body: |-
        Prvo razgovor: kada je počelo, pod kojim uslovima, šta se do tada menjalo. Deo dijagnoza se postavlja već ovde: „kuca samo kad je hladno“ i „kuca stalno“ — to su različiti sklopovi.

        Zatim skener ide kroz sve blokove odjednom: često greška u ABS-u ili u bloku udobnosti objašnjava ono na šta se vozač žali. Dalje — provera na automobilu: dizalica, luftovi, pregled pod opterećenjem, po potrebi mera pritiska i oscilograf.

        Na kraju pokazujemo uzrok na automobilu i objašnjavamo rečima. Ako je potrebna popravka, odmah računamo troškovnik.

        Koliko to košta: čitanje grešaka — besplatno. Plaćena dijagnostika postaje samo tada kada treba rastaviti sklop ili staviti automobil na stend, a cenu mi saopštavamo pre početka radova, a ne na kraju.
      includesHeading: Šta ulazi
      includes:
        - Anketa o simptomima i istoriji servisiranja
        - Čitanje grešaka sa svih elektronskih blokova
        - Provera na dizalici, ispitivanje luftova i curenja
        - Test vožnja sa inženjerom, ako se problem manifestuje u vožnji
        - Usmeno zaključivanje i pisani troškovnik za popravku
      signsHeading: Kada je vreme da dođete kod nas
      signs:
        - Zasvetlela je „check“ ili druga lampica na panelu
        - Automobil se trese, radi na tri cilindra ili loše pali
        - Potrošnja je porasla bez objašnjenja
        - Pojavio se novi zvuk i ne razumete odakle dolazi
      honestHeading: Šta ne obećavamo
      honest: Nisu sve greške uočljive za četrdeset minuta. Problemi koji se javljaju jednom nedeljno, ponekad zahtevaju ponovni poset ili ostavljanje automobila na dan — o tome ćemo vam odmah reći i nećemo menjati delove jedan po jedan na vaš račun.
    servicing:
      name: Planirano TO
      short: Ulje, filteri, tečnosti i provera — prema propisima vašeg motora.
      metaTitle: Planirano TO i zamena ulja u Beogradu — CarLab
      metaDescription: 'Tehničko održavanje automobila u Beogradu: ulje, filteri, sveće, kočiona tečnost, antifriz. Prema propisima proizvođača, uz upisivanje u servisnu knjižicu.'
      heroEyebrow: Održavanje
      heroTitle: Najjeftinija popravka je ona koja se nije desila
      heroLead: Svaki motor ima svoj interval i dozvolu za ulje. Gledamo priručnik za vaš automobil i radimo ono što je tamo zapisano, a ne prosečno „jednom na deset hiljada“.
      priceFrom: od 90 €
      duration: 2–4 sata
      bodyHeading: Odakle dolazi interval za vaš automobil
      body: |-
        Intervalli zamene kod različitih motora se drastično razlikuju, a uslovi u Beogradu — saobraćaj, prašina, leto do četrdeset — gotovo uvek spadaju pod „teške uslove korišćenja“ sa skraćenim intervalom. Na osnovu toga računamo šta je zaista potrebno vašem automobilu na ovoj kilometraži.

        Pored toga proveravamo ono što se obično setimo prekasno: stanje kaiša ili lanca, kočione tečnosti na vlagu, antifriz na temperaturu smrzavanja, habanje pločica i diskova u milimetrima.
      includesHeading: Šta ulazi
      includes:
        - Ulje i filter za ulje s dozvolom vašeg proizvođača
        - Vazdušni i kabinski filter, sveće prema propisima
        - Provera kočione tečnosti na sadržaj vlage
        - Provera antifriza i njegove temperature smrzavanja
        - Merenje preostalog sloja pločica i diskova u milimetrima
        - Upis svih radova i pređenih kilometara u servisnu knjižicu
      signsHeading: Kada je vreme da dođete kod nas
      signs:
        - Prešao je prosto ili godina od prošlog TO
        - Automobil je tek kupljen, a istorije servisiranja nema
        - Ispred su duge vožnje
        - Zasvetlela je lampica servisnog intervala
      honestHeading: Šta ne radimo
      honest: Ne menjamo ono što još nije vreme. Ako je filter odradio pola svog resursa, nećemo ga dirati i reći kada treba da dođete opet.
    brakes-suspension:
      name: Kočnice i suspenzija
      short: Sve što utiče na to da li će automobil stati ili ne.
      metaTitle: Popravka kočnica i suspenzije u Beogradu — CarLab
      metaDescription: 'Kočnice i suspenzija u Beogradu: pločice, diskovi, čeljusti, poluge, podešavanje oslanjanja. Merenja u milimetrima, troškovnik pre rada, garancija 12 meseci.'
      heroEyebrow: Hodna
      heroTitle: Ovde se resurs meri u milimetrima
      heroLead: 'Motor se može izdržati do servisa. Kočnice — ne. Zato po hodnoj ne zaokružujemo i ne produžavamo: kada je resurs istekao, govorimo otvoreno.'
      priceFrom: od 120 €
      duration: od 3 sata
      bodyHeading: Kako to radimo
      body: |-
        Počinjemo sa merenjima: debljina diskova i pločica u milimetrima, udar, stanje creva i čeljusti. Za suspenziju — provera luftova na dizalici i na vibracionom stendu, pregled gumica i potpornja.

        Nakon popravke hodne uvek radimo podešavanje oslanjanja: čak i zamena jedne poluge menja geometriju, a pogrešna geometrija troši komplet guma za sezonu.
      includesHeading: Šta ulazi
      includes:
        - Merenje diskova i pločica sa zapisivanjem rezultata
        - Zamena pločica, diskova, creva, popravka ili zamena čeljusti
        - Proveru i zamena kočione tečnosti
        - Amortizeri, opruge, poluge, silent-blockovi, potpornji i ležajevi
        - Podešavanje oslanjanja nakon bilo kakvog intervencija u suspenziji
        - Kontrolna test vožnja pre predaje
      signsHeading: Kada je vreme da dođete kod nas
      signs:
        - Škrip, zvižduk ili škripa pri kočenju
        - Pedala je postala meka ili propada
        - Automobil skreće u stranu pri kočenju
        - Udari na neravninama, „plutajući“ volan, neravnomeran trošenje guma
      honestHeading: O čemu ćemo vas obavestiti
      honest: Ploče i diskovi su potrošni materijal koji se menjaju u paru. Stavljanje novih pločica na istrošene diskove je moguće, ali resurs pločica se time smanjuje, i za pola godine ćete ponovo doći. Računaćemo oba varijante i ostaviti izbor vama.
    engine-gearbox:
      name: Motor i menjač
      short: Od zamene zaptivača do popravke sa razmontiranjem — uz jasan troškovnik.
      metaTitle: Popravka motora i menjača u Beogradu — CarLab
      metaDescription: 'Popravka motora i menjača u Beogradu: GTR, pakne, kvačilo, zamena ulja u automatskoj transmisiji. Dijagnostika pre rasklapanja, procena pre radova, garancija 12 meseci.'
      heroEyebrow: Pogon
      heroTitle: Kapitalna popravka nije potrebna tako često kao što se misli
      heroLead: 'Pre nego što nešto rasklopimo, proveravamo sve što se može proveriti spolja: kompresiju, pritisak ulja, greške, curenje.'
      priceFrom: na osnovu dijagnostike
      duration: od 1 dana
      bodyHeading: Redosled rada
      body: |
        Prvo merimo: kompresiju po cilindrima, pritisak ulja, stanje svećica, greške po blokovima, curenja pod pritiskom. Tek nakon ovoga odlučujemo da li treba otvarati motor.

        Za menjače proveravamo stanje ulja i logiku prebacivanja – kod automatskih menjača većina "kvarova" se rešava pravilnim servisiranjem, a ne zamenom agregata. Ako popravka ipak treba, dobijate procenu sa razdvajanjem za rad i delove pre nego što nešto bude skinuto.
      includesHeading: Šta ulazi
      includes:
        - Merenje kompresije i pritiska ulja
        - Provera curenja pod pritiskom, traženje uzimanja vazduha
        - Zamena remena ili lanca GTR, rolera i pumpe
        - Pakne, semering, poklopci za ulje
        - Kvačilo, zamašnjak, zamena ulja u mehaničkom i automatskom menjaču
        - Procena sa razdvajanjem pre početka rasklapanja
      signsHeading: Kada je vreme da dođete kod nas
      signs:
        - Ulje nedostaje između zamena
        - Udaranje, vibracije ili gubitak vuče
        - Trzaji i zastoji pri prebacivanju brzina
        - Dim iz izduvne cevi koji ranije nije postojao
      honestHeading: Kada odrađujemo
      honest: Ako trošak popravke priđe vrednosti automobila, mi ćemo to reći. Ponekad je pravi savet prodati kako jeste ili tražiti ugovoreni agregat, a ne ulagati u popravku iznos koji automobil nikad ne može vratiti.
    bodywork-painting:
      name: Karoserija i farbanje
      short: Obnova nakon udesa, ispravljanje geometrije i farbanje u skladu s bojom.
      metaTitle: Popravka karoserije i farbanje nakon udesa u Beogradu — CarLab
      metaDescription: 'Popravka karoserije u Beogradu: stalak, merenje geometrije, ispravljanje, farbanje uz kompjutersko usklađivanje boje. Radimo sa osiguranjima, pomažemo sa dokumentima.'
      heroEyebrow: Nakon udesa
      heroTitle: Da auto ne izgleda "posle udarca"
      heroLead: Dobra popravka karoserije nije vidljiva ni golim okom, ni mernim uređajem na pregledu pre prodaje.
      priceFrom: na osnovu pregleda
      duration: od 3 dana
      bodyHeading: Šta je uključeno u obnovu
      body: |
        Prvo mjerimo geometriju karoserije: nakon udara pomeranja su moguća i tamo gde sve izgleda u redu, a to kasnije dovodi do neravnomernog trošenja guma i skretanja vozila. Ako je potrebno, postavljamo na stalak i vučemo prema kontrolnim tačkama.

        Boju bira dva puta — prema kodu iz dokumenata i spektrofotometrom na licu mesta, jer se tokom pet godina na suncu fabrička boja menja. Prelaz poliramo tako da granica nije vidljiva ni na suncu ni pod lampom.
      includesHeading: Šta ulazi
      includes:
        - Merenje geometrije karoserije prema kontrolnim tačkama
        - Stalak i vuča prilikom pomeranja
        - Ispravljanje, zamena oštećenih delova
        - Usaglašavanje boje prema kodu i spektrofotometrom
        - Farbanje u komori sa kontrolom temperature
        - Poliranje prelaza i sastavljanje uz provere razmaka
      signsHeading: Kada je vreme da dođete kod nas
      signs:
        - Bilo je udesa, čak i ako štete izgledaju sitno
        - Neravnomerni razmaci između delova karoserije
        - Auto skreće, gume se troše "na jednu stranu"
        - Potreba da se karoserija dovedu u red pre prodaje
      honestHeading: O osiguranjima
      honest: Radimo sa osiguranjima i pomažemo sa dokumentima, ali ne obećavamo da će osiguranje pokriti sve. Nakon pregleda odmah pokazujemo šta spada u osiguravajući slučaj, a šta ne, kako biste to saznali na vreme.
    pre-purchase-inspection:
      name: Provera pre kupovine
      short: Merni uređaj, dizalica i skener pre nego što platite.
      metaTitle: Provera automobila pre kupovine u Beogradu — CarLab
      metaDescription: 'Tehnička provera pre kupovine u Beogradu: merni uređaj, dizalica, dijagnostika grešaka, kompresija. Pisano izveštaj i povoljnija cena za vas.'
      heroEyebrow: Pre transakcije
      heroTitle: Šta će pokazati merni uređaj, prodavac to ne može reći
      heroLead: Prefarbani paneli, tragovi zavarivanja, preokrenut pređašnji, curenja s dna — za sat vremena na dizalici ovo je uočljivo, iako u oglasu o tome ne pišu.
      priceFrom: od 60 €
      duration: oko 1 sat
      bodyHeading: Šta proveravamo
      body: |
        Karoserija — merni uređaj po svim panelima: prefarbani elementi, gips, tragovi zavarivanja, stanje razmaka. Zatim dizalica: ovjes, curenja, stanje izduvnog sistema i zaštite, tragovi udaraca odozdo.

        Elektronika — očitavanje grešaka po svim blokovima, uključujući preokrenute i obrisane. Za motor — kompresija i curenja. Na kraju dobijate pisani izveštaj sa spiskom pronalazaka i procenom troškova za otklanjanje, sa kojim možete pregovarati.
      includesHeading: Šta ulazi
      includes:
        - Merenje debljine laka po svim panelima karoserije
        - Pregled na dizalici, provera curenja i tragova udaraca
        - Čitanje grešaka sa svih elektronskih blokova
        - Merenje kompresije po cilindrima
        - Provera tragova preokrenutog pređena
        - Pisani izveštaj sa procenom troškova otklanjanja
      signsHeading: Kada je ovo potrebno
      signs:
        - Kupujete auto od fizičkog lica
        - Prodavac žuri s odlukom
        - Auto je dovezen iz inostranstva, istorija nepoznata
        - Cena sumnjivo niža od tržišne
      honestHeading: Šta provera ne garantuje
      honest: Iskreno ćemo reći šta vidimo, ali provera ne zamenjuje garanciju. Skriveni kvar koji se ne pokazuje ni na dizalici, ni na dijagnostici, može se kasnije pojaviti — to je ograničenje metode, a ne izuzetak sitnim slovima.
  en:
    indexMetaTitle: 'Car Services in Belgrade: Repair and Maintenance - CarLab'
    indexMetaDescription: Diagnostics, maintenance and oil changes, brakes and suspension, engine and gearbox, accident repair, pre-purchase inspection. Prices, duration, warranty.
    indexEyebrow: Services
    indexHeading: Everything your car needs, in one service
    indexLead: Each service has its own page — what’s included, how long it takes, signs you need to visit us, and when we honestly say it’s not necessary.
    specsPriceLabel: Price
    specsDurationLabel: Duration
    diagnostics:
      name: Computer Diagnostics
      short: We find out what’s behind the error code.
      metaTitle: Car Computer Diagnostics in Belgrade - CarLab
      metaDescription: Diagnostics for engine, suspension, and electrics in Belgrade. Error reading is free, we show the cause directly on the car.
      heroEyebrow: Diagnostics
      heroTitle: Error code — a symptom, not a diagnosis
      heroLead: The scanner will tell us which sensor is malfunctioning. Whether it’s the sensor itself or what it measures won’t be revealed by the scanner — that’s determined on the car.
      priceFrom: error reading — free
      duration: from 40 minutes
      bodyHeading: What We Do in Diagnostics
      body: |-
        First we talk: when it started, under what conditions, what was changed previously. Some diagnoses can be made here: ‘knocking only when cold’ and ‘knocking constantly’ refer to different components.

        Then the scanner checks all units at once: often an error in ABS or comfort module explains the driver’s complaint. Next, we inspect the car: lift, check for play, assess under load, and if necessary measure pressure and use an oscilloscope.

        Finally, we show the cause on the car and explain it clearly. If repairs are needed, we provide an estimate right away.

        How much it costs: error reading is free. Paid diagnostics occur only when we need to disassemble a component or put the car on a bench, and we quote the price before we start work, not after.
      includesHeading: What’s Included
      includes:
        - Symptoms and service history questionnaire
        - Error reading across all electronic units
        - Inspection on the lift, checking play and leaks
        - Test drive with the engineer, if the issue appears while driving
        - Verbal report and written repair estimate
      signsHeading: When to Come to Us
      signs:
        - ‘Check’ light or another indicator is on
        - The car jerks, misfires, or has trouble starting
        - Fuel consumption has increased without a clear reason
        - A new sound appears, and you can’t identify it
      honestHeading: What We Don’t Promise
      honest: Not every malfunction can be detected in forty minutes. Intermittent issues that occur once a week may require a follow-up visit or leaving the car for a day — we’ll let you know right away and won’t change parts sequentially at your expense.
    servicing:
      name: Scheduled Maintenance
      short: Oil, filters, fluids, and inspection — according to your engine’s specifications.
      metaTitle: Scheduled Maintenance and Oil Change in Belgrade - CarLab
      metaDescription: 'Car maintenance in Belgrade: oil, filters, spark plugs, brake fluid, coolant. According to manufacturer’s specifications, with a record in the service card.'
      heroEyebrow: Maintenance
      heroTitle: The cheapest repair is the one that didn’t happen
      heroLead: Each engine has its own interval and oil specification. We check your car’s manual and do what it states, not the average ‘every ten thousand’.
      priceFrom: from 90 €
      duration: 2–4 hours
      bodyHeading: Where the Interval for Your Car Comes From
      body: |-
        Replacement intervals differ significantly among engines, and conditions in Belgrade — traffic jams, dust, summers nearing forty degrees — often fall under ‘severe operating conditions’ with shortened intervals. We base our estimate on what your car actually needs at this mileage.

        We also check what people usually remember too late: the condition of the timing belt or chain, moisture in the brake fluid, freezing temperature of the coolant, wear of pads and discs in millimeters.
      includesHeading: What’s Included
      includes:
        - Oil and oil filter meeting your manufacturer’s specifications
        - Air and cabin filter, spark plugs according to regulations
        - Brake fluid moisture check
        - Coolant check and freezing temperature evaluation
        - Measurement of pad and disc thickness in millimeters
        - Recording all work and mileage in the service card
      signsHeading: When to Come to Us
      signs:
        - Mileage or a year has passed since the last maintenance
        - Car is newly purchased, and there’s no service history
        - An upcoming long trip
        - The service interval light is on
      honestHeading: What We Don’t Do
      honest: We don’t replace items that still have life left in them. If a filter has used half of its capacity, we won’t touch it and will inform you of when to return.
    brakes-suspension:
      name: Brakes and Suspension
      short: Everything responsible for whether the car stops or not.
      metaTitle: Brake and Suspension Repair in Belgrade - CarLab
      metaDescription: 'Brake and suspension work in Belgrade: pads, discs, calipers, arms, wheel alignment. Measurements in millimeters, estimate prior to work, 12 months warranty.'
      heroEyebrow: Chassis
      heroTitle: Resource is measured in millimeters here
      heroLead: You can stretch the engine until it's due for service. You cannot do the same with brakes. Therefore, we are precise with suspension — if the resource is gone, we tell you directly.
      priceFrom: from 120 €
      duration: from 3 hours
      bodyHeading: How We Do It
      body: |-
        We start with measurements: disc and pad thickness in millimeters, runout, condition of hoses and calipers. For the suspension — we check for play on the lift and on the vibration stand, inspecting bellows and mounts.

        After any suspension repair, we always perform a wheel alignment: even replacing one arm changes the geometry, and incorrect geometry can lead to tire wear in a season.
      includesHeading: What’s Included
      includes:
        - Measurement of discs and pads with results recorded
        - Replacement of pads, discs, hoses, repair or replacement of calipers
        - Bleeding and replacing brake fluid
        - Struts, springs, arms, bushings, mounts, and bearings
        - Wheel alignment after any intervention in the suspension
        - Check test drive before handing over the car
      signsHeading: When to Come to Us
      signs:
        - Squeaking, squealing, or grinding when braking
        - The pedal feels soft or sinks
        - The car pulls to one side while braking
        - Clunks over bumps, ‘floating’ steering, uneven tire wear
      honestHeading: What We Warn About
      honest: Pads and discs are consumables that work as a pair. You can install new pads on worn discs, but the lifespan of pads decreases, and in six months you'll be back. We’ll calculate both options and leave the choice to you.
    engine-gearbox:
      name: Engine and Gearbox
      short: From gasket replacement to overhaul — with a clear estimate.
      metaTitle: Engine and Transmission Repair in Belgrade - CarLab
      metaDescription: 'Engine and gearbox repair in Belgrade: timing belts, gaskets, clutches, automatic transmission oil changes. Diagnostics before disassembly, estimate before work, 12-month warranty.'
      heroEyebrow: Powertrain
      heroTitle: Major repairs aren't needed as often as people think
      heroLead: "Before disassembling anything, we check what's accessible outside: compression, oil pressure, error codes, leaks."
      priceFrom: based on diagnostics results
      duration: from 1 day
      bodyHeading: How we work
      body: |
        First, we measure: cylinder compression, oil pressure, spark plug condition, block errors, pressure leaks. Only after that do we decide if we need to open the engine.

        For gearboxes, we examine oil condition and shifting logic — for automatics, most 'failures' are solved with proper servicing, not unit replacement. If repair is needed, you receive an estimate broken down by labor and parts before any disassembly begins.
      includesHeading: What’s Included
      includes:
        - Compression and oil pressure measurement
        - Leak test under pressure, checking for air intake
        - Timing belt or chain replacement, rollers and pump
        - Gaskets, seals, valve stem seals
        - Clutch, flywheel, oil change for manual and automatic transmission
        - Estimate with breakdown before disassembly
      signsHeading: When to Come to Us
      signs:
        - Oil consumption between changes
        - Knocking, vibration, or loss of power
        - Jerking and delays during gear shifts
        - Smoke from the exhaust that wasn't there before
      honestHeading: When we advise against repair
      honest: If repair costs approach the car's value, we'll tell you. Sometimes the right advice is to sell as is or look for a replacement unit, rather than invest in repairs that the car will never recoup.
    bodywork-painting:
      name: Body and Painting
      short: Restoration after accidents, frame alignment, and paint matching.
      metaTitle: Body repair and painting after accidents in Belgrade — CarLab
      metaDescription: 'Body repair in Belgrade: frame alignment, body geometry measurement, dent removal, paint matching with computer assistance. We work with insurance, help with documents.'
      heroEyebrow: After an accident
      heroTitle: So your car doesn't look 'damaged'
      heroLead: Good body repair is not visible to the eye or a thickness gauge during a pre-sale inspection.
      priceFrom: based on inspection results
      duration: from 3 days
      bodyHeading: What is included in restoration
      body: |
        First, we measure the body geometry: after an accident, misalignments can exist where everything looks fine, and they lead to uneven tire wear and steering issues. If necessary, we put it on a frame machine and align it according to control points.

        We match color twice — using the code from documents and a spectrophotometer, because over five years in the sun, the factory color differs from the original. We polish the transition so that the line isn't visible in sunlight or under a lamp.
      includesHeading: What’s Included
      includes:
        - Body geometry measurement at control points
        - Frame machine and pulling for misalignments
        - Dent removal, replacement of damaged parts
        - Color matching by code and spectrophotometer
        - Painting in a booth with temperature control
        - Polishing the transition and reassembly with gap checking
      signsHeading: When to Come to Us
      signs:
        - There was an accident, even if damage looks minor
        - Uneven gaps between body panels
        - The car pulls to one side, tires wear unevenly
        - Need to restore body condition before selling
      honestHeading: About insurance
      honest: We work with insurance and assist with documents, but we don’t promise that everything will be covered. After inspection, we will show you immediately what is covered under the insurance claim and what is not, so you won’t be surprised at the end.
    pre-purchase-inspection:
      name: Pre-purchase Inspection
      short: Thickness gauge, lift, and scanner before you pay.
      metaTitle: Car inspection before purchase in Belgrade — CarLab
      metaDescription: 'Technical inspection before purchase in Belgrade: thickness gauge, lift, error diagnostics, compression test. Written report and bargaining assistance.'
      heroEyebrow: Before the deal
      heroTitle: What the thickness gauge reveals, the seller won't tell
      heroLead: Repainted panels, welding traces, odometer fraud, leaks underneath — these are visible in an hour on the lift, though not mentioned in the ad.
      priceFrom: from 60 €
      duration: about 1 hour
      bodyHeading: What we check
      body: |
        Body — thickness measurement on all panels: repainted parts, body filler, welding traces, gap condition. Next, we check on the lift: suspension, leaks, exhaust condition, signs of bottom impacts.

        Electronics — reading error codes across all systems, including tampered and erased ones. For the engine — compression and leaks. In the end, you receive a written report with a list of findings and an estimated cost for repairs that can aid in negotiation.
      includesHeading: What’s Included
      includes:
        - Measurement of paint thickness on all body panels
        - Inspection on the lift, checking for leaks and impact traces
        - Error reading across all electronic units
        - Compression measurement across cylinders
        - Checking for signs of odometer tampering
        - Written report with repair cost estimation
      signsHeading: When it’s needed
      signs:
        - Buying a used car
        - Seller pushes for a quick decision
        - Car imported from abroad, unknown history
        - Price suspiciously below market
      honestHeading: Limitations of the inspection
      honest: We will honestly tell you what we see, but the inspection does not replace a warranty. Hidden defects that don’t surface on the lift or diagnostics may emerge later — that’s a limitation of the method, not a fine-print disclaimer.
