diagnostics:
  name: Компьютерная диагностика
  short: Находим, что стоит за кодом ошибки.
  metaTitle: Компьютерная диагностика автомобиля в Белграде — CarLab
  metaDescription: Диагностика двигателя, подвески и электрики в Белграде. Считывание ошибок бесплатно, причину показываем прямо на машине.
  heroEyebrow: Диагностика
  heroTitle: Код ошибки — это симптом, а не диагноз
  heroLead: Сканер скажет, какой датчик ругается. Виноват сам датчик или то, что он измеряет, сканер не покажет — это выясняется уже на машине.
  priceFrom: считывание ошибок — бесплатно
  duration: от 40 минут
  bodyHeading: Что мы делаем на диагностике
  body: |
    Сначала разговор: когда началось, при каких условиях, что менялось до этого. Часть диагнозов ставится уже здесь: «стучит только на холодную» и «стучит постоянно» — это разные узлы.

    Потом сканер по всем блокам сразу: часто ошибка в ABS или в блоке комфорта объясняет то, на что жалуется водитель. Дальше — проверка на машине: подъёмник, люфты, осмотр под нагрузкой, при необходимости замер давления и осциллограф.

    В конце показываем причину на автомобиле и объясняем на пальцах. Если нужен ремонт, сразу считаем смету.

    Сколько это стоит: считывание ошибок — бесплатно. Платной диагностика становится только тогда, когда нужно разбирать узел или ставить машину на стенд, и цену мы называем до начала работ, а не в конце.
  includesHeading: Что входит
  includes:
    - Опрос по симптомам и истории обслуживания
    - Считывание ошибок по всем электронным блокам
    - Осмотр на подъёмнике, проверка люфтов и утечек
    - Тест-драйв с инженером, если проблема проявляется в движении
    - Устное заключение и письменная смета на ремонт
  signsHeading: Когда пора к нам
  signs:
    - Горит «чек» или другой значок на панели
    - Машина дёргается, троит или плохо заводится
    - Расход вырос без понятной причины
    - Появился новый звук, и вы не понимаете откуда
  honestHeading: Что мы не обещаем
  honest: Не каждая неисправность ловится за сорок минут. Плавающие проблемы, которые появляются раз в неделю, иногда требуют повторного визита или оставить машину на день — мы скажем об этом сразу и не станем менять детали по очереди за ваш счёт.
servicing:
  name: Плановое ТО
  short: Масло, фильтры, жидкости и осмотр — по регламенту вашего двигателя.
  metaTitle: Плановое ТО и замена масла в Белграде — CarLab
  metaDescription: 'Техническое обслуживание автомобиля в Белграде: масло, фильтры, свечи, тормозная жидкость, антифриз. По регламенту производителя, с записью в сервисную карту.'
  heroEyebrow: Обслуживание
  heroTitle: Самая дешёвая починка — та, которой не случилось
  heroLead: У каждого мотора свой интервал и свой допуск по маслу. Мы смотрим мануал на вашу машину и делаем то, что написано там, а не среднее «раз в десять тысяч».
  priceFrom: от 90 €
  duration: 2–4 часа
  bodyHeading: Откуда берётся интервал для вашей машины
  body: |
    Интервалы замены у разных моторов отличаются в разы, а условия Белграда — пробки, пыль, лето под сорок — почти всегда попадают под «тяжёлые условия эксплуатации» с укороченным интервалом. По ним и считаем, что реально нужно вашей машине на этом пробеге.

    Заодно проверяем то, что обычно вспоминают слишком поздно: состояние ремня или цепи, тормозную жидкость на влагу, антифриз на температуру замерзания, износ колодок и дисков в миллиметрах.
  includesHeading: Что входит
  includes:
    - Масло и масляный фильтр с допуском вашего производителя
    - Воздушный и салонный фильтр, свечи по регламенту
    - Проверка тормозной жидкости на содержание влаги
    - Проверка антифриза и его температуры замерзания
    - Замер остатка колодок и дисков в миллиметрах
    - Запись всех работ и пробега в сервисную карту
  signsHeading: Когда пора к нам
  signs:
    - Подошёл пробег или год с прошлого ТО
    - Машина только куплена, а истории обслуживания нет
    - Впереди дальняя дорога
    - Загорелась лампа сервисного интервала
  honestHeading: Что мы не делаем
  honest: Не меняем то, чему ещё рано. Если фильтр отработал половину ресурса, мы его не тронем и скажем, когда приезжать.
brakes-suspension:
  name: Тормоза и подвеска
  short: Всё, что отвечает за то, остановится машина или нет.
  metaTitle: Ремонт тормозов и подвески в Белграде — CarLab
  metaDescription: 'Тормоза и подвеска в Белграде: колодки, диски, суппорты, рычаги, развал-схождение. Замеры в миллиметрах, смета до работ.'
  heroEyebrow: Ходовая
  heroTitle: Здесь ресурс считают в миллиметрах
  heroLead: 'Мотор можно дотянуть до сервиса. Тормоза — нет. Поэтому по ходовой мы не округляем и не тянем: если ресурс кончился, говорим прямо.'
  priceFrom: от 120 €
  duration: от 3 часов
  bodyHeading: Как мы это делаем
  body: |
    Начинаем с замеров: толщина дисков и колодок в миллиметрах, биение, состояние шлангов и суппортов. По подвеске — проверка люфтов на подъёмнике и на вибростенде, осмотр пыльников и опор.

    После ремонта ходовой всегда делаем развал-схождение: даже замена одного рычага меняет геометрию, а неправильная геометрия съедает комплект резины за сезон.
  includesHeading: Что входит
  includes:
    - Замер дисков и колодок с записью результата
    - Замена колодок, дисков, шлангов, ремонт или замена суппортов
    - Прокачка и замена тормозной жидкости
    - Стойки, пружины, рычаги, сайлентблоки, опоры и подшипники
    - Развал-схождение после любого вмешательства в подвеску
    - Контрольный тест-драйв перед выдачей
  signsHeading: Когда пора к нам
  signs:
    - Скрип, писк или скрежет при торможении
    - Педаль стала мягкой или проваливается
    - Машину уводит в сторону при торможении
    - Стуки на неровностях, «плавающий» руль, неравномерный износ резины
  honestHeading: О чём предупредим
  honest: Колодки и диски — расходник, который ходит парой. Ставить новые колодки на изношенные диски можно, но ресурс колодок при этом падает, и через полгода вы приедете снова. Мы посчитаем оба варианта и оставим выбор вам.
engine-gearbox:
  name: Двигатель и коробка
  short: От замены прокладки до ремонта с разбором — с понятной сметой.
  metaTitle: Ремонт двигателя и коробки передач в Белграде — CarLab
  metaDescription: 'Ремонт двигателя и трансмиссии в Белграде: ГРМ, прокладки, сцепление, замена масла в АКПП. Диагностика до разбора, смета до работ.'
  heroEyebrow: Силовой агрегат
  heroTitle: «Капиталка» нужна не так часто, как её называют
  heroLead: 'Прежде чем что-то разбирать, мы проверяем то, что проверяется снаружи: компрессию, давление масла, ошибки, утечки.'
  priceFrom: по результатам диагностики
  duration: от 1 дня
  bodyHeading: Порядок работы
  body: |
    Сначала измеряем: компрессия по цилиндрам, давление масла, состояние свечей, ошибки по блокам, утечки под давлением. Только после этого решаем, нужно ли вскрывать мотор.

    По коробкам смотрим состояние масла и логику переключений — у автоматов большая часть «поломок» лечится корректным обслуживанием, а не заменой агрегата. Если ремонт всё же нужен, вы получаете смету с разбивкой на работу и запчасти до того, как что-то снято.
  includesHeading: Что входит
  includes:
    - Замер компрессии и давления масла
    - Проверка на утечки под давлением, поиск подсоса воздуха
    - Замена ремня или цепи ГРМ, роликов и помпы
    - Прокладки, сальники, маслосъёмные колпачки
    - Сцепление, маховик, замена масла в механике и автомате
    - Смета с разбивкой до начала разбора
  signsHeading: Когда пора к нам
  signs:
    - Масло уходит между заменами
    - Стук, вибрация или потеря тяги
    - Рывки и задержки при переключении передач
    - Дым из выхлопа, которого раньше не было
  honestHeading: Когда мы отговариваем
  honest: Если стоимость ремонта подходит к стоимости машины, мы это скажем. Иногда правильный совет — продать как есть или искать контрактный агрегат, а не вкладывать в ремонт сумму, которую машина никогда не вернёт.
bodywork-painting:
  name: Кузов и покраска
  short: Восстановление после ДТП, правка геометрии и покраска с подбором цвета.
  metaTitle: Кузовной ремонт и покраска после ДТП в Белграде — CarLab
  metaDescription: 'Кузовной ремонт в Белграде: стапель, замер геометрии, рихтовка, покраска с компьютерным подбором цвета. Работаем со страховыми, помогаем с документами.'
  heroEyebrow: После ДТП
  heroTitle: Чтобы машина не выглядела «после удара»
  heroLead: Хороший кузовной ремонт не видно ни глазом, ни толщиномером на осмотре перед продажей.
  priceFrom: по результатам осмотра
  duration: от 3 дней
  bodyHeading: Что входит в восстановление
  body: |
    Сначала замеряем геометрию кузова: после удара смещения бывают там, где визуально всё цело, и именно они потом дают неравномерный износ резины и увод машины. При необходимости ставим на стапель и вытягиваем по контрольным точкам.

    Цвет подбираем дважды — по коду из документов и спектрофотометром по факту, потому что за пять лет на солнце заводской цвет уходит от паспортного. Переход полируем так, чтобы граница не читалась ни на солнце, ни под лампой.
  includesHeading: Что входит
  includes:
    - Замер геометрии кузова по контрольным точкам
    - Стапель и вытяжка при смещениях
    - Рихтовка, замена повреждённых элементов
    - Подбор цвета по коду и спектрофотометром
    - Покраска в камере с контролем температуры
    - Полировка перехода и сборка с проверкой зазоров
  signsHeading: Когда пора к нам
  signs:
    - Было ДТП, даже если повреждения выглядят мелкими
    - Неравномерные зазоры между деталями кузова
    - Машину уводит, резина изнашивается «в один край»
    - Нужно привести кузов в порядок перед продажей
  honestHeading: О страховых
  honest: Мы работаем со страховыми и помогаем с документами, но не обещаем, что страховая покроет всё. После осмотра мы сразу показываем, что попадает в страховой случай, а что нет, чтобы вы не узнали об этом в конце.
pre-purchase-inspection:
  name: Проверка перед покупкой
  short: Толщиномер, подъёмник и сканер до того, как вы отдали деньги.
  metaTitle: Проверка автомобиля перед покупкой в Белграде — CarLab
  metaDescription: 'Техническая проверка перед покупкой в Белграде: толщиномер, подъёмник, диагностика ошибок, компрессия. Письменное заключение и торг в вашу пользу.'
  heroEyebrow: Перед сделкой
  heroTitle: Что покажет толщиномер, продавец не расскажет
  heroLead: Перекрашенные панели, следы сварки, скрученный пробег, утечки снизу — за час на подъёмнике это видно, хотя в объявлении об этом не пишут.
  priceFrom: от 60 €
  duration: около 1 часа
  bodyHeading: Что мы проверяем
  body: |
    Кузов — толщиномером по всем панелям: перекрашенные элементы, шпаклёвка, следы сварки, состояние зазоров. Дальше подъёмник: подвеска, утечки, состояние выхлопа и защиты, следы ударов снизу.

    Электроника — считывание ошибок по всем блокам, включая скрученные и стёртые. По мотору — компрессия и утечки. В конце вы получаете письменное заключение со списком найденного и оценкой стоимости устранения, с которым можно торговаться.
  includesHeading: Что входит
  includes:
    - Замер толщины лака по всем панелям кузова
    - Осмотр на подъёмнике, проверка на утечки и следы ударов
    - Считывание ошибок по всем электронным блокам
    - Замер компрессии по цилиндрам
    - Проверка на признаки скрученного пробега
    - Письменное заключение с оценкой стоимости устранения
  signsHeading: Когда это нужно
  signs:
    - Покупаете машину с рук
    - Продавец торопит с решением
    - Машина привезена из-за границы, история неизвестна
    - Цена подозрительно ниже рынка
  honestHeading: Чего проверка не даёт
  honest: Мы честно скажем, что видим, но ни один осмотр не ловит всё. Скрытый дефект, который не проявляется ни на подъёмнике, ни на диагностике, может всплыть позже — это ограничение метода, а не оговорка мелким шрифтом.
translations:
  sr:
    indexMetaTitle: 'Usluge auto servisa u Beogradu: popravka i TO - CarLab'
    indexMetaDescription: Dijagnostika, TO i zamena ulja, kočnice i suspenzija, motor i menjač, karoserijski popravci posle udesa, provera pre kupovine. Cene i rokovi.
    indexEyebrow: Usluge
    indexHeading: Sve što treba vašem automobilu na jednom mestu
    indexLead: Za svaku uslugu postoji posebna stranica - šta uključuje, koliko traje, po kojim znacima je vreme da nas posetite i kada iskreno kažemo da nije potrebno ništa raditi.
    specsPriceLabel: Cena
    specsDurationLabel: Rok
    diagnostics:
      name: Komjuterska dijagnostika
      short: Pronalaženje uzroka greške.
      metaTitle: Komjuterska dijagnostika automobila u Beogradu - CarLab
      metaDescription: Dijagnostika motora, suspenzije i elektrike u Beogradu. Čitanje grešaka besplatno, uzrok pokazujemo direktno na automobilu.
      heroEyebrow: Dijagnostika
      heroTitle: Kod greške - to je simptom, a ne dijagnoza
      heroLead: Skeniramo koji senzor izaziva problem. Da li je sensor ili ono što meri u pitanju, skener neće pokazati - to se utvrđuje na vozilu.
      priceFrom: čitanje grešaka - besplatno
      duration: od 40 minuta
      bodyHeading: Šta radimo tokom dijagnostike
      body: |-
        Prvo razgovaramo: kada je počelo, pod kojim uslovima, šta je menjan pre toga. Deo dijagnoza se postavlja ovde: 'zvoni samo kada je hladno' i 'zvoni stalno' - to su različiti sklopovi.

        Potom skener prolazi kroz sve blokove odjednom: često greška u ABS-u ili u bloku udobnosti objašnjava na šta se vozač žali. Zatim - provera na automobilu: dizalica, luftovi, pregled pod opterećenjem, po potrebi mera pritiska i osciloskop.

        Na kraju pokazujemo uzrok na automobilu i objašnjavamo rečima. Ako je potrebna popravka, odmah pravimo ponudu.

        Koliko košta: čitanje grešaka - besplatno. Plaćena dijagnostika postaje samo kad treba rastavljati sklop ili staviti automobil na test, a cenu navodimo pre početka rada, a ne na kraju.
      includesHeading: Šta je uključeno
      includes:
        - Anketiranje o simptomima i istoriji servisa
        - Čitanje grešaka svih elektronskih blokova
        - Pregled na dizalici, provera luftova i curenja
        - Test-vožnja sa inženjerom ako se problem manifestuje u kretanju
        - Usmeno obaveštenje i pismena ponuda za popravku
      signsHeading: Kada je vreme da dođete kod nas
      signs:
        - Svetli 'check' ili druga lampica na tabli
        - Automobil se trese, troši ili slabo se pali
        - Potrošnja je porasla bez jasnog razloga
        - Pojavila se nova buka, a ne razumete odakle dolazi
      honestHeading: Šta ne obećavamo
      honest: Nije svaka greška uhvaćena za četrdeset minuta. Fluktuirajući problemi, koji se javljaju jednom nedeljno, ponekad zahtevaju ponovni dolazak ili ostavljanje automobila dan - o tome ćemo vas odmah obavestiti i nećemo menjati delove korak po korak na vaš račun.
    servicing:
      name: Planirano TO
      short: Ulje, filteri, tečnosti i pregled - prema propisima vašeg motora.
      metaTitle: Planirano TO i zamena ulja u Beogradu - CarLab
      metaDescription: 'Tehničko održavanje automobila u Beogradu: ulje, filteri, sveće, kočionu tečnost, antifriz. Prema propisima proizvođača, uz upis u servisnu knjigu.'
      heroEyebrow: Održavanje
      heroTitle: Najjeftinija popravka - ona koja se nije dogodila
      heroLead: Svaki motor ima svoj interval i svoju dozvolu po ulju. Mi gledamo u uputstvo za vašu mašinu i radimo ono što je tamo napisano, a ne srednje 'svakih deset hiljada'.
      priceFrom: od 90 €
      duration: 2–4 sata
      bodyHeading: Odakle dolazi interval za vaš automobil
      body: |-
        Intervali zamene se za različite motore razlikuju više od drastičnih razmera, dok su uslovi Beograda - gužve, prašina, letnje temperature do četrdeset - gotovo uvek u okviru 'teških uslova korišćenja' sa skraćenim intervalima. Po njima i računamo šta je stvarno potrebno vašem automobilu na ovom pređenom putu.

        Usput proveravamo ono što obično biva zapamćeno prekasno: stanje remena ili lanca, kočionu tečnost na vlagu, antifriz na tačku smrzavanja, trošenje kočnica i diskova u milimetrima.
      includesHeading: Šta je uključeno
      includes:
        - Ulje i uljni filter prema dozvolama vašeg proizvođača
        - Vazdušni i kabinski filter, sveće prema propisima
        - Provera kočione tečnosti na sadržaj vlage
        - Provera antifriza i njegove tačke smrzavanja
        - Merenje preostalog sloja kočnica i diskova u milimetrima
        - Upis svih radova i pređene kilometraže u servisnu knjigu
      signsHeading: Kada je vreme da dođete kod nas
      signs:
        - Prošlo je pređeni broj kilometara ili godina od poslednjeg TO
        - Automobil je tek kupljen i nema istorije servisa
        - Ispred je dugačka vožnja
        - Upalila se lampica servisnog intervala
      honestHeading: Šta ne radimo
      honest: Ne menjamo ono što još nije vreme. Ako je filter odradio polovinu resursa, nećemo ga dirati i reći ćemo vam kada je vreme da dođete.
    brakes-suspension:
      name: Kočnice i suspenzija
      short: Sve što je odgovorno za to da li će automobil stati ili ne.
      metaTitle: Popravka kočnica i suspenzije u Beogradu - CarLab
      metaDescription: 'Kočnice i suspenzija u Beogradu: kočnice, diskovi, klipovi, poluge, razmak - geometrija. Merenja u milimetrima, ponuda pre radova.'
      heroEyebrow: Kretanje
      heroTitle: Ovde se resurs meri u milimetrima
      heroLead: 'Motor može izdržati do servisnog pregleda. Kočnice - ne. Zbog toga pri suspenziji ne zaokružujemo i ne produžavamo: ako je resurs istekao, direktno kažemo.'
      priceFrom: od 120 €
      duration: od 3 sata
      bodyHeading: Kako to radimo
      body: |-
        Počinjemo sa merenjem: debljina diskova i kočnica u milimetrima, udar, stanje creva i klipova. Kod suspenzije - provera luftova na dizalici i vibracionom stolu, pregled guma i ležajeva.

        Nakon popravke po suspenziji uvek radimo razmak - geometrija se menja čak i zamjenom jednog poluga, a pogrešna geometrija može da uništi ceo set guma za jednu sezonu.
      includesHeading: Šta je uključeno
      includes:
        - Merenje diskova i kočnica uz upis rezultata
        - Zamena kočnica, diskova, creva, popravka ili zamena klipova
        - Ulivanje i zamena kočione tečnosti
        - Amortizeri, opruge, poluge, silentblokovi, ležajevi i ležajevi
        - Razmak posle svake intervencije u suspenziji
        - Kontrolna test-vožnja pre izdavanja
      signsHeading: Kada je vreme da dođete kod nas
      signs:
        - Škripa, cviljenje ili škripa pri kočenju
        - Pedala je postala mekana ili se saginje
        - Automobil skreće u stranu pri kočenju
        - Udari na neravnim površinama, 'plutajući' volan, neujednačeno trošenje guma
      honestHeading: O čemu ćemo vas obavestiti
      honest: Kočnice i diskovi su potrošni materijal koji se troši u paru. Stavljanje novih kočnica na istrošene diskove je moguće, ali resurs kočnica pri tome opada, i za pola godine ćete se ponovo javiti. Izračunaćemo obe opcije i ostaviti izbor vama.
    engine-gearbox:
      name: Motor i menjač
      short: Od zamene dihtunga do popravke sa rastavljanjem - sa jasnom procenom.
      metaTitle: Popravka motora i menjača u Beogradu - CarLab
      metaDescription: 'Popravka motora i transmisije u Beogradu: GRM, dihtunzi, kvačilo, zamena ulja u automatskom menjaču. Dijagnostika pre rastavljanja, procena pre radova.'
      heroEyebrow: Power unit
      heroTitle: „Kapitalka“ nije potrebna tako često kao što je zovu
      heroLead: 'Pre nego što nešto rastavimo, proveravamo ono što možemo sa spoljašnje strane: kompresiju, pritisak ulja, greške, curenja.'
      priceFrom: prema rezultatima dijagnostike
      duration: od 1 dana
      bodyHeading: Redosled rada
      body: |
        Najpre merimo: kompresiju po cilindrima, pritisak ulja, stanje sveća, greške po blokovima, curenja pod pritiskom. Tek nakon toga odlučujemo da li je potrebno otvarati motor.

        Kod menjača gledamo stanje ulja i logiku prebacivanja - kod automatskih menjača većina „kvarova“ se rešava pravilnim servisiranjem, a ne zamenom agregata. Ako je popravka ipak potrebna, dobijate detaljnu ponudu sa razdvajanjem na rad i delove pre nego što nešto bude demontirano.
      includesHeading: Šta je uključeno
      includes:
        - Merenje kompresije i pritiska ulja
        - Provera na curenja pod pritiskom, traženje usisavanja vazduha
        - Zamena remena ili lanca GMP, rolnica i pumpe
        - Dihtunzi, brtve, čepovi za ulje
        - Kvačilo, zamašnjak, zamena ulja u mehaničkom i automatskom menjaču
        - Ponuda sa razdvajanjem pre početka demontaže
      signsHeading: Kada je vreme da dođete kod nas
      signs:
        - Ulje ide između zamena
        - Udari, vibracije ili gubitak vuče
        - Cuca i zastoje prilikom prebacivanja brzina
        - Dim iz izduva koji ranije nije bio prisutan
      honestHeading: Kada savetujemo protiv
      honest: Ako cena popravke približava ceni automobila, reći ćemo vam to. Ponekad je pravi savet - prodati ga kakav jeste ili tražiti ugovoreni agregat, a ne ulagati u popravku iznos koji automobil nikada ne može da vrati.
    bodywork-painting:
      name: Karoserija i farbanje
      short: Obnova nakon saobraćajne nesreće, ispravka geometrije i farbanje uz odabir boje.
      metaTitle: Popravka karoserije i farbanje nakon saobraćajne nesreće u Beogradu - CarLab
      metaDescription: 'Popravka karoserije u Beogradu: štempilj, merenje geometrije, ravnanje, farbanje uz kompjutersko odabiranje boje. Radimo sa osiguravajućim kućama, pomažemo sa dokumentima.'
      heroEyebrow: Nakon saobraćajne nesreće
      heroTitle: Da automobil ne izgleda „posle udarca“
      heroLead: Dobra popravka karoserije se ne vidi ni očima, ni mernim uređajem prilikom pregleda pre prodaje.
      priceFrom: prema rezultatima pregleda
      duration: od 3 dana
      bodyHeading: Šta ulazi u obnovu
      body: |
        Najpre merimo geometriju karoserije: nakon udarca pomeranja se dešavaju i tamo gde vizuelno izgleda sve u redu, i upravo ona kasnije dovode do neujednačenog trošenja guma i skretanja automobila. Kada je potrebno, stavljamo na štempilj i vučemo prema kontrolnim tačkama.

        Boju biramo dvaput - po kodu iz dokumenata i spektrofotometrom na licu mesta, jer se za pet godina na suncu fabrička boja menja od one koja je u pasosu. Prelaz poliramo tako da granica ne bude vidljiva ni na suncu, ni pod lampom.
      includesHeading: Šta je uključeno
      includes:
        - Merenje geometrije karoserije prema kontrolnim tačkama
        - Štempilj i vuča u slučaju pomeranja
        - Ravnanje, zamena oštećenih elemenata
        - Odabir boje po kodu i spektrofotometrom
        - Farbanje u komori sa kontrolom temperature
        - Poliranje prelaza i sastavljanje uz proveru razmaka
      signsHeading: Kada je vreme da dođete kod nas
      signs:
        - Bila je saobraćajna nesreća, čak i ako su oštećenja izgledala sitna
        - Neujednačeni razmaci između delova karoserije
        - Automobil skreće, gume se troše „na jednu stranu”
        - Potrebno je dovesti karoseriju u red pre prodaje
      honestHeading: O osiguranjima
      honest: Radimo sa osiguravajućim kućama i pomažemo sa dokumentima, ali ne obećavamo da će osiguranje pokriti sve. Nakon pregleda odmah pokazujemo šta spada u osiguravajući slučaj, a šta ne, da ne biste saznali to na kraju.
    pre-purchase-inspection:
      name: Provera pre kupovine
      short: Merni uređaj, dizalica i skener pre nego što predate novac.
      metaTitle: Provera automobila pre kupovine u Beogradu - CarLab
      metaDescription: 'Tehnička provera pre kupovine u Beogradu: merni uređaj, dizalica, dijagnostika grešaka, kompresija. Pismeno izveštavanje i pregovaranje u vašu korist.'
      heroEyebrow: Pre transakcije
      heroTitle: Šta će pokazati merni uređaj prodavac neće reći
      heroLead: Prefarbane paneli, tragovi zavarivanja, sniženi pređeni put, curenja sa dna - sve se to uoči za sat na dizalici, iako se u oglasu o tome ne piše.
      priceFrom: od 60 €
      duration: oko 1 sata
      bodyHeading: Šta proveravamo
      body: |
        Karoserija - mernim uređajem po svim panelima: prefarbani elementi, gips, tragovi zavarivanja, stanje razmaka. Zatim dizalica: ovjes, curenja, stanje izduvnog sistema i zaštite, tragovi udarca sa dna.

        Elektronika - čitanje grešaka po svim blokovima, uključujući snižene i izbrisane. Po motoru - kompresija i curenja. Na kraju dobijate pismeno izveštavanje sa spiskom pronalazaka i procenom troškova sanacije, s kojom možete pregovarati.
      includesHeading: Šta je uključeno
      includes:
        - Merenje debljine lakiranja po svim panelima karoserije
        - Pregled na dizalici, provera na curenja i tragovi udarca
        - Čitanje grešaka svih elektronskih blokova
        - Merenje kompresije po cilindrima
        - Provera na znakove sniženog pređenog puta
        - Pismeno izveštavanje sa procenom troškova sanacije
      signsHeading: Kada je to potrebno
      signs:
        - Kupujete automobil od fizičkog lica
        - Prodavac vas žuri s odlukom
        - Automobil je dovezen iz inostranstva, priča nije poznata
        - Cena je sumnjivo niža od tržišne
      honestHeading: Šta provera ne otkriva
      honest: Iskreno ćemo reći šta vidimo, ali nijedan pregled ne može da uhvati sve. Skriveni defekt koji se ne manifestuje ni na dizalici, ni na dijagnostici, može se kasnije pojaviti - to je ograničenje metode, a ne sitna napomena.
  en:
    indexMetaTitle: 'Car Services in Belgrade: Repairs and Maintenance - CarLab'
    indexMetaDescription: Diagnostics, maintenance and oil change, brakes and suspension, engine and gearbox, accident repair, pre-purchase inspection. Prices and timelines.
    indexEyebrow: Services
    indexHeading: Everything your car needs, all in one service
    indexLead: Each service has its own page — what’s included, how long it takes, signs to visit us, and when we honestly say no need for repairs.
    specsPriceLabel: Price
    specsDurationLabel: Duration
    diagnostics:
      name: Computer Diagnostics
      short: Identifying what the error code means.
      metaTitle: Computer Diagnostics in Belgrade - CarLab
      metaDescription: Engine, suspension, and electrical diagnostics in Belgrade. Error reading is free, we show the reason right on the car.
      heroEyebrow: Diagnostics
      heroTitle: An error code is a symptom, not a diagnosis
      heroLead: The scanner will tell you which sensor is malfunctioning. Whether it’s the sensor itself or what it measures isn’t displayed by the scanner — that’s determined directly on the vehicle.
      priceFrom: error reading — free
      duration: from 40 minutes
      bodyHeading: What we do in diagnostics
      body: |-
        It starts with a conversation: when it began, under what conditions, what has been changed since. Some diagnoses can already be made here: 'knocking only when cold' and 'knocking constantly' — these are different components.

        Next, a scanner checks all control units at once: often, an error in ABS or the comfort module explains what the driver complains about. Then, we inspect the car: lift, checking for play, inspection under load, measuring pressure and using an oscilloscope when necessary.

        At the end, we show the cause on the car and explain clearly. If repair is needed, we provide an estimate immediately.

        How much does it cost: error reading is free. Paid diagnostics only apply when we need to disassemble a unit or put the car on the stand, and we quote the price before starting work, not at the end.
      includesHeading: What’s included
      includes:
        - Symptom and service history questionnaire
        - Error reading across all electronic units
        - Inspection on the lift, checking play and leaks
        - Test drive with an engineer if the issue occurs while driving
        - Verbal conclusion and written estimate for repair
      signsHeading: When to visit us
      signs:
        - The 'check' or another icon is lit on the dashboard
        - The car jerks, misfires, or has trouble starting
        - Fuel consumption has increased without a clear reason
        - A new sound has appeared, and you can’t identify where it’s from
      honestHeading: What we don’t promise
      honest: Not every fault can be detected in forty minutes. Intermittent issues that appear once a week may require a follow-up visit or leaving the car for a day — we will inform you right away and will not replace parts sequentially at your expense.
    servicing:
      name: Scheduled Maintenance
      short: Oil, filters, fluids, and inspection — according to your engine's regulations.
      metaTitle: Scheduled Maintenance and Oil Change in Belgrade - CarLab
      metaDescription: 'Car maintenance in Belgrade: oil, filters, spark plugs, brake fluid, antifreeze. According to manufacturer’s regulations, with record in the service booklet.'
      heroEyebrow: Maintenance
      heroTitle: The cheapest repair is the one that didn't happen
      heroLead: Each engine has its own interval and oil allowance. We refer to the manual for your vehicle and do what's listed there, not the average 'every ten thousand kilometers.'
      priceFrom: from 90 €
      duration: 2–4 hours
      bodyHeading: Where the intervals for your vehicle come from
      body: |-
        Replacement intervals vary significantly between different engines, and the conditions in Belgrade — traffic jams, dust, summer heat — generally fall under 'heavy driving conditions' with shortened intervals. We calculate what your car actually needs at this mileage.

        Additionally, we check what is often remembered too late: the condition of the timing belt or chain, brake fluid for moisture, antifreeze for freeze temperature, and wear of pads and discs in millimeters.
      includesHeading: What’s included
      includes:
        - Oil and oil filter approved by your manufacturer
        - Air and cabin filter, spark plugs as per regulations
        - Brake fluid moisture content check
        - Antifreeze check and its freeze temperature
        - Measurement of pad and disc remaining thickness in millimeters
        - Recording all work and mileage in the service booklet
      signsHeading: When to visit us
      signs:
        - Mileage or one year since the last maintenance
        - The car is newly purchased, and there's no service history
        - Planning a long trip ahead
        - The service interval light has come on
      honestHeading: What we don’t do
      honest: We don’t change things that don’t need changing yet. If a filter has only used half of its lifespan, we won’t touch it and will advise when to return.
    brakes-suspension:
      name: Brakes and Suspension
      short: Everything that determines whether the car will stop or not.
      metaTitle: Brake and Suspension Repair in Belgrade - CarLab
      metaDescription: 'Brakes and suspension in Belgrade: pads, discs, calipers, control arms, alignment. Measurements in millimeters, estimate before work.'
      heroEyebrow: Chassis
      heroTitle: Here, wear is measured in millimeters
      heroLead: The engine can last until service. The brakes cannot. Therefore, with suspension, we don’t round up or delay; if the wear is finished, we say it straightforward.
      priceFrom: from 120 €
      duration: from 3 hours
      bodyHeading: How we do it
      body: |-
        Starting with measurements: thickness of discs and pads in millimeters, runout, condition of hoses and calipers. For suspension — checking play on the lift and on the vibration stand, inspecting boots and supports.

        After any suspension repair, we always perform an alignment: even replacing one control arm changes geometry, and incorrect geometry can wear out a set of tires in a season.
      includesHeading: What’s included
      includes:
        - Measurement of discs and pads with recording of results
        - Replacement of pads, discs, hoses, repair or replacement of calipers
        - Bleeding and replacement of brake fluid
        - Struts, springs, control arms, bushings, mounts, and bearings
        - Alignment after any intervention in the suspension
        - Test drive before handover
      signsHeading: When to visit us
      signs:
        - Squeaking, screeching, or grinding when braking
        - Pedal feels soft or sinks
        - The car pulls to one side when braking
        - Noises on bumps, 'floating' steering wheel, uneven tire wear
      honestHeading: What we will warn you about
      honest: Pads and discs are consumables that work in pairs. New pads can be installed on worn discs, but the wear life of the pads decreases, and you will return in six months. We will calculate both options and leave the choice to you.
    engine-gearbox:
      name: Engine and Gearbox
      short: From gasket replacement to detailed repairs — with a clear estimate.
      metaTitle: Engine and Gearbox Repair in Belgrade - CarLab
      metaDescription: 'Engine and transmission repair in Belgrade: timing belts, gaskets, clutch, oil change in the automatic transmission. Diagnostics before disassembly, estimate before work.'
      heroEyebrow: Powertrain
      heroTitle: Major repairs aren't needed as often as you might think
      heroLead: 'Before taking anything apart, we check what can be assessed externally: compression, oil pressure, error codes, and leaks.'
      priceFrom: based on diagnostic results
      duration: from 1 day
      bodyHeading: Our process
      body: |-
        First, we measure: compression across the cylinders, oil pressure, spark plug condition, block error codes, and pressure leaks. Only after that do we decide if the engine needs to be opened up.

        For gearboxes, we check the oil condition and shifting logic—most automatic transmission 'issues' can be fixed with proper servicing rather than replacing the unit. If repairs are necessary, you'll receive a detailed estimate for labor and parts before any disassembly is done.
      includesHeading: What’s included
      includes:
        - Compression and oil pressure measurements
        - Pressure leak check and air intake detection
        - Timing belt or chain replacement, rollers, and pump
        - Gaskets, seals, oil scraper rings
        - Clutch, flywheel, oil change in manual and automatic transmissions
        - Estimate provided before disassembly begins
      signsHeading: When to visit us
      signs:
        - Oil consumption between changes
        - Knocking, vibrations or loss of power
        - Jerkiness and delays during gear shifts
        - Smoke from the exhaust that wasn't there before
      honestHeading: When we advise against repair
      honest: If the repair costs approach the vehicle's value, we will tell you. Sometimes, the best advice is to sell it as is or look for a replacement unit rather than investing in repairs that the car will never recoup.
    bodywork-painting:
      name: Bodywork and Painting
      short: Restoration after an accident, frame alignment, and color matching.
      metaTitle: Body repair and painting after an accident in Belgrade — CarLab
      metaDescription: 'Body repair in Belgrade: frame straightening, geometry measurement, dent removal, and painting with computer color matching. We work with insurance companies and assist with paperwork.'
      heroEyebrow: After an accident
      heroTitle: To ensure your car doesn't look 'damaged'
      heroLead: Good body repairs are undetectable to the eye or measurement tools during a pre-sale inspection.
      priceFrom: based on inspection results
      duration: from 3 days
      bodyHeading: What’s included in the restoration
      body: |-
        We start by measuring the body's geometry: impact can cause misalignments that aren’t visually apparent, leading to uneven tire wear and steering issues. If needed, we place the vehicle on a frame machine and pull it back to specifications.

        Color matching is done twice—once by the document code and again using a spectrophotometer since factory colors fade over five years in the sun. The transition is polished so that the boundary is not visible in sunlight or under a lamp.
      includesHeading: What’s included
      includes:
        - Geometry measurement using reference points
        - Frame machine and pulling for misalignments
        - Dent removal, replacement of damaged parts
        - Color matching using document codes and spectrophotometer
        - Painting in a controlled chamber
        - Polishing the transition and assembly with gap checks
      signsHeading: When to visit us
      signs:
        - There has been an accident, even if the damage looks minor
        - Uneven gaps between body panels
        - The vehicle pulls to one side, tires wear unevenly
        - Need to fix the body before selling
      honestHeading: About insurance
      honest: We work with insurance companies and help with paperwork, but we don't guarantee full coverage. After the inspection, we clarify what is categorized as a covered event and what is not, so you won't find out at the end.
    pre-purchase-inspection:
      name: Pre-Purchase Inspection
      short: Thickness measurement tool, lift, and scanner before you hand over your money.
      metaTitle: Car inspection before purchase in Belgrade — CarLab
      metaDescription: 'Technical inspection before purchase in Belgrade: thickness measurement, lift, diagnostics, and compression tests. Written report and negotiation support.'
      heroEyebrow: Before the deal
      heroTitle: What the thickness gauge will reveal that the seller won't tell you
      heroLead: Repainted panels, welding marks, tampered mileage, and leaks underneath—this can all be seen within an hour on a lift, even if it's not mentioned in the advertisement.
      priceFrom: from 60 €
      duration: approximately 1 hour
      bodyHeading: What we inspect
      body: |-
        Body — using a thickness gauge on all panels: repainted sections, putty work, welding marks, gap condition. Next is the lift: suspension, leaks, exhaust condition, and signs of impacts from below.

        Electronics — reading error codes from all units, including tampered and erased codes. For the engine — compression and leak tests. You'll receive a written report listing findings and an estimate for repairs, which can help with negotiations.
      includesHeading: What’s included
      includes:
        - Thickness measurement of paint on all body panels
        - Inspection on the lift, checking for leaks and impact signs
        - Error reading across all electronic units
        - Compression measurement across the cylinders
        - Check for signs of tampered mileage
        - Written report with repair cost estimate
      signsHeading: When you need this
      signs:
        - Buying a car from a private seller
        - The seller is rushing you to decide
        - The car was imported from abroad, history unknown
        - Price is suspiciously lower than the market
      honestHeading: What the inspection won't guarantee
      honest: We will honestly share what we see, but no inspection can catch everything. A hidden defect that doesn't show up on a lift or in diagnostics may manifest later—this is a limitation of the method, not fine print.
