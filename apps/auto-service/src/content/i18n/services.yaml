diagnostics:
  name: Компьютерная диагностика
  short: Находим, что стоит за кодом ошибки.
  metaTitle: Компьютерная диагностика автомобиля в Белграде — CarLab
  metaDescription: Диагностика двигателя, подвески и электрики в Белграде. Считывание ошибок бесплатно, причину показываем прямо на машине.
  heroEyebrow: Диагностика
  heroTitle: Код ошибки — это симптом, а не диагноз
  heroLead: Сканер скажет, какой датчик ругается. Виноват сам датчик или то, что он измеряет, сканер не покажет — это выясняется уже на машине.
  priceFrom: считывание ошибок — бесплатно
  duration: от 40 минут
  warranty: 12 месяцев на устранение
  bodyHeading: Что мы делаем на диагностике
  body: |
    Сначала разговор: когда началось, при каких условиях, что менялось до этого. Часть диагнозов ставится уже здесь: «стучит только на холодную» и «стучит постоянно» — это разные узлы.

    Потом сканер по всем блокам сразу: часто ошибка в ABS или в блоке комфорта объясняет то, на что жалуется водитель. Дальше — проверка на машине: подъёмник, люфты, осмотр под нагрузкой, при необходимости замер давления и осциллограф.

    В конце показываем причину на автомобиле и объясняем на пальцах. Если нужен ремонт, сразу считаем смету.

    Сколько это стоит: считывание ошибок — бесплатно. Платной диагностика становится только тогда, когда нужно разбирать узел или ставить машину на стенд, и цену мы называем до начала работ, а не в конце.
  includesHeading: Что входит
  includes:
    - Опрос по симптомам и истории обслуживания
    - Считывание ошибок по всем электронным блокам
    - Осмотр на подъёмнике, проверка люфтов и утечек
    - Тест-драйв с инженером, если проблема проявляется в движении
    - Устное заключение и письменная смета на ремонт
  signsHeading: Когда пора к нам
  signs:
    - Горит «чек» или другой значок на панели
    - Машина дёргается, троит или плохо заводится
    - Расход вырос без понятной причины
    - Появился новый звук, и вы не понимаете откуда
  honestHeading: Что мы не обещаем
  honest: Не каждая неисправность ловится за сорок минут. Плавающие проблемы, которые появляются раз в неделю, иногда требуют повторного визита или оставить машину на день — мы скажем об этом сразу и не станем менять детали по очереди за ваш счёт.
servicing:
  name: Плановое ТО
  short: Масло, фильтры, жидкости и осмотр — по регламенту вашего двигателя.
  metaTitle: Плановое ТО и замена масла в Белграде — CarLab
  metaDescription: 'Техническое обслуживание автомобиля в Белграде: масло, фильтры, свечи, тормозная жидкость, антифриз. По регламенту производителя, с записью в сервисную карту.'
  heroEyebrow: Обслуживание
  heroTitle: Самая дешёвая починка — та, которой не случилось
  heroLead: У каждого мотора свой интервал и свой допуск по маслу. Мы смотрим мануал на вашу машину и делаем то, что написано там, а не среднее «раз в десять тысяч».
  priceFrom: от 90 €
  duration: 2–4 часа
  warranty: 12 месяцев
  bodyHeading: Откуда берётся интервал для вашей машины
  body: |
    Интервалы замены у разных моторов отличаются в разы, а условия Белграда — пробки, пыль, лето под сорок — почти всегда попадают под «тяжёлые условия эксплуатации» с укороченным интервалом. По ним и считаем, что реально нужно вашей машине на этом пробеге.

    Заодно проверяем то, что обычно вспоминают слишком поздно: состояние ремня или цепи, тормозную жидкость на влагу, антифриз на температуру замерзания, износ колодок и дисков в миллиметрах.
  includesHeading: Что входит
  includes:
    - Масло и масляный фильтр с допуском вашего производителя
    - Воздушный и салонный фильтр, свечи по регламенту
    - Проверка тормозной жидкости на содержание влаги
    - Проверка антифриза и его температуры замерзания
    - Замер остатка колодок и дисков в миллиметрах
    - Запись всех работ и пробега в сервисную карту
  signsHeading: Когда пора к нам
  signs:
    - Подошёл пробег или год с прошлого ТО
    - Машина только куплена, а истории обслуживания нет
    - Впереди дальняя дорога
    - Загорелась лампа сервисного интервала
  honestHeading: Что мы не делаем
  honest: Не меняем то, чему ещё рано. Если фильтр отработал половину ресурса, мы его не тронем и скажем, когда приезжать.
brakes-suspension:
  name: Тормоза и подвеска
  short: Всё, что отвечает за то, остановится машина или нет.
  metaTitle: Ремонт тормозов и подвески в Белграде — CarLab
  metaDescription: 'Тормоза и подвеска в Белграде: колодки, диски, суппорты, рычаги, развал-схождение. Замеры в миллиметрах, смета до работ, гарантия 12 месяцев.'
  heroEyebrow: Ходовая
  heroTitle: Здесь ресурс считают в миллиметрах
  heroLead: 'Мотор можно дотянуть до сервиса. Тормоза — нет. Поэтому по ходовой мы не округляем и не тянем: если ресурс кончился, говорим прямо.'
  priceFrom: от 120 €
  duration: от 3 часов
  warranty: 12 месяцев
  bodyHeading: Как мы это делаем
  body: |
    Начинаем с замеров: толщина дисков и колодок в миллиметрах, биение, состояние шлангов и суппортов. По подвеске — проверка люфтов на подъёмнике и на вибростенде, осмотр пыльников и опор.

    После ремонта ходовой всегда делаем развал-схождение: даже замена одного рычага меняет геометрию, а неправильная геометрия съедает комплект резины за сезон.
  includesHeading: Что входит
  includes:
    - Замер дисков и колодок с записью результата
    - Замена колодок, дисков, шлангов, ремонт или замена суппортов
    - Прокачка и замена тормозной жидкости
    - Стойки, пружины, рычаги, сайлентблоки, опоры и подшипники
    - Развал-схождение после любого вмешательства в подвеску
    - Контрольный тест-драйв перед выдачей
  signsHeading: Когда пора к нам
  signs:
    - Скрип, писк или скрежет при торможении
    - Педаль стала мягкой или проваливается
    - Машину уводит в сторону при торможении
    - Стуки на неровностях, «плавающий» руль, неравномерный износ резины
  honestHeading: О чём предупредим
  honest: Колодки и диски — расходник, который ходит парой. Ставить новые колодки на изношенные диски можно, но ресурс колодок при этом падает, и через полгода вы приедете снова. Мы посчитаем оба варианта и оставим выбор вам.
engine-gearbox:
  name: Двигатель и коробка
  short: От замены прокладки до ремонта с разбором — с понятной сметой.
  metaTitle: Ремонт двигателя и коробки передач в Белграде — CarLab
  metaDescription: 'Ремонт двигателя и трансмиссии в Белграде: ГРМ, прокладки, сцепление, замена масла в АКПП. Диагностика до разбора, смета до работ, гарантия 12 месяцев.'
  heroEyebrow: Силовой агрегат
  heroTitle: «Капиталка» нужна не так часто, как её называют
  heroLead: 'Прежде чем что-то разбирать, мы проверяем то, что проверяется снаружи: компрессию, давление масла, ошибки, утечки.'
  priceFrom: по результатам диагностики
  duration: от 1 дня
  warranty: 12 месяцев
  bodyHeading: Порядок работы
  body: |
    Сначала измеряем: компрессия по цилиндрам, давление масла, состояние свечей, ошибки по блокам, утечки под давлением. Только после этого решаем, нужно ли вскрывать мотор.

    По коробкам смотрим состояние масла и логику переключений — у автоматов большая часть «поломок» лечится корректным обслуживанием, а не заменой агрегата. Если ремонт всё же нужен, вы получаете смету с разбивкой на работу и запчасти до того, как что-то снято.
  includesHeading: Что входит
  includes:
    - Замер компрессии и давления масла
    - Проверка на утечки под давлением, поиск подсоса воздуха
    - Замена ремня или цепи ГРМ, роликов и помпы
    - Прокладки, сальники, маслосъёмные колпачки
    - Сцепление, маховик, замена масла в механике и автомате
    - Смета с разбивкой до начала разбора
  signsHeading: Когда пора к нам
  signs:
    - Масло уходит между заменами
    - Стук, вибрация или потеря тяги
    - Рывки и задержки при переключении передач
    - Дым из выхлопа, которого раньше не было
  honestHeading: Когда мы отговариваем
  honest: Если стоимость ремонта подходит к стоимости машины, мы это скажем. Иногда правильный совет — продать как есть или искать контрактный агрегат, а не вкладывать в ремонт сумму, которую машина никогда не вернёт.
bodywork-painting:
  name: Кузов и покраска
  short: Восстановление после ДТП, правка геометрии и покраска с подбором цвета.
  metaTitle: Кузовной ремонт и покраска после ДТП в Белграде — CarLab
  metaDescription: 'Кузовной ремонт в Белграде: стапель, замер геометрии, рихтовка, покраска с компьютерным подбором цвета. Работаем со страховыми, помогаем с документами.'
  heroEyebrow: После ДТП
  heroTitle: Чтобы машина не выглядела «после удара»
  heroLead: Хороший кузовной ремонт не видно ни глазом, ни толщиномером на осмотре перед продажей.
  priceFrom: по результатам осмотра
  duration: от 3 дней
  warranty: 12 месяцев на покрытие
  bodyHeading: Что входит в восстановление
  body: |
    Сначала замеряем геометрию кузова: после удара смещения бывают там, где визуально всё цело, и именно они потом дают неравномерный износ резины и увод машины. При необходимости ставим на стапель и вытягиваем по контрольным точкам.

    Цвет подбираем дважды — по коду из документов и спектрофотометром по факту, потому что за пять лет на солнце заводской цвет уходит от паспортного. Переход полируем так, чтобы граница не читалась ни на солнце, ни под лампой.
  includesHeading: Что входит
  includes:
    - Замер геометрии кузова по контрольным точкам
    - Стапель и вытяжка при смещениях
    - Рихтовка, замена повреждённых элементов
    - Подбор цвета по коду и спектрофотометром
    - Покраска в камере с контролем температуры
    - Полировка перехода и сборка с проверкой зазоров
  signsHeading: Когда пора к нам
  signs:
    - Было ДТП, даже если повреждения выглядят мелкими
    - Неравномерные зазоры между деталями кузова
    - Машину уводит, резина изнашивается «в один край»
    - Нужно привести кузов в порядок перед продажей
  honestHeading: О страховых
  honest: Мы работаем со страховыми и помогаем с документами, но не обещаем, что страховая покроет всё. После осмотра мы сразу показываем, что попадает в страховой случай, а что нет, чтобы вы не узнали об этом в конце.
pre-purchase-inspection:
  name: Проверка перед покупкой
  short: Толщиномер, подъёмник и сканер до того, как вы отдали деньги.
  metaTitle: Проверка автомобиля перед покупкой в Белграде — CarLab
  metaDescription: 'Техническая проверка перед покупкой в Белграде: толщиномер, подъёмник, диагностика ошибок, компрессия. Письменное заключение и торг в вашу пользу.'
  heroEyebrow: Перед сделкой
  heroTitle: Что покажет толщиномер, продавец не расскажет
  heroLead: Перекрашенные панели, следы сварки, скрученный пробег, утечки снизу — за час на подъёмнике это видно, хотя в объявлении об этом не пишут.
  priceFrom: от 60 €
  duration: около 1 часа
  warranty: письменное заключение
  bodyHeading: Что мы проверяем
  body: |
    Кузов — толщиномером по всем панелям: перекрашенные элементы, шпаклёвка, следы сварки, состояние зазоров. Дальше подъёмник: подвеска, утечки, состояние выхлопа и защиты, следы ударов снизу.

    Электроника — считывание ошибок по всем блокам, включая скрученные и стёртые. По мотору — компрессия и утечки. В конце вы получаете письменное заключение со списком найденного и оценкой стоимости устранения, с которым можно торговаться.
  includesHeading: Что входит
  includes:
    - Замер толщины лака по всем панелям кузова
    - Осмотр на подъёмнике, проверка на утечки и следы ударов
    - Считывание ошибок по всем электронным блокам
    - Замер компрессии по цилиндрам
    - Проверка на признаки скрученного пробега
    - Письменное заключение с оценкой стоимости устранения
  signsHeading: Когда это нужно
  signs:
    - Покупаете машину с рук
    - Продавец торопит с решением
    - Машина привезена из-за границы, история неизвестна
    - Цена подозрительно ниже рынка
  honestHeading: Чего проверка не даёт
  honest: Мы честно скажем, что видим, но проверка не заменяет гарантию. Скрытый дефект, который не проявляется ни на подъёмнике, ни на диагностике, может всплыть позже — это ограничение метода, а не оговорка мелким шрифтом.
translations:
  sr:
    indexMetaTitle: 'Usluge auto servisa u Beogradu: popravka i TO — CarLab'
    indexMetaDescription: Dijagnostika, TO i zamena ulja, kočnice i ovjes, motor i menjač, karoserijski popravak nakon udesa, inspekcija pre kupovine. Cene, rokovi, garancija.
    indexEyebrow: Usluge
    indexHeading: Sve što vašem automobilu treba, na jednom mestu
    indexLead: Za svaku uslugu postoji posebna stranica — šta uključuje, koliko traje, po kojim znakovima treba da nam se obratite i kada iskreno kažemo šta ne treba raditi.
    specsPriceLabel: Cena
    specsDurationLabel: Rok
    specsWarrantyLabel: Garancija
    diagnostics:
      name: Kompjuterska dijagnostika
      short: Otkrivamo šta stoji iza koda greške.
      metaTitle: Kompjuterska dijagnostika automobila u Beogradu — CarLab
      metaDescription: Dijagnostika motora, ovjesa i elektrotehnike u Beogradu. Čitanje grešaka besplatno, uzrok pokazujemo direktno na vozilu.
      heroEyebrow: Dijagnostika
      heroTitle: Kod greške — to je simptom, a ne dijagnoza
      heroLead: Skener će reći koji senzor pravi probleme. Da li je senzor u kvaru ili je problem u onome što on meri, skener ne može pokazati — to saznajemo kada pregledamo automobil.
      priceFrom: čitanje grešaka — besplatno
      duration: od 40 minuta
      warranty: 12 meseci na otklanjanje
      bodyHeading: Šta radimo na dijagnostici
      body: |
        Prvo razgovaramo: kada je počelo, pod kojim uslovima, šta je menjano pre toga. Deo dijagnoza se postavlja već ovde: „kuca samo na hladno“ i „kuca stalno“ — to su različiti sklopovi.

        Zatim skener prolazi kroz sve blokove: često greška u ABS-u ili u komfornom bloku objašnjava ono na šta se vozač žali. Nakon toga — provere na vozilu: dizalica, luftovi, pregled pod opterećenjem, ako je potrebno, merenje pritiska i oscilograf.

        Na kraju pokazujemo uzrok na automobilu i objašnjavamo na prstima. Ako je potrebna popravka, odmah pravimo procenu.

        Šta to košta: čitanje grešaka — besplatno. Plaćena dijagnostika postaje tek kada se mora demontirati sklop ili staviti auto na test stend, i cenu nazivamo pre početka radova, a ne na kraju.
      includesHeading: Šta uključuje
      includes:
        - Anketiranje po simptomima i istoriji servisiranja
        - Čitanje grešaka po svim elektronskim blokovima
        - Pregled na dizalici, provere luftova i curenja
        - Test vožnja s inženjerom, ako se problem manifestuje u vožnji
        - Usmeno savetovanje i pisana procena za popravku
      signsHeading: Kada je vreme za nas
      signs:
        - Gori "check" ili druga lampica na kontrolnoj tabli
        - Auto se trzaju, radi ili se loše pali
        - Potrošnja je porasla bez razumne uzroka
        - Pojavio se novi zvuk, a ne znate odakle dolazi
      honestHeading: Šta ne obećavamo
      honest: Nije svaka greška uhvaćena za četrdeset minuta. Fluktuirajući problemi koji se javljaju jednom nedeljno ponekad zahtevaju ponovni poset ili ostavljanje vozila na dan — o tome ćemo odmah obavestiti i nećemo menjati delove jedan po jedan na vaš račun.
    servicing:
      name: Planirano TO
      short: Ulje, filteri, tečnosti i pregled — po reglementu vašeg motora.
      metaTitle: Planirano TO i zamena ulja u Beogradu — CarLab
      metaDescription: 'Tehničko održavanje automobila u Beogradu: ulje, filteri, sveće, kočiona tečnost, antifriz. Po reglementu proizvođača, sa upisom u servisnu knjižicu.'
      heroEyebrow: Održavanje
      heroTitle: Najjeftinija popravka — ona koja se nije desila
      heroLead: Svaki motor ima svoj interval i sopstvenu toleranciju na ulje. Mi pogledamo priručnik za vaš auto i radimo ono što je tamo napisano, a ne prosek „svakih deset hiljada“.
      priceFrom: od 90 €
      duration: 2–4 sata
      warranty: 12 meseci
      bodyHeading: Odakle dolazi interval za vaše vozilo
      body: |
        Intervali zamene kod različitih motora značajno se razlikuju, a uslovi Beograda — gužve, prašina, leta ispod četrdeset — gotovo uvek padaju pod „teške uslove eksploatacije“ s skraćenim intervalom. Prema tome, mi računamo šta je vašem automobilu zaista potrebno na ovom pređenom kilometraži.

        Pored toga, proveravamo ono što se obično setimo prekasno: stanje remena ili lanca, kočionu tečnost na vlagu, antifriz na temperaturu smrzavanja, trošenje pločica i diskova u milimetrima.
      includesHeading: Šta uključuje
      includes:
        - Ulje i filter za ulje sa odobrenjem vašeg proizvođača
        - Zračni i kabinski filteri, sveće po reglementu
        - Provera kočione tečnosti na sadržaj vlage
        - Provera antifriza i njegove temperature smrzavanja
        - Merenje preostalih pločica i diskova u milimetrima
        - Upis svih radova i kilometraže u servisnu knjižicu
      signsHeading: Kada je vreme za nas
      signs:
        - Prišao kilometraža ili godina od poslednjeg TO
        - Auto je upravo kupljen, a istorija servisiranja nema
        - Predstoji dug put
        - Zasvetlela lampica servisnog intervala
      honestHeading: Šta ne radimo
      honest: Ne menjamo ono što još nije vreme. Ako je filter iskoristio polovinu resursa, nećemo ga dirati i reći ćemo vam kada treba da dođete.
    brakes-suspension:
      name: Kočnice i ovjes
      short: Sve što odgovara za to da se auto zaustavi ili ne.
      metaTitle: Popravka kočnica i ovjesa u Beogradu — CarLab
      metaDescription: 'Kočnice i ovjes u Beogradu: pločice, diskovi, čeljusti, rukavi, podešavanje razlike u geometriji. Merenja u milimetrima, procena pre radova, garancija 12 meseci.'
      heroEyebrow: Ovjes
      heroTitle: Ovde se resurs meri u milimetrima
      heroLead: 'Motor se može dotegnuti do servisa. Kočnice — ne. Zato po ovjesu ne zaokružujemo i ne odugovlačimo: ako je resurs potrošen, kažemo direktno.'
      priceFrom: od 120 €
      duration: od 3 sata
      warranty: 12 meseci
      bodyHeading: Kako to radimo
      body: |
        Počinjemo sa merenjima: debljina diskova i pločica u milimetrima, vibracije, stanje creva i čeljusti. Po ovjesu — provere luftova na dizalici i na vibracionom stendu, pregled gumenih čaura i nosača.

        Posle popravke ovjesa uvek radimo podešavanje razlike: čak i zamena jednog rukava menja geometriju, a pogrešna geometrija troši set guma tokom sezone.
      includesHeading: Šta uključuje
      includes:
        - Merenje diskova i pločica uz zabilježbu rezultata
        - Zamena pločica, diskova, creva, popravka ili zamena čeljusti
        - Pumping and replacement of the brake fluid
        - Amortizeri, opruge, rukavi, silent-blocks, nosači i ležajevi
        - Podešavanje nakon svakog intervencija u ovjes
        - Kontrolna vožnja pre predaje
      signsHeading: Kada je vreme za nas
      signs:
        - Škrip, pisak ili škripa prilikom kočenja
        - Pedala je postala mekana ili se propada
        - Auto vuče na jednu stranu prilikom kočenja
        - Zvuči na neravnom terenu, „plutajući“ točak, neujednačen trošak guma
      honestHeading: O čemu ćemo upozoriti
      honest: Pločice i diskovi su potrošni materijal koji se koriste u paru. Postavljanje novih pločica na istrošene diskove je moguće, ali resurs pločica će se smanjiti, a za pola godine ćete ponovo doći. Računaćemo oba stretega i ostavljamo izbor vama.
    engine-gearbox:
      name: Motor i menjač
      short: Od zamene brtve do popravke s demontažom — s jasnom procenom.
      metaTitle: Popravka motora i menjača u Beogradu — CarLab
      metaDescription: 'Popravka motora i menjača u Beogradu: GRA, brtve, kvačilo, zamena ulja u automatiku. Dijagnostika pre demontaže, procena pre radova, garancija 12 meseci.'
      heroEyebrow: Mjenjač
      heroTitle: '"Kapitalka" nije potrebna tako često kao što se tvrdi'
      heroLead: 'Pre nego što razdvojimo nešto, proveravamo ono što se može proveriti spolja: kompresiju, pritisak ulja, greške, curenje.'
      priceFrom: na osnovu dijagnostike
      duration: od 1 dan
      warranty: 12 meseci
      bodyHeading: Redosled rada
      body: |-
        Prvo merimo: kompresija po cilindrima, pritisak ulja, stanje sveće, greške po blokovima, curenja pod pritiskom. Tek nakon toga odlučujemo da li je potrebno otvarati motor.

        Za menjače gledamo stanje ulja i logiku prelazaka — kod automatskog menjača većina „kvarova“ se leči pravilnim održavanjem, a ne zamenom agregata. Ako popravka ipak treba, dobijate procenu sa razdvajanjem na rad i delove pre nego što je nešto demontirano.
      includesHeading: Šta uključuje
      includes:
        - Merenje kompresije i pritiska ulja
        - Provera na curenja pod pritiskom, pronalaženje usisa vazduha
        - Zamena remena ili lanca GRA, remenica i pumpe
        - Brtve, zaptivke, poklopci za ulje
        - Kvačilo, zamašnjak, zamena ulja u manualu i automatski
        - Procena sa razdvajanjem pre početka rastavljanja
      signsHeading: Kada je vreme za nas
      signs:
        - Ulje se gubi između zamena
        - Udari, vibracije ili gubitak vuče
        - Trzaji i odlaganja prilikom prebacivanja brzina
        - Dim iz izduvne cevi, kojeg ranije nije bilo
      honestHeading: Kada vas odvratimo
      honest: Ako cena popravke odgovara ceni automobila, to ćemo reći. Ponekad je pravi savet — prodati ga onako kako jeste ili tražiti ugovorni agregat, a ne ulagati u popravak iznos koji auto nikada ne može vratiti.
    bodywork-painting:
      name: Karoserija i farbanje
      short: Obnova nakon udesa, ispravljanje geometrije i farbanje s izborom boje.
      metaTitle: Karoserijski popravak i farbanje nakon udesa u Beogradu — CarLab
      metaDescription: 'Karoserijski popravak u Beogradu: šablon, merenje geometrije, razbijanje, farbanje s kompjuterskim izborom boje. Radimo s osiguravajućim društvima, pomažemo s dokumentima.'
      heroEyebrow: Nakon udesa
      heroTitle: Da auto ne izgleda "nakon udarca"
      heroLead: Dobar karoserijski popravak nije uočljiv ni oku, ni debljinomeru na inspekciji pre prodaje.
      priceFrom: na osnovu nalaza
      duration: od 3 dana
      warranty: 12 meseci na premaz
      bodyHeading: Šta uključuje obnova
      body: |
        Prvo merimo geometriju karoserije: nakon udarca, pomeranja se dešavaju i tamo gde je vizuelno sve u redu, i upravo ona zatim dovode do neujednačenog trošenja guma i povlačenja automobila. Ako je potrebno, postavljamo na šablon i vučemo po kontrolnim tačkama.

        Boju biramo dvaput — po kodu iz dokumenata i spektrofotometrom po činjenici, jer se za pet godina na suncu fabrička boja menja od pasoške. Prelaz poliramo tako da granica ne bude vidljiva ni na suncu, ni pod lampom.
      includesHeading: Šta uključuje
      includes:
        - Merenje geometrije karoserije po kontrolnim tačkama
        - Šablon i vuča za pomeranja
        - Razbijanje, zamena oštećenih delova
        - Izbor boje po kodu i spektrofotometrom
        - Farbanje u komori uz kontrolu temperature
        - Poliranje prelaza i montaža uz proveru razmaka
      signsHeading: Kada je vreme za nas
      signs:
        - Dogodila se udesa, čak i ako su oštećenja manja
        - Neujednačen razmak između delova karoserije
        - Auto se povlači, gume se troše "na jednu stranu"
        - Potrebno je srediti karoseriju pre prodaje
      honestHeading: O osiguravajućim društvima
      honest: Radimo sa osiguravajućim društvima i pomažemo s dokumentima, ali ne obećavamo da će osiguranje pokriti sve. Nakon pregleda odmah pokazujemo šta spada u osigurani slučaj, a šta ne, kako ne biste saznali to na kraju.
    pre-purchase-inspection:
      name: Provera pre kupovine
      short: Taksometr, dizalica i skener pre nego što izdvojite novac.
      metaTitle: Provera automobila pre kupovine u Beogradu — CarLab
      metaDescription: 'Tehnička provera pre kupovine u Beogradu: taksimetar, dizalica, dijagnostika grešaka, kompresija. Pismeno izveštaj i mogućnost za pregovor u vašu korist.'
      heroEyebrow: Pre transakcije
      heroTitle: Šta taksimetar pokazuje, prodavac ne otkriva
      heroLead: Prefarbane panele, tragove zavarivanja, prepravljen broj pređenih kilometara, curenje sa dna — to se za sat vremena na dizalici videlo, iako se u oglasu o tome ne piše.
      priceFrom: od 60 €
      duration: oko 1 sata
      warranty: pismeno izveštaj
      bodyHeading: Šta proveravamo
      body: |
        Karosjerija — taksimetrom po svim panelima: prefarbani elementi, kit, tragovi zavarivanja, stanje razmaka. Zatim dizalica: ovjes, curenja, stanje izduvnog sistema i zaštite, tragovi udaraca sa dna.

        Elektronika — čitanje grešaka na svim blokovima, uključujući prepravljene i obrisane. Kod motora — kompresija i curenja. Na kraju, dobijate pismeni izveštaj sa spisakom pronađenog i procenom troškova otklanjanja, sa kojim možete pregovarati.
      includesHeading: Šta je uključeno
      includes:
        - Merenje debljine laka po svim panelima karoserije
        - Pregled na dizalici, provera na curenja i tragove udaraca
        - Čitanje grešaka na svim elektronskim blokovima
        - Merenje kompresije po cilindrima
        - Provera na znakove prepravljenog broja pređenih kilometara
        - Pismeno izveštaj sa procenom troškova otklanjanja
      signsHeading: Kada je to potrebno
      signs:
        - Kupujete auto od fizičkog lica
        - Prodavac vas žuri s odlukom
        - Auto je donet iz inostranstva, istorija nepoznata
        - Cena sumnjivo niža od tržišne
      honestHeading: Šta provera ne pruža
      honest: Iskreno ćemo reći šta vidimo, ali provera ne zamenjuje garanciju. Skriveni nedostatak koji se ne pokazuje ni na dizalici, ni na dijagnostici, može se kasnije pokazati — to je ograničenje metode, a ne klauzula sitnim slovima.
  en:
    indexMetaTitle: 'Car Service Services in Belgrade: Repair and Maintenance — CarLab'
    indexMetaDescription: Diagnostics, scheduled maintenance and oil change, brakes and suspension, engine and gearbox, accident repair, pre-purchase inspection. Prices, timings, warranty.
    indexEyebrow: Services
    indexHeading: Everything your car needs in one service
    indexLead: Each service has a separate page detailing what it includes, how long it takes, signs that indicate it’s time for us, and when we honestly say that something doesn’t need to be done.
    specsPriceLabel: Price
    specsDurationLabel: Duration
    specsWarrantyLabel: Warranty
    diagnostics:
      name: Computer Diagnostics
      short: We identify what’s behind the error code.
      metaTitle: Computer Diagnostics in Belgrade — CarLab
      metaDescription: Engine, suspension, and electrical diagnostics in Belgrade. Error reading is free, and we show the cause directly on the car.
      heroEyebrow: Diagnostics
      heroTitle: The error code is a symptom, not a diagnosis
      heroLead: The scanner indicates which sensor is malfunctioning. Whether the sensor itself is faulty or it's measuring something incorrectly won't show on the scanner — that’s determined on the car.
      priceFrom: error reading — free of charge
      duration: from 40 minutes
      warranty: 12 months on rectifications
      bodyHeading: What we do during diagnostics
      body: |-
        First, we have a conversation: when it started, under what conditions, what was changed previously. Some diagnoses are already made here: "only knocks when cold" and "knocks constantly" indicate different components.

        Then, the scanner checks all blocks at once: often, an error in ABS or in the comfort module explains what the driver is complaining about. Next, we conduct an inspection on the car: lift, play tests, load inspection, and if necessary, pressure measurement and oscillograph testing.

        At the end, we show the cause on the car and explain it clearly. If repairs are needed, we immediately provide an estimate.

        How much it costs: error reading is free. The paid diagnostic begins only when disassembly of a component is required or the car needs to be put on a stand; we provide a price before we start working, not at the end.
      includesHeading: What’s included
      includes:
        - Symptom inquiry and service history
        - Error reading across all electronic blocks
        - Inspection on the lift, checking play and leaks
        - Test drive with an engineer if the issue manifests while driving
        - Verbal conclusion and written estimate for repairs
      signsHeading: When it’s time to come to us
      signs:
        - The check engine light or another indicator is on
        - The car jerks, misfires, or has trouble starting
        - Fuel consumption increased without a clear reason
        - A new sound has appeared, and you don’t understand where it’s coming from
      honestHeading: What we don’t promise
      honest: Not every malfunction can be detected in forty minutes. Intermittent problems that appear once a week may sometimes require a follow-up visit or leaving the car for a day — we will inform you about this right away, and we won’t change parts sequentially at your expense.
    servicing:
      name: Scheduled Maintenance
      short: Oil, filters, fluids, and inspection — according to your engine’s regulations.
      metaTitle: Scheduled Maintenance and Oil Change in Belgrade — CarLab
      metaDescription: 'Car maintenance in Belgrade: oil, filters, spark plugs, brake fluid, antifreeze. According to manufacturer regulations, with records in the service booklet.'
      heroEyebrow: Maintenance
      heroTitle: The cheapest repair is the one that doesn’t happen
      heroLead: Each engine has its own interval and specifications for oil. We check the manual for your car and do what it specifies, not just an average "every ten thousand."
      priceFrom: from 90 €
      duration: 2–4 hours
      warranty: 12 months
      bodyHeading: How we determine the interval for your car
      body: |-
        Change intervals vary significantly between different engines, and conditions in Belgrade — traffic, dust, summer heat — almost always fall under "severe operating conditions" requiring a shortened interval. We calculate what your car actually needs at this mileage.

        We also check things that are often remembered too late: the condition of the timing belt or chain, brake fluid for moisture, antifreeze for freezing temperature, and wear of pads and discs in millimeters.
      includesHeading: What’s included
      includes:
        - Oil and oil filter compliant with your manufacturer’s specifications
        - Air and cabin filters, spark plugs according to regulations
        - Checking brake fluid for moisture content
        - Checking antifreeze and its freezing temperature
        - Measuring the remaining thickness of pads and discs in millimeters
        - Recording all works and mileage in the service booklet
      signsHeading: When it’s time to come to us
      signs:
        - Mileage or year since the last maintenance is up
        - Car bought recently with no service history
        - Planning a long trip ahead
        - Service interval light has come on
      honestHeading: What we don’t do
      honest: We don’t replace parts that are still good. If the filter has used only half of its life, we won’t change it and will tell you when to come back.
    brakes-suspension:
      name: Brakes and Suspension
      short: Everything that decides whether the car stops or not.
      metaTitle: Brake and Suspension Repair in Belgrade — CarLab
      metaDescription: 'Brakes and suspension in Belgrade: pads, discs, calipers, arms, alignment. Measured in millimeters, estimate provided before work begins, 12-month guarantee.'
      heroEyebrow: Chassis
      heroTitle: We measure wear in millimeters here
      heroLead: The engine can be overlooked until the next service. The brakes cannot. Therefore, we don’t cut corners or delay on the suspension — if wear has reached its limit, we tell you directly.
      priceFrom: from 120 €
      duration: from 3 hours
      warranty: 12 months
      bodyHeading: How we do it
      body: |-
        We start with measurements: disc and pad thickness in millimeters, runout, condition of hoses and calipers. For the suspension, we check play on the lift and with a vibration stand, inspecting boots and mounts.

        After any repair to the suspension, we always perform wheel alignment: even replacing a single arm alters geometry, and incorrect geometry will wear out a set of tires within a season.
      includesHeading: What’s included
      includes:
        - Measurement of discs and pads with documented results
        - Replacement of pads, discs, hoses, or repair/replacement of calipers
        - Bleeding and replacement of brake fluid
        - Struts, springs, arms, bushings, mounts, and bearings
        - Wheel alignment after any manipulation with the suspension
        - Test drive before handing over the car
      signsHeading: When it’s time to come to us
      signs:
        - Squeaking, squealing or grinding when braking
        - Brake pedal feels soft or sinks
        - The car pulls to one side when braking
        - Clunks over bumps, "wandering" steering, uneven tire wear
      honestHeading: What we’ll warn you about
      honest: Pads and discs are consumables that should be replaced together. It’s possible to install new pads on worn discs, but the lifespan of the pads will drop, and in six months you'll be back here. We will calculate both options and leave the choice to you.
    engine-gearbox:
      name: Engine and Gearbox
      short: From gasket replacement to major repairs — with a clear estimate.
      metaTitle: Engine and Transmission Repair in Belgrade — CarLab
      metaDescription: 'Engine and gearbox repair in Belgrade: timing system, gaskets, clutch, automatic transmission oil change. Diagnostics are done before disassembly, estimates are given before work, 12-month warranty.'
      heroEyebrow: Powertrain
      heroTitle: '"Overhaul" is not needed as often as it’s called'
      heroLead: 'Before we disassemble anything, we check what can be tested from the outside: compression, oil pressure, error codes, leaks.'
      priceFrom: based on diagnostic results
      duration: from 1 day
      warranty: 12 months
      bodyHeading: Work Procedures
      body: |-
        First, we take measurements: cylinder compression, oil pressure, spark plug condition, error codes from blocks, pressure leaks. Only after that do we decide if the engine needs to be opened.

        For gearboxes, we examine the condition of the oil and the shifting logic — most "faults" in automatics can be remedied with proper service, rather than replacing the unit. If repairs are necessary, you'll receive an estimate breaking down labor and parts before any disassembly is done.
      includesHeading: What’s included
      includes:
        - Compression and oil pressure measurement
        - Leak testing under pressure, locating air intake issues
        - Replacement of timing belt or chain, pulleys, and water pump
        - Gaskets, seals, oil control rings
        - Clutch, flywheel, oil change in manual and automatic gearboxes
        - Estimate breakdown before disassembly begins
      signsHeading: When it’s time to come to us
      signs:
        - Oil consumption between changes
        - Knocking, vibration, or loss of power
        - Stuttering and hesitation during gear shifts
        - Smoke from the exhaust that wasn’t there before
      honestHeading: When we advise against it
      honest: If the repair cost approaches the car’s value, we will tell you. Sometimes the best advice is to sell it as is or look for a replacement unit rather than investing in repairs that the car will never recoup.
    bodywork-painting:
      name: Body Repair and Painting
      short: Restoration after an accident, geometry correction, and color matching paintwork.
      metaTitle: Body Repair and Painting After an Accident in Belgrade — CarLab
      metaDescription: 'Body repair in Belgrade: frame straightening, geometry measurement, bodywork, and paint matching using computer technology. We work with insurance companies and assist with documentation.'
      heroEyebrow: After an Accident
      heroTitle: So the car doesn’t look "after the hit"
      heroLead: Good body repair cannot be detected by the eye or a thickness gauge during a pre-sale inspection.
      priceFrom: based on inspection results
      duration: from 3 days
      warranty: 12 months on the coating
      bodyHeading: What’s included in restoration
      body: |-
        First, we measure the body geometry: after an impact, misalignments may occur where everything looks intact, which later leads to uneven tire wear and pulling. If necessary, we place it on a frame machine and pull it back to spec.

        We match the color twice — first by the code from documents and then by spectrophotometer to account for fading due to sun exposure over five years. We polish the transition area so that the seam is undetectable both in sunlight and under lamps.
      includesHeading: What’s included
      includes:
        - Body geometry measurements at reference points
        - Frame machine and pulling for misalignments
        - Bodywork, replacement of damaged elements
        - Color matching by code and spectrophotometer
        - Spraying in a controlled environment with temperature regulation
        - Polishing transitions and assembly with gap checks
      signsHeading: When it’s time to come to us
      signs:
        - There was an accident, even if the damages look minor
        - Uneven gaps between body parts
        - The car pulls to one side, tires wear unevenly
        - Need to tidy up the body before selling
      honestHeading: About Insurance
      honest: We work with insurance companies and help with documentation, but we don't guarantee that the insurance will cover everything. After the inspection, we immediately show you what falls under the insurance case and what doesn’t so you don’t find out about it at the end.
    pre-purchase-inspection:
      name: Pre-Purchase Inspection
      short: Thickness gauge, lift, and scanner before you hand over your money.
      metaTitle: Pre-Purchase Car Inspection in Belgrade — CarLab
      metaDescription: 'Technical pre-purchase inspection in Belgrade: thickness gauge, lift, error diagnostics, compression test. Written report and negotiating leverage in your favor.'
      heroEyebrow: Before the Deal
      heroTitle: What the thickness gauge reveals, the seller won’t tell you
      heroLead: Repainted panels, welding traces, rolled-back odometer, leaks underneath — you’ll see it all within an hour on the lift, even if the ad doesn’t mention it.
      priceFrom: from 60 €
      duration: about 1 hour
      warranty: written report
      bodyHeading: What We Check
      body: |-
        Body — thickness gauge across all panels: repainted parts, filler, welding traces, condition of gaps. Next, the lift: suspension, leaks, exhaust condition and protection, signs of impacts from below.

        Electronics — reading errors from all modules, including rolled-back and erased. For the engine — compression and leaks. In the end, you receive a written report listing the findings and an estimate for repairs, which you can negotiate with.
      includesHeading: What’s Included
      includes:
        - Measuring paint thickness across all body panels
        - Inspection on the lift, checking for leaks and impact signs
        - Reading errors from all electronic modules
        - Measuring compression across cylinders
        - Checking for signs of rolled-back odometer
        - Written report with cost assessment for repairs
      signsHeading: When You Need This
      signs:
        - Buying a car from a private seller
        - The seller is rushing you to make a decision
        - The car was brought from abroad, history unknown
        - The price is suspiciously lower than the market
      honestHeading: What the Inspection Doesn’t Provide
      honest: We will honestly tell you what we see, but the inspection does not replace a warranty. A hidden defect that does not show up on the lift or diagnostics may appear later — this is a limitation of the method, not a small print disclaimer.
translatedFrom: rerun-for-meta-length-budget
