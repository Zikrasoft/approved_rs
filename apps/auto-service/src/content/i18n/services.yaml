diagnostics:
  cta: Записаться на диагностику
  name: Компьютерная диагностика
  short: Находим, что стоит за кодом ошибки.
  metaTitle: Компьютерная диагностика автомобиля в Белграде | CarLab
  metaDescription: Диагностика двигателя, подвески и электрики в Белграде. Считывание ошибок бесплатно, причину показываем прямо на машине.
  heroTitle: Код ошибки это симптом, а не диагноз. Находим причину и показываем ее на машине.
  heroLead: Сканер скажет, какой датчик ругается. Виноват сам датчик или то, что он измеряет, сканер не покажет, это выясняется уже на машине.
  priceFrom: считывание ошибок бесплатно
  duration: от 40 минут
  bodyHeading: Что мы делаем на диагностике
  body: |
    Сначала разговор: когда началось, при каких условиях, что менялось до этого. Часть диагнозов ставится уже здесь: «стучит только на холодную» и «стучит постоянно» это разные узлы.

    Потом сканер по всем блокам сразу: часто ошибка в ABS или в блоке комфорта объясняет то, на что жалуется водитель. Дальше проверка на машине: подъемник, люфты, осмотр под нагрузкой, при необходимости замер давления и осциллограф.

    В конце показываем причину на автомобиле и объясняем на пальцах. Если нужен ремонт, сразу считаем смету.

    Сколько это стоит: считывание ошибок бесплатно. Платной диагностика становится только тогда, когда нужно разбирать узел или ставить машину на стенд, и цену мы называем до начала работ, а не в конце.
  includesHeading: Что входит
  includes:
    - Опрос по симптомам и истории обслуживания
    - Считывание ошибок по всем электронным блокам
    - Осмотр на подъемнике, проверка люфтов и утечек
    - Тест-драйв с инженером, если проблема проявляется в движении
    - Устное заключение и письменная смета на ремонт
  signsHeading: Когда пора к нам
  signs:
    - Горит «чек» или другой значок на панели
    - Машина дергается, троит или плохо заводится
    - Расход вырос без понятной причины
    - Появился новый звук, и вы не понимаете откуда
  honestHeading: Что мы не обещаем
  honest: Не каждая неисправность ловится за сорок минут. Плавающие проблемы, которые появляются раз в неделю, иногда требуют повторного визита или оставить машину на день. Мы скажем об этом сразу и не станем менять детали по очереди за ваш счет.
servicing:
  cta: Записаться на ТО
  name: Плановое ТО
  short: Масло, фильтры, жидкости и осмотр по регламенту вашего двигателя.
  metaTitle: Плановое ТО и замена масла в Белграде | CarLab
  metaDescription: 'Техническое обслуживание автомобиля в Белграде: масло, фильтры, свечи, тормозная жидкость, антифриз. По регламенту производителя, с записью в сервисную карту.'
  heroTitle: Самая дешевая починка та, которой не случилось
  heroLead: У каждого мотора свой интервал и свой допуск по маслу. Мы смотрим мануал на вашу машину и делаем то, что написано там, а не среднее «раз в десять тысяч».
  priceFrom: от 90 €
  duration: 2–4 часа
  bodyHeading: Откуда берется интервал для вашей машины
  body: |
    Интервалы замены у разных моторов отличаются в разы, а условия Белграда (пробки, пыль, лето под сорок) почти всегда попадают под «тяжелые условия эксплуатации» с укороченным интервалом. По ним и считаем, что реально нужно вашей машине на этом пробеге.

    Заодно проверяем то, что обычно вспоминают слишком поздно: состояние ремня или цепи, тормозную жидкость на влагу, антифриз на температуру замерзания, износ колодок и дисков в миллиметрах.
  includesHeading: Что входит
  includes:
    - Масло и масляный фильтр с допуском вашего производителя
    - Воздушный и салонный фильтр, свечи по регламенту
    - Проверка тормозной жидкости на содержание влаги
    - Проверка антифриза и его температуры замерзания
    - Замер остатка колодок и дисков в миллиметрах
    - Запись всех работ и пробега в сервисную карту
  signsHeading: Когда пора к нам
  signs:
    - Подошел пробег или год с прошлого ТО
    - Машина только куплена, а истории обслуживания нет
    - Впереди дальняя дорога
    - Загорелась лампа сервисного интервала
  honestHeading: Что мы не делаем
  honest: Не меняем то, чему еще рано. Если фильтр отработал половину ресурса, мы его не тронем и скажем, когда приезжать.
brakes-suspension:
  cta: Записаться на ремонт
  name: Тормоза и подвеска
  short: Все, что отвечает за то, остановится машина или нет.
  metaTitle: Ремонт тормозов и подвески в Белграде | CarLab
  metaDescription: 'Тормоза и подвеска в Белграде: колодки, диски, суппорты, рычаги, развал-схождение. Замеры в миллиметрах, смета до работ.'
  heroTitle: Здесь ресурс считают в миллиметрах
  heroLead: 'Мотор можно дотянуть до сервиса. Тормоза нельзя. Поэтому по ходовой мы не округляем и не тянем: если ресурс кончился, говорим прямо.'
  priceFrom: от 120 €
  duration: от 3 часов
  bodyHeading: Как мы это делаем
  body: |
    Начинаем с замеров: толщина дисков и колодок в миллиметрах, биение, состояние шлангов и суппортов. По подвеске проверяем люфты на подъемнике и на вибростенде, осматриваем пыльники и опоры.

    После ремонта ходовой всегда делаем развал-схождение: даже замена одного рычага меняет геометрию, а неправильная геометрия съедает комплект резины за сезон.
  includesHeading: Что входит
  includes:
    - Замер дисков и колодок с записью результата
    - Замена колодок, дисков, шлангов, ремонт или замена суппортов
    - Прокачка и замена тормозной жидкости
    - Стойки, пружины, рычаги, сайлентблоки, опоры и подшипники
    - Развал-схождение после любого вмешательства в подвеску
    - Контрольный тест-драйв перед выдачей
  signsHeading: Когда пора к нам
  signs:
    - Скрип, писк или скрежет при торможении
    - Педаль стала мягкой или проваливается
    - Машину уводит в сторону при торможении
    - Стуки на неровностях, «плавающий» руль, неравномерный износ резины
  honestHeading: О чем предупредим
  honest: Колодки и диски это расходник, который ходит парой. Ставить новые колодки на изношенные диски можно, но ресурс колодок при этом падает, и через полгода вы приедете снова. Мы посчитаем оба варианта и оставим выбор вам.
engine-gearbox:
  cta: Записаться на диагностику
  name: Двигатель и коробка
  short: От замены прокладки до ремонта с разбором, с понятной сметой.
  metaTitle: Ремонт двигателя и коробки передач в Белграде | CarLab
  metaDescription: 'Ремонт двигателя и трансмиссии в Белграде: ГРМ, прокладки, сцепление, замена масла в АКПП. Диагностика до разбора, смета до работ.'
  heroTitle: «Капиталка» нужна не так часто, как ее называют
  heroLead: 'Прежде чем что-то разбирать, мы проверяем то, что проверяется снаружи: компрессию, давление масла, ошибки, утечки.'
  priceFrom: по результатам диагностики
  duration: от 1 дня
  bodyHeading: Порядок работы
  body: |
    Сначала измеряем: компрессия по цилиндрам, давление масла, состояние свечей, ошибки по блокам, утечки под давлением. Только после этого решаем, нужно ли вскрывать мотор.

    По коробкам смотрим состояние масла и логику переключений: у автоматов большая часть «поломок» лечится корректным обслуживанием, а не заменой агрегата. Если ремонт все же нужен, вы получаете смету с разбивкой на работу и запчасти до того, как что-то снято.
  includesHeading: Что входит
  includes:
    - Замер компрессии и давления масла
    - Проверка на утечки под давлением, поиск подсоса воздуха
    - Замена ремня или цепи ГРМ, роликов и помпы
    - Прокладки, сальники, маслосъемные колпачки
    - Сцепление, маховик, замена масла в механике и автомате
    - Смета с разбивкой до начала разбора
  signsHeading: Когда пора к нам
  signs:
    - Масло уходит между заменами
    - Стук, вибрация или потеря тяги
    - Рывки и задержки при переключении передач
    - Дым из выхлопа, которого раньше не было
  honestHeading: Когда мы отговариваем
  honest: Если стоимость ремонта подходит к стоимости машины, мы это скажем. Иногда правильный совет продать как есть или искать контрактный агрегат, а не вкладывать в ремонт сумму, которую машина никогда не вернет.
bodywork-painting:
  cta: Прислать фото повреждений
  name: Кузов и покраска
  short: Восстановление после ДТП, правка геометрии и покраска с подбором цвета.
  metaTitle: Кузовной ремонт и покраска после ДТП в Белграде | CarLab
  metaDescription: 'Кузовной ремонт в Белграде: стапель, замер геометрии, рихтовка, покраска с компьютерным подбором цвета. Работаем со страховыми, помогаем с документами.'
  heroTitle: Чтобы машина не выглядела «после удара»
  heroLead: Хороший кузовной ремонт не видно ни глазом, ни толщиномером на осмотре перед продажей.
  priceFrom: по результатам осмотра
  duration: от 3 дней
  bodyHeading: Что входит в восстановление
  body: |
    Сначала замеряем геометрию кузова: после удара смещения бывают там, где визуально все цело, и именно они потом дают неравномерный износ резины и увод машины. При необходимости ставим на стапель и вытягиваем по контрольным точкам.

    Цвет подбираем дважды: по коду из документов и спектрофотометром по факту, потому что за пять лет на солнце заводской цвет уходит от паспортного. Переход полируем так, чтобы граница не читалась ни на солнце, ни под лампой.
  includesHeading: Что входит
  includes:
    - Замер геометрии кузова по контрольным точкам
    - Стапель и вытяжка при смещениях
    - Рихтовка, замена поврежденных элементов
    - Подбор цвета по коду и спектрофотометром
    - Покраска в камере с контролем температуры
    - Полировка перехода и сборка с проверкой зазоров
  signsHeading: Когда пора к нам
  signs:
    - Было ДТП, даже если повреждения выглядят мелкими
    - Неравномерные зазоры между деталями кузова
    - Машину уводит, резина изнашивается «в один край»
    - Нужно привести кузов в порядок перед продажей
  honestHeading: О страховых
  honest: Мы работаем со страховыми и помогаем с документами, но не обещаем, что страховая покроет все. После осмотра мы сразу показываем, что попадает в страховой случай, а что нет, чтобы вы не узнали об этом в конце.
pre-purchase-inspection:
  cta: Записаться на проверку
  name: Проверка перед покупкой
  short: Толщиномер, подъемник и сканер до того, как вы отдали деньги.
  metaTitle: Проверка автомобиля перед покупкой в Белграде | CarLab
  metaDescription: 'Техническая проверка перед покупкой в Белграде: толщиномер, подъемник, диагностика ошибок, компрессия. Письменное заключение и торг в вашу пользу.'
  heroTitle: Что покажет толщиномер, продавец не расскажет
  heroLead: Перекрашенные панели, следы сварки, скрученный пробег, утечки снизу. За час на подъемнике это видно, хотя в объявлении об этом не пишут.
  priceFrom: от 60 €
  duration: около 1 часа
  bodyHeading: Что мы проверяем
  body: |
    Кузов проверяем толщиномером по всем панелям: перекрашенные элементы, шпаклевка, следы сварки, состояние зазоров. Дальше подъемник: подвеска, утечки, состояние выхлопа и защиты, следы ударов снизу.

    Электроника: считывание ошибок по всем блокам, включая скрученные и стертые. По мотору компрессия и утечки. В конце вы получаете письменное заключение со списком найденного и оценкой стоимости устранения, с которым можно торговаться.
  includesHeading: Что входит
  includes:
    - Замер толщины лака по всем панелям кузова
    - Осмотр на подъемнике, проверка на утечки и следы ударов
    - Считывание ошибок по всем электронным блокам
    - Замер компрессии по цилиндрам
    - Проверка на признаки скрученного пробега
    - Письменное заключение с оценкой стоимости устранения
  signsHeading: Когда это нужно
  signs:
    - Покупаете машину с рук
    - Продавец торопит с решением
    - Машина привезена из-за границы, история неизвестна
    - Цена подозрительно ниже рынка
  honestHeading: Чего проверка не дает
  honest: Мы честно скажем, что видим, но ни один осмотр не ловит все. Скрытый дефект, который не проявляется ни на подъемнике, ни на диагностике, может всплыть позже. Это ограничение метода, а не оговорка мелким шрифтом.
vin-parts-inquiry:
  cta: Отправить запрос
  name: Подбор запчастей
  short: Находим запчасти, которые подходят вашей машине, и называем цену до покупки.
  metaTitle: Подбор автозапчастей по VIN в Белграде | CarLab
  metaDescription: 'Подбор запчастей по VIN или номеру шасси в Белграде: оригинал и проверенные аналоги, проверка совместимости, цена до покупки. Самовывоз в сервисе CarLab.'
  heroTitle: Подберем запчасти, которые точно подойдут вашей машине
  heroLead: Пришлите VIN или номер шасси и напишите, что нужно. Мы проверим совместимость, найдем оригинал и проверенные аналоги и предложим лучшие варианты.
  priceFrom: называем после подбора
  duration: назовем вместе с ценой
  bodyHeading: Как мы подбираем запчасти
  body: |
    По VIN мы определяем точную комплектацию машины: двигатель, коробку, год и рынок, для которого она собрана. От этого зависит, какая запчасть подойдет, даже если модель та же.

    Дальше ищем номер запчасти у производителя и проверенные аналоги, сравниваем цены и сроки у поставщиков и предлагаем вам несколько вариантов. Вы выбираете, мы заказываем, а забрать запчасти можно в нашем сервисе в Белграде.

    Если нужна и установка, ее можно сделать у нас же: запчасть проверена на совместимость, и мастер знает, что ставит.
  includesHeading: Что входит
  includes:
    - Проверка совместимости по VIN или номеру шасси
    - Поиск оригинального номера запчасти
    - Подбор проверенных аналогов с разной ценой
    - Цена и срок до того, как вы что-то оплатили
    - Самовывоз в сервисе в Белграде
  signsHeading: Когда это нужно
  signs:
    - Не знаете точное название или номер запчасти
    - Боитесь купить запчасть, которая не подойдет
    - Нужна редкая или снятая с производства деталь
    - Хотите сравнить оригинал и аналоги по цене
  honestHeading: Как мы называем цену
  honest: Цену и срок называем до оплаты. Если деталь редкая и идет под заказ, сразу скажем, сколько ждать, и предложим проверенный аналог, если он есть.
translations:
  sr:
    indexMetaTitle: 'Usluge auto servisa u Beogradu: popravka i servis | CarLab'
    indexMetaDescription: Dijagnostika, servis i zamena ulja, kočnice i trap, motor i menjač, limarija posle udesa, pregled pre kupovine, izbor delova po broju šasije. Šta obuhvataju i koliko traju.
    partsLink: Pronađite delove za ovaj posao
    heroHeadingTemplate: '{name} u Beogradu'
    processHeading: Kako izgleda poseta
    ctaHeadingTemplate: '{name}: zakažite termin koji Vam odgovara'
    partsCtaHeadingTemplate: '{name}: saznaćete cenu i rok'
    ctaBody: Opišite nam šta se dešava sa automobilom. Pozvaćemo Vas tokom radnog vremena i dogovoriti termin.
    indexHeading: Sve što je potrebno Vašem automobilu, na jednom mestu
    indexLead: Saznajte šta obuhvata svaka usluga i koliko traje. Cenu dajemo nakon pregleda, pre početka radova.
    specsPriceLabel: Cena
    specsDurationLabel: Trajanje
    diagnostics:
      cta: Zakažite dijagnostiku
      name: Kompjuterska dijagnostika
      short: Otkrivamo šta se krije iza koda greške.
      metaTitle: Kompjuterska dijagnostika automobila u Beogradu | CarLab
      metaDescription: Dijagnostika motora, trapa i elektrike u Beogradu. Očitavanje grešaka je besplatno, a uzrok Vam pokazujemo na automobilu.
      heroTitle: Kod greške je simptom, a ne dijagnoza. Pronalazimo uzrok i pokazujemo Vam ga na automobilu.
      heroLead: Dijagnostika pokazuje koji senzor prijavljuje grešku. Ne može da utvrdi da li je problem u samom senzoru ili u onome što meri. To proveravamo na automobilu.
      priceFrom: očitavanje grešaka je besplatno
      duration: od 40 minuta
      bodyHeading: Šta radimo na dijagnostici
      body: |
        Najpre razgovaramo: kada je problem počeo, u kojim uslovima se javlja i šta je menjano pre toga. Neke uzroke utvrdimo već tada: „lupa samo kad je motor hladan“ i „stalno lupa“ ukazuju na različite delove.

        Zatim očitavamo greške iz svih elektronskih blokova. Često greška u ABS-u ili bloku komfora objašnjava ono na šta se vozač žali. Potom proveravamo automobil: pregledamo trap, zazore i curenja, proveravamo delove pod opterećenjem i po potrebi merimo pritisak ili koristimo osciloskop.

        Na kraju Vam pokazujemo uzrok na automobilu i jasno objašnjavamo šta smo pronašli. Ako je potrebna popravka, odmah pripremamo predračun.

        Koliko košta: očitavanje grešaka je besplatno. Dijagnostika se naplaćuje tek ako treba rasklopiti deo ili postaviti automobil na uređaj za ispitivanje. Cenu saopštavamo pre početka radova, ne na kraju.
      includesHeading: Šta je uključeno
      includes:
        - Razgovor o simptomima i istoriji održavanja
        - Očitavanje grešaka iz svih elektronskih blokova
        - Pregled na dizalici, provera zazora i curenja
        - Probna vožnja sa majstorom ako se problem javlja u vožnji
        - Usmeno objašnjenje nalaza i pisani predračun za popravku
      signsHeading: Kada treba da dođete
      signs:
        - Upalila se lampica „check engine“ ili neki drugi znak na instrument tabli
        - Automobil trza, motor radi neravnomerno ili teško pali
        - Potrošnja je porasla bez jasnog razloga
        - Čuje se novi zvuk, ali ne znate odakle dolazi
      honestHeading: Šta ne obećavamo
      honest: Ne može svaki kvar da se otkrije za četrdeset minuta. Povremeni problemi koji se javljaju jednom nedeljno nekad zahtevaju ponovnu posetu ili da automobil ostane kod nas ceo dan. To ćemo Vam odmah reći i nećemo menjati delove jedan po jedan na Vaš račun.
    servicing:
      cta: Zakažite servis
      name: Redovan servis
      short: Ulje, filteri, tečnosti i pregled prema preporukama za Vaš motor.
      metaTitle: Redovan servis i zamena ulja u Beogradu | CarLab
      metaDescription: 'Servis automobila u Beogradu: ulje, filteri, svećice, kočiona tečnost i antifriz. Prema preporukama proizvođača, uz upis u servisnu knjižicu.'
      heroTitle: Najjeftinija popravka je ona koju ste izbegli
      heroLead: Svaki motor ima svoj servisni interval i specifikaciju ulja. Proveravamo uputstvo za Vaš automobil i radimo ono što piše, a ne po pravilu „na svakih deset hiljada kilometara“.
      priceFrom: od 90 €
      duration: 2–4 sata
      bodyHeading: Kako određujemo servisni interval za Vaš automobil
      body: |
        Intervali zamene razlikuju se od motora do motora, a uslovi u Beogradu (gužve, prašina, letnje temperature blizu četrdeset stepeni) gotovo uvek spadaju u „otežane uslove vožnje“, za koje je interval kraći. Prema tome procenjujemo šta je Vašem automobilu zaista potrebno na toj kilometraži.

        Usput proveravamo i ono na šta se često zaboravi: stanje zupčastog kaiša ili lanca, količinu vlage u kočionoj tečnosti, tačku mržnjenja antifriza i istrošenost kočionih pločica i diskova u milimetrima.
      includesHeading: Šta je uključeno
      includes:
        - Motorno ulje i uljni filter prema specifikaciji proizvođača
        - Filter vazduha i kabine, kao i svećice prema preporukama proizvođača
        - Provera količine vlage u kočionoj tečnosti
        - Provera antifriza i njegove tačke mržnjenja
        - Merenje preostale debljine kočionih pločica i diskova u milimetrima
        - Upis svih radova i kilometraže u servisnu knjižicu
      signsHeading: Kada treba da dođete
      signs:
        - Došlo je vreme za servis prema kilometraži ili vremenu od prethodnog servisa
        - Tek ste kupili automobil, a nema evidenciju o servisiranju
        - Pred Vama je duže putovanje
        - Upalila se lampica za servisni interval
      honestHeading: Šta ne radimo
      honest: Ne menjamo delove kojima još nije vreme za zamenu. Ako je filter iskoristio tek polovinu radnog veka, ostavićemo ga i reći Vam kada da dođete.
    brakes-suspension:
      cta: Zakažite popravku
      name: Kočnice i trap
      short: Sve što utiče na to da li će se automobil zaustaviti.
      metaTitle: Popravka kočnica i trapa u Beogradu | CarLab
      metaDescription: 'Kočnice i trap u Beogradu: pločice, diskovi, kočiona klešta, ramena, geometrija trapa. Merenja u milimetrima, predračun pre radova.'
      heroTitle: Ovde se istrošenost meri u milimetrima
      heroLead: 'Sa motorom možete da stignete do servisa. Sa kočnicama ne možete da rizikujete. Zato kod trapa ništa ne zaokružujemo i ne odlažemo: ako je deo dotrajao, reći ćemo Vam otvoreno.'
      priceFrom: od 120 €
      duration: od 3 sata
      bodyHeading: Kako radimo
      body: |
        Počinjemo merenjem: debljine diskova i kočionih pločica u milimetrima, bacanja diskova i stanja creva i kočionih klešta. Na trapu proveravamo zazore, pregledamo manžetne i nosače.

        Posle popravke trapa uvek podešavamo geometriju točkova. Čak i zamena jednog ramena menja geometriju, a pogrešno podešeni točkovi mogu da unište komplet guma za jednu sezonu.
      includesHeading: Šta je uključeno
      includes:
        - Merenje diskova i kočionih pločica uz beleženje rezultata
        - Zamena kočionih pločica, diskova i creva, popravka ili zamena kočionih klešta
        - Odzračivanje i zamena kočione tečnosti
        - Amortizeri, opruge, ramena, silen blokovi, nosači i ležajevi
        - Podešavanje geometrije trapa posle svakog rada na trapu
        - Probna vožnja pre predaje automobila
      signsHeading: Kada treba da dođete
      signs:
        - Škripa, cviljenje ili struganje pri kočenju
        - Pedala kočnice je postala meka ili propada
        - Automobil vuče u stranu pri kočenju
        - Lupanje na neravninama, „plivajući“ volan ili neravnomerno trošenje guma
      honestHeading: Na šta ćemo Vas upozoriti
      honest: Kočione pločice i diskovi su potrošni delovi koji se menjaju u paru. Nove pločice mogu da se ugrade na istrošene diskove, ali će kraće trajati i za šest meseci ćete ponovo doći. Izračunaćemo obe varijante, a Vi ćete odlučiti.
    engine-gearbox:
      cta: Zakažite dijagnostiku
      name: Motor i menjač
      short: Od zamene dihtunga do generalne popravke, uz jasnu procenu troškova.
      metaTitle: Popravka motora i menjača u Beogradu | CarLab
      metaDescription: 'Popravka motora i menjača u Beogradu: zupčasti kaiš, dihtunzi, kvačilo, zamena ulja u automatskom menjaču. Dijagnostika i procena pre radova.'
      heroTitle: Generalna popravka motora potrebna je ređe nego što se misli
      heroLead: 'Pre nego što bilo šta rastavimo, proveravamo ono što može da se proveri spolja: kompresiju, pritisak ulja, greške i curenja.'
      priceFrom: u zavisnosti od rezultata dijagnostike
      duration: od 1 dana
      bodyHeading: Kako radimo
      body: |
        Prvo merimo: kompresiju po cilindrima, pritisak ulja, stanje svećica, greške u upravljačkim jedinicama i curenja pod pritiskom. Tek nakon toga odlučujemo da li motor treba otvarati.

        Kod menjača proveravamo stanje ulja i način promene brzina: kod automatskih menjača mnogi „kvarovi“ rešavaju se pravilnim servisom, a ne zamenom menjača. Ako je popravka ipak potrebna, dobijate procenu troškova, posebno za rad i delove, pre nego što išta skinemo.
      includesHeading: Šta je uključeno
      includes:
        - Merenje kompresije i pritiska ulja
        - Provera curenja pod pritiskom i traženje mesta gde uvlači vazduh
        - Zamena zupčastog kaiša ili lanca, rolera i pumpe
        - Dihtunzi, semerinzi i gumice ventila
        - Kvačilo, zamajac, zamena ulja u manuelnom i automatskom menjaču
        - Procena troškova sa odvojenim stavkama pre početka rastavljanja
      signsHeading: Kada treba da dođete
      signs:
        - Motor troši ulje između zamena
        - Čuje se lupanje, osećaju se vibracije ili motor gubi snagu
        - Trzaji i kašnjenje pri promeni brzina
        - Iz auspuha izlazi dim kojeg ranije nije bilo
      honestHeading: Kada Vas savetujemo da odustanete
      honest: Ako se cena popravke približava vrednosti automobila, reći ćemo Vam. Ponekad je bolje da ga prodate u postojećem stanju ili potražite polovan menjač ili motor nego da uložite iznos koji Vam se nikada neće vratiti.
    bodywork-painting:
      cta: Pošaljite fotografije oštećenja
      name: Limarija i farbanje
      short: Popravka posle udesa, ispravljanje karoserije i farbanje uz uklapanje boje.
      metaTitle: Limarija i farbanje posle udesa u Beogradu | CarLab
      metaDescription: 'Limarija u Beogradu: merenje geometrije, ispravljanje i farbanje uz kompjutersko uklapanje boje. Radimo sa osiguranjima i pomažemo oko dokumentacije.'
      heroTitle: Da se na automobilu ne vidi da je udaren
      heroLead: Kvalitetna popravka karoserije ne primećuje se ni golim okom ni meračem debljine laka pri pregledu pre prodaje.
      priceFrom: u zavisnosti od pregleda
      duration: od 3 dana
      bodyHeading: Šta obuhvata popravka
      body: |
        Najpre merimo geometriju karoserije: posle udarca pomeranja mogu postojati i tamo gde sve deluje čitavo. Kasnije zbog njih gume mogu neravnomerno da se troše, a automobil da vuče u stranu. Po potrebi postavljamo automobil na sto za ispravljanje karoserije i vraćamo delove na mesto prema kontrolnim tačkama.

        Boju usklađujemo na dva načina: prema kodu u dokumentima i spektrofotometrom na samom automobilu, jer fabrička boja posle pet godina na suncu može da se razlikuje od originalne. Prelaz poliramo tako da se ne vidi ni na suncu ni pod svetlom.
      includesHeading: Šta je uključeno
      includes:
        - Merenje geometrije karoserije prema kontrolnim tačkama
        - Ispravljanje karoserije na stolu kada postoje pomeranja
        - Ispravljanje i zamena oštećenih delova
        - Usklađivanje boje prema kodu i spektrofotometrom
        - Farbanje u komori uz kontrolu temperature
        - Poliranje prelaza i montaža uz proveru zazora
      signsHeading: Kada treba da dođete
      signs:
        - Automobil je bio u udesu, čak i ako oštećenja deluju mala
        - Zazori između delova karoserije nisu ravnomerni
        - Automobil vuče u stranu, a gume se troše samo sa jedne strane
        - Želite da sredite karoseriju pre prodaje
      honestHeading: Osiguranje
      honest: Radimo sa osiguranjima i pomažemo oko dokumentacije, ali ne obećavamo da će osiguranje pokriti sve. Posle pregleda odmah Vam pokazujemo šta je pokriveno osiguranjem, a šta nije, da to ne saznate tek na kraju.
    pre-purchase-inspection:
      cta: Zakažite proveru
      name: Provera automobila pre kupovine
      short: Merač debljine laka, dizalica i dijagnostika pre nego što date novac.
      metaTitle: Provera automobila pre kupovine u Beogradu | CarLab
      metaDescription: 'Provera automobila pre kupovine u Beogradu: merač laka, dizalica, dijagnostika grešaka i kompresije. Pisani izveštaj za lakše cenkanje.'
      heroTitle: Merač debljine laka otkriva ono što prodavac prećuti
      heroLead: Prelakirani delovi, tragovi varenja, vraćena kilometraža i curenja odozdo. Sve to može da se vidi za sat vremena na dizalici, iako u oglasu ne piše.
      priceFrom: od 60 €
      duration: oko 1 sat
      bodyHeading: Šta proveravamo
      body: |
        Karoseriju proveravamo meračem debljine laka na svim delovima: tražimo prelakirane delove, git, tragove varenja i proveravamo zazore. Zatim automobil podižemo i proveravamo trap, curenja, stanje izduvnog sistema i zaštite, kao i tragove udaraca odozdo.

        Kod elektronike očitavamo greške iz svih upravljačkih jedinica, uključujući obrisane greške. Na motoru proveravamo kompresiju i curenja. Na kraju dobijate pisani izveštaj sa spiskom pronađenih problema i procenom troškova popravke, koji možete da iskoristite za cenkanje.
      includesHeading: Šta je uključeno
      includes:
        - Merenje debljine laka na svim delovima karoserije
        - Pregled na dizalici, provera curenja i tragova udaraca
        - Očitavanje grešaka iz svih elektronskih blokova
        - Merenje kompresije po cilindrima
        - Provera znakova vraćene kilometraže
        - Pisani izveštaj sa procenom troškova popravke
      signsHeading: Kada Vam je potrebna provera
      signs:
        - Kupujete automobil od privatnog prodavca
        - Prodavac Vas požuruje da odlučite
        - Automobil je uvezen, a istorija mu nije poznata
        - Cena je sumnjivo niža od tržišne
      honestHeading: Šta provera ne može da otkrije
      honest: Iskreno ćemo Vam reći šta smo uočili, ali nijednim pregledom ne može da se otkrije sve. Skriveni kvar koji se ne pokaže na dizalici ni pri dijagnostici može da se pojavi kasnije. To je ograničenje provere, a ne sitna napomena u ugovoru.
    vin-parts-inquiry:
      cta: Pošaljite upit
      name: Pronalaženje auto delova
      short: Pronalazimo delove koji odgovaraju Vašem automobilu i saopštavamo cenu pre kupovine.
      metaTitle: Pronalaženje auto delova po VIN-u u Beogradu | CarLab
      metaDescription: 'Auto delovi po VIN-u ili broju šasije u Beogradu: originalni i provereni zamenski delovi, provera kompatibilnosti i cena unapred. Preuzimanje u auto servisu CarLab.'
      heroTitle: Pronaći ćemo delove koji sigurno odgovaraju Vašem automobilu
      heroLead: Pošaljite nam VIN ili broj šasije i napišite šta Vam je potrebno. Proverićemo kompatibilnost, pronaći originalne i proverene zamenske delove i ponuditi najbolje opcije.
      priceFrom: saopštavamo nakon izbora delova
      duration: saopštavamo uz cenu
      bodyHeading: Kako pronalazimo odgovarajuće delove
      body: |-
        Na osnovu broja šasije utvrđujemo tačnu konfiguraciju vozila: motor, menjač, godište i tržište za koje je proizvedeno. Od toga zavisi koji deo odgovara, čak i kada je model isti.

        Zatim pronalazimo kataloški broj dela kod proizvođača i proverene zamenske delove, upoređujemo cene i rokove isporuke kod dobavljača i predlažemo Vam nekoliko opcija. Vi birate, mi poručujemo, a delove možete preuzeti u našem servisu u Beogradu.

        Ako Vam je potrebna i ugradnja, možemo je obaviti kod nas: proverili smo da deo odgovara, a majstor zna šta ugrađuje.
      includesHeading: Šta je uključeno
      includes:
        - Provera kompatibilnosti po broju šasije ili VIN-u
        - Pronalaženje originalnog kataloškog broja dela
        - Izbor proverenih zamenskih delova po različitim cenama
        - Cena i rok isporuke pre nego što bilo šta platite
        - Preuzimanje u servisu u Beogradu
      signsHeading: Kada Vam je potrebna provera
      signs:
        - Ne znate tačan naziv ili broj dela
        - Brinete da ćete kupiti deo koji ne odgovara
        - Potreban Vam je redak deo ili deo koji se više ne proizvodi
        - Želite da uporedite cenu originalnog i zamenskog dela
      honestHeading: Kako određujemo cenu
      honest: Cenu i rok isporuke saopštavamo pre plaćanja. Ako je deo redak i poručuje se, odmah ćemo Vam reći koliko se čeka i ponuditi proveren zamenski deo, ako je dostupan.
  en:
    indexMetaTitle: 'Car servicing in Belgrade: repairs and maintenance | CarLab'
    indexMetaDescription: Diagnostics, servicing and oil changes, brakes and suspension, engine and gearbox repairs, accident damage repairs, pre-purchase inspections and VIN parts matching. What's included and how long it takes.
    partsLink: Find parts for this job
    heroHeadingTemplate: '{name} in Belgrade'
    processHeading: What to expect
    ctaHeadingTemplate: Book {name} at a time that suits you
    partsCtaHeadingTemplate: Get a price and lead time for {name}
    ctaBody: Tell us what's wrong with your car. We'll call you back during business hours and arrange a visit.
    indexHeading: Everything your car needs, all in one place
    indexLead: Find out what's included in each service and how long it takes. We confirm the price after inspecting your car, before starting work.
    specsPriceLabel: Price
    specsDurationLabel: Time
    diagnostics:
      cta: Book a diagnostic check
      name: Computer diagnostics
      short: We find the cause behind the fault code.
      metaTitle: Car diagnostics in Belgrade | CarLab
      metaDescription: Engine, suspension and electrical diagnostics in Belgrade. Fault codes read free of charge, and we show you the cause on your car.
      heroTitle: A fault code is a symptom, not a diagnosis. We find the cause and show you what's wrong.
      heroLead: A scanner can tell you which sensor is reporting a fault. It can't tell you whether the sensor itself is faulty or what it's measuring. That takes further checks on the car.
      priceFrom: fault code reading is free
      duration: from 40 minutes
      bodyHeading: What our diagnostic check includes
      body: |
        First, we ask about the symptoms: when they started, what conditions they occur in, and what work has been done recently. Sometimes that already points us in the right direction. A knock that happens only when the engine is cold may have a different cause from one that's always there.

        Then we scan all the car's control units. A fault in the ABS or comfort control module can often explain the issue you're experiencing. Next, we inspect the car: check for play on the ramp, examine components under load, and, if needed, measure pressure or use an oscilloscope.

        At the end, we'll show you the cause on the car and explain it in plain English. If repairs are needed, we'll give you a quote straight away.

        How much does it cost? Reading fault codes is free. We only charge for diagnostics if we need to dismantle a component or put the car on a test bench. We'll tell you the price before we start, not after.
      includesHeading: What's included
      includes:
        - Questions about symptoms and service history
        - Fault code scan of all electronic control units
        - Inspection on the ramp, including checks for play and leaks
        - Road test with a technician if the problem occurs while driving
        - A clear explanation and written repair estimate
      signsHeading: When to bring your car in
      signs:
        - The check engine light or another warning light is on
        - The car jerks, misfires or is hard to start
        - Fuel consumption has gone up for no obvious reason
        - There's a new noise and you can't tell where it's coming from
      honestHeading: What we can't promise
      honest: Not every fault can be found in 40 minutes. Intermittent problems that occur only once a week may need a follow-up visit or for us to keep the car for a day. We'll tell you upfront and won't replace parts one by one at your expense.
    servicing:
      cta: Book a service
      name: Scheduled servicing
      short: Oil, filters, fluids and checks to suit your engine's service schedule.
      metaTitle: Car servicing and oil changes in Belgrade | CarLab
      metaDescription: "Car servicing in Belgrade: oil, filters, spark plugs, brake fluid and coolant. Serviced to the manufacturer's schedule and recorded in your service book."
      heroTitle: The cheapest repair is the one you never need
      heroLead: Every engine has its own service intervals and oil specifications. We check your car's manual and follow it, rather than relying on a one-size-fits-all 'every 10,000 km' rule.
      priceFrom: from €90
      duration: 2-4 hours
      bodyHeading: How we work out your car's service interval
      body: |
        Service intervals can vary widely between engines. Belgrade driving conditions, with traffic, dust and summer temperatures approaching 40°C, often count as 'severe operating conditions', which means shorter intervals. We use that guidance to work out what your car actually needs at its current mileage.

        We also check the things people often leave too late: the condition of the timing belt or chain, moisture in the brake fluid, the coolant's freezing point, and brake pad and disc wear in millimetres.
      includesHeading: What's included
      includes:
        - Engine oil and oil filter to the manufacturer's specification
        - Air and cabin filters, plus spark plugs as required by the service schedule
        - Brake fluid moisture check
        - Coolant check, including its freezing point
        - Brake pad and disc thickness measured in millimetres
        - All work and mileage recorded in your service book
      signsHeading: When to bring your car in
      signs:
        - It's been a year or the recommended mileage since your last service
        - You've just bought the car and there's no service history
        - You're planning a long journey
        - The service reminder light has come on
      honestHeading: What we won't do
      honest: We won't replace parts before they need changing. If a filter still has half its service life left, we'll leave it in and let you know when to come back.
    brakes-suspension:
      cta: Book a repair
      name: Brakes and suspension
      short: Everything that helps your car stop safely and handle properly.
      metaTitle: Brake and suspension repairs in Belgrade | CarLab
      metaDescription: 'Brakes and suspension in Belgrade: pads, discs, calipers, control arms and wheel alignment. Measurements in millimetres, quote before work starts.'
      heroTitle: Here, wear is measured in millimetres
      heroLead: You can nurse an engine to the garage. You can't do that with the brakes. We measure suspension and brake components carefully and tell you plainly when they're worn out.
      priceFrom: from €120
      duration: from 3 hours
      bodyHeading: How we do the work
      body: |
        We start by measuring brake disc and pad thickness in millimetres, checking disc runout, and inspecting the hoses and calipers. We check suspension for play on the ramp and shaker plates, and inspect the boots and mounts.

        After suspension work, we always check and adjust the wheel alignment. Even replacing one control arm can change the geometry, and poor alignment can wear out a set of tyres in a single season.
      includesHeading: What's included
      includes:
        - Brake disc and pad measurements, with the results recorded
        - Brake pad, disc and hose replacement, plus caliper repair or replacement
        - Brake bleeding and brake fluid replacement
        - Shock absorbers, springs, control arms, bushes, mounts and bearings
        - Wheel alignment after any suspension work
        - A final road test before we hand the car back
      signsHeading: When to bring your car in
      signs:
        - Squealing, squeaking or grinding when you brake
        - The brake pedal feels soft or sinks to the floor
        - The car pulls to one side when braking
        - Knocks over bumps, vague steering or uneven tyre wear
      honestHeading: What we'll explain
      honest: Brake pads and discs wear together. You can fit new pads on worn discs, but the pads won't last as long, and you may be back in six months. We'll price both options and leave the choice to you.
    engine-gearbox:
      cta: Book a diagnostic check
      name: Engine and gearbox
      short: From replacing a gasket to a full strip-down, with a clear estimate.
      metaTitle: Engine and gearbox repairs in Belgrade | CarLab
      metaDescription: 'Engine and transmission repairs in Belgrade: timing belts, gaskets, clutches and automatic transmission fluid changes. Diagnosis before strip-down, estimate before work.'
      heroTitle: A full engine rebuild is less often needed than people think
      heroLead: 'Before taking anything apart, we check what we can from the outside: compression, oil pressure, fault codes and leaks.'
      priceFrom: following diagnosis
      duration: from 1 day
      bodyHeading: How we work
      body: |
        First, we take measurements: compression in each cylinder, oil pressure, spark plug condition, fault codes from the control units and leaks under pressure. Only then do we decide whether the engine needs to be opened up.

        For gearboxes, we check the fluid condition and how the gears shift. Many automatic transmission 'failures' can be fixed with proper servicing rather than replacing the unit. If repairs are needed, you get an itemised estimate for labour and parts before anything is removed.
      includesHeading: What's included
      includes:
        - Compression and oil pressure testing
        - Pressure testing for leaks and checking for air leaks
        - Timing belt or chain, tensioner and water pump replacement
        - Gaskets, seals and valve stem seals
        - Clutch and flywheel repairs, manual and automatic transmission fluid changes
        - Itemised estimate before work begins
      signsHeading: When to bring your car in
      signs:
        - The engine is using oil between changes
        - Knocking, vibration or loss of power
        - Jerking or delays when changing gears
        - Exhaust smoke that wasn't there before
      honestHeading: When we advise against it
      honest: If the repair cost is close to the car's value, we'll tell you. Sometimes the right advice is to sell it as-is or look for a used replacement unit, rather than spend more on repairs than the car will ever be worth.
    bodywork-painting:
      cta: Send photos of the damage
      name: Bodywork and painting
      short: Accident repairs, body alignment and colour-matched paintwork.
      metaTitle: Accident repairs and resprays in Belgrade | CarLab
      metaDescription: 'Body repairs in Belgrade: jig work, alignment checks, panel beating and computer-matched paint. We work with insurers and help with paperwork.'
      heroTitle: So your car doesn't look like it's been in a crash
      heroLead: Good body repairs are hard to spot, even by eye or with a paint depth gauge during a pre-sale inspection.
      priceFrom: following inspection
      duration: from 3 days
      bodyHeading: What's included in the repairs
      body: |
        First, we measure the body alignment. After an impact, panels can shift even where everything looks intact, leading to uneven tyre wear and the car pulling to one side. If needed, we put the car on a body jig and pull it back into shape using reference points.

        We match the paint colour twice: using the code in the documents and with a spectrophotometer on the car itself. After five years in the sun, the factory paint may no longer match its original code. We blend and polish the paint so the transition can't be seen in sunlight or under workshop lights.
      includesHeading: What's included
      includes:
        - Body alignment measurement using reference points
        - Body jig and straightening where panels have shifted
        - Panel beating and replacement of damaged parts
        - Colour matching by paint code and spectrophotometer
        - Spray painting in a temperature-controlled booth
        - Blending, polishing and refitting, with panel gaps checked
      signsHeading: When to bring your car in
      signs:
        - The car has been in an accident, even if the damage looks minor
        - Uneven gaps between body panels
        - The car pulls to one side or the tyres are wearing unevenly
        - You want the bodywork tidied up before selling
      honestHeading: Insurance claims
      honest: We work with insurers and help with the paperwork, but we can't promise they'll cover everything. After inspecting the car, we'll show you straight away what is and isn't covered, so there are no surprises at the end.
    pre-purchase-inspection:
      cta: Book an inspection
      name: Pre-purchase inspection
      short: Paint depth gauge, lift and diagnostic scan before you hand over the money.
      metaTitle: Pre-purchase car inspection in Belgrade | CarLab
      metaDescription: 'Pre-purchase car inspection in Belgrade: paint depth gauge, lift, fault code scan and compression test. Written report to help you negotiate.'
      heroTitle: A paint depth gauge can reveal what the seller won't
      heroLead: Repainted panels, weld marks, clocked mileage and leaks underneath. An hour on the lift can reveal what the listing leaves out.
      priceFrom: from €60
      duration: about 1 hour
      bodyHeading: What we check
      body: |
        We use a paint depth gauge across all body panels to check for repainting, filler, weld marks and uneven panel gaps. Then we put the car on the lift to inspect the suspension, leaks, exhaust, underbody protection and signs of impact damage underneath.

        We scan all control units for fault codes, including stored and cleared codes. We also test engine compression and check for leaks. At the end, you get a written report listing our findings and the estimated repair costs, which you can use to negotiate.
      includesHeading: What's included
      includes:
        - Paint thickness measurement across all body panels
        - Inspection on the lift for leaks and signs of impact damage
        - Fault code scan of all electronic control units
        - Compression test on each cylinder
        - Check for signs of clocked mileage
        - Written report with estimated repair costs
      signsHeading: When to get an inspection
      signs:
        - You're buying a car privately
        - The seller is rushing you to decide
        - The car was imported and its history is unknown
        - The price seems suspiciously below market value
      honestHeading: What an inspection can't tell you
      honest: We'll give you an honest account of what we find, but no inspection catches everything. A hidden fault that doesn't show up on the lift or during diagnostics may appear later. That's a limitation of the inspection, not small print.
    vin-parts-inquiry:
      cta: Send a parts enquiry
      name: Parts matching
      short: We find parts that fit your car and confirm the price before you buy.
      metaTitle: Find car parts by VIN in Belgrade | CarLab
      metaDescription: Find car parts by VIN or chassis number in Belgrade. Genuine parts and trusted alternatives, compatibility checks and a confirmed price before purchase. Collect at CarLab.
      heroTitle: We'll find parts that fit your car
      heroLead: Send us your VIN or chassis number and tell us what you need. We'll check compatibility, find genuine parts and trusted alternatives, and suggest the best options.
      priceFrom: quoted after parts matching
      duration: given with the price
      bodyHeading: How we find the right parts
      body: |
        We use the VIN to identify the car's exact specification: engine, gearbox, year and the market it was built for. This determines which parts will fit, even if it's the same model.

        We then look up the manufacturer's part number and trusted alternatives, compare prices and delivery times from suppliers, and give you a few options. You choose, we order, and you can collect the parts from our service centre in Belgrade.

        If you also need fitting, we can do that here too. The part has been checked for compatibility, and the mechanic knows exactly what they're fitting.
      includesHeading: What's included
      includes:
        - Compatibility check by VIN or chassis number
        - Finding the original part number
        - Choosing trusted alternatives at different prices
        - Price and delivery time before you pay
        - Collection from our service centre in Belgrade
      signsHeading: When to get an inspection
      signs:
        - You're not sure of the exact part name or number
        - You're worried about buying a part that won't fit
        - You need a rare or discontinued part
        - You want to compare the price of the original part with alternatives
      honestHeading: How we quote prices
      honest: We tell you the price and delivery time before you pay. If a part is rare and has to be ordered in, we'll let you know how long it will take and suggest a trusted alternative if one is available.
