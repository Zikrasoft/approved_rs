diagnostics:
  cta: Записаться на диагностику
  name: Компьютерная диагностика
  short: Находим, что стоит за кодом ошибки.
  metaTitle: Компьютерная диагностика автомобиля в Белграде | CarLab
  metaDescription: Диагностика двигателя, подвески и электрики в Белграде. Считывание ошибок бесплатно, причину показываем прямо на машине.
  heroTitle: Код ошибки это симптом, а не диагноз. Находим причину и показываем ее на машине.
  heroLead: Сканер скажет, какой датчик ругается. Виноват сам датчик или то, что он измеряет, сканер не покажет, это выясняется уже на машине.
  priceFrom: считывание ошибок бесплатно
  duration: от 40 минут
  bodyHeading: Что мы делаем на диагностике
  body: |
    Сначала разговор: когда началось, при каких условиях, что менялось до этого. Часть диагнозов ставится уже здесь: «стучит только на холодную» и «стучит постоянно» это разные узлы.

    Потом сканер по всем блокам сразу: часто ошибка в ABS или в блоке комфорта объясняет то, на что жалуется водитель. Дальше проверка на машине: подъемник, люфты, осмотр под нагрузкой, при необходимости замер давления и осциллограф.

    В конце показываем причину на автомобиле и объясняем на пальцах. Если нужен ремонт, сразу считаем смету.

    Сколько это стоит: считывание ошибок бесплатно. Платной диагностика становится только тогда, когда нужно разбирать узел или ставить машину на стенд, и цену мы называем до начала работ, а не в конце.
  includesHeading: Что входит
  includes:
    - Опрос по симптомам и истории обслуживания
    - Считывание ошибок по всем электронным блокам
    - Осмотр на подъемнике, проверка люфтов и утечек
    - Тест-драйв с инженером, если проблема проявляется в движении
    - Устное заключение и письменная смета на ремонт
  signsHeading: Когда пора к нам
  signs:
    - Горит «чек» или другой значок на панели
    - Машина дергается, троит или плохо заводится
    - Расход вырос без понятной причины
    - Появился новый звук, и вы не понимаете откуда
  honestHeading: Что мы не обещаем
  honest: Не каждая неисправность ловится за сорок минут. Плавающие проблемы, которые появляются раз в неделю, иногда требуют повторного визита или оставить машину на день. Мы скажем об этом сразу и не станем менять детали по очереди за ваш счет.
servicing:
  cta: Записаться на ТО
  name: Плановое ТО
  short: Масло, фильтры, жидкости и осмотр по регламенту вашего двигателя.
  metaTitle: Плановое ТО и замена масла в Белграде | CarLab
  metaDescription: 'Техническое обслуживание автомобиля в Белграде: масло, фильтры, свечи, тормозная жидкость, антифриз. По регламенту производителя, с записью в сервисную карту.'
  heroTitle: Самая дешевая починка та, которой не случилось
  heroLead: У каждого мотора свой интервал и свой допуск по маслу. Мы смотрим мануал на вашу машину и делаем то, что написано там, а не среднее «раз в десять тысяч».
  priceFrom: от 90 €
  duration: 2–4 часа
  bodyHeading: Откуда берется интервал для вашей машины
  body: |
    Интервалы замены у разных моторов отличаются в разы, а условия Белграда (пробки, пыль, лето под сорок) почти всегда попадают под «тяжелые условия эксплуатации» с укороченным интервалом. По ним и считаем, что реально нужно вашей машине на этом пробеге.

    Заодно проверяем то, что обычно вспоминают слишком поздно: состояние ремня или цепи, тормозную жидкость на влагу, антифриз на температуру замерзания, износ колодок и дисков в миллиметрах.
  includesHeading: Что входит
  includes:
    - Масло и масляный фильтр с допуском вашего производителя
    - Воздушный и салонный фильтр, свечи по регламенту
    - Проверка тормозной жидкости на содержание влаги
    - Проверка антифриза и его температуры замерзания
    - Замер остатка колодок и дисков в миллиметрах
    - Запись всех работ и пробега в сервисную карту
  signsHeading: Когда пора к нам
  signs:
    - Подошел пробег или год с прошлого ТО
    - Машина только куплена, а истории обслуживания нет
    - Впереди дальняя дорога
    - Загорелась лампа сервисного интервала
  honestHeading: Что мы не делаем
  honest: Не меняем то, чему еще рано. Если фильтр отработал половину ресурса, мы его не тронем и скажем, когда приезжать.
brakes-suspension:
  cta: Записаться на ремонт
  name: Тормоза и подвеска
  short: Все, что отвечает за то, остановится машина или нет.
  metaTitle: Ремонт тормозов и подвески в Белграде | CarLab
  metaDescription: 'Тормоза и подвеска в Белграде: колодки, диски, суппорты, рычаги, развал-схождение. Замеры в миллиметрах, смета до работ.'
  heroTitle: Здесь ресурс считают в миллиметрах
  heroLead: 'Мотор можно дотянуть до сервиса. Тормоза нельзя. Поэтому по ходовой мы не округляем и не тянем: если ресурс кончился, говорим прямо.'
  priceFrom: от 120 €
  duration: от 3 часов
  bodyHeading: Как мы это делаем
  body: |
    Начинаем с замеров: толщина дисков и колодок в миллиметрах, биение, состояние шлангов и суппортов. По подвеске проверяем люфты на подъемнике и на вибростенде, осматриваем пыльники и опоры.

    После ремонта ходовой всегда делаем развал-схождение: даже замена одного рычага меняет геометрию, а неправильная геометрия съедает комплект резины за сезон.
  includesHeading: Что входит
  includes:
    - Замер дисков и колодок с записью результата
    - Замена колодок, дисков, шлангов, ремонт или замена суппортов
    - Прокачка и замена тормозной жидкости
    - Стойки, пружины, рычаги, сайлентблоки, опоры и подшипники
    - Развал-схождение после любого вмешательства в подвеску
    - Контрольный тест-драйв перед выдачей
  signsHeading: Когда пора к нам
  signs:
    - Скрип, писк или скрежет при торможении
    - Педаль стала мягкой или проваливается
    - Машину уводит в сторону при торможении
    - Стуки на неровностях, «плавающий» руль, неравномерный износ резины
  honestHeading: О чем предупредим
  honest: Колодки и диски это расходник, который ходит парой. Ставить новые колодки на изношенные диски можно, но ресурс колодок при этом падает, и через полгода вы приедете снова. Мы посчитаем оба варианта и оставим выбор вам.
engine-gearbox:
  cta: Записаться на диагностику
  name: Двигатель и коробка
  short: От замены прокладки до ремонта с разбором, с понятной сметой.
  metaTitle: Ремонт двигателя и коробки передач в Белграде | CarLab
  metaDescription: 'Ремонт двигателя и трансмиссии в Белграде: ГРМ, прокладки, сцепление, замена масла в АКПП. Диагностика до разбора, смета до работ.'
  heroTitle: «Капиталка» нужна не так часто, как ее называют
  heroLead: 'Прежде чем что-то разбирать, мы проверяем то, что проверяется снаружи: компрессию, давление масла, ошибки, утечки.'
  priceFrom: по результатам диагностики
  duration: от 1 дня
  bodyHeading: Порядок работы
  body: |
    Сначала измеряем: компрессия по цилиндрам, давление масла, состояние свечей, ошибки по блокам, утечки под давлением. Только после этого решаем, нужно ли вскрывать мотор.

    По коробкам смотрим состояние масла и логику переключений: у автоматов большая часть «поломок» лечится корректным обслуживанием, а не заменой агрегата. Если ремонт все же нужен, вы получаете смету с разбивкой на работу и запчасти до того, как что-то снято.
  includesHeading: Что входит
  includes:
    - Замер компрессии и давления масла
    - Проверка на утечки под давлением, поиск подсоса воздуха
    - Замена ремня или цепи ГРМ, роликов и помпы
    - Прокладки, сальники, маслосъемные колпачки
    - Сцепление, маховик, замена масла в механике и автомате
    - Смета с разбивкой до начала разбора
  signsHeading: Когда пора к нам
  signs:
    - Масло уходит между заменами
    - Стук, вибрация или потеря тяги
    - Рывки и задержки при переключении передач
    - Дым из выхлопа, которого раньше не было
  honestHeading: Когда мы отговариваем
  honest: Если стоимость ремонта подходит к стоимости машины, мы это скажем. Иногда правильный совет продать как есть или искать контрактный агрегат, а не вкладывать в ремонт сумму, которую машина никогда не вернет.
bodywork-painting:
  cta: Прислать фото повреждений
  name: Кузов и покраска
  short: Восстановление после ДТП, правка геометрии и покраска с подбором цвета.
  metaTitle: Кузовной ремонт и покраска после ДТП в Белграде | CarLab
  metaDescription: 'Кузовной ремонт в Белграде: стапель, замер геометрии, рихтовка, покраска с компьютерным подбором цвета. Работаем со страховыми, помогаем с документами.'
  heroTitle: Чтобы машина не выглядела «после удара»
  heroLead: Хороший кузовной ремонт не видно ни глазом, ни толщиномером на осмотре перед продажей.
  priceFrom: по результатам осмотра
  duration: от 3 дней
  bodyHeading: Что входит в восстановление
  body: |
    Сначала замеряем геометрию кузова: после удара смещения бывают там, где визуально все цело, и именно они потом дают неравномерный износ резины и увод машины. При необходимости ставим на стапель и вытягиваем по контрольным точкам.

    Цвет подбираем дважды: по коду из документов и спектрофотометром по факту, потому что за пять лет на солнце заводской цвет уходит от паспортного. Переход полируем так, чтобы граница не читалась ни на солнце, ни под лампой.
  includesHeading: Что входит
  includes:
    - Замер геометрии кузова по контрольным точкам
    - Стапель и вытяжка при смещениях
    - Рихтовка, замена поврежденных элементов
    - Подбор цвета по коду и спектрофотометром
    - Покраска в камере с контролем температуры
    - Полировка перехода и сборка с проверкой зазоров
  signsHeading: Когда пора к нам
  signs:
    - Было ДТП, даже если повреждения выглядят мелкими
    - Неравномерные зазоры между деталями кузова
    - Машину уводит, резина изнашивается «в один край»
    - Нужно привести кузов в порядок перед продажей
  honestHeading: О страховых
  honest: Мы работаем со страховыми и помогаем с документами, но не обещаем, что страховая покроет все. После осмотра мы сразу показываем, что попадает в страховой случай, а что нет, чтобы вы не узнали об этом в конце.
pre-purchase-inspection:
  cta: Записаться на проверку
  name: Проверка перед покупкой
  short: Толщиномер, подъемник и сканер до того, как вы отдали деньги.
  metaTitle: Проверка автомобиля перед покупкой в Белграде | CarLab
  metaDescription: 'Техническая проверка перед покупкой в Белграде: толщиномер, подъемник, диагностика ошибок, компрессия. Письменное заключение и торг в вашу пользу.'
  heroTitle: Что покажет толщиномер, продавец не расскажет
  heroLead: Перекрашенные панели, следы сварки, скрученный пробег, утечки снизу. За час на подъемнике это видно, хотя в объявлении об этом не пишут.
  priceFrom: от 60 €
  duration: около 1 часа
  bodyHeading: Что мы проверяем
  body: |
    Кузов проверяем толщиномером по всем панелям: перекрашенные элементы, шпаклевка, следы сварки, состояние зазоров. Дальше подъемник: подвеска, утечки, состояние выхлопа и защиты, следы ударов снизу.

    Электроника: считывание ошибок по всем блокам, включая скрученные и стертые. По мотору компрессия и утечки. В конце вы получаете письменное заключение со списком найденного и оценкой стоимости устранения, с которым можно торговаться.
  includesHeading: Что входит
  includes:
    - Замер толщины лака по всем панелям кузова
    - Осмотр на подъемнике, проверка на утечки и следы ударов
    - Считывание ошибок по всем электронным блокам
    - Замер компрессии по цилиндрам
    - Проверка на признаки скрученного пробега
    - Письменное заключение с оценкой стоимости устранения
  signsHeading: Когда это нужно
  signs:
    - Покупаете машину с рук
    - Продавец торопит с решением
    - Машина привезена из-за границы, история неизвестна
    - Цена подозрительно ниже рынка
  honestHeading: Чего проверка не дает
  honest: Мы честно скажем, что видим, но ни один осмотр не ловит все. Скрытый дефект, который не проявляется ни на подъемнике, ни на диагностике, может всплыть позже. Это ограничение метода, а не оговорка мелким шрифтом.
vin-parts-inquiry:
  cta: Отправить запрос
  name: Подбор запчастей
  short: Находим запчасти, которые подходят вашей машине, и называем цену до покупки.
  metaTitle: Подбор автозапчастей по VIN в Белграде | CarLab
  metaDescription: 'Подбор запчастей по VIN или номеру шасси в Белграде: оригинал и проверенные аналоги, проверка совместимости, цена до покупки. Самовывоз в сервисе CarLab.'
  heroTitle: Подберем запчасти, которые точно подойдут вашей машине
  heroLead: Пришлите VIN или номер шасси и напишите, что нужно. Мы проверим совместимость, найдем оригинал и проверенные аналоги и предложим лучшие варианты.
  priceFrom: называем после подбора
  duration: назовем вместе с ценой
  bodyHeading: Как мы подбираем запчасти
  body: |
    По VIN мы определяем точную комплектацию машины: двигатель, коробку, год и рынок, для которого она собрана. От этого зависит, какая запчасть подойдет, даже если модель та же.

    Дальше ищем номер запчасти у производителя и проверенные аналоги, сравниваем цены и сроки у поставщиков и предлагаем вам несколько вариантов. Вы выбираете, мы заказываем, а забрать запчасти можно в нашем сервисе в Белграде.

    Если нужна и установка, ее можно сделать у нас же: запчасть проверена на совместимость, и мастер знает, что ставит.
  includesHeading: Что входит
  includes:
    - Проверка совместимости по VIN или номеру шасси
    - Поиск оригинального номера запчасти
    - Подбор проверенных аналогов с разной ценой
    - Цена и срок до того, как вы что-то оплатили
    - Самовывоз в сервисе в Белграде
  signsHeading: Когда это нужно
  signs:
    - Не знаете точное название или номер запчасти
    - Боитесь купить запчасть, которая не подойдет
    - Нужна редкая или снятая с производства деталь
    - Хотите сравнить оригинал и аналоги по цене
  honestHeading: Как мы называем цену
  honest: Цену и срок называем до оплаты. Если деталь редкая и идет под заказ, сразу скажем, сколько ждать, и предложим проверенный аналог, если он есть.
translations:
  sr:
    indexMetaTitle: 'Auto servis u Beogradu: popravke i održavanje | CarLab'
    indexMetaDescription: Dijagnostika, servis i zamena ulja, kočnice i trap, motor i menjač, limarija posle udesa, pregled pre kupovine, delovi po VIN-u. Šta obuhvataju radovi i koliko traju.
    partsLink: Pronađite delove za ovu popravku
    heroHeadingTemplate: '{name} u Beogradu'
    processHeading: Kako izgleda poseta servisu
    ctaHeadingTemplate: '{name}: zakazaćemo termin koji Vam odgovara'
    partsCtaHeadingTemplate: '{name}: javićemo Vam cenu i rok isporuke'
    ctaBody: Opišite problem sa automobilom. Pozvaćemo Vas tokom radnog vremena i dogovoriti termin dolaska.
    indexHeading: Sve što Vašem automobilu treba, u jednom servisu
    indexLead: Šta obuhvata svaka usluga i koliko traje. Cenu saopštavamo nakon pregleda, pre početka radova.
    specsPriceLabel: Cena
    specsDurationLabel: Trajanje
    diagnostics:
      cta: Zakažite dijagnostiku
      name: Kompjuterska dijagnostika
      short: Otkrivamo šta se krije iza koda greške.
      metaTitle: Kompjuterska dijagnostika u Beogradu | CarLab
      metaDescription: Dijagnostika motora, trapa i auto-elektrike u Beogradu. Očitavanje grešaka je besplatno, a uzrok Vam pokazujemo na samom automobilu.
      heroTitle: Kod greške je simptom, a ne dijagnoza. Pronalazimo uzrok i pokazujemo Vam ga na automobilu.
      heroLead: Dijagnostički uređaj pokazuje koji senzor prijavljuje grešku. Ali da li je problem u senzoru ili u onome što meri, to se utvrđuje proverom na automobilu.
      priceFrom: besplatno očitavanje grešaka
      duration: od 40 minuta
      bodyHeading: Šta radimo tokom dijagnostike
      body: |
        Prvo razgovaramo: kada je problem počeo, u kojim uslovima se javlja i šta je pre toga menjano. Već tada možemo da suzimo uzrok: lupanje samo na hladnom motoru i stalno lupanje upućuju na različite sklopove.

        Zatim dijagnostičkim uređajem proveravamo sve upravljačke jedinice: često greška u ABS-u ili modulu komfora objašnjava problem koji vozač primećuje. Sledi provera na automobilu: dizalica, zazori, pregled pod opterećenjem, a po potrebi i merenje pritiska i provera osciloskopom.

        Na kraju Vam pokazujemo uzrok na automobilu i objašnjavamo ga jednostavnim rečima. Ako je potrebna popravka, odmah pravimo predračun.

        Koliko košta: očitavanje grešaka je besplatno. Dijagnostiku naplaćujemo samo ako je potrebno rasklapanje sklopa ili ispitivanje na testnom stolu. Cenu saopštavamo pre početka radova, a ne na kraju.
      includesHeading: Šta je uključeno
      includes:
        - Razgovor o simptomima i istoriji održavanja
        - Očitavanje grešaka iz svih elektronskih upravljačkih jedinica
        - Pregled na dizalici, provera zazora i curenja
        - Probna vožnja sa stručnim licem ako se problem javlja u vožnji
        - Usmeno objašnjenje nalaza i pisani predračun za popravku
      signsHeading: Kada je vreme da dođete
      signs:
        - Svetli lampica motora ili druga lampica na instrument-tabli
        - Automobil trza, motor radi neravnomerno ili teško pali
        - Potrošnja je porasla bez očiglednog razloga
        - Pojavio se nov zvuk i ne znate odakle dolazi
      honestHeading: Šta ne obećavamo
      honest: Ne može se svaki kvar otkriti za četrdeset minuta. Povremeni problemi koji se javljaju jednom nedeljno nekad zahtevaju ponovni dolazak ili da automobil ostane kod nas jedan dan. To ćemo Vam odmah reći i nećemo redom menjati delove o Vašem trošku.
    servicing:
      cta: Zakažite servis
      name: Redovno održavanje
      short: Ulje, filteri, tečnosti i pregled prema servisnom planu za Vaš motor.
      metaTitle: Redovan servis i zamena ulja u Beogradu | CarLab
      metaDescription: 'Održavanje automobila u Beogradu: ulje, filteri, svećice, kočiona tečnost i antifriz. Prema planu proizvođača, uz upis u servisnu evidenciju.'
      heroTitle: Najjeftinija popravka je ona koju izbegnete
      heroLead: Svaki motor ima svoj servisni interval i propisanu specifikaciju ulja. Proveravamo uputstvo za Vaš automobil i radimo po njemu, a ne po univerzalnom pravilu „na deset hiljada“.
      priceFrom: od 90 €
      duration: 2–4 sata
      bodyHeading: Kako određujemo servisni interval za Vaš automobil
      body: |
        Intervali zamene mogu se višestruko razlikovati od motora do motora, a beogradski uslovi vožnje (gužve, prašina i letnje temperature blizu četrdeset stepeni) gotovo uvek spadaju u otežane uslove eksploatacije, za koje važe kraći intervali. Na osnovu toga određujemo šta je Vašem automobilu zaista potrebno na trenutnoj kilometraži.

        Usput proveravamo i ono čega se vozači obično sete prekasno: stanje zupčastog kaiša ili lanca, sadržaj vlage u kočionoj tečnosti, tačku mržnjenja antifriza i preostalu debljinu pločica i diskova u milimetrima.
      includesHeading: Šta je uključeno
      includes:
        - Ulje i filter ulja prema specifikaciji proizvođača Vašeg vozila
        - Filter vazduha, filter kabine i svećice prema servisnom planu
        - Provera sadržaja vlage u kočionoj tečnosti
        - Provera antifriza i njegove tačke mržnjenja
        - Merenje preostale debljine pločica i diskova u milimetrima
        - Upis svih radova i kilometraže u servisnu evidenciju
      signsHeading: Kada je vreme da dođete
      signs:
        - Dostigli ste propisanu kilometražu ili je prošla godina od prethodnog servisa
        - Upravo ste kupili automobil bez istorije održavanja
        - Predstoji Vam duže putovanje
        - Upalila se lampica za servisni interval
      honestHeading: Šta ne radimo
      honest: Ne menjamo ono za šta još nije vreme. Ako je filter tek na polovini svog radnog veka, nećemo ga menjati, već ćemo Vam reći kada da dođete.
    brakes-suspension:
      cta: Zakažite popravku
      name: Kočnice i trap
      short: Sve od čega zavisi da li će se automobil zaustaviti na vreme.
      metaTitle: Popravka kočnica i trapa u Beogradu | CarLab
      metaDescription: 'Kočnice i trap u Beogradu: pločice, diskovi, kočiona klešta, ramena i reglaža trapa. Merenje u milimetrima, predračun pre početka radova.'
      heroTitle: Ovde se preostali vek meri u milimetrima
      heroLead: 'Popravka motora ponekad može da sačeka dolazak u servis. Kočnice ne mogu. Zato kod trapa nema zaokruživanja ni odlaganja: kada je deo istrošen, to kažemo otvoreno.'
      priceFrom: od 120 €
      duration: od 3 sata
      bodyHeading: Kako radimo
      body: |
        Počinjemo merenjem: debljina diskova i pločica u milimetrima, bočno bacanje diskova, stanje creva i kočionih klešta. Na trapu proveravamo zazore na dizalici i vibracionom stolu, a zatim pregledamo manžetne i nosače.

        Posle popravke trapa uvek radimo reglažu: čak i zamena jednog ramena menja geometriju, a loša geometrija može da potroši komplet guma za jednu sezonu.
      includesHeading: Šta je uključeno
      includes:
        - Merenje diskova i pločica uz beleženje rezultata
        - Zamena pločica, diskova i creva, remont ili zamena kočionih klešta
        - Odzračivanje kočnica i zamena kočione tečnosti
        - Amortizeri, opruge, ramena, silent blokovi, nosači i ležajevi
        - Reglaža trapa posle svake intervencije na vešanju
        - Kontrolna probna vožnja pre preuzimanja
      signsHeading: Kada je vreme da dođete
      signs:
        - Škripanje, pištanje ili struganje pri kočenju
        - Pedala kočnice je postala meka ili propada
        - Automobil vuče u stranu pri kočenju
        - Lupanje na neravninama, neprecizan volan i neravnomerno trošenje guma
      honestHeading: Na šta ćemo Vam skrenuti pažnju
      honest: Pločice i diskovi su potrošni delovi koji rade zajedno. Nove pločice mogu da se ugrade na istrošene diskove ako su diskovi još u dozvoljenim granicama, ali će pločice trajati kraće i možda ćete ponovo doći već za pola godine. Izračunaćemo cenu obe varijante, a izbor prepustiti Vama.
    engine-gearbox:
      cta: Zakažite dijagnostiku
      name: Motor i menjač
      short: Od zamene zaptivke do popravke uz rasklapanje, uz jasan predračun.
      metaTitle: Popravka motora i menjača u Beogradu | CarLab
      metaDescription: 'Popravka motora i menjača u Beogradu: zupčasti kaiš i lanac, zaptivke, kvačilo, ulje u automatskom menjaču. Dijagnostika pre rasklapanja, predračun pre radova.'
      heroTitle: Generalna popravka nije potrebna toliko često koliko se predlaže
      heroLead: 'Pre nego što bilo šta rastavimo, proveravamo sve što možemo bez rastavljanja: kompresiju, pritisak ulja, greške i curenja.'
      priceFrom: prema rezultatima dijagnostike
      duration: od 1 dana
      bodyHeading: Kako radimo
      body: |
        Prvo proveravamo kompresiju po cilindrima, pritisak ulja, stanje svećica, greške u upravljačkim jedinicama i curenja pod pritiskom. Tek zatim odlučujemo da li motor treba otvarati.

        Kod menjača proveravamo stanje ulja i način menjanja brzina: kod automatskih menjača veliki deo „kvarova” rešava se pravilnim servisiranjem, a ne zamenom celog menjača. Ako je popravka ipak potrebna, dobijate predračun sa odvojeno iskazanim radom i delovima pre nego što bilo šta demontiramo.
      includesHeading: Šta je uključeno
      includes:
        - Merenje kompresije i pritiska ulja
        - Provera curenja pod pritiskom i uvlačenja falš vazduha
        - Zamena zupčastog kaiša ili lanca, rolera i vodene pumpe
        - Dihtunzi, semerinzi i gumice ventila
        - Kvačilo, zamajac, zamena ulja u manuelnim i automatskim menjačima
        - Detaljan predračun pre početka rastavljanja
      signsHeading: Kada je vreme da dođete
      signs:
        - Motor troši ulje između zamena
        - Lupanje, vibracije ili gubitak snage
        - Trzanje i kašnjenje pri promeni brzina
        - Dim iz auspuha koji se ranije nije pojavljivao
      honestHeading: Kada savetujemo da odustanete od popravke
      honest: Ako se cena popravke približava vrednosti automobila, to ćemo Vam reći. Ponekad je bolji savet da automobil prodate u postojećem stanju ili potražite polovan motor ili menjač, umesto da uložite novac koji pri prodaji nikada nećete povratiti.
    bodywork-painting:
      cta: Pošaljite fotografije oštećenja
      name: Limarija i farbanje
      short: Popravka posle udesa, ispravljanje geometrije karoserije i farbanje uz uklapanje nijanse.
      metaTitle: Limarija i farbanje posle udesa u Beogradu | CarLab
      metaDescription: 'Limarija u Beogradu: ravnanje na stolu, merenje geometrije, farbanje uz kompjutersko mešanje boje. Sarađujemo sa osiguranjima i pomažemo oko dokumentacije.'
      heroTitle: Da automobil ne izgleda kao da je bio udaren
      heroLead: Dobra limarsko-farbarska popravka ne primećuje se ni golim okom ni meračem debljine laka pri pregledu pre prodaje.
      priceFrom: nakon pregleda
      duration: od 3 dana
      bodyHeading: Šta obuhvata popravka
      body: |
        Prvo merimo geometriju karoserije: posle udara može doći do pomeranja i tamo gde sve izgleda neoštećeno. Upravo ta pomeranja kasnije izazivaju neravnomerno trošenje guma i zanošenje automobila u stranu. Po potrebi vozilo postavljamo na sto za ravnanje i izvlačimo karoseriju prema kontrolnim tačkama.

        Nijansu određujemo na dva načina: prema šifri boje iz dokumentacije i spektrofotometrom prema stvarnoj boji vozila, jer posle pet godina na suncu fabrička boja više nije ista kao prvog dana. Prelaz poliramo tako da se granica ne vidi ni na suncu ni pod lampom.
      includesHeading: Šta je uključeno
      includes:
        - Merenje geometrije karoserije prema kontrolnim tačkama
        - Ravnanje i izvlačenje karoserije na stolu
        - Ispravljanje limarije i zamena oštećenih delova
        - Određivanje nijanse prema šifri boje i spektrofotometrom
        - Farbanje u komori uz kontrolu temperature
        - Poliranje prelaza i montaža uz proveru zazora
      signsHeading: Kada je vreme da dođete
      signs:
        - Automobil je učestvovao u udesu, čak i ako oštećenja deluju mala
        - Neujednačeni zazori između delova karoserije
        - Automobil vuče u stranu, gume se troše po jednoj ivici
        - Želite da sredite karoseriju pre prodaje
      honestHeading: O osiguranju
      honest: Sarađujemo sa osiguravajućim kućama i pomažemo oko dokumentacije, ali ne obećavamo da će osiguranje pokriti sve. Odmah nakon pregleda objašnjavamo koja oštećenja pokriva osiguranje, a koja ne, da to ne biste saznali tek na kraju.
    pre-purchase-inspection:
      cta: Zakažite pregled
      name: Pregled pre kupovine
      short: Merač debljine laka, dizalica i dijagnostika pre nego što platite automobil.
      metaTitle: Pregled automobila pre kupovine u Beogradu | CarLab
      metaDescription: 'Pregled pre kupovine u Beogradu: merenje debljine laka, dizalica, dijagnostika, kompresija. Pisani izveštaj kao osnov za pregovore o ceni.'
      heroTitle: Ono što pokaže merač laka, prodavac Vam neće reći
      heroLead: Prefarbani delovi, tragovi varenja, vraćena kilometraža, curenja ispod vozila. Za sat vremena na dizalici to se vidi, iako u oglasu ništa od toga ne piše.
      priceFrom: od 60 €
      duration: oko 1 sat
      bodyHeading: Šta proveravamo
      body: |
        Meračem debljine laka proveravamo sve panele karoserije: prefarbane delove, git, tragove varenja i ujednačenost zazora. Zatim sledi pregled na dizalici: trap, curenja, stanje izduvnog sistema i zaštite podvozja, tragovi udaraca odozdo.

        Elektronika: očitavanje grešaka iz svih upravljačkih jedinica, uz proveru tragova vraćanja kilometraže i brisanja grešaka. Na motoru proveravamo kompresiju i curenja. Na kraju dobijate pisani izveštaj sa spiskom uočenih nedostataka i procenom troškova popravke, koji Vam može poslužiti za pregovore o ceni.
      includesHeading: Šta je uključeno
      includes:
        - Merenje debljine laka na svim panelima karoserije
        - Pregled na dizalici, provera curenja i tragova udaraca
        - Očitavanje grešaka iz svih elektronskih upravljačkih jedinica
        - Merenje kompresije po cilindrima
        - Provera znakova vraćanja kilometraže
        - Pisani izveštaj sa procenom troškova otklanjanja nedostataka
      signsHeading: Kada je pregled potreban
      signs:
        - Kupujete polovan automobil od privatnog prodavca
        - Prodavac Vas požuruje da donesete odluku
        - Automobil je iz uvoza, a istorija nije poznata
        - Cena je sumnjivo niža od tržišne
      honestHeading: Šta pregled ne može da garantuje
      honest: Iskreno ćemo Vam reći šta smo uočili, ali nijedan pregled ne otkriva sve. Skriveni kvar koji se ne pokazuje ni na dizalici ni na dijagnostici može se pojaviti kasnije. To je ograničenje samog pregleda, a ne ograda napisana sitnim slovima.
    vin-parts-inquiry:
      cta: Pošaljite upit
      name: Pronalaženje rezervnih delova
      short: Pronalazimo delove koji odgovaraju Vašem automobilu i dajemo cenu pre kupovine.
      metaTitle: Auto delovi po VIN broju u Beogradu | CarLab
      metaDescription: 'Delovi po VIN broju ili broju šasije u Beogradu: originalni i provereni zamenski delovi, provera kompatibilnosti i cena unapred. Preuzimanje u CarLabu.'
      heroTitle: Pronaći ćemo delove koji sigurno odgovaraju Vašem automobilu
      heroLead: Pošaljite VIN ili broj šasije i napišite šta Vam je potrebno. Proverićemo koji delovi odgovaraju, pronaći originalne i proverene zamenske delove i ponuditi najbolje opcije.
      priceFrom: cenu dajemo nakon pronalaska dela
      duration: saopštićemo Vam uz cenu
      bodyHeading: Kako pronalazimo odgovarajuće delove
      body: |
        Na osnovu VIN broja utvrđujemo tačnu specifikaciju vozila: motor, menjač, godište i tržište za koje je proizvedeno. Od toga zavisi koji deo odgovara, čak i kada je model isti.

        Zatim tražimo kataloški broj proizvođača i proverene zamenske delove, upoređujemo cene i rokove isporuke kod dobavljača i nudimo Vam nekoliko opcija. Vi birate, mi poručujemo, a delove možete preuzeti u našem servisu u Beogradu.

        Ako je potrebna i ugradnja, i to možete obaviti kod nas: provereno je da deo odgovara Vašem vozilu, a majstor zna šta ugrađuje.
      includesHeading: Šta je uključeno
      includes:
        - Provera kompatibilnosti prema VIN broju ili broju šasije
        - Pronalaženje originalnog broja dela
        - Izbor proverenih zamenskih delova u različitim cenovnim rangovima
        - Cena i rok nabavke pre bilo kakvog plaćanja
        - Lično preuzimanje u servisu u Beogradu
      signsHeading: Kada je pregled potreban
      signs:
        - Ne znate tačan naziv ili broj dela
        - Brinete da ćete kupiti deo koji ne odgovara Vašem vozilu
        - Potreban Vam je redak deo ili deo koji se više ne proizvodi
        - Želite da uporedite cene originalnih i zamenskih delova
      honestHeading: Kako dajemo ponudu
      honest: Cenu i rok isporuke saopštavamo pre plaćanja. Ako je deo redak i nabavlja se po porudžbini, odmah ćemo Vam reći koliko se čeka i ponuditi proverenu zamenu, ako postoji.
  en:
    indexMetaTitle: Car servicing and repairs in Belgrade | CarLab
    indexMetaDescription: Diagnostics, servicing, oil changes, brakes, suspension, engine, gearbox, accident repairs, pre-purchase checks and VIN parts matching. Scope and times.
    partsLink: Find parts for this job
    heroHeadingTemplate: '{name} in Belgrade'
    processHeading: What to expect at your visit
    ctaHeadingTemplate: '{name}: book a time that suits you'
    partsCtaHeadingTemplate: '{name}: get a price and lead time'
    ctaBody: Tell us what's wrong with your car. We'll call you back during working hours to arrange a visit.
    indexHeading: Everything your car needs, all in one workshop
    indexLead: Find out what each job includes and how long it takes. We quote after inspecting the car, before starting any work.
    specsPriceLabel: Price
    specsDurationLabel: Time needed
    diagnostics:
      cta: Book a diagnostic check
      name: Computer diagnostics
      short: We find the cause behind the fault code.
      metaTitle: Car computer diagnostics in Belgrade | CarLab
      metaDescription: Engine, suspension and electrical diagnostics in Belgrade. Free fault code reading, with the cause shown to you on the car.
      heroTitle: A fault code is a symptom, not a diagnosis. We find the cause and show you the problem on your car.
      heroLead: A scanner tells you which sensor is reporting a problem. It can't tell you whether the sensor itself is faulty or something is wrong with what it measures. That takes hands-on checks.
      priceFrom: free fault code reading
      duration: from 40 minutes
      bodyHeading: What our diagnostics involve
      body: |
        First, we talk: when did it start, under what conditions, and what work was done beforehand? Sometimes this already points to the cause. A knock only when cold and a constant knock can come from different components.

        Then we scan all control units. A fault in the ABS or body control module often explains the driver's complaint. Next come hands-on checks: on the lift, checking for play and inspecting components under load, with pressure measurements and oscilloscope testing where needed.

        Finally, we show you the cause on the car and explain it in plain English. If repairs are needed, we prepare an estimate straight away.

        What does it cost? Reading fault codes is free. Diagnostics only become chargeable if we need to dismantle a component or use a test rig. We agree the price before starting, not at the end.
      includesHeading: What's included
      includes:
        - Discussion of symptoms and service history
        - Fault code reading from all electronic control units
        - Inspection on the lift, checking for play and leaks
        - Road test with a technician if the problem occurs while driving
        - Verbal explanation of our findings and a written repair estimate
      signsHeading: When to bring your car in
      signs:
        - The check engine light or another dashboard warning light is on
        - The car jerks, misfires or struggles to start
        - Fuel consumption has increased for no obvious reason
        - There's a new noise and you can't tell where it's coming from
      honestHeading: What we can't promise
      honest: Not every fault can be found in forty minutes. Intermittent problems that appear once a week may need another visit or a full day in the workshop. We'll tell you upfront, and we won't replace parts one after another at your expense.
    servicing:
      cta: Book a service
      name: Scheduled servicing
      short: Oil, filters, fluids and checks to your engine's service schedule.
      metaTitle: Scheduled servicing and oil changes in Belgrade | CarLab
      metaDescription: "Car servicing in Belgrade: oil, filters, spark plugs, brake fluid and coolant. To the manufacturer's schedule, with all work recorded in your service record."
      heroTitle: The cheapest repair is the one you never need
      heroLead: Every engine has its own service intervals and oil specification. We check the manual for your car and follow it, rather than applying a blanket 'every 10,000 km' rule.
      priceFrom: from €90
      duration: 2–4 hours
      bodyHeading: How we work out your car's service intervals
      body: |
        Replacement intervals vary widely between engines. Belgrade's conditions, with traffic jams, dust and summer temperatures nearing 40°C, almost always qualify as severe operating conditions with shorter service intervals. We use those intervals to work out what your car actually needs at its current mileage.

        We also check the things people often remember too late: timing belt or chain condition, moisture in the brake fluid, coolant freezing point, and brake pad and disc wear measured in millimetres.
      includesHeading: What's included
      includes:
        - Engine oil and oil filter meeting your manufacturer's specifications
        - Air filter, cabin filter and spark plugs as scheduled
        - Brake fluid moisture test
        - Coolant condition and freezing point check
        - Remaining brake pad and disc thickness measured in millimetres
        - All work and mileage entered in the service record
      signsHeading: When to bring your car in
      signs:
        - You've reached the mileage interval or it's been a year since the last service
        - You've just bought the car and it has no service history
        - You're planning a long journey
        - The service reminder light has come on
      honestHeading: What we don't do
      honest: We don't replace things before they're due. If a filter is only halfway through its service life, we'll leave it alone and tell you when to come back.
    brakes-suspension:
      cta: Book a repair
      name: Brakes and suspension
      short: Everything that determines whether your car stops safely.
      metaTitle: Brake and suspension repairs in Belgrade | CarLab
      metaDescription: 'Brakes and suspension in Belgrade: pads, discs, calipers, suspension arms and wheel alignment. Measurements in millimetres, an estimate before work starts.'
      heroTitle: Here, service life is measured in millimetres
      heroLead: "You might nurse an engine to the workshop. You can't take that chance with brakes. We don't round off measurements or put off repairs: if a component is worn out, we tell you straight."
      priceFrom: from €120
      duration: from 3 hours
      bodyHeading: How we do it
      body: |
        We start with measurements: disc and pad thickness in millimetres, disc runout, and the condition of hoses and calipers. For the suspension, we check for play on the lift and on a suspension test rig, then inspect dust boots and mounts.

        After suspension repairs, we always carry out wheel alignment. Even replacing a single suspension arm changes the geometry, and incorrect alignment can wear out a set of tyres in one season.
      includesHeading: What's included
      includes:
        - Disc and pad measurements with results recorded
        - Pad, disc and hose replacement, caliper repair or replacement
        - Brake bleeding and brake fluid replacement
        - Struts, springs, suspension arms, bushes, mounts and bearings
        - Wheel alignment after any suspension work
        - Final road test before handover
      signsHeading: When to bring your car in
      signs:
        - Squeaking, squealing or grinding when braking
        - The brake pedal feels soft or sinks
        - The car pulls to one side when braking
        - Knocking over bumps, vague steering or uneven tyre wear
      honestHeading: What we'll explain upfront
      honest: Pads and discs are wear items that work together. New pads can be fitted to worn discs, but they won't last as long, and you could be back in six months. We'll price both options and leave the choice to you.
    engine-gearbox:
      cta: Book a diagnostic check
      name: Engine and gearbox
      short: From gasket replacement to strip-down repairs, with a clear estimate.
      metaTitle: Engine and gearbox repairs in Belgrade | CarLab
      metaDescription: 'Engine and gearbox repairs in Belgrade: timing belts and chains, gaskets, clutches and automatic gearbox oil changes. Diagnosis and estimate before work.'
      heroTitle: A full rebuild is needed less often than you might be told
      heroLead: 'Before taking anything apart, we check what we can from the outside: compression, oil pressure, fault codes and leaks.'
      priceFrom: quoted after diagnostics
      duration: from 1 day
      bodyHeading: How we work
      body: |
        We start with checks: compression in each cylinder, oil pressure, spark plug condition, fault codes across control modules and pressure testing for leaks. Only then do we decide whether the engine needs to be opened up.

        For gearboxes, we check the oil condition and how they shift. Many automatic gearbox problems can be resolved with proper servicing rather than replacing the unit. If repairs are needed, you get an estimate with labour and parts itemised before anything is removed.
      includesHeading: What's included
      includes:
        - Compression and oil pressure tests
        - Pressure testing for leaks and checking for intake air leaks
        - Timing belt or chain, tensioner, idler and water pump replacement
        - Gaskets, oil seals and valve stem seals
        - Clutch, flywheel and manual or automatic gearbox oil changes
        - Itemised estimate before dismantling
      signsHeading: When to bring your car in
      signs:
        - Oil level drops between changes
        - Knocking, vibration or loss of power
        - Jerky or delayed gear changes
        - Exhaust smoke that wasn't there before
      honestHeading: When we advise against repairs
      honest: If the repair cost is close to the car's value, we'll tell you. Sometimes the best advice is to sell it as it is or look for a used replacement engine or gearbox, rather than spend money on repairs that you'll never recover.
    bodywork-painting:
      cta: Send photos of the damage
      name: Bodywork and respraying
      short: Accident repairs, chassis alignment and colour-matched respraying.
      metaTitle: Accident repairs and respraying in Belgrade | CarLab
      metaDescription: 'Body repairs in Belgrade: chassis jig, alignment checks, panel repairs and colour-matched respraying. We work with insurers and help with paperwork.'
      heroTitle: So your car doesn't look accident-damaged
      heroLead: Good body repairs shouldn't stand out, whether checked by eye or with a paint thickness gauge during a pre-sale inspection.
      priceFrom: quoted after inspection
      duration: from 3 days
      bodyHeading: What the repairs involve
      body: |
        We start by measuring the body alignment. An impact can cause misalignment even where everything looks intact, leading to uneven tyre wear and the car pulling to one side. If needed, we put the car on a chassis jig and pull it back into alignment using the reference points.

        We match the colour in two ways: using the paint code in the documents and measuring the actual paint with a spectrophotometer. After five years in the sun, the original finish can differ from its specified colour. We polish the blended area so the transition is invisible in sunlight or under workshop lighting.
      includesHeading: What's included
      includes:
        - Body alignment measurements at reference points
        - Chassis jig straightening where alignment has shifted
        - Panel straightening and replacement of damaged panels
        - Colour matching by paint code and spectrophotometer
        - Respraying in a temperature-controlled spray booth
        - Polishing blended areas and reassembly with panel gap checks
      signsHeading: When to bring your car in
      signs:
        - The car has been in an accident, even if the damage looks minor
        - Uneven gaps between body panels
        - The car pulls to one side or tyres wear along one edge
        - You want to tidy up the bodywork before selling
      honestHeading: About insurance
      honest: We work with insurers and help with the paperwork, but we can't promise your insurer will cover everything. After the inspection, we explain which damage falls within the claim and which doesn't, so there are no surprises at the end.
    pre-purchase-inspection:
      cta: Book a pre-purchase inspection
      name: Pre-purchase inspection
      short: A paint thickness gauge, a lift and a diagnostic scanner, before you hand over your money.
      metaTitle: Pre-purchase car inspection in Belgrade | CarLab
      metaDescription: 'Pre-purchase checks in Belgrade: paint thickness, lift inspection, fault scans and compression tests. Written report to help you negotiate the price.'
      heroTitle: A paint gauge tells you what the seller won't
      heroLead: Resprayed panels, signs of welding, clocked mileage and leaks underneath. An hour on the lift can reveal what the advert leaves out.
      priceFrom: from €60
      duration: about 1 hour
      bodyHeading: What we check
      body: |
        We check every body panel with a paint thickness gauge, looking for resprays, filler, signs of welding and uneven panel gaps. Then the car goes on the lift to check the suspension, leaks, exhaust, underbody protection and signs of impacts underneath.

        For the electronics, we scan all control modules for fault codes, looking for signs of tampering or cleared faults. We check engine compression and leaks. At the end, you receive a written report listing our findings and estimated repair costs, which you can use to negotiate the price.
      includesHeading: What's included
      includes:
        - Paint thickness measurements on every body panel
        - Lift inspection for leaks and signs of impact damage
        - Fault code reading from all electronic control units
        - Compression test on each cylinder
        - Checks for signs of mileage tampering
        - Written report with estimated repair costs
      signsHeading: When you need it
      signs:
        - You're buying a car privately
        - The seller is rushing you into a decision
        - The car is an import with an unknown history
        - The price is suspiciously below market value
      honestHeading: What an inspection can't guarantee
      honest: We'll be honest about what we find, but no inspection catches everything. A hidden fault that doesn't show up on the lift or during diagnostics may appear later. That's a limitation of the inspection, not a disclaimer buried in the small print.
    vin-parts-inquiry:
      cta: Send an enquiry
      name: Parts sourcing
      short: We find parts that fit your car and confirm the price before you buy.
      metaTitle: Car parts sourcing by VIN in Belgrade | CarLab
      metaDescription: Parts sourcing by VIN or chassis number in Belgrade. Genuine and trusted aftermarket parts, fit checked and priced before purchase. Collect at CarLab.
      heroTitle: We'll find the right parts for your car
      heroLead: Send us your VIN or chassis number and tell us what you need. We'll check fitment, find genuine parts and trusted aftermarket alternatives, and suggest the best options.
      priceFrom: quoted once we've found the right parts
      duration: confirmed with the price
      bodyHeading: How we find the right parts
      body: |
        We use the VIN to identify your car's exact specification: engine, gearbox, year and intended market. These details determine which part fits, even on cars of the same model.

        We then look up the manufacturer's part number and trusted aftermarket alternatives, compare supplier prices and lead times, and offer you several options. You choose, we order, and you collect the parts from our workshop in Belgrade.

        If you need fitting too, we can do it here: the part has already been checked for compatibility, and the mechanic knows exactly what's being fitted.
      includesHeading: What's included
      includes:
        - Fitment check by VIN or chassis number
        - Finding the original part number
        - Sourcing trusted aftermarket alternatives at different price points
        - Price and lead time confirmed before you pay
        - Collection from our workshop in Belgrade
      signsHeading: When you need it
      signs:
        - You don't know the exact part name or number
        - You're worried about buying a part that won't fit
        - You need a rare or discontinued part
        - You want to compare prices for genuine parts and aftermarket alternatives
      honestHeading: How we quote
      honest: We confirm the price and lead time before you pay. If a rare part needs to be specially ordered, we'll tell you how long it will take and suggest a trusted alternative if one is available.
