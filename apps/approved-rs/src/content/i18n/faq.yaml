vehicle-sourcing:
  - q: Сколько занимает весь процесс — от заявки до машины у клиента?
    a: В среднем 3–14 дней — зависит от того, как быстро находится подходящий вариант на рынке.
  - q: Если найденная машина не подошла, продолжаете искать бесплатно?
    a: Да, продолжаем поиск без доплаты, пока не найдём то, что вам подходит.
  - q: Нужно ли самому ехать смотреть машину?
    a: Нет, необязательно — можем провести всю сделку без вашего присутствия. Хотите приехать и посмотреть сами — тоже без проблем.
  - q: Какая гарантия на найденный автомобиль?
    a: 'Формальной гарантии производителя, как на новый автомобиль, нет — это вторичный рынок. Ваша защита — независимая техническая проверка перед покупкой: машину осматривает эксперт, а не вы «вслепую».'
  - q: Даёте ли фото- или видеоотчёт по машине до принятия решения?
    a: Да, полный отчёт с фото по машине — до того, как вы принимаете решение о покупке.
  - q: Есть компенсация, если сроки сорваны по вашей вине?
    a: Фиксированной неустойки нет — срок сделки часто зависит не только от нас (переговоры с продавцом, растаможка). Но называем реалистичный срок сразу и не тянем время.
vehicle-import:
  - q: Чем привоз отличается от автоподбора?
    a: Автоподбор — когда вы находитесь в той же стране, что и автомобиль. Привоз — когда машина едет к вам в Сербию из Европы или Китая.
  - q: Растаможка входит в стоимость?
    a: Да, сопровождаем растаможку в Сербии и включаем её в расчёт — итоговую сумму называем до сделки.
  - q: Насколько машина «под ключ» дороже цены в объявлении?
    a: 'Разница зависит от страны, возраста автомобиля и наличия сертификата EUR1 — полную сумму мы считаем и фиксируем до старта. Для ориентира: в одном из наших кейсов BMW X1 стоил в Германии 39 860 €, а под ключ в Сербии, со всеми расходами, доставкой, растаможкой и оформлением, вышел в 46 000 €.'
  - q: Что нужно, чтобы поставить привезённую машину на учёт в Сербии?
    a: Оформить автомобиль на себя в Сербии можно только после получения ВНЖ, поэтому подбор имеет смысл начинать, когда документы уже на руках. Растаможка проходит в Суботице, после неё мы довозим машину до вашего города и сопровождаем постановку на учёт.
vehicle-buyback:
  - q: За сколько дней можно продать машину, если она ещё не растаможена или не переоформлена?
    a: Обычно 1–2 дня, даже если машина ещё не растаможена или не переоформлена на вас.
  - q: Выкупаете машину в кредите или залоге?
    a: Нет, выкупаем только автомобили без действующего кредита или залога.
  - q: Как быстро приходят деньги после осмотра?
    a: В день подписания договора — сразу после осмотра, если описание совпало.
  - q: Есть ограничения по марке, году или пробегу?
    a: Да — не рассматриваем автомобили в плохом техническом состоянии и французские марки.
  - q: Что происходит с машиной после выкупа?
    a: 'Дальше она наша забота: транспортировку и продажу организуем мы сами. Машины на сербских номерах обычно уходят на рынке в Белграде, автомобили на российских номерах мы вывозим и реализуем в России.'
vehicle-inspection:
  - q: Сколько стоит проверка и одинакова ли цена во всех странах?
    a: Стоимость отличается по странам и зависит от объёма проверки — точную цифру назовём при заявке.
  - q: Можно заказать проверку, если вас физически нет в этой стране?
    a: Да, ваше присутствие не обязательно — отчёт и решение получаете удалённо.
  - q: В каком виде отчёт?
    a: Фото и подробное текстовое описание по итогам осмотра.
  - q: Что будет, если проверка покажет, что машину брать не стоит?
    a: 'Вы получаете отчёт с фото и прямой ответ «не берите» — и теряете стоимость проверки, а не деньги за машину. Отчёт остаётся у вас, и если вы всё-таки решите брать, найденные замечания работают как аргумент в торге: на одном из наших осмотров в Сербии это снизило цену на 700 евро.'
general:
  - q: Как оплачивается работа?
    a: Оплата наличными в день сделки — вы не переводите деньги вперёд.
  - q: Можно написать не в Telegram?
    a: Да, помимо Telegram доступны звонки и WhatsApp.
  - q: Где вы находитесь?
    a: База — Белград, оттуда выезжаем по всей Сербии. В Германии, Испании, Швейцарии и других странах Европы работают наши специалисты на месте.
  - q: Консультация платная?
    a: Нет. Обсудим задачу и скажем честно, реально ли уложиться в ваш бюджет. Стоимость работы называем до старта, и потом она не меняется.
cityExpert:
  q: В каждом городе есть свой выделенный эксперт?
  a: В разных городах работают разные наши специалисты; в отдельных случаях эксперт выезжает в соседний город региона.
translations:
  en:
    vehicle-sourcing:
      - q: How long does the entire process take — from the request to the car in the client's hands?
        a: On average, it takes 3–14 days — it depends on how quickly we can find a suitable option on the market.
      - q: If the found car isn't suitable, do you keep searching for free?
        a: Yes, we continue the search at no extra cost until we find something that suits you.
      - q: Do I need to go see the car myself?
        a: No, it's not necessary — we can handle the entire transaction without your presence. If you want to come and see it yourself, that's also fine.
      - q: What warranty is there on the car found?
        a: "There is no formal manufacturer warranty like there is for a new car — this is the secondary market. Your protection comes from an independent technical inspection before purchase: the car is examined by an expert, rather than you looking at it 'blindly'."
      - q: Do you provide a photo or video report on the car before making a decision?
        a: Yes, a complete report with photos of the car is provided before you make a purchase decision.
      - q: Is there compensation if deadlines are missed due to your fault?
        a: There is no fixed penalty — the duration of the transaction often depends on factors outside our control (negotiations with the seller, customs clearance). However, we provide a realistic timeframe from the start and do not delay.
    vehicle-import:
      - q: How does importing differ from car sourcing?
        a: Car sourcing is when you are in the same country as the car. Importing is when the car is coming to you in Serbia from Europe or China.
      - q: Is customs clearance included in the price?
        a: Yes, we accompany the customs clearance in Serbia and include it in the calculation — we state the total amount before the transaction.
      - q: How much more expensive is a 'turnkey' car compared to the price in the ad?
        a: 'The difference depends on the country, the age of the car, and the presence of a EUR1 certificate — we calculate and fix the total amount before we start. For reference: in one of our cases, a BMW X1 cost €39,860 in Germany, and the total cost in Serbia, including all expenses, delivery, customs clearance, and paperwork, came to €46,000.'
      - q: What do you need to register the imported car in Serbia?
        a: You can only register the car in your name in Serbia after obtaining a residence permit, so it makes sense to start sourcing when you have the necessary documents. Customs clearance takes place in Subotica; after that, we transport the car to your city and assist with registration.
    vehicle-buyback:
      - q: How many days does it take to sell a car if it hasn't been cleared or re-registered yet?
        a: Usually 1–2 days, even if the car hasn't been cleared or re-registered in your name.
      - q: Do you buy cars that are under credit or lien?
        a: No, we only buy cars that do not have an active credit or lien.
      - q: How quickly do you receive money after the inspection?
        a: On the day of signing the contract — immediately after the inspection if the description matches.
      - q: Are there any restrictions on make, year, or mileage?
        a: Yes — we do not consider cars in poor technical condition or French brands.
      - q: What happens to the car after buyback?
        a: "After that, it's our responsibility: we arrange for transportation and sale ourselves. Cars with Serbian plates typically sell on the market in Belgrade, while cars with Russian plates are exported and sold in Russia."
    vehicle-inspection:
      - q: How much does the inspection cost, and is the price the same in all countries?
        a: The cost varies by country and depends on the extent of the inspection — we will provide the exact figure upon request.
      - q: Can I order an inspection if I’m not physically in that country?
        a: Yes, your presence is not required — you will receive the report and decision remotely.
      - q: In what format is the report?
        a: Photos and a detailed textual description based on the inspection results.
      - q: What happens if the inspection shows that the car isn't worth buying?
        a: "You will receive a report with photos and a clear recommendation of 'don't buy' — and you only lose the cost of the inspection, not the money for the car. The report remains with you, and if you still decide to proceed, the noted issues can serve as leverage for negotiation: in one of our inspections in Serbia, it reduced the price by €700."
    general:
      - q: How is payment made for your services?
        a: Payment is made in cash on the day of the transaction — you do not transfer money in advance.
      - q: Can I message you using other platforms besides Telegram?
        a: Yes, in addition to Telegram, you can also call or use WhatsApp.
      - q: Where are you located?
        a: Our base is in Belgrade, from where we operate throughout Serbia. Our specialists are on-site in Germany, Spain, Switzerland, and other countries in Europe.
      - q: Is the consultation paid?
        a: No. We will discuss your situation and honestly tell you if it's realistic to stay within your budget. We state the cost of our services upfront, and it does not change afterward.
    cityExpert:
      q: Does every city have its own designated expert?
      a: Different specialists work in various cities; in some cases, an expert may travel to a neighboring city in the region.
  sr:
    vehicle-sourcing:
      - q: Koliko traje ceo proces — od prijave do automobila kod klijenta?
        a: U proseku 3–14 dana — zavisi od brzine pronalaženja odgovarajuće opcije na tržištu.
      - q: Ako pronađeno vozilo ne odgovara, da li nastavite pretragu besplatno?
        a: Da, nastavljamo pretragu bez dodatne naplate dok ne pronađemo ono što vam odgovara.
      - q: Da li treba da idete sami da pogledate automobil?
        a: Ne, nije obavezno — možemo obaviti celu transakciju bez vašeg prisustva. Ako želite da dođete i pogledate, nema problema.
      - q: Kakva je garancija na pronađeni automobil?
        a: "Formalna garancija proizvođača, kao za nov automobil, ne postoji — ovo je sekundarno tržište. Vaša zaštita je nezavisna tehnička provera pre kupovine: auto pregleda stručnjak, a ne vi 'na slepo'."
      - q: Da li šaljete foto- ili video izveštaj o automobilu pre donošenja odluke?
        a: Da, šaljemo kompletan izveštaj s fotografijama automobila — pre nego što donesete odluku o kupovini.
      - q: Da li postoji kompenzacija ako su rokovi probijeni vašom krivicom?
        a: Nema fiksne kazne — rok transakcije često zavisi ne samo od nas (pregovori s prodavcem, carinjenje). Ali odmah nazivamo realističan rok i ne odugovlačimo.
    vehicle-import:
      - q: Šta se razlikuje između uvoza i odabira automobila?
        a: Odabir automobila — kada se nalazite u istoj zemlji kao i automobil. Uvoz — kada auto dolazi vama u Srbiju iz Evrope ili Kine.
      - q: Da li je carinjenje uključeno u cenu?
        a: Da, pratimo carinjenje u Srbiji i uključujemo ga u proračun — konačnu sumu nazivamo pre transakcije.
      - q: Koliko je automobil ‘ključ u ruke’ skuplji od cene u oglasu?
        a: 'Razlika zavisi od zemlje, starosti automobila i prisustva EUR1 sertifikata — konačnu sumu izračunavamo i fiksiramo pre početka. Za orijentaciju: u jednom od naših slučajeva BMW X1 je u Nemačkoj koštao 39.860 €, dok je ‘ključ u ruke’ u Srbiji, sa svim troškovima, isporukom, carinjenjem i dokumentacijom, iznosio 46.000 €.'
      - q: Šta je potrebno da se registrovani uvezeni automobil u Srbiji?
        a: Automobil možete registrovati na sebe u Srbiji samo nakon dobijanja boravišne dozvole, pa tako odabir ima smisla započeti kada su dokumenti već u vašim rukama. Carinjenje se obavlja u Subotici, nakon toga dovozimo auto do vašeg grada i pratimo registraciju.
    vehicle-buyback:
      - q: Za koliko dana se može prodati automobil, ako još nije carinjen ili prepisan?
        a: Obično 1–2 dana, čak i ako automobil još nije carinjen ili prepisan na vas.
      - q: Otkupljujete li automobile koji su na kreditu ili u zalogu?
        a: Ne, otkupljujemo samo automobile bez važećeg kredita ili založnog prava.
      - q: Koliko brzo dolazi novac nakon provere?
        a: Na dan potpisivanja ugovora — odmah nakon provere, ako se opis poklapa.
      - q: Da li postoje ograničenja po marki, godini ili pređenoj kilometraži?
        a: Da — ne razmatramo automobile u lošem tehničkom stanju i francuske marke.
      - q: Šta se dešava s automobilom nakon otkupa?
        a: 'Dalje, to je naša briga: transport i prodaju organizujemo sami. Automobili sa srpskim registarskim tablicama obično se prodaju na tržištu u Beogradu, dok automobile sa ruskim tablicama izvozimo i prodajemo u Rusiji.'
    vehicle-inspection:
      - q: Koliko košta provera i da li je cena ista u svim zemljama?
        a: Cena se razlikuje po zemljama i zavisi od obima provere — tačan iznos ćemo navesti prilikom prijavljivanja.
      - q: Da li možete naručiti provere ako fizički niste prisutni u toj zemlji?
        a: Da, vaše prisustvo nije obavezno — izveštaj i odluku dobijate na daljinu.
      - q: U kakvom obliku je izveštaj?
        a: Fotografije i detaljan tekstualni opis po rezultatima provere.
      - q: Šta će se dogoditi ako provera pokaže da se automobil ne isplati kupiti?
        a: 'Dobijate izveštaj s fotografijama i jasan odgovor ‘ne kupujte’ — i gubite trošak provere, a ne novac za auto. Izveštaj ostaje kod vas i ako ipak odlučite da kupite, uočene nepravilnosti mogu poslužiti kao argument u pregovorima: u jednom od naših pregleda u Srbiji to je smanjilo cenu za 700 evra.'
    general:
      - q: Kako se plaća rad?
        a: Plaćanje se vrši gotovinom na dan transakcije — ne uplaćujete novac unapred.
      - q: Da li može da se piše i mimo Telegrama?
        a: Da, osim Telegrama dostupni su pozivi i WhatsApp.
      - q: Gde se nalazite?
        a: Baza — Beograd, odakle odlazimo po celoj Srbiji. U Nemačkoj, Španiji, Švajcarskoj i drugim evropskim zemljama rade naši stručnjaci na terenu.
      - q: Da li je konsultacija plaćena?
        a: Ne. Razgovaraćemo o zadatku i iskreno reći da li je moguće uklopiti se u vaš budžet. Trošak rada navodimo pre početka, i nakon toga se ne menja.
    cityExpert:
      q: Da li u svakom gradu postoji svoj ekskluzivni ekspert?
      a: U različitim gradovima rade različiti naši stručnjaci; u posebnim slučajevima ekspert ide u obližnji grad regiona.
  es:
    vehicle-sourcing:
      - q: ¿Cuánto tiempo lleva todo el proceso, desde la solicitud hasta que el coche llega al cliente?
        a: En promedio de 3 a 14 días, depende de la rapidez con la que se encuentre una opción adecuada en el mercado.
      - q: Si el coche encontrado no es adecuado, ¿siguen buscando de forma gratuita?
        a: Sí, seguimos buscando sin coste adicional hasta que encontremos algo que te convenga.
      - q: ¿Es necesario ir a ver el coche en persona?
        a: No, no es obligatorio; podemos llevar a cabo toda la transacción sin tu presencia. Si prefieres venir a verlo tú mismo, también es posible.
      - q: ¿Qué garantía hay sobre el coche encontrado?
        a: "No hay una garantía formal del fabricante como en un coche nuevo, ya que es un mercado secundario. Tu protección es una verificación técnica independiente antes de la compra: un experto revisa el coche, no lo haces tú 'a ciegas'."
      - q: ¿Proporcionan un informe fotográfico o en video del coche antes de tomar una decisión?
        a: Sí, se proporciona un informe completo con fotos del coche, antes de que tomes la decisión de compra.
      - q: ¿Hay alguna compensación si se incumplen los plazos por su culpa?
        a: No hay una penalización fija; el plazo de la transacción a menudo depende de factores que no solo involucran a nosotros (negociaciones con el vendedor, despacho de aduanas). Pero establecemos un plazo realista desde el principio y no hacemos esperar.
    vehicle-import:
      - q: ¿Qué diferencia hay entre la importación y la búsqueda de coches?
        a: La búsqueda de coches es cuando te encuentras en el mismo país que el coche. La importación es cuando el coche viene a ti desde Europa o China.
      - q: ¿Está incluida la aduana en el precio?
        a: Sí, acompañamos el proceso de aduana en Serbia y lo incluimos en el cálculo; te damos la suma final antes de la transacción.
      - q: ¿Cuánto más cuesta el coche 'listo para usar' en comparación con el precio en el anuncio?
        a: 'La diferencia depende del país, la antigüedad del coche y la disponibilidad del certificado EUR1; calculamos y fijamos la suma total antes de comenzar. Para que te hagas una idea: en uno de nuestros casos, un BMW X1 costaba en Alemania 39,860 €, y listo para usar en Serbia, con todos los gastos, entrega, aduana y documentación, salió por 46,000 €.'
      - q: ¿Qué se necesita para registrar el coche importado en Serbia?
        a: Puedes registrar el coche a tu nombre en Serbia solo después de obtener el permiso de residencia, por lo que tiene sentido comenzar la búsqueda cuando ya tienes los documentos en mano. La aduana se realiza en Subotica, después de la cual llevamos el coche a tu ciudad y te ayudamos a registrarlo.
    vehicle-buyback:
      - q: ¿Cuántos días se necesita para vender un coche, si aún no está registrado o no ha pasado aduana?
        a: Normalmente 1-2 días, incluso si el coche aún no ha pasado por aduana o no está registrado a tu nombre.
      - q: ¿Compran coches que tienen crédito o están embargados?
        a: No, solo compramos automóviles sin ningún crédito o embargo vigente.
      - q: ¿Cuán rápido llegan los fondos después de la inspección?
        a: El mismo día de la firma del contrato; inmediatamente después de la inspección, si la descripción coincidió.
      - q: ¿Hay limitaciones en marcas, años o kilometraje?
        a: Sí, no consideramos coches en mal estado técnico y marcas francesas.
      - q: ¿Qué pasa con el coche después de la compra?
        a: 'Después, es nuestra responsabilidad: organizamos el transporte y la venta. Los coches con matrículas serbias normalmente se venden en el mercado de Belgrado, mientras que los coches con matrículas rusas los exportamos y realizamos en Rusia.'
    vehicle-inspection:
      - q: ¿Cuánto cuesta la verificación y es el precio el mismo en todos los países?
        a: El costo varía según el país y depende del alcance de la verificación; te daremos una cifra exacta al hacer la solicitud.
      - q: ¿Se puede solicitar la verificación si no estás físicamente en ese país?
        a: Sí, tu presencia no es necesaria; recibirás el informe y la decisión de forma remota.
      - q: ¿En qué formato es el informe?
        a: Fotos y una descripción detallada por escrito de los resultados de la inspección.
      - q: ¿Qué pasará si la verificación indica que no deberías comprar el coche?
        a: "Recibirás un informe con fotos y un consejo directo 'no compres' - y perderás el costo de la verificación, no el dinero por el coche. El informe te queda a ti, y si decides comprarlo, los comentarios encontrados sirven como argumento en las negociaciones: en una de nuestras inspecciones en Serbia, esto redujo el precio en 700 euros."
    general:
      - q: ¿Cómo se paga por el trabajo?
        a: El pago se realiza en efectivo el día de la transacción; no necesitas adelantar dinero.
      - q: ¿Se puede escribir por otros medios que no sean Telegram?
        a: Sí, además de Telegram, están disponibles llamadas y WhatsApp.
      - q: ¿Dónde están ubicados?
        a: La base está en Belgrado, desde ahí nos desplazamos por toda Serbia. Nuestros especialistas trabajan localmente en Alemania, España, Suiza y otros países de Europa.
      - q: ¿La consulta tiene costo?
        a: No. Discutiremos la cuestión y te diremos sinceramente si es posible ajustarse a tu presupuesto. El costo del trabajo se establece antes del inicio y luego no cambia.
    cityExpert:
      q: ¿Hay un experto asignado en cada ciudad?
      a: En diferentes ciudades trabajan diferentes especialistas nuestros; en algunos casos, el experto se desplaza a una ciudad vecina de la región.
  de:
    vehicle-sourcing:
      - q: Wie lange dauert der gesamte Prozess – von der Anfrage bis zum Fahrzeug beim Kunden?
        a: Im Durchschnitt 3–14 Tage – es hängt davon ab, wie schnell eine passende Option auf dem Markt gefunden wird.
      - q: Wenn das gefundene Auto nicht passt, suchen Sie kostenlos weiter?
        a: Ja, wir setzen die Suche ohne zusätzliche Kosten fort, bis wir das passende Fahrzeug für Sie finden.
      - q: Muss ich selbst zur Fahrzeugbesichtigung fahren?
        a: Nein, das ist nicht notwendig – wir können den gesamten Prozess ohne Ihre Anwesenheit durchführen. Wenn Sie selbst kommen und es ansehen möchten, ist das auch kein Problem.
      - q: Gibt es eine Garantie auf das gefundene Fahrzeug?
        a: "Eine formelle Herstellergarantie wie bei einem Neuwagen gibt es nicht – das ist der Gebrauchtwagenmarkt. Ihr Schutz ist die unabhängige technische Prüfung vor dem Kauf: Das Auto wird von einem Experten begutachtet und nicht von Ihnen 'blind'."
      - q: Gibt es einen Foto- oder Videobericht über das Auto vor der Kaufentscheidung?
        a: Ja, Sie erhalten einen vollständigen Bericht mit Fotos über das Auto, bevor Sie Ihre Kaufentscheidung treffen.
      - q: Gibt es eine Entschädigung, wenn die Fristen durch Ihr Verschulden nicht eingehalten werden?
        a: Es gibt keine feste Vertragsstrafe – der Zeitraum hängt oft nicht nur von uns ab (Verhandlungen mit dem Verkäufer, Zollabwicklung). Aber wir nennen gleich zu Beginn einen realistischen Zeitraum und ziehen die Sache nicht in die Länge.
    vehicle-import:
      - q: Was ist der Unterschied zwischen Import und Fahrzeugsuche?
        a: Fahrzeugsuche bedeutet, dass Sie sich im selben Land wie das Fahrzeug befinden. Import bedeutet, dass das Auto aus Europa oder China nach Serbien kommt.
      - q: Ist die Zollabwicklung im Preis enthalten?
        a: Ja, wir begleiten die Zollabwicklung in Serbien und beziehen sie in die Berechnung mit ein – den endgültigen Betrag nennen wir vor dem Abschluss des Deals.
      - q: Wie viel teurer ist das Auto „schlüsselfertig“ im Vergleich zur Anzeige?
        a: 'Der Unterschied hängt vom Land, dem Alter des Fahrzeugs und dem Vorhandensein eines EUR1-Zertifikats ab – den Gesamtbetrag berechnen wir und fixieren ihn vor dem Start. Zur Orientierung: In einem unserer Fälle kostete ein BMW X1 in Deutschland 39.860 €, während es schlüsselfertig in Serbien mit allen Ausgaben, Lieferung, Zollabwicklung und Formalitäten 46.000 € betrug.'
      - q: Was braucht man, um das importierte Auto in Serbien zuzulassen?
        a: Das Auto kann nur nach Erhalt des Aufenthaltstitels auf Ihren Namen in Serbien registriert werden, deshalb macht es Sinn, die Suche zu beginnen, wenn die Dokumente bereits vorliegen. Die Zollabwicklung erfolgt in Subotica, danach bringen wir das Auto in Ihre Stadt und begleiten die Zulassung.
    vehicle-buyback:
      - q: Wie viele Tage braucht man, um das Auto zu verkaufen, wenn es noch nicht verzollt oder umgeschrieben ist?
        a: In der Regel 1–2 Tage, selbst wenn das Auto noch nicht verzollt oder auf Sie umgeschrieben ist.
      - q: Kaufen Sie Autos, die sich noch in der Finanzierung oder im Pfand befinden?
        a: Nein, wir kaufen nur Fahrzeuge ohne laufende Finanzierung oder Pfand.
      - q: Wie schnell kommt das Geld nach der Besichtigung?
        a: Am Tag der Vertragsunterzeichnung – sofort nach der Besichtigung, wenn die Beschreibung übereinstimmt.
      - q: Gibt es Einschränkungen hinsichtlich Marke, Baujahr oder Kilometerstand?
        a: Ja, wir betrachten keine Fahrzeuge in schlechtem technischen Zustand sowie französische Marken.
      - q: Was passiert mit dem Auto nach dem Kauf?
        a: 'Danach kümmern wir uns darum: Wir organisieren den Transport und den Verkauf selbst. Autos mit serbischen Nummern werden normalerweise auf dem Markt in Belgrad verkauft, während Fahrzeuge mit russischen Nummern wir exportieren und in Russland verkaufen.'
    vehicle-inspection:
      - q: Wie viel kostet eine Inspektion und ist der Preis in allen Ländern gleich?
        a: Die Kosten variieren je nach Land und Umfang der Inspektion – den genauen Betrag nennen wir bei der Anfrage.
      - q: Kann man eine Inspektion beauftragen, auch wenn man physisch nicht in diesem Land ist?
        a: Ja, Ihre Anwesenheit ist nicht erforderlich – Sie erhalten den Bericht und die Entscheidung remote.
      - q: In welcher Form erfolgt der Bericht?
        a: Fotos und eine detaillierte schriftliche Beschreibung nach der Besichtigung.
      - q: Was passiert, wenn die Inspektion zeigt, dass das Auto nicht gekauft werden sollte?
        a: "Sie erhalten den Bericht mit Fotos und eine klare Empfehlung 'nicht kaufen' – und verlieren nur die Kosten der Inspektion, nicht das Geld für das Auto. Der Bericht bleibt bei Ihnen, und wenn Sie sich trotzdem entscheiden zu kaufen, können die gefundenen Mängel als Argument in den Verhandlungen verwendet werden: In einer unserer Inspektionen in Serbien reduzierte dies den Preis um 700 Euro."
    general:
      - q: Wie wird die Arbeit bezahlt?
        a: Die Zahlung erfolgt bar am Tag des Abschlusses – Sie überweisen kein Geld im Voraus.
      - q: Kann ich auch anders als über Telegram schreiben?
        a: Ja, neben Telegram sind Anrufe und WhatsApp verfügbar.
      - q: Wo sind Sie angesiedelt?
        a: Die Basis ist in Belgrad, von dort aus fahren wir in ganz Serbien. In Deutschland, Spanien, der Schweiz und anderen europäischen Ländern sind unsere Fachleute vor Ort tätig.
      - q: Ist die Beratung kostenpflichtig?
        a: Nein. Wir besprechen die Aufgabe und sagen ehrlich, ob Sie in Ihr Budget passen können. Die Kosten für die Arbeit nennen wir vor dem Start, und danach ändern sie sich nicht.
    cityExpert:
      q: Gibt es in jeder Stadt einen eigenen Experten?
      a: In verschiedenen Städten arbeiten unterschiedliche Spezialisten von uns; in bestimmten Fällen fährt ein Experte in eine benachbarte Stadt der Region.
