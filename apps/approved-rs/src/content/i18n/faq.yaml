vehicle-sourcing:
  - q: Сколько занимает весь процесс — от заявки до машины у клиента?
    a: В среднем 3–14 дней — зависит от того, как быстро находится подходящий вариант на рынке.
  - q: Если найденная машина не подошла, продолжаете искать бесплатно?
    a: Да, продолжаем поиск без доплаты, пока не найдём то, что вам подходит.
  - q: Нужно ли самому ехать смотреть машину?
    a: Нет, необязательно — можем провести всю сделку без вашего присутствия. Хотите приехать и посмотреть сами — тоже без проблем.
  - q: Какая гарантия на найденный автомобиль?
    a: 'Формальной гарантии производителя, как на новый автомобиль, нет — это вторичный рынок. Ваша защита — независимая техническая проверка перед покупкой: машину осматривает эксперт, а не вы «вслепую».'
  - q: Даёте ли фото- или видеоотчёт по машине до принятия решения?
    a: Да, полный отчёт с фото по машине — до того, как вы принимаете решение о покупке.
  - q: Есть компенсация, если сроки сорваны по вашей вине?
    a: Фиксированной неустойки нет — срок сделки часто зависит не только от нас (переговоры с продавцом, оформление документов). Но называем реалистичный срок сразу и не тянем время.
vehicle-import:
  - q: Чем привоз отличается от автоподбора?
    a: Автоподбор — когда вы находитесь в той же стране, что и автомобиль. Привоз — когда машина едет к вам в Сербию из Европы или Китая.
  - q: Растаможка входит в стоимость?
    a: Да, сопровождаем растаможку в Сербии и включаем её в расчёт — итоговую сумму называем до сделки.
  - q: Насколько машина «под ключ» дороже цены в объявлении?
    a: 'Разница зависит от страны, возраста автомобиля и наличия сертификата EUR1 — полную сумму мы считаем и фиксируем до старта. Для ориентира: в одной из наших сделок BMW X1 стоил в Германии 39 860 €, а под ключ в Сербии, со всеми расходами, доставкой, растаможкой и оформлением, вышел в 46 000 €.'
  - q: Что нужно, чтобы поставить привезённую машину на учёт в Сербии?
    a: Оформить автомобиль на себя в Сербии можно только после получения ВНЖ, поэтому подбор имеет смысл начинать, когда документы уже на руках. Растаможка проходит в Суботице, после неё мы довозим машину до вашего города и сопровождаем постановку на учёт.
vehicle-buyback:
  - q: За сколько дней можно продать машину, если она ещё не растаможена или не переоформлена?
    a: Обычно 1–2 дня, даже если машина ещё не растаможена или не переоформлена на вас.
  - q: Выкупаете машину в кредите или залоге?
    a: Нет, выкупаем только автомобили без действующего кредита или залога.
  - q: Как быстро приходят деньги после осмотра?
    a: В день подписания договора — сразу после осмотра, если описание совпало.
  - q: Есть ограничения по марке, году или пробегу?
    a: 'Да — не рассматриваем автомобили в плохом техническом состоянии и французские марки. Это ограничение только на выкуп: подобрать вам Peugeot или Renault мы по-прежнему можем.'
  - q: Что происходит с машиной после выкупа?
    a: 'Дальше она наша забота: транспортировку и продажу организуем мы сами. Машины на сербских номерах обычно уходят на рынке в Белграде, автомобили на российских номерах мы вывозим и реализуем в России.'
vehicle-inspection:
  - q: Сколько стоит проверка и одинакова ли цена во всех странах?
    a: Стоимость отличается по странам и зависит от объёма проверки — точную цифру назовём при заявке.
  - q: Можно заказать проверку, если вас физически нет в этой стране?
    a: Да, ваше присутствие не обязательно — отчёт и решение получаете удалённо.
  - q: В каком виде отчёт?
    a: Фото и подробное текстовое описание по итогам осмотра.
  - q: Что будет, если проверка покажет, что машину брать не стоит?
    a: 'Вы получаете отчёт с фото и прямой ответ «не берите» — и теряете стоимость проверки, а не деньги за машину. Отчёт остаётся у вас, и если вы всё-таки решите брать, найденные замечания работают как аргумент в торге: на одном из наших осмотров в Сербии это снизило цену на 700 евро.'
general:
  - q: Как оплачивается работа?
    a: Часть суммы — предоплата, остальное по факту. Размер предоплаты зависит от услуги и суммы сделки — называем его до начала работ, чтобы условия были понятны обеим сторонам.
  - q: Можно написать не в Telegram?
    a: Да, помимо Telegram доступны звонки и WhatsApp.
  - q: Где вы находитесь?
    a: База — Белград, оттуда выезжаем по всей Сербии. В Германии, Испании, Швейцарии и других странах Европы работают наши специалисты на месте.
  - q: Консультация платная?
    a: Нет. Обсудим задачу и скажем честно, реально ли уложиться в ваш бюджет. Стоимость работы называем до старта, и потом она не меняется.
cityExpert:
  q: В каждом городе есть свой выделенный эксперт?
  a: В разных городах работают разные наши специалисты; в отдельных случаях эксперт выезжает в соседний город региона.
translations:
  en:
    vehicle-sourcing:
      - q: How long does the entire process take - from the application to the car in the client's hands?
        a: On average, it takes 3 to 14 days - it depends on how quickly a suitable option is found in the market.
      - q: If the found car doesn't work out, do you keep searching for free?
        a: Yes, we continue the search at no additional cost until we find something that suits you.
      - q: Do I need to go see the car myself?
        a: No, it's not necessary - we can handle the entire transaction without your presence. If you want to come and see it yourself, that's also fine.
      - q: What warranty is there on the car found?
        a: 'There is no formal warranty like with a new car - this is the secondary market. Your protection comes from an independent technical inspection before purchase: the car is examined by an expert, not you blindly.'
      - q: Do you provide photo or video reports on the car before a decision is made?
        a: Yes, we provide a full report with photos of the car before you make a purchase decision.
      - q: Is there compensation if the deadlines are missed due to your fault?
        a: There is no fixed penalty - the transaction timeline often depends not only on us (negotiating with the seller, handling documents). However, we state a realistic timeframe upfront and do not delay.
    vehicle-import:
      - q: How does importing differ from car sourcing?
        a: Car sourcing is when you are in the same country as the car. Importing is when the car comes to you in Serbia from Europe or China.
      - q: Is customs clearance included in the price?
        a: Yes, we assist with customs clearance in Serbia and include it in the calculation - we provide the total amount before the transaction.
      - q: How much more is a 'turnkey' car compared to the advertised price?
        a: "The difference depends on the country, the vehicle's age, and whether it has a EUR1 certificate - we calculate and fix the total amount before starting. For reference: in one of our deals, a BMW X1 cost 39,860 € in Germany, and the turnkey price in Serbia, including all expenses, delivery, customs clearance, and paperwork, was 46,000 €."
      - q: What is needed to register the imported car in Serbia?
        a: You can register the car in your name in Serbia only after obtaining a residence permit, so it's best to start sourcing when the documents are already in hand. Customs clearance is done in Subotica, after which we bring the car to your city and assist with registration.
    vehicle-buyback:
      - q: How many days does it take to sell a car if it's not yet cleared or re-registered?
        a: Usually 1 to 2 days, even if the car has not been cleared or re-registered in your name.
      - q: Do you buy cars that are under credit or lien?
        a: No, we only buy cars that are free of any active credit or lien.
      - q: How quickly do you receive payment after the inspection?
        a: On the day the contract is signed - immediately after the inspection, if the description matches.
      - q: Are there any limitations on brand, year, or mileage?
        a: Yes - we do not consider cars in poor technical condition and French brands. This restriction only applies to buyback; we can still source Peugeot or Renault for you.
      - q: What happens to the car after the buyback?
        a: 'Afterwards, it’s our responsibility: we manage transport and sale. Cars with Serbian plates usually sell in the Belgrade market, while cars with Russian plates are transported and sold in Russia.'
    vehicle-inspection:
      - q: How much does an inspection cost, and is the price the same in all countries?
        a: The price varies by country and depends on the scope of the inspection - we will provide an exact figure upon request.
      - q: Can you order an inspection if you're not physically in that country?
        a: Yes, your presence is not required - you receive the report and decision remotely.
      - q: What format is the report in?
        a: Photos and a detailed written description following the inspection.
      - q: What happens if the inspection shows that the car is not worth buying?
        a: "You receive a report with photos and a clear 'don't buy' recommendation - and you only lose the cost of the inspection, not the money for the car. The report remains with you, and if you decide to go ahead, any identified issues can serve as bargaining chips: during one of our inspections in Serbia, it helped reduce the price by 700 euros."
    general:
      - q: How is the work paid for?
        a: Part of the amount is an advance, the rest is paid upon completion. The advance amount depends on the service and transaction sum - we state it before starting the work to ensure both parties understand the terms.
      - q: Can I contact you outside of Telegram?
        a: Yes, besides Telegram, you can also call or use WhatsApp.
      - q: Where are you located?
        a: Our base is in Belgrade, from where we operate throughout Serbia. Our specialists are on-site in Germany, Spain, Switzerland, and other European countries.
      - q: Is the consultation paid?
        a: No. We will discuss the task and honestly inform you whether it's feasible within your budget. We state the cost of work before starting, and it does not change afterwards.
    cityExpert:
      q: Is there a dedicated expert in each city?
      a: Different specialists work in different cities; in some cases, an expert may travel to a neighboring city in the region.
  sr:
    vehicle-sourcing:
      - q: Koliko traje ceo proces - od prijave do automobila kod klijenta?
        a: U proseku 3–14 dana - zavisi od toga koliko brzo se pronađe odgovarajući automobil na tržištu.
      - q: Ako pronađeni automobil ne odgovara, nastavite sa besplatnom potragom?
        a: Da, nastavljamo potragu bez dodatne naknade, dok ne pronađemo ono što vam odgovara.
      - q: Da li je potrebno da sami idete da pogledate automobil?
        a: Ne, nije obavezno - možemo realizovati celu transakciju bez vašeg prisustva. Ako želite da dođete i pogledate sami - takođe nema problema.
      - q: Kakva je garancija na pronađeni automobil?
        a: "Formalna garancija proizvođača, kao za novi automobil, ne postoji - ovo je sekundarno tržište. Vaša zaštita je nezavisna tehnička provera pre kupovine: automobil pregleda stručnjak, a ne vi 'naslepo'."
      - q: Da li dajete foto- ili video izveštaj o automobilu pre donošenja odluke?
        a: Da, dobijate kompletan izveštaj sa fotografijama o automobilu - pre nego što donesete odluku o kupovini.
      - q: Da li postoji kompenzacija ako se rokovi prekrše vašom krivicom?
        a: Ne postoji fiksna kazna - rok transakcije često zavisi ne samo od nas (pregovaranje sa prodavcem, sređivanje dokumenata). Ali odmah pružamo realističan rok i ne odugovlačimo.
    vehicle-import:
      - q: Po čemu se uvoz razlikuje od automobilske pretrage?
        a: Automobilska pretraga - kada se nalazite u istoj zemlji kao i automobil. Uvoz - kada automobil ide ka vama u Srbiju iz Evrope ili Kine.
      - q: Da li je carina uključena u cenu?
        a: Da, podržavamo carinjenje u Srbiji i uključujemo je u obračun - konačnu sumu saopštavamo pre transakcije.
      - q: Koliko je automobil 'ključ u ruke' skuplji od cene u oglasa?
        a: "Razlika zavisi od zemlje, starosti automobila i postojanja EUR1 sertifikata - kompletnu sumu izračunavamo i fiksiramo pre početka. Za orijentaciju: u jednoj od naših transakcija BMW X1 je u Nemačkoj koštao 39 860 €, a 'ključ u ruke' u Srbiji, sa svim troškovima, dostavom, carinjenjem i papirološkim formalnostima, iznosio je 46 000 €."
      - q: Šta je potrebno za registraciju dovučenog automobila u Srbiji?
        a: Automobil možete registrovati na sebe u Srbiji samo nakon dobijanja boravišne dozvole, stoga je smisleno započeti pretragu kada su dokumenti već u vašim rukama. Carinjenje se obavlja u Subotici, nakon toga dostavljamo automobil do vašeg grada i pratimo proces registracije.
    vehicle-buyback:
      - q: Za koliko dana može biti prodat automobil ako još nije carinjen ili preformalan?
        a: Obično 1–2 dana, čak i ako automobil još nije carinjen ili preformalan na vas.
      - q: Da li otkupljujete automobile koji su pod kreditom ili založeni?
        a: Ne, otkupljujemo samo automobile bez aktivnog kredita ili založnog prava.
      - q: Kako brzo dolaze novci nakon pregleda?
        a: Na dan potpisivanja ugovora - odmah nakon pregleda, ako se opisi poklapaju.
      - q: Da li postoje ograničenja po marki, godini ili pređenim kilometrima?
        a: 'Da - ne razmatramo automobile u lošem tehničkom stanju i francuske marke. Ovo ograničenje se odnosi samo na otkup: možemo vam i dalje pronaći Peugeot ili Renault.'
      - q: Šta se dešava sa automobilom nakon otkupa?
        a: 'Dalje je to naša briga: transport i prodaju organizujemo mi. Automobili sa srpskim registarskim tablicama obično se prodaju na tržištu u Beogradu, dok automobile sa ruskim registarskim tablicama iznosimo i prodajemo u Rusiji.'
    vehicle-inspection:
      - q: Koliko košta provera i da li je cena ista u svim zemljama?
        a: Cena se razlikuje po zemljama i zavisi od obima provere - tačnu cifru ćemo naznačiti prilikom prijave.
      - q: Može li se naručiti provera ako vas fizički nema u toj zemlji?
        a: Da, vaše prisustvo nije obavezno - izveštaj i odluku dobijate na daljinu.
      - q: U kom obliku dobijate izveštaj?
        a: Fotografije i detaljan tekstualni opis na osnovu pregleda.
      - q: Šta će se desiti ako provera pokaže da automobil ne valja?
        a: "Dobijate izveštaj sa fotografijama i direktan odgovor 'ne kupujte' - gubite samo cenu provere, a ne novac za automobil. Izveštaj ostaje kod vas, i ako se ipak odlučite da kupite, uočene nepravilnosti mogu poslužiti kao argument u pregovorima: u jednoj od naših prozora u Srbiji cena je smanjena za 700 evra."
    general:
      - q: Kako se plaća usluga?
        a: Deo iznosa - avans, ostatak nakon što je posao obavljen. Iznos avansa zavisi od usluge i količine transakcije - navodimo ga pre početka radova, da bi uslovi bili jasni za obe strane.
      - q: Može li se pisati ne putem Telegrama?
        a: Da, osim Telegrama dostupni su pozivi i WhatsApp.
      - q: Gde se nalazite?
        a: Baza - Beograd, odakle odlazimo širom Srbije. U Nemačkoj, Španiji, Švajcarskoj i drugim evropskim zemljama rade naši stručnjaci na terenu.
      - q: Da li je konsultacija plaćena?
        a: Ne. Razgovaraćemo o problemu i iskreno reći da li se može uklopiti u vaš budžet. Cena usluge se navodi pre početka i kasnije se ne menja.
    cityExpert:
      q: Da li ima svog eksperty u svakom gradu?
      a: U različitim gradovima rade različiti naši stručnjaci; u posebnim slučajevima ekspert odlazi u obližnji grad regiona.
  es:
    vehicle-sourcing:
      - q: ¿Cuánto tiempo lleva todo el proceso, desde la solicitud hasta que el coche está con el cliente?
        a: En promedio, de 3 a 14 días, depende de cuán rápido encontremos una opción adecuada en el mercado.
      - q: Si el coche encontrado no es adecuado, ¿siguen buscando gratis?
        a: Sí, continuamos la búsqueda sin costo adicional hasta que encontremos lo que le conviene.
      - q: ¿Es necesario que uno mismo vaya a ver el coche?
        a: No, no es necesario, podemos llevar a cabo toda la transacción sin su presencia. Si desea venir a ver el coche, no hay problema.
      - q: ¿Qué garantía tiene el coche encontrado?
        a: 'No hay una garantía formal del fabricante como con un coche nuevo, ya que es un mercado secundario. Su protección es la verificación técnica independiente antes de la compra: el coche es inspeccionado por un experto, no por usted a ciegas.'
      - q: ¿Ofrecen un informe con fotos o videos del coche antes de tomar una decisión?
        a: Sí, proporcionamos un informe completo con fotos del coche antes de que tome una decisión de compra.
      - q: ¿Hay compensación si se incumplen los plazos por su culpa?
        a: No hay una penalización fija, ya que los plazos a menudo dependen de factores ajenos a nosotros (negociaciones con el vendedor, formalidades). Pero ofrecemos un plazo realista desde el principio y no demoramos.
    vehicle-import:
      - q: ¿En qué se diferencia la importación del asesoramiento de coche?
        a: Asesoramiento de coche significa que usted se encuentra en el mismo país que el coche. La importación se refiere a cuando el coche viene a Serbia desde Europa o China.
      - q: ¿La tramitación de aduanas está incluida en el precio?
        a: Sí, gestionamos la tramitación de aduanas en Serbia y la incluimos en el cálculo; le informamos del total antes de la transacción.
      - q: ¿Cuánto más caro es el coche ‘listo para usar’ respecto al precio en el anuncio?
        a: 'La diferencia depende del país, la edad del coche y la disponibilidad del certificado EUR1; calculamos la suma total y la fijamos antes de empezar. Para orientarse: en una de nuestras transacciones, un BMW X1 costaba en Alemania 39 860 €, y listo para usar en Serbia, con todos los gastos, entrega, aduanas y formalidades, salió por 46 000 €.'
      - q: ¿Qué se necesita para matricular un coche traído en Serbia?
        a: Puede matricular el coche a su nombre en Serbia solo después de obtener el permiso de residencia, por lo que es mejor comenzar el asesoramiento cuando ya tenga la documentación. La tramitación se realiza en Subotica, después de la cual llevamos el coche a su ciudad y ayudamos con la matriculación.
    vehicle-buyback:
      - q: ¿Cuántos días tardan en vender el coche si aún no está matriculado o re-registrado?
        a: Normalmente de 1 a 2 días, incluso si el coche aún no está matriculado o re-registrado a su nombre.
      - q: ¿Compran coches con crédito o embargo?
        a: No, solo compramos coches que no tengan un crédito activo o embargo.
      - q: ¿Cuánto tarda en llegar el dinero después de la inspección?
        a: El mismo día de la firma del contrato, inmediatamente después de la inspección si la descripción coincide.
      - q: ¿Hay restricciones en cuanto a marcas, año o kilometraje?
        a: Sí, no consideramos coches en mal estado técnico ni marcas francesas. Esta restricción es solo para la compra; todavía podemos ayudarle a seleccionar un Peugeot o un Renault.
      - q: ¿Qué sucede con el coche después de la compra?
        a: 'A partir de ahí, nosotros nos encargamos: organizamos el transporte y la venta. Los coches con matrícula serbia generalmente se venden en el mercado de Belgrado; los coches con matrícula rusa los exportamos y vendemos en Rusia.'
    vehicle-inspection:
      - q: ¿Cuánto cuesta la inspección y es el precio el mismo en todos los países?
        a: El costo varía según el país y depende del alcance de la inspección; le daremos la cifra exacta al presentar la solicitud.
      - q: ¿Se puede solicitar una inspección si físicamente no estás en ese país?
        a: Sí, su presencia no es obligatoria; recibirá el informe y la decisión a distancia.
      - q: ¿En qué formato se entrega el informe?
        a: Con fotos y una descripción detallada por escrito tras la inspección.
      - q: ¿Qué sucede si la inspección muestra que no vale la pena comprar el coche?
        a: 'Recibirá un informe con fotos y una respuesta clara que dice ‘no compre’; perderá el costo de la inspección, no el dinero por el coche. El informe se queda con usted, y si decide comprarlo de todas formas, las observaciones encontradas servirán como argumento en la negociación: en una de nuestras inspecciones en Serbia, esto redujo el precio en 700 euros.'
    general:
      - q: ¿Cómo se paga el trabajo?
        a: Una parte del monto es un anticipo, el resto se paga al finalizar. La cantidad de anticipo depende del servicio y del monto de la transacción; se la indicamos antes de comenzar para que las condiciones sean claras para ambas partes.
      - q: ¿Se puede contactar por otros medios que no sean Telegram?
        a: Sí, además de Telegram, se pueden hacer llamadas y usar WhatsApp.
      - q: ¿Dónde se encuentran?
        a: Nuestra base está en Belgrado, desde donde viajamos por toda Serbia. En Alemania, España, Suiza y otros países europeos, nuestros especialistas están a pie de obra.
      - q: ¿La consulta es de pago?
        a: No. Hablaremos sobre su cuestión y le diremos honestamente si es posible ajustarse a su presupuesto. Le indicaremos el costo del trabajo antes de comenzar, y luego no cambia.
    cityExpert:
      q: ¿Hay un experto asignado en cada ciudad?
      a: En diferentes ciudades trabajan nuestros distintos especialistas; en casos específicos, un experto puede viajar a una ciudad vecina de la región.
  de:
    vehicle-sourcing:
      - q: Wie lange dauert der gesamte Prozess von der Anfrage bis zum Fahrzeug beim Kunden?
        a: Im Durchschnitt 3–14 Tage, abhängig davon, wie schnell eine passende Option auf dem Markt gefunden wird.
      - q: Wenn das gefundene Auto nicht passt, suchen Sie dann kostenlos weiter?
        a: Ja, wir suchen kostenlos weiter, bis wir ein passendes Fahrzeug für Sie finden.
      - q: Muss ich selbst zum Auto fahren, um es zu besichtigen?
        a: Nein, das ist nicht notwendig. Wir können den gesamten Kaufprozess ohne Ihr persönliches Erscheinen abwickeln. Wenn Sie es selbst besichtigen möchten, ist das ebenfalls kein Problem.
      - q: Welche Garantie gibt es auf das gefundene Fahrzeug?
        a: 'Es gibt keine offizielle Herstellergarantie wie bei einem Neuwagen, da es sich um den Gebrauchtwagenmarkt handelt. Ihr Schutz ist die unabhängige technische Inspektion vor dem Kauf: Das Fahrzeug wird von einem Experten begutachtet, nicht von Ihnen blind.'
      - q: Gibt es einen Foto- oder Videobericht zum Auto vor der Kaufentscheidung?
        a: Ja, wir stellen einen umfassenden Bericht mit Fotos zum Fahrzeug bereit, bevor Sie Ihre Kaufentscheidung treffen.
      - q: Gibt es eine Entschädigung, wenn die Fristen durch Ihr Verschulden überschritten werden?
        a: Es gibt keine feste Vertragsstrafe, da der Zeitraum oft nicht nur von uns abhängt (Verhandlungen mit dem Verkäufer, Dokumentation). Wir nennen jedoch direkt einen realistischen Zeitraum und ziehen keine Zeit in die Länge.
    vehicle-import:
      - q: Wie unterscheidet sich der Import vom Autopicking?
        a: Autopicking ist, wenn Sie sich im selben Land wie das Fahrzeug befinden. Der Import ist, wenn das Auto aus Europa oder China nach Serbien kommt.
      - q: Ist die Zollabfertigung im Preis inbegriffen?
        a: Ja, wir unterstützen die Zollabfertigung in Serbien und beziehen sie in die Kalkulation ein – den Endbetrag nennen wir vor der Transaktion.
      - q: Wie viel teurer ist das Auto »schlüsselfertig« im Vergleich zum Preis in der Anzeige?
        a: 'Der Unterschied hängt von dem Land, dem Alter des Fahrzeugs und dem Vorhandensein eines EUR1-Zertifikats ab – den Gesamtbetrag ermitteln wir im Voraus. Zum Vergleich: In einem unserer Geschäfte kostete ein BMW X1 in Deutschland 39.860 €, und schlüsselfertig in Serbien, mit allen Kosten, Lieferung, Zollabfertigung und Registrierung, betrug es 46.000 €.'
      - q: Was ist nötig, um das importierte Auto in Serbien anzumelden?
        a: Sie können das Fahrzeug in Serbien nur nach Erhalt der Aufenthaltserlaubnis auf sich anmelden, daher macht es Sinn, mit der Suche zu beginnen, wenn die Dokumente bereits vorliegen. Die Zollabfertigung erfolgt in Subotica, danach bringen wir das Auto in Ihre Stadt und unterstützen die Anmeldung.
    vehicle-buyback:
      - q: Wie viele Tage dauert es, ein Auto zu verkaufen, wenn es noch nicht verzollt oder umgemeldet ist?
        a: In der Regel 1–2 Tage, sogar wenn das Auto noch nicht verzollt oder auf Sie umgemeldet ist.
      - q: Kaufen Sie Autos mit Kredit oder Pfand?
        a: Nein, wir kaufen nur Fahrzeuge ohne aktiven Kredit oder Pfand.
      - q: Wie schnell kommt das Geld nach der Inspektion?
        a: Am Tag der Vertragsunterzeichnung – sofort nach der Inspektion, wenn die Beschreibung übereinstimmt.
      - q: Gibt es Einschränkungen hinsichtlich Marke, Baujahr oder Kilometerstand?
        a: 'Ja – wir betrachten keine Fahrzeuge in schlechtem technischen Zustand sowie französische Marken. Diese Einschränkung gilt nur für den Rückkauf: Peugeot oder Renault können wir Ihnen weiterhin anbieten.'
      - q: Was passiert mit dem Auto nach dem Rückkauf?
        a: 'Danach ist es unser Anliegen: Wir organisieren den Transport und den Verkauf selbst. Autos mit serbischen Nummern werden normalerweise auf dem Markt in Belgrad verkauft, Fahrzeuge mit russischen Nummern bringen wir raus und verkaufen sie in Russland.'
    vehicle-inspection:
      - q: Wie viel kostet die Inspektion und ist der Preis in allen Ländern gleich?
        a: Die Kosten variieren je nach Land und hängen vom Umfang der Inspektion ab – einen genauen Betrag nennen wir bei der Anfrage.
      - q: Kann man eine Inspektion bestellen, wenn man physisch nicht in diesem Land ist?
        a: Ja, Ihre Präsenz ist nicht nötig – den Bericht und die Entscheidung erhalten Sie aus der Ferne.
      - q: In welcher Form liegt der Bericht vor?
        a: Fotografien und eine detaillierte schriftliche Beschreibung nach der Inspektion.
      - q: Was passiert, wenn die Inspektion zeigt, dass man das Auto nicht kaufen sollte?
        a: 'Sie erhalten einen Bericht mit Fotos und eine klare Antwort „nicht kaufen“ – und verlieren nur die Kosten der Inspektion, nicht das Geld für das Auto. Der Bericht bleibt bei Ihnen, und falls Sie sich dennoch für den Kauf entscheiden, können die gefundenen Mängel als Argument bei der Preisverhandlung dienen: Bei einer unserer Inspektionen in Serbien wurde der Preis um 700 Euro gesenkt.'
    general:
      - q: Wie wird die Arbeit bezahlt?
        a: Ein Teil des Betrags ist eine Anzahlung, der Rest wird nach Abschluss bezahlt. Die Höhe der Anzahlung hängt von der Dienstleistung und der Höhe des Geschäfts ab – wir nennen diesen Betrag vor Beginn der Arbeiten, damit die Bedingungen für beide Seiten klar sind.
      - q: Kann ich auch außerhalb von Telegram schreiben?
        a: Ja, neben Telegram sind auch Anrufe und WhatsApp verfügbar.
      - q: Wo befinden Sie sich?
        a: Unser Hauptsitz ist in Belgrad, von wo aus wir in ganz Serbien tätig sind. In Deutschland, Spanien, der Schweiz und anderen europäischen Ländern arbeiten unsere Spezialisten vor Ort.
      - q: Ist die Beratung kostenpflichtig?
        a: Nein. Wir besprechen Ihre Anliegen und sagen Ihnen ehrlich, ob es realistisch ist, innerhalb Ihres Budgets zu bleiben. Die Kosten für die Arbeit nennen wir vor Beginn, und danach ändern sie sich nicht.
    cityExpert:
      q: Gibt es in jeder Stadt einen eigenen Spezialisten?
      a: In verschiedenen Städten arbeiten unterschiedliche Spezialisten; in einigen Fällen kommt der Experte in die benachbarte Stadt der Region.
