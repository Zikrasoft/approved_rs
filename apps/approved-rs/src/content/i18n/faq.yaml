vehicle-sourcing:
  - q: Сколько занимает весь процесс — от заявки до машины у клиента?
    a: В среднем 3–14 дней — зависит от того, как быстро находится подходящий вариант на рынке.
  - q: Если найденная машина не подошла, продолжаете искать бесплатно?
    a: Да, продолжаем поиск без доплаты, пока не найдём то, что вам подходит.
  - q: Нужно ли самому ехать смотреть машину?
    a: Нет, необязательно — можем провести всю сделку без вашего присутствия. Хотите приехать и посмотреть сами — тоже без проблем.
  - q: Даёте ли фото- или видеоотчёт по машине до принятия решения?
    a: Да, полный отчёт с фото по машине — до того, как вы принимаете решение о покупке.
  - q: Есть компенсация, если сроки сорваны по вашей вине?
    a: Фиксированной неустойки нет — срок сделки часто зависит не только от нас (переговоры с продавцом, оформление документов). Но называем реалистичный срок сразу и не тянем время.
vehicle-import:
  - q: Чем привоз отличается от автоподбора?
    a: Автоподбор — когда вы находитесь в той же стране, что и автомобиль. Привоз — когда машина едет к вам в Сербию из Европы или Китая.
  - q: Растаможка входит в стоимость?
    a: Да, сопровождаем растаможку в Сербии и включаем её в расчёт — итоговую сумму называем до сделки.
  - q: Насколько машина «под ключ» дороже цены в объявлении?
    a: 'Разница зависит от страны, возраста автомобиля и наличия сертификата EUR1 — полную сумму мы считаем и фиксируем до старта. Для ориентира: в одной из наших сделок BMW X1 стоил в Германии 39 860 €, а под ключ в Сербии, со всеми расходами, доставкой, растаможкой и оформлением, вышел в 46 000 €.'
  - q: Что нужно, чтобы поставить привезённую машину на учёт в Сербии?
    a: Оформить автомобиль на себя в Сербии можно только после получения ВНЖ, поэтому подбор имеет смысл начинать, когда документы уже на руках. Растаможка проходит в Суботице, после неё мы довозим машину до вашего города и сопровождаем постановку на учёт.
vehicle-buyback:
  - q: За сколько дней можно продать машину, если она ещё не растаможена или не переоформлена?
    a: Обычно 1–2 дня, даже если машина ещё не растаможена или не переоформлена на вас.
  - q: Выкупаете машину в кредите или залоге?
    a: Нет, выкупаем только автомобили без действующего кредита или залога.
  - q: Как быстро приходят деньги после осмотра?
    a: В день подписания договора — сразу после осмотра, если описание совпало.
  - q: Есть ограничения по марке, году или пробегу?
    a: 'Да — не рассматриваем автомобили в плохом техническом состоянии и французские марки. Это ограничение только на выкуп: подобрать вам Peugeot или Renault мы по-прежнему можем.'
  - q: Что происходит с машиной после выкупа?
    a: 'Дальше она наша забота: транспортировку и продажу организуем мы сами. Машины на сербских номерах обычно уходят на рынке в Белграде, автомобили на российских номерах мы вывозим и реализуем в России.'
vehicle-inspection:
  - q: Сколько стоит проверка и одинакова ли цена во всех странах?
    a: Стоимость отличается по странам и зависит от объёма проверки — точную цифру назовём при заявке.
  - q: Можно заказать проверку, если вас физически нет в этой стране?
    a: Да, ваше присутствие не обязательно — отчёт и решение получаете удалённо.
  - q: В каком виде отчёт?
    a: Фото и подробное текстовое описание по итогам осмотра.
  - q: Что будет, если проверка покажет, что машину брать не стоит?
    a: 'Вы получаете отчёт с фото и прямой ответ «не берите» — и теряете стоимость проверки, а не деньги за машину. Отчёт остаётся у вас, и если вы всё-таки решите брать, найденные замечания работают как аргумент в торге: на одном из наших осмотров в Сербии это снизило цену на 700 евро.'
general:
  - q: Как оплачивается работа?
    a: Часть суммы — предоплата, остальное по факту. Размер предоплаты зависит от услуги и суммы сделки — называем его до начала работ, чтобы условия были понятны обеим сторонам.
  - q: Можно написать не в Telegram?
    a: Да, помимо Telegram доступны звонки и WhatsApp.
  - q: Где вы находитесь?
    a: База — Белград, оттуда выезжаем по всей Сербии. В Германии, Испании, Швейцарии и других странах Европы работают наши специалисты на месте.
  - q: Консультация платная?
    a: Нет. Обсудим задачу и скажем честно, реально ли уложиться в ваш бюджет. Стоимость работы называем до старта, и потом она не меняется.
cityExpert:
  q: В каждом городе есть свой выделенный эксперт?
  a: В разных городах работают разные наши специалисты; в отдельных случаях эксперт выезжает в соседний город региона.
translations:
  en:
    vehicle-sourcing:
      - q: How long does the entire process take - from application to delivery?
        a: On average, it takes 3–14 days - it depends on how quickly we can find a suitable option on the market.
      - q: If the found car doesn’t meet my needs, will you continue searching for free?
        a: Yes, we will keep searching at no extra charge until we find something that suits you.
      - q: Do I need to visit and see the car myself?
        a: No, it’s not necessary - we can handle the entire transaction without your presence. If you want to come and check it out yourself, that’s fine too.
      - q: Do you provide a photo or video report of the car before I make a decision?
        a: Yes, you will receive a complete report with photos of the car before you decide to purchase.
      - q: Is there compensation if deadlines are missed due to your fault?
        a: There is no fixed penalty - the duration of the transaction often depends on factors beyond our control (negotiations with the seller, document processing). However, we set a realistic timeframe upfront and don’t delay.
    vehicle-import:
      - q: What’s the difference between sourcing and importing a vehicle?
        a: Sourcing is when you are in the same country as the car. Importing is when the vehicle is coming to Serbia from Europe or China.
      - q: Is customs clearance included in the price?
        a: Yes, we assist with customs clearance in Serbia and include it in the estimate - we provide the total amount before the deal is finalized.
      - q: How much more is the 'turnkey' price compared to the listed price?
        a: 'The difference depends on the country, age of the car, and whether it has a EUR1 certificate - we calculate and fix the total amount before starting. Just for reference: in one of our deals, a BMW X1 cost €39,860 in Germany, while the turnkey price in Serbia, including all expenses, delivery, customs clearance, and registration, was €46,000.'
      - q: What do I need to register an imported car in Serbia?
        a: You can only register the car in your name in Serbia after obtaining your residence permit, so it makes sense to start sourcing once you have the documents in hand. Customs clearance happens in Subotica, after which we will deliver the car to your city and assist with registration.
    vehicle-buyback:
      - q: How many days does it take to sell a car if it’s not yet cleared or registered?
        a: Usually, it takes 1–2 days, even if the car is not yet cleared or registered in your name.
      - q: Do you buy cars that are under loan or lien?
        a: No, we only purchase vehicles that are free of any active loans or liens.
      - q: How quickly do I receive payment after the inspection?
        a: On the day you sign the contract - immediately after the inspection, if the description matches.
      - q: Are there restrictions on brand, year, or mileage?
        a: Yes - we do not consider cars that are in poor technical condition or French brands. This restriction only applies to buyback; we can still source a Peugeot or Renault for you.
      - q: What happens to the car after it's bought back?
        a: 'After that, it’s our responsibility: we handle the transportation and sale. Cars with Serbian plates are usually sold on the market in Belgrade, while vehicles with Russian plates are exported and sold in Russia.'
    vehicle-inspection:
      - q: How much does an inspection cost, and is the price the same in all countries?
        a: The cost varies by country and depends on the scope of the inspection - we will provide an exact figure when you make your request.
      - q: Can I order an inspection if I’m not physically in the country?
        a: Yes, your presence is not necessary - you will receive the report and decision remotely.
      - q: What format does the report come in?
        a: It includes photos and a detailed textual description based on the inspection results.
      - q: What happens if the inspection shows that I shouldn’t buy the car?
        a: "You will receive a report with photos and a direct recommendation 'do not buy' - and you only lose the inspection fee, not the money for the car. The report remains with you, and if you still decide to proceed, the identified issues can serve as leverage in negotiations: in one of our inspections in Serbia, it reduced the price by €700."
    general:
      - q: How is the service fee paid?
        a: Part of the amount is prepaid, with the rest due upon completion. The amount of the prepayment depends on the service and total transaction - we clarify this before starting so that both parties understand the terms.
      - q: Can I contact you other than through Telegram?
        a: Yes, in addition to Telegram, you can also call us or reach us via WhatsApp.
      - q: Where are you located?
        a: Our base is in Belgrade, from where we operate throughout Serbia. Our specialists work on-site in Germany, Spain, Switzerland, and other European countries.
      - q: Is the consultation fee-based?
        a: No. We will discuss your needs and honestly tell you whether it’s possible to stay within your budget. We specify the service fee before starting, and it won’t change later.
    cityExpert:
      q: Is there a dedicated expert in each city?
      a: Different specialists work in various cities; in some cases, the expert may travel to a neighboring city in the region.
  sr:
    vehicle-sourcing:
      - q: Koliko traje ceo proces - od prijave do automobila kod klijenta?
        a: U proseku 3–14 dana - zavisi od toga koliko brzo se pronađe odgovarajući model na tržištu.
      - q: Ako pronađeni automobil nije odgovara, da li nastavite da tražite besplatno?
        a: Da, nastavljamo potragu bez doplate, dok ne pronađemo ono što vam odgovara.
      - q: Da li je potrebno da sami idete na provalu automobila?
        a: Ne, nije obavezno - možemo sprovesti celu transakciju bez vašeg prisustva. Ako želite da dođete i pogledate sami - takođe nema problema.
      - q: Da li dajete foto- ili video izveštaj o automobilu pre donošenja odluke?
        a: Da, pun izveštaj sa fotografijama o automobilu - pre nego što donesete odluku o kupovini.
      - q: Postoji li naknada ako su rokovi probijeni vašom krivicom?
        a: Fiksne kazne nema - rok transakcije često zavisi ne samo od nas (pregovori sa prodavcem, pribavljanje dokumentacije). Međutim, odmah nazivamo realističan rok i ne odugovlačimo.
    vehicle-import:
      - q: Čim se dovoz razlikuje od auto-podbora?
        a: Auto-podbor je kada ste u istoj zemlji gde je automobil. Dovoz je kada automobil dolazi u Srbiju iz Evrope ili Kine.
      - q: Da li je carinjenje uključeno u cenu?
        a: Da, pratimo carinjenje u Srbiji i uključujemo ga u obračun - konačnu sumu obelodanjujemo pre transakcije.
      - q: Koliko je cena automobila "ključno" skuplja od cene u oglasu?
        a: Razlika zavisi od zemlje, starosti automobila i posjedovanja sertifikata EUR1 - konačnu sumu računamo i utvrđujemo pre početka. Na primer, jedan od naših poslova, BMW X1 je u Nemačkoj koštao 39.860 €, a ključno u Srbiji, sa svim troškovima, dostavom, carinjenjem i dokumentacijom, iznosilo je 46.000 €.
      - q: Šta je potrebno da registrovate doneseni automobil u Srbiji?
        a: Automobil možete registrovati na sebe u Srbiji samo nakon dobijanja boravišne dozvole, stoga je smisleno početi s nabavkom kada su dokumenti već u rukama. Carinjenje se obavlja u Subotici, nakon čega dovozimo automobil do vašeg grada i pratimo registraciju.
    vehicle-buyback:
      - q: Za koliko dana se može prodati automobil, ako još nije carinjen ili prepisan?
        a: Obično 1–2 dana, čak i ako automobil još nije carinjen ili prepisan na vas.
      - q: Da li otkupljujete automobile u kreditu ili zalogu?
        a: Ne, otkupljujemo samo automobile bez aktivnog kredita ili zaloge.
      - q: Kako brzo dolaze novci nakon provere?
        a: Na dan potpisivanja ugovora - odmah nakon provere, ako opis odgovara.
      - q: Ima li ograničenja po marki, godini ili pređenim kilometrima?
        a: 'Da - ne razmatramo automobile u lošem tehničkom stanju i francuske marke. Ovo ograničenje važi samo za otkup: možemo vam i dalje pronaći Peugeot ili Renault.'
      - q: Šta se dešava sa automobilom nakon otkupa?
        a: 'Dalje je to naša briga: transport i prodaju organizujemo sami. Automobili sa srpskim tablicama obično idu na tržište u Beogradu, a automobili sa ruskim tablicama izvozimo i realizujemo u Rusiji.'
    vehicle-inspection:
      - q: Koliko košta provera auta pre kupovine i da li je cena svuda ista?
        a: Cena se razlikuje po zemljama i zavisi od obima provere - tačan iznos ćemo naznačiti prilikom prijave.
      - q: Da li možete naručiti provere, ako fizički niste u toj zemlji?
        a: Da, vaše prisustvo nije obavezno - izveštaj i odluku dobijate na daljinu.
      - q: U kojem obliku je izveštaj?
        a: Fotografije i detaljan tekstualni opis nakon provere.
      - q: Šta će se desiti ako provera pokaže da automobil ne treba kupovati?
        a: 'Dobijate izveštaj sa fotografijama i jasan odgovor "ne kupovati" - i gubite samo trošak provere, a ne novac za automobil. Izveštaj ostaje kod vas, i ako se ipak odlučite za kupovinu, uočene primedbe će biti argument u pregovorima: na jednoj od naših provera u Srbiji to je smanjilo cenu za 700 evra.'
    general:
      - q: Kako se plaća rad?
        a: Deo sume - avans, ostalo po završetku. Iznos avansa zavisi od usluge i iznosa transakcije - nazivamo ga pre početka rada, kako bi uslovi bili jasni obe strane.
      - q: Može li se pisati ne preko Telegrama?
        a: Da, osim Telegrama dostupni su pozivi i WhatsApp.
      - q: Gde se nalazite?
        a: Baza - Beograd, odatle odlazimo po celoj Srbiji. U Nemačkoj, Španiji, Švajcarskoj i drugim zemljama Evrope rade naši stručnjaci na terenu.
      - q: Da li je konsultacija naplatna?
        a: Ne. Razgovaraćemo o zadatku i iskreno reći, da li se može uklopiti u vaš budžet. Trošak rada nazivamo pre početka, i kasnije se ne menja.
    cityExpert:
      q: Da li u svakom gradu postoji svoj stručnjak?
      a: U različitim gradovima rade različiti naši stručnjaci; u posebnim slučajevima ekspert odlazi u susedni grad regiona.
  es:
    vehicle-sourcing:
      - q: ¿Cuánto tiempo lleva todo el proceso, desde la solicitud hasta que el vehículo llega al cliente?
        a: En promedio de 3 a 14 días, depende de cuán rápido se encuentre una opción adecuada en el mercado.
      - q: Si el coche encontrado no es adecuado, ¿seguirán buscando gratis?
        a: Sí, continuamos la búsqueda sin coste adicional, hasta que encontremos lo que le conviene.
      - q: ¿Es necesario ir a ver el coche personalmente?
        a: No, no es necesario, podemos realizar toda la transacción sin su presencia. Si desea venir a verlo, también es posible.
      - q: ¿Proporcionan un informe con fotos o videos del coche antes de tomar una decisión?
        a: Sí, un informe completo con fotos del coche, antes de que tome una decisión de compra.
      - q: ¿Ofrecen compensación si los plazos se incumplen por su culpa?
        a: No hay una penalización fija, ya que el tiempo de la transacción a menudo depende de factores externos (negociaciones con el vendedor, trámite de documentos). Sin embargo, establecemos un plazo realista desde el principio y no dilatamos el tiempo.
    vehicle-import:
      - q: ¿En qué se diferencia la importación del servicio de selección de coches?
        a: La selección de coches es cuando usted se encuentra en el mismo país que el vehículo. La importación es cuando el coche viene a Serbia desde Europa o China.
      - q: ¿La aduana está incluida en el precio?
        a: Sí, acompañamos el trámite aduanero en Serbia y lo incluimos en el cálculo, comunicando la suma total antes de la transacción.
      - q: ¿Cuánto más costará el coche 'llave en mano' que el precio en el anuncio?
        a: La diferencia depende del país, la antigüedad del coche y la existencia del certificado EUR1; calculamos y fijamos la suma total antes de comenzar. Para referencia, en uno de nuestros tratos, un BMW X1 costó 39,860 € en Alemania, y 'llave en mano' en Serbia, con todos los gastos, entrega, aduanas y registro, fue de 46,000 €.
      - q: ¿Qué se necesita para registrar el coche importado en Serbia?
        a: Para registrar un coche a su nombre en Serbia, debe primero obtener un permiso de residencia. Por eso, tiene sentido comenzar la búsqueda una vez que tenga los documentos. La aduana se realiza en Subotica, después de lo cual transportamos el coche a su ciudad y acompañamos el registro.
    vehicle-buyback:
      - q: ¿En cuántos días se puede vender un coche si aún no ha sido despachado o transferido?
        a: Normalmente de 1 a 2 días, incluso si el coche aún no ha sido despachado o transferido a su nombre.
      - q: ¿Compran coches que están en crédito o en prenda?
        a: No, compramos solo automóviles sin crédito o prenda pendiente.
      - q: ¿Cuánto tiempo tarda en llegar el dinero después de la inspección?
        a: El mismo día de la firma del contrato, inmediatamente después de la inspección, si la descripción coincide.
      - q: ¿Existen limitaciones en marca, año o kilometraje?
        a: 'Sí, no consideramos vehículos en mal estado técnico ni de marcas francesas. Esta restricción es solo para la compra: aún podemos ayudarle a encontrar un Peugeot o Renault.'
      - q: ¿Qué sucede con el coche después de la compra?
        a: 'Luego, es nuestra responsabilidad: organizamos el transporte y la venta. Los coches con matrículas serbias suelen venderse en el mercado de Belgrado, mientras que los con matrículas rusas los llevamos a Rusia para su venta.'
    vehicle-inspection:
      - q: ¿Cuánto cuesta la inspección y es igual en todos los países?
        a: El costo varía según el país y depende del alcance de la inspección; le daremos la cifra exacta al momento de la solicitud.
      - q: ¿Se puede solicitar una inspección si no se está físicamente en ese país?
        a: Sí, su presencia no es necesaria, recibirá el informe y la decisión de manera remota.
      - q: ¿En qué formato se presenta el informe?
        a: Fotos y una descripción detallada en texto al finalizar la inspección.
      - q: ¿Qué pasaría si la inspección muestra que no vale la pena comprar el coche?
        a: "Recibirá un informe con fotos y una respuesta directa de 'no compre', y perderá solo el costo de la inspección, no el dinero por el coche. El informe se queda con usted, y si finalmente decide comprar, los hallazgos sirven como argumento en la negociación: en una de nuestras inspecciones en Serbia esto redujo el precio en 700 euros."
    general:
      - q: ¿Cómo se paga el servicio?
        a: Una parte es un anticipo, el resto se paga al finalizar. La cantidad del anticipo depende del servicio y del monto de la transacción; se lo comunicamos antes de comenzar el trabajo para que ambas partes tengan claridad sobre los términos.
      - q: ¿Se puede comunicar de otra manera que por Telegram?
        a: Sí, además de Telegram, son posibles llamadas y WhatsApp.
      - q: ¿Dónde están ubicados?
        a: Nuestra base está en Belgrado, desde donde viajamos por toda Serbia. En Alemania, España, Suiza y otros países europeos, nuestros especialistas trabajan allí.
      - q: ¿La consulta tiene costo?
        a: No. Discutimos la tarea y les decimos honestamente si es posible ajustarse a su presupuesto. El costo del trabajo se menciona antes de comenzar y no cambia después.
    cityExpert:
      q: ¿Hay un experto asignado en cada ciudad?
      a: En diferentes ciudades trabajan distintos especialistas nuestros; en algunos casos, el experto puede desplazarse a una ciudad vecina de la región.
  de:
    vehicle-sourcing:
      - q: Wie lange dauert der gesamte Prozess - von der Anfrage bis zur Auslieferung des Fahrzeugs an den Kunden?
        a: Im Durchschnitt 3–14 Tage, abhängig davon, wie schnell eine passende Option auf dem Markt gefunden wird.
      - q: Wenn das gefundene Fahrzeug nicht geeignet ist, suchen Sie dann kostenlos weiter?
        a: Ja, wir setzen die Suche ohne zusätzliche Kosten fort, bis wir das passende Angebot für Sie finden.
      - q: Muss man selbst kommen, um das Fahrzeug zu besichtigen?
        a: Nein, das ist nicht zwingend erforderlich - wir können den gesamten Deal ohne Ihre Anwesenheit abwickeln. Wenn Sie jedoch selbst kommen möchten, ist das auch kein Problem.
      - q: Gibt es einen Foto- oder Videobericht über das Fahrzeug vor der Kaufentscheidung?
        a: Ja, ein vollständiger Bericht mit Fotos des Fahrzeugs wird bereitgestellt, bevor Sie Ihre Kaufentscheidung treffen.
      - q: Gibt es eine Entschädigung, wenn die Fristen aufgrund Ihres Verschuldens nicht eingehalten werden?
        a: Es gibt keine feste Vertragsstrafe - die Dauer des Deals hängt oft nicht nur von uns ab (Verhandlungen mit dem Verkäufer, Dokumentenbearbeitung). Wir nennen jedoch von Anfang an einen realistischen Zeitraum und ziehen die Sache nicht in die Länge.
    vehicle-import:
      - q: Was ist der Unterschied zwischen Import und Fahrzeugbeschaffung?
        a: Fahrzeugbeschaffung bedeutet, dass Sie sich im selben Land wie das Auto befinden. Import bedeutet, dass das Fahrzeug aus Europa oder China nach Serbien kommt.
      - q: Ist die Zollabwicklung im Preis inbegriffen?
        a: Ja, wir begleiten die Zollabwicklung in Serbien und rechnen sie im Preis mit ein - die Gesamtsumme nennen wir vor dem Deal.
      - q: Wie viel teurer ist ein „schlüsselfertiges“ Fahrzeug im Vergleich zum Preis in der Anzeige?
        a: 'Der Unterschied hängt vom Land, dem Alter des Fahrzeugs und dem Vorhandensein des EUR1-Zertifikats ab - die gesamte Summe berechnen wir und fixieren sie vor dem Start. Zum Orientierung: In einem unserer Deals kostete ein BMW X1 in Deutschland 39.860 €, während der Preis schlüsselfertig in Serbien, inklusive aller Kosten, Lieferung, Zollabwicklung und Registrierung, 46.000 € betrug.'
      - q: Was wird benötigt, um das importierte Fahrzeug in Serbien zuzulassen?
        a: Das Fahrzeug kann in Serbien nur nach Erhalt des Aufenthaltstitels auf Sie zugelassen werden, daher ist es sinnvoll, die Beschaffung zu starten, wenn die Dokumente bereits in Händen sind. Die Zollabwicklung erfolgt in Subotica, danach bringen wir das Fahrzeug in Ihre Stadt und begleiten die Zulassung.
    vehicle-buyback:
      - q: In wie vielen Tagen kann ich das Fahrzeug verkaufen, wenn es noch nicht verzollt oder umgemeldet ist?
        a: Normalerweise 1–2 Tage, auch wenn das Fahrzeug noch nicht verzollt oder auf Sie umgemeldet ist.
      - q: Kaufen Sie Fahrzeuge mit Krediten oder Pfandrechten?
        a: Nein, wir kaufen nur Fahrzeuge ohne laufenden Kredit oder Pfand.
      - q: Wie schnell kommt das Geld nach der Inspektion?
        a: Am Tag der Vertragsunterzeichnung - sofort nach der Inspektion, wenn die Beschreibung übereinstimmt.
      - q: Gibt es Einschränkungen hinsichtlich Marke, Jahr oder Kilometerstand?
        a: 'Ja - wir betrachten keine Fahrzeuge in schlechtem technischen Zustand und französische Marken. Diese Einschränkung gilt nur für den Ankauf: Wir können Ihnen dennoch Peugeot oder Renault beschaffen.'
      - q: Was passiert mit dem Fahrzeug nach dem Ankauf?
        a: 'Danach kümmern wir uns darum: Wir organisieren den Transport und den Verkauf selbst. Fahrzeuge mit serbischen Nummernschildern werden üblicherweise auf dem Markt in Belgrad verkauft, Fahrzeuge mit russischen Nummernschildern exportieren wir und realisieren sie in Russland.'
    vehicle-inspection:
      - q: Wie viel kostet die Inspektion und ist der Preis in allen Ländern gleich?
        a: Die Kosten variieren je nach Land und hängen vom Umfang der Inspektion ab - den genauen Betrag nennen wir bei der Anfrage.
      - q: Kann die Inspektion bestellt werden, wenn Sie physisch nicht in diesem Land sind?
        a: Ja, Ihre Anwesenheit ist nicht erforderlich - Sie erhalten den Bericht und die Entscheidung remote.
      - q: In welcher Form liegt der Bericht vor?
        a: Fotos und eine detaillierte schriftliche Beschreibung nach der Inspektion.
      - q: Was passiert, wenn die Inspektion zeigt, dass das Fahrzeug nicht gekauft werden sollte?
        a: 'Sie erhalten den Bericht mit Fotos und eine klare Antwort „nicht kaufen“ - Sie verlieren die Kosten der Inspektion, nicht das Geld für das Fahrzeug. Der Bericht bleibt bei Ihnen, und falls Sie sich dennoch entscheiden zu kaufen, können die gefundenen Mängel als Argument im Verkaufsgespräch dienen: Bei einer unserer Inspektionen in Serbien senkten diese das Angebot um 700 Euro.'
    general:
      - q: Wie wird die Arbeit bezahlt?
        a: Ein Teil des Betrags - Vorauszahlung, der Rest nach der Erbringung. Die Höhe der Vorauszahlung hängt von der Dienstleistung und dem Betrag des Deals ab - wir nennen ihn vor Beginn der Arbeiten, damit die Bedingungen beiden Seiten klar sind.
      - q: Kann ich auch anders als über Telegram schreiben?
        a: Ja, neben Telegram sind Anrufe und WhatsApp möglich.
      - q: Wo sind Sie ansässig?
        a: Unsere Basis ist in Belgrad, von dort aus fahren wir durch ganz Serbien. In Deutschland, Spanien, der Schweiz und anderen europäischen Ländern sind unsere Spezialisten vor Ort tätig.
      - q: Ist die Konsultation kostenpflichtig?
        a: Nein. Wir besprechen Ihr Anliegen und sagen Ihnen ehrlich, ob es möglich ist, innerhalb Ihres Budgets zu bleiben. Die Kosten der Arbeit nennen wir vor Beginn, und danach ändern sie sich nicht.
    cityExpert:
      q: Gibt es in jeder Stadt einen eigenen Experten?
      a: In verschiedenen Städten arbeiten unterschiedliche Spezialisten von uns; in bestimmten Fällen fährt ein Experte in eine benachbarte Stadt der Region.
