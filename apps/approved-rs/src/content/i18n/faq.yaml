vehicle-sourcing:
  - q: Сколько занимает весь процесс, от заявки до машины у клиента?
    a: В среднем 3–14 дней, в зависимости от того, как быстро находится подходящий вариант на рынке.
  - q: Если найденная машина не подошла, продолжаете искать бесплатно?
    a: Да, продолжаем поиск без доплаты, пока не найдем то, что вам подходит.
  - q: Нужно ли самому ехать смотреть машину?
    a: Нет, необязательно, можем провести всю сделку без вашего присутствия. Хотите приехать и посмотреть сами? Тоже без проблем.
  - q: Даете ли фото- или видеоотчет по машине до принятия решения?
    a: Да, полный отчет с фото по машине, до того как вы принимаете решение о покупке.
  - q: Есть компенсация, если сроки сорваны по вашей вине?
    a: Фиксированной неустойки нет, срок сделки часто зависит не только от нас (переговоры с продавцом, оформление документов). Но называем реалистичный срок сразу и не тянем время.
vehicle-import:
  - q: Чем привоз отличается от автоподбора?
    a: Автоподбор нужен, когда вы находитесь в той же стране, что и автомобиль. Привоз нужен, когда машина едет к вам в Сербию из Европы или Китая.
  - q: Растаможка входит в стоимость?
    a: Да, сопровождаем растаможку в Сербии и включаем ее в расчет. Итоговую сумму называем до сделки.
  - q: Насколько машина «под ключ» дороже цены в объявлении?
    a: 'Разница зависит от страны, возраста автомобиля и наличия сертификата EUR1. Полную сумму мы считаем и фиксируем до старта. Для ориентира: в одной из наших сделок BMW X1 стоил в Германии 39 860 €, а под ключ в Сербии, со всеми расходами, доставкой, растаможкой и оформлением, вышел в 46 000 €.'
  - q: Что нужно, чтобы поставить привезенную машину на учет в Сербии?
    a: Оформить автомобиль на себя в Сербии можно только после получения ВНЖ, поэтому подбор имеет смысл начинать, когда документы уже на руках. Растаможка проходит в Суботице, после нее мы довозим машину до вашего города и сопровождаем постановку на учет.
vehicle-buyback:
  - q: За сколько дней можно продать машину, если она еще не растаможена или не переоформлена?
    a: Обычно 1–2 дня, даже если машина еще не растаможена или не переоформлена на вас.
  - q: Выкупаете машину в кредите или залоге?
    a: Нет, выкупаем только автомобили без действующего кредита или залога.
  - q: Как быстро приходят деньги после осмотра?
    a: В день подписания договора, сразу после осмотра, если описание совпало.
  - q: Есть ограничения по марке, году или пробегу?
    a: 'Да: не рассматриваем автомобили в плохом техническом состоянии и французские марки. Это ограничение только на выкуп: подобрать вам Peugeot или Renault мы по-прежнему можем.'
  - q: Что происходит с машиной после выкупа?
    a: 'Дальше она наша забота: транспортировку и продажу организуем мы сами. Машины на сербских номерах обычно уходят на рынке в Белграде, автомобили на российских номерах мы вывозим и реализуем в России.'
vehicle-inspection:
  - q: Сколько стоит проверка и одинакова ли цена во всех странах?
    a: Стоимость отличается по странам и зависит от объема проверки, точную цифру назовем при заявке.
  - q: Можно заказать проверку, если вас физически нет в этой стране?
    a: Да, ваше присутствие не обязательно. Отчет и решение получаете удаленно.
  - q: В каком виде отчет?
    a: Фото и подробное текстовое описание по итогам осмотра.
  - q: Что будет, если проверка покажет, что машину брать не стоит?
    a: 'Вы получаете отчет с фото и прямой ответ «не берите» и теряете стоимость проверки, а не деньги за машину. Отчет остается у вас, и если вы все-таки решите брать, найденные замечания работают как аргумент в торге: на одном из наших осмотров в Сербии это снизило цену на 700 евро.'
general:
  - q: Как оплачивается работа?
    a: Часть суммы вносится предоплатой, остальное по факту. Размер предоплаты зависит от услуги и суммы сделки, называем его до начала работ, чтобы условия были понятны обеим сторонам.
  - q: Можно написать не в Telegram?
    a: Да, помимо Telegram доступны звонки и WhatsApp.
  - q: Где вы находитесь?
    a: Наша база в Белграде, оттуда выезжаем по всей Сербии. В Германии, Испании, Швейцарии и других странах Европы работают наши специалисты на месте.
  - q: Консультация платная?
    a: Нет. Обсудим задачу и скажем честно, реально ли уложиться в ваш бюджет. Стоимость работы называем до старта, и потом она не меняется.
cityExpert:
  q: В каждом городе есть свой выделенный эксперт?
  a: В разных городах работают разные наши специалисты; в отдельных случаях эксперт выезжает в соседний город региона.
translations:
  en:
    vehicle-sourcing:
      - q: How long does the entire process take, from application to the car in the client's hands?
        a: On average, it takes 3-14 days, depending on how quickly a suitable option is found on the market.
      - q: If the found car isn't right, do you continue the search for free?
        a: Yes, we continue searching at no additional charge until we find what suits you.
      - q: Do I need to go see the car myself?
        a: No, it’s not necessary. We can handle the entire transaction without your presence. Would you like to come and see it yourself? That’s also fine.
      - q: Do you provide photo or video reports on the car before a decision is made?
        a: Yes, we provide a full report with photos of the car before you make a purchasing decision.
      - q: Is there compensation if the deadlines are missed due to your fault?
        a: There is no fixed penalty fee; the duration of the transaction often depends on factors beyond our control (negotiations with the seller, documentation). However, we do provide a realistic timeframe upfront and don’t delay the process.
    vehicle-import:
      - q: What’s the difference between sourcing and importing a vehicle?
        a: Vehicle sourcing is needed when you are in the same country as the car. Importing is necessary when the vehicle is coming to Serbia from Europe or China.
      - q: Is customs clearance included in the cost?
        a: Yes, we assist with customs clearance in Serbia and include it in the calculation. The final amount will be provided before the transaction.
      - q: How much more is the 'turnkey' price compared to the ad price?
        a: The difference depends on the country, age of the vehicle, and whether an EUR1 certificate is available. We calculate and fix the total amount before starting. For reference, in one of our deals, a BMW X1 cost €39,860 in Germany, while the final cost in Serbia, including all expenses, delivery, customs clearance, and paperwork, was €46,000.
      - q: What do I need to register an imported vehicle in Serbia?
        a: You can only register the vehicle in Serbia after obtaining a residence permit, so it's best to start the sourcing process once you have the necessary documents. Customs clearance is done in Subotica; after that, we deliver the car to your city and assist with the registration.
    vehicle-buyback:
      - q: How many days does it take to sell a car if it hasn't been cleared or re-registered?
        a: Usually 1-2 days, even if the car hasn’t been cleared or re-registered in your name.
      - q: Do you buy cars that are under loan or collateral?
        a: No, we only buy cars without an active loan or collateral.
      - q: How quickly do I receive money after the inspection?
        a: On the day of signing the contract, immediately after inspection, if the description matched.
      - q: Are there restrictions on brand, year, or mileage?
        a: 'Yes: we do not consider cars in poor technical condition or French brands. This restriction applies only to buyback; we can still source you a Peugeot or Renault.'
      - q: What happens to the car after buyback?
        a: "From then on, it's our responsibility: we handle transportation and sales ourselves. Cars with Serbian plates usually go to the market in Belgrade, while cars with Russian plates are exported and sold in Russia."
    vehicle-inspection:
      - q: How much does an inspection cost, and is the price the same in all countries?
        a: The cost varies by country and depends on the scope of the inspection; we will provide a specific figure upon request.
      - q: Can I order an inspection if I’m not physically in that country?
        a: Yes, your presence is not required. You will receive the report and decision remotely.
      - q: What format is the report in?
        a: It includes photos and a detailed text description based on the inspection results.
      - q: What happens if the inspection shows the car isn’t worth buying?
        a: 'You receive a report with photos and a direct answer of ‘do not purchase’ and lose only the inspection cost, not the money for the car. The report remains with you, and if you decide to proceed with the purchase, the noted issues can serve as a bargaining tool: in one of our inspections in Serbia, this reduced the price by €700.'
    general:
      - q: How is the work paid for?
        a: A part of the sum is paid as an advance, the rest upon completion. The advance amount depends on the service and transaction value, and we will specify it before starting the work to ensure both parties understand the terms.
      - q: Can I contact you outside of Telegram?
        a: Yes, in addition to Telegram, you can call us or reach out via WhatsApp.
      - q: Where are you located?
        a: Our base is in Belgrade, from where we operate throughout Serbia. Our specialists work on-site in Germany, Spain, Switzerland, and other European countries.
      - q: Is the consultation fee-based?
        a: No. We will discuss your issue and honestly tell you if it can fit within your budget. The cost of work will be given before we start, and it won't change afterward.
    cityExpert:
      q: Is there a dedicated expert in each city?
      a: Different experts work in different cities; in certain cases, an expert can travel to a neighboring city in the region.
  sr:
    vehicle-sourcing:
      - q: Koliko traje ceo proces, od prijave do automobila kod klijenta?
        a: U proseku 3–14 dana, u zavisnosti od brzine pronalaska odgovarajuće ponude na tržištu.
      - q: Ako pronađeni automobil nije odgovarajući, da li nastavljate da tražite besplatno?
        a: Da, nastavljamo pretragu bez dodatne naknade, sve dok ne nađemo ono što vam odgovara.
      - q: Da li je potrebno da sami odete da pogledate automobil?
        a: Ne, nije obavezno, možemo obaviti celu transakciju bez vašeg prisustva. Da li želite da dođete i pogledate sami? Takođe nema problema.
      - q: Da li šaljete foto- ili video izveštaj o automobilu pre donošenja odluke?
        a: Da, šaljemo detaljan izveštaj sa fotografijama automobila, pre nego što donesete odluku o kupovini.
      - q: Postoji li naknada ako su rokovi probijeni vašom krivicom?
        a: Nema fiksne kazne, rok transakcije često zavisi ne samo od nas (pregovori sa prodavcem, priprema dokumentacije). Ali odmah navodimo realističan rok i ne odugovlačimo.
    vehicle-import:
      - q: Čime se razlikuje uvoz od autoprovere?
        a: Automobilski odabir je potreban kada se nalazite u istoj zemlji kao i automobil. Uvoz je potreban kada automobil dolazi u Srbiju iz Evrope ili Kine.
      - q: Da li je carina uključena u cenu?
        a: Da, pratimo carinjenje u Srbiji i uključujemo ga u proračun. Konačnu sumu navodimo pre transakcije.
      - q: Koliko je automobil 'ključ u ruke' skuplji od cene u oglasu?
        a: Razlika zavisi od zemlje, starosti automobila i prisustva sertifikata EUR1. Ukupnu sumu računamo i utvrđujemo pre početka. Na primer, u jednom od naših poslova BMW X1 je u Nemačkoj koštao 39 860 €, a sa svim troškovima, isporukom, carinjenjem i dokumentacijom u Srbiji, izašao je 46 000 €.
      - q: Šta je potrebno da se registrovani automobil uveze u Srbiji?
        a: Automobil se može registrovati na vas u Srbiji samo nakon dobijanja boravišne dozvole, tako da je odabir najbolje započeti kada su dokumenti već u vašim rukama. Carinjenje se vrši u Subotici, nakon čega dostavljamo automobil do vašeg grada i pratimo registraciju.
    vehicle-buyback:
      - q: Za koliko dana se može prodati automobil, ako još nije carinjen ili preregistrovan?
        a: Obično 1–2 dana, čak i ako automobil još nije carinjen ili preregistrovan na vas.
      - q: Otkupljujete li automobile u kreditu ili zaostavštini?
        a: Ne, otkupljujemo samo automobile bez aktivnog kredita ili zaloga.
      - q: Kako brzo dolazi novac posle pregleda?
        a: Na dan potpisivanja ugovora, odmah nakon pregleda, ako se opis poklapa.
      - q: Da li postoje ograničenja po marki, godini ili pređenim kilometrima?
        a: 'Da: ne razmatramo automobile u lošem tehničkom stanju i francuske marke. Ova ograničenja se primenjuju samo na otkup: možemo vam i dalje pronaći Peugeot ili Renault.'
      - q: Šta se dešava sa automobilom nakon otkupa?
        a: 'Dalje je naša odgovornost: transport i prodaju organizujemo mi. Automobili sa srpskim registrom obično se prodaju na tržištu u Beogradu, dok automobile sa ruskim registrom izvozimo i prodajemo u Rusiji.'
    vehicle-inspection:
      - q: Koliko košta provera i da li je cena ista u svim zemljama?
        a: Cena se razlikuje po zemljama i zavisi od obima provere, tačnu cifru navodimo prilikom prijavljivanja.
      - q: Može li se naručiti provera ako fizički niste u toj zemlji?
        a: Da, vaše prisustvo nije obavezno. Izveštaj i odluku dobijate na daljinu.
      - q: U kom formatu je izveštaj?
        a: Fotografije i detaljan tekstualni opis nakon pregleda.
      - q: Šta će se dogoditi ako provera pokazuje da automobil nije pogodan za kupovinu?
        a: 'Dobijate izveštaj sa fotografijama i direktnim odgovorom ‘ne uzimajte’ i gubite trošak provere, a ne novac za automobil. Izveštaj ostaje kod vas, a ako se ipak odlučite da kupite, uočena zameranja mogu poslužiti kao argument u pregovorima: na jednoj od naših provera u Srbiji ovo je smanjilo cenu za 700 evra.'
    general:
      - q: Kako se plaća posao?
        a: Deo iznosa se plaća unapred, a ostatak po završetku. Iznos akontacije zavisi od usluge i vrednosti transakcije, navodimo ga pred početak radova, kako bi uslovi bili jasni obema stranama.
      - q: Može li se pisati i mimo Telegrama?
        a: Da, osim Telegrama dostupni su pozivi i WhatsApp.
      - q: Gde se nalazite?
        a: Naša baza se nalazi u Beogradu, odatle izlazimo po celoj Srbiji. U Nemačkoj, Španiji, Švajcarskoj i drugim zemljama Evrope rade naši stručnjaci na terenu.
      - q: Da li je konsultacija naplatna?
        a: Ne. Razgovaraćemo o problemu i reći ćemo vam iskreno da li je moguće uklopiti se u vaš budžet. Cenu usluge navodimo pre početka, i nakon toga se ne menja.
    cityExpert:
      q: Da li u svakom gradu postoji svoj dodeljeni ekspert?
      a: U raznim gradovima rade naši specijalisti; u pojedinim slučajevima ekspert odlazi u susedni grad regiona.
  es:
    vehicle-sourcing:
      - q: ¿Cuánto tiempo toma todo el proceso, desde la solicitud hasta que el coche llega al cliente?
        a: En promedio de 3 a 14 días, dependiendo de la rapidez con la que se encuentre una opción adecuada en el mercado.
      - q: Si el coche encontrado no es adecuado, ¿siguen buscando de forma gratuita?
        a: Sí, continuamos buscando sin costo adicional hasta que encontremos lo que le convenga.
      - q: ¿Es necesario ir a ver el coche personalmente?
        a: No, no es necesario, podemos llevar a cabo toda la transacción sin su presencia. ¿Desea venir a ver el coche por sí mismo? También sin problema.
      - q: ¿Proporcionan un informe fotográfico o de video del coche antes de tomar una decisión?
        a: Sí, se proporciona un informe completo con fotos del coche, antes de que usted tome la decisión de compra.
      - q: ¿Hay compensación si los plazos se rompen por su culpa?
        a: No hay una penalización fija, el plazo de la transacción a menudo depende no solo de nosotros (negociaciones con el vendedor, formalización de documentos). Pero establecemos un plazo realista desde el principio y no hacemos esperar.
    vehicle-import:
      - q: ¿En qué se diferencia la importación de la búsqueda de coches?
        a: La selección de vehículos es necesaria cuando está en el mismo país que el coche. El traslado es necesario cuando el coche viene a Serbia desde Europa o China.
      - q: ¿La aduana está incluida en el precio?
        a: Sí, asistimos con la aduana en Serbia y lo incluimos en el cálculo. La cantidad final se indica antes de la transacción.
      - q: ¿Cuánto más cuesta el coche 'llave en mano' en comparación con el precio del anuncio?
        a: La diferencia depende del país, la edad del coche y la disponibilidad del certificado EUR1. Calculamos y fijamos la cantidad total antes de comenzar. Como referencia, en uno de nuestros negocios, un BMW X1 costó en Alemania 39,860 €, y todo incluido en Serbia, con todos los gastos, entrega, aduana y documentación, salió en 46,000 €.
      - q: ¿Qué se necesita para registrar un coche importado en Serbia?
        a: Solo puede registrar el coche a su nombre en Serbia después de obtener el permiso de residencia, por lo que es recomendable comenzar la búsqueda cuando ya tiene los documentos. La aduana se realiza en Subotica, luego traemos el coche a su ciudad y lo acompañamos al registro.
    vehicle-buyback:
      - q: ¿En cuántos días se puede vender un coche si aún no ha sido nacionalizado o re-registrado?
        a: Por lo general, de 1 a 2 días, incluso si el coche aún no ha sido nacionalizado o re-registrado a su nombre.
      - q: ¿Compran coches que están en crédito o con garantía?
        a: No, solo compramos coches que no tienen crédito o garantías vigentes.
      - q: ¿Qué tan rápido se recibe el dinero después de la inspección?
        a: El mismo día de la firma del contrato, inmediatamente después de la inspección, si la descripción coincide.
      - q: ¿Hay restricciones en cuanto a marca, año o kilometraje?
        a: 'Sí: no consideramos coches en mal estado técnico ni marcas francesas. Esta restricción solo se aplica a la compra: aún podemos seleccionar un Peugeot o Renault para usted.'
      - q: ¿Qué pasa con el coche después de la compra?
        a: 'A partir de ahí, tenemos el control: organizamos el transporte y la venta. Los coches con matrícula serbia generalmente se venden en el mercado de Belgrado, mientras que los coches con matrícula rusa los exportamos y vendemos en Rusia.'
    vehicle-inspection:
      - q: ¿Cuánto cuesta la inspección y es el mismo precio en todos los países?
        a: El costo varía según el país y depende del alcance de la inspección, le daremos una cifra exacta al momento de la solicitud.
      - q: ¿Se puede solicitar una inspección si no se está físicamente en ese país?
        a: Sí, su presencia no es obligatoria. Recibe el informe y la decisión de manera remota.
      - q: ¿En qué formato es el informe?
        a: Fotos y una descripción detallada en texto tras la inspección.
      - q: ¿Qué sucederá si la inspección indica que no es recomendable comprar el coche?
        a: "Recibe un informe con fotos y una respuesta directa de 'no lo compre' y pierde el costo de la inspección, no el dinero por el coche. El informe se queda con usted, y si decide comprar, las observaciones encontradas sirven como argumento en la negociación: en una de nuestras inspecciones en Serbia, esto redujo el precio en 700 euros."
    general:
      - q: ¿Cómo se paga por los servicios?
        a: Se realiza un pago por adelantado, el resto se paga a la entrega. El monto del anticipo depende del servicio y de la suma de la transacción, lo establecemos antes de comenzar el trabajo para que las condiciones sean claras para ambas partes.
      - q: ¿Se puede escribir por otros medios que no sean Telegram?
        a: Sí, además de Telegram, se pueden hacer llamadas y usar WhatsApp.
      - q: ¿Dónde están ubicados?
        a: Nuestra base está en Belgrado, desde allí nos desplazamos por toda Serbia. En Alemania, España, Suiza y otros países de Europa, nuestros especialistas trabajan in situ.
      - q: ¿La consulta tiene costo?
        a: No. Discutiremos su caso y le diremos honestamente si es posible ajustarse a su presupuesto. Le indicamos el costo del trabajo antes de comenzar y luego no cambia.
    cityExpert:
      q: ¿Hay un experto designado en cada ciudad?
      a: En diferentes ciudades trabajan nuestros especialistas; en casos específicos, el experto puede desplazarse a una ciudad vecina de la región.
  de:
    vehicle-sourcing:
      - q: Wie lange dauert der gesamte Prozess, vom Antrag bis zum Fahrzeug beim Kunden?
        a: In der Regel 3–14 Tage, je nachdem, wie schnell wir eine passende Option auf dem Markt finden.
      - q: Wenn das gefundene Auto nicht geeignet ist, suchen Sie dann kostenlos weiter?
        a: Ja, wir setzen die Suche ohne zusätzliche Kosten fort, bis wir etwas finden, das Ihren Vorstellungen entspricht.
      - q: Muss man selbst zum Auto fahren, um es anzusehen?
        a: Nein, es ist nicht notwendig, wir können den gesamten Deal ohne Ihre Anwesenheit abwickeln. Möchten Sie selbst vorbeikommen und sich alles ansehen? Auch kein Problem.
      - q: Erhalten Sie einen Foto- oder Videobericht über das Fahrzeug, bevor eine Entscheidung getroffen wird?
        a: Ja, Sie erhalten einen vollständigen Bericht mit Fotos des Fahrzeugs, bevor Sie eine Kaufentscheidung treffen.
      - q: Gibt es eine Entschädigung, wenn die Fristen durch Ihr Verschulden überschritten werden?
        a: Es gibt keine feste Vertragsstrafe, die Dauer des Deals hängt oft nicht nur von uns ab (Verhandlungen mit dem Verkäufer, Dokumentenbearbeitung). Wir nennen jedoch sofort einen realistischen Zeitrahmen und ziehen nichts in die Länge.
    vehicle-import:
      - q: Was ist der Unterschied zwischen Import und Autowahl?
        a: Autowahl ist nötig, wenn Sie sich im gleichen Land wie das Fahrzeug befinden. Der Transport ist erforderlich, wenn das Auto aus Europa oder China nach Serbien kommt.
      - q: Ist die Zollabfertigung im Preis enthalten?
        a: Ja, wir unterstützen Sie bei der Zollabwicklung in Serbien und beziehen dies in die Kosten ein. Den Gesamtbetrag nennen wir vor dem Deal.
      - q: Wie viel teurer ist das Auto „schlüsselfertig“ im Vergleich zum angegebenen Preis?
        a: 'Der Unterschied hängt vom Land, dem Alter des Fahrzeugs und dem Vorhandensein eines EUR1-Zertifikats ab. Den Gesamtbetrag berechnen und fixieren wir vor Beginn. Zum Vergleich: In einem unserer Deals kostete ein BMW X1 in Deutschland 39.860 €, während der Endpreis in Serbien, inklusive aller Kosten, Lieferung, Zoll und Registrierung, 46.000 € betrug.'
      - q: Was ist notwendig, um das importierte Fahrzeug in Serbien zuzulassen?
        a: Ein Fahrzeug kann in Serbien nur nach Erhalt des Aufenthaltsgenehmigung auf den eigenen Namen registriert werden, daher macht es Sinn, die Suche zu beginnen, wenn die Dokumente vorliegen. Die Zollabwicklung erfolgt in Subotica, danach bringen wir das Auto in Ihre Stadt und unterstützen Sie bei der Zulassung.
    vehicle-buyback:
      - q: Wie viele Tage benötigt man, um ein Auto zu verkaufen, wenn es noch nicht verzollt oder umgemeldet ist?
        a: In der Regel 1–2 Tage, selbst wenn das Fahrzeug noch nicht verzollt oder nicht auf Sie umgeschrieben ist.
      - q: Kaufen Sie Autos mit Krediten oder Pfandrechten?
        a: Nein, wir kaufen nur Fahrzeuge ohne laufenden Kredit oder Pfand.
      - q: Wie schnell kommt das Geld nach der Inspektion?
        a: Am Tag der Vertragsunterzeichnung, sofort nach der Inspektion, sofern die Beschreibung übereinstimmt.
      - q: Gibt es Einschränkungen hinsichtlich Marke, Baujahr oder Kilometerstand?
        a: 'Ja: Wir kaufen keine Fahrzeuge in schlechtem technischen Zustand und französische Marken. Diese Einschränkung gilt nur für den Ankauf: Die Auswahl of Peugeot oder Renault können wir weiterhin anbieten.'
      - q: Was passiert mit dem Auto nach dem Ankauf?
        a: 'Danach kümmern wir uns darum: Transport und Verkauf organisieren wir selbst. Autos mit serbischen Kennzeichen werden normalerweise auf dem Markt in Belgrad verkauft, Fahrzeuge mit russischen Kennzeichen exportieren wir und realisieren sie in Russland.'
    vehicle-inspection:
      - q: Was kostet die Inspektion und ist der Preis in allen Ländern gleich?
        a: Die Kosten variieren je nach Land und hängen vom Umfang der Prüfung ab, die genaue Zahl nennen wir bei der Anfrage.
      - q: Kann eine Inspektion bestellt werden, wenn Sie physisch nicht in diesem Land sind?
        a: Ja, Ihre Anwesenheit ist nicht erforderlich. Den Bericht und die Entscheidung erhalten Sie online.
      - q: In welcher Form liegt der Bericht vor?
        a: Fotos und eine detaillierte Textbeschreibung nach der Inspektion.
      - q: Was passiert, wenn die Inspektion zeigt, dass das Auto nicht gekauft werden sollte?
        a: 'Sie erhalten einen Bericht mit Fotos und eine klare Antwort „nicht kaufen“. Sie verlieren die Kosten der Prüfung, nicht das Geld für das Auto. Der Bericht bleibt bei Ihnen, und wenn Sie sich entscheiden, den Wagen doch zu kaufen, helfen die festgestellten Mängel als Argument im Preisverhandeln: Bei einer unserer Inspektionen in Serbien konnte der Preis um 700 Euro gesenkt werden.'
    general:
      - q: Wie wird die Arbeit bezahlt?
        a: Ein Teil des Betrags wird als Vorauszahlung geleistet, der Rest nach Erhalt. Die Höhe der Vorauszahlung hängt von der Dienstleistung und der Deal-Summe ab, wir nennen sie vor Beginn der Arbeiten, damit beide Seiten die Bedingungen verstehen.
      - q: Kann ich auch anders als über Telegram schreiben?
        a: Ja, neben Telegram sind auch Anrufe und WhatsApp verfügbar.
      - q: Wo sind Sie ansässig?
        a: Unser Standort ist in Belgrad, von dort aus fahren wir in ganz Serbien. In Deutschland, Spanien, der Schweiz und anderen europäischen Ländern arbeiten unsere Spezialisten vor Ort.
      - q: Ist die Beratung kostenpflichtig?
        a: Nein. Wir besprechen Ihr Anliegen und sagen ehrlich, ob wir in Ihr Budget passen können. Die Kosten für die Arbeit nennen wir vor dem Start, sie ändern sich dann nicht.
    cityExpert:
      q: Gibt es in jeder Stadt einen festgelegten Experten?
      a: In verschiedenen Städten arbeiten unterschiedliche Spezialisten von uns; in einigen Fällen reist ein Experte in eine benachbarte Stadt der Region.
