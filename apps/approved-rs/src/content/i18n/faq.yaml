vehicle-sourcing:
  - q: Сколько занимает весь процесс — от заявки до машины у клиента?
    a: В среднем 3–14 дней — зависит от того, как быстро находится подходящий вариант на рынке.
  - q: Если найденная машина не подошла, продолжаете искать бесплатно?
    a: Да, продолжаем поиск без доплаты, пока не найдём то, что вам подходит.
  - q: Нужно ли самому ехать смотреть машину?
    a: Нет, необязательно — можем провести всю сделку без вашего присутствия. Хотите приехать и посмотреть сами — тоже без проблем.
  - q: Какая гарантия на найденный автомобиль?
    a: 'Формальной гарантии производителя, как на новый автомобиль, нет — это вторичный рынок. Ваша защита — независимая техническая проверка перед покупкой: машину осматривает эксперт, а не вы «вслепую».'
  - q: Даёте ли фото- или видеоотчёт по машине до принятия решения?
    a: Да, полный отчёт с фото по машине — до того, как вы принимаете решение о покупке.
  - q: Есть компенсация, если сроки сорваны по вашей вине?
    a: Фиксированной неустойки нет — срок сделки часто зависит не только от нас (переговоры с продавцом, оформление документов). Но называем реалистичный срок сразу и не тянем время.
vehicle-import:
  - q: Чем привоз отличается от автоподбора?
    a: Автоподбор — когда вы находитесь в той же стране, что и автомобиль. Привоз — когда машина едет к вам в Сербию из Европы или Китая.
  - q: Растаможка входит в стоимость?
    a: Да, сопровождаем растаможку в Сербии и включаем её в расчёт — итоговую сумму называем до сделки.
  - q: Насколько машина «под ключ» дороже цены в объявлении?
    a: 'Разница зависит от страны, возраста автомобиля и наличия сертификата EUR1 — полную сумму мы считаем и фиксируем до старта. Для ориентира: в одной из наших сделок BMW X1 стоил в Германии 39 860 €, а под ключ в Сербии, со всеми расходами, доставкой, растаможкой и оформлением, вышел в 46 000 €.'
  - q: Что нужно, чтобы поставить привезённую машину на учёт в Сербии?
    a: Оформить автомобиль на себя в Сербии можно только после получения ВНЖ, поэтому подбор имеет смысл начинать, когда документы уже на руках. Растаможка проходит в Суботице, после неё мы довозим машину до вашего города и сопровождаем постановку на учёт.
vehicle-buyback:
  - q: За сколько дней можно продать машину, если она ещё не растаможена или не переоформлена?
    a: Обычно 1–2 дня, даже если машина ещё не растаможена или не переоформлена на вас.
  - q: Выкупаете машину в кредите или залоге?
    a: Нет, выкупаем только автомобили без действующего кредита или залога.
  - q: Как быстро приходят деньги после осмотра?
    a: В день подписания договора — сразу после осмотра, если описание совпало.
  - q: Есть ограничения по марке, году или пробегу?
    a: 'Да — не рассматриваем автомобили в плохом техническом состоянии и французские марки. Это ограничение только на выкуп: подобрать вам Peugeot или Renault мы по-прежнему можем.'
  - q: Что происходит с машиной после выкупа?
    a: 'Дальше она наша забота: транспортировку и продажу организуем мы сами. Машины на сербских номерах обычно уходят на рынке в Белграде, автомобили на российских номерах мы вывозим и реализуем в России.'
vehicle-inspection:
  - q: Сколько стоит проверка и одинакова ли цена во всех странах?
    a: Стоимость отличается по странам и зависит от объёма проверки — точную цифру назовём при заявке.
  - q: Можно заказать проверку, если вас физически нет в этой стране?
    a: Да, ваше присутствие не обязательно — отчёт и решение получаете удалённо.
  - q: В каком виде отчёт?
    a: Фото и подробное текстовое описание по итогам осмотра.
  - q: Что будет, если проверка покажет, что машину брать не стоит?
    a: 'Вы получаете отчёт с фото и прямой ответ «не берите» — и теряете стоимость проверки, а не деньги за машину. Отчёт остаётся у вас, и если вы всё-таки решите брать, найденные замечания работают как аргумент в торге: на одном из наших осмотров в Сербии это снизило цену на 700 евро.'
general:
  - q: Как оплачивается работа?
    a: Часть суммы — предоплата, остальное по факту. Размер предоплаты зависит от услуги и суммы сделки — называем его до начала работ, чтобы условия были понятны обеим сторонам.
  - q: Можно написать не в Telegram?
    a: Да, помимо Telegram доступны звонки и WhatsApp.
  - q: Где вы находитесь?
    a: База — Белград, оттуда выезжаем по всей Сербии. В Германии, Испании, Швейцарии и других странах Европы работают наши специалисты на месте.
  - q: Консультация платная?
    a: Нет. Обсудим задачу и скажем честно, реально ли уложиться в ваш бюджет. Стоимость работы называем до старта, и потом она не меняется.
cityExpert:
  q: В каждом городе есть свой выделенный эксперт?
  a: В разных городах работают разные наши специалисты; в отдельных случаях эксперт выезжает в соседний город региона.
translations:
  en:
    vehicle-sourcing:
      - q: How long does the entire process take — from application to the car in the client's hands?
        a: On average, it takes 3–14 days — depending on how quickly we can find a suitable option in the market.
      - q: If the found car doesn't meet my expectations, do you continue the search for free?
        a: Yes, we will continue searching at no extra cost until we find something that works for you.
      - q: Do I need to go see the car myself?
        a: No, it's not necessary — we can handle the entire transaction without your presence. If you'd like to come see it yourself, that's also not a problem.
      - q: What guarantee is there on the vehicle found?
        a: "There is no formal manufacturer’s warranty like on a new car — this is the secondary market. Your protection comes from an independent technical inspection before purchase: the car is assessed by an expert, rather than you doing it 'blindly.'"
      - q: Do you provide photo or video reports of the car before a decision is made?
        a: Yes, you will receive a complete report with photos of the car before you decide to make a purchase.
      - q: Is there compensation if deadlines are missed due to your fault?
        a: There is no fixed penalty — the duration of a deal often depends on factors beyond our control (negotiations with the seller, document processing). However, we provide a realistic timeframe from the outset and don't delay the process.
    vehicle-import:
      - q: What is the difference between import and vehicle sourcing?
        a: Vehicle sourcing is when you are in the same country as the car. Importing is when the vehicle is coming to you in Serbia from Europe or China.
      - q: Is customs clearance included in the cost?
        a: Yes, we assist with customs clearance in Serbia and include this in our calculations — the final amount is provided before the transaction.
      - q: How much more expensive is the 'turnkey' price compared to the price in the listing?
        a: "The difference depends on the country, the age of the vehicle, and whether there's an EUR1 certificate — we calculate and confirm the total amount before starting. For reference: in one of our deals, a BMW X1 cost €39,860 in Germany, while the all-inclusive price in Serbia, including all expenses, delivery, customs clearance, and documentation, came to €46,000."
      - q: What is required to register the imported car in Serbia?
        a: You can only register the car in your name in Serbia after obtaining a residency permit, so it's best to start the sourcing process once you have the documents in hand. Customs clearance takes place in Subotica, and afterwards, we deliver the car to your city and assist with the registration process.
    vehicle-buyback:
      - q: How many days does it take to sell a car if it is not yet cleared through customs or re-registered?
        a: Usually 1–2 days, even if the car hasn’t yet cleared customs or been re-registered to your name.
      - q: Do you buy cars that are under loan or collateral?
        a: No, we only buy cars without an active loan or collateral.
      - q: How quickly does the money arrive after the inspection?
        a: On the day the contract is signed — immediately after the inspection, if the description matches.
      - q: Are there any restrictions based on brand, year, or mileage?
        a: 'Yes — we do not consider vehicles in poor technical condition or French brands. This restriction only applies to buyback: we can still help you source a Peugeot or Renault.'
      - q: What happens to the car after the buyback?
        a: 'From then on, it’s our responsibility: we handle transportation and sales ourselves. Cars with Serbian plates typically sell in the Belgrade market, while those with Russian plates are exported and sold in Russia.'
    vehicle-inspection:
      - q: How much does the inspection cost and is the price the same in all countries?
        a: The cost varies by country and depends on the scope of the inspection — we will provide the exact figure upon your request.
      - q: Can I order an inspection if I'm not physically present in that country?
        a: Yes, your presence is not necessary — you will receive the report and findings remotely.
      - q: What format does the report come in?
        a: It includes photos and a detailed textual description of the inspection results.
      - q: What happens if the inspection reveals that the car is not worth buying?
        a: 'You receive a report with photos and a clear recommendation not to buy — and you lose only the inspection fee, not the money for the car. The report remains with you, and if you decide to proceed, the noted issues can serve as bargaining chips: in one of our inspections in Serbia, this reduced the price by 700 euros.'
    general:
      - q: How is your service paid for?
        a: A portion of the total amount is a deposit, with the remainder due upon completion. The deposit amount varies depending on the service and the deal size — we specify it before starting the work to ensure that the terms are clear to both parties.
      - q: Can I contact you in ways other than Telegram?
        a: Yes, in addition to Telegram, you can also call us or reach out via WhatsApp.
      - q: Where are you located?
        a: Our base is in Belgrade, from where we operate throughout Serbia. In Germany, Spain, Switzerland, and other European countries, our specialists work on-site.
      - q: Is the consultation paid?
        a: No. We will discuss your needs and honestly tell you whether it's feasible to meet your budget. We will provide the cost of our service before starting, and it does not change.
    cityExpert:
      q: Is there a dedicated expert in every city?
      a: Different specialists work in different cities; in some cases, an expert travels to a neighboring city in the region.
  sr:
    vehicle-sourcing:
      - q: Koliko traje ceo proces — od prijave do automobila kod klijenta?
        a: U proseku 3–14 dana — zavisi od toga koliko brzo nađemo odgovarajući auto na tržištu.
      - q: Ako pronađeni auto ne odgovara, da li kontinuirate pretragu besplatno?
        a: Da, nastavljamo potragu bez dodatnih troškova, sve dok ne nađemo automobil koji vam odgovara.
      - q: Da li je potrebno da sami idete da gledate auto?
        a: Ne, nije obavezno — možemo da obavimo celu transakciju bez prisustva. Ako želite da dođete i pogledate, nema problema.
      - q: Kakva je garancija na pronađeni automobil?
        a: "Formalna garancija proizvođača, kao na novom automobilu, ne postoji — to je sekundarno tržište. Vaša zaštita je nezavisna tehnička provera pre kupovine: auto pregleda ekspert, a ne vi 'naslepo'."
      - q: Da li šaljete foto- ili video izveštaj o automobilu pre donošenja odluke?
        a: Da, šaljemo kompletan izveštaj sa fotografijama automobila — pre nego što donesete odluku o kupovini.
      - q: Da li postoji kompenzacija ako su rokovi probijeni vašom krivicom?
        a: Nema fiksne kazne — trajanje transakcije često zavisi ne samo od nas (pregovaranje s prodavcem, sređivanje dokumentacije). Ali maksimalni rok nazivamo odmah i ne odugovlačimo.
    vehicle-import:
      - q: Šta se razlikuje između uvoza i izbor automobila?
        a: Izbor automobila — kada ste u istoj zemlji kao i auto. Uvoz — kada automobil dolazi iz Evrope ili Kine u Srbiju.
      - q: Da li je carina uključena u cenu?
        a: Da, pratimo carinjenje u Srbiji i uključujemo to u obračun — konačnu sumu saopštavamo pre transakcije.
      - q: Koliko je automobil "ključ u ruke" skuplji od cene u oglasu?
        a: 'Razlika zavisi od zemlje, starosti automobila i prisustva sertifikata EUR1 — punu sumu izračunavamo i fiksiramo pre početka. Za informaciju: u jednom od naših poslova, BMW X1 je koštao 39 860 € u Nemačkoj, a sa svim troškovima, dostavom, carinjenjem i dokumentacijom, njegov odvod u Srbiji je bio 46 000 €.'
      - q: Šta vam je potrebno da registrovate doneti automobil u Srbiji?
        a: Automobil se može registrovati u Srbiji tek nakon dobijanja boravišne ili radne dozvole, stoga ima smisla početi sa izborom kada su dokumenti već u rukama. Carinjenje se vrši u Subotici, nakon čega vam dostavljamo automobil do vašeg grada i pratimo registraciju.
    vehicle-buyback:
      - q: Za koliko dana mogu prodati auto, ako još nije carinjen ili prepisan?
        a: Obično 1–2 dana, čak i ako automobil još nije carinjen ili prepisan na vas.
      - q: Da li otkupljujete automobile u kreditu ili zalogu?
        a: Ne, otkupljujemo samo automobile bez važećeg kredita ili zaloge.
      - q: Kako brzo dolaze novci nakon provere?
        a: Na dan potpisivanja ugovora — odmah nakon provere, ako se opis poklapa.
      - q: Postoje li ograničenja po markama, godini ili pređenim kilometrima?
        a: 'Da — ne razmatramo automobile u lošem tehničkom stanju i francuske marke. Ovo ograničenje važi samo za otkup: možemo vam i dalje pronaći Peugeot ili Renault.'
      - q: Šta se dešava s automobilom nakon otkupa?
        a: 'Dalje je to naša briga: organizujemo transport i prodaju. Automobili sa srpskim registarskim tablicama obično se prodaju na tržištu u Beogradu, dok automobile sa ruskim registarskim tablicama iznosimo i prodajemo u Rusiji.'
    vehicle-inspection:
      - q: Koliko košta provera i da li je cena ista u svim zemljama?
        a: Cena se razlikuje od zemlje do zemlje i zavisi od obima provere — tačnu cifru nazivamo prilikom prijave.
      - q: Da li mogu naručiti provere ako nisam fizički prisutan u toj zemlji?
        a: Da, vaše prisustvo nije obavezno — izveštaj i odluku dobijate na daljinu.
      - q: U kakvom formatu je izveštaj?
        a: Fotografije i detaljan tekstualni opis po završetku provere.
      - q: Šta će se desiti ako provera pokaže da auto nije dobar za kupovinu?
        a: 'Dobijate izveštaj sa fotografijama i jasan odgovor „nemojte kupovati” — gubite samo trošak provere, a ne novac za automobil. Izveštaj ostaje kod vas, i ako se ipak odlučite da kupite, uočene nedostatke možete koristiti kao argument za snižavanje cene: u jednom od naših pregleda u Srbiji, to je oborilo cenu za 700 evra.'
    general:
      - q: Kako se plaća rad?
        a: Deo iznosa — avans, ostatak po izvršenju. Visina avansa zavisi od usluge i iznosa posla — navodimo ga pre početka radova, kako bi uslovi bili jasni obe strane.
      - q: Da li mogu pisati ne preko Telegrama?
        a: Da, osim Telegrama, moguće su pozivi i WhatsApp.
      - q: Gde se nalazite?
        a: Osnovna lokacija — Beograd, odakle delujemo širom Srbije. U Nemačkoj, Španiji, Švajcarskoj i drugim zemljama Evrope rade naši stručnjaci na terenu.
      - q: Da li je konsultacija plaćena?
        a: Ne. Razgovaraćemo o zadatku i iskreno reći da li možemo da se uklopimo u vaš budžet. Cenu rada ćemo navesti pre početka, i ona se nakon toga ne menja.
    cityExpert:
      q: Da li u svakom gradu postoji svoj dodeljeni ekspert?
      a: U različitim gradovima rade različiti naši stručnjaci; u posebnim slučajevima ekspert može otići u obližnji grad regiona.
  es:
    vehicle-sourcing:
      - q: ¿Cuánto tiempo lleva todo el proceso, desde la solicitud hasta que el coche está con el cliente?
        a: En promedio de 3 a 14 días, dependiendo de qué tan rápido encontremos una opción adecuada en el mercado.
      - q: Si el coche encontrado no es el adecuado, ¿siguen buscando sin costo adicional?
        a: Sí, continuamos la búsqueda sin cargo adicional hasta que encontremos algo que te convenga.
      - q: ¿Es necesario ir a ver el coche personalmente?
        a: No, no es necesario; podemos llevar a cabo toda la transacción sin tu presencia. Si deseas venir a verlo tú mismo, también está bien.
      - q: ¿Qué garantía hay sobre el coche encontrado?
        a: "No hay una garantía formal del fabricante como en un coche nuevo, ya que es un mercado de segunda mano. Tu protección es una verificación técnica independiente antes de la compra: un experto revisa el coche, no lo haces tú 'a ciegas'."
      - q: ¿Proporcionan un informe fotográfico o en video sobre el coche antes de tomar una decisión?
        a: Sí, un informe completo con fotos del coche se proporciona antes de que tomes la decisión de compra.
      - q: ¿Hay compensación si los plazos se incumplen debido a su culpa?
        a: No hay una penalización fija; la duración del trato a menudo depende de factores que no están solo en nuestras manos (negociaciones con el vendedor, formalización de documentos). Sin embargo, indicamos un plazo realista desde el principio y no retrasamos el proceso.
    vehicle-import:
      - q: ¿En qué se diferencia la importación de la selección de coches?
        a: La selección de coches es cuando estás en el mismo país que el coche. La importación es cuando el coche viene hacia ti en Serbia desde Europa o China.
      - q: ¿La aduana está incluida en el precio?
        a: Sí, acompañamos la aduana en Serbia e incluimos eso en el cálculo; el precio final se comunica antes de la transacción.
      - q: ¿Cuánto más caro es el coche 'llave en mano' en comparación con el precio del anuncio?
        a: 'La diferencia depende del país, la antigüedad del vehículo y la disponibilidad del certificado EUR1; el monto total lo calculamos y fijamos antes de comenzar. Como referencia: en uno de nuestros acuerdos, un BMW X1 costó en Alemania 39,860 €, mientras que en Serbia, lista para usar, con todos los gastos, entrega, despacho de aduanas y trámites, salió por 46,000 €.'
      - q: ¿Qué se necesita para registrar el coche importado en Serbia?
        a: Puedes registrar el coche a tu nombre en Serbia solo después de obtener el permiso de residencia, así que tiene sentido comenzar la selección cuando ya tienes los documentos. La aduana se realiza en Subotica, después de lo cual llevamos el coche a tu ciudad y te ayudamos con el registro.
    vehicle-buyback:
      - q: ¿Cuántos días tardan en vender un coche si aún no ha pasado por la aduana o no está transferido a tu nombre?
        a: Normalmente de 1 a 2 días, incluso si el coche aún no ha sido despachado o transferido a ti.
      - q: ¿Compran coches que están en crédito o en garantía?
        a: No, compramos solo coches sin crédito o garantía activos.
      - q: ¿Qué tan rápido llegan los fondos después de la inspección?
        a: El mismo día de la firma del contrato, inmediatamente después de la inspección, si la descripción coincide.
      - q: ¿Hay restricciones en cuanto a la marca, el año o el kilometraje?
        a: Sí, no consideramos coches en mal estado técnico y marcas francesas. Esta restricción es solo para la compra; aún podemos buscarte un Peugeot o Renault.
      - q: ¿Qué sucede con el coche después de la compra?
        a: 'Luego es nuestra responsabilidad: organizamos el transporte y la venta. Los coches con matrícula serbia normalmente se venden en el mercado de Belgrado, mientras que los coches con matrícula rusa los trasladamos y vendemos en Rusia.'
    vehicle-inspection:
      - q: ¿Cuánto cuesta la inspección y es el precio igual en todos los países?
        a: El costo varía según el país y depende del alcance de la inspección; te daremos un número exacto al momento de la solicitud.
      - q: ¿Se puede solicitar una inspección si no estás físicamente en ese país?
        a: Sí, tu presencia no es necesaria; recibes el informe y la decisión de forma remota.
      - q: ¿En qué formato es el informe?
        a: Fotos y una descripción detallada por escrito después de la inspección.
      - q: ¿Qué pasa si la inspección muestra que no vale la pena comprar el coche?
        a: "Recibes un informe con fotos y una respuesta directa 'no compres' — y solo pierdes el costo de la inspección, no el dinero del coche. El informe se queda contigo, y si decides comprar, las observaciones encontradas funcionan como argumentos en la negociación: en una de nuestras inspecciones en Serbia, esto redujo el precio en 700 euros."
    general:
      - q: ¿Cómo se paga por el trabajo?
        a: Una parte del importe es un anticipo, el resto se paga al finalizar. El monto del anticipo depende del servicio y la cantidad total de la transacción; lo comunicamos antes de comenzar para que ambas partes comprendan las condiciones.
      - q: ¿Puedo escribir por otro medio que no sea Telegram?
        a: Sí, además de Telegram, están disponibles las llamadas y WhatsApp.
      - q: ¿Dónde están ubicados?
        a: La base está en Belgrado, desde donde operamos en toda Serbia. En Alemania, España, Suiza y otros países de Europa trabajan nuestros especialistas en el lugar.
      - q: ¿La consulta tiene costo?
        a: No. Discutiremos tu situación y te diremos honestamente si es realista ajustarse a tu presupuesto. El costo del trabajo se comunica antes de comenzar, y luego no cambia.
    cityExpert:
      q: ¿Hay un experto designado en cada ciudad?
      a: En diferentes ciudades trabajan diferentes especialistas; en casos específicos, el experto puede desplazarse a una ciudad vecina de la región.
  de:
    vehicle-sourcing:
      - q: Wie lange dauert der gesamte Prozess – von der Anfrage bis zum Auto beim Kunden?
        a: In der Regel 3–14 Tage – es hängt davon ab, wie schnell ein passendes Angebot auf dem Markt gefunden wird.
      - q: Wenn das gefundene Auto nicht passt, suchen Sie weiterhin kostenlos?
        a: Ja, wir setzen die Suche kostenlos fort, bis wir etwas finden, das Ihnen zusagt.
      - q: Muss man das Auto selbst besichtigen?
        a: Nein, das ist nicht nötig – wir können den gesamten Deal ohne Ihre Anwesenheit abwickeln. Wenn Sie selbst kommen möchten, ist das auch kein Problem.
      - q: Welche Garantie gibt es auf das gefundene Fahrzeug?
        a: 'Eine formale Garantie des Herstellers wie bei einem Neuwagen gibt es nicht – das ist der Gebrauchtwagenmarkt. Ihr Schutz besteht in einer unabhängigen technischen Überprüfung vor dem Kauf: Das Auto wird von einem Experten begutachtet und nicht von Ihnen „blind“.'
      - q: Geben Sie einen Foto- oder Videobericht über das Auto vor der Kaufentscheidung?
        a: Ja, Sie erhalten einen vollständigen Bericht mit Fotos des Autos, bevor Sie eine Kaufentscheidung treffen.
      - q: Gibt es eine Entschädigung, wenn Fristen durch Ihr Verschulden überschritten werden?
        a: Es gibt keine feste Vertragsstrafe – die Dauer der Transaktion hängt oft nicht nur von uns ab (Verhandlungen mit dem Verkäufer, Dokumentenbearbeitung). Wir nennen jedoch sofort einen realistischen Zeitraum und ziehen die Dinge nicht in die Länge.
    vehicle-import:
      - q: Was ist der Unterschied zwischen Import und Fahrzeugsuche?
        a: Fahrzeugsuche bedeutet, dass Sie sich im selben Land wie das Auto befinden. Import bedeutet, dass das Auto aus Europa oder China nach Serbien kommt.
      - q: Ist die Zollabfertigung im Preis inbegriffen?
        a: Ja, wir unterstützen die Zollabfertigung in Serbien und inkludieren sie in die Berechnung – den endgültigen Betrag nennen wir vor Abschluss des Deals.
      - q: Wie viel teurer ist das Auto „schlüsselfertig“ im Vergleich zum Preis in der Anzeige?
        a: 'Der Preisunterschied hängt vom Land, dem Alter des Fahrzeugs und der Verfügbarkeit des EUR1-Zertifikats ab — die Gesamtsumme berechnen und fixieren wir vor dem Start. Zur Orientierung: In einem unserer Geschäfte kostete ein BMW X1 in Deutschland 39.860 €, während er schlüsselfertig in Serbien, inklusive aller Kosten, Lieferung, Zollabwicklung und Formalitäten, 46.000 € betrug.'
      - q: Was wird benötigt, um das importierte Auto in Serbien zuzulassen?
        a: Die Anmeldung des Fahrzeugs auf Ihren Namen in Serbien ist erst nach Erhalt des Aufenthaltstitels möglich, daher macht es Sinn, mit der Suche zu beginnen, wenn die Unterlagen bereits bereit sind. Die Zollabfertigung erfolgt in Subotica, danach bringen wir das Auto in Ihre Stadt und unterstützen die Zulassung.
    vehicle-buyback:
      - q: Wie viele Tage dauert es, ein Auto zu verkaufen, wenn es noch nicht verzollt oder umgemeldet ist?
        a: In der Regel 1–2 Tage, selbst wenn das Auto noch nicht verzollt oder noch nicht auf Sie umgemeldet ist.
      - q: Kaufen Sie Autos, die noch finanziert oder verpfändet sind?
        a: Nein, wir kaufen nur Fahrzeuge ohne aktive Finanzierung oder Pfandrechte.
      - q: Wie schnell bekommen Sie das Geld nach der Besichtigung?
        a: Am Tag der Unterzeichnung des Vertrages – sofort nach der Besichtigung, wenn die Beschreibung übereinstimmte.
      - q: Gibt es Einschränkungen bezüglich der Marke, dem Jahr oder dem Kilometerstand?
        a: 'Ja – wir betrachten keine Fahrzeuge in schlechtem technischen Zustand und französische Marken. Diese Einschränkung gilt nur für den Ankauf: Wir können Ihnen nach wie vor einen Peugeot oder Renault vermitteln.'
      - q: Was passiert mit dem Auto nach dem Kauf?
        a: 'Danach kümmern wir uns darum: Transport und Verkauf organisieren wir selbst. Autos mit serbischen Nummernschildern werden normalerweise auf dem Markt in Belgrad verkauft, während Fahrzeuge mit russischen Nummernschildern exportiert und in Russland verkauft werden.'
    vehicle-inspection:
      - q: Was kostet die Prüfung und ist der Preis in allen Ländern gleich?
        a: Die Kosten variieren je nach Land und hängen vom Umfang der Überprüfung ab – den genauen Betrag nennen wir bei der Anfrage.
      - q: Kann man eine Überprüfung anfordern, auch wenn man physisch nicht in diesem Land ist?
        a: Ja, Ihre Anwesenheit ist nicht erforderlich – den Bericht und die Entscheidung erhalten Sie remote.
      - q: In welcher Form ist der Bericht?
        a: Fotos und eine detaillierte schriftliche Beschreibung nach der Besichtigung.
      - q: Was passiert, wenn die Prüfung ergibt, dass man das Auto nicht kaufen sollte?
        a: 'Sie erhalten einen Bericht mit Fotos und die klare Antwort „nicht kaufen“ – und verlieren nur die Kosten für die Prüfung, nicht das Geld für das Auto. Der Bericht bleibt bei Ihnen, und wenn Sie sich dennoch entscheiden, zu kaufen, können die gefundenen Mängel als Argument für den Preisnachlass genutzt werden: In einer unserer Besichtigungen in Serbien reduzierte sich der Preis um 700 Euro.'
    general:
      - q: Wie wird die Arbeit bezahlt?
        a: Ein Teil des Betrags ist eine Anzahlung, der Rest wird nach der Durchführung fällig. Die Höhe der Anzahlung hängt von der Dienstleistung und der Summe des Deals ab – wir nennen diesen Betrag vor Beginn der Arbeiten, damit beide Seiten die Bedingungen verstehen.
      - q: Kann ich nicht über Telegram schreiben?
        a: Ja, neben Telegram sind auch Anrufe und WhatsApp verfügbar.
      - q: Wo befinden Sie sich?
        a: Die Basis ist in Belgrad, von dort aus fahren wir in ganz Serbien. In Deutschland, Spanien, der Schweiz und anderen europäischen Ländern arbeiten unsere Spezialisten vor Ort.
      - q: Ist eine Beratung kostenpflichtig?
        a: Nein. Wir besprechen die Aufgabe und sagen ehrlich, ob es realistisch ist, in Ihr Budget zu passen. Die Kosten der Arbeit nennen wir vor dem Start, und danach ändern sie sich nicht.
    cityExpert:
      q: Gibt es in jeder Stadt einen eigenen Experten?
      a: In verschiedenen Städten arbeiten unterschiedliche Spezialisten von uns; in einigen Fällen fährt ein Experte in eine benachbarte Stadt der Region.
