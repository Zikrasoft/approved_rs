vehicle-sourcing:
  - q: Сколько занимает весь процесс — от заявки до машины у клиента?
    a: В среднем 3–14 дней — зависит от того, как быстро находится подходящий вариант на рынке.
  - q: Если найденная машина не подошла, продолжаете искать бесплатно?
    a: Да, продолжаем поиск без доплаты, пока не найдём то, что вам подходит.
  - q: Нужно ли самому ехать смотреть машину?
    a: Нет, необязательно — можем провести всю сделку без вашего присутствия. Хотите приехать и посмотреть сами — тоже без проблем.
  - q: Даёте ли фото- или видеоотчёт по машине до принятия решения?
    a: Да, полный отчёт с фото по машине — до того, как вы принимаете решение о покупке.
  - q: Есть компенсация, если сроки сорваны по вашей вине?
    a: Фиксированной неустойки нет — срок сделки часто зависит не только от нас (переговоры с продавцом, оформление документов). Но называем реалистичный срок сразу и не тянем время.
vehicle-import:
  - q: Чем привоз отличается от автоподбора?
    a: Автоподбор — когда вы находитесь в той же стране, что и автомобиль. Привоз — когда машина едет к вам в Сербию из Европы или Китая.
  - q: Растаможка входит в стоимость?
    a: Да, сопровождаем растаможку в Сербии и включаем её в расчёт — итоговую сумму называем до сделки.
  - q: Насколько машина «под ключ» дороже цены в объявлении?
    a: 'Разница зависит от страны, возраста автомобиля и наличия сертификата EUR1 — полную сумму мы считаем и фиксируем до старта. Для ориентира: в одной из наших сделок BMW X1 стоил в Германии 39 860 €, а под ключ в Сербии, со всеми расходами, доставкой, растаможкой и оформлением, вышел в 46 000 €.'
  - q: Что нужно, чтобы поставить привезённую машину на учёт в Сербии?
    a: Оформить автомобиль на себя в Сербии можно только после получения ВНЖ, поэтому подбор имеет смысл начинать, когда документы уже на руках. Растаможка проходит в Суботице, после неё мы довозим машину до вашего города и сопровождаем постановку на учёт.
vehicle-buyback:
  - q: За сколько дней можно продать машину, если она ещё не растаможена или не переоформлена?
    a: Обычно 1–2 дня, даже если машина ещё не растаможена или не переоформлена на вас.
  - q: Выкупаете машину в кредите или залоге?
    a: Нет, выкупаем только автомобили без действующего кредита или залога.
  - q: Как быстро приходят деньги после осмотра?
    a: В день подписания договора — сразу после осмотра, если описание совпало.
  - q: Есть ограничения по марке, году или пробегу?
    a: 'Да — не рассматриваем автомобили в плохом техническом состоянии и французские марки. Это ограничение только на выкуп: подобрать вам Peugeot или Renault мы по-прежнему можем.'
  - q: Что происходит с машиной после выкупа?
    a: 'Дальше она наша забота: транспортировку и продажу организуем мы сами. Машины на сербских номерах обычно уходят на рынке в Белграде, автомобили на российских номерах мы вывозим и реализуем в России.'
vehicle-inspection:
  - q: Сколько стоит проверка и одинакова ли цена во всех странах?
    a: Стоимость отличается по странам и зависит от объёма проверки — точную цифру назовём при заявке.
  - q: Можно заказать проверку, если вас физически нет в этой стране?
    a: Да, ваше присутствие не обязательно — отчёт и решение получаете удалённо.
  - q: В каком виде отчёт?
    a: Фото и подробное текстовое описание по итогам осмотра.
  - q: Что будет, если проверка покажет, что машину брать не стоит?
    a: 'Вы получаете отчёт с фото и прямой ответ «не берите» — и теряете стоимость проверки, а не деньги за машину. Отчёт остаётся у вас, и если вы всё-таки решите брать, найденные замечания работают как аргумент в торге: на одном из наших осмотров в Сербии это снизило цену на 700 евро.'
general:
  - q: Как оплачивается работа?
    a: Часть суммы — предоплата, остальное по факту. Размер предоплаты зависит от услуги и суммы сделки — называем его до начала работ, чтобы условия были понятны обеим сторонам.
  - q: Можно написать не в Telegram?
    a: Да, помимо Telegram доступны звонки и WhatsApp.
  - q: Где вы находитесь?
    a: База — Белград, оттуда выезжаем по всей Сербии. В Германии, Испании, Швейцарии и других странах Европы работают наши специалисты на месте.
  - q: Консультация платная?
    a: Нет. Обсудим задачу и скажем честно, реально ли уложиться в ваш бюджет. Стоимость работы называем до старта, и потом она не меняется.
cityExpert:
  q: В каждом городе есть свой выделенный эксперт?
  a: В разных городах работают разные наши специалисты; в отдельных случаях эксперт выезжает в соседний город региона.
translations:
  en:
    vehicle-sourcing:
      - q: How long does the whole process take - from application to the car with the client?
        a: On average, it takes 3–14 days - it depends on how quickly a suitable option is found in the market.
      - q: If the found car doesn't meet your needs, do you continue searching for free?
        a: Yes, we keep searching at no extra cost until we find something that suits you.
      - q: Do I need to go see the car myself?
        a: No, it’s not necessary - we can handle the entire deal without your presence. If you want to come and see it yourself, that’s also fine.
      - q: Do you provide a photo or video report on the car before I make a decision?
        a: Yes, a complete report with photos of the car will be provided before you make your purchase decision.
      - q: Is there compensation if deadlines are missed due to your fault?
        a: There’s no fixed penalty - the timeline often depends on factors not in our control (negotiations with the seller, document processing). However, we provide a realistic timeline from the outset and won’t delay.
    vehicle-import:
      - q: What is the difference between import and car sourcing?
        a: Car sourcing is when you are in the same country as the vehicle. Importing involves bringing the car to you in Serbia from Europe or China.
      - q: Is customs clearance included in the price?
        a: Yes, we assist with customs clearance in Serbia and include it in the calculations - we provide the final amount before the transaction.
      - q: How much more does a 'turnkey' car cost above the advertised price?
        a: 'The difference depends on the country, age of the vehicle, and availability of the EUR1 certificate - we calculate and fix the total amount before starting. For reference: in one of our deals, a BMW X1 cost €39,860 in Germany, but as a turnkey car in Serbia, with all costs, delivery, customs clearance, and processing, it came to €46,000.'
      - q: What do I need to register an imported car in Serbia?
        a: You can only register the vehicle in Serbia after obtaining residency, so it's best to start sourcing once you have your documents. Customs clearance is done in Subotica, after which we deliver the car to your city and assist with the registration.
    vehicle-buyback:
      - q: How many days does it take to sell a car if it hasn't been cleared or registered yet?
        a: Typically, 1–2 days, even if the car hasn’t been cleared or registered in your name.
      - q: Do you buy cars that are under loan or lien?
        a: No, we only buy cars that are free of active loans or liens.
      - q: How quickly do I receive money after inspection?
        a: On the day of signing the contract - right after the inspection, if the description matches.
      - q: Are there restrictions on brand, year, or mileage?
        a: 'Yes - we do not consider cars in poor technical condition or French brands. This restriction applies only to buyback: we can still source a Peugeot or Renault for you.'
      - q: What happens to the car after the buyback?
        a: 'After the purchase, we take care of it: we handle transportation and sales ourselves. Cars with Serbian plates usually sell in the Belgrade market, while vehicles with Russian plates are exported and sold in Russia.'
    vehicle-inspection:
      - q: How much does the inspection cost, and is the price the same in all countries?
        a: The cost varies by country and depends on the extent of the inspection - we will provide the exact amount when you request.
      - q: Can I order an inspection if I’m not physically in that country?
        a: Yes, your presence is not required - you will receive the report and decision remotely.
      - q: What format is the report in?
        a: It includes photos and a detailed written description based on the inspection.
      - q: What happens if the inspection shows that the car isn't worth buying?
        a: "You will receive a report with photos and a direct answer 'don't buy' - and you'll only lose the cost of the inspection, not the money for the car. The report remains with you, and if you still decide to proceed, the noted issues serve as bargaining points: during one of our inspections in Serbia, this reduced the price by €700."
    general:
      - q: How is the work paid for?
        a: A portion of the payment is upfront, with the rest due upon completion. The amount of the upfront payment depends on the service and deal size - we specify this before starting work to ensure both sides are clear on the terms.
      - q: Can I contact you outside of Telegram?
        a: Yes, in addition to Telegram, you can call or use WhatsApp.
      - q: Where are you located?
        a: Our base is in Belgrade, from where we operate throughout Serbia. Our specialists work on-site in Germany, Spain, Switzerland, and other countries in Europe.
      - q: Is the consultation charged?
        a: No. We will discuss your task and honestly tell you if it's feasible within your budget. We provide the cost of work before starting, and it won't change after that.
    cityExpert:
      q: Is there a dedicated expert in each city?
      a: Different specialists work in different cities; in some cases, an expert may travel to a neighboring city in the region.
  sr:
    vehicle-sourcing:
      - q: Koliko traje ceo proces - od prijave do automobila kod klijenta?
        a: U proseku 3–14 dana - zavisi koliko brzo se pronađe odgovarajući model na tržištu.
      - q: Ako pronađeni automobil ne odgovara, da li nastavite da tražite besplatno?
        a: Da, nastavljamo potragu bez dodatne naknade, dok ne pronađemo nešto što vam odgovara.
      - q: Da li treba da dođem da pogledam auto?
        a: Ne, nije obavezno - možemo obaviti celu transakciju bez vašeg prisustva. Ako želite da dođete i pogledate, nema problema.
      - q: Da li šaljete foto- ili video izveštaj o automobilu pre donošenja odluke?
        a: Da, šaljemo kompletan izveštaj sa fotografijama pre nego što donesete odluku o kupovini.
      - q: Postoji li kompenzacija ako su rokovi probijeni vašom krivicom?
        a: Ne postoji fiksna kazna - rok zavisi često ne samo od nas (pregovori sa prodavcem, obrada dokumenata). Ali odmah dajemo realističan rok i ne odugovlačimo.
    vehicle-import:
      - q: Čime se razlikuje dovoz od pretrage automobila?
        a: Pretraga automobila je kada ste u istoj zemlji kao i automobil. Dovoz - kada auto dolazi u Srbiju iz Evrope ili Kine.
      - q: Da li je carina uključena u cenu?
        a: Da, pratimo carinu u Srbiji i uključujemo je u obračun - konačnu sumu navodimo pre transakcije.
      - q: Koliko je auto «ključ» skuplji od cene u oglasu?
        a: Razlika zavisi od zemlje, starosti automobila i postojanja EUR1 sertifikata - ukupnu sumu obračunavamo pre početka. Na primer, jedan od naših poslova, BMW X1 je koštao 39 860 € u Nemačkoj, a «ključ» u Srbiji, sa svim troškovima, dostavom, carinom i obradom, izašao je 46 000 €.
      - q: Šta je potrebno da se registrovani auto na račun u Srbiji?
        a: Automobil može da se registruje na vas u Srbiji samo nakon dobijanja boravišne dozvole, pa je smisleno započeti pretragu kada su dokumenti već u rukama. Carina se obavlja u Subotici, a nakon toga, dovozimo auto do vašeg grada i pratimo registraciju.
    vehicle-buyback:
      - q: Za koliko dana se može prodati auto, ako još nije carinjen ili prebačen?
        a: Obično 1–2 dana, čak i ako auto još nije carinjen ili prebačen na vas.
      - q: Da li otkupljujete automobile u kreditu ili zalogu?
        a: Ne, otkupljujemo samo automobile bez aktivnog kredita ili zaloge.
      - q: Kako brzo dolaze novci nakon pregleda?
        a: Na dan potpisivanja ugovora - odmah nakon pregleda, ako se opis poklapa.
      - q: Postoje li ograničenja po marki, godini ili pređenim kilometrima?
        a: 'Da - ne razmatramo automobile u lošem tehničkom stanju i francuske marke. Ovo je ograničenje samo za otkup: možemo vam i dalje pronaći Peugeot ili Renault.'
      - q: Šta se dešava sa autom posle otkupa?
        a: 'Dalje je naša briga: transport i prodaju organizujemo sami. Automobili sa srpskim registarskim tablicama obično se prodaju na tržištu u Beogradu, dok automobile sa ruskim tablicama izvozimo i prodajemo u Rusiji.'
    vehicle-inspection:
      - q: Koliko košta provera auta pre kupovine i da li je cena ista u svim zemljama?
        a: Cena se razlikuje po zemljama i zavisi od obima provere - tačan iznos ćemo navesti prilikom prijave.
      - q: Može li se naručiti provera, ako fizički niste u toj zemlji?
        a: Da, vaše prisustvo nije obavezno - izveštaj i odluku dobijate na daljinu.
      - q: U kom formatu je izveštaj?
        a: Fotografije i detaljan tekstualni opis nakon pregleda.
      - q: Šta se dešava ako provera pokaže da auto ne treba kupiti?
        a: 'Dobijate izveštaj sa fotografijama i direktan odgovor «ne kupujte» - gubite samo troškove provere, a ne novac za automobil. Izveštaj ostaje kod vas, a ako odlučite da ipak kupite, uočene nepravilnosti rade kao argument u ceni: na jednom od naših pregleda u Srbiji to je smanjilo cenu za 700 evra.'
    general:
      - q: Kako se plaća rad?
        a: Deo sume - akontacija, ostatak po završetku. Iznos akontacije zavisi od usluge i sume transakcije - navedemo ga pre početka radova, kako bi uslovi bili jasni za obe strane.
      - q: Može li se pisati van Telegrama?
        a: Da, osim Telegrama dostupni su pozivi i WhatsApp.
      - q: Gde se nalazite?
        a: Baza - Beograd, odatle idemo širom Srbije. U Nemačkoj, Španiji, Švajcarskoj i drugim evropskim zemljama rade naši stručnjaci na licu mesta.
      - q: Da li je konsultacija naplatna?
        a: Ne. Razgovaraćemo o problemu i iskreno reći da li se može uklopiti u vaš budžet. Cenu rada navodimo pre početka, i kasnije se ne menja.
    cityExpert:
      q: Da li u svakom gradu postoji svoj stručnjak?
      a: U različitim gradovima rade različiti naši stručnjaci; u pojedinim slučajevima ekspert odlazi u susedni grad regiona.
  es:
    vehicle-sourcing:
      - q: ¿Cuánto tiempo lleva todo el proceso, desde la solicitud hasta que el coche llega al cliente?
        a: En promedio de 3 a 14 días, depende de qué tan rápido se encuentre una opción adecuada en el mercado.
      - q: Si el coche encontrado no es adecuado, ¿siguen buscando sin coste adicional?
        a: Sí, continuamos la búsqueda sin coste adicional hasta que encontremos algo que le sirva.
      - q: ¿Es necesario que usted vaya a ver el coche?
        a: No, no es necesario, podemos realizar toda la transacción sin su presencia. Si desea venir a verlo, tampoco hay problema.
      - q: ¿Proporcionan un informe en fotos o videos del coche antes de tomar una decisión?
        a: Sí, le enviamos un informe completo con fotos del coche antes de que tome una decisión sobre la compra.
      - q: ¿Hay alguna compensación si los plazos se incumplen por su culpa?
        a: No hay penalización fija, el plazo de la transacción a menudo depende de factores externos (negociaciones con el vendedor, trámites). Sin embargo, damos un plazo realista desde el principio y no demoramos.
    vehicle-import:
      - q: ¿En qué se diferencia la importación de la búsqueda de coches?
        a: La búsqueda de coches es cuando usted está en el mismo país que el vehículo. La importación es cuando el coche viene a Serbia desde Europa o China.
      - q: ¿La aduana está incluida en el precio?
        a: Sí, gestionamos la aduana en Serbia y la incluimos en el cálculo — el monto final lo decimos antes de la transacción.
      - q: ¿Cuánto más costará el coche 'llave en mano' comparado con el precio del anuncio?
        a: La diferencia depende del país, la edad del coche y la disponibilidad del certificado EUR1 — calculamos y fijamos el monto total antes de comenzar. Por ejemplo, en una de nuestras transacciones, un BMW X1 costó 39.860 € en Alemania, y 'llave en mano' en Serbia, con todos los gastos, entrega, aduana y trámites, salió en 46.000 €.
      - q: ¿Qué se necesita para registrar el coche importado en Serbia?
        a: Solo se puede registrar el coche a su nombre en Serbia después de obtener el permiso de residencia, por lo que es mejor comenzar la búsqueda cuando ya tiene los documentos. La aduana se realiza en Subotica y, tras ello, llevamos el coche a su ciudad y asistimos con el registro.
    vehicle-buyback:
      - q: ¿Cuántos días se tarda en vender un coche si aún no está homologado o registrado?
        a: Generalmente, 1 a 2 días, incluso si el coche aún no está homologado o registrado a su nombre.
      - q: ¿Compran coches que están en crédito o garantía?
        a: No, compramos solo coches sin crédito o garantía vigente.
      - q: ¿Qué tan rápido llegan los fondos después de la inspección?
        a: El mismo día de la firma del contrato, inmediatamente después de la inspección, si la descripción coincide.
      - q: ¿Hay limitaciones en marcas, año o kilometraje?
        a: 'Sí, no consideramos coches en mal estado técnico y marcas francesas. Esta limitación es solo para compra: aún podemos buscar un Peugeot o Renault para usted.'
      - q: ¿Qué pasa con el coche después de la compra?
        a: 'Luego es nuestra responsabilidad: nos encargamos del transporte y la venta. Los coches con matrículas serbias suelen ser vendidos en el mercado de Belgrado, mientras que los coches con matrículas rusas los exportamos y vendemos en Rusia.'
    vehicle-inspection:
      - q: ¿Cuánto cuesta la inspección y es el mismo precio en todos los países?
        a: El costo varía según el país y depende del alcance de la inspección — le diremos la cifra exacta al momento de la solicitud.
      - q: ¿Se puede pedir una inspección si no se está físicamente en ese país?
        a: Sí, su presencia no es necesaria; recibirá el informe y la decisión de forma remota.
      - q: ¿En qué formato es el informe?
        a: Con fotos y una descripción detallada de los resultados de la inspección.
      - q: ¿Qué pasará si la inspección muestra que no vale la pena comprar el coche?
        a: "Recibirá un informe con fotos y una respuesta directa de 'no compre' — perderá solo el costo de la inspección, no el dinero del coche. El informe se queda con usted, y si finalmente decide comprar, las observaciones encontradas servirán como argumento en la negociación: en una de nuestras inspecciones en Serbia, esto redujo el precio en 700 euros."
    general:
      - q: ¿Cómo se paga el trabajo?
        a: Una parte del monto es un anticipo, el resto se paga al final. El tamaño del anticipo depende del servicio y el monto de la transacción — se lo diremos antes de comenzar, para que las condiciones queden claras para ambas partes.
      - q: ¿Se puede escribir por otro medio que no sea Telegram?
        a: Sí, además de Telegram, también están disponibles las llamadas y WhatsApp.
      - q: ¿Dónde se encuentran?
        a: Nuestra base está en Belgrado, desde allí operamos en toda Serbia. En Alemania, España, Suiza y otros países europeos, nuestros especialistas trabajan localmente.
      - q: ¿La consulta tiene costo?
        a: No. Discutiremos su consulta y le diré honestamente si es posible ajustarse a su presupuesto. Le comunicaremos el costo del trabajo antes de comenzar, y luego no cambiará.
    cityExpert:
      q: ¿Hay un experto designado en cada ciudad?
      a: En diferentes ciudades trabajan nuestros distintos especialistas; en casos específicos, el experto puede desplazarse a una ciudad vecina de la región.
  de:
    vehicle-sourcing:
      - q: Wie lange dauert der gesamte Prozess – von der Anfrage bis zum Auto beim Kunden?
        a: Im Durchschnitt 3–14 Tage – es hängt davon ab, wie schnell ein passendes Angebot auf dem Markt gefunden wird.
      - q: Wenn das gefundene Auto nicht passt, suchen Sie kostenlos weiter?
        a: Ja, wir suchen kostenlos weiter, bis wir etwas finden, das Ihnen zusagt.
      - q: Muss ich selbst zum Auto fahren, um es anzuschauen?
        a: Nein, das ist nicht notwendig – wir können den gesamten Deal ohne Ihr Erscheinen abwickeln. Wenn Sie selbst kommen und es anschauen möchten, ist das auch kein Problem.
      - q: Gibt es einen Foto- oder Videobericht über das Auto vor der Entscheidung?
        a: Ja, Sie erhalten einen vollständigen Bericht mit Fotos über das Auto, bevor Sie eine Kaufentscheidung treffen.
      - q: Gibt es eine Entschädigung, wenn die Fristen durch Ihr Verschulden überschritten werden?
        a: Es gibt keine fixe Entschädigung – die Frist hängt oft nicht nur von uns ab (Verhandlungen mit dem Verkäufer, Dokumentenbearbeitung). Wir nennen jedoch gleich einen realistischen Zeitraum und ziehen die Dinge nicht in die Länge.
    vehicle-import:
      - q: Worin besteht der Unterschied zwischen Import und Fahrzeugbeschaffung?
        a: Fahrzeugbeschaffung geschieht, wenn Sie sich im selben Land wie das Auto befinden. Import ist, wenn das Auto aus Europa oder China zu Ihnen nach Serbien kommt.
      - q: Ist die Zollabwicklung im Preis enthalten?
        a: Ja, wir kümmern uns um die Zollabwicklung in Serbien und beziehen sie in die Berechnung ein – die Endsumme nennen wir vor dem Deal.
      - q: Wie viel teurer ist das Auto „schlüsselfertig“ im Vergleich zum Inseratpreis?
        a: 'Der Unterschied hängt vom Land, dem Alter des Fahrzeugs und dem Vorhandensein eines EUR1-Zertifikats ab – die Gesamtsumme berechnen wir vor Beginn. Zum Vergleich: Bei einem unserer Deals kostete ein BMW X1 in Deutschland 39.860 €, und schlüsselfertig in Serbien, mit allen Kosten, Lieferung, Zollabwicklung und Formalitäten, belief sich der Preis auf 46.000 €.'
      - q: Was wird benötigt, um das importierte Auto in Serbien zuzulassen?
        a: Das Auto kann in Serbien nur nach Erhalt einer Aufenthaltsgenehmigung auf Sie zugelassen werden, daher macht es Sinn, mit der Beschaffung zu beginnen, wenn die Dokumente bereits vorliegen. Die Zollabwicklung erfolgt in Subotica, danach bringen wir das Auto in Ihre Stadt und unterstützen die Zulassung.
    vehicle-buyback:
      - q: Wie viele Tage dauert es, ein Auto zu verkaufen, wenn es noch nicht verzollt oder umgeschrieben ist?
        a: In der Regel 1–2 Tage, selbst wenn das Auto noch nicht verzollt oder nicht auf Sie umgeschrieben ist.
      - q: Kaufen Sie Autos mit Kredit oder Pfand?
        a: Nein, wir kaufen nur Fahrzeuge ohne bestehenden Kredit oder Pfand.
      - q: Wie schnell erhält man das Geld nach der Begutachtung?
        a: Am Tag der Vertragsunterzeichnung – sofort nach der Begutachtung, wenn die Beschreibung übereinstimmt.
      - q: Gibt es Einschränkungen hinsichtlich Marke, Jahr oder Kilometerstand?
        a: 'Ja – wir betrachten keine Fahrzeuge in schlechtem technischen Zustand oder französische Marken. Diese Einschränkung gilt nur für den Kauf: Wir können Ihnen weiterhin Peugeot oder Renault besorgen.'
      - q: Was passiert mit dem Auto nach dem Kauf?
        a: 'Danach kümmern wir uns um alles: Wir organisieren Transport und Verkauf selbst. Autos mit serbischen Nummernschildern werden in der Regel auf dem Markt in Belgrad verkauft, Fahrzeuge mit russischen Nummern exportieren wir nach Russland.'
    vehicle-inspection:
      - q: Wie viel kostet die Inspektion und ist der Preis in allen Ländern gleich?
        a: Die Kosten variieren je nach Land und hängen vom Umfang der Inspektion ab – die genaue Zahl nennen wir bei der Anfrage.
      - q: Kann eine Inspektion beauftragt werden, wenn man physisch nicht in diesem Land ist?
        a: Ja, Ihre Anwesenheit ist nicht notwendig – Sie erhalten den Bericht und die Entscheidung remote.
      - q: In welcher Form erfolgt der Bericht?
        a: Fotos und eine detaillierte schriftliche Beschreibung nach der Inspektion.
      - q: Was passiert, wenn die Inspektion zeigt, dass das Auto nicht gekauft werden sollte?
        a: 'Sie erhalten einen Bericht mit Fotos und eine klare Antwort „nicht kaufen“ – und verlieren nur die Kosten für die Inspektion, nicht das Geld für das Auto. Der Bericht bleibt bei Ihnen, und wenn Sie sich dennoch entscheiden zu kaufen, können die gefundenen Mängel als Argument bei der Preisverhandlung genutzt werden: Bei einer unserer Inspektionen in Serbien reduzierte dies den Preis um 700 Euro.'
    general:
      - q: Wie wird die Arbeit bezahlt?
        a: Ein Teil des Betrags – Vorauszahlung, der Rest nach Erbrachung der Leistung. Die Höhe der Vorauszahlung hängt von der Dienstleistung und der Höhe des Auftrags ab – wir nennen diesen Betrag vor Beginn der Arbeiten, damit beide Seiten die Bedingungen verstehen.
      - q: Kann ich nicht über Telegram schreiben?
        a: Ja, neben Telegram sind auch Anrufe und WhatsApp verfügbar.
      - q: Wo befinden Sie sich?
        a: Basis ist Belgrad, von dort aus reisen wir in ganz Serbien. In Deutschland, Spanien, der Schweiz und anderen europäischen Ländern arbeiten unsere Fachleute vor Ort.
      - q: Ist die Beratung kostenpflichtig?
        a: Nein. Wir besprechen das Anliegen und sagen ehrlich, ob es möglich ist, in Ihr Budget zu passen. Die Kosten werden vor Beginn genannt und ändern sich danach nicht.
    cityExpert:
      q: Gibt es in jeder Stadt einen eigenen Experten?
      a: In verschiedenen Städten arbeiten unterschiedliche Spezialisten von uns; in bestimmten Fällen reist der Experte in die benachbarte Stadt der Region.
