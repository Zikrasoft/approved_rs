vehicle-sourcing:
  - q: Сколько занимает весь процесс — от заявки до машины у клиента?
    a: В среднем 3–14 дней — зависит от того, как быстро находится подходящий вариант на рынке.
  - q: Если найденная машина не подошла, продолжаете искать бесплатно?
    a: Да, продолжаем поиск без доплаты, пока не найдём то, что вам подходит.
  - q: Нужно ли самому ехать смотреть машину?
    a: Нет, необязательно — можем провести всю сделку без вашего присутствия. Хотите приехать и посмотреть сами — тоже без проблем.
  - q: Даёте ли фото- или видеоотчёт по машине до принятия решения?
    a: Да, полный отчёт с фото по машине — до того, как вы принимаете решение о покупке.
  - q: Есть компенсация, если сроки сорваны по вашей вине?
    a: Фиксированной неустойки нет — срок сделки часто зависит не только от нас (переговоры с продавцом, оформление документов). Но называем реалистичный срок сразу и не тянем время.
vehicle-import:
  - q: Чем привоз отличается от автоподбора?
    a: Автоподбор — когда вы находитесь в той же стране, что и автомобиль. Привоз — когда машина едет к вам в Сербию из Европы или Китая.
  - q: Растаможка входит в стоимость?
    a: Да, сопровождаем растаможку в Сербии и включаем её в расчёт — итоговую сумму называем до сделки.
  - q: Насколько машина «под ключ» дороже цены в объявлении?
    a: 'Разница зависит от страны, возраста автомобиля и наличия сертификата EUR1 — полную сумму мы считаем и фиксируем до старта. Для ориентира: в одной из наших сделок BMW X1 стоил в Германии 39 860 €, а под ключ в Сербии, со всеми расходами, доставкой, растаможкой и оформлением, вышел в 46 000 €.'
  - q: Что нужно, чтобы поставить привезённую машину на учёт в Сербии?
    a: Оформить автомобиль на себя в Сербии можно только после получения ВНЖ, поэтому подбор имеет смысл начинать, когда документы уже на руках. Растаможка проходит в Суботице, после неё мы довозим машину до вашего города и сопровождаем постановку на учёт.
vehicle-buyback:
  - q: За сколько дней можно продать машину, если она ещё не растаможена или не переоформлена?
    a: Обычно 1–2 дня, даже если машина ещё не растаможена или не переоформлена на вас.
  - q: Выкупаете машину в кредите или залоге?
    a: Нет, выкупаем только автомобили без действующего кредита или залога.
  - q: Как быстро приходят деньги после осмотра?
    a: В день подписания договора — сразу после осмотра, если описание совпало.
  - q: Есть ограничения по марке, году или пробегу?
    a: 'Да — не рассматриваем автомобили в плохом техническом состоянии и французские марки. Это ограничение только на выкуп: подобрать вам Peugeot или Renault мы по-прежнему можем.'
  - q: Что происходит с машиной после выкупа?
    a: 'Дальше она наша забота: транспортировку и продажу организуем мы сами. Машины на сербских номерах обычно уходят на рынке в Белграде, автомобили на российских номерах мы вывозим и реализуем в России.'
vehicle-inspection:
  - q: Сколько стоит проверка и одинакова ли цена во всех странах?
    a: Стоимость отличается по странам и зависит от объёма проверки — точную цифру назовём при заявке.
  - q: Можно заказать проверку, если вас физически нет в этой стране?
    a: Да, ваше присутствие не обязательно — отчёт и решение получаете удалённо.
  - q: В каком виде отчёт?
    a: Фото и подробное текстовое описание по итогам осмотра.
  - q: Что будет, если проверка покажет, что машину брать не стоит?
    a: 'Вы получаете отчёт с фото и прямой ответ «не берите» — и теряете стоимость проверки, а не деньги за машину. Отчёт остаётся у вас, и если вы всё-таки решите брать, найденные замечания работают как аргумент в торге: на одном из наших осмотров в Сербии это снизило цену на 700 евро.'
general:
  - q: Как оплачивается работа?
    a: Часть суммы — предоплата, остальное по факту. Размер предоплаты зависит от услуги и суммы сделки — называем его до начала работ, чтобы условия были понятны обеим сторонам.
  - q: Можно написать не в Telegram?
    a: Да, помимо Telegram доступны звонки и WhatsApp.
  - q: Где вы находитесь?
    a: База — Белград, оттуда выезжаем по всей Сербии. В Германии, Испании, Швейцарии и других странах Европы работают наши специалисты на месте.
  - q: Консультация платная?
    a: Нет. Обсудим задачу и скажем честно, реально ли уложиться в ваш бюджет. Стоимость работы называем до старта, и потом она не меняется.
cityExpert:
  q: В каждом городе есть свой выделенный эксперт?
  a: В разных городах работают разные наши специалисты; в отдельных случаях эксперт выезжает в соседний город региона.
translations:
  en:
    vehicle-sourcing:
      - q: How long does the entire process take, from application to the car being with the client?
        a: On average, it takes 3–14 days, depending on how quickly a suitable option is found in the market.
      - q: If the found car doesn’t suit me, do you continue the search for free?
        a: Yes, we continue searching at no extra charge until we find the right fit for you.
      - q: Do I need to go see the car myself?
        a: No, it’s not necessary — we can handle the entire deal without your presence. If you want to come and check it out yourself, that’s fine too.
      - q: Do you provide a photo or video report on the car before I make a decision?
        a: Yes, a full report with photos of the car is provided before you make a purchase decision.
      - q: Is there compensation if deadlines are missed due to your fault?
        a: There is no fixed penalty — the timeframe often depends on factors beyond our control (negotiations with the seller, document processing). However, we provide a realistic timeline upfront and don’t prolong the process.
    vehicle-import:
      - q: What’s the difference between sourcing and importing a vehicle?
        a: Sourcing is when you are in the same country as the vehicle. Importing is when the car is coming to Serbia from Europe or China.
      - q: Is customs clearance included in the cost?
        a: Yes, we assist with customs clearance in Serbia and include it in the calculation — we provide the total amount before the deal.
      - q: How much more does a ‘turnkey’ car cost compared to the price in the ad?
        a: The difference depends on the country, the age of the vehicle, and whether it has an EUR1 certificate — we calculate and fix the total amount before we start. For example, in one of our transactions, a BMW X1 was priced at €39,860 in Germany, but the turnkey price in Serbia, including all expenses, delivery, customs clearance, and paperwork, was €46,000.
      - q: What do I need to register the imported car in Serbia?
        a: You can only register the car in your name in Serbia after obtaining residency, so it makes sense to start sourcing when you have those documents. Customs clearance takes place in Subotica, after which we will deliver the car to your city and assist with the registration.
    vehicle-buyback:
      - q: How many days does it take to sell a car if it’s still not cleared or registered?
        a: Usually 1–2 days, even if the car isn't cleared or registered in your name yet.
      - q: Do you buy cars that are under a loan or lien?
        a: No, we only buy cars without an active loan or lien.
      - q: How quickly do I receive money after the inspection?
        a: On the day of signing the contract — immediately after the inspection, if the description matches.
      - q: Are there restrictions on make, year, or mileage?
        a: 'Yes — we do not consider vehicles in poor technical condition and French brands. This restriction only applies to buyback: we can still source a Peugeot or Renault for you.'
      - q: What happens to the car after the buyback?
        a: 'From there, it’s our responsibility: we handle transportation and sale ourselves. Cars with Serbian plates typically sell in the Belgrade market, while cars with Russian plates are exported and sold in Russia.'
    vehicle-inspection:
      - q: How much does the inspection cost, and is the price the same in all countries?
        a: The cost varies by country and depends on the extent of the inspection — we will provide the exact figure upon request.
      - q: Can I order an inspection if I'm not physically in the country?
        a: Yes, your presence is not necessary — you will receive the report and conclusions remotely.
      - q: What format is the report in?
        a: It includes photos and a detailed textual description following the inspection.
      - q: What happens if the inspection shows the car isn’t worth buying?
        a: 'You receive a report with photos and a direct answer of ‘don’t buy’ — you only lose the inspection fee, not the money for the car. The report remains with you, and if you still decide to go ahead, the noted issues can be used as leverage in negotiations: in one of our inspections in Serbia, it reduced the price by €700.'
    general:
      - q: How is payment for your services structured?
        a: A part of the sum is paid in advance, with the rest due upon completion. The amount of the advance depends on the service and size of the deal — we state it before starting so both sides understand the terms.
      - q: Can I reach out via other platforms besides Telegram?
        a: Yes, calls and WhatsApp are available in addition to Telegram.
      - q: Where are you located?
        a: Our base is in Belgrade, and we operate across Serbia. In Germany, Spain, Switzerland, and other European countries, our specialists work on-site.
      - q: Is the consultation chargeable?
        a: No. We will discuss the task and honestly tell you if we can work within your budget. We give the cost of work before starting, and it doesn’t change afterward.
    cityExpert:
      q: Is there a dedicated expert in each city?
      a: Different specialists work in different cities; in some cases, an expert may travel to a neighboring city in the region.
  sr:
    vehicle-sourcing:
      - q: Koliko traje ceo proces - od prijave do automobila kod klijenta?
        a: U proseku 3–14 dana - zavisi od toga koliko brzo se pronađe odgovarajuća opcija na tržištu.
      - q: Ako pronađeni automobil ne odgovara, nastavite da tražite besplatno?
        a: Da, nastavljamo potragu bez doplate, dok ne nađemo ono što vam odgovara.
      - q: Da li treba sam ići da pogledam automobil?
        a: Ne, nije obavezno - možemo obaviti celu transakciju bez vašeg prisustva. Ako želite da dođete i pogledate sami - takođe nema problema.
      - q: Da li dajete foto ili video izveštaj o automobilu prije donošenja odluke?
        a: Da, kompletan izveštaj sa fotografijama o automobilu - pre nego što donesete odluku o kupovini.
      - q: Da li postoji kompenzacija ako su rokovi probijeni vašom krivicom?
        a: Fiksne kazne nema - rok transakcije često zavisi ne samo od nas (pregovori sa prodavcem, obrada dokumenata). Ali odmah nazivamo realističan rok i ne odugovlačimo.
    vehicle-import:
      - q: Čime se uvoz razlikuje od auto pretrage?
        a: Auto pretraga - kada se nalazite u istoj zemlji kao i automobil. Uvoz - kada automobil dolazi k vama u Srbiju iz Evrope ili Kine.
      - q: Da li je carina uključena u cenu?
        a: Da, pratimo carinjenje u Srbiji i uključujemo je u obračun - konačnu sumu nazivamo pre transakcije.
      - q: Koliko je automobil 'ključ u ruke' skuplji od cene u oglasu?
        a: "Razlika zavisi od zemlje, starosti automobila i postojanja sertifikata EUR1 - punu sumu računamo i fiksiramo pre početka. Za orijentaciju: u jednoj od naših transakcija BMW X1 je koštao u Nemačkoj 39.860 €, a 'ključ u ruke' u Srbiji, sa svim troškovima, dostavom, carinjenjem i obradom, je izašao na 46.000 €."
      - q: Šta je potrebno da se registrovani uvezeni automobil u Srbiji?
        a: Automobil možete registrovati na sebe u Srbiji samo nakon dobijanja boravišne dozvole, pa ima smisla da započnete potragu kada su vam dokumenti već u ruci. Carinjenje se obavlja u Subotici, nakon čega dovozi automobil do vašeg grada i pratimo registraciju.
    vehicle-buyback:
      - q: Za koliko dana možete prodati automobil, ako još nije carinjen ili preknjižen?
        a: Obično 1–2 dana, čak i ako automobil još nije carinjen ili preknjižen na vas.
      - q: Da li otkupljujete automobile na kredit ili pod zalogom?
        a: Ne, otkupljujemo samo automobile bez aktivnog kredita ili zaloga.
      - q: Kako brzo dolaze novci nakon pregleda?
        a: Na dan potpisivanja ugovora - odmah nakon pregleda, ako opis odgovara.
      - q: Postoje li ograničenja po marki, godini ili pređenim kilometrima?
        a: 'Da - ne razmatramo automobile u lošem tehničkom stanju i francuske marke. Ovo ograničenje se odnosi samo na otkup: možemo i dalje da pronađemo Peugeot ili Renault za vas.'
      - q: Šta se dešava sa automobilom nakon otkupa?
        a: 'Dalje, to je naš posao: transport i prodaju obavljamo mi sami. Automobili sa srpskim registarskim oznakama obično se prodaju na tržištu u Beogradu, a automobili sa ruskim registarskim oznakama izvozimo i prodajemo u Rusiji.'
    vehicle-inspection:
      - q: Koliko košta provera auta pre kupovine i da li je cena svuda ista?
        a: Cena se razlikuje po zemljama i zavisi od obima provere - tačnu cifru ćemo navesti prilikom prijave.
      - q: Može li se naručiti provera ako vas fizički nema u toj zemlji?
        a: Da, vaše prisustvo nije obavezno - izveštaj i odluku dobijate na daljinu.
      - q: U kojem obliku je izveštaj?
        a: Fotografije i detaljan tekstualni opis na osnovu pregleda.
      - q: Šta će se desiti ako provera pokaže da ne treba uzeti automobil?
        a: "Do dobijate izveštaj sa fotografijama i direktan odgovor 'ne uzimajte' - i gubite trošak provere, a ne novac za automobil. Izveštaj ostaje kod vas, i ako se odlučite da ipak uzmete, pronađene primećene greške rade kao argument u pregovorima: na jednom od naših pregleda u Srbiji, to je smanjilo cenu za 700 evra."
    general:
      - q: Kako se plaća rad?
        a: Deo iznosa - prepayment, ostatak po fakti. Visina prepayment-a zavisi od usluge i iznosa transakcije - nazivamo ga pre početka rada, kako bi uslovi bili jasni obema stranama.
      - q: Može li se pisati ne preko Telegrama?
        a: Da, osim Telegrama dostupni su pozivi i WhatsApp.
      - q: Gde se nalazite?
        a: Baza - Beograd, odakle izlazimo po celoj Srbiji. U Nemačkoj, Španiji, Švajcarskoj i drugim zemljama Evrope rade naši stručnjaci na terenu.
      - q: Da li je konsultacija naplatna?
        a: Ne. Razgovaraćemo o zadatku i reći ćemo iskreno, da li je moguće uklopiti se u vaš budžet. Cena usluge se naziva pre početka, i kasnije se ne menja.
    cityExpert:
      q: Da li u svakom gradu postoji svoj određeni stručnjak?
      a: U različitim gradovima rade različiti naši stručnjaci; u pojedinim slučajevima stručnjak odlazi u obližnji grad u regionu.
  es:
    vehicle-sourcing:
      - q: ¿Cuánto tiempo lleva todo el proceso, desde la solicitud hasta que llega el coche al cliente?
        a: En promedio, de 3 a 14 días, dependiendo de la rapidez con que encontremos la opción adecuada en el mercado.
      - q: Si el coche encontrado no es adecuado, ¿siguen buscando sin costo adicional?
        a: Sí, seguimos buscando sin coste adicional hasta que encontramos lo que le conviene.
      - q: ¿Es necesario ir a ver el coche por uno mismo?
        a: No es obligatorio, podemos realizar toda la transacción sin su presencia. Si desea venir a verlo, no hay problema.
      - q: ¿Proporcionan un informe fotográfico o de video del coche antes de tomar una decisión?
        a: Sí, proporcionamos un informe completo con fotos del coche, antes de que tome una decisión de compra.
      - q: ¿Hay compensación si se incumplen los plazos por su culpa?
        a: No hay penalización fija, el tiempo de la transacción a menudo depende de factores externos (negociaciones con el vendedor, tramitación de documentos). Pero indicamos un plazo realista desde el principio y no alargamos el tiempo.
    vehicle-import:
      - q: ¿En qué se diferencia la importación de la selección de coches?
        a: La selección de coches se realiza cuando usted se encuentra en el mismo país que el vehículo. La importación es cuando el coche llega a Serbia desde Europa o China.
      - q: ¿La aduana está incluida en el precio?
        a: Sí, acompañamos el proceso de aduana en Serbia y lo incluimos en los cálculos, dándole la suma final antes de la transacción.
      - q: ¿Cuánto más costará el coche 'llave en mano' sobre el precio en el anuncio?
        a: La diferencia depende del país, la edad del coche y la disponibilidad del certificado EUR1; calculamos y fijamos el total antes de comenzar. Por ejemplo, en una de nuestras transacciones, un BMW X1 costaba 39,860 € en Alemania, y 'llave en mano' en Serbia, con todos los gastos, entrega, aduana y tramitación, salió por 46,000 €.
      - q: ¿Qué se necesita para registrar el coche traído en Serbia?
        a: Puede registrar el coche a su nombre en Serbia solo después de obtener el permiso de residencia, por lo que la selección tiene sentido iniciar cuando ya tenga los documentos. La aduana se realiza en Subotica, y después llevamos el coche a su ciudad y ayudamos con el registro.
    vehicle-buyback:
      - q: ¿Cuántos días se puede tardar en vender un coche si aún no ha pasado la aduana o no se ha registrado?
        a: Normalmente de 1 a 2 días, incluso si el coche aún no ha sido despachado o transferido a su nombre.
      - q: ¿Compran coches con crédito o en garantía?
        a: No, solo compramos vehículos sin crédito o garantía activos.
      - q: ¿Cuánto tiempo tarda en llegar el dinero después de la inspección?
        a: El mismo día de la firma del contrato, inmediatamente después de la inspección, si la descripción coincide.
      - q: ¿Hay limitaciones en cuanto a marca, año o kilometraje?
        a: 'Sí, no consideramos coches en mal estado técnico ni marcas francesas. Esta limitación solo aplica a la compra: aún podemos buscarle un Peugeot o Renault.'
      - q: ¿Qué sucede con el coche después de la compra?
        a: 'Después, se encarga de nosotros: organizamos el transporte y la venta. Los coches con matrícula serbia generalmente se venden en el mercado de Belgrado, mientras que los coches con matrícula rusa los exportamos y vendemos en Rusia.'
    vehicle-inspection:
      - q: ¿Cuánto cuesta la inspección y es el mismo precio en todos los países?
        a: El costo varía entre países y depende del volumen de inspección; le daremos la cifra exacta al hacer la solicitud.
      - q: ¿Se puede pedir una inspección si no estás físicamente en el país?
        a: Sí, su presencia no es necesaria; recibirá el informe y la decisión de forma remota.
      - q: ¿En qué formato se entrega el informe?
        a: Se entrega en forma de fotos y una descripción detallada basada en la inspección.
      - q: ¿Qué pasa si la inspección indica que no vale la pena comprar el coche?
        a: "Recibe un informe con fotos y un claro 'no compre', y pierde solo el costo de la inspección, no el dinero del coche. El informe se queda con usted, y si decide comprarlo, las observaciones encontradas sirven como argumento en la negociación: en una de nuestras inspecciones en Serbia, esto redujo el precio en 700 euros."
    general:
      - q: ¿Cómo se paga por el trabajo?
        a: Una parte del importe se paga por adelantado, el resto se paga al final. El tamaño del anticipo depende del servicio y el monto de la transacción, lo indicamos antes de comenzar el trabajo para que ambas partes tengan claras las condiciones.
      - q: ¿Se puede escribir en un medio que no sea Telegram?
        a: Sí, además de Telegram, también están disponibles llamadas y WhatsApp.
      - q: ¿Dónde se encuentran?
        a: Nuestra base está en Belgrado, desde donde operamos por toda Serbia. En Alemania, España, Suiza y otros países de Europa, nuestros especialistas trabajan localmente.
      - q: ¿La consulta tiene costo?
        a: No. Discutiremos su caso y le diremos honestamente si es posible ajustarse a su presupuesto. Indicamos el costo del trabajo antes de comenzar, y luego no cambia.
    cityExpert:
      q: ¿Hay un experto designado en cada ciudad?
      a: En diferentes ciudades, trabajan nuestros especialistas; en casos particulares, un experto puede viajar a una ciudad vecina de la región.
  de:
    vehicle-sourcing:
      - q: Wie lange dauert der gesamte Prozess – von der Anfrage bis zum Auto beim Kunden?
        a: Im Durchschnitt 3–14 Tage – es hängt davon ab, wie schnell ein passendes Angebot auf dem Markt gefunden wird.
      - q: Wenn das gefundene Auto nicht passt, suchen Sie kostenlos weiter?
        a: Ja, wir setzen die Suche ohne zusätzliche Kosten fort, bis wir etwas finden, das Ihnen zusagt.
      - q: Muss man selbst das Auto anschauen?
        a: Nein, das ist nicht notwendig – wir können den gesamten Deal ohne Ihr Präsenz abwickeln. Wenn Sie gerne selbst kommen und es sich ansehen möchten, ist das auch kein Problem.
      - q: Geben Sie einen Foto- oder Videobericht über das Auto vor der Kaufentscheidung?
        a: Ja, einen vollständigen Bericht mit Fotos des Autos – bevor Sie eine Kaufentscheidung treffen.
      - q: Gibt es eine Entschädigung, wenn die Fristen durch Ihr Verschulden nicht eingehalten werden?
        a: Es gibt keine festgelegte Vertragsstrafe – die Dauer des Deals hängt oft nicht nur von uns ab (Verhandlungen mit dem Verkäufer, Dokumentenerstellung). Aber wir nennen einen realistischen Zeitraum von Anfang an und ziehen die Zeit nicht in die Länge.
    vehicle-import:
      - q: Was unterscheidet den Import von der Fahrzeugauswahl?
        a: Fahrzeugauswahl bedeutet, dass Sie sich im gleichen Land wie das Auto befinden. Import bezieht sich auf Fahrzeuge, die aus Europa oder China nach Serbien kommen.
      - q: Ist die Zollabwicklung im Preis enthalten?
        a: Ja, wir unterstützen die Zollabwicklung in Serbien und schließen sie in die Berechnung ein – die Gesamtsumme nennen wir vor dem Deal.
      - q: Wie viel teurer ist das Auto „schlüsselfertig“ als der Preis in der Anzeige?
        a: 'Der Unterschied hängt vom Land, dem Alter des Fahrzeugs und dem Vorhandensein eines EUR1-Zertifikats ab – die vollständige Summe berechnen wir im Voraus. Zum Vergleich: In einem unserer Deals kostete ein BMW X1 in Deutschland 39 860 €, während es schlüsselfertig in Serbien, mit allen Kosten, Lieferung, Zollabwicklung und Formalitäten, 46 000 € betrug.'
      - q: Was ist nötig, um das importierte Auto in Serbien zu registrieren?
        a: Das Auto in Serbien auf sich zuzulassen ist nur nach Erhalt einer Aufenthaltsgenehmigung möglich, daher macht es Sinn, mit der Auswahl zu beginnen, wenn die Dokumente bereits vorliegen. Die Zollabwicklung erfolgt in Subotica, danach bringen wir das Auto in Ihre Stadt und begleiten die Registrierung.
    vehicle-buyback:
      - q: Wie viele Tage benötigt man, um ein Auto zu verkaufen, wenn es noch nicht verzollt oder umgeschrieben ist?
        a: Normalerweise 1–2 Tage, auch wenn das Auto noch nicht verzollt oder auf Sie umgeschrieben ist.
      - q: Kaufen Sie Autos mit Kredit oder Pfand?
        a: Nein, wir kaufen nur Fahrzeuge ohne laufenden Kredit oder Pfand.
      - q: Wie schnell kommen die Gelder nach der Inspektion?
        a: Am Tag der Vertragsunterzeichnung – sofort nach der Inspektion, wenn die Beschreibung übereinstimmt.
      - q: Gibt es Einschränkungen bezüglich Marke, Jahr oder Kilometerstand?
        a: 'Ja – wir betrachten keine Autos in schlechtem technischen Zustand und französische Marken. Diese Einschränkung gilt nur für den Ankauf: wir können Ihnen weiterhin Peugeot oder Renault auswählen.'
      - q: Was passiert mit dem Auto nach dem Ankauf?
        a: 'Dann liegt es in unserer Verantwortung: Transport und Verkauf organisieren wir selbst. Autos mit serbischen Nummernschildern werden normalerweise auf dem Markt in Belgrad verkauft, Fahrzeuge mit russischen Nummernschildern exportieren wir und verkaufen sie in Russland.'
    vehicle-inspection:
      - q: Was kostet die Inspektion, und ist der Preis in allen Ländern gleich?
        a: Die Kosten variieren je nach Land und hängen vom Prüfungsumfang ab – die genaue Zahl nennen wir bei der Anfrage.
      - q: Kann die Inspektion bestellt werden, wenn Sie physisch nicht in diesem Land sind?
        a: Ja, Ihre Anwesenheit ist nicht erforderlich – Sie erhalten den Bericht und die Entscheidung aus der Ferne.
      - q: In welcher Form liegt der Bericht vor?
        a: Fotos und eine detaillierte schriftliche Beschreibung der Inspektionsergebnisse.
      - q: Was passiert, wenn die Inspektion zeigt, dass das Auto nicht gekauft werden sollte?
        a: 'Sie erhalten einen Bericht mit Fotos und eine klare Antwort „nicht kaufen“ – dabei verlieren Sie nur die Kosten für die Inspektion, nicht das Geld für das Auto. Der Bericht bleibt bei Ihnen, und falls Sie sich dennoch entscheiden, das Auto zu kaufen, können Sie die gefundenen Mängel als Argument für den Preisnachlass nutzen: bei einer unserer Inspektionen in Serbien senkte das den Preis um 700 Euro.'
    general:
      - q: Wie wird die Arbeit bezahlt?
        a: Ein Teil des Betrags ist eine Vorauszahlung, der Rest nach Erfüllung. Der Betrag der Vorauszahlung hängt von der Dienstleistung und der Summe des Geschäfts ab – wir nennen ihn vor Arbeitsbeginn, damit die Bedingungen beiden Seiten klar sind.
      - q: Kann man nicht über Telegram schreiben?
        a: Ja, neben Telegram sind auch Anrufe und WhatsApp verfügbar.
      - q: Wo sind Sie ansässig?
        a: Unser Standort ist Belgrad, von dort fahren wir in ganz Serbien. In Deutschland, Spanien, der Schweiz und anderen europäischen Ländern arbeiten unsere Spezialisten vor Ort.
      - q: Ist die Beratung kostenpflichtig?
        a: Nein. Wir besprechen das Anliegen und sagen ehrlich, ob es realistisch ist, in Ihrem Budget zu bleiben. Die Kosten der Arbeit nennen wir vor Beginn, und danach ändern sie sich nicht.
    cityExpert:
      q: Gibt es in jeder Stadt einen eigenen Experten?
      a: In verschiedenen Städten arbeiten verschiedene unsere Spezialisten; in einigen Fällen reist der Experte in eine benachbarte Stadt der Region.
