vehicle-sourcing:
  - q: Сколько занимает весь процесс — от заявки до машины у клиента?
    a: В среднем 3–14 дней — зависит от того, как быстро находится подходящий вариант на рынке.
  - q: Если найденная машина не подошла, продолжаете искать бесплатно?
    a: Да, продолжаем поиск без доплаты, пока не найдём то, что вам подходит.
  - q: Нужно ли самому ехать смотреть машину?
    a: Нет, необязательно — можем провести всю сделку без вашего присутствия. Хотите приехать и посмотреть сами — тоже без проблем.
  - q: Какая гарантия на найденный автомобиль?
    a: 'Формальной гарантии производителя, как на новый автомобиль, нет — это вторичный рынок. Ваша защита — независимая техническая проверка перед покупкой: машину осматривает эксперт, а не вы «вслепую».'
  - q: Даёте ли фото- или видеоотчёт по машине до принятия решения?
    a: Да, полный отчёт с фото по машине — до того, как вы принимаете решение о покупке.
  - q: Есть компенсация, если сроки сорваны по вашей вине?
    a: Фиксированной неустойки нет — срок сделки часто зависит не только от нас (переговоры с продавцом, растаможка). Но называем реалистичный срок сразу и не тянем время.
vehicle-import:
  - q: Чем привоз отличается от автоподбора?
    a: Автоподбор — когда вы находитесь в той же стране, что и автомобиль. Привоз — когда машина едет к вам в Сербию из Европы или Китая.
  - q: Растаможка входит в стоимость?
    a: Да, сопровождаем растаможку в Сербии и включаем её в расчёт — итоговую сумму называем до сделки.
  - q: Насколько машина «под ключ» дороже цены в объявлении?
    a: 'Разница зависит от страны, возраста автомобиля и наличия сертификата EUR1 — полную сумму мы считаем и фиксируем до старта. Для ориентира: в одном из наших кейсов BMW X1 стоил в Германии 39 860 €, а под ключ в Сербии, со всеми расходами, доставкой, растаможкой и оформлением, вышел в 46 000 €.'
  - q: Что нужно, чтобы поставить привезённую машину на учёт в Сербии?
    a: Оформить автомобиль на себя в Сербии можно только после получения ВНЖ, поэтому подбор имеет смысл начинать, когда документы уже на руках. Растаможка проходит в Суботице, после неё мы довозим машину до вашего города и сопровождаем постановку на учёт.
vehicle-buyback:
  - q: За сколько дней можно продать машину, если она ещё не растаможена или не переоформлена?
    a: Обычно 1–2 дня, даже если машина ещё не растаможена или не переоформлена на вас.
  - q: Выкупаете машину в кредите или залоге?
    a: Нет, выкупаем только автомобили без действующего кредита или залога.
  - q: Как быстро приходят деньги после осмотра?
    a: В день подписания договора — сразу после осмотра, если описание совпало.
  - q: Есть ограничения по марке, году или пробегу?
    a: Да — не рассматриваем автомобили в плохом техническом состоянии и французские марки.
  - q: Что происходит с машиной после выкупа?
    a: 'Дальше она наша забота: транспортировку и продажу организуем мы сами. Машины на сербских номерах обычно уходят на рынке в Белграде, автомобили на российских номерах мы вывозим и реализуем в России.'
vehicle-inspection:
  - q: Сколько стоит проверка и одинакова ли цена во всех странах?
    a: Стоимость отличается по странам и зависит от объёма проверки — точную цифру назовём при заявке.
  - q: Можно заказать проверку, если вас физически нет в этой стране?
    a: Да, ваше присутствие не обязательно — отчёт и решение получаете удалённо.
  - q: В каком виде отчёт?
    a: Фото и подробное текстовое описание по итогам осмотра.
  - q: Что будет, если проверка покажет, что машину брать не стоит?
    a: 'Вы получаете отчёт с фото и прямой ответ «не берите» — и теряете стоимость проверки, а не деньги за машину. Отчёт остаётся у вас, и если вы всё-таки решите брать, найденные замечания работают как аргумент в торге: на одном из наших осмотров в Сербии это снизило цену на 700 евро.'
general:
  - q: Как оплачивается работа?
    a: Оплата наличными в день сделки — вы не переводите деньги вперёд.
  - q: Можно написать не в Telegram?
    a: Да, помимо Telegram доступны звонки и WhatsApp.
  - q: Где вы находитесь?
    a: База — Белград, оттуда выезжаем по всей Сербии. В Германии, Испании, Швейцарии и других странах Европы работают наши специалисты на месте.
  - q: Консультация платная?
    a: Нет. Обсудим задачу и скажем честно, реально ли уложиться в ваш бюджет. Стоимость работы называем до старта, и потом она не меняется.
cityExpert:
  q: В каждом городе есть свой выделенный эксперт?
  a: В разных городах работают разные наши специалисты; в отдельных случаях эксперт выезжает в соседний город региона.
translations:
  en:
    vehicle-sourcing:
      - q: How long does the entire process take — from the request to the car being with the client?
        a: On average, it takes between 3 to 14 days, depending on how quickly a suitable option is found on the market.
      - q: If the found car isn’t suitable, do you continue searching for free?
        a: Yes, we will keep looking at no additional cost until we find something that meets your needs.
      - q: Do I need to go see the car myself?
        a: No, it’s not necessary — we can handle the entire deal without your presence. But if you want to come and check it out yourself, that's fine too.
      - q: What warranty is there on the found vehicle?
        a: "There is no formal manufacturer warranty like there is on a new car, as this is the secondary market. Your protection comes from an independent technical inspection before the purchase: an expert inspects the car, rather than you doing it 'blindly.'"
      - q: Do you provide photo or video reports on the car before making a decision?
        a: Yes, a full report with photos of the car will be provided before you make a purchase decision.
      - q: Is there any compensation if deadlines are missed due to your fault?
        a: There is no fixed penalty — the transaction time often depends on factors beyond our control (negotiations with the seller, customs clearance). However, we give a realistic timeframe upfront and don’t delay the process.
    vehicle-import:
      - q: How does import differ from car sourcing?
        a: Car sourcing is when you are in the same country as the vehicle. Importing means the car is coming to Serbia from Europe or China.
      - q: Is customs clearance included in the price?
        a: Yes, we manage the customs clearance in Serbia and include it in the calculations — we provide the final amount before the deal.
      - q: How much does the 'turnkey' price exceed the advertisement price?
        a: The difference depends on the country, the age of the car, and whether there is an EUR1 certificate. We calculate and confirm the full amount before starting. As a reference, in one of our cases, a BMW X1 cost €39,860 in Germany, but after everything including expenses, delivery, customs, and documentation, the 'turnkey' price in Serbia was €46,000.
      - q: What do I need to register the imported car in Serbia?
        a: You can only register the car in your name in Serbia after receiving residence permits, so it makes sense to start sourcing once you have the necessary documents. Customs clearance occurs in Subotica, and after that, we will deliver the car to your city and assist with registration.
    vehicle-buyback:
      - q: How many days does it take to sell a car if it hasn't been cleared or registered yet?
        a: Usually 1-2 days, even if the car hasn’t been cleared or registered in your name.
      - q: Do you buy cars that are under loan or lien?
        a: No, we only buy cars that have no active loans or liens.
      - q: How quickly do you pay after the inspection?
        a: On the day the contract is signed — immediately after the inspection if the description matches.
      - q: Are there any restrictions on the brand, year, or mileage?
        a: Yes — we do not consider cars that are in poor technical condition and we do not buy French brands.
      - q: What happens to the car after it is bought back?
        a: 'From then on, it’s our responsibility: we organize its transportation and sale. Cars with Serbian plates typically sell on the market in Belgrade, while cars with Russian plates are exported and sold in Russia.'
    vehicle-inspection:
      - q: How much does an inspection cost and is the price the same in all countries?
        a: The cost varies by country and depends on the scope of the inspection — we will give you an exact figure when you make a request.
      - q: Can I order an inspection if I'm not physically in that country?
        a: Yes, your presence is not required — you will receive the report and decision remotely.
      - q: What format does the report come in?
        a: The report includes photos and a detailed text description of the inspection results.
      - q: What happens if the inspection indicates the car is not worth buying?
        a: "You receive a report with photos and a direct response of 'don't buy' — and you only lose the cost of the inspection, not the money for the car. The report remains yours, and if you decide to buy despite the findings, the noted issues can be used as leverage in negotiations: in one of our inspections in Serbia, this reduced the price by €700."
    general:
      - q: How is the work payment handled?
        a: Payment is made in cash on the day of the transaction — you do not pay any money upfront.
      - q: Can I message you outside of Telegram?
        a: Yes, in addition to Telegram, calls and WhatsApp are also available.
      - q: Where are you located?
        a: Our base is in Belgrade, and we operate throughout Serbia. In Germany, Spain, Switzerland, and other European countries, our specialists work on site.
      - q: Is the consultation paid?
        a: No. We will discuss your needs and honestly tell you if it's possible to stay within your budget. We provide the cost of our services upfront, and that amount won’t change.
    cityExpert:
      q: Is there a dedicated expert in every city?
      a: Different experts work in different cities; in certain cases, an expert may travel to a nearby city in the region.
  sr:
    vehicle-sourcing:
      - q: Koliko traje ceo proces — od prijave do automobila kod klijenta?
        a: U proseku 3–14 dana — zavisi koliko brzo se pronađe odgovarajuća opcija na tržištu.
      - q: Ako pronađeni automobil nije odgovarajuć, da li nastavite da tražite besplatno?
        a: Da, nastavljamo potragu bez dodatnih troškova, dok ne pronađemo ono što vam odgovara.
      - q: Da li je potrebno da sami idete da pogledate automobil?
        a: Ne, nije obavezno — možemo obaviti celu transakciju bez vašeg prisustva. Ako želite da dođete i sami pogledate — takođe nema problema.
      - q: Kakva je garancija na pronađeni automobil?
        a: "Ne postoji formalna garancija proizvođača kao za novi automobil — ovo je sekundarno tržište. Vaša zaštita je nezavisna tehnička provera pre kupovine: automobil pregleda stručnjak, a ne vi 'naslepo'."
      - q: Da li dajete foto- ili video izveštaj o automobilu pre donošenja odluke?
        a: Da, pun izveštaj sa fotografijama o automobilu — pre nego što donesete odluku o kupovini.
      - q: Postoji li naknada ako su rokovi probijeni vašom krivicom?
        a: Nema fiksne kazne — rok transakcije često zavisi ne samo od nas (pregovori sa prodavcem, carinjenje). Ali odmah kažemo realističan rok i ne odugovlačimo.
    vehicle-import:
      - q: Šta je razlika između uvoza i auto pretrage?
        a: Auto pretraga — kada se nalazite u istoj zemlji gde je automobil. Uvoz — kada automobil dolazi kod vas u Srbiju iz Evrope ili Kine.
      - q: Da li je carinjenje uključeno u cenu?
        a: Da, pratimo carinjenje u Srbiji i uključujemo ga u računicu — konačnu sumu navodimo pre transakcije.
      - q: Koliko je automobil 'ključ u ruke' skuplji od cene u oglasu?
        a: "Razlika zavisi od zemlje, starosti automobila i postojanja EUR1 sertifikata — ukupnu cenu računamo i fiksiramo pre početka. Kao orijentacija: u jednom od naših slučajeva BMW X1 je u Nemačkoj koštao 39 860 €, a 'ključ u ruke' u Srbiji, sa svim troškovima, dostavom, carinjenjem i papirima, iznosio je 46 000 €."
      - q: Šta je potrebno da se uvezena mašina registruje u Srbiji?
        a: Automobil možete registrovati na sebe u Srbiji samo nakon dobijanja boravišne dozvole, zato ima smisla započeti pretragu kada su dokumenta već u rukama. Carinjenje se obavlja u Subotici, nakon toga dovozimo automobil do vašeg grada i pratimo registraciju.
    vehicle-buyback:
      - q: Za koliko dana može da se proda automobil ako još nije carinjen ili prepisan?
        a: Obično 1–2 dana, čak i ako automobil još nije carinjen ili prepisan na vas.
      - q: Otkupljujete li automobile u kreditu ili hipoteci?
        a: Ne, otkupljujemo samo automobile bez aktivnog kredita ili hipoteke.
      - q: Kako brzo dolaze novci nakon pregleda?
        a: Na dan potpisivanja ugovora — odmah nakon pregleda, ako se opis poklapa.
      - q: Postoje li ograničenja po marki, godini ili pređenim kilometrima?
        a: Da — ne razmatramo automobile u lošem tehničkom stanju i francuske marke.
      - q: Šta se dešava sa automobilom nakon otkupa?
        a: 'Dalje je to naša briga: transport i prodaju organizujemo sami. Automobili sa srpskim registarskim oznakama obično se prodaju na tržištu u Beogradu, dok automobile sa ruskim registracijama izvozimo i prodajemo u Rusiji.'
    vehicle-inspection:
      - q: Koliko košta provera i da li je cena ista u svim zemljama?
        a: Cena se razlikuje po zemljama i zavisi od obima provere — tačan iznos ćemo navesti prilikom prijave.
      - q: Može li se naručiti provera ako fizički niste u toj zemlji?
        a: Da, vaše prisustvo nije obavezno — izveštaj i odluku dobijate na daljinu.
      - q: U kom formatu je izveštaj?
        a: Fotografije i detaljan tekstualni opis na osnovu pregleda.
      - q: Šta će se desiti ako provera pokaže da ne treba uzimati automobil?
        a: "Dobijate izveštaj sa fotografijama i direktan odgovor 'ne uzimajte' — i gubite trošak provere, a ne novac za automobil. Izveštaj ostaje kod vas, i ako se ipak odlučite da uzmete, pronađene zamerke mogu poslužiti kao argument u pregovorima: u jednom od naših pregleda u Srbiji to je smanjilo cenu za 700 evra."
    general:
      - q: Kako se plaća rad?
        a: Plaćanje gotovinom na dan transakcije — ne šaljete novac unapred.
      - q: Može li se pisati ne preko Telegrama?
        a: Da, osim Telegrama dostupni su pozivi i WhatsApp.
      - q: Gde se nalazite?
        a: Naša baza je u Beogradu, odatle odlazimo širom Srbije. U Nemačkoj, Španiji, Švajcarskoj i drugim zemljama Evrope rade naši stručnjaci na terenu.
      - q: Da li je konsultacija naplatna?
        a: Ne. Razgovaraćemo o zadatku i iskreno reći da li je realno uklopiti se u vaš budžet. Cenu rada navodimo pre početka, a zatim se ne menja.
    cityExpert:
      q: Da li u svakom gradu postoji svoj obučeni ekspert?
      a: U različitim gradovima rade različiti naši stručnjaci; u posebnim slučajevima ekspert odlazi u susedni grad regiona.
  es:
    vehicle-sourcing:
      - q: ¿Cuánto tiempo lleva todo el proceso, desde la solicitud hasta que el coche llega al cliente?
        a: En promedio, de 3 a 14 días, dependiendo de la rapidez con la que se encuentre una opción adecuada en el mercado.
      - q: Si el coche encontrado no es adecuado, ¿continúan buscando gratis?
        a: Sí, continuamos la búsqueda sin costo adicional hasta que encontremos lo que le conviene.
      - q: ¿Es necesario ir a ver el coche en persona?
        a: No, no es necesario; podemos realizar toda la transacción sin su presencia. Si desea venir y verlo por sí mismo, no hay problema.
      - q: ¿Cuál es la garantía del coche encontrado?
        a: "No existe una garantía formal del fabricante como en un coche nuevo; estamos en un mercado de segunda mano. Su protección es una revisión técnica independiente antes de la compra: el coche será inspeccionado por un experto, no por usted 'a ciegas'."
      - q: ¿Ofrecen un informe con fotos o videos del coche antes de tomar una decisión?
        a: Sí, proporcionamos un informe completo con fotos del coche antes de que tome su decisión de compra.
      - q: ¿Hay compensación si se incumplen los plazos por su culpa?
        a: No hay una penalización fija; la duración de la transacción a menudo depende no solo de nosotros (negociaciones con el vendedor, aduanas). Pero establecemos un plazo realista desde el principio y no hacemos retrasos.
    vehicle-import:
      - q: ¿En qué se diferencia la importación de la selección de coches?
        a: La selección de coches es cuando usted se encuentra en el mismo país que el coche. La importación es cuando el coche viene a usted a Serbia desde Europa o China.
      - q: ¿La aduana está incluida en el precio?
        a: Sí, acompañamos el proceso aduanero en Serbia e incluimos esto en el cálculo; calculamos el monto total antes de la transacción.
      - q: ¿Cuánto más caro es el coche 'llave en mano' en comparación con el precio publicado?
        a: 'La diferencia depende del país, la antigüedad del coche y la disponibilidad del certificado EUR1; calculamos la suma total y la fijamos antes de comenzar. Para que se haga una idea: en uno de nuestros casos, un BMW X1 costaba en Alemania 39,860 €, y ‘llave en mano’ en Serbia, con todos los gastos, entrega, aduanas y formalidades, salió en 46,000 €.'
      - q: ¿Qué se necesita para matricular el coche importado en Serbia?
        a: Puede registrar el coche a su nombre en Serbia solo después de obtener el permiso de residencia, por lo que tiene sentido comenzar la selección una vez que ya tenga los documentos en mano. La aduana se realiza en Subotica, tras lo cual trasladamos el coche a su ciudad y le ayudamos con el registro.
    vehicle-buyback:
      - q: ¿Cuántos días se puede vender un coche si aún no ha sido despachado o re-registrado?
        a: Generalmente, 1-2 días, incluso si el coche aún no ha sido despachado o re-registrado a su nombre.
      - q: ¿Compran coches que están en crédito o en prenda?
        a: No, solo compramos coches que no tengan créditos o prendas vigentes.
      - q: ¿Qué tan rápido se recibe el dinero después de la inspección?
        a: El mismo día de la firma del contrato, inmediatamente después de la inspección, si la descripción coincide.
      - q: ¿Hay restricciones según la marca, el año o el kilometraje?
        a: Sí, no consideramos coches en mal estado técnico ni marcas francesas.
      - q: ¿Qué sucede con el coche después de la compra?
        a: 'Luego es nuestra responsabilidad: organizamos el transporte y la venta. Los coches con matrículas serbias generalmente se venden en el mercado de Belgrado, mientras que los coches con matrículas rusas los exportamos y realizamos ventas en Rusia.'
    vehicle-inspection:
      - q: ¿Cuánto cuesta la inspección y es el mismo precio en todos los países?
        a: El costo varía según el país y depende del volumen de la inspección; le proporcionaremos la cifra exacta al hacer la solicitud.
      - q: ¿Se puede solicitar una inspección si no está físicamente en ese país?
        a: Sí, su presencia no es necesaria; recibirá el informe y la decisión de manera remota.
      - q: ¿En qué formato se entrega el informe?
        a: Fotos y una descripción detallada por escrito al final de la inspección.
      - q: ¿Qué ocurrirá si la inspección muestra que no vale la pena comprar el coche?
        a: "Recibirá un informe con fotos y una respuesta directa 'no lo compre'— y solo perderá el costo de la inspección, no el dinero por el coche. El informe queda en su poder, y si finalmente decide comprarlo, los problemas encontrados pueden servir como argumento para la negociación: en una de nuestras inspecciones en Serbia, esto redujo el precio en 700 euros."
    general:
      - q: ¿Cómo se paga por el trabajo?
        a: El pago se realiza en efectivo el día de la transacción; no necesita transferir dinero por adelantado.
      - q: ¿Se puede escribir por otros medios además de Telegram?
        a: Sí, además de Telegram, están disponibles llamadas y WhatsApp.
      - q: ¿Dónde están ubicados?
        a: Nuestra base está en Belgrado, desde donde operamos en toda Serbia. En Alemania, España, Suiza y otros países de Europa, nuestros especialistas trabajan en el lugar.
      - q: ¿La consulta tiene costo?
        a: No. Discutiremos la tarea y le diremos honestamente si es realista ajustarse a su presupuesto. La tarifa por el trabajo se indica antes de empezar y luego no cambia.
    cityExpert:
      q: ¿Hay un experto asignado en cada ciudad?
      a: En diferentes ciudades trabajan diferentes especialistas de nuestro equipo; en casos excepcionales, el experto se desplaza a una ciudad vecina de la región.
  de:
    vehicle-sourcing:
      - q: Wie lange dauert der gesamte Prozess – von der Anfrage bis zum Auto beim Kunden?
        a: Im Durchschnitt 3–14 Tage – es hängt davon ab, wie schnell wir ein passendes Angebot auf dem Markt finden.
      - q: Wenn das gefundene Auto nicht passt, suchen Sie kostenlos weiter?
        a: Ja, wir setzen die Suche ohne Zusatzkosten fort, bis wir das passende Fahrzeug für Sie gefunden haben.
      - q: Muss ich selbst zum Auto fahren, um es zu besichtigen?
        a: Nein, das ist nicht notwendig – wir können den gesamten Deal ohne Ihre Anwesenheit abwickeln. Wenn Sie jedoch selbst kommen und es ansehen möchten, ist das auch kein Problem.
      - q: Welche Garantie gibt es für das gefundene Fahrzeug?
        a: 'Es gibt keine formelle Herstellergarantie wie bei einem Neuwagen – wir bewegen uns im Bereich des Gebrauchtmarktes. Ihr Schutz besteht in einer unabhängigen technischen Überprüfung vor dem Kauf: das Auto wird von einem Experten geprüft, nicht von Ihnen „ins Blaue hinein“.'
      - q: Gibt es einen Foto- oder Videobericht über das Auto, bevor ich eine Entscheidung treffe?
        a: Ja, Sie erhalten einen vollständigen Bericht mit Fotos zum Fahrzeug, bevor Sie eine Kaufentscheidung treffen.
      - q: Gibt es eine Entschädigung, wenn die Fristen wegen Ihrer Schuld nicht eingehalten werden?
        a: Es gibt keine feste Vertragsstrafe – die Dauer des Deals hängt oft nicht nur von uns ab (Verhandlungen mit dem Verkäufer, Zollabwicklung). Aber wir nennen sofort einen realistischen Zeitrahmen und ziehen nicht unnötig in die Länge.
    vehicle-import:
      - q: Was ist der Unterschied zwischen Import und Fahrzeugsuche?
        a: Fahrzeugsuche ist, wenn Sie sich im selben Land wie das Auto befinden. Import bedeutet, dass das Auto aus Europa oder China nach Serbien zu Ihnen kommt.
      - q: Ist die Zollabwicklung im Preis inbegriffen?
        a: Ja, wir begleiten die Zollabwicklung in Serbien und rechnen sie in den Preis ein – die finale Summe nennen wir vor dem Deal.
      - q: Wie viel teurer wird das Auto „schlüsselfertig“ im Vergleich zu den Preisen in der Anzeige?
        a: 'Der Unterschied hängt vom Land, dem Alter des Fahrzeugs und dem Vorhandensein eines EUR1-Zertifikats ab – die vollständige Summe berechnen wir vor dem Start. Zur Orientierung: In einem unserer Fälle kostete ein BMW X1 in Deutschland 39.860 €, während es in Serbien, schlüsselfertig mit allen Kosten, Lieferung, Zoll und Formalitäten, 46.000 € ausmachte.'
      - q: Was braucht man, um das importierte Auto in Serbien zuzulassen?
        a: Sie können das Auto in Serbien nur auf sich registrieren, wenn Sie eine Aufenthaltserlaubnis erhalten haben, daher macht es Sinn, mit der Suche zu beginnen, wenn die Unterlagen bereits vorliegen. Die Zollabwicklung erfolgt in Subotica, danach bringen wir das Auto in Ihre Stadt und helfen bei der Zulassung.
    vehicle-buyback:
      - q: Wie viele Tage benötigt man, um ein Auto zu verkaufen, wenn es noch nicht verzollt oder umgeschrieben ist?
        a: Normalerweise 1–2 Tage, auch wenn das Auto noch nicht verzollt oder auf Sie umgeschrieben ist.
      - q: Kaufen Sie Autos, die sich in Kredit oder Pfand befinden?
        a: Nein, wir kaufen nur Fahrzeuge ohne laufenden Kredit oder Pfand.
      - q: Wie schnell erhält man das Geld nach der Inspektion?
        a: Am Tag der Vertragsunterzeichnung – sofort nach der Inspektion, wenn die Beschreibung übereinstimmt.
      - q: Gibt es Einschränkungen hinsichtlich Marke, Baujahr oder Kilometerstand?
        a: Ja – wir betrachten keine Fahrzeuge in schlechtem technischen Zustand und französische Marken.
      - q: Was passiert mit dem Auto nach dem Rückkauf?
        a: 'Danach kümmern wir uns darum: Wir organisieren den Transport und Verkauf selbst. Autos mit serbischen Kennzeichen verkaufen wir in der Regel auf dem Markt in Belgrad, Fahrzeuge mit russischen Kennzeichen exportieren wir und verkaufen sie in Russland.'
    vehicle-inspection:
      - q: Wie teuer ist die Inspektion und ist der Preis in allen Ländern gleich?
        a: Die Kosten variieren je nach Land und hängen vom Umfang der Überprüfung ab – den genauen Betrag nennen wir bei der Anfrage.
      - q: Kann man eine Inspektion bestellen, wenn man physisch nicht in diesem Land ist?
        a: Ja, Ihre Anwesenheit ist nicht erforderlich – Sie erhalten den Bericht und die Entscheidung remote.
      - q: In welcher Form liegt der Bericht vor?
        a: Fotos und eine detaillierte schriftliche Beschreibung nach der Inspektion.
      - q: Was passiert, wenn die Inspektion zeigt, dass das Auto nicht gekauft werden sollte?
        a: 'Sie erhalten einen Bericht mit Fotos und eine klare Antwort „nicht kaufen“ – und verlieren nur die Kosten für die Inspektion, nicht das Geld für das Auto. Der Bericht bleibt bei Ihnen, und wenn Sie sich dennoch entscheiden zu kaufen, können die festgestellten Mängel als Argument beim Verhandeln dienen: In einer unserer Inspektionen in Serbien hat dies den Preis um 700 Euro gesenkt.'
    general:
      - q: Wie wird die Arbeit bezahlt?
        a: Barzahlung am Tag des Deals – Sie überweisen kein Geld im Voraus.
      - q: Kann ich auch etwas anderes als über Telegram schreiben?
        a: Ja, neben Telegram sind auch Anrufe und WhatsApp möglich.
      - q: Wo befindet ihr euch?
        a: Unsere Basis ist in Belgrad, von dort aus fahren wir in ganz Serbien. In Deutschland, Spanien, der Schweiz und anderen europäischen Ländern arbeiten unsere Fachleute vor Ort.
      - q: Ist die Beratung kostenpflichtig?
        a: Nein. Wir besprechen die Angelegenheit und sagen offen, ob es realistisch ist, in Ihrem Budget zu bleiben. Die Kosten für die Arbeit nennen wir vor dem Start, und danach ändern sie sich nicht.
    cityExpert:
      q: Gibt es in jeder Stadt einen speziellen Experten?
      a: In verschiedenen Städten arbeiten unterschiedliche Spezialisten; in bestimmten Fällen kann ein Experte auch in eine benachbarte Stadt der Region fahren.
