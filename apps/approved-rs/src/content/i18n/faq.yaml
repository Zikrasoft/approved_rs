vehicle-sourcing:
  - q: Сколько занимает весь процесс, от заявки до машины у клиента?
    a: В среднем 3–14 дней, в зависимости от того, как быстро находится подходящий вариант на рынке.
  - q: Если найденная машина не подошла, продолжаете искать бесплатно?
    a: Да, продолжаем поиск без доплаты, пока не найдем то, что вам подходит.
  - q: Нужно ли самому ехать смотреть машину?
    a: Нет, необязательно, можем провести всю сделку без вашего присутствия. Хотите приехать и посмотреть сами? Тоже без проблем.
  - q: Даете ли фото- или видеоотчет по машине до принятия решения?
    a: Да, полный отчет с фото по машине, до того как вы принимаете решение о покупке.
  - q: Есть компенсация, если сроки сорваны по вашей вине?
    a: Фиксированной неустойки нет, срок сделки часто зависит не только от нас (переговоры с продавцом, оформление документов). Но называем реалистичный срок сразу и не тянем время.
vehicle-import:
  - q: Чем привоз отличается от автоподбора?
    a: Автоподбор нужен, когда вы находитесь в той же стране, что и автомобиль. Привоз нужен, когда машина едет к вам в Сербию из Европы или Китая.
  - q: Растаможка входит в стоимость?
    a: Да, сопровождаем растаможку в Сербии и включаем ее в расчет. Итоговую сумму называем до сделки.
  - q: Насколько машина «под ключ» дороже цены в объявлении?
    a: 'Разница зависит от страны, возраста автомобиля и наличия сертификата EUR1. Полную сумму мы считаем и фиксируем до старта. Для ориентира: в одной из наших сделок BMW X1 стоил в Германии 39 860 €, а под ключ в Сербии, со всеми расходами, доставкой, растаможкой и оформлением, вышел в 46 000 €.'
  - q: Что нужно, чтобы поставить привезенную машину на учет в Сербии?
    a: Оформить автомобиль на себя в Сербии можно только после получения ВНЖ, поэтому подбор имеет смысл начинать, когда документы уже на руках. Растаможка проходит в Суботице, после нее мы довозим машину до вашего города и сопровождаем постановку на учет.
vehicle-buyback:
  - q: За сколько дней можно продать машину, если она еще не растаможена или не переоформлена?
    a: Обычно 1–2 дня, даже если машина еще не растаможена или не переоформлена на вас.
  - q: Выкупаете машину в кредите или залоге?
    a: Нет, выкупаем только автомобили без действующего кредита или залога.
  - q: Как быстро приходят деньги после осмотра?
    a: В день подписания договора, сразу после осмотра, если описание совпало.
  - q: Есть ограничения по марке, году или пробегу?
    a: 'Да: не рассматриваем автомобили в плохом техническом состоянии и французские марки. Это ограничение только на выкуп: подобрать вам Peugeot или Renault мы по-прежнему можем.'
  - q: Что происходит с машиной после выкупа?
    a: 'Дальше она наша забота: транспортировку и продажу организуем мы сами. Машины на сербских номерах обычно уходят на рынке в Белграде, автомобили на российских номерах мы вывозим и реализуем в России.'
vehicle-inspection:
  - q: Сколько стоит проверка и одинакова ли цена во всех странах?
    a: Стоимость отличается по странам и зависит от объема проверки, точную цифру назовем при заявке.
  - q: Можно заказать проверку, если вас физически нет в этой стране?
    a: Да, ваше присутствие не обязательно. Отчет и решение получаете удаленно.
  - q: В каком виде отчет?
    a: Фото и подробное текстовое описание по итогам осмотра.
  - q: Что будет, если проверка покажет, что машину брать не стоит?
    a: 'Вы получаете отчет с фото и прямой ответ «не берите» и теряете стоимость проверки, а не деньги за машину. Отчет остается у вас, и если вы все-таки решите брать, найденные замечания работают как аргумент в торге: на одном из наших осмотров в Сербии это снизило цену на 700 евро.'
general:
  - q: Как оплачивается работа?
    a: Часть суммы вносится предоплатой, остальное по факту. Размер предоплаты зависит от услуги и суммы сделки, называем его до начала работ, чтобы условия были понятны обеим сторонам.
  - q: Можно написать не в Telegram?
    a: Да, помимо Telegram доступны звонки и WhatsApp.
  - q: Где вы находитесь?
    a: Наша база в Белграде, оттуда выезжаем по всей Сербии. В Германии, Испании, Швейцарии и других странах Европы работают наши специалисты на месте.
  - q: Консультация платная?
    a: Нет. Обсудим задачу и скажем честно, реально ли уложиться в ваш бюджет. Стоимость работы называем до старта, и потом она не меняется.
cityExpert:
  q: В каждом городе есть свой выделенный эксперт?
  a: В разных городах работают разные наши специалисты; в отдельных случаях эксперт выезжает в соседний город региона.
translations:
  en:
    vehicle-sourcing:
      - q: How long does the whole process take, from submitting a request to getting the car?
        a: On average, 3-14 days, depending on how quickly we find a suitable car on the market.
      - q: If the car we find isn't right for me, will you keep searching at no extra cost?
        a: Yes, we'll keep searching at no extra cost until we find a car that suits you.
      - q: Do I need to go and see the car myself?
        a: No, that's not necessary. We can handle the entire deal without you being there. If you'd like to come and see the car yourself, that's fine too.
      - q: Do you provide photos or a video report before I decide?
        a: Yes, we provide a full report with photos before you decide whether to buy the car.
      - q: Do you offer compensation if delays are your fault?
        a: We don't have a fixed penalty for delays, as the timeline often depends on factors beyond our control, such as negotiations with the seller and paperwork. But we give you a realistic timeframe from the start and don't drag things out.
    vehicle-import:
      - q: What's the difference between importing a car and finding one locally?
        a: Local car sourcing is for when you're in the same country as the car. Importing is for when the car is brought to Serbia from Europe or China.
      - q: Is customs clearance included in the price?
        a: Yes, we handle customs clearance in Serbia and include it in the cost estimate. We give you the final amount before the deal.
      - q: How much more does a turnkey car cost than the listed price?
        a: The difference depends on the country, the car's age, and whether it has an EUR.1 certificate. We calculate and confirm the full amount before getting started. For example, in one of our deals, a BMW X1 listed for €39,860 in Germany came to €46,000 turnkey in Serbia, including all costs, delivery, customs clearance, and paperwork.
      - q: What do I need to register an imported car in Serbia?
        a: You can register a car in your name in Serbia only after receiving a residence permit, so it makes sense to start the search once you have your documents. Customs clearance takes place in Subotica. After that, we deliver the car to your city and help you register it.
    vehicle-buyback:
      - q: How many days does it take to sell a car if it hasn't cleared customs or been transferred into my name yet?
        a: Usually 1-2 days, even if the car hasn't cleared customs or been transferred into your name yet.
      - q: Do you buy cars that are under finance or used as collateral?
        a: No, we only buy cars with no outstanding finance or liens.
      - q: How soon will I get paid after the inspection?
        a: On the day the contract is signed, immediately after the inspection, provided the car matches its description.
      - q: Are there any restrictions on make, year, or mileage?
        a: "Yes. We don't consider cars in poor mechanical condition or French makes. This restriction applies only to buybacks: we can still find you a Peugeot or Renault."
      - q: What happens to the car after you buy it?
        a: 'We take it from there: we handle the transport and sale ourselves. Cars with Serbian plates are usually sold on the Belgrade market, while cars with Russian plates are exported and sold in Russia.'
    vehicle-inspection:
      - q: How much does an inspection cost, and is the price the same in every country?
        a: Prices vary by country and depend on the scope of the inspection. We'll give you an exact quote when you submit a request.
      - q: Can I order an inspection if I'm not in the country?
        a: Yes, you don't need to be there. You'll receive the report and make your decision remotely.
      - q: What does the report include?
        a: Photos and a detailed written description of the inspection findings.
      - q: What if the inspection shows that I shouldn't buy the car?
        a: You'll receive a report with photos and a clear recommendation not to buy. You'll only lose the inspection fee, not the price of the car. The report is yours to keep, and if you decide to buy anyway, the issues we found can help you negotiate. One of our inspections in Serbia helped bring the price down by €700.
    general:
      - q: How do you charge for your services?
        a: You pay part of the amount upfront and the rest when the work is completed. The deposit depends on the service and the deal amount. We'll tell you how much it is before we start, so both sides know what to expect.
      - q: Can I contact you somewhere other than Telegram?
        a: Yes, you can also call us or reach us on WhatsApp.
      - q: Where are you based?
        a: We're based in Belgrade and travel from there throughout Serbia. We also have specialists on the ground in Germany, Spain, Switzerland, and other European countries.
      - q: Is the consultation free?
        a: Yes. We'll discuss what you need and tell you honestly whether your budget is realistic. We give you the price before starting, and it won't change later.
    cityExpert:
      q: Does every city have its own dedicated expert?
      a: We have different specialists working in different cities. In some cases, an expert will travel to a nearby city in the region.
  sr:
    vehicle-sourcing:
      - q: Koliko traje ceo proces, od upita do isporuke automobila?
        a: U proseku 3–14 dana, u zavisnosti od toga koliko brzo pronađemo odgovarajući automobil na tržištu.
      - q: Ako vam se pronađeni automobil ne dopadne, nastavljate li potragu bez doplate?
        a: Da, nastavljamo potragu bez doplate dok ne pronađemo automobil koji vam odgovara.
      - q: Da li moram lično da idem da pogledam automobil?
        a: Ne, nije neophodno. Možemo da završimo ceo posao bez vašeg prisustva. Ako želite da dođete i sami pogledate automobil, može i tako.
      - q: Da li dobijam foto ili video izveštaj o automobilu pre donošenja odluke?
        a: Da, dobijate detaljan izveštaj sa fotografijama pre nego što odlučite da li ćete kupiti automobil.
      - q: Da li postoji nadoknada ako zbog vas dođe do kašnjenja?
        a: Ne postoji fiksna naknada za kašnjenje, jer rok često ne zavisi samo od nas, već i od pregovora sa prodavcem i pripreme dokumentacije. Ipak, odmah navodimo realan rok i ne odugovlačimo.
    vehicle-import:
      - q: Koja je razlika između uvoza automobila i pronalaženja automobila?
        a: Pronalaženje automobila je za slučaj kada ste u istoj zemlji kao i automobil. Uvoz vam je potreban kada automobil iz Evrope ili Kine stiže u Srbiju.
      - q: Da li je carinjenje uključeno u cenu?
        a: Da, organizujemo carinjenje u Srbiji i uključujemo ga u obračun. Konačan iznos navodimo pre početka posla.
      - q: Koliko je skuplji automobil sa uslugom 'ključ u ruke' od cene iz oglasa?
        a: 'Razlika zavisi od zemlje, starosti automobila i toga da li ima sertifikat EUR1. Pre početka izračunavamo i fiksiramo ukupan iznos. Za orijentaciju: u jednom od naših slučajeva, BMW X1 je u Nemačkoj koštao 39 860 €, a sa svim troškovima, prevozom, carinjenjem i registracijom, u Srbiji je ukupno koštao 46 000 €.'
      - q: Šta je potrebno da bi se uvezeni automobil registrovao u Srbiji?
        a: Automobil možete registrovati na svoje ime u Srbiji tek nakon dobijanja boravišne dozvole, zato ima smisla da potragu započnete kada već imate dokumenta. Carinjenje se obavlja u Subotici, a nakon toga dovozimo automobil do vašeg grada i pomažemo vam oko registracije.
    vehicle-buyback:
      - q: Za koliko dana možete da prodate automobil ako još nije ocarinjen ili prenet na vaše ime?
        a: Obično za 1–2 dana, čak i ako automobil još nije ocarinjen ili prenet na vaše ime.
      - q: Da li otkupljujete automobile koji su na kredit ili pod zalogom?
        a: Ne, otkupljujemo samo automobile koji nisu pod aktivnim kreditom ili zalogom.
      - q: Koliko brzo dobijam novac nakon pregleda?
        a: Na dan potpisivanja ugovora, odmah nakon pregleda, ako se stanje poklapa sa opisom.
      - q: Postoje li ograničenja u pogledu marke, godišta ili kilometraže?
        a: 'Da: ne razmatramo automobile u lošem tehničkom stanju ni francuske marke. Ovo ograničenje se odnosi samo na otkup. I dalje možemo da vam pronađemo Peugeot ili Renault.'
      - q: Šta se dešava sa automobilom nakon otkupa?
        a: 'Nakon otkupa, mi preuzimamo sve obaveze: sami organizujemo prevoz i prodaju. Automobili sa srpskim tablicama obično se prodaju na tržištu u Beogradu, dok automobile sa ruskim tablicama izvozimo i prodajemo u Rusiji.'
    vehicle-inspection:
      - q: Koliko košta provera auta pre kupovine i da li je cena ista u svim zemljama?
        a: Cena se razlikuje od zemlje do zemlje i zavisi od obima provere. Tačan iznos ćemo vam reći kada pošaljete upit.
      - q: Mogu li da naručim proveru auta pre kupovine ako nisam fizički u toj zemlji?
        a: Da, ne morate biti prisutni. Izveštaj dobijate, a odluku donosite na daljinu.
      - q: U kom obliku dobijam izveštaj o proveri auta pre kupovine?
        a: Dobijate fotografije i detaljan tekstualni opis nalaza nakon pregleda.
      - q: Šta ako provera auta pre kupovine pokaže da automobil ne treba kupiti?
        a: 'Dobićete izveštaj sa fotografijama i jasan odgovor: "nemojte ga kupiti". Plaćate samo proveru, a ne automobil. Izveštaj ostaje kod vas, a ako ipak odlučite da kupite automobil, uočeni nedostaci mogu vam poslužiti kao argument za pregovore o ceni. Tokom jedne provere u Srbiji, tako smo snizili cenu za 700 evra.'
    general:
      - q: Kako se plaćaju vaše usluge?
        a: Deo iznosa plaća se unapred, a ostatak nakon obavljenog posla. Visina avansa zavisi od usluge i vrednosti posla. Navodimo je pre početka, kako bi uslovi bili jasni obema stranama.
      - q: Mogu li da vam pišem i van Telegrama?
        a: Da, možete nas pozvati ili nam pisati na WhatsApp.
      - q: Gde se nalazite?
        a: Naša baza je u Beogradu, odakle pokrivamo celu Srbiju. U Nemačkoj, Španiji, Švajcarskoj i drugim evropskim zemljama imamo stručnjake na licu mesta.
      - q: Da li se konsultacije naplaćuju?
        a: Ne. Razgovaraćemo o vašem zahtevu i iskreno vam reći da li je moguće uklopiti se u budžet. Cenu usluge navodimo pre početka i ona se kasnije ne menja.
    cityExpert:
      q: Da li u svakom gradu imate svog stručnjaka?
      a: U različitim gradovima rade različiti naši stručnjaci. U nekim slučajevima, stručnjak može da ode i u susedni grad u regionu.
  es:
    vehicle-sourcing:
      - q: ¿Cuánto dura todo el proceso, desde la solicitud hasta la entrega del coche?
        a: De media, entre 3 y 14 días, según lo rápido que encontremos una opción adecuada en el mercado.
      - q: Si el coche que encuentran no me convence, ¿siguen buscando sin cobrar extra?
        a: Sí, seguimos buscando sin coste adicional hasta encontrar uno que se ajuste a lo que necesitas.
      - q: ¿Tengo que ir personalmente a ver el coche?
        a: No, no es necesario. Podemos gestionar toda la operación sin que estés presente. ¿Prefieres venir a verlo? También puedes hacerlo, sin problema.
      - q: ¿Envían fotos o vídeos del coche antes de que tome una decisión?
        a: Sí, te enviamos un informe completo con fotos antes de que decidas si lo compras.
      - q: ¿Hay alguna compensación si se incumplen los plazos por culpa de ustedes?
        a: 'No hay una penalización fija, ya que los plazos no dependen solo de nosotros: también influyen las negociaciones con el vendedor y la tramitación de documentos. Pero desde el principio te damos un plazo realista y no alargamos el proceso.'
    vehicle-import:
      - q: ¿En qué se diferencia la importación de la búsqueda de coches?
        a: La búsqueda es para cuando estás en el mismo país que el coche. La importación es para traerlo a Serbia desde Europa o China.
      - q: ¿El precio incluye el despacho de aduanas?
        a: Sí, nos encargamos del despacho de aduanas en Serbia y lo incluimos en el cálculo. Te damos el importe total antes de cerrar la operación.
      - q: ¿Cuánto más cuesta el coche puesto en Serbia que el precio del anuncio?
        a: La diferencia depende del país, la antigüedad del coche y de si tiene certificado EUR1. Calculamos y fijamos el precio total antes de empezar. Como referencia, en una de nuestras operaciones, un BMW X1 costaba 39 860 € en Alemania y salió por 46 000 € puesto en Serbia, con todos los gastos, transporte, despacho de aduanas y trámites incluidos.
      - q: ¿Qué necesito para matricular en Serbia un coche importado?
        a: Solo puedes matricular el coche a tu nombre en Serbia después de obtener el permiso de residencia. Por eso, conviene empezar la búsqueda cuando ya tengas los documentos. El despacho de aduanas se hace en Subotica. Después llevamos el coche hasta tu ciudad y te ayudamos con la matriculación.
    vehicle-buyback:
      - q: ¿En cuántos días puedo vender el coche si aún no está despachado de aduanas o transferido a mi nombre?
        a: Normalmente, en 1 o 2 días, aunque el coche aún no esté despachado de aduanas o transferido a tu nombre.
      - q: ¿Compran coches financiados o con cargas?
        a: No, solo compramos coches sin financiación ni cargas vigentes.
      - q: ¿Cuánto tardan en pagar después de la inspección?
        a: Pagamos el mismo día en que se firma el contrato, justo después de la inspección, siempre que el estado del coche coincida con lo descrito.
      - q: ¿Hay restricciones por marca, año o kilometraje?
        a: 'Sí. No compramos coches en mal estado mecánico ni de marcas francesas. Esta restricción solo se aplica a la compra por nuestra parte: podemos seguir buscando un Peugeot o un Renault para ti.'
      - q: ¿Qué pasa con el coche después de que lo compren?
        a: 'A partir de ahí nos ocupamos nosotros: organizamos el transporte y la venta. Los coches con matrícula serbia suelen venderse en el mercado de Belgrado; los que tienen matrícula rusa los sacamos del país y los vendemos en Rusia.'
    vehicle-inspection:
      - q: ¿Cuánto cuesta la inspección y es el mismo precio en todos los países?
        a: El precio varía según el país y el alcance de la inspección. Te damos el importe exacto cuando nos contactes.
      - q: ¿Puedo pedir una inspección si no estoy en ese país?
        a: Sí, no hace falta que estés presente. Recibirás el informe y podrás tomar la decisión a distancia.
      - q: ¿En qué formato se entrega el informe?
        a: Incluye fotos y una descripción detallada por escrito de los resultados de la inspección.
      - q: ¿Qué pasa si la inspección indica que no debería comprar el coche?
        a: 'Recibirás un informe con fotos y una recomendación clara: "no lo compres". Solo perderás el coste de la inspección, no el dinero del coche. El informe es tuyo y, si aun así decides comprarlo, los problemas detectados te servirán para negociar. En una de nuestras inspecciones en Serbia, conseguimos reducir el precio en 700 euros.'
    general:
      - q: ¿Cómo se paga el servicio?
        a: Una parte se paga por adelantado y el resto al finalizar el trabajo. El importe del anticipo depende del servicio y del valor de la operación. Te lo indicamos antes de empezar para que las condiciones estén claras para ambas partes.
      - q: ¿Puedo contactarles por otro medio que no sea Telegram?
        a: Sí, además de Telegram, puedes llamarnos o escribirnos por WhatsApp.
      - q: ¿Dónde están ubicados?
        a: Nuestra base está en Belgrado y desde allí nos desplazamos por toda Serbia. También contamos con especialistas sobre el terreno en Alemania, España, Suiza y otros países europeos.
      - q: ¿La consulta es de pago?
        a: No. Hablaremos de lo que necesitas y te diremos con sinceridad si es posible ajustarnos a tu presupuesto. Te comunicamos el coste del servicio antes de empezar y no cambia después.
    cityExpert:
      q: ¿Hay un especialista asignado en cada ciudad?
      a: Tenemos distintos especialistas en distintas ciudades; en algunos casos, uno de ellos se desplaza a otra ciudad de la región.
  de:
    vehicle-sourcing:
      - q: Wie lange dauert der gesamte Ablauf, von der Anfrage bis zur Übergabe des Autos?
        a: Im Durchschnitt 3 bis 14 Tage, je nachdem, wie schnell sich ein passendes Auto auf dem Markt findet.
      - q: Suchen Sie kostenlos weiter, wenn das gefundene Auto nicht passt?
        a: Ja, wir suchen ohne Aufpreis weiter, bis wir das Richtige für Sie gefunden haben.
      - q: Muss ich selbst zur Besichtigung des Autos fahren?
        a: Nein, das ist nicht nötig. Wir können den gesamten Kauf ohne Ihre Anwesenheit abwickeln. Sie möchten selbst kommen und sich das Auto ansehen? Auch das ist kein Problem.
      - q: Erhalte ich vor meiner Entscheidung einen Foto- oder Videobericht über das Auto?
        a: Ja, Sie erhalten einen vollständigen Fotobericht, bevor Sie über den Kauf entscheiden.
      - q: Gibt es eine Entschädigung, wenn Sie für eine Verzögerung verantwortlich sind?
        a: Eine feste Vertragsstrafe gibt es nicht. Der Zeitplan hängt oft auch von Faktoren ab, die wir nicht beeinflussen können, etwa den Verhandlungen mit dem Verkäufer oder der Abwicklung der Unterlagen. Wir nennen Ihnen von Anfang an einen realistischen Zeitrahmen und verzögern den Ablauf nicht unnötig.
    vehicle-import:
      - q: Was ist der Unterschied zwischen der Autosuche und dem Import?
        a: Die Autosuche ist für den Fall gedacht, dass Sie sich im selben Land wie das Auto befinden. Beim Import wird das Auto aus Europa oder China nach Serbien gebracht.
      - q: Ist die Zollabfertigung im Preis enthalten?
        a: Ja, wir begleiten die Zollabfertigung in Serbien und berücksichtigen sie in der Kalkulation. Den Gesamtbetrag nennen wir Ihnen vor dem Kauf.
      - q: Wie viel teurer ist ein Auto schlüsselfertig als der Inseratspreis?
        a: 'Der Unterschied hängt vom Land, dem Alter des Autos und davon ab, ob ein EUR.1-Zertifikat vorliegt. Wir berechnen und bestätigen den Gesamtbetrag vor Beginn. Zur Orientierung: Bei einem unserer Käufe kostete ein BMW X1 in Deutschland 39.860 €, schlüsselfertig in Serbien inklusive aller Kosten, Transport, Zollabfertigung und Zulassung 46.000 €.'
      - q: Was brauche ich, um ein importiertes Auto in Serbien zuzulassen?
        a: Sie können ein Auto in Serbien erst auf Ihren Namen zulassen, wenn Sie eine Aufenthaltserlaubnis haben. Deshalb lohnt es sich, mit der Suche zu beginnen, sobald Sie Ihre Unterlagen erhalten haben. Die Zollabfertigung erfolgt in Subotica. Danach bringen wir das Auto in Ihre Stadt und begleiten Sie bei der Zulassung.
    vehicle-buyback:
      - q: Wie schnell kann ich mein Auto verkaufen, wenn es noch nicht verzollt oder umgeschrieben ist?
        a: In der Regel innerhalb von 1 bis 2 Tagen, auch wenn das Auto noch nicht verzollt oder auf Sie umgeschrieben ist.
      - q: Kaufen Sie Autos, die finanziert oder verpfändet sind?
        a: Nein, wir kaufen nur Autos ohne laufende Finanzierung oder Verpfändung.
      - q: Wie schnell erhalte ich nach der Besichtigung mein Geld?
        a: Am Tag der Vertragsunterzeichnung, direkt nach der Besichtigung, sofern die Angaben zum Auto stimmen.
      - q: Gibt es Einschränkungen bei Marke, Baujahr oder Kilometerstand?
        a: 'Ja. Wir kaufen keine Autos in schlechtem technischen Zustand und keine französischen Marken. Das gilt nur für den Ankauf: Einen Peugeot oder Renault können wir weiterhin für Sie suchen.'
      - q: Was passiert nach dem Ankauf mit dem Auto?
        a: 'Danach kümmern wir uns um alles: Wir organisieren selbst den Transport und den Verkauf. Autos mit serbischen Kennzeichen werden in der Regel in Belgrad verkauft. Autos mit russischen Kennzeichen bringen wir nach Russland und verkaufen sie dort.'
    vehicle-inspection:
      - q: Was kostet eine Fahrzeugprüfung und ist der Preis in allen Ländern gleich?
        a: Die Kosten unterscheiden sich je nach Land und Umfang der Prüfung. Den genauen Preis nennen wir Ihnen bei Ihrer Anfrage.
      - q: Kann ich eine Prüfung beauftragen, wenn ich nicht selbst in dem Land bin?
        a: Ja, Sie müssen nicht vor Ort sein. Sie erhalten den Bericht und können Ihre Entscheidung aus der Ferne treffen.
      - q: In welcher Form erhalte ich den Bericht?
        a: Sie erhalten Fotos und eine ausführliche schriftliche Beschreibung der Prüfergebnisse.
      - q: Was passiert, wenn die Prüfung ergibt, dass ich das Auto besser nicht kaufen sollte?
        a: 'Sie erhalten einen Fotobericht und eine klare Empfehlung, das Auto nicht zu kaufen. Sie verlieren nur die Prüfgebühr, nicht den Kaufpreis. Der Bericht gehört Ihnen. Falls Sie sich trotzdem für den Kauf entscheiden, können Sie die festgestellten Mängel als Argument bei den Preisverhandlungen nutzen: Bei einer unserer Prüfungen in Serbien konnten wir den Preis so um 700 Euro senken.'
    general:
      - q: Wie wird Ihre Arbeit bezahlt?
        a: Ein Teil des Betrags wird im Voraus bezahlt, der Rest nach Abschluss der Arbeit. Die Höhe der Anzahlung hängt von der Dienstleistung und dem Kaufpreis ab. Wir nennen sie Ihnen vor Beginn, damit die Bedingungen für beide Seiten klar sind.
      - q: Kann ich Sie auch außerhalb von Telegram kontaktieren?
        a: Ja, Sie erreichen uns auch telefonisch und über WhatsApp.
      - q: Wo sind Sie ansässig?
        a: Unser Standort ist in Belgrad. Von dort aus sind wir in ganz Serbien im Einsatz. In Deutschland, Spanien, der Schweiz und anderen europäischen Ländern haben wir Mitarbeiter vor Ort.
      - q: Ist die Beratung kostenpflichtig?
        a: Nein. Wir besprechen Ihr Anliegen und sagen Ihnen ehrlich, ob sich Ihr Budget einhalten lässt. Die Kosten für unsere Arbeit nennen wir Ihnen vor Beginn und ändern sie danach nicht.
    cityExpert:
      q: Gibt es in jeder Stadt einen festen Ansprechpartner?
      a: In den verschiedenen Städten sind unterschiedliche Mitarbeiter von uns tätig. In manchen Fällen fährt ein Experte auch in eine Nachbarstadt in der Region.
