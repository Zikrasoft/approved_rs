    vehicle-inspection:
      title: Vehicle Inspection
      description: Independent inspection of the car before purchase. Expert visit, diagnostics, report — no purchase obligation.
      ctaLabel: Order Inspection
      casesHeading: Inspection Cases
      breadcrumbLabel: Vehicle Inspection
      steps:
        - n: '01'
          text: Bodywork and paint — signs of repair or accidents
        - n: '02'
          text: Chassis, suspension, brakes
        - n: '03'
          text: Engine, transmission, gearbox
        - n: '04'
          text: Electronics and service history via VIN
        - n: '05'
          text: Legal cleanliness — collateral, registration bans, accidents
      extraLine: We operate in other European countries as well, including Portugal — please specify when applying.
      hub:
        metaTitle: Car Inspection Before Purchase in Europe
        metaDescription: 'We visit the car you found yourself: thickness gauge, scanner, VIN history check, and report with photos on the same day. We work in eight European countries.'
        title: Vehicle Inspection
        titleHighlight: Before Purchase
        description: "We visit the car you found, giving you a clear picture of its condition. The report arrives before you hand over any money: if the response is 'don’t buy', you only lose the cost of the inspection."
        breadcrumbLabel: Vehicle Inspection
        casesHeading: Inspection Cases
        chooseCountryLabel: 'Select a Country:'
        ctaLabel: Order Inspection
        heroPhotoAlt: Car on a lift in a service center
        processHeading: How the Inspection Works
        processLead: Typically, we can inspect within one to two days after your application. The inspection takes about one and a half to two hours, and we send the report the same day, while the car is still available.
        processSteps:
          - n: '01'
            text: You send a link to the ad and the seller's contact information
          - n: '02'
            text: We negotiate with the seller about the time and place of the inspection
          - n: '03'
            text: We arrive with a thickness gauge and scanner; for BMW, we connect to the dealership ISTA, and if needed — put it on a lift
          - n: '04'
            text: We take photos and videos of all findings, and check the VIN history
          - n: '05'
            text: We send the report and a direct recommendation — buy, negotiate, or decline
        includedHeading: What’s Included in the Inspection
        includedLead: 'The checklist has over a hundred items, but almost always four areas are decisive: body, engine with gearbox, chassis, and documents. These are the areas where we most often advise against purchase.'
        included:
          - title: Bodywork and Paint
            text: Thickness measurement for each panel, geometry of openings, signs of welding and filler. You can see if there was a repair not mentioned by the seller.
          - title: Engine and Gearbox
            text: Parameters on a warmed-up engine, gearbox adaptations, error codes in the memory of control units. This is the most expensive area and the most frequent reason for refusal.
          - title: Chassis and Brakes
            text: Play, condition of the suspension and braking system. Highway mileage and Balkan roads wear the vehicle differently, and this is noticeable.
          - title: Electronics and VIN History
            text: CarVertical report, dealership service history by make, discrepancies in mileage with history, error codes, and signs of deployed airbags.
          - title: Legal Cleanliness
            text: Collateral, registration restrictions, unresolved accidents and insurance events — issues that may arise after purchase.
          - title: Report with Photos and Videos
            text: Each finding is documented with photos and descriptions. The report is yours to keep — convenient for negotiations, even if you decide to proceed with the purchase.
        compareHeading: What Changes from Country to Country
        compareLead: The regulations for technical inspections, typical issues with local cars, and methods to hide history vary everywhere.
        compareHint: Select a country — we'll show what we add to the regular checklist.
        compareLinkFor: Inspection {location} — in detail
        mapHeading: Four Areas that Decide the Deal
        mapLead: The checklist is long, but we almost always advise against purchase based on one of four areas. Click on the number in the diagram — we'll show what the expert looks for and what we’ve found there.
      countryNotesHeadingFor: How We Inspect {location}
      countryNotesPointsLabel: What We Check Beyond the Regular Checklist
      countryNotes:
        de:
          lead: 'In Germany, there’s a lot to rely on: service books, HU protocols, and extensive VIN databases. Therefore, the inspection here primarily involves matching documents with what the car shows.'
          points:
            - We verify dealer service records against odometer readings over the years
            - Noted issues from the last HU — what was repaired after the inspection and what was just temporarily patched
            - The underside and sills after winter treatments, including hidden cavities
            - 'Leasing history: consistent servicing with high mileage'
        rs:
          lead: "In Serbia, we respond on the same day as your inquiry. The main task is to recover the car's history before import: local documents only show the final stage of the car's life."
          points:
            - Country of origin and condition of the vehicle before it was imported into Serbia
            - Odometer readings against technical inspection notes from previous years
            - Body repairs after import — they are done more often and cheaper than in the EU
            - 'Legal aspects: collateral and registration restrictions'
        es:
          lead: Spanish cars usually have solid undercarriages but suffer from sun and salt damage. We shift the focus of the inspection from corrosion underneath to hidden cavities, electrical systems, and the condition of the interior.
          points:
            - Corrosion in hidden cavities near the coast — it can look clean underneath
            - Paint, seals, and plastics after years of sun exposure
            - 'Rental history: we check mileage against the wear pattern of the interior'
            - ITV protocol and unresolved issues between inspections
        ch:
          lead: MFK cars are seriously prepared, so a fresh protocol on its own says little. We look at what was done right before the inspection and what has been maintained since last year.
          points:
            - What was replaced just before MFK — new parts compared to the rest
            - Servicing is expensive, so we check for any postponed maintenance
            - The equipment may be rich, but we verify that each option still works
            - 'Import documents: Switzerland is not EU, and the set differs'
        pt:
          lead: 'Everything here comes down to the humid coastal climate. We start the inspection with corrosion and electrical systems: typically, issues arise from dampness.'
          points:
            - Hidden cavities, reinforcements, and suspension anchor points
            - Oxidation of connectors and blocks — a common cause of floating errors
            - IPO protocol and frequency of inspections
            - 'Diesels used in urban settings: soot filter and its history'
        fr:
          lead: 'In France, a detailed contrôle technique serves as a good starting point. From there, we examine what the regulations don’t catch: diesel component lifespan and wear from urban traffic.'
          points:
            - Comments from contrôle technique over the years — what repeats from inspection to inspection
            - Soot filter, EGR, and turbo issues on diesels
            - Clutch and suspension after a dense urban cycle
            - 'History on French brands: available spare parts, but their weak points'
        it:
          lead: Italian cars often arrive with minor body repairs done quickly and cheaply. More time is usually required for thickness measurement on panels in this context.
          points:
            - Thickness check on all panels — touch-ups from city parking scrapes
            - 'The difference between the north and south: salt near the coast, regular wear in the interior'
            - Gas equipment, if installed — its setup and the condition of the tank
            - Frequency of revisione and missed periods
        pl:
          lead: Poland is the largest transit market for damaged cars from Western Europe. Therefore, we first determine what has been done to the body before the sale.
          points:
            - Geometry of openings and signs of welding — restoration after serious accidents
            - 'History of import: where the car came from and in what condition'
            - We compare mileage with European service databases, we do not trust the odometer
            - Airbags and their deployment history
      closing:
        eyebrow: Found a car?
        line1: Send us the link
        line2: to the ad —
        accentWord: we'll come and take a look
        text: We can arrive within one to two days. The report with photos is yours to keep, even if you decide not to proceed with the purchase afterward.
    cityVehicleSourcing:
      title: Car Sourcing
      descriptionFor: We will help you find a car in {cityLocation} with a thorough inspection. Available throughout {countryName}.
      casesHeadingFor: Cases from {countryGenitiveOrName}
      whyCityHeadingFor: Why {cityName}
      reason1: We look at both dealer listings and private ads
      reason2: Check the history by VIN before going for an inspection
      reason3For: Our expert in {cityLocation}
      reason4Dekra: DEKRA / TÜV inspection available upon request
      reason4Generic: Independent technical expertise available upon request
      otherCitiesLabelFor: 'Other cities in {countryLocation}:'
      cityNotesHeadingFor: Car Market in {cityLocation}
      cityNotesPointsLabel: What this means in practice
      cityNotes:
        berlin:
          lead: "Berlin has the largest selection in Germany and a diverse range of sellers. You'll find everything here: from cars from corporate fleets with full histories to resold options from Eastern Europe."
          points:
            - A huge selection in every segment, including rare configurations
            - Many private sellers — bargaining is more realistic than with dealers
            - 'Urban driving: clutch and suspension wear out more noticeably than on autobahn cars'
        munich:
          lead: 'An expensive city with expensive cars. The premium segment here is larger than anywhere else in Germany, and the condition is usually better: these cars are well-maintained.'
          points:
            - Strong premium segment, especially BMW and Mercedes
            - Well-kept cars with complete dealer histories
            - Prices are higher than the national average — savings come from the condition
        hamburg:
          lead: A port city and major logistics hub. It's convenient to ship cars from here, and you're likely to find fresh imported cars on the market.
          points:
            - The port nearby makes shipping easier and cheaper
            - Many cars from northern regions with highway mileage
            - 'Moist maritime climate: we inspect the bodywork and hidden cavities more carefully'
        belgrade:
          lead: Our base. In Belgrade, we can inspect the car on the same day you contact us, we know local sellers, and we can see which cars have been on the market for two months.
          points:
            - Inspection on the same day, no waiting or logistics involved
            - We know local listings and the history of the cars on them
            - The car is already customs cleared — no import taxes or duties needed
        novi-sad:
          lead: The second-largest city in Serbia, just an hour's drive from Belgrade. The market is smaller, but prices are usually calmer than in the capital, and cars are less likely to have gone through multiple resales.
          points:
            - Prices are lower than in Belgrade for comparable conditions
            - Fewer resellers, first owners are more common
            - We travel from Belgrade, and there’s no separate charge for the journey
        pancevo:
          lead: Pančevo is essentially part of the Belgrade agglomeration, so inspections here are the same as in the capital. The market is small, but the private listings are often more interesting.
          points:
            - Twenty minutes from Belgrade — we can go just as quickly
            - A small market with a predominance of private sellers
            - Often cheaper than the capital for the same condition
        subotica:
          lead: 'Subotica is on the border with Hungary, which is reflected in the market: many cars imported from the EU, and sellers who do this regularly.'
          points:
            - Border market — plenty of fresh imports from the European Union
            - We check the history thoroughly before import
            - Convenient point if you plan to drive the car further north
        madrid:
          lead: 'The capital market of Spain: the largest selection in the country and many cars from corporate fleets. The continental climate means less coastal corrosion than on the coast.'
          points:
            - The largest selection in Spain, including corporate vehicles
            - Far from the sea — bodies are usually cleaner than coastal ones
            - 'Hot summers: we check plastics, paint, and air conditioning separately'
        barcelona:
          lead: Proximity to the sea is crucial. Cars often look great underneath, but hidden cavities and electrical systems require attention.
          points:
            - 'The sea nearby means we inspect hidden cavities: underneath is often clean, but inside is not'
            - Many former rental and car-sharing vehicles
            - With the port nearby, shipping over water is easier to arrange
        zurich:
          lead: Zurich has the most expensive car market in the region. Top-tier configurations are common here, well-maintained with dealer servicing, and cars tend to be sold before they accumulate age.
          points:
            - Maximum configurations and low mileage
            - Dealer servicing — history is almost always complete
            - Switzerland isn’t in the EU, import procedures are separate
        geneva:
          lead: Geneva is located in the French-speaking part of Switzerland, right by the border with France. There are noticeably more French brands on the market than in the German part of the country.
          points:
            - 'Mixed market: Swiss condition, French assortment'
            - The border with France is near — there’s much to compare in terms of price
            - 'Same procedures as throughout Switzerland: export plus import'
        paris:
          lead: 'The largest selection in France comes with the harshest usage: dense traffic and tight parking leave marks on the body and suspension.'
          points:
            - The biggest selection in France, especially of French brands
            - 'Urban driving: clutch, suspension, and minor body damages'
            - Many diesels — particulate filters and EGR are our top priority
        lyon:
          lead: Lyon is calmer than Paris in terms of prices and the condition of cars. The highway to the south is nearby, so you often find cars with smooth highway mileage.
          points:
            - Prices are lower than in Paris for comparable selections
            - More highway mileage, less urban wear and tear
            - Convenient route to Italy and Spain if we’re looking broadly
        milan:
          lead: 'The business capital of Italy, and you can tell in the market. The northern part of the country is closer to German conditions: better roads, better-kept cars than those in the south.'
          points:
            - The best selection of the premium segment in Italy
            - The north has less salt and corrosion compared to the south
            - 'Dense city: a thickness gauge for panels is essential'
        rome:
          lead: A large market with very intensive urban usage. Minor scrapes are considered a normal part of life, and they’re often fixed rather carelessly.
          points:
            - Many small cars and vehicles with gas installations
            - Frequent touch-ups after urban contacts — we check every panel
            - South of Milan — the climate is milder, but closer to the sea
        warsaw:
          lead: Most imports from Western Europe enter the country through Warsaw, which also offers the largest selection in Poland. The share of restored cars is also the highest.
          points:
            - The largest selection in Poland, many fresh imports from the EU
            - We check the geometry of the body and signs of repairs first
            - Short delivery distance — cheaper than from Southern Europe
        krakow:
          lead: 'Kraków is calmer than Warsaw: the market is smaller, fewer resales, and cars more often stay with one owner longer. Southern Poland is logistically closer to the Balkans.'
          points:
            - Fewer resellers than in Warsaw, histories are usually cleaner
            - Prices are often lower than in the capital
            - Closer to the route south — convenient for delivery to Serbia
