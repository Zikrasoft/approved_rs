        heroPhotoAlt: Llaves de coche sobre dinero y documentos
        processHeading: ¿Cómo se realiza la compra?
        processLead: De la primera consulta al dinero, generalmente pasan dos o tres días, y casi todo este tiempo se dedica al trayecto hasta el lugar de encuentro. Proporcionamos la evaluación por foto en una hora.
        processSteps:
          - n: '01'
            text: Envías fotos, documentos y una descripción honesta del estado
          - n: '02'
            text: Damos el precio en una hora, directamente el final, sin rango
          - n: '03'
            text: Acuerdamos un encuentro allí donde está el coche; si no está en funcionamiento, llegamos con un remolque
          - n: '04'
            text: Inspeccionamos en persona y confirmamos el precio si la descripción coincide
          - n: '05'
            text: Firmamos el contrato, el dinero se transfiere el día de la firma
        includedHeading: ¿Qué asumimos nosotros?
        includedLead: Por la diferencia entre nuestro precio y el del mercado nos quedamos con todo lo que hace que tal coche no se venda durante meses.
        included:
          - title: Coches con matrículas rusas
            text: Categoría principal. El coche puede estar en cualquier país de Europa, iremos a donde se encuentre, y ocupamos la retirada y posterior reventa nosotros.
          - title: Problemas con la importación y los plazos
            text: Tras la firma, los riesgos relacionados con la importación caducada pasan a ser nuestros.
          - title: Evaluación sin inspección
            text: Damos el precio basándonos en fotos y documentos. Vamos solo cuando ambas partes ya han acordado la suma.
          - title: Formalización de la transacción
            text: Nosotros preparamos el contrato, la baja y todos los documentos. De tu parte, solo se necesitan los documentos del coche y tu firma.
          - title: Pago el día de la firma
            text: Transferimos el dinero ese mismo día. No tenemos esquemas de pago a plazos ni de ‘paga después de la reventa’.
          - title: Rechazo honesto
            text: Si el coche no nos conviene, lo diremos de inmediato y explicaremos la razón. No estiraremos ni bajaremos el precio sobre la marcha.
