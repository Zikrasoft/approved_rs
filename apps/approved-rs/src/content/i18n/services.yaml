          - title: Export und Transit
            text: Abmeldung im Verkaufsland, Exportdeklaration, Transitnummern und Versicherung für die Überführung.
          - title: Zollabwicklung
            text: Deklaration, Broker und Zahlung am Ankunftsort. Wir bereiten das Paket im Voraus vor, damit das Auto nicht unnötige Tage im Lager steht.
          - title: Zulassung
            text: Technische Überprüfung, Registrierung und Kennzeichen. Sie holen das Auto ab, mit dem Sie sofort fahren können.
