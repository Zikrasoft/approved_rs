        metaDescription: Importamos coches de Alemania, España, Suiza y China a cualquier país. Búsqueda, inspección, transporte y despacho de aduanas, llave en mano.
        title: Importación de coches
        titleHighlight: de Europa y China
        description: Su coche en Europa o China, usted donde quiera. Lo buscamos, revisamos y entregamos con todo resuelto, incluido el despacho de aduanas.
        breadcrumbLabel: Importación de coches
        casesHeading: Casos reales de importación
        euCardTitle: Desde Europa
        euCardText: 'España, Suiza y otros países: buscamos su coche y lo llevamos a cualquier destino.'
        chinaCardTitle: Desde China
