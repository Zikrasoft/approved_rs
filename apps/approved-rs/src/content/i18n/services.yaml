      hub:
        metaTitle: Búsqueda de coches en Europa llave en mano
        metaDescription: 'Buscamos coches en Alemania, Serbia, España, Suiza, Italia, Francia, Polonia y Portugal: búsqueda, inspección, negociación y entrega llave en mano.'
        title: Búsqueda de coches
        titleHighlight: llave en mano
        description: Encontramos un automóvil en el país donde se encuentra o donde planea comprar, con verificación completa, asistencia en la transacción y entrega llave en mano. Elija un país para ver los detalles.
        breadcrumbLabel: Búsqueda de coches
        casesHeading: Casos de búsqueda de coches
        chooseCountryLabel: 'Seleccione un país:'
        ctaLabel: Buscar coche
        heroPhotoAlt: Fila de coches en el concesionario
        processHeading: Cómo se lleva a cabo la búsqueda
        processLead: 'Desde la solicitud hasta la entrega de llaves, generalmente toma entre tres días y dos semanas. Lo que más tarda es encontrar el coche: no tomamos el primer adecuado y seguimos buscando hasta encontrar uno que no tenga preguntas tras la verificación.'
        processSteps:
          - n: '01'
            text: 'Discutimos el presupuesto, la marca y los requisitos: qué es importante y qué se puede sacrificar'
          - n: '02'
            text: Seleccionamos opciones in situ y descartamos por teléfono todo lo que no cumpla con los requisitos
          - n: '03'
            text: Vamos a la inspección con un medidor de espesor y escáner, conectamos el ISTA del concesionario para BMW, tomamos fotos y videos
          - n: '04'
            text: Enviamos el informe y decimos directamente si vale la pena comprarlo o seguir buscando
          - n: '05'
            text: Negociamos, formalizamos la transacción y entregamos el coche a usted o lo llevamos a su puerta
        includedHeading: Qué incluye nuestro servicio
        includedLead: La comisión se fija antes de comenzar y no depende de cuántos coches se inspeccionaron. Si después de la verificación decimos 'no compre', seguimos buscando sin costos adicionales.
        included:
          - title: Búsqueda sin limitación en el número de opciones
            text: Trabajamos hasta encontrar un coche que no tenga quejas. Renunciar a una opción que no cumple es parte del servicio y no cuesta nada extra.
          - title: Visita de un experto para cada inspección
            text: 'Medidor de espesor para las paneles, escáner para los módulos, elevador donde sea necesario. Fotos y videos de todos los lugares problemáticos: usted ve lo mismo que nosotros.'
          - title: Verificación de historia y legalidad
            text: Informe CarVertical por VIN, historial de servicios del concesionario por marca, verificación de kilometraje, embargos, restricciones de registro y eventos de seguros no resueltos.
          - title: Negociación y formalización de la transacción
            text: Negociamos el precio teniendo en cuenta lo encontrado, preparamos documentos y asistimos en la firma.
          - title: Entrega y registro
            text: 'Llevamos el coche a su ciudad y ayudamos con el registro en el lugar: o le entregamos las llaves donde le sea conveniente recogerlo.'
          - title: Una persona para todo el proceso
            text: Usted trabaja con el mismo especialista que fue a la inspección. No necesita explicar la tarea nuevamente a cada persona que conteste el teléfono.
        compareHeading: Cómo se diferencian los mercados entre sí
        compareLead: El mismo modelo en Alemania y en Polonia, por historia y precio, son dos coches diferentes.
        compareHint: Seleccione un país, le mostraremos qué consideramos allí primero.
        compareLinkFor: Búsqueda {location} — detalles
      title: Búsqueda de coches llave en mano
      descriptionFor: Buscaremos un automóvil en {location} — entre los coches que ya están en este país, sin importación desde el extranjero. Verificación completa, asistencia en la transacción y entrega hasta su ciudad — llave en mano, incluyendo derechos de importación.
      ctaLabel: Dejar una solicitud
      casesHeadingFor: 'Casos: búsqueda de coches {location}'
      breadcrumbLabelFor: Coches {location}
      stepsFor:
        - n: '01'
          text: 'Deja una solicitud con requisitos: presupuesto, marca, kilometraje'
        - n: '02'
          text: Buscamos opciones en {location} según sus criterios
        - n: '03'
          text: Un experto independiente inspecciona y verifica el coche
        - n: '04'
          text: Asistimos en la transacción, ayudamos con documentos y registro
        - n: '05'
          text: Entregamos el coche a su ciudad — llave en mano, incluyendo derechos de importación
      deliveryLineFor: Entregamos en {destinations} — y en cualquier otro país, lo discutiremos al hacer la solicitud.
      deliveryDestinations:
        - Rusia
        - Kazajistán
        - Kirguistán
        - Ucrania
        - Bielorrusia
        - Bosnia y Herzegovina
        - Croacia
        - Macedonia del Norte
        - Turquía
      citiesHeadingFor: Dónde inspeccionamos coches {countryLocation}
      citiesLead: El experto viaja por todo el país, pero generalmente inspeccionamos coches donde más se ofrecen. Esto es lo que significa para cada ciudad.
      alsoInLabel: 'También buscamos en:'
      crossSellLabel: ¿Necesita un coche de fuera del país?
      countryNotesHeadingFor: Qué consideramos en {location}
      countryNotesPointsLabel: Lo que miramos en primer lugar
      countryNotes:
        de:
          lead: 'La selección aquí es mayor que en cualquier otro mercado de Europa, y la historia de mantenimiento generalmente se puede rastrear: la mayoría de los coches tienen un libro de servicio con marcas del concesionario sobre cada mantenimiento. El lado negativo son los kilometrajes de autopista. Doscientos mil en tres años aquí es norma, no motivo para un descuento.'
          points:
            - Libro de servicio y marcas del concesionario — checamos por VIN en el servicio oficial
            - Protocolo HU, que todos llaman TÜV — leemos los comentarios de la última inspección, no solo el sello
            - 'Coches de leasing y flotas corporativas: mantenimiento correcto, pero kilometrajes altos'
            - Carreteras de invierno con agentes — revisamos el chasis y los umbrales por separado
        rs:
          lead: Aquí estamos en el lugar, por lo que inspeccionamos el coche el día de la consulta y sin importación. El mercado es pequeño, el mismo coche puede pasar por varios vendedores y hay que desentrañar la historia.
          points:
            - El coche ya está despachado y con matrículas locales — no son necesarios derechos e importación
            - El kilometraje a menudo se altera durante la reventa dentro del país — verificamos con las marcas de la inspección técnica
            - Muchos coches importados de Alemania e Italia — verificamos qué le ocurrió al coche antes de la importación
            - Inspección el día de la consulta, sin esperar logística
        es:
          lead: El invierno suave y casi sin agentes en las carreteras, por lo que el chasis de los coches españoles suele estar en mejor estado que el de los alemanes. Pero el sol y la cercanía del mar afectan la pintura, el plástico y todas las piezas de goma.
          points:
            - Costa — buscamos corrosión principalmente en cavidades ocultas
            - Laca descolorida y plástico del interior agrietado — consideramos esto en el precio
            - 'Muchos coches de alquiler anteriores: kilometraje uniforme, pero uso intenso'
            - Protocolo ITV — verificamos las observaciones y fechas de las inspecciones pasadas
        ch:
          lead: 'Los coches suizos están mucho mejor cuidados que el promedio en Europa: un mantenimiento caro disciplina, los kilometrajes son bajos. Pero Suiza no está en la UE, por lo que la importación se hace de otra manera, y esto se considera en el presupuesto desde el principio.'
          points:
            - Equipamientos ricos — aquí los adquirieron con más frecuencia que los vecinos
            - MFK — la inspección es rigurosa, se prepara en serio, y esto se refleja en el coche
            - 'No UE: aduanas y documentos no se gestionan igual que para los países de la Unión Europea'
            - Precio superior al mercado, pero luego ahorra en reparaciones
        pt:
          lead: El mercado es pequeño, la selección es más modesta que la española, pero la competencia por un buen coche es menor. El clima es húmedo y salado — la corrosión marina se encuentra incluso en coches nuevos.
          points:
            - Humedad y mar — revisamos cavidades ocultas y eléctricas como prioridad
            - 'Mercado pequeño: buscamos más tiempo que en Alemania para solicitudes concretas'
            - Protocolo IPO — leemos las observaciones de las inspecciones anteriores
            - Muchos coches diésel y subcompactos, coches grandes son raros
        fr:
          lead: Francia es principalmente diésel y marcas propias. Peugeot, Renault y Citroën aquí son más baratos que en cualquier otro lugar de Europa. El premium alemán, por el contrario, es más caro, y no tiene sentido comprarlo aquí.
          points:
            - Marcas francesas — el mejor precio en Europa, y el mantenimiento es más barato
            - Diésel — verificamos el filtro de partículas y la válvula EGR como un elemento separado
            - Contrôle technique — los protocolos son detallados, checamos las observaciones por años
            - 'Uso urbano: el embrague y la suspensión se desgastan más rápido de lo indicado'
        it:
          lead: 'El mercado italiano es bueno para coches pequeños y equipamientos raros, pero requiere precaución: los coches aquí se utilizan intensivamente, y las reparaciones de carrocería menores no siempre se realizan de manera cuidadosa.'
          points:
            - Ciudad — frecuentes golpes menores y retoques, el medidor de espesor es obligatorio
            - Sur y costa traen sal y corrosión, el norte se acerca a las condiciones alemanas
            - Revisione — verificamos la regularidad, las omisiones son más comunes de lo habitual
            - Muchos coches con equipo de gas — lo revisamos por separado
        pl:
          lead: 'El mayor mercado cercano: la logística es barata y corta. Pero Polonia ha sido durante años el principal punto de transbordo para coches dañados de Europa Occidental, por lo que aquí verificamos la historia de manera más estricta que en cualquier otro lugar.'
          points:
            - Alta proporción de coches restaurados tras accidentes — la geometría de la carrocería es prioritaria
            - 'Frecuentes reventas: un coche puede cambiar de propietarios varias veces en un año'
            - El kilometraje a menudo se ajusta en la importación — verificamos con bases de servicios
            - Los cortos plazos de entrega son más baratos y rápidos que desde España o Portugal
      closing:
        eyebrow: ¿Por dónde empezamos?
        line1: Describa el coche
        line2: que está buscando, —
        accentWord: después nuestra labor
        text: Presupuesto, carrocería, caja, un par de deseos adicionales. Buscamos por usted, y usted revisa los informes sobre las opciones y decide cuál inspeccionar en persona.
