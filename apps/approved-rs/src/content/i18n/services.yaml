            text: Car carrier or self-drive with transit plates. We consider both options and choose the most cost-effective for the specific route.
          - title: Duties and Taxes
            text: The rate depends on the country of origin and the car's age. For European-manufactured cars, the EUR1 certificate significantly changes the calculations – we check its availability before purchase.
