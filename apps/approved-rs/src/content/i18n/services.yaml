            - 'Europäische Herkunft kann nicht bestätigt werden: EUR1 wird hier nicht angewendet, Zoll ist höher'
            - 'Garantie und Ersatzteile: Wir prüfen, ob das Modell im Zielland unterstützt wird'
            - 'Elektroautos: Wir vergleichen den Steckertyp und die Kompatibilität mit lokalen Netzwerken'
