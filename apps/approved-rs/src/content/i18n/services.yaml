translations:
  en:
    vehicle-sourcing:
      hub:
        metaTitle: Car sourcing in Europe – full service
        metaDescription: 'We source cars in Germany, Serbia, Spain, Switzerland, Italy, France, Poland, and Portugal: search, inspection, negotiation, and delivery included.'
        title: Car Sourcing
        titleHighlight: full service
        description: We help you find a car in the country where you are located or plan to purchase — complete inspection, deal support, and delivery service. Choose a country to see details.
        breadcrumbLabel: Car Sourcing
        casesHeading: Real car sourcing deals
        chooseCountryLabel: 'Select a country:'
        ctaLabel: Find a car
        heroPhotoAlt: A row of cars at a dealership
        processHeading: How sourcing works
        processLead: 'From request to keys usually takes from three days to two weeks. The longest part is finding the car: we don’t settle for the first suitable option and keep looking until we find one that passes the inspection.'
        processSteps:
          - n: '01'
            text: Discuss budget, brand, and requirements — what’s important and what can be compromised
          - n: '02'
            text: Select options on-site and filter out those that do not meet the criteria over the phone
          - n: '03'
            text: Conduct inspection with a thickness gauge and scanner, connect the dealer’s ISTA for BMW, take photos and videos
          - n: '04'
            text: Send a report and be straightforward about whether it’s worth buying or if we should continue the search
          - n: '05'
            text: Negotiate, finalize the deal, and deliver the car to you or transport it to your door
        includedHeading: What’s included in the service
        includedLead: The fee is fixed before starting and does not depend on how many cars we had to inspect. If we say 'don’t buy' after the inspection — we continue searching at no extra cost.
        included:
          - title: Unlimited options search
            text: We keep working until we find a car that meets all criteria. Abandoning an unsuitable option is part of the service and incurs no additional cost.
          - title: Expert inspection for each car
            text: Thickness gauge on panels, scanner on the blocks, lift where needed. Photos and videos of all problematic areas — you see what we see.
          - title: History and legal purity check
            text: CarVertical report by VIN, dealer service history by make, mileage verification, pledges, registration restrictions, and unresolved insurance incidents.
          - title: Negotiation and deal finalization
            text: We agree on the price considering what we find, prepare documents, and assist with signing.
          - title: Delivery and registration assistance
            text: We take the car to your city and help with local registration — either hand over the keys where it’s convenient for you to pick up.
          - title: One specialist for the whole process
            text: You work with the same expert who conducted the inspection. You won’t have to explain your needs multiple times to different people.
        compareHeading: How markets differ from each other
        compareLead: The same model in Germany and Poland — in terms of history and price, these are two different cars.
        compareHint: Select a country — we’ll show you what we check first.
        compareLinkFor: Sourcing {location} — details
      title: Full service car sourcing
      descriptionFor: We’ll find a car {location} — among those already in the country, without importing from abroad. Complete inspection, deal support, and delivery to your city.
      ctaLabel: Submit a request
      casesHeadingFor: 'Real transactions: car sourcing {location}'
      breadcrumbLabelFor: Car {location}
      stepsFor:
        - n: '01'
          text: Submit a request with requirements — budget, make, mileage
        - n: '02'
          text: Search for options {location} based on your criteria
        - n: '03'
          text: An independent expert inspects and checks the car
        - n: '04'
          text: Assist with the deal, help with documents and registration
        - n: '05'
          text: Deliver the car to your city and assist with registration
      deliveryLineFor: We can deliver the car to any city in the country. If it needs to be exported, we handle the export and customs clearance — we can take it to {destinations} or any other country.
      deliveryDestinations:
        - Bosnia and Herzegovina
        - Croatia
        - North Macedonia
        - Turkey
        - Kazakhstan
        - Kyrgyzstan
      citiesHeadingFor: Where we inspect cars in {countryLocation}
      citiesLead: The expert travels across the country, but we most often inspect cars where they are most commonly listed. Here’s what it means for each city.
      alsoInLabel: 'We also source in:'
      crossSellLabel: Need a non-local car?
      countryNotesHeadingFor: What we consider in {location}
      countryNotesPointsLabel: What we check first
      countryNotes:
        de:
          lead: 'The selection here is greater than in any other market in Europe, and service history is usually traceable: most cars have a service book with dealer stamps for every maintenance. The downside is the highway mileage. Two hundred thousand in three years is standard here, not a reason for a discount.'
          points:
            - Service book and dealer stamps — we verify by VIN with the official service
            - HU protocol, commonly referred to as TÜV — we read the notes from the last inspection, not just the stamp
            - 'Cars from leasing and corporate fleets: well-maintained but often have high mileage'
            - Winter roads with reagents — we check the underbody and sills specifically
        rs:
          lead: We are local, so we inspect the car on the day of the request and without import. The market is small; the same car often passes through several sellers, and we need to untangle the history.
          points:
            - The car is already customs cleared and has local plates — no import duties and clearance needed
            - Mileage is often altered during local resale — we verify against the technical inspection records
            - Many cars imported from Germany and Italy — we check the car’s history before import
            - Inspection on the day of request, without waiting for logistics
        es:
          lead: Mild winters and almost no road treatments mean the undercarriage of Spanish cars is typically in better condition than German cars. However, sun exposure and proximity to the sea affect the paint, plastic, and rubber.
          points:
            - Coastal areas — we look for corrosion primarily in hidden cavities
            - Faded lacquer and cracked interior plastics — we account for these in the price
            - 'Many former rental cars: consistent mileage, but often harsh usage'
            - ITV protocol - we check comments and inspection dates
        ch:
          lead: 'Swiss cars are maintained significantly better than the European average: expensive servicing ensures discipline, and the mileage is generally low. However, Switzerland is not in the EU, so import clearance works differently, and we account for this in the budget in advance.'
          points:
            - Well-equipped models - they are more popular here compared to neighboring countries
            - MFK - inspections are strict, preparation is serious, and this is reflected in the car
            - 'Not EU: customs and documentation processes differ from EU countries'
            - Prices are above market, but you save on repairs later
        pt:
          lead: The market is small, selection is more modest than in Spain, but the competition for a good car is lower. The climate is humid and salty - coastal corrosion can be found even on newer vehicles.
          points:
            - Humidity and the sea - hidden cavities and electrical components are prioritized during inspection
            - 'Small market: searching for specific requests takes longer than in Germany'
            - IPO protocol - we check comments from previous inspections
            - Many diesels and compact cars, large bodies are rarely found
        fr:
          lead: France is primarily about diesel and domestic brands. Peugeot, Renault, and Citroën are cheaper here than anywhere else in Europe. Conversely, German premium brands are more expensive, making them less appealing to purchase here.
          points:
            - French brands - best prices in Europe, and servicing is cheaper
            - Diesels - we check the particulate filter and EGR valve as separate items
            - Contrôle technique - protocols are detailed, we check comments over the years
            - 'Urban use: traction and suspension wear out faster than rated'
        it:
          lead: 'The Italian market is good for compact cars and rare configurations, but requires caution: cars are driven hard here and minor body repairs are not always done carefully.'
          points:
            - City driving - frequent minor impacts and touch-ups, a thickness gauge is a must
            - The south and coastal areas bring salt and corrosion, while the north is closer to German conditions
            - Revisione - we check regularity, lapses occur more often than usual
            - Many cars with gas equipment - we check this separately
        pl:
          lead: 'The closest major market to us: logistics are cheap and short. However, Poland has long been a key transit point for damaged cars from Western Europe, so we scrutinize the history here more closely than anywhere else.'
          points:
            - High percentage of vehicles restored after accidents - body geometry is prioritized
            - 'Frequent resales: cars often change hands several times a year'
            - Mileage is often adjusted upon import - we verify with service records
            - Short delivery distance - cheaper and faster than from Spain or Portugal
      closing:
        eyebrow: How shall we begin?
        line1: Describe the car you are looking for,
        line2: — and we'll take it from there.
        accentWord: that's where our job starts
        text: Budget, body, transmission, and a few preferences on top. We do the searching, and you review reports on options and decide which ones to inspect in person.
    vehicle-buyback:
