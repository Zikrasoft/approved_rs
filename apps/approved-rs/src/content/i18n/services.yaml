      closing:
        eyebrow: Want a valuation?
        line1: Send us photos
        line2: and the documents,
        accentWord: get an offer within an hour
        text: The valuation is free, with no obligation. If the price doesn't work for you, we'll leave it there. No pressure, no follow-up calls.
    vehicle-import:
      hub:
        metaTitle: Full-Service Car Imports from Europe and China
        metaDescription: We import cars from Germany, Spain, Switzerland and China to any country. Sourcing, inspection, delivery and customs clearance, all handled for you.
        title: Car imports
