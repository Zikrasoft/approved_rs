      citiesHeadingFor: Gde gledamo automobile {countryLocation}
      citiesLead: Stručnjak dolazi širom zemlje, ali najčešće gledamo automobile gde ih ima najviše. Evo šta to znači za svaki grad.
      alsoInLabel: 'Takođe biramo u:'
      crossSellLabel: Treba vam auto iz drugog grada?
      countryNotesHeadingFor: Šta uzimamo u obzir {location}
      countryNotesPointsLabel: Na šta prvo obraćamo pažnju
      countryNotes:
        de:
          lead: 'Izbor ovde je veći nego na bilo kom drugom tržištu u Evropi, a istorija servisiranja obično se prati: većina automobila ima servisnu knjigu sa beleškama dilera o svakom tehničkom pregledu. Negativna strana — autoputnički kilometri. Dvesta hiljada za tri godine ovde je norma, a ne razlog za popust.'
          points:
            - Servisna knjiga i beleške dilera — proveravamo po VIN kodu u zvaničnom servisu
            - Protokol HU, koji svi nazivaju TÜV — čitamo primedbe iz prethodne provere, a ne samo pečat
            - 'Automobili iz leasinga i korporativnih parka: održavani su pravilno, ali s velikim kilometrima'
            - Zimske ceste sa reagensima — dno i pragove proveravamo posebno
        rs:
          lead: Ovde smo na terenu, tako da gledamo auto na dan kad je upit poslat i bez uvoza. Tržište je malo, isti auto često prolazi kroz nekoliko prodavaca, i istoriju je teško ikada raspetljati.
          points:
            - Auto je već carinjen i na lokalnim tablicama — takse i uvozna dokumentacija nisu potrebni
            - Kilometraža se često menja prilikom preprodaje unutar zemlje — proveravamo sa beleškama tehničkog pregleda
            - Mnogo automobila uvezenih iz Nemačke i Italije — proveravamo šta se događalo sa automobilom pre uvoza
            - Provera na dan upita, bez čekanja logistike
        es:
          lead: Meka zima i gotovo bez reagenata na putevima, pa je donja strana španskih automobila obično mnogo bolja od nemačkih. S druge strane, sunce i blizina mora utiču na boju, plastiku i svu gumu.
          points:
            - Obala — tražimo koroziju pre svega u skrivenim prostorima
            - Izgorela boja i napuknuti plastika enterijera — uračunavamo u cenu
            - 'Mnogo nekadašnjih iznajmljenih automobila: dosledna kilometraža, ali teška eksploatacija'
            - ITV protokol — upoređujemo primedbe i datume pregleda
        ch:
          lead: 'Švajcarski automobili su obično bolje očuvani od proseka u Evropi: skupi servisi obavezuju vlasnike, a kilometraža je mala. No, Švajcarska nije u EU, pa se uvoz obavlja drugačije, što unapred uključujemo u budžet.'
          points:
            - Bogate opreme — ovde su kupovane više nego kod komšija
            - MFK — pregled je ozbiljan, temeljito se priprema i to se vidi na automobilu
            - 'Nije u EU: carinske procedure i dokumentacija se ne obavljaju kao za zemlje Evropske unije'
            - Cene su više od tržišnih, ali se kasnije štedi na popravkama
        pt:
          lead: Tržište je malo, izbor je skromniji nego u Španiji, ali su zato i konkurencija za dobar automobil manja. Klima je vlažna i slana — morska korozija se javlja čak i na novim automobilima.
          points:
            - Vlažnost i more — skrivene šupljine i elektrika su prioritet provere
            - 'Malo tržište: za konkretan zahtev tražimo duže nego u Nemačkoj'
            - IPO protokol — čitamo primedbe sa prethodnih pregleda
            - Mnogo dizelaša i malih vozila, veći automobili su retki
        fr:
          lead: Francuska je pre svega dizel i domaće marke. Peugeot, Renault i Citroën su ovde jeftiniji nego bilo gde u Evropi. Nemački premium automobili su, naprotiv, skuplji, i nema smisla kupovati ih ovde.
          points:
            - Francuske marke — najbolja cena u Evropi, a servisi su jeftiniji
            - Dizelaši — EGR ventil i filter čestica proveravamo kao posebnu stavku
            - Contrôle technique — protokoli su detaljni, upoređujemo primedbe po godinama
            - 'Gradsku eksploataciju: spoj i suspenziju brže troše nego što je navedeno'
        it:
          lead: 'Italijansko tržište je dobro za mala vozila i retke opreme, ali zahteva oprez: automobili su često korišćeni, a sitni popravci karoserije se ne rade uvek pažljivo.'
          points:
            - Grad — česta manja udarca i prefarbavanja, merni uređaj za debljinu je obavezan
            - Jug i obala donose so i koroziju, sever bliže nemačkim uslovima
            - Revisione — proveravamo redovnost, propušteni pregledi se češće javljaju
            - Mnogo automobila sa plinskom opremom — proveravamo je posebno
        pl:
          lead: 'Najbliže veliko tržište za nas: logistika je jeftina i brza. Međutim, Poljska je godinama bila glavno čvorište za havarijske automobile iz Zapadne Evrope, pa zato proveravamo istoriju ovde rigoroznije nego bilo gde drugo.'
          points:
            - Visok udeo obnovljenih nakon nesreća — geometrija karoserije je prioritet
            - 'Česte preprodaje: automobil može promeniti više vlasnika za godinu dana'
            - Kilometraža se često menja prilikom uvoza — upoređujemo sa servisnim bazama
            - Kratki transport — jeftinije i brže nego iz Španije ili Portugala
      closing:
        eyebrow: Kako počinjemo?
        line1: Opišite automobil
        line2: koji tražite —
        accentWord: dalje naša obaveza
        text: Budžet, karoserija, menjač, par želja pored. Mi tražimo, a vi gledate izveštaje o opcijama i odlučujete šta da gledate uživo.
