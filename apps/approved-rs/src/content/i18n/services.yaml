    vehicle-inspection:
      title: Inspección de vehículos
      description: Inspección independiente de un coche antes de la compra. Visita del experto, diagnóstico, informe — sin obligación de compra.
      ctaLabel: Solicitar inspección
      casesHeading: Casos de inspección
      breadcrumbLabel: Inspección de vehículos
      steps:
        - n: '01'
          text: Carrocería y pintura — presencia de reparaciones o accidentes
        - n: '02'
          text: Tren de rodaje, suspensión, frenos
        - n: '03'
          text: Motor, caja de cambios, transmisión
        - n: '04'
          text: Electrónica e historial de servicio por VIN
        - n: '05'
          text: Limpieza legal — embargos, prohibiciones de registro, accidentes
      extraLine: Trabajamos en otros países europeos, incluyendo Portugal, — consulte al hacer su solicitud.
      hub:
        metaTitle: Inspección de vehículos antes de la compra en Europa
        metaDescription: 'Visitamos el coche que has encontrado: medidor de grosor, escáner, verificación de historial por VIN e informe con fotos el mismo día. Operamos en ocho países europeos.'
        title: Inspección de vehículos
        titleHighlight: antes de la compra
        description: "Visitamos el coche que has encontrado y te contamos cuál es su estado real. El informe llega antes de que pagues: si el resultado es 'no lo compres', solo perderás el coste de la inspección."
        breadcrumbLabel: Inspección de vehículos
        casesHeading: Casos de inspección
        chooseCountryLabel: 'Selecciona un país:'
        ctaLabel: Solicitar inspección
        heroPhotoAlt: Coche en un elevador en el taller
        processHeading: Cómo se realiza la inspección
        processLead: Generalmente visitamos en uno o dos días después de la solicitud. La inspección toma entre una hora y media y dos, enviamos el informe el mismo día, antes de que el coche se haya vendido a otro comprador.
        processSteps:
          - n: '01'
            text: Nos envías el enlace del anuncio y los datos del vendedor
          - n: '02'
            text: Concertamos una cita con el vendedor para la inspección
          - n: '03'
            text: Vamos con el medidor de grosor y escáner, para BMW conectamos al sistema de concesionario ISTA, y si es necesario — en elevador
          - n: '04'
            text: Tomamos fotos y vídeos de todos los hallazgos, verificamos el historial por VIN
          - n: '05'
            text: Te enviamos el informe y una respuesta directa — comprar, negociar o rechazar
        includedHeading: Qué incluye la inspección
        includedLead: 'Más de cien ítems en la lista de verificación, pero casi siempre determinan cuatro áreas: carrocería, motor con transmisión, tren de rodaje y documentos. Es por ellas que a menudo desaconsejamos la compra.'
        included:
          - title: Carrocería y pintura
            text: Medidor de grosor en cada panel, geometría de aberturas, señales de soldadura y masilla. Se observa si hubo reparaciones que el vendedor no mencionó.
          - title: Motor y caja de cambios
            text: Parámetros del motor caliente, adaptaciones de la caja, errores en la memoria de los módulos. La zona más costosa y la causa más frecuente de rechazo.
          - title: Tren de rodaje y frenos
            text: Juego, estado de la suspensión y sistema de frenos. El kilometraje en carreteras y las calles balcánicas desgastan el coche de manera diferente, y eso se nota.
          - title: Electrónica e historial por VIN
            text: Informe de CarVertical, historial de servicio de concesionario por marca, discrepancias de kilometraje con el historial, errores de módulos y señales de airbags desplegados.
          - title: Limpieza legal
            text: Embargos, prohibiciones de registro, accidentes no resueltos y eventos de seguros — cosas que surgen después de la compra.
          - title: Informe con fotos y vídeos
            text: Cada hallazgo está documentado y firmado. El informe se queda contigo — es útil para negociar, incluso si decides comprar el coche.
        compareHeading: Qué cambia de un país a otro
        compareLead: Reglamento de la inspección técnica, fallos típicos de los coches locales y formas de ocultar el historial varían en todas partes.
        compareHint: Selecciona un país — te mostraremos qué añadimos a la lista de verificación habitual.
        compareLinkFor: Inspección {location} — detalles
        mapHeading: Cuatro áreas que deciden la transacción
        mapLead: La lista de verificación es larga, pero casi siempre desaconsejamos en una de las cuatro áreas. Haz clic en el número del esquema — te mostramos qué examina el experto y qué hemos encontrado ahí.
      countryNotesHeadingFor: Cómo verificamos {location}
      countryNotesPointsLabel: Qué verificamos más allá de la lista de verificación habitual
      countryNotes:
        de:
          lead: 'En Alemania hay mucho en qué basarse: libro de servicio, protocolos HU y bases de datos avanzadas por VIN. Por lo tanto, la inspección aquí se centra principalmente en la validación de documentos con lo que muestra el coche.'
          points:
            - Comparamos las marcas de servicio de concesionario con las lecturas del odómetro por años
            - Notas del último HU — qué se reparó después de la inspección y qué simplemente se pospuso
            - Suelo y umbrales tras los reactivos invernales, incluyendo cavidades ocultas
            - 'Historia de arrendamiento: servicio uniforme a alto kilometraje'
        rs:
          lead: 'En Serbia vamos el mismo día de la solicitud. La principal tarea es reconstruir la historia del coche antes de su importación: los documentos locales solo muestran el último tramo de la vida del vehículo.'
          points:
            - País de origen y estado del coche antes de su importación a Serbia
            - Lecturas del odómetro frente a las marcas de la inspección técnica de años pasados
            - Reparaciones de carrocería tras la importación — se realizan con más frecuencia y a menor costo que en la UE
            - 'Aspecto legal: embargos y restricciones de registro'
        es:
          lead: Los coches españoles suelen impresionar por el estado del suelo, pero defraudan en todo lo que sufre por el sol y la sal. Enfocamos la inspección, no tanto en la corrosión inferior, sino en cavidades ocultas, electricidad y estado del interior.
          points:
            - Corrosión en cavidades ocultas en la costa — puede parecer limpio por debajo
            - Pintura, sellos y plásticos después de años de sol
            - 'Historia de alquiler: comparamos el kilometraje con el desgaste del interior'
            - Protocolo ITV y lo que quedó sin cerrar entre inspecciones
        ch:
          lead: Los coches para MFK se preparan en serio, así que un protocolo nuevo por sí solo no dice mucho. Observamos lo que se hizo justo antes de la inspección y lo que ha estado funcionando desde el año pasado.
          points:
            - Qué se reemplazó antes del MFK — piezas nuevas en el contexto del resto
            - El servicio es caro, así que verificamos si se han pospuesto mantenimientos
            - Equipamiento rico, pero verificamos que cada opción siga funcionando
            - 'Documentos para la importación: Suiza no es la UE, el paquete es diferente'
        pt:
          lead: 'Todo aquí depende del clima marino húmedo. Empezamos la inspección con corrosión y electricidad: lo que normalmente falla es lo que vive en la humedad.'
          points:
            - Cavidades ocultas, largueros y puntos de sujeción de la suspensión
            - Oxidación de conectores y módulos — causa típica de errores intermitentes
            - Protocolo de IPO y regularidad de las inspecciones
            - 'Diésel con uso urbano: filtro de partículas y su historia'
        fr:
          lead: 'En Francia, un contrôle technique detallado es un buen punto de partida. Luego observamos lo que el reglamento no captura: la durabilidad del grupo diésel y el desgaste debido al tráfico urbano.'
          points:
            - Notas del contrôle technique por años — qué se repite de una inspección a otra
            - Filtro de partículas, EGR y turbocompresor en diésel
            - Embrague y suspensión tras un ciclo urbano denso
            - 'Historia para marcas francesas: repuestos accesibles, pero puntos débiles'
        it:
          lead: Los coches italianos suelen llegar con reparaciones de carrocería menores, hechas rápida y económicamente. Aquí, el medidor de grosor en paneles lleva más tiempo del habitual.
          points:
            - Medidor de grosor en todos los paneles — retoques tras golpes urbanos
            - 'Diferencia entre norte y sur: sal en la costa, desgaste usual en el interior del país'
            - Equipamiento de gas, si está — instalación y estado del cilindro
            - Regularidad de revisione y períodos pasados no cumplidos
        pl:
          lead: Polonia es el principal mercado de transbordo para coches dañados de Europa Occidental. Por lo tanto, primero averiguamos qué le hicieron a la carrocería antes de la venta.
          points:
            - Geometría de aberturas y señales de soldadura — restauración tras un accidente grave
            - 'Historia de importación: de dónde vino el coche y en qué estado'
            - Comparamos el kilometraje con bases de datos de servicios europeos, no confiamos en el odómetro
            - Airbags y su activación en el pasado
      closing:
        eyebrow: ¿Has encontrado un coche?
        line1: Envíanos el enlace
        line2: del anuncio —
        accentWord: iremos a verlo
        text: Salimos en uno o dos días. El informe con fotos se queda contigo, incluso si después decides no comprar.
    cityVehicleSourcing:
      title: Selección de coches
      descriptionFor: Encontramos un coche en {cityLocation} con una verificación completa. Trabajamos en toda la región de {countryName}.
      casesHeadingFor: Casos de {countryGenitiveOrName}
      whyCityHeadingFor: Por qué {cityName}
      reason1: Consultamos tanto los concesionarios como anuncios privados
      reason2: Verificamos el historial con el VIN antes de ir a la inspección
      reason3For: Nuestro experto en {cityLocation}
      reason4Dekra: Inspección DEKRA / TÜV a solicitud
      reason4Generic: Evaluación técnica independiente bajo demanda
      otherCitiesLabelFor: 'Otras ciudades en {countryLocation}:'
      cityNotesHeadingFor: Mercado automovilístico en {cityLocation}
      cityNotesPointsLabel: Qué significa esto en la práctica
      cityNotes:
        berlin:
          lead: 'Berlín tiene la mayor selección en Alemania y una gran variedad de vendedores. Aquí encuentras de todo: desde coches de flotas corporativas con historia completa hasta opciones de reventa provenientes de Europa del Este.'
          points:
            - Amplia selección en cualquier segmento, incluyendo configuraciones raras
            - Muchos vendedores privados — la negociación es más realista que con los concesionarios
            - 'Ciclo urbano: el desgaste del embrague y la suspensión es más evidente que en coches de autopista'
        munich:
          lead: 'Una ciudad cara con coches caros. Hay más vehículos del segmento premium aquí que en cualquier otro lugar de Alemania, y su estado suele ser mejor: estos coches son bien cuidados.'
          points:
            - Fuerte presencia del segmento premium, especialmente BMW y Mercedes
            - Coches bien mantenidos con un historial completo del concesionario
            - Precios por encima de la media del país — el ahorro se obtiene gracias al estado de los vehículos
        hamburg:
          lead: Ciudad portuaria y un importante centro logístico. Desde aquí es fácil enviar el coche a otros lugares, y en el mercado suele haber coches importados recientemente.
          points:
            - Puerto cercano — más fácil y barato organizar el envío
            - Muchos coches de los países del norte con recorridos normales
            - 'Clima marítimo: revisamos la carrocería y los espacios ocultos con más atención'
        dusseldorf:
          lead: Centro de Renania del Norte-Westfalia, la región más poblada de Alemania. Hay muchas plataformas de venta, y la frontera con los Países Bajos y Bélgica está a una hora de distancia, por lo que con frecuencia llegan coches aquí para la venta.
          points:
            - En una sola visita podemos ver varios coches — las plataformas están cerca
            - 'Algunas ofertas tienen matrículas holandesas y belgas: verificamos la historia y documentos por separado'
            - Muchos vendedores compiten entre sí — la negociación es más activa
        belgrade:
          lead: Nuestra base. En Belgrado realizamos inspecciones el mismo día de la solicitud, conocemos a los vendedores locales y sabemos qué coche ha estado circulando por las plataformas durante los últimos dos meses.
          points:
            - Inspección el mismo día, sin esperas ni logística
            - Conocemos las plataformas locales y la historia de los coches que están allí
            - El coche ya está despachado — no se requieren impuestos ni aranceles
        novi-sad:
          lead: Segunda ciudad más grande de Serbia y a una hora de Belgrado. El mercado es más pequeño, pero los precios suelen ser más tranquilos que los de la capital, y los coches han cambiado de propietario con menos frecuencia.
          points:
            - Precios más bajos que en Belgrado con un estado comparable
            - Menos reventas, es más común encontrar a un primer propietario
            - Salimos de Belgrado, no hay coste adicional por el viaje
        pancevo:
          lead: Pancevo forma parte de la aglomeración de Belgrado, por lo que la inspección aquí no difiere de la capital. El mercado es pequeño, pero los anuncios privados son a menudo más interesantes.
          points:
            - Veinte minutos de Belgrado — salimos igual de rápido
            - Mercado pequeño con predominio de vendedores privados
            - Frecuentemente más baratos que en la capital con el mismo estado
        subotica:
          lead: 'Subotica está en la frontera con Hungría, y eso se refleja en el mercado: hay muchos coches importados de la UE y vendedores que se dedican a esto constantemente.'
          points:
            - Mercado fronterizo — mucho importación fresca de la Unión Europea
            - Verificamos el historial antes de la importación con especial cuidado
            - Punto conveniente si planeas llevar el coche más al norte
        madrid:
          lead: 'El mercado de la capital de España: la mayor selección del país y muchos coches de flotas corporativas. Clima continental, por lo que la corrosión marina es menor que en la costa.'
          points:
            - La mayor selección en España, incluyendo coches corporativos
            - Lejos del mar — las carrocerías suelen estar más limpias que las costeras
            - 'Verano caluroso: revisamos el plástico, la pintura y el aire acondicionado por separado'
        barcelona:
          lead: Todo depende de la cercanía al mar. Los coches a menudo se ven geniales por debajo, pero requieren atención a los espacios ocultos y la electricidad.
          points:
            - 'El mar está cerca, por lo que revisamos los espacios ocultos: por debajo están limpios, pero por dentro no'
            - Muchos coches de alquiler y de carsharing
            - Puerto cercano, el envío por mar se organiza más fácilmente
        zurich:
          lead: Zúrich es el mercado automovilístico más caro de la región. Aquí se eligen las configuraciones máximas, se mantienen en concesionarios, y se venden antes de que el coche se desgaste.
          points:
            - Configuraciones máximas y bajos recorridos
            - Servicio de concesionario — el historial casi siempre es completo
            - Suiza no está en la UE, el ingreso se gestiona por separado
        geneva:
          lead: Ginebra está en la parte francófona de Suiza, justo en la frontera con Francia. Hay mucha más variedad de marcas francesas en el mercado que en la parte alemana del país.
          points:
            - 'Mercado mixto: estado suizo, variedad francesa'
            - La frontera con Francia está cerca — hay con qué comparar en precio
            - 'El proceso es el mismo que en toda Suiza: exportación más importación'
        paris:
          lead: 'La mayor selección en Francia viene con la explotación más dura: el tráfico denso y los estacionamientos estrechos dejan huellas en la carrocería y la suspensión.'
          points:
            - La mayor selección en Francia, especialmente de marcas francesas
            - 'Ciclo urbano: el desgaste del embrague, la suspensión y los pequeños daños en la carrocería son comunes'
            - Muchos diéseles — revisamos el filtro de partículas y el EGR como prioridad
        lyon:
          lead: Lyon es más tranquilo que París tanto en precios como en estado de los coches. La carretera hacia el sur está cerca, por lo que es más común encontrar coches con recorridos por carretera.
          points:
            - Precios más bajos que los de París con una selección comparable
            - Más coches con recorridos por carretera, menos desgaste urbano
            - Punto conveniente hacia Italia y España, si buscamos más ampliamente
        milan:
          lead: 'La capital económica de Italia, y esto se refleja en el mercado. El norte del país se asemeja más a las condiciones alemanas: mejores carreteras, coches en mejor estado que en el sur.'
          points:
            - Mejor selección del segmento premium en Italia
            - El norte — menos sal y corrosión que en el sur del país
            - 'Ciudad densa: el medidor de grosor es indispensable'
        rome:
          lead: Un gran mercado con una explotación urbana muy densa. Las pequeñas rozaduras se consideran norma y suelen repararse de manera rápida.
          points:
            - Muchos coches pequeños y vehículos a gas
            - Frecuentes repintados tras contactos urbanos — verificamos cada panel
            - Al sur de Milán — el clima es más suave, pero más cercano al mar
        warsaw:
          lead: A través de Varsovia entra el principal importación de Europa Occidental, y aquí está la mayor selección en Polonia. La proporción de coches restaurados también es la más alta.
          points:
            - La mayor selección en Polonia, con mucho importación reciente de la UE
            - Verificamos la geometría de la carrocería y los signos de reparación primero
            - Corta distancia de entrega — más barato que desde el sur de Europa
        krakow:
          lead: 'Cracovia es más tranquila que Varsovia: el mercado es más pequeño, hay menos reventas y los coches a menudo son mantenidos por un solo propietario durante más tiempo. El sur de Polonia está más cerca de los Balcanes en términos logísticos.'
          points:
            - Menos reventas que en Varsovia, la historia suele ser más clara
            - Los precios son a menudo más bajos que los de la capital
            - Más cerca de la ruta hacia el sur — conveniente para la entrega a Serbia
