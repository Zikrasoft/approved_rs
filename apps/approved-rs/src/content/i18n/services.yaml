        processHeading: So verläuft der Import
        processLead: In der Regel dauert es vier bis acht Wochen von der Anfrage bis zu den Nummernschildern, und die Fahrt nimmt dabei am wenigsten Zeit in Anspruch. Von Deutschland nach Belgrad benötigt das Auto einige Tage, während die Zollabfertigung und die Abmeldung Wochen dauern.
        processSteps:
          - n: '01'
            text: Wir berechnen die Gesamtkosten vor dem Start (Fahrzeug, Logistik, Zölle, Formalitäten)
          - n: '02'
            text: Wir finden und prüfen das Auto im Absenderland
          - n: '03'
            text: Wir kaufen das Auto auf unsere europäische Firma, melden es ab und bereiten die Exportdokumente vor
          - n: '04'
            text: Wir transportieren es mit einem Autotransporter oder überführen es mit Transitnummern
          - n: '05'
