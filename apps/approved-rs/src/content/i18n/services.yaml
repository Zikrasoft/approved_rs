        processLead: 'Od upita do preuzimanja ključeva obično prođe od tri dana do dve nedelje. Najviše vremena odlazi na potragu: ne uzimamo prvi auto koji odgovara kriterijumima, već tražimo dok ne nađemo onaj koji prođe sve naše provere.'
        processSteps:
          - n: '01'
            text: 'Dogovaramo budžet, marku i zahteve: šta vam je važno i gde ste spremni na kompromis'
          - n: '02'
            text: Biramo automobile na lokalnom tržištu i telefonom odbacujemo ponude koje ne prođu početnu proveru
          - n: '03'
            text: 'Provera auta pre kupovine na terenu: merač debljine laka, dijagnostički uređaj, za BMW fabrička dijagnostika ISTA, uz fotografije i video-snimke'
          - n: '04'
            text: Šaljemo izveštaj i otvoreno kažemo da li auto vredi kupiti ili treba nastaviti potragu
          - n: '05'
            text: Pregovaramo o ceni, završavamo kupovinu i predajemo vam auto ili ga dostavljamo na adresu
        includedHeading: Šta usluga obuhvata
        includedLead: Našu naknadu dogovaramo unapred i ona ne zavisi od broja pregledanih automobila. Ako nakon provere kažemo da auto ne treba kupiti, nastavljamo potragu bez doplate.
        included:
          - title: Potraga bez ograničenja broja automobila
            text: Tražimo dok ne pronađemo auto na koji nemamo zamerki. Odbacivanje lošeg primerka deo je našeg posla i ne naplaćuje se dodatno.
          - title: Stručnjak izlazi na svaki pregled
            text: 'Merimo debljinu laka na panelima, očitavamo upravljačke jedinice dijagnostikom i po potrebi pregledamo auto na dizalici. Dobijate fotografije i snimke svih spornih mesta: vidite isto što i mi.'
          - title: Provera istorije i pravnog statusa
            text: CarVertical izveštaj po VIN-u, servisna istorija iz ovlašćene mreže za konkretnu marku, provera kilometraže, zaloga, zabrana registracije i nerešenih odštetnih zahteva.
          - title: Pregovori i podrška pri kupovini
            text: Pregovaramo o ceni na osnovu utvrđenog stanja, pripremamo dokumentaciju i pratimo potpisivanje ugovora.
          - title: Dostava i registracija
            text: Dostavljamo auto do vašeg grada i pomažemo oko registracije ili vam predajemo ključeve tamo gde vam odgovara da ga preuzmete.
          - title: Isti stručnjak tokom celog procesa
            text: Sa vama radi isti stručnjak koji je pregledao auto. Ne morate iznova da objašnjavate šta tražite svaki put kada se neko drugi javi na telefon.
        compareHeading: Po čemu se tržišta razlikuju
        compareLead: Isti model u Nemačkoj i Poljskoj može biti sasvim druga priča kada su u pitanju istorija i cena.
        compareHint: Izaberite zemlju i pogledajte šta tamo prvo proveravamo.
