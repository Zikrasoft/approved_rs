        title: Fahrzeugbeschaffung
        titleHighlight: schlüsselfertig
        description: Wir suchen ein Auto in dem Land, in dem Sie sich befinden oder in dem Sie einen Kauf planen – vollständige Prüfung, Begleitung des Deals und schlüsselfertige Lieferung. Wählen Sie ein Land, um die Details zu sehen.
        breadcrumbLabel: Fahrzeugbeschaffung
        casesHeading: Fälle der Fahrzeugbeschaffung
        chooseCountryLabel: 'Wählen Sie ein Land:'
        ctaLabel: Auto beschaffen
        heroPhotoAlt: Reihe von Autos auf dem Gelände des Händlers
        processHeading: So funktioniert die Beschaffung
        processLead: 'Von der Anfrage bis zu den Schlüsseln dauert es normalerweise zwischen drei Tagen und zwei Wochen. Am längsten suchen wir nach dem Auto: Die erste passende nehmen wir nicht, sondern schauen weiter, bis wir das finden, das nach der Überprüfung keine Fragen aufwirft.'
        processSteps:
          - n: '01'
            text: Wir besprechen Budget, Marke und Anforderungen – was wichtig ist und wovon Sie bereit sind, abzusehen
          - n: '02'
            text: Wir filtern Optionen vor Ort und scheiden am Telefon alles aus, was nicht den Fragen standhält
          - n: '03'
            text: Wir fahren zur Besichtigung mit einem Messgerät und Scanner, für BMW schließen wir die Dealer-ISTA an, machen Fotos und Videos
          - n: '04'
            text: Wir senden den Bericht und sagen direkt, ob es sich lohnt zu kaufen oder weiterzusuchen
          - n: '05'
            text: Wir verhandeln, gestalten den Deal und übergeben das Auto an Sie oder bringen es zu Ihrer Tür
        includedHeading: Was in den Service eingeschlossen ist
        includedLead: Die Provision wird vor Beginn festgelegt und hängt nicht davon ab, wie viele Autos besichtigt werden mussten. Wenn wir nach der Überprüfung sagen, „kaufen Sie nicht“ – suchen wir weiter, dafür müssen Sie nichts zusätzlich bezahlen.
        included:
          - title: Suche ohne Begrenzung der Optionen
            text: Wir arbeiten, bis wir ein Auto finden, zu dem es keine Ansprüche gibt. Das Ablehnen eines erfolglosen Vorschlags gehört zur Arbeit und kostet nichts extra.
          - title: Einsatz eines Experten bei jeder Besichtigung
            text: Messgerät für die Karosserieteile, Scanner für die Steuergeräte, Hebebühne dort, wo sie nötig ist. Fotos und Videos von allen problematischen Stellen – Sie sehen dasselbe wie wir.
          - title: Überprüfung der Historie und rechtlichen Sauberkeit
            text: CarVertical-Bericht per VIN, Händler-Servicehistorie nach Marke, Kilometerstandsüberprüfung, Pfandrechte, Einschränkungen bei der Registrierung und offene Versicherungsereignisse.
          - title: Verhandlung und Vertragsabschluss
            text: Wir einigen uns über den Preis unter Berücksichtigung der Funde, bereiten die Unterlagen vor und begleiten die Unterzeichnung.
          - title: Lieferung und Zulassung
            text: Wir bringen das Auto in Ihre Stadt und helfen vor Ort bei der Registrierung – entweder übergeben wir die Schlüssel dort, wo es Ihnen passt.
          - title: Eine Person für den gesamten Prozess
            text: Sie arbeiten mit demselben Spezialisten, der zur Besichtigung gefahren ist. Sie müssen nicht jedem, der ans Telefon geht, die Aufgabe erneut erklären.
        compareHeading: Wie sich die Märkte unterscheiden
        compareLead: Das gleiche Modell in Deutschland und Polen – in der Geschichte und im Preis handelt es sich um zwei verschiedene Autos.
        compareHint: Wählen Sie ein Land – wir zeigen, was wir dort zuerst überprüfen.
