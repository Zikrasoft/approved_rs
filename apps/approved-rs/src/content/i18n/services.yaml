        description: 'Wir übernehmen das Auto, das schwer auf herkömmlichem Weg zu verkaufen ist: russische Kennzeichen, abgelaufene Einfuhr, strittige Dokumente. Der Preis ist unter dem Marktwert — das ist der Preis für Schnelligkeit und dafür, dass wir alle Mühen beim Verkauf übernehmen.'
