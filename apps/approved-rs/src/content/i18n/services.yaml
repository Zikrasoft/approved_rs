  es:
    vehicle-sourcing:
      hub:
        metaTitle: Selección de coches en Europa llave en mano
        metaDescription: 'Seleccionamos coches en Alemania, Serbia, España, Suiza, Italia, Francia, Polonia y Portugal: búsqueda, inspección, negociación y entrega llave en mano.'
        title: Selección de coches
        titleHighlight: llave en mano
        description: Buscamos un automóvil en el país donde se encuentra o planea comprar. Revisión completa, acompañamiento del proceso y entrega llave en mano. Elija el país para ver los detalles.
        breadcrumbLabel: Selección de coches
        casesHeading: Transacciones reales de selección de coches
        chooseCountryLabel: 'Seleccione un país:'
        ctaLabel: Seleccionar coche
        heroPhotoAlt: Una fila de coches en el lote del concesionario
        processHeading: Cómo se realiza la selección
        processLead: Desde la solicitud hasta tener las llaves, normalmente tardamos de tres días a dos semanas. Buscamos el automóvil, no aceptamos la primera opción que encontramos y seguimos buscando hasta que encontramos uno que no tenga dudas tras la revisión.
        processSteps:
          - n: '01'
            text: Discutimos el presupuesto, la marca y los requisitos, qué es importante y qué se puede sacrificar
          - n: '02'
            text: Seleccionamos las opciones localmente y desechamos por teléfono todo lo que no cumpla con los criterios
          - n: '03'
            text: Hacemos la inspección con un medidor de espesor y un escáner, en el caso de BMW conectamos el ISTA del concesionario, tomamos fotos y videos
          - n: '04'
            text: Enviamos un informe y decimos claramente si vale la pena o si hay que seguir buscando
          - n: '05'
            text: Negociamos, cerramos el trato y le entregamos el automóvil o lo llevamos a su puerta
        includedHeading: Qué está incluido en el servicio
        includedLead: La comisión se fija antes de comenzar y no depende de cuántos autos tengamos que revisar. Si tras la revisión decimos “no lo compre”, seguimos buscando y no hay que pagar nada adicional.
        included:
          - title: Búsqueda sin límite en la cantidad de opciones
            text: Trabajamos hasta que encontramos un automóvil sin preocupaciones. Rechazar una opción fallida forma parte del trabajo y no cuesta nada extra.
          - title: Visita de un experto para cada inspección
            text: 'Utilizamos un medidor de grosor de pintura, escáner en bloques, elevador donde sea necesario. Fotos y videos de todos los puntos problemáticos: usted ve lo mismo que nosotros.'
          - title: Verificación del historial y legalidad
            text: Informe de CarVertical por VIN, historial de servicio del concesionario por marca, verificación de kilometraje, gravámenes, restricciones para registro y eventos de seguros no resueltos.
          - title: Negociación y formalización de la transacción
            text: Negociamos el precio considerando lo encontrado, preparamos los documentos y acompañamos la firma.
          - title: Entrega y registro
            text: Llevamos el automóvil a su ciudad y ayudamos con el registro o le entregamos las llaves donde le resulte más conveniente.
          - title: Una sola persona para todo el proceso
            text: Usted trabaja con el mismo especialista que fue a la inspección. No es necesario explicar de nuevo la tarea a cada persona que conteste el teléfono.
        compareHeading: Cómo se diferencian los mercados entre sí
        compareLead: El mismo modelo en Alemania y en Polonia, en cuanto a historial y precio, son dos vehículos diferentes.
        compareHint: Elija un país y le mostraremos qué estamos observando allí primero.
        compareLinkFor: Selección {location} en detalle
      title: Selección de coches llave en mano
      descriptionFor: Encontraremos un automóvil {location} entre los que ya están en este país, sin importar desde el extranjero. Revisión completa, acompañamiento del proceso y entrega en su ciudad.
      ctaLabel: Enviar solicitud
      casesHeadingFor: 'Transacciones reales: selección de coches {location}'
      breadcrumbLabelFor: Coches {location}
      stepsFor:
        - n: '01'
          text: Envía una solicitud con requisitos (presupuesto, marca, kilometraje)
        - n: '02'
          text: Buscamos opciones {location} según sus criterios
        - n: '03'
          text: Un experto independiente inspecciona y verifica el coche
        - n: '04'
          text: Acompañamos la transacción, ayudamos con documentos y registro
        - n: '05'
          text: Entregamos el automóvil a su ciudad y ayudamos a registrarlo
      deliveryLineFor: Entregaremos el automóvil en cualquier ciudad del país. Si necesita ser exportado, nos encargamos de la exportación y el despacho aduanero hacia {destinations} y cualquier otro país.
      deliveryDestinations:
        - Bosnia y Herzegovina
        - Croacia
        - Macedonia del Norte
        - Turquía
        - Kazajistán
        - Kirguistán
      citiesHeadingFor: Dónde inspeccionamos coches {countryLocation}
      citiesLead: El experto viaja por todo el país, pero generalmente inspeccionamos coches donde hay más disponibles. Esto implica lo siguiente para cada ciudad.
      alsoInLabel: 'También seleccionamos en:'
      crossSellLabel: ¿Necesita un coche que no sea local?
      countryNotesHeadingFor: Qué consideramos en {location}
      countryNotesPointsLabel: A qué prestamos atención primero
      countryNotes:
        de:
          lead: 'Aquí hay más opciones que en cualquier otro mercado de Europa, y el historial de servicio suele ser claro: la mayoría de los vehículos tienen un libro de servicio con registros de mantenimiento. El lado negativo: los kilometrajes en carretera son altos. Doscientos mil en tres años es lo normal, no motivo para un descuento.'
          points:
            - Libro de servicio y marcas del concesionario, verificamos por VIN en el servicio oficial
            - Protocolo HU, que todos llaman TÜV. Leemos las observaciones de la última revisión y no solo el sello
            - 'Coches de leasing y flotas corporativas: mantenidos adecuadamente, pero con altos kilometrajes'
            - Caminos invernales con agentes químicos, así que revisamos el chasis y los umbrales de manera separada
        rs:
          lead: Aquí estamos presentes, por lo que inspeccionamos el coche el mismo día de la solicitud y sin importar el extranjero. El mercado es pequeño, por lo que el mismo coche puede haber pasado por varios vendedores, lo que complica la historia.
          points:
            - El automóvil ya está registrado y tiene matrícula local, no se necesitan aranceles ni trámites de importación
            - El kilometraje a menudo se altera al revender dentro del país, verificamos con los registros del техпреглед
            - Muchos vehículos importados de Alemania e Italia, verificamos qué ocurrió con el automóvil antes de la importación
            - Inspección el mismo día de la solicitud, sin esperas por logística
        es:
          lead: Invierno suave y casi sin productos químicos en las carreteras, por lo que el bastidor de los coches españoles suele estar en mucho mejor estado que el de los alemanes. Sin embargo, el sol y la cercanía al mar afectan la pintura, el plástico y las piezas de goma.
          points:
            - Costas, así que buscamos corrosión principalmente en cavidades ocultas
            - La pintura desteñida y el plástico agrietado del interior se incluyen en el precio
            - 'Muchos vehículos de alquiler: kilometraje regular, pero uso severo'
            - Protocolo ITV, revisamos las observaciones y las fechas de las revisiones
        ch:
          lead: 'Los coches suizos están mucho mejor cuidados que el promedio en Europa: el mantenimiento costoso impone disciplina, los kilometrajes son bajos. Pero Suiza no está en la UE, así que la importación se gestiona de forma distinta y esto lo contemplamos en el presupuesto desde el principio.'
          points:
            - Equipamientos ricos, aquí se compran más a menudo que en los países vecinos
            - MFK. La revisión es estricta, se preparan con seriedad y eso se ve en el vehículo
            - 'No pertenece a la UE: aduanas y documentos se gestionan de forma diferente que en los países de la Unión'
            - Precios por encima del mercado, pero luego ahorras en reparaciones
        pt:
          lead: El mercado es pequeño, la selección es más modesta que la española, pero la competencia por un buen automóvil es menor. El clima es húmedo y salado, la corrosión marina aparece incluso en vehículos nuevos.
          points:
            - Humedad y mar, por lo que cavidades ocultas y electricidad son prioridad en la inspección
            - 'Mercado pequeño: tardamos más en buscar según parámetros específicos que en Alemania'
            - Protocolo IPO, revisamos las observaciones de las inspecciones anteriores
            - Muchos diéseles y utilitarios pequeños, carrocerías grandes son poco comunes
        fr:
          lead: Francia es principalmente diésel y marcas locales. Peugeot, Renault y Citroën son más baratos aquí que en cualquier otra parte de Europa. El premium alemán, por el contrario, es más caro, y tiene poco sentido comprarlo aquí.
          points:
            - Marcas francesas al mejor precio de Europa y el mantenimiento es más económico
            - Diésel, filtros de partículas y válvula EGR se revisan como un ítem separado
            - Contrôle technique. Los protocolos son detallados, verificamos las observaciones por años
            - 'Uso urbano: el desgaste de la tracción y la suspensión es más rápido de lo declarado'
        it:
          lead: 'El mercado italiano es bueno en utilitarios y equipamientos raros, pero requiere precaución: los coches aquí se utilizan intensamente, y las reparaciones de carrocería pequeñas no siempre son efectuadas correctamente.'
          points:
            - Ciudades, golpes pequeños frecuentes y repintados, es necesario el medidor de grosor
            - El sur y la costa traen sal y corrosión, el norte se asemeja más a las condiciones alemanas
            - Revisione, verificamos la regularidad, las omisiones son más comunes de lo habitual
            - Muchos vehículos con equipamiento a gas, revisamos eso por separado
        pl:
          lead: 'El mercado más grande más cercano a nosotros: logística económica y corta. Pero Polonia ha sido durante años el principal punto de reenvío para autos dañados de Europa Occidental, así que aquí verificamos el historial más estrictamente que en cualquier otro lugar.'
          points:
            - Alta proporción de vehículos reparados tras accidentes, prioridad en la geometría de la carrocería
            - 'Reventas frecuentes: un coche puede cambiar de dueño varias veces en un año'
            - El kilometraje a menudo se altera en la importación, verificamos con bases de servicio
            - Corta distancia de entrega, más barato y rápido que desde España o Portugal
      closing:
        eyebrow: ¿Por dónde empezamos?
        line1: Describe el coche que buscas,
        line2: que está buscando,
        accentWord: nuestra parte es lo demás
        text: Presupuesto, carrocería, caja, un par de deseos adicionales. Buscamos, usted revisa los informes de opciones y decide cuál ver en persona.
