translations:
  en:
    vehicle-sourcing:
      hub:
        metaTitle: Car Sourcing in Europe Turnkey
        metaDescription: 'We source cars in Germany, Serbia, Spain, Switzerland, Italy, France, Poland, and Portugal: searching, inspection visits, negotiating, and delivery made easy.'
        title: Car Sourcing
        titleHighlight: turnkey
        description: We help you find a vehicle in the country where you are located or plan to buy — complete checks, transaction support, and delivery made easy. Select a country to see more details.
        breadcrumbLabel: Car Sourcing
        casesHeading: Car Sourcing Cases
        chooseCountryLabel: 'Select a country:'
        ctaLabel: Find a Car
        heroPhotoAlt: A row of cars at a dealer’s lot
        processHeading: How the Sourcing Works
        processLead: 'From application to keys typically takes from three days to two weeks. The longest part is finding the right car: we don’t settle for the first option and continue searching until we find one that passes our checks without any issues.'
        processSteps:
          - n: '01'
            text: We discuss your budget, make, and requirements — what's important and what you're willing to compromise on.
          - n: '02'
            text: We shortlist options on-site and screen out anything that doesn't pass our initial questions by phone.
          - n: '03'
            text: We conduct the inspection using a thickness gauge and scanner, connect to the dealer ISTA for BMWs, and take photos and videos.
          - n: '04'
            text: We send you a report and directly advise whether to proceed or keep searching.
          - n: '05'
            text: We negotiate, finalize the deal, and either hand over the car to you or deliver it to your doorstep.
        includedHeading: What's Included
        includedLead: The commission is fixed before we start and does not depend on the number of vehicles we need to inspect. If we tell you 'not to buy' after a check, we will continue searching without any additional charges.
        included:
          - title: Unlimited Search Options
            text: We keep working until we find a car that meets your standards. Declining an unsuitable option is part of the service and incurs no extra cost.
          - title: Expert Inspection for Every Visit
            text: Thickness gauge for panels, scanner for blocks, a lift when needed. Photos and videos from all problematic areas — you see the same issues we do.
          - title: History and Legal Check
            text: CarVertical report by VIN, dealer service history for the make, mileage verification, liens, registration restrictions, and unresolved insurance incidents.
          - title: Negotiation and Deal Finalization
            text: We negotiate the price based on our findings, prepare documents, and assist with the signing.
          - title: Delivery and Registration
            text: We transport the car to your city and assist with local registration — or we hand over the keys wherever is most convenient for you.
          - title: One Point of Contact for the Whole Process
            text: You work with the same specialist who conducted the inspection. No need to explain your requirements to multiple people on the phone.
        compareHeading: How the Markets Differ
        compareLead: The same model in Germany and Poland is two different cars in terms of history and price.
        compareHint: Select a country — we'll show you what we look for there first.
        compareLinkFor: Sourcing {location} — in detail
      title: Turnkey Car Sourcing
      descriptionFor: We will find a vehicle in {location} — among cars that are already in this country, without importing from abroad. Complete checks, transaction support, and delivery to your city — turnkey, including customs clearance.
      ctaLabel: Submit a Request
      casesHeadingFor: 'Cases: Car Sourcing {location}'
      breadcrumbLabelFor: Cars {location}
      stepsFor:
        - n: '01'
          text: Submit a request with your requirements — budget, make, mileage.
        - n: '02'
          text: We search for options in {location} based on your criteria.
        - n: '03'
          text: An independent expert inspects and verifies the vehicle.
        - n: '04'
          text: We support the transaction, help with documents and registration.
        - n: '05'
          text: We deliver the car to your city — turnkey, including customs clearance.
      deliveryLineFor: We deliver to {destinations} — and to any other country, which we can discuss upon request.
      deliveryDestinations:
        - Russia
        - Kazakhstan
        - Kyrgyzstan
        - Ukraine
        - Belarus
        - Bosnia and Herzegovina
        - Croatia
        - North Macedonia
        - Turkey
      citiesHeadingFor: Where We Inspect Cars in {countryLocation}
      citiesLead: Experts go all over the country, but we typically inspect cars where they are more commonly available. Here’s what it means for each city.
      alsoInLabel: 'We also source in:'
      crossSellLabel: Need a non-local vehicle?
      countryNotesHeadingFor: What We Consider in {location}
      countryNotesPointsLabel: What We Check First
      countryNotes:
        de:
          lead: 'The selection here is larger than in any other European market, and service history is usually traceable: most cars have a service book with dealer stamps for each maintenance. The downside — autobahn mileage. Two hundred thousand kilometers in three years is the norm, not a reason for a price reduction.'
          points:
            - Service book and dealer stamps — we verify via VIN at an official service station.
            - HU protocol, commonly known as TÜV — we read notes from previous inspections, not just the stamp.
            - 'Cars from leasing companies and corporate fleets: properly maintained, but with high mileage.'
            - Winter roads with de-icers — we inspect the underside and sills carefully.
        rs:
          lead: We are here on-site, so we inspect the car on the day of your inquiry and without any imports. The market is small, and the same car can pass through several sellers, making it necessary to unravel the history.
          points:
            - The car is already cleared of customs and has local plates — no duties or import paperwork needed.
            - Mileage is often tampered with during resale within the country — we verify against technical inspection records.
            - Many vehicles are imported from Germany and Italy — we check the car’s history before import.
            - Inspection on the day of inquiry, no waiting for logistics.
        es:
          lead: The mild winter and almost no de-icers on the roads mean that Spanish cars typically have better undercarriages than German ones. However, the sun and proximity to the sea can damage paint, plastic, and rubber parts.
          points:
            - Along the coast — we primarily check for corrosion in hidden cavities.
            - Faded lacquer and cracked interior plastic — we factor these into the price.
            - 'Many former rental cars: even mileage, but heavily utilized.'
            - ITV protocol — we verify notes and inspection dates.
        ch:
          lead: 'Swiss cars are noticeably better maintained than the European average: expensive servicing ensures discipline, and odometer readings are usually low. But Switzerland is not in the EU, so the import procedures differ, which we include in the budget upfront.'
          points:
            - More luxurious trims — these are more common here than among neighbors.
            - MFK — the inspection is strict, with thorough preparation, and it shows on the car.
            - 'Not in the EU: customs and paperwork are processed differently than for EU countries.'
            - Prices are higher than the market average, but you'll save on repairs later.
        pt:
          lead: The market is small, offering less variety than Spain, but competition for good cars is also lower. The humid, salty climate leads to coastal corrosion even on newer vehicles.
          points:
            - Humidity and sea — we prioritize hidden cavities and electrical components in our inspections.
            - 'Small market: we search longer for specific requests than in Germany.'
            - IPO protocol — we check notes from previous inspections.
            - Many diesels and small cars, larger bodies are rare.
        fr:
          lead: France is primarily about diesel and local brands. Peugeot, Renault, and Citroën are cheaper here than anywhere else in Europe. German premium brands are conversely more expensive, making them less sensible to buy here.
          points:
            - French makes — best prices in Europe, and servicing costs are lower.
            - Diesels — we closely check the diesel particulate filter and EGR valve.
            - Contrôle technique — comprehensive reports, we verify notes by year.
            - 'City driving: clutches and suspensions wear out faster than advertised.'
        it:
          lead: 'The Italian market is great for small cars and unique trims, but it requires caution: vehicles here are intensively used, and minor body repairs are not always done carefully.'
          points:
            - City — frequent minor bumps and touch-ups, using a thickness gauge is essential.
            - The south and the coast expose vehicles to salt and corrosion, while the north is closer to German conditions.
            - Revisione — we check for regularity, as lapses are more common than usual.
            - Many cars with gas systems — we inspect those separately.
        pl:
          lead: 'The nearest major market to us: logistics are cheap and short. However, Poland has long been a primary transit point for damaged vehicles from Western Europe, so we check histories here more rigorously than anywhere else.'
          points:
            - High percentage of cars restored after accidents — we prioritize body geometry checks.
            - 'Frequent resales: a car can change hands several times in a year.'
            - Mileage is often altered during import — we verify against service databases.
            - Short delivery distances — cheaper and faster than from Spain or Portugal.
      closing:
        eyebrow: How shall we begin?
        line1: Describe the car
        line2: you're looking for —
        accentWord: then it's our job
        text: Budget, body style, transmission, and a couple of preferences. We'll handle the search while you review reports on options and decide which ones to inspect in person.
    vehicle-buyback:
      hub:
        metaTitle: Buyback of Cars with Russian Plates in Europe
        metaDescription: We buy cars with Russian plates in any country in Europe and cars with Serbian plates in Serbia. Photo appraisal within an hour, payment on the day of signing.
        title: Car Buyback
        titleHighlight: no haggling for weeks
        description: 'We take cars that are difficult to sell through standard methods: Russian plates, expired temporary import, questionable documents. The price is below market value — this is the cost of speed and the fact that we handle all the hassle of the sale.'
        breadcrumbLabel: Car Buyback
        casesHeading: Buyback Cases
        chooseCountryLabel: 'Select a country:'
        ctaLabel: Get an appraisal
        heroPhotoAlt: Keys to a car on top of money and documents
        processHeading: How the Buyback Works
        processLead: From the first message to payment usually takes two to three days, most of which is travel time to the meeting point. We provide a photo appraisal within an hour.
        processSteps:
          - n: '01'
            text: You send photos, documents, and an honest description of the condition
          - n: '02'
            text: We provide the price within an hour — immediately final, without a range
          - n: '03'
            text: We agree on a meeting location where the car is; if it’s non-operational, we come with a trailer
          - n: '04'
            text: We inspect the car in person and confirm the price if the description matches
          - n: '05'
            text: We sign the contract, and the payment is transferred on the day of signing
        includedHeading: What We Handle
        includedLead: For the difference between our price and the market price, we take care of everything, making sure the car doesn't sit unsold for months.
        included:
          - title: Cars with Russian Plates
            text: The main category. The car can be located in any country in Europe — we will come to wherever it is, and we handle the export and subsequent resale.
          - title: Import Issues and Deadlines
            text: After signing, the expired temporary import and associated risks transfer to us.
          - title: Appraisal Without Inspection
            text: We provide a price based on photos and documents. We only come when both parties have agreed on the amount.
          - title: Transaction Processing
            text: We prepare the contract, deregistration, and all paperwork. From you, we only need the car documents and a signature.
          - title: Payment on the Day of Signing
            text: Money is transferred on the same day. We don’t operate with payment plans or 'we’ll pay more after resale'.
          - title: Honest Refusal
            text: If the car isn’t suitable for us, we’ll let you know right away and explain the reason. We won't drag out negotiations or lower the price during discussions.
      title: Car Buyback
      ctaLabel: Get an appraisal
      casesHeading: Buyback Cases
      breadcrumbLabel: Car Buyback
      descriptionSerbia: We buy cars with Russian plates below market value — the car can be located in any country in Europe. We also buy cars with Serbian plates in Serbia and Montenegro. Online appraisal, paperwork in one day, payment on the day of the deal.
      descriptionOtherFor: We buy cars with Russian plates below market value — the car can be located in any country in Europe, including {name}. Online appraisal, paperwork in one day, payment on the day of the deal.
      serbiaLinkLabel: Car with Serbian plates?
      step1: You send photos and a description of the car
      step2: We appraise online from the photos within 1 hour — below market value
      step3Serbia: We meet for the inspection — Russian plates (in any country in Europe) or Serbian plates (Serbia, Montenegro)
      step3Other: We meet for the inspection — Russian plates, the car can be in any country in Europe
      step4: We finalize the transaction, payment on the day of signing
      closing:
        eyebrow: Want an appraisal?
        line1: Send us photos
        line2: and documents —
        accentWord: the price will be ready in an hour
        text: The appraisal is free and comes with no obligation. If the price doesn't work for you, we’ll part ways without any pressure or follow-up calls.
    vehicle-import:
      hub:
        metaTitle: Importing Cars from Europe and China Turnkey
        metaDescription: We import cars from Germany, Spain, Switzerland, and China to any country — sourcing, inspection, delivery, and customs clearance all included.
        title: Car Imports
        titleHighlight: from Europe and China
        description: The car is in Europe or China, and you are anywhere else. We source, inspect, and bring it to you turnkey, including customs clearance.
        breadcrumbLabel: Car Imports
        casesHeading: Import Cases
        euCardTitle: From Europe
        euCardText: Spain, Switzerland, and other countries — sourcing and delivery to any location.
        chinaCardTitle: From China
        chinaCardText: New and used cars from China — delivery through a trusted partner.
        exploreLabel: Learn More
        ctaLabel: Calculate Import
        heroPhotoAlt: Car transporter loaded with cars
        processHeading: How Import Works
        processLead: Typically, it takes four to eight weeks from application to registration, with the transportation time being the shortest part. A car travels from Germany to Belgrade in a few days, while customs and registration can take weeks.
        processSteps:
          - n: '01'
            text: We calculate the total cost before starting — the car, logistics, duties, documentation.
          - n: '02'
            text: We find and inspect the car in the country of origin.
          - n: '03'
            text: We purchase the car through our European company, deregister it, and prepare export documents.
          - n: '04'
            text: We transport it by car carrier or drive it with transit plates.
          - n: '05'
            text: We handle customs clearance, register it, and hand over the keys.
        includedHeading: What the Price Includes
        includedLead: "When importing on your own, the budget usually gets blown by costs beyond the car's price. We calculate it in advance and fix it: the final amount should match the initial estimate."
        included:
          - title: Cost of the Car
            text: The price after negotiation, not the listed price. We negotiate with the seller during the inspection, which often offsets some costs.
          - title: Logistics to Destination
            text: Car carrier or driving with transit plates. We evaluate both options and choose the more cost-effective one for the specific route.
          - title: Duties and Taxes
            text: The rate depends on the country of origin and the car's age. For European-made cars, the EUR1 certificate significantly alters the calculations — we check its availability before purchase.
          - title: Export and Transit
            text: Deregistration in the seller's country, export declaration, transit plates, and insurance for the drive.
          - title: Customs Clearance
            text: Declaration, broker, and payment upon arrival. We prepare the package in advance to avoid unnecessary days of storage.
          - title: Registration
            text: Technical inspection, registration, and license plates. You pick up the car and can drive it immediately.
