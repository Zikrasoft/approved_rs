            text: Razgovaramo o budžetu, marki i zahtevima — šta je važno, a čega ste spremni da se odreknete
          - n: '02'
            text: Biramo opcije na licu mesta i isključujemo sve što ne zadovoljava zahteve
          - n: '03'
            text: Izlazimo na provere sa debljinomera i skenerom, za BMW povezujemo dijagnostički uređaj, snimamo fotografije i video
          - n: '04'
            text: Šaljemo izveštaj i direktno kažemo, da li da kupite ili da tražite dalje
          - n: '05'
            text: Pregovaramo, obavljamo transakciju i predajemo auto vama ili ga dovozimo do vrata
        includedHeading: Šta uključuje usluga
        includedLead: Provizija se fiksira do početka i ne zavisi od broja automobila koje smo morali da proverimo. Ako nakon provere kažemo 'ne kupujte' — tražimo dalje, ne treba dodatno plaćati za to.
        included:
          - title: Pretraga bez ograničenja po broju opcija
            text: Radimo dok ne pronađemo auto koji ne izaziva primedbe. Odbijanje neuspešnog modela uključeno je u uslugu i ne košta dodatno.
          - title: Izlazak stručnjaka na svaku proveru
            text: Debljinomera po panelima, skener po blokovima, dizalica tamo gde je potrebna. Fotografije i video snimci sa svih problematičnih mesta — vi vidite isto što i mi.
          - title: Provera istorije i pravne ispravnosti
            text: Izveštaj CarVertical po VIN-u, dealerska servisna istorija po marki, provera kilometraže, hipoteke, ograničenja za registraciju i neispunjeni osiguravajući događaji.
          - title: Pregovaranje i zaključivanje transakcije
            text: Dogovaramo se o ceni s obzirom na pronađeno, pripremamo dokumente i pratimo potpisivanje.
          - title: Isporuka i registracija
            text: Dovozimo auto do vašeg grada i pomažemo sa registrovanjem na licu mesta — ili predajemo ključeve gde vam odgovara.
          - title: Jedna osoba za ceo proces
            text: Sa vama radi isti stručnjak koji je bio na provali. Nema potrebe da ponovo objašnjavate zadatak svima koji podižu telefon.
        compareHeading: Kako se tržišta međusobno razlikuju
        compareLead: Isti model u Nemačkoj i u Poljskoj — po istoriji i ceni to su dva različita automobila.
        compareHint: Izaberite zemlju — pokazujemo šta prvo gledamo tamo.
