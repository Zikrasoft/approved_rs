          points:
            - El flete marítimo es el plazo principal, planifique en meses, no en semanas
            - 'La procedencia europea no se confirma: el EUR1 no se aplica aquí, los aranceles son más altos'
            - 'Garantía y repuestos: verificamos si el modelo se apoya en el país de destino'
            - 'Vehículos eléctricos: verifique la compatibilidad de los conectores de carga y con las redes locales'
      closing:
