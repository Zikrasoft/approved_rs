          points:
            - El flete marítimo es el principal plazo, planifica en meses, no en semanas
            - 'El origen europeo no se verifica: el EUR1 no se aplica aquí, los aranceles son más altos'
            - 'Garantía y piezas: verificamos si el modelo se mantiene en el país de destino'
            - 'Vehículos eléctricos: comprobamos el conector de carga y la compatibilidad con las redes locales'
