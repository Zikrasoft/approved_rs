  countryNotesPointsLabel: Что проверяем сверх обычного чек-листа
  countryNotes:
    de:
      lead: >-
        В Германии есть на что опереться: сервисная книжка, протоколы HU и
        развитые базы по VIN. Поэтому проверка здесь — это в первую очередь
        сверка документов с тем, что показывает машина.
      points:
        - Отметки дилерского ТО сверяем с показаниями одометра по годам
        - Замечания прошлого HU — что чинили после осмотра, а что просто дотянули
        - Днище и пороги после зимних реагентов, включая скрытые полости
        - 'Лизинговое прошлое: ровное обслуживание при большом пробеге'
    rs:
      lead: >-
        В Сербии выезжаем в день обращения. Главная задача — восстановить
        историю машины до ввоза: местные документы показывают только последний
        отрезок жизни автомобиля.
      points:
        - Страна происхождения и состояние машины до ввоза в Сербию
        - Показания одометра против отметок техпрегледа за прошлые годы
        - Кузовной ремонт после ввоза — его делают чаще и дешевле, чем в ЕС
        - 'Юридическая часть: залог и ограничения на регистрацию'
    es:
      lead: >-
        Испанские машины обычно радуют днищем и огорчают всем, что страдает от
        солнца и соли. Проверку смещаем с коррозии снизу на скрытые полости,
        электрику и состояние салона.
      points:
        - Коррозия в скрытых полостях у побережья — снизу может быть чисто
        - Лак, уплотнители и пластик после многолетнего солнца
        - 'Прокатное прошлое: сверяем пробег с характером износа салона'
        - Протокол ITV и что осталось незакрытым между осмотрами
    ch:
      lead: >-
        К MFK машины готовят всерьёз, поэтому свежий протокол сам по себе мало
        что говорит. Смотрим, что сделали именно перед осмотром, а что живёт
        своей жизнью с прошлого года.
      points:
        - Что заменили непосредственно перед MFK — свежие детали на фоне остального
        - Обслуживание дорогое, поэтому проверяем, не откладывали ли регламент
        - Комплектация богатая, но проверяем, что каждая опция ещё работает
        - 'Документы под ввоз: Швейцария не ЕС, комплект отличается'
    pt:
      lead: >-
        Всё здесь упирается во влажный морской климат. Проверку начинаем с
        коррозии и электрики: подводит обычно то, что живёт в сырости.
      points:
        - Скрытые полости, лонжероны и точки крепления подвески
        - Окисление разъёмов и блоков — типовая причина плавающих ошибок
        - Протокол IPO и регулярность прохождения
        - 'Дизели с городской эксплуатацией: сажевый фильтр и его история'
    fr:
      lead: >-
        Во Франции подробный contrôle technique, и это хорошая отправная точка.
        Дальше смотрим на то, что регламент не ловит: ресурс дизельной группы и
        износ от городского трафика.
      points:
        - Замечания contrôle technique по годам — что повторяется из осмотра в осмотр
        - Сажевый фильтр, EGR и турбина на дизелях
        - Сцепление и подвеска после плотного городского цикла
        - 'История по французским маркам: доступные запчасти, но свои слабые места'
    it:
      lead: >-
        Итальянские машины чаще других приезжают с мелким кузовным ремонтом,
        сделанным быстро и недорого. На толщиномер по панелям здесь уходит
        заметно больше времени, чем обычно.
      points:
        - Толщиномер по всем панелям — подкрасы после городских притёртостей
        - 'Разница между севером и югом: соль у побережья, обычный износ в глубине страны'
        - Газовое оборудование, если стоит, — установка и состояние баллона
        - Регулярность revisione и пропущенные периоды
    pl:
      lead: >-
        Польша — крупнейший перевалочный рынок для битых машин из Западной
        Европы. Поэтому первым делом выясняем, что с этим кузовом делали до продажи.
      points:
        - Геометрия проёмов и следы сварки — восстановление после серьёзного ДТП
        - 'История ввоза: откуда машина приехала и в каком виде'
        - Пробег сверяем с европейскими сервисными базами, одометру не верим
        - Подушки безопасности и их срабатывание в прошлом
  closing:
    eyebrow: Нашли машину?
    line1: Пришлите ссылку
    line2: на объявление —
    accentWord: приедем и посмотрим
    text: >-
      Выезжаем за один-два дня. Отчёт с фото остаётся у вас, даже если после
      него вы откажетесь от покупки.

cityVehicleSourcing:
  title: Автоподбор
  descriptionFor: Подберём автомобиль {cityLocation} с полной проверкой. Работаем по всему региону {countryName}.
  casesHeadingFor: Кейсы из {countryGenitiveOrName}
  whyCityHeadingFor: Почему {cityName}
  reason1: Смотрим и дилерские площадки, и частные объявления
  reason2: Историю по VIN проверяем до выезда на осмотр
  reason3For: Наш эксперт {cityLocation}
  reason4Dekra: Проверка DEKRA / TÜV по запросу
  reason4Generic: Независимая техническая экспертиза по запросу
  otherCitiesLabelFor: 'Другие города {countryLocation}:'
  cityNotesHeadingFor: Автомобильный рынок {cityLocation}
  cityNotesPointsLabel: Что это даёт на практике
  cityNotes:
    berlin:
      lead: >-
        В Берлине самый большой выбор в Германии и самый пёстрый состав
        продавцов. Тут встречается всё: и машины из корпоративных парков с
        полной историей, и перекупные варианты, приехавшие из Восточной Европы.
      points:
        - Огромный выбор в любом сегменте, включая редкие комплектации
        - Много частных продавцов — торг реальнее, чем у дилеров
        - 'Городской цикл: сцепление и подвеска изнашиваются заметнее, чем у автобанных машин'
    munich:
      lead: >-
        Дорогой город с дорогими машинами. Премиум-сегмента здесь больше, чем
        где-либо ещё в Германии, и состояние в среднем выше: за такими
        автомобилями следят.
      points:
        - Сильный премиум-сегмент, особенно BMW и Mercedes
        - Ухоженные машины с полной дилерской историей
        - Цены выше средних по стране — экономия идёт за счёт состояния
    hamburg:
      lead: >-
        Портовый город и крупный логистический узел. Отсюда удобно отправлять
        машину дальше, а на рынке чаще обычного попадаются свежие импортные
        автомобили.
      points:
        - Порт рядом — проще и дешевле организовать отправку
        - Много машин из северных земель с трассовыми пробегами
        - 'Влажный морской климат: кузов и скрытые полости смотрим внимательнее'
    belgrade:
      lead: >-
        Наша база. В Белграде мы выезжаем на осмотр в день обращения, знаем
        местных продавцов и видим, какая машина уже второй месяц кочует по
        площадкам.
      points:
        - Осмотр в день обращения, без ожидания и логистики
        - Знаем местные площадки и историю машин, которые на них стоят
        - Машина уже растаможена — ввоз и пошлины не нужны
    novi-sad:
      lead: >-
        Второй по величине город Сербии и час езды от Белграда. Рынок меньше,
        но и цены обычно спокойнее столичных, а машины реже успели пройти через
        несколько перепродаж.
      points:
        - Цены ниже белградских при сопоставимом состоянии
        - Меньше перекупов, чаще встречается первый владелец
        - Выезжаем из Белграда, отдельной платы за дорогу нет
    pancevo:
      lead: >-
        Панчево фактически входит в белградскую агломерацию, поэтому осмотр
        здесь не отличается от столичного. Рынок небольшой, зато частные
        объявления попадаются интереснее.
      points:
        - Двадцать минут от Белграда — выезжаем так же быстро
        - Небольшой рынок с преобладанием частных продавцов
        - Часто дешевле столицы при том же состоянии
    subotica:
      lead: >-
        Суботица стоит на границе с Венгрией, и это видно по рынку: много
        машин, ввезённых из ЕС, и продавцов, которые занимаются этим постоянно.
      points:
        - Приграничный рынок — много свежего импорта из Евросоюза
        - Историю до ввоза проверяем особенно тщательно
        - Удобная точка, если машину планируете гнать дальше на север
    madrid:
      lead: >-
        Столичный рынок Испании: самый большой выбор в стране и много машин из
        корпоративных парков. Континентальный климат, поэтому приморской
        коррозии тут меньше, чем на побережье.
      points:
        - Крупнейший выбор в Испании, включая корпоративные автомобили
        - Вдали от моря — кузова обычно чище прибрежных
        - 'Жаркое лето: пластик, лак и кондиционер проверяем отдельно'
    barcelona:
      lead: >-
        Всё определяет близость моря. Машины часто выглядят отлично снизу, но
        требуют внимания к скрытым полостям и электрике.
      points:
        - 'Море рядом, поэтому смотрим скрытые полости: снизу часто чисто, а внутри нет'
        - Много бывших прокатных и каршеринговых машин
        - Порт рядом, отправка морем организуется проще
    zurich:
      lead: >-
        Цюрих — самый дорогой автомобильный рынок региона. Комплектации здесь
        берут максимальные, обслуживают у дилера, а продают раньше, чем машина
        успевает устать.
      points:
        - Максимальные комплектации и небольшие пробеги
        - Дилерское обслуживание — история почти всегда полная
        - Швейцария не в ЕС, ввоз оформляется отдельно
    geneva:
      lead: >-
        Женева стоит во франкоязычной части Швейцарии, у самой границы с
        Францией. Французских марок на рынке заметно больше, чем в немецкой
        части страны.
      points:
        - 'Смешанный рынок: швейцарское состояние, французский ассортимент'
        - Граница с Францией рядом — есть с чем сравнить по цене
        - 'Оформление такое же, как по всей Швейцарии: экспорт плюс импорт'
    paris:
      lead: >-
        Самый большой выбор во Франции достаётся вместе с самой жёсткой
        эксплуатацией: плотный трафик и тесные парковки оставляют следы на
        кузове и подвеске.
      points:
        - Самый большой выбор во Франции, особенно французских марок
        - 'Городской цикл: сцепление, подвеска и мелкие кузовные повреждения'
        - Много дизелей — сажевый фильтр и EGR смотрим в первую очередь
    lyon:
      lead: >-
        Лион спокойнее Парижа и по ценам, и по состоянию машин. Трасса на юг
        рядом, поэтому чаще попадаются автомобили с ровным шоссейным пробегом.
      points:
        - Цены ниже парижских при сопоставимом выборе
        - Больше трассовых пробегов, меньше городского износа
        - Удобное плечо до Италии и Испании, если ищем шире
    milan:
      lead: >-
        Деловая столица Италии, и по деньгам это на рынке видно. Север страны
        ближе к немецким условиям: дороги лучше, машины ухоженнее южных.
      points:
        - Лучший выбор премиум-сегмента в Италии
        - Север — меньше соли и коррозии, чем на юге страны
        - 'Плотный город: толщиномер по панелям обязателен'
    rome:
      lead: >-
        Большой рынок с очень плотной городской эксплуатацией. Мелкие
        притёртости здесь считаются нормой жизни, и чинят их часто на скорую
        руку.
      points:
        - Много малолитражек и машин с газовым оборудованием
        - Частые подкрасы после городских контактов — проверяем каждую панель
        - Южнее Милана — климат мягче, но ближе к морю
    warsaw:
      lead: >-
        Через Варшаву в страну заходит основной импорт из Западной Европы, и
        здесь же крупнейший в Польше выбор. Доля восстановленных машин тоже
        самая высокая.
      points:
        - Крупнейший выбор в Польше, много свежего импорта из ЕС
        - Геометрию кузова и следы ремонта проверяем в первую очередь
        - Короткое плечо доставки — дешевле, чем из Южной Европы
    krakow:
      lead: >-
        Краков спокойнее Варшавы: рынок меньше, перепродаж меньше, а машины
        чаще держат одного владельца дольше. Юг Польши ближе к Балканам по
        логистике.
      points:
        - Меньше перекупов, чем в Варшаве, история обычно чище
        - Цены нередко ниже столичных
        - Ближе к маршруту на юг — удобно для доставки в Сербию
