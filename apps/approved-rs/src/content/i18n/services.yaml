      citiesHeadingFor: Wo wir Autos {countryLocation} besichtigen
      citiesLead: Der Experte fährt im ganzen Land, aber am häufigsten besichtigen wir Autos dort, wo sie am meisten angeboten werden. Was das für jede Stadt bedeutet, sehen Sie hier.
      alsoInLabel: 'Wir wählen auch aus:'
      crossSellLabel: Brauchen Sie kein lokales Auto?
      countryNotesHeadingFor: Was wir in {location} berücksichtigen
      countryNotesPointsLabel: Worauf wir zuerst achten
      countryNotes:
        de:
          lead: 'Die Auswahl hier ist größer als auf jedem anderen Markt in Europa, und die Servicehistorie ist normalerweise nachvollziehbar: die meisten Autos haben ein Serviceheft mit den Stempeln des Händlers für jede Wartung. Die Kehrseite sind die Autobahnkilometer. Zweihunderttausend in drei Jahren sind hier die Norm und kein Grund für einen Rabatt.'
          points:
            - Serviceheft und Händlerstempel – prüfen wir nach VIN im offiziellen Service
            - HU-Protokoll, das alle TÜV nennen – wir lesen die Anmerkungen der letzten Prüfung, nicht nur den Stempel
            - 'Autos aus Leasing und Firmenflotten: sind gut gewartet, aber haben hohe Kilometerstände'
            - Winterstraßen mit Streusalz – unterboden und Schweller überprüfen wir separat.
        rs:
          lead: Hier sind wir vor Ort, daher besichtigen wir das Auto am Tag der Anfrage und ohne Import. Der Markt ist klein, dasselbe Auto kann mehrere Verkäufer durchlaufen und die Geschichte muss entwirrt werden.
          points:
            - Das Auto ist bereits verzollt und hat lokale Nummernschilder – Zollgebühren und Importformalitäten sind nicht nötig.
            - Der Kilometerstand wird oft beim Weiterverkauf im Land angepasst – wir überprüfen ihn anhand der Technischen Prüfungen.
            - Viele importierte Autos aus Deutschland und Italien – wir prüfen, was mit dem Auto vor dem Import war.
            - Besichtigung am Tag der Anfrage, ohne auf Logistik zu warten.
        es:
          lead: Milde Winter und fast keine Streusalze auf den Straßen, deshalb ist der Unterboden spanischer Autos normalerweise deutlich besser als der deutscher. Dafür schadet die Sonne und die Nähe zum Meer dem Lack, dem Plastik und allem Gummi.
          points:
            - Küste – wir suchen Rost vor allem in versteckten Hohlräumen.
            - Verblasster Lack und rissiges Plastik im Innenraum – das berücksichtigen wir im Preis.
            - 'Viele ehemalige Mietwagen: gleichmäßiger Kilometerstand, aber harte Nutzung.'
            - ITV-Protokoll – wir prüfen die Anmerkungen und Prüfungstermine.
        ch:
          lead: 'Schweizer Autos sind deutlich besser gepflegt als der Durchschnitt in Europa: Teure Wartung diszipliniert, Kilometerstände sind niedrig. Aber die Schweiz gehört nicht zur EU, daher wird der Import anders abgewickelt, und wir berücksichtigen das im Budget im Voraus.'
          points:
            - Reiche Ausstattungen – hier wurden sie öfter gewählt als bei Nachbarn.
            - MFK – die Prüfung ist streng, es wird ernsthaft darauf vorbereitet, und das sieht man dem Auto an.
            - 'Nicht EU: Zoll und Dokumente werden nicht so bearbeitet wie für EU-Länder.'
            - Preise über dem Markt, aber Sie sparen später bei Reparaturen.
        pt:
          lead: Der Markt ist klein, die Auswahl bescheidener als die spanische, aber der Wettbewerb um ein gutes Auto ist niedriger. Das Klima ist feucht und salzig – Küstenkorrosion tritt sogar bei neueren Autos auf.
          points:
            - Feuchtigkeit und Meer – versteckte Hohlräume und Elektrik haben Priorität bei der Überprüfung.
            - 'Kleiner Markt: wir suchen für spezielle Anfragen länger als in Deutschland.'
            - IPO-Protokoll – wir lesen die Anmerkungen vorheriger Prüfungen.
            - Viele Dieselfahrzeuge und Kleinwagen, große Karosserien sind selten.
        fr:
          lead: Frankreich ist in erster Linie Diesel und eigene Marken. Peugeot, Renault und Citroën sind hier günstiger als irgendwo sonst in Europa. Deutscher Premium ist hingegen teurer und es macht wenig Sinn, diesen hier zu kaufen.
          points:
            - Französische Marken – die besten Preise in Europa, und der Service ist günstiger.
            - Diesel – Rußfilter und EGR-Ventil prüfen wir als separate Position.
            - Contrôle technique – ausführliche Protokolle, wir prüfen die Anmerkungen über die Jahre.
            - 'Städtische Nutzung: Kupplung und Fahrwerk verschleißen schneller als angegeben.'
        it:
          lead: 'Der italienische Markt ist gut für Kleinwagen und seltene Ausstattungen, erfordert aber Vorsicht: Die Autos werden hier stark genutzt und kleinere Karosserieschäden werden nicht immer sorgfältig behoben.'
          points:
            - Stadt – häufige kleine Dellen und Nachlackierungen, Messgerät ist obligatorisch.
            - Süden und Küsten sorgen für Salz und Korrosion, der Norden nähert sich den deutschen Bedingungen.
            - Revisione – wir prüfen die Regelmäßigkeit, Ausfälle kommen häufiger vor.
            - Viele Autos mit Gasanlage – wir schauen uns das gesondert an.
        pl:
          lead: 'Der nächstgelegene große Markt: die Logistik ist günstig und kurz. Aber Polen war jahrelang der Hauptumschlagplatz für beschädigte Fahrzeuge aus Westeuropa, deshalb prüfen wir die Geschichte hier strenger als irgendwo sonst.'
          points:
            - Hoher Anteil an nach Unfällen wiederhergestellten Fahrzeugen – die Karosseriegeometrie hat Priorität.
            - 'Häufige Wiederverkäufe: das Auto kann innerhalb eines Jahres mehrere Besitzer wechseln.'
            - Kilometerstände werden oft beim Import angepasst – wir überprüfen die anhand der Service-Datenbanken.
            - Kurze Transportwege – günstiger und schneller als aus Spanien oder Portugal.
      closing:
        eyebrow: Wie starten wir?
        line1: Beschreiben Sie das Auto,
        line2: das Sie suchen –
        accentWord: dann ist unsere Arbeit dran.
        text: Budget, Karosserie, Getriebe, ein paar Wünsche obendrauf. Wir suchen für Sie, während Sie die Berichte zu den Optionen einsehen und entscheiden, welches Sie sich live ansehen möchten.
