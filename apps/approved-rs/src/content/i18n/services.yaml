            text: Erklärung, Broker und Zahlung am Ankunftsort. Wir bereiten das Paket im Voraus vor, damit das Fahrzeug nicht unnötig in einem Lager steht.
          - title: Zulassung
            text: Technische Prüfung, Registrierung und Nummernschilder. Sie holen das Auto ab, das sofort fahrbereit ist.
