    description: >-
      Выезжаем к машине, которую вы нашли сами, и рассказываем, что с ней на
      самом деле. Отчёт приходит до того, как вы отдадите деньги: если ответ
      «не берите», вы теряете только стоимость проверки.
    breadcrumbLabel: Проверка авто
    casesHeading: Кейсы проверки
    chooseCountryLabel: 'Выберите страну:'
    ctaLabel: Заказать проверку
    processHeading: Как проходит проверка
    processLead: >-
      Обычно выезжаем в течение одного-двух дней после заявки. Сам осмотр
      занимает полтора-два часа, отчёт присылаем в тот же день, пока машина ещё
      не ушла другому покупателю.
    processSteps:
      - n: '01'
        text: Присылаете ссылку на объявление и контакты продавца
      - n: '02'
        text: Договариваемся с продавцом о времени и месте осмотра
      - n: '03'
        text: Выезжаем с толщиномером и сканером, для BMW подключаем дилерскую ISTA, при необходимости — на подъёмник
      - n: '04'
        text: Снимаем фото и видео всех находок, проверяем историю по VIN
      - n: '05'
        text: Присылаем отчёт и прямой ответ — брать, торговаться или отказаться
    includedHeading: Что входит в проверку
    includedLead: >-
      Сто с лишним пунктов чек-листа, но решают почти всегда четыре зоны:
      кузов, мотор с коробкой, ходовая и документы. Именно по ним мы чаще всего
      отговариваем от покупки.
    included:
      - title: Кузов и лакокрасочное покрытие
        text: >-
          Толщиномер по каждой панели, геометрия проёмов, следы сварки и
          шпаклёвки. Видно, был ли ремонт, о котором продавец не упомянул.
      - title: Двигатель и коробка
        text: >-
          Параметры на прогретом моторе, адаптации коробки, ошибки в памяти
          блоков. Самая дорогая зона и самая частая причина отказа.
      - title: Ходовая и тормоза
        text: >-
          Люфты, состояние подвески и тормозной системы. Автобанный пробег и
          балканские дороги изнашивают машину по-разному, и это видно.
      - title: Электроника и история по VIN
        text: >-
          Отчёт CarVertical, дилерская сервисная история по марке, расхождение
          пробега с историей, ошибки блоков и следы сработавших подушек
          безопасности.
      - title: Юридическая чистота
        text: >-
          Залог, запрет на регистрацию, незакрытые ДТП и страховые события —
          то, что всплывает уже после покупки.
      - title: Отчёт с фото и видео
        text: >-
          Каждая находка снята и подписана. Отчёт остаётся у вас — с ним удобно
          торговаться, даже если машину вы всё-таки берёте.
    heroPhotoAlt: Автомобиль на подъёмнике в сервисе
    mapHeading: Четыре зоны, которые решают сделку
    mapLead: >-
      Чек-лист длинный, но отговариваем почти всегда по одной из четырёх зон.
      Нажмите номер на схеме — покажем, что смотрит эксперт и что мы там
      находили.
    compareHeading: Что меняется от страны к стране
    compareLead: >-
      Регламент техосмотра, типичные болячки местных машин и способы спрятать
      историю везде свои.
    compareHint: Выберите страну — покажем, что добавляем к обычному чек-листу.
    compareLinkFor: Проверка {location} — подробно
  title: Проверка авто
  description: Независимая проверка автомобиля перед покупкой. Выезд эксперта, диагностика, отчёт — без обязательства покупки.
  ctaLabel: Заказать проверку
