translations:
  en:
    vehicle-sourcing:
      hub:
        metaTitle: Car Sourcing in Europe Made Easy
        metaDescription: 'We source vehicles in Germany, Serbia, Spain, Switzerland, Italy, France, Poland, and Portugal: full search, inspections, negotiation, and delivery.'
        title: Car Sourcing
        titleHighlight: made easy
        description: We find cars in the country where you are or plan to buy — complete checks, transaction support, and delivery made easy. Choose a country to see the details.
        breadcrumbLabel: Car Sourcing
        casesHeading: Real Car Sourcing Transactions
        chooseCountryLabel: 'Select a country:'
        ctaLabel: Find a Car
        heroPhotoAlt: Row of cars at the dealer's lot
        processHeading: How the Sourcing Works
        processLead: From application to keys usually takes from three days to two weeks. The longest part is finding the right car — we don’t settle for the first option and keep looking until we find one that’s free of issues after inspection.
        processSteps:
          - n: '01'
            text: We discuss budget, brand, and requirements — what is important and what can be sacrificed
          - n: '02'
            text: We shortlist options locally and filter out those that don’t meet our standards over the phone
          - n: '03'
            text: We carry out inspections with a thickness gauge and scanner; for BMW, we connect to the dealer’s ISTA, and take photos and videos
          - n: '04'
            text: We send a report and state clearly if it’s worth buying or if we should continue searching
          - n: '05'
            text: We negotiate, finalize the deal, and either hand you the car or deliver it to your doorstep
        includedHeading: What’s Included in the Service
        includedLead: The fee is fixed from the start and doesn’t depend on how many cars we had to check. If we say ‘don’t buy’ after inspection, we continue searching without any extra charge.
        included:
          - title: Unlimited Options Search
            text: We work until we find a car that meets your criteria. Dropping a failed option is part of the service and costs nothing extra.
          - title: Expert On-Site Inspections
            text: Thickness gauge for panels, scanner for blocks, lift where needed. Photos and videos from all problematic areas — you see what we see.
          - title: History and Legal Cleanliness Check
            text: CarVertical report by VIN, dealer service history, mileage verification, liens, registration restrictions, and unresolved insurance events.
          - title: Negotiation and Deal Finalization
            text: We agree on price considering the findings, prepare documents, and assist with the signing.
          - title: Delivery and Registration Assistance
            text: We deliver the car to your city and help with local registration — or we hand over keys wherever is most convenient for you.
          - title: One Person for the Entire Process
            text: You work with the same specialist who inspected the car. No need to explain your requirements to each person who answers the phone.
        compareHeading: How Markets Differ
        compareLead: The same model in Germany and Poland — in terms of history and price, these are two different cars.
        compareHint: Select a country — we’ll show you what we pay attention to there first.
        compareLinkFor: Sourcing in {location} — in detail
      title: Car Sourcing Made Easy
      descriptionFor: We will find a car in {location} — among those already in the country, without importing from abroad. Complete checks, transaction assistance, and delivery to your city.
      ctaLabel: Submit a Request
      casesHeadingFor: 'Real Transactions: Car Sourcing in {location}'
      breadcrumbLabelFor: Car in {location}
      stepsFor:
        - n: '01'
          text: You submit a request with requirements — budget, brand, mileage
        - n: '02'
          text: We look for options in {location} based on your criteria
        - n: '03'
          text: An independent expert inspects and verifies the vehicle
        - n: '04'
          text: We assist with the transaction, help with documents and registration
        - n: '05'
          text: We deliver the car to your city and help you register it
      deliveryLineFor: We will deliver the car to any city in the country. If it needs to be exported abroad, we take care of shipping and customs clearance — we deliver to {destinations} and any other country.
      deliveryDestinations:
        - Bosnia and Herzegovina
        - Croatia
        - North Macedonia
        - Turkey
        - Kazakhstan
        - Kyrgyzstan
      citiesHeadingFor: Where We Inspect Cars in {countryLocation}
      citiesLead: An expert travels all over the country, but we usually inspect cars where they are most available. Here’s what this means for each city.
      alsoInLabel: 'We also source in:'
      crossSellLabel: Need a non-local vehicle?
      countryNotesHeadingFor: What We Consider in {location}
      countryNotesPointsLabel: Top Considerations
      countryNotes:
        de:
          lead: 'The selection here is larger than any other market in Europe, and service history is usually traceable: most cars have a service book with dealer stamps for each maintenance. The downside — highway mileage. Two hundred thousand kilometers in three years is typical, not a reason for a discount.'
          points:
            - Service book and dealer stamps — we verify these by VIN at an authorized service center
            - HU protocol, commonly called TÜV — we read comments from the last inspection, not just the stamp
            - 'Leased and corporate fleet vehicles: well-maintained, but usually high mileage'
            - Winter roads with salt — we examine the undercarriage and sills particularly closely
        rs:
          lead: We are on the ground here, so we inspect cars on the day of inquiry and without imports. The market is small, the same car often passes through several sellers, making it complex to untangle the history.
          points:
            - The car is already cleared and with local plates — no import duties or clearance needed
            - Mileage is often tampered with during resale within the country — we verify it against technical inspection records
            - Many vehicles imported from Germany and Italy — we check the car’s history before import
            - Inspection on the day of inquiry, without waiting for logistics
        es:
          lead: Mild winters and almost no road salt mean that Spanish cars usually have significantly better undercarriages than German ones. However, the sun and proximity to the sea take a toll on paint, plastics, and all rubber parts.
          points:
            - On the coast — we look for corrosion mainly in hidden areas
            - Faded lacquer and cracked interior plastics — we factor this into the cost
            - 'Many former rental cars: consistent mileage, but rough usage'
            - ITV protocol — we verify comments and dates of inspections
        ch:
          lead: 'Swiss cars are generally better maintained than average in Europe: expensive maintenance leads to discipline, and mileage is usually lower. However, Switzerland is not in the EU, so the import process is different, which we account for in the budget upfront.'
          points:
            - Premium trims — more common here than among neighbors
            - MFK — inspections are strict, with serious preparation evident in the vehicle
            - 'Not in the EU: customs and documentation procedures differ from EU countries'
            - Prices are above market, but you save on repairs later
        pt:
          lead: The market is small, with a more modest selection than in Spain, but competition for a good vehicle is lower. The climate is humid and salty — coastal corrosion occurs even on newer cars.
          points:
            - Humidity and the sea — checking hidden cavities and electrical systems is a priority
            - 'Small market: it takes longer to find specific requests than in Germany'
            - IPO protocol — we read comments from previous inspections
            - Many diesels and small cars, while larger bodies are rare
        fr:
          lead: France is primarily about diesel and local brands. Peugeot, Renault, and Citroën are cheaper here than anywhere else in Europe. German premium brands, on the other hand, are more expensive and not worth buying here.
          points:
            - French brands — best prices in Europe, with cheaper servicing
            - For diesels — we check the particulate filter and EGR valve as a separate item
            - Contrôle technique — protocols are detailed, we verify comments by year
            - 'Urban usage: tires and suspension wear out faster than claimed'
        it:
          lead: 'The Italian market is good for small cars and unique trims, but needs caution: vehicles here are driven hard, and minor body repairs are not always done well.'
          points:
            - Cities — frequent small impacts and paint touch-ups; a thickness gauge is a must
            - The south and the coast bring salt and corrosion, while the north is closer to German conditions
            - Revisione — we check for regularity, with missed inspections occurring more often
            - Many cars with gas equipment — we review this separately
        pl:
          lead: 'The closest large market to us: logistics are cheap and short. But Poland has been the main transit point for damaged cars from Western Europe for years, so we check histories here more strictly than anywhere else.'
          points:
            - High percentage of cars restored after accidents — body geometry is a priority
            - 'Frequent resales: a car can change several owners within a year'
            - Mileage is often adjusted at import — we verify against service records
            - Short delivery distance — cheaper and faster than from Spain or Portugal
      closing:
        eyebrow: How shall we begin?
        line1: Describe the car you are looking for,
        line2: and we’ll take it from there —
        accentWord: the rest is our job
        text: Budget, body type, transmission, and a couple of preferences. We search while you review the reports on options and decide which one to see in person.
    vehicle-buyback:
