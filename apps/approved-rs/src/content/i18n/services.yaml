          - title: Pregovaranje i obavljanje transakcije
            text: Dogovaramo cenu na osnovu onoga što je pronađeno, pripremamo dokumente i pratimo potpisivanje.
          - title: Dostava i registracija
            text: Dostavljamo automobil do vašeg grada i pomažemo sa administracijom na licu mesta — ili predajemo ključeve gde je vama najprikladnije.
          - title: Jedna osoba za ceo proces
            text: S vama radi isti stručnjak koji je bio na pro veri. Nema potrebe da objašnjavate zadatak ponovo svakome ko uzme telefon.
