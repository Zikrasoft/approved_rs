            text: Wir berechnen die Gesamtkosten vor dem Start — Fahrzeug, Logistik, Zollgebühren, Formalitäten
          - n: '02'
            text: Wir finden und prüfen das Auto im Absenderland
          - n: '03'
            text: Wir kaufen das Auto über unsere europäische Firma, melden es ab und bereiten die Exportdokumente vor
          - n: '04'
