            text: Radimo dok ne pronađemo auto bez pritužbi. Odustajanje od neuspene opcije je deo usluge i ne naplaćuje se dodatno.
          - title: Poseta stručnjaka na svakoj pro veri
            text: Merač debljine po panelima, skener po blokovima, dizalica gde je potrebna. Fotografije i video sa svih problematičnih mesta — vidite ono što i mi.
          - title: Provera istorije i pravne ispravnosti
