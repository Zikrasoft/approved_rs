      citiesHeadingFor: Gde gledamo automobile {countryLocation}
      citiesLead: Stručnjak izlazi po celoj zemlji, ali najčešće gledamo automobile tamo gde ih najviše izlažu. Evo šta to znači za svaki grad.
      alsoInLabel: 'Takođe biramo u:'
      crossSellLabel: Need non-local car?
      countryNotesHeadingFor: Šta uzimamo u obzir {location}
      countryNotesPointsLabel: Na šta prvo obraćamo pažnju
      countryNotes:
        de:
          lead: 'Izbor ovde je veći nego na bilo kojem drugom tržištu Evrope, a istorija servisa obično se može pratiti: većina automobila ima servisnu knjižicu sa pečatima dilera o svakom servisu. S druge strane, autobahnski kilometri. Dvesta hiljada za tri godine ovde je uobičajeno, a ne razlog za popust.'
          points:
            - Servisna knjižica i pečati servisa — proveravamo po VIN-u kod zvaničnog servisa
            - Protokol HU, koji svi nazivaju TÜV, — čitamo primedbe sa prethodnog pregleda, a ne samo pečat
            - 'Automobili iz leasinga i korporativnih flota: redovno su servisirani, ali kilometri su veliki'
            - Zimske ceste sa reagensima — donji deo i pragovi se posebno proveravaju
        rs:
          lead: Ovde smo na licu mesta, pa gledamo automobil na dan zahteva i bez uvoza. Tržište je malo, jedan te isti automobil može proći kroz nekoliko prodavaca, a istorija se mora raspetljati.
          points:
            - Automobil je već carinjen i na domaćim registracijama — takse i carinjenje nisu potrebni
            - Kilometri se često menjaju tokom preprodaje unutar zemlje — proveravamo sa podacima teknčkog pregleda
            - Mnogo automobila uvezenih iz Nemačke i Italije — proveravamo šta se dešavalo sa automobilom pre uvoza
            - Pregled na dan zahteva, bez čekanja na logistiku
        es:
          lead: Blaga zima i gotovo nikakvih reagensa na putevima, tako da donji deo španskih automobila obično izgleda mnogo bolje od nemačkih. Međutim, sunce i blizina mora utiču na farbu, plastiku i sve gumene delove.
          points:
            - Obala — tražimo koroziju pre svega u skrivenim mestima
            - Izgorela boja i napuknuta plastika enterijera — uzimamo u obzir pri proceni
            - 'Mnogo nekadašnjih iznajmljenih automobila: nepromenjen kilometar, ali intenzivno korišćeni'
            - Protokol ITV — proveravamo primedbe i datume pregleda
        ch:
          lead: 'Švajcarski automobili su znatno bolje očuvani u poređenju sa prosekom Evrope: skupa usluga disciplinuje, kilometraže su male. Ali Švajcarska nije u EU, pa se uvoz obavlja drugačije, a to uračunavamo u budžet unapred.'
          points:
            - Bogate opreme — ovde su česće kupovane nego kod komšija
            - MFK — strogi pregled, pripremaju se ozbiljno, što je vidljivo na automobilu
            - 'Nije članica EU: carina i dokumenta se ne obrađuju na isti način kao za zemlje EU'
            - Cena je viša od tržišne, ali kasnije štedite na popravkama
        pt:
          lead: Tržište je malo, izbor je skromniji od španskog, ali je i konkurencija za dobar automobil niža. Klima je vlažna i slana — morska korozija se javlja čak i na novim automobilima.
          points:
            - Vlažnost i more — skriveni delovi i elektrika su prioritet pregleda
            - 'Malo tržište: tražimo specifične zahteve duže nego u Nemačkoj'
            - Protokol IPO — čitamo primedbe prethodnih pregleda
            - Mnogo dizelaša i malih automobila, veći modeli se retko nalaze
        fr:
          lead: Francuska je prvenstveno domaćin dizela i lokalnih marki. Peugeot, Renault i Citroën su ovde jeftiniji nego bilo gde u Evropi. Nemački premium je, naprotiv, skuplji, i nema smisla kupovati ga ovde.
          points:
            - Francuske marke — najbolja cena u Evropi, i održavanje je jeftinije
            - Dizelaši — filter čađe i EGR ventil proveravamo kao posebnu stavku
            - Contrôle technique — protokoli su detaljni, proveravamo primedbe po godinama
            - 'Gradska upotreba: kvačilo i ovjes se brže troše nego je navedeno'
        it:
          lead: 'Italijansko tržište je dobro za male automobile i retke specifikacije, ali zahteva oprez: automobili se ovde intenzivno koriste, a sitni karoserijski popravci se ne rade uvek pažljivo.'
          points:
            - Grad — česti sitni udarci i prefarbavanja, mjera debljine je obavezna
            - Jug i obala donose so i koroziju, sever bliže nemačkim uslovima
            - Revisione — proveravamo redovnost, propušteni pregledi se javljaju češće nego obično
            - Mnogo automobila sa plinskom opremom — gledamo to posebno
        pl:
          lead: 'Najbliže veliko tržište za nas: logistika je jeftina i brza. Ali Poljska je godinama bila glavno mesto za preprodaju oštećenih automobila iz Zapadne Evrope, tako da ovde proveravamo istoriju strože nego bilo gde drugde.'
          points:
            - Visok udeo obnovljenih nakon nesreće — geometrija karoserije je prioritet
            - 'Česte preprodaje: automobil može promeniti nekoliko vlasnika u jednoj godini'
            - Kilometraža se često menja tokom uvoza — proveravamo sa servisnim bazama
            - Kratka nedelja dostave — jeftinije i brže nego iz Španije ili Portugala
      closing:
        eyebrow: Kako da počnemo?
        line1: Opišite automobil,
        line2: koji tražite, —
        accentWord: dalje je naš posao
        text: Budžet, karoserija, menjač, nekoliko želja sa strane. Mi tražimo, a vi gledate izveštaje o opcijama i odlučujete koju želite pogledati uživo.
