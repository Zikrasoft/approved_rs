    vehicle-inspection:
      title: Car Inspection
      description: Independent pre-purchase car inspection. An expert visits the car, runs diagnostics and provides a report, with no obligation to buy.
      ctaLabel: Book an inspection
      casesHeading: 'Completed jobs: pre-purchase inspections'
      breadcrumbLabel: Car Inspection
      steps:
        - n: '01'
          text: Bodywork and paintwork, signs of repairs or accident damage
        - n: '02'
          text: Running gear, suspension and brakes
        - n: '03'
          text: Engine, gearbox and drivetrain
        - n: '04'
          text: Electronics and service history checks by VIN
        - n: '05'
          text: 'Legal status checks: outstanding finance, registration restrictions and accident records'
      extraLine: We also cover other European countries, including Portugal. Ask when you enquire.
      hub:
        metaTitle: Pre-Purchase Car Inspections in Europe
        metaDescription: "We inspect the car you've found: paint depth readings, diagnostic scan, VIN history and a same-day photo report. Available in eight European countries."
        title: Car Inspection
        titleHighlight: before you buy
        description: We visit the car you've found and tell you what it's really like. You get the report before you pay for the car. If our advice is to walk away, all you've spent is the inspection fee.
        breadcrumbLabel: Car Inspection
        casesHeading: 'Completed jobs: pre-purchase inspections'
        chooseCountryLabel: 'Choose a country:'
        ctaLabel: Book an inspection
        heroPhotoAlt: Car on a workshop lift
        processHeading: How the inspection works
        processLead: We can usually visit within one or two days of your enquiry. The inspection takes around 90 minutes to two hours, and we send the report the same day, before another buyer snaps up the car.
        processSteps:
          - n: '01'
            text: Send us the listing link and the seller's contact details
          - n: '02'
            text: We agree an inspection time and location with the seller
          - n: '03'
            text: We bring a paint depth gauge and diagnostic scanner, use dealer-level ISTA diagnostics for BMWs, and put the car on a lift if needed
          - n: '04'
            text: We photograph and film all findings and check the car's history by VIN
          - n: '05'
            text: 'We send a report with a clear recommendation: buy, negotiate or walk away'
        includedHeading: What's included
        includedLead: 'Our checklist covers over a hundred points, but four areas usually decide the outcome: bodywork, engine and gearbox, running gear, and paperwork. These are the most common reasons we advise against buying.'
        included:
          - title: Bodywork and paintwork
            text: Paint depth readings on every panel, alignment of door and window openings, and signs of welding or body filler. These reveal repairs the seller may not have mentioned.
          - title: Engine and gearbox
            text: Live data with the engine at operating temperature, gearbox adaptation values and stored fault codes. This is the costliest area and the most common reason to walk away.
          - title: Running gear and brakes
            text: Checks for play, suspension wear and brake condition. Autobahn mileage and Balkan roads leave different wear patterns, and we know what to look for.
          - title: Electronics and VIN history
            text: CarVertical report, brand-specific dealer service records, mileage discrepancies, control module fault codes and evidence of deployed airbags.
          - title: Legal status
            text: 'Outstanding finance, registration restrictions, unresolved accident and insurance claims: issues that can surface after you buy.'
          - title: Photo and video report
            text: Every finding is documented and explained. The report is yours to keep and makes a useful negotiating tool if you decide to buy the car.
        compareHeading: What changes from country to country
        compareLead: Roadworthiness test rules, common vehicle problems and ways of concealing a car's history vary from country to country.
        compareHint: Choose a country to see what we add to our standard checklist.
        compareLinkFor: Inspection {location} in detail
        mapHeading: Four areas that can make or break a deal
        mapLead: Our checklist is long, but when we advise against buying, it is almost always because of one of these four areas. Tap a number on the diagram to see what our expert checks and what we have found.
      countryNotesHeadingFor: How we inspect cars {location}
      countryNotesPointsLabel: What we check beyond the standard checklist
      countryNotes:
        de:
          lead: "In Germany, there is plenty to work with: service books, HU roadworthiness reports and extensive VIN databases. Our inspection focuses on checking whether the paperwork matches the car's actual condition."
          points:
            - Compare dealer service records with mileage readings year by year
            - 'Review previous HU findings: what was repaired afterwards and what was left unresolved'
            - Inspect the underbody and sills for road salt damage, including hidden cavities
            - 'Check for a leasing history: consistent servicing despite high mileage'
        rs:
          lead: In Serbia, we can inspect a car the day you contact us. The main task is to piece together its history before import, as local documents only cover the most recent part of its life.
          points:
            - Establish the country of origin and the car's condition before import into Serbia
            - Compare odometer readings with roadworthiness test records from previous years
            - Check for body repairs after import, which are more common and cheaper than in the EU
            - 'Check legal status: outstanding finance and registration restrictions'
        es:
          lead: Spanish cars often have clean underbodies, but sun and salt take their toll elsewhere. We shift the focus from underbody corrosion to hidden cavities, electrical systems and interior condition.
          points:
            - Check for corrosion in hidden cavities on coastal cars, even if the underbody looks clean
            - Inspect paintwork, seals and plastics for years of sun damage
            - Check for rental use by comparing mileage with interior wear
            - Review the ITV report and any issues left unresolved between tests
        ch:
          lead: Cars are thoroughly prepared for the MFK test, so a recent report alone tells us little. We check what was done just before the test and what has been left untouched since last year.
          points:
            - Identify parts replaced just before the MFK test and compare them with the rest of the car
            - Check for deferred scheduled servicing, as maintenance is expensive
            - Check that every feature still works, even on well-equipped cars
            - 'Check import paperwork: Switzerland is outside the EU, so the required documents differ'
        pt:
          lead: The damp maritime climate shapes our inspections here. We start with corrosion and electrical systems, as moisture-related problems are the most common concern.
          points:
            - Inspect hidden cavities, chassis rails and suspension mounting points
            - Check connectors and control modules for corrosion, a common cause of intermittent faults
            - Review the IPO report and check that tests were carried out on schedule
            - On diesels used in city traffic, check the diesel particulate filter and its history
        fr:
          lead: "France's detailed contrôle technique provides a good starting point. We then look at what the test does not reveal: the condition of key diesel components and wear from city driving."
          points:
            - Review contrôle technique findings over the years for recurring issues
            - Check the diesel particulate filter, EGR system and turbocharger on diesel cars
            - Inspect the clutch and suspension for wear from heavy city use
            - 'Review the history of French-brand cars: parts are readily available, but each model has its weak points'
        it:
          lead: Italian cars are more likely to have had minor body repairs done quickly and cheaply. We spend noticeably more time than usual checking each panel with a paint thickness gauge.
          points:
            - Measure paint thickness on every panel to find resprays after urban scrapes
            - 'Account for regional differences between north and south: coastal salt exposure versus typical inland wear'
            - If an LPG system is fitted, inspect the installation and tank condition
            - Check revisione test intervals and any gaps in the records
        pl:
          lead: Poland is the largest transit market for damaged cars from Western Europe. Our first priority is to establish what body repairs were carried out before the car went on sale.
          points:
            - Check body aperture alignment and welds for signs of repairs after a major accident
            - 'Trace the import history: where the car came from and in what condition'
            - Cross-check mileage against European service databases rather than trusting the odometer
            - Inspect airbags and check for evidence of previous deployment
      closing:
        eyebrow: Found a car?
        line1: Send us a link
        line2: to the listing,
        accentWord: we'll go and inspect it
        text: We can inspect it within one or two days. The photo report is yours to keep, even if you decide not to buy.
    cityVehicleSourcing:
      title: Car sourcing
      descriptionFor: Car sourcing {cityLocation} with a full inspection. We cover the whole region in {countryName}.
      casesHeadingFor: Real purchases in the {countryGenitiveOrName} market
      whyCityHeadingFor: Why {cityName}
      reason1: We search both dealer stock and private listings
      reason2: We check the VIN history before travelling to inspect the car
      reason3For: Our local expert {cityLocation}
      reason4Dekra: DEKRA / TÜV inspection on request
      reason4Generic: Independent mechanical inspection on request
      otherCitiesLabelFor: 'Other cities {countryLocation}:'
      cityNotesHeadingFor: The car market {cityLocation}
      cityNotesPointsLabel: What this means in practice
      cityNotes:
        berlin:
          lead: Berlin has Germany's widest selection of cars and its most diverse mix of sellers. You'll find everything from fleet cars with full service histories to cars brought in from Eastern Europe for resale.
          points:
            - Huge choice across all segments, including rare specifications
            - Plenty of private sellers, with more room to negotiate than at dealerships
            - City driving means more clutch and suspension wear than on motorway-driven cars
        munich:
          lead: 'An expensive city with expensive cars. There are more premium cars here than anywhere else in Germany, and their average condition is better: owners tend to look after them.'
          points:
            - Strong premium selection, especially BMW and Mercedes
            - Well-maintained cars with full dealer service histories
            - Prices are above the national average, but better condition can save you money later
        hamburg:
          lead: A port city and major logistics hub. Shipping a car onwards is straightforward, and recently imported cars are more common here than elsewhere.
          points:
            - The nearby port makes shipping easier and cheaper
            - Plenty of cars from northern Germany with motorway mileage
            - The damp maritime climate calls for closer checks of bodywork and hidden cavities
        dusseldorf:
          lead: A major hub in North Rhine-Westphalia, Germany's most populous state. Car lots are close together, and the Dutch and Belgian borders are an hour away, so cars from both countries regularly turn up for sale here.
          points:
            - We can inspect several cars in one trip, with car lots close together
            - 'Some cars have Dutch or Belgian plates: we check their histories and paperwork separately'
            - Strong competition between sellers means more willingness to negotiate
        belgrade:
          lead: Our home base. In Belgrade, we can inspect a car the day you contact us. We know the local sellers and can spot cars that have been moving between lots for months.
          points:
            - Same-day inspections, without waiting or travel arrangements
            - We know the local car lots and the histories of the cars on them
            - The car has already cleared customs, with no import process or duties to deal with
        novi-sad:
          lead: Serbia's second-largest city, an hour's drive from Belgrade. The market is smaller, but prices are usually lower than in the capital, and cars are less likely to have passed through several resellers.
          points:
            - Lower prices than Belgrade for cars in comparable condition
            - Fewer resellers and more first-owner cars
            - We travel from Belgrade at no extra charge
        pancevo:
          lead: Pancevo is effectively part of Greater Belgrade, so arranging an inspection here is no different from the capital. The market is small, but private listings can offer more interesting finds.
          points:
            - Twenty minutes from Belgrade, with the same quick response
            - A small market dominated by private sellers
            - Often cheaper than the capital for the same condition
        subotica:
          lead: 'Subotica sits on the Hungarian border, and its car market reflects that: plenty of EU imports and sellers who specialise in bringing them in.'
          points:
            - A border market with plenty of recent EU imports
            - We check each car's pre-import history especially carefully
            - A convenient location if you plan to drive the car further north
        madrid:
          lead: Spain's capital offers the country's widest selection, including plenty of ex-fleet cars. Its inland climate means less salt-related corrosion than on the coast.
          points:
            - Spain's largest selection, including ex-fleet cars
            - Away from the sea, bodywork is generally less corroded than on coastal cars
            - Hot summers mean extra checks on plastics, paintwork and air conditioning
        barcelona:
          lead: Proximity to the sea shapes everything here. Cars often look excellent underneath, but hidden cavities and electrical systems need close attention.
          points:
            - 'The sea is close, so we check hidden cavities: a clean underside can conceal corrosion inside'
            - Plenty of former rental and car-sharing vehicles
            - The nearby port makes sea shipping easier to arrange
        zurich:
          lead: Zurich is the region's most expensive car market. Buyers favour top specifications, use dealer servicing and sell their cars before wear starts to show.
          points:
            - Top specifications and low mileage
            - Dealer servicing, almost always with a full history
            - Switzerland is outside the EU, so separate import formalities apply
        geneva:
          lead: Geneva is in French-speaking Switzerland, right on the French border. French brands are noticeably more common here than in the German-speaking part of the country.
          points:
            - 'A mixed market: Swiss standards of care with a French choice of brands'
            - France is just across the border, making price comparisons easy
            - 'The same paperwork as elsewhere in Switzerland: export and import formalities'
        paris:
          lead: "France's widest selection comes with some of its toughest driving conditions: heavy traffic and tight parking leave their mark on bodywork and suspension."
          points:
            - France's widest selection, especially for French brands
            - City use means clutch and suspension wear, plus minor bodywork damage
            - Plenty of diesels, so the DPF and EGR system are our first checks
        lyon:
          lead: Lyon is an easier market than Paris, both on price and vehicle condition. With the motorway south nearby, cars with steady motorway mileage are more common.
          points:
            - Lower prices than Paris with a comparable selection
            - More motorway mileage and less city-driving wear
            - Convenient access to Italy and Spain if we widen the search
        milan:
          lead: "Italy's business capital, with a car market that reflects its wealth. Conditions in the north are closer to Germany's: roads are better, and cars tend to be better maintained than in the south."
          points:
            - Italy's best selection of premium cars
            - A northern location, with less salt exposure and corrosion than in the south
            - Dense city traffic makes paint-depth checks on every panel essential
        rome:
          lead: A large market where cars see heavy city use. Minor scrapes are considered part of life here, and repairs are often rushed.
          points:
            - Plenty of small cars and LPG-converted vehicles
            - Paint touch-ups from city scrapes are common, so we check every panel
            - A milder climate than Milan, but closer to the sea
        warsaw:
          lead: Warsaw is the main gateway for used cars imported from Western Europe and offers Poland's widest selection. It also has the highest share of accident-repaired cars.
          points:
            - Poland's widest selection, with plenty of recent EU imports
            - Our first priority is checking chassis alignment and signs of repairs
            - A shorter delivery route, costing less than transport from Southern Europe
        krakow:
          lead: 'Krakow is quieter than Warsaw: the market is smaller, fewer cars are bought to resell, and owners tend to keep their cars longer. Southern Poland also offers a shorter transport route to the Balkans.'
          points:
            - Fewer used-car traders than in Warsaw, with generally cleaner vehicle histories
            - Prices are often lower than in the capital
            - Closer to the southbound route, making delivery to Serbia easier
