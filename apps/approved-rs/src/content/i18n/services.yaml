  de:
    vehicle-sourcing:
      hub:
        metaTitle: Autoauswahl in Europa, schlüsselfertig
        metaDescription: 'Wir suchen Autos in Deutschland, Serbien, Spanien, der Schweiz, Italien, Frankreich, Polen und Portugal: Suche, Besichtigung, Verhandlung und Lieferung schlüsselfertig.'
        title: Autoauswahl
        titleHighlight: schlüsselfertig
        description: Wir wählen ein Fahrzeug in dem Land, in dem Sie sich befinden oder wo Sie planen, zu kaufen — vollständige Prüfung, Begleitung des Geschäfts und Lieferung schlüsselfertig. Wählen Sie ein Land, um Details zu sehen.
        breadcrumbLabel: Autoauswahl
        casesHeading: Echte Autoauswahl-Transaktionen
        chooseCountryLabel: 'Wählen Sie ein Land:'
        ctaLabel: Auto auswählen
        heroPhotoAlt: Reihe von Fahrzeugen auf dem Gelände eines Händlers
        processHeading: So funktioniert die Auswahl
        processLead: 'Von der Anfrage bis zu den Schlüsseln dauert es in der Regel drei Tage bis zwei Wochen. Am längsten suchen wir das Auto: Das erste passende nehmen wir nicht und schauen weiter, bis wir eines finden, bei dem nach der Prüfung keine Fragen offen sind.'
        processSteps:
          - n: '01'
            text: Wir besprechen das Budget, die Marke und die Anforderungen — was wichtig ist und worauf man verzichten kann
          - n: '02'
            text: Wir wählen vor Ort Optionen aus und filtern am Telefon alles, was nicht den Fragen standhält
          - n: '03'
            text: Wir fahren zur Besichtigung mit einem Lackdickenmessgerät und Scanner, für BMW verbinden wir uns mit dem Händler-ISTA, machen Fotos und Videos
          - n: '04'
            text: Wir senden den Bericht und sagen direkt, ob man zuschlagen oder weitersuchen sollte
          - n: '05'
            text: Wir verhandeln, gestalten den Vertrag und übergeben Ihnen das Auto oder bringen es zu Ihnen nach Hause
        includedHeading: Was in der Leistung enthalten ist
        includedLead: Die Provision wird vor dem Start festgelegt und ist unabhängig davon, wie viele Fahrzeuge wir besichtigen mussten. Wenn wir nach der Prüfung sagen, dass Sie nicht kaufen sollten — suchen wir weiter, dafür gibt es keine zusätzlichen Kosten.
        included:
          - title: Unbegrenzte Anzahl an Optionen
            text: Wir arbeiten, bis wir ein Auto finden, zu dem es keine Beanstandungen gibt. Der Verzicht auf eine schlechte Option ist Teil der Arbeit und kostet nichts zusätzlich.
          - title: Expertise bei jeder Besichtigung
            text: Lackdickenmessgerät an den Karosserieteilen, Scanner an den Steuergeräten, Hebebühne, wo nötig. Fotos und Videos von allen problematischen Stellen — Sie sehen das Gleiche wie wir.
          - title: Überprüfung der Historie und rechtlichen Sauberkeit
            text: CarVertical Bericht anhand der VIN, Händler-Servicehistorie nach Marke, Überprüfung des Kilometerstandes, Pfand, Registrierungseinschränkungen und offene Versicherungsfälle.
          - title: Verhandlung und Vertragsabschluss
            text: Wir verhandeln den Preis basierend auf den Ergebnissen, bereiten die Dokumente vor und begleiten die Unterzeichnung.
          - title: Lieferung und Zulassung
            text: Wir bringen das Auto in Ihre Stadt und helfen bei der Anmeldung vor Ort — entweder übergeben wir die Schlüssel dort, wo es Ihnen passt.
          - title: Eine Person für den gesamten Prozess
            text: Sie arbeiten mit demselben Spezialisten, der zur Besichtigung gefahren ist. Es ist nicht nötig, jedem, der ans Telefon geht, die Aufgabe erneut zu erklären.
        compareHeading: Was die Märkte unterscheidet
        compareLead: Das gleiche Modell in Deutschland und in Polen ist in seiner Geschichte und Preisgestaltung zwei verschiedene Fahrzeuge.
        compareHint: Wählen Sie ein Land — wir zeigen, was wir dort zuerst betrachten.
        compareLinkFor: Auswahl {location} — im Detail
      title: Schlüsselfertige Autoauswahl
      descriptionFor: Wir wählen ein Fahrzeug in {location} — aus denen, die bereits in diesem Land sind, ohne Einfuhr aus dem Ausland. Vollständige Prüfung, Begleitung des Geschäfts und Lieferung in Ihre Stadt.
      ctaLabel: Anfrage einreichen
      casesHeadingFor: 'Echte Transaktionen: Autoauswahl {location}'
      breadcrumbLabelFor: Auto {location}
      stepsFor:
        - n: '01'
          text: Sie reichen eine Anfrage mit Anforderungen ein — Budget, Marke, Kilometerstand
        - n: '02'
          text: Wir suchen Optionen in {location} nach Ihren Kriterien
        - n: '03'
          text: Ein unabhängiger Experte inspiziert und überprüft das Fahrzeug
        - n: '04'
          text: Wir begleiten die Transaktion, helfen mit den Dokumenten und der Zulassung
        - n: '05'
          text: Wir liefern das Fahrzeug in Ihre Stadt und helfen bei der Zulassung
      deliveryLineFor: Wir liefern das Auto in jede Stadt des Landes. Wenn es ins Ausland ausgeführt werden muss, übernehmen wir den Export und die Zollabwicklung — wir fahren nach {destinations} und in jedes andere Land.
      deliveryDestinations:
        - Bosnien und Herzegowina
        - Kroatien
        - Nordmazedonien
        - Türkei
        - Kasachstan
        - Kirgisistan
      citiesHeadingFor: Wo wir Fahrzeuge in {countryLocation} prüfen
      citiesLead: Der Experte fährt im ganzen Land, aber meistens prüfen wir Fahrzeuge dort, wo sie am häufigsten angeboten werden. Das bedeutet Folgendes für jede Stadt.
      alsoInLabel: 'Wir wählen auch in:'
      crossSellLabel: Brauchen Sie kein lokales Auto?
      countryNotesHeadingFor: Was wir in {location} berücksichtigen
      countryNotesPointsLabel: Worauf wir zuerst achten
      countryNotes:
        de:
          lead: 'Die Auswahl hier ist größer als auf jedem anderen Markt in Europa, und die Servicehistorie ist normalerweise nachvollziehbar: Die meisten Fahrzeuge haben ein Serviceheft mit Einträgen des Händlers zu jedem Service. Die Kehrseite sind die Autobahnkilometer. Zweihunderttausend in drei Jahren sind hier die Norm und kein Grund für einen Preisnachlass.'
          points:
            - Serviceheft und Einträge des Händlers — wir überprüfen anhand der VIN bei einem autorisierten Service
            - Das HU-Protokoll, das alle TÜV nennen — wir lesen die Bemerkungen des letzten Prüfungsberichts, nicht nur den Stempel
            - 'Fahrzeuge aus Leasing und Unternehmensflotten: gut gewartet, aber hohe Kilometerstände'
            - Winterstraßen mit Chemikalien — wir prüfen Unterboden und Schweller separat
        rs:
          lead: Hier sind wir vor Ort, deshalb besichtigen wir das Fahrzeug am Tag der Anfrage und ohne Einfuhr. Der Markt ist klein, dasselbe Fahrzeug kann durch mehrere Verkäufer gegangen sein, und die Historie muss entwirrt werden.
          points:
            - Das Fahrzeug ist bereits verzollt und hat lokale Kennzeichen — Zollgebühren und Einfuhrformalitäten sind nicht erforderlich
            - Der Kilometerstand wird oft bei der Weiterveräußung im Inland nachjustiert — wir überprüfen ihn anhand der Einträge des technischen Prüfberichts
            - Viele Fahrzeuge, die aus Deutschland und Italien importiert wurden — wir prüfen die Vorgeschichte des Fahrzeugs vor der Einfuhr
            - Prüfung am Tag der Anfrage, ohne Wartezeit auf die Logistik
        es:
          lead: Milde Winter und kaum Chemikalien auf den Straßen, sodass der Unterboden spanischer Fahrzeuge in der Regel deutlich besser ist als der deutscher. Aber Sonne und Nähe zum Meer schädigen Lack, Kunststoffe und Gummi.
          points:
            - An der Küste — wir suchen Korrosion zunächst in versteckten Hohlräumen
            - Ausgebleichter Lack und rissiger Kunststoff im Innenraum — kalkulieren wir in die Kosten ein
            - 'Viele ehemalige Mietfahrzeuge: gleichmäßiger Kilometerstand, aber harte Nutzung'
            - ITV-Protokoll – wir prüfen Anmerkungen und Termine
        ch:
          lead: 'Schweizer Fahrzeuge sind deutlich besser gewartet als der europäische Durchschnitt: teure Wartung sorgt für Disziplin, die Kilometerstände sind niedrig. Aber die Schweiz gehört nicht zur EU, daher erfolgt die Einfuhr anders, was wir frühzeitig im Budget einplanen.'
          points:
            - Gut ausgestattete Modelle – hier werden sie öfter genommen als bei den Nachbarn
            - MFK – die Prüfung ist streng, die Vorbereitung ernsthaft und das sieht man dem Fahrzeug an
            - 'Nicht EU: Zoll und Dokumente werden anders behandelt als in den EU-Ländern'
            - Die Preise liegen über dem Markt, dafür sparen Sie später bei Reparaturen
        pt:
          lead: Der Markt ist klein, die Auswahl bescheidener als in Spanien, aber die Konkurrenz um gute Fahrzeuge ist geringer. Das Klima ist feucht und salzig – maritime Korrosion tritt selbst bei neuwertigen Autos auf.
          points:
            - Feuchtigkeit und Meer – versteckte Hohlräume und Elektrik haben beim Prüfen Priorität
            - 'Kleiner Markt: wir suchen länger nach spezifischen Anfragen als in Deutschland'
            - IPO-Protokoll – wir lesen die Anmerkungen früherer Prüfungen
            - Viele Diesel und Kleinwagen, große Modelle sind selten
        fr:
          lead: Frankreich ist vor allem Diesel und lokale Marken. Peugeot, Renault und Citroën sind hier günstiger als irgendwo in Europa. Deutsche Premium-Fahrzeuge sind dagegen teurer und hier macht es wenig Sinn, sie zu kaufen.
          points:
            - Französische Marken – der beste Preis in Europa, und der Service ist günstiger
            - Diesel – Rußfilter und EGR-Ventil prüfen wir gesondert
            - Contrôle technique – die Protokolle sind detailliert, Anmerkungen nach Jahren prüfen wir
            - 'Städtischer Einsatz: Reifen und Federung verschleißen schneller als angegeben'
        it:
          lead: 'Der italienische Markt bietet viele Kleinwagen und seltene Ausstattungen, erfordert jedoch Vorsicht: die Fahrzeuge hier werden intensiv genutzt und kleine Karosseriearbeiten oft nicht sorgsam durchgeführt.'
          points:
            - Stadteinsatz – häufig kleine Dellen und Nachlackierungen, ein Lackmessgerät ist Pflicht
            - Süden und Küste bringen Salz und Korrosion, der Norden ist closer zu deutschen Bedingungen
            - Revisione – wir prüfen die Regelmäßigkeit, Auslassungen kommen häufiger vor
            - Viele Fahrzeuge mit Gasanlagen – wir prüfen sie gesondert
        pl:
          lead: 'Der größte Markt in unserer Nähe: Logistik ist günstig und schnell. Aber Polen war über viele Jahre der Hauptumschlagplatz für beschädigte Fahrzeuge aus Westeuropa, daher prüfen wir hier die Geschichte strenger als irgendwo sonst.'
          points:
            - Hoher Anteil an nach Unfällen wiederhergestellten Fahrzeugen – die Geometrie der Karosserie hat Priorität
            - 'Häufige Weiterverkäufe: ein Fahrzeug wechselt innerhalb eines Jahres mehrere Besitzer'
            - Die Kilometerstände werden oft bei der Einfuhr manipuliert – wir prüfen sie bei den Servicedaten
            - Kurze Transportstrecke – günstiger und schneller als aus Spanien oder Portugal
      closing:
        eyebrow: Womit fangen wir an?
        line1: Beschreiben Sie das Fahrzeug,
        line2: das Sie suchen, –
        accentWord: weiterer Schritt ist unser Job
        text: Budget, Karosserie, Getriebe, ein paar Wünsche zur Ergänzung. Wir suchen, während Sie die Berichte einsehen und entscheiden, welches Fahrzeug Sie persönlich betrachten möchten.
