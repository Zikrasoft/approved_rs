            - El certificado EUR1 confirma la procedencia y reduce el arancel
            - 'Normas de emisiones unificadas: un coche de cualquier país de la UE pasa la inspección técnica de la misma manera'
            - Cuanto más corto sea el trayecto, más rentable será la conducción en lugar del transporte en carro
