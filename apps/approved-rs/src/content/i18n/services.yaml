      hub:
        metaTitle: Compra de autos con matrículas rusas en Europa
        metaDescription: Compramos autos con matrículas rusas en cualquier país de Europa y autos con matrículas serbias en Serbia. Valoración por fotos en una hora, pago el día de la firma.
        title: Compra de autos
        titleHighlight: sin regateo por semanas
        description: 'Recogemos coches que son difíciles de vender de manera convencional: matrículas rusas, importación caducada, documentos en disputa. El precio es inferior al del mercado — esto es el costo por la rapidez y por asumir todas las molestias de la venta.'
        breadcrumbLabel: Compra de autos
        casesHeading: Casos de compra
        chooseCountryLabel: 'Elige un país:'
        ctaLabel: Obtener valoración
        heroPhotoAlt: Llaves de coche sobre dinero y documentos
        processHeading: Cómo se lleva a cabo la compra
        processLead: Desde el primer mensaje hasta el pago suelen pasar de dos a tres días, y casi todo este tiempo se utiliza el camino hacia el lugar de encuentro. Damos la valoración por foto en una hora.
        processSteps:
          - n: '01'
            text: Envíanos fotos, documentos y una descripción honesta del estado
          - n: '02'
            text: Te damos un precio en una hora — final y sin rango
          - n: '03'
            text: Concertamos un encuentro donde está el coche; si no arranca, llegamos con un remolque
          - n: '04'
            text: Inspeccionamos en persona y confirmamos el precio, si la descripción coincide
          - n: '05'
            text: Firmamos el contrato, el dinero se transfiere el día de la firma
        includedHeading: Qué asumimos
        includedLead: Por la diferencia entre nuestro precio y el del mercado, nos quedamos con todo lo que hace que un coche así no se venda durante meses.
        included:
          - title: Coches con matrículas rusas
            text: Categoría principal. El coche puede estar en cualquier país de Europa — iremos donde se encuentra, y nosotros nos ocupamos de la salida y la posterior reventa.
          - title: Problemas con la importación y plazos
            text: Una vez firmado, los riesgos relacionados con la importación temporal caducada pasan a ser nuestros.
          - title: Valoración sin inspección
            text: Damos un precio basándonos en fotos y documentos. Solo llegamos cuando ambas partes ya han acordado la suma.
          - title: Formalización de la transacción
            text: Nosotros nos encargamos del contrato, la baja de matrícula y toda la documentación. Solo necesitas proporcionar los documentos del coche y tu firma.
          - title: Pago el día de la firma
            text: Transferimos el dinero el mismo día. No manejamos esquemas de pagos a plazos o 'pagamos después de la reventa'.
          - title: Rechazo honesto
            text: Si el coche no nos conviene, lo diremos de inmediato y explicaremos la razón. No vamos a alargar el proceso ni bajar el precio durante el mismo.
