translations:
  en:
    vehicle-sourcing:
      hub:
        metaTitle: Turnkey Car Sourcing in Europe
        metaDescription: We source cars in Germany, Serbia, Spain, Switzerland, Italy, France, Poland and Portugal. Search, inspection, negotiation and delivery, all handled for you.
        title: Car sourcing
        titleHighlight: made easy
        description: We find cars in the country where you live or plan to buy. Full inspection, support throughout the deal and delivery, all handled for you. Choose a country to learn more.
        breadcrumbLabel: Car sourcing
        casesHeading: Real car-sourcing deals
        chooseCountryLabel: 'Choose a country:'
        ctaLabel: Find a car
        heroPhotoAlt: Cars lined up at a dealership
        processHeading: How car sourcing works
        processLead: "From your inquiry to the keys, it usually takes three days to two weeks. The search takes the longest: we don't settle for the first suitable car. We keep looking until we find one that checks out."
        processSteps:
          - n: '01'
            text: We discuss your budget, preferred make and requirements, including your must-haves and trade-offs
          - n: '02'
            text: We shortlist local cars and screen them by phone, ruling out anything that doesn't stand up to our questions
          - n: '03'
            text: We inspect in person with a paint thickness gauge and diagnostic scanner. For BMW, we use dealer-level ISTA. We take photos and videos
          - n: '04'
            text: 'We send you a report and give you an honest recommendation: buy it or keep looking'
          - n: '05'
            text: We negotiate, handle the paperwork and hand over the car or deliver it to your door
        includedHeading: What's included
        includedLead: Our fee is fixed before we start and doesn't depend on how many cars we inspect. If our inspection shows a car isn't worth buying, we'll keep looking at no extra charge.
        included:
          - title: Unlimited options searched
            text: We keep working until we find a car that passes our checks. Rejecting a bad option is part of the service, at no extra cost.
          - title: An expert attends every inspection
            text: We check panels with a paint thickness gauge, scan control modules and use a vehicle lift when needed. Photos and videos show every problem area, so you see what we see.
          - title: History and legal checks
            text: CarVertical VIN report, dealer service records, mileage verification, liens, registration restrictions and unresolved insurance claims.
          - title: Negotiation and paperwork
            text: We negotiate the price based on our findings, prepare the paperwork and guide you through signing.
          - title: Delivery and registration
            text: We deliver the car to your city and help with local registration, or hand over the keys wherever is convenient for you.
          - title: One point of contact throughout
            text: You'll work with the same specialist who inspected the car. No need to explain your requirements all over again to someone new.
        compareHeading: How car markets differ
        compareLead: The same model in Germany and Poland can be two very different cars when it comes to history and price.
        compareHint: Choose a country to see what we check first there.
        compareLinkFor: 'Car sourcing in {location}: details'
      title: Turnkey car sourcing
      descriptionFor: We find a car {location} from local stock, with no overseas import. Full inspection, support throughout the deal and delivery to your city.
      ctaLabel: Request a quote
      casesHeadingFor: 'Real deals: car sourcing {location}'
      breadcrumbLabelFor: Cars {location}
      stepsFor:
        - n: '01'
          text: Tell us what you're looking for, including budget, make and mileage
        - n: '02'
          text: We search for cars {location} that match your criteria
        - n: '03'
          text: An independent expert inspects and checks the car
        - n: '04'
          text: We guide you through the deal, paperwork and registration
        - n: '05'
          text: We deliver the car to your city and help you register it
      deliveryLineFor: We deliver cars anywhere in the country. If you need to export one, we handle export and customs clearance and deliver to {destinations} and any other country.
      deliveryDestinations:
        - Bosnia and Herzegovina
        - Croatia
        - North Macedonia
        - Turkey
        - Kazakhstan
        - Kyrgyzstan
      citiesHeadingFor: Where we inspect cars {countryLocation}
      citiesLead: Our experts travel throughout the country, but most inspections happen where the largest number of cars are listed. Here's what that means in each city.
      alsoInLabel: 'We also source cars in:'
      crossSellLabel: Looking for a car from another country?
      countryNotesHeadingFor: What we look for {location}
      countryNotesPointsLabel: What we check first
      countryNotes:
        de:
          lead: 'The selection here is larger than anywhere else in Europe, and service history is usually traceable: most cars have a service book with dealer stamps for every service. The trade-off is motorway mileage. 200,000 km in three years is normal here, not a reason for a discount.'
          points:
            - Service book and dealer stamps, verified by VIN with an authorized service center
            - HU inspection report, commonly called TÜV. We read the previous inspection notes, not just the stamp
            - 'Lease and company cars: regularly serviced, but often with high mileage'
            - Winter roads are treated with de-icing salt, so we check the underbody and sills separately
        rs:
          lead: We're based here, so we can inspect a car the same day you contact us, with no import involved. It's a small market, and the same car can pass through several dealers, so tracing its history takes work.
          points:
            - The car is already customs-cleared and has local plates, so no import duties or paperwork are needed
            - Mileage is often altered when cars are resold locally, so we compare it with technical inspection records
            - Many cars are imported from Germany and Italy, so we check their history before import
            - Inspection the same day you contact us, with no logistics-related wait
        es:
          lead: Mild winters and almost no road salt mean Spanish cars usually have much better underbodies than German ones. But sun and proximity to the sea take a toll on paint, plastic and rubber parts.
          points:
            - Coastal location means we look for corrosion first in hidden cavities
            - We factor faded clear coat and cracked interior plastic into the price
            - 'Many ex-rental cars: reasonable mileage, but hard use'
            - 'ITV inspection report: we check the notes and dates'
        ch:
          lead: 'Swiss cars are better maintained than the European average: high servicing costs encourage careful ownership, and mileage is low. Switzerland is not in the EU, however, so importing involves different procedures. We factor that into the budget upfront.'
          points:
            - 'Richly equipped: buyers chose higher trims more often here than in neighboring countries'
            - 'MFK inspection: strict standards mean cars are prepared thoroughly, and it shows'
            - 'Outside the EU: customs and paperwork differ from imports from EU countries'
            - Prices are above market, but you save on repairs later
        pt:
          lead: The market is small, with less choice than Spain, but there is also less competition for good cars. The damp, salty climate means coastal corrosion can affect even newer cars.
          points:
            - Humidity and sea air make hidden cavities and electrical systems a priority during inspection
            - 'Small market: finding a car to match a specific request takes longer than in Germany'
            - 'IPO inspection reports: we review notes from previous inspections'
            - Plenty of diesels and small cars; larger body styles are rare
        fr:
          lead: France is all about diesels and domestic makes. Peugeot, Renault and Citroen cost less here than anywhere else in Europe. German premium cars, on the other hand, are more expensive, so France is rarely the right place to buy one.
          points:
            - French makes offer Europe's best prices, with lower servicing costs too
            - We check diesels, the DPF and EGR valve separately
            - Controle technique reports are detailed; we compare notes across inspection years
            - City driving wears the clutch and suspension faster than claimed
        it:
          lead: 'Italy is a good market for small cars and rare trim levels, but calls for caution: cars are driven hard, and minor body repairs are not always done carefully.'
          points:
            - City use means frequent minor impacts and touch-ups; a paint depth gauge is essential
            - Salt and corrosion are common in the south and along the coast; the north is closer to German conditions
            - 'Revisione inspections: we check for regularity, as gaps are more common than usual'
            - Many cars have LPG systems, which we inspect separately
        pl:
          lead: The closest major market to us, with short, low-cost delivery. But Poland has long been a key transit point for accident-damaged cars from Western Europe, so we check vehicle history more thoroughly here than anywhere else.
          points:
            - Many cars have been repaired after accidents, so body geometry is a priority
            - 'Frequent resales: a car can change hands several times in a year'
            - Mileage is often altered during import; we cross-check service records
            - Short delivery distance, cheaper and faster than from Spain or Portugal
      closing:
        eyebrow: Where do we start?
        line1: Tell us about the car
        line2: you're looking for,
        accentWord: we'll take it from here
        text: Your budget, body style, transmission and a couple of preferences. We find the cars; you review the reports and decide which ones to inspect in person.
