          lead: 'Se importan autos de España por su estado: clima suave y pocas sustancias químicas. En desventaja está la longitud de la ruta: el doble que la alemana, lo que se refleja en el presupuesto.'
          points:
            - La ruta es más larga que la alemana, el transporte suele ser más rentable que la conducción
            - La baja tarda más que en Alemania
            - El certificado EUR1 lo gestionamos con el vendedor antes de la compra, luego es más complicado
            - Los autos de la costa son revisados para detectar corrosión oculta antes del envío
