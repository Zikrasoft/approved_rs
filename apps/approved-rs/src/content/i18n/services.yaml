          - title: Customs Clearance
            text: Declaration, broker, and payment upon arrival. We prepare the package in advance to prevent the car from sitting in storage for extra days.
          - title: Registration
            text: Technical inspection, registration, and number plates. You pick up a car that's ready to drive.
