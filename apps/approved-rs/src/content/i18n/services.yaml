      step1: You send photos and a description of the car
      step2: We assess online via photos within 1 hour, below market value
      step3Serbia: We meet for inspection. Russian plates (in any European country) or Serbian plates (Serbia, Montenegro)
      step3Other: We meet for inspection. Russian plates; the car can be in any European country
      step4: We finalize the deal, money on the day of signing
      closing:
        eyebrow: Want an estimate?
        line1: Send photos
        line2: and documents,
        accentWord: the price will be within an hour
        text: The estimate is free and without obligation. If the price doesn't suit you, we part ways amicably without follow-up calls.
    vehicle-import:
      hub:
        metaTitle: Import cars from Europe and China, all-inclusive
        metaDescription: We bring cars from Germany, Spain, Switzerland, and China to any country. Sourcing, inspection, delivery, and customs clearance done for you.
