    vehicle-inspection:
      title: Inspección de vehículos
      description: Inspección independiente del vehículo antes de la compra. Visita de un experto, diagnóstico, informe — sin ninguna obligación de compra.
      ctaLabel: Solicitar inspección
      casesHeading: Casos de inspección
      breadcrumbLabel: Inspección de vehículos
      steps:
        - n: '01'
          text: Carrocería y pintura — presencia de reparación o accidentes
        - n: '02'
          text: Suspensión, frenos y tren de aterrizaje
        - n: '03'
          text: Motor, caja de cambios y transmisión
        - n: '04'
          text: Electrónica e historial de mantenimiento según el VIN
        - n: '05'
          text: Legalidad — gravámenes, prohibiciones de registro, accidentes
      extraLine: Operamos en otros países de Europa, incluyendo Portugal — consúltenos al solicitar.
      hub:
        metaTitle: Inspección de vehículos antes de la compra en Europa
        metaDescription: 'Nos acercamos al coche que usted encontró: medidor de espesor, escáner, verificación del historial según el VIN y un informe con fotos el mismo día. Trabajamos en ocho países de Europa.'
        title: Inspección de vehículos
        titleHighlight: antes de la compra
        description: 'Visitamos el coche que usted encontró y le decimos qué sucede realmente con él. El informe llega antes de que entregue el dinero: si el resultado es ‘no lo compre’, solo pierde el costo de la inspección.'
        breadcrumbLabel: Inspección de vehículos
        casesHeading: Casos de inspección
        chooseCountryLabel: 'Seleccione el país:'
        ctaLabel: Solicitar inspección
        heroPhotoAlt: Vehículo en un elevador en el servicio
        processHeading: Cómo se realiza la inspección
        processLead: Generalmente visitamos dentro de uno o dos días después de su solicitud. La inspección toma una hora y media a dos, y enviamos el informe el mismo día, antes de que el coche sea vendido a otro comprador.
        processSteps:
          - n: '01'
            text: Envía el enlace al anuncio y los contactos del vendedor
          - n: '02'
            text: Concertamos con el vendedor el tiempo y lugar de la inspección
          - n: '03'
            text: Visitamos con un medidor de espesor y escáner, para BMW conectamos el ISTA del concesionario, si es necesario, al elevador
          - n: '04'
            text: Tomamos fotos y videos de todos los hallazgos, verificamos el historial según el VIN
          - n: '05'
            text: Enviamos el informe y respuesta directa — comprar, negociar o rechazar
        includedHeading: Qué incluye la inspección
        includedLead: 'Más de cien puntos en la lista de verificación, pero casi siempre se enfocan en cuatro áreas: carrocería, motor con la transmisión, tren de aterrizaje y documentos. Por estas áreas, con frecuencia desaconsejamos la compra.'
        included:
          - title: Carrocería y pintura
            text: Medición de espesor en cada panel, geometría de los accesos, señales de soldadura y masilla. Se puede ver si hubo una reparación que el vendedor no mencionó.
          - title: Motor y caja de cambios
            text: Parámetros en motor caliente, adaptaciones de la caja, errores en la memoria de los bloques. Es la zona más costosa y la razón más común para rechazar.
          - title: Suspensión y frenos
            text: Holguras, estado de la suspensión y el sistema de frenos. El kilometraje en las autopistas y las carreteras balcánicas desgastan el coche de manera diferente, y eso es evidente.
          - title: Electrónica e historial según el VIN
            text: Informe de CarVertical, historial de servicios del concesionario según la marca, discrepancias de kilometraje con el historial, errores de los bloques y signos de bolsas de aire desplegadas.
          - title: Legalidad
            text: Gravámenes, prohibiciones de registro, accidentes no resueltos y eventos de seguro — todo lo que sale a la luz después de la compra.
          - title: Informe con fotos y videos
            text: Cada hallazgo se graba y se etiqueta. El informe queda en su poder — es útil para negociar, incluso si finalmente decide comprar el coche.
        compareHeading: Qué cambia de país a país
        compareLead: Reglamento de inspección técnica, problemas típicos de los coches locales y formas de ocultar el historial son distintos en cada lugar.
        compareHint: Seleccione el país — le mostraremos lo que añadimos a la lista de verificación habitual.
        compareLinkFor: Inspección {location} — detallado
        mapHeading: Cuatro áreas que deciden el trato
        mapLead: La lista de verificación es larga, pero casi siempre desaconsejamos la compra en una de las cuatro áreas. Haga clic en el número en el esquema — le mostraremos lo que el experto revisa y qué hemos encontrado allí.
      countryNotesHeadingFor: Cómo revisamos {location}
      countryNotesPointsLabel: Qué verificamos además de la lista de verificación habitual
      countryNotes:
        de:
          lead: 'En Alemania hay mucho en lo que basarse: libro de mantenimiento, protocolos de HU y bases de datos VIN desarrolladas. Por lo tanto, la inspección aquí es, ante todo, una comparación de documentos con lo que muestra el coche.'
          points:
            - Comparamos las marcas de mantenimiento del concesionario con las lecturas del odómetro por años
            - Observaciones del HU anterior — qué se reparó después de la inspección y qué simplemente se retrasó
            - Suelo y umbrales después de los reactivos invernales, incluyendo cavidades ocultas
            - 'Pasado de leasing: mantenimiento uniforme con alto kilometraje'
        rs:
          lead: 'En Serbia visitamos el mismo día en que se contactan. La principal tarea es recuperar la historia del coche antes de su importación: los documentos locales solo muestran el último segmento de la vida del automóvil.'
          points:
            - País de origen y estado del coche antes de ser importado a Serbia
            - Lecturas del odómetro frente a las marcas del techado técnico de años anteriores
            - Reparación de la carrocería después de la importación — se hace más a menudo y más barato que en la UE
            - 'Parte legal: gravámenes y restricciones en el registro'
        es:
          lead: Los coches españoles suelen tener buenos bajos y decepcionar en todo lo que sufre por el sol y la sal. Cambiamos el foco de la corrosión inferior a cavidades ocultas, electricidad y estado del interior.
          points:
            - Corrosión en cavidades ocultas cerca de la costa — por debajo puede estar limpio
            - Pintura, sellos y plásticos después de muchos años de sol
            - 'Pasado de alquiler: comparamos el kilometraje con el desgaste característico del interior'
            - Protocolo ITV y lo que quedó sin resolver entre las inspecciones
        ch:
          lead: Los coches se preparan seriamente para el MFK, por lo que un protocolo reciente no dice mucho. Vemos qué se hizo justo antes de la inspección y qué sigue su propio curso desde el año pasado.
          points:
            - Qué se reemplazó justo antes del MFK — piezas nuevas frente a las demás
            - El mantenimiento es caro, por lo que verificamos si no se han postergado los mantenimientos
            - La dotación es rica, pero verificamos que cada opción sigue funcionando
            - 'Documentos para la importación: Suiza no es la UE, el conjunto es diferente'
        pt:
          lead: 'Todo aquí se reduce al clima marítimo húmedo. Comenzamos la inspección con corrosión y electrónica: generalmente falla lo que vive en la humedad.'
          points:
            - Cavidades ocultas, largueros y puntos de sujeción de la suspensión
            - Oxidación de conectores y bloques — razón típica de errores intermitentes
            - Protocolo IPO y regularidad de las inspecciones
            - 'Diéseles con uso urbano: filtro de partículas y su historial'
        fr:
          lead: 'En Francia, un detallado contrôle technique es un buen punto de partida. Luego, verificamos lo que el reglamento no capta: la vida útil del grupo diésel y el desgaste por tráfico urbano.'
          points:
            - Observaciones del contrôle technique por años — lo que se repite de una inspección a otra
            - Filtro de partículas, EGR y turbocompresor en diéseles
            - Embrague y suspensión después de un ciclo urbano intenso
            - 'Historia de marcas francesas: piezas disponibles, pero con puntos débiles'
        it:
          lead: Los coches italianos suelen llegar con pequeñas reparaciones de carrocería, realizadas rápida y económicamente. Aquí, la medición de espesor en los paneles lleva mucho más tiempo de lo habitual.
          points:
            - Medidor de espesor en todos los paneles — retoques tras raspaduras urbanas
            - 'Diferencia entre el norte y el sur: sal en la costa, desgaste habitual en el interior del país'
            - Equipo de gas, si está instalado — estado y calidad del cilindro
            - Regularidad de revisione y períodos omitidos
        pl:
          lead: Polonia es el mayor mercado de transbordo para coches dañados de Europa occidental. Por ello, primero averiguamos qué se ha hecho con esta carrocería antes de la venta.
          points:
            - Geometría de los accesos y señales de soldadura — restauraciones tras accidentes graves
            - 'Historia de importación: de dónde vino el coche y en qué estado'
            - Kilometraje comparado con bases de datos de servicio europeas, no confiamos en el odómetro
            - Bolsas de aire y su activación en el pasado
      closing:
        eyebrow: ¿Encontró un coche?
        line1: Envíenos el enlace
        line2: al anuncio —
        accentWord: iremos a verlo
        text: Visitamos en uno o dos días. El informe con fotos queda con usted, incluso si después decide no comprar.
    cityVehicleSourcing:
      title: Selección de vehículos
      descriptionFor: Encontramos un coche en {cityLocation} con una revisión completa. Trabajamos en toda la región de {countryName}.
      casesHeadingFor: Casos de {countryGenitiveOrName}
      whyCityHeadingFor: Por qué {cityName}
      reason1: Buscamos en concesionarios y anuncios privados
      reason2: Verificamos el historial por VIN antes de salir a la inspección
      reason3For: Nuestro experto en {cityLocation}
      reason4Dekra: Inspección DEKRA / TÜV a solicitud
      reason4Generic: Experticia técnica independiente a solicitud
      otherCitiesLabelFor: 'Otras ciudades en {countryLocation}:'
      cityNotesHeadingFor: Mercado automotriz en {cityLocation}
      cityNotesPointsLabel: ¿Qué significa esto en la práctica?
      cityNotes:
        berlin:
          lead: 'Berlín tiene la mayor selección en Alemania y la variedad más colorida de vendedores. Aquí encuentras de todo: desde coches de flotas corporativas con historial completo hasta opciones de reventa, provenientes de Europa del Este.'
          points:
            - Amplia selección en cualquier segmento, incluyendo configuraciones raras
            - Muchos vendedores privados — la negociación es más real que con concesionarios
            - 'Ciclo urbano: el desgaste del embrague y la suspensión es más evidente que con coches de autopista'
        munich:
          lead: 'Una ciudad cara con coches caros. Aquí hay más vehículos de lujo que en cualquier otro lugar de Alemania, y su estado suele ser más alto: se cuida bien de ellos.'
          points:
            - Fuerte segmento premium, especialmente BMW y Mercedes
            - Coches bien mantenidos con historial completo de concesionario
            - Precios más altos que el promedio nacional — el ahorro se logra a través del estado
        hamburg:
          lead: Ciudad portuaria y gran centro logístico. Desde aquí es fácil enviar el coche más lejos, y en el mercado abundan los coches importados recientes.
          points:
            - Puerto cercano — más fácil y barato organizar el envío
            - Muchos coches de tierras del norte con kilometrajes de carretera
            - 'Clima marino húmedo: revisamos el chasis y los huecos ocultos con más atención'
        belgrade:
          lead: Nuestra base. En Belgrado realizamos inspecciones el mismo día de la consulta, conocemos a los vendedores locales y vemos qué coches han estado circulando por las plataformas durante dos meses.
          points:
            - Inspección el mismo día de la consulta, sin esperas ni logística
            - Conocemos las plataformas locales y la historia de los coches que allí están
            - El coche ya está despachado — no se requieren impuestos ni aranceles
        novi-sad:
          lead: La segunda ciudad más grande de Serbia, a una hora en coche de Belgrado. El mercado es más pequeño, pero los precios suelen ser más tranquilos que en la capital, y los coches pasan con menos frecuencia por reventas.
          points:
            - Precios más bajos que en Belgrado con un estado comparable
            - Menos revendedores, más coches de primer propietario
            - Salimos desde Belgrado, sin costo adicional por el viaje
        pancevo:
          lead: Pancevo está efectivamente dentro de la aglomeración de Belgrado, por lo que las inspecciones aquí no difieren de las de la capital. El mercado es pequeño, pero los anuncios privados suelen ser más interesantes.
          points:
            - Veinte minutos de Belgrado — salimos igual de rápido
            - Mercado pequeño con predominancia de vendedores privados
            - A menudo más baratos que en la capital con el mismo estado
        subotica:
          lead: 'Subotica está en la frontera con Hungría, y esto se refleja en el mercado: muchos coches traídos de la UE, y vendedores que se dedican a ello de forma constante.'
          points:
            - Mercado fronterizo — muchos importaciones frescas de la Unión Europea
            - Verificamos especialmente la historia previa a la importación
            - Punto conveniente si planeas llevar el coche más al norte
        madrid:
          lead: 'El mercado capitalino de España: la mayor selección en el país y muchos coches de flotas corporativas. Clima continental, así que hay menos corrosión costera que en la costa.'
          points:
            - La mayor selección en España, incluyendo vehículos corporativos
            - Lejos del mar — las carrocerías suelen estar más limpias que las costeras
            - 'Verano caluroso: revisamos plásticos, pintura y aire acondicionado por separado'
        barcelona:
          lead: Todo depende de la proximidad al mar. Los coches a menudo lucen bien por debajo, pero requieren atención a los espacios ocultos y la parte eléctrica.
          points:
            - 'El mar está cerca, así que revisamos los espacios ocultos: a menudo están limpios por debajo, pero no por dentro'
            - Muchos coches de alquiler y carsharing de segunda mano
            - Puerto cercano, el envío por mar se organiza más fácilmente
        zurich:
          lead: Zúrich es el mercado automotriz más caro de la región. Aquí se eligen las configuraciones máximas, se mantienen en concesionarios, y se venden antes de que el coche se desgaste.
          points:
            - Configuraciones máximas y kilometrajes bajos
            - Mantenimiento de concesionario — el historial casi siempre está completo
            - Suiza no está en la UE, los trámites de importación son diferentes
        geneva:
          lead: Ginebra está en la parte francófona de Suiza, justo en la frontera con Francia. Hay significativamente más marcas francesas en el mercado que en la parte alemana del país.
          points:
            - 'Mercado mixto: estado suizo, variedad francesa'
            - La frontera con Francia está cerca — hay con qué comparar precios
            - 'Los procedimientos son los mismos que en toda Suiza: exportación más importación'
        paris:
          lead: 'La mayor selección en Francia viene acompañada de un uso muy duro: el tráfico denso y los estacionamientos reducidos dejan huellas en las carrocerías y suspensiones.'
          points:
            - La mayor selección en Francia, especialmente de marcas francesas
            - 'Ciclo urbano: embrague, suspensión y daños menores en la carrocería'
            - Muchos diésel — verificamos primero el filtro de partículas y el EGR
        lyon:
          lead: Lyon es más tranquilo que París tanto en precios como en el estado de los coches. La carretera hacia el sur está cerca, así que a menudo hay coches con kilometrajes suaves.
          points:
            - Precios más bajos que en París con una selección comparable
            - Más kilometrajes de carretera, menos desgaste urbano
            - Ruta conveniente hacia Italia y España, si buscamos más ampliamente
        milan:
          lead: 'La capital financiera de Italia, y esto se refleja en el mercado. El norte del país está más cerca de las condiciones alemanas: las carreteras son mejores, los coches son más cuidados que los del sur.'
          points:
            - La mejor selección en el segmento premium en Italia
            - El norte — menos sal y corrosión que en el sur del país
            - 'Ciudad densa: un medidor de grosor de paneles es obligatorio'
        rome:
          lead: Un gran mercado con un uso urbano muy intenso. Los pequeños rasguños aquí se consideran parte de la vida y a menudo se reparan de forma acelerada.
          points:
            - Muchos coches pequeños y vehículos con gas
            - Frecuentes retoques después de contactos urbanos — revisamos cada panel
            - Al sur de Milán — el clima es más suave, pero más cerca del mar
        warsaw:
          lead: A través de Varsovia entra el principal flujo de importación desde Europa Occidental, y aquí también está la mayor selección en Polonia. La proporción de coches restaurados también es la más alta.
          points:
            - La mayor selección en Polonia, muchos importaciones recientes de la UE
            - Verificamos primero la geometría del chasis y las señales de reparación
            - Bajo costo de entrega — más barato que desde el sur de Europa
        krakow:
          lead: 'Cracovia es más tranquila que Varsovia: el mercado es más pequeño, hay menos reventas, y los coches suelen tener un solo propietario durante más tiempo. El sur de Polonia está más cerca de los Balcanes en términos logísticos.'
          points:
            - Menos revendedores que en Varsovia, la historia suele ser más limpia
            - Los precios son a menudo más bajos que en la capital
            - Más cerca de la ruta hacia el sur — conveniente para la entrega a Serbia
