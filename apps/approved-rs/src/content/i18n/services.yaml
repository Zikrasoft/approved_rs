    vehicle-inspection:
      title: Fahrzeugprüfung
      description: Unabhängige Prüfung vor dem Autokauf. Besichtigung vor Ort, Diagnose und Bericht, ganz ohne Kaufverpflichtung.
      ctaLabel: Prüfung beauftragen
      casesHeading: Erfolgreiche Prüfungen vor dem Kauf
      breadcrumbLabel: Fahrzeugprüfung
      steps:
        - n: '01'
          text: 'Karosserie und Lack: Reparaturen oder Unfallschäden'
        - n: '02'
          text: Fahrwerk, Aufhängung und Bremsen
        - n: '03'
          text: Motor, Getriebe und Antriebsstrang
        - n: '04'
          text: Elektronik und Wartungshistorie anhand der FIN
        - n: '05'
          text: 'Rechtlicher Status: Pfändung, Zulassungssperre, Unfallschäden'
      extraLine: Wir sind auch in anderen europäischen Ländern tätig, darunter Portugal. Fragen Sie bei Ihrer Anfrage nach.
      hub:
        metaTitle: Auto vor dem Kauf in Europa prüfen lassen
        metaDescription: 'Wir prüfen Ihr Wunschauto vor Ort: Lackmessung, Diagnosegerät, FIN-Historie und Fotobericht noch am selben Tag. In acht Ländern Europas.'
        title: Fahrzeugprüfung
        titleHighlight: vor dem Kauf
        description: Wir prüfen das Auto, das Sie selbst gefunden haben, und sagen Ihnen, wie es wirklich dasteht. Sie erhalten den Bericht, bevor Sie bezahlen. Lautet unser Urteil 'Finger weg', kostet Sie das nur die Prüfung.
        breadcrumbLabel: Fahrzeugprüfung
        casesHeading: Erfolgreiche Prüfungen vor dem Kauf
        chooseCountryLabel: 'Land auswählen:'
        ctaLabel: Prüfung beauftragen
        heroPhotoAlt: Auto auf einer Hebebühne in der Werkstatt
        processHeading: So läuft die Prüfung ab
        processLead: Meist sind wir ein bis zwei Tage nach Ihrer Anfrage vor Ort. Die Prüfung dauert etwa anderthalb bis zwei Stunden. Den Bericht schicken wir noch am selben Tag, bevor das Auto an jemand anderen verkauft wird.
        processSteps:
          - n: '01'
            text: Sie schicken uns den Inseratslink und die Kontaktdaten des Verkäufers
          - n: '02'
            text: Wir vereinbaren mit dem Verkäufer Zeit und Ort der Besichtigung
          - n: '03'
            text: Wir kommen mit Lackmessgerät und Diagnosegerät. Bei BMW nutzen wir die Händlerdiagnose ISTA, bei Bedarf kommt das Auto auf die Hebebühne
          - n: '04'
            text: Wir fotografieren und filmen alle Mängel und prüfen die Fahrzeughistorie anhand der FIN
          - n: '05'
            text: 'Sie erhalten den Bericht und eine klare Empfehlung: kaufen, verhandeln oder ablehnen'
        includedHeading: Was die Prüfung umfasst
        includedLead: 'Unsere Checkliste umfasst über 100 Punkte. Entscheidend sind aber meist vier Bereiche: Karosserie, Motor und Getriebe, Fahrwerk und Dokumente. Genau hier raten wir am häufigsten vom Kauf ab.'
        included:
          - title: Karosserie und Lack
            text: Wir messen jede Karosseriefläche, prüfen Türöffnungen und suchen nach Schweiß- und Spachtelspuren. So erkennen wir nicht angegebene Reparaturen.
          - title: Motor und Getriebe
            text: Wir prüfen die Werte bei warmem Motor, die Getriebeadaptionen und Fehlerspeicher. Das ist der teuerste Bereich und der häufigste Grund, vom Kauf abzuraten.
          - title: Fahrwerk und Bremsen
            text: Wir prüfen Spiel sowie den Zustand von Aufhängung und Bremsanlage. Autobahnkilometer und Straßen auf dem Balkan hinterlassen unterschiedliche Spuren.
          - title: Elektronik und FIN-Historie
            text: CarVertical-Bericht, Servicehistorie beim Markenvertragshändler, Abweichungen zwischen Kilometerstand und Historie, Steuergerätefehler und Spuren ausgelöster Airbags.
          - title: Rechtlich geprüft
            text: 'Finanzielle Belastungen, Zulassungssperren, nicht abgeschlossene Unfallschäden und Versicherungsfälle: Dinge, die oft erst nach dem Kauf auffallen.'
          - title: Bericht mit Fotos und Videos
            text: Jeder Fund wird fotografiert und beschrieben. Der Bericht gehört Ihnen und hilft beim Verhandeln, auch wenn Sie das Auto am Ende kaufen.
        compareHeading: Was sich von Land zu Land ändert
        compareLead: Prüfvorschriften, typische Schwachstellen lokaler Fahrzeuge und Methoden, die Fahrzeughistorie zu verschleiern, sind überall anders.
        compareHint: Wählen Sie ein Land, dann zeigen wir, was wir zusätzlich zur Standard-Checkliste prüfen.
        compareLinkFor: Fahrzeugprüfung in {location} im Detail
        mapHeading: Vier Bereiche, die über den Kauf entscheiden
        mapLead: Die Checkliste ist lang, aber meist raten wir wegen eines von vier Bereichen vom Kauf ab. Klicken Sie auf eine Nummer in der Grafik und erfahren Sie, worauf unsere Experten achten und was wir dort schon gefunden haben.
      countryNotesHeadingFor: So prüfen wir Fahrzeuge in {location}
      countryNotesPointsLabel: Was wir zusätzlich zur Standard-Checkliste prüfen
      countryNotes:
        de:
          lead: 'In Deutschland gibt es gute Anhaltspunkte: Serviceheft, HU-Berichte und umfangreiche VIN-Datenbanken. Deshalb gleichen wir bei der Prüfung vor allem die Dokumente mit dem tatsächlichen Zustand des Fahrzeugs ab.'
          points:
            - Händler-Servicenachweise mit den jährlichen Kilometerständen abgleichen
            - 'Mängel aus früheren HU-Berichten: Was wurde repariert und was nur notdürftig behoben?'
            - Unterboden und Schweller auf Streusalzschäden prüfen, auch in Hohlräumen
            - 'Leasingvergangenheit: regelmäßige Wartung trotz hoher Laufleistung'
        rs:
          lead: In Serbien sind wir oft noch am selben Tag vor Ort. Wichtig ist, die Fahrzeughistorie vor dem Import zu rekonstruieren, denn die lokalen Unterlagen decken nur den letzten Abschnitt ab.
          points:
            - Herkunftsland und Zustand des Fahrzeugs vor dem Import nach Serbien
            - Kilometerstand mit den Einträgen bei früheren technischen Prüfungen abgleichen
            - Karosseriearbeiten nach dem Import, die häufiger und günstiger als in der EU durchgeführt werden
            - 'Rechtliche Prüfung: finanzielle Belastungen und Zulassungsbeschränkungen'
        es:
          lead: Spanische Autos haben meist einen guten Unterboden, aber Sonne und Salz setzen anderen Teilen zu. Wir achten daher weniger auf Rost am Unterboden und stärker auf Hohlräume, Elektrik und Innenraum.
          points:
            - Korrosion in Hohlräumen an der Küste, auch wenn der Unterboden sauber aussieht
            - Lack, Dichtungen und Kunststoffteile nach jahrelanger Sonneneinstrahlung
            - 'Mietwagenvergangenheit: Kilometerstand mit der Abnutzung des Innenraums abgleichen'
            - ITV-Berichte und offene Mängel zwischen den Prüfungen
        ch:
          lead: Autos werden gründlich auf die MFK vorbereitet, deshalb sagt ein aktueller Prüfbericht allein wenig aus. Wir prüfen, was unmittelbar vor der Prüfung gemacht wurde und was seit dem Vorjahr unverändert ist.
          points:
            - 'Was unmittelbar vor der MFK ersetzt wurde: neue Teile im Vergleich zum restlichen Zustand'
            - Wartung ist teuer, deshalb prüfen wir, ob vorgeschriebene Arbeiten aufgeschoben wurden
            - Die Ausstattung ist oft umfangreich, wir prüfen aber, ob alle Funktionen noch arbeiten
            - 'Importdokumente: Die Schweiz gehört nicht zur EU, daher ist ein anderer Unterlagensatz nötig'
        pt:
          lead: Das feuchte Seeklima ist hier entscheidend. Wir beginnen mit Korrosion und Elektrik, denn Feuchtigkeit macht meist den Teilen zu schaffen, die ihr ausgesetzt sind.
          points:
            - Hohlräume, Längsträger und Befestigungspunkte der Aufhängung
            - Korrodierte Stecker und Steuergeräte, eine häufige Ursache sporadischer Fehler
            - IPO-Berichte und regelmäßige Prüfungen
            - 'Diesel mit viel Stadtverkehr: Partikelfilter und dessen Historie'
        fr:
          lead: 'In Frankreich gibt es ausführliche Contrôle-Technique-Berichte, ein guter Ausgangspunkt. Danach prüfen wir, was die vorgeschriebenen Kontrollen nicht erfassen: den Zustand des Dieselmotors und Verschleiß durch Stadtverkehr.'
          points:
            - Mängel in den Contrôle-Technique-Berichten im Jahresvergleich, auch wiederkehrende
            - Partikelfilter, AGR-Ventil und Turbolader bei Dieselfahrzeugen
            - Kupplung und Aufhängung nach häufigem Stadtverkehr
            - 'Historie französischer Marken: Ersatzteile sind gut verfügbar, doch es gibt typische Schwachstellen'
        it:
          lead: Italienische Autos haben öfter kleinere, schnell und günstig ausgeführte Karosseriereparaturen. Deshalb verbringen wir hier deutlich mehr Zeit mit der Lackschichtmessung an den Karosserieteilen.
          points:
            - Lackschicht an allen Karosserieteilen messen und nach Nachlackierungen infolge kleiner Rempler suchen
            - 'Unterschiede zwischen Norden und Süden: Salz an der Küste, normaler Verschleiß im Landesinneren'
            - 'Falls eine Gasanlage vorhanden ist: Einbau und Zustand des Gastanks'
            - Regelmäßigkeit der Revisione und versäumte Prüfintervalle
        pl:
          lead: Polen ist der größte Umschlagplatz für Unfallwagen aus Westeuropa. Deshalb klären wir zuerst, welche Arbeiten an der Karosserie vor dem Verkauf ausgeführt wurden.
          points:
            - Tür- und Fensteröffnungen auf Verzug und Schweißspuren prüfen, Hinweise auf eine Reparatur nach schwerem Unfall
            - 'Importhistorie: Woher kam das Fahrzeug und in welchem Zustand?'
            - Kilometerstand mit europäischen Service-Datenbanken abgleichen, dem Tacho allein vertrauen wir nicht
            - Airbags und frühere Auslösungen
      closing:
        eyebrow: Auto gefunden?
        line1: Schicken Sie uns den Link
        line2: zum Inserat,
        accentWord: wir fahren hin und prüfen es
        text: Wir sind innerhalb von ein bis zwei Tagen vor Ort. Der Fotobericht gehört Ihnen, auch wenn Sie sich danach gegen den Kauf entscheiden.
    cityVehicleSourcing:
      title: Autokauf
      descriptionFor: Wir finden ein Auto in {cityLocation} und prüfen es gründlich. Wir sind in der gesamten Region {countryName} tätig.
      casesHeadingFor: Echte Kaufbeispiele aus dem Markt in {countryGenitiveOrName}
      whyCityHeadingFor: Warum {cityName}?
      reason1: Wir durchsuchen Händlerangebote und private Inserate
      reason2: Wir prüfen die VIN-Historie, bevor wir zur Besichtigung fahren
      reason3For: Unser Experte ist in {cityLocation} vor Ort
      reason4Dekra: DEKRA- oder TÜV-Prüfung auf Anfrage
      reason4Generic: Unabhängige technische Prüfung auf Anfrage
      otherCitiesLabelFor: 'Weitere Städte in {countryLocation}:'
      cityNotesHeadingFor: Der Automarkt in {cityLocation}
      cityNotesPointsLabel: Was das in der Praxis bedeutet
      cityNotes:
        berlin:
          lead: 'Berlin bietet die größte Auswahl in Deutschland und eine besonders vielfältige Verkäuferlandschaft. Es gibt alles: Firmenwagen mit lückenloser Historie ebenso wie weiterverkaufte Fahrzeuge aus Osteuropa.'
          points:
            - Riesige Auswahl in jeder Fahrzeugklasse, auch seltene Ausstattungen
            - Viele private Verkäufer, Verhandlungen sind einfacher als bei Händlern
            - 'Stadtverkehr: Kupplung und Fahrwerk verschleißen stärker als bei Langstreckenfahrzeugen'
        munich:
          lead: 'Eine teure Stadt mit entsprechend teuren Autos. Hier gibt es mehr Premiumfahrzeuge als sonst irgendwo in Deutschland, und ihr Zustand ist im Schnitt besser: Die Besitzer pflegen sie.'
          points:
            - Starkes Premiumsegment, besonders BMW und Mercedes
            - Gepflegte Fahrzeuge mit lückenloser Wartungshistorie vom Händler
            - Preise über dem Landesdurchschnitt, dafür oft besserer Zustand
        hamburg:
          lead: Hafenstadt und wichtiger Logistikstandort. Von hier aus lässt sich ein Auto gut weiterversenden, und auf dem Markt finden sich überdurchschnittlich viele junge Importfahrzeuge.
          points:
            - Der Hafen ist nah, der Fahrzeugtransport lässt sich einfacher und günstiger organisieren
            - Viele Fahrzeuge aus dem Norden mit überwiegend Autobahnkilometern
            - 'Feuchtes Seeklima: Karosserie und Hohlräume prüfen wir besonders gründlich'
        dusseldorf:
          lead: Zentrum von Nordrhein-Westfalen, Deutschlands bevölkerungsreichstem Bundesland. Die Händlerplätze liegen dicht beieinander, und die niederländische und belgische Grenze ist nur eine Stunde entfernt. Daher kommen regelmäßig Fahrzeuge von dort auf den Markt.
          points:
            - Bei einem Termin können wir mehrere Fahrzeuge ansehen, die Händlerplätze liegen nah beieinander
            - 'Einige Angebote haben niederländische oder belgische Kennzeichen: Historie und Papiere prüfen wir gesondert'
            - Viele Verkäufer stehen in Konkurrenz, deshalb wird eher verhandelt
        belgrade:
          lead: Unser Standort. In Belgrad können wir das Fahrzeug noch am selben Tag besichtigen, kennen die örtlichen Verkäufer und erkennen, wenn ein Auto schon seit Monaten von Händlerplatz zu Händlerplatz wandert.
          points:
            - Besichtigung am selben Tag, ohne Wartezeit oder Anreiseplanung
            - Wir kennen die lokalen Händlerplätze und die Geschichte der dort angebotenen Fahrzeuge
            - Das Auto ist bereits verzollt, Einfuhr und Zollgebühren entfallen
        novi-sad:
          lead: Serbiens zweitgrößte Stadt, etwa eine Stunde von Belgrad entfernt. Der Markt ist kleiner, die Preise sind meist moderater als in der Hauptstadt, und die Fahrzeuge haben seltener mehrere Weiterverkäufe hinter sich.
          points:
            - Niedrigere Preise als in Belgrad bei vergleichbarem Zustand
            - Weniger Zwischenhändler, häufiger Fahrzeuge aus erster Hand
            - Wir kommen aus Belgrad, ohne zusätzliche Anfahrtskosten
        pancevo:
          lead: Pancevo gehört praktisch zum Großraum Belgrad, die Besichtigung unterscheidet sich daher kaum von einer in der Hauptstadt. Der Markt ist klein, dafür sind private Angebote oft interessanter.
          points:
            - Nur 20 Minuten von Belgrad entfernt, Besichtigungen sind genauso schnell möglich
            - Kleiner Markt mit überwiegend privaten Verkäufern
            - Bei gleichem Zustand oft günstiger als in der Hauptstadt
        subotica:
          lead: 'Subotica liegt an der ungarischen Grenze, das zeigt sich auch auf dem Fahrzeugmarkt: Viele Autos kommen frisch aus der EU, und zahlreiche Verkäufer sind auf den Handel spezialisiert.'
          points:
            - Grenzmarkt mit vielen jungen Importfahrzeugen aus der EU
            - Die Historie vor dem Import prüfen wir besonders gründlich
            - Praktischer Standort, wenn Sie das Auto weiter nach Norden fahren möchten
        madrid:
          lead: Der Hauptstadtmarkt bietet die größte Auswahl in Spanien und viele Firmenwagen. Das kontinentale Klima sorgt für weniger Rost durch Meeresluft als an der Küste.
          points:
            - Größte Auswahl in Spanien, darunter viele Firmenwagen
            - Abseits der Küste sind Karosserien meist rostärmer
            - 'Heiße Sommer: Kunststoffteile, Lack und Klimaanlage prüfen wir gesondert'
        barcelona:
          lead: Die Nähe zum Meer macht den Unterschied. Von unten sehen die Autos oft gut aus, doch Hohlräume und Elektrik brauchen besondere Aufmerksamkeit.
          points:
            - 'Nähe zum Meer: Hohlräume genau prüfen, denn von unten ist es oft sauber, innen nicht'
            - Viele ehemalige Mietwagen und Carsharing-Fahrzeuge
            - Der Hafen ist nah, der Seetransport lässt sich einfacher organisieren
        zurich:
          lead: Zürich ist der teuerste Fahrzeugmarkt der Region. Die Autos haben oft eine Topausstattung, werden beim Händler gewartet und verkauft, bevor sie stark beansprucht sind.
          points:
            - Topausstattung und geringe Laufleistung
            - Wartung beim Händler, die Historie ist fast immer lückenlos
            - Die Schweiz gehört nicht zur EU, der Import muss separat abgewickelt werden
        geneva:
          lead: Genf liegt im französischsprachigen Teil der Schweiz, direkt an der Grenze zu Frankreich. Französische Automarken sind hier deutlich häufiger vertreten als im deutschsprachigen Landesteil.
          points:
            - 'Gemischter Markt: Schweizer Zustand, französische Auswahl'
            - Die französische Grenze ist nah, Preisvergleiche lohnen sich
            - 'Gleiche Abwicklung wie in der übrigen Schweiz: Export und Import'
        paris:
          lead: 'Die größte Auswahl Frankreichs geht mit besonders starker Beanspruchung einher: dichter Verkehr und enge Parkplätze hinterlassen Spuren an Karosserie und Fahrwerk.'
          points:
            - Größte Auswahl in Frankreich, besonders bei französischen Marken
            - 'Stadtverkehr: Kupplung, Fahrwerk und kleinere Karosserieschäden'
            - 'Viele Diesel: Partikelfilter und AGR prüfen wir zuerst'
        lyon:
          lead: Lyon ist entspannter als Paris, was Preise und Fahrzeugzustand angeht. Die Autobahn Richtung Süden ist nah, daher finden sich hier öfter Autos mit gleichmäßiger Langstreckenlaufleistung.
          points:
            - Niedrigere Preise als in Paris bei vergleichbarer Auswahl
            - Mehr Autobahnkilometer, weniger Verschleiß durch Stadtverkehr
            - Günstige Lage zu Italien und Spanien, falls wir die Suche erweitern
        milan:
          lead: 'Italiens Wirtschaftszentrum, und das spiegelt sich in den Preisen auf dem Fahrzeugmarkt wider. Im Norden ähneln die Bedingungen eher denen in Deutschland: bessere Straßen und gepflegtere Autos als im Süden.'
          points:
            - Italiens beste Auswahl im Premiumsegment
            - Im Norden gibt es weniger Streusalz und Rost als im Süden
            - 'Dichter Stadtverkehr: Lackschichtdickenmessung an allen Karosserieteilen'
        rome:
          lead: Ein großer Markt mit intensiver Nutzung im Stadtverkehr. Kleine Parkrempler gehören zum Alltag und werden oft schnell ausgebessert.
          points:
            - Viele Kleinwagen und Fahrzeuge mit Gasanlage
            - Häufig nachlackierte Stellen nach Parkremplern, wir prüfen jedes Karosserieteil
            - Südlich von Mailand ist das Klima milder, aber die Nähe zum Meer macht sich bemerkbar
        warsaw:
          lead: Über Warschau kommt der Großteil der Importe aus Westeuropa ins Land. Hier ist auch die größte Auswahl Polens zu finden. Der Anteil instandgesetzter Fahrzeuge ist ebenfalls besonders hoch.
          points:
            - Polens größte Auswahl, viele kürzlich aus der EU importierte Fahrzeuge
            - Karosseriegeometrie und Reparaturspuren prüfen wir zuerst
            - Kurze Transportstrecke, günstiger als aus Südeuropa
        krakow:
          lead: 'Krakau ist ruhiger als Warschau: Der Markt ist kleiner, es gibt weniger Weiterverkäufe und die Fahrzeuge bleiben häufiger länger beim selben Besitzer. Logistisch liegt Südpolen näher am Balkan.'
          points:
            - Weniger Zwischenhändler als in Warschau, meist eine sauberere Fahrzeughistorie
            - Die Preise liegen oft unter denen in der Hauptstadt
            - Näher an der Route Richtung Süden, praktisch für den Transport nach Serbien
