        destinationsNote: Wir liefern nach Serbien, Spanien und Portugal – und in jedes andere Land, das bei der Antragstellung diskutiert werden kann.
        chinaCrossLabel: Denken Sie an einen Import aus China?
        notesHeading: Was die Dauer und die Kosten aus der Schweiz beeinflusst
        notesPointsLabel: Besonderheiten des Ziels
        notes:
          lead: 'Die Schweiz gehört nicht zur EU, deshalb durchläuft das Auto zwei Zollabwicklungen: bei der Ausreise aus dem Land und bei der Einreise ins Zielland. Das ist der größte Unterschied zu jedem Ziel innerhalb der Europäischen Union.'
          points:
            - 'Doppelte Abwicklung: Export aus der Schweiz und Import ins Ziel'
            - Die Schweizer Mehrwertsteuer wird bei Export zurückerstattet – wir berücksichtigen dies in der Berechnung
            - 'Die Herkunft des Fahrzeugs prüfen wir separat: Schweizer Kennzeichen bedeuten nicht, dass es europäisch produziert wurde'
            - Der Zustand ist in der Regel besser als der Durchschnitt, jedoch sind auch die Preise in den Anzeigen höher.
