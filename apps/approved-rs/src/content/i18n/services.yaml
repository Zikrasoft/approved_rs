vehicle-inspection:
  hub:
    metaTitle: Проверка авто перед покупкой в Европе
    metaDescription: >-
      Выезжаем к машине, которую вы нашли сами: толщиномер, сканер, проверка истории по VIN и отчет с фото в тот же день. Работаем в восьми странах Европы.
    title: Проверка авто
    titleHighlight: перед покупкой
    description: >-
      Выезжаем к машине, которую вы нашли сами, и рассказываем, что с ней на самом деле. Отчет приходит до того, как вы отдадите деньги: если ответ «не берите», вы теряете только стоимость проверки.
    breadcrumbLabel: Проверка авто
    casesHeading: 'Реальные сделки: проверка перед покупкой'
    chooseCountryLabel: 'Выберите страну:'
    ctaLabel: Заказать проверку
    processHeading: Как проходит проверка
    processLead: >-
      Обычно выезжаем в течение одного-двух дней после заявки. Сам осмотр занимает полтора-два часа, отчет присылаем в тот же день, пока машина еще не ушла другому покупателю.
    processSteps:
      - n: '01'
        text: Присылаете ссылку на объявление и контакты продавца
      - n: '02'
        text: Договариваемся с продавцом о времени и месте осмотра
      - n: '03'
        text: Выезжаем с толщиномером и сканером, для BMW подключаем дилерскую ISTA, при необходимости ставим на подъемник
      - n: '04'
        text: Снимаем фото и видео всех находок, проверяем историю по VIN
      - n: '05'
        text: Присылаем отчет и прямой ответ, брать, торговаться или отказаться
    includedHeading: Что входит в проверку
    includedLead: >-
      Сто с лишним пунктов чек-листа, но решают почти всегда четыре зоны: кузов, мотор с коробкой, ходовая и документы. Именно по ним мы чаще всего отговариваем от покупки.
    included:
      - title: Кузов и лакокрасочное покрытие
        text: >-
          Толщиномер по каждой панели, геометрия проемов, следы сварки и шпаклевки. Видно, был ли ремонт, о котором продавец не упомянул.
      - title: Двигатель и коробка
        text: >-
          Параметры на прогретом моторе, адаптации коробки, ошибки в памяти блоков. Самая дорогая зона и самая частая причина отказа.
      - title: Ходовая и тормоза
        text: >-
          Люфты, состояние подвески и тормозной системы. Автобанный пробег и балканские дороги изнашивают машину по-разному, и это видно.
      - title: Электроника и история по VIN
        text: >-
          Отчет CarVertical, дилерская сервисная история по марке, расхождение пробега с историей, ошибки блоков и следы сработавших подушек безопасности.
      - title: Юридическая чистота
        text: >-
          Залог, запрет на регистрацию, незакрытые ДТП и страховые события: то, что всплывает уже после покупки.
      - title: Отчет с фото и видео
        text: >-
          Каждая находка снята и подписана. Отчет остается у вас, с ним удобно торговаться, даже если машину вы все-таки берете.
    heroPhotoAlt: Автомобиль на подъемнике в сервисе
    mapHeading: Четыре зоны, которые решают сделку
    mapLead: >-
      Чек-лист длинный, но отговариваем почти всегда по одной из четырех зон. Нажмите номер на схеме, и покажем, что смотрит эксперт и что мы там находили.
    compareHeading: Что меняется от страны к стране
    compareLead: >-
      Регламент техосмотра, типичные болячки местных машин и способы спрятать историю везде свои.
    compareHint: Выберите страну, и покажем, что добавляем к обычному чек-листу.
    compareLinkFor: Проверка {location} подробно
  title: Проверка авто
  description: Независимая проверка автомобиля перед покупкой. Выезд эксперта, диагностика, отчет без обязательства покупки.
  ctaLabel: Заказать проверку
  casesHeading: 'Реальные сделки: проверка перед покупкой'
  breadcrumbLabel: Проверка авто
  steps:
