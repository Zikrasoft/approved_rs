            - 'La procedencia europea no se puede certificar: EUR1 no se aplica aquí, el arancel es más alto'
            - 'Garantía y piezas: verificamos si el modelo está soportado en el país de destino'
            - 'Vehículos eléctricos: verificamos el tipo de conector de carga y la compatibilidad con las redes locales'
