    vehicle-inspection:
      title: Fahrzeugprüfung
      description: Unabhängiger Fahrzeugcheck vor dem Kauf. Ein Experte prüft das Auto vor Ort, führt die Diagnose durch und erstellt einen Bericht. Ohne Kaufverpflichtung.
      ctaLabel: Fahrzeugprüfung buchen
      casesHeading: 'Abgeschlossene Aufträge: Fahrzeugcheck vor dem Kauf'
      breadcrumbLabel: Fahrzeugprüfung
      steps:
        - n: '01'
          text: Karosserie und Lackierung, Reparatur- und Unfallschäden
        - n: '02'
          text: Fahrwerk, Radaufhängung und Bremsen
        - n: '03'
          text: Motor, Getriebe und Antriebsstrang
        - n: '04'
          text: Elektronik und Wartungshistorie anhand der FIN
        - n: '05'
          text: Rechtliche Prüfung auf Pfandrechte, Zulassungssperren und dokumentierte Unfälle
      extraLine: Wir prüfen auch in weiteren europäischen Ländern, darunter Portugal. Fragen Sie uns bei Ihrer Anfrage danach.
      hub:
        metaTitle: Fahrzeugcheck vor dem Kauf in Europa
        metaDescription: 'Wir prüfen Ihr Wunschauto vor Ort: Lackschichtmessung, Diagnose, FIN-Historie und Fotobericht am selben Tag. In acht europäischen Ländern.'
        title: Fahrzeugprüfung
        titleHighlight: vor dem Kauf
        description: Wir prüfen Ihr Wunschauto vor Ort und berichten vor dem Kauf ehrlich über seinen Zustand. Raten wir ab, zahlen Sie nur die Prüfung.
        breadcrumbLabel: Fahrzeugprüfung
        casesHeading: 'Abgeschlossene Aufträge: Fahrzeugcheck vor dem Kauf'
        chooseCountryLabel: 'Land auswählen:'
        ctaLabel: Fahrzeugprüfung buchen
        heroPhotoAlt: Auto auf einer Hebebühne in der Werkstatt
        processHeading: So läuft die Prüfung ab
        processLead: Meist sind wir innerhalb von ein bis zwei Tagen nach Ihrer Anfrage vor Ort. Die Prüfung dauert anderthalb bis zwei Stunden. Den Bericht erhalten Sie noch am selben Tag, bevor ein anderer Käufer zugreift.
        processSteps:
          - n: '01'
            text: Sie schicken uns den Link zum Inserat und die Kontaktdaten des Verkäufers.
          - n: '02'
            text: Wir vereinbaren mit dem Verkäufer Zeit und Ort der Besichtigung.
          - n: '03'
            text: Wir prüfen vor Ort mit Lackschichtmessgerät und Diagnosegerät. Bei BMW nutzen wir die Herstellerdiagnose ISTA, bei Bedarf kommt das Auto auf die Hebebühne.
          - n: '04'
            text: Wir dokumentieren alle Auffälligkeiten mit Fotos und Videos und prüfen die Fahrzeughistorie anhand der FIN.
          - n: '05'
            text: 'Sie erhalten einen Bericht und eine klare Empfehlung: kaufen, nachverhandeln oder lieber verzichten.'
        includedHeading: Was wir prüfen
        includedLead: 'Unsere Checkliste umfasst über hundert Punkte. Entscheidend sind aber fast immer vier Bereiche: Karosserie, Motor und Getriebe, Fahrwerk sowie Fahrzeugpapiere. Hier liegen die häufigsten Gründe, aus denen wir vom Kauf abraten.'
        included:
          - title: Karosserie und Lackierung
            text: Lackschichtmessung an jedem Karosserieteil, Prüfung der Geometrie von Tür- und Fensteröffnungen sowie auf Schweiß- und Spachtelspuren. So werden auch Reparaturen erkennbar, die der Verkäufer nicht erwähnt hat.
          - title: Motor und Getriebe
            text: Betriebswerte bei warmem Motor, Adaptionswerte des Getriebes und Fehlerspeicher der Steuergeräte. Hier drohen die höchsten Kosten, und hier liegt der häufigste Grund, vom Kauf abzuraten.
          - title: Fahrwerk und Bremsen
            text: Wir prüfen auf Spiel und kontrollieren Radaufhängung und Bremsanlage. Autobahnkilometer und Straßen auf dem Balkan hinterlassen unterschiedliche Verschleißspuren. Das lässt sich erkennen.
          - title: Elektronik und Fahrzeughistorie anhand der FIN
            text: CarVertical-Bericht, Servicehistorie aus dem Händlernetz der Marke, Abweichungen vom dokumentierten Kilometerstand, Fehlereinträge in Steuergeräten und Hinweise auf ausgelöste Airbags.
          - title: Rechtliche Unbedenklichkeit
            text: 'Pfandrechte, Zulassungssperren, ungeklärte Unfall- und Versicherungsfälle: Dinge, die oft erst nach dem Kauf ans Licht kommen.'
          - title: Bericht mit Fotos und Videos
            text: Jeder Befund wird aufgenommen und erläutert. Der Bericht bleibt bei Ihnen und hilft bei der Preisverhandlung, auch wenn Sie das Auto trotzdem kaufen.
        compareHeading: Was sich von Land zu Land unterscheidet
        compareLead: Prüfvorschriften, typische Schwachstellen der Fahrzeuge und Tricks zum Verschleiern der Historie unterscheiden sich je nach Land.
        compareHint: Wählen Sie ein Land und erfahren Sie, was wir zusätzlich zur üblichen Checkliste prüfen.
        compareLinkFor: Fahrzeugprüfung {location} im Detail
        mapHeading: Vier Bereiche, die über den Kauf entscheiden
        mapLead: 'Unsere Checkliste ist lang. Wenn wir vom Kauf abraten, liegt es aber fast immer an einem dieser vier Bereiche. Klicken Sie auf eine Nummer in der Grafik: Wir zeigen, was der Experte prüft und welche Mängel wir dort bereits gefunden haben.'
      countryNotesHeadingFor: So prüfen wir {location}
      countryNotesPointsLabel: Was wir zusätzlich zur üblichen Checkliste prüfen
      countryNotes:
        de:
          lead: 'In Deutschland gibt es gute Anhaltspunkte: Serviceheft, HU-Berichte und umfangreiche FIN-Datenbanken. Deshalb gleichen wir hier vor allem die Unterlagen mit dem tatsächlichen Zustand des Fahrzeugs ab.'
          points:
            - Wartungseinträge aus dem Händlernetz mit den Kilometerständen der jeweiligen Jahre abgleichen
            - 'Mängel aus der letzten HU: Was wurde behoben und was nur aufgeschoben?'
            - Unterboden und Schweller nach Streusalzeinwirkung prüfen, einschließlich verdeckter Hohlräume
            - 'Leasinghistorie: regelmäßige Wartung trotz hoher Laufleistung'
        rs:
          lead: 'In Serbien sind wir noch am Tag Ihrer Anfrage vor Ort. Entscheidend ist, die Fahrzeughistorie vor dem Import zu rekonstruieren: Die örtlichen Unterlagen decken nur den jüngsten Teil des Fahrzeuglebens ab.'
          points:
            - Herkunftsland und Fahrzeugzustand vor dem Import nach Serbien
            - Kilometerstand mit den Einträgen der technischen Prüfungen aus den Vorjahren abgleichen
            - Karosseriereparaturen nach dem Import, die hier häufiger und günstiger durchgeführt werden als in der EU
            - 'Rechtliche Prüfung: Pfandrechte und Zulassungsbeschränkungen'
        es:
          lead: Spanische Fahrzeuge haben oft einen guten Unterboden, zeigen aber Schäden durch Sonne und Salz. Deshalb richten wir den Blick weniger auf Rost am Unterboden und stärker auf Hohlräume, Elektrik und Innenraum.
          points:
            - Versteckte Korrosion bei Küstenfahrzeugen, auch wenn der Unterboden unauffällig ist
            - Lack, Dichtungen und Kunststoffteile nach jahrelanger Sonneneinstrahlung
            - 'Mietwagenhistorie: Laufleistung mit den Verschleißspuren im Innenraum abgleichen'
            - ITV-Bericht und Mängel, die zwischen den Prüfungen nicht behoben wurden
        ch:
          lead: Fahrzeuge werden gründlich auf die MFK vorbereitet. Ein aktueller Prüfbericht allein sagt deshalb wenig aus. Wir prüfen, was eigens für die Prüfung gemacht wurde und welche älteren Probleme weiterhin bestehen.
          points:
            - Was unmittelbar vor der MFK ersetzt wurde und wie die neuen Teile zum Gesamtzustand passen
            - 'Wartung ist teuer: Wir prüfen, ob vorgeschriebene Arbeiten aufgeschoben wurden'
            - 'Umfangreiche Ausstattung: Wir prüfen, ob jede Funktion noch funktioniert'
            - 'Einfuhrunterlagen: Die Schweiz gehört nicht zur EU, daher sind andere Dokumente nötig'
        pt:
          lead: 'Hier ist das feuchte Meeresklima entscheidend. Wir beginnen mit Korrosion und Elektrik: Meist versagen die Bauteile, die dauerhaft Feuchtigkeit ausgesetzt sind.'
          points:
            - Hohlräume, Längsträger und Fahrwerksaufnahmen
            - Korrosion an Steckverbindungen und Steuergeräten als typische Ursache sporadischer Fehler
            - IPO-Prüfbericht und Einhaltung der Prüftermine
            - 'Dieselfahrzeuge im Stadtbetrieb: Zustand und Historie des Dieselpartikelfilters'
        fr:
          lead: 'Der französische contrôle technique ist detailliert und bietet eine gute Grundlage. Darüber hinaus prüfen wir, was dabei nicht erfasst wird: den Zustand wichtiger Dieselkomponenten und den Verschleiß durch Stadtverkehr.'
          points:
            - 'Mängel im contrôle technique über die Jahre: Was taucht bei jeder Prüfung wieder auf?'
            - Dieselpartikelfilter, AGR-System und Turbolader bei Dieselfahrzeugen
            - Kupplung und Fahrwerk nach intensivem Stadtverkehr
            - 'Servicehistorie französischer Marken: Ersatzteile sind gut verfügbar, doch jede Marke hat ihre Schwachstellen'
        it:
          lead: Italienische Fahrzeuge weisen besonders häufig kleinere Karosseriereparaturen auf, die schnell und günstig erledigt wurden. Für die Lackschichtmessung an allen Karosserieteilen nehmen wir uns hier deutlich mehr Zeit als üblich.
          points:
            - Lackschichtmessung an allen Karosserieteilen, um Nachlackierungen nach Park- und Streifschäden zu erkennen
            - 'Unterschiede zwischen Nord und Süd: Salzeinwirkung an der Küste, üblicher Verschleiß im Landesinneren'
            - 'Falls eine Gasanlage vorhanden ist: Einbau und Zustand des Gastanks'
            - Einhaltung der Revisione-Termine und Lücken in der Prüfhistorie
        pl:
          lead: Polen ist der größte Umschlagplatz für Unfallwagen aus Westeuropa. Deshalb klären wir zuerst, welche Arbeiten vor dem Verkauf an der Karosserie durchgeführt wurden.
          points:
            - Maßhaltigkeit der Karosserieöffnungen und Schweißspuren als Hinweise auf die Instandsetzung nach schweren Unfällen
            - 'Importhistorie: Woher stammt das Fahrzeug und in welchem Zustand wurde es eingeführt?'
            - Kilometerstand mit europäischen Servicedatenbanken abgleichen, statt sich auf den Tacho zu verlassen
            - Airbags und Hinweise auf frühere Auslösungen
      closing:
        eyebrow: Auto gefunden?
        line1: Schicken Sie uns den Link
        line2: zum Inserat,
        accentWord: wir prüfen es vor Ort
        text: Wir sind innerhalb von ein bis zwei Tagen vor Ort. Der Fotobericht bleibt bei Ihnen, auch wenn Sie sich danach gegen den Kauf entscheiden.
    cityVehicleSourcing:
      title: Autosuche
      descriptionFor: Wir finden Ihr Auto {cityLocation} und prüfen es umfassend. Unser Service deckt die gesamte Region {countryName} ab.
      casesHeadingFor: Erfolgreiche Fahrzeugkäufe auf dem Markt {countryGenitiveOrName}
      whyCityHeadingFor: Warum {cityName}
      reason1: Wir suchen bei Händlern und in privaten Inseraten
      reason2: Wir prüfen die FIN-Historie vor der Besichtigung
      reason3For: Unser Experte {cityLocation}
      reason4Dekra: DEKRA- oder TÜV-Prüfung auf Wunsch
      reason4Generic: Unabhängiges technisches Gutachten auf Wunsch
      otherCitiesLabelFor: 'Weitere Städte {countryLocation}:'
      cityNotesHeadingFor: Der Automarkt {cityLocation}
      cityNotesPointsLabel: Was das in der Praxis bedeutet
      cityNotes:
        berlin:
          lead: 'Berlin bietet die größte Auswahl in Deutschland und eine besonders vielfältige Verkäuferlandschaft. Hier findet sich alles: vom Firmenwagen mit lückenloser Historie bis zum weiterverkauften Import aus Osteuropa.'
          points:
            - Riesige Auswahl in allen Fahrzeugklassen, auch mit seltenen Ausstattungen
            - Viele Privatverkäufer, mehr Verhandlungsspielraum als beim Händler
            - 'Stadtverkehr: Kupplung und Fahrwerk verschleißen stärker als bei Autobahnfahrzeugen'
        munich:
          lead: 'Eine teure Stadt mit teuren Autos. Das Premiumsegment ist hier stärker vertreten als irgendwo sonst in Deutschland. Auch der Zustand ist im Schnitt besser: Diese Fahrzeuge werden gepflegt.'
          points:
            - Starkes Premiumsegment, besonders BMW und Mercedes
            - Gepflegte Fahrzeuge mit lückenloser Wartungshistorie beim Vertragshändler
            - Preise über dem Bundesdurchschnitt, dafür weniger Folgekosten dank besserem Zustand
        hamburg:
          lead: Hafenstadt und wichtiger Logistikknotenpunkt. Von hier lässt sich der Weitertransport gut organisieren. Auf dem Markt finden sich zudem überdurchschnittlich viele frisch importierte Fahrzeuge.
          points:
            - Der Hafen ist nah, der Versand lässt sich einfacher und günstiger organisieren
            - Viele Fahrzeuge aus den nördlichen Bundesländern mit hohem Langstreckenanteil
            - 'Feuchtes Seeklima: Karosserie und Hohlräume prüfen wir besonders genau'
        dusseldorf:
          lead: Mitten in Nordrhein-Westfalen, dem bevölkerungsreichsten Bundesland Deutschlands. Die Autohändler liegen dicht beieinander. Die Grenzen zu den Niederlanden und Belgien sind nur eine Stunde entfernt, daher kommen regelmäßig Fahrzeuge von dort zum Verkauf.
          points:
            - Bei einer Fahrt können wir mehrere Fahrzeuge prüfen, die Händler liegen nah beieinander
            - 'Einige Angebote haben niederländische oder belgische Kennzeichen: Historie und Papiere prüfen wir gesondert'
            - Viele konkurrierende Verkäufer, dadurch mehr Verhandlungsspielraum
        belgrade:
          lead: Unser Standort. In Belgrad prüfen wir Fahrzeuge noch am Tag der Anfrage. Wir kennen die lokalen Verkäufer und erkennen Autos wieder, die schon seit zwei Monaten von Händler zu Händler wandern.
          points:
            - Fahrzeugprüfung am Tag der Anfrage, ohne Wartezeit oder aufwendige Anfahrt
            - Wir kennen die lokalen Händlerplätze und die Historie der dort angebotenen Fahrzeuge
            - Das Fahrzeug ist bereits verzollt, Einfuhr und Zollabgaben entfallen
        novi-sad:
          lead: Serbiens zweitgrößte Stadt liegt eine Autostunde von Belgrad entfernt. Der Markt ist kleiner, die Preise sind meist moderater als in der Hauptstadt. Auch sind die Fahrzeuge seltener schon durch mehrere Händlerhände gegangen.
          points:
            - Niedrigere Preise als in Belgrad bei vergleichbarem Zustand
            - Weniger Zwischenhändler, häufiger Fahrzeuge aus erster Hand
            - Wir kommen aus Belgrad, ohne zusätzliche Anfahrtskosten
        pancevo:
          lead: Pančevo gehört praktisch zum Großraum Belgrad. Eine Fahrzeugprüfung ist hier deshalb genauso unkompliziert wie in der Hauptstadt. Der Markt ist klein, bietet aber oft interessante Privatangebote.
          points:
            - Zwanzig Minuten von Belgrad entfernt, wir sind genauso schnell vor Ort
            - Kleiner Markt mit überwiegend privaten Verkäufern
            - Bei gleichem Zustand oft günstiger als in der Hauptstadt
        subotica:
          lead: 'Subotica liegt an der ungarischen Grenze. Das prägt auch den Fahrzeugmarkt: viele EU-Importe und Verkäufer, die sich auf diesen Handel spezialisiert haben.'
          points:
            - Grenznaher Markt mit vielen frisch importierten Fahrzeugen aus der EU
            - Die Fahrzeughistorie vor dem Import prüfen wir besonders gründlich
            - Günstiger Ausgangspunkt, wenn Sie das Fahrzeug weiter nach Norden überführen möchten
        madrid:
          lead: Der Fahrzeugmarkt der spanischen Hauptstadt bietet die größte Auswahl im Land und viele ehemalige Firmenwagen. Durch das kontinentale Klima gibt es hier weniger salzbedingte Korrosion als an der Küste.
          points:
            - Größte Auswahl in Spanien, auch an ehemaligen Firmenwagen
            - Abseits des Meeres sind die Karosserien meist rostärmer als an der Küste
            - 'Heiße Sommer: Kunststoffe, Lack und Klimaanlage prüfen wir gezielt'
        barcelona:
          lead: Die Nähe zum Meer prägt den Fahrzeugzustand. Von unten sehen die Autos oft tadellos aus, doch Hohlräume und Elektrik verdienen besondere Aufmerksamkeit.
          points:
            - 'Meeresnähe: Wir prüfen die Hohlräume, denn ein sauberer Unterboden sagt wenig über den Zustand im Inneren aus'
            - Viele ehemalige Mietwagen und Carsharing-Fahrzeuge
            - Der nahe Hafen erleichtert den Versand auf dem Seeweg
        zurich:
          lead: Zürich ist der teuerste Automarkt der Region. Hier kauft man Autos mit Vollausstattung, lässt sie beim Vertragshändler warten und verkauft sie, bevor sich größerer Verschleiß bemerkbar macht.
          points:
            - Vollausstattung und niedrige Laufleistungen
            - Wartung beim Vertragshändler, fast immer lückenlose Historie
            - Die Schweiz gehört nicht zur EU, die Einfuhr muss separat abgewickelt werden
        geneva:
          lead: Genf liegt in der französischsprachigen Schweiz, direkt an der Grenze zu Frankreich. Französische Marken sind auf dem Markt deutlich stärker vertreten als in der Deutschschweiz.
          points:
            - 'Gemischter Markt: Schweizer Pflegezustand trifft auf französische Markenvielfalt'
            - Frankreich liegt direkt nebenan, gute Möglichkeiten zum Preisvergleich
            - 'Gleiche Abwicklung wie in der übrigen Schweiz: Ausfuhr und anschließende Einfuhr'
        paris:
          lead: 'Die größte Auswahl Frankreichs geht mit besonders harter Beanspruchung einher: Dichter Verkehr und enge Parklücken hinterlassen Spuren an Karosserie und Fahrwerk.'
          points:
            - Größte Auswahl in Frankreich, besonders bei französischen Marken
            - 'Stadtverkehr: Verschleiß an Kupplung und Fahrwerk sowie kleine Karosserieschäden'
            - Viele Diesel, Partikelfilter und AGR-System prüfen wir zuerst
        lyon:
          lead: Lyon ist entspannter als Paris, sowohl bei den Preisen als auch beim Fahrzeugzustand. Durch die nahe Autobahn Richtung Süden finden sich häufiger Autos, die überwiegend gleichmäßig auf Langstrecken gefahren wurden.
          points:
            - Niedrigere Preise als in Paris bei vergleichbarer Auswahl
            - Mehr Langstreckenfahrzeuge, weniger Verschleiß durch Stadtverkehr
            - Italien und Spanien sind gut erreichbar, wenn wir die Suche ausweiten
        milan:
          lead: 'Mailand ist Italiens Wirtschaftsmetropole, das zeigt sich auch an den Autopreisen. Im Norden ähneln die Bedingungen eher denen in Deutschland: bessere Straßen und gepflegtere Fahrzeuge als im Süden.'
          points:
            - Italiens beste Auswahl im Premiumsegment
            - 'Norditalien: weniger Salzbelastung und Korrosion als im Süden des Landes'
            - 'Dichter Stadtverkehr: Die Lackschichtdicke messen wir an jedem Karosserieteil'
        rome:
          lead: Großer Fahrzeugmarkt mit viel Stadtverkehr. Kleine Schrammen gehören hier zum Alltag und werden oft nur notdürftig ausgebessert.
          points:
            - Viele Kleinwagen und Fahrzeuge mit Autogasanlage
            - Häufige Nachlackierungen nach Parkremplern, wir prüfen jedes Karosserieteil
            - Milderes Klima als in Mailand, dafür näher am Meer
        warsaw:
          lead: Ein Großteil der Gebrauchtwagenimporte aus Westeuropa kommt über Warschau ins Land. Hier ist auch die Auswahl in Polen am größten, allerdings ebenso der Anteil instand gesetzter Unfallwagen.
          points:
            - Größte Auswahl in Polen, viele frisch importierte Fahrzeuge aus der EU
            - Karosseriegeometrie und Reparaturspuren prüfen wir zuerst
            - Kurze Transportwege, günstiger als aus Südeuropa
        krakow:
          lead: 'In Krakau geht es ruhiger zu als in Warschau: Der Markt ist kleiner, es gibt weniger Zwischenhandel und die Fahrzeuge bleiben oft länger beim selben Halter. Auch die Transportwege von Südpolen auf den Balkan sind kürzer.'
          points:
            - Weniger Zwischenhändler als in Warschau, meist besser nachvollziehbare Fahrzeughistorie
            - Preise oft niedriger als in der Hauptstadt
            - Günstige Lage an der Route nach Süden, praktisch für den Transport nach Serbien
