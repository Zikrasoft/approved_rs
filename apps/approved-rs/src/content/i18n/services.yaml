    cityVehicleSourcing:
      title: Pronalaženje auta
      descriptionFor: Pronaći ćemo vam automobil u gradu {cityLocation} i detaljno ga proveriti. Radimo širom regiona {countryName}.
      casesHeadingFor: Stvarne kupovine na tržištu {countryGenitiveOrName}
      whyCityHeadingFor: Zašto {cityName}
      reason1: Pretražujemo i placeve ovlašćenih prodavaca i privatne oglase
      reason2: VIN istoriju proveravamo pre nego što odemo na pregled
      reason3For: Naš stručnjak u gradu {cityLocation}
      reason4Dekra: DEKRA / TÜV provera na zahtev
      reason4Generic: Nezavisna tehnička provera na zahtev
      otherCitiesLabelFor: 'Drugi gradovi u {countryLocation}:'
      cityNotesHeadingFor: Tržište automobila u gradu {cityLocation}
      cityNotesPointsLabel: Šta to znači u praksi
      cityNotes:
        berlin:
          lead: 'Berlin ima najveći izbor u Nemačkoj i najraznovrsnije prodavce. Tu se može naći sve: od vozila iz korporativnih flota sa kompletnom istorijom do preprodavaca koji su ih dovezli iz istočne Evrope.'
          points:
            - Ogroman izbor u svim segmentima, uključujući retke pakete opreme
            - Mnogo privatnih prodavaca, pa je cenkanje lakše nego kod dilera
            - 'Gradska vožnja: kvačilo i vešanje se više troše nego kod automobila koji su uglavnom voženi autoputem'
        munich:
          lead: 'Skup grad sa skupim automobilima. Ovde ima više vozila premium klase nego bilo gde drugde u Nemačkoj, a njihovo stanje je u proseku bolje: vlasnici ih redovno održavaju.'
          points:
            - Snažan premium segment, posebno BMW i Mercedes
            - Dobro održavani automobili sa kompletnom servisnom istorijom kod dilera
            - Cene su više od proseka u zemlji, a ušteda se ogleda u stanju vozila
        hamburg:
          lead: Lučki grad i veliki logistički centar. Odavde je jednostavno poslati automobil dalje, a na tržištu se češće nego inače mogu naći noviji uvezeni automobili.
          points:
            - Luka je blizu, pa je slanje jednostavnije i jeftinije
            - Mnogo automobila iz severnih pokrajina sa kilometražom pretežno pređenom na autoputu
            - 'Vlažna morska klima: pažljivije pregledamo karoseriju i skrivene šupljine'
        dusseldorf:
          lead: Centar Severne Rajne-Vestfalije, najmnogoljudnije nemačke pokrajine. Auto-placevi su blizu jedni drugima, a do granice sa Holandijom i Belgijom ima sat vremena vožnje, pa se automobili odatle redovno dovode na prodaju.
          points:
            - Možemo da pogledamo nekoliko automobila u jednom izlasku, jer su placevi blizu
            - 'Neki automobili imaju holandske ili belgijske tablice: njihovu istoriju i dokumentaciju proveravamo zasebno'
            - Mnogo je prodavaca koji se međusobno nadmeću, pa su spremniji na cenkanje
        belgrade:
          lead: Naša baza. U Beogradu izlazimo na pregled istog dana kada nam se javite, poznajemo lokalne prodavce i znamo koji automobil već drugi mesec kruži po placevima.
          points:
            - Pregled istog dana, bez čekanja i komplikovane logistike
            - Poznajemo lokalne placeve i istoriju automobila koji se tamo prodaju
            - Automobil je već ocarinjen, pa uvoz i carine nisu potrebni
        novi-sad:
          lead: Drugi po veličini grad u Srbiji, na sat vremena vožnje od Beograda. Tržište je manje, ali su cene obično povoljnije nego u prestonici, a automobili su ređe prošli kroz više preprodaja.
          points:
            - Cene su niže nego u Beogradu, uz uporedivo stanje vozila
            - Manje preprodavaca, češće se nailazi na prvog vlasnika
            - Dolazimo iz Beograda, bez dodatne naknade za put
        pancevo:
          lead: Pančevo je praktično deo beogradske metropolitanske oblasti, pa se pregled ovde ne razlikuje od onog u prestonici. Tržište je malo, ali privatni oglasi umeju da budu zanimljiviji.
          points:
            - Dvadeset minuta od Beograda, možemo brzo da dođemo
            - Malo tržište na kojem preovlađuju privatni prodavci
            - Često povoljnije nego u prestonici, uz isto stanje vozila
        subotica:
          lead: 'Subotica se nalazi na granici sa Mađarskom, što se vidi i na tržištu: mnogo je automobila uvezenih iz EU i prodavaca koji se time stalno bave.'
          points:
            - Pogranično tržište sa mnogo novijih automobila uvezenih iz EU
            - Posebno pažljivo proveravamo istoriju vozila pre uvoza
            - Praktična lokacija ako planirate da automobil vozite dalje na sever
        madrid:
          lead: Najveće tržište automobila u Španiji, sa ogromnim izborom i mnogo vozila iz korporativnih flota. Zbog kontinentalne klime, korozije od mora ima manje nego na obali.
          points:
            - Najveći izbor u Španiji, uključujući vozila iz korporativnih flota
            - Daleko od mora, karoserije su obično očuvanije nego na obali
            - 'Vrela leta: posebno proveravamo plastiku, lak i klima-uređaj'
        barcelona:
          lead: Blizina mora je presudna. Automobili često odozdo izgledaju odlično, ali skrivene šupljine i elektrika zahtevaju posebnu pažnju.
          points:
            - 'More je blizu, pa proveravamo skrivene šupljine: odozdo često izgledaju čisto, ali iznutra ne'
            - Mnogo automobila koji su ranije bili u rent-a-car ili car-sharing floti
            - Luka je blizu, pa se prevoz morem lakše organizuje
        zurich:
          lead: Cirih je najskuplje automobilsko tržište u regionu. Kupci biraju najviši nivo opreme, automobile servisiraju kod dilera i prodaju ih pre nego što stignu da se istroše.
          points:
            - Najviši paketi opreme i mala kilometraža
            - Servisiranje kod dilera, istorija je gotovo uvek kompletna
            - Švajcarska nije u EU, pa se uvoz reguliše zasebno
        geneva:
          lead: Ženeva se nalazi u frankofonom delu Švajcarske, tik uz granicu sa Francuskom. Na tržištu ima znatno više francuskih marki nego u nemačkom delu zemlje.
          points:
            - 'Mešovito tržište: švajcarsko stanje, francuski izbor'
            - Granica sa Francuskom je blizu, pa se cene mogu uporediti
            - 'Procedura je ista kao u ostatku Švajcarske: izvoz pa uvoz'
        paris:
          lead: 'Najveći izbor u Francuskoj prati i najintenzivnija upotreba: gust saobraćaj i tesna parking mesta ostavljaju tragove na karoseriji i vešanju.'
          points:
            - Najveći izbor u Francuskoj, posebno francuskih marki
            - 'Gradska vožnja: kvačilo, vešanje i sitna oštećenja karoserije'
            - Mnogo dizelaša, prvo proveravamo DPF i EGR
        lyon:
          lead: Lion je mirniji od Pariza, i po cenama i po stanju automobila. Autoput ka jugu je blizu, pa se češće nailazi na automobile sa ujednačenom kilometražom pređenom na otvorenom putu.
          points:
            - Cene su niže nego u Parizu, uz sličan izbor
            - Više kilometara pređenih na otvorenom putu, manje gradske istrošenosti
            - Praktična lokacija za pretragu šireg područja, uključujući Italiju i Španiju
        milan:
          lead: 'Poslovna prestonica Italije, što se vidi i po cenama na tržištu. Uslovi na severu zemlje bliži su nemačkim: putevi su bolji, a automobili očuvaniji nego na jugu.'
          points:
            - Najbolji izbor automobila premium klase u Italiji
            - Na severu ima manje soli i korozije nego na jugu zemlje
            - 'Gust saobraćaj u gradu: obavezno merimo debljinu laka na svim panelima'
        rome:
          lead: Veliko tržište na kojem se automobili intenzivno koriste u gradskoj vožnji. Sitne ogrebotine su uobičajene, a popravke se često rade na brzinu.
          points:
            - Mnogo malih automobila i vozila sa ugrađenim gasnim uređajem
            - Česta lokalna farbanja posle čukanje u gradu, proveravamo svaki panel
            - Klima je blaža nego u Milanu, ali je veća blizina mora
        warsaw:
          lead: Preko Varšave u Poljsku stiže najveći deo uvoza iz Zapadne Evrope, a ovde je i najveći izbor automobila u zemlji. Udeo popravljanih vozila je takođe najveći.
          points:
            - Najveći izbor u Poljskoj, mnogo novijih uvoznih automobila iz EU
            - Prvo proveravamo geometriju karoserije i tragove popravki
            - Kraća ruta za dostavu, jeftinije nego iz Južne Evrope
        krakow:
          lead: 'Krakov je mirniji od Varšave: tržište je manje, ima manje preprodavaca, a automobile češće duže zadržava isti vlasnik. Jug Poljske je logistički bliži Balkanu.'
          points:
            - Manje preprodavaca nego u Varšavi, istorija vozila je obično urednija
            - Cene su često niže nego u glavnom gradu
            - Bliže južnoj ruti, pogodno za dostavu u Srbiju
