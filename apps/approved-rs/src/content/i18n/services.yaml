      hub:
        metaTitle: Importación de autos desde Europa y China
        metaDescription: 'Importamos automóviles desde Alemania, España, Suiza y China a cualquier país: selección, inspección, entrega y aduana incluidos.'
        title: Importación de autos
        titleHighlight: desde Europa y China
        description: El coche está en Europa o China, y tú donde sea. Seleccionamos, inspeccionamos y lo traemos a ti, incluyendo la aduana.
        breadcrumbLabel: Importación de autos
        casesHeading: Casos de importación
        euCardTitle: Desde Europa
        euCardText: 'España, Suiza y otros países: selección y entrega a cualquier lugar.'
        chinaCardTitle: Desde China
        chinaCardText: 'Autos nuevos y usados desde China: entrega a través de un socio verificado.'
        exploreLabel: Más información
        ctaLabel: Calcular importación
        heroPhotoAlt: Transportador de autos cargado
        processHeading: Cómo se realiza la importación
        processLead: Normalmente, desde la solicitud hasta la entrega pasan de cuatro a ocho semanas, y el transporte toma el menor tiempo. Desde Alemania a Belgrado, el vehículo tarda unos días; la aduana y el registro pueden tardar semanas.
        processSteps:
          - n: '01'
            text: 'Calculamos el costo total antes de comenzar: coche, logística, aranceles, documentación.'
          - n: '02'
            text: Buscamos y verificamos el automóvil en el país de origen.
          - n: '03'
            text: Compramos el coche a través de nuestra empresa europea, lo damos de baja y preparamos la documentación de exportación.
          - n: '04'
            text: Lo transportamos en un camión o lo llevamos por nuestra cuenta con números de tránsito.
          - n: '05'
            text: Pasamos por la aduana, realizamos el registro y te entregamos las llaves.
        includedHeading: ¿Qué incluye el precio?
        includedLead: 'Al importar por tu cuenta, a menudo sobrepasa el presupuesto el costo adicional al precio del coche. Lo calculamos por adelantado y lo fijamos: el total no debe diferir del primer cálculo.'
        included:
          - title: Costo del automóvil
            text: 'Precio después de la negociación, no del anuncio. Negociamos con el vehículo en la vista: esto suele cubrir parte de los gastos.'
          - title: Logística hasta el destino
            text: Camión o transporte con números de tránsito. Calculamos ambas opciones y elegimos la más económica para el tramo específico.
          - title: Aranceles e impuestos
            text: 'La tasa depende del país de origen del automóvil y su antigüedad. Para vehículos de producción europea, el certificado EUR1 cambia el cálculo de manera significativa: verificamos su existencia antes de la compra.'
          - title: Exportación y tránsito
            text: Baja del registro en el país del vendedor, declaración de exportación, números de tránsito y seguro durante la conducción.
          - title: Trámites aduaneros
            text: Declaración, agente de aduanas y pago en el lugar de llegada. Preparamos el paquete con antelación para que el coche no esté en el almacén más días de los necesarios.
          - title: Registro
            text: Inspección técnica, registro y números. Recibes el coche listo para conducir.
