        exploreLabel: Más información
        ctaLabel: Calcular la importación
        heroPhotoAlt: Camión portacoches cargado
        processHeading: Cómo funciona la importación
        processLead: Desde la solicitud hasta la matriculación suelen pasar entre cuatro y ocho semanas, y el transporte es lo que menos tarda. El coche llega de Alemania a Belgrado en unos días, pero la aduana y la matriculación llevan semanas.
        processSteps:
          - n: '01'
            text: 'Calculamos el coste total antes de empezar: coche, transporte, aranceles y trámites'
          - n: '02'
            text: Buscamos y revisamos el coche en el país de origen
          - n: '03'
            text: Compramos el coche a nombre de nuestra empresa europea, tramitamos la baja y preparamos la documentación de exportación
          - n: '04'
