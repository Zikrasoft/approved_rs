            - El certificado EUR1 confirma el origen y reduce el arancel
            - 'Normas de emisión uniformes: un coche de cualquier país de la UE pasa la ITV de la misma manera'
            - Cuanto más corta es la distancia, más rentable es conducir en lugar de usar un transportador
