        includedHeading: Componentes del precio
        includedLead: 'Al importar por tu cuenta, el presupuesto suele verse afectado por lo que sobrepasa el precio del coche. Lo calculamos de antemano y lo fijamos: el total no debe diferir de la primera estimación.'
        included:
          - title: Precio del automóvil
            text: Precio tras la negociación, no el del anuncio. Negociamos con lo que encontramos en la revisión — esto suele compensar parte de los gastos.
