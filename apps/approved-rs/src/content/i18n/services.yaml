    vehicle-inspection:
      title: Provera automobila
      description: Nezavisna provera vozila pre kupovine. Dolazak stručnjaka, dijagnostika, izveštaj — bez obaveze kupovine.
      ctaLabel: Zatraži proveru
      casesHeading: Primeri provere
      breadcrumbLabel: Provera automobila
      steps:
        - n: '01'
          text: Karoserija i lak – prisustvo popravki ili nezgoda
        - n: '02'
          text: Osa, suspenzija, kočnice
        - n: '03'
          text: Motor, menjač, transmisija
        - n: '04'
          text: Elektronika i istorija servisiranja po VIN-u
        - n: '05'
          text: Pravna čistoća – zalozi, zabrane registracije, nezgode
      extraLine: Radimo i u drugim zemljama Evrope, uključujući Portugaliju — proverite prilikom prijave.
      hub:
        metaTitle: Provera automobila pre kupovine u Evropi
        metaDescription: 'Dolazimo do automobila koji ste sami našli: merač debljine, skener, provera istorije po VIN-u i izveštaj sa slikama istog dana. Radimo u osam zemalja Evrope.'
        title: Provera automobila
        titleHighlight: pre kupovine
        description: "Dolazimo do automobila koji ste sami našli i objašnjavamo šta se zapravo događa. Izveštaj dolazi pre nego što predate novac: ako odgovor bude 'ne kupovati', gubite samo troškove provere."
        breadcrumbLabel: Provera automobila
        casesHeading: Primeri provere
        chooseCountryLabel: 'Izaberite zemlju:'
        ctaLabel: Zatraži proveru
        heroPhotoAlt: Automobil na dizalici u servisu
        processHeading: Kako se odvija provera
        processLead: Obično dolazimo u roku od jedan do dva dana nakon prijave. Samo pregled traje sat i po do dva, izveštaj šaljemo istog dana, dok automobil još nije otišao drugom kupcu.
        processSteps:
          - n: '01'
            text: Šaljete link na oglas i kontakt informacije prodavca
          - n: '02'
            text: Dogovaramo se sa prodavcem o vremenu i mestu pregleda
          - n: '03'
            text: Dolazimo sa meračem debljine i skenerom. Za BMW povezujemo se na dealersku ISTA, kada je potrebno — na dizalicu
          - n: '04'
            text: Snimamo slike i video svih nalaza, proveravamo istoriju po VIN-u
          - n: '05'
            text: Šaljemo izveštaj i direktan odgovor — uzeti, pregovarati ili odustati
        includedHeading: Šta je uključeno u proveru
        includedLead: 'Preko sto stavki na kontrolnom spisku, ali se skoro uvek fokusiramo na četiri oblasti: karoserija, motor sa menjačem, osovina i dokumenti. Upravo po njima najčešće savetujemo protiv kupovine.'
        included:
          - title: Karoserija i lak
            text: Merač debljine na svakoj paneli, geometrija otvora, tragovi zavarivanja i špatulje. Vidljivo je da li je bilo popravki o kojima prodavac nije obavestio.
          - title: Motor i menjač
            text: Parametri na zagrejanom motoru, adaptacija menjača, greške u memoriji blokova. Najskuplja oblast i najčešći razlog odbijanja.
          - title: Osa i kočnice
            text: Igra, stanje suspenzije i kočionog sistema. Autoban kilometraža i balkanske ceste različito utiču na vozilo, i to je primetno.
          - title: Elektronika i istorija po VIN-u
            text: Izveštaj CarVertical, dealerska servisna istorija po marki, razlika u kilometraži sa istorijom, greške blokova i tragovi od aktiviranih vazdušnih jastučića.
          - title: Pravna čistoća
            text: Zalozi, zabrane registracije, otvorene nezgode i osiguravajući događaji — sve što ispliva nakon kupovine.
          - title: Izveštaj sa slikama i videima
            text: Svaki nalaz je snimljen i potpisan. Izveštaj ostaje kod vas — lako je pregovarati, čak i ako na kraju ipak kupite automobil.
        compareHeading: Šta se menja od zemlje do zemlje
        compareLead: Regulativa tehničkog pregleda, tipične mane lokalnih automobila i načini skrivanja istorije svuda su slični.
        compareHint: Izaberite zemlju — prikazaćemo šta dodajemo na uobičajeni kontrolni spisak.
        compareLinkFor: Provera {location} — detaljno
        mapHeading: Četiri oblasti koje odlučuju o transakciji
        mapLead: Kontrolni spisak je dug, ali skoro uvek savetujemo protiv kupovine zbog jedne od četiri oblasti. Kliknite broj na shemi — prikazaćemo šta stručnjak proverava i šta smo tamo pronašli.
      countryNotesHeadingFor: Kako proveravamo {location}
      countryNotesPointsLabel: Šta proveravamo osim uobičajenog kontrolnog spiska
      countryNotes:
        de:
          lead: 'U Nemačkoj imamo na šta da se oslonimo: servisna knjiga, protokoli HU i razvijene baze po VIN-u. Zato je provera ovde pre svega usklađivanje dokumenata sa onim što pokazuje vozilo.'
          points:
            - Proveravamo oznake dealerskog servisiranja sa očitavanjem odometra tokom godina
            - Zapažanja prošlosti HU — šta je popravljeno nakon pregleda, a šta je samo privedeno kraju
            - Donji deo i pragovi nakon zimskih reagenata, uključujući skrivene prostore
            - 'Lizing istorija: redovno održavanje pri velikim kilometrima'
        rs:
          lead: 'U Srbiji dolazimo na dan zahteva. Glavni zadatak je rekonstruisati istoriju vozila do uvoza: lokalni dokumenti pokazuju samo poslednji deo života automobila.'
          points:
            - Zemlja porekla i stanje vozila pre uvoza u Srbiju
            - Očitavanje odometra u odnosu na oznake tehničkog pregleda iz prethodnih godina
            - Popravka karoserije nakon uvoza — to se često i jeftinije radi nego u EU
            - 'Pravna strana: zalozi i ograničenja na registraciju'
        es:
          lead: Španski automobili obično oduševljavaju donjim delom, a razočaravaju svime što pati od sunca i soli. Fokusiramo se na skrivene prostore, elektriku i stanje enterijera.
          points:
            - Korozija u skrivenim prostorima uz obalu — s donje strane može delovati čisto
            - Lak, brtve i plastika nakon višegodišnjeg izlaganja suncu
            - 'Istorija iznajmljivanja: upoređujemo kilometražu sa karakteristikama habanja enterijera'
            - Protokol ITV i šta je ostalo otvoreno između pregleda
        ch:
          lead: Za MFK u Švajcarskoj se automobili ozbiljno pripremaju, tako da svež protokol sam po sebi malo šta govori. Gledamo šta je urađeno neposredno pre pregleda, a šta živi svojim životom od prošle godine.
          points:
            - Šta je zamenjeno neposredno pre MFK — sveži delovi u odnosu na ostalo
            - Održavanje je skupo, pa proveravamo da li su odlagali redovno servisiranje
            - Opremanje je bogato, ali proveravamo da li svaka opcija i dalje funkcioniše
            - 'Dokumenti za uvoz: Švajcarska nije EU, paket se razlikuje'
        pt:
          lead: 'Sve ovde zavisi od vlažne morske klime. Proveru započinjemo sa korozijom i elektrikom: obično izda ono što živi u vlažnosti.'
          points:
            - Skriveni prostori, bočni nosači i tačke pričvršćivanja suspenzije
            - Oksidacija konektora i blokova — tipičan uzrok sporadičnih grešaka
            - Protokol IPO i učestalost pregleda
            - 'Dizeli u gradskoj eksploataciji: filter čađi i njegova istorija'
        fr:
          lead: 'U Francuskoj detaljan contrôle technique, i to je dobra polazna tačka. Onda gledamo na ono što regulativa ne hvata: resurs dizel grupe i habanje od gradskog saobraćaja.'
          points:
            - Zapažanja contrôle technique tokom godina — šta se ponavlja iz pregleda u pregled
            - Filter čađi, EGR i turbina na dizel motorima
            - Kvačilo i suspenzija nakon gustog gradskog ciklusa
            - 'Istorija po francuskim markama: delovi su dostupni, ali imaju svoje slabe tačke'
        it:
          lead: Italijanski automobili češće dolaze sa sitnim popravkama karoserije, urađenim brzo i jeftino. Na meraču debljine panela ovde je potrebno znatno više vremena nego obično.
          points:
            - Merač debljine na svim panelima — farbanja nakon urbanih udarca
            - 'Razlika između severa i juga: so uz obalu, uobičajeno habanje u unutrašnjosti'
            - Plin osetljivi sistem, ako postoji — instalacija i stanje rezervoara
            - Učestalost revisione i propušteni periodi
        pl:
          lead: Poljska je najveće prekomerno tržište za oštećene automobile iz Zapadne Evrope. Zato prvo utvrđujemo šta je sa ovom karoserijom rađeno pre prodaje.
          points:
            - Geometrija otvora i tragovi zavarivanja — obnova posle ozbiljne nezgode
            - 'Istorija uvoza: odakle je vozilo došlo i u kakvom stanju'
            - Kilometražu proveravamo sa evropskim servisnim bazama, odometru ne verujemo
            - Vazdušni jastučići i njihovo aktiviranje u prošlosti
      closing:
        eyebrow: Pronašli ste automobil?
        line1: Pošaljite link
        line2: na oglas —
        accentWord: doći ćemo i proveriti
        text: Dolazimo za jedan do dva dana. Izveštaj sa slikama ostaje kod vas, čak i ako nakon njega odustanete od kupovine.
    cityVehicleSourcing:
      title: Auto izbor
      descriptionFor: Pronaći ćemo automobil {cityLocation} uz potpunu proveru. Radimo u čitavom regionu {countryName}.
      casesHeadingFor: Slučajevi iz {countryGenitiveOrName}
      whyCityHeadingFor: Zašto {cityName}
      reason1: Istražujemo i dilerske platforme i privatne oglase
      reason2: Proveravamo istoriju na osnovu VIN-a pre nego što krenemo na pregled
      reason3For: Naš ekspert {cityLocation}
      reason4Dekra: DEKRA / TÜV provere na zahtev
      reason4Generic: Nezavisna tehnička ekspertiza na zahtev
      otherCitiesLabelFor: 'Ostali gradovi {countryLocation}:'
      cityNotesHeadingFor: Automobilsko tržište {cityLocation}
      cityNotesPointsLabel: Šta to donosi u praksi
      cityNotes:
        berlin:
          lead: 'U Berlinu je najveći izbor u Nemačkoj i najraznovrsnija ponuda prodavaca. Ovde se može pronaći sve: od automobila iz korporativnih flota sa punom istorijom do preprodaja koje su stigle iz Istočne Evrope.'
          points:
            - Ogroman izbor u svim segmentima, uključujući retke opreme
            - Mnogi privatni prodavci — pregovaranje je realnije nego kod dilera
            - 'Gradski uslovi: spojnice i ovSuspension brže se troše nego kod automobila korišćenih na autoputevima'
        munich:
          lead: 'Skupi grad sa skupim automobilima. Premium segment ovde je veći nego bilo gde drugde u Nemačkoj, a stanje automobila je u proseku bolje: o njima se dobro brine.'
          points:
            - Snažan premium segment, posebno BMW i Mercedes
            - Održavani automobili sa punom dilerskom istorijom
            - Cene su više od proseka u zemlji — ušteda dolazi uz bolje stanje
        hamburg:
          lead: Lučki grad i veliki logistički čvor. Odatle je lako poslati automobil dalje, a na tržištu se često nalaze sveži uvezeni automobili.
          points:
            - Luka u blizini — lakše i jeftinije organizovati isporuku
            - Mnogi automobili iz severnih krajeva sa putnim pređenim kilometrazima
            - 'Vlažna morska klima: obratite više pažnje na karoseriju i skrivene prostore'
        belgrade:
          lead: Naša baza. U Beogradu odlazimo na pregled na dan zahteva, poznajemo lokalne prodavce i vidimo koja automobili već dva meseca cirkulišu po platformama.
          points:
            - Pregled na dan zahteva, bez čekanja i logistike
            - Poznajemo lokalne platforme i istoriju automobila koji su tu
            - Automobil je već uvezen — carina i takse nisu potrebne
        novi-sad:
          lead: Drugi po veličini grad Srbije, sat vožnje od Beograda. Tržište je manje, ali su cene obično mirnije nego u glavnom gradu, a automobili ređe prolaze kroz nekoliko preprodaja.
          points:
            - Cene su niže od beogradskih uz uporedivo stanje
            - Manje preprodavaca, češće prvi vlasnici
            - Krećemo iz Beograda, nemamo dodatne troškove za put
        pancevo:
          lead: Pančevo praktično spada u beogradsku aglomeraciju, tako da su pregledi ovde slični beogradskim. Tržište je manje, ali su privatni oglasi zanimljiviji.
          points:
            - Dvadeset minuta od Beograda — stižemo brzo
            - Malo tržište sa pretežno privatnim prodavcima
            - Često je jeftinije od Beograda uz isto stanje
        subotica:
          lead: 'Subotica se nalazi na granici sa Mađarskom, što se vidi i na tržištu: ima mnogo automobila uvezenih iz EU, kao i prodavaca koji se time često bave.'
          points:
            - Granično tržište — mnogo svežeg uvoza iz Evropske unije
            - Proveravamo istoriju do uvoza posebno temeljno
            - Povoljna tačka ako planirate voziti na sever
        madrid:
          lead: 'Glavno tržište Španije: najveći izbor u zemlji i mnogo automobila iz korporativnih flota. Kontinentalna klima, pa je morska korozija ovde manja nego na obali.'
          points:
            - Najveći izbor u Španiji, uključujući korporativna vozila
            - Daleko od mora — karoserije su obično čistije nego na obali
            - 'Vruće leto: proveravamo plastiku, lak i klima uređaj posebno'
        barcelona:
          lead: Sve određuje blizina mora. Automobili često dobro izgledaju sa donje strane, ali traže pažnju na skrivenim delovima i elektrici.
          points:
            - 'More u blizini, zato proveravamo skrivene prostore: sa donje strane često je čisto, a iznutra nije'
            - Puno nekadašnjih iznajmljenih i car sharing automobila
            - Luka u blizini, slanje morem se organizuje lakše
        zurich:
          lead: Cirih je najskuplje automobilsko tržište u regionu. Oprema ovde uvek bude maksimalna, održavaju se kod dilera, a prodaju se pre nego što automobil postane star.
          points:
            - Maksimalna oprema i mala kilometraža
            - Dilerska usluga — istorija gotovo uvek puna
            - Švajcarska nije deo EU, uvoz se obrađuje posebno
        geneva:
          lead: Ženeva se nalazi u frankofonoj deo Švajcarske, blizu granice sa Francuskom. Francuske marke su mnogo prisutnije na tržištu nego u nemačkom delu zemlje.
          points:
            - 'Mešovito tržište: švajcarsko stanje, francuski asortiman'
            - Granica sa Francuskom u blizini — ima upoređivanja po ceni
            - 'Obrada je kao u celoj Švajcarskoj: izvoz plus uvoz'
        paris:
          lead: 'Najveći izbor u Francuskoj dolazi sa najtežim korišćenjem: gust saobraćaj i uske parking prostore ostavljaju svoje tragove na karoseriji i suspenziji.'
          points:
            - Najveći izbor u Francuskoj, posebno francuskih marki
            - 'Gradski uslovi: spojnice, suspenzija i sitne oštećenja na karoseriji'
            - Puno dizela — proveravamo filter za čađu i EGR u prvom redu
        lyon:
          lead: Lijon je mirniji od Pariza i po cenama i po stanju automobila. Autoput prema jugu je blizu, pa se automobili češće nalaze sa ravnom putnom kilometražom.
          points:
            - Cene su niže od pariskih uz sličan izbor
            - Više putnih kilometara, manje trošenja u gradu
            - Povoljan put do Italije i Španije ako se traži šire
        milan:
          lead: 'Poslovna prestonica Italije, što se vidi i na tržištu. Sever zemlje je bliži nemcima uslovima: ceste su bolje, a automobili održavaniji nego na jugu.'
          points:
            - Najbolji izbor premium segmenta u Italiji
            - Sever — manje soli i korozije nego na jugu zemlje
            - 'Gust grad: merni instrumenti za debljinu panela su obavezni'
        rome:
          lead: Veliko tržište sa veoma gustim urbanim korišćenjem. Sitna oštećenja se ovde smatraju normalnim fenomenom, i često se brzo popravljaju.
          points:
            - Puno mini automobila i automobila sa plinskim uređajima
            - Česte popravke nakon urbanih kontakata — proveravamo svaku stranu
            - Južnije od Milana — klima je blaža, ali bliža moru
        warsaw:
          lead: Kroz Varšavu ulazi glavni uvoz iz Zapadne Evrope, a ovde je i najveći izbor u Poljskoj. Udeo obnovljenih automobila je takođe najviši.
          points:
            - Najveći izbor u Poljskoj, puno svežeg uvoza iz EU
            - Proveravamo geometriju karoserije i tragove popravki kao prioritet
            - Kratko vreme isporuke — jeftinije nego iz Južne Evrope
        krakow:
          lead: 'Krakov je mirniji od Varšave: tržište je manje, preprodaja manje, a automobili ređe ostaju kod jednog vlasnika duže. Jug Poljske je bliži Balkanu sa aspekta logistike.'
          points:
            - Manje preprodavaca nego u Varšavi, istorija obično čistija
            - Cene često niže od glavnog grada
            - Bliži trasama prema jugu — zgodno za dostavu u Srbiju
