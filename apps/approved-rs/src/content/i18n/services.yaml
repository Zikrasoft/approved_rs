  es:
    vehicle-sourcing:
      hub:
        metaTitle: Selección de coches en Europa llave en mano
        metaDescription: 'Buscamos coches en Alemania, Serbia, España, Suiza, Italia, Francia, Polonia y Portugal: búsqueda, inspección, negociación y entrega llave en mano.'
        title: Selección de coches
        titleHighlight: llave en mano
        description: Seleccionamos un vehículo en el país donde te encuentras o planeas comprar, incluyendo verificación completa, acompañamiento en la transacción y entrega llave en mano. Elige un país para ver más detalles.
        breadcrumbLabel: Selección de coches
        casesHeading: Casos de selección de coches
        chooseCountryLabel: 'Elige un país:'
        ctaLabel: Seleccionar coche
        heroPhotoAlt: Una fila de coches en el lote de un concesionario
        processHeading: Cómo va la selección
        processLead: 'Desde la solicitud hasta las llaves, generalmente toman de dos a cuatro semanas. Donde más tiempo buscamos es en el coche: no tomamos el primer que se ajusta y seguimos buscando hasta encontrar uno que no genere dudas tras la verificación.'
        processSteps:
          - n: '01'
            text: 'Discutimos el presupuesto, la marca y los requisitos: qué es importante y qué estaríamos dispuestos a sacrificar.'
          - n: '02'
            text: Filtramos opciones en el lugar y descartamos por teléfono todo lo que no resiste el cuestionamiento.
          - n: '03'
            text: Realizamos la inspección con un medidor de espesor y escáner, para BMW conectamos el ISTA del concesionario, tomamos fotos y vídeos.
          - n: '04'
            text: Enviamos un informe y decimos claramente si vale la pena comprarlo o debemos buscar más.
          - n: '05'
            text: Negociamos, formalizamos la transacción y te entregamos el coche o lo llevamos a tu puerta.
        includedHeading: Qué incluye el servicio
        includedLead: La comisión se establece antes de comenzar y no depende de cuántos coches hay que revisar. Si después de la verificación decimos 'no compres', seguimos buscando y no necesitas pagar extra por eso.
        included:
          - title: Búsqueda sin límite en la cantidad de opciones
            text: Trabajamos hasta encontrar un coche que no tenga reclamaciones. Renunciar a una opción fallida está incluido en el servicio y no cuesta nada adicional.
          - title: Visita de un experto a cada inspección
            text: 'Medidor de espesor en paneles, escáner en bloques, elevador allí donde lo necesitemos. Fotos y vídeos de todos los lugares problemáticos: verás lo mismo que nosotros.'
          - title: Verificación de historia y limpieza jurídica
            text: Informe de CarVertical por VIN, historial de servicio de concesionario por marca, verificación de kilometraje, gravámenes, restricciones de registro y eventos de seguro no cerrados.
          - title: Negociación y formalización de la transacción
            text: Negociamos el precio teniendo en cuenta lo que hemos encontrado, preparamos los documentos y acompañamos la firma.
          - title: Entrega y registro
            text: Llevamos el coche a tu ciudad y ayudamos con la documentación en el lugar — o te entregamos las llaves donde te sea conveniente recogerlo.
          - title: Una persona para todo el proceso
            text: Tendrás al mismo especialista que fue a la inspección. No necesitas explicar nuevamente la tarea a cada persona que conteste el teléfono.
        compareHeading: Cómo se diferencian los mercados entre sí
        compareLead: El mismo modelo en Alemania y Polonia — por historia y precio, son dos coches diferentes.
        compareHint: Elige un país — te mostraremos qué estamos mirando allí primero.
        compareLinkFor: Selección en {location} — en detalle
      title: Selección de coches llave en mano
      descriptionFor: Seleccionaremos un vehículo en {location} — entre los coches que ya están en este país, sin importación del extranjero. Verificación completa, acompañamiento de la transacción y entrega a tu ciudad — llave en mano, incluyendo el despacho aduanero.
      ctaLabel: Enviar solicitud
      casesHeadingFor: 'Casos: selección de coches en {location}'
      breadcrumbLabelFor: Coches en {location}
      stepsFor:
        - n: '01'
          text: 'Envías una solicitud con tus requisitos: presupuesto, marca, kilometraje.'
        - n: '02'
          text: Buscamos opciones en {location} según tus criterios.
        - n: '03'
          text: Un experto independiente inspecciona y verifica el coche.
        - n: '04'
          text: Acompañamos la transacción, ayudamos con la documentación y el registro.
        - n: '05'
          text: Entregamos el coche a tu ciudad — llave en mano, incluyendo el despacho aduanero.
      deliveryLineFor: Entregamos en {destinations} — y en cualquier otro país, lo discutiremos al hacer la solicitud.
      deliveryDestinations:
        - Rusia
        - Kazajistán
        - Kirguistán
        - Ucrania
        - Bielorrusia
        - Bosnia y Herzegovina
        - Croacia
        - Macedonia del Norte
        - Turquía
      citiesHeadingFor: Dónde inspeccionamos coches en {countryLocation}
      citiesLead: El experto se desplaza por todo el país, pero generalmente inspeccionamos coches donde hay más disponibles. Esto es lo que significa para cada ciudad.
      alsoInLabel: 'También seleccionamos en:'
      crossSellLabel: ¿Necesitas un coche que no sea local?
      countryNotesHeadingFor: Qué consideramos en {location}
      countryNotesPointsLabel: En qué nos fijamos primero
      countryNotes:
        de:
          lead: 'Aquí hay más opciones que en cualquier otro mercado de Europa, y la historia de mantenimiento suele ser rastreable: la mayoría de los coches tienen un libro de servicio con marcas del concesionario para cada mantenimiento. La contrapartida son los kilómetros en autopista. Doscientos mil en tres años son la norma aquí, no un motivo para un descuento.'
          points:
            - Libro de servicio y marcas del concesionario — verificamos por VIN en el servicio oficial
            - Protocolo HU, que todos llaman TÜV — leemos las observaciones de la última inspección, no solo el sello
            - 'Coches de leasing y flotas corporativas: están bien mantenidos, pero los kilometrajes son altos'
            - Las carreteras invernales con productos químicos — revisamos el chasis y los umbrales por separado
        rs:
          lead: Aquí estamos en el lugar, por lo que inspeccionamos el coche el mismo día que se solicita y sin importación. El mercado es pequeño, el mismo coche puede pasar por varios vendedores, y la historia debe desenredarse.
          points:
            - El coche ya está despachado y con matrículas locales — no hay aranceles ni trámites de importación necesarios
            - El kilometraje a menudo se corrige durante la reventa dentro del país — verificamos con las marcas del techinf
            - Muchos coches importados de Alemania e Italia — verificamos qué le ha pasado al coche antes de la importación
            - Inspección el día de la solicitud, sin esperar la logística
        es:
          lead: El invierno es suave y casi no hay productos químicos en las carreteras, por lo que el chasis de los coches españoles suele estar en mejor estado que los alemanes. Sin embargo, el sol y la cercanía al mar afectan la pintura, el plástico y todos los elementos de goma.
          points:
            - La costa — buscamos corrosión principalmente en cavidades ocultas
            - Barniz desgastado y plástico del interior agrietado — consideramos esto en el precio
            - 'Muchos coches de alquiler previos: kilometraje recto, pero uso intensivo'
            - Protocolo ITV — comparamos observaciones y fechas de inspección
        ch:
          lead: 'Los coches suizos suelen estar en mejor estado que el promedio en Europa: el costoso mantenimiento disciplina, además los kilometrajes son bajos. Pero Suiza no está en la UE, así que la importación se gestiona de manera diferente, y esto se incluye en el presupuesto de antemano.'
          points:
            - Equipamientos lujosos — aquí son más comunes que en los países vecinos
            - MFK — la inspección es estricta y se prepara en serio, lo que se puede ver en el coche
            - 'No UE: la aduana y la documentación no se manejan de la misma manera que para los países de la Unión Europea'
            - Los precios son más altos que el mercado, pero luego ahorras en reparaciones
        pt:
          lead: El mercado es pequeño, la selección es más modesta que la española, pero la competencia por un buen coche es menor. El clima es húmedo y salado — la corrosión marina se encuentra incluso en coches nuevos.
          points:
            - Humedad y mar — cavidades ocultas y electricidad son prioridad en la inspección
            - 'Mercado pequeño: buscamos más según una solicitud específica que en Alemania'
            - Protocolo IPO — leemos las observaciones de inspecciones anteriores
            - Muchos diésel y coches pequeños, los coches de gran tamaño son raros
        fr:
          lead: Francia es sobre todo diésel y marcas propias. Peugeot, Renault y Citroën aquí son más baratos que en cualquier otro lugar de Europa. El premium alemán, por el contrario, es más caro, y no tiene mucho sentido comprarlo aquí.
          points:
            - Marcas francesas — mejor precio en Europa, y el mantenimiento es más barato
            - Diésel — revisamos el filtro de partículas y la válvula EGR como un punto aparte
            - Contrôle technique — los protocolos son detallados, verificamos las observaciones a lo largo de los años
            - 'Uso urbano: el embrague y la suspensión se desgastan más rápido de lo declarado'
        it:
          lead: 'El mercado italiano es bueno para coches pequeños y equipamientos raros, pero requiere precaución: aquí los coches se han utilizado intensamente, y las reparaciones de carrocería no siempre se realizan con cuidado.'
          points:
            - En la ciudad — frecuentes golpes menores y repintados, el medidor de espesor es obligatorio
            - El sur y la costa aportan sal y corrosión, el norte se acerca a las condiciones alemanas
            - Revisione — verificamos la regularidad, las omisiones son más habituales de lo normal
            - Muchos coches con equipamiento a gas — lo revisamos por separado
        pl:
          lead: 'El mercado más grande más cercano a nosotros: la logística es barata y corta. Pero Polonia ha sido durante años el principal punto de transbordo para coches dañados de Europa Occidental, por lo que aquí verificamos la historia con más rigor que en cualquier otro lugar.'
          points:
            - Alta proporción de coches restaurados después de accidentes — la geometría de la carrocería es prioritaria
            - 'Frecuentes revendas: el coche puede haber cambiado de dueño varias veces en un año'
            - El kilometraje se corrige con frecuencia al momento de la importación — verificamos con las bases de servicio
            - 'Óptimo tiempo de entrega: más barato y rápido que desde España o Portugal'
      closing:
        eyebrow: ¿Por dónde comenzamos?
        line1: Describe el coche que
        line2: estás buscando, —
        accentWord: a partir de aquí es nuestro trabajo
        text: Tu presupuesto, tipo de carrocería, tipo de transmisión, un par de deseos adicionales. Nosotros buscamos, y tú revisas los informes sobre las opciones y decides cuál inspeccionar en persona.
    vehicle-buyback:
      hub:
        metaTitle: Compra de autos con matrículas rusas en Europa
        metaDescription: Compramos autos con matrículas rusas en cualquier país de Europa y coches con matrículas serbias en Serbia. Valoración por fotos en una hora, pago el día de la firma.
        title: Compra de autos
        titleHighlight: sin regateos semanales
        description: 'Recogemos coches que son difíciles de vender por métodos convencionales: matrículas rusas, importación caducada, documentos en disputa. El precio es inferior al del mercado, esto es el costo por la rapidez y por asumir todas las dificultades de la venta.'
        breadcrumbLabel: Compra de autos
        casesHeading: Casos de compra
        chooseCountryLabel: 'Elija un país:'
        ctaLabel: Obtener valoración
        heroPhotoAlt: Llaves del coche sobre dinero y documentos
        processHeading: Cómo se realiza la compra
        processLead: Desde el primer mensaje hasta el pago suele tardar dos o tres días, y casi todo este tiempo se dedica al viaje hasta el punto de encuentro. Proporcionamos una valoración por fotos en un plazo de una hora.
        processSteps:
          - n: '01'
            text: Envía fotos, documentos y una descripción honesta del estado
          - n: '02'
            text: Te damos el precio en una hora — inmediato y definitivo, sin rango
          - n: '03'
            text: Concertamos un encuentro donde se encuentra el coche; si no está en funcionamiento, llegamos con un remolque
          - n: '04'
            text: Inspeccionamos en persona y confirmamos el precio, si la descripción coincide
          - n: '05'
            text: Firmamos el contrato y transferimos el dinero el día de la firma
        includedHeading: Qué asumimos
        includedLead: Por la diferencia entre nuestro precio y el del mercado, nos hacemos cargo de todo lo que hace que un coche no se venda durante meses.
        included:
          - title: Coches con matrículas rusas
            text: Categoría principal. El automóvil puede estar en cualquier país de Europa — iremos al lugar donde está, y nosotros nos encargamos de la exportación y posterior reventa.
          - title: Problemas con la importación y plazos
            text: Después de la firma, los riesgos de una importación temporal caducada pasan a ser nuestra responsabilidad.
          - title: Valoración sin inspección
            text: Damos un precio basado en fotos y documentos. Vamos al lugar solo cuando ambas partes han acordado el monto.
          - title: Formalización del negocio
            text: Nosotros preparamos el contrato, el desregistro y todos los documentos. De tu parte — documentos del coche y firma.
          - title: Pago el día de la firma
            text: Transferimos el dinero el mismo día. No tenemos esquemas de pagos a plazos o "pagaremos después de la reventa".
          - title: Negativa honesta
            text: Si el coche no nos conviene, lo diremos de inmediato y explicaremos la razón. No alargaremos el proceso ni intentaremos regatear.
      title: Compra de autos
      ctaLabel: Obtener valoración
      casesHeading: Casos de compra
      breadcrumbLabel: Compra de autos
      descriptionSerbia: Compramos vehículos con matrículas rusas por debajo del precio de mercado — el coche puede estar en cualquier país de Europa. También compramos autos con matrículas serbias en Serbia y Montenegro. Valoración en línea, formalización en 1 día, pago el día de la operación.
      descriptionOtherFor: Compramos vehículos con matrículas rusas por debajo del precio de mercado — el coche puede estar en cualquier país de Europa, incluyendo {name}. Valoración en línea, formalización en 1 día, pago el día de la operación.
