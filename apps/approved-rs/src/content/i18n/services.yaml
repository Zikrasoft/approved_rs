        includedHeading: Componentes del precio
        includedLead: 'Al realizar la importación por cuenta propia, el presupuesto suele romperse con lo que se suma al precio del coche. Lo calculamos de antemano y lo fijamos: el resultado no debe diferir del primer cálculo.'
        included:
          - title: Costo del vehículo
            text: El precio tras la negociación, no el de la publicación. Negociamos con el coche en la inspección; esto a menudo cubre parte de los gastos.
          - title: Logística al destino
            text: Transportador o conducción con matrícula de tránsito. Calculamos ambas opciones y elegimos la que es más beneficiosa para este tramo en particular.
          - title: Aranceles e impuestos
            text: La tarifa depende del país de origen del coche y su antigüedad. Para coches de fabricación europea, el certificado EUR1 cambia radicalmente el cálculo; verificamos su disponibilidad antes de la compra.
          - title: Exportación y tránsito
            text: Baja en el país del vendedor, declaración de exportación, matrículas de tránsito y seguro para la conducción.
          - title: Gestión aduanera
            text: Declaración, agente de aduanas y pago en el lugar de llegada. Preparamos el paquete de antemano para que el coche no se quede en el almacén más días de lo necesario.
          - title: Registro
            text: Inspección técnica, registro y matrículas. Recoge el coche y puedes salir inmediatamente.
