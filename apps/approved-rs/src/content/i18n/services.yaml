        processSteps:
          - n: '01'
            text: Pošaljite nam link do oglasa i kontakt prodavca
          - n: '02'
            text: Dogovaramo s prodavcem vreme i mesto provere
          - n: '03'
            text: Dolazimo s meračem debljine laka i dijagnostičkim skenerom. Za BMW koristimo fabrički sistem ISTA, a po potrebi automobil podižemo na dizalicu
          - n: '04'
            text: Fotografišemo i snimamo sve što pronađemo i proveravamo istoriju prema VIN broju
          - n: '05'
            text: 'Šaljemo izveštaj i jasan savet: kupiti, pregovarati o ceni ili odustati'
        includedHeading: Šta obuhvata provera
        includedLead: 'Kontrolna lista ima više od 100 stavki, ali su gotovo uvek ključne četiri oblasti: karoserija, motor i menjač, trap i dokumentacija. Upravo zbog njih najčešće savetujemo da se odustane od kupovine.'
        included:
          - title: Karoserija i lak
            text: Meračem debljine laka proveravamo svaki panel, geometriju otvora i tragove varenja i gitovanja. Tako otkrivamo da li je automobil popravljan, čak i ako prodavac to nije pomenuo.
          - title: Motor i menjač
            text: Proveravamo parametre zagrejanog motora, adaptacije menjača i greške sačuvane u kontrolnim jedinicama. Ovo je najskuplja oblast i najčešći razlog za odustajanje od kupovine.
          - title: Trap i kočnice
            text: Proveravamo zazore, stanje vešanja i kočionog sistema. Vožnja autoputem i balkanski putevi različito habaju automobil i to se vidi.
          - title: Elektronika i istorija prema VIN broju
            text: CarVertical izveštaj, servisna istorija kod ovlašćenih servisa za tu marku, odstupanja kilometraže u odnosu na istoriju, greške u upravljačkim jedinicama i tragovi aktiviranja vazdušnih jastuka.
          - title: Pravno stanje
            text: 'Zaloge, zabrane registracije, nerešene saobraćajne nezgode i osigurani slučajevi: sve ono što može da ispliva tek nakon kupovine.'
          - title: Izveštaj sa fotografijama i snimcima
            text: Svaki pronađeni problem je fotografisan i opisan. Izveštaj ostaje kod vas i može da vam pomogne u pregovorima, čak i ako ipak kupite automobil.
        compareHeading: Šta se razlikuje od zemlje do zemlje
        compareLead: Propisi tehničkog pregleda, tipični problemi lokalnih automobila i načini prikrivanja istorije razlikuju se od zemlje do zemlje.
        compareHint: Izaberite zemlju i pokazaćemo šta dodajemo standardnoj kontrolnoj listi.
        compareLinkFor: Detaljna provera za {location}
        mapHeading: Četiri oblasti koje odlučuju o kupovini
        mapLead: Kontrolna lista je duga, ali kupovinu najčešće ne preporučujemo zbog problema u jednoj od četiri oblasti. Kliknite na broj na šemi i pokazaćemo šta stručnjak proverava i šta smo tamo pronalazili.
      countryNotesHeadingFor: Kako proveravamo automobile u {location}
      countryNotesPointsLabel: Šta proveravamo povrh standardne kontrolne liste
      countryNotes:
        de:
          lead: U Nemačkoj imamo na raspolaganju servisnu knjižicu, izveštaje HU pregleda i razvijene VIN baze. Zato je provera prvenstveno usmerena na poređenje dokumenata sa stanjem automobila.
          points:
            - Upoređujemo evidenciju servisa kod ovlašćenog prodavca sa očitavanjima kilometraže po godinama
            - Proveravamo primedbe sa prethodnog HU pregleda i šta je nakon njega popravljeno, a šta samo privremeno sređeno
            - Podvozje i pragove oštećene zimskim posipnim sredstvima, uključujući skrivene šupljine
            - 'Istoriju lizinga: redovno održavanje uprkos velikoj kilometraži'
        rs:
          lead: U Srbiji možemo da izađemo na teren istog dana. Glavni zadatak je da utvrdimo istoriju automobila pre uvoza, jer lokalna dokumentacija obuhvata samo poslednji deo njegovog životnog veka.
          points:
            - Zemlju porekla i stanje automobila pre uvoza u Srbiju
            - Očitavanja kilometraže u poređenju sa evidencijom tehničkih pregleda iz prethodnih godina
            - Limarske popravke nakon uvoza, koje se rade češće i jeftinije nego u EU
            - 'Pravni status: zaloge i ograničenja registracije'
        es:
          lead: Kod automobila iz Španije podvozje je obično u dobrom stanju, ali sunce i so često oštete druge delove. Više pažnje posvećujemo skrivenim šupljinama, elektrici i enterijeru, a manje koroziji na podvozju.
          points:
            - Koroziju u skrivenim šupljinama u primorskim krajevima, čak i kada je podvozje čisto
            - Lak, zaptivke i plastiku oštećene višegodišnjim izlaganjem suncu
            - 'Istoriju korišćenja u rent-a-car službi: kilometražu upoređujemo sa istrošenošću enterijera'
            - Izveštaj ITV pregleda i nerešene nedostatke između pregleda
        ch:
          lead: Automobili se za MFK pregled temeljno pripremaju, pa sam svež izveštaj ne govori mnogo. Proveravamo šta je popravljeno baš pred pregled, a šta se vuče još od prošle godine.
          points:
            - Šta je zamenjeno neposredno pre MFK pregleda i da li se novi delovi razlikuju od ostatka automobila
            - Održavanje je skupo, pa proveravamo da li su redovni servisi odlagani
            - Automobili su bogato opremljeni, ali proveravamo da li svaka opcija i dalje radi
            - 'Dokumentaciju za uvoz: Švajcarska nije u EU, pa se potrebna dokumenta razlikuju'
        pt:
          lead: Ovde sve zavisi od vlažne morske klime. Proveru počinjemo od korozije i elektrike, jer vlagu najteže podnose delovi koji su joj izloženi.
          points:
            - Skrivene šupljine, uzdužne nosače i tačke pričvršćivanja vešanja
            - Oksidaciju konektora i upravljačkih jedinica, čest uzrok povremenih grešaka
            - Izveštaj IPO pregleda i redovnost obavljanja pregleda
            - 'Dizel automobile korišćene u gradskoj vožnji: filter čestica i njegovu istoriju'
        fr:
          lead: 'Francuski contrôle technique pruža detaljne informacije i dobra je polazna tačka. Zatim proveravamo ono što tehnički pregled ne otkriva: stanje dizel motora i istrošenost usled gradske vožnje.'
          points:
            - Primedbe sa contrôle technique pregleda po godinama i one koje se ponavljaju
            - Filter čestica, EGR ventil i turbinu kod dizelaša
            - Kvačilo i vešanje istrošene u intenzivnoj gradskoj vožnji
            - 'Istoriju za francuske marke: dostupnost rezervnih delova i karakteristične slabe tačke'
        it:
          lead: Automobili iz Italije češće od drugih imaju sitne limarske popravke, obavljene brzo i jeftino. Zato merenju debljine laka na panelima posvećujemo znatno više vremena nego inače.
          points:
            - Merimo debljinu laka na svim panelima i tražimo tragove popravki nakon ogrebotina u gradskoj vožnji
            - 'Razlike između severa i juga: so u primorskim krajevima, uobičajena istrošenost u unutrašnjosti'
            - 'Gasni sistem, ako je ugrađen: proveravamo ugradnju i stanje boce'
            - Redovnost revisione pregleda i propuštene termine
        pl:
          lead: Poljska je najveće tranzitno tržište za havarisane automobile iz Zapadne Evrope. Zato prvo utvrđujemo šta je rađeno na karoseriji pre prodaje.
          points:
            - Geometriju otvora i tragove varenja koji ukazuju na popravku nakon teške saobraćajne nezgode
            - 'Istoriju uvoza: odakle je automobil došao i u kakvom stanju'
            - Kilometražu proveravamo u evropskim servisnim bazama, ne oslanjamo se na odometar
            - Vazdušne jastuke i da li su ranije aktivirani
