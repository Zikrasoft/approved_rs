            text: Izbor opcija na licu mesta i filtriranje telefonom svega što ne ispunjava zahteve
          - n: '03'
            text: Odlazimo na provere sa meračem debljine i skenerom, za BMW povezujemo dealerovu ISTA, snimamo fotografije i video
          - n: '04'
            text: Šaljemo izveštaj i direktno kažemo da li da uzimate ili da tražimo dalje
          - n: '05'
            text: Torgujemo se, formiramo posao i predajemo vam automobil ili ga dovozimo na vaša vrata
        includedHeading: Šta je uključeno u uslugu
