  es:
    vehicle-sourcing:
      hub:
        metaTitle: Búsqueda de coches en Europa llave en mano
        metaDescription: 'Buscamos coches en Alemania, Serbia, España, Suiza, Italia, Francia, Polonia y Portugal: búsqueda, inspección, negociación y entrega llave en mano.'
        title: Búsqueda de coches
        titleHighlight: llave en mano
        description: Buscamos coches en el país donde vives o donde tienes previsto comprar. Incluye revisión completa, acompañamiento en la compra y entrega llave en mano. Elige un país para ver los detalles.
        breadcrumbLabel: Búsqueda de coches
        casesHeading: Casos reales de búsqueda de coches
        chooseCountryLabel: 'Elige un país:'
        ctaLabel: Buscar un coche
        heroPhotoAlt: Fila de coches en las instalaciones de un concesionario
        processHeading: Cómo funciona la búsqueda
        processLead: 'Desde la solicitud hasta las llaves, el proceso suele durar entre tres días y dos semanas. La búsqueda es lo que más tiempo lleva: no nos quedamos con la primera opción que parece adecuada, seguimos buscando hasta encontrar un coche que supere la revisión sin objeciones.'
        processSteps:
          - n: '01'
            text: 'Hablamos del presupuesto, la marca y tus requisitos: qué es importante y en qué aspectos puedes ceder'
          - n: '02'
            text: Seleccionamos opciones sobre el terreno y descartamos por teléfono las que no superan nuestras preguntas
          - n: '03'
            text: Vamos a inspeccionar el coche con un medidor de espesor de pintura y un escáner; para BMW usamos el sistema oficial ISTA. Hacemos fotos y vídeos
          - n: '04'
            text: Te enviamos un informe y te decimos claramente si conviene comprarlo o seguir buscando
          - n: '05'
            text: Negociamos el precio, formalizamos la compra y te entregamos el coche o lo llevamos hasta tu puerta
        includedHeading: Qué incluye el servicio
        includedLead: La comisión se fija antes de empezar y no depende del número de coches que inspeccionemos. Si después de la revisión te decimos "no lo compres", seguimos buscando sin cobrarte más.
        included:
          - title: Búsqueda sin límite de opciones
            text: Seguimos trabajando hasta encontrar un coche que no presente problemas. Descartar una opción inadecuada está incluido y no tiene coste adicional.
          - title: Un experto inspecciona cada coche
            text: Medimos el espesor de pintura en los paneles, escaneamos las unidades de control y usamos un elevador cuando hace falta. Recibirás fotos y vídeos de todos los puntos problemáticos para que veas lo mismo que nosotros.
          - title: Revisión del historial y de la situación legal
            text: Informe de CarVertical por VIN, historial de mantenimiento en el concesionario oficial de la marca, verificación del kilometraje, cargas, restricciones de matriculación y siniestros pendientes.
          - title: Negociación y formalización de la compra
            text: Negociamos el precio teniendo en cuenta lo que encontremos, preparamos los documentos y te acompañamos durante la firma.
          - title: Entrega y matriculación
            text: Llevamos el coche hasta tu ciudad y te ayudamos con los trámites locales, o te entregamos las llaves donde te resulte más cómodo recogerlo.
          - title: La misma persona durante todo el proceso
            text: Te atiende el mismo especialista que fue a inspeccionar el coche. No tendrás que explicar de nuevo lo que necesitas a cada persona que te atienda.
        compareHeading: En qué se diferencian los mercados
        compareLead: El mismo modelo en Alemania y Polonia puede ser muy distinto en cuanto a historial y precio.
        compareHint: Elige un país y te contamos qué revisamos allí primero.
        compareLinkFor: Búsqueda de coches {location} en detalle
      title: Búsqueda de coches llave en mano
      descriptionFor: Buscamos un coche {location} entre los que ya están en el país, sin importarlo del extranjero. Revisión completa, acompañamiento en la compra y entrega hasta tu ciudad.
      ctaLabel: Enviar una solicitud
      casesHeadingFor: 'Casos reales: búsqueda de coches {location}'
      breadcrumbLabelFor: Coches {location}
      stepsFor:
        - n: '01'
          text: 'Envías una solicitud con tus requisitos: presupuesto, marca y kilometraje'
        - n: '02'
          text: Buscamos opciones {location} según tus criterios
        - n: '03'
          text: Un experto independiente inspecciona y revisa el coche
        - n: '04'
          text: Te acompañamos durante la compra y te ayudamos con los documentos y los trámites
        - n: '05'
          text: Llevamos el coche hasta tu ciudad y te ayudamos a matricularlo
      deliveryLineFor: Entregamos el coche en cualquier ciudad del país. Si hay que llevarlo al extranjero, nos encargamos de la exportación y el despacho de aduanas, y lo transportamos a {destinations} y a cualquier otro país.
      deliveryDestinations:
        - Bosnia y Herzegovina
        - Croacia
        - Macedonia del Norte
        - Turquía
        - Kazajistán
        - Kirguistán
      citiesHeadingFor: Dónde buscamos coches {countryLocation}
      citiesLead: Nuestro experto puede desplazarse por todo el país, pero normalmente buscamos coches donde hay más oferta. Esto es lo que debes saber sobre cada ciudad.
      alsoInLabel: 'También buscamos coches en:'
      crossSellLabel: ¿Buscas un coche de otro país?
      countryNotesHeadingFor: Qué tenemos en cuenta {location}
      countryNotesPointsLabel: Qué revisamos primero
      countryNotes:
        de:
          lead: 'La oferta aquí es mayor que en cualquier otro mercado europeo y, por lo general, el historial de mantenimiento está bien documentado: la mayoría de los coches tienen un libro de mantenimiento con los sellos del concesionario en cada revisión. La otra cara de la moneda son los kilómetros de autopista. Hacer 200.000 km en tres años es normal y no es motivo para pedir un descuento.'
          points:
            - 'Libro de mantenimiento y sellos del concesionario: verificamos el historial por VIN con el servicio oficial'
            - Informe de la inspección HU, que todos llaman TÜV. Leemos las observaciones de la inspección anterior, no solo el sello
            - 'Coches de leasing y flotas de empresa: mantenimiento regular, pero mucho kilometraje'
            - En invierno se usan productos anticongelantes en las carreteras, así que revisamos por separado los bajos y los estribos
        rs:
          lead: Estamos aquí, así que podemos inspeccionar el coche el mismo día que nos contactas, sin importarlo. El mercado es pequeño y un mismo coche puede pasar por varios vendedores, por lo que a veces hay que reconstruir su historial.
          points:
            - 'El coche ya ha pasado el despacho de aduanas y tiene matrícula local: no hace falta pagar aranceles ni tramitar la importación'
            - A menudo manipulan el kilometraje al revender coches dentro del país; lo contrastamos con los registros de la inspección técnica
            - Hay muchos coches importados de Alemania e Italia; revisamos su historial antes de la importación
            - Inspección el mismo día que nos contactas, sin esperar al transporte
        es:
          lead: Los inviernos son suaves y casi no se usan productos anticongelantes en las carreteras, por eso los bajos de los coches españoles suelen estar mucho mejor que los de los alemanes. En cambio, el sol y la cercanía del mar dañan la pintura, los plásticos y las piezas de goma.
          points:
            - En la costa, buscamos corrosión sobre todo en las cavidades ocultas
            - Tenemos en cuenta el coste de reparar la pintura quemada por el sol y los plásticos agrietados del interior
            - 'Hay muchos coches que fueron de alquiler: kilometraje razonable, pero uso intensivo'
            - 'Informe de la inspección ITV: comprobamos las observaciones y las fechas de las inspecciones'
        ch:
          lead: 'Los coches suizos suelen estar mucho mejor cuidados que la media europea: el alto coste del mantenimiento hace que sus propietarios sean cuidadosos y los kilometrajes suelen ser bajos. Pero Suiza no pertenece a la UE, así que la importación se tramita de otra manera y lo tenemos en cuenta desde el principio.'
          points:
            - Equipamientos completos, más habituales aquí que en los países vecinos
            - MFK. La inspección es rigurosa, se preparan a conciencia y eso se nota en el coche
            - 'No pertenece a la UE: el despacho de aduanas y la documentación se tramitan de forma distinta'
            - Precio por encima del mercado, pero ahorrarás después en reparaciones
        pt:
          lead: Es un mercado pequeño, con menos oferta que el español, pero también hay menos competencia por los buenos coches. El clima húmedo y salino hace que la corrosión costera aparezca incluso en coches recientes.
          points:
            - 'Humedad y mar: damos prioridad a las cavidades ocultas y al sistema eléctrico durante la inspección'
            - 'Mercado pequeño: tardamos más en encontrar un coche para una petición concreta que en Alemania'
            - 'Informe IPO: revisamos las observaciones de inspecciones anteriores'
            - Muchos diésel y coches pequeños; los modelos de carrocería grande son poco frecuentes
        fr:
          lead: Francia es, ante todo, diésel y marcas locales. Peugeot, Renault y Citroën cuestan menos aquí que en cualquier otro lugar de Europa. En cambio, los coches prémium alemanes son más caros, así que no suele compensar comprarlos allí.
          points:
            - Marcas francesas a los mejores precios de Europa y con mantenimiento más barato
            - En los diésel revisamos por separado el filtro de partículas y la válvula EGR
            - Contrôle technique. Los informes son detallados; comparamos las observaciones año por año
            - 'Uso urbano: el embrague y la suspensión se desgastan antes de lo indicado'
        it:
          lead: 'El mercado italiano destaca por sus coches pequeños y equipamientos poco comunes, pero hay que ir con cuidado: los coches suelen tener un uso intensivo y las pequeñas reparaciones de carrocería no siempre están bien hechas.'
          points:
            - 'Uso urbano, pequeños golpes y retoques de pintura frecuentes: el medidor de espesor de pintura es imprescindible'
            - En el sur y la costa hay sal y corrosión; el norte se parece más a Alemania
            - 'Revisione: comprobamos que las inspecciones sean regulares; las lagunas son más frecuentes de lo habitual'
            - Muchos coches llevan sistema de GLP; lo revisamos por separado
        pl:
          lead: 'Es el gran mercado más cercano: la logística es barata y rápida. Pero durante años Polonia ha sido el principal centro de tránsito de coches accidentados de Europa occidental, así que aquí comprobamos el historial con más rigor que en ningún otro lugar.'
          points:
            - Alta proporción de coches reparados tras accidentes; priorizamos la geometría de la carrocería
            - 'Reventas frecuentes: un coche puede cambiar de varios propietarios en un año'
            - A menudo se manipula el kilometraje al importar el coche; lo contrastamos con bases de datos de mantenimiento
            - 'Trayecto de entrega corto: más barato y rápido que desde España o Portugal'
      closing:
        eyebrow: ¿Por dónde empezamos?
        line1: Cuéntanos qué coche
        line2: estás buscando,
        accentWord: nosotros nos encargamos
        text: Presupuesto, carrocería, caja de cambios y un par de preferencias más. Nosotros buscamos; tú revisas los informes de cada opción y decides cuál quieres ver en persona.
    vehicle-buyback:
      hub:
        metaTitle: Compramos coches con matrícula rusa en Europa
        metaDescription: Compramos coches con matrícula rusa en cualquier país de Europa y con matrícula serbia en Serbia. Valoración por fotos en una hora y pago el día de la firma.
        title: Compramos tu coche
        titleHighlight: sin semanas de regateo
        description: 'Compramos coches difíciles de vender por los canales habituales: con matrícula rusa, importación temporal vencida o documentación complicada. El precio es inferior al de mercado: a cambio, nos ocupamos de la venta y de todos los trámites.'
        breadcrumbLabel: Compramos tu coche
        casesHeading: Casos reales de compra
        chooseCountryLabel: 'Elige un país:'
        ctaLabel: Solicitar valoración
        heroPhotoAlt: Llaves de coche sobre dinero y documentos
        processHeading: Cómo funciona la compra
        processLead: Desde el primer mensaje hasta el pago suelen pasar dos o tres días, y casi todo ese tiempo se va en el viaje hasta el lugar de encuentro. Te damos una valoración por fotos en una hora.
        processSteps:
          - n: '01'
            text: Envíanos fotos, la documentación y una descripción sincera del estado del coche
          - n: '02'
            text: Te damos un precio en una hora, definitivo y sin rangos
          - n: '03'
            text: Quedamos donde esté el coche; si no puede circular, vamos con un remolque
          - n: '04'
            text: Lo inspeccionamos en persona y confirmamos el precio si coincide con la descripción
          - n: '05'
            text: Firmamos el contrato y transferimos el dinero ese mismo día
        includedHeading: De qué nos ocupamos
        includedLead: A cambio de la diferencia entre nuestro precio y el precio de mercado, nos hacemos cargo de todo lo que hace que estos coches no se vendan durante meses.
        included:
          - title: Coches con matrícula rusa
            text: 'Nuestra categoría principal. El coche puede estar en cualquier país de Europa: vamos donde esté y nos ocupamos de llevárnoslo y venderlo después.'
          - title: Problemas de importación y plazos
            text: Tras la firma, asumimos la importación temporal vencida y los riesgos asociados.
          - title: Valoración sin inspección presencial
            text: Calculamos el precio a partir de fotos y documentos. Solo vamos cuando ambas partes están de acuerdo con el importe.
          - title: Tramitación de la venta
            text: Nos encargamos del contrato, la baja del vehículo y toda la documentación. Tú solo necesitas aportar los documentos del coche y firmar.
          - title: Pago el día de la firma
            text: Transferimos el dinero ese mismo día. No hacemos pagos a plazos ni prometemos pagar después de revender el coche.
          - title: Un no sincero
            text: Si el coche no nos interesa, te lo diremos enseguida y te explicaremos por qué. No alargaremos el proceso ni intentaremos bajar el precio sobre la marcha.
      title: Compramos tu coche
      ctaLabel: Solicitar valoración
      casesHeading: Casos reales de compra
      breadcrumbLabel: Compramos tu coche
      descriptionSerbia: Compramos coches con matrícula rusa por debajo del precio de mercado, estén donde estén en Europa. También compramos coches con matrícula serbia en Serbia y Montenegro. Valoración online, trámites en un día y pago el día de la operación.
      descriptionOtherFor: Compramos coches con matrícula rusa por debajo del precio de mercado, estén donde estén en Europa, incluido {name}. Valoración online, trámites en un día y pago el día de la operación.
