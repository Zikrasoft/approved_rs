      citiesHeadingFor: Gde pregledamo automobile {countryLocation}
      citiesLead: Stručnjak odlazi po celoj zemlji, ali najčešće pregledamo automobile tamo gde ih najviše izlažu. Ovo je značaj za svaki grad.
      alsoInLabel: 'Takođe biramo u:'
      crossSellLabel: Treba vam auto iz inostranstva?
      countryNotesHeadingFor: Šta uzimamo u obzir {location}
      countryNotesPointsLabel: Na šta obratimo pažnju pre svega
      countryNotes:
        de:
          lead: 'Izbor ovde je veći nego na bilo kom drugom tržištu Evrope, a istorija servisiranja se obično prati: većina automobila ima servisnu knjigu sa zapisima dilera o svakom tehničkom pregledu. S druge strane, autoputni pređeni km. Dvesto hiljada za tri godine je ovde norma, a ne razlog za popust.'
          points:
            - Servisna knjiga i zapisi dilera — proveravamo po VIN kodu kod zvaničnog servisa
            - Protokol HU, koji svi nazivaju TÜV, — čitamo primedbe s prethodnog pregleda, a ne samo pečat
            - 'Automobili iz lizinga i korporativnih parkova: redovno servisirani, ali sa velikim pređenim km'
            - Zimski putevi sa reagensima — donju stranu i pragove gledamo posebno
        rs:
          lead: Ovde smo na licu mesta, zato pregledamo automobil isti dan kada se obratite i bez uvoza. Tržište je malo, isti automobil prolazi kroz nekoliko prodavaca, pa se priča mora raspetljati.
          points:
            - Automobil je već carinjen i na lokalnim registarskim tablicama — dažbine i registracija uvoza nisu potrebni
            - Pređeni km se često uređuju prilikom preprodaje unutar zemlje — upoređujemo sa oznakama tehničkog pregleda
            - Puno vozila uvezenih iz Nemačke i Italije — proveravamo šta je bilo sa automobilom pre uvoza
            - Pregled istog dana kada se obratite, bez čekanja na logistiku
        es:
          lead: Blaga zima i skoro da nema reagenasa na putevima, zato su donje strane španskih automobila obično znatno bolje nego nemačkih. Međutim, sunce i blizina mora utiču na boje, plastiku i sve gumene delove.
          points:
            - Obala — tražimo koroziju prvenstveno u skrivenim prostorima
            - Ispran lak i napukla plastika enterijera — uračunavamo u cenu
            - 'Mnogo nekadašnjih iznajmljenih automobila: ujednačen pređeni km, ali stroga eksploatacija'
            - ITV protokol – proveravamo zamerke i datume inspekcije
        ch:
          lead: 'Švajcarska vozila su mnogo bolje održavana od proseka u Evropi: skupi servis disciplinuje, a pređene razdaljine su male. Međutim, Švajcarska nije u EU, pa je procedura uvoza drugačija, što treba unapred uvrstiti u budžet.'
          points:
            - Bogate opreme – ovde su ih više uzimali nego u susednim zemljama
            - MFK – inspekcija je stroga, pripremaju se ozbiljno, što se može primetiti na automobilu
            - 'Nije u EU: carina i dokumenti se ne obrađuju kao za zemlje Evropske Unije'
            - Cena je viša od tržišne, ali kasnije štedite na popravkama
        pt:
          lead: Tržište je malo, izbor je skromniji nego u Španiji, ali postoji i manja konkurencija za dobra vozila. Klima je vlažna i slana – morska korozija se pojavljuje čak i na novim automobilima.
          points:
            - Vlažnost i more – skrivene šupljine i elektrotehnika su prioritet pregleda
            - 'Malo tržište: tražimo duže za konkretan zahtev nego u Nemačkoj'
            - IPO protokol – čitamo zamerke prethodnih inspekcija
            - Mnoge dizel i male klase vozila, veći modeli su retki
        fr:
          lead: Francuska je pre svega dizel i domaće marke. Peugeot, Renault i Citroën su ovde jeftiniji nego bilo gde u Evropi. Nemački premium automobili su, s druge strane, skuplji, i nema smisla uzimati ih ovde.
          points:
            - Francuske marke – najbolja cena u Evropi, a servis je jeftiniji
            - Dizeli – proveravamo čađavi filter i EGR ventil kao posebnu stavku
            - Contrôle technique – protokoli su detaljni, proveravamo zamerke po godinama
            - 'Gradska upotreba: prijanjanje i suspenzija se troše brže nego što je navedeno'
        it:
          lead: 'Italijansko tržište je dobro za male automobile i retke opreme, ali zahteva oprez: ovde se vozila eksploatišu intenzivno, a sitne karoserijske popravke se ne rade uvek pažljivo.'
          points:
            - Grad – česti sitni udarci i prefarbavanje, mjerač debljine je obavezan
            - Jug i obala donose so i koroziju, sever je bliži nemačkim uslovima
            - Revisione – proveravamo redovnost, propušteni servisi su češći nego obično
            - Mnoge mašine sa plinom – proveravamo opremu odvojeno
        pl:
          lead: 'Najveće tržište najbliže nama: logistika je jeftina i brza. Međutim, Poljska je godinama bila glavno mesto za prevoz oštećenih automobila iz Zapadne Evrope, zato se ovde strože proverava istorija.'
          points:
            - Visok udeo obnovljenih posle saobraćajnih nesreća – geometrija karoserije je prioritet
            - 'Česte preprodaje: vozilo može promeniti nekoliko vlasnika u toku godine'
            - Pređene kilometre često menjaju na ulazu – proveravamo sa servisnim bazama
            - Kratka ruta dostave – jeftinije i brže nego iz Španije ili Portugala
      closing:
        eyebrow: Kako da počnemo?
        line1: Opisujte vozilo,
        line2: koje tražite, –
        accentWord: dalje naš posao
        text: Budžet, tip karoserije, menjač, par želja. Mi pretražujemo, a vi gledate izveštaje i odlučujete koje vozilo da pregledate uživo.
