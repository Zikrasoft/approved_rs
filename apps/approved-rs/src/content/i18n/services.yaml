    vehicle-inspection:
      title: Provera auta
      description: Nezavisna provera automobila pre kupovine. Dolazak eksperta, dijagnostika, izveštaj — bez obaveze kupovine.
      ctaLabel: Zatraži provere
      casesHeading: 'Stvarne transakcije: provera pre kupovine'
      breadcrumbLabel: Provera auta
      steps:
        - n: '01'
          text: Karoserija i farba — prisustvo popravki ili udesa
        - n: '02'
          text: Hodna, suspenzija, kočnice
        - n: '03'
          text: Motor, menjač, transmisija
        - n: '04'
          text: Elektronika i istorija servisa po VIN-u
        - n: '05'
          text: Pravna čistoća — založno pravo, zabrana registracije, udes
      extraLine: Radimo i u drugim evropskim zemljama, uključujući Portugal — informišite se prilikom prijave.
      hub:
        metaTitle: Provera auta pre kupovine u Evropi
        metaDescription: 'Dolazimo do automobila koji ste sami pronašli: merni uređaj, skener, provera istorije po VIN-u i izveštaj sa slikama istog dana. Radimo u osam evropskih zemalja.'
        title: Provera auta
        titleHighlight: pre kupovine
        description: 'Dolazimo do automobila koji ste sami pronašli i obaveštavamo vas o tome u kakvom je stanju. Izveštaj stiže pre nego što uplatite novac: ako je odgovor ‘ne uzimajte’, gubite samo cenu provere.'
        breadcrumbLabel: Provera auta
        casesHeading: 'Stvarne transakcije: provera pre kupovine'
        chooseCountryLabel: 'Izaberite zemlju:'
        ctaLabel: Zatraži provere
        heroPhotoAlt: Automobil na dizalici u servisu
        processHeading: Kako teče provera
        processLead: Obično izlazimo u roku od jednog do dva dana nakon prijave. Sam pregled traje sat i po do dva, izveštaj šaljemo istog dana, dok auto još nije otišao drugom kupcu.
        processSteps:
          - n: '01'
            text: Pošaljete link na oglas i kontakte prodavca
          - n: '02'
            text: Dogovaramo se sa prodavcem o vremenu i mestu pregleda
          - n: '03'
            text: Dolazimo sa mernim uređajem i skenerom, za BMW se povezujemo na dealersku ISTA, po potrebi — na dizalicu
          - n: '04'
            text: Pravimo fotografije i video svih nalaza, proveravamo istoriju po VIN-u
          - n: '05'
            text: Šaljemo izveštaj i jasan odgovor — kupiti, pregovarati ili odustati
        includedHeading: Šta je uključeno u proveru
        includedLead: 'Stotinu i više stavki na kontrolnom spisku, ali gotovo uvek odlučuju četiri zone: karoserija, motor sa menjačem, hodna i dokumenta. Upravo po njima najčešće odvraćamo od kupovine.'
        included:
          - title: Karoserija i farba
            text: Merni uređaj po svakoj površini, geometrija otvora, tragovi zavarivanja i kitovanja. Vidljivo je da li je bilo popravki o kojima prodavac nije spomenuo.
          - title: Motor i menjač
            text: Parametri na zagrejanom motoru, adaptacije menjača, greške u memoriji blokova. Najskuplja zona i najčešći razlog za odbijanje.
          - title: Hodna i kočnice
            text: Zračnost, stanje suspenzije i kočionog sistema. Automobilski kilometri i balkanske ceste troše auto na različite načine, i to se vidi.
          - title: Elektronika i istorija po VIN-u
            text: CarVertical izveštaj, servisna istorija od dilera po marki, neslaganje kilometraže sa istorijom, greške u blokovima i tragovi ispaljenih vazdušnih jastučića.
          - title: Pravna čistoća
            text: Zalozi, zabrana registracije, otvorene saobraćajne nesreće i osiguravajući događaji — sve to se otkriva tek nakon kupovine.
          - title: Izveštaj sa fotografijama i video zapisima
            text: Svaki nalaz je snimljen i potpisan. Izveštaj ostaje kod vas — sa njim je lakše trgovati, čak i ako se odlučite za kupovinu.
        compareHeading: Šta se menja od zemlje do zemlje
        compareLead: Regulativa tehnickog pregleda, tipične kvarove lokalnih automobila i načine kako se skriva istorija svuda po svojoj.
        compareHint: Izaberite zemlju — pokazaćemo šta dodajemo u obični spisak.
        compareLinkFor: Provera {location} — detaljno
        mapHeading: Četiri zone koje odlučuju o dogovoru
        mapLead: Spisak je dug, ali obično se odustaje zbog jedne od četiri zone. Kliknite na broj na šemi — pokažaćemo šta ekspert gleda i šta smo tamo nalazili.
      countryNotesHeadingFor: Kako proveravamo {location}
      countryNotesPointsLabel: Šta proveravamo pored običnog spiska
      countryNotes:
        de:
          lead: 'U Nemačkoj imamo mnogo toga na čemu se osloniti: servisna knjižica, HU protokoli i razvijene baze podataka po VIN-u. Zbog toga je provera ovde prvenstveno usklađivanje dokumenata sa tim što pokazuje auto.'
          points:
            - Upisane beleške sa dilerkog servisiranja upoređujemo sa očitanjem kilometraže po godinama
            - Zapažanja iz prethodnog HU — šta je popravljeno posle pregleda, a šta je samo odloženo
            - Dno i pragovi posle zimskih reagensa, uključujući skrivene šupljine
            - 'Lizing prošlost: uredno servisiranje uz veliku kilometražu'
        rs:
          lead: 'U Srbiji izlazimo na dan zahteva. Glavni zadatak je da obnovimo istoriju automobila pre uvoza: lokalni dokumenti pokazuju samo poslednji deo života automobila.'
          points:
            - Zemlja porekla i stanje automobila pre uvoza u Srbiju
            - Kilometraža naspram beležaka sa tehničkog pregleda za prethodne godine
            - Popravke karoserije posle uvoza — to se radi češće i jeftinije nego u EU
            - 'Pravna strana: zalozi i ograničenja na registraciju'
        es:
          lead: Španski automobili obično se raduju dnu i razočaravaju svime što trpi od sunca i soli. Proveru pomeramo sa korozije na skrivene šupljine, elektriku i stanje enterijera.
          points:
            - Korozija u skrivenim šupljinama na obali — može biti čisto s donje strane
            - Lak, brtvila i plastika nakon dugog sunca
            - 'Izborna prošlost: upoređujemo kilometražu sa karakteristikama habanja enterijera'
            - ITV protokol i šta je ostalo otvoreno između prozora inspekcije
        ch:
          lead: Za MFK se automobili ozbiljno pripremaju, tako da svež protokol sam po sebi malo znači. Gledamo šta je tačno urađeno pre pregleda, a šta se odvija samo od prošle godine.
          points:
            - Šta su zamenili neposredno pre MFK — sveži delovi naspram ostalih
            - Servis je skup, pa proveravamo da li su odložili redovni pregled
            - Opremu proveravamo, ali gledamo da svaka opcija još uvek radi
            - 'Dokumenti za uvoz: Švajcarska nije EU, paket se razlikuje'
        pt:
          lead: 'Sve zavisi od vlažne morske klime. Proveru počinjemo korozijom i elektrikom: obično su problemi u onome što je u vlažnosti.'
          points:
            - Skrivene šupljine, dužine i tačke učvršćenja suspenzije
            - Kiselost konektora i blokova — tipični uzrok sporadičnih grešaka
            - IPO protokol i učestalost prolaska
            - 'Dizeli sa gradskom upotrebom: filter čađe i njegova istorija'
        fr:
          lead: 'U Francuskoj postoji detaljan contrôle technique, i to je dobra polazna tačka. Kasnije gledamo šta regulativa ne hvata: resurs dizelske grupe i habanje od gradskog saobraćaja.'
          points:
            - Zapažanja contrôle technique po godinama — šta se ponavlja iz pregleda u pregled
            - Filter čađe, EGR i turbina na dizelima
            - Sispanje i suspenzija posle gustog gradskog ciklusa
            - 'Istorija po francuskim markama: dostupne rezervne delove, ali svoja slaba mesta'
        it:
          lead: Italijanski automobili češće dolaze sa malim popravkama karoserije, urađenim brzo i jeftino. Na meraču debljine po panelima ovde se troši značajno više vremena nego obično.
          points:
            - Merač debljine za sve panele — popravci posle urbanih ogrebanja
            - 'Razlika između severa i juga: so na obali, obična habanja u unutrašnjosti'
            - Plinska oprema, ako postoji — instalacija i stanje boce
            - Učestalost revisione i propušteni periodi
        pl:
          lead: Poljska je najveće prevozničko tržište za oštećene automobile iz Zapadne Evrope. Stoga prvo otkrivamo šta se dešavalo s tim šasijama pre prodaje.
          points:
            - Geometrija otvora i tragovi zavarivanja — obnova posle ozbiljne saobraćajne nesreće
            - 'Istorija uvoza: odakle je automobil došao i u kom je stanju'
            - Kilometražu upoređujemo sa evropskim servisnim bazama, ne verujemo kilometraži
            - Vazdušni jastučići i njihovo ispaljenje u prošlosti
      closing:
        eyebrow: Da li ste pronašli automobil?
        line1: Pošaljite link
        line2: na oglas —
        accentWord: doći ćemo i pogledati
        text: Izlazimo za jedan ili dva dana. Izveštaj sa fotografijama ostaje kod vas, čak i ako se posle njega odlučite da ne kupite.
    cityVehicleSourcing:
      title: Auto izbor
