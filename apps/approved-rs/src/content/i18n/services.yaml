        processSteps:
          - n: '01'
            text: 'Calculamos el costo total antes de comenzar: coche, logística, aranceles, gestión'
          - n: '02'
            text: Encontramos y verificamos el coche en el país de origen
          - n: '03'
            text: Compramos el coche a través de nuestra empresa europea, damos de baja y preparamos la documentación de exportación
