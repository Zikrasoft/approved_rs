    vehicle-inspection:
      title: Vehicle Inspection
      description: Independent inspection of the car before purchase. Expert visit, diagnostics, report without purchase obligation.
      ctaLabel: Order Inspection
      casesHeading: 'Real deals: pre-purchase inspections'
      breadcrumbLabel: Vehicle Inspection
      steps:
        - n: '01'
          text: Body and paintwork, checks for repairs or accidents
        - n: '02'
          text: Suspension, brakes
        - n: '03'
          text: Engine, transmission
        - n: '04'
          text: Electronics and service history by VIN
        - n: '05'
          text: Legal clarity (loans, registration bans, accidents)
      extraLine: We also operate in other European countries, including Portugal, please specify when applying.
      hub:
        metaTitle: Pre-purchase vehicle inspection in Europe
        metaDescription: 'We come to the car you found yourself: thickness gauge, scanner, VIN history check, and a report with photos the same day. We work in eight European countries.'
        title: Vehicle Inspection
        titleHighlight: before purchase
        description: "We come to inspect the car you found and tell you the real condition. The report arrives before you make the payment: if the answer is 'don’t buy', you only lose the inspection cost."
        breadcrumbLabel: Vehicle Inspection
        casesHeading: 'Real deals: pre-purchase inspections'
        chooseCountryLabel: 'Choose a country:'
        ctaLabel: Order Inspection
        heroPhotoAlt: Car on a lift in the workshop
        processHeading: How the inspection works
        processLead: Typically, we visit within one to two days after your request. The inspection takes one and a half to two hours, and we send the report the same day while the car is still available.
        processSteps:
          - n: '01'
            text: Send us the ad link and seller's contact information
          - n: '02'
            text: We schedule a time and place for the inspection with the seller
          - n: '03'
            text: We arrive with a thickness gauge and scanner, connecting to the dealer's ISTA for BMW, and we can use a lift if necessary
          - n: '04'
            text: We take photos and videos of all findings, check the history by VIN
          - n: '05'
            text: 'We send a report and a clear answer: to buy, negotiate, or refuse'
        includedHeading: What is included in the inspection
        includedLead: 'There are over a hundred checklist items, but we usually focus on four key areas: body, engine with transmission, suspension, and documents. We often advise against purchasing based on these.'
        included:
          - title: Body and paintwork
            text: Thickness readings for each panel, door frame geometry, signs of welding and body filler. You’ll see if there was a repair not mentioned by the seller.
          - title: Engine and transmission
            text: Parameters at a warmed-up engine, transmission adaptations, error codes in the memory of the units. This is the most expensive area and the most common reason for rejection.
          - title: Suspension and brakes
            text: Play, condition of the suspension and brake system. Highway mileage and Balkan roads wear cars differently, and this is evident.
          - title: Electronics and VIN history
            text: CarVertical report, dealer service history specific to the brand, discrepancies in mileage with history, error codes, and signs of deployed airbags.
          - title: Legal Clarity
            text: 'Loans, registration bans, unresolved accidents, and insurance events: issues that arise only after purchase.'
          - title: Report with photos and videos
            text: Each finding is documented with a photo and note. The report remains with you, making negotiations easier even if you decide to buy the car.
        compareHeading: What Changes from Country to Country
        compareLead: Inspection regulations, typical issues with local cars, and ways to hide history vary everywhere.
        compareHint: Select a country, and we'll show what we add to the standard checklist.
        compareLinkFor: Inspection in {location} details
        mapHeading: Four Areas That Influence the Deal
        mapLead: The checklist is long, but we typically dissuade on one of four points. Click the number on the diagram, and we’ll show what the expert looks for and what we found.
      countryNotesHeadingFor: How We Inspect in {location}
      countryNotesPointsLabel: What We Check Beyond the Regular Checklist
      countryNotes:
        de:
          lead: "In Germany, there's plenty to rely on: service book, HU protocols, and developed VIN databases. Thus, inspections here primarily focus on verifying documents against the car’s condition."
          points:
            - We verify dealer service records against odometer readings by year
            - Notes from past HU inspections, what was repaired after the inspection versus what was just deferred
            - Undercarriage and rocker panels after winter chemicals, including hidden cavities
            - 'Leasing history: consistent maintenance despite high mileage'
        rs:
          lead: "In Serbia, we visit the same day you contact us. The main task is to recover the vehicle's history prior to import: local documents only show the latest period of the car's life."
          points:
            - Country of origin and condition of the car before import to Serbia
            - Odometer readings versus technical inspection records from previous years
            - Body repairs after import are done more often and cheaper than in the EU
            - 'Legal aspects: liens and registration restrictions'
        es:
          lead: Spanish cars generally excel in undercarriage condition but suffer from sun and salt exposure. We shift our inspection focus from undercarriage corrosion to hidden cavities, electrical systems, and interior condition.
          points:
            - Corrosion in hidden cavities at the coast, even if the underside looks clean
            - Paint, seals, and plastics after years of sun exposure
            - 'Rental history: we cross-check mileage with signs of interior wear'
            - ITV protocol and any unresolved issues between inspections
        ch:
          lead: Cars are seriously prepared for MFK, so a fresh protocol alone doesn’t say much. We check what was done just before inspection versus what has been going on since last year.
          points:
            - What was replaced right before MFK, fresh parts against the background of older ones
            - Maintenance is expensive, so we check for any deferred servicing
            - Rich equipment, but we check that every option still functions
            - 'Import documents: Switzerland is not in the EU, the requirements differ'
        pt:
          lead: 'Everything here hinges on the humid maritime climate. We start the inspection with corrosion and electrical issues: usually, that’s where the problems lie in damp conditions.'
          points:
            - Hidden cavities, longitudinal beams, and suspension mounting points
            - Corrosion of connectors and modules, a typical cause of intermittent errors
            - IPO protocol and inspection frequency
            - 'Diesels used in urban settings: diesel particulate filter and its history'
        fr:
          lead: 'In France, the detailed contrôle technique is a good starting point. We then look for what the regulations do not catch: diesel group resources and wear from urban traffic.'
          points:
            - Notes from contrôle technique over the years, what recurs from inspection to inspection
            - Diesel particulate filters, EGR, and turbochargers on diesels
            - Clutch and suspension after a dense urban cycle
            - 'History of French brands: available spare parts, yet their weak points'
        it:
          lead: Italian cars often arrive with quick and inexpensive minor body repairs. Measuring paint thickness on panels here takes noticeably more time than usual.
          points:
            - Thickness gauge on all panels, looking for touch-ups after city scrapes
            - 'Difference between north and south: salt along the coast, ordinary wear inland'
            - Gas equipment, if installed, its installation and condition
            - Regularity of revisione and missed periods
        pl:
          lead: Poland is the largest transit market for damaged cars from Western Europe. Therefore, the first thing we check is what was done to this body before sale.
          points:
            - Door frame geometry and signs of welding, indications of repairs after serious accidents
            - 'Import history: where the car came from and in what condition'
            - We cross-check mileage with European service databases, do not trust the odometer
            - Airbags and their deployment history
      closing:
        eyebrow: Found a Car?
        line1: Send us the link
        line2: to the listing,
        accentWord: we'll come and take a look
        text: We come within one to two days. The report with photos stays with you, even if you decide against the purchase afterwards.
    cityVehicleSourcing:
      title: Car Sourcing
      descriptionFor: We’ll find a car in {cityLocation} with a complete inspection. We operate throughout the region of {countryName}.
      casesHeadingFor: Real Transactions in the Market of {countryGenitiveOrName}
      whyCityHeadingFor: Why {cityName}
      reason1: We check both dealer lots and private listings
      reason2: We verify the history by VIN before heading out for inspections
      reason3For: Our expert in {cityLocation}
      reason4Dekra: DEKRA / TÜV inspections upon request
      reason4Generic: Independent technical expertise available upon request
      otherCitiesLabelFor: 'Other cities in {countryLocation}:'
      cityNotesHeadingFor: Automotive Market in {cityLocation}
      cityNotesPointsLabel: What this means in practice
      cityNotes:
        berlin:
          lead: "Berlin has the largest selection in Germany and the most diverse range of sellers. You'll find everything here: from corporate fleet vehicles with full histories to resale options from Eastern Europe."
          points:
            - A vast selection in every segment, including rare configurations
            - Many private sellers, making negotiations more realistic than with dealers
            - 'Urban driving: tires and suspension wear more noticeably than on highway cars'
        munich:
          lead: 'An expensive city with high-priced cars. The premium segment is larger here than anywhere else in Germany, and the average condition is better: these cars are well-maintained.'
          points:
            - Strong premium segment, especially BMW and Mercedes
            - Well-maintained cars with complete dealer histories
            - Prices are above the national average; savings come from vehicle condition
        hamburg:
          lead: A port city and major logistics hub. It's convenient to ship cars from here, and you'll often find fresh import vehicles on the market.
          points:
            - The port nearby makes shipping easier and cheaper
            - Many cars from northern regions with highway mileage
            - 'Humid maritime climate: we pay extra attention to bodywork and hidden cavities'
        dusseldorf:
          lead: The center of North Rhine-Westphalia, Germany's most populous federal state. The lots are densely packed, and it's just an hour to the borders with the Netherlands and Belgium, so cars frequently come here for sale.
          points:
            - We can check several cars in one visit due to proximity of lots
            - 'Some offerings come with Dutch and Belgian plates: we check their history and documents separately'
            - Many sellers competing with each other, negotiations are more enthusiastic
        belgrade:
          lead: Our home base. In Belgrade, we can inspect vehicles on the day of inquiry, we know local sellers, and we see which cars have been circulating around the lots for two months.
          points:
            - Inspection on the same day, no waiting or logistics
            - We know local lots and the history of the cars available
            - The car is already cleared through customs, no import fees or duties needed
        novi-sad:
          lead: The second largest city in Serbia, just an hour's drive from Belgrade. The market is smaller, but prices are typically more reasonable than in the capital, and cars are less likely to have gone through multiple resales.
          points:
            - Prices are lower than in Belgrade with comparable condition
            - Fewer resellers, first owners are more common
            - We leave from Belgrade, no additional charge for the trip
        pancevo:
          lead: Pančevo is essentially part of the Belgrade metropolitan area, so inspections here are similar to those in the capital. The market is small, but private listings tend to be more interesting.
          points:
            - Twenty minutes from Belgrade, we can reach it just as quickly
            - A small market dominated by private sellers
            - Often cheaper than the capital with the same condition
        subotica:
          lead: 'Subotica is on the border with Hungary, which is reflected in the market: many cars imported from the EU and sellers who deal in this regularly.'
          points:
            - Border market, lots of fresh imports from the European Union
            - We check the history before import particularly thoroughly
            - Convenient location if you plan to drive the car further north
        madrid:
          lead: 'The capital market of Spain: the largest selection in the country with many cars from corporate fleets. The continental climate means there is less coastal corrosion here than on the coast.'
          points:
            - The largest selection in Spain, including corporate cars
            - Far from the sea, the bodywork is usually cleaner than coastal areas
            - 'Hot summers: we check plastics, paint, and air conditioning separately'
        barcelona:
          lead: Everything is affected by proximity to the sea. Cars often look great underneath but require attention to hidden cavities and electrical systems.
          points:
            - 'The sea is nearby, so we check hidden cavities: clean underneath, but not within'
            - Many former rental and car-sharing vehicles
            - The port nearby makes maritime shipping easier
        zurich:
          lead: Zurich has the most expensive car market in the region. The highest specifications are taken here, maintained by dealers, and sold before they ever get tired.
          points:
            - Maximum specifications and low mileage
            - Dealer maintenance, history is almost always complete
            - Switzerland is not in the EU, separate import regulations apply
        geneva:
          lead: Geneva is located in the French-speaking part of Switzerland, right at the border with France. There are significantly more French brands on the market than in the German-speaking part of the country.
          points:
            - 'Mixed market: Swiss quality, French selection'
            - The border with France is nearby, providing a price comparison
            - 'The process is the same as throughout Switzerland: export plus import'
        paris:
          lead: 'The largest selection in France comes with the most aggressive usage: heavy traffic and tight parking leave marks on the body and suspension.'
          points:
            - The largest selection in France, especially for French brands
            - 'Urban driving: tires, suspension, and small body damages'
            - Many diesels; we first check the particulate filter and EGR system
        lyon:
          lead: Lyon is calmer than Paris, both in prices and the condition of vehicles. The highway to the south is nearby, making it more likely to find cars with consistent highway mileage.
          points:
            - Prices are lower than in Paris with comparable options
            - More highway kilometers, less urban wear
            - Convenient access to Italy and Spain if we want to broaden the search
        milan:
          lead: 'The business capital of Italy, and this is reflected in the market prices. The northern part of the country conditions are closer to German standards: better roads and better maintained cars than in the south.'
          points:
            - The best selection of premium vehicles in Italy
            - North has less salt and corrosion than the south of the country
            - 'A dense city: a thickness gauge is essential for panel checks'
        rome:
          lead: A large market with very dense urban usage. Minor scrapes here are considered normal daily life and are often repaired hastily.
          points:
            - Many compact cars and vehicles with gas equipment.
            - Frequent touch-ups after city interactions, we inspect every panel
            - The climate is milder south of Milan, but closer to the sea
        warsaw:
          lead: Warsaw is the main entry point for imports from Western Europe, featuring the largest selection in Poland. The share of restored cars is also the highest.
          points:
            - The largest selection in Poland, lots of fresh imports from the EU.
            - We first check the body geometry and signs of repairs.
            - Short delivery distance, cheaper than from Southern Europe
        krakow:
          lead: 'Krakow is quieter than Warsaw: the market is smaller, fewer resales, and cars are often kept by one owner for longer. Southern Poland is logistically closer to the Balkans.'
          points:
            - Fewer resellers than in Warsaw, the history is usually cleaner.
            - Prices are often lower than in the capital.
            - Closer to the route south, convenient for deliveries to Serbia
