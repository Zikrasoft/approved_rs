  es:
    vehicle-sourcing:
      hub:
        metaTitle: Selección de coches en Europa llave en mano
        metaDescription: 'Buscamos coches en Alemania, Serbia, España, Suiza, Italia, Francia, Polonia y Portugal: búsqueda, inspección, negociación y entrega llave en mano.'
        title: Selección de coches
        titleHighlight: llave en mano
        description: Seleccionamos vehículos en el país donde te encuentras o planeas comprar, — revisión completa, asistencia en la transacción y entrega llave en mano. Elige un país para ver los detalles.
        breadcrumbLabel: Selección de coches
        casesHeading: Casos de selección de coches
        chooseCountryLabel: 'Elige un país:'
        ctaLabel: Seleccionar coche
        heroPhotoAlt: Una fila de coches en el lote del concesionario
        processHeading: Cómo se realiza la selección
        processLead: 'Desde la solicitud hasta las llaves, normalmente de tres días a dos semanas. Buscamos el coche: no tomamos el primer adecuado y seguimos buscando hasta encontrar uno que no presente dudas después de la revisión.'
        processSteps:
          - n: '01'
            text: Discutimos el presupuesto, la marca y los requisitos — qué es importante y qué se puede sacrificar.
          - n: '02'
            text: Seleccionamos opciones en el lugar y descartamos por teléfono todo lo que no cumple con los requisitos.
          - n: '03'
            text: Realizamos la inspección con un medidor de espesor y escáner, conectamos el ISTA del concesionario para BMW, tomamos fotos y videos.
          - n: '04'
            text: Enviamos el informe y decimos claramente si merece la pena o si hay que seguir buscando.
          - n: '05'
            text: Negociamos, formalizamos la transacción y entregamos el coche a ti o lo llevamos hasta tu puerta.
        includedHeading: Qué incluye nuestro servicio
        includedLead: La comisión se fija antes de comenzar y no depende de cuántos coches se hayan tenido que revisar. Si después de la inspección decimos "no compres" — seguimos buscando, no necesitas pagar extra por esto.
        included:
          - title: Búsqueda sin límite en número de opciones
            text: Trabajamos hasta encontrar un coche que no tenga inconvenientes. Rechazar una opción no exitosa se incluye en el servicio y no tiene costo adicional.
          - title: Inspección en cada revisión
            text: Medidor de espesor en paneles, escáner en bloques, elevador donde sea necesario. Fotos y videos de todos los lugares problemáticos — tú ves lo mismo que nosotros.
          - title: Revisión de la historia y limpieza legal
            text: Informe CarVertical por VIN, historial de servicio de concesionario por marca, verificación del kilometraje, cargas, restricciones de registro y eventos de seguros no cerrados.
          - title: Negociación y formalización del trato
            text: Negociamos el precio teniendo en cuenta lo que encontramos, preparamos los documentos y acompañamos la firma.
          - title: Entrega y registro
            text: Llevamos el coche a tu ciudad y ayudamos con el registro — ya sea que entreguemos las llaves donde te resulte conveniente.
          - title: Una sola persona para todo el proceso
            text: Trabajas con el mismo especialista que realizó la inspección. No necesitas explicar la tarea de nuevo a cada persona que conteste el teléfono.
        compareHeading: En qué se diferencian los mercados
        compareLead: El mismo modelo en Alemania y en Polonia — en historia y precio, son dos coches diferentes.
        compareHint: Elige un país — te mostraremos qué es lo primero que revisamos allí.
        compareLinkFor: Selección {location} — en detalle
      title: Selección de coches llave en mano
      descriptionFor: Seleccionamos un vehículo {location} — entre los coches que ya están en este país, sin importar desde el extranjero. Revisión completa, asistencia en la transacción y entrega a tu ciudad — llave en mano, incluyendo el despacho aduanero.
      ctaLabel: Enviar solicitud
      casesHeadingFor: 'Casos: selección de coches {location}'
      breadcrumbLabelFor: Coche {location}
      stepsFor:
        - n: '01'
          text: Envías una solicitud con tus requisitos — presupuesto, marca, kilometraje.
        - n: '02'
          text: Buscamos opciones {location} de acuerdo a tus criterios.
        - n: '03'
          text: Un experto independiente inspecciona y verifica el vehículo.
        - n: '04'
          text: Acompañamos la transacción, ayudamos con la documentación y el registro.
        - n: '05'
          text: Entregamos el vehículo a tu ciudad — llave en mano, incluyendo el despacho aduanero.
      deliveryLineFor: Entregamos a {destinations} — y a cualquier otro país, podemos discutirlo en la solicitud.
      deliveryDestinations:
        - Rusia
        - Kazajistán
        - Kirguistán
        - Ucrania
        - Bielorrusia
        - Bosnia y Herzegovina
        - Croacia
        - Macedonia del Norte
        - Turquía
      citiesHeadingFor: Dónde inspeccionamos coches {countryLocation}
      citiesLead: El experto se desplaza por todo el país, pero más a menudo inspeccionamos vehículos allí donde más se ofrecen. Esto es lo que significa para cada ciudad.
      alsoInLabel: 'También selecionamos en:'
      crossSellLabel: ¿Necesitas un coche no local?
      countryNotesHeadingFor: Qué consideramos en {location}
      countryNotesPointsLabel: En qué nos fijamos primero
      countryNotes:
        de:
          lead: 'La selección aquí es mayor que en cualquier otro mercado de Europa, y la historia de servicio suele ser clara: la mayoría de los coches tienen un libro de servicio con marcas del concesionario por cada mantenimiento. El lado negativo son los altos kilometrajes. Doscientos mil en tres años es normal aquí, no un motivo para un descuento.'
          points:
            - Libro de servicio y marcas del concesionario — verificamos por VIN en un servicio oficial
            - Protocolo HU, que todos llaman TÜV — leemos las observaciones de la última inspección, no solo el sello
            - 'Coches de leasing y flotas corporativas: bien mantenidos, pero con alto kilometraje'
            - Carreteras invernales con reactivos — revisamos el fondo y los umbrales por separado
        rs:
          lead: Aquí estamos en el lugar, por lo que inspeccionamos el coche el mismo día de la consulta y sin importación. El mercado es pequeño, el mismo coche puede pasar por varios vendedores, y hay que desenmarañar la historia.
          points:
            - El coche ya está desaduanado y con matrículas locales — no se necesitan aranceles ni documentación de importación.
            - El kilometraje a menudo se ajusta al revender dentro del país — verificamos con las marcas de la inspección técnica.
            - 'Muchos coches importados de Alemania e Italia: verificamos qué pasó con el coche antes de la importación.'
            - Inspección el día de la consulta, sin esperar la logística.
        es:
          lead: Inviernos suaves y casi sin reactivos en las carreteras, por lo que el fondo de los coches españoles suele estar en mejor estado que el de los alemanes. Pero el sol y la cercanía al mar afectan la pintura, el plástico y todo lo de goma.
          points:
            - En la costa — buscamos corrosión principalmente en los huecos ocultos.
            - Laca descolorida y plástico del interior agrietado — lo incluimos en el coste.
            - 'Muchos coches de alquiler: kilometraje uniforme, pero uso intenso.'
            - Protocolo ITV — verificamos las observaciones y fechas de las inspecciones.
        ch:
          lead: 'Los coches suizos se cuidan mucho mejor que el promedio en Europa: el mantenimiento caro disciplina, los kilometrajes son bajos. Pero Suiza no está en la UE, por lo que los trámites de importación son diferentes, y lo incluimos en el presupuesto de antemano.'
          points:
            - Equipos ricos — aquí se compran más a menudo que en los países vecinos.
            - MFK — la inspección es estricta, se prepara en serio y esto se refleja en el coche.
            - 'No es UE: aduana y documentación no se manejan como para los países de la Unión Europea.'
            - Precios más altos que el mercado, pero ahorras después en reparaciones.
        pt:
          lead: El mercado es pequeño, la selección es más limitada que la española, pero la competencia por un buen coche es menor. El clima es húmedo y salado — la corrosión costera se encuentra incluso en coches nuevos.
          points:
            - Humedad y mar — huecos ocultos y electricidad son prioridad en la inspección.
            - 'Mercado pequeño: buscamos un poco más de tiempo para consultas específicas que en Alemania.'
            - Protocolo IPO — leemos las observaciones de las inspecciones anteriores.
            - Muchos diésel y coches pequeños, los tamaños grandes son raros.
        fr:
          lead: Francia es principalmente diésel y marcas propias. Peugeot, Renault y Citroën son más baratos aquí que en cualquier otro lugar de Europa. El premium alemán, en cambio, es más caro, y no tiene mucho sentido comprarlo aquí.
          points:
            - Marcas francesas — mejor precio en Europa, y el mantenimiento es más barato.
            - Diésel — el filtro de partículas y la válvula EGR los revisamos como un punto aparte.
            - Contrôle technique — los protocolos son detallados, verificamos las observaciones por año.
            - 'Uso urbano: el embrague y la suspensión se desgastan más rápido de lo declarado.'
        it:
          lead: 'El mercado italiano es bueno para coches pequeños y configuraciones raras, pero requiere precaución: los coches aquí son usados intensivamente y los reparaciones de carrocería pequeñas no siempre se realizan de manera cuidadosa.'
          points:
            - En la ciudad — frecuentes golpes menores y toques de pintura, el medidor de espesor es imprescindible.
            - El sur y la costa proporcionan sal y corrosión, el norte se asemeja más a las condiciones alemanas.
            - Revisione — verificamos la regularidad, las omisiones son más frecuentes de lo habitual.
            - Muchos coches con equipamiento de gas — lo revisamos por separado.
        pl:
          lead: 'El mercado más grande más cercano a nosotros: la logística es barata y rápida. Pero Polonia ha sido durante años el principal punto de reexportación para coches dañados de Europa Occidental, así que aquí verificamos la historia más rigurosamente que en ningún otro lugar.'
          points:
            - Alta proporción de coches reparados después de accidentes — la geometría de la carrocería es prioritaria.
            - 'Frecuentes reventas: un coche puede cambiar de varios propietarios en un año.'
            - El kilometraje a menudo se ajusta en el momento de la importación — verificamos contra las bases de servicio.
            - Plazo de entrega corto — más barato y rápido que desde España o Portugal.
      closing:
        eyebrow: ¿Cómo empezamos?
        line1: Describe el coche que
        line2: estás buscando —
        accentWord: después, nuestro trabajo
        text: Presupuesto, tipo de carrocería, transmisión, alguna preferencia. Nosotros buscamos y tú revisas los informes sobre las opciones y decides cuál ver en persona.
