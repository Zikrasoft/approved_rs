            text: Calculamos el costo total antes de iniciar — coche, logística, aranceles, documentación
          - n: '02'
            text: Buscamos y verificamos el coche en el país de origen
          - n: '03'
            text: Compramos el coche a nuestra empresa europea, lo damos de baja y preparamos los documentos de exportación
