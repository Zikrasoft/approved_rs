  es:
    vehicle-sourcing:
      hub:
        metaTitle: Selección de coches en Europa a medida
        metaDescription: 'Buscamos coches en Alemania, Serbia, España, Suiza, Italia, Francia, Polonia y Portugal: búsqueda, inspección, negociación y entrega a medida.'
        title: Selección de coches
        titleHighlight: a medida
        description: Seleccionamos un vehículo en el país donde se encuentra o planea comprar, con verificación completa, asesoramiento en la transacción y entrega a medida. Elija un país para ver los detalles.
        breadcrumbLabel: Selección de coches
        casesHeading: Transacciones reales de selección de coches
        chooseCountryLabel: 'Elija un país:'
        ctaLabel: Buscar coche
        heroPhotoAlt: Varios coches en el concesionario
        processHeading: Cómo se lleva a cabo la selección
        processLead: 'Desde la solicitud hasta la entrega suele tardar entre tres días y dos semanas. Nos lleva más tiempo encontrar el coche adecuado: no aceptamos el primero que se ajusta y buscamos hasta que encontramos uno sin problemas tras la verificación.'
        processSteps:
          - n: '01'
            text: 'Discutimos el presupuesto, la marca y los requisitos: lo que es importante y lo que se puede sacrificar'
          - n: '02'
            text: Seleccionamos opciones en el lugar y descartamos por teléfono las que no cumplen con los requisitos
          - n: '03'
            text: Vamos a la inspección con un medidor de grosor y un escáner, para BMW conectamos al ISTA del concesionario, tomamos fotos y videos
          - n: '04'
            text: Enviamos un informe y decimos directamente si vale la pena comprar o seguir buscando
          - n: '05'
            text: Negociamos, formalizamos la transacción y le entregamos el coche o lo llevamos a su puerta
        includedHeading: Qué incluye nuestro servicio
        includedLead: La comisión se fija antes de comenzar y no depende de cuántos coches hayamos revisado. Si después de la verificación decimos "no lo compres", seguimos buscando y no hay necesidad de pagar más por esto.
        included:
          - title: Búsqueda sin límite en el número de opciones
            text: Trabajamos hasta que encontramos un coche que no tenga problemas. Renunciar a una opción fallida está incluido en el servicio y no cuesta nada extra.
          - title: Visita de un experto para cada inspección
            text: 'Medidor de grosor en las paneles, escáner en los bloques, elevador donde sea necesario. Fotos y videos de todos los puntos problemáticos: usted ve lo mismo que nosotros.'
          - title: Verificación de historia y legalidad
            text: Informe de CarVertical por VIN, historial de servicio del concesionario por marca, comprobación del kilometraje, obligaciones, restricciones en la matrícula y eventos de seguros no cerrados.
          - title: Negociación y formalización del trato
            text: Negociamos el precio teniendo en cuenta lo encontrado, preparamos los documentos y acompañamos la firma.
          - title: Entrega y matriculación
            text: 'Llevamos el coche a su ciudad y ayudamos con la documentación en el lugar: ya sea que entreguemos las llaves donde le sea conveniente recogerlo.'
          - title: Una persona para todo el proceso
            text: Usted trabajará con el mismo especialista que fue a la inspección. No necesita explicar nuevamente la tarea a cada persona que conteste el teléfono.
        compareHeading: Cómo se diferencian los mercados
        compareLead: Un mismo modelo en Alemania y Polonia puede representar dos coches diferentes en cuanto a historia y precio.
        compareHint: 'Elija un país: le mostraremos lo que miramos primero allí.'
        compareLinkFor: Selección {location} – en detalle
      title: Selección de coches a medida
      descriptionFor: Seleccionaremos un coche en {location} – entre los que ya están en este país, sin importar desde el extranjero. Verificación completa, asesoramiento en la transacción y entrega a su ciudad.
      ctaLabel: Enviar solicitud
      casesHeadingFor: 'Transacciones reales: selección de coches {location}'
      breadcrumbLabelFor: Coches {location}
      stepsFor:
        - n: '01'
          text: 'Envíe su solicitud con los requisitos: presupuesto, marca, kilometraje'
        - n: '02'
          text: Buscamos opciones en {location} según sus criterios
        - n: '03'
          text: Un experto independiente inspecciona y revisa el coche
        - n: '04'
          text: Acompañamos la transacción, ayudamos con documentos y formalidades
        - n: '05'
          text: Entregamos el coche a su ciudad y ayudamos a matricularlo
      deliveryLineFor: Entregaremos el coche en cualquier ciudad del país. Si necesita ser exportado, nos ocupamos de la exportación y la aduana — lo llevamos a {destinations} y a cualquier otro país.
      deliveryDestinations:
        - Bosnia y Herzegovina
        - Croacia
        - Macedonia del Norte
        - Turquía
        - Kazajistán
        - Kirguistán
      citiesHeadingFor: Dónde inspeccionamos coches en {countryLocation}
      citiesLead: El experto viaja por todo el país, pero inspeccionamos más a menudo en las áreas donde hay más coches en venta. Esto es lo que significa para cada ciudad.
      alsoInLabel: 'También seleccionamos en:'
      crossSellLabel: ¿Necesita un coche que no sea local?
      countryNotesHeadingFor: Qué consideramos en {location}
      countryNotesPointsLabel: En qué miramos primero
      countryNotes:
        de:
          lead: 'Aquí hay más opciones que en cualquier otro mercado de Europa, y la historia de servicio generalmente es transparente: la mayoría de los coches tienen un libro de servicio con marcas de concesionario para cada revisión. La desventaja son los kilómetros en autopistas. Doscientos mil kilómetros en tres años es la norma, no una razón para un descuento.'
          points:
            - 'Libro de servicio y marcas del concesionario: verificamos por VIN en el servicio oficial'
            - 'Protocolo HU, que todos llaman TÜV: leemos las observaciones de la inspección anterior, no solo el sello'
            - 'Coches de leasing y flotas corporativas: bien mantenidos, pero con kilometrajes altos'
            - 'Carreteras invernales con reactivos: revisamos el chasis y los umbrales por separado'
        rs:
          lead: Aquí estamos presentes, por lo que inspeccionamos el coche el mismo día de la solicitud y sin importar la importación. El mercado es pequeño, un mismo coche puede pasar por varios vendedores, lo que hace necesario descifrar su historia.
          points:
            - 'El coche ya está desaduanado y tiene placas locales: no se requieren aranceles ni trámites de importación'
            - 'El kilometraje a menudo se ajusta en la reventa dentro del país: verificamos con las marcas de la inspección técnica'
            - 'Muchos coches importados de Alemania e Italia: verificamos qué ha pasado con el coche antes de la importación'
            - Inspección el mismo día de la solicitud, sin esperar logística
        es:
          lead: Invierno suave y casi sin reactivos en las carreteras, por lo que la parte inferior de los coches españoles suele estar en mejor estado que la de los alemanes. Sin embargo, el sol y la cercanía al mar afectan la pintura, el plástico y el caucho.
          points:
            - 'En la costa: buscamos corrosión principalmente en cavidades ocultas'
            - 'Laca desvanecida y plástico de interiores agrietado: lo incluimos en el precio'
            - 'Muchos coches de alquiler: kilometraje uniforme, pero uso intenso'
            - Protocolo ITV — verificamos las observaciones y fechas de revisión
        ch:
          lead: 'Los coches suizos están notablemente mejor cuidados que el promedio en Europa: el mantenimiento costoso disciplina, y los kilometrajes son bajos. Pero Suiza no está en la UE, por lo que la importación se gestiona de manera diferente, y ello se incluye en el presupuesto desde el principio.'
          points:
            - Equipamiento lujoso — aquí se solían seleccionar más que en los países vecinos
            - MFK — la revisión es rigurosa, se prepara en serio y eso se nota en el coche
            - 'No es UE: la aduana y la documentación se gestionan de manera distinta a los países de la Unión Europea'
            - El precio es más alto que el del mercado, pero ahorras después en las reparaciones
        pt:
          lead: El mercado es pequeño, la selección es más limitada que en España, pero la competencia por un buen coche es menor. El clima es húmedo y salino — la corrosión marina se encuentra incluso en coches nuevos.
          points:
            - Humedad y mar — las cavidades ocultas y la electricidad son prioridad en la inspección
            - 'Mercado pequeño: buscamos más tiempo para solicitudes concretas que en Alemania'
            - Protocolo IPO — leemos las observaciones de las revisiones anteriores
            - Muchos diésel y coches pequeños, las carrocerías grandes son raras
        fr:
          lead: Francia se caracteriza principalmente por diésel y marcas nacionales. Peugeot, Renault y Citroën son más baratos aquí que en cualquier parte de Europa. Por el contrario, el premium alemán es más caro y no tiene sentido adquirirlo aquí.
          points:
            - Marcas francesas — el mejor precio en Europa, y el mantenimiento es más barato
            - Diésel — revisamos el filtro de partículas y la válvula EGR como sección aparte
            - Contrôle technique — los protocolos son detallados, verificamos las observaciones por años
            - 'Uso urbano: el agarre y la suspensión se desgastan más rápido de lo declarado'
        it:
          lead: 'El mercado italiano es bueno para coches pequeños y equipamientos raros, pero requiere precaución: los coches aquí son usados intensamente y las reparaciones de carrocería suelen ser poco cuidadosas.'
          points:
            - En la ciudad — golpes pequeños y retoques frecuentes, esencial un medidor de grosor
            - El sur y la costa traen sal y corrosión, el norte se asemeja más a las condiciones alemanas
            - Revisione — verificamos la regularidad, las omisiones son más comunes de lo habitual
            - Muchos coches con equipamiento de gas — lo revisamos de forma separada
        pl:
          lead: 'El mercado más grande cercano a nosotros: la logística es económica y rápida. Pero Polonia ha sido durante años el principal punto de tránsito para coches dañados de Europa Occidental, por lo que aquí verificamos la historia más rigurosamente que en cualquier otro lugar.'
          points:
            - Alto porcentaje de coches reparados tras accidentes — la geometría de la carrocería es prioritaria
            - 'Reventas frecuentes: un coche puede cambiar de propietario varias veces al año'
            - El kilometraje se corrige a menudo en el momento de la importación — lo verificamos con bases de datos de servicios
            - Corta distancia de entrega — más barato y rápido que desde España o Portugal
      closing:
        eyebrow: ¿Por dónde empezamos?
        line1: Describe el coche que buscas, —
        line2: y luego nuestra parte
        accentWord: sigue siendo nuestro trabajo
        text: Presupuesto, carrocería, tipo de caja, un par de deseos adicionales. Nosotros buscamos, y ustedes revisan los informes sobre las opciones y deciden cuál ver en persona.
    vehicle-buyback:
      hub:
        metaTitle: Compra de coches con matrícula rusa en Europa
        metaDescription: Compramos coches con matrícula rusa en cualquier país de Europa y coches con matrícula serbia en Serbia. Evaluación en fotos en una hora, pago el día de la firma.
        title: Compra de coches
        titleHighlight: sin regateo durante semanas
        description: 'Recogemos coches que son difíciles de vender por métodos convencionales: matrícula rusa, importación caducada, documentos en disputa. El precio es inferior al del mercado — es el costo por rapidez y por asumir todas las molestias de la venta.'
        breadcrumbLabel: Compra de coches
        casesHeading: Transacciones reales de compra
        chooseCountryLabel: 'Elija un país:'
        ctaLabel: Obtener evaluación
        heroPhotoAlt: Llaves de coche sobre dinero y documentos
        processHeading: Cómo se realiza la compra
        processLead: Desde el primer mensaje hasta el pago suelen pasar de dos a tres días, y casi todo ese tiempo se ocupa el trayecto hasta el lugar de encuentro. La evaluación en fotos se da en el plazo de una hora.
        processSteps:
          - n: '01'
            text: Envías fotos, documentos y una descripción honesta del estado
          - n: '02'
            text: Damos el precio en una hora — de inmediato el definitivo, sin márgenes
          - n: '03'
            text: Acordamos un encuentro donde está el coche; si no está en marcha — llegamos con un remolque
          - n: '04'
            text: Inspeccionamos en persona y confirmamos el precio, si la descripción coincide
          - n: '05'
            text: Firmamos el contrato, el dinero se transfiere el día de la firma
        includedHeading: Lo que asumimos
        includedLead: Por la diferencia entre nuestro precio y el del mercado, asumimos todo lo que impide que un coche se venda durante meses.
        included:
          - title: Coches con matrícula rusa
            text: Categoría principal. El automóvil puede estar en cualquier país de Europa — iremos donde esté, y nosotros nos ocupamos de la exportación y la posterior reventa.
          - title: Problemas con la importación y plazos
            text: Tras la firma, los riesgos relacionados con la importación temporal caducada pasan a nosotros.
          - title: Evaluación sin inspección
            text: Damos el precio basado en fotos y documentos. Vamos solo cuando ambas partes ya han acordado la suma.
          - title: Trámites de la compra
            text: El contrato, la baja y todos los documentos los preparamos nosotros. De ustedes, solo necesitamos los documentos del coche y la firma.
          - title: Pago el día de la firma
            text: El dinero se transfiere ese mismo día. No tenemos esquemas de pago a plazos ni 'pagaremos tras la reventa'.
          - title: Negativa honesta
            text: Si el coche no nos conviene, lo diremos de inmediato y explicaremos la razón. No haremos esperar ni rebajar el precio durante el proceso.
      title: Compra de coches
