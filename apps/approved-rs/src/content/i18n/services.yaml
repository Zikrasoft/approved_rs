          - title: Payment on the day of signing
            text: Payment is made the same day. We do not have schemes involving installment plans or 'we'll pay more after resale.'
          - title: Honest refusal
            text: If the car is not suitable for us, we will let you know immediately and explain the reason. We won't drag it out or lower the price as it goes.
