        processSteps:
          - n: '01'
            text: Razgovaramo o budžetu, markama i zahtevima — šta je važno, a šta možete da žrtvujete
          - n: '02'
            text: Biramo opcije na licu mesta i filtriramo putem telefona sve što ne zadovoljava kriterijume
          - n: '03'
            text: Izlazimo na pregled sa mikrometrom i skenerom, za BMW povezujemo dealeru ISTA, pravimo fotografije i video zapise
          - n: '04'
