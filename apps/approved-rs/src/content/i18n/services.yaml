    vehicle-inspection:
      title: Provera automobila
      description: Nezavisna provera automobila pre kupovine. Dolazak eksperta, dijagnostika, izveštaj – bez obaveze kupovine.
      ctaLabel: Zakažite proveru
      casesHeading: Primeri provere
      breadcrumbLabel: Provera automobila
      steps:
        - n: '01'
          text: Karoserija i lak — prisustvo popravki ili nesreća
        - n: '02'
          text: Obustava, suspenzija, kočnice
        - n: '03'
          text: Motor, menjač, transmisija
        - n: '04'
          text: Elektronika i istorija servisiranja po VIN-u
        - n: '05'
          text: Pravna ispravnost — zalog, zabrana registracije, nesreće
      extraLine: Radimo i u drugim evropskim zemljama, uključujući Portugal — dodatne informacije prilikom prijave.
      hub:
        metaTitle: Provera automobila pre kupovine u Evropi
        metaDescription: 'Dolazimo do automobila koji ste sami pronašli: mjerač debljine, skener, provera istorije po VIN-u i izveštaj sa slikama istog dana. Radimo u osam evropskih zemalja.'
        title: Provera automobila
        titleHighlight: pre kupovine
        description: "Dolazimo do automobila koji ste sami pronašli i objašnjavamo šta se zaista dešava s njim. Izveštaj dobijate pre nego što platite: ako je odgovor 'ne kupujte', gubite samo cenu provere."
        breadcrumbLabel: Provera automobila
        casesHeading: Primeri provere
        chooseCountryLabel: 'Izaberite zemlju:'
        ctaLabel: Zakažite proveru
        heroPhotoAlt: Automobil na dizalici u servisu
        processHeading: Kako izgleda provera
        processLead: Obično dolazimo u roku od jednog do dva dana nakon prijave. Samo pregled traje jedan i po do dva sata, a izveštaj šaljemo istog dana, dok se automobil ne proda drugom kupcu.
        processSteps:
          - n: '01'
            text: Šaljete link na oglas i kontakte prodavca
          - n: '02'
            text: Dogovaramo se sa prodavcem o vremenu i mestu pregleda
          - n: '03'
            text: Dolazimo sa mjeračem debljine i skenerom, za BMW povezujemo se sa dilerskom ISTA, ako je potrebno — na dizalicu
          - n: '04'
            text: Pravimo slike i video snimke svih otkrića, proveravamo istoriju po VIN-u
          - n: '05'
            text: Šaljemo izveštaj i direktan odgovor — uzeti, pregovarati ili odbiti
        includedHeading: Šta uključuje provera
        includedLead: 'Više od 100 stavki na kontrolnom listi, ali gotovo uvek se odlučuju četiri zone: karoserija, motor sa menjačem, obustava i dokumenti. Prema njima najčešće odrađujemo odbijanja od kupovine.'
        included:
          - title: Karoserija i lak
            text: Mjerač debljine po svakoj panele, geometrija otvora, tragovi zavarivanja i spoliranja. Može se videti da li je bilo popravki koje prodavac nije spomenuo.
          - title: Motor i menjač
            text: Parametri na zagredjenom motoru, adaptacije menjača, greške u memoriji blokova. Najskuplja zona i najčešći razlog odbijanja.
          - title: Obustava i kočnice
            text: Lufovi, stanje suspenzije i kočionog sistema. Autobusni pređeni kilometri i balkanske ceste troše automobil na različite načine, i to se vidi.
          - title: Elektronika i istorija po VIN-u
            text: Izveštaj CarVertical, delerska servisna istorija po marki, saglasnost kilometraže sa istorijom, greške blokova i tragovi aktiviranih vazdušnih jastučića.
          - title: Pravna ispravnost
            text: Zalog, zabrana registracije, neuredne nesreće i osiguravajući događaji — to je ono što se sazna tek posle kupovine.
          - title: Izveštaj sa slikama i video snimcima
            text: Svako pronađeno snimljeno je i potpisano. Izveštaj ostaje kod vas — lako je pregovarati, čak i ako na kraju kupite automobil.
        compareHeading: Šta se menja iz zemlje u zemlju
        compareLead: Regulativa tehničkog pregleda, tipične greške lokalnih automobila i načini skrivanja istorije su različiti.
        compareHint: Izaberite zemlju — pokazujemo šta dodajemo u običan kontrolni spisak.
        compareLinkFor: Provera {location} — detaljno
        mapHeading: Četiri zone koje odlučuju o transakciji
        mapLead: Kontrolni spisak je dug, ali gotovo uvek odbijamo zbog jedne od četiri zone. Pritisnite broj na šemi — pokazujemo šta ekspert gleda i šta smo otkrili tamo.
      countryNotesHeadingFor: Kako proveravamo {location}
      countryNotesPointsLabel: Šta proveravamo osim običnog kontrolnog spiska
      countryNotes:
        de:
          lead: 'U Nemačkoj imamo oslonac: servisna knjižica, protokoli HU i razvijene baze podataka po VIN-u. Zato je provera ovde pre svega upoređivanje dokumenata sa onim što automobil pokazuje.'
          points:
            - Obeležja dilerskog održavanja upoređujemo sa očitanjima kilometraže po godinama
            - Zapažanja prošlog HU — šta je popravljeno posle pregleda, a šta je samo odloženo
            - Pod i pragovi po zimskim reagensima, uključujući skrivene prostore
            - 'Lizing istorija: redovno održavanje sa velikim pređenim kilometrima'
        rs:
          lead: 'U Srbiji dolazimo u dan prijave. Glavni cilj je da vratimo istoriju automobila do uvoza: lokalni dokumenti pokazuju samo poslednji deo života automobila.'
          points:
            - Zemlja porekla i stanje automobila do uvoza u Srbiju
            - Očitanja kilometraže protiv beleški tehničkog pregleda iz prethodnih godina
            - Popravke karoserije posle uvoza — čine se češće i jeftinije nego u EU
            - 'Pravna strana: zalog i ograničenja na registraciju'
        es:
          lead: Španski automobili često prijaju podom, ali razočaravaju svime što pati od sunca i soli. Fokusiramo proveru sa korozije donjih delova na skrivene prostore, elektroniku i stanje enterijera.
          points:
            - Korozija u skrivennim delovima uz obalu — ispod može biti čisto
            - Lak, zaptivači i plastika posle višegodišnjeg sunca
            - 'Iznajmljena prošlost: upoređujemo kilometražu sa stanjem trošenja enterijera'
            - Protokol ITV i šta je ostalo neusvojeno između pregleda
        ch:
          lead: Za MFK se ozbiljno pripremaju, pa svež protokol sam po sebi malo govori. Gledamo šta je tačno učinjeno pre pregleda, a šta je radilo svoj posao od prošle godine.
          points:
            - Šta je zamenjeno tačno pre MFK — sveži delovi na osnovu ostalog
            - Održavanje je skupo, zato proveravamo da li su odložili rutinsko održavanje
            - Opremanje je bogato, ali proveravamo da svaka opcija još funkcioniše
            - 'Dokumenti za uvoz: Švajcarska nije EU, set se razlikuje'
        pt:
          lead: 'Sve ovde se svodi na vlažnu morsku klimu. Proveru započinjemo sa korozijom i elektrikom: obično zakazivanje izda ono što živi u vlazi.'
          points:
            - Skriveni delovi, šasije i tačke pričvršćivanja suspenzije
            - Oksidacija konektora i blokova — tipični uzrok plovnih grešaka
            - Protokol IPO i učestalost pregleda
            - 'Dizelaši sa urbanom upotrebom: DPF i njegova istorija'
        fr:
          lead: 'U Francuskoj detaljan contrôle technique, što je dobar osnov. Dalje pogledamo šta regulativa ne hvata: resurs dizel grupe i habanje od gradskog saobraćaja.'
          points:
            - Priznatanja contrôle technique po godinama — šta se ponavlja iz pregleda u pregled
            - DPF, EGR i turbina na dizelima
            - Kvačila i suspenzija nakon gusto gradskog ciklusa
            - 'Istorija po francuskim markama: dostupne rezervne delove, ali slabosti'
        it:
          lead: Italijanski automobili češće dolaze sa sitnim karoserijkim popravkama, urađenim brzo i jeftino. Za mjerač debljine po panelima ovde često ide mnogo više vremena nego obično.
          points:
            - Mjerač debljine po svim panelima — popravke nakon gradskih povreda
            - 'Razlika između severa i juga: so uz obalu, uobičajeno habanje u unutrašnjosti'
            - Plinovni uređaji, ako postoje — instalacija i stanje rezervoara
            - Učestalost revisione i propušteni periodi
        pl:
          lead: Poljska je najveće preuzimanje tržište za oštećene automobile iz Zapadne Evrope. Zato prvo istražujemo šta se dešavalo s tim karoserijama pre prodaje.
          points:
            - Geometrija otvora i tragovi zavarivanja — obnova nakon ozbiljne nesreće
            - 'Istorija uvoza: odakle je došao automobil i u kakvom stanju'
            - Kilometražu upoređujemo sa evropskim servisnim bazama, odometru ne verujemo
            - Vazdušni jastučići i njihovo aktiviranje u prošlosti
      closing:
        eyebrow: Pronašli ste automobil?
        line1: Pošaljite link
        line2: na oglas —
        accentWord: doći ćemo i proveriti
        text: Dolazimo u jedan do dva dana. Izveštaj sa slikama ostaje kod vas, čak i ako se kasnije predomislite o kupovini.
    cityVehicleSourcing:
      title: Izbor automobila
      descriptionFor: Izaberi automobil u {cityLocation} sa potpunom proverom. Radimo širom regiona {countryName}.
      casesHeadingFor: Primeri iz {countryGenitiveOrName}
      whyCityHeadingFor: Zašto {cityName}
      reason1: Gledamo i kod dilera i u privatnim oglasima
      reason2: Proveravamo istoriju po VIN-u pre odlaska na pregled
      reason3For: Naš stručnjak u {cityLocation}
      reason4Dekra: DEKRA / TÜV provere na zahtev
      reason4Generic: Nezavisna tehnička ekspertiza na zahtev
      otherCitiesLabelFor: 'Ostali gradovi {countryLocation}:'
      cityNotesHeadingFor: Automobilsko tržište {cityLocation}
      cityNotesPointsLabel: Šta to praktično donosi
      cityNotes:
        berlin:
          lead: 'U Berlinu je najveći izbor u Nemačkoj i najraznolikija ponuda prodavaca. Tu se može naći sve: i automobili iz korporativnih flota sa kompletnom istorijom i opcije preprodaje iz Istočne Evrope.'
          points:
            - Ogroman izbor u svim segmentima, uključujući retke konfiguracije
            - Mnogo privatnih prodavaca — pregovaranje je realnije nego kod dilera
            - 'Gradski uslovi: kvačilo i amortizeri brže se troše nego kod automobila sa autoputa'
        munich:
          lead: 'Skupi grad sa skupim automobilima. Premium segmenta ovde je više nego bilo gde drugde u Nemačkoj, a stanje je u proseku bolje: ti automobili se dobro održavaju.'
          points:
            - Snažan premium segment, posebno BMW i Mercedes
            - Održavani automobili sa kompletnom istorijom iz prodaje
            - Cene su iznad proseka u zemlji — ušteda dolazi od stanja
        hamburg:
          lead: Lučki grad i veliki logistički centar. Sa ovih prostora je lako slati automobile dalje, a na tržištu se često mogu naći svežije uvezene automobile.
          points:
            - Luka blizu — lakše i jeftinije organizovati transport
            - Puno automobila iz severnih oblasti sa autoputskim pređenim kilometrima
            - 'Vlažna morska klima: pažljivije gledamo karoseriju i skrivena mesta'
        dusseldorf:
          lead: Centar Severnog Rajna-Vestfalije, najgušće naseljene pokrajine Nemačke. Pijače su blizu jedna drugoj, a do granice sa Holandijom i Belgijom je samo sat vožnje, tako da automobili redovno dolaze ovde na prodaju.
          points:
            - Za jedan izlazak možemo pregledati više automobila — prodajna mesta su blizu
            - 'Deo ponuda sa holandskim i belgijskim registracijama: proveravamo istoriju i dokumente posebno'
            - Puno prodavaca i konkurencija među njima — pregovor je lakši
        belgrade:
          lead: Naša baza. U Beogradu izlazimo na pregled istog dana, poznajemo lokalne prodavce i vidimo koja kola već drugi mesec cirkulišu po placovima.
          points:
            - Pregled istog dana, bez čekanja i logistike
            - Poznajemo lokalne prodavne placeve i istoriju automobila koji se nalaze na njima
            - Automobil je već carinjen — uvoz i dažbine nisu potrebni
        novi-sad:
          lead: Drugi po veličini grad Srbije, sat vožnje od Beograda. Tržište je manje, ali su cene obično stabilnije nego u prestonici, a automobili ređe prođu kroz više preprodaja.
          points:
            - Cene su niže nego u Beogradu uz uporedivo stanje
            - Malo preprodavaca, češće prvi vlasnici
            - Izlazimo iz Beograda, nema dodatne naplate za put
        pancevo:
          lead: Pančevo zapravo pripada beogradskoj aglomeraciji, pa pregled ovde ne odstupa od prestoničkog. Tržište je malo, ali su privatni oglasi interesantniji.
          points:
            - Dvadeset minuta od Beograda — odlazimo brzo
            - Malo tržište sa pretežno privatnim prodavcima
            - Često je jeftinije nego u prestonici uz isto stanje
        subotica:
          lead: 'Subotica se nalazi na granici sa Mađarskom, i to se odražava na tržištu: puno automobila uvezenih iz EU i prodavaca koji se time bave.'
          points:
            - Granično tržište — mnogo svežeg uvoza iz Evropske unije
            - Proveravamo istoriju pre uvoza posebno pažljivo
            - Povoljna tačka ako planirate da automobile odvedete dalje na sever
        madrid:
          lead: 'Glavno tržište Španije: najveći izbor u zemlji i puno automobila iz korporativnih flota. Kontinentalna klima, pa morska korozija ovde je manja nego na obali.'
          points:
            - Najveći izbor u Španiji, uključujući korporativne automobile
            - Daleko od mora — karoserije su obično čistije nego na obali
            - 'Vruće leto: plastiku, lak i klima uređaj proveravamo odvojeno'
        barcelona:
          lead: Sve određuje blizina mora. Automobili često izgledaju odlično sa donje strane, ali zahtevaju pažnju na skrivena mesta i elektriku.
          points:
            - 'More blizu, pa proveravamo skrivena mesta: donja strana je često čista, a unutra ne'
            - Puno bivših iznajmljivanih i autodeljenih automobila
            - Luka blizu, morski transport se lakše organizuje
        zurich:
          lead: Cirih — najskuplje automobilsko tržište regiona. Ovde se uzimaju maksimalne konfiguracije, servisiraju kod dilera, a prodaju pre nego što se automobil istroši.
          points:
            - Maksimalne konfiguracije i niske pređene kilometre
            - Dilersko održavanje — istorija skoro uvek potpuna
            - Švajcarska nije u EU, uvoz se uređuje posebno
        geneva:
          lead: Ženeva je u francuskom delu Švajcarske, blizu granice sa Francuskom. Francuskih marki na tržištu je znatno više nego u nemačkom delu zemlje.
          points:
            - 'Mešovito tržište: švajcarsko stanje, francuska ponuda'
            - Granica sa Francuskom blizu — ima čemu da se poredi po ceni
            - 'Procedura se ne razlikuje od ostatka Švajcarske: izvoz plus uvoz'
        paris:
          lead: 'Najveći izbor u Francuskoj dolazi sa najviše eksploatacije: gust saobraćaj i uske parkinge ostavljaju tragove na karoseriji i suspenziji.'
          points:
            - Najveći izbor u Francuskoj, posebno francuskih marki
            - 'Gradski uslovi: kvačilo, suspenzija i sitne oštećenja karoserije'
            - Puno dizelaša — čest je problem sa čestitim filtrima i EGR-om
        lyon:
          lead: Lyon je mirniji od Pariza i po cenama i po stanju automobila. Autoput ka jugu je blizu, pa se češće nalaze automobili sa ravnim pređenim kilometrima.
          points:
            - Cene su niže nego u Parizu uz uporediv izbor
            - Više autocestovnih pređenih kilometara, manje gradskog trošenja
            - Povoljna ruta do Italije i Španije, ako tražimo šire
        milan:
          lead: 'Poslovna prestonica Italije, i na tržištu to je vidljivo. Sever zemlje je bliži nemačkim uslovima: putevi su bolji, automobili bolje održavani nego na jugu.'
          points:
            - Najbolji izbor premium segmenta u Italiji
            - Sever — manje soli i korozije nego na jugu zemlje
            - 'Gusto naselje: merenje debljine karoserije je obavezno'
        rome:
          lead: Veliko tržište sa veoma gustim gradskim eksploatacijama. Sitne ogrebotine ovde se smatraju normalnim, i često ih popravljaju brzo i površno.
          points:
            - Puno malih automobila i automobila sa plinskim uređajem
            - Česte popravke nakon gradskih kontakata — proveravamo svaku stranu
            - Južnije od Milana — klima je blaža, ali bliže moru
        warsaw:
          lead: Preko Varšave u zemlju ulazi glavni uvoz iz Zapadne Evrope, a ovde je i najveći izbor u Poljskoj. Udeo obnovljenih automobila je takođe najviši.
          points:
            - Najveći izbor u Poljskoj, puno svežeg uvoza iz EU
            - Proveravamo geometriju karoserije i tragove popravki pre svega
            - Kratka ruta isporuke — jeftinije nego iz Južne Evrope
        krakow:
          lead: 'Krakov je mirniji od Varšave: tržište je manje, preprodaja je manje, a automobili češće zadržavaju jednog vlasnika duže. Jug Poljske je logistički bliži Balkanu.'
          points:
            - Manje preprodavaca nego u Varšavi, istorija je obično čistija
            - Cene često niže nego u prestonici
            - Bliže putu na jug — zgodno za isporuku u Srbiju
