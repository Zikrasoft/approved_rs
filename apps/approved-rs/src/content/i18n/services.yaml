    vehicle-inspection:
      title: Inspección de coches
      description: Inspección independiente del coche antes de la compra. Visita del experto, diagnóstico, informe — sin compromiso de compra.
      ctaLabel: Solicitar inspección
      casesHeading: 'Transacciones reales: inspección antes de la compra'
      breadcrumbLabel: Inspección de coches
      steps:
        - n: '01'
          text: Carrocería y pintura — presencia de reparaciones o accidentes
        - n: '02'
          text: Suspensión, frenos
        - n: '03'
          text: Motor, caja de cambios, transmisión
        - n: '04'
          text: Electrónica e historial de mantenimiento por VIN
        - n: '05'
          text: Limpieza legal — embargos, prohibición de registro, accidentes
      extraLine: Trabajamos también en otros países de Europa, incluyendo Portugal — consulta al hacer la solicitud.
      hub:
        metaTitle: Inspección de coches antes de la compra en Europa
        metaDescription: 'Nos desplazamos al coche que encontraste tú mismo: medidores de grosor, escáner, verificación del historial por VIN e informe con fotos el mismo día. Operamos en ocho países de Europa.'
        title: Inspección de coches
        titleHighlight: antes de la compra
        description: 'Nos desplazamos al coche que encontraste tú mismo, y te contamos cómo está realmente. El informe llega antes de que entregues el dinero: si la respuesta es ‘no lo compres’, solo perderás el costo de la inspección.'
        breadcrumbLabel: Inspección de coches
        casesHeading: 'Transacciones reales: inspección antes de la compra'
        chooseCountryLabel: 'Seleccione un país:'
        ctaLabel: Solicitar inspección
        heroPhotoAlt: Coche en elevador en el taller
        processHeading: ¿Cómo se realiza la inspección?
        processLead: Generalmente salimos dentro de uno o dos días después de la solicitud. La inspección en sí toma una a dos horas, el informe se envía el mismo día, mientras el coche aún no ha sido vendido a otro comprador.
        processSteps:
          - n: '01'
            text: Envías un enlace al anuncio y los contatos del vendedor
          - n: '02'
            text: Acordamos con el vendedor la hora y lugar de la inspección
          - n: '03'
            text: Llevamos medidor de grosor y escáner, para BMW conectamos ISTA de concesionario, si es necesario, al elevador
          - n: '04'
            text: Tomamos fotos y videos de todos los hallazgos, verificamos el historial por VIN
          - n: '05'
            text: Enviamos el informe y una respuesta directa — comprar, negociar o rechazar
        includedHeading: ¿Qué incluye la inspección?
        includedLead: 'Más de cien puntos en la lista de verificación, pero casi siempre son decisivas cuatro áreas: carrocería, motor con caja de cambios, suspensión y documentos. Precisamente en estas áreas a menudo desaconsejamos la compra.'
        included:
          - title: Carrocería y pintura
            text: Medición de grosor en cada panel, geometría de los aberturas, señales de soldadura y masilla. Se puede ver si hubo una reparación que el vendedor no mencionó.
          - title: Motor y caja de cambios
            text: Parámetros en motor caliente, adaptación de la caja de cambios, errores en memoria de módulos. La zona más costosa y la razón más común de rechazo.
          - title: Suspensión y frenos
            text: Holguras, estado de suspensión y sistema de frenos. El kilometraje en autopista y las carreteras balcánicas desgastan el coche de manera diferente, y eso se nota.
          - title: Electrónica e historial por VIN
            text: Informe de CarVertical, historial de servicio del concesionario por marca, discrepancia de kilometraje con el historial, errores en módulos y evidencias de airbags desplegados.
          - title: Transparencia legal
            text: Embargo, prohibición de registro, accidentes no resueltos y eventos de seguros, todo lo que surge solo después de la compra.
          - title: Informe con fotos y videos
            text: Cada hallazgo está documentado con fotos. El informe se queda con usted, útil para negociar, incluso si decide comprar el coche.
        compareHeading: Qué varía de un país a otro
        compareLead: Regulaciones de inspección, problemas típicos de los coches locales y formas de ocultar el historial en todas partes.
        compareHint: Elija un país y mostraremos qué añadimos a la lista de verificación habitual.
        compareLinkFor: Inspección en {location} — detalles
        mapHeading: Cuatro áreas que deciden la transacción
        mapLead: La lista de verificación es extensa, pero normalmente desaconsejamos la compra por una de estas cuatro áreas. Haga clic en un número en el esquema para ver lo que observa el experto y lo que hemos encontrado allí.
      countryNotesHeadingFor: Cómo revisamos {location}
      countryNotesPointsLabel: Qué revisamos además de la lista de verificación habitual
      countryNotes:
        de:
          lead: 'En Alemania hay mucho en lo que apoyarse: libro de servicio, protocolos HU y bases de datos VIN bien desarrolladas. Por eso, la inspección aquí se centra principalmente en verificar documentos con lo que muestra el coche.'
          points:
            - Verificamos las marcas de mantenimiento del concesionario con el odómetro por años
            - 'Observaciones del HU anterior: qué se reparó después de la inspección y qué simplemente se pospuso'
            - El fondo y los umbrales después de reactivos invernales, incluidas cavidades ocultas
            - 'Historial de leasing: mantenimiento constante con alta kilometraje'
        rs:
          lead: 'En Serbia, salimos el día de la solicitud. La principal tarea es reconstruir el historial del coche antes de su entrada: los documentos locales solo muestran la última etapa de la vida del vehículo.'
          points:
            - País de origen y estado del coche antes de entrar a Serbia
            - Lectura del odómetro contra marcas de inspección técnica de años anteriores
            - Reparaciones de carrocería después de la importación, se realizan más a menudo y a menor costo que en la UE
            - 'Parte legal: embargos y restricciones de registro'
        es:
          lead: Los coches españoles generalmente tienen buenos bajos pero están perjudicados por el sol y la sal. La inspección se centra más en cavidades ocultas, electricidad y estado del interior que en corrosión inferior.
          points:
            - Corrosión en cavidades ocultas en la costa, puede estar limpio por debajo
            - Pintura, sellos y plástico después de años de sol
            - 'Historial de alquiler: verificamos el kilometraje con el nivel de desgaste del interior'
            - Protocolo ITV y lo que queda pendiente entre inspecciones
        ch:
          lead: Los coches en Suiza se preparan en serio para la MFK, por lo que un protocolo reciente por sí solo dice poco. Verificamos qué se hizo justo antes de la inspección y qué ha continuado con su vida desde el año pasado.
          points:
            - Qué se reemplazó justo antes de la MFK, partes nuevas contra el resto
            - El mantenimiento es caro, por lo que verificamos si se han pospuesto los servicios
            - La configuración es rica, pero comprobamos que cada opción aún funcione
            - 'Documentos para la importación: Suiza no es UE, el conjunto es diferente'
        pt:
          lead: 'Todo aquí depende del clima marino húmedo. Iniciamos la inspección con corrosión y electricidad: lo que suele fallar es lo que vive en la humedad.'
          points:
            - Cavidades ocultas, largueros y puntos de anclaje de la suspensión
            - Oxidación de conectores y módulos, la causa típica de errores intermitentes
            - Protocolo IPO y regularidad de las inspecciones
            - 'Diéseles de uso urbano: filtro de partículas y su historia'
        fr:
          lead: 'En Francia, un contrôle technique detallado es un buen punto de partida. Luego, observamos lo que el reglamento no captura: la vida útil del grupo diesel y el desgaste del tráfico urbano.'
          points:
            - 'Observaciones del contrôle technique a través de los años: qué se repite de una inspección a otra'
            - Filtro de partículas, EGR y turbocompresor en diéseles
            - Embrague y suspensión después de un ciclo urbano denso
            - 'Historial de marcas francesas: piezas accesibles, pero con sus debilidades'
        it:
          lead: Los coches italianos a menudo llegan con reparaciones de carrocería hechas rápida y económicamente. Aquí, se necesita notablemente más tiempo para medir los paneles que lo habitual.
          points:
            - 'Medición de grosor en todos los paneles: retoques tras roce urbano'
            - 'Diferencia entre el norte y el sur: sal en la costa, desgaste habitual en el interior del país'
            - 'Equipo de gas, si está presente: instalación y estado del cilindro'
            - Regularidad de la revisione y períodos omitidos
        pl:
          lead: Polonia es el mayor mercado de trampolín para coches dañados de Europa Occidental. Por lo tanto, primero averiguamos qué se hizo con la carrocería antes de la venta.
          points:
            - 'Geometría de los espacios y marcas de soldadura: reparación tras un accidente grave'
            - 'Historia de importación: de dónde vino el coche y en qué estado'
            - Verificamos el kilometraje con bases de datos de servicio europeas, no confiamos en el odómetro
            - Airbags y su activación en el pasado
      closing:
        eyebrow: ¿Encontró un coche?
        line1: Envíe el enlace
        line2: del anuncio —
        accentWord: iremos a verlo
        text: Salimos en uno o dos días. El informe con fotos se queda con usted, incluso si luego decide no comprar.
    cityVehicleSourcing:
      title: Selección de coches
      descriptionFor: Buscaremos un coche en {cityLocation} con una revisión completa. Trabajamos en toda la región de {countryName}.
      casesHeadingFor: Transacciones reales en el mercado de {countryGenitiveOrName}
      whyCityHeadingFor: Por qué {cityName}
      reason1: Revisamos tanto concesionarios como anuncios privados
      reason2: Comprobamos la historia por VIN antes de salir a la inspección
      reason3For: Nuestro experto en {cityLocation}
      reason4Dekra: Inspección DEKRA / TÜV a solicitud
      reason4Generic: Peritaje técnico independiente a solicitud
      otherCitiesLabelFor: 'Otras ciudades de {countryLocation}:'
      cityNotesHeadingFor: Mercado automotriz de {cityLocation}
      cityNotesPointsLabel: Lo que esto implica en la práctica
      cityNotes:
        berlin:
          lead: 'Berlín tiene la mayor selección en Alemania y una variedad vibrante de vendedores. Aquí puedes encontrar de todo: desde coches de flotas corporativas con un historial completo hasta opciones de reventa que han llegado de Europa del Este.'
          points:
            - Amplia variedad en todos los segmentos, incluyendo configuraciones raras
            - Muchos vendedores particulares, la negociación es más real que con los concesionarios
            - 'Ciclo urbano: el desgaste en el agarre y la suspensión es más notorio que en coches de autopista'
        munich:
          lead: 'Una ciudad cara con coches caros. Aquí hay más vehículos de gama premium que en cualquier otro lugar de Alemania, y el estado de los coches es generalmente superior: están bien cuidados.'
          points:
            - Fuerte segmento premium, especialmente BMW y Mercedes
            - Coches bien mantenidos con un historial completo de concesionario
            - Precios por encima de la media nacional, la economía viene del estado de los coches
        hamburg:
          lead: Ciudad portuaria y un importante nudo logístico. Desde aquí es fácil enviar coches a otras partes, y el mercado a menudo tiene coches importados recientes.
          points:
            - Puerto cercano, más fácil y barato organizar el envío
            - Muchas coches de tierras del norte con kilometrajes de autopista
            - 'Clima marino húmedo: revisamos la carrocería y los espacios ocultos con más cuidado'
        dusseldorf:
          lead: Centro de Renania del Norte-Westfalia, la región más poblada de Alemania. Las plataformas están apiñadas, y la frontera con los Países Bajos y Bélgica está a una hora, por lo que aquí llegan regularmente coches en venta.
          points:
            - Podemos ver varios coches en un solo viaje, las plataformas están cerca
            - 'Parte de las ofertas son con matrículas holandesas y belgas: comprobamos la historia y documentos por separado'
            - Hay muchos vendedores que compiten entre sí, la negociación es más activa
        belgrade:
          lead: Nuestra base. En Belgrado, realizamos la inspección el mismo día, conocemos a los vendedores locales y vemos qué coche ha estado dando vueltas en las plataformas durante dos meses.
          points:
            - Inspección el mismo día, sin esperas ni logística
            - Conocemos las plataformas locales y la historia de los coches que tienen
            - El coche ya está despachado, no se necesitan aranceles ni permisos
        novi-sad:
          lead: La segunda ciudad más grande de Serbia, a una hora de Belgrado. El mercado es más pequeño, pero los precios suelen ser más tranquilos que en la capital, y los coches rara vez han pasado por muchas reventas.
          points:
            - Precios más bajos que en Belgrado con un estado comparable
            - Menos revendedores, más frecuentemente el primer dueño
            - Salimos desde Belgrado, no hay costo adicional por el viaje
        pancevo:
          lead: Pančevo forma parte de la aglomeración de Belgrado, por lo que la inspección aquí no difiere de la capital. El mercado es pequeño, pero los anuncios privados suelen ser más interesantes.
          points:
            - Veinte minutos de Belgrado, salimos igual de rápido
            - Pequeño mercado con predominancia de vendedores particulares
            - A menudo más barato que en la capital con el mismo estado
        subotica:
          lead: 'Subotica está en la frontera con Hungría, y eso se refleja en el mercado: muchos coches importados de la UE y vendedores que se dedican a ello de forma constante.'
          points:
            - Mercado fronterizo, mucha importación fresca de la Unión Europea
            - Verificamos la historia antes de la importación de forma exhaustiva
            - Ubicación conveniente si planeas llevar el coche más al norte
        madrid:
          lead: 'El mercado capitalino de España: la mayor selección del país y muchos coches de flotas corporativas. El clima continental significa que aquí hay menos corrosión costera que en la costa.'
          points:
            - La mayor selección en España, incluyendo coches corporativos
            - Lejos del mar, las carrocerías suelen estar más limpias que las de la costa
            - 'Verano caluroso: revisamos el plástico, la pintura y el aire acondicionado por separado'
        barcelona:
          lead: Todo está determinado por la cercanía al mar. Los coches a menudo se ven excelentes por debajo, pero requieren atención a los espacios ocultos y la electricidad.
          points:
            - 'El mar está cerca, así que revisamos los espacios ocultos: por debajo a menudo están limpios, pero por dentro no'
            - Muchos coches de alquiler y de carsharing
            - Puerto cercano, la organización del envío marítimo es más fácil
        zurich:
          lead: Zúrich es el mercado automovilístico más caro de la región. Aquí se eligen las configuraciones máximas, se mantienen en concesionarios, y se venden antes de que tengan tiempo de desgastarse.
          points:
            - Configuraciones máximas y kilometrajes bajos
            - Mantenimiento de concesionarios, la historia casi siempre está completa
            - Suiza no forma parte de la UE, la importación se gestiona por separado
        geneva:
          lead: Ginebra está en la parte francófona de Suiza, justo en la frontera con Francia. Hay muchas más marcas francesas en el mercado que en la parte alemana del país.
          points:
            - 'Mercado mixto: estado suizo, variedad francesa'
            - La frontera con Francia está cerca, hay algo con que comparar en precio
            - 'El proceso es el mismo que en toda Suiza: exportación más importación'
        paris:
          lead: 'La mayor selección en Francia viene con un uso bastante severo: el intenso tráfico y los estacionamientos estrechos dejan huellas en la carrocería y la suspensión.'
          points:
            - La mayor selección en Francia, especialmente de marcas francesas
            - 'Ciclo urbano: agarre, suspensión y pequeños daños en la carrocería'
            - Muchos diéseles, revisamos el filtro de partículas y el EGR primero
        lyon:
          lead: Lyon es más tranquilo que París tanto en precios como en el estado de los coches. La autopista al sur está cerca, así que a menudo hay vehículos con kilometrajes de carretera regulares.
          points:
            - Precios más bajos que en París con una selección comparable
            - Más kilometrajes de carretera, menos desgaste urbano
            - Ubicación conveniente hacia Italia y España, si buscamos más opciones
        milan:
          lead: 'La capital comercial de Italia, y el dinero se nota en el mercado. El norte del país tiene condiciones más cercanas a las alemanas: carreteras mejores, coches mejor cuidados que en el sur.'
          points:
            - La mejor selección del segmento premium en Italia
            - El norte tiene menos sal y corrosión que el sur
            - 'Ciudad densa: un medidor de espesor en los paneles es esencial'
        rome:
          lead: Un gran mercado con una intensa ocupación urbana. Las pequeñas imperfecciones aquí son consideradas parte de la vida cotidiana y a menudo se reparan de forma rápida.
          points:
            - Muchos coches pequeños y vehículos con equipo de gas
            - Frecuentes retocados tras contactos urbanos, revisamos cada panel
            - Al sur de Milán, el clima es más suave, pero más cerca del mar
        warsaw:
          lead: A través de Varsovia, entra a Polonia la mayor parte de las importaciones desde Europa Occidental, y aquí hay la mayor selección del país. La proporción de coches reacondicionados también es la más alta.
          points:
            - La mayor selección en Polonia, mucha importación reciente de la UE
            - Verificamos primero la forma de la carrocería y las huellas de reparaciones
            - Corto tiempo de entrega, más barato que desde el sur de Europa
        krakow:
          lead: 'Cracovia es más tranquila que Varsovia: el mercado es más pequeño, hay menos reventa, y los coches suelen tener un único propietario por más tiempo. El sur de Polonia está más cerca de los Balcanes logísticamente.'
          points:
            - Menos revendedores que en Varsovia, la historia suele ser más clara
            - Los precios son a menudo más bajos que en la capital
            - Más cerca de la ruta hacia el sur, conveniente para la entrega a Serbia
    caseChrome:
      autoLabel: Auto
      yearLabel: Año
      priceLabel: Precio
