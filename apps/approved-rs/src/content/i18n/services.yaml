          - title: Zahlung am Tag der Unterzeichnung
            text: Das Geld wird am selben Tag überwiesen. Ratenzahlungsmodelle und "nach dem Weiterverkauf nachzahlen" haben wir nicht.
          - title: Ehrliche Absagen
            text: Wenn uns das Auto nicht passt, sagen wir es sofort und erklären den Grund. Wir werden nicht zögern und den Preis während des Prozesses nicht drücken.
