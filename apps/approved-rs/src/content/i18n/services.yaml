            text: Wir unterzeichnen den Vertrag, das Geld wird am Tag der Unterzeichnung überwiesen
        includedHeading: Was wir übernehmen
        includedLead: Für die Differenz zwischen unserem Preis und dem Marktwert übernehmen wir alles, weshalb ein solches Fahrzeug monatelang nicht verkauft wird.
        included:
          - title: Autos mit russischen Nummern
            text: Hauptkategorie. Das Fahrzeug kann sich in jedem europäischen Land befinden – wir kommen dorthin, wo es steht, und kümmern uns um den Abtransport und den weiteren Wiederverkauf.
          - title: Probleme mit der Einfuhr und Fristen
            text: Nach der Unterzeichnung gehen abgelaufene vorübergehende Einfuhr und die damit verbundenen Risiken auf uns über.
          - title: Bewertung ohne Besichtigung
            text: Wir nennen den Preis anhand von Fotos und Dokumenten. Wir kommen nur, wenn beide Parteien sich über den Betrag einig sind.
          - title: Abschluss des Deals
            text: Vertrag, Abmeldung und alle Unterlagen bereiten wir selbst vor. Von Ihnen benötigen wir die Fahrzeugdokumente und Ihre Unterschrift.
          - title: Zahlung am Tag der Unterzeichnung
            text: Das Geld wird am selben Tag überwiesen. Wir bieten keine Ratenzahlung oder „nach dem Weiterverkauf zahlen“-Modelle an.
          - title: Ehrlicher Rückzug
            text: Wenn das Auto für uns nicht geeignet ist, sagen wir sofort Bescheid und erklären den Grund. Wir werden nicht zögern und den Preis währenddessen nicht drücken.
