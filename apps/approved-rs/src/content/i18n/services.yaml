    vehicle-import:
      hub:
        metaTitle: Autoimport aus Europa und China komplett
        metaDescription: Wir importieren Autos aus Deutschland, Spanien, der Schweiz und China in jedes Land. Suche, Prüfung, Transport und Zollabwicklung aus einer Hand.
        title: Autoimport
        titleHighlight: aus Europa und China
        description: Das Auto steht in Europa oder China, Sie können überall sein. Wir suchen, prüfen und liefern es komplett bis zu Ihnen, inklusive Zollabwicklung.
        breadcrumbLabel: Autoimport
        casesHeading: Abgeschlossene Autoimporte
        euCardTitle: Aus Europa
        euCardText: Spanien, Schweiz und weitere Länder. Suche und Lieferung an jeden Ort.
        chinaCardTitle: Aus China
        chinaCardText: Neue und gebrauchte Autos aus China, Lieferung über einen geprüften Partner.
        exploreLabel: Mehr erfahren
        ctaLabel: Importkosten berechnen
        heroPhotoAlt: Autotransporter mit geladenen Fahrzeugen
        processHeading: So läuft der Autoimport ab
        processLead: Von der Anfrage bis zu den Kennzeichen dauert es meist vier bis acht Wochen. Die Fahrt macht davon den kleinsten Teil aus. Von Deutschland nach Belgrad ist das Auto nur wenige Tage unterwegs, Zollabwicklung und Zulassung dauern dagegen Wochen.
        processSteps:
          - n: '01'
            text: 'Wir berechnen vorab die Gesamtkosten: Auto, Transport, Abgaben und Abwicklung'
          - n: '02'
            text: Wir finden und prüfen das Auto im Herkunftsland
          - n: '03'
            text: Wir kaufen das Auto über unsere europäische Firma, melden es ab und bereiten die Ausfuhrpapiere vor
          - n: '04'
            text: Wir transportieren es per Autotransporter oder auf eigener Achse mit Überführungskennzeichen
          - n: '05'
            text: Wir erledigen die Zollabwicklung und Zulassung und übergeben Ihnen die Schlüssel
        includedHeading: So setzt sich der Preis zusammen
        includedLead: 'Beim Eigenimport sprengt oft das Budget, was zusätzlich zum Kaufpreis anfällt. Wir berechnen diese Kosten im Voraus und halten sie fest: Der Endpreis sollte nicht von der ersten Kalkulation abweichen.'
        included:
          - title: Kaufpreis des Autos
            text: Der Preis nach der Verhandlung, nicht der Angebotspreis. Wir verhandeln mit den Ergebnissen der Besichtigung in der Hand. Das gleicht oft einen Teil der Kosten aus.
          - title: Transport bis zum Zielort
            text: Transport per Autotransporter oder Überführung mit Überführungskennzeichen. Wir vergleichen beide Möglichkeiten und wählen die günstigere für die jeweilige Strecke.
          - title: Zölle und Steuern
            text: Der Zollsatz hängt vom Herkunftsland und Alter des Autos ab. Bei in Europa hergestellten Fahrzeugen kann das EUR.1-Zertifikat die Berechnung grundlegend verändern. Deshalb prüfen wir vor dem Kauf, ob es vorliegt.
          - title: Ausfuhr und Transit
            text: Abmeldung im Verkäuferland, Ausfuhranmeldung, Überführungskennzeichen und Versicherung für die Überführung.
          - title: Zollabwicklung
            text: Zollanmeldung, Zollagent und Zahlung am Zielort. Wir bereiten die Unterlagen im Voraus vor, damit das Auto nicht unnötig lange im Lager steht.
          - title: Zulassung
            text: Technische Prüfung, Zulassung und Kennzeichen. Sie übernehmen ein Auto, mit dem Sie sofort fahren können.
