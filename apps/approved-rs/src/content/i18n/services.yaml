            text: Tras la firma, los riesgos del tiempo de importación vencido pasan a ser nuestra responsabilidad.
          - title: Evaluación sin inspección
            text: Damos el precio basándonos en fotos y documentos. Solo vamos cuando ambas partes están de acuerdo con la cantidad.
          - title: Tramitación del acuerdo
            text: Preparamos el contrato, la baja del registro y toda la documentación. De tu parte solo necesitamos los documentos del coche y tu firma.
          - title: Pago el día de la firma
