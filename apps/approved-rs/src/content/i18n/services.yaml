            - El certificado EUR1 confirma la procedencia y reduce el arancel.
            - 'Normas de emisiones uniformes: un coche de cualquier país de la UE pasa la inspección técnica igual.'
            - Cuanto más corto sea el trayecto, más a menudo es rentable conducir en lugar de usar un camión transportador.
