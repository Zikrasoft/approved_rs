          - title: Pregovaranje i obavljanje transakcije
            text: Dogovaramo cenu uzimajući u obzir pronađeno, pripremamo dokumente i pratimo potpisivanje.
          - title: Dostava i registracija
            text: Dovozimo automobil do vašeg grada i pomažemo sa registracijom na licu mesta ili vam predajemo ključeve gde god vam odgovara.
          - title: Jedna osoba za ceo proces
            text: Sa vama radi isti stručnjak koji je bio na pregledu. Nema potrebe da ponovo objašnjavate zadatak svakome ko se javi.
