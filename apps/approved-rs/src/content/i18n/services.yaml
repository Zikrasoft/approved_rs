          points:
            - Flete marítimo — el principal tiempo, plánifíquelo en meses, no en semanas
            - 'El origen europeo no se confirma: EUR1 no se aplica aquí, el arancel es más alto'
            - 'Servicio y repuestos: verificamos si el modelo se da servicio en el país de destino'
            - 'Coches eléctricos: verificamos el conector de carga y la compatibilidad con las redes locales'
