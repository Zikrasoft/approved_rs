          - title: Vertragsabwicklung
            text: Vertrag, Abmeldung und alle Unterlagen bereiten wir selbst vor. Von Ihnen benötigen wir die Dokumente für das Auto und Ihre Unterschrift.
          - title: Abwicklung am Tag der Unterzeichnung
            text: Das Geld wird noch am selben Tag überwiesen. Ratenzahlungen und "nach dem Weiterverkauf zahlen" haben wir nicht.
          - title: Ehrliche Ablehnung
            text: Wenn das Fahrzeug nicht zu uns passt, sagen wir sofort Bescheid und erklären den Grund. Wir werden nicht zögern oder den Preis währenddessen drücken.
