      step3Other: Quedamos para inspeccionarlo. Matrícula rusa; el coche puede estar en cualquier país de Europa
      step4: Formalizamos la operación y pagamos el día de la firma
      closing:
        eyebrow: ¿Quieres una valoración?
        line1: Envíanos fotos
        line2: y la documentación,
        accentWord: el precio en una hora
        text: La tasación es gratuita y sin compromiso. Si no le convence el precio, lo dejamos aquí, sin insistir ni volver a llamar.
    vehicle-import:
      hub:
        metaTitle: Importación de coches de Europa y China
        metaDescription: Importamos coches de Alemania, España, Suiza y China a cualquier país. Búsqueda, inspección, transporte y despacho de aduanas.
        title: Importación de coches
        titleHighlight: de Europa y China
        description: El coche está en Europa o China y usted, donde quiera. Lo buscamos, inspeccionamos y se lo entregamos con todos los trámites, incluido el despacho de aduanas.
        breadcrumbLabel: Importación de coches
        casesHeading: Importaciones realizadas
        euCardTitle: Desde Europa
        euCardText: España, Suiza y otros países. Búsqueda y entrega en cualquier destino.
        chinaCardTitle: Desde China
        chinaCardText: Coches nuevos y usados de China, con transporte a través de un socio de confianza.
        exploreLabel: Más información
        ctaLabel: Calcular la importación
        heroPhotoAlt: Camión portacoches cargado
        processHeading: Cómo funciona la importación
        processLead: 'Normalmente pasan entre cuatro y ocho semanas desde la solicitud hasta la matriculación. El transporte es lo que menos tarda: de Alemania a Belgrado son unos días, mientras que la aduana y la matriculación pueden llevar semanas.'
        processSteps:
          - n: '01'
            text: 'Calculamos el coste total antes de empezar: coche, transporte, aranceles y trámites'
          - n: '02'
            text: Encontramos e inspeccionamos el coche en el país de origen
          - n: '03'
            text: Compramos el coche a través de nuestra empresa europea, lo damos de baja y preparamos la documentación de exportación
          - n: '04'
            text: Lo transportamos en camión portacoches o conduciéndolo con matrículas temporales
          - n: '05'
            text: Tramitamos el despacho de aduanas y la matriculación, y le entregamos las llaves
        includedHeading: Qué incluye el precio
        includedLead: 'Al importar por cuenta propia, el presupuesto suele desbordarse por los gastos adicionales al precio del coche. Los calculamos de antemano y dejamos el importe cerrado: el total no debería diferir del primer cálculo.'
        included:
          - title: Precio del coche
            text: El precio negociado, no el del anuncio. Negociamos con los resultados de la inspección en mano, lo que suele compensar parte de los gastos.
          - title: Transporte hasta destino
            text: En camión portacoches o conduciéndolo con matrículas temporales. Calculamos ambas opciones y elegimos la más conveniente para cada trayecto.
          - title: Aranceles e impuestos
            text: El arancel depende del país de origen y de la antigüedad del coche. En los vehículos fabricados en Europa, el certificado EUR1 cambia sustancialmente el cálculo, así que comprobamos que esté disponible antes de comprar.
          - title: Exportación y tránsito
            text: Baja en el país del vendedor, declaración de exportación, matrículas temporales y seguro para el trayecto.
          - title: Despacho de aduanas
            text: Declaración, agente de aduanas y pago en destino. Preparamos la documentación con antelación para evitar días extra de almacenaje.
          - title: Matriculación
            text: Inspección técnica, matriculación y placas. Recibirá un coche listo para conducir.
