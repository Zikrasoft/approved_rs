            text: Wir ermitteln die Gesamtkosten vor dem Start – Auto, Logistik, Zölle, Dokumentation
          - n: '02'
            text: Wir finden und prüfen das Auto im Abgangsland
          - n: '03'
            text: Wir kaufen das Auto über unser europäisches Unternehmen, melden es ab und bereiten die Exportdokumente vor
          - n: '04'
