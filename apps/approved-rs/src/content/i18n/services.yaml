      citiesHeadingFor: Wo wir Fahrzeuge in {countryLocation} anschauen
      citiesLead: Der Experte fährt im ganzen Land, aber meistens schauen wir dort, wo die meisten Fahrzeuge angeboten werden. Was das für jede Stadt bedeutet.
      alsoInLabel: 'Wir wählen auch in:'
      crossSellLabel: Brauchen Sie ein nicht lokales Fahrzeug?
      countryNotesHeadingFor: Was wir in {location} berücksichtigen
      countryNotesPointsLabel: Worauf wir zunächst achten
      countryNotes:
        de:
          lead: 'Hier gibt es eine größere Auswahl als in jedem anderen europäischen Markt, und die Servicehistorie ist in der Regel nachvollziehbar: Die meisten Autos haben ein Serviceheft mit Einträgen des Händlers zu jedem Wartungsbesuch. Die Kehrseite sind die Autobahnkilometer. Zweihunderttausend in drei Jahren sind hier die Norm und kein Grund für einen Rabatt.'
          points:
            - Serviceheft und Händlerstempel – wir überprüfen das über die VIN beim offiziellen Service
            - Die HU-Protokolle, die alle TÜV nennen, – wir lesen die Anmerkungen der letzten Prüfung, nicht nur den Stempel
            - 'Autos aus Leasing- und Firmenflotten: ordentlich gewartet, aber mit hohen Laufleistungen'
            - Winterstraßen mit Chemikalien – Unterboden und Schweller prüfen wir gesondert
        rs:
          lead: Hier sind wir vor Ort, daher können wir das Auto am Tag der Anfrage und ohne Einfuhr anschauen. Der Markt ist klein, dasselbe Auto wechselt oft den Besitzer, und die Historie muss entschlüsselt werden.
          points:
            - Das Auto ist bereits verzollt und hat lokale Nummernschilder – Zölle und Einfuhrformalitäten entfallen
            - Der Kilometerstand wird beim Weiterverkauf häufig manipuliert – wir überprüfen die Einträge im technischen Überprüfung
            - Viele importierte Autos aus Deutschland und Italien – wir prüfen, was mit dem Auto vor dem Import war
            - Besichtigung am Tag der Anfrage, ohne auf Logistik warten zu müssen
        es:
          lead: Milde Winter und kaum Chemikalien auf den Straßen führen dazu, dass der Unterboden spanischer Autos normalerweise deutlich besser ist als der deutscher. Allerdings leiden Lack, Kunststoff und Gummi unter Sonne und Meeresnähe.
          points:
            - An der Küste – Korrosion suchen wir vor allem in versteckten Hohlräumen
            - Verblassender Klarlack und rissiger Kunststoff im Inneren – berücksichtigen wir im Preis
            - 'Viele ehemalige Mietwagen: gleichmäßiger Kilometerstand, aber harte Nutzung'
            - ITV-Protokoll – Anmerkungen und Prüfungsdaten überprüfen
        ch:
          lead: 'Schweizer Autos sind im Vergleich zum Durchschnitt in Europa deutlich besser gepflegt: teure Wartung sorgt für geringe Kilometerstände. Aber die Schweiz ist nicht in der EU, daher werden die Einfuhrformalitäten anders behandelt, was wir im Budget berücksichtigen.'
          points:
            - Reichhaltige Ausstattungen – hier wurden sie öfter gewählt als bei den Nachbarn
            - MFK – die Prüfung ist streng, darauf wird ernsthaft vorbereitet, und das sieht man dem Auto an
            - 'Nicht-EU: Zoll und Dokumente werden anders behandelt als für EU-Länder'
            - Preise über dem Markt, aber später sparen Sie bei der Wartung
        pt:
          lead: Der Markt ist klein, die Auswahl bescheidener als in Spanien, aber die Konkurrenz um ein gutes Auto ist geringer. Das Klima ist feucht und salzig – Küstenkorrosion ist selbst bei neuen Autos zu finden.
          points:
            - Feuchtigkeit und Meer – versteckte Hohlräume und Elektronik haben Priorität bei der Inspektion
            - 'Kleiner Markt: Für spezielle Anfragen suchen wir länger als in Deutschland'
            - IPO-Protokoll – wir überprüfen die Anmerkungen der vorherigen Inspektionen
            - Viele Diesel und Kleinstwagen, große Karosserien kommen selten vor
        fr:
          lead: Frankreich ist vor allem für Diesel und eigene Marken bekannt. Peugeot, Renault und Citroën sind hier günstiger als irgendwo in Europa. Deutsche Premiumfahrzeuge sind dagegen teurer, weshalb es wenig Sinn macht, sie hier zu kaufen.
          points:
            - Französische Marken – die besten Preise in Europa, Wartung ist günstiger
            - Diesel – Partikelfilter und EGR-Ventil überprüfen wir als separate Position
            - Contrôle technique – die Protokolle sind detailliert, wir überprüfen die Anmerkungen nach Jahren
            - 'Städtische Nutzung: Kupplung und Fahrwerk nutzen sich schneller ab als angegeben'
        it:
          lead: 'Der italienische Markt ist gut für Kleinwagen und seltene Ausstattungen, erfordert jedoch Vorsicht: Autos werden hier intensiv genutzt, und kleine Karosseriearbeiten werden nicht immer sorgfältig durchgeführt.'
          points:
            - In Städten – häufig kleine Stöße und Nachlackierungen, ein Lackdickenmesser ist unerlässlich
            - Der Süden und die Küste bringen Salz und Korrosion, der Norden ist näher an den deutschen Bedingungen
            - Revisione – wir prüfen die Regelmäßigkeit, Auslassungen sind häufiger als üblich
            - Viele Autos mit Gasanlagen – wir prüfen diese gesondert
        pl:
          lead: 'Der größte Markt in der Nähe: Logistik ist billig und kurz. Polen war jedoch jahrelang der Hauptumschlagplatz für beschädigte Autos aus Westeuropa, weshalb wir die Historie hier strenger überprüfen als anderswo.'
          points:
            - Hohe Quote von nach Unfällen wiederhergestellten Fahrzeugen – Geometrie der Karosserie hat Priorität
            - 'Häufige Weiterverkäufe: Ein Auto wechselt im Jahr häufig die Besitzer'
            - Der Kilometerstand wird oft bei der Einfuhr manipuliert – wir überprüfen die Servicedatenbanken
            - Kurze Lieferkette – günstiger und schneller als aus Spanien oder Portugal
      closing:
        eyebrow: Wie fangen wir an?
        line1: Beschreiben Sie das Auto,
        line2: das Sie suchen, –
        accentWord: dann ist unsere Arbeit
        text: Budget, Karosserie, Getriebe, ein paar Wünsche dazu. Wir suchen, Sie schauen sich die Berichte zu den Optionen an und entscheiden, welches Auto Sie live ansehen möchten.
