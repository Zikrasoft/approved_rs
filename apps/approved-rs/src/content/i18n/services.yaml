            text: Biramo opcije na licu mesta i odbacujemo telefonom sve što ne ispunjava zahteve
          - n: '03'
            text: Idemo na provere sa mjeračem debljine i skenerom, za BMW se povezuje sa dilerskim ISTA, snimamo fotografije i video
          - n: '04'
            text: Šaljemo izveštaj i iskreno govorimo da li vredi uzeti ili tražiti dalje
          - n: '05'
            text: Pregovaramo, završavamo transakciju i prebacujemo auto vama ili ga dostavljamo do vrata
