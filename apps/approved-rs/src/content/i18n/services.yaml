        includedLead: Naknada se fiksira pre početka i ne zavisi od broja automobila koji se moraju pogledati. Ako nakon provere kažemo 'nemojte uzimati' — tražimo dalje, dodatna uplata nije potrebna.
        included:
          - title: Pretraga bez ograničenja u broju opcija
            text: Radimo dok ne pronađemo automobil koji zadovoljava sve kriterijume. Odbijanje neuspšne opcije je deo posla i ne košta dodatno.
          - title: Dolazak stručnjaka na svaki pregled
            text: Mjerač debljine boje, skener za ispitivanje blokova, dizalica gde je potrebna. Fotografije i video sa svih problematičnih mesta — vi vidite isto što i mi.
          - title: Proveravanje istorije i pravne validnosti
            text: Izveštaj CarVertical po VIN, dilerska servisna istorija po marki, provera pređenih kilometara, hipoteka, ograničenja za registraciju i otvoreni osiguravajući događaji.
          - title: Pregovaranje i obavljanje transakcije
            text: Dogovaramo cenu uzimajući u obzir šta smo pronašli, pripremamo dokumente i pratimo potpisivanje.
          - title: Transport i registracija
            text: Dostavljamo auto do vašeg grada i pomažemo sa registracijom na licu mesta — ili predajemo ključeve gde vam to najviše odgovara.
          - title: Jedna osoba za ceo proces
            text: Sa vama radi isti stručnjak koji je bio na pregledu. Nema potrebe da ponovo objašnjavate zadatak svakome ko se javi na telefon.
        compareHeading: Kako se tržišta razlikuju
        compareLead: Isti model u Nemačkoj i Poljskoj — po istoriji i ceni to su dva različita vozila.
