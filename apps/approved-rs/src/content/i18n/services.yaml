translations:
  en:
    vehicle-sourcing:
      hub:
        metaTitle: Car sourcing in Europe - turnkey service
        metaDescription: 'We source cars in Germany, Serbia, Spain, Switzerland, Italy, France, Poland, and Portugal: search, inspection, negotiation, and delivery included.'
        title: Car Sourcing
        titleHighlight: turnkey
        description: We find cars in the country where you are located or plan to make a purchase. Complete inspection, deal support, and turnkey delivery. Choose a country to see details.
        breadcrumbLabel: Car Sourcing
        casesHeading: Real car sourcing deals
        chooseCountryLabel: 'Choose a country:'
        ctaLabel: Source a car
        heroPhotoAlt: A row of cars at the dealer's lot
        processHeading: How sourcing works
        processLead: 'From application to keys typically takes three days to two weeks. We spend the most time searching for the right car: we don’t settle for the first suitable one and continue looking until we find one that passes inspection without issues.'
        processSteps:
          - n: '01'
            text: We discuss the budget, make, and requirements, identifying what is important and what can be compromised
          - n: '02'
            text: We select options locally and filter out anything that doesn't meet our criteria over the phone
          - n: '03'
            text: We inspect the car with a thickness gauge and scanner, for BMW we connect to the dealer's ISTA, and we take photos and videos
          - n: '04'
            text: We send a report and state clearly whether to proceed with the purchase or continue searching
          - n: '05'
            text: We negotiate, finalize the deal, and either deliver the car to you or bring it to your doorstep
        includedHeading: What's included in the service
        includedLead: The commission is fixed before we start and does not depend on how many cars we had to inspect. If we say ‘don’t buy’ after the inspection, we continue the search without any extra payment.
        included:
          - title: Unlimited options search
            text: We work until we find a car that meets all expectations. Declining an unsuitable option is part of our service and incurs no additional cost.
          - title: Expert onsite for each inspection
            text: 'Thickness gauge for panels, scanner for parts, lift where needed. Photos and videos of all problem areas: you see the same things we do.'
          - title: History and legal status checks
            text: CarVertical report by VIN, dealer service history by make, mileage verification, loans, registration restrictions, and unresolved insurance events.
          - title: Negotiation and deal finalization
            text: We negotiate the price based on our findings, prepare documents, and assist with signing.
          - title: Delivery and registration
            text: We deliver the car to your city and assist with the registration process, or we hand over the keys where it’s convenient for you to pick it up.
          - title: One point of contact for the entire process
            text: You will work with the same specialist who conducted the inspection. There's no need to explain the task again to every person who answers the phone.
        compareHeading: How the markets differ
        compareLead: The same model in Germany and Poland might have different histories and prices, making them two distinct cars.
        compareHint: Select a country, and we will show what we look for there first.
        compareLinkFor: Car sourcing in {location} detailed
      title: Turnkey Car Sourcing
      descriptionFor: We will find a car in {location} from those already in that country, without importing from abroad. Complete inspection, deal support, and delivery to your city.
      ctaLabel: Submit a request
      casesHeadingFor: 'Real deals: car sourcing in {location}'
      breadcrumbLabelFor: Cars in {location}
      stepsFor:
        - n: '01'
          text: Submit your application with requirements (budget, make, mileage)
        - n: '02'
          text: We search for options in {location} based on your criteria
        - n: '03'
          text: An independent expert inspects and checks the vehicle
        - n: '04'
          text: We assist with the deal, help with documents and registration
        - n: '05'
          text: We deliver the car to your city and help with the registration process
      deliveryLineFor: We will deliver the car to any city in the country. If it needs to be exported abroad, we handle the export and customs clearance and transport it to {destinations} and any other country.
      deliveryDestinations:
        - Bosnia and Herzegovina
        - Croatia
        - North Macedonia
        - Turkey
        - Kazakhstan
        - Kyrgyzstan
      citiesHeadingFor: Where we inspect cars in {countryLocation}
      citiesLead: An expert travels across the country, but we usually inspect cars where they are most commonly listed. Here's what it means for each city.
      alsoInLabel: 'We also source in:'
      crossSellLabel: Need a non-local vehicle?
      countryNotesHeadingFor: What we consider in {location}
      countryNotesPointsLabel: What we prioritize
      countryNotes:
        de:
          lead: 'The selection here is greater than in any other European market, and maintenance history is usually well-documented: most cars have service books with dealer stamps for each service interval. The downside: high mileage is common. Two hundred thousand kilometers in three years is normal here, not a reason for a discount.'
          points:
            - Service book and dealer stamps, verified via VIN at an authorized service
            - HU protocol, known as TÜV. We check comments from the previous inspection, not just the stamp
            - 'Cars from leasing and corporate fleets: well maintained, but high mileage'
            - Winter roads with chemicals mean we inspect the underside and sills specifically
        rs:
          lead: We are on-site, so we inspect the vehicle on the same day of inquiry without need for import. The market is small, and the same car often passes through several sellers, so tracing its history can be complicated.
          points:
            - The car is already cleared and has local plates; no import duties or clearance is needed
            - Mileage is often adjusted when reselling within the country; we verify it against technical inspection records
            - Many cars imported from Germany and Italy; we check the vehicle’s history before import
            - Inspection on the same day, with no wait for logistics
        es:
          lead: Mild winters and almost no de-icing agents on the roads, so the undercarriage of Spanish cars is usually in much better shape than German ones. However, the sun and proximity to the sea take a toll on the paint, plastic, and rubber components.
          points:
            - Being coastal, we primarily look for corrosion in hidden cavities
            - Faded paint and cracked interior plastic are factored into the price
            - 'Many former rental cars: mileage is even, but they underwent rigorous use'
            - ITV protocol, we check comments and inspection dates
        ch:
          lead: 'Swiss cars are generally better maintained than the European average: expensive servicing ensures discipline, and mileage is low. However, Switzerland is not in the EU, so imports are handled differently, which we budget for in advance.'
          points:
            - Richly equipped models are more common here than in neighboring countries
            - MFK. The inspection is strict, and it's evident that the car has been properly maintained
            - 'Not EU: customs and documentation process differ from EU countries'
            - Prices are above market, but you save on repairs later
        pt:
          lead: The market is small; the selection is more modest than in Spain, but competition for good cars is also lower. The climate is humid and salty, leading to coastal corrosion even on newer cars.
          points:
            - Humidity and the sea mean hidden cavities and electrical systems are prioritized during inspection
            - 'Small market: searching for specific requests takes longer than in Germany'
            - IPO protocol, we check comments from previous inspections
            - Many diesels and small cars, larger bodies are rare
        fr:
          lead: France is primarily about diesel and domestic brands. Peugeot, Renault, and Citroën are cheaper here than anywhere else in Europe. In contrast, German premium brands are more expensive, making them less worthwhile to purchase here.
          points:
            - French brands at better prices in Europe, and maintenance costs are lower
            - We inspect diesels, particulate filters, and EGR valves as a separate point
            - Contrôle technique. The reports are detailed; we verify comments across years
            - 'Urban use: tires and suspension wear out faster than stated'
        it:
          lead: 'The Italian market is great for small cars and rare configurations, but requires caution: cars here are heavily used, and minor body repairs are not always done carefully.'
          points:
            - City driving leads to frequent minor hits and touch-ups, a thickness gauge is essential
            - The south and coastal areas bring salt and corrosion, while the north is closer to German conditions
            - Revisione, we check for regularity as missed inspections are more common than usual
            - Many cars with gas equipment; we check this separately
        pl:
          lead: 'The nearest major market: logistics are cheap and short. However, Poland has long been a key transit point for damaged cars from Western Europe, so we scrutinize the history more rigorously than elsewhere.'
          points:
            - A high percentage of cars are rebuilt after accidents; body geometry is prioritized
            - 'Frequent resales: a car often changes several owners within a year'
            - Mileage is frequently altered during import; we verify with service databases
            - Short delivery routes, cheaper and faster than from Spain or Portugal
      closing:
        eyebrow: Where shall we begin?
        line1: Describe the car you are looking for,
        line2: that you are looking for,
        accentWord: to handle the rest
        text: Your budget, body type, transmission, and a couple of additional wishes. We do the searching, while you review the reports on options and decide which to inspect in person.
    vehicle-buyback:
      hub:
        metaTitle: Buying back cars with Russian plates in Europe
        metaDescription: We buy cars with Russian plates in any European country and cars with Serbian plates in Serbia. Photo evaluation in an hour, payment on the day of signing.
        title: Car buyback
        titleHighlight: no haggling for weeks
        description: 'We take cars that are difficult to sell through regular channels: Russian plates, expired imports, disputed documents. The price is below market value: this covers the speed and takes care of all the selling hassles.'
        breadcrumbLabel: Car buyback
        casesHeading: Real buyback transactions
        chooseCountryLabel: 'Choose a country:'
        ctaLabel: Get a valuation
        heroPhotoAlt: Keys to a car on money and documents
        processHeading: How the buyback works
        processLead: From the first message to payment typically takes two or three days, and most of this time is spent traveling to the meeting point. We provide a photo evaluation within an hour.
        processSteps:
          - n: '01'
            text: You send photos, documents, and an honest description of the condition
          - n: '02'
            text: We quote a price within an hour—immediately final and without any range
          - n: '03'
            text: We arrange a meeting where the car is located; if it's not drivable, we arrive with a trailer
          - n: '04'
            text: We inspect in person and confirm the price if the description matches
          - n: '05'
            text: We sign the contract, and payment is made on the day of signing
        includedHeading: What we handle
        includedLead: We take all the difference between our price and the market price, which is why such a car may not sell for months.
        included:
          - title: Cars with Russian plates
            text: 'Main category. The car can be located in any European country: we will come to wherever it is, while you handle the export and resale.'
          - title: Issues with import and timelines
            text: After signing, any expired temporary import and associated risks are transferred to us.
          - title: Valuation without inspection
            text: We provide a price based on photos and documents. We come only when both parties agree on the amount.
          - title: Transaction paperwork
            text: We prepare the contract, deregistration, and all paperwork ourselves. You just need to provide the documents for the car and your signature.
          - title: Payment on the day of signing
            text: Payment is made the same day. We do not have schemes involving installment plans or 'we'll pay more after resale.'
          - title: Honest refusal
            text: If the car is not suitable for us, we will let you know immediately and explain the reason. We won't drag it out or lower the price as it goes.
      title: Car buyback
      ctaLabel: Get a valuation
      casesHeading: Real buyback transactions
      breadcrumbLabel: Car buyback
