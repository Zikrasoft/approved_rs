  es:
    vehicle-sourcing:
      hub:
        metaTitle: Selección de coches en Europa llave en mano
        metaDescription: 'Seleccionamos auto en Alemania, Serbia, España, Suiza, Italia, Francia, Polonia y Portugal: búsqueda, inspección, negociación y entrega llave en mano.'
        title: Selección de coches
        titleHighlight: llave en mano
        description: Seleccionamos un vehículo en el país donde se encuentra o planea comprar — verificación completa, acompañamiento de la transacción y entrega llave en mano. Elija un país para ver los detalles.
        breadcrumbLabel: Selección de coches
        casesHeading: Casos de selección de coches
        chooseCountryLabel: 'Elija un país:'
        ctaLabel: Seleccionar un coche
        heroPhotoAlt: Fila de coches en el lote del concesionario
        processHeading: Cómo se realiza la selección
        processLead: 'Desde la solicitud hasta la entrega suele tardar entre tres días y dos semanas. Lo que más tiempo lleva es encontrar el coche adecuado: no tomamos el primero que encontramos, y seguimos buscando hasta hallar uno sin inconvenientes tras la verificación.'
        processSteps:
          - n: '01'
            text: Discutimos el presupuesto, la marca y los requisitos — qué es importante y qué se puede sacrificar
          - n: '02'
            text: Filtramos opciones en el lugar y eliminamos por teléfono todas las que no cumplen con las preguntas
          - n: '03'
            text: Vamos a la inspección con un medidor de grosor y escáner, para BMW conectamos al ISTA del concesionario, tomamos fotos y videos
          - n: '04'
            text: Enviamos un informe y decimos claramente si vale la pena comprar o seguir buscando
          - n: '05'
            text: Negociamos, formalizamos la transacción y le entregamos el coche o lo llevamos a su puerta
        includedHeading: Qué se incluye en el servicio
        includedLead: La comisión se establece antes de comenzar y no depende de cuántos coches se hayan tenido que ver. Si tras la verificación decimos "no compre" — seguimos buscando, no hay costo adicional por esto.
        included:
          - title: Búsqueda sin límite en la cantidad de opciones
            text: Trabajamos hasta encontrar un coche que cumpla con las expectativas. Renunciar a una opción fallida está incluido en el servicio y no cuesta nada adicional.
          - title: Visita de un experto para cada inspección
            text: Medidor de grosor en las chapas, escáner por bloques, elevador donde se necesita. Fotos y videos de todos los puntos problemáticos — verás lo mismo que nosotros.
          - title: Verificación de historial y legalidad
            text: Informe de CarVertical por VIN, historial de servicio del concesionario por marca, verificación del kilometraje, gravámenes, restricciones de registro y eventos de seguros no cerrados.
          - title: Negociación y formalización de la transacción
            text: Negociamos el precio según lo encontrado, preparamos la documentación y acompañamos la firma.
          - title: Entrega y registro
            text: Llevamos el coche a su ciudad y ayudamos con el registro local — ya sea entregando las llaves donde le sea conveniente recogerlo.
          - title: Una persona para todo el proceso
            text: Trabaja con usted el mismo especialista que fue a la inspección. No es necesario explicar la tarea nuevamente a cada uno que toma el teléfono.
        compareHeading: Cómo se diferencian los mercados
        compareLead: El mismo modelo en Alemania y Polonia — en cuanto a historia y precio, son dos coches diferentes.
        compareHint: Elija un país — mostraremos lo que estamos mirando allí primero.
        compareLinkFor: Selección {location} — en detalle
      title: Selección de coches llave en mano
      descriptionFor: Seleccionamos un vehículo {location} — entre coches que ya se encuentran en este país, sin importar desde el extranjero. Verificación completa, acompañamiento de la transacción y entrega a su ciudad — llave en mano, incluyendo aduanas.
      ctaLabel: Dejar una solicitud
      casesHeadingFor: 'Casos: selección de coches {location}'
      breadcrumbLabelFor: Coches {location}
      stepsFor:
        - n: '01'
          text: Deja tu solicitud con requisitos — presupuesto, marca, kilometraje
        - n: '02'
          text: Buscamos opciones {location} según tus criterios
        - n: '03'
          text: Un experto independiente inspecciona y verifica el coche
        - n: '04'
          text: Acompañamos la transacción, ayudamos con la documentación y el registro
        - n: '05'
          text: Entregamos el coche a tu ciudad — llave en mano, incluyendo aduanas
      deliveryLineFor: Entregamos en {destinations} — y en cualquier otro país, lo discutimos al realizar la solicitud.
      deliveryDestinations:
        - Rusia
        - Kazajistán
        - Kirguisistán
        - Ucrania
        - Bielorrusia
        - Bosnia y Herzegovina
        - Croacia
        - Macedonia del Norte
        - Turquía
      citiesHeadingFor: Dónde inspeccionamos coches {countryLocation}
      citiesLead: El experto se desplaza por todo el país, pero generalmente inspeccionamos coches donde se exponen más. Esto es lo que significa para cada ciudad.
      alsoInLabel: 'También seleccionamos en:'
      crossSellLabel: ¿Necesita un auto que no sea local?
      countryNotesHeadingFor: Qué consideramos en {location}
      countryNotesPointsLabel: En qué nos fijamos principalmente
      countryNotes:
        de:
          lead: 'La selección aquí es más amplia que en cualquier otro mercado europeo, y el historial de mantenimiento suele ser claro: la mayoría de los coches tienen un libro de servicio con sellos del concesionario para cada revisión. El lado negativo son los grandes kilometrajes en las autopistas. Doscientos mil kilómetros en tres años son la norma, no un motivo para un descuento.'
          points:
            - Libro de servicio y sellos del concesionario — verificamos con el VIN en el servicio oficial
            - Protocolo HU, que todos llaman TÜV — leemos los comentarios de la última inspección, no solo el sello
            - 'Coches de leasing y flotas corporativas: han sido atendidos, pero los kilometrajes son altos'
            - Caminos invernales con reactivos — inspeccionamos el chasis y los umbrales por separado
        rs:
          lead: Aquí estamos en el lugar, por lo que inspeccionamos el coche el día que se solicita y sin necesidad de importación. El mercado es pequeño, el mismo coche puede pasar por varios vendedores, y hay que desenredar su historia.
          points:
            - El coche ya está despachado y con matrícula local — no se necesitan aranceles ni trámites de importación
            - El kilometraje a menudo se altera durante la reventa dentro del país — verificamos con los sellos de la revisión técnica
            - Muchos coches importados de Alemania e Italia — comprobamos qué ha pasado con el coche antes de la importación
            - Inspección el día de la solicitud, sin esperar la logística
        es:
          lead: El invierno es suave y casi no hay reactivos en las carreteras, por lo que el chasis de los coches españoles suele estar en mejor estado que el de los alemanes. Sin embargo, el sol y la cercanía al mar afectan a la pintura, al plástico y a las partes de goma.
          points:
            - En la costa — buscamos corrosión especialmente en cavidades ocultas
            - Laca descolorida y plástico agrietado en el interior — lo contabilizamos en el precio
            - 'Muchos coches de alquiler: kilometraje uniforme, pero uso intenso'
            - Protocolo ITV — verificamos los comentarios y las fechas de las revisiones
        ch:
          lead: 'Los coches suizos están considerablemente mejor cuidados que el promedio en Europa: el costoso mantenimiento disciplina, y los kilometrajes son bajos. Pero Suiza no está en la UE, por lo que la importación se gestiona de manera diferente, y esto lo consideramos en el presupuesto desde el principio.'
          points:
            - Equipamientos ricos — aquí son más comunes que en los países vecinos
            - MFK — la inspección es rigurosa, se prepara a fondo, y esto se ve en el coche
            - 'No es UE: la aduana y la documentación no se gestionan como en los países de la Unión Europea'
            - Los precios son más altos que el mercado, pero ahorras en reparaciones después
        pt:
          lead: El mercado es pequeño, la selección es más modesta que la de España, pero la competencia por un buen coche es menor. El clima es húmedo y salino — la corrosión costera se encuentra incluso en coches nuevos.
          points:
            - Humedad y mar — las cavidades ocultas y la electricidad son prioritarias en la inspección
            - 'Mercado pequeño: buscamos para un pedido específico más tiempo que en Alemania'
            - Protocolo IPO — leemos los comentarios de las inspecciones anteriores
            - Muchos diésel y coches pequeños, las carrocerías grandes son raras
        fr:
          lead: Francia se caracteriza principalmente por los diésel y sus propias marcas. Peugeot, Renault y Citroën son más baratos aquí que en cualquier otro lugar de Europa. Por otro lado, las marcas alemanas premium son más caras, y no tiene sentido comprarlas aquí.
          points:
            - Marcas francesas — el mejor precio en Europa, y el mantenimiento es más barato
            - Diésel — revisamos el filtro de partículas y la válvula EGR como posición separada
            - Contrôle technique — los protocolos son detallados, verificamos comentarios por años
            - 'Uso urbano: el embrague y la suspensión se desgastan más rápido de lo declarado'
        it:
          lead: 'El mercado italiano es bueno para los coches pequeños y configuraciones raras, pero requiere precaución: los coches aquí se utilizan intensamente, y las pequeñas reparaciones de carrocería no siempre se hacen con cuidado.'
          points:
            - En ciudades — frecuentes golpes menores y repintados, el medidor de grosor es obligatorio
            - El sur y la costa traen sal y corrosión, el norte se aproxima a las condiciones alemanas
            - Revisione — comprobamos la regularidad, las ausencias son más comunes de lo normal
            - Muchos coches con equipo de gas — los revisamos por separado
        pl:
          lead: 'El mercado más grande cercano a nosotros: la logística es barata y corta. Sin embargo, Polonia ha sido durante años el principal punto de transbordo de coches siniestrados de Europa Occidental, por lo que aquí comprobamos la historia más allá que en ningún otro lugar.'
          points:
            - Alta proporción de coches reparados tras accidentes — la geometría de la carrocería es prioritaria
            - 'Frecuentes reventas: un coche puede cambiar de varios propietarios en un año'
            - El kilometraje a menudo se altera en la etapa de importación — verificamos con bases de servicios
            - Corto plazo de entrega — más barato y rápido que desde España o Portugal
      closing:
        eyebrow: ¿Por dónde empezamos?
        line1: Describe el coche que
        line2: estás buscando, —
        accentWord: y luego es nuestro trabajo
        text: Presupuesto, carrocería, tipo de caja, un par de deseos. Nosotros buscamos y tú revisas los informes sobre las opciones y decides cuál mirar en persona.
    vehicle-buyback:
      hub:
        metaTitle: Compra de coches con matrículas rusas en Europa
        metaDescription: Compramos coches con matrículas rusas en cualquier país de Europa y coches con matrículas serbias en Serbia. Valoración por foto en una hora, pago el día de la firma.
        title: Compra de coches
        titleHighlight: sin regateos por semanas
        description: 'Recogemos coches que son difíciles de vender de forma convencional: matrículas rusas, importación vencida, documentación controvertida. El precio es inferior al del mercado — es el costo de la rapidez y de que nos encargamos de todo el proceso de venta.'
        breadcrumbLabel: Compra de coches
        casesHeading: Casos de compra
        chooseCountryLabel: 'Seleccione un país:'
        ctaLabel: Obtener valoración
        heroPhotoAlt: Llaves de coche sobre dinero y documentos
        processHeading: Cómo se lleva a cabo la compra
        processLead: Desde el primer mensaje hasta el dinero, normalmente pasan dos o tres días, y casi todo este tiempo ocupa el trayecto hasta el lugar de encuentro. Proporcionamos la valoración por foto en una hora.
        processSteps:
          - n: '01'
            text: Envíe fotos, documentos y una descripción honesta del estado
          - n: '02'
            text: Le damos el precio en una hora — inmediatamente final, sin margen
          - n: '03'
            text: Concertamos una reunión donde se encuentra el coche; si no está en marcha, llegamos con un remolque
          - n: '04'
            text: Inspeccionamos en persona y confirmamos el precio, si la descripción coincide
          - n: '05'
            text: Firmamos el contrato, y transferimos el dinero el día de la firma
        includedHeading: Lo que asumimos
        includedLead: Por la diferencia entre nuestro precio y el del mercado, nos quedamos con todo lo que hace que un coche así no se venda durante meses.
        included:
          - title: Coches con matrículas rusas
            text: Categoría principal. El automóvil puede estar en cualquier país de Europa — iremos allí donde se encuentre, y nos ocupamos de la exportación y la posterior reventa.
          - title: Problemas con la importación y plazos
            text: Tras la firma, la importación temporal vencida y los riesgos asociados pasan a ser nuestra responsabilidad.
          - title: Valoración sin inspección
            text: Damos el precio según fotos y documentos. Vamos solo cuando ambas partes ya están de acuerdo en la suma.
          - title: Formalización de la transacción
            text: Preparamos el contrato, la baja de matrícula y todos los documentos. De usted, solo necesitamos los documentos del coche y su firma.
          - title: Pago el día de la firma
            text: Transferimos el dinero el mismo día. No tenemos esquemas de pago a plazos ni de "pagaremos después de la reventa".
          - title: Rechazo honesto
            text: Si el coche no nos conviene, lo diremos de inmediato y explicaremos la razón. No prolongaremos el proceso ni intentaremos bajar el precio a lo largo del camino.
      title: Compra de coches
      ctaLabel: Obtener valoración
      casesHeading: Casos de compra
      breadcrumbLabel: Compra de coches
