          - title: Exportación y tránsito
            text: Baja en el país vendedor, declaración de exportación, matrículas de tránsito y seguro para el traslado.
          - title: Trámites aduanales
            text: Declaración, agente aduanal y pago a la llegada. Preparamos el paquete de antemano para que el coche no permanezca en el almacén días innecesarios.
          - title: Registro
            text: Revisión técnica, registro y matrículas. Recoges el coche, listo para conducir.
