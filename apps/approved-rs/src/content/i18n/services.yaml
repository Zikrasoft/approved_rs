    vehicle-inspection:
      title: Vehicle Inspection
      description: An independent vehicle inspection before purchase. Our expert will come to you, perform diagnostics, and provide a report — no obligation to buy.
      ctaLabel: Order Inspection
      casesHeading: Inspection Cases
      breadcrumbLabel: Vehicle Inspection
      steps:
        - n: '01'
          text: Body and paintwork — evidence of repairs or accidents
        - n: '02'
          text: Chassis, suspension, brakes
        - n: '03'
          text: Engine, gearbox, transmission
        - n: '04'
          text: Electronics and service history via VIN
        - n: '05'
          text: Legal clarity — liens, registration bans, accidents
      extraLine: We also operate in other European countries, including Portugal — please specify in your inquiry.
      hub:
        metaTitle: Car Inspection Before Purchase in Europe
        metaDescription: 'We come to the vehicle you found: thickness gauge, scanner, VIN history check, and a report with photos on the same day. We operate in eight European countries.'
        title: Car Inspection
        titleHighlight: Before Purchase
        description: "We come to check the vehicle you found and explain what’s actually wrong with it. The report arrives before you hand over any money: if the answer is 'don’t buy it', you only lose the inspection fee."
        breadcrumbLabel: Vehicle Inspection
        casesHeading: Inspection Cases
        chooseCountryLabel: 'Select a Country:'
        ctaLabel: Order Inspection
        heroPhotoAlt: Car on lift in service
        processHeading: How the Inspection Works
        processLead: Typically, we set out within one to two days after your request. The inspection itself takes about one and a half to two hours, and we send the report on the same day, before the vehicle is sold to someone else.
        processSteps:
          - n: '01'
            text: You send us the listing link and seller's contact information
          - n: '02'
            text: We agree with the seller on the time and location of the inspection
          - n: '03'
            text: We come with a thickness gauge and scanner, and for BMWs, we connect to the dealer's ISTA system, putting it on a lift if necessary
          - n: '04'
            text: We take photos and videos of all findings, and check the VIN history
          - n: '05'
            text: We send you the report and a direct recommendation — buy, negotiate, or decline
        includedHeading: What’s Included in the Inspection
        includedLead: 'There are over a hundred checklist items, but nearly always four areas matter most: bodywork, engine with gearbox, chassis, and documents. This is where we often advise against a purchase.'
        included:
          - title: Body and Paintwork
            text: Thickness measurements for each panel, alignment of openings, signs of welding and putty work. You can see if any repairs were made that the seller didn’t mention.
          - title: Engine and Gearbox
            text: Parameters with the warmed-up engine, gearbox adaptations, errors in ECU memory. This is the most expensive area and the most common reason for rejection.
          - title: Chassis and Brakes
            text: Play, suspension condition, and brake system status. Highway mileage and Balkan roads wear vehicles differently, and it shows.
          - title: Electronics and VIN History
            text: CarVertical report, dealer service history by make, mileage discrepancies with the history, block errors, and signs of deployed airbags.
          - title: Legal Clarity
            text: Liens, registration restrictions, unresolved accidents, and insurance events — issues that come to light only after purchase.
          - title: Report with Photos and Videos
            text: Every finding is documented and captioned. The report remains with you — it’s useful for negotiation, even if you ultimately decide to buy the car.
        compareHeading: What Changes from Country to Country
        compareLead: Vehicle inspection regulations, common issues in local cars, and ways to hide history vary everywhere.
        compareHint: Select a country — we’ll show what we add to the standard checklist.
        compareLinkFor: Inspection in {location} — details
        mapHeading: Four Areas That Decide the Deal
        mapLead: The checklist is long, but we usually advise against purchase based on one of these four areas. Click a number on the diagram — we’ll show what the expert checks and what we’ve found there.
      countryNotesHeadingFor: How We Inspect {location}
      countryNotesPointsLabel: What We Check Beyond the Standard Checklist
      countryNotes:
        de:
          lead: "In Germany, there's a lot to rely on: service book, HU protocols, and comprehensive VIN databases. Therefore, inspection here primarily involves verifying documents against what the car shows."
          points:
            - We cross-check dealer service marks with odometer readings over the years
            - Notes from the previous HU — what was repaired after inspection and what was simply patched up
            - Undercarriage and sills after winter agents, including hidden cavities
            - 'Leasing history: consistent servicing at high mileage'
        rs:
          lead: "In Serbia, we go out on the day of the request. The main task is to trace the vehicle's history before it was imported: local documents only show the last segment of the car's life."
          points:
            - Country of origin and the vehicle’s condition before import to Serbia
            - Odometer readings against the technical inspection records from previous years
            - Body repairs after import — these are done more frequently and at lower costs than in the EU
            - 'Legal aspects: liens and registration restrictions'
        es:
          lead: Spanish cars usually have great undercarriages but are often affected by sun and salt damage. We shift our inspection focus from corrosion below to hidden cavities, electrical systems, and interior condition.
          points:
            - Corrosion in hidden cavities by the coast — it can be clean underneath
            - Paint, seals, and plastics after years of sun exposure
            - 'Rental history: we verify mileage against the wear and tear of the interior'
            - ITV protocol and any unresolved issues between inspections
        ch:
          lead: Cars in Switzerland are seriously prepared for MFK, so a fresh protocol speaks little on its own. We check what was done specifically before the inspection and what has continued to age since last year.
          points:
            - What was replaced right before MFK — new parts in the context of the rest
            - Service is expensive, so we check if maintenance was deferred
            - While the equipment is rich, we verify that every option still works
            - 'Import documents: Switzerland is not EU, and the set is different'
        pt:
          lead: 'Everything here boils down to the humid maritime climate. We start the inspection with corrosion and electrical systems: usually, it’s the wet conditions that cause trouble.'
          points:
            - Hidden cavities, longitudinal beams, and suspension attachment points
            - Oxidation of connectors and blocks — a common cause of intermittent errors
            - IPO protocol and regularity of inspections
            - 'Diesels with city mileage: the history of the particulate filter'
        fr:
          lead: 'In France, there is a detailed contrôle technique, which serves as a good starting point. After that, we look at what the regulation doesn’t catch: the lifespan of the diesel group and wear from city traffic.'
          points:
            - Observations from the contrôle technique over the years — what recurs from inspection to inspection
            - Particulate filters, EGR, and turbos in diesels
            - Clutch and suspension after heavy city use
            - 'History with French brands: accessible spare parts yet specific weak points'
        it:
          lead: Italian cars often arrive with minor body repairs done quickly and cheaply. Using a thickness gauge on the panels here takes significantly more time than usual.
          points:
            - Thickness measurements across all panels — touch-ups from urban nicks
            - 'The difference between the north and south: salt by the coast, typical wear inland'
            - Gas equipment, if installed — the setup and condition of the tank
            - Regularity of revisione and missed periods
        pl:
          lead: Poland is a major transit market for damaged cars from Western Europe. Therefore, the first step is to determine what repairs were made to the vehicle before sale.
          points:
            - Geometric measurements of openings and signs of welding — repairs after a major accident
            - 'Import history: where the car came from and in what condition'
            - Mileage compared with European service databases; we don’t trust the odometer
            - Airbags and their history of deployment
      closing:
        eyebrow: Found a Car?
        line1: Send us the link
        line2: to the listing —
        accentWord: we’ll come and take a look
        text: We’ll be there within one to two days. The report with photos stays with you, even if you decide not to proceed with the purchase.
    cityVehicleSourcing:
      title: Car Sourcing
      descriptionFor: We’ll help you find a car in {cityLocation} with a complete inspection. We operate throughout the {countryName} region.
      casesHeadingFor: Cases from {countryGenitiveOrName}
      whyCityHeadingFor: Why {cityName}
      reason1: We check both dealer lots and private listings.
      reason2: We verify the vehicle's history by VIN before scheduling an inspection.
      reason3For: Our expert is in {cityLocation}
      reason4Dekra: DEKRA / TÜV inspection available upon request
      reason4Generic: Independent technical expertise available upon request
      otherCitiesLabelFor: 'Other cities in {countryLocation}:'
      cityNotesHeadingFor: The automotive market in {cityLocation}
      cityNotesPointsLabel: What this means in practice
      cityNotes:
        berlin:
          lead: Berlin offers the largest selection in Germany and has the most diverse range of sellers. Here you'll find everything from cars with full histories from corporate fleets to resales from Eastern Europe.
          points:
            - Huge selection in every segment, including rare configurations
            - Many private sellers — negotiation is more realistic than with dealers
            - 'Urban cycle: the clutch and suspension wear out faster compared to highway cars'
        munich:
          lead: 'A pricey city with expensive cars. The premium segment is larger here than anywhere else in Germany, and the average condition is better: these cars are well maintained.'
          points:
            - Strong premium segment, especially BMW and Mercedes
            - Well-maintained cars with complete dealer history
            - Prices are above the national average — savings come from condition
        hamburg:
          lead: A port city and major logistics hub. It’s convenient to ship cars from here, and you’ll often find fresh imported vehicles on the market.
          points:
            - Easy and cheaper to organize shipping due to the nearby port
            - Many cars from northern regions with highway mileage
            - 'Humid maritime climate: we pay extra attention to body and hidden cavities'
        belgrade:
          lead: Our home base. In Belgrade, we conduct inspections on the same day you contact us, we know the local sellers, and we track which cars have been circulating the lots for two months.
          points:
            - Inspection on the same day — no waiting or logistics
            - Familiar with local lots and the history of the cars they feature
            - The vehicle is already cleared — no import duties apply
        novi-sad:
          lead: The second largest city in Serbia, just an hour's drive from Belgrade. The market is smaller, but prices are usually calmer than in the capital, and the cars have typically gone through fewer resales.
          points:
            - Prices are lower than in Belgrade for comparable condition
            - Fewer resellers, often encountering the first owner
            - We drive from Belgrade — no additional fee for the trip
        pancevo:
          lead: Pancevo is essentially part of the Belgrade metropolitan area, so inspections here are similar to those in the capital. The market is small, but private listings often offer interesting finds.
          points:
            - Twenty minutes from Belgrade — we arrive just as quickly
            - A small market primarily dominated by private sellers
            - Often cheaper than in the capital for the same condition
        subotica:
          lead: 'Subotica borders Hungary, which is evident in the market: many cars imported from the EU, and numerous sellers engaged in this activity.'
          points:
            - Border market — plenty of fresh imports from the EU
            - We check the history before import very carefully
            - Convenient location if you plan to drive the car further north
        madrid:
          lead: 'The capital market of Spain: the largest selection in the country and many cars from corporate fleets. The continental climate means there’s less coastal corrosion here compared to the seaside.'
          points:
            - Largest selection in Spain, including corporate vehicles
            - Away from the sea — bodies usually less corroded than coastal ones
            - 'Hot summers: we inspect plastic, paint, and air conditioning separately'
        barcelona:
          lead: Everything is determined by proximity to the sea. Cars often look excellent underneath but require attention to hidden cavities and electrical systems.
          points:
            - 'With the sea nearby, we inspect hidden cavities closely: the underside often looks clean, but issues lurk inside'
            - Many former rental and car-sharing vehicles
            - The port is close, making maritime shipping easier to arrange
        zurich:
          lead: Zurich has the most expensive automotive market in the region. Top-tier configurations are common, they get dealer maintenance, and they're sold before they show signs of wear.
          points:
            - Top configurations and low mileage
            - Dealer servicing — history is almost always complete
            - Switzerland is not in the EU, so import procedures are separate
        geneva:
          lead: Geneva is located in the French-speaking part of Switzerland, right at the border with France. There are noticeably more French brands on the market than in the German-speaking regions of the country.
          points:
            - 'Mixed market: Swiss quality, French selection'
            - Border with France nearby — useful for price comparisons
            - 'Procedures are the same as throughout Switzerland: export plus import'
        paris:
          lead: 'The largest selection in France comes with the harshest usage conditions: dense traffic and tight parking leave marks on the body and suspension.'
          points:
            - The largest selection in France, especially for French brands
            - 'Urban cycle: clutches, suspensions, and minor body damages'
            - Many diesels — we first check the particulate filter and EGR
        lyon:
          lead: Lyon is calmer than Paris, in terms of both prices and vehicle condition. The highway to the south is nearby, so you're more likely to find vehicles with even highway mileage.
          points:
            - Prices are lower than in Paris for a comparable selection
            - More highway mileage, less city wear
            - Convenient access to Italy and Spain for broader searches
        milan:
          lead: "Italy's business capital, and this is evident in the market prices. Northern Italy resembles German conditions more closely: the roads are better, and the cars are better maintained than in the south."
          points:
            - Best selection of premium vehicles in Italy
            - North — less salt and corrosion than in southern Italy
            - 'Densely populated city: using a thickness gauge on the panels is essential'
        rome:
          lead: A large market with very dense urban usage. Minor scratches are seen as a normal part of life here, and they are often repaired on the fly.
          points:
            - Many compact cars and vehicles with gas systems
            - Frequent touch-ups from city contacts — we check every panel
            - Further south than Milan — the climate is milder but closer to the sea
        warsaw:
          lead: Most imports from Western Europe enter the country through Warsaw, which also has the largest selection in Poland. The proportion of repaired cars is also the highest here.
          points:
            - Largest selection in Poland, with plenty of fresh imports from the EU
            - First, we check the body geometry and signs of repairs
            - Shorter delivery distance — cheaper than from Southern Europe
        krakow:
          lead: 'Krakow is calmer than Warsaw: the market is smaller, there are fewer resales, and cars often stay with one owner longer. Southern Poland has closer logistics to the Balkans.'
          points:
            - Fewer resellers compared to Warsaw, history is usually cleaner
            - Prices often lower than in the capital
            - Closer to the southern route — convenient for delivery to Serbia
