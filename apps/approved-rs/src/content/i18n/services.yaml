            text: Sie senden Fotos, Dokumente und eine ehrliche Beschreibung des Zustands
          - n: '02'
            text: Wir nennen den Preis innerhalb einer Stunde – sofort endgültig, ohne Preisspanne
          - n: '03'
            text: Wir vereinbaren ein Treffen am Standort des Fahrzeugs; falls es nicht fahrbereit ist, kommen wir mit einem Anhänger
