        exploreLabel: Más información
        ctaLabel: Calcular importación
        heroPhotoAlt: Transportador de coches con vehículos cargados
        processHeading: Cómo se realiza la importación
        processLead: Generalmente, desde la solicitud hasta la entrega de las matrículas pasan entre cuatro y ocho semanas, siendo el transporte lo que toma menos tiempo. Desde Alemania hasta Belgrado, el coche tarda unos días, mientras que los trámites aduaneros y de registro pueden tardar semanas.
        processSteps:
          - n: '01'
            text: Calculamos el costo total antes de empezar — coche, logística, aranceles, documentación.
          - n: '02'
            text: Buscamos y revisamos el vehículo en el país de origen.
          - n: '03'
            text: Compramos el coche a través de nuestra empresa europea, lo damos de baja y preparamos la documentación de exportación.
          - n: '04'
            text: Lo transportamos en camión transportador o a su propio ritmo con matrículas de tránsito.
          - n: '05'
            text: Pasamos por aduana, lo registramos y te entregamos las llaves.
        includedHeading: De qué se compone el precio
        includedLead: 'En las importaciones por cuenta propia, el presupuesto generalmente se ve afectado por costos adicionales al precio del coche. Lo calculamos con antelación y lo fijamos: el total no debe diferir del primer cálculo.'
        included:
          - title: Costo del coche
            text: Precio después de la negociación, no el del anuncio. Negociamos con el coche en la mano durante la inspección — esto generalmente ayuda a recuperar parte de los gastos.
          - title: Logística a la ubicación
            text: Camión transportador o conducción con matrículas de tránsito. Calculamos ambas opciones y elegimos la más favorable para el trayecto específico.
          - title: Aranceles e impuestos
            text: La tasa depende del país de origen del coche y su antigüedad. Para coches de fabricación europea, el certificado EUR1 cambia el cálculo significativamente — verificamos su existencia antes de la compra.
          - title: Exportación y tránsito
            text: Baja en el país del vendedor, declaración de exportación, matrículas de tránsito y seguro para la conducción.
          - title: Trámites aduaneros
            text: Declaración, agente de aduanas y pago en el punto de llegada. Preparamos el paquete con anticipación para que el coche no se quede en el almacén innecesariamente.
          - title: Registro
            text: Inspección técnica, registro y matrículas. Recibes el coche con el que puedes salir de inmediato.
