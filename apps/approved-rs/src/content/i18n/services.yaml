          points:
            - Freie Bewegung innerhalb der EU — es gibt eine Grenze, beim Eintritt ins Zielland
            - Das Zertifikat EUR1 bestätigt die Herkunft und senkt die Zollgebühren
            - 'Einheitliche Emissionsnormen: Autos aus jedem EU-Land unterliegen den gleichen technischen Prüfungen'
            - Je kürzer die Strecke, desto eher ist es vorteilhaft, selbst zu fahren anstelle eines Autotransporters
