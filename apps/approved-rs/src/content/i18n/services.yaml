            text: Wir organisieren die Exportdokumente und die Lieferung zu Ihrer Stadt
          - n: '05'
            text: Zollabwicklung und Übergabe des Fahrzeugs an Sie – schlüsselfertig
        sourceCountriesLabel: 'Wir importieren aus:'
        sourceMoreLabel: und anderen Ländern Europas
        destinationsNote: Wir liefern nach Serbien, Spanien und Portugal – und in jedes andere Land, das besprechen wir bei der Anfrage.
        notesHeading: Was beeinflusst Fristen und Preise aus Europa
        notesPointsLabel: Besonderheiten der Richtung
        notes:
          lead: Innerhalb der Europäischen Union reist das Auto ohne Zollgrenzen, daher beginnt die Hauptarbeit an der Grenze zum Bestimmungsland. Die Fristen werden durch die Dokumentation bestimmt, die Reise selbst dauert einige Tage.
          points:
            - Freie Bewegung innerhalb der EU – es gibt eine Grenze, beim Eintritt in das Bestimmungsland
            - Das EUR1-Zertifikat bestätigt die Herkunft und senkt die Zollgebühren
            - 'Einheitliche Emissionsnormen: Ein Fahrzeug aus jedem EU-Land unterliegt den gleichen technischen Bestimmungen'
            - Je kürzer die Strecke, desto häufiger ist die Überführung günstiger als der Autotransport
      china:
        metaTitle: Autos aus China schlüsselfertig – Auswahl und Import
        metaDescription: Wir organisieren den Import von Fahrzeugen aus China in jedes Land über einen geprüften Logistikpartner – Auswahl, Dokumentation und Zollabwicklung schlüsselfertig.
        title: Autos aus China
        titleHighlight: schlüsselfertig
        description: Wir wählen ein Auto aus China aus und bringen es zu Ihnen, wo auch immer Sie sind – direkt über einen geprüften Logistikpartner, schlüsselfertig, einschließlich Zollabwicklung.
        ctaLabel: Anfrage stellen
        breadcrumbLabel: Autos aus China
        casesHeading: 'Fälle: Autos aus China'
        steps:
          - n: '01'
            text: Sie stellen eine Anfrage mit Anforderungen – Budget, Marke, Kilometerstand
          - n: '02'
            text: Wir suchen Autos aus China nach Ihren Kriterien
          - n: '03'
            text: Wir prüfen das Fahrzeug und organisieren die Exportdokumente
          - n: '04'
            text: Wir organisieren die Lieferung zu Ihrer Stadt über unseren Logistikpartner
          - n: '05'
            text: Zollabwicklung und Übergabe des Fahrzeugs an Sie – schlüsselfertig
        deCrossLabel: Suchen Sie ein Auto aus Deutschland?
        destinationsNote: Wir liefern nach Serbien und Deutschland – und in jedes andere Land, das besprechen wir bei der Anfrage.
        notesHeading: Was beeinflusst Fristen und Preise aus China
        notesPointsLabel: Besonderheiten der Richtung
        notes:
          lead: 'China ist ein Markt mit den längsten Fristen und den größten Preisunterschieden: Die Fahrzeuge werden per Schiff transportiert. Dafür findet man hier Konfigurationen und Elektroautos, die in Europa nicht erhältlich sind.'
          points:
            - Seefracht – der Hauptzeitfaktor, planen Sie in Monaten und nicht in Wochen
            - 'Europäische Herkunft wird nicht bestätigt: EUR1 findet hier keine Anwendung, die Zollgebühren sind höher'
            - 'Garantie und Ersatzteile: Wir prüfen, ob das Modell im Bestimmungsland unterstützt wird'
            - 'Elektroautos: Wir überprüfen den Ladeanschluss und die Kompatibilität mit den örtlichen Netzen'
      closing:
        eyebrow: Berechnen Sie den Import
        line1: Sagen Sie uns, welches
        line2: Auto Sie brauchen, –
        accentWord: wir berechnen bis zu den Nummern
        text: 'Der Preis des Fahrzeugs, die Logistik, Zölle und Dokumentation – alles in einer Summe vor dem Start. Später wird er nicht steigen: Alles, was auf dem Weg auftaucht, ist unser Anliegen.'
    vehicle-inspection:
      title: Fahrzeuginspektion
      description: Unabhängige Inspektion eines Fahrzeugs vor dem Kauf. Anfahrt eines Experten, Diagnose, Bericht — ohne Kaufverpflichtung.
      ctaLabel: Inspektion anfordern
      casesHeading: Inspektionsfälle
      breadcrumbLabel: Fahrzeuginspektion
      steps:
        - n: '01'
          text: Karosserie und Lackierung – Vorhandensein von Reparaturen oder Unfällen
        - n: '02'
          text: Fahrwerk, Federung, Bremsen
        - n: '03'
          text: Motor, Getriebe, Antrieb
        - n: '04'
          text: Elektronik und Wartungshistorie nach VIN
        - n: '05'
          text: Rechtliche Unbedenklichkeit – Pfand, Registrierungssperre, Unfälle
      extraLine: Wir arbeiten auch in anderen europäischen Ländern, einschließlich Portugal – bitte bei der Anfrage angeben.
      hub:
        metaTitle: Fahrzeuginspektion vor dem Kauf in Europa
        metaDescription: 'Wir kommen zu dem Fahrzeug, das Sie selbst gefunden haben: Lackdickenmessgerät, Scanner, Überprüfung der Historie anhand der VIN und Bericht mit Fotos am selben Tag. Wir arbeiten in acht europäischen Ländern.'
        title: Fahrzeuginspektion
        titleHighlight: vor dem Kauf
        description: 'Wir kommen zu dem Fahrzeug, das Sie selbst gefunden haben, und erzählen Ihnen, was wirklich damit ist. Der Bericht kommt, bevor Sie das Geld übergeben: Wenn die Antwort ‚nicht kaufen‘ ist, verlieren Sie nur die Kosten für die Inspektion.'
        breadcrumbLabel: Fahrzeuginspektion
        casesHeading: Inspektionsfälle
        chooseCountryLabel: 'Wählen Sie ein Land:'
        ctaLabel: Inspektion anfordern
        heroPhotoAlt: Auto auf einer Hebebühne im Service
        processHeading: Ablauf der Inspektion
        processLead: Normalerweise sind wir innerhalb von ein bis zwei Tagen nach der Anfrage vor Ort. Die Inspektion selbst dauert anderthalb bis zwei Stunden, den Bericht senden wir am selben Tag, solange das Auto nicht bereits an einen anderen Käufer verkauft wurde.
        processSteps:
          - n: '01'
            text: Sie senden einen Link zur Anzeige und die Kontaktdaten des Verkäufers
          - n: '02'
            text: Wir vereinbaren mit dem Verkäufer einen Termin und einen Ort für die Inspektion
          - n: '03'
            text: Wir kommen mit einem Lackdickenmessgerät und einem Scanner, für BMW schließen wir uns an das Händler-ISTA-System an, wenn nötig – auf die Hebebühne
          - n: '04'
            text: Wir machen Fotos und Videos aller Entdeckungen, überprüfen die Historie anhand der VIN
          - n: '05'
            text: Wir senden den Bericht und eine klare Antwort – kaufen, verhandeln oder ablehnen
        includedHeading: Was in der Inspektion enthalten ist
        includedLead: 'Über hundert Punkte auf der Checkliste, aber entscheiden tun fast immer vier Bereiche: Karosserie, Motor mit Getriebe, Fahrwerk und Dokumente. Genau in diesen Bereichen raten wir oft von einem Kauf ab.'
        included:
          - title: Karosserie und Lackierung
            text: Lackdickenmessung an jedem Element, Geometrie der Öffnungen, Schweiß- und Spachtelspuren. Man sieht, ob es Reparaturen gab, die der Verkäufer nicht erwähnt hat.
          - title: Motor und Getriebe
            text: Parameter bei warmem Motor, Anpassungen des Getriebes, Fehler im Speicher der Einheiten. Der teuerste Bereich und die häufigste Ablehnungsursache.
          - title: Fahrwerk und Bremsen
            text: Spiel, Zustand der Federung und des Bremssystems. Autobahnkilometer und Balkanstraßen beanspruchen Fahrzeuge unterschiedlich, und das ist sichtbar.
          - title: Elektronik und Historie nach VIN
            text: CarVertical-Bericht, Händlerdiensthistorie nach Marke, Abweichung des Kilometerstands von der Historie, Fehler in den Einheiten und Spuren ausgelöster Airbags.
          - title: Rechtliche Unbedenklichkeit
            text: Pfand, Registrierungssperre, ungelöste Unfälle und Versicherungsereignisse – das, was nach dem Kauf aufkommt.
          - title: Bericht mit Fotos und Videos
            text: Jede Entdeckung ist dokumentiert und unterschrieben. Der Bericht bleibt bei Ihnen – damit können Sie bequem verhandeln, selbst wenn Sie das Auto letztendlich kaufen.
        compareHeading: Was sich von Land zu Land ändert
        compareLead: Die Vorgaben für die technische Prüfung, typische Mängel lokaler Fahrzeuge und Methoden, um die Historie überall zu verbergen.
        compareHint: Wählen Sie ein Land – wir zeigen, was wir zur normalen Checkliste hinzufügen.
        compareLinkFor: Inspektion {location} — im Detail
        mapHeading: Vier Bereiche, die den Deal entscheiden
        mapLead: Die Checkliste ist lang, aber wir raten fast immer aufgrund eines der vier Bereiche ab. Klicken Sie auf die Nummer im Diagramm – wir zeigen, was der Experte prüft und was wir dort gefunden haben.
      countryNotesHeadingFor: Wie wir {location} prüfen
      countryNotesPointsLabel: Was wir über die normale Checkliste hinaus prüfen
      countryNotes:
        de:
          lead: 'In Deutschland gibt es viel, worauf man sich stützen kann: Serviceheft, HU-Protokolle und umfangreiche VIN-Datenbanken. Daher ist die Prüfung hier in erster Linie ein Abgleich der Dokumente mit dem, was das Auto tatsächlich zeigt.'
          points:
            - Wir vergleichen die Einträge der Händlerwartung mit den Kilometerständen über die Jahre
            - Anmerkungen der letzten HU – was nach der Inspektion repariert wurde und was nur aufgeschoben wurde
            - Unterboden und Schweller nach den Winterreagenzien, einschließlich versteckter Hohlräume
            - 'Leasingvergangenheit: ordnungsgemäße Wartung bei hohem Kilometerstand'
        rs:
          lead: 'In Serbien kommen wir am Tag der Anfrage. Die Hauptaufgabe besteht darin, die Historie des Fahrzeugs bis zur Einfuhr wiederherzustellen: Die lokalen Dokumente zeigen nur den letzten Abschnitt des Lebens des Fahrzeugs.'
          points:
            - Herkunftsland und Zustand des Fahrzeugs vor der Einfuhr nach Serbien
            - Kilometerstand gegen die Einträge des technischen Überwachungsberichts aus vergangenen Jahren
            - Karosseriereparaturen nach der Einfuhr – diese werden häufiger und günstiger gemacht als in der EU
            - 'Rechtlicher Teil: Pfand und Einschränkungen bei der Registrierung'
        es:
          lead: Spanische Fahrzeuge erfreuen sich normalerweise eines guten Unterbodens, doch alles, was unter Sonnen- und Salzbelastung leidet, ist oft problematisch. Wir verlagern die Prüfung von der Korrosion unten auf versteckte Hohlräume, Elektronik und Innenraummängel.
          points:
            - Korrosion in versteckten Hohlräumen an der Küste – von unten kann es sauber sein
            - Lack, Dichtungen und Kunststoff nach jahrelanger Sonneneinstrahlung
            - 'Vermietungs-Vergangenheit: Wir vergleichen den Kilometerstand mit dem Abnutzungsgrad des Innenraums'
            - ITV-Protokoll und was zwischen den Inspektionen nicht geschlossen wurde
        ch:
          lead: Für MFK werden die Fahrzeuge ernsthaft vorbereitet, daher sagt ein frisches Protokoll allein wenig aus. Wir schauen uns an, was genau vor der Inspektion gemacht wurde und was seit dem letzten Jahr sein eigenes Leben lebt.
          points:
            - Was direkt vor der MFK ersetzt wurde – frische Teile im Vergleich zum Rest
            - Wartung ist teuer, daher überprüfen wir, ob Regularien hinausgeschoben wurden
            - Ausstattung ist reichhaltig, aber wir prüfen, ob jede Option noch funktioniert
            - 'Dokumente zum Import: Die Schweiz ist nicht EU, das Set ist anders'
        pt:
          lead: 'Hier dreht sich alles um das feuchte Meeresklima. Wir beginnen mit der Prüfung auf Korrosion und Elektronik: Gewöhnlich ist es der Zustand, der in der Feuchtigkeit leidet.'
          points:
            - Versteckte Hohlräume, Längsträger und Befestigungspunkte der Federung
            - Oxidation von Steckern und Einheiten – eine typische Ursache für intermittierende Fehler
            - IPO-Protokoll und Regelmäßigkeit der Prüfungen
            - 'Dieselmotoren mit städtischer Nutzung: Partikelfilter und seine Historie'
        fr:
          lead: 'In Frankreich ist eine detaillierte contrôle technique zu finden, und dies ist ein guter Ausgangspunkt. Danach schauen wir uns an, was die Vorgaben nicht abdecken: die Lebensdauer der Dieseleinheit und den Verschleiß durch den Stadtverkehr.'
          points:
            - Anmerkungen der contrôle technique über die Jahre – was aus der Inspektion zur Inspektion wiederholt wird
            - Partikelfilter, EGR und Turbolader bei Dieselmotoren
            - Kupplung und Federung nach dichtem Stadtverkehr
            - 'Historie bei französischen Marken: leicht verfügbare Ersatzteile, aber eigene Schwächen'
        it:
          lead: Italienische Fahrzeuge kommen häufiger mit kleinen Karosseriereparaturen, die schnell und günstig durchgeführt wurden. Für die Lackdickenmessung an den Paneelen benötigen wir hier deutlich mehr Zeit als üblich.
          points:
            - Lackdickenmessung an allen Paneelen – Nachbesserungen nach städtischen Kontaktstellen
            - 'Unterschied zwischen Norden und Süden: Salz an der Küste, normaler Verschleiß im Landesinneren'
            - Gasausstattung, wenn vorhanden – Installation und Zustand des Tanks
            - Regelmäßigkeit der revisione und versäumte Fristen
        pl:
          lead: Polen ist der größte Umschlagplatz für Unfallfahrzeuge aus Westeuropa. Daher ist es unser erstes Ziel herauszufinden, was mit dieser Karosserie vor dem Verkauf gemacht wurde.
          points:
            - Geometrie der Öffnungen und Schweißspuren – Wiederherstellung nach einem schweren Unfall
            - 'Importhistorie: Woher das Fahrzeug kam und in welchem Zustand'
            - Wir vergleichen den Kilometerstand mit europäischen Servicedaten, dem Kilometerzähler glauben wir nicht
            - Airbags und deren Auslösung in der Vergangenheit
      closing:
        eyebrow: Haben Sie ein Auto gefunden?
        line1: Senden Sie uns den Link
        line2: zur Anzeige —
        accentWord: wir kommen und schauen uns das an
        text: Wir kommen innerhalb von ein bis zwei Tagen. Der Bericht mit Fotos bleibt bei Ihnen, selbst wenn Sie nach ihm vom Kauf Abstand nehmen.
    cityVehicleSourcing:
      title: Fahrzeugbeschaffung
      descriptionFor: Wir finden ein Auto in {cityLocation} mit umfassender Prüfung. Wir arbeiten in der gesamten Region {countryName}.
      casesHeadingFor: Fälle aus {countryGenitiveOrName}
      whyCityHeadingFor: Warum {cityName}
      reason1: Wir prüfen sowohl Händlerplätze als auch private Angebote
      reason2: Die Historie anhand der VIN wird vor Besichtigung überprüft
      reason3For: Unser Experte in {cityLocation}
      reason4Dekra: DEKRA / TÜV-Prüfung auf Anfrage
      reason4Generic: Unabhängige technische Expertise auf Anfrage
      otherCitiesLabelFor: 'Andere Städte in {countryLocation}:'
      cityNotesHeadingFor: Automarkt in {cityLocation}
      cityNotesPointsLabel: Was das praktisch bedeutet
      cityNotes:
        berlin:
          lead: 'In Berlin gibt es die größte Auswahl in Deutschland und die bunteste Mischung an Verkäufern. Hier findet man alles: von Firmenfahrzeugen mit kompletter Historie bis hin zu weiterverkauften Optionen aus Osteuropa.'
          points:
            - Riesige Auswahl in jedem Segment, einschließlich seltener Ausstattungen
            - Viele Privatverkäufer — Verhandlungen sind realistischer als bei Händlern
            - 'Städtischer Gebrauch: Kupplung und Fahrwerk verschleißen schneller als bei Autobahnfahrzeugen'
        munich:
          lead: 'Teure Stadt mit teuren Autos. Der Premium-Segment ist hier größer als irgendwo sonst in Deutschland, und der Zustand ist im Durchschnitt besser: solche Autos werden gut gepflegt.'
          points:
            - Starker Premium-Segment, insbesondere BMW und Mercedes
            - Gut gepflegte Autos mit vollständiger Händlerhistorie
            - Preise über dem nationalen Durchschnitt — Econmy basiert auf Zustand
        hamburg:
          lead: Hafenstadt und großes Logistikzentrum. Von hier aus lässt sich ein Auto gut weiter versenden, und auf dem Markt findet man überdurchschnittlich häufig frische Importfahrzeuge.
          points:
            - Der Hafen ist in der Nähe — der Versand lässt sich einfacher und günstiger organisieren
            - Viele Autos aus den Nordländern mit Autobahnkilometern
            - 'Feuchtes maritimes Klima: Karosserie und Hohlräume werden genauer untersucht'
        belgrade:
          lead: Unsere Basis. In Belgrad führen wir Besichtigungen am selben Tag durch, kennen die lokalen Verkäufer und sehen, welches Auto seit zwei Monaten durch die Plätze wandert.
          points:
            - Besichtigung am selben Tag, keine Wartezeit und Logistik
            - Wir kennen die lokalen Plätze und die Historie der Autos, die dort stehen
            - Das Auto ist bereits verzollt — Einfuhr und Zollgebühren sind nicht erforderlich
        novi-sad:
          lead: Die zweitgrößte Stadt Serbiens und eine Stunde Fahrt von Belgrad entfernt. Der Markt ist kleiner, aber die Preise sind in der Regel ruhiger als in der Hauptstadt, und die Autos haben seltener mehrere Händlerschritte durchlaufen.
          points:
            - Preise sind niedriger als in Belgrad bei vergleichbarem Zustand
            - Weniger Wiederverkäufer, häufiger der erste Besitzer
            - Wir fahren von Belgrad, keine separate Gebühr für den Weg
        pancevo:
          lead: Pančevo gehört faktisch zum Ballungsraum von Belgrad, deshalb unterscheidet sich die Besichtigung hier nicht von der in der Hauptstadt. Der Markt ist klein, aber die privaten Angebote sind interessanter.
          points:
            - Zwanzig Minuten von Belgrad — wir fahren genauso schnell
            - Kleiner Markt mit einer Überzahl an Privatverkäufern
            - Oft günstiger als in der Hauptstadt bei gleichem Zustand
        subotica:
          lead: 'Subotica liegt an der Grenze zu Ungarn, und das zeigt sich im Markt: viele Autos wurden aus der EU importiert, und die Verkäufer beschäftigen sich konstant damit.'
          points:
            - Grenzmarkt — viele frische Importe aus der Europäischen Union
            - Die Historie vor dem Import wird besonders gründlich geprüft
            - Bequemer Standort, wenn Sie das Auto weiter nach Norden fahren wollen
        madrid:
          lead: 'Der Hauptstadtmarkt Spaniens: die größte Auswahl im Land und viele Autos aus Unternehmensflotten. Kontinentalklima, daher ist diese Region weniger korrosionsanfällig als die Küsten.'
          points:
            - Größte Auswahl in Spanien, auch Unternehmensfahrzeuge
            - Weit weg vom Meer — Karosserien sind in der Regel sauberer als an der Küste
            - 'Heiße Sommer: Plastik, Lack und Klimaanlage werden separat überprüft'
        barcelona:
          lead: Alles wird durch die Nähe zum Meer bestimmt. Autos sehen oft von unten großartig aus, benötigen jedoch Aufmerksamkeit auf verborgenen Hohlräumen und der Elektrik.
          points:
            - 'Das Meer ist nah, deshalb prüfen wir versteckte Hohlräume: von unten oft sauber, aber innen nicht'
            - Viele ehemalige Mietwagen und Carsharing-Fahrzeuge
            - Hafen in der Nähe, Versand über das Meer lässt sich einfacher organisieren
        zurich:
          lead: Zürich ist der teuerste Automarkt der Region. Hier wird auf maximale Ausstattungen geachtet, die Pflege erfolgt beim Händler, und sie werden verkauft, bevor das Auto ermüdet.
          points:
            - Maximale Ausstattungen und geringe Laufleistungen
            - Händlerbetreuung — die Historie ist fast immer vollständig
            - Schweiz ist nicht in der EU, Einfuhr wird separat geregelt
        geneva:
          lead: Genf liegt im französischsprachigen Teil der Schweiz, direkt an der Grenze zu Frankreich. Französische Marken sind hier deutlich mehr vertreten als in dem deutschen Teil des Landes.
          points:
            - 'Gemischter Markt: Schweizer Zustand, französisches Sortiment'
            - Grenze zu Frankreich in der Nähe — es gibt Preisspannen zum Vergleich
            - 'Die Formalitäten sind die gleichen wie in der gesamten Schweiz: Export plus Import'
        paris:
          lead: 'Die größte Auswahl in Frankreich kommt oft mit der härtesten Nutzung: dichter Verkehr und enge Parkplätze hinterlassen ihre Spuren auf Karosserie und Fahrwerk.'
          points:
            - Die größte Auswahl in Frankreich, besonders bei französischen Marken
            - 'Städtischer Gebrauch: Kupplung, Fahrwerk und kleine Karosserieschäden'
            - Viele Dieselfahrzeuge — den Rußfilter und EGR überprüfen wir zuerst
        lyon:
          lead: Lyon ist im Vergleich zu Paris ruhiger bei Preisen und Zustand der Autos. Die Autobahn nach Süden ist in der Nähe, daher findet man häufig Autos mit gleichmäßigen Autobahnkilometern.
          points:
            - Preise unter denen von Paris bei vergleichbarem Angebot
            - Mehr Autobahnkilometer, weniger städtischer Verschleiß
            - Bequemer Zugang nach Italien und Spanien, wenn wir umfassender suchen
        milan:
          lead: Wirtschaftshauptstadt Italiens, und auf dem Markt ist das sichtbar. Der Norden des Landes hat bessere Straßen und besser gepflegte Autos als der Süden.
          points:
            - Beste Auswahl im Premium-Segment in Italien
            - Im Norden weniger Salz und Korrosion als im Süden
            - 'Dichte Stadt: Dicke Messgerät ist Pflicht'
        rome:
          lead: Großer Markt mit sehr dichten städtischen Vorbedingungen. Kleine Lackschäden gelten hier als normal, und werden oft hastig repariert.
          points:
            - Viele Kleinwagen und Autos mit Gasanlage
            - Häufige Nachlackierungen nach städtischen Kontaktpunkten — wir prüfen jedes Panel
            - Südlicher von Mailand — milderes Klima, aber näher am Meer
        warsaw:
          lead: Über Warschau kommt der Hauptimport aus Westeuropa ins Land, und hier gibt es auch die größte Auswahl in Polen. Der Anteil an wiederaufbereiteten Autos ist ebenfalls am höchsten.
          points:
            - Größte Auswahl in Polen, viele frische Importe aus der EU
            - Die Geometrie der Karosserie und Anzeichen von Reparaturen werden zuerst überprüft
            - Kurze Transportstrecke — günstiger als aus Südeuropa
        krakow:
          lead: 'Krakau ist ruhiger als Warschau: der Markt ist kleiner, es gibt weniger Wiederverkäufer, und die Autos haben oft länger einen Besitzer. Der Süden Polens ist logistisch näher an den Balkans.'
          points:
            - Weniger Wiederverkäufer als in Warschau, die Historie ist normalerweise sauberer
            - Preise sind oft niedriger als in der Hauptstadt
            - Näher an der Route nach Süden — praktisch für den Transport nach Serbien
