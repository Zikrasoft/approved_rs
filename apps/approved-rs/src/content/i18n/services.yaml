          points:
            - 'El flete marítimo es el principal plazo: planifica en meses, no en semanas'
            - 'El origen europeo no se puede confirmar: EUR1 no se aplica aquí, los aranceles son más altos'
            - 'Garantía y repuestos: verificamos si el modelo se apoya en el país de destino'
            - 'Vehículos eléctricos: verificamos el tipo de enchufe y su compatibilidad con las redes locales'
