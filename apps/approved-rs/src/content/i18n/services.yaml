            - El IVA suizo al exportar se devuelve, lo tenemos en cuenta en el cálculo
            - 'Verificamos por separado el origen del coche: las matrículas suizas no significan producción europea'
            - El estado generalmente es mejor que la media, pero el precio en el anuncio es más alto
