    vehicle-inspection:
      title: Inspección de coches
      description: Inspección independiente del coche antes de comprarlo. Visita de un experto, diagnóstico e informe, sin compromiso de compra.
      ctaLabel: Solicitar inspección
      casesHeading: 'Casos reales: inspección antes de comprar'
      breadcrumbLabel: Inspección de coches
      steps:
        - n: '01'
          text: 'Carrocería y pintura: reparaciones o daños por accidente'
        - n: '02'
          text: Tren de rodaje, suspensión y frenos
        - n: '03'
          text: Motor, caja de cambios y transmisión
        - n: '04'
          text: Electrónica e historial de mantenimiento por VIN
        - n: '05'
          text: 'Situación legal: cargas, prohibición de matricular y accidentes'
      extraLine: También trabajamos en otros países europeos, como Portugal. Consúltanos al solicitar el servicio.
      hub:
        metaTitle: Inspección de coches antes de comprar en Europa
        metaDescription: 'Inspeccionamos el coche que has encontrado: medidor de pintura, escáner, historial por VIN e informe con fotos el mismo día. En ocho países europeos.'
        title: Inspección de coches
        titleHighlight: antes de comprar
        description: 'Vamos a inspeccionar el coche que has encontrado y te contamos cómo está realmente. Recibirás el informe antes de pagar: si te recomendamos no comprarlo, solo perderás el coste de la inspección.'
        breadcrumbLabel: Inspección de coches
        casesHeading: 'Casos reales: inspección antes de comprar'
        chooseCountryLabel: 'Elige un país:'
        ctaLabel: Solicitar inspección
        heroPhotoAlt: Coche en un elevador de taller
        processHeading: Cómo es la inspección
        processLead: Normalmente vamos en uno o dos días desde que recibimos la solicitud. La inspección dura entre hora y media y dos horas. Enviamos el informe ese mismo día, antes de que otro comprador se quede con el coche.
        processSteps:
          - n: '01'
            text: Envíanos el enlace del anuncio y los datos de contacto del vendedor
          - n: '02'
            text: Acordamos con el vendedor la hora y el lugar de la inspección
          - n: '03'
            text: Vamos con medidor de pintura y escáner; en BMW conectamos el sistema oficial ISTA y, si hace falta, subimos el coche al elevador
          - n: '04'
            text: Fotografiamos y grabamos en vídeo todos los problemas y comprobamos el historial por VIN
          - n: '05'
            text: 'Te enviamos el informe y una recomendación clara: comprar, negociar el precio o descartar'
        includedHeading: Qué incluye la inspección
        includedLead: 'Más de cien puntos en la lista, pero casi siempre lo decisivo está en cuatro áreas: carrocería, motor y caja de cambios, tren de rodaje y documentación. Son los aspectos que más a menudo nos llevan a recomendar que no se compre el coche.'
        included:
          - title: Carrocería y pintura
            text: Medimos el espesor de pintura en cada panel y comprobamos la geometría de los huecos, así como soldaduras y masilla. Así detectamos reparaciones que el vendedor no haya mencionado.
          - title: Motor y caja de cambios
            text: Comprobamos los parámetros con el motor caliente, las adaptaciones de la caja de cambios y los errores guardados en las centralitas. Es la parte más cara y la causa más frecuente para descartar una compra.
          - title: Tren de rodaje y frenos
            text: Comprobamos holguras, suspensión y sistema de frenos. Los kilómetros de autopista y las carreteras de los Balcanes desgastan el coche de forma distinta, y se nota.
          - title: Electrónica e historial por VIN
            text: Informe de CarVertical, historial de mantenimiento en concesionarios de la marca, discrepancias entre el kilometraje y el historial, errores en las unidades de control y señales de despliegue de los airbags.
          - title: Situación legal
            text: 'Cargas, prohibiciones de matriculación, accidentes sin resolver y siniestros de seguros: problemas que pueden salir a la luz después de la compra.'
          - title: Informe con fotos y vídeos
            text: Fotografiamos y documentamos cada hallazgo. El informe es suyo y le sirve para negociar, incluso si finalmente compra el coche.
        compareHeading: Qué cambia de un país a otro
        compareLead: Las normas de inspección técnica, los problemas habituales de los coches locales y las formas de ocultar su historial varían de un país a otro.
        compareHint: Elija un país y le mostraremos qué añadimos a la lista de comprobación habitual.
        compareLinkFor: Inspección detallada en {location}
        mapHeading: Cuatro áreas que deciden la compra
        mapLead: La lista de comprobación es larga, pero casi siempre desaconsejamos la compra por problemas en una de estas cuatro áreas. Pulse un número del esquema y le mostraremos qué revisa el experto y qué hemos encontrado.
      countryNotesHeadingFor: Cómo inspeccionamos en {location}
      countryNotesPointsLabel: Qué revisamos además de la lista habitual
      countryNotes:
        de:
          lead: 'En Alemania hay buenos registros para consultar: libro de mantenimiento, informes de HU y bases de datos de VIN completas. Por eso, aquí la inspección se centra sobre todo en contrastar los documentos con lo que revela el coche.'
          points:
            - Contrastamos los sellos de mantenimiento del concesionario con las lecturas del cuentakilómetros de cada año
            - 'Observaciones de inspecciones HU anteriores: qué se reparó y qué se dejó pasar'
            - Bajos y umbrales expuestos a la sal de las carreteras en invierno, incluidas las cavidades ocultas
            - 'Historial de leasing: mantenimiento regular pese al alto kilometraje'
        rs:
          lead: En Serbia podemos desplazarnos el mismo día. La tarea principal es reconstruir el historial del coche antes de su importación, ya que los documentos locales solo muestran el último tramo de su vida.
          points:
            - País de origen y estado del coche antes de su importación a Serbia
            - Lecturas del cuentakilómetros frente a los registros de la inspección técnica de años anteriores
            - Reparaciones de carrocería posteriores a la importación, más frecuentes y baratas que en la UE
            - 'Situación legal: cargas y restricciones de matriculación'
        es:
          lead: Los coches españoles suelen tener los bajos en buen estado, pero pueden sufrir daños por el sol y la sal. Centramos la inspección menos en la corrosión de los bajos y más en las cavidades ocultas, el sistema eléctrico y el estado del interior.
          points:
            - Corrosión en cavidades ocultas cerca de la costa, aunque los bajos estén limpios
            - Pintura, juntas y plásticos deteriorados tras años de exposición al sol
            - 'Uso previo en alquiler: contrastamos el kilometraje con el desgaste del interior'
            - Informe de ITV y asuntos pendientes entre inspecciones
        ch:
          lead: Los coches se preparan a conciencia para la MFK, así que un informe reciente no basta para sacar conclusiones. Comprobamos qué se reparó justo antes de la inspección y qué lleva arrastrándose desde el año pasado.
          points:
            - Qué se sustituyó justo antes de la MFK y si las piezas nuevas desentonan con el resto
            - El mantenimiento es caro, así que comprobamos si se han retrasado las revisiones programadas
            - El equipamiento suele ser completo, pero comprobamos que todas las opciones sigan funcionando
            - 'Documentación para la importación: Suiza no pertenece a la UE y los documentos necesarios son distintos'
        pt:
          lead: 'Aquí todo depende del clima marítimo húmedo. Empezamos por la corrosión y el sistema eléctrico: lo que suele fallar es lo que está expuesto a la humedad.'
          points:
            - Cavidades ocultas, largueros y puntos de anclaje de la suspensión
            - Oxidación de conectores y unidades de control, causa habitual de fallos intermitentes
            - Informe de IPO y regularidad de las inspecciones
            - 'Diésel usados en ciudad: filtro de partículas y su historial'
        fr:
          lead: 'En Francia, el contrôle technique es detallado y ofrece un buen punto de partida. Después revisamos lo que no detecta: la vida útil del sistema diésel y el desgaste causado por el tráfico urbano.'
          points:
            - Observaciones del contrôle technique a lo largo de los años y problemas que se repiten en cada inspección
            - Filtro de partículas, EGR y turbocompresor en motores diésel
            - Embrague y suspensión tras un uso intensivo en ciudad
            - 'Historial de las marcas francesas: repuestos disponibles, pero con sus propios puntos débiles'
        it:
          lead: Los coches italianos suelen llegar con pequeñas reparaciones de carrocería hechas con rapidez y a bajo coste. Aquí dedicamos mucho más tiempo de lo habitual a medir el espesor de la pintura en los paneles.
          points:
            - Medimos el espesor de la pintura en todos los paneles para detectar repintados tras roces urbanos
            - 'Diferencias entre el norte y el sur: sal en la costa y desgaste normal en el interior'
            - 'Sistema de gas, si lo lleva: instalación y estado del depósito'
            - Regularidad de la revisione y periodos sin inspección
        pl:
          lead: Polonia es el mayor mercado de tránsito de coches accidentados procedentes de Europa occidental. Por eso, lo primero es averiguar qué reparaciones se hicieron en la carrocería antes de la venta.
          points:
            - Geometría de los huecos de la carrocería y señales de soldadura que indiquen reparaciones tras un accidente grave
            - 'Historial de importación: de dónde procede el coche y en qué estado llegó'
            - Contrastamos el kilometraje con bases de datos de mantenimiento europeas, no nos fiamos del cuentakilómetros
            - Airbags y señales de despliegue previo
      closing:
        eyebrow: ¿Ha encontrado un coche?
        line1: Envíenos el enlace
        line2: del anuncio,
        accentWord: iremos a inspeccionarlo
        text: Nos desplazamos en uno o dos días. El informe con fotos es suyo, aunque después decida no comprar el coche.
    cityVehicleSourcing:
      title: Búsqueda de coches
      descriptionFor: Encontramos el coche ideal en {cityLocation} y lo inspeccionamos a fondo. Trabajamos en toda la región de {countryName}.
      casesHeadingFor: Operaciones reales en el mercado de {countryGenitiveOrName}
      whyCityHeadingFor: Por qué {cityName}
      reason1: Buscamos tanto en concesionarios como en anuncios particulares
      reason2: Consultamos el historial del VIN antes de desplazarnos a inspeccionar el coche
      reason3For: Nuestro experto en {cityLocation}
      reason4Dekra: Inspección de DEKRA / TÜV a petición
      reason4Generic: Inspección técnica independiente a petición
      otherCitiesLabelFor: 'Otras ciudades de {countryLocation}:'
      cityNotesHeadingFor: El mercado del automóvil en {cityLocation}
      cityNotesPointsLabel: Qué implica en la práctica
      cityNotes:
        berlin:
          lead: 'Berlín tiene la mayor oferta de Alemania y una gran variedad de vendedores. Hay de todo: coches de flotas de empresa con historial completo y vehículos de intermediarios procedentes de Europa del Este.'
          points:
            - Gran oferta en todos los segmentos, incluso versiones poco comunes
            - Muchos vendedores particulares y más margen para negociar que en los concesionarios
            - 'Uso urbano: el embrague y la suspensión suelen estar más desgastados que en coches de carretera'
        munich:
          lead: 'Una ciudad cara, con coches caros. Aquí hay más vehículos prémium que en ningún otro lugar de Alemania y, en general, están mejor conservados: sus dueños los cuidan.'
          points:
            - Fuerte presencia del segmento prémium, sobre todo BMW y Mercedes
            - Coches bien cuidados y con historial completo en concesionarios
            - Precios por encima de la media nacional, pero se compensa con el estado
        hamburg:
          lead: Ciudad portuaria y gran centro logístico. Desde aquí es fácil organizar el transporte del coche, y en el mercado abundan los vehículos de importación recientes.
          points:
            - El puerto está cerca, así que el transporte es más fácil y barato
            - Muchos coches de las regiones del norte, con kilometraje principalmente en carretera
            - 'Clima marítimo húmedo: revisamos con más atención la carrocería y las cavidades ocultas'
        dusseldorf:
          lead: Centro de Renania del Norte-Westfalia, la región más poblada de Alemania. Los concesionarios están muy cerca unos de otros y la frontera con Países Bajos y Bélgica queda a una hora, por lo que llegan coches de esos países para la venta con regularidad.
          points:
            - Podemos revisar varios coches en una visita, porque los concesionarios están cerca
            - 'Algunos coches tienen matrícula neerlandesa o belga: comprobamos su historial y documentación por separado'
            - Hay muchos vendedores y compiten entre sí, por lo que suelen negociar más
        belgrade:
          lead: Nuestra base. En Belgrado podemos ir a inspeccionar el coche el mismo día que nos contactas, conocemos a los vendedores locales y sabemos qué coches llevan dos meses dando vueltas de un concesionario a otro.
          points:
            - Inspección el mismo día, sin esperas ni complicaciones logísticas
            - Conocemos los concesionarios locales y el historial de los coches que tienen a la venta
            - El coche ya está despachado de aduana, no hacen falta importación ni aranceles
        novi-sad:
          lead: La segunda ciudad más grande de Serbia, a una hora de Belgrado. El mercado es más pequeño, pero los precios suelen ser más moderados que en la capital y es menos frecuente que los coches hayan pasado por varias reventas.
          points:
            - Precios más bajos que en Belgrado con un estado similar
            - Menos intermediarios y más coches de primer propietario
            - Salimos desde Belgrado, sin cobrar un suplemento por el desplazamiento
        pancevo:
          lead: Pančevo forma parte del área metropolitana de Belgrado, así que la inspección es igual que en la capital. El mercado es pequeño, pero a veces aparecen anuncios particulares interesantes.
          points:
            - A veinte minutos de Belgrado, podemos desplazarnos igual de rápido
            - Mercado pequeño, con mayoría de vendedores particulares
            - A menudo más barato que en la capital con un estado similar
        subotica:
          lead: 'Subotica está en la frontera con Hungría, y eso se nota en el mercado: hay muchos coches importados de la UE y vendedores que se dedican a ello de forma habitual.'
          points:
            - Mercado fronterizo con muchos coches de importación recientes de la UE
            - Comprobamos con especial cuidado el historial anterior a la importación
            - Buena ubicación si piensas llevarte el coche más al norte
        madrid:
          lead: El mercado más grande de España, con la mayor oferta del país y muchos coches de flotas de empresa. El clima continental implica menos corrosión por el mar que en la costa.
          points:
            - La mayor oferta de España, incluidos coches de empresa
            - Lejos del mar, las carrocerías suelen estar en mejor estado que en la costa
            - 'Veranos calurosos: revisamos por separado los plásticos, la pintura y el aire acondicionado'
        barcelona:
          lead: La cercanía del mar lo condiciona todo. Muchos coches parecen impecables por debajo, pero conviene revisar las cavidades ocultas y el sistema eléctrico.
          points:
            - 'El mar está cerca, así que revisamos las cavidades ocultas: por debajo suele estar limpio, pero por dentro no siempre'
            - Muchos coches que fueron de alquiler o de carsharing
            - El puerto está cerca y facilita organizar el transporte marítimo
        zurich:
          lead: Zúrich es el mercado automovilístico más caro de la región. Los coches suelen tener el máximo nivel de equipamiento, mantenimiento en concesionario y se venden antes de que el desgaste pase factura.
          points:
            - Máximo equipamiento y poco kilometraje
            - Mantenimiento en concesionario y casi siempre con historial completo
            - Suiza no pertenece a la UE, así que la importación se tramita por separado
        geneva:
          lead: Ginebra está en la parte francófona de Suiza, junto a la frontera con Francia. En el mercado hay muchos más coches franceses que en la parte germanófona del país.
          points:
            - 'Mercado mixto: estado suizo y oferta francesa'
            - La frontera con Francia está cerca, así que puedes comparar precios
            - 'Los trámites son los mismos que en el resto de Suiza: exportación e importación'
        paris:
          lead: 'La mayor oferta de Francia viene acompañada de un uso más exigente: el tráfico denso y los aparcamientos estrechos dejan huella en la carrocería y la suspensión.'
          points:
            - La mayor oferta de Francia, sobre todo de marcas francesas
            - 'Uso urbano: embrague, suspensión y pequeños daños en la carrocería'
            - 'Muchos diésel: revisamos primero el filtro de partículas y la EGR'
        lyon:
          lead: Lyon es más tranquilo que París, tanto en precios como en el estado de los coches. La autopista hacia el sur está cerca, así que hay más coches con un kilometraje regular de carretera.
          points:
            - Precios más bajos que en París con una oferta similar
            - Más kilometraje en carretera y menos desgaste urbano
            - Buena ubicación para buscar también en Italia y España
        milan:
          lead: 'La capital económica de Italia, y sus precios lo reflejan. El norte del país se parece más a Alemania: las carreteras son mejores y los coches están mejor cuidados que en el sur.'
          points:
            - La mejor oferta de coches prémium de Italia
            - En el norte hay menos sal y corrosión que en el sur del país
            - 'Ciudad con mucho tráfico: es imprescindible medir el espesor de pintura en los paneles'
        rome:
          lead: Un mercado grande, con un uso urbano muy intenso. Los pequeños roces son habituales y a menudo se reparan deprisa.
          points:
            - Muchos coches pequeños y vehículos con instalación de gas
            - Retoques de pintura frecuentes por roces en ciudad; revisamos cada panel
            - Más al sur que Milán, el clima es más suave, aunque la ciudad está más cerca del mar
        warsaw:
          lead: La mayor parte de las importaciones de Europa occidental entra al país por Varsovia, que también ofrece la mayor selección de Polonia. Aquí también es donde más abundan los coches reparados.
          points:
            - La mayor selección de Polonia, con muchos coches recién importados de la UE
            - Revisamos primero la geometría de la carrocería y las señales de reparación
            - Trayecto de entrega corto, más barato que desde el sur de Europa
        krakow:
          lead: 'Cracovia es más tranquila que Varsovia: el mercado es más pequeño, hay menos compraventas y los coches suelen tener un mismo propietario durante más tiempo. El sur de Polonia está mejor conectado con los Balcanes.'
          points:
            - Menos compraventas que en Varsovia; el historial suele estar más limpio
            - Los precios suelen ser más bajos que en la capital
            - Más cerca de la ruta hacia el sur, práctico para entregar en Serbia
