      hub:
        metaTitle: Compra de coches con matrícula rusa en Europa
        metaDescription: Compramos coches con matrícula rusa en cualquier país de Europa y coches con matrícula serbia en Serbia. Evaluación por fotos en una hora, pago el día de la firma.
        title: Compra de coches
        titleHighlight: sin regateos por semanas
        description: 'Recogemos coches que son difíciles de vender de manera habitual: matrícula rusa, importación caducada, documentación dudosa. El precio es menor que el del mercado, lo que es un costo por la rapidez y porque asumimos todos los trámites de venta.'
        breadcrumbLabel: Compra de coches
        casesHeading: Transacciones reales de compra
        chooseCountryLabel: 'Elige un país:'
        ctaLabel: Obtener evaluación
        heroPhotoAlt: Llaves de coche sobre dinero y documentos
        processHeading: ¿Cómo se lleva a cabo la compra?
        processLead: Desde el primer mensaje hasta el pago suelen pasar dos o tres días, y casi todo este tiempo es el trayecto hasta el lugar de encuentro. La evaluación por fotos la hacemos en una hora.
        processSteps:
          - n: '01'
            text: Envías fotos, documentos y una descripción honesta del estado
          - n: '02'
            text: Damos un precio en una hora — final, sin rango
          - n: '03'
            text: Nos ponemos de acuerdo para encontrarnos donde está el coche; si no funciona, llegamos con un remolque
          - n: '04'
            text: Inspeccionamos en vivo y confirmamos el precio si la descripción coincide
          - n: '05'
            text: Firmamos el contrato, el dinero se transfiere el día de la firma
        includedHeading: Lo que asumimos
        includedLead: Por la diferencia entre nuestro precio y el del mercado, asumimos todo lo que impide que ese coche se venda durante meses.
        included:
          - title: Coches con matrícula rusa
            text: Categoría principal. El automóvil puede estar en cualquier país de Europa; iremos allí donde se encuentre, y nos ocupamos de la exportación y reventa.
          - title: Problemas con la importación y plazos
            text: Tras la firma, los riesgos de importación caducada y los relacionados pasan a ser nuestra responsabilidad.
          - title: Evaluación sin inspección
            text: Damos el precio según las fotos y documentos. Solo vamos cuando ambas partes están de acuerdo con la cantidad.
          - title: Trámites de la transacción
            text: El contrato, la baja de circulación y todos los documentos los preparamos nosotros. De su parte, solo los documentos del coche y la firma.
          - title: Pago el día de la firma
            text: Transferimos el dinero el mismo día. No tenemos esquemas con plazos de pago o 'añadiremos después de la reventa'.
          - title: Rechazo honesto
            text: Si el coche no nos convence, lo diremos de inmediato y explicaremos el motivo. No vamos a alargar el proceso o tirar el precio en el camino.
