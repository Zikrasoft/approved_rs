        title: Provera auta pre kupovine
        titleHighlight: pre kupovine
        description: Izlazimo na lokaciju automobila koji ste sami pronašli i kažemo vam šta se zaista dešava s njim. Izveštaj dobijate pre nego što date novac. Ako vam kažemo da ga ne kupujete, gubite samo cenu provere.
