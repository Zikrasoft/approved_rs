      deliveryLineFor: Dostavljamo auto u bilo koji grad u zemlji. Ako je potreban izvoz, preuzimamo izvozne formalnosti i carinjenje, uz dostavu u {destinations} i bilo koju drugu zemlju.
      deliveryDestinations:
        - Bosnu i Hercegovinu
        - Hrvatsku
        - Severnu Makedoniju
        - Tursku
        - Kazahstan
        - Kirgistan
      citiesHeadingFor: Gde pregledamo automobile {countryLocation}
      citiesLead: Naš stručnjak izlazi na teren širom zemlje, ali automobile najčešće pregledamo tamo gde je ponuda najveća. Evo šta možete očekivati u svakom gradu.
      alsoInLabel: 'Automobile tražimo i u sledećim zemljama:'
      crossSellLabel: Želite auto iz inostranstva?
      countryNotesHeadingFor: Šta uzimamo u obzir {location}
      countryNotesPointsLabel: Šta prvo proveravamo
      countryNotes:
        de:
          lead: 'Izbor je veći nego na bilo kom drugom evropskom tržištu, a servisna istorija se uglavnom može pratiti: većina automobila ima servisnu knjižicu sa evidencijom svakog servisa u ovlašćenoj mreži. Druga strana medalje su velike kilometraže sa auto-puta. Dvesta hiljada kilometara za tri godine ovde je uobičajeno, a ne razlog za popust.'
          points:
            - Servisnu knjižicu i unose ovlašćenog servisa proveravamo po VIN-u u ovlašćenoj mreži
            - 'Izveštaj sa tehničkog pregleda HU, koji svi zovu TÜV: čitamo primedbe sa prethodnog pregleda, ne gledamo samo pečat'
            - 'Automobili iz lizinga i službenih voznih parkova: redovno održavani, ali sa velikom kilometražom'
            - Zbog soli i sredstava za odleđivanje na zimskim putevima posebno pregledamo podvozje i pragove
        rs:
          lead: Ovde smo na licu mesta, pa je provera auta pre kupovine moguća već na dan upita, bez uvoza. Tržište je malo, isti auto često promeni nekoliko prodavaca, pa njegovu istoriju treba pažljivo razjasniti.
          points:
            - Auto je već ocarinjen i na domaćim tablicama, bez dodatne carine i uvoznih formalnosti
            - Kilometraža se često vraća pri preprodaji u zemlji, pa je upoređujemo sa evidencijom tehničkih pregleda
            - Mnogo je automobila iz Nemačke i Italije, pa proveravamo njihovu istoriju pre uvoza
            - Provera auta pre kupovine na dan upita, bez čekanja na organizaciju dolaska
        es:
          lead: Blage zime i gotovo nikakva upotreba sredstava za odleđivanje znače da je podvozje španskih automobila obično znatno očuvanije nego kod nemačkih. Zato sunce i blizina mora ostavljaju trag na laku, plastici i gumenim delovima.
          points:
            - Kod automobila sa primorja koroziju prvo tražimo u skrivenim šupljinama
            - Izbledeli lak i ispucalu plastiku u kabini uzimamo u obzir pri proceni cene
            - 'Mnogo je bivših rentakar vozila: ujednačena kilometraža, ali zahtevni uslovi korišćenja'
            - 'Izveštaj sa tehničkog pregleda ITV: proveravamo primedbe i datume pregleda'
        ch:
          lead: 'Automobili iz Švajcarske primetno su bolje održavani od evropskog proseka: skupo održavanje podstiče vlasnike da vode računa o njima, a kilometraže su male. Ipak, Švajcarska nije u EU, pa je postupak uvoza drugačiji, što unapred uračunavamo u budžet.'
          points:
            - Bogata oprema, za koju su se kupci ovde češće odlučivali nego u susednim zemljama
            - MFK je strog tehnički pregled, za koji se vozila ozbiljno pripremaju, a to se na njima i vidi
            - 'Van EU: carinjenje i dokumentacija razlikuju se od postupka za zemlje Evropske unije'
            - Cene su iznad tržišnog proseka, ali kasnije štedite na popravkama
        pt:
          lead: Tržište je malo, a izbor skromniji nego u Španiji, ali je i konkurencija za dobar automobil manja. Klima je vlažna, uz dosta soli u vazduhu, pa se korozija u priobalju javlja čak i na novijim vozilima.
          points:
            - Zbog vlage i blizine mora, pri proveri auta pre kupovine posebnu pažnju posvećujemo skrivenim šupljinama karoserije i električnim instalacijama
            - 'Malo tržište: za posebne zahteve potraga traje duže nego u Nemačkoj'
            - Čitamo IPO izveštaje i primedbe sa prethodnih tehničkih pregleda
            - Mnogo dizelaša i malih automobila, dok su veći modeli retki
        fr:
          lead: Francusko tržište pre svega čine dizelaši i domaće marke. Peugeot, Renault i Citroën ovde su jeftiniji nego bilo gde u Evropi. Nemački premijum modeli su, naprotiv, skuplji, pa ih uglavnom nema smisla kupovati ovde.
          points:
            - Francuske marke po najpovoljnijim cenama u Evropi, uz jeftinije održavanje
            - Kod dizelaša posebno proveravamo DPF filter i EGR ventil
            - 'Contrôle technique: detaljne izveštaje sa tehničkih pregleda upoređujemo po godinama'
            - 'Gradska vožnja: kvačilo i trap mogu biti istrošeniji nego što bi se očekivalo prema navedenoj kilometraži'
        it:
          lead: 'Italijansko tržište nudi dobar izbor malih automobila i retkih paketa opreme, ali zahteva oprez: vozila se intenzivno koriste, a manje limarske i lakirerske popravke nisu uvek urađene pažljivo.'
          points:
            - 'Gradska vožnja, česti manji udarci i prefarbani delovi: merač debljine laka je obavezan'
            - Jug i priobalje znače so i koroziju, dok su na severu uslovi sličniji nemačkim
            - 'Revisione: proveravamo redovnost tehničkih pregleda, jer se termini češće preskaču'
            - Mnogo automobila ima ugrađen plin, pa taj sistem proveravamo zasebno
        pl:
          lead: 'Najbliže veliko tržište: prevoz je povoljan i ne traje dugo. Ipak, Poljska je godinama bila glavna tranzitna stanica za havarisane automobile iz zapadne Evrope, pa ovde istoriju vozila proveravamo strože nego bilo gde drugde.'
          points:
            - Veliki udeo vozila popravljenih posle udesa, zato je geometrija karoserije prioritet
            - 'Česte preprodaje: automobil može promeniti nekoliko vlasnika za godinu dana'
            - Kilometraža se često vraća prilikom uvoza, pa je upoređujemo sa podacima iz servisnih baza
            - Kraća ruta znači jeftiniji i brži prevoz nego iz Španije ili Portugalije
      closing:
        eyebrow: Odakle da počnemo?
        line1: Opišite automobil
        line2: koji tražite,
        accentWord: ostalo je naš posao
        text: Budžet, tip karoserije, menjač i još poneka želja. Mi tražimo, a vi pratite izveštaje o kandidatima i odlučujete koji automobil želite da pogledate uživo.
