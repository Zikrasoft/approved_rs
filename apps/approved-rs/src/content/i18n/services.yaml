    vehicle-inspection:
      title: Car Inspection
      description: An independent vehicle inspection before purchase. Expert visit, diagnostics, report — no obligation to buy.
      ctaLabel: Order Inspection
      casesHeading: Inspection Cases
      breadcrumbLabel: Car Inspection
      steps:
        - n: '01'
          text: Body and paintwork — signs of repair or prior accidents
        - n: '02'
          text: Suspension, brakes, drivetrain
        - n: '03'
          text: Engine, transmission
        - n: '04'
          text: Electronics and service history by VIN
        - n: '05'
          text: Legal issues — liens, registration bans, accidents
      extraLine: We also operate in other European countries, including Portugal — please inquire when applying.
      hub:
        metaTitle: Car Inspection Before Purchase in Europe
        metaDescription: 'We travel to the car you found: thickness gauge, scanner, VIN history check and a report with photos the same day. We work in eight European countries.'
        title: Car Inspection
        titleHighlight: Before Purchase
        description: "We travel to the car you found and tell you the real story about it. The report arrives before you pay: if the answer is 'don't buy', you only lose the inspection fee."
        breadcrumbLabel: Car Inspection
        casesHeading: Inspection Cases
        chooseCountryLabel: 'Select Country:'
        ctaLabel: Order Inspection
        heroPhotoAlt: Car on a lift in a service
        processHeading: How the Inspection Works
        processLead: We typically visit within one to two days after your request. The inspection itself takes an hour and a half to two hours, and we send the report the same day, while the car is still available.
        processSteps:
          - n: '01'
            text: Send us the link to the ad and the seller's contact info
          - n: '02'
            text: Agree with the seller on the time and place for the inspection
          - n: '03'
            text: We arrive with a thickness gauge and scanner; for BMW, we connect to the dealer ISTA, and on a lift if necessary
          - n: '04'
            text: Take photos and videos of all findings, check history by VIN
          - n: '05'
            text: Send the report and a direct recommendation — buy, negotiate, or decline
        includedHeading: What's Included in the Inspection
        includedLead: 'A checklist with over a hundred items, but four areas usually decide the outcome: body, engine with transmission, suspension, and documents. We most often advise against purchases based on these.'
        included:
          - title: Body and Paintwork
            text: Thickness measurement on each panel, geometry of openings, signs of welding and filler. It reveals prior repairs that the seller may not have mentioned.
          - title: Engine and Transmission
            text: Parameters on a warmed-up engine, transmission adaptations, error codes in memory. This is the most expensive area and the most common reason for advising against purchase.
          - title: Suspension and Brakes
            text: Play, condition of suspension and braking system. Highway mileage and Balkan roads wear out vehicles differently, and this is visible.
          - title: Electronics and VIN History
            text: CarVertical report, dealer service history by make, mileage discrepancies with records, error codes and signs of deployed airbags.
          - title: Legal Cleanliness
            text: Liens, registration bans, unresolved accidents and insurance events — issues that may surface after purchase.
          - title: Report with Photos and Videos
            text: Every finding is captured and documented. The report stays with you — it's useful for negotiations, even if you decide to buy the car.
        compareHeading: How Inspections Vary by Country
        compareLead: Technical inspection regulations, common issues with local cars, and ways to hide history vary everywhere.
        compareHint: Select a country — we will show you what we add to the regular checklist.
        compareLinkFor: Inspection in {location} — in detail
        mapHeading: Four Areas That Decide the Deal
        mapLead: The checklist is long, but we mostly advise against purchase based on one of four areas. Click the number on the diagram — we'll show you what the expert looks for and what we've found.
      countryNotesHeadingFor: How We Inspect {location}
      countryNotesPointsLabel: What We Check Beyond the Regular Checklist
      countryNotes:
        de:
          lead: 'In Germany, there are solid resources: service book, HU protocols, and comprehensive VIN databases. So the inspection here is primarily about verifying documents against what the car shows.'
          points:
            - We check dealer service records against odometer readings over the years
            - Notes from previous HU inspections — what was repaired after inspection, and what was just patched up
            - Undercarriage and sills after winter salting, including hidden cavities
            - 'Leasing history: consistent service records even with high mileage'
        rs:
          lead: In Serbia, we travel on the day of request. The main task is to recover the car's history up to its import — local documents only show the last segment of the vehicle's life.
          points:
            - Country of origin and condition of the car before import to Serbia
            - Odometer readings versus technician inspection records from previous years
            - Bodywork repairs after import — these are done more frequently and cheaply than in the EU
            - 'Legal aspects: liens and registration restrictions'
        es:
          lead: Spanish cars usually impress with their undercarriage and disappoint when it comes to everything that suffers from sun and salt. We shift the inspection focus from corrosion underneath to hidden cavities, electronics, and interior condition.
          points:
            - Corrosion in hidden cavities near the coast — underneath it may look clean
            - Paint, seals, and plastics after many years of sun exposure
            - 'Rental history: we verify mileage against wear characteristics of the interior'
            - ITV protocol and unresolved issues between inspections
        ch:
          lead: MFK inspections are taken seriously in Switzerland, so a fresh protocol doesn't tell much on its own. We look at what was done right before the inspection versus what has existed since last year.
          points:
            - What was replaced just before MFK — fresh parts against the rest
            - Service is expensive, so we check whether maintenance was postponed
            - The full configuration is rich, but we check that each option still works
            - 'Import documents: Switzerland is not in the EU, the set is different'
        pt:
          lead: 'Everything here comes down to the humid coastal climate. We start the inspection with corrosion and electronics: usually, what suffers is what resides in dampness.'
          points:
            - Hidden cavities, longitudinal beams, and suspension attachment points
            - Oxidation of connectors and controls — a typical cause of intermittent errors
            - IPO protocol and the regularity of inspections
            - 'Diesels with city usage: soot filter and its history'
        fr:
          lead: 'In France, the detailed contrôle technique is a good starting point. From there, we check what the regulations might miss: the lifespan of the diesel components and wear from urban traffic.'
          points:
            - Notes from contrôle technique over the years — what repeats from inspection to inspection
            - Soot filter, EGR, and turbo on diesels
            - Clutch and suspension after a dense urban cycle
            - 'History with French brands: affordable spare parts, but their weak spots'
        it:
          lead: Italian cars often arrive with minor body repairs that are done quickly and cheaply. It takes significantly longer to use the thickness gauge on the panels here than usual.
          points:
            - Thickness measurements on all panels — touch-ups from urban scrapes
            - 'Difference between the north and south: salt by the coast, typical wear inland'
            - Gas installation, if present — installation and condition of the tank
            - Regularity of revisione and missed periods
        pl:
          lead: Poland is the largest transfer market for damaged cars from Western Europe. Therefore, our first task is to find out what has happened to the body before sale.
          points:
            - Geometry of openings and signs of welding — restoration after a serious accident
            - 'Import history: where the car came from and in what condition'
            - Mileage verification against European service databases; we don’t trust the odometer
            - Airbags and their deployment history
      closing:
        eyebrow: Found a car?
        line1: Send us the link
        line2: to the ad —
        accentWord: we'll come and take a look
        text: We travel within one to two days. The report with photos stays with you, even if you decide to decline after.
    cityVehicleSourcing:
      title: Car Sourcing
      descriptionFor: We'll help you find a car in {cityLocation} with a complete inspection. We operate throughout the {countryName} region.
      casesHeadingFor: Case Studies from {countryGenitiveOrName}
      whyCityHeadingFor: Why {cityName}
      reason1: We check both dealer lots and private listings
      reason2: We verify the history by VIN before the inspection
      reason3For: Our expert in {cityLocation}
      reason4Dekra: DEKRA / TÜV inspection available upon request
      reason4Generic: Independent technical expertise available upon request
      otherCitiesLabelFor: 'Other cities in {countryLocation}:'
      cityNotesHeadingFor: Car Market in {cityLocation}
      cityNotesPointsLabel: What this means in practice
      cityNotes:
        berlin:
          lead: Berlin has the largest selection in Germany and a diverse array of sellers. You'll find everything from corporate fleet cars with full history to resold options from Eastern Europe.
          points:
            - Huge selection in every segment, including rare configurations
            - Many private sellers — more room for negotiation than with dealers
            - 'Urban wear: clutches and suspensions wear out faster than on highway cars'
        munich:
          lead: An expensive city with pricey cars. The premium segment here is greater than anywhere else in Germany, and the overall condition is usually better since these cars are well maintained.
          points:
            - Strong premium segment, especially BMW and Mercedes
            - Well-kept cars with complete dealer history
            - Prices are higher than the national average — savings come from condition
        hamburg:
          lead: A port city and a major logistics hub. It's convenient to ship cars from here, and the market often features fresh imports.
          points:
            - Port nearby — easier and cheaper to arrange shipping
            - Many cars from northern regions with highway mileage
            - 'Moist marine climate: we inspect the body and hidden cavities more closely'
        dusseldorf:
          lead: The center of North Rhine-Westphalia, Germany's most populous state. Lots are densely packed, and the border with the Netherlands and Belgium is just an hour away, so cars regularly come here for sale.
          points:
            - We can inspect several cars in one trip — lots are nearby
            - 'Some offers have Dutch and Belgian license plates: we check their history and documents separately'
            - Many sellers competing against each other — negotiation is more flexible
        belgrade:
          lead: Our base. In Belgrade, we can inspect cars the same day you contact us. We know the local sellers and can see which cars have been on lots for two months.
          points:
            - Inspection the same day, no waiting or logistics
            - We know local lots and the history of the cars on them
            - The car is already customs-cleared — no import duties required
        novi-sad:
          lead: The second-largest city in Serbia, just an hour's drive from Belgrade. The market is smaller, but prices are generally calmer than in the capital, and cars are less likely to have gone through multiple resales.
          points:
            - Prices are lower than in Belgrade for comparable condition
            - Fewer resellers, often the first owner is more common
            - We drive from Belgrade, no extra charge for transportation
        pancevo:
          lead: Pančevo is effectively part of the Belgrade metropolitan area, so inspections here are similar to the capital. The market is small but more interesting private listings can be found.
          points:
            - Twenty minutes from Belgrade — we can get there just as quickly
            - Small market dominated by private sellers
            - Often cheaper than in the capital for similar condition
        subotica:
          lead: 'Subotica lies on the border with Hungary, and this is reflected in the market: many cars imported from the EU and sellers who engage in this consistently.'
          points:
            - Border market — many fresh imports from the European Union
            - We check the history thoroughly before import
            - Convenient location if you plan to drive the car further north
        madrid:
          lead: 'Madrid is the capital market of Spain: the largest selection in the country with many cars from corporate fleets. The continental climate means less coastal corrosion compared to the coast.'
          points:
            - Largest selection in Spain, including corporate vehicles
            - Far from the sea — bodies are usually cleaner than coastal ones
            - 'Hot summers: we inspect plastics, paint, and air conditioning separately'
        barcelona:
          lead: Everything hinges on being close to the sea. Cars often look great from underneath, but require attention to hidden cavities and electronics.
          points:
            - "Sea nearby, so we check hidden cavities: they're often clean underneath but not inside"
            - Many former rental and rideshare cars
            - Port nearby, easier to arrange maritime shipping
        zurich:
          lead: Zurich has the most expensive car market in the region. Cars here are often fully loaded, serviced by dealers, and sold before they show their age.
          points:
            - Top configurations with low mileage
            - Dealer servicing — history is almost always complete
            - Switzerland is not in the EU, import has to be handled separately
        geneva:
          lead: Geneva is located in the French-speaking part of Switzerland, right at the border with France. French brands are significantly more prevalent than in the German part of the country.
          points:
            - 'Mixed market: Swiss condition, French assortment'
            - The French border is close — prices can be compared
            - 'Documentation is the same as throughout Switzerland: export plus import'
        paris:
          lead: "France's largest selection comes with the toughest usage: heavy traffic and tight parking leaves marks on the body and suspension."
          points:
            - The largest selection in France, especially for French brands
            - 'Urban wear: clutches, suspensions, and minor body damages'
            - Many diesels — check the particulate filter and EGR first
        lyon:
          lead: Lyon is calmer than Paris in terms of both prices and car condition. The highway south is nearby, so cars with steady highway mileage are more common.
          points:
            - Prices are lower than Paris for comparable selections
            - More highway mileage, less urban wear
            - Convenient route to Italy and Spain if we're looking wider
        milan:
          lead: "Italy's business capital, and this is evident in the market. The north of the country is closer to German standards: the roads are better, and the cars are better maintained than in the south."
          points:
            - Best selection of premium segment in Italy
            - North has less salt and corrosion than the southern part of the country
            - 'Dense city: a paint thickness gauge is essential for panel inspection'
        rome:
          lead: A large market with very dense urban usage. Minor scuffs are considered a normal part of life here, and they are often repaired hastily.
          points:
            - Many city cars and vehicles equipped for gas
            - Frequent touch-ups after urban contacts — we check every panel
            - South of Milan — climate is milder but closer to the sea
        warsaw:
          lead: Most imports from Western Europe enter the country through Warsaw, and it also has the largest selection in Poland. The proportion of restored cars is also the highest here.
          points:
            - Largest selection in Poland, plenty of fresh imports from the EU
            - We first check body geometry and signs of repairs
            - Short delivery distance — cheaper than from Southern Europe
        krakow:
          lead: 'Krakow is calmer than Warsaw: the market is smaller, there are fewer resales, and cars often have a single owner for longer. Southern Poland is closer to the Balkans logistically.'
          points:
            - Fewer resellers than in Warsaw, history is usually cleaner
            - Prices often lower than in the capital
            - Closer to the southern route — convenient for deliveries to Serbia
