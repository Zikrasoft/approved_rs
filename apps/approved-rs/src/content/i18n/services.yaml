    vehicle-inspection:
      title: Provera automobila
      description: Nezavisna provera automobila pre kupovine. Dolazak stručnjaka, dijagnostika, izveštaj — bez obaveze kupovine.
      ctaLabel: Zatraži proveru
      casesHeading: Slučajevi provere
      breadcrumbLabel: Provera automobila
      steps:
        - n: '01'
          text: Karoserija i lak — postojanje popravki ili udesa
        - n: '02'
          text: Hodna, ovjes, kočnice
        - n: '03'
          text: Motor, menjač, prenos
        - n: '04'
          text: Elektronika i istorija održavanja po VIN-u
        - n: '05'
          text: Pravna čistoća — hipoteka, zabrana registracije, udesi
      extraLine: Radimo i u drugim zemljama Evrope, uključujući Portugaliju — proverite prilikom prijave.
      hub:
        metaTitle: Provera automobila pre kupovine u Evropi
        metaDescription: 'Dolazimo do automobila koji ste sami pronašli: merni uređaj, skener, provera istorije po VIN-u i izveštaj sa fotografijama istog dana. Radimo u osam zemalja Evrope.'
        title: Provera automobila
        titleHighlight: pre kupovine
        description: "Dolazimo do automobila koji ste sami pronašli i govorimo vam šta se sa njim zapravo dešava. Izveštaj stiže pre nego što predate novac: ako je odgovor 'ne uzimajte', gubite samo troškove provere."
        breadcrumbLabel: Provera automobila
        casesHeading: Slučajevi provere
        chooseCountryLabel: 'Izaberite zemlju:'
        ctaLabel: Zatraži proveru
        heroPhotoAlt: Automobil na dizalici u servisnoj radionici
        processHeading: Kako prolazi provera
        processLead: Obično dolazimo u roku od jednog do dva dana nakon prijave. Samo razgledanje traje jedan i po do dva sata, izveštaj šaljemo istog dana, dok automobil još nije otišao drugom kupcu.
        processSteps:
          - n: '01'
            text: Šaljete link na oglas i kontakt informacije prodavca
          - n: '02'
            text: Dogovaramo se sa prodavcem o vremenu i mestu provere
          - n: '03'
            text: Dolazimo sa mernim uređajem i skenerom, za BMW povezujemo servisnu ISTA, ako je potrebno — na dizalicu
          - n: '04'
            text: Fotografiramo i snimamo sve nalaze, proveravamo istoriju po VIN-u
          - n: '05'
            text: Šaljemo izveštaj i direktan odgovor — uzeti, pregovarati ili odustati
        includedHeading: Šta je uključeno u proveru
        includedLead: 'Preko sto stavki na spisku, ali gotovo uvek odlučuje četiri zone: karoserija, motor sa menjačem, hodna i dokumentacija. Upravo iz tih razloga često odrađujemo odustajanje od kupovine.'
        included:
          - title: Karoserija i lak
            text: Merni uređaj za svaku panelu, geometrija otvora, tragovi zavarivanja i špaka. Može se videti da li je bilo popravki o kojima prodavac nije obavestio.
          - title: Motor i menjač
            text: Parametri na zagrejanom motoru, adaptacije menjača, greške u memoriji blokova. Najskuplja zona i najčešći razlog odbijanja.
          - title: Hodna i kočnice
            text: Lufte, stanje ovjesa i kočionog sistema. Autobusni pređeni put i balkanske ceste različito troše automobil, i to se može primetiti.
          - title: Elektronika i istorija po VIN-u
            text: Izveštaj CarVertical, servisna istorija kod dilera po marki, neslaganje pređenog puta sa istorijom, greške blokova i tragovi aktiviranih vazdušnih jastučića.
          - title: Pravna čistoća
            text: Hipoteka, zabrana registracije, neprekidni udesi i osiguravajući događaji — ono što se pojavljuje tek nakon kupovine.
          - title: Izveštaj sa fotografijama i video zapisima
            text: Svaki nalaz je snimljen i potpisan. Izveštaj ostaje kod vas — sa njim je lako pregovarati, čak i ako se odlučite da ipak uzmete automobil.
        compareHeading: Šta se menja od zemlje do zemlje
        compareLead: Regulativa tehničkog pregleda, tipični problemi lokalnih automobila i načini skrivenja istorije su svuda različiti.
        compareHint: Izaberite zemlju — prikazaćemo šta dodajemo običnom kontrolnom spisku.
        compareLinkFor: Provera {location} — detaljno
        mapHeading: Četiri zone koje odlučuju o transakciji
        mapLead: Spisak je dug, ali gotovo uvek odrađujemo odustajanje iz jedne od četiri zone. Pritisnite broj na šemi — prikazaćemo šta stručnjak gleda i šta smo tamo pronašli.
      countryNotesHeadingFor: Kako proveravamo {location}
      countryNotesPointsLabel: Šta proveravamo preko uobičajenog kontrolnog spiska
      countryNotes:
        de:
          lead: 'U Nemačkoj ima mnogo oslonca: servisna knjižica, protokoli HU i razvijene baze podataka po VIN-u. Zato je provera ovde — prvenstveno usklađivanje dokumenata sa onim što automobil pokazuje.'
          points:
            - Proveravamo označene servisne preglede sa očitavanjima odometra po godinama
            - Zapažanja prethodnog HU — šta je popravljeno posle pregleda, a šta je samo odloženo
            - Dno i pragovi nakon zimske hemije, uključujući skrivene prostore
            - 'Lizing prošlost: uredno održavanje prilikom velikog pređenog puta'
        rs:
          lead: 'U Srbiji dolazimo na dan prijave. Glavni cilj — otkriti istoriju automobila pre uvoza: lokalni dokumenti pokazuju samo poslednji deo života automobila.'
          points:
            - Zemlja porekla i stanje automobila pre uvoza u Srbiju
            - Očitavanja odometra protiv zabeleženih tehničkih pregleda iz prethodnih godina
            - Popravke karoserije nakon uvoza — čine se češće i jeftinije nego u EU
            - 'Pravna pitanja: hipoteka i ograničenja na registraciju'
        es:
          lead: Španski automobili obično oduševljavaju dnom i razočaravaju svime što pati od sunca i soli. Proveru pomeramo sa korozije sa dna na skrivene prostore, elektriku i stanje enterijera.
          points:
            - Korozija u skrivenim prostorima na obali — s dna može biti čisto
            - Lak, brtve i plastika nakon višegodišnjeg izlaganja suncu
            - 'Istorija rentanja: proveravamo pređeni put u odnosu na karakter trošenja enterijera'
            - Protokol ITV i šta je ostalo otvoreno između pregleda
        ch:
          lead: Kod MFK automobili se pripremaju ozbiljno, tako da svež protokol sam po sebi slabo govori. Gledamo šta je urađeno neposredno pre pregleda, a šta živi sopstvenim životom od prošle godine.
          points:
            - Šta je zamenjeno neposredno pre MFK — sveži detalji na pozadini ostalog
            - Održavanje je skupo, tako da proveravamo nisu li odlagali regulativu
            - Opremanje je bogato, ali proveravamo da svaka opcija još uvek radi
            - 'Dokumentacija za uvoz: Švajcarska nije EU, paket se razlikuje'
        pt:
          lead: 'Sve ovde zavisi od vlažne morske klime. Proveru započinjemo sa korozijom i elektrikom: obično vas izdaje ono što živi u vlažnosti.'
          points:
            - Skriveni prostori, donji nosači i tačke pričvršćenja ovjesa
            - Oksidacija konektora i blokova — tipičan uzrok nestabilnih grešaka
            - Protokol IPO i redovni pregledi
            - 'Dizeli sa gradskom eksploatacijom: filter čađi i njegova istorija'
        fr:
          lead: 'U Francuskoj je detaljan contrôle technique, i to je dobra polazna tačka. Dalje gledamo šta regulativa ne hvata: životni vek dizel grupe i habanje usled gradskog saobraćaja.'
          points:
            - Zapažanja contrôle technique po godinama — šta se ponavlja od pregleda do pregleda
            - Filter čađi, EGR i turbina na dizelima
            - Kvačilo i ovjes nakon gustog gradskog ciklusa
            - 'Istorija po francuskim markama: dostupni rezervni delovi, ali svoja slaba mesta'
        it:
          lead: Italijanski automobili češće dolaze sa malim karoserijskim popravkama, urađenim brzo i jeftino. Na merni uređaj po panelima ovde odlazi značajno više vremena nego obično.
          points:
            - Merni uređaj za sve paneli — doticanja nakon gradskih zamena
            - 'Razlika između severa i juga: so u obali, uobičajeno habanje u unutrašnjosti zemlje'
            - Plinska oprema, ako postoji — instalacija i stanje boce
            - Redovnost revisione i propušteni periodi
        pl:
          lead: Poljska je najveće tržište za oštećene automobile iz Zapadne Evrope. Zato prvo saznajemo šta je sa tom karoserijom rađeno pre prodaje.
          points:
            - Geometrija otvora i tragovi zavarivanja — obnova nakon ozbiljnog udesa
            - 'Istorija uvoza: odakle je automobil došao i u kom stanju'
            - Pređeni put proveravamo sa evropskim servisnim bazama, odometru ne verujemo
            - Vazdušni jastučići i njihovo aktiviranje u prošlosti
      closing:
        eyebrow: Pronašli ste automobil?
        line1: Pošaljite link
        line2: na oglas —
        accentWord: doći ćemo i proveriti
        text: Dolazimo u jedan do dva dana. Izveštaj sa fotografijama ostaje kod vas, čak i ako nakon njega odustanete od kupovine.
    cityVehicleSourcing:
      title: Automobilski izbor
      descriptionFor: Pronaći ćemo automobil u {cityLocation} uz potpunu proveru. Radimo širom regiona {countryName}.
      casesHeadingFor: Primjeri iz {countryGenitiveOrName}
      whyCityHeadingFor: Zašto {cityName}
      reason1: Gledamo i na dilerške plaće, i na privatne oglase
      reason2: Proveravamo istoriju po VIN broju pre izlaska na pregled
      reason3For: Naš ekspert u {cityLocation}
      reason4Dekra: DEKRA / TÜV provera na zahtev
      reason4Generic: Nezavisna tehnička ekspertiza na zahtev
      otherCitiesLabelFor: 'Ostali gradovi u {countryLocation}:'
      cityNotesHeadingFor: Automobilsko tržište {cityLocation}
      cityNotesPointsLabel: Šta to u praksi donosi
      cityNotes:
        berlin:
          lead: 'Berlin nudi najveći izbor u Nemačkoj i najraznovrsniji sastav prodavaca. Ovde se može naći sve: od automobila iz korporativnih parkova sa potpunom istorijom, do preprodaja koje su došle iz Istočne Evrope.'
          points:
            - Ogroman izbor u bilo kojem segmentu, uključujući retke verzije
            - Mnogi privatni prodavci — pregovaranje je realnije nego kod dilera
            - 'Gradski uslovi: kvačilo i vešanje brže se troše nego kod vozila s autoputeva'
        munich:
          lead: 'Skup grad sa skupim automobilima. Premijum segmenta ovde ima više nego bilo gde drugde u Nemačkoj, a stanje vozila je obično bolje: o njima se vodi računa.'
          points:
            - Snažan premijum segment, posebno BMW i Mercedes
            - Očuvani automobili s potpunom istorijom kod dilera
            - Cene više od proseka zemlje — ušteda dolazi usled stanja
        hamburg:
          lead: Lučki grad i veliki logistički čvor. Odatle je lako poslati vozilo dalje, a na tržištu se često mogu naći svežiji uvozni automobili.
          points:
            - Luka u blizini — lakše i jeftinije organizovati isporuku
            - Mnogo vozila iz severnih područja sa putničkim kilometražama
            - 'Vlažna pomorska klima: pažljivije proveravamo karoseriju i skrivene šupljine'
        dusseldorf:
          lead: Centar Severnog Rein-Vestfalije, najgušće naseljenog dela Nemačke. Plaće su blizu, a granica sa Holandijom i Belgijom je na sat vožnje, tako da ovde redovno dolaze automobili na prodaju.
          points:
            - Za jedan izlet uspemo da pogledamo nekoliko automobila — plaće su blizu
            - 'Deo ponuda dolazi sa holandskim i belgijskim registracijama: proveravamo istoriju i dokumente posebno'
            - Mnogi prodavci su prisutni i takmiče se međusobno — pregovaranje ide lakše
        belgrade:
          lead: Naša baza. U Beogradu izlazimo na pregled istog dana kada dobijemo zahtev, poznajemo lokalne prodavce i vidimo koje automobile već drugi mesec preprodaju.
          points:
            - Pregled istog dana, bez čekanja i logistike
            - Znamo lokalne plaće i istoriju automobila koji su na njima
            - Automobil je već carinjen — uvoz i takse nisu potrebni
        novi-sad:
          lead: Drugi po veličini grad u Srbiji i sat vožnje od Beograda. Tržište je manje, ali su cene obično mirnije nego u prestonici, a automobili ređe prolaze kroz više preprodaja.
          points:
            - Cene su niže od beogradskih uz uporedivo stanje
            - Manje preprodavaca, češće se sreće prvi vlasnik
            - Izlazimo iz Beograda, nema dodatne naknade za put
        pancevo:
          lead: Pančevo praktično čini deo beogradske aglomeracije, tako da je pregled ovde sličan kao u prestonici. Tržište je malo, ali su privatni oglasi interesantniji.
          points:
            - Dvadeset minuta od Beograda — izlazimo isto brzo
            - Malo tržište sa prevladavajućim privatnim prodavcima
            - Često je jeftinije od prestonice uz isto stanje
        subotica:
          lead: 'Subotica se nalazi na granici sa Mađarskom, i to se vidi po tržištu: mnogo automobila uvezenih iz EU i prodavaca koji se time redovno bave.'
          points:
            - Granično tržište — mnogo svežeg uvoza iz Evropske unije
            - Proveravamo istoriju pre uvoza posebno pažljivo
            - Povoljna lokacija ako planirate da vozilo transportujete dalje na sever
        madrid:
          lead: 'Glavno tržište Španije: najveći izbor u zemlji i mnogo automobila iz korporativnih parkova. Kontinentalna klima, tako da je morska korozija ovde manja nego na obali.'
          points:
            - Najveći izbor u Španiji, uključujući korporativne automobile
            - Daleko od mora — karoserije su obično čistije nego na obali
            - 'Vreli letnji meseci: proveravamo plastiku, lak i klima uređaj posebno'
        barcelona:
          lead: Sve zavisi od blizine mora. Automobili često izgledaju odlično sa donje strane, ali zahtevaju pažnju prema skrivenim šupljinama i elektroinstalacijama.
          points:
            - 'More je blizu, pa proveravamo skrivene šupljine: sa donje strane je često čisto, a unutar nije'
            - Mnogo bivših iznajmljivačkih i karšerining automobila
            - Luka u blizini, morska isporuka lakša za organizaciju
        zurich:
          lead: Cirih je najskuplje automobilsko tržište regiona. Oprema ovde je maksimalna, servis se obavlja kod dilera, a prodaja se obavlja pre nego što automobil postane trošen.
          points:
            - Maksimalna oprema i mala kilometraža
            - Dilerska usluga — istorija skoro uvek puna
            - Švajcarska nije deo EU, uvoz se obavlja posebno
        geneva:
          lead: Ženeva se nalazi u frankofonoj ovoj delom Švajcarske, na samoj granici s Francuskom. Francuskih marki na tržištu je znatno više nego u nemačkom delu zemlje.
          points:
            - 'Mešovito tržište: švajcarsko stanje, francuska ponuda'
            - Granica s Francuskom u blizini — ima sa čim uporediti po ceni
            - 'Procedura je ista kao i širom Švajcarske: izvoz plus uvoz'
        paris:
          lead: 'Najveći izbor u Francuskoj dolazi s najtežim eksploatacionim uslovima: gust saobraćaj i uske parking prostore ostavljaju trag na karoseriji i vešanju.'
          points:
            - Najveći izbor u Francuskoj, posebno francuskih marki
            - 'Gradski uslovi: kvačilo, vešanje i sitni oštećenja karoserije'
            - Mnogo dizel vozila — proveravamo čestni filter i EGR pre svega
        lyon:
          lead: Lyon je mirniji od Pariza i po cenama, i po stanju automobila. Auto-put prema jugu je blizu, pa se češće sreću vozila s ravnom upotrebnom kilometražom.
          points:
            - Cene su niže od pariških uz uporediv izbor
            - Više putničkih kilometraža, manje gradskog trošenja
            - Povoljna ruta do Italije i Španije, ako tražimo dalje
        milan:
          lead: 'Poslovna prestonica Italije, i to se na tržištu vidi. Sever zemlje je bliži nemačkim uslovima: putevi su bolji, automobili bolje održavani nego na jugu.'
          points:
            - Najbolji izbor premijum segmenta u Italiji
            - Sever — manje soli i korozije nego na jugu zemlje
            - 'Gust grad: merač debljine na panelima je obavezan'
        rome:
          lead: Veliko tržište sa vrlo gustim gradskim eksploatacijama. Sitni udarci ovde se smatraju normalnim životom, i često ih brzo popravljaju.
          points:
            - Mnogo malih automobila i vozila s plinskom opremom
            - Česta prefarbavanja posle gradskih kontakata — proveravamo svaku površinu
            - Južnije od Milana — klima je blaža, ali bliža moru
        warsaw:
          lead: Kroz Varšavu u zemlju dolazi glavni uvoz iz Zapadne Evrope, a ovde je i najveći izbor u Poljskoj. Udeo restauriranih automobila je takođe najviši.
          points:
            - Najveći izbor u Poljskoj, mnogo svežeg uvoza iz EU
            - Proveravamo geometriju karoserije i tragove popravki u prvim prioritetima
            - Kratka ruta isporuke — jeftinije nego iz Južne Evrope
        krakow:
          lead: 'Krakow je mirniji od Varšave: tržište je manje, manje preprodaja, a automobili češće imaju istog vlasnika duže. Jug Poljske je bliži Balkanu po logistikama.'
          points:
            - Manje preprodavaca nego u Varšavi, istorija obično čista
            - Cene su često niže od beogradskih
            - Bliže ruti ka jugu — lako za isporuku u Srbiju
