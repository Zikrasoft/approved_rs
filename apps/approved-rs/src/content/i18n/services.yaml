        includedHeading: Was die Kosten ausmacht
        includedLead: 'Bei Selbstanlieferung liegt das Budget oft über dem Preis des Fahrzeugs. Wir berechnen es im Voraus und fixieren: Das Endergebnis sollte mit der ersten Berechnung übereinstimmen.'
        included:
          - title: Preis des Fahrzeugs
            text: Preis nach Verhandlung, nicht aus dem Inserat. Wir handeln mit dem, was wir beim Besichtigungstermin in der Hand haben, das deckt in der Regel einen Teil der Kosten.
          - title: Logistik zum Zielort
            text: Autotransporter oder Überführung mit Transitnummern. Wir vergleichen beide Optionen und wählen die günstigere für die spezifische Strecke.
          - title: Zölle und Steuern
            text: Der Satz hängt vom Herkunftsland des Fahrzeugs und dessen Alter ab. Für europäische Fahrzeuge ändert das EUR1-Zertifikat die Berechnung erheblich, daher prüfen wir dessen Vorhandensein vor dem Kauf.
          - title: Export und Transit
            text: Abmeldung im Verkaufsland, Exportdeklaration, Transitnummern und Versicherung für die Überführung.
          - title: Zollabwicklung
            text: Deklaration, Broker und Zahlung am Ankunftsort. Wir bereiten das Paket im Voraus vor, damit das Auto nicht unnötig lange im Lager steht.
          - title: Anmeldung
            text: Technische Überprüfung, Registrierung und Nummernschilder. Sie holen das Auto ab, mit dem Sie sofort fahren können.
