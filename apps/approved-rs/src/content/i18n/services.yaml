  de:
    vehicle-sourcing:
      hub:
        metaTitle: Fahrzeugbeschaffung in Europa schlüsselfertig
        metaDescription: 'Wir beschaffen Autos in Deutschland, Serbien, Spanien, der Schweiz, Italien, Frankreich, Polen und Portugal: Suche, Besichtigung, Verhandlung und Lieferung schlüsselfertig.'
        title: Fahrzeugbeschaffung
        titleHighlight: schlüsselfertig
        description: Wir finden Ihr Auto in dem Land, in dem Sie sich befinden oder kaufen möchten – vollständige Inspektion, Begleitung des Verkaufs und Lieferung schlüsselfertig. Wählen Sie ein Land, um die Details zu sehen.
        breadcrumbLabel: Fahrzeugbeschaffung
        casesHeading: Fälle der Fahrzeugbeschaffung
        chooseCountryLabel: 'Wählen Sie ein Land:'
        ctaLabel: Auto beschaffen
        heroPhotoAlt: Reihe von Fahrzeugen auf dem Händlergelände
        processHeading: So funktioniert die Beschaffung
        processLead: 'Von der Anfrage bis zu den Schlüsseln dauert es in der Regel zwischen drei Tagen und zwei Wochen. Am längsten suchen wir nach dem richtigen Auto: das erste geeignete nehmen wir nicht und schauen weiter, bis wir das finden, bei dem nach der Überprüfung keine Fragen offen sind.'
        processSteps:
          - n: '01'
            text: Wir besprechen das Budget, die Marke und die Anforderungen – was wichtig ist und wofür Sie bereit sind, Abstriche zu machen.
          - n: '02'
            text: Wir selektieren Optionen vor Ort und filtern telefonisch alles aus, was keinen Fragen standhält.
          - n: '03'
            text: Wir fahren zur Besichtigung mit einem Lackmessgerät und Scanner, verbinden uns bei BMW mit dem Händler-ISTA, machen Fotos und Videos.
          - n: '04'
            text: Wir senden den Bericht und sagen deutlich, ob es sich lohnt, das Auto zu kaufen oder ob wir weiter suchen sollten.
          - n: '05'
            text: Wir verhandeln, formalieren den Verkauf und übergeben das Auto an Sie oder bringen es zu Ihrer Tür.
        includedHeading: Was in unseren Service enthalten ist
        includedLead: Die Provision wird vor Beginn festgelegt und hängt nicht davon ab, wie viele Autos wir besichtigt haben. Wenn wir nach der Überprüfung sagen 'Nicht kaufen' – suchen wir weiter, dafür fallen keine zusätzlichen Kosten an.
        included:
          - title: Suche ohne Einschränkung der Optionen
            text: Wir arbeiten, bis wir ein Auto gefunden haben, das keine Beanstandungen aufweist. Das Absehen von einer unglücklichen Option gehört zu unserem Service und kostet nichts extra.
          - title: Experte bei jeder Besichtigung vor Ort
            text: Lackmessgerät für die Karosserieteile, Scanner für die Module, Hebebühne, wo nötig. Fotos und Videos von allen problematischen Stellen – Sie sehen das gleiche wie wir.
          - title: Überprüfung von Historie und rechtlicher Sauberkeit
            text: CarVertical-Bericht nach VIN, dienstliche Historie des Händlers nach Marke, Kilometerstand überprüfen, Sicherheiten, Registrierungsbeschränkungen und offene Versicherungsfälle.
          - title: Verhandlung und Abschluss des Verkaufs
            text: Wir handeln den Preis unter Berücksichtigung unserer Funde aus, bereiten die Dokumente vor und begleiten die Unterzeichnung.
          - title: Lieferung und Zulassung
            text: Wir bringen das Auto in Ihre Stadt und helfen Ihnen vor Ort bei der Zulassung – wir übergeben Ihnen die Schlüssel dort, wo es Ihnen am besten passt.
          - title: Eine Person für den gesamten Prozess
            text: Sie arbeiten mit demselben Spezialisten, der zur Besichtigung gefahren ist. So müssen Sie die Aufgabe nicht jedem einzelnen erklären, der ans Telefon geht.
