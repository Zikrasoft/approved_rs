          - title: Pretraga bez ograničenja broja opcija
            text: Radimo dok ne pronađemo automobil bez mana. Odustajanje od nepovoljnih opcija uključeno je u uslugu i ne naplaćuje se dodatno.
          - title: Izlazak stručnjaka na svaki pregled
            text: Merom debljine na panelima, skener po blokovima, dizalica gde je potrebna. Fotografije i video sa svih problematičnih mesta — vidite ono što i mi.
          - title: Proveravanje istorije i pravne čistoće
            text: Izveštaj CarVertical po VIN-u, servisna istorija kod dilera, proveravanje kilometraže, hipoteka, ograničenja na registraciju i neodgovorene osiguravajuće događaje.
          - title: Pregovaranje i završavanje transakcije
            text: Dogovaramo cenu uzimajući u obzir nađeno, pripremamo dokumente i pratimo potpisivanje.
          - title: Dostava i registracija
            text: Dostavljamo automobil do vašeg grada i pomažemo sa registracijom na licu mesta — ili predajemo ključeve gde god vam odgovara.
          - title: Jedna osoba za ceo proces
            text: Sa vama radi isti stručnjak koji je išao na pregled. Nema potrebe da objašnjavate zadatak iznova svakome ko se javi.
