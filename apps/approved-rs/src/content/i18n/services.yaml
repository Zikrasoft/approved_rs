        processHeading: So läuft der Autoimport ab
        processLead: Von der Anfrage bis zum Kennzeichen vergehen meist vier bis acht Wochen. Der Transport macht dabei den kleinsten Teil aus. Von Deutschland nach Belgrad braucht das Auto nur wenige Tage, Zollabwicklung und Zulassung dagegen ziehen sich über Wochen.
        processSteps:
          - n: '01'
            text: 'Wir berechnen vorab die Gesamtkosten: Fahrzeug, Transport, Einfuhrabgaben und Formalitäten'
          - n: '02'
            text: Wir suchen und prüfen das Fahrzeug im Herkunftsland
          - n: '03'
            text: Wir kaufen das Auto über unser europäisches Unternehmen, melden es ab und bereiten die Exportpapiere vor
          - n: '04'
            text: Wir liefern per Autotransporter oder überführen das Auto auf eigener Achse mit Überführungskennzeichen
          - n: '05'
            text: Wir erledigen die Zollabwicklung und Zulassung und übergeben Ihnen die Schlüssel
        includedHeading: So setzt sich der Preis zusammen
        includedLead: 'Wer ein Auto selbst importiert, unterschätzt oft die Kosten zusätzlich zum Kaufpreis. Wir berechnen diese vorab und halten sie verbindlich fest: Der Endbetrag soll der ursprünglichen Kalkulation entsprechen.'
        included:
          - title: Kaufpreis des Fahrzeugs
            text: Entscheidend ist der ausgehandelte Preis, nicht der Inseratspreis. Mit den Prüfergebnissen in der Hand verhandeln wir gezielt. Das gleicht oft schon einen Teil der Kosten aus.
          - title: Transport zum Zielort
            text: 'Autotransporter oder Überführung auf eigener Achse mit Überführungskennzeichen: Wir kalkulieren beide Varianten und wählen die günstigere für die jeweilige Strecke.'
          - title: Zölle und Steuern
            text: Die Höhe hängt vom Ursprungsland und Alter des Fahrzeugs ab. Bei Autos aus europäischer Produktion kann die Warenverkehrsbescheinigung EUR.1 die Abgaben erheblich verändern. Deshalb prüfen wir vor dem Kauf, ob sie vorliegt.
          - title: Export und Überführung
            text: Abmeldung im Land des Verkäufers, Ausfuhranmeldung, Überführungskennzeichen und Versicherung für die Überführung.
          - title: Zollabwicklung
            text: Zollanmeldung, Zollagent und Zahlung der Abgaben am Ankunftsort. Wir bereiten die Unterlagen vorab vor, damit das Auto nicht unnötig lange im Zolllager steht.
          - title: Zulassung
            text: Technische Untersuchung, Zulassung und Kennzeichen. Sie übernehmen ein Auto, mit dem Sie sofort losfahren können.
