    vehicle-inspection:
      title: Provera automobila
      description: Nezavisna provera automobila pre kupovine. Dolazak stručnjaka, dijagnostika, izveštaj — bez obaveze kupovine.
      ctaLabel: Zakažite proveru
      casesHeading: Primeri provere
      breadcrumbLabel: Provera automobila
      steps:
        - n: '01'
          text: Karoserija i lak — prisustvo popravki ili udesa
        - n: '02'
          text: Deo vozila, ovjes, kočnice
        - n: '03'
          text: Motor, menjač, prenos
        - n: '04'
          text: Elektronika i istorija servisa prema VIN-u
        - n: '05'
          text: Pravna čistoća — hipoteka, zabrana registracije, udesi
      extraLine: Poslujemo i u drugim zemljama Evrope, uključujući Portugal, — proverite prilikom prijave.
      hub:
        metaTitle: Provera automobila pre kupovine u Evropi
        metaDescription: 'Dolazimo do automobila koji ste sami pronašli: mjerač debljine boje, skener, provera istorije prema VIN-u i izveštaj sa fotografijama istog dana. Radimo u osam zemalja Evrope.'
        title: Provera automobila
        titleHighlight: pre kupovine
        description: "Dolazimo do automobila koji ste sami pronašli, i pričamo vam šta se sa njim zapravo dešava. Izveštaj dolazi pre nego što predate novac: ako je odgovor 'ne uzimajte', gubite samo cenu provere."
        breadcrumbLabel: Provera automobila
        casesHeading: Primeri provere
        chooseCountryLabel: 'Izaberite zemlju:'
        ctaLabel: Zakažite proveru
        heroPhotoAlt: Automobil na dizalici u servisu
        processHeading: Kako izgleda provera
        processLead: Obično dolazimo u roku od jednog do dva dana nakon prijave. Samo pregled traje sat i po do dva, a izveštaj šaljemo istog dana, dok automobil još nije otišao drugom kupcu.
        processSteps:
          - n: '01'
            text: Šaljete link na oglas i kontakte prodavca
          - n: '02'
            text: Dogovaramo se sa prodavcem o vremenu i mestu pregleda
          - n: '03'
            text: Dolazimo sa mernim uređajem i skenerom, za BMW povezujemo dijagnostički alat ISTA, ako je potrebno — na dizalicu
          - n: '04'
            text: Snimamo fotografije i video svih otkrića, proveravamo istoriju prema VIN-u
          - n: '05'
            text: Šaljemo izveštaj i direktan odgovor — uzeti, pregovarati ili odustati
        includedHeading: Šta ulazi u proveru
        includedLead: 'Preko sto tačaka na kontrolnoj listi, ali gotovo uvek odlučuju četiri oblasti: karoserija, motor sa menjačem, deo vozila i dokumenti. Prvenstveno po njima često odvratimo od kupovine.'
        included:
          - title: Karoserija i lak
            text: Merač debljine boje na svakoj paneli, geometrija otvora, tragovi varova i kitovanja. Vidljivo je da li je bilo popravki o kojima prodavac nije spomenuo.
          - title: Motor i menjač
            text: Parametri na zagrejanom motoru, adaptacije menjača, greške u memoriji kontrolnih blokova. Najskuplja oblast i najčešći razlog odbijanja.
          - title: Deo vozila i kočnice
            text: Igra slobode, stanje ovjesa i kočionog sistema. Vreme vožnje na autoputu i balkanske ceste troše automobil na različite načine, i to se vidi.
          - title: Elektronika i istorija prema VIN-u
            text: Izveštaj CarVertical, istorija servisa od strane dilera prema marki, razlika u kilomterima u odnosu na istoriju, greške u blokovima i tragovi aktiviranih vazdušnih jastučića.
          - title: Pravna čistoća
            text: Hipoteka, zabrana registracije, neproknjiženi udesi i osiguravajući događaji — činjenice koje se otkriju nakon kupovine.
          - title: Izveštaj sa fotografijama i video
            text: Svako otkriće je snimljeno i potpisano. Izveštaj ostaje kod vas — s njim je lako pregovarati, čak i ako ipak odlučite da uzmete automobil.
        compareHeading: Šta se menja od zemlje do zemlje
        compareLead: Regulativa tehničkog pregleda, tipične greške lokalnih automobila i načini prikrivanja istorije u svakoj zemlji.
        compareHint: Izaberite zemlju — pokazujemo šta dodajemo na uobičajenu kontrolnu listu.
        compareLinkFor: Provera {location} — detaljno
        mapHeading: Četiri oblasti koje odlučuju o transakciji
        mapLead: Kontrolna lista je dugačka, ali gotovo uvek odvratimo zbog jedne od četiri oblasti. Pritisnite broj na dijagramu — pokazujemo šta stručnjak gleda i šta smo tamo pronašli.
      countryNotesHeadingFor: Kako proveravamo {location}
      countryNotesPointsLabel: Šta proveravamo iznad obične kontrolne liste
      countryNotes:
        de:
          lead: 'U Nemačkoj postoji mnogo oslonaca: servisna knjižica, izveštaji HU i razvijene baze podataka prema VIN-u. Zbog toga je provera ovde — pre svega upoređivanje dokumenata sa onim što automobil prikazuje.'
          points:
            - Upoređujemo zabeleške iz servisa dilera sa očitavanjem odometra po godinama
            - Priznanice prošlog HU — šta su popravili nakon pregleda, a šta su samo odložili
            - Donji deo i pragovi nakon zimskih hemikalija, uključujući skrivene šupljine
            - 'Istorija lizinga: uredno održavanje uz veliki broj pređenih kilometara'
        rs:
          lead: 'U Srbiji dolazimo na dan prijave. Glavni zadatak je obnoviti istoriju automobila do uvoza: lokalni dokumenti prikazuju samo poslednji deo života automobila.'
          points:
            - Zemlja porekla i stanje vozila pre uvoza u Srbiju
            - Očitavanje odometra u poređenju sa beleškama tehničkog pregleda iz prethodnih godina
            - Karoserijske popravke nakon uvoza — češće i jeftinije nego u EU
            - 'Pravna strana: hipoteka i ograničenja na registraciju'
        es:
          lead: Španski automobili obično su zadovoljni donjim dijelom i razočaravaju svime što pati od sunca i soli. Fokusiramo proveru umesto na koroziju na dnu na skrivene šupljine, elektroniku i stanje enterijera.
          points:
            - Korozija u skrivenim šupljinama pored obale — dno može biti čisto
            - Lak, brtve i plastika nakon višegodišnjeg sunčanja
            - 'Istorija iznajmljivanja: upoređujemo pređene kilometre sa stanjem habanja enterijera'
            - Protokol ITV i neprikazani problemi između pregleda
        ch:
          lead: Za MFK vozila se ozbiljno pripremaju, pa sveže potvrde same po sebi malo znače. Gledamo šta je tačno urađeno pre pregleda, a šta je živelo svoj život od prošle godine.
          points:
            - Šta je zamenjeno neposredno pre MFK — sveže delove u poređenju sa ostalim
            - Održavanje je skupo, pa proveravamo da nije odloženo
            - Opremanje je bogato, ali proveravamo da svaka opcija još radi
            - 'Dokumenti za uvoz: Švajcarska nije EU, set se razlikuje'
        pt:
          lead: 'Sve ovde zavisi od vlažnog morskog klimatskog uticaja. Proveru počinjemo sa korozijom i električnim sistemom: obično kvari ono što živi u vlazi.'
          points:
            - Skrivene šupljine, šasije i tačke pričvršćivanja ovjesa
            - Oksidacija konektora i blokova — uobičajen uzrok fluktuirajućih grešaka
            - Protokol IPO i učestalost prolaska
            - 'Dizeli iz gradske eksploatacije: filter čađe i njegova istorija'
        fr:
          lead: 'U Francuskoj detaljan contrôle technique, i to je dobra polazna tačka. Dalje, gledamo ono što regulativa ne pokriva: resurs dizel grupe i trošenje od gradskog saobraćaja.'
          points:
            - Zapažanja contrôle technique po godinama — što se ponavlja iz pregleda u pregled
            - Filter čađe, EGR i turbina na dizelima
            - Kvačilo i ovjes nakon gustog gradskog ciklusa
            - 'Istorija po francuskim markama: dostupne rezervne delove, ali svoja slaba mesta'
        it:
          lead: Italijanski automobili najčešće dolaze sa sitnim popravkama karoserije, urađenim brzo i jeftino. Mereći debljinu boje na panelima ovde provodimo znatno više vremena nego obično.
          points:
            - Merač debljine boje na svim panelima — popravke nakon gradskih ogrebanja
            - 'Razlika između severa i juga: so pored obale, uobičajeno trošenje u unutrašnjosti'
            - Gasna oprema, ako je prisutna — instalacija i stanje boce
            - Učestalost revisione i propušteni periodi
        pl:
          lead: Poljska je najveće tranzitno tržište za oštećene automobile iz Zapadne Evrope. Zbog toga prvo saznajemo šta je rađeno sa ovom karoserijom pre prodaje.
          points:
            - Geometrija otvora i tragovi varova — obnova nakon ozbiljnog udesa
            - 'Istorija uvoza: odakle je automobil došao i u kakvom stanju'
            - Pređene kilometre upoređujemo sa evropskim servisnim bazama, odometru ne verujemo
            - Vazdušni jastučići i njihovo aktiviranje u prošlosti
      closing:
        eyebrow: Pronašli ste automobil?
        line1: Pošaljite link
        line2: na oglas —
        accentWord: doći ćemo i pogledati
        text: Dolazimo za jedan do dva dana. Izveštaj sa fotografijama ostaje kod vas, čak i ako nakon njega odustanete od kupovine.
    cityVehicleSourcing:
      title: Auto izbor
      descriptionFor: Pomoći ćemo vam da pronađete automobil u {cityLocation} uz kompletnu proveru. Radimo u celoj regiji {countryName}.
      casesHeadingFor: Studije slučaja iz {countryGenitiveOrName}
      whyCityHeadingFor: Zašto {cityName}
      reason1: Gledamo i auto plaće i privatne oglase
      reason2: Proveravamo istoriju po VIN-u pre odlaska na inspekciju
      reason3For: Naš ekspert u {cityLocation}
      reason4Dekra: DEKRA / TÜV proknjiga na zahtev
      reason4Generic: Nezavisna tehnička procena na zahtev
      otherCitiesLabelFor: 'Drugi gradovi {countryLocation}:'
      cityNotesHeadingFor: Automobilsko tržište {cityLocation}
      cityNotesPointsLabel: Šta to donosi u praksi
      cityNotes:
        berlin:
          lead: 'U Berlinu je najveći izbor u Nemačkoj i najraznovrsniji sastav prodavaca. Ovde se može pronaći sve: od automobila iz korporativnih flota sa potpunom istorijom, do preprodaja koje dolaze iz Istočne Evrope.'
          points:
            - Ogroman izbor u svim segmentima, uključujući retke konfiguracije
            - Mnogi privatni prodavci - pregovaranje je realnije nego kod dilera
            - 'Upravni ciklus: spojnice i ovjes brže se troše nego kod vozila za autoputeve'
        munich:
          lead: 'Skup grad sa skupim automobilima. Premium segmenta ovde ima više nego bilo gde drugde u Nemačkoj, a stanje je u proseku bolje: za takve automobile se brine.'
          points:
            - Jak premium segment, posebno BMW i Mercedes
            - Održavani automobili sa kompletnom istorijom kod dilera
            - Cene su više od prosečnih u zemlji - ušteda dolazi iz stanja
        hamburg:
          lead: Lučki grad i veliki logistički čvor. Odatle je lako poslati automobil dalje, a na tržištu često nailazimo na sveže uvezene automobile.
          points:
            - Luka u blizini - lakše i jeftinije organizovati transport
            - Mnoge mašine iz severnih područja sa autoputskim prevoženjem
            - 'Vlažna morska klima: obratite veču pažnju na karoseriju i skrivene šupljine'
        belgrade:
          lead: Naša baza. U Beogradu dolazimo na inspekciju istog dana kada se obratite, poznajemo lokalne prodavce i vidimo koja se vozila već mesec dana seljakaju po tržištu.
          points:
            - Inspekcija istog dana, bez čekanja i logistike
            - Poznajemo lokalne plaće i istoriju automobila koji su tamo
            - Automobil je već carinjen - uvoz i troškovi nisu potrebni
        novi-sad:
          lead: Drugi najveći grad Srbije, sat vožnje od Beograda. Tržište je manje, ali su i cene obično niže nego u prestonici, a automobili ređe prolaze kroz više preprodaja.
          points:
            - Cene su niže nego beogradske pri uporedivom stanju
            - Manje preprodavaca, češće prvi vlasnici
            - Idemo iz Beograda, nema dodatne naknade za put
        pancevo:
          lead: Pančevo zapravo pripada beogradskoj aglomeraciji, pa inspekcija ovde ne odudara od gradske. Tržište je malo, ali se privatni oglasi češće javljaju.
          points:
            - Dvadeset minuta od Beograda - dolazimo tako brzo
            - Malo tržište s dominacijom privatnih prodavaca
            - Često je jeftinije nego u prestonici uz isto stanje
        subotica:
          lead: 'Subotica se nalazi na granici sa Mađarskom, što se vidi na tržištu: mnogo automobila uvezenih iz EU i prodavaca koji se time često bave.'
          points:
            - Granično tržište - mnogo svežeg uvoza iz Evropske unije
            - Proveravamo istoriju pre uvoza posebno pažljivo
            - Praktična tačka ako planirate dalje ka severu
        madrid:
          lead: 'Glavno tržište Španije: najveći izbor u zemlji i mnogo automobila iz korporativnih flota. Kontinentalna klima, zbog čega morska korozija ovde manje česta nego na obali.'
          points:
            - Najveći izbor u Španiji, uključujući korporativna vozila
            - Daleko od mora - karoserije su obično čistije od obalnih
            - 'Vruće leto: plastične delove, lak i klima proveravamo odvojeno'
        barcelona:
          lead: Sve zavisi od blizine mora. Automobili često izgledaju odlično sa dna, ali zahtevaju pažnju na skrivene šupljine i elektriku.
          points:
            - 'Mora u blizini, pa gledamo skrivene šupljine: sa dna je često čisto, ali iznutra nije'
            - Mnogo prethodnih iznajmljivača i car sharing vozila
            - Luka u blizini, slanje morem se organizuje lakše
        zurich:
          lead: Cirih je najskuplje automobilsko tržište u regionu. Oprema ovde je obično maksimalna, servisira se kod dilera, a prodaju se ranije nego što vozilo postane trošno.
          points:
            - Maksimalne specifikacije i mali kilometražni učinak
            - Servis kod dilera - istorija gotovo uvek puna
            - Švajcarska nije u EU, oblikovanje uvoza se vrši odvojeno
        geneva:
          lead: Ženeva se nalazi u frankofonoj oblasti Švajcarske, blizu granice sa Francuskom. Francuskih marki na tržištu ima više nego u nemačkom delu zemlje.
          points:
            - 'Mešano tržište: švajcarsko stanje, francuski asortiman'
            - Granica s Francuskom blizu - postoji s čime uporediti po ceni
            - 'Oblikovanje je isto kao i u celoj Švajcarskoj: izvoz plus uvoz'
        paris:
          lead: 'Najveći izbor u Francuskoj dolazi s najtežim korišćenjem: velika gužva i tesna parking mesta ostavljaju tragove na karoseriji i ovjesu.'
          points:
            - Najveći izbor u Francuskoj, posebno francuskih marki
            - 'Upravni ciklus: spojnice, ovjes i manja oštećenja karoserije'
            - Mnogo dizelaša - filter za čađu i EGR proveravamo kao prioritet
        lyon:
          lead: Ljon je smireniji od Pariza i po cenama i po stanju automobila. Autoput na jug je blizu, pa se češće nalaze automobili sa ravnim prevoženjem.
          points:
            - Cene su niže od pariških pri uporedivom izboru
            - Više je autoputskih prevoženja, manje gradskog trošenja
            - Praktična veza ka Italiji i Španiji, ako tražimo šire
        milan:
          lead: 'Poslovna prestonica Italije, a na tržištu se to vidi i po novcu. Severo zemlje bliže je nemačkim uslovima: putevi su bolji, automobili bolje održavani od južnih.'
          points:
            - Najbolji izbor premium segmenta u Italiji
            - Sever - manje soli i korozije nego na jugu zemlje
            - 'Gust grad: merni uređaj na panelima je obavezan'
        rome:
          lead: Veliko tržište sa vrlo gustim gradskim korišćenjem. Male ogrebotine ovde se smatraju normalnim načinom života, i često se popravljaju brzo i nepravilno.
          points:
            - Mnogo malih automobila i vozila sa plinskim uređajem
            - Česte popravke nakon kontakata u gradu — proveravamo svaku ploču
            - Južno od Milana - klima je blaža, ali bliža moru
        warsaw:
          lead: Kroz Varšavu prolazi glavni uvoz iz Zapadne Evrope, a ovde je i najveći izbor u Poljskoj. Udeo obnovljenih automobila takođe je najviši.
          points:
            - Najveći izbor u Poljskoj, mnogo svežeg uvoza iz EU
            - Proveravamo geometriju karoserije i tragove popravke kao prioritet
            - Kratka isporuka - jeftinija od one iz Južne Evrope
        krakow:
          lead: 'Krakov je mirniji od Varšave: tržište je manje, manje preprodaja, a automobili obično duže drže jednog vlasnika. Jug Poljske je logistički bliži Balkanu.'
          points:
            - Manje preprodavaca nego u Varšavi, istorija je obično čistija
            - Cene često niže od prestoničkih
            - Bliže ruti na jug - praktično za isporuku u Srbiju
