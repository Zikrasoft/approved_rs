      casesHeadingFor: 'Uspešne kupovine: pronalaženje auta {location}'
      breadcrumbLabelFor: Automobili {location}
      stepsFor:
        - n: '01'
          text: 'Šaljete upit sa zahtevima: budžet, marka i kilometraža'
        - n: '02'
          text: Tražimo automobile {location} prema vašim kriterijumima
        - n: '03'
          text: Provera auta pre kupovine koju obavlja nezavisni stručnjak
