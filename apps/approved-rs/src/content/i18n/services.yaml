      citiesHeadingFor: Wo wir Autos {countryLocation} anschauen
      citiesLead: Der Experte fährt im gesamten Land, aber wir schauen am häufigsten dort nach Autos, wo die meisten zum Verkauf stehen. Was das für jede Stadt bedeutet, finden Sie hier.
      alsoInLabel: 'Wir suchen auch in:'
      crossSellLabel: Brauchen Sie kein lokales Auto?
      countryNotesHeadingFor: Was wir in {location} berücksichtigen
      countryNotesPointsLabel: Worauf wir zunächst achten
      countryNotes:
        de:
          lead: 'Die Auswahl hier ist größer als auf jedem anderen Markt in Europa, und die Servicehistorie lässt sich normalerweise nachvollziehen: Die meisten Autos haben ein Serviceheft mit Händlerstempeln für jede Wartung. Die Kehrseite sind Autobahnkilometer. Zweihunderttausend in drei Jahren sind hier die Norm und kein Grund für einen Preisnachlass.'
          points:
            - Serviceheft und Händlerstempel – wir prüfen das anhand der VIN bei einem offiziellen Service
            - Das Prüfprotokoll HU, das alle TÜV nennen, – wir lesen die Anmerkungen der letzten Prüfung, nicht nur den Stempel
            - 'Autos aus Leasing- und Firmenflotten: gut gewartet, aber hohe Kilometerstände'
            - Winterstraßen mit Streusalz – Unterboden und Schweller prüfen wir separat
        rs:
          lead: Hier sind wir vor Ort, daher besichtigen wir das Auto am Tag der Anfrage und ohne Import. Der Markt ist klein, das gleiche Auto wechselt oft mehrere Verkäufer, und die Historie muss entwirrt werden.
          points:
            - Das Auto ist bereits verzollt und hat lokale Nummernschilder – Zollgebühren und Importformalitäten sind nicht nötig
            - Kilometerstände werden häufig beim Weiterverkauf innerhalb des Landes korrigiert – wir prüfen sie anhand der technischen Überprüfung
            - Es gibt viele importierte Autos aus Deutschland und Italien – wir überprüfen, was mit dem Auto vor dem Import passiert ist
            - Besichtigung am Tag der Anfrage, ohne auf die Logistik zu warten
        es:
          lead: Milde Winter und kaum Chemikalien auf den Straßen, daher ist der Unterboden spanischer Autos meist erheblich besser als der deutscher. Sonne und die Nähe zum Meer setzen jedoch dem Lack, dem Kunststoff und allem Gummi zu.
          points:
            - Küstenregion – Korrosion suchen wir insbesondere in versteckten Hohlräumen
            - Verblasster Lack und rissiger Innenraum – berücksichtigen wir im Preis
            - 'Viele ehemalige Mietwagen: idealer Kilometerstand, aber härtere Nutzung'
            - ITV-Protokoll – wir prüfen die Anmerkungen und die Daten der Prüfungen
        ch:
          lead: 'Schweizer Autos sind erkennbar besser gepflegt als der Durchschnitt in Europa: teure Wartung erzieht die Käufer, die Kilometerstände sind gering. Aber die Schweiz ist nicht in der EU, daher wird der Import anders geregelt, und wir kalkulieren das im Voraus ein.'
          points:
            - Reiche Ausstattungen – hier werden sie öfter gewählt als bei den Nachbarn
            - MFK – die Prüfung ist streng, darauf wird ernsthaft vorbereitet, und das sieht man dem Auto an
            - 'Nicht-EU: Zoll und Dokumente werden nicht so abgewickelt wie für EU-Länder'
            - Preise über dem Markt, dafür sparen Sie später an Reparaturen
        pt:
          lead: Der Markt ist klein, die Auswahl bescheidener als die spanische, aber die Konkurrenz um gute Autos ist geringer. Das Klima ist feucht und salzhaltig – Küstliche Korrosion kommt selbst bei neueren Autos vor.
          points:
            - Feuchtigkeit und Meer – versteckte Hohlräume und Elektrik haben Priorität bei der Inspektion
            - 'Kleiner Markt: Für bestimmte Anfragen suchen wir länger als in Deutschland'
            - IPO-Protokoll – wir lesen die Anmerkungen vorheriger Inspektionen
            - Viele Diesel- und Kleinstwagen, große Karosserien kommen selten vor
        fr:
          lead: Frankreich ist vor allem Diesel und eigene Marken. Peugeot, Renault und Citroën sind hier günstiger als irgendwo sonst in Europa. Deutsche Premiumautos hingegen sind teurer, weshalb es wenig Sinn macht, sie hier zu kaufen.
          points:
            - Französische Marken – der beste Preis in Europa, und Wartung ist günstiger
            - Diesel – Rußfilter und EGR-Ventil prüfen wir gesondert
            - Contrôle technique – die Protokolle sind detailliert, wir prüfen die Anmerkungen über die Jahre
            - 'Städtischer Einsatz: Kupplung und Fahrwerk nutzen sich schneller ab als angegeben'
        it:
          lead: 'Der italienische Markt ist gut für Kleinstwagen und seltene Ausstattungen, erfordert jedoch Vorsicht: Autos werden hier intensiv genutzt, und kleine Karosserieschäden werden nicht immer sorgfältig behoben.'
          points:
            - Städte – häufige kleine Schäden und Lackierarbeiten, ein Messgerät ist obligatorisch
            - Süd und Küste bringen Salz und Korrosion, der Norden ist näher an deutschen Bedingungen
            - Revisione – wir prüfen die Regelmäßigkeit, Ausfälle sind häufiger als gewöhnlich
            - Viele Autos mit Gasanlage – wir prüfen sie separat
        pl:
          lead: 'Der nächstgelegene große Markt: Logistik ist günstig und kurz. Aber Polen war jahrelang der Hauptumschlagplatz für verunfallte Autos aus Westeuropa, daher prüfen wir die Historie hier strenger als irgendwo sonst.'
          points:
            - Hoher Anteil an nach einem Unfall wiederhergestellten Fahrzeugen – die Karosseriegeometrie hat Priorität
            - 'Häufige Weiterverkäufe: Das Auto wechselt oft mehrmals pro Jahr den Besitzer'
            - Kilometerstände werden häufig beim Import bearbeitet – wir prüfen sie anhand der Service-Datenbanken
            - Kurze Transportstrecke – günstiger und schneller als aus Spanien oder Portugal
      closing:
        eyebrow: Wie fangen wir an?
        line1: Beschreiben Sie das Auto,
        line2: das Sie suchen –
        accentWord: danach ist unsere Arbeit
        text: Budget, Karosserie, Getriebe, ein paar Wünsche oben drauf. Wir suchen, und Sie schauen sich die Berichte zu den Optionen an und entscheiden, welches Sie real besichtigen möchten.
