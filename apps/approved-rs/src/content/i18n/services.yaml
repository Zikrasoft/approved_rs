            text: Transporter oder Überführung mit Transitnummern. Wir kalkulieren beide Optionen und wählen die günstigere für die spezifische Strecke.
          - title: Zölle und Steuern
            text: Der Satz hängt vom Herkunftsland des Fahrzeugs und dessen Alter ab. Für Fahrzeuge europäischer Produktion ändert das Zertifikat EUR1 die Berechnung grundlegend - wir prüfen dessen Vorhandensein vor dem Kauf.
          - title: Export und Transit
            text: Abmeldung im Verkäuferland, Exporterklärung, Transitnummern und Versicherung für die Überführung.
          - title: Zollabwicklung
            text: Erklärung, Zollagent und Zahlung am Ankunftsort. Wir bereiten das Paket vor, damit das Fahrzeug nicht unnötig lange im Lager steht.
          - title: Zulassung
            text: Technische Überprüfung, Registrierung und Nummernschilder. Sie holen das Auto ab, mit dem Sie sofort fahren können.
