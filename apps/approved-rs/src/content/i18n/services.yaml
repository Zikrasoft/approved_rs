translations:
  en:
    vehicle-sourcing:
      hub:
        metaTitle: Full-Service Car Sourcing in Europe
        metaDescription: 'Car sourcing in Germany, Serbia, Spain, Switzerland, Italy, France, Poland and Portugal: search, on-site inspections, negotiation and delivery.'
        title: Car sourcing
        titleHighlight: from start to finish
        description: We find a car where you live or plan to buy. Full inspections, purchase support and delivery. Choose a country to see the details.
        breadcrumbLabel: Car sourcing
        casesHeading: Real car sourcing stories
        chooseCountryLabel: 'Choose a country:'
        ctaLabel: Find me a car
        heroPhotoAlt: A row of cars on a dealer's forecourt
        processHeading: How car sourcing works
        processLead: "From your enquiry to getting the keys, it usually takes three days to two weeks. Finding the right car takes the longest: we don't settle for the first promising option. We keep looking until we find one that passes our checks without concerns."
        processSteps:
          - n: '01'
            text: We discuss your budget, preferred make and requirements, including your priorities and where you're willing to compromise
          - n: '02'
            text: We shortlist cars on the local market and screen out any that don't stand up to questions over the phone
          - n: '03'
            text: We inspect cars on site with a paint thickness gauge and diagnostic scanner, use dealer-level ISTA diagnostics for BMWs, and take photos and videos
          - n: '04'
            text: We send you a report and tell you honestly whether to buy or keep looking
          - n: '05'
            text: We negotiate the price, handle the purchase paperwork and hand over the car or deliver it to your door
        includedHeading: What's included
        includedLead: Our fee is agreed before we start and stays the same regardless of how many cars we inspect. If our checks lead us to advise against buying, we keep looking at no extra cost.
        included:
          - title: No limit on the number of cars considered
            text: We keep working until we find a car we're happy to recommend. Rejecting an unsuitable car is part of the service, with no extra charge.
          - title: An expert on site for every inspection
            text: Paint thickness checks across the body panels, diagnostic scans of the control modules, and a lift inspection where needed. We photograph and film every problem area so you see what we see.
          - title: Vehicle history and legal checks
            text: A carVertical VIN report, dealer service records for the make, mileage verification, and checks for outstanding finance, registration restrictions and unresolved insurance claims.
          - title: Price negotiation and purchase support
            text: We negotiate the price based on our findings, prepare the paperwork and guide you through signing.
          - title: Delivery and registration
            text: We deliver the car to your city and help with local registration, or hand over the keys wherever it's convenient for you to collect it.
          - title: One specialist from start to finish
            text: You work with the same specialist who inspected the car. There's no need to explain your requirements again to whoever answers the phone.
        compareHeading: How the markets differ
        compareLead: The same model in Germany and Poland can be two very different propositions in terms of history and price.
        compareHint: Choose a country to see what we check first.
        compareLinkFor: Car sourcing {location} in detail
      title: Full-Service Car Sourcing
      descriptionFor: We find a car {location} already on the local market, with no overseas import needed. Full inspections, purchase support and delivery to your city.
      ctaLabel: Send an enquiry
      casesHeadingFor: 'Real purchases: car sourcing {location}'
      breadcrumbLabelFor: Cars {location}
      stepsFor:
        - n: '01'
          text: Send us your requirements, including budget, make and mileage
        - n: '02'
          text: We search for cars {location} that meet your criteria
        - n: '03'
          text: An independent expert inspects and checks the car
        - n: '04'
          text: We guide you through the purchase and help with paperwork and registration
        - n: '05'
          text: We deliver the car to your city and help you register it
      deliveryLineFor: We deliver anywhere in the country. If you need the car shipped abroad, we handle export and customs clearance, with delivery to {destinations} or any other country.
      deliveryDestinations:
        - Bosnia and Herzegovina
        - Croatia
        - North Macedonia
        - Turkey
        - Kazakhstan
        - Kyrgyzstan
      citiesHeadingFor: Where we inspect cars {countryLocation}
      citiesLead: Our expert travels nationwide, but most inspections take place where the most cars are listed. Here's what to expect in each city.
      alsoInLabel: 'We also source cars in:'
      crossSellLabel: Looking for a car from abroad?
      countryNotesHeadingFor: What we take into account {location}
      countryNotesPointsLabel: What we check first
      countryNotes:
        de:
          lead: 'Germany offers a wider choice than any other European market, and service history is usually traceable: most cars have a service book with dealer stamps for every service. The downside is high motorway mileage. Two hundred thousand kilometres in three years is normal here, not a reason for a discount.'
          points:
            - Service book and dealer stamps, verified against the VIN with an authorised workshop
            - The HU inspection report, commonly called the TÜV. We read the previous inspection findings, not just check the stamp
            - 'Ex-lease and company fleet cars: consistently serviced, but with high mileage'
            - Winter road salt means the underbody and sills need particular attention
        rs:
          lead: We're based here, so we can inspect a car the day you contact us, with no import needed. It's a small market, and the same car can pass through several sellers, so its history often takes some untangling.
          points:
            - The car has already cleared customs and has local plates, so no import duties or import paperwork are needed
            - Odometers are often rolled back when cars are resold locally, so we cross-check mileage against roadworthiness inspection records
            - Many cars are imported from Germany and Italy, so we check their history before import
            - Same-day inspections, with no waiting for travel arrangements
        es:
          lead: Mild winters and very little road salt mean Spanish cars usually have noticeably cleaner underbodies than German ones. But sun and coastal exposure take their toll on paintwork, plastics and rubber components.
          points:
            - Coastal exposure means we look for corrosion in hidden cavities first
            - We factor faded clear coat and cracked interior plastics into the price
            - 'There are plenty of ex-rental cars: consistent mileage, but hard use'
            - 'The ITV inspection report: we cross-check findings and inspection dates'
        ch:
          lead: 'Swiss cars are noticeably better maintained than the European average: high servicing costs encourage owners to stay on top of maintenance, and mileages tend to be low. But Switzerland is outside the EU, so import procedures differ. We factor this into the budget from the start.'
          points:
            - High-spec cars are more common here than in neighbouring countries
            - "MFK: a strict roadworthiness test that owners prepare for thoroughly, and it shows in the car's condition"
            - 'Outside the EU: customs clearance and paperwork differ from those for EU countries'
            - Prices are above market average, but you save on repairs later
        pt:
          lead: The market is small, with less choice than Spain, but also less competition for good cars. The humid, salty climate means coastal corrosion can affect even relatively new cars.
          points:
            - Humidity and sea air make hidden body cavities and electrics inspection priorities
            - 'A small market: finding a car to a specific brief takes longer than in Germany'
            - 'IPO reports: we review the findings from previous roadworthiness tests'
            - Plenty of diesels and small cars, but larger models are rare
        fr:
          lead: France is primarily a market for diesels and domestic brands. Peugeot, Renault and Citroën are cheaper here than anywhere else in Europe. German premium cars, by contrast, cost more, so there is little reason to buy them here.
          points:
            - French brands at Europe's best prices, with lower servicing costs too
            - On diesels, we check the diesel particulate filter and EGR valve separately
            - 'Contrôle technique: detailed test reports let us compare findings year by year'
            - 'City driving: clutch and suspension wear can be greater than the listing suggests'
        it:
          lead: 'Italy is a good market for small cars and unusual specifications, but it calls for caution: cars see heavy use here, and minor body repairs are not always done well.'
          points:
            - City driving brings frequent minor knocks and paint repairs, so a paint thickness gauge is essential
            - Salt and corrosion are concerns in the south and on the coast; conditions in the north are closer to Germany's
            - 'Revisione: we check that tests were carried out on schedule, as missed tests are more common here'
            - Many cars have LPG systems, which we inspect separately
        pl:
          lead: Our nearest major market offers quick, inexpensive transport. But Poland has long been a major transit hub for accident-damaged cars from Western Europe, so we scrutinise vehicle history here more closely than anywhere else.
          points:
            - A high proportion of accident-repaired cars makes chassis alignment a priority
            - 'Frequent resales: a car may pass through several owners in a year'
            - Odometers are often rolled back during import, so we cross-check mileage against service databases
            - A short transport route makes delivery cheaper and faster than from Spain or Portugal
      closing:
        eyebrow: Where do we start?
        line1: Tell us about the car
        line2: you're looking for,
        accentWord: we'll take it from there
        text: Your budget, body style, transmission and a few preferences. We do the searching; you review our reports on the options and decide which car we should inspect in person.
    vehicle-buyback:
