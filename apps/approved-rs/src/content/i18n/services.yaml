        includedLead: Por la diferencia entre nuestro precio y el del mercado, nos quedamos con todo lo que hace que un coche no se venda durante meses.
        included:
          - title: Coches con matrícula rusa
            text: 'Categoría principal. El coche puede estar en cualquier país de Europa: iremos donde se encuentra, y nos encargamos del transporte y la reventa.'
          - title: Problemas de importación y plazos
            text: Después de la firma, los riesgos asociados con la importación temporal caducada pasan a nosotros.
          - title: Valoración sin inspección
            text: Damos el precio basándonos en fotos y documentos. Vemos el coche solo cuando ambas partes han acordado el monto.
          - title: Formalización de la transacción
            text: Preparamos el contrato, la baja de matrícula y todos los documentos. De ti, solo necesitamos los documentos del coche y tu firma.
          - title: Pago el día de la firma
            text: Transferimos el dinero el mismo día. No disponemos de esquemas de pago aplazado o 'pagaremos después de la reventa.'
          - title: Rechazo honesto
            text: Si el coche no nos conviene, lo diremos de inmediato y explicaremos la razón. No vamos a alargar el proceso ni a bajar el precio en el camino.
