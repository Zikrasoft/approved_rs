    vehicle-inspection:
      title: Inspección de vehículos
      description: Inspección independiente de un coche antes de la compra. Evaluación por un experto, diagnóstico, informe — sin obligación de compra.
      ctaLabel: Solicitar inspección
      casesHeading: Casos de inspección
      breadcrumbLabel: Inspección de vehículos
      steps:
        - n: '01'
          text: Carrocería y pintura — presencia de reparaciones o accidentes
        - n: '02'
          text: Tren de rodaje, suspensión, frenos
        - n: '03'
          text: Motor, caja de cambios, transmisión
        - n: '04'
          text: Electrónica e historial de servicio por VIN
        - n: '05'
          text: Legitimidad legal — embargos, prohibiciones de registro, accidentes
      extraLine: Trabajamos en otros países de Europa, incluyendo Portugal, — consulte al solicitar.
      hub:
        metaTitle: Inspección de vehículos antes de la compra en Europa
        metaDescription: 'Nos trasladamos al coche que usted encontró: medidor de grosor, escáner, verificación del historial por VIN e informe con fotos el mismo día. Trabajamos en ocho países de Europa.'
        title: Inspección de vehículos
        titleHighlight: antes de la compra
        description: 'Nos dirigimos al coche que usted encontró y le contamos cuál es su verdadero estado. El informe llega antes de que entregue el dinero: si la respuesta es ‘no lo compre’, solo perderá el costo de la inspección.'
        breadcrumbLabel: Inspección de vehículos
        casesHeading: Casos de inspección
        chooseCountryLabel: 'Seleccione un país:'
        ctaLabel: Solicitar inspección
        heroPhotoAlt: Coche en elevador en el taller
        processHeading: Cómo se realiza la inspección
        processLead: Normalmente nos trasladamos dentro de uno o dos días después de la solicitud. La inspección toma aproximadamente una hora y media a dos horas, y enviamos el informe el mismo día, antes de que el coche se venda a otro comprador.
        processSteps:
          - n: '01'
            text: Envía el enlace al anuncio y los contactos del vendedor
          - n: '02'
            text: Acordamos con el vendedor la hora y el lugar de la inspección
          - n: '03'
            text: Nos trasladamos con un medidor de grosor y un escáner; para BMW conectamos con el ISTA del concesionario, y si es necesario, en un elevador
          - n: '04'
            text: Tomamos fotos y videos de todos los hallazgos, verificamos el historial por VIN
          - n: '05'
            text: Enviamos el informe y una respuesta directa — comprar, negociar o rechazar
        includedHeading: Qué incluye la inspección
        includedLead: 'Más de cien puntos en la lista de verificación, pero normalmente cuatro áreas son las más decisivas: carrocería, motor con la caja, tren de rodaje y documentos. Es precisamente en estas áreas donde más a menudo disuadimos de la compra.'
        included:
          - title: Carrocería y pintura
            text: Medidor de grosor en cada panel, geometría de las aberturas, signos de soldadura y masillas. Se puede ver si hubo reparaciones de las que el vendedor no habló.
          - title: Motor y caja de cambios
            text: Parámetros con motor caliente, adaptaciones de la caja, errores en la memoria de los módulos. Es la área más cara y la causa más frecuente de rechazo.
          - title: Tren de rodaje y frenos
            text: Holguras, estado de la suspensión y el sistema de frenos. El kilometraje de autopista y las carreteras balcánicas desgastan el coche de manera diferente, y eso es visible.
          - title: Electrónica e historial por VIN
            text: Informe de CarVertical, historial de servicio de concesionario por marca, discrepancias en el kilometraje con el historial, errores en los módulos y signos de activación de airbags.
          - title: Legitimidad legal
            text: Embargos, prohibiciones de registro, accidentes no reportados y eventos de seguro — lo que puede surgir después de la compra.
          - title: Informe con fotos y videos
            text: Cada hallazgo es documentado y etiquetado. El informe se queda con usted — es útil para negociar, incluso si decide comprar el coche.
        compareHeading: Qué cambia de un país a otro
        compareLead: Las regulaciones de la revisión técnica, problemas típicos de los coches locales y formas de ocultar la historia varían en todo el mundo.
        compareHint: Seleccione un país — le mostraremos qué añadimos a la lista de verificación habitual.
        compareLinkFor: Inspección {location} — detalles
        mapHeading: Cuatro áreas que deciden la transacción
        mapLead: La lista de verificación es larga, pero normalmente disuadimos debido a una de las cuatro áreas. Toque el número en el esquema — le mostraremos qué observa el experto y qué descubrimos allí.
      countryNotesHeadingFor: Cómo inspeccionamos {location}
      countryNotesPointsLabel: Qué revisamos además de la lista de verificación habitual
      countryNotes:
        de:
          lead: 'En Alemania hay buena información disponible: libro de servicio, protocolos HU y bases de datos de VIN bien desarrolladas. Por lo tanto, la inspección aquí se centra principalmente en la verificación de documentos con lo que muestra el coche.'
          points:
            - Verificamos las anotaciones del mantenimiento del concesionario con las lecturas del odómetro por años
            - Observaciones de la última HU — qué se reparó después de la inspección y qué solo se alargó
            - El fondo y los umbrales tras los reactivos invernales, incluyendo las cavidades ocultas
            - 'Historia de leasing: mantenimiento regular a pesar del alto kilometraje'
        rs:
          lead: 'En Serbia nos trasladamos el día de la solicitud. La tarea principal es recuperar el historial del coche hasta su importación: los documentos locales solo muestran el último tramo de la vida del coche.'
          points:
            - País de origen y estado del coche antes de la importación a Serbia
            - Lecturas del odómetro contra las anotaciones de la revisión técnica de años anteriores
            - Reparaciones de carrocería después de la importación — se hacen más a menudo y más baratas que en la UE
            - 'Parte legal: embargos y restricciones sobre el registro'
        es:
          lead: Los coches españoles suelen lucir buenos fondos y decepcionar en lo que sufre del sol y la sal. Desplazamos la inspección de la corrosión inferior hacia cavidades ocultas, electrónica y estado del interior.
          points:
            - Corrosión en cavidades ocultas junto a la costa — por debajo puede parecer limpio
            - Pintura, sellos y plástico después de años de sol
            - 'Historial de alquiler: verificamos el kilometraje con el desgaste típico del interior'
            - Protocolo ITV y lo que quedó sin cerrar entre inspecciones
        ch:
          lead: En Suiza, los coches se preparan en serio para el MFK, por lo que un protocolo reciente por sí mismo dice poco. Observamos lo que se hizo justo antes de la inspección y lo que ha estado funcionando por su cuenta desde el año pasado.
          points:
            - Qué se reemplazó justo antes del MFK — piezas nuevas en comparación con el resto
            - El mantenimiento es costoso, así que verificamos si se han retrasado los servicios
            - La dotación es rica, pero comprobamos que cada opción todavía funcione
            - 'Documentos para importación: Suiza no es la UE, el paquete difiere'
        pt:
          lead: 'Todo aquí depende del húmedo clima marítimo. Comenzamos la inspección con corrosión y componentes eléctricos: lo que suele fallar son las cosas que viven en la humedad.'
          points:
            - Cavidades ocultas, largueros y puntos de anclaje de la suspensión
            - Oxidación de conectores y módulos — causa típica de errores intermitentes
            - Protocolo IPO y regularidad de las inspecciones
            - 'Diéseles con uso urbano: filtro de partículas y su historial'
        fr:
          lead: 'En Francia, hay un contrôle technique detallado, y esta es una buena base de partida. Luego vemos lo que las regulaciones no cubren: la vida útil del grupo diésel y el desgaste del tráfico urbano.'
          points:
            - Observaciones del contrôle technique por años — lo que se repite de inspección a inspección
            - Filtro de partículas, EGR y turbocompresor en diéseles
            - Embrague y suspensión después de un ciclo urbano denso
            - 'Historia sobre marcas francesas: repuestos accesibles, pero con sus debilidades'
        it:
          lead: Los coches italianos llegan con reparaciones de carrocería menores realizadas de manera rápida y económica. En el medidor de grosor por panel aquí se tarda significativamente más tiempo del habitual.
          points:
            - Medidores de grosor en todos los paneles — retoques después de golpes urbanos
            - 'Diferencia entre el norte y el sur: sal en la costa, desgaste habitual en el interior del país'
            - Equipos de gas, si están instalados — instalación y estado del tanque
            - Regularidad en la revisione y períodos omitidos
        pl:
          lead: Polonia es el principal mercado de tránsito para coches dañados de Europa Occidental. Por lo tanto, lo primero que averiguamos es qué se ha hecho a esta carrocería antes de la venta.
          points:
            - Geometría de las aberturas y signos de soldadura — restauración después de un accidente grave
            - 'Historia de importación: de dónde llegó el coche y en qué estado'
            - Verificamos el kilometraje con bases de datos de servicio europeas, no confiamos en el odómetro
            - Airbags y su activación en el pasado
      closing:
        eyebrow: ¿Encontró su coche?
        line1: Envíenos el enlace
        line2: al anuncio —
        accentWord: iremos a inspeccionarlo
        text: Nos trasladamos en uno o dos días. El informe con fotos se queda con usted, aunque después decida no comprar.
    cityVehicleSourcing:
      title: Selección de vehículos
      descriptionFor: Encontramos el automóvil en {cityLocation} con una verificación completa. Trabajamos en toda la región de {countryName}.
      casesHeadingFor: Casos de {countryGenitiveOrName}
      whyCityHeadingFor: Por qué {cityName}
      reason1: Analizamos tanto concesionarios como anuncios particulares
      reason2: Verificamos la historia por VIN antes de la inspección
      reason3For: Nuestro experto en {cityLocation}
      reason4Dekra: Inspección DEKRA / TÜV a solicitud
      reason4Generic: Evaluación técnica independiente a solicitud
      otherCitiesLabelFor: 'Otras ciudades en {countryLocation}:'
      cityNotesHeadingFor: Mercado automovilístico en {cityLocation}
      cityNotesPointsLabel: ¿Qué significa esto en la práctica?
      cityNotes:
        berlin:
          lead: 'Berlín tiene la mayor selección en Alemania y una variedad colorida de vendedores. Aquí puedes encontrar todo: coches de flotas corporativas con historial completo y opciones de reventa que provienen de Europa del Este.'
          points:
            - Amplia selección en cualquier segmento, incluyendo configuraciones raras
            - Muchos vendedores privados — el regateo es más realista que con los concesionarios
            - 'Ciclo urbano: el embrague y la suspensión se desgastan más que en coches de carretera'
        munich:
          lead: 'Ciudad cara con coches caros. El segmento de lujo aquí es más grande que en cualquier otro lugar de Alemania, y el estado promedio es mejor: estos coches son bien cuidados.'
          points:
            - Fuerte segmento de lujo, especialmente BMW y Mercedes
            - Coches bien mantenidos con historial completo de concesionario
            - Precios más altos que la media nacional — el ahorro es debido al estado
        hamburg:
          lead: Ciudad portuaria y gran nodo logístico. Desde aquí es fácil enviar coches más lejos, y en el mercado hay una mayor cantidad de coches importados nuevos.
          points:
            - Puerto cercano — más fácil y económico organizar el envío
            - Muchos coches de tierras del norte con kilometrajes de carretera
            - 'Clima marino húmedo: inspeccionamos la carrocería y los espacios ocultos más detenidamente'
        belgrade:
          lead: Nuestra base. En Belgrado realizamos inspecciones el mismo día de la solicitud, conocemos a los vendedores locales y vemos qué coches han estado circulando por los concesionarios durante dos meses.
          points:
            - Inspección el mismo día de la solicitud, sin esperas ni logística
            - Conocemos los concesionarios locales y la historia de los coches que están allí
            - El coche ya está despachado — no se necesitan impuestos ni tarifas de importación
        novi-sad:
          lead: La segunda ciudad más grande de Serbia y a una hora de Belgrado. El mercado es más pequeño, pero los precios suelen ser más tranquilos que en la capital, y los coches raramente han pasado por varias reventas.
          points:
            - Precios más bajos que en Belgrado con un estado comparable
            - Menos re-vendedores, más coches de primer dueño
            - Salimos de Belgrado, no hay coste adicional por el viaje
        pancevo:
          lead: Pancevo forma parte de la aglomeración metropolitana de Belgrado, por lo que las inspecciones aquí no difieren de las de la capital. El mercado es pequeño, pero los anuncios particulares son más interesantes.
          points:
            - Veinte minutos de Belgrado — salimos igual de rápido
            - Mercado pequeño con predominancia de vendedores privados
            - A menudo más barato que en la capital con el mismo estado
        subotica:
          lead: 'Subotica está en la frontera con Hungría, y eso se refleja en el mercado: muchos coches importados de la UE y vendedores que se dedican a esto constantemente.'
          points:
            - Mercado fronterizo — mucho importado reciente de la Unión Europea
            - Verificamos la historia antes de la importación con especial cuidado
            - Punto conveniente si planeas enviar el coche más al norte
        madrid:
          lead: 'El mercado de la capital de España: la mayor selección en el país y muchos coches de flotas corporativas. Clima continental, por lo que hay menos corrosión costera aquí que en la playa.'
          points:
            - La mayor selección en España, incluyendo coches corporativos
            - Lejos del mar — las carrocerías suelen estar más limpias que las costeras
            - 'Veranos calurosos: revisamos el plástico, el esmalte y el aire acondicionado por separado'
        barcelona:
          lead: Todo depende de la cercanía al mar. Los coches a menudo se ven muy bien por debajo, pero requieren atención a los espacios ocultos y a la electricidad.
          points:
            - 'El mar está cerca, así que revisamos los espacios ocultos: por debajo suele estar limpio, pero por dentro no'
            - Muchos coches que fueron de alquiler y de car sharing
            - Puerto cercano, el envío por mar se organiza más fácilmente
        zurich:
          lead: Zúrich es el mercado automovilístico más caro de la región. Aquí se eligen las configuraciones máximas, se mantienen en concesionarios y se venden antes de que el coche tenga tiempo de desgastarse.
          points:
            - Configuraciones máximas y bajo kilometraje
            - Servicio de concesionario — la historia casi siempre está completa
            - Suiza no está en la UE, el ingreso se maneja por separado
        geneva:
          lead: Ginebra está en la parte francófona de Suiza, justo en la frontera con Francia. Las marcas francesas son significativamente más comunes en el mercado que en la parte alemana del país.
          points:
            - 'Mercado mixto: estado suizo, variedad francesa'
            - La frontera con Francia está cerca — hay precios con los que comparar
            - 'La formalidad es la misma que en toda Suiza: exportación más importación'
        paris:
          lead: 'La mayor selección en Francia viene acompañada de un uso muy intensivo: tráfico denso y estacionamientos estrechos dejan huellas en la carrocería y la suspensión.'
          points:
            - La mayor selección en Francia, especialmente de marcas francesas
            - 'Ciclo urbano: el embrague, la suspensión y los pequeños daños en la carrocería'
            - Muchos diéseles — revisamos el filtro de partículas y el EGR en primer lugar
        lyon:
          lead: Lyon es más tranquila que París, tanto en precios como en el estado de los coches. La carretera hacia el sur está cerca, por lo que hay más coches con kilometrajes de carretera.
          points:
            - Precios más bajos que en París con una selección comparable
            - Más kilometrajes de carretera, menos desgaste urbano
            - Conveniente conexión hacia Italia y España, si buscamos más allá
        milan:
          lead: 'La capital de negocios de Italia, y ello se ve en el mercado. El norte del país se asemeja más a las condiciones alemanas: mejores carreteras, coches más cuidados que en el sur.'
          points:
            - La mejor selección de coches de lujo en Italia
            - El norte — menos sal y corrosión que en el sur del país
            - 'Ciudad densa: un medidor de espesor en los paneles es obligatorio'
        rome:
          lead: Un gran mercado con un uso urbano muy denso. Los pequeños rasguños aquí se consideran parte de la vida cotidiana, y a menudo son reparados de manera rápida.
          points:
            - Muchos coches compactos y vehículos de gas
            - Reacondicionamientos frecuentes tras contatos urbanos — revisamos cada panel
            - Más al sur de Milán — el clima es más suave, pero más cerca del mar
        warsaw:
          lead: A través de Varsovia, entra el principal flujo de importación desde Europa Occidental, y aquí se encuentra la mayor selección en Polonia. La proporción de coches restaurados también es la más alta.
          points:
            - La mayor selección en Polonia, muchos importados recientes de la UE
            - Revisamos primero la geometría de la carrocería y las huellas de reparación
            - Conexión de entrega corta — más barato que desde el sur de Europa
        krakow:
          lead: 'Cracovia es más tranquila que Varsovia: el mercado es más pequeño, hay menos reventas y los coches suelen tener un solo propietario durante más tiempo. El sur de Polonia está más cerca de los Balcanes en términos logísticos.'
          points:
            - Menos re-vendedores que en Varsovia, la historia suele estar más limpia
            - Precios a menudo más bajos que en la capital
            - Más cerca de la ruta hacia el sur — conveniente para la entrega a Serbia
