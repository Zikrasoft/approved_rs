            text: Der Satz hängt vom Ursprungsland des Fahrzeugs und seinem Alter ab. Für Fahrzeuge europäischer Herstellung verändert das EUR1-Zertifikat die Berechnung grundlegend — wir überprüfen dessen Vorhandensein vor dem Kauf.
          - title: Export und Transit
            text: Abmeldung im Verkäuferland, Exportdeklaration, Transitkennzeichen und Versicherung für die Transportfahrt.
          - title: Zollabwicklung
            text: Deklaration, Broker und Zahlung am Ankunftsort. Wir bereiten das Paket im Voraus vor, damit das Auto nicht unnötig lange im Lager steht.
          - title: Zulassung
            text: Technische Überprüfung, Registrierung und Nummernschilder. Sie holen das Auto ab, mit dem Sie sofort fahren können.
