        heroPhotoAlt: Auto-Transporter mit beladenen Autos
        processHeading: Wie der Import abläuft
        processLead: In der Regel dauert es von der Anfrage bis zur Zulassung vier bis acht Wochen, wobei die Fahrt den geringsten Zeitaufwand beansprucht. Von Deutschland nach Belgrad fährt das Auto ein paar Tage, aber der Zoll und die Zulassung ziehen sich über Wochen.
        processSteps:
          - n: '01'
            text: Berechnen Sie die Gesamtkosten vor Start - Auto, Logistik, Zollgebühren, Formalitäten
          - n: '02'
            text: Wir suchen und prüfen das Auto im Abgangsland
          - n: '03'
            text: Wir kaufen das Auto auf unsere europäische Firma, melden es ab und bereiten die Exportdokumente vor
          - n: '04'
            text: Wir transportieren das Auto mit einem Transporter oder mit Transitnummern selbst
          - n: '05'
            text: Wir passieren den Zoll, melden es an und übergeben Ihnen die Schlüssel
        includedHeading: Was die Kosten ausmacht
        includedLead: 'Beim Eigenimport überschreitet oft der Betrag der Kosten die Fahrzeugkosten. Wir berechnen das im Voraus und fixieren es: das Endergebnis sollte sich nicht vom ersten Angebot unterscheiden.'
        included:
          - title: Kosten des Fahrzeugs
            text: Preis nach Verhandlung, nicht aus der Anzeige. Wir verhandeln mit dem Fahrzeug in der Hand - das lohnt sich üblicherweise und deckt einen Teil der Kosten.
          - title: Logistik zum Zielort
            text: Transporter oder Selbstfahrt mit Transitnummern. Wir berechnen beide Optionen und wählen die kostengünstigere für die jeweilige Strecke.
          - title: Zollgebühren und Steuern
            text: Der Satz hängt vom Ursprungsland des Fahrzeugs und seinem Alter ab. Für europäische Fahrzeuge verändert das EUR1-Zertifikat die Berechnung grundlegend - wir überprüfen seine Verfügbarkeit vor dem Kauf.
          - title: Export und Transit
            text: Abmeldung im Verkäuferland, Exportdeklaration, Transitnummern und Versicherung für die Selbstfahrt.
          - title: Zollabwicklung
            text: Deklaration, Broker und Zahlung am Ankunftsort. Wir bereiten das Paket im Voraus vor, damit das Auto nicht unnötige Tage im Lager steht.
          - title: Zulassung
            text: Technische Inspektion, Registrierung und Nummernschilder. Sie nehmen das Auto in Empfang, mit dem Sie sofort fahren können.
