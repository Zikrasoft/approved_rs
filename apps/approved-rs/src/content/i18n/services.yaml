    vehicle-inspection:
      title: Inspección de coche
      description: Inspección independiente del coche antes de la compra. Visita del experto, diagnóstico, informe — sin obligación de compra.
      ctaLabel: Solicitar inspección
      casesHeading: 'Transacciones reales: inspección antes de la compra'
      breadcrumbLabel: Inspección de coche
      steps:
        - n: '01'
          text: Carrocería y pintura — presencia de reparaciones o accidentes
        - n: '02'
          text: Suspensión, frenos
        - n: '03'
          text: Motor, caja, transmisión
        - n: '04'
          text: Electrónica e historial de servicio según VIN
        - n: '05'
          text: Limpieza legal — gravámenes, prohibición de registro, accidentes
      extraLine: Trabajamos en otros países de Europa, incluyendo Portugal, — por favor, consulte al solicitar.
      hub:
        metaTitle: Inspección de coches antes de la compra en Europa
        metaDescription: 'Nos desplazamos hasta el coche que usted encontró: medición de grosor, escáner, comprobación de historial según VIN e informe con fotos el mismo día. Trabajamos en ocho países de Europa.'
        title: Inspección de coche
        titleHighlight: antes de la compra
        description: 'Nos desplazamos al coche que usted encontró y le informamos sobre su estado real. El informe se envía antes de que usted pague: si el resultado es “no comprar”, solo perderá el coste de la inspección.'
        breadcrumbLabel: Inspección de coche
        casesHeading: 'Transacciones reales: inspección antes de la compra'
        chooseCountryLabel: 'Elige un país:'
        ctaLabel: Solicitar inspección
        heroPhotoAlt: Coche en un elevador en el taller
        processHeading: Cómo se realiza la inspección
        processLead: Normalmente nos desplazamos dentro de uno o dos días tras la solicitud. La inspección en sí dura entre una hora y media y dos horas, y enviamos el informe el mismo día, antes de que el coche se venda a otro comprador.
        processSteps:
          - n: '01'
            text: Envía el enlace del anuncio y los contactos del vendedor
          - n: '02'
            text: Nos ponemos de acuerdo con el vendedor sobre el tiempo y lugar de la inspección
          - n: '03'
            text: Nos desplazamos con el medidor de espesor y el escáner, para BMW conectamos al servicio ISTA, si es necesario, en un elevador
          - n: '04'
            text: Tomamos fotos y videos de todos los hallazgos, verificamos la historia según VIN
          - n: '05'
            text: Enviamos el informe y una respuesta directa — comprar, negociar o rechazar
        includedHeading: Qué incluye la inspección
        includedLead: 'Más de cien puntos de lista de verificación, pero casi siempre deciden cuatro áreas: carrocería, motor y transmisión, suspensión y documentos. Precisamente sobre ellos a menudo desaconsejamos comprar.'
        included:
          - title: Carrocería y pintura
            text: Medición de grosor en cada panel, geometría de los accesos, huellas de soldadura y masilla. Se puede ver si hubo reparación de la que el vendedor no mencionó.
          - title: Motor y transmisión
            text: Parámetros del motor caliente, adaptaciones de la transmisión, errores en la memoria de los módulos. La zona más cara y la razón más frecuente de rechazo.
          - title: Suspensión y frenos
            text: Holguras, estado de la suspensión y del sistema de frenos. El kilometraje de carretera y las carreteras balcánicas desgastan el coche de manera diferente, y eso se nota.
          - title: Electrónica e historia según VIN
            text: Informe de CarVertical, historial de servicio del concesionario por la marca, discrepancias en el kilometraje con el historial, errores en los bloques y señales de airbags desplegados.
          - title: Legalidad
            text: 'Embargo, prohibición de registro, accidentes no resueltos y eventos asegurados: aspectos que surgen después de la compra.'
          - title: Informe con fotos y videos
            text: Cada hallazgo está fotografiado y firmado. El informe queda en su poder — es útil para negociar, incluso si finalmente compra el coche.
        compareHeading: Qué cambia de un país a otro
        compareLead: Regulación de la inspección técnica, problemas comunes de los coches locales y formas de ocultar la historia en cada lugar.
        compareHint: Seleccione un país — le mostraremos qué agregamos a la lista de verificación habitual.
        compareLinkFor: Inspección en {location} — en detalle
        mapHeading: Cuatro áreas que deciden el trato
        mapLead: La lista de verificación es extensa, pero casi siempre desaconsejamos en una de las cuatro áreas. Haga clic en el número en el esquema — le mostraremos qué observa el experto y qué encontramos allí.
      countryNotesHeadingFor: Cómo inspeccionamos en {location}
      countryNotesPointsLabel: Qué revisamos además de la lista de verificación habitual
      countryNotes:
        de:
          lead: 'En Alemania tenemos mucho respaldo: libro de servicios, protocolos HU y bases de datos desarrolladas por VIN. Por lo tanto, la inspección aquí es principalmente la verificación de documentos frente a lo que muestra el coche.'
          points:
            - Comparar las marcas de servicio del concesionario con las lecturas del odómetro a lo largo de los años
            - Observaciones del último HU — qué se reparó después de la inspección y qué solo se alargó
            - Suelo y umbrales después de agentes invernales, incluidos espacios ocultos
            - 'Pasado de leasing: mantenimiento regular con alto kilometraje'
        rs:
          lead: 'En Serbia respondemos el mismo día de la consulta. La principal tarea es reconstruir la historia del coche antes de la importación: los documentos locales solo muestran el último tramo de la vida del vehículo.'
          points:
            - País de origen y estado del coche antes de la importación a Serbia
            - Lecturas del odómetro frente a los registros de techos en los años anteriores
            - Reparación de carrocería tras la importación — se realiza con más frecuencia y a menor coste que en la UE
            - 'Asuntos legales: embargos y restricciones sobre el registro'
        es:
          lead: Los coches españoles suelen tener buenos suelos y decepcionan en todo lo que padece del sol y la sal. Enfocamos la inspección desde la corrosión en la parte inferior hacia espacios ocultos, electricidad y estado del interior.
          points:
            - Corrosión en espacios ocultos cerca de la costa — en la parte inferior puede estar limpio
            - Barniz, juntas y plásticos después de varios años de sol
            - 'Pasado de alquiler: comparamos el kilometraje con el desgaste típico del interior'
            - Protocolo de ITV y qué quedó sin resolver entre las inspecciones
        ch:
          lead: Los coches se preparan en serio para el MFK, así que un protocolo fresco por sí solo no dice mucho. Observamos lo que se hizo justo antes de la inspección y lo que ha estado funcionando desde el año pasado.
          points:
            - Qué se reemplazó justo antes del MFK — piezas frescas en comparación con las demás
            - Mantenimiento costoso, por lo que comprobamos si se pospusieron los reglamentos
            - Equipamiento rico, pero comprobamos que cada opción aún funcione
            - 'Documentos para la importación: Suiza no está en la UE, el conjunto es diferente'
        pt:
          lead: 'Todo aquí se reduce al clima marino húmedo. La inspección comienza con corrosión y electricidad: a menudo lo que falla es lo que vive en la humedad.'
          points:
            - Espacios ocultos, largueros y puntos de fijación de la suspensión
            - Oxidación de conectores y bloques — causa típica de errores intermitentes
            - Protocolo IPO y regularidad de las inspecciones
            - 'Diésel con uso urbano: filtro de partículas y su historial'
        fr:
          lead: 'En Francia, un contrôle technique detallado es un buen punto de partida. Luego, verificamos aspectos que el reglamento no aborda: la duración del grupo diésel y el desgaste por el tráfico urbano.'
          points:
            - Observaciones del contrôle technique a lo largo de los años — qué se repite de inspección a inspección
            - Filtro de partículas, EGR y turbina en diéseles
            - Embrague y suspensión después de un denso ciclo urbano
            - 'Historia de marcas francesas: repuestos accesibles, pero con debilidades propias'
        it:
          lead: Los coches italianos llegan con frecuencia con reparaciones de carrocería menores, realizadas rápidamente y a bajo coste. Se necesita significativamente más tiempo para usar un medidor de grosor en los paneles aquí que lo habitual.
          points:
            - Medidor de grosor en todos los paneles — retoques tras golpes en la ciudad
            - 'Diferencias entre el norte y el sur: sal en la costa, desgaste normal en el interior'
            - Equipos de gas, si están instalados — instalación y estado del cilindro
            - Regularidad de revisiones y períodos omitidos
        pl:
          lead: Polonia es el mayor mercado de tránsito para coches dañados de Europa Occidental. Por lo tanto, primero averiguamos qué se hizo con esa carrocería antes de la venta.
          points:
            - Geometría de los marcos y señales de soldadura — restauración después de un grave accidente
            - 'Historia de importación: de dónde vino el coche y en qué estado'
            - Comparamos el kilometraje con bases de servicio europeas, el odómetro no se considera fiable
            - Airbags y su activación en el pasado
      closing:
        eyebrow: ¿Encontró un coche?
        line1: Envíe el enlace
        line2: del anuncio —
        accentWord: iremos a verlo
        text: Salimos en uno o dos días. El informe con fotos queda en su posesión, incluso si decide no comprar después de eso.
    cityVehicleSourcing:
      title: Selección de coches
      descriptionFor: Encontraremos un coche en {cityLocation} con una revisión completa. Trabajamos en todo el región de {countryName}.
      casesHeadingFor: Transacciones reales en el mercado de {countryGenitiveOrName}
      whyCityHeadingFor: Por qué {cityName}
      reason1: Vemos tanto plataformas de concesionarios como anuncios privados
      reason2: Verificamos la historia por VIN antes de salir a la inspección
      reason3For: Nuestro experto en {cityLocation}
      reason4Dekra: Inspección DEKRA / TÜV a pedido
      reason4Generic: Peritaje técnico independiente a pedido
      otherCitiesLabelFor: 'Otras ciudades en {countryLocation}:'
      cityNotesHeadingFor: Mercado automovilístico en {cityLocation}
      cityNotesPointsLabel: Qué significa esto en la práctica
      cityNotes:
        berlin:
          lead: 'Berlín tiene la mayor selección en Alemania y la gama más variada de vendedores. Aquí se encuentra de todo: desde coches de flotas corporativas con historial completo, hasta opciones de reventa procedentes de Europa del Este.'
          points:
            - Amplia selección en cualquier segmento, incluidas configuraciones raras
            - 'Muchos vendedores privados: el regateo es más realista que con los concesionarios'
            - 'Ciclo urbano: el desgaste de la suspensión y los neumáticos es más notable que en los coches de autopista'
        munich:
          lead: 'Una ciudad cara con coches caros. Aquí hay más vehículos del segmento premium que en cualquier otro lugar de Alemania, y el estado promedio es superior: los propietarios cuidan bien de estos coches.'
          points:
            - Fuerte segmento premium, especialmente BMW y Mercedes
            - Coches bien mantenidos con historial completo de concesionario
            - Precios por encima del promedio nacional; el ahorro es por el estado
        hamburg:
          lead: Ciudad portuaria y gran nodo logístico. Desde aquí es fácil enviar coches más lejos, y en el mercado, es común encontrar coches importados recientes.
          points:
            - El puerto cercano facilita y abarata el envío
            - Muchos coches de tierras del norte con kilometrajes de carretera
            - 'Clima marino húmedo: revisamos minuciosamente el chasis y los espacios ocultos'
        dusseldorf:
          lead: Centro de Renania del Norte-Westfalia, la región más densamente poblada de Alemania. Los lotes están muy cercanos, y a una hora de la frontera con los Países Bajos y Bélgica, así que se traen coches a la venda con regularidad.
          points:
            - En una sola salida podemos ver varios coches; los lotes están cerca
            - 'Algunas ofertas tienen matrículas holandesas y belgas: verificamos la historia y documentación por separado'
            - Hay muchos vendedores y compiten entre sí; el regateo es más frecuente
        belgrade:
          lead: Nuestra base. En Belgrado, hacemos la inspección el mismo día que se solicita, conocemos a los vendedores locales y vemos qué coche ha estado cambiando de lote durante dos meses.
          points:
            - Inspección el mismo día, sin esperas ni logística
            - Conocemos los lotes locales y el historial de los coches disponibles
            - El coche ya está despachado; no se necesita importación ni aranceles
        novi-sad:
          lead: La segunda ciudad más grande de Serbia, a una hora en coche de Belgrado. El mercado es más pequeño, pero los precios suelen ser más tranquilos que en la capital, y los coches rara vez han pasado por muchas reventas.
          points:
            - Precios más bajos que en Belgrado con un estado comparable
            - Menos revendedores, es más común encontrar al primer propietario
            - Salimos de Belgrado, no hay costo adicional por el viaje
        pancevo:
          lead: Pančevo forma parte de la aglomeración de Belgrado, así que la inspección aquí no difiere de la de la capital. El mercado es pequeño, pero los anuncios privados suelen ser más interesantes.
          points:
            - Veinte minutos desde Belgrado; salimos con la misma rapidez
            - Mercado pequeño con predominancia de vendedores privados
            - A menudo más barato que en la capital en condiciones similares
        subotica:
          lead: 'Subotica está en la frontera con Hungría, lo que se refleja en el mercado: muchos coches importados de la UE y vendedores que se dedican a esto constantemente.'
          points:
            - 'Mercado fronterizo: mucho importado fresco de la Unión Europea'
            - Verificamos especialmente la historia previa a la importación
            - Punto conveniente si planea llevar el coche más al norte
        madrid:
          lead: 'El mercado capitalino de España: la mayor selección del país y muchos vehículos de flotas corporativas. El clima continental significa que aquí hay menos corrosión costera que en la costa.'
          points:
            - La mayor selección en España, incluidos los coches corporativos
            - Lejos del mar, los chasis suelen estar más limpios que los costeros
            - 'Verano caluroso: revisamos el plástico, el barniz y el aire acondicionado por separado'
        barcelona:
          lead: Todo está determinado por la proximidad al mar. Los coches a menudo se ven geniales por abajo, pero requieren atención a los espacios ocultos y la electricidad.
          points:
            - 'El mar está cerca, por lo que inspeccionamos los espacios ocultos: por abajo a menudo está limpio, pero por dentro no'
            - Muchos coches de alquiler y de carsharing
            - El puerto está cerca, el envío marítimo se organiza más fácilmente
        zurich:
          lead: Zúrich es el mercado automovilístico más caro de la región. Aquí se eligen las configuraciones más completas, se mantienen en concesionarios y se venden antes de que el coche sufra desgaste.
          points:
            - Configuraciones máximas y bajos kilometrajes
            - Servicio de concesionario; el historial casi siempre está completo
            - Suiza no es parte de la UE, la importación se gestiona de forma separada
        geneva:
          lead: Ginebra se encuentra en la parte francófona de Suiza, justo en la frontera con Francia. Hay muchas más marcas francesas en el mercado que en la parte alemana del país.
          points:
            - 'Mercado mixto: condición suiza, variedad francesa'
            - La frontera con Francia está cerca; hay comparaciones de precios disponibles
            - 'El proceso es el mismo que en toda Suiza: exportación más importación'
        paris:
          lead: 'La mayor selección en Francia viene junto con un uso muy duro: el denso tráfico y el estacionamiento estrecho dejan huellas en la carrocería y la suspensión.'
          points:
            - La mayor selección en Francia, especialmente de marcas francesas
            - 'Ciclo urbano: desgaste en el agarre, suspensión y pequeños daños en la carrocería'
            - 'Muchos diésel: nos fijamos primero en el filtro de partículas y el EGR'
        lyon:
          lead: Lyon es más tranquila que París, tanto en precios como en estado de los coches. La autopista hacia el sur está cerca, así que suelen aparecer coches con kilometrajes de carretera regulares.
          points:
            - Precios más bajos que los de París con una selección comparable
            - Más kilometrajes de carretera, menos desgaste urbano
            - Buena conexión a Italia y España si estamos buscando más opciones
        milan:
          lead: 'La capital de los negocios de Italia, y en el mercado esto se nota en los precios. El norte del país se asemeja más a las condiciones alemanas: mejores carreteras, coches mejor cuidados que en el sur.'
          points:
            - La mejor selección del segmento premium en Italia
            - El norte tiene menos sal y corrosión que el sur del país
            - 'Ciudad densa: es indispensable un medidor de grosor para las carrocerías'
        rome:
          lead: Un gran mercado con una alta densidad de uso urbano. Rasguños menores son considerados parte de la vida aquí y a menudo se reparan de manera rápida.
          points:
            - Muchos coches de pequeño tamaño y vehículos con equipo de gas
            - Frecuentes retoques tras contactos urbanos, revisamos cada panel
            - Al sur de Milán, el clima es más suave, pero más cerca del mar
        warsaw:
          lead: A través de Varsovia entra la principal importación de Europa Occidental, y aquí está la mayor selección en Polonia. La proporción de coches reacondicionados es también la más alta.
          points:
            - La mayor selección en Polonia, mucho importado fresco de la UE
            - Verificamos primero la geometría de la carrocería y señales de reparaciones
            - Plazo de entrega corto — más barato que desde el sur de Europa
        krakow:
          lead: 'Cracovia es más tranquila que Varsovia: el mercado es más pequeño, hay menos reventa y los coches suelen tener un solo propietario por más tiempo. El sur de Polonia está más cerca de los Balcanes en términos logísticos.'
          points:
            - Menos intermediarios que en Varsovia, la historia tiende a ser más limpia
            - Los precios son a menudo más bajos que en la capital
            - Más cerca de la ruta hacia el sur — conveniente para la entrega a Serbia
