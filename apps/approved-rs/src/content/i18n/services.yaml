        included:
          - title: Preis des Fahrzeugs
            text: Der Preis nach Verhandlung, nicht der aus der Anzeige. Wir verhandeln, wenn das Auto zur Besichtigung bereitsteht — das amortisiert in der Regel einen Teil der Kosten.
