    vehicle-inspection:
      title: Fahrzeugprüfung
      description: Unabhängige Prüfung des Fahrzeugs vor dem Kauf. Expertenbesuch, Diagnose, Bericht - ohne Kaufverpflichtung.
      ctaLabel: Prüfung anfordern
      casesHeading: 'Reale Geschäfte: Prüfung vor dem Kauf'
      breadcrumbLabel: Fahrzeugprüfung
      steps:
        - n: '01'
          text: Karosserie und Lackierung - auf Reparaturen oder Unfälle prüfen
        - n: '02'
          text: Fahrwerk, Aufhängung, Bremsen
        - n: '03'
          text: Motor, Getriebe, Transmission
        - n: '04'
          text: Elektronik und Wartungshistorie anhand der VIN
        - n: '05'
          text: Rechtliche Klarheit - Pfand, Registrierungsverbot, Unfälle
      extraLine: Wir arbeiten auch in anderen Ländern Europas, einschließlich Portugal - fragen Sie bitte bei der Anfrage nach.
      hub:
        metaTitle: Fahrzeugprüfung vor dem Kauf in Europa
        metaDescription: 'Wir fahren zu dem Fahrzeug, das Sie selbst gefunden haben: Lackdickenmessgerät, Scanner, VIN-Geschichtsprüfung und Bericht mit Fotos am selben Tag. Wir arbeiten in acht europäischen Ländern.'
        title: Fahrzeugprüfung
        titleHighlight: vor dem Kauf
        description: "Wir fahren zu dem Fahrzeug, das Sie selbst gefunden haben, und berichten, was wirklich mit ihm ist. Der Bericht kommt, bevor Sie das Geld übergeben: wenn die Antwort 'nicht kaufen' lautet, verlieren Sie nur die Kosten für die Prüfung."
        breadcrumbLabel: Fahrzeugprüfung
        casesHeading: 'Reale Geschäfte: Prüfung vor dem Kauf'
        chooseCountryLabel: 'Wählen Sie ein Land:'
        ctaLabel: Prüfung anfordern
        heroPhotoAlt: Fahrzeug auf einer Hebebühne in der Werkstatt
        processHeading: So verläuft die Prüfung
        processLead: In der Regel fahren wir innerhalb von ein bis zwei Tagen nach der Anfrage los. Die eigentliche Besichtigung dauert anderthalb bis zwei Stunden, den Bericht senden wir am selben Tag, bevor das Fahrzeug an einen anderen Käufer verkauft wird.
        processSteps:
          - n: '01'
            text: Sie senden den Link zur Anzeige und die Kontaktdaten des Verkäufers
          - n: '02'
            text: Wir vereinbaren mit dem Verkäufer einen Zeitpunkt und Ort für die Besichtigung
          - n: '03'
            text: Wir fahren mit Lackdickenmessgerät und Scanner, für BMW verbinden wir uns mit ISTA, wenn nötig - auf die Hebebühne
          - n: '04'
            text: Wir machen Fotos und Videos aller Funde, überprüfen die Geschichte anhand der VIN
          - n: '05'
            text: Wir senden den Bericht und eine direkte Antwort - kaufen, verhandeln oder ablehnen
        includedHeading: Was ist in der Prüfung enthalten
        includedLead: 'Über hundert Punkte auf der Checkliste, aber fast immer sind vier Bereiche entscheidend: Karosserie, Motor mit Getriebe, Fahrwerk und Dokumente. Genau wegen dieser Punkte reden wir oft von einem Kaufverzicht.'
        included:
          - title: Karosserie und Lackierung
            text: Lackdickenmessung an jedem Panel, Geometrie der Öffnungen, Spuren von Schweiß- und Spachtelarbeiten. Es ist sichtbar, ob eine Reparatur durchgeführt wurde, über die der Verkäufer nicht informiert hat.
          - title: Motor und Getriebe
            text: Parameter des warmen Motors, Getriebeanpassungen, Fehler im Speicher der Steuergeräte. Der teuerste Bereich und die häufigste Ablehnungsursache.
          - title: Fahrwerk und Bremsen
            text: Spiel, Zustand der Aufhängung und Bremsanlage. Autobahnkilometer und Balkanstraßen belasten das Fahrzeug unterschiedlich, und das ist sichtbar.
          - title: Elektronik und Geschichte nach VIN
            text: CarVertical-Bericht, historische Serviceinformationen vom Händler zur Marke, Abweichungen beim Kilometerstand sowie Fehler in den Steuergeräten und Hinweise auf ausgelöste Airbags.
          - title: Rechtliche Sauberkeit
            text: Hypotheken, Registrierungsverbote, offene Unfälle und Versicherungsereignisse - das kommt häufig erst nach dem Kauf ans Licht.
          - title: Bericht mit Foto und Video
            text: Jeder Fund wird dokumentiert und beschriftet. Der Bericht bleibt bei Ihnen - damit können Sie selbst verhandeln, selbst wenn Sie das Auto tatsächlich kaufen.
        compareHeading: Was sich von Land zu Land ändert
        compareLead: Vorschriften zur technischen Prüfung, typische Mängel lokaler Autos und Möglichkeiten, die Geschichte überall zu verbergen.
        compareHint: Wählen Sie ein Land - wir zeigen Ihnen, was wir zur üblichen Prüfliste hinzufügen.
        compareLinkFor: Prüfung {location} - im Detail
        mapHeading: Vier Zonen, die den Deal entscheiden
        mapLead: Die Checkliste ist lang, aber wir überzeugen fast immer aufgrund einer der vier Zonen. Klicken Sie die Nummer im Diagramm an - wir zeigen Ihnen, was der Experte überprüft und was wir dort gefunden haben.
      countryNotesHeadingFor: So überprüfen wir {location}
      countryNotesPointsLabel: Was wir über die übliche Checkliste hinaus überprüfen
      countryNotes:
        de:
          lead: 'In Deutschland gibt es einiges zu beachten: Servicenachweise, HU-Protokolle und umfassende VIN-Datenbanken. Daher besteht die Prüfung hier vor allem darin, die Dokumente mit dem Zustand des Fahrzeugs abzugleichen.'
          points:
            - Wir vergleichen die Einträge der Händlerinspektionen mit den Kilometerständen über die Jahre
            - Anmerkungen der letzten HU - was nach der Inspektion repariert wurde und was nur überbrückt wurde
            - Unterbodenschutz und Schweller nach den winterlichen Streumitteln, einschließlich versteckter Hohlräume
            - 'Leasingvergangenheit: gleichmäßige Wartung bei hohem Kilometerstand'
        rs:
          lead: 'In Serbien fahren wir am Tag der Anfrage aus. Die Hauptaufgabe besteht darin, die Geschichte des Fahrzeugs bis zu seiner Einfuhr wiederherzustellen: lokale Dokumente zeigen nur den letzten Abschnitt der Lebensdauer des Autos.'
          points:
            - Herkunftsland und Zustand des Autos vor der Einfuhr nach Serbien
            - Kilometerstand im Vergleich zu den Einträgen der technischen Überprüfung aus den vergangenen Jahren
            - Karosseriereparaturen nach der Einfuhr - die werden häufiger und günstiger durchgeführt als in der EU
            - 'Rechtliche Aspekte: Hypotheken und Einschränkungen bei der Registrierung'
        es:
          lead: Spanische Autos erfreuen sich normalerweise eines guten Unterbodens, enttäuschen jedoch in Bezug auf alles, was unter Sonneneinstrahlung und Salz leidet. Wir verschieben die Prüfung von der Korrosion am Unterboden auf versteckte Hohlräume, Elektrik und den Zustand des Innenraums.
          points:
            - Korrosion in versteckten Hohlräumen an der Küste - unten kann es sauber sein
            - Lack, Dichtungen und Kunststoffteile nach jahrelanger Sonneneinstrahlung
            - 'Vermietungshistorie: wir vergleichen den Kilometerstand mit dem Abnutzungsgrad des Innenraums'
            - ITV-Protokoll und was zwischen den Prüfungen unklar blieb
        ch:
          lead: In der Schweiz bereiten die Fahrzeuge sich ernsthaft auf die MFK vor, daher sagt ein frisches Protokoll per se wenig aus. Wir schauen uns an, was genau vor der Prüfung gemacht wurde und was seit dem letzten Jahr noch besteht.
          points:
            - Was kurz vor der MFK ersetzt wurde - neue Teile im Vergleich zu den übrigen
            - Wartung ist teuer, daher prüfen wir, ob Regularien hinausgeschoben wurden
            - Die Ausstattung ist reichhaltig, aber wir überprüfen, ob jede Option noch funktioniert
            - 'Einfuhrdokumente: Die Schweiz ist nicht in der EU, das Set ist anders'
        pt:
          lead: 'Hier hängt alles vom feuchten maritimen Klima ab. Wir beginnen die Prüfung mit Korrosion und Elektrik: gewöhnlich versagen die Teile, die in Feuchtigkeit leben.'
          points:
            - Versteckte Hohlräume, Längsträger und Bindepunkte der Aufhängung
            - Korrosion an Steckverbindern und Steuergeräten - eine häufige Ursache für instabile Fehlermeldungen
            - IPO-Protokoll und Regelmäßigkeit der Prüfungen
            - 'Diesel mit Stadtbetrieb: Zustand des Partikelfilters und dessen Geschichte'
        fr:
          lead: 'In Frankreich gibt es eine detaillierte technische Prüfung, und das ist ein guter Ausgangspunkt. Darüber hinaus prüfen wir, was das Regularium nicht erfasst: den Zustand der Dieselgruppe und die Abnutzung im Stadtverkehr.'
          points:
            - Anmerkungen aus der technischen Prüfung über die Jahre - was sich von Inspektion zu Inspektion wiederholt
            - Partikelfilter, EGR und Turbolader bei Dieselmotoren
            - Kupplung und Aufhängung nach intensivem Stadtverkehr
            - 'Geschichte bei französischen Marken: verfügbare Ersatzteile, aber eigene Schwachstellen'
        it:
          lead: Italienische Autos kommen häufiger mit kleinen Karosserieschäden, die schnell und günstig repariert wurden. Ein Lackschichtdickenmesser benötigt hier deutlich mehr Zeit als gewöhnlich.
          points:
            - Lackschichtdickenmesser für alle Paneele - Überarbeitung nach städtischen Berührungen
            - 'Unterschied zwischen Nord und Süd: Salz an der Küste, übliche Abnutzung im Landesinneren'
            - Gasinstallation, falls vorhanden - Zustand und Anlagentechnik
            - Regelmäßigkeit der revisione und versäumte Fristen
        pl:
          lead: Polen ist der größte Umschlagplatz für Unfallfahrzeuge aus Westeuropa. Daher klären wir als erstes, was mit diesem Fahrzeug vor dem Verkauf geschehen ist.
          points:
            - Geometrie der Öffnungen und Schweißspuren - Wiederherstellung nach schwerem Unfall
            - 'Einfuhrhistorie: woher das Auto kam und in welchem Zustand'
            - Wir vergleichen den Kilometerstand mit europäischen Servicedatenbanken und glauben dem Kilometerzähler nicht voll und ganz
            - Airbags und deren Auslösung in der Vergangenheit
      closing:
        eyebrow: Haben Sie ein Auto gefunden?
        line1: Schicken Sie den Link
        line2: zur Anzeige -
        accentWord: wir kommen und schauen es uns an
        text: Wir fahren in ein bis zwei Tagen los. Der Bericht mit Fotos bleibt bei Ihnen, selbst wenn Sie nachher vom Kauf absehen.
    cityVehicleSourcing:
      title: Fahrzeugbeschaffung
      descriptionFor: Wir finden das Auto {cityLocation} mit vollständiger Prüfung. Wir arbeiten in der gesamten Region {countryName}.
      casesHeadingFor: Echte Geschäfte auf dem Markt in {countryGenitiveOrName}
      whyCityHeadingFor: Warum {cityName}
      reason1: Wir überprüfen sowohl Händlerplätze als auch private Anzeigen
      reason2: Die Geschichte per VIN prüfen wir vor dem Ausblick auf die Inspektion
      reason3For: Unser Experte {cityLocation}
      reason4Dekra: Prüfung DEKRA / TÜV auf Anfrage
      reason4Generic: Unabhängige technische Expertise auf Anfrage
      otherCitiesLabelFor: 'Andere Städte in {countryLocation}:'
      cityNotesHeadingFor: Automarkt {cityLocation}
      cityNotesPointsLabel: Was das praktisch bringt
      cityNotes:
        berlin:
          lead: 'In Berlin gibt es die größte Auswahl in Deutschland und die vielfältigsten Anbieter. Hier findet man alles: von Fahrzeugen aus Unternehmensflotten mit vollständiger Historie bis hin zu Weiterverkäufen aus Osteuropa.'
          points:
            - Riesige Auswahl in allen Segmenten, einschließlich seltener Ausstattungen
            - Viele private Verkäufer — der Preisnachlass ist realistischer als bei Händlern
            - 'Städtischer Zyklus: Griffigkeit und Federung nutzen sich stärker ab als bei Autobahnfahrzeugen'
        munich:
          lead: 'Teure Stadt mit teuren Fahrzeugen. Der Premium-Sektor ist hier größer als irgendwo sonst in Deutschland, und der Zustand ist im Durchschnitt besser: solche Fahrzeuge werden gepflegt.'
          points:
            - Starker Premium-Sektor, besonders BMW und Mercedes
            - Gepflegte Fahrzeuge mit vollständiger Händlerhistorie
            - Preise liegen über dem landesweiten Durchschnitt — Ersparnisse entstehen durch den Zustand
        hamburg:
          lead: Hafenstadt und großes logistisches Zentrum. Von hier aus ist es einfach, das Fahrzeug weiter zu verschicken, und der Markt bietet häufiger frische Importfahrzeuge.
          points:
            - Hafen in der Nähe — einfacher und günstiger Versand
            - Viele Fahrzeuge aus Norddeutschland mit Autobahnkilometern
            - 'Feuchtes Meeresklima: Wir prüfen Karosserie und Hohlräume sorgfältiger'
        dusseldorf:
          lead: Zentrum von Nordrhein-Westfalen, dem am dichtesten besiedelten Bundesland Deutschlands. Die Auktionen stehen dicht beieinander, und zur Grenze nach den Niederlanden und Belgien sind es nur eine Stunde, daher kommen regelmäßig Fahrzeuge zum Verkauf hierher.
          points:
            - Bei einem Besuch können wir mehrere Fahrzeuge besichtigen — die Auktionen liegen nah beieinander
            - 'Ein Teil der Angebote hat niederländische und belgische Nummernschilder: Wir prüfen die Historie und Dokumente separat'
            - Viele Verkäufer, die miteinander konkurrieren — Preisnachlässe sind realistischer
        belgrade:
          lead: Unsere Basis. In Belgrad besichtigen wir am Tag der Anfrage, wir kennen die lokalen Verkäufer und sehen, welches Fahrzeug schon seit zwei Monaten durch die Auktionen wandert.
          points:
            - Besichtigung am Tag der Anfrage, ohne Wartezeit und Logistik
            - Wir kennen die lokalen Auktionen und die Historie der Fahrzeuge, die dort stehen
            - Das Fahrzeug ist bereits verzollt — Einfuhr und Zölle sind nicht erforderlich
        novi-sad:
          lead: Die zweitgrößte Stadt Serbiens und eine Stunde Fahrt von Belgrad. Der Markt ist kleiner, die Preise sind jedoch in der Regel ruhiger als in der Hauptstadt, und die Fahrzeuge haben seltener mehrere Verkaufszyklen durchlaufen.
          points:
            - Preise sind niedriger als in Belgrad bei vergleichbarem Zustand
            - Weniger Händler, der Erstbesitzer kommt häufiger vor
            - Wir fahren von Belgrad aus, keine zusätzlichen Kosten für die Strecke
        pancevo:
          lead: Pančevo gehört faktisch zur Metropolregion Belgrad, deshalb unterscheidet sich die Besichtigung hier nicht von der in der Hauptstadt. Der Markt ist klein, aber private Angebote sind interessanter.
          points:
            - Zwanzig Minuten von Belgrad — wir fahren genauso schnell
            - Kleiner Markt mit einer Mehrheit an privaten Verkäufern
            - Oft günstiger als in der Hauptstadt bei gleichem Zustand
        subotica:
          lead: 'Subotica liegt an der Grenze zu Ungarn, und das spiegelt sich im Markt wider: viele Fahrzeuge, die aus der EU importiert wurden, und Verkäufer, die sich ständig damit beschäftigen.'
          points:
            - Grenzmarkt — viele frische Importe aus der Europäischen Union
            - Wir überprüfen die Historie vor dem Import besonders sorgfältig
            - Praktischer Ort, wenn Sie das Fahrzeug weiter nach Norden fahren möchten
        madrid:
          lead: 'Der Hauptmarkt Spaniens: die größte Auswahl im Land und viele Fahrzeuge aus Unternehmensflotten. Das kontinentale Klima bedeutet, dass Meereskorrosion hier geringer ist als an der Küste.'
          points:
            - Die größte Auswahl in Spanien, einschließlich Firmenfahrzeuge
            - Weit entfernt vom Meer — Karosserien sind in der Regel sauberer als die an der Küste
            - 'Heiße Sommer: Kunststoff, Lack und Klimaanlage prüfen wir besonders sorgfältig'
        barcelona:
          lead: Alles wird durch die Nähe zum Meer bestimmt. Die Fahrzeuge sehen oft unten großartig aus, bedürfen jedoch einer sorgfältigen Prüfung der Hohlräume und Elektrik.
          points:
            - 'Das Meer ist in der Nähe, daher prüfen wir die Hohlräume: von unten oft sauber, von innen weniger'
            - Viele ehemalige Mietwagen und Carsharing-Fahrzeuge
            - Der Hafen ist in der Nähe, der Versand per Meer lässt sich einfacher organisieren
        zurich:
          lead: Zürich ist der teuerste Automarkt der Region. Die Ausstattungen sind hier maximal, die Fahrzeuge werden beim Händler gewartet und früher verkauft, als dass sie wirklich abgenutzt werden.
          points:
            - Maximale Ausstattungen und geringe Laufleistungen
            - Händlerwartung — Historie ist fast immer vollständig
            - Schweiz ist nicht in der EU, die Einfuhr wird separat abgewickelt
        geneva:
          lead: Genf liegt im französischsprachigen Teil der Schweiz, an der Grenze zu Frankreich. Französische Marken sind auf dem Markt deutlich zahlreicher als im deutschen Teil des Landes.
          points:
            - 'Gemischter Markt: Schweizer Zustand, französisches Angebot'
            - Die Grenze zu Frankreich ist nahe — man hat Vergleichsmöglichkeiten beim Preis
            - 'Die Abwicklung ist wie in der ganzen Schweiz: Export plus Import'
        paris:
          lead: 'Die größte Auswahl in Frankreich geht einher mit der härtesten Nutzung: dichter Verkehr und enge Parkplätze hinterlassen Spuren an Karosserie und Fahrwerk.'
          points:
            - Die größte Auswahl in Frankreich, insbesondere an französischen Marken
            - 'Städtischer Zyklus: Griffigkeit, Federung und kleine Karosserieschäden'
            - Viele Diesel — wir prüfen den Partikelfilter und EGR zuerst
        lyon:
          lead: Lyon ist ruhiger als Paris, sowohl bei den Preisen als auch beim Zustand der Fahrzeuge. Die Autobahn nach Süden ist in der Nähe, weshalb wir häufiger Fahrzeuge mit gleichmäßiger Autobahnfahrleistung finden.
          points:
            - Preise sind niedriger als in Paris bei vergleichbarem Angebot
            - Mehr Autobahnkilometer, weniger städtischer Verschleiß
            - Bequeme Verbindung zu Italien und Spanien, wenn wir breiter suchen
        milan:
          lead: 'Die Geschäftshauptstadt Italiens und das ist auf dem Markt sichtbar. Der Norden des Landes ist näher an den deutschen Bedingungen: bessere Straßen und besser gepflegte Fahrzeuge als im Süden.'
          points:
            - Die beste Auswahl an Premium-Fahrzeugen in Italien
            - Der Norden — weniger Salz und Korrosion als im Süden des Landes
            - 'Dicht besiedelt: Dicke-Messgerät für die Karosserien ist unerlässlich'
        rome:
          lead: Ein großer Markt mit intensiver städtischer Nutzung. Kleinere Kratzer werden hier als normal angesehen und häufig nur schnell repariert.
          points:
            - Viele Kleinwagen und Fahrzeuge mit Gasanlage
            - Häufige Lacknachbesserungen nach städtischen Kontakten – wir überprüfen jedes Blech
            - Südlicher von Mailand ist das Klima milder, aber näher zum Meer
        warsaw:
          lead: Über Warschau importiert man die meisten Fahrzeuge aus Westeuropa, und hier findet man die größte Auswahl in Polen. Der Anteil der restaurierten Autos ist ebenfalls am höchsten.
          points:
            - Größte Auswahl in Polen, viele frische Importe aus der EU
            - Wir überprüfen zuerst die Karosseriegeometrie und Reparaturspuren
            - Kurzes Lieferprofil – günstiger als aus Südeuropa
        krakow:
          lead: 'Krakau ist ruhiger als Warschau: der Markt ist kleiner, weniger Wiederverkäufe, und die Autos bleiben oftmals länger in einem Besitz. Südpolen ist logistisch näher zu den Balkans.'
          points:
            - Weniger Zwischenhändler als in Warschau, die Historie ist normalerweise sauberer
            - Preise sind oft niedriger als in der Hauptstadt
            - Näher an der Route in den Süden – praktisch für die Lieferung nach Serbien
