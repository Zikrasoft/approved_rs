      citiesHeadingFor: Gde gledamo automobile {countryLocation}
      citiesLead: Stručnjak odlazi širom zemlje, ali najčešće gledamo automobile tamo gde ih najviše izlažu. Ovo znači za svaki grad.
      alsoInLabel: 'Takođe tražimo u:'
      crossSellLabel: Trebate automobil iz druge zemlje?
      countryNotesHeadingFor: Šta uzimamo u obzir {location}
      countryNotesPointsLabel: Na šta prvo obraćamo pažnju
      countryNotes:
        de:
          lead: 'Izbor ovde je veći nego na bilo kom drugom tržištu u Evropi, a istorija servisiranja se obično može pratiti: većina automobila ima servisnu knjigu sa potpisima dilera o svakom servisu. Druga strana — autoputni pređeni kilometri. Dvesto hiljada u tri godine je ovde norma, a ne razlog za popust.'
          points:
            - Servisna knjiga i potpis dilera — proveravamo po VIN-u kod zvaničnog servisa
            - Protokol HU, koji svi zovu TÜV — čitamo primedbe sa prošlog pregleda, a ne samo pečat
            - 'Automobili iz lizinga i korporativnih parkova: redovno su servisirani, ali pređeni kilometri su veliki'
            - Zimski putevi sa hemikalijama — pogledamo donju stranu i pragove odvojeno
        rs:
          lead: Ovde smo na licu mesta, tako da gledamo automobil na dan prijave i bez uvoza. Tržište je malo, isti automobil često prolazi kroz nekoliko prodavaca, pa se istorija mora raspetljati.
          points:
            - Automobil je već carinjen i sa lokalnim tablicama — takse i carinjenje uvoza nisu potrebni
            - Pređeni kilometri se često ispravljaju prilikom preprodaje unutar zemlje — proveravamo sa potpisima tehničkog pregleda
            - Puno automobila uvezenih iz Nemačke i Italije — proveravamo šta se dešavalo sa automobilom pre uvoza
            - Pregled na dan prijave, bez čekanja na logistiku
        es:
          lead: Blaga zima i skoro da nema hemikalija na putevima, tako da su donje strane španskih automobila obično uočljivo bolje nego nemačkih. Ipak, sunce i blizina mora deluju na boju, plastiku i sve gumene delove.
          points:
            - Obala — tražimo koroziju pre svega u skrivenim prazninama
            - Izbledela lak i napuknuta plastika u unutrašnjosti — uračunavamo u cenu
            - 'Puno nekadašnjih iznajmljenih automobila: regularni pređeni kilometri, ali stroga eksploatacija'
            - Protokol ITV — proveravamo primedbe i datume prolaska
        ch:
          lead: 'Švajcarski automobili su daleko bolje održavani od proseka u Evropi: skupa održavanja disciplinuje, pređeni kilometri su mali. Ali Švajcarska nije u EU, tako da se uvoz obrađuje drugačije, i to uračunavamo u budžet unapred.'
          points:
            - Bogate opreme — ovde su ih više uzimali nego kod komšija
            - MFK — pregled je strožiji, pripremaju se ozbiljno, i to se vidi na automobilu
            - 'Nije EU: carina i dokumenti se ne obrađuju kao za zemlje Evropske unije'
            - Cene su više od tržišnih, ali kasnije štedite na popravkama
        pt:
          lead: Tržište je malo, izbor skromniji od španskog, ali i konkurencija za dobar automobil je niža. Klima je vlažna i slana — morska korozija se javlja čak i na novim automobilima.
          points:
            - Vlažnost i more — skrivene praznine i elektronika su prioritet pregleda
            - 'Malo tržište: na konkretan zahtev tražimo duže nego u Nemačkoj'
            - Protokol IPO — čitamo primedbe sa prethodnih pregleda
            - Puno dizel i malih automobila, velika vozila se retko pojavljuju
        fr:
          lead: Francuska je pre svega dizel i domaće marke. Peugeot, Renault i Citroën su ovde jeftiniji nego bilo gde u Evropi. Nemački premijum je, s druge strane, skuplji, i nema smisla kupovati ovde.
          points:
            - Francuske marke — najbolja cena u Evropi, i održavanje je jeftinije
            - Dizeli — proveravamo čestice filtere i EGR ventil kao posebnu stavku
            - Contrôle technique — protokoli su detaljni, proveravamo primedbe prema godinama
            - 'Gradska eksploatacija: kvačilo i ovjes brže se troše nego što je naznačeno'
        it:
          lead: 'Italijansko tržište je dobro za male automobile i retke pakete, ali zahteva oprez: automobili se ovde intenzivno koriste, a sitne karoserijske popravke se ne rade uvek pažljivo.'
          points:
            - Grad — česti sitni udarci i prefarbavanje, merni uređaj je obavezan
            - Jug i obala donose so i koroziju, sever je bliži nemačkim uslovima
            - Revisione — proveravamo redosled, propuštanja su češća nego obično
            - Puno automobila sa plinskom opremom — proveravamo to odvojeno
        pl:
          lead: 'Najveće tržište blizu nas: logistika je jeftina i kratka. Ali Poljska je godinama bila glavno prekrcajno mesto za oštećene automobile iz Zapadne Evrope, tako da ovde proveravamo istoriju rigoroznije nego bilo gde.'
          points:
            - Visok udeo obnovljenih posle udesa — geometrija karoserije je prioritet
            - 'Česte preprodaje: automobil može promeniti nekoliko vlasnika u godini'
            - Pređeni kilometri se često ispravljaju u fazi uvoza — proveravamo sa servisnim bazama
            - Kratka isporuka — jeftinija i brža nego iz Španije ili Portugala
      closing:
        eyebrow: Kako da počnemo?
        line1: Opisujte automobil,
        line2: koji tražite —
        accentWord: dodatno je naša briga
        text: Budžet, karoserija, menjač, nekoliko dodatnih želja. Mi tražimo, a vi gledate izveštaje o opcijama i odlučujete koja da se pregleda uživo.
