    vehicle-inspection:
      title: Provera automobila
      description: Nezavisna provera automobila pre kupovine. Dolazak stručnjaka, dijagnostika, izveštaj — bez obaveze kupovine.
      ctaLabel: Zatražite proveru
      casesHeading: Slučajevi provere
      breadcrumbLabel: Provera automobila
      steps:
        - n: '01'
          text: Karoserija i farba — prisustvo popravki ili saobraćajnih nesreća
        - n: '02'
          text: Sistem za upravljanje, suspenzija, kočnice
        - n: '03'
          text: Motor, menjač, transmisija
        - n: '04'
          text: Elektronika i istorija servisiranja po VIN broju
