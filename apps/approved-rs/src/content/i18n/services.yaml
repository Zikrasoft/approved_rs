          lead: 'La importación desde España es preferida por el estado de la carrocería: clima suave y casi sin reactivos. Sin embargo, la distancia es un inconveniente: es el doble de largo que el trayecto alemán, y esto se nota en el presupuesto.'
          points:
            - El trayecto es más largo que el alemán, el transporte en camión es a menudo más rentable que conducir
            - Dar de baja (baja) toma más tiempo que en Alemania
            - El certificado EUR1 debe ser gestionado por el vendedor antes de la compra, después es más complicado
            - Verificamos los coches de la costa por corrosión oculta antes del envío
