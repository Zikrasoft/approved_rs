      title: Autopodbor pod ključ
      descriptionFor: Pronaći ćemo automobil {location} — među onima koji su već u ovoj zemlji, bez uvoza iz inostranstva. Potpuna provera, pratnja tokom transakcije i isporuka do vašeg grada.
      ctaLabel: Ostavite zahtev
      casesHeadingFor: 'Stvarni poslovi: autopodbor {location}'
      breadcrumbLabelFor: Auto {location}
      stepsFor:
        - n: '01'
          text: Ostavite zahtev sa zahtevima — budžet, marka, kilometraža
        - n: '02'
          text: Tražimo opcije {location} prema vašim kriterijumima
        - n: '03'
          text: Nezavisni stručnjak pregledava i proverava automobil
        - n: '04'
          text: Pratimo transakciju, pomažemo sa dokumentima i registracijom
        - n: '05'
          text: Donosimo auto do vašeg grada i pomažemo da se registruje
      deliveryLineFor: Isporuka automobila u bilo koji grad u zemlji. Ako treba izvesti van granica, preuzimamo izvoz i carinjenje — vozimo u {destinations} i u svaku drugu zemlju.
      deliveryDestinations:
        - Bosnu i Hercegovinu
        - Hrvatsku
        - Severnu Makedoniju
        - Tursku
        - Kazahstan
        - Kirgistan
      citiesHeadingFor: Gde gledamo automobile {countryLocation}
      citiesLead: Stručnjak izlazi po celoj zemlji, ali najčešće gledamo automobile tamo gde ih ima najviše. Evo šta to znači za svaki grad.
      alsoInLabel: 'Takođe biramo u:'
      crossSellLabel: Treba vam automobil iz inostranstva?
      countryNotesHeadingFor: Šta uzimamo u obzir {location}
      countryNotesPointsLabel: Na šta prvo obraćamo pažnju
      countryNotes:
        de:
          lead: 'Izbor je ovde veći nego na bilo kojem drugom tržištu Evrope, a istorija servisiranja se obično prati: većina automobila ima servisnu knjigu sa beleškama dilera o svakom servisu. Loša strana su dugi kilometraže. Dvestotine hiljada za tri godine je ovde norma, a ne razlog za popust.'
          points:
            - Servisna knjiga i oznake dilera — proveravamo po VIN-u kod zvaničnog servisera
            - Protokol HU, koji svi zovu TÜV — čitamo primedbe iz prošle provere, a ne samo pečat
            - 'Automobili iz lizinga i korporativnih garaža: servisirani pravilno, ali sa dugim kilometražama'
            - Zimski putevi sa reagensima — dno i pragovi se gledaju posebno
        rs:
          lead: Ovde smo na licu mesta, pa pregledamo auto na dan zahteva i bez uvoza. Tržište je malo, isti auto prolazi kroz nekoliko prodavaca, a istoriju je teško razapeti.
          points:
            - Auto je već carinjen i ima lokalne tablice — takse i uvoz nisu potrebni
            - Kilometraža se često menja prilikom preprodaje unutar zemlje — proveravamo sa beleškama tehničkog pregleda
            - Mnogi automobili uvezeni iz Nemačke i Italije — proveravamo šta je bilo sa autom tokom uvoza
            - Pregled na dan zahteva, bez čekanja na logistiku
        es:
          lead: Blaga zima i gotovo bez reagenasa na putevima, pa su donji delovi španskih automobila obično znatno bolji od nemačkih. Ipak, sunce i blizina mora utiču na boju, plastiku i svu gumu.
          points:
            - Obala — koroziju tražimo pre svega u skrivenim prostorima
            - Ispucali lak i oštećen plastični enterijer — uračunavamo u cenu
            - 'Puno bivših iznajmljenih automobila: ravna kilometraža, ali rigorozna upotreba'
            - ITV protokol — upoređujemo primedbe i datume pregleda
        ch:
          lead: 'Švajcarski automobili su uočljivo bolje očuvani od proseka u Evropi: skupa održavanja disciplinuju, pređeni kilometri su mali. Ali Švajcarska nije deo EU, pa se uvoz obavlja drugačije, na to računamo unapred.'
          points:
            - Bogati paketi opreme — ovde su ih uzimali češće nego u susedstvu
            - MFK — pregled je strog, priprema se ozbiljno, i to se vidi na automobilu
            - 'Nije u EU: carina i dokumentacija se ne obrađuju kao za zemlje Evropske unije'
            - Cene su više od tržišnih, ali se kasnije štedi na popravkama
        pt:
          lead: Tržište je malo, izbor je skromniji nego u Španiji, ali je konkurencija za dobar automobil niža. Klima je vlažna i slana — morska korozija se javlja čak i na novim automobilima.
          points:
            - Vlažnost i more — skrivene šupljine i elektrika su prioritet pregleda
            - 'Malo tržište: za određeni upit tražimo duže nego u Nemačkoj'
            - IPO protokol — čitamo primedbe s prethodnih pregleda
            - Puno dizel automobila i mali automobili, veći karoseriji se retko nalaze
        fr:
          lead: Francuska je pre svega dizel i domaće marke. Peugeot, Renault i Citroën su ovde jeftiniji nego gde god u Evropi. Nemački premijum je, naprotiv, skuplji, i nema smisla uzimati ga ovde.
          points:
            - Francuske marke — najbolja cena u Evropi, a održavanje je jeftinije
            - Dizeli — proveravamo filter čestica i EGR ventil kao posebnu stavku
            - Contrôle technique — protokoli su detaljni, upoređujemo primedbe po godinama
            - 'Gradska upotreba: clutch i oslanjanje se brže troše nego što je navedeno'
        it:
          lead: 'Italijansko tržište je dobro za male automobile i retke opreme, ali zahteva oprez: automobili se ovde koriste intenzivno, a mali karoserijski popravci se ne rade uvek pažljivo.'
          points:
            - Grad — česti sitni udarci i prefarbavanja, merni uređaj za debljinu je obavezan
            - Jug i obala donose so i koroziju, sever je bliži nemačkim uslovima
            - Revisione — proveravamo redovnost, propusti su češći nego obično
            - Puno automobila sa plinskom opremom — proveravamo ih odvojeno
        pl:
          lead: 'Najveće tržište blizu nas: logistika je jeftina i kratka. Ali Poljska je godinama bila glavni terminal za oštećene automobile iz Zapadne Evrope, pa ovde proveravamo istoriju striktno nego bilo gde drugde.'
          points:
            - Visok udeo automobila obnovljenih posle udesa — geometrija karoserije je prioritet
            - 'Česte preprodaje: automobil često menja nekoliko vlasnika tokom godine'
            - Pređeni kilometri se često koriguju prilikom uvoza — poređujemo sa servisnim bazama
            - Kratka dostava — jeftinije i brže nego iz Španije ili Portugala
      closing:
        eyebrow: Odakle da počnemo?
        line1: Opisujete automobil,
        line2: koji tražite, —
        accentWord: dalje naša stručnost
        text: Budžet, karoserija, menjač, par želja na vrhu. Mi tražimo, a vi gledate izveštaje o opcijama i odlučujete koji želite da vidite uživo.
