translations:
  en:
    vehicle-sourcing:
      hub:
        metaTitle: Car Sourcing in Europe Made Easy
        metaDescription: 'We source cars in Germany, Serbia, Spain, Switzerland, Italy, France, Poland, and Portugal: search, inspection, negotiation, and delivery handled for you.'
        title: Car Sourcing
        titleHighlight: Made Easy
        description: We find a vehicle in the country you’re in or where you plan to purchase — complete verification, transaction support, and delivery handled for you. Select a country to see the details.
        breadcrumbLabel: Car Sourcing
        casesHeading: Car Sourcing Cases
        chooseCountryLabel: 'Select a country:'
        ctaLabel: Find a car
        heroPhotoAlt: A row of vehicles at a dealer's lot
        processHeading: How the Sourcing Works
        processLead: "From your request to handing over the keys typically takes between three days and two weeks. The longest part of the process is finding the right car: we don't settle for the first suitable option and keep looking until we find one that passes all the checks."
        processSteps:
          - n: '01'
            text: Discuss budget, make, and requirements — what matters, and what can be sacrificed.
          - n: '02'
            text: Select options locally and filter out everything that doesn't meet the criteria over the phone.
          - n: '03'
            text: Inspect with a paint thickness gauge and scanner, connect to BMW’s dealer ISTA, take photos and videos.
          - n: '04'
            text: Send a report and clearly state whether it’s worth buying or if we should keep looking.
          - n: '05'
            text: Negotiate, complete the deal, and deliver the car to you or transport it to your door.
        includedHeading: What’s Included
        includedLead: The commission is fixed before we start and doesn’t depend on how many cars had to be inspected. If we say ‘don’t buy’ after the inspection, we continue to search without any additional costs.
        included:
          - title: Unlimited options search
            text: We work until we find a car that meets your standards. Turning down an unsuitable option is part of the service and incurs no extra charge.
          - title: Expert inspection for each visit
            text: Paint thickness gauge, scanner for modules, lift where needed. Photos and videos of all problematic areas — you see what we see.
          - title: Due diligence and verification
            text: CarVertical report by VIN, dealer service history by make, mileage verification, liens, registration restrictions, and unresolved insurance events.
          - title: Negotiation and deal finalization
            text: We negotiate the price based on our findings, prepare documents, and assist with signing.
          - title: Delivery and registration assistance
            text: We transport the car to your city and help with local registration — or we hand over the keys wherever is convenient for you.
          - title: One point of contact throughout the process
            text: You work with the same specialist who conducted the inspections. No need to re-explain your needs to each person who answers the phone.
        compareHeading: How Markets Differ
        compareLead: The same model in Germany and Poland — in terms of history and price, they are two different cars.
        compareHint: Choose a country — we’ll show you what we examine there first.
        compareLinkFor: Sourcing in {location} — detailed overview
      title: Complete Car Sourcing
      descriptionFor: We’ll find a car in {location} — from vehicles already in this country, without importing from abroad. Complete verification, transaction support, and delivery to your city — all handled for you, including customs clearance.
      ctaLabel: Submit a Request
      casesHeadingFor: 'Cases: Car Sourcing in {location}'
      breadcrumbLabelFor: Cars in {location}
      stepsFor:
        - n: '01'
          text: Submit a request with your requirements — budget, make, mileage.
        - n: '02'
          text: Search for options in {location} based on your criteria.
        - n: '03'
          text: An independent expert inspects and verifies the vehicle.
        - n: '04'
          text: Assist in the transaction, help with documents and paperwork.
        - n: '05'
          text: Deliver the vehicle to your city — all handled for you, including customs clearance.
      deliveryLineFor: We deliver to {destinations} — and any other country, we can discuss during the request.
      deliveryDestinations:
        - Russia
        - Kazakhstan
        - Kyrgyzstan
        - Ukraine
        - Belarus
        - Bosnia and Herzegovina
        - Croatia
        - North Macedonia
        - Turkey
      citiesHeadingFor: Where We Inspect Cars in {countryLocation}
      citiesLead: The expert travels throughout the country, but we usually inspect cars where they are most commonly listed. Here’s what this means for each city.
      alsoInLabel: 'We also source in:'
      crossSellLabel: Need a car from outside the local market?
      countryNotesHeadingFor: What We Consider in {location}
      countryNotesPointsLabel: What We Look For First
      countryNotes:
        de:
          lead: 'The selection here is greater than in any other European market, and service history is usually traceable: most cars have a service booklet with dealer stamps for each maintenance. The downside is highway mileages. Two hundred thousand kilometers in three years is normal here, not a reason for a discount.'
          points:
            - Service booklet and dealer stamps — we verify by VIN at official service centers.
            - HU protocol, known as TÜV — we read the notes from the last inspection, not just the stamp.
            - 'Leased vehicles and corporate fleets: well-maintained, but high mileages.'
            - Winter roads with de-icing agents — we inspect undercarriages and thresholds separately.
        rs:
          lead: We are on the ground here, so we inspect the car on the day of inquiry without needing to import. The market is small, the same car often changes hands multiple times, and we have to unravel history.
          points:
            - The car is already customs cleared and has local plates — no duties or import paperwork required.
            - Mileage is often tampered with during resale within the country — we verify with technical inspection records.
            - Many cars imported from Germany and Italy — we check what happened to the vehicle before import.
            - Inspection on the day of inquiry, without waiting for logistics.
        es:
          lead: Mild winters and almost no de-icing agents on the roads typically mean that the undercarriage of Spanish cars is noticeably better than German ones. However, the sun and proximity to the sea affect paint, plastic, and rubber components.
          points:
            - On the coast — we look for corrosion primarily in hidden cavities.
            - Faded lacquer and cracked plastic interior — we factor this into the cost.
            - 'Many former rental cars: consistent mileage, but harsh usage.'
            - ITV protocol — we verify notes and inspection dates.
        ch:
          lead: 'Swiss cars are remarkably well-maintained compared to the European average: expensive upkeep instills discipline, and mileages are low. However, Switzerland is not in the EU, so import procedures are different, and we factor this into the budget up front.'
          points:
            - High-end trims — these are more common here than in neighboring countries.
            - MFK — inspections are strict; cars are well-prepared for these, and it shows.
            - 'Not in the EU: customs and paperwork are handled differently than for EU countries.'
            - Prices are higher than the market average, but you'll save on repairs later.
        pt:
          lead: The market is small, with a more limited selection than Spain, but competition for good cars is also lower. The climate is humid and salty — coastal corrosion can affect even newer cars.
          points:
            - Humidity and the sea — hidden cavities and electrical systems are prioritized in inspections.
            - 'Small market: we may search longer for a specific request than in Germany.'
            - IPO protocol — we read notes from previous inspections.
            - Many diesels and small cars; larger vehicles are rare.
        fr:
          lead: France is primarily about diesel engines and local brands. Peugeot, Renault, and Citroën are cheaper here than anywhere else in Europe. In contrast, German premium brands are more expensive, making it less sensible to buy them here.
          points:
            - French brands — the best prices in Europe, with cheaper maintenance.
            - Diesels — we check the particulate filter and EGR valve as a separate item.
            - Contrôle technique — detailed protocols, we verify comments over the years.
            - 'Urban usage: clutches and suspensions wear out faster than advertised.'
        it:
          lead: 'The Italian market is good for small cars and rare trims, but it requires caution: cars are usually heavily used, and minor bodywork repairs aren’t always done neatly.'
          points:
            - Urban areas — frequent minor hits and touch-ups, a paint thickness gauge is essential.
            - Coastal areas and the south lead to salt and rust; the north aligns more with German conditions.
            - Revisione — we check consistency, as lapses are more frequent than usual.
            - Many cars with gas systems — we inspect these separately.
        pl:
          lead: 'The nearest large market to us: logistics are cheap and short. However, Poland has been a major transit point for damaged cars from Western Europe for years, so we check the vehicle history here more rigorously than anywhere else.'
          points:
            - A high percentage of vehicles are restored after accidents — we prioritize body geometry checks.
            - 'Frequent resales: a car can change several owners within a year.'
            - Mileage is often adjusted during the import stage — we verify with service databases.
            - Short delivery distance — cheaper and faster than from Spain or Portugal.
      closing:
        eyebrow: How Shall We Begin?
        line1: Describe the car you are looking for,
        line2: and we'll take it from there —
        accentWord: the rest is our job
        text: Your budget, body type, transmission preferences, and a few wishes on top. We search, and you review the reports on options and decide which one to see in person.
    vehicle-buyback:
      hub:
        metaTitle: Buyback of cars with Russian plates in Europe
        metaDescription: We buy cars with Russian plates in any European country and cars with Serbian plates in Serbia. Get a quote from photos within an hour and payment on the day of signing.
        title: Car Buyback
        titleHighlight: no haggling for weeks
        description: 'We take your car that is difficult to sell the traditional way: Russian plates, expired import, unclear documents. The price is below market value — this is the cost of speed and for handling all the hassles of the sale.'
        breadcrumbLabel: Car Buyback
        casesHeading: Buyback Cases
        chooseCountryLabel: 'Select a country:'
        ctaLabel: Get a Quote
        heroPhotoAlt: Car keys on money and documents
        processHeading: How the buyback works
        processLead: From the first message to payment usually takes two to three days, most of which is just traveling to the meeting spot. We'll provide a photo estimate within an hour.
        processSteps:
          - n: '01'
            text: Send us photos, documents, and an honest description of the condition.
          - n: '02'
            text: We will quote a price within an hour — a final price, no range.
          - n: '03'
            text: We agree on a meeting location where the car is; if it’s not drivable, we’ll come with a trailer.
          - n: '04'
            text: We inspect the car in person and confirm the price if the description matches.
          - n: '05'
            text: We sign the contract, and payment is made on the day of signing.
        includedHeading: What We Handle
        includedLead: For the difference between our price and the market rate, we take care of everything that makes such a car unsellable for months.
        included:
          - title: Cars with Russian plates
            text: Main category. The car can be in any European country—we will come to where it is, and we handle the export and resale ourselves.
          - title: Import and timing issues
            text: After signing, the expired temporary import and associated risks are transferred to us.
          - title: Estimation without inspection
            text: We quote a price based on photos and documents. We only come when both parties agree on the amount.
          - title: Deal processing
            text: We prepare the contract, deregistration, and all paperwork. From you — the car documents and signature.
          - title: Payment on the day of signing
            text: We transfer funds the same day. We don’t have schemes with installments or 'we’ll pay later after resale'.
          - title: Honest refusal
            text: If the car doesn’t suit us, we’ll let you know right away and explain why. We won't string you along or try to lower the price as we go.
      title: Car Buyback
      ctaLabel: Get a Quote
      casesHeading: Buyback Cases
      breadcrumbLabel: Car Buyback
      descriptionSerbia: We buy cars with Russian plates below market value — the car can be in any European country. We also purchase cars with Serbian plates in Serbia and Montenegro. Online evaluation, processing in 1 day, payment on the deal day.
      descriptionOtherFor: We buy cars with Russian plates below market value — the car can be in any European country, including {name}. Online evaluation, processing in 1 day, payment on the deal day.
      serbiaLinkLabel: Car with Serbian plates?
      step1: Send photos and description of the car
      step2: We evaluate online based on photos within 1 hour — below market price
      step3Serbia: Meet for inspection — Russian plates (in any European country) or Serbian plates (Serbia, Montenegro)
      step3Other: Meet for inspection — Russian plates, the car can be in any European country
      step4: Process the deal, payment on the day of signing
      closing:
        eyebrow: Want a quote?
        line1: Send us photos
        line2: and documents —
        accentWord: the price will be in an hour
        text: The evaluation is free and comes with no obligation. If you’re not satisfied with the price, we part ways without pressure or follow-up calls.
    vehicle-import:
      hub:
        metaTitle: Importing Cars from Europe and China Made Easy
        metaDescription: We bring cars from Germany, Spain, Switzerland, and China to any country — selection, inspection, delivery, and customs clearance, all done for you.
        title: Car Import
        titleHighlight: from Europe and China
        description: The car is in Europe or China, and you’re anywhere else. We select, inspect, and bring it to you with everything taken care of, including customs clearance.
        breadcrumbLabel: Car Import
        casesHeading: Import Cases
        euCardTitle: From Europe
        euCardText: Spain, Switzerland, and other countries — selection and delivery to any destination.
        chinaCardTitle: From China
        chinaCardText: New and used cars from China — delivered through a trusted partner.
        exploreLabel: Learn More
        ctaLabel: Calculate Import Costs
        heroPhotoAlt: Car transporter loaded with vehicles
        processHeading: Import Process
        processLead: Typically, it takes four to eight weeks from application to receiving the license plates, with travel time being the least of the concerns. From Germany to Belgrade, the car takes a few days, while customs and registration can take weeks.
        processSteps:
          - n: '01'
            text: We calculate the total cost before you start — car, logistics, duties, and paperwork.
          - n: '02'
            text: We find and inspect the car in the country of origin.
          - n: '03'
            text: We purchase the car through our European company, deregister it, and prepare export documents.
          - n: '04'
            text: We transport it via car transporter or self-driving with transit plates.
          - n: '05'
            text: We clear customs, register the vehicle, and hand you the keys.
        includedHeading: What’s Included in the Price
        includedLead: 'When importing a car yourself, the budget often gets exceeded due to additional costs beyond the car price. We calculate this in advance and fix it: the final amount should not exceed the initial estimate.'
        included:
          - title: Cost of the Car
            text: The price after negotiations, not the listed price. We negotiate with the seller based on the car you inspect — this usually covers some of the costs.
          - title: Logistics to Your Location
            text: Car transporter or self-driving with transit plates. We calculate both options and choose the more cost-effective for your specific route.
          - title: Duties and Taxes
            text: The rate depends on the country of origin and the car's age. For European manufactured cars, the EUR1 certificate significantly impacts the calculations — we check its availability before purchase.
          - title: Export and Transit
            text: Deregistration in the seller's country, export declaration, transit plates, and insurance for the drive.
          - title: Customs Clearance
            text: Declaration, broker, and payment upon arrival. We prepare the paperwork in advance so the car doesn't sit at the warehouse for extra days.
          - title: Registration
            text: Technical inspection, registration, and plates. You receive the car ready to drive immediately.
