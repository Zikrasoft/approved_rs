        included:
          - title: Pretraga bez ograničenja broja opcija
            text: Radimo dok ne pronađemo auto bez primedbi. Odbijanje neuspelih opcija je deo usluge i ne košta dodatno.
          - title: Izlazak stručnjaka na svaku proveru
            text: Mjerač debljine po panelima, skener po blokovima, dizalica gde je potrebna. Fotografije i video sa svih problematičnih mesta — vidite isto što i mi.
          - title: Provera istorije i pravne čistote
            text: Izveštaj CarVertical po VIN-u, dilerska servisna istorija po marki, provera kilometraže, zalozi, ograničenja na registraciju i neizmirena osiguravajuća događanja.
          - title: Pregovaranje i završavanje transakcije
            text: Dogovaramo cenu uzimajući u obzir pronađeno, pripremamo dokumente i pratimo potpisivanje.
          - title: Dostava i registracija
