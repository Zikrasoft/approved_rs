      citiesHeadingFor: Gde gledamo automobile {countryLocation}
      citiesLead: Stručnjak izlazi po celoj zemlji, ali najčešće gledamo automobile gde ih najviše izlažu. Ovo su značaji za svaki grad.
      alsoInLabel: 'Takođe nabavljamo u:'
      crossSellLabel: Treba vam automobil koji nije lokalni?
      countryNotesHeadingFor: Šta uzimamo u obzir {location}
      countryNotesPointsLabel: Na šta prvo obraćamo pažnju
      countryNotes:
        de:
          lead: 'Izbor ovde je veći nego na bilo kojem drugom tržištu u Evropi, a istorija održavanja obično se lako prati: većina automobila ima servisnu knjigu sa beleškama dilera o svakom servisiranju. Negativna strana su visoki kilometraži. Dvesta hiljada u tri godine ovde je norma, a ne razlog za popust.'
          points:
            - Servisna knjiga i beleške dilera — proveravamo po VIN kod zvaničnog servisa
            - Protokol HU, kojeg svi zovu TÜV — čitamo zabeleške prethodnog pregleda, a ne samo pečat
            - 'Automobili iz leasinga i korporativnih flota: redovno servisirani, ali sa visokim kilometražama'
            - Zimski putevi sa reagensima — donji deo i pragove proveravamo posebno
        rs:
          lead: Ovde smo na mestu, tako da pregledamo automobil na dan zahteva i bez uvoza. Tržište je malo, isti automobil pređe kroz više prodavaca, a istoriju treba odvijati.
          points:
            - Automobil je već carinjen i ima lokalne registarske tablice — takse i procedura uvoza nisu potrebni
            - Kilometraža se često prepravlja prilikom preprodaje unutar zemlje — proveravamo sa beleškama tehničkog pregleda
            - Mnogi automobili su uveženi iz Nemačke i Italije — proveravamo šta je bilo s automobilom pre uvoza
            - Pregled na dan zahteva, bez čekanja na logistiku
        es:
          lead: Blaga zima i skoro bez reagenata na putevima, tako da donji deo španskih automobila obično izgleda znatno bolje nego kod nemačkih. Međutim, sunce i blizina mora utiču na boju, plastiku i sve gume.
          points:
            - Obala — tragamo za korozijom pre svega u skrivenim šupljinama
            - Izbleđena lak i napuknuta plastika enterijera — uračunavamo u cenu
            - 'Mnogi prethodni iznajmljeni automobili: ravna kilometraža, ali stroga eksploatacija'
            - Protokol ITV — proveravamo primedbe i datume provere
        ch:
          lead: 'Švajcarski automobili su očigledno bolje održavani od proseka u Evropi: skupa usluga disciplinuje, kilometraže su male. Ali Švajcarska nije u EU, tako da se uvoz reguliše drugačije, što uključujemo u budžet unapred.'
          points:
            - Bogate opreme — ovde su ih češće uzimali nego kod komšija
            - MFK — provere su stroge, na to se ozbiljno pripremaju, i to se vidi na automobilu
            - 'Nije u EU: carina i dokumentacija se ne obrađuju kao za zemlje Evropske unije'
            - Cena viša od tržišne, ali štedite kasnije na popravkama
        pt:
          lead: Tržište je malo, izbor je skromniji nego u Španiji, ali i konkurencija za dobar automobil je manja. Klima je vlažna i slana — morska korozija se sreće čak i na novim automobilima.
          points:
            - Vlažnost i more — skriveni prostori i elektrika su prioritet pregleda
            - 'Malo tržište: tražimo duže za konkretan zahtev nego u Nemačkoj'
            - Protokol IPO — čitamo primedbe prethodnih pregleda
            - Mnogi dizel i mali automobili, veći tipovi se retko sreću
        fr:
          lead: Francuska je pre svega dizel i domaće marke. Peugeot, Renault i Citroën su ovde jeftiniji nego bilo gde u Evropi. Nemački premium je, naprotiv, skuplji, i nema smisla uzimati ga ovde.
          points:
            - Francuske marke — najbolja cena u Evropi, a održavanje je jeftinije
            - Dizeli — filter čađe i EGR ventil proveravamo kao posebnu stavku
            - Contrôle technique — protokoli su detaljni, proveravamo primedbe po godinama
            - 'Gradska upotreba: kvačilo i ovjes se brže troše nego što je deklarisano'
        it:
          lead: 'Italijansko tržište je dobro za male automobile i retke opreme, ali zahteva oprez: automobili se ovde intenzivno koriste, a manji karoserijski popravci se ne rade uvek pažljivo.'
          points:
            - Grad — česti manji udarci i prefarbavanja, mikrometar je obavezan
            - Jug i obala donose so i koroziju, sever bliže nemačkim uslovima
            - Revisione — proveravamo redovnost, propusti su češći nego obično
            - Mnogi automobili sa plinskim uređajem — proveravamo ga posebno
        pl:
          lead: 'Najveće tržište blizu nas: logistika je jeftina i brza. Ali Poljska je godinama bila glavno mesto preprodaje oštećenih automobila iz Zapadne Evrope, pa ovde istoriju proveravamo rigoroznije nego bilo gde drugo.'
          points:
            - Visok udeo automobila obnovljenih posle nesreća — fokus na geometriji karoserije
            - 'Česta preprodaja: auto često menja nekoliko vlasnika tokom godine'
            - Kilometraža se često prepravlja u fazi uvoza — proveravamo sa servisnim bazama
            - Kratka dostavna ruta — jeftinije i brže nego iz Španije ili Portugala
      closing:
        eyebrow: Odakle počinjemo?
        line1: Opisujte automobil,
        line2: koji tražite —
        accentWord: dalje je naš posao
        text: Budžet, karoserija, menjač, nekoliko želja. Mi tražimo, a vi gledate izveštaje o opcijama i odlučujete koju da pogledate uživo.
