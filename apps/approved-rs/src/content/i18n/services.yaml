    vehicle-import:
      hub:
        metaTitle: Importación de coches de Europa y China llave en mano
        metaDescription: 'Importamos automóviles de Alemania, España, Suiza y China a cualquier país: selección, verificación, entrega y desaduanado llave en mano.'
        title: Importación de coches
        titleHighlight: de Europa y China
        description: El coche está en Europa o China, y tú estás en cualquier lugar. Seleccionamos, verificamos y lo traemos a ti llave en mano, incluyendo el desaduanado.
        breadcrumbLabel: Importación de coches
        casesHeading: Casos de importación
        euCardTitle: De Europa
        euCardText: 'España, Suiza y otros países: selección y entrega a cualquier lugar.'
        chinaCardTitle: De China
        chinaCardText: 'Coches nuevos y usados de China: entrega a través de un socio de confianza.'
        exploreLabel: Más detalles
        ctaLabel: Calcular importación
        heroPhotoAlt: Transporte de automóviles con coches cargados
        processHeading: Cómo se realiza la importación
        processLead: Generalmente, desde la solicitud hasta la matriculación pasan de cuatro a ocho semanas, y el tiempo de transporte es lo que menos dura de este plazo. Un coche va desde Alemania a Belgrado en pocos días, pero la aduana y el registro pueden tardar semanas.
        processSteps:
          - n: '01'
            text: 'Calculamos el coste total antes de comenzar: coche, logística, impuestos, documentación.'
          - n: '02'
            text: Encontramos y verificamos el coche en el país de origen.
          - n: '03'
            text: Compramos el coche con nuestra empresa europea, lo desmatriculamos y preparamos los documentos de exportación.
          - n: '04'
            text: Transportamos el coche en un camión o por su propio medio con matrículas de tránsito.
          - n: '05'
            text: Pasamos la aduana, registramos el coche y te entregamos las llaves.
        includedHeading: Componentes del precio
        includedLead: 'En la importación por cuenta propia, el presupuesto se suele desbordar por los costes añadidos al precio del coche. Lo calculamos de antemano y lo fijamos: el resultado no debe diferir del primer cálculo.'
        included:
          - title: Precio del coche
            text: El precio después de negociar, no el de la publicación. Negociamos con el coche en mano durante la inspección, lo cual normalmente compensa parte de los gastos.
          - title: Logística hasta el destino
            text: Transporte en camión o traslado con matrículas de tránsito. Calculamos ambas opciones y elegimos la más rentable para cada trayecto.
          - title: Impuestos y aranceles
            text: 'La tarifa depende del país de origen del coche y de su antigüedad. Para los coches de fabricación europea, el certificado EUR1 cambia fundamentalmente el cálculo: comprobamos su disponibilidad antes de la compra.'
          - title: Exportación y tránsito
            text: Desmatriculación en el país del vendedor, declaración de exportación, matrículas de tránsito y seguro durante el traslado.
          - title: Trámites aduaneros
            text: Declaración, intermediario y pago en el punto de llegada. Preparamos el paquete por adelantado para que el coche no esté almacenado innecesariamente.
          - title: Matriculación
            text: Inspección técnica, registro y matrículas. Recoges el coche y puedes salir inmediatamente.
