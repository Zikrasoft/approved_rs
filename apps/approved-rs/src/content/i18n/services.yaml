    vehicle-inspection:
      title: Provera auta
      description: Nezavisna provera automobila pre kupovine. Dolazak eksperta, dijagnostika, izveštaj — bez obaveze kupovine.
      ctaLabel: Naruci proverenje
      casesHeading: 'Stvarne transakcije: provera pre kupovine'
      breadcrumbLabel: Provera auta
      steps:
        - n: '01'
          text: Karoserija i lak — prisutnost popravki ili udesa
        - n: '02'
          text: Hodna, suspenzija, kočnice
        - n: '03'
          text: Motor, menjač, transmisija
        - n: '04'
          text: Elektronika i istorija servisa po VIN
        - n: '05'
          text: Pravna čistoća — založno pravo, zabrana registracije, udes
      extraLine: Radimo i u drugim zemljama Evrope, uključujući Portugal, — proverite prilikom prijave.
      hub:
        metaTitle: Provera auta pre kupovine u Evropi
        metaDescription: 'Dolazimo do automobila koji ste sami pronašli: merač debljine, skener, provera istorije po VIN i izveštaj sa fotografijama istog dana. Radimo u osam zemalja Evrope.'
        title: Provera auta
        titleHighlight: pre kupovine
        description: 'Dolazimo do automobila koji ste sami pronašli i govorimo vam šta je sa njim u stvarnosti. Izveštaj dolazi pre nego što predate novac: ako je odgovor „ne kupujte“, gubite samo cenu provere.'
        breadcrumbLabel: Provera auta
        casesHeading: 'Stvarne transakcije: provera pre kupovine'
        chooseCountryLabel: 'Izaberite zemlju:'
        ctaLabel: Naruci proverenje
        heroPhotoAlt: Automobil na dizalici u servisu
        processHeading: Kako prolazi provera
        processLead: Obično dolazimo u roku od jednog do dva dana nakon prijave. Sam pregled traje sat i po do dva, izveštaj šaljemo istog dana, dok auto još nije otišao drugom kupcu.
        processSteps:
          - n: '01'
            text: Šaljete link na oglas i kontakt podatke prodavca
          - n: '02'
            text: Dogovaramo se sa prodavcem o vremenu i mestu pregleda
          - n: '03'
            text: Dolazimo sa meračem debljine i skenerom, za BMW povezujemo se na dealerski ISTA, ako je potrebno — na dizalicu
          - n: '04'
            text: Pravimo fotografije i video snimke svih nalaza, proveravamo istoriju po VIN
          - n: '05'
            text: Šaljemo izveštaj i direktan odgovor — uzeti, pregovarati ili odustati
        includedHeading: Šta je uključeno u provere
        includedLead: 'Preko stotinu stavki na kontrolnoj listi, ali gotovo uvek odlučuju četiri zone: karoserija, motor sa menjačem, hodna i dokumenti. Upravo po njima često odvajamo od kupovine.'
        included:
          - title: Karoserija i lak
            text: Merač debljine po svakoj ploči, geometrija prozora, tragovi zavarivanja i kitovanja. Vidljivo je da li je bilo popravki o kojima prodavac nije spomenuo.
          - title: Motor i menjač
            text: Parametri na zagrejanom motoru, adaptacije menjača, greške u memoriji blokova. Najskuplja zona i najčešći razlog za odbijanje.
          - title: Hodna i kočnice
            text: Igranja, stanje suspenzije i kočionog sistema. Auto-motor je u velikoj meri različit od onih na balkanskim putevima, i to se primećuje.
          - title: Elektronika i istorija po VIN
            text: Izveštaj CarVertical, istorija servisa po markama, razlika u pređenim kilometrima s istorijom, greške blokova i tragovi aktiviranih vazdušnih jastuka.
          - title: Pravna čistoća
            text: Zalog, zabrana registracije, nerešeni udesi i osiguravajući događaji — sve to ispliva posle kupovine.
          - title: Izveštaj sa fotografijama i video zapisima
            text: Svaki nalaz je snimljen i potpisan. Izveštaj ostaje kod vas — olakšava pregovaranje, čak i ako se ipak odlučite za kupovinu.
        compareHeading: Šta se menja od zemlje do zemlje
        compareLead: Propisi tehničkog pregleda, uobičajeni problemi lokalnih automobila i načini skrivanja istorije posvuda.
        compareHint: Izaberite zemlju — pokazaćemo šta dodajemo u običan kontrolni spisak.
        compareLinkFor: Provera {location} — detaljno
        mapHeading: Četiri oblasti koje odlučuju o transakciji
        mapLead: Kontrolni spisak je dug, ali obično odustajemo zbog jedne od četiri oblasti. Kliknite na broj na mapi — pokazaćemo šta proverava stručnjak i šta smo tamo pronašli.
      countryNotesHeadingFor: Kako proveravamo {location}
      countryNotesPointsLabel: Šta proveravamo iznad običnog kontrolnog spiska
      countryNotes:
        de:
          lead: 'U Nemačkoj imamo na šta da se oslonimo: servisna knjižica, protokoli HU i razvijene baze prema VIN-u. Zbog toga je provera ovde prvenstveno usklađivanje dokumenata sa onim što pokazuje automobil.'
          points:
            - Upoređujemo beleške iz dealer servisa sa očitavanjem na brojaču pređenih kilometara po godinama
            - Napomene prethodnog HU — šta su popravili nakon pregleda, a šta je samo odloženo
            - Dno vozila i pragovi nakon zimskih hemikalija, uključujući skrivene šupljine
            - 'Lizing prošlost: uredno održavanje kod velikog pređenog broja kilometara'
        rs:
          lead: 'U Srbiji dolazimo na dan kada se javite. Glavni zadatak je da obnovimo istoriju automobila pre uvoza: lokalni dokumenti pokazuju samo poslednji deo života vozila.'
          points:
            - Zemlja porekla i stanje vozila pre uvoza u Srbiju
            - Očitavanje na brojaču pređenih kilometara u poređenju sa oznakama tehničkog pregleda iz prethodnih godina
            - Popravke karoserije posle uvoza — češće i jeftinije nego u EU
            - 'Pravni deo: zalog i ograničenja za registraciju'
        es:
          lead: Španski automobili obično impresioniraju dnom, ali razočaravaju svim što pati od sunca i soli. Proveru pomeramo sa korozije sa dna na skrivene šupljine, elektriku i stanje enterijera.
          points:
            - Korozija u skrivenim šupljinama na obali — s donje strane može biti čista
            - Lak, brtvila i plastika nakon dugogodišnjeg sunca
            - 'Izlazna prošlost: upoređujemo pređene kilometre sa karakteristikom trošenja enterijera'
            - Protokol ITV i šta je ostalo otvoreno između pregleda
        ch:
          lead: Za MFK automobili se ozbiljno pripremaju, te svež protokol sam po sebi ne govori mnogo. Gledamo šta je tačno urađeno pre pregleda i šta živi svoj život od prošle godine.
          points:
            - Šta je zamenjeno neposredno pre MFK — nove delove na pozadini ostalih
            - Održavanje je skupo, pa proveravamo da li su odlagali propisano
            - Opremanje je bogato, ali proveravamo da li svaka opcija još uvek funkcioniše
            - 'Dokumenti za uvoz: Švajcarska nije EU, paket se razlikuje'
        pt:
          lead: 'Sve se ovde svodi na vlažnu morsku klimu. Proveru započinjemo s korozijom i elektronikom: najčešće kvari ono što živi u vlažnosti.'
          points:
            - Skrivene šupljine, lonžeroni i tačke pričvršćenja suspenzije
            - Oksidacija konektora i blokova — tipičan uzrok nestabilnih grešaka
            - Protokol IPO i učestalost prolaska
            - 'Dizeli sa gradskom eksploatacijom: filter za čestice i njegova istorija'
        fr:
          lead: 'U Francuskoj je detaljno contrôle technique, i to je dobra polazna tačka. Potom gledamo šta propisi ne hvataju: dvogodišnji resurs motora i istrošenost od gradskog saobraćaja.'
          points:
            - Zapažanja contrôle technique po godinama — šta se ponavlja iz pregleda u pregled
            - Filter čestica, EGR i turbina na dizel motorima
            - Kvačilo i suspenzija posle gustog gradskog ciklusa
            - 'Istorija za francuske marke: dostupni delovi, ali i njihova slaba mesta'
        it:
          lead: Italijanski automobili češće dolaze sa sitnim popravkama karoserije, urađenim brzo i jeftino. Na merenje debljine boje na panelima ovde odlazi znatno više vremena nego obično.
          points:
            - Merenje debljine boje na svim panelima — popravke nakon gradske upotrebe
            - 'Razlika između severa i juga: so na obali, uobičajeno trošenje u unutrašnjosti'
            - Plinska oprema, ako postoji — postavka i stanje rezervoara
            - Učestalost revisione i propušteni periodi
        pl:
          lead: Poljska je najveće prevozno tržište za oštećene automobile iz Zapadne Evrope. Zato prvo utvrđujemo šta se sa tom karoserijom radilo pre prodaje.
          points:
            - Geometrija otvora i tragovi zavarivanja — obnova posle ozbiljnog udesa
            - 'Istorija uvoza: odakle je automobil došao i u kakvom stanju'
            - Pređene kilometre upoređujemo sa evropskim servisnim bazama, brojaču ne verujemo
            - Vazdušni jastuci i njihovo aktiviranje u prošlosti
      closing:
        eyebrow: Pronašli ste automobil?
        line1: Pošaljite link
        line2: na oglas —
        accentWord: doći ćemo i pogledati
        text: Dolazimo za jedan do dva dana. Izveštaj sa fotografijama ostaje sa vama, čak i ako se nakon njega odreknete kupovine.
    cityVehicleSourcing:
      title: Autopodbor
      descriptionFor: Pronaći ćemo automobil {cityLocation} sa kompletnom proverom. Radimo po celoj regiji {countryName}.
      casesHeadingFor: Prave transakcije na tržištu {countryGenitiveOrName}
      whyCityHeadingFor: Zašto {cityName}
      reason1: Gledamo i dealer platforme, i privatne oglase
      reason2: Istoriju po VIN-u proveravamo pre odlaska na pregled
      reason3For: Naš ekspert {cityLocation}
      reason4Dekra: Provera DEKRA / TÜV na zahtev
      reason4Generic: Nezavisna tehnička ekspertiza na zahtev
      otherCitiesLabelFor: 'Drugi gradovi {countryLocation}:'
      cityNotesHeadingFor: Tržište automobila {cityLocation}
      cityNotesPointsLabel: Šta to donosi u praksi
      cityNotes:
        berlin:
          lead: 'U Berlinu je najveći izbor u Nemačkoj i raznovrsnost prodavaca. Tu se može naći sve: od vozila iz korporativnih parka sa potpunom istorijom, do preprodavaca iz Istočne Evrope.'
          points:
            - Ogroman izbor u svim segmentima, uključujući retke konfiguracije
            - Puno privatnih prodavaca – mogući su bolji dogovori nego kod dilera
            - 'Gradski ciklus: spojka i suspenzija se brže troše nego kod autobanskih automobila'
        munich:
          lead: 'Skupi grad sa skupljim automobilima. Premium segment ovde je veći nego bilo gde drugo u Nemačkoj, a prosečno stanje je bolje: o takvim automobilima se brinu.'
          points:
            - Jak premium segment, posebno BMW i Mercedes
            - Očuvani automobili sa potpunom dilerskom istorijom
            - Cene su iznad proseka u zemlji – ušteda dolazi od stanja
        hamburg:
          lead: Lučki grad i veliki logistički centar. Odatle je lako slati automobile dalje, a na tržištu se često nalaze sveži uvezeni automobili.
          points:
            - Luka je blizu – lakše i jeftinije organizovati transport
            - Puno automobila iz severnih oblasti sa street mileage
            - 'Vlažna morska klima: obratite pažnju na karoseriju i skrivene delove'
        dusseldorf:
          lead: Centar Severne Rajne-Vestfalije, najgušće naseljene savezne zemlje Nemačke. Pločice su blizu jedna drugoj, a do granice sa Holandijom i Belgijom je sat vožnje, pa redovno dolaze automobili na prodaju.
          points:
            - Za jedan izlet možemo pogledati nekoliko automobila – lokacije su blizu
            - 'Deo ponuda ima holandske i belgijske registracije: istoriju i dokumente proveravamo posebno'
            - Puno prodavaca i oni međusobno konkurišu – pregovaranje ide lakše
        belgrade:
          lead: Naša baza. U Beogradu izlazimo na provere automobila na dan zahteva, poznajemo lokalne prodavce i vidimo koja vozila su već dva meseca na oglasima.
          points:
            - Provera u danu zahteva, bez čekanja i logistike
            - Poznajemo lokalne lokacije i istoriju automobila koji se tu nalaze
            - Automobil je već carinjen – uvoz i dažbine nisu potrebni
        novi-sad:
          lead: Drugi po veličini grad Srbije i sat vožnje od Beograda. Tržište je manje, ali cene su obično mirnije nego u glavnom gradu, a automobili su ređe prolazili kroz više preprodaja.
          points:
            - Cene su niže od beogradskih uz uporedivo stanje
            - Manje preprodavaca, češće prvi vlasnici
            - Polazimo iz Beograda, nema dodatnih troškova za put
        pancevo:
          lead: Pančevo praktično ulazi u beogradsku aglomeraciju, pa provera ovde ne odskače od glavnog grada. Tržište je malo, ali su privatni oglasi zanimljiviji.
          points:
            - Dvadest minuta od Beograda – izlazimo isto tako brzo
            - Malo tržište sa pretežno privatnim prodavcima
            - Često je jeftinije nego u glavnom gradu uz isto stanje
        subotica:
          lead: 'Subotica se nalazi na granici sa Mađarskom, i to se odražava na tržištu: puno automobila uvezenih iz EU, i prodavaca koji se time stalno bave.'
          points:
            - Granično tržište – puno svežeg uvoza iz Evropske unije
            - Istoriju pre prometa proveravamo posebno pažljivo
            - Povoljna tačka ako planirate da vozite dalje na sever
        madrid:
          lead: 'Glavno tržište Španije: najveći izbor u zemlji i puno automobila iz korporativnih parka. Kontinentalna klima, pa morska korozija ovde je manja nego na obali.'
          points:
            - Najveći izbor u Španiji, uključujući korporativne automobile
            - Udaljeno od mora – karoserije su obično čistije nego kod obale
            - 'Vruće leto: plastiku, lak i klima proveravamo posebno'
        barcelona:
          lead: Sve zavisi od blizine mora. Automobili često izgledaju odlično s donje strane, ali zahtevaju pažnju na skrivene delove i elektriku.
          points:
            - 'More je blizu, zato proveravamo skrivene delove: često je čisto s donje strane, a iznutra ne'
            - Puno bivših iznajmljenih i karšering automobila
            - Luka je blizu, slanje morem se lakše organizuje
        zurich:
          lead: Cirih je najskuplje automobilskog tržišta regiona. Oprema ovde dolazi u maksimalnoj verziji, servisiraju se kod dilera, a prodaju pre nego što automobil postane star.
          points:
            - Maksimalna oprema i mali kilometraža
            - Dilerska služba – istorija gotovo uvek puna
            - Švajcarska nije u EU, uvoz se uređuje posebno
        geneva:
          lead: Ženeva se nalazi u frankofonoj oblasti Švajcarske, na samoj granici sa Francuskom. Francuskih marki na tržištu ima znatno više nego u nemačkom delu zemlje.
          points:
            - 'Mešovito tržište: švajcarsko stanje, francuski asortiman'
            - Granica sa Francuskom je blizu – ima se sa čime uporediti po ceni
            - 'Procedura je ista kao i širom Švajcarske: izvoz plus uvoz'
        paris:
          lead: 'Najveći izbor u Francuskoj dolazi uz najteže korišćenje: gust saobraćaj i uske parkinge ostavljaju tragove na karoseriji i suspenziji.'
          points:
            - Najveći izbor u Francuskoj, posebno francuskih marki
            - 'Gradski ciklus: spojka, suspenzija i manji oštećenja na karoseriji'
            - Puno dizelaša – čistač čestica i EGR proveravamo u prvom redu
        lyon:
          lead: Lion je mirniji od Pariza, i po cenama, i po stanju automobila. Autoput ka jugu je blizu, tako da se često nalaze automobili sa ravnim kilometrima.
          points:
            - Cene su niže od pariških uz uporediv izbor
            - Više ravnih kilometara, manje gradskog trošenja
            - Povoljna tačka za Italiju i Španiju, ako tražimo šire
        milan:
          lead: 'Poslovna prestonica Italije, i to je vidljivo na tržištu. Sever zemlje je bliži nemačkim uslovima: ceste su bolje, automobili su bolji nego na jugu.'
          points:
            - Najbolji izbor premium segmenta u Italiji
            - Sever – manje soli i korozije nego na jugu zemlje
            - 'Gust grad: merni uređaj za debljinu karoserije je obavezan'
        rome:
          lead: Veliko tržište sa veoma gustim urbanim saobraćajem. Sitna oštećenja ovde su norma i često se brzo popravljaju.
          points:
            - Mnogo malih automobila i vozila sa gasnim uređajem
            - Česta farbanja nakon kontakta u gradu — proveravamo svaku panelu
            - Južnije od Milana — klima je blaža, bliže moru
        warsaw:
          lead: Kroz Varšavu ulazi glavni uvoz iz Zapadne Evrope, a ovde je i najveći izbor u Poljskoj. Udeo obnovljenih automobila je takođe najviši.
          points:
            - Najveći izbor u Poljskoj, mnogo svežeg uvoza iz EU
            - Geometriju karoserije i tragove popravke proveravamo prvo
            - Kratka isporučna rampa — jeftinija nego iz Južne Evrope
        krakow:
          lead: 'Krakov je mirniji od Varšave: tržište je manje, preprodaje su ređe, a automobili često imaju jednog vlasnika duže. Jug Poljske je logistički bliži Balkanu.'
          points:
            - Manje prekupaca nego u Varšavi, istorija je obično čistija
            - Cene su često niže nego u prestonici
            - Bliže ruti ka jugu — praktično za isporuku u Srbiju
