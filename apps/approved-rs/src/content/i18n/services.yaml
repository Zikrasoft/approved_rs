        included:
          - title: Pretraga bez ograničenja broja automobila
            text: Radimo dok ne pronađemo automobil bez zamerki. Odbacivanje neodgovarajućeg primerka je uključeno u uslugu i ne naplaćuje se dodatno.
          - title: Stručnjak ide na svaki pregled
            text: Merač debljine laka za karoserijske panele, dijagnostički skener za upravljačke jedinice i dizalica gde je potrebna. Fotografije i snimci svih problematičnih mesta, videćete isto što i mi.
          - title: Provera istorije i pravnog statusa
            text: CarVertical izveštaj po VIN broju, servisna istorija kod ovlašćenog servisa, provera kilometraže, zaloge, zabrane registracije i nerešenih osiguravajućih slučajeva.
          - title: Cenkanje i kupoprodaja
            text: Dogovaramo cenu uzimajući u obzir pronađene nedostatke, pripremamo dokumentaciju i pružamo podršku pri potpisivanju.
          - title: Dostava i registracija
            text: Dostavljamo auto do vašeg grada i pomažemo oko registracije ili vam predajemo ključeve na mestu koje vam odgovara.
          - title: Jedna osoba vodi ceo proces
            text: Sa vama radi isti stručnjak koji je išao na pregled. Ne morate iznova da objašnjavate šta vam treba svakoj osobi koja se javi na telefon.
