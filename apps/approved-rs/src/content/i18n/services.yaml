      deliveryLineFor: Isporučujemo auto u bilo koji grad zemlje. Ako ga je potrebno izneti u inostranstvo, preuzimamo izvoz i carinjenje - transportujemo u {destinations} i u svaku drugu zemlju.
      deliveryDestinations:
        - Bosnu i Hercegovinu
        - Hrvatsku
        - Severnu Makedoniju
        - Tursku
        - Kazahstan
        - Kirgistan
      citiesHeadingFor: Gde gledamo automobile {countryLocation}
      citiesLead: Stručnjak izlazi po celoj zemlji, ali najviše gledamo automobile tamo gde ih najviše izlažu. Ovo je važno za svaki grad.
      alsoInLabel: 'Takođe biramo u:'
      crossSellLabel: Da li vam je potreban auto iz druge zemlje?
      countryNotesHeadingFor: Na šta obraćamo pažnju {location}
      countryNotesPointsLabel: Na šta prvo gledamo
      countryNotes:
        de:
          lead: 'Ponuda je ovde veća nego na bilo kom drugom tržištu Evrope, a istorija servisiranja obično je uočljiva: većina automobila ima servisnu knjižicu sa potvrdama dilera o svakom održavanju. S druge strane, autobanske kilometraže. Dvesta hiljada za tri godine je ovde norma, a ne razlog za popust.'
          points:
            - Servisna knjižica i potvrde dilera - proveravamo po VIN-u kod zvaničnog servisa
            - Protokol HU, koji svi zovu TÜV - čitamo zapažanja prethodne provere, a ne samo pečat
            - 'Automobili iz lizinga i korporativnih parkova: servisirani su pravilno, ali su kilometraže velike'
            - Zimski putevi sa hemikalijama - dno i pragove posmatramo posebno
        rs:
          lead: Ovde smo na terenu, tako da pregledamo auto na dan zahteva i bez uvoza. Tržište je malo, isti auto prolazi kroz nekoliko prodavaca, pa mora da se otkriva njegova istorija.
          points:
            - Auto je već carinjen i na lokalnim registracijama - takse i uvoz nisu potrebni
            - Kilometri se često menjaju prilikom preprodaje unutar zemlje - proveravamo sa potvrdama tehničkog pregleda
            - Mnoge automobile uvežene iz Nemačke i Italije - proveravamo šta je bilo sa automobilom pre uvoza
            - Provera na dan zahteva, bez čekanja na logistiku
        es:
          lead: Blaga zima i gotovo bez hemikalija na putevima, tako da su donji delovi španskih automobila obično uočljivo bolji od nemačkih. Ali sunce i blizina mora utiču na boju, plastiku i sve gumene delove.
          points:
            - Obala - koroziju tražimo pre svega u skrivenim delovima
            - Izbledeli lak i napuknuti plastični delovi enterijera - uračunavamo u cenu
            - 'Mnogi nekadašnji rent-a-car automobili: ujednačen pređeni broj kilometara, ali stroga eksploatacija'
            - Protokol ITV — proveravamo primedbe i datume prolaska
        ch:
          lead: 'Švajcarski automobili su generalno bolje održavani od proseka u Evropi: skupa usluga održavanja disciplinuje, pređeni kilometri su mali. Međutim, Švajcarska nije u EU, pa se uvoz obavlja drugačije, na to unapred računamo.'
          points:
            - Bogate opreme — ovde su ih uzimali češće nego kod komšija
            - MFK — inspekcija je stroga, pripremaju se ozbiljno, to se vidi na automobilu
            - 'Nije u EU: carina i dokumenti se sređuju drugačije nego za zemlje Evropske unije'
            - Cene su više od tržišnih, ali kasnije štedite na popravci
        pt:
          lead: Tržište je malo, izbor je skromniji nego u Španiji, ali je konkurencija za dobar automobil niža. Klima je vlažna i slana — morska korozija se sreće i na novim automobilima.
          points:
            - Vlažnost i more — skrivene šupljine i elektronika su prioritet provere
            - 'Malo tržište: po specifičnom zahtevu tražimo duže nego u Nemačkoj'
            - Protokol IPO — čitamo primedbe sa prethodnih inspekcija
            - Puno dizelaša i mali automobili, veliki karavani se retko nalaze
        fr:
          lead: Francuska je pre svega dizel i domaći brendovi. Peugeot, Renault i Citroën su ovde jeftiniji nego bilo gde u Evropi. Nemački premium automobili, s druge strane, su skuplji, i nema smisla kupovati ih ovde.
          points:
            - Francuski brendovi — najbolja cena u Evropi, a održavanje je jeftinije
            - Dizeli — soot filter i EGR ventil proveravamo kao posebnu stavku
            - Contrôle technique — protokoli su detaljni, proveravamo primedbe po godinama
            - 'Gradska upotreba: spojnice i suspenzija se brže troše nego je najavljivano'
        it:
          lead: 'Italijansko tržište je pogodno za male automobile i retke opreme, ali zahteva oprez: automobili su često vrlo korišćeni, a sitni limarski radovi ne rade se uvek pažljivo.'
          points:
            - Grad — česti sitni udarci i lakiranje, mjerač debljine je obavezan
            - Jug i obala donose so i koroziju, sever je bliži nemačkim uslovima
            - Revisione — proveravamo redovnost, promašaji se javljaju češće nego obično
            - Puno automobila sa plinskim uređajima — proveravamo ih posebno
        pl:
          lead: 'Najbliže veće tržište: logistica je jeftina i brza. Ali je Poljska godinama bila glavno pretovareno mesto za slomljene automobile iz Zapadne Evrope, tako da ovde proveravamo istoriju rigoroznije nego gde drugde.'
          points:
            - Visok udeo obnovljenih nakon nesreće — geometrija karoserije je prioritet
            - 'Česta preprodaja: automobil menja nekoliko vlasnika svake godine'
            - Pređeni kilometri se često ispravljaju na fazi uvoza — proveravamo sa servisnim bazama
            - Kratko vreme dostave — jeftinije i brže nego iz Španije ili Portugala
      closing:
        eyebrow: Odakle da počnemo?
        line1: Opišite automobil,
        line2: koji tražite, —
        accentWord: dalje je naš posao
        text: Budžet, karoserija, menjač, par želja. Mi tražimo, a vi gledate izveštaje opcija i odlučujete koji da gledate uživo.
