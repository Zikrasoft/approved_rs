    vehicle-inspection:
      title: Car Inspection
      description: Independent vehicle inspection prior to purchase. An expert will visit, diagnose, and provide a report — with no obligation to buy.
      ctaLabel: Request an Inspection
      casesHeading: Inspection Cases
      breadcrumbLabel: Car Inspection
      steps:
        - n: '01'
          text: Body and paintwork — check for repairs or accidents
        - n: '02'
          text: Suspension, brakes, and chassis
        - n: '03'
          text: Engine, transmission, and gear system
        - n: '04'
          text: Electronics and service history via VIN
        - n: '05'
          text: Legal clarity — liens, registration restrictions, accidents
      extraLine: We also operate in other European countries, including Portugal, — please inquire when applying.
      hub:
        metaTitle: Pre-Purchase Car Inspection in Europe
        metaDescription: 'We visit the car you’ve found: thickness gauge, scanner, VIN history check, and a report with photos on the same day. Operating in eight European countries.'
        title: Car Inspection
        titleHighlight: Before Purchase
        description: "We come to the car you’ve found and explain the real condition. The report arrives before you hand over your money: if the answer is 'don't buy', you only lose the cost of the inspection."
        breadcrumbLabel: Car Inspection
        casesHeading: Inspection Cases
        chooseCountryLabel: 'Select a Country:'
        ctaLabel: Request an Inspection
        heroPhotoAlt: Car on a lift at service
        processHeading: How the Inspection Works
        processLead: Typically, we visit within one to two days after your request. The inspection itself takes one and a half to two hours, and we send the report the same day before the car is sold to someone else.
        processSteps:
          - n: '01'
            text: You send us the link to the ad and the seller's contact details
          - n: '02'
            text: We coordinate with the seller for the time and place of the inspection
          - n: '03'
            text: We arrive with a thickness gauge and scanner; for BMWs, we connect to the dealer's ISTA; if necessary — to the lift
          - n: '04'
            text: We take photos and videos of all findings, check the history via VIN
          - n: '05'
            text: We send you the report and a clear answer — buy, negotiate, or refuse
        includedHeading: What’s Included in the Inspection
        includedLead: 'There are over a hundred checklist items, but four areas usually determine the decision: the body, engine with transmission, suspension, and documents. These are the areas we most often advise against buying.'
        included:
          - title: Body and Paintwork
            text: Thickness gauge measurements for each panel, geometry of openings, signs of welding and body filler. It's evident whether there has been a repair that the seller didn’t disclose.
          - title: Engine and Transmission
            text: Parameters on a warmed-up engine, gearbox adaptations, memory errors in modules. This is the most expensive area and the most common reason for refusal.
          - title: Suspension and Brakes
            text: Clearance, the condition of the suspension, and braking system. Highway mileage and Balkan roads wear down a car differently, and you can see it.
          - title: Electronics and VIN History
            text: CarVertical report, dealer service history for the make, mileage discrepancies with history, module errors, and signs of deployed airbags.
          - title: Legal Clarity
            text: Liens, registration restrictions, unresolved accidents and insurance incidents — issues that may arise after purchasing.
          - title: Report with Photos and Videos
            text: Every finding is documented and labeled. The report remains with you — it's useful for negotiating, even if you go ahead with the purchase.
        compareHeading: What Varies from Country to Country
        compareLead: Regulations for inspections, typical issues with local cars, and ways to hide history vary everywhere.
        compareHint: Select a country — we'll show you what we add to the regular checklist.
        compareLinkFor: Inspection {location} — in detail
        mapHeading: Four Areas That Determine the Deal
        mapLead: The checklist is long, but we often advise against buying based on one of four areas. Click the number on the diagram — we'll show you what the expert checks and what we've found there.
      countryNotesHeadingFor: How We Check {location}
      countryNotesPointsLabel: What We Check Beyond the Regular Checklist
      countryNotes:
        de:
          lead: 'In Germany, you have solid documentation: service books, HU protocols, and extensive VIN databases. Therefore, inspections here primarily involve verifying the documents against what the car shows.'
          points:
            - We verify dealer service entries against odometer readings over the years
            - Notes from the last HU — what was fixed after inspection and what was just patched
            - The underside and sills after winter reagents, including hidden cavities
            - 'Leasing history: consistent maintenance despite high mileage'
        rs:
          lead: "In Serbia, we can inspect the same day you contact us. The main task is to recover the vehicle's history before it was imported: local documents show only the last segment of the car's life."
          points:
            - Country of origin and the car's condition before entering Serbia
            - Odometer readings versus technical inspection records from previous years
            - Body repairs after import — they are more common and cheaper than in the EU
            - 'Legal aspects: liens and registration restrictions'
        es:
          lead: Spanish cars usually impress with their undercarriage but disappoint with everything affected by sun and salt. We shift the focus from corrosion below to hidden cavities, electrical systems, and interior condition.
          points:
            - Corrosion in hidden cavities near the coast — the underside may be clean
            - Paint, seals, and plastics after years in the sun
            - 'Rental history: we confirm mileage against interior wear patterns'
            - ITV protocol and what remains unresolved between inspections
        ch:
          lead: MFK vehicles are taken seriously, so a fresh protocol alone says little. We look at what was done specifically before the inspection versus what has been left to its own devices since last year.
          points:
            - What was replaced right before the MFK — new parts against the rest
            - Maintenance is expensive, so we check if any routine work was delayed
            - Rich equipment, but we check if every option still functions
            - 'Documents for import: Switzerland is not the EU, and requirements differ'
        pt:
          lead: "Everything here revolves around the humid maritime climate. We start the inspection with corrosion and electrical issues: typically, what's affected by dampness."
          points:
            - Hidden cavities, longitudinal beams, and suspension mounting points
            - Corrosion of connectors and blocks — a common cause of intermittent faults
            - IPO protocol and the regularity of inspections
            - 'Diesels used in urban environments: particulate filter and its history'
        fr:
          lead: 'France offers detailed contrôle technique, which is a good starting point. Next, we look at what regulations might miss: diesel engine resources and wear from urban traffic.'
          points:
            - Observations from contrôle technique over the years — what recurs from inspection to inspection
            - Particulate filter, EGR, and turbo on diesels
            - Clutch and suspension after a dense urban cycle
            - 'History for French brands: available parts, but specific weaknesses'
        it:
          lead: Italian cars often arrive with minor body repairs done quickly and cheaply. A thickness gauge on panels here takes noticeably longer than usual.
          points:
            - Thickness gauge on all panels — touch-ups from city scrapes
            - 'Difference between north and south: salt near the coast, regular wear inland'
            - Gas equipment, if installed — condition and cylinder status
            - Regularity of revisione and missed periods
        pl:
          lead: Poland is the largest transfer market for damaged cars from Western Europe. Therefore, the first thing is to find out what has been done to that body prior to sale.
          points:
            - Geometry of openings and welding traces — recovery after a serious accident
            - 'History of import: where the car came from and in what condition'
            - We verify mileage against European service databases; do not trust the odometer
            - Airbags and their deployment history
      closing:
        eyebrow: Found a car?
        line1: Send us the link
        line2: to the ad —
        accentWord: we'll come and check it out
        text: We’ll visit within one to two days. The report with photos stays with you, even if you decide not to proceed with the purchase.
    cityVehicleSourcing:
      title: Vehicle Sourcing
      descriptionFor: We'll find a car in {cityLocation} with a complete check-up. We operate throughout the {countryName} region.
      casesHeadingFor: Cases from {countryGenitiveOrName}
      whyCityHeadingFor: Why {cityName}
      reason1: We explore both dealer lots and private listings
      reason2: We verify the VIN history before going for inspections
      reason3For: Our expert in {cityLocation}
      reason4Dekra: DEKRA / TÜV inspection upon request
      reason4Generic: Independent technical expertise upon request
      otherCitiesLabelFor: 'Other cities in {countryLocation}:'
      cityNotesHeadingFor: The automotive market in {cityLocation}
      cityNotesPointsLabel: What this means in practice
      cityNotes:
        berlin:
          lead: 'Berlin has the largest selection in Germany and the most diverse group of sellers. Here you can find everything: cars from corporate fleets with full histories and resold ones from Eastern Europe.'
          points:
            - Huge selection in any segment, including rare configurations
            - Many private sellers — negotiation is more realistic than with dealers
            - 'Urban wear: clutches and suspensions wear out more noticeably than on highway cars'
        munich:
          lead: 'An expensive city with costly cars. The premium segment is larger here than anywhere else in Germany, and the overall condition is typically better: these cars are well-maintained.'
          points:
            - Strong premium segment, especially BMW and Mercedes
            - Well-kept cars with complete dealer service history
            - Prices are above the national average — savings come from condition
        hamburg:
          lead: A port city and major logistics hub. It's convenient to ship cars from here, and the market often has fresh imported vehicles.
          points:
            - Nearby port makes shipping easier and cheaper
            - Many cars from northern regions with highway mileage
            - 'Humid maritime climate: we inspect the body and hidden cavities more closely'
        belgrade:
          lead: Our base. In Belgrade, we can inspect on the same day you contact us, we know local sellers and can spot cars that have been circulating on the market for two months.
          points:
            - Inspection on the same day, no waiting or logistics delays
            - We know local lots and the history of the cars on them
            - Cars are already customs cleared — import and duties are not needed
        novi-sad:
          lead: The second largest city in Serbia, just an hour’s drive from Belgrade. The market is smaller, but prices are generally calmer than in the capital, and cars are less likely to have gone through multiple resales.
          points:
            - Prices are lower than in Belgrade for comparable condition
            - Fewer resellers, more first owners
            - We travel from Belgrade, with no extra charge for the drive
        pancevo:
          lead: Pancevo is part of the Belgrade agglomeration, so inspections here are similar to those in the capital. The market is small, but private listings can be more interesting.
          points:
            - Twenty minutes from Belgrade — we can get there just as quickly
            - Small market with a predominance of private sellers
            - Often cheaper than the capital for similar condition
        subotica:
          lead: 'Subotica is located on the border with Hungary, which is reflected in the market: many cars imported from the EU, and sellers who specialize in this.'
          points:
            - Border market — much fresh import from the European Union
            - We carefully check the history before import
            - Convenient location if you're planning to drive the car further north
        madrid:
          lead: 'The capital market of Spain: the largest selection in the country and many cars from corporate fleets. A continental climate, so there’s less coastal corrosion than by the sea.'
          points:
            - Largest selection in Spain, including corporate vehicles
            - Far from the sea — bodies are usually cleaner than coastal ones
            - 'Hot summers: we check plastics, lacquer, and air conditioning separately'
        barcelona:
          lead: Proximity to the sea makes all the difference. Cars often look great underneath, but they require attention to hidden areas and electrical systems.
          points:
            - 'The sea nearby — we check hidden cavities: often clean underneath, but not inside'
            - Many former rental and car-sharing vehicles
            - Nearby port makes maritime shipping easier to arrange
        zurich:
          lead: Zurich is the most expensive automotive market in the region. Configurations here are maximized, serviced at dealers, and sold before the cars show signs of wear.
          points:
            - Maximum configurations and low mileage
            - Dealer servicing — history almost always complete
            - Switzerland is not in the EU, import must be processed separately
        geneva:
          lead: Geneva is in the French-speaking part of Switzerland, right by the border with France. There are noticeably more French brands on the market than in the German part of the country.
          points:
            - 'Mixed market: Swiss condition, French assortment'
            - The border with France is nearby — there’s something to compare in price
            - 'Processing is the same as throughout Switzerland: export plus import'
        paris:
          lead: 'The largest selection in France comes with the hardest usage: dense traffic and tight parking leave marks on the body and suspension.'
          points:
            - The largest selection in France, especially of French brands
            - 'Urban wear: clutches, suspensions, and minor body damages'
            - Many diesels — we check the particulate filter and EGR first
        lyon:
          lead: Lyon is calmer than Paris in terms of both prices and car conditions. The highway to the south is nearby, so cars with smooth highway mileage are more common.
          points:
            - Prices are lower than in Paris for comparable selection
            - More highway mileage, less urban wear
            - Convenient access to Italy and Spain if we're looking further out
        milan:
          lead: 'The business capital of Italy, and this is evident in the market. The northern part of the country is closer to German conditions: better roads, better-kept cars than in the south.'
          points:
            - Best selection of the premium segment in Italy
            - North — less salt and corrosion than in the southern part of the country
            - 'Dense city: thickness gauges are a must for panels'
        rome:
          lead: A large market with very dense urban use. Minor scratches are considered a normal part of life here, and they're often repaired hastily.
          points:
            - Many compact cars and vehicles with gas systems
            - Frequent touch-ups after urban contacts — we check every panel
            - South of Milan — climate is milder, but closer to the sea
        warsaw:
          lead: Warsaw is the main entry point for imports from Western Europe, and it has the largest selection in Poland. The share of repaired cars is also the highest.
          points:
            - Largest selection in Poland, lots of fresh imports from the EU
            - We check the geometry of the body and signs of repair first
            - Shorter delivery distance — cheaper than from Southern Europe
        krakow:
          lead: 'Krakow is calmer than Warsaw: the market is smaller, there are fewer resales, and cars often have one owner for longer. The south of Poland is closer logistically to the Balkans.'
          points:
            - Fewer resellers than in Warsaw, history is usually cleaner
            - Prices are often lower than capital averages
            - Closer to routes south — convenient for delivery to Serbia
