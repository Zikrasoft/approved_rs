  es:
    vehicle-sourcing:
      hub:
        metaTitle: Selección de coches en Europa llave en mano
        metaDescription: 'Encontramos coches en Alemania, Serbia, España, Suiza, Italia, Francia, Polonia y Portugal: búsqueda, inspección, negociación y entrega llave en mano.'
        title: Selección de coches
        titleHighlight: llave en mano
        description: Seleccionamos un automóvil en el país donde te encuentras o planeas comprar, con verificación completa, acompañamiento en la transacción y entrega llave en mano. Elige un país para ver los detalles.
        breadcrumbLabel: Selección de coches
        casesHeading: Casos de selección de coches
        chooseCountryLabel: 'Elige un país:'
        ctaLabel: Encontrar un coche
        heroPhotoAlt: Fila de coches en el concesionario
        processHeading: ¿Cómo se lleva a cabo la selección?
        processLead: 'Desde la solicitud hasta tener las llaves, suele llevar de tres días a dos semanas. La parte más larga es encontrar el coche adecuado: no elegimos el primero que vemos, sino que seguimos buscando hasta dar con uno que no presente dudas tras la verificación.'
        processSteps:
          - n: '01'
            text: 'Discutimos el presupuesto, la marca y los requisitos: lo que es importante y lo que estamos dispuestos a sacrificar.'
          - n: '02'
            text: Seleccionamos opciones en el lugar y eliminamos por teléfono todo lo que no resiste preguntas.
          - n: '03'
            text: Vamos a la inspección con un medidor de grosor y un escáner; para BMW, conectamos el ISTA del concesionario, tomamos fotos y videos.
          - n: '04'
            text: Enviamos un informe y decimos claramente si vale la pena adquirirlo o seguir buscando.
          - n: '05'
            text: Negociamos, redactamos el contrato y te entregamos el coche o lo llevamos hasta tu puerta.
        includedHeading: ¿Qué incluye el servicio?
        includedLead: La comisión se fija antes de comenzar y no depende de cuántos coches haya que ver. Si después de la verificación decimos 'no lo compres', seguimos buscando sin ningún coste adicional.
        included:
          - title: Búsqueda sin límite en número de opciones
            text: Trabajamos hasta que encontremos un coche que no tenga objeciones. El rechazo de una opción que no salió bien está incluido y no tiene coste adicional.
          - title: Visita del experto a cada inspección
            text: 'Medidor de grosor en paneles, escáner en bloques, elevador donde es necesario. Fotos y videos de todos los puntos problemáticos: ves lo mismo que nosotros.'
          - title: Verificación de la historia y limpieza legal
            text: Informe de CarVertical por VIN, historial de servicio del concesionario según la marca, verificación del kilometraje, gravámenes, restricciones de registro y eventos de seguro no resueltos.
          - title: Negociación y formalización del contrato
            text: Negociamos el precio considerando los hallazgos, preparamos documentos y acompañamos la firma.
          - title: Entrega y registro
            text: Llevamos el coche a tu ciudad y ayudamos con la documentación en el lugar, ya sea entregándote las llaves donde te sea más conveniente recogerlo.
          - title: Una sola persona para todo el proceso
            text: Trabajarás con el mismo especialista que fue a la inspección. No es necesario explicar la tarea de nuevo a cada quien que conteste el teléfono.
        compareHeading: ¿En qué se diferencian los mercados?
        compareLead: El mismo modelo en Alemania y Polonia — por historia y precio, son dos coches diferentes.
        compareHint: Elige un país y te mostraremos qué buscamos allí primero.
        compareLinkFor: Selección {location} — en detalle
      title: Selección de coches llave en mano
      descriptionFor: Buscaremos un automóvil {location} — entre coches que ya están en este país, sin importar desde el extranjero. Verificación completa, acompañamiento en la transacción y entrega hasta tu ciudad — llave en mano, incluyendo el despacho aduanero.
      ctaLabel: Enviar solicitud
      casesHeadingFor: 'Casos: selección de coches {location}'
      breadcrumbLabelFor: Coches {location}
      stepsFor:
        - n: '01'
          text: Dejas una solicitud con requisitos — presupuesto, marca, kilometraje.
        - n: '02'
          text: Buscamos opciones {location} según tus criterios.
        - n: '03'
          text: Un experto independiente inspecciona y verifica el coche.
        - n: '04'
          text: Acompañamos la transacción, ayudamos con documentos y trámite.
        - n: '05'
          text: Entregamos el coche hasta tu ciudad — llave en mano, incluyendo el despacho aduanero.
      deliveryLineFor: Entregamos en {destinations} — y en cualquier otro país, lo discutiremos al enviar la solicitud.
      deliveryDestinations:
        - Rusia
        - Kazajistán
        - Kirguistán
        - Ucrania
        - Bielorrusia
        - Bosnia y Herzegovina
        - Croacia
        - Macedonia del Norte
        - Turquía
      citiesHeadingFor: Dónde inspeccionamos coches {countryLocation}
      citiesLead: El experto se desplaza por todo el país, pero generalmente inspeccionamos coches donde hay más disponibles. Esto es lo que significa para cada ciudad.
      alsoInLabel: 'También seleccionamos en:'
      crossSellLabel: ¿Necesitas un coche no local?
      countryNotesHeadingFor: Lo que consideramos en {location}
      countryNotesPointsLabel: En qué nos fijamos primero
      countryNotes:
        de:
          lead: 'La selección aquí es mayor que en cualquier otro mercado europeo, y la historia de servicio generalmente se puede rastrear: la mayoría de los coches tienen un libro de servicio con registros del concesionario sobre cada mantenimiento. El lado negativo son los kilometrajes autobahn. Doscientos mil en tres años aquí es normal, no un motivo de descuento.'
          points:
            - 'Libro de servicio y registros del concesionario: verificamos según el VIN en el servicio oficial'
            - 'Protocolo HU, que todos llaman TÜV: leemos las notas de la última inspección, no solo el sello'
            - 'Coches de leasing y flotas corporativas: bien mantenidos, pero con kilometrajes altos'
            - 'Caminos invernales con reactivos: revisamos el chasis y los umbrales por separado'
        rs:
          lead: Estamos aquí, así que inspeccionamos el coche el día de la solicitud y sin importar el despacho. El mercado es pequeño, y el mismo coche puede pasar por varios vendedores, así que es necesario desenredar la historia.
          points:
            - 'El coche ya está despachado y con matrículas locales: no se necesitan aranceles ni trámites de importación.'
            - 'El kilometraje a menudo se ajusta en la reventa dentro del país: verificamos con los registros del techpregled.'
            - 'Muchos coches importados de Alemania e Italia: comprobamos qué ocurrió con el coche antes de la importación.'
            - Inspección el día de la solicitud, sin esperar logística.
        es:
          lead: Inviernos suaves y casi sin reactivos en las carreteras, así que el chasis de los coches españoles suele estar en mejor estado que el de los alemanes. Sin embargo, el sol y la cercanía al mar afectan la pintura, el plástico y el caucho.
          points:
            - En la costa, buscamos corrosión primero en los espacios ocultos
            - Laca descolorida y plástico del interior agrietado — lo incluimos en el coste
            - 'Muchos coches de alquiler: kilometrajes regulares, pero uso intenso'
            - Protocolo ITV — verificamos notas y fechas de las inspecciones
        ch:
          lead: 'Los coches suizos están en mucho mejor estado que el promedio europeo: el mantenimiento costoso disciplina, los kilometrajes son bajos. Sin embargo, Suiza no está en la UE, así que la importación se gestiona de forma diferente, y esto lo incluimos en el presupuesto de antemano.'
          points:
            - Equipamientos ricos — aquí se compraron más que en los países vecinos
            - MFK — la inspección es estricta, se prepara en serio, y eso se refleja en el coche
            - 'No hay UE: la aduana y documentación se gestionan de otra forma que para los países de la Unión Europea'
            - El precio es más alto que en el mercado, pero luego ahorras en reparaciones
        pt:
          lead: El mercado es pequeño, la selección es más modesta que la española, pero la competencia por un buen coche es menor. El clima es húmedo y salado, así que la corrosión marítima se encuentra incluso en coches recientes.
          points:
            - Humedad y mar — la inspección se centra en los espacios ocultos y la eléctrica
            - 'Mercado pequeño: buscamos más tiempo para solicitudes concretas que en Alemania'
            - Protocolo IPO — leemos las notas de las inspecciones anteriores
            - Muchos diésel y coches pequeños, los grandes modelos son raros
        fr:
          lead: Francia es principalmente diésel y marcas nacionales. Peugeot, Renault y Citroën son más baratos que en cualquier otro lugar de Europa. En cambio, el premium alemán es más caro, así que no tiene sentido comprarlo aquí.
          points:
            - Marcas francesas — el mejor precio de Europa, y el mantenimiento es más barato
            - Diésel — el filtro de partículas y la válvula EGR son elementos que revisamos por separado
            - Contrôle technique — los protocolos son muy detallados, verificamos las notas a lo largo de los años
            - 'Uso urbano: el embrague y la suspensión se desgastan más rápido de lo anunciado'
        it:
          lead: 'El mercado italiano es bueno para coches pequeños y configuraciones raras, pero requiere precaución: aquí los coches se usan intensamente y las reparaciones de chapa no siempre se hacen de manera adecuada.'
          points:
            - 'En la ciudad, son frecuentes pequeños golpes y reparaciones: es necesario llevar un medidor de grosor'
            - El sur y la costa provocan sal y corrosión, el norte está más cerca de las condiciones alemanas
            - Revisione — verificamos la regularidad, las omisiones son más comunes de lo habitual
            - Muchos coches con equipo de gas — los revisamos por separado
        pl:
          lead: El mayor mercado cercano y la logística son baratas y rápidas. Sin embargo, Polonia ha sido durante años el principal punto de tránsito para coches siniestrados de Europa Occidental, por lo que aquí verificamos la historia más rigurosamente que en ningún otro lugar.
          points:
            - Alta proporción de coches restaurados después de accidentes — la geometría de la carrocería es prioritaria
            - 'Frecuentes reventas: un coche puede cambiar de varios propietarios en un año'
            - El kilometraje a menudo se ajusta durante la importación — verificamos con bases de servicio
            - Corta distancia de entrega — más barata y rápida que desde España o Portugal
      closing:
        eyebrow: ¿Por dónde empezamos?
        line1: Describe el coche que buscas,
        line2: — nosotros nos encargamos,
        accentWord: y luego nuestra tarea
        text: Presupuesto, carrocería, transmisión, un par de deseos adicionales. Nosotros buscamos, y tú revisas los informes de las opciones y decides cuál inspeccionar en vivo.
