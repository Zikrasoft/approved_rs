          - title: Fahrzeuge mit russischen Kennzeichen
            text: 'Hauptkategorie. Das Fahrzeug kann sich in jedem europäischen Land befinden: Wir kommen dorthin, wo es steht, und kümmern uns selbst um Export und Weiterverkauf.'
          - title: Probleme mit der Einfuhr und Fristen
            text: Nach der Unterzeichnung gehen die abgelaufene befristete Einfuhr und die damit verbundenen Risiken auf uns über.
          - title: Bewertung ohne Besichtigung
