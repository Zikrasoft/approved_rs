          - n: '01'
            text: Envías fotos, documentos y una descripción honesta del estado
          - n: '02'
            text: 'Te damos un precio en una hora: definitivo, sin márgenes'
          - n: '03'
            text: Concertamos un encuentro allí donde está el coche; si no funciona, llegamos con un remolque
          - n: '04'
            text: Inspeccionamos en persona y confirmamos el precio si la descripción coincide
          - n: '05'
            text: Firmamos el contrato, transferimos el dinero el día de la firma
