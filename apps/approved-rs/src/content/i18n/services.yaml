        includedLead: 'Al hacer la importación por tu cuenta, el presupuesto suele desbalancearse por la suma de lo que va más allá del precio del coche. Nosotros lo calculamos de antemano y fijamos: el total no debe diferir del primer cálculo.'
        included:
          - title: Costo del propio vehículo
            text: Precio después de la negociación, no el de la publicación. Negociamos con el coche a la vista — esto suele cubrir parte de los gastos.
          - title: Logística al lugar
            text: Transporte en camión o conducción con placas de tránsito. Calculamos ambas opciones y tomamos la más rentable para ese trayecto específico.
          - title: Aranceles e impuestos
            text: La tarifa depende del país de origen del coche y su edad. Para vehículos europeos, el certificado EUR1 cambia fundamentalmente el cálculo — verificamos su existencia antes de la compra.
          - title: Exportación y tránsito
            text: Baja en el país del vendedor, declaración de exportación, placas de tránsito y seguro para la conducción.
          - title: Trámites aduaneros
            text: Declaración, agente aduanal y pago en el punto de llegada. Preparamos el paquete con antelación, para que el coche no quede en el almacén innecesariamente.
          - title: Matriculación
            text: Inspección técnica, registro y placas. Recoges el coche, listo para conducir de inmediato.
