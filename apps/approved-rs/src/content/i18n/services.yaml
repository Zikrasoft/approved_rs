    vehicle-inspection:
      title: Inspección de coches
      description: Inspección independiente antes de comprar un coche. Un experto se desplaza, realiza el diagnóstico y entrega un informe, sin compromiso de compra.
      ctaLabel: Solicitar inspección
      casesHeading: 'Casos reales: inspección precompra'
      breadcrumbLabel: Inspección de coches
      steps:
        - n: '01'
          text: Carrocería y pintura, indicios de reparaciones o accidentes
        - n: '02'
          text: Tren de rodaje, suspensión y frenos
        - n: '03'
          text: Motor, caja de cambios y transmisión
        - n: '04'
          text: Electrónica e historial de mantenimiento por número de bastidor (VIN)
        - n: '05'
          text: 'Situación legal: cargas, restricciones de matriculación e historial de accidentes'
      extraLine: También trabajamos en otros países europeos, incluido Portugal. Consúltanos al solicitar el servicio.
      hub:
        metaTitle: Inspección precompra de coches en Europa
        metaDescription: 'Revisamos el coche que has encontrado: medidor de pintura, diagnosis, historial por VIN e informe con fotos el mismo día. En ocho países europeos.'
        title: Inspección de coches
        titleHighlight: antes de comprar
        description: Revisamos el coche que has encontrado y te decimos su estado real antes de que pagues. Si desaconsejamos comprarlo, solo pagas la inspección.
        breadcrumbLabel: Inspección de coches
        casesHeading: 'Casos reales: inspección precompra'
        chooseCountryLabel: 'Elige un país:'
        ctaLabel: Solicitar inspección
        heroPhotoAlt: Coche en un elevador de taller
        processHeading: Cómo realizamos la inspección
        processLead: Normalmente nos desplazamos en uno o dos días desde la solicitud. La inspección dura entre una hora y media y dos horas, y enviamos el informe ese mismo día, antes de que otro comprador se lleve el coche.
        processSteps:
          - n: '01'
            text: Nos envías el enlace del anuncio y los datos de contacto del vendedor
          - n: '02'
            text: Acordamos con el vendedor la hora y el lugar de la inspección
          - n: '03'
            text: Acudimos con un medidor de espesor de pintura y un equipo de diagnosis. Para BMW usamos ISTA, el sistema oficial de la marca, y subimos el coche al elevador si es necesario
          - n: '04'
            text: Documentamos todos los hallazgos con fotos y vídeos y consultamos el historial por VIN
          - n: '05'
            text: 'Te enviamos el informe y una recomendación clara: comprar, negociar o descartarlo'
        includedHeading: Qué incluye la inspección
        includedLead: 'Revisamos más de cien puntos, pero casi siempre hay cuatro áreas decisivas: carrocería, motor y caja de cambios, tren de rodaje y documentación. Son las que más a menudo nos llevan a desaconsejar una compra.'
        included:
          - title: Carrocería y pintura
            text: Medimos el espesor de pintura en cada panel y comprobamos la geometría de los huecos de la carrocería, las soldaduras y los restos de masilla. Así detectamos reparaciones que el vendedor no haya mencionado.
          - title: Motor y caja de cambios
            text: Comprobamos los parámetros con el motor a temperatura de servicio, las adaptaciones de la caja de cambios y los fallos registrados en las centralitas. Es el apartado con las reparaciones más caras y el motivo más frecuente para descartar un coche.
          - title: Tren de rodaje y frenos
            text: Comprobamos holguras y el estado de la suspensión y del sistema de frenos. Los kilómetros de autopista y las carreteras balcánicas desgastan el coche de formas distintas, y se nota.
          - title: Electrónica e historial por VIN
            text: Informe de CarVertical, historial de mantenimiento en la red oficial de la marca, discrepancias de kilometraje, fallos en las centralitas y señales de airbags activados.
          - title: Situación legal
            text: 'Cargas, restricciones de matriculación, siniestros y expedientes de seguros pendientes: problemas que pueden aparecer después de la compra.'
          - title: Informe con fotos y vídeos
            text: Cada hallazgo queda documentado con imágenes y comentarios. El informe es suyo y le servirá para negociar el precio si decide comprar el coche.
        compareHeading: Qué cambia de un país a otro
        compareLead: Cada país tiene sus normas de inspección técnica, sus averías habituales y sus formas de ocultar el historial.
        compareHint: Elija un país y le mostraremos qué añadimos a la lista de comprobaciones habitual.
        compareLinkFor: Inspección {location} en detalle
        mapHeading: Cuatro zonas que deciden la compra
        mapLead: La lista de comprobaciones es larga, pero casi siempre desaconsejamos la compra por problemas en una de estas cuatro zonas. Pulse un número del esquema para ver qué revisa el experto y qué hemos encontrado.
      countryNotesHeadingFor: Cómo inspeccionamos {location}
      countryNotesPointsLabel: Qué revisamos además de las comprobaciones habituales
      countryNotes:
        de:
          lead: 'En Alemania contamos con buenas fuentes: el libro de mantenimiento, los informes HU y bases de datos completas por VIN. Por eso, aquí lo principal es contrastar la documentación con el estado real del coche.'
          points:
            - Contrastamos las revisiones de la red oficial con los registros anuales de kilometraje
            - 'Defectos señalados en la última HU: cuáles se repararon y cuáles se dejaron pendientes'
            - Bajos y taloneras expuestos a la sal de deshielo, incluidas las cavidades ocultas
            - 'Historial de leasing: mantenimiento regular pese a un kilometraje elevado'
        rs:
          lead: En Serbia acudimos el mismo día de la consulta. La prioridad es reconstruir el historial anterior a la importación, ya que la documentación local solo refleja la etapa más reciente del coche.
          points:
            - País de procedencia y estado del coche antes de su importación a Serbia
            - Contrastamos el cuentakilómetros con los registros de inspecciones técnicas de años anteriores
            - Reparaciones de carrocería tras la importación, más frecuentes y baratas que en la UE
            - 'Situación legal: cargas y restricciones de matriculación'
        es:
          lead: Los coches españoles suelen tener los bajos en buen estado, pero el sol y la sal pasan factura a otros componentes. Centramos la revisión en las cavidades ocultas, el sistema eléctrico y el interior, más que en la corrosión de los bajos.
          points:
            - Corrosión en cavidades ocultas en zonas costeras, aunque los bajos parezcan sanos
            - Barniz, juntas y plásticos tras años de exposición al sol
            - 'Pasado como coche de alquiler: contrastamos el kilometraje con el desgaste del interior'
            - Informe de ITV y defectos que siguen sin subsanarse entre inspecciones
        ch:
          lead: Los coches se preparan a fondo para la MFK, así que un informe reciente no basta. Revisamos qué se ha reparado justo antes de la inspección y qué problemas siguen pendientes desde el año anterior.
          points:
            - Piezas sustituidas justo antes de la MFK y su contraste con el estado del resto
            - 'El mantenimiento es caro: comprobamos si se han aplazado las revisiones previstas'
            - 'Suelen llevar mucho equipamiento: comprobamos que cada extra siga funcionando'
            - 'Documentación para importar: Suiza no pertenece a la UE y los requisitos son distintos'
        pt:
          lead: 'El clima marítimo húmedo lo condiciona todo. Empezamos por la corrosión y el sistema eléctrico: los componentes expuestos a la humedad son los que más suelen fallar.'
          points:
            - Cavidades ocultas, largueros y puntos de anclaje de la suspensión
            - Oxidación de conectores y centralitas, causa habitual de fallos intermitentes
            - Informe IPO y cumplimiento de los plazos de inspección
            - 'Diésel de uso urbano: filtro de partículas y su historial'
        fr:
          lead: 'En Francia, el contrôle technique es detallado y ofrece un buen punto de partida. Después revisamos lo que no cubre: el estado de los componentes del motor diésel y el desgaste por circulación urbana.'
          points:
            - Defectos del contrôle technique a lo largo de los años y cuáles se repiten
            - Filtro de partículas, válvula EGR y turbo en los diésel
            - Embrague y suspensión tras un uso urbano intensivo
            - 'Historial de los modelos franceses: recambios asequibles, pero puntos débiles propios'
        it:
          lead: Los coches italianos llegan con más frecuencia con pequeñas reparaciones de carrocería hechas deprisa y a bajo coste. Por eso dedicamos más tiempo de lo habitual a medir el espesor de pintura de cada panel.
          points:
            - Medimos la pintura de todos los paneles para detectar repintados por roces urbanos
            - 'Diferencias entre norte y sur: sal en la costa y desgaste habitual en el interior'
            - Si lleva equipo de gas, revisamos la instalación y el estado del depósito
            - Regularidad de la revisione y periodos sin inspección
        pl:
          lead: Polonia es el principal mercado de tránsito de coches siniestrados de Europa Occidental. Por eso, lo primero es averiguar qué reparaciones ha recibido la carrocería antes de ponerse a la venta.
          points:
            - Geometría de los huecos de carrocería y marcas de soldadura que delatan reparaciones tras un accidente grave
            - 'Historial de importación: de dónde llegó el coche y en qué estado'
            - Contrastamos el kilometraje con bases de datos europeas de mantenimiento, no nos fiamos del cuentakilómetros
            - Airbags y señales de activación en accidentes anteriores
      closing:
        eyebrow: ¿Ha encontrado un coche?
        line1: Envíenos el enlace
        line2: del anuncio,
        accentWord: iremos a revisarlo
        text: Acudimos en uno o dos días. El informe con fotos es suyo, aunque después decida no comprar el coche.
    cityVehicleSourcing:
      title: Búsqueda de coches
      descriptionFor: Encontramos su coche {cityLocation} con una revisión completa. Trabajamos en toda la región de {countryName}.
      casesHeadingFor: Compras reales en el mercado de {countryGenitiveOrName}
      whyCityHeadingFor: Por qué {cityName}
      reason1: Buscamos tanto en concesionarios como en anuncios de particulares
      reason2: Comprobamos el historial por VIN antes de desplazarnos
      reason3For: Nuestro experto {cityLocation}
      reason4Dekra: Inspección DEKRA / TÜV bajo petición
      reason4Generic: Peritaje técnico independiente bajo petición
      otherCitiesLabelFor: 'Otras ciudades {countryLocation}:'
      cityNotesHeadingFor: El mercado del automóvil {cityLocation}
      cityNotesPointsLabel: Qué ventajas ofrece en la práctica
      cityNotes:
        berlin:
          lead: 'Berlín ofrece la mayor variedad de coches de Alemania y vendedores de todo tipo. Aquí hay de todo: desde vehículos de flotas de empresa con historial completo hasta coches traídos de Europa del Este por compraventas.'
          points:
            - Enorme variedad en todos los segmentos, incluidas versiones difíciles de encontrar
            - Muchos vendedores particulares, con más margen para negociar que en los concesionarios
            - El uso urbano desgasta más el embrague y la suspensión que los recorridos por autopista
        munich:
          lead: 'Una ciudad cara con coches caros. La oferta de vehículos de gama alta es mayor que en cualquier otra ciudad alemana y su estado suele ser mejor: son coches que se cuidan.'
          points:
            - Gran oferta de gama alta, especialmente BMW y Mercedes
            - Coches bien cuidados con historial completo de mantenimiento en servicio oficial
            - Precios superiores a la media nacional, el ahorro está en el mejor estado del coche
        hamburg:
          lead: Ciudad portuaria y gran centro logístico. Es un buen punto para enviar el coche a su destino, y en su mercado abundan más de lo habitual los vehículos recién importados.
          points:
            - La cercanía del puerto facilita y abarata el envío
            - Muchos coches del norte de Alemania con kilómetros hechos en carretera
            - 'Clima marítimo húmedo: revisamos con especial atención la carrocería y sus cavidades interiores'
        dusseldorf:
          lead: En pleno centro de Renania del Norte-Westfalia, el estado más poblado de Alemania. Los establecimientos de compraventa están muy cerca unos de otros, y las fronteras con Países Bajos y Bélgica quedan a una hora, por lo que llegan coches de ambos países para venderse aquí.
          points:
            - Podemos revisar varios coches en una sola salida gracias a la cercanía entre establecimientos
            - 'Hay ofertas con matrícula neerlandesa o belga: comprobamos su historial y documentación por separado'
            - La competencia entre tantos vendedores facilita la negociación
        belgrade:
          lead: Nuestra base. En Belgrado podemos realizar la inspección el mismo día que nos contactas. Conocemos a los vendedores locales y sabemos qué coches llevan dos meses pasando de un compraventa a otro.
          points:
            - Inspección el mismo día, sin esperas ni desplazamientos complicados
            - Conocemos los establecimientos locales y el historial de los coches que venden
            - El coche ya tiene el despacho de aduanas hecho, sin trámites de importación ni aranceles pendientes
        novi-sad:
          lead: La segunda ciudad más grande de Serbia, a una hora de Belgrado. El mercado es más pequeño, pero los precios suelen ser más moderados que en la capital y es menos frecuente que los coches hayan pasado por varios compraventas.
          points:
            - Precios más bajos que en Belgrado para coches en un estado similar
            - Menos intermediarios y más posibilidades de comprar al primer propietario
            - Nos desplazamos desde Belgrado sin cobrar un suplemento por el trayecto
        pancevo:
          lead: Pančevo forma parte, en la práctica, del área metropolitana de Belgrado, así que inspeccionar un coche aquí es igual que hacerlo en la capital. El mercado es pequeño, pero los anuncios de particulares suelen ofrecer opciones más interesantes.
          points:
            - A veinte minutos de Belgrado, con la misma rapidez de respuesta
            - Mercado pequeño en el que predominan los vendedores particulares
            - Precios a menudo inferiores a los de la capital para coches en el mismo estado
        subotica:
          lead: 'Subotica está junto a la frontera con Hungría y eso se nota en su mercado: abundan los coches importados de la UE y los vendedores que se dedican a ello de forma habitual.'
          points:
            - Mercado fronterizo con muchos coches recién importados de la Unión Europea
            - Revisamos con especial atención el historial anterior a la importación
            - Un punto práctico si tienes previsto llevar el coche más al norte
        madrid:
          lead: El mercado de la capital ofrece la mayor variedad de España y muchos vehículos de flotas de empresa. Gracias al clima continental, hay menos corrosión por ambiente marino que en la costa.
          points:
            - La mayor variedad de España, incluidos vehículos de empresa
            - Lejos del mar, las carrocerías suelen presentar menos corrosión que en la costa
            - 'Veranos calurosos: revisamos específicamente los plásticos, el barniz de la pintura y el aire acondicionado'
        barcelona:
          lead: La cercanía del mar marca la diferencia. Los bajos pueden parecer impecables, pero conviene prestar atención a las cavidades de la carrocería y al sistema eléctrico.
          points:
            - 'Con el mar tan cerca, revisamos las cavidades de la carrocería: los bajos pueden estar limpios y el interior no'
            - Muchos coches procedentes de alquiler y de servicios de coche compartido
            - La cercanía del puerto facilita el envío por mar
        zurich:
          lead: Zúrich tiene el mercado de coches más caro de la región. Aquí se eligen versiones con el máximo equipamiento, se acude al servicio oficial y se venden los coches antes de que acumulen mucho desgaste.
          points:
            - Versiones con el máximo equipamiento y pocos kilómetros
            - Mantenimiento en servicio oficial e historial casi siempre completo
            - Suiza no pertenece a la UE, la importación requiere trámites específicos
        geneva:
          lead: Ginebra está en la Suiza francófona, junto a la frontera con Francia. La presencia de marcas francesas es notablemente mayor que en la zona de habla alemana.
          points:
            - 'Un mercado mixto: conservación suiza y oferta de marcas francesas'
            - La cercanía de Francia permite comparar precios al otro lado de la frontera
            - 'Los mismos trámites que en el resto de Suiza: exportación e importación'
        paris:
          lead: 'La mayor variedad de Francia viene acompañada del uso más exigente: el tráfico intenso y las plazas de aparcamiento estrechas dejan huella en la carrocería y la suspensión.'
          points:
            - La mayor variedad de Francia, especialmente de marcas francesas
            - 'Uso urbano: atención al embrague, la suspensión y los pequeños daños de carrocería'
            - 'Muchos diésel: priorizamos la revisión del filtro de partículas y la válvula EGR'
        lyon:
          lead: Lyon ofrece precios más moderados que París y coches, por lo general, menos castigados. La cercanía de la autopista hacia el sur hace que sea más habitual encontrar vehículos con kilómetros de carretera.
          points:
            - Precios inferiores a los de París con una variedad comparable
            - Más kilómetros de carretera y menos desgaste urbano
            - Buena ubicación para ampliar la búsqueda a Italia y España
        milan:
          lead: 'Milán es la capital de los negocios de Italia, y ese poder adquisitivo se nota en su mercado. El norte se acerca más a las condiciones alemanas: mejores carreteras y coches más cuidados que en el sur.'
          points:
            - La mejor oferta de coches de gama alta de Italia
            - Zona norte, con menos sal y corrosión que el sur del país
            - 'Tráfico urbano intenso: imprescindible medir el espesor de la pintura en los paneles de carrocería'
        rome:
          lead: Un mercado amplio, con coches sometidos a un uso urbano muy intenso. Los pequeños roces se consideran normales y a menudo se reparan deprisa y sin demasiado cuidado.
          points:
            - Muchos coches de pequeña cilindrada y vehículos con instalación de gas
            - Son habituales los retoques de pintura por roces urbanos, revisamos cada panel de la carrocería
            - Al sur de Milán, el clima es más suave, pero el mar está más cerca
        warsaw:
          lead: Por Varsovia entra la mayor parte de los coches importados de Europa Occidental, y allí se concentra la mayor oferta de Polonia. También es donde hay una mayor proporción de vehículos reparados tras un siniestro.
          points:
            - La mayor oferta de Polonia, con muchos coches recién importados de la UE
            - Nuestra prioridad es comprobar la geometría de la carrocería y detectar reparaciones
            - Trayecto de transporte corto, más económico que desde el sur de Europa
        krakow:
          lead: 'Cracovia es más tranquila que Varsovia: el mercado es más pequeño, hay menos reventa y los coches suelen permanecer más tiempo con el mismo propietario. El sur de Polonia queda más cerca de los Balcanes a efectos de transporte.'
          points:
            - Menos revendedores que en Varsovia y, por lo general, historiales más transparentes
            - Los precios suelen ser más bajos que en la capital
            - Más cerca de la ruta hacia el sur, lo que facilita el transporte a Serbia
