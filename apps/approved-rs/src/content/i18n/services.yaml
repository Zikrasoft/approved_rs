          - n: '03'
            text: Idemo na pregled sa meračem debljine laka i dijagnostičkim skenerom, a za BMW koristimo servisnu dijagnostiku ISTA. Šaljemo fotografije i snimke
          - n: '04'
            text: Šaljemo izveštaj i otvoreno kažemo da li vredi kupiti auto ili treba nastaviti potragu
          - n: '05'
            text: Cenkamo se, završavamo kupovinu i predajemo vam auto ili ga dostavljamo na vašu adresu
        includedHeading: Šta je uključeno u uslugu
