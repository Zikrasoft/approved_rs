        includedLead: 'Al importar por su cuenta, lo que suele disparar el presupuesto son los gastos que se suman al precio del coche. Los calculamos de antemano y los dejamos cerrados: el importe final debe coincidir con el presupuesto inicial.'
        included:
          - title: Precio del coche
            text: El precio negociado, no el del anuncio. Negociamos con los resultados de la inspección en la mano, lo que suele compensar parte de los gastos.
          - title: Transporte hasta el destino
            text: En camión portacoches o conduciendo con matrículas de tránsito. Calculamos ambas opciones y elegimos la más rentable para cada trayecto.
          - title: Aranceles e impuestos
            text: El tipo aplicable depende del país de origen del coche y de su antigüedad. Para los vehículos de fabricación europea, el certificado EUR1 puede cambiar sustancialmente el importe, por eso comprobamos que esté disponible antes de comprar.
          - title: Exportación y tránsito
            text: Baja en el país del vendedor, declaración de exportación, matrículas de tránsito y seguro para el traslado.
          - title: Despacho de aduanas
            text: Declaración, agente de aduanas y pago en destino. Preparamos la documentación con antelación para evitar días innecesarios de estancia en el depósito.
          - title: Matriculación
            text: Inspección técnica, matriculación y placas. Le entregamos el coche listo para circular.
