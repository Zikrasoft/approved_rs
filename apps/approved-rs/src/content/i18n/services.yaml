    vehicle-inspection:
      title: Car Inspection
      description: Independent car inspection before purchase. Expert visit, diagnostics, report — no obligation to buy.
      ctaLabel: Order Inspection
      casesHeading: 'Real Transactions: Pre-Purchase Inspections'
      breadcrumbLabel: Car Inspection
      steps:
        - n: '01'
          text: Body and paintwork — signs of repair or accidents
        - n: '02'
          text: Chassis, suspension, brakes
        - n: '03'
          text: Engine, transmission, gearbox
        - n: '04'
          text: Electronics and service history by VIN
        - n: '05'
          text: Legal clearance — liens, registration prohibitions, accidents
      extraLine: We also work in other European countries, including Portugal — please check when submitting your request.
      hub:
        metaTitle: Car Inspection Before Purchase in Europe
        metaDescription: 'We visit the car you found: thickness gauge, scanner, VIN history check, and report with photos the same day. We operate in eight European countries.'
        title: Car Inspection
        titleHighlight: before purchase
        description: "We visit the car you found and tell you the real condition. The report arrives before you pay: if the answer is 'don’t buy', you only lose the inspection fee."
        breadcrumbLabel: Car Inspection
        casesHeading: 'Real Transactions: Pre-Purchase Inspections'
        chooseCountryLabel: 'Select a Country:'
        ctaLabel: Order Inspection
        heroPhotoAlt: Car on a lift in a workshop
        processHeading: How the Inspection Works
        processLead: We usually visit within one to two days after the request. The inspection itself takes one and a half to two hours, and we send the report the same day, while the car is still available.
        processSteps:
          - n: '01'
            text: You send a link to the ad and seller’s contact details
          - n: '02'
            text: We arrange with the seller about the time and place of the inspection
          - n: '03'
            text: We arrive with a thickness gauge and scanner, connecting to the dealer's ISTA for BMW when necessary — possibly on a lift
          - n: '04'
            text: We take photos and videos of all findings, checking the history by VIN
          - n: '05'
            text: We send the report and a direct recommendation — to buy, negotiate, or walk away
        includedHeading: What’s Included in the Inspection
        includedLead: 'There are over a hundred checklist items, but four zones usually determine the outcome: body, engine and gearbox, chassis, and documents. These are the areas we most often advise against purchasing.'
        included:
          - title: Body and Paintwork
            text: Thickness measurement for each panel, geometry of openings, signs of welding and filler. It shows whether there was unmentioned repair work.
          - title: Engine and Gearbox
            text: Parameters for a warmed-up engine, gearbox adaptations, errors in memory blocks. The most expensive area and the most common reason for refusal.
          - title: Chassis and Brakes
            text: Wear play, condition of suspension and braking systems. Highway mileage and Balkan roads wear cars differently, and it shows.
          - title: Electronics and VIN History
            text: CarVertical report, dealer service history by brand, odometer discrepancies with history, block errors, and traces of deployed airbags.
          - title: Legal Clearances
            text: Liens, registration bans, unresolved accidents, and insurance claims—issues that may arise after purchase.
          - title: Photo and Video Report
            text: Every finding is captured and labeled. You keep the report—it’s helpful for negotiations, even if you decide to buy the car.
        compareHeading: What Varies from Country to Country
        compareLead: Regulations for inspections, typical local car issues, and ways to conceal history differ everywhere.
        compareHint: Select a country—we’ll show you what we add to the standard checklist.
        compareLinkFor: Inspection in {location} — in detail
        mapHeading: Four Areas That Affect the Deal
        mapLead: The checklist is lengthy, but we often discourage based on one of four areas. Click on a number on the diagram—we’ll show what our expert looks for and what we’ve found there.
      countryNotesHeadingFor: How We Check in {location}
      countryNotesPointsLabel: What We Check Beyond the Standard Checklist
      countryNotes:
        de:
          lead: 'Germany offers strong documentation: service book, HU protocols, and extensive VIN databases. Therefore, the inspection here primarily involves verifying documents against what the car shows.'
          points:
            - We check dealer service stamps against odometer readings by year
            - Notes from past HU—what was repaired after inspection, and what was just delayed
            - The underbody and sills after winter agents, including hidden cavities
            - 'Leasing history: consistent servicing with high mileage'
        rs:
          lead: "In Serbia, we conduct inspections on the same day you contact us. Our main goal is to reconstruct the car's history before import: local documents usually show only the final phase of the car's life."
          points:
            - Country of origin and the car’s condition prior to import into Serbia
            - Odometer readings compared with technical review stamps from previous years
            - Body repairs post-import—they are done more frequently and are cheaper than in the EU
            - 'Legal considerations: liens and registration restrictions'
        es:
          lead: Spanish cars usually impress with their undercarriage but disappoint with everything that suffers from sun and salt. We shift the focus from corrosion underneath to hidden cavities, electrical systems, and interior condition.
          points:
            - Corrosion in hidden cavities near the coast—underneath may look clean
            - Paint, seals, and plastics after years of sun exposure
            - 'Rental history: we compare mileage with the wear pattern in the cabin'
            - ITV protocol and any unresolved issues between inspections
        ch:
          lead: Cars in Switzerland are seriously prepared for MFK inspections, so a fresh protocol doesn’t tell us much. We focus on what was done right before the inspection and what has been neglected since last year.
          points:
            - What was replaced just before MFK—a few new parts against the backdrop of others
            - Service can be expensive, so we check whether maintenance due was postponed
            - Rich equipment, but we verify that every option still works
            - 'Import documents: Switzerland is not in the EU, the requirements differ'
        pt:
          lead: Everything here hinges on the humid coastal climate. We start inspections with corrosion and electrical issues—things living in moisture often cause trouble.
          points:
            - Hidden cavities, longitudinal beams, and suspension mounting points
            - Oxidation of connectors and modules—a typical cause of floating errors
            - IPO protocol and frequency of inspections
            - 'Diesels with urban usage: particulate filter and its history'
        fr:
          lead: 'In France, a thorough contrôle technique is a great starting point. After that, we look at what the regulations might miss: the durability of the diesel group and wear from urban traffic.'
          points:
            - Notices from contrôle technique over the years—what repeats from inspection to inspection
            - Particulate filters, EGR, and turbochargers on diesels
            - Clutch and suspension after a dense urban cycle
            - 'History on French brands: available parts, but specific weak points'
        it:
          lead: Italian cars often arrive with minor body repairs done quickly and cheaply. Using a thickness gauge on the panels here takes substantially more time than usual.
          points:
            - Thickness gauge across all panels—touch-ups after urban scratches
            - 'The difference between north and south: salt by the coast, typical wear inland'
            - Gas equipment, if installed—installation and the condition of the tank
            - Regularity of revisione and any missed periods
        pl:
          lead: Poland is the largest transit market for damaged cars from Western Europe. Therefore, our first step is to determine what has been done to the body before sale.
          points:
            - Geometry of openings and traces of welding—repair after a serious accident
            - 'History of import: where the car came from and in what condition'
            - We verify mileage against European service databases, as we do not trust the odometer
            - Airbags and their deployment history
      closing:
        eyebrow: Found a car?
        line1: Send us the link
        line2: to the ad —
        accentWord: we'll come and inspect it
        text: We can dispatch in one to two days. You’ll keep the photo report, even if you choose not to buy after.
    cityVehicleSourcing:
      title: Car Sourcing
      descriptionFor: We’ll find a car in {cityLocation} with a full inspection. We operate throughout the {countryName} region.
      casesHeadingFor: Real Deals in the {countryGenitiveOrName} Market
      whyCityHeadingFor: Why {cityName}
      reason1: We check both dealer lots and private listings
      reason2: We review the VIN history before leaving for inspection
      reason3For: Our expert is in {cityLocation}
      reason4Dekra: DEKRA / TÜV inspection upon request
      reason4Generic: Independent technical assessment upon request
      otherCitiesLabelFor: 'Other cities in {countryLocation}:'
      cityNotesHeadingFor: The Car Market in {cityLocation}
      cityNotesPointsLabel: What This Provides Practically
      cityNotes:
        berlin:
          lead: "Berlin has the largest selection in Germany and the most diverse range of sellers. You'll find everything here: cars from corporate fleets with full histories as well as resale options from Eastern Europe."
          points:
            - A vast selection in every segment, including rare configurations
            - Many private sellers — negotiations are more realistic than with dealers
            - 'Urban cycle: tires and suspension wear out faster than on highway cars'
        munich:
          lead: An expensive city with expensive cars. The premium segment is more prominent here than anywhere else in Germany, and the condition is generally better — these vehicles are well maintained.
          points:
            - Strong premium segment, especially BMW and Mercedes
            - Well-kept cars with complete dealer histories
            - Prices are above the national average — savings come from condition
        hamburg:
          lead: A port city and major logistics hub. It's convenient to ship cars from here, and fresh imported vehicles are more commonly found on the market.
          points:
            - Proximity to the port — easier and cheaper to arrange shipping
            - Many cars from the northern regions with highway mileage
            - 'Humid sea climate: pay extra attention to bodywork and hidden cavities'
        dusseldorf:
          lead: The center of North Rhine-Westphalia, Germany's most populous state. Dealerships are closely packed, and the border with the Netherlands and Belgium is just an hour away, so cars come here regularly for sale.
          points:
            - In one trip, we can check several cars — the dealerships are close together
            - 'Some offers have Dutch and Belgian license plates: we check their history and documents separately'
            - Many sellers compete against each other — negotiations are more open
        belgrade:
          lead: Our base. In Belgrade, we can inspect cars on the same day you contact us, we know the local sellers, and we see which cars have been circulating on lots for two months or more.
          points:
            - Inspection on the same day — no waiting or logistics
            - We know local lots and the history of the cars they offer
            - The car is already customs cleared — no import duties are needed
        novi-sad:
          lead: The second-largest city in Serbia, just an hour's drive from Belgrade. The market is smaller, but prices are usually calmer than in the capital, and cars have often undergone fewer resale transactions.
          points:
            - Prices are lower than in Belgrade with comparable condition
            - Fewer resellers, more first owners
            - We head out from Belgrade, no additional charge for the drive
        pancevo:
          lead: Pančevo is effectively part of the Belgrade agglomeration, so inspections here are no different from those in the capital. The market is small, but the private listings are often more interesting.
          points:
            - Twenty minutes from Belgrade — we can get there just as quickly
            - A small market dominated by private sellers
            - Often cheaper than in the capital with similar condition
        subotica:
          lead: 'Subotica lies on the border with Hungary, which is reflected in the market: many cars imported from the EU and sellers who engage in this business regularly.'
          points:
            - Border market — many fresh imports from the European Union
            - We check the history before import especially thoroughly
            - A convenient point if you plan to drive the car further north
        madrid:
          lead: "The capital market of Spain: the largest selection in the country with many vehicles from corporate fleets. The continental climate means there's less coastal corrosion here than on the coastline."
          points:
            - The largest selection in Spain, including corporate vehicles
            - Far from the sea — bodies are usually cleaner than those along the coast
            - 'Hot summers: we check plastics, paint, and air conditioning separately'
        barcelona:
          lead: Everything is defined by proximity to the sea. Cars often look great underneath but require attention to hidden cavities and electrical components.
          points:
            - 'With the sea nearby, we pay attention to hidden cavities: the underside is often clean, but the insides are not'
            - Many former rental and car-sharing vehicles
            - The port is close, making sea shipping easier to arrange
        zurich:
          lead: Zurich has the most expensive car market in the region. Here, buyers go for maximum configurations, have their vehicles serviced at dealerships, and sell them before they even reach their peak.
          points:
            - Maximum configurations and low mileage
            - Dealer servicing — the history is almost always complete
            - Switzerland is not in the EU, so customs clearance is separate
        geneva:
          lead: Geneva is located in the French-speaking part of Switzerland, right by the border with France. French brands are noticeably more common in the market here than in the German-speaking regions.
          points:
            - 'Mixed market: Swiss condition, French selection'
            - The border with France is close — there's a price comparison point
            - 'The process is the same as throughout Switzerland: export plus import'
        paris:
          lead: 'The largest selection in France comes with the toughest conditions: dense traffic and tight parking result in wear and tear on the body and suspension.'
          points:
            - The largest selection in France, especially for French brands
            - 'Urban cycle: tires, suspension, and minor body damage'
            - Many diesel vehicles — check the particulate filter and EGR first
        lyon:
          lead: Lyon is calmer than Paris in both prices and vehicle condition. The highway to the south is close, resulting in more vehicles with highway mileage.
          points:
            - Prices are lower than Paris with comparable choices
            - More highway mileage, less city wear
            - Convenient link to Italy and Spain if you're looking wider
        milan:
          lead: "Italy's business capital is reflected in the market prices. The north of the country is closer to German conditions: the roads are better, and the cars are generally better maintained than in the south."
          points:
            - The best selection of premium vehicles in Italy
            - The north has less salt and corrosion than the southern parts of the country
            - 'A dense city: a paint thickness gauge is essential'
        rome:
          lead: A large market with very dense urban activity. Minor scrapes are seen as a normal part of life here and are often patched up quickly.
          points:
            - A lot of compact cars and vehicles with gas systems
            - Frequent touch-ups after city contacts — we check every panel
            - South of Milan — the climate is milder but closer to the sea
        warsaw:
          lead: The main import from Western Europe enters the country through Warsaw, which also has the largest selection in Poland. The share of restored cars is the highest here.
          points:
            - The largest selection in Poland, many fresh imports from the EU
            - We check the body geometry and signs of repair first
            - Shorter delivery distances — cheaper than from Southern Europe
        krakow:
          lead: 'Krakow is quieter than Warsaw: the market is smaller, there are fewer resales, and cars often have a single owner for a longer period. Southern Poland is logistically closer to the Balkans.'
          points:
            - Fewer resellers than in Warsaw, the history is usually cleaner
            - Prices are often lower than in the capital
            - Closer to the route south — convenient for delivery to Serbia
