    vehicle-inspection:
      title: Inspección de auto
      description: Inspección independiente del coche antes de la compra. Visita del experto, diagnóstico, informe — sin obligación de compra.
      ctaLabel: Solicitar inspección
      casesHeading: 'Transacciones reales: inspección antes de la compra'
      breadcrumbLabel: Inspección de auto
      steps:
        - n: '01'
          text: Carrocería y pintura — existencia de reparaciones o accidentes
        - n: '02'
          text: Suspensión, frenos
        - n: '03'
          text: Motor, caja, transmisión
        - n: '04'
          text: Electrónica e historial de mantenimiento por VIN
        - n: '05'
          text: Pureza legal — garantía, prohibición de registro, accidentes
      extraLine: Trabajamos en otros países de Europa, incluyendo Portugal — consulta al solicitar.
      hub:
        metaTitle: Inspección de autos antes de la compra en Europa
        metaDescription: 'Visitamos el coche que tú encontraste: medidor de grosor, escáner, verificación del historial por VIN y un informe con fotos el mismo día. Trabajamos en ocho países de Europa.'
        title: Inspección de auto
        titleHighlight: antes de la compra
        description: 'Visitamos el coche que tú encontraste y te contamos cómo está realmente. El informe llega antes de que entregues el dinero: si la respuesta es «no compres», solo pierdes el costo de la inspección.'
        breadcrumbLabel: Inspección de auto
        casesHeading: 'Transacciones reales: inspección antes de la compra'
        chooseCountryLabel: 'Elija el país:'
        ctaLabel: Solicitar inspección
        heroPhotoAlt: Automóvil en elevador en el servicio
        processHeading: Cómo se realiza la inspección
        processLead: Generalmente salimos dentro de uno o dos días después de la solicitud. La inspección en sí toma una hora y media a dos, y enviamos el informe el mismo día, mientras el coche aún no se ha vendido a otro comprador.
        processSteps:
          - n: '01'
            text: Envíanos el enlace al anuncio y los contactos del vendedor
          - n: '02'
            text: Acuerdo con el vendedor sobre la hora y el lugar de la inspección
          - n: '03'
            text: Salimos con medidor de grosor y escáner, para BMW conectamos ISTA de concesionario, si es necesario, a un elevador
          - n: '04'
            text: Tomamos fotos y vídeos de todos los hallazgos, verificamos el historial por VIN
          - n: '05'
            text: Enviamos el informe y una respuesta clara — comprar, regatear o rechazar
        includedHeading: Qué incluye la inspección
        includedLead: 'Más de cien puntos de control, pero casi siempre son decisivas cuatro áreas: carrocería, motor con caja, suspensión y documentos. En base a ellas, a menudo desaconsejamos la compra.'
        included:
          - title: Carrocería y pintura
            text: Medidor de grosor en cada panel, geometría de los marcos, señales de soldadura y masilla. Se puede ver si hubo reparaciones que el vendedor no mencionó.
          - title: Motor y caja
            text: Parámetros en motor caliente, adaptaciones de la caja, errores en la memoria de los módulos. La zona más costosa y la razón más frecuente para rechazar.
          - title: Suspensión y frenos
            text: Desperfectos, estado de la suspensión y el sistema de frenos. El desgaste es diferente en carreteras de autopista y balcánicas, y eso se nota.
          - title: Electrónica e historial por VIN
            text: Informe de CarVertical, historial de servicio del concesionario por marca, discrepancias en el kilometraje con la historia, errores de módulos y señales de airbags desplegados.
          - title: Legalidad
            text: Embargos, restricciones de registro, accidentes no resueltos y eventos de seguros — cosas que aparecen después de la compra.
          - title: Informe con fotos y videos
            text: Cada hallazgo está documentado y firmado. El informe se queda con usted — es útil para negociar, incluso si finalmente decide comprar el coche.
        compareHeading: Lo que cambia de un país a otro
        compareLead: Reglamento de inspección técnica, problemas típicos de los coches locales y formas de ocultar la historia en cada lugar.
        compareHint: Elija un país — le mostraremos qué agregamos a la lista de verificación habitual.
        compareLinkFor: Inspección en {location} — en detalle
        mapHeading: Cuatro áreas que cierran el trato
        mapLead: La lista de verificación es larga, pero casi siempre disuadimos por una de las cuatro áreas. Pulse el número en el esquema — le mostraremos qué examina el experto y qué hemos encontrado allí.
      countryNotesHeadingFor: Cómo verificamos {location}
      countryNotesPointsLabel: Qué verificamos más allá de la lista de verificación habitual
      countryNotes:
        de:
          lead: 'En Alemania hay mucho en lo que basarse: libro de servicio, protocolos de HU y bases de datos de VIN bien desarrolladas. Por eso, la verificación aquí se centra principalmente en comparar los documentos con lo que muestra el coche.'
          points:
            - Comparamos las marcas de mantenimiento del concesionario con los odómetros por año
            - Observaciones del último HU — qué se reparó después de la inspección y qué simplemente se pospuso
            - El fondo y los umbrales después de los reactivos de invierno, incluyendo cavidades ocultas
            - 'Pasado de leasing: mantenimiento regular incluso con alto kilometraje'
        rs:
          lead: 'En Serbia salimos el mismo día que contactan. La tarea principal es restaurar la historia del coche antes de la importación: los documentos locales solo muestran el último tramo de la vida del vehículo.'
          points:
            - País de origen y estado del coche antes de la importación a Serbia
            - Lecturas del odómetro en comparación con las marcas de la inspección técnica de años anteriores
            - Reparaciones de carrocería tras la importación — normalmente son más frecuentes y económicas que en la UE
            - 'Parte legal: embargos y restricciones de registro'
        es:
          lead: Los coches españoles suelen alegrar por el estado del fondo y decepcionan a causa de lo que sufre por el sol y la sal. Enfocamos la inspección desde la corrosión en la parte inferior hacia cavidades ocultas, electricidad y estado del interior.
          points:
            - Corrosión en cavidades ocultas en la costa — por debajo puede estar limpio
            - Pintura, selladores y plásticos tras años de sol
            - 'Pasado de alquiler: comparamos el kilometraje con el desgaste del interior'
            - Protocolo ITV y asuntos pendientes entre inspecciones
        ch:
          lead: Los coches se preparan en serio para el MFK, por lo que un protocolo reciente no dice mucho por sí solo. Observamos qué se ha hecho justo antes de la inspección y qué vive su propia vida desde el año pasado.
          points:
            - Qué se ha reemplazado justo antes del MFK — piezas nuevas en comparación con las demás
            - El mantenimiento es caro, por eso revisamos si han pospuesto el reglamento
            - Equipamiento rico, pero verificamos que cada opción aún funcione
            - 'Documentos para la importación: Suiza no está en la UE, el conjunto es diferente'
        pt:
          lead: 'Todo aquí se reduce al húmedo clima marino. Comenzamos la inspección con corrosión y electricidad: normalmente falla lo que vive en la humedad.'
          points:
            - Cavidades ocultas, largueros y puntos de anclaje de la suspensión
            - Oxidación de conectores y módulos — causa típica de errores intermitentes
            - Protocolo IPO y frecuencia de revisiones
            - 'Diésel con uso urbano: filtro de partículas y su historia'
        fr:
          lead: 'En Francia, un detallado contrôle technique es un buen punto de partida. A partir de ahí, observamos lo que el reglamento no capta: la durabilidad del grupo diésel y el desgaste por tráfico urbano.'
          points:
            - Observaciones del contrôle technique a lo largo de los años — qué se repite de inspección a inspección
            - Filtro de partículas, EGR y turbocompresor en diéseles
            - Embrague y suspensión después de un ciclo urbano intenso
            - 'Historia de marcas francesas: piezas asequibles, pero con debilidades propias'
        it:
          lead: Los coches italianos llegan con más frecuencia con reparaciones de carrocería menores, realizadas rápidamente y a bajo costo. Aquí se tarda significativamente más en realizar mediciones con un medidor de grosor en los paneles.
          points:
            - Mediciones en todos los paneles — retoques tras raspados en áreas urbanas
            - 'Diferencia entre el norte y el sur: sal en la costa, desgaste habitual en el interior del país'
            - 'Equipo de gas, si está presente: instalación y estado del cilindro'
            - Regularidad de revisione y períodos perdidos
        pl:
          lead: Polonia es el mayor mercado de transbordo para coches dañados de Europa Occidental. Por lo tanto, primero averiguamos qué se ha hecho a la carrocería antes de la venta.
          points:
            - Geometría de los pasajes y huellas de soldadura — restauración tras un accidente grave
            - 'Historia de importación: de dónde vino el coche y en qué estado'
            - Comparamos el kilometraje con bases de datos de servicios europeos, no confiamos en el odómetro
            - Airbags y su activación en el pasado
      closing:
        eyebrow: ¿Encontraste un coche?
        line1: Envíanos el enlace
        line2: al anuncio —
        accentWord: iremos y lo revisaremos
        text: Salimos en uno o dos días. El informe con fotos se queda con usted, incluso si después de eso decide no comprar.
    cityVehicleSourcing:
      title: Selección de autos
      descriptionFor: Buscaremos un coche en {cityLocation} con una revisión completa. Trabajamos en toda la región de {countryName}.
      casesHeadingFor: Transacciones reales en el mercado de {countryGenitiveOrName}
      whyCityHeadingFor: Por qué {cityName}
      reason1: Revisamos tanto concesionarios como anuncios privados
      reason2: Comprobamos la historia del VIN antes de salir para la inspección
      reason3For: Nuestro experto en {cityLocation}
      reason4Dekra: Inspección DEKRA / TÜV bajo demanda
      reason4Generic: Experiencia técnica independiente bajo demanda
      otherCitiesLabelFor: 'Otras ciudades en {countryLocation}:'
      cityNotesHeadingFor: Mercado automovilístico de {cityLocation}
      cityNotesPointsLabel: Qué significa esto en la práctica
      cityNotes:
        berlin:
          lead: 'Berlín tiene la mayor selección en Alemania y una variada composición de vendedores. Aquí encontramos de todo: desde coches de flotas corporativas con historial completo, hasta opciones de reventa provenientes de Europa del Este.'
          points:
            - Amplia selección en todos los segmentos, incluyendo configuraciones raras
            - 'Muchos vendedores privados: las negociaciones son más reales que con los concesionarios'
            - 'Ciclo urbano: el desgaste de los neumáticos y la suspensión es más notable que en coches de carretera'
        munich:
          lead: 'Una ciudad cara con coches caros. Aquí hay más del segmento premium que en cualquier otro lugar de Alemania, y el estado promedio es superior: los vehículos son bien cuidados.'
          points:
            - Fuerte segmento premium, especialmente BMW y Mercedes
            - Coches bien mantenidos con historial completo de concesionario
            - 'Los precios son más altos que el promedio nacional: el ahorro se refleja en el estado'
        hamburg:
          lead: Ciudad portuaria y gran centro logístico. Desde aquí es conveniente enviar coches y en el mercado a menudo encontramos automóviles importados recientes.
          points:
            - 'Puerto cercano: más fácil y barato organizar el envío'
            - Muchos coches de las tierras del norte con kilometrajes de carretera
            - 'Clima marino húmedo: inspeccionamos mejor la carrocería y los espacios ocultos'
        dusseldorf:
          lead: Centro de Renania del Norte-Westfalia, la región más poblada de Alemania. Las plataformas están cerca y la frontera con los Países Bajos y Bélgica está a una hora, así que regularmente llegan coches a la venta desde allí.
          points:
            - En una sola visita podemos ver varios coches, las plataformas están cerca
            - 'Algunas ofertas tienen matrículas holandesas y belgas: verificamos la historia y la documentación por separado'
            - 'Hay muchos vendedores y compiten entre sí: la negociación es más activa'
        belgrade:
          lead: Nuestra base. En Belgrado podemos inspeccionar el mismo día de la solicitud, conocemos a los vendedores locales y sabemos qué coches llevan dos meses cambiando de plataforma.
          points:
            - Inspección el mismo día de la solicitud, sin esperas ni logística
            - Conocemos las plataformas locales y la historia de los coches que hay en ellas
            - 'El coche ya está despachado: no se requieren impuestos ni aranceles'
        novi-sad:
          lead: La segunda ciudad más grande de Serbia y a una hora de Belgrado. El mercado es más pequeño, pero generalmente los precios son más tranquilos que en la capital, y los coches rara vez han pasado por varias reventas.
          points:
            - Precios más bajos que en Belgrado con condiciones comparables
            - Menos revendedores, más coches de propietarios originales
            - Salimos de Belgrado, sin cargo adicional por el viaje
        pancevo:
          lead: Pančevo forma parte de la aglomeración de Belgrado, por lo que la inspección aquí no difiere de la de la capital. El mercado es pequeño, pero las ofertas privadas suelen ser más interesantes.
          points:
            - 'Veinte minutos de Belgrado: salimos igual de rápido'
            - Mercado pequeño con predominancia de vendedores privados
            - Frecuentemente más barato que la capital con el mismo estado
        subotica:
          lead: 'Subotica está en la frontera con Hungría, y eso se percibe en el mercado: hay muchos coches importados de la UE y vendedores que se dedican a ello constantemente.'
          points:
            - 'Mercado fronterizo: mucho nuevo importado de la Unión Europea'
            - Verificamos especialmente bien la historia antes de la importación
            - Un punto conveniente si planea enviar el coche más al norte
        madrid:
          lead: 'El mercado de la capital de España: la mayor selección del país y muchos coches de flotas corporativas. Con un clima continental, la corrosión marina es menor que en la costa.'
          points:
            - La mayor selección en España, incluyendo coches de empresas
            - 'Lejos del mar: las carrocerías suelen estar más limpias que las costeras'
            - 'Verano caluroso: revisamos el plástico, la pintura y el aire acondicionado por separado'
        barcelona:
          lead: Todo está determinado por la proximidad al mar. Los coches suelen verse excelentes por debajo, pero requieren atención a los espacios ocultos y la electricidad.
          points:
            - 'El mar está cerca, así que revisamos los espacios ocultos: por debajo a menudo está limpio, pero por dentro no'
            - Muchos coches de alquiler y carsharing
            - Puerto cercano, el envío por mar se organiza más fácilmente
        zurich:
          lead: Zúrich es el mercado automovilístico más caro de la región. Aquí los equipamientos son máximos, se mantienen en concesionarios y se venden antes de que los coches se desgasten.
          points:
            - Equipamientos máximos y bajos kilometrajes
            - 'Mantenimiento en concesionario: la historia casi siempre es completa'
            - Suiza no está en la UE, el despacho se realiza por separado
        geneva:
          lead: Ginebra está en la parte francófona de Suiza, muy cerca de la frontera con Francia. Hay más marcas francesas en el mercado que en la parte alemana del país.
          points:
            - 'Mercado mixto: estado suizo, gama francesa'
            - 'La frontera con Francia está cerca: hay precios con los que comparar'
            - 'El procedimiento es el mismo que en toda Suiza: exportación más importación'
        paris:
          lead: 'La mayor selección en Francia viene con un desgaste intenso: el tráfico denso y el escaso espacio para aparcar dejan huellas en la carrocería y la suspensión.'
          points:
            - La mayor selección en Francia, especialmente de marcas francesas
            - 'Ciclo urbano: desgaste de neumáticos, suspensión y pequeños daños en la carrocería'
            - 'Muchos diéseles: revisamos el filtro de partículas y el EGR primero'
        lyon:
          lead: Lyon es más tranquilo que París tanto en precios como en el estado de los coches. La carretera hacia el sur está cerca, así que frecuentemente encontramos vehículos con kilometrajes de autopista.
          points:
            - Precios más bajos que en París con opciones comparables
            - Más kilometrajes de autopista, menos desgaste urbano
            - Una conexión conveniente a Italia y España si buscamos más opciones
        milan:
          lead: 'La capital empresarial de Italia, y esto se nota en los precios del mercado. El norte del país se asemeja más a las condiciones alemanas: las carreteras son mejores, los coches están más cuidados que en el sur.'
          points:
            - La mejor selección de segmento premium en Italia
            - 'El norte: menos sal y corrosión que en el sur del país'
            - 'Ciudad densa: es imprescindible tener un medidor de espesores para las carrocerías'
        rome:
          lead: Un gran mercado con una fuerte actividad urbana. Las pequeñas rozaduras aquí se consideran parte de la vida cotidiana, y a menudo se reparan de forma rápida.
          points:
            - Muchas city cars y vehículos con equipo de gas
            - Frecuentes repintados después de contactos urbanos — revisamos cada panel
            - Al sur de Milán, el clima es más suave, pero más cerca del mar
        warsaw:
          lead: A través de Varsovia, entra el principal flujo de importación desde Europa Occidental, y aquí está la mayor selección en Polonia. La proporción de coches reacondicionados también es la más alta.
          points:
            - La mayor selección en Polonia, mucho importación reciente de la UE
            - Revisamos la geometría de la carrocería y las señales de reparación como prioridad
            - Corto plazo de entrega — más económico que desde el sur de Europa
        krakow:
          lead: 'Cracovia es más tranquila que Varsovia: el mercado es más pequeño, hay menos reventas y los coches suelen tener un solo propietario por más tiempo. El sur de Polonia está más cerca de los Balcanes en logística.'
          points:
            - Menos revendedores que en Varsovia, el historial suele ser más limpio
            - Los precios son a menudo más bajos que en la capital
            - Más cerca de la ruta hacia el sur — conveniente para la entrega a Serbia
