            text: Wir bereiten den Vertrag, die Abmeldung und sämtliche Unterlagen vor. Von Ihnen brauchen wir die Fahrzeugpapiere und Ihre Unterschrift.
          - title: Auszahlung am Tag der Unterschrift
            text: Wir überweisen das Geld noch am selben Tag. Ratenzahlungen oder Zusagen wie „Den Rest zahlen wir nach dem Weiterverkauf“ gibt es bei uns nicht.
          - title: Eine ehrliche Absage
            text: Passt das Auto nicht zu uns, sagen wir es sofort und nennen den Grund. Wir halten Sie nicht hin und drücken auch nicht nachträglich den Preis.
