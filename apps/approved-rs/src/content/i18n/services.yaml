translations:
  en:
    vehicle-sourcing:
      hub:
        metaTitle: Complete Car Sourcing in Europe
        metaDescription: 'We find cars in Germany, Serbia, Spain, Switzerland, Italy, France, Poland, and Portugal: from search to inspection, negotiation, and delivery.'
        title: Car Sourcing
        titleHighlight: Complete
        description: We help you find a vehicle in the country where you are located or planning to buy — complete inspection, deal support, and delivery included. Choose a country to see the details.
        breadcrumbLabel: Car Sourcing
        casesHeading: Car Sourcing Cases
        chooseCountryLabel: 'Choose a Country:'
        ctaLabel: Find a Car
        heroPhotoAlt: A row of cars at a dealership lot
        processHeading: How the Sourcing Process Works
        processLead: "From your request to handing over the keys, the timeframe is usually three days to two weeks. The longest part is finding the right car: we don't settle for the first suitable option and keep looking until we find one that passes inspection without issues."
        processSteps:
          - n: '01'
            text: We discuss your budget, preferred make, and requirements — what’s important and what can be sacrificed.
          - n: '02'
            text: We shortlist options on-site and filter out anything that doesn’t meet our standards over the phone.
          - n: '03'
            text: We conduct an inspection with a thickness gauge and scanner, connecting to the dealer’s ISTA for BMWs, taking photos and videos.
          - n: '04'
            text: We send you a report and provide straightforward advice on whether to proceed or continue searching.
          - n: '05'
            text: We negotiate, handle the paperwork, and deliver the car to you or bring it to your doorstep.
        includedHeading: What’s Included in Our Service
        includedLead: The commission is fixed before we start and does not depend on how many cars we inspect. If after inspection we advise 'don’t buy,’ we continue searching at no additional cost.
        included:
          - title: Unlimited options searching
            text: We work until we find a car with no complaints. Rejecting an unsuccessful option is part of our service at no extra cost.
          - title: Expert onsite for every inspection
            text: Thickness gauges for panels, scanners for systems, a lift wherever necessary. We provide photos and videos of all problem areas — you see exactly what we see.
          - title: Verification of history and legal status
            text: CarVertical report by VIN, dealer service history for the make, mileage checks, liens, registration restrictions, and unresolved insurance claims.
          - title: Negotiation and deal finalization
            text: We agree on the price based on our findings, prepare documents, and assist with signing.
          - title: Delivery and registration assistance
            text: We transport the car to your city and help with local paperwork — or we can hand over the keys wherever is most convenient for you.
          - title: One point of contact throughout the process
            text: You will work with the same specialist who conducted the inspection. No need to repeat your requirements to different people.
        compareHeading: How Markets Differ from Each Other
        compareLead: The same model in Germany and Poland can have different histories and prices; they are essentially two different cars.
        compareHint: Choose a country — we’ll show you what we look for first.
        compareLinkFor: Sourcing in {location} — details available
      title: Complete Car Sourcing
      descriptionFor: We’ll find a vehicle for you in {location} — among cars already in this country, without importing from abroad. Complete inspection, deal support, and delivery to your city — all-inclusive, including customs clearance.
      ctaLabel: Submit a Request
      casesHeadingFor: 'Cases: Car Sourcing in {location}'
      breadcrumbLabelFor: Car in {location}
      stepsFor:
        - n: '01'
          text: You submit a request with your requirements — budget, make, mileage
        - n: '02'
          text: We search for options in {location} based on your criteria
        - n: '03'
          text: An independent expert inspects and checks the vehicle
        - n: '04'
          text: We support the transaction, helping with documents and registration
        - n: '05'
          text: We deliver the vehicle to your city — all-inclusive, including customs clearance
      deliveryLineFor: We deliver to {destinations} — and to any other country, which we can discuss during the request process.
      deliveryDestinations:
        - Russia
        - Kazakhstan
        - Kyrgyzstan
        - Ukraine
        - Belarus
        - Bosnia and Herzegovina
        - Croatia
        - North Macedonia
        - Turkey
      citiesHeadingFor: Where We Inspect Cars in {countryLocation}
      citiesLead: Our experts travel throughout the country, but we most often inspect cars where they are most commonly listed. Here’s what this means for each city.
      alsoInLabel: 'We also source in:'
      crossSellLabel: Need a non-local vehicle?
      countryNotesHeadingFor: What We Consider in {location}
      countryNotesPointsLabel: Our primary considerations
      countryNotes:
        de:
          lead: 'The selection here is larger than any other market in Europe, and service history is usually traceable: most cars come with a service booklet detailing each maintenance by the dealer. The downside is the high mileage; 200,000 km in three years is normal here, not a reason for a discount.'
          points:
            - Service booklet and dealer records — we verify by VIN with official service
            - The HU protocol, often referred to as TÜV, — we read comments from the previous inspection, not just the stamp
            - 'Cars from leasing and corporate fleets: maintained evenly, but with high mileage'
            - Winter roads using de-icing agents — we inspect the undercarriage and sills separately
        rs:
          lead: We are on-site here, so we inspect the vehicle on the day of your request without imports. The market is small, and the same car may pass through several sellers, making the history challenging to untangle.
          points:
            - The car is already customs cleared and has local plates — import duties and paperwork are not necessary
            - Mileage is often altered during resale within the country — we check against technical inspection records
            - Many vehicles are imported from Germany and Italy — we verify the car's condition before import
            - Inspection on the day of request, without waiting for logistics
        es:
          lead: The mild winter and minimal de-icing agents on the roads mean that the undercarriage of Spanish cars is generally in better condition than German cars. However, the sun and proximity to the sea can damage paint, plastic, and rubber.
          points:
            - On the coastline — we primarily seek corrosion in hidden cavities
            - Faded lacquer and cracked interior plastics — we factor this into the cost
            - 'Many former rental cars: consistent mileage but harsh usage'
            - ITV protocol — we check comments and inspection dates
        ch:
          lead: 'Swiss cars are typically better cared for than the European average: expensive servicing instills discipline, and mileage is often low. However, Switzerland is not in the EU, so import procedures differ, and we factor this into the budget in advance.'
          points:
            - Rich configurations — they are more frequently chosen here than in neighboring countries
            - MFK — the inspection is strict; preparations are serious, and this is evident in the vehicle
            - 'Non-EU: customs and documentation are handled differently than for EU countries'
            - Prices are higher than the market, but you save on repairs later
        pt:
          lead: The market is small, and the selection is more modest than in Spain, but competition for a good car is lower. The climate is humid and salty, so coastal corrosion can occur even on newer vehicles.
          points:
            - Humidity and sea — hidden cavities and electrical systems are prioritized during inspection
            - 'Small market: we often take longer to find specific requests compared to Germany'
            - IPO protocol — we read comments from previous inspections
            - Many diesels and small cars; larger bodies are rare
        fr:
          lead: France is primarily known for diesel and domestic brands. Peugeot, Renault, and Citroën are cheaper here than anywhere else in Europe, while German premium brands are more expensive and less sensible to buy here.
          points:
            - French brands — the best prices in Europe, and servicing is cheaper
            - For diesels — we check the particulate filter and EGR valve as a separate item
            - Contrôle technique — comprehensive protocols, we verify remarks by year
            - 'City driving: clutches and suspensions wear out faster than advertised'
        it:
          lead: 'The Italian market excels in compact cars and unique configurations, but requires caution: vehicles here are often heavily used, and minor body repairs may not be done perfectly.'
          points:
            - City — frequent minor bumps and touch-ups; a thickness gauge is necessary
            - The south and coastal regions are prone to salt and corrosion; the north is closer to German conditions
            - Revisione — we check the regularity, as lapses are more common than expected
            - Many cars with gas conversions — we inspect this separately
        pl:
          lead: 'The closest major market to us: logistics is affordable and quick. However, Poland has long been a key transit point for damaged cars from Western Europe, so we scrutinize history here more than anywhere else.'
          points:
            - High proportion of cars restored after accidents — body geometry is a top priority
            - 'Frequent resales: a car can change several owners in a year'
            - Mileage is often altered when importing — we verify against service records
            - Short delivery distances — cheaper and quicker than from Spain or Portugal
      closing:
        eyebrow: How do we begin?
        line1: Describe the car you are looking for,
        line2: — and then it's our job
        accentWord: Moving forward, we handle everything
        text: Budget, body type, transmission, plus a few wishes on top. We search, while you review reports on options and decide which one to inspect in person.
    vehicle-buyback:
      hub:
        metaTitle: Buyback of cars with Russian plates in Europe
        metaDescription: We buy cars with Russian plates in any country in Europe and cars with Serbian plates in Serbia. Photo assessment within an hour, payment on the day of signing.
        title: Car Buyback
        titleHighlight: no haggling for weeks
        description: 'We take care of cars that are hard to sell through conventional means: Russian plates, expired temporary import, disputed documents. The price is below market value — this is the cost of speed and for taking care of all the selling hassles for you.'
        breadcrumbLabel: Car Buyback
        casesHeading: Buyback Cases
        chooseCountryLabel: 'Select a country:'
        ctaLabel: Get an Assessment
        heroPhotoAlt: Keys to a car on money and documents
        processHeading: How the Buyback Works
        processLead: From the first message to cash in hand usually takes two to three days, most of which is travel time to the meeting location. We provide a photo assessment within an hour.
        processSteps:
          - n: '01'
            text: You send photos, documents, and an honest description of the condition
          - n: '02'
            text: We give a price within an hour — the final amount, no range
          - n: '03'
            text: We agree on a meeting spot where the car is located; if it’s not running — we arrive with a trailer
          - n: '04'
            text: We inspect in person and confirm the price, if the description matches
          - n: '05'
            text: We sign the contract, and payment is made on the day of signing
        includedHeading: What We Handle
        includedLead: For the difference between our price and market value, we take care of everything that causes such cars to remain unsold for months.
        included:
          - title: Cars with Russian Plates
            text: The main category. The car can be in any country in Europe — we’ll come to where it is, while we handle the export and resale ourselves.
          - title: Import Issues and Deadlines
            text: After signing, the expired temporary import and associated risks transfer to us.
          - title: Assessment Without Inspection
            text: We provide a price based on photos and documents. We only visit once both parties agree on the amount.
          - title: Transaction Handling
            text: We prepare the contract, unregistering, and all necessary paperwork ourselves. All you need to provide are the car documents and your signature.
          - title: Payment on the Day of Signing
            text: Funds are transferred the same day. We don’t offer installment plans or ‘we'll pay more after resale’ schemes.
          - title: Honest Refusal
            text: If the car isn't right for us, we’ll let you know immediately and explain why. We won't stretch things out or try to negotiate down the price.
      title: Car Buyback
      ctaLabel: Get an Assessment
      casesHeading: Buyback Cases
      breadcrumbLabel: Car Buyback
      descriptionSerbia: We buy cars with Russian plates below market value — the car can be in any country in Europe. We also buy cars with Serbian plates in Serbia and Montenegro. Online assessment, paperwork completed in one day, payment on the day of the deal.
      descriptionOtherFor: We buy cars with Russian plates below market value — the car can be in any country in Europe, including {name}. Online assessment, paperwork completed in one day, payment on the day of the deal.
      serbiaLinkLabel: Car with Serbian plates?
      step1: Send photos and description of the vehicle
      step2: We provide online assessment based on photos within an hour — below market value
      step3Serbia: We meet for an inspection — Russian plates (in any country in Europe) or Serbian plates (Serbia, Montenegro)
      step3Other: We meet for an inspection — Russian plates, the car can be in any country in Europe
      step4: We handle the transaction, payment on the day of signing
      closing:
        eyebrow: Want an assessment?
        line1: Send us photos
        line2: and documents —
        accentWord: the price will be ready in an hour
        text: The assessment is free and comes with no obligations. If you’re not satisfied with the price, we part ways without pressure or follow-up calls.
    vehicle-import:
      hub:
        metaTitle: Importing Cars from Europe and China Made Easy
        metaDescription: We bring cars from Germany, Spain, Switzerland, and China to any country — sourcing, inspection, delivery, and customs clearance made simple.
        title: Car Importing
        titleHighlight: from Europe and China
        description: The car is in Europe or China, and you are anywhere else. We source, inspect, and deliver it to you, including customs clearance.
        breadcrumbLabel: Car Importing
        casesHeading: Import Cases
        euCardTitle: From Europe
        euCardText: Spain, Switzerland, and other countries — sourcing and delivery to any location.
        chinaCardTitle: From China
        chinaCardText: New and used cars from China — delivered through a trusted partner.
        exploreLabel: Learn More
        ctaLabel: Calculate Import Costs
        heroPhotoAlt: Car carrier loaded with vehicles
        processHeading: How the Import Works
        processLead: Typically, it takes four to eight weeks from application to registration, with transport taking the least amount of time. From Germany to Belgrade, a car travels in just a few days, while customs and registration can take weeks.
        processSteps:
          - n: '01'
            text: We calculate the total cost before starting — the car, logistics, duties, and documentation
          - n: '02'
            text: We find and inspect the car in the country of origin
          - n: '03'
            text: We purchase the car through our European company, deregister it, and prepare export documents
          - n: '04'
            text: We transport it using a car carrier or self-drive with transit plates
          - n: '05'
            text: We clear customs, register the car, and hand over the keys
        includedHeading: What the Price Includes
        includedLead: "When importing on your own, the budget often falls apart due to hidden costs beyond the car's price. We calculate it in advance and lock it in: the final amount shouldn't differ from the initial estimate."
        included:
          - title: Cost of the Car
            text: The price after negotiations, not just the listing price. We negotiate based on what we see in person — usually, this helps to offset some of the expenses.
