  es:
    vehicle-sourcing:
      hub:
        metaTitle: Selección de coches en Europa llave en mano
        metaDescription: 'Seleccionamos coches en Alemania, Serbia, España, Suiza, Italia, Francia, Polonia y Portugal: búsqueda, inspección, negociación y entrega llave en mano.'
        title: Selección de coches
        titleHighlight: llave en mano
        description: Seleccionamos un vehículo en el país donde se encuentra o donde planea comprar — verificación completa, asistencia en la transacción y entrega llave en mano. Seleccione un país para ver los detalles.
        breadcrumbLabel: Selección de coches
        casesHeading: Transacciones reales de selección de coches
        chooseCountryLabel: 'Seleccione un país:'
        ctaLabel: Seleccionar coche
        heroPhotoAlt: Una fila de coches en el lote del concesionario
        processHeading: Cómo se realiza la selección
        processLead: Desde la solicitud hasta la entrega generalmente toma de tres días a dos semanas. Buscamos el coche más adecuado; no tomamos el primero que vemos y seguimos buscando hasta encontrar uno sin problemas tras la inspección.
        processSteps:
          - n: '01'
            text: Discutimos el presupuesto, la marca y los requisitos — qué es importante y qué se puede sacrificar
          - n: '02'
            text: Seleccionamos opciones en el lugar y filtramos por teléfono todo lo que no cumpla con los criterios
          - n: '03'
            text: Hacemos la inspección con un medidor de espesor y un escáner, en el caso de BMW conectamos el ISTA del concesionario, tomamos fotos y videos
          - n: '04'
            text: Enviamos un informe y decimos claramente si se debe proceder con la compra o seguir buscando
          - n: '05'
            text: Negociamos, formalizamos la transacción y entregamos el coche a usted o lo llevamos a su puerta
        includedHeading: Qué está incluido en el servicio
        includedLead: La comisión se establece antes del comienzo y no depende de cuántos coches se hayan inspeccionado. Si después de la verificación decimos «no lo compre», seguimos buscando sin costo adicional.
        included:
          - title: Búsqueda sin límite en la cantidad de opciones
            text: Trabajamos hasta encontrar un coche que cumpla con las expectativas. No hay costo adicional por rechazar una opción no satisfactoria.
          - title: Visita de un experto para cada inspección
            text: Medidor de espesor en paneles, escáner en bloques, elevador donde sea necesario. Fotos y videos de todos los lugares problemáticos — usted ve lo mismo que nosotros.
          - title: Verificación del historial y legalidad
            text: Informe de CarVertical por VIN, historial de servicio del concesionario de la marca, revisión del kilometraje, cargas, restricciones de registro y eventos de seguros no resueltos.
          - title: Negociación y formalización de la transacción
            text: Negociamos el precio basado en lo encontrado, preparamos documentos y acompañamos la firma.
          - title: Entrega y registro
            text: Llevamos el coche hasta su ciudad y ayudamos con la documentación en el lugar — o le entregamos las llaves donde le sea conveniente recogerlo.
          - title: Una sola persona para todo el proceso
            text: Usted trabaja con el mismo especialista que realizó la inspección. No es necesario explicar nuevamente la tarea a cada persona que conteste el teléfono.
        compareHeading: Cómo se diferencian los mercados entre sí
        compareLead: El mismo modelo en Alemania y en Polonia — en historia y precio, son dos coches diferentes.
        compareHint: Seleccione un país — le mostraremos qué buscamos allí primero.
        compareLinkFor: Selección {location} — detalles
      title: Selección de coches llave en mano
      descriptionFor: Seleccionaremos un coche {location} — entre los que ya están en este país, sin importar el extranjero. Verificación completa, asistencia en la transacción y entrega a su ciudad.
      ctaLabel: Enviar solicitud
      casesHeadingFor: 'Transacciones reales: selección de coches {location}'
      breadcrumbLabelFor: Coches {location}
      stepsFor:
        - n: '01'
          text: Envía una solicitud con requisitos — presupuesto, marca, kilometraje
        - n: '02'
          text: Buscamos opciones {location} según sus criterios
        - n: '03'
          text: Un experto independiente inspecciona y verifica el coche
        - n: '04'
          text: Acompañamos la transacción, ayudamos con documentos y registro
        - n: '05'
          text: Entregamos el coche a su ciudad y ayudamos a registrarlo
      deliveryLineFor: Llevaremos el coche a cualquier ciudad del país. Si necesita exportarlo, nos encargamos de la exportación y la aduana — lo llevamos a {destinations} y a cualquier otro país.
      deliveryDestinations:
        - Bosnia y Herzegovina
        - Croacia
        - Macedonia del Norte
        - Turquía
        - Kazajistán
        - Kirguistán
      citiesHeadingFor: Dónde inspeccionamos coches {countryLocation}
      citiesLead: El experto viaja por todo el país, pero generalmente inspeccionamos coches donde hay más disponibles. Esto implica lo siguiente para cada ciudad.
      alsoInLabel: 'También seleccionamos en:'
      crossSellLabel: ¿Necesita un coche que no sea local?
      countryNotesHeadingFor: Qué consideramos en {location}
      countryNotesPointsLabel: A qué prestamos atención primero
      countryNotes:
        de:
          lead: 'La selección aquí es mayor que en cualquier otro mercado de Europa, y la historia de mantenimiento generalmente es rastreable: la mayoría de los coches tienen un libro de servicio con notas del concesionario para cada mantenimiento. La desventaja — altos kilometrajes en autopista. Doscientos mil en tres años es la norma aquí, no un motivo para un descuento.'
          points:
            - Libro de servicio y anotaciones del concesionario — verificamos por VIN en el servicio oficial
            - Protocolos de HU, que todos llaman TÜV — leemos las observaciones de la inspección anterior, no solo el sello
            - 'Coches de leasing y flotas corporativas: mantenidos adecuadamente, pero con altos kilometrajes'
            - Carreteras invernales con productos químicos — revisamos el bastidor y los umbrales por separado
        rs:
          lead: Aquí estamos presentes, por lo que inspeccionamos el coche el mismo día de la solicitud y sin importar el extranjero. El mercado es pequeño, por lo que el mismo coche puede haber pasado por varios vendedores, lo que complica la historia.
          points:
            - El coche ya está despachado y con matrícula local — no hay aranceles ni trámites de importación
            - El kilometraje a menudo se ajusta durante la reventa dentro del país — verificamos las anotaciones del tech-examen
            - Muchos coches importados de Alemania e Italia — verificamos qué le sucedió al coche antes de la importación
            - Inspección el mismo día de la solicitud, sin esperas por logística
        es:
          lead: Invierno suave y casi sin productos químicos en las carreteras, por lo que el bastidor de los coches españoles suele estar en mucho mejor estado que el de los alemanes. Sin embargo, el sol y la cercanía al mar afectan la pintura, el plástico y las piezas de goma.
          points:
            - Para la costa — buscamos corrosión principalmente en cavidades ocultas
            - Barniz desgastado y plástico agrietado en el interior — lo incluimos en el precio
            - 'Muchos coches de alquiler anteriores: kilometraje uniforme, pero uso riguroso'
            - 'Protocolo ITV: revisamos las observaciones y fechas de inspección'
        ch:
          lead: 'Los coches suizos están mucho mejor cuidados que el promedio en Europa: el mantenimiento costoso impone disciplina, los kilometrajes son bajos. Pero Suiza no está en la UE, así que la importación se gestiona de forma distinta y esto lo contemplamos en el presupuesto desde el principio.'
          points:
            - 'Equipamiento lujoso: aquí se eligen con más frecuencia que en los países vecinos'
            - 'MFK: la inspección es rigurosa, se prepara seriamente, y eso se nota en el coche'
            - 'No pertenece a la UE: aduanas y documentos se gestionan de forma diferente que en los países de la Unión'
            - Precios por encima del mercado, pero luego ahorras en reparaciones
        pt:
          lead: 'El mercado es pequeño, la selección es más modesta que en España, pero la competencia por buenos coches es menor. El clima es húmedo y salino: la corrosión costera se encuentra incluso en autos nuevos.'
          points:
            - 'Humedad y mar: cavidades ocultas y electricidad son prioridad en la inspección'
            - 'Mercado pequeño: tardamos más en buscar según parámetros específicos que en Alemania'
            - 'Protocolo IPO: revisamos las observaciones de inspecciones anteriores'
            - Muchos diéseles y utilitarios pequeños, carrocerías grandes son poco comunes
        fr:
          lead: Francia es, ante todo, diésel y marcas propias. Peugeot, Renault y Citroën son más baratos aquí que en cualquier otro lugar de Europa. El premium alemán, al contrario, es más caro, así que no tiene sentido comprarlo aquí.
          points:
            - Las marcas francesas tienen los mejores precios en Europa, y el mantenimiento es más económico
            - 'Diéseles: revisamos el filtro de partículas y la válvula EGR de forma específica'
            - 'Contrôle technique: los protocolos son detallados, revisamos las observaciones por años'
            - 'Uso urbano: el desgaste de la tracción y la suspensión es más rápido de lo declarado'
        it:
          lead: 'El mercado italiano es bueno en utilitarios y equipamientos raros, pero requiere precaución: los coches aquí se utilizan intensamente, y las reparaciones de carrocería pequeñas no siempre son efectuadas correctamente.'
          points:
            - 'En la ciudad: golpes menores frecuentes y retoques, el medidor de grosor es esencial'
            - El sur y la costa traen sal y corrosión, el norte se asemeja más a las condiciones alemanas
            - 'Revisione: comprobamos la regularidad, las omisiones son más comunes de lo habitual'
            - 'Muchos coches con equipo de gas: los revisamos por separado'
        pl:
          lead: 'El mercado más grande cercano a nosotros: la logística es barata y corta. Pero Polonia ha sido durante años el principal punto de transferencia para coches dañados de Europa Occidental, por lo que revisamos la historia aquí de manera más estricta que en ningún otro lugar.'
          points:
            - 'Alta proporción de coches restaurados tras accidentes: la geometría de la carrocería es prioritaria'
            - 'Reventas frecuentes: un coche puede cambiar de dueño varias veces en un año'
            - 'El kilometraje a menudo se modifica en la importación: lo comprobamos con bases de datos de servicio'
            - 'Distancia de entrega corta: más barata y rápida que desde España o Portugal'
      closing:
        eyebrow: ¿Por dónde empezamos?
        line1: Describe el coche que buscas,
        line2: '-'
        accentWord: nuestra parte es lo demás
        text: Presupuesto, tipo de carrocería, tipo de caja, un par de deseos adicionales. Nosotros buscamos, y tú revisas los informes de las opciones y decides cuál ver en persona.
