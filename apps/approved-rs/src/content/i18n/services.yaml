        processLead: Obično od zahteva do registarskih oznaka prolazi od četiri do osam nedelja, a putovanje zauzima najmanje vremena. Iz Nemačke do Beograda automobil putuje nekoliko dana, dok carinjenje i registracija traju nedeljama.
        processSteps:
          - n: '01'
            text: Prvo izračunavamo ukupne troškove pre početka — automobil, logistika, dažbine, dokumentacija
          - n: '02'
            text: Pronalažemo i proveravamo automobil u zemlji izvoznici
          - n: '03'
            text: Kupujemo automobil na svoju evropsku firmu, skidamo ga sa registra i pripremamo izvoznu dokumentaciju
          - n: '04'
            text: Transportujemo ga preko transportnog vozila ili na druge načine sa tranzitnim registarskim brojevima
          - n: '05'
            text: Prolazimo kroz carinu, obavljamo registraciju i predajemo ključeve
        includedHeading: Od čega se sastoji cena
        includedLead: 'Kada se uvoz vrši samostalno, trošak često prevaziđe cenu automobila. Mi ga izračunavamo unapred i fiksiramo: konačni iznos ne bi trebao da se razlikuje od prvobitnog obračuna.'
        included:
          - title: Cena samog automobila
            text: Cena nakon pregovora, a ne iz oglasa. Pregovaramo uz automobil koji je pregledan — to obično smanjuje troškove.
          - title: Logistika do odredišta
            text: Transportno vozilo ili prevoz sa tranzitnim registarskim brojevima. Upoređujemo oba načina i biramo onaj koji je povoljniji za određenu dionicu.
          - title: Dužbine i porezi
            text: Stopa zavisi od zemlje porekla automobila i njegove starosti. Za automobile rađene u Evropi, sertifikat EUR1 značajno menja obračun — proveravamo njegovu dostupnost pre kupovine.
          - title: Izvoz i tranzit
            text: Skidanje s registra u zemlji prodavcu, izvozna deklaracija, tranzitni registarski brojevi i osiguranje za prevoz.
          - title: Carinska procedura
            text: Deklaracija, broker i uplata na mestu dolaska. Pripremamo dokumente unapred, kako automobil ne bi stajao na skladištu duže nego što je potrebno.
          - title: Registracija
            text: Tehnički pregled, registracija i registarske oznake. Preuzimate automobil sa kojim možete odmah krenuti.
