            text: Biramo opcije na licu mesta i odbacujemo na telefon sve što ne ispunjava kriterijume
          - n: '03'
            text: Idemo na provere sa debljinskom mernom alatkom i skenerom, za BMW priključujemo dealersku ISTA, snimamo slike i video
          - n: '04'
            text: Šaljemo izveštaj i direktno kažemo da li vredi uzeti ili tražiti dalje
          - n: '05'
            text: Pregovaramo, pripremamo ugovor i predajemo auto vama ili ga transportujemo do vrata
        includedHeading: Šta je uračunato u uslugu
        includedLead: Provizija se utvrđuje pre početka i ne zavisi od broja automobila koje je potrebno pregledati. Ako nakon provere kažemo 'ne uzimajte' - tražimo dalje, nije potrebno dodatno plaćati.
        included:
          - title: Pretraga bez ograničenja u broju opcija
            text: Radimo dok ne pronađemo auto bez pritužbi. Odbacivanje neuspešne opcije je deo usluge i ne košta dodatno.
          - title: Izlazak stručnjaka na svaku proveru
            text: Debljinska mera na panelima, skener po blokovima, dizalica gde je potrebna. Fotografije i video snimci sa svih problematičnih mesta - vidite ono što i mi.
          - title: Provera istorije i pravne čistoće
            text: Izveštaj CarVertical po VIN-u, dealerska servisna istorija po marki, provera pređenih kilometara, hipoteka, ograničenja na registraciju i neuređeni osiguravajući događaji.
          - title: Pregovaranje i sprovođenje ugovora
            text: Slažemo se oko cene uzimajući u obzir pronađeno, pripremamo dokumente i pratimo potpisivanje.
          - title: Isporuka i registracija
            text: Transportujemo auto do vašeg grada i pomažemo sa registracijom na licu mesta - ili predajemo ključeve tamo gde vam je najprikladnije.
          - title: Jedna osoba kroz ceo proces
            text: Sa vama radi isti stručnjak koji je bio na proveri. Nije potrebno ponovo objašnjavati zadatak svima koji odgovore na telefon.
