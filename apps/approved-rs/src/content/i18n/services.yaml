          lead: 'Švajcarska nije deo EU, tako da automobil prolazi kroz carinu dva puta: na izlazu iz zemlje i na ulazu u konačnu destinaciju. To je glavna razlika u odnosu na bilo koju rutu unutar Evropske unije.'
