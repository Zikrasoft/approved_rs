    vehicle-inspection:
      title: Fahrzeuginspektion
      description: Unabhängige Inspektion eines Fahrzeugs vor dem Kauf. Gutachter vor Ort, Diagnose, Bericht – ohne Kaufverpflichtung.
      ctaLabel: Inspektion beauftragen
      casesHeading: Inspektionsfälle
      breadcrumbLabel: Fahrzeuginspektion
      steps:
        - n: '01'
          text: Karosserie und Lack – Reparaturen oder Unfälle
        - n: '02'
          text: Fahrwerk, Aufhängung, Bremsen
        - n: '03'
          text: Motor, Getriebe, Antrieb
        - n: '04'
          text: Elektronik und Wartungshistorie nach VIN
        - n: '05'
          text: Rechtliche Sauberkeit – Pfand, Registrierungsstopp, Unfälle
      extraLine: Wir arbeiten auch in anderen Ländern Europas, einschließlich Portugal – bitte bei der Anfrage angeben.
      hub:
        metaTitle: Fahrzeuginspektion vor dem Kauf in Europa
        metaDescription: 'Wir kommen zu dem Fahrzeug, das Sie selbst gefunden haben: Dickenmessgerät, Scanner, Überprüfung der VIN-Historie und Bericht mit Fotos am selben Tag. Wir arbeiten in acht europäischen Ländern.'
        title: Fahrzeuginspektion
        titleHighlight: vor dem Kauf
        description: 'Wir kommen zu dem Fahrzeug, das Sie selbst gefunden haben, und berichten, was tatsächlich damit ist. Der Bericht kommt, bevor Sie das Geld übergeben: Falls die Antwort "nicht kaufen" lautet, verlieren Sie nur die Kosten für die Inspektion.'
        breadcrumbLabel: Fahrzeuginspektion
        casesHeading: Inspektionsfälle
        chooseCountryLabel: 'Land auswählen:'
        ctaLabel: Inspektion beauftragen
        heroPhotoAlt: Auto auf einer Hebebühne in der Werkstatt
        processHeading: So läuft die Inspektion ab
        processLead: In der Regel fahren wir innerhalb von ein bis zwei Tagen nach der Anfrage los. Die Besichtigung selbst dauert anderthalb bis zwei Stunden, den Bericht senden wir am selben Tag, solange das Auto noch nicht verkauft wurde.
        processSteps:
          - n: '01'
            text: Sie senden uns den Link zur Anzeige und die Kontaktdaten des Verkäufers
          - n: '02'
            text: Wir vereinbaren mit dem Verkäufer einen Termin und Ort für die Besichtigung
          - n: '03'
            text: Wir kommen mit Dickenmessgerät und Scanner, bei BMW verbinden wir mit dem Händler-ISTA, falls notwendig – auf die Hebebühne
          - n: '04'
            text: Wir machen Fotos und Videos von allen Funden, überprüfen die Geschichte nach VIN
          - n: '05'
            text: Wir senden den Bericht und die direkte Antwort – kaufen, handeln oder ablehnen
        includedHeading: Was zur Inspektion gehört
        includedLead: 'Über hundert Punkte auf der Checkliste, aber fast immer entscheiden vier Bereiche: Karosserie, Motor mit Getriebe, Fahrwerk und Dokumente. Genau nach diesen warnen wir am häufigsten vor dem Kauf.'
        included:
          - title: Karosserie und Lack
            text: Dickenmessgerät an jedem Panel, Geometrie der Öffnungen, Schweiß- und Spachtelspuren. Man sieht, ob es Reparaturen gab, die der Verkäufer nicht erwähnt hat.
          - title: Motor und Getriebe
            text: Parameter beim warmen Motor, Anpassungen des Getriebes, Fehler im Speicher der Steuergeräte. Größter Bereich und häufigster Grund für Ablehnung.
          - title: Fahrwerk und Bremsen
            text: Spiel, Zustand der Aufhängung und der Bremsanlage. Autobahnkilometer und Balkanstrecken beanspruchen Autos unterschiedlich, und das sieht man.
          - title: Elektronik und Historie nach VIN
            text: CarVertical Bericht, Händlerservice-Historie nach Marke, Abweichungen des Kilometerstands von der Historie, Fehler der Steuergeräte und Spuren aktiver Airbags.
          - title: Rechtliche Sauberkeit
            text: Pfand, Registrierungsstopp, unerledigte Unfälle und Versicherungsereignisse – das kommt oft erst nach dem Kauf ans Licht.
          - title: Bericht mit Fotos und Videos
            text: Jeder Fund ist dokumentiert und beschriftet. Der Bericht bleibt bei Ihnen – damit können Sie gut verhandeln, selbst wenn Sie das Auto letztendlich kaufen.
        compareHeading: Was sich von Land zu Land ändert
        compareLead: Vorschriften zur technischen Inspektion, typische Mängel lokaler Fahrzeuge und wie überall die Geschichte verschleiert wird.
        compareHint: Wählen Sie ein Land – wir zeigen, was wir zur üblichen Checkliste hinzufügen.
        compareLinkFor: Inspektion {location} – im Detail
        mapHeading: Vier Bereiche, die den Deal entscheiden
        mapLead: Die Checkliste ist lang, aber wir warnen fast immer aufgrund eines der vier Bereiche. Klicken Sie die Nummer auf dem Schema – wir zeigen, wonach der Gutachter schaut und was wir dort gefunden haben.
      countryNotesHeadingFor: So prüfen wir {location}
      countryNotesPointsLabel: Was über die übliche Checkliste hinaus geprüft wird
      countryNotes:
        de:
          lead: 'In Deutschland gibt es viel, worauf man sich stützen kann: Serviceheft, HU-Protokolle und gut entwickelte Datenbanken nach VIN. Daher besteht die Prüfung hier in erster Linie darin, die Dokumente mit dem abzugleichen, was das Auto tatsächlich zeigt.'
          points:
            - Wir überprüfen die Händlerwerkstatt-Vermerke gegen die Kilometerstände der Jahre
            - Anmerkungen der letzten HU – was nach der Prüfung repariert wurde und was nur hinausgeschoben wurde
            - Unterboden und Schweller nach Winterchemikalien, einschließlich versteckter Hohlräume
            - 'Leasinghistorie: gleichmäßige Wartung bei hohem Kilometerstand'
        rs:
          lead: 'In Serbien fahren wir am Tag der Anfrage los. Die Hauptaufgabe besteht darin, die Geschichte des Fahrzeugs bis zur Einfuhr zu rekonstruieren: Lokale Dokumente zeigen nur den letzten Abschnitt des Lebens des Autos.'
          points:
            - Herkunftsland und Zustand des Fahrzeugs vor der Einfuhr nach Serbien
            - Kilometerstand gegen die Vermerke der technischen Prüfung der vergangenen Jahre
            - Karosseriereparaturen nach der Einfuhr – diese werden häufiger und günstiger durchgeführt als in der EU
            - 'Rechtliche Aspekte: Pfand und Beschränkungen bei der Registrierung'
        es:
          lead: Spanische Autos punkten normalerweise mit einem sauberen Unterboden und enttäuschen bei allem, was unter Sonne und Salz leidet. Die Prüfung verlagern wir von der Korrosion unten auf versteckte Hohlräume, Elektronik und den Zustand des Innenraums.
          points:
            - Korrosion in versteckten Hohlräumen an der Küste – von unten kann es sauber sein
            - Lack, Dichtungen und Kunststoff nach jahrelanger Sonneneinstrahlung
            - 'Vermietungshistorie: wir vergleichen den Kilometerstand mit dem Verschleiß des Innenraums'
            - ITV-Protokoll und unerledigte Punkte zwischen den Prüfungen
        ch:
          lead: Für die MFK werden die Fahrzeuge ernsthaft vorbereitet, daher sagt ein frisches Protokoll allein wenig aus. Wir schauen, was direkt vor der Prüfung gemacht wurde und was seit dem letzten Jahr „lebt“.
          points:
            - Was direkt vor der MFK ersetzt wurde – frische Teile im Vergleich zu den anderen
            - Wartung ist teuer, daher prüfen wir, ob der Wartungsplan eingehalten wurde
            - Umfangreiche Ausstattung, aber wir prüfen, ob jede Option noch funktioniert
            - 'Einfuhrdokumente: die Schweiz ist nicht in der EU, das Set unterscheidet sich'
        pt:
          lead: 'Hier dreht sich alles um das feuchte Meeresklima. Wir beginnen die Prüfung mit Korrosion und Elektronik: normalerweise versagt das, was in der Feuchtigkeit lebt.'
          points:
            - Versteckte Hohlräume, Längsträger und Punkte der Aufhängungsbefestigung
            - Oxidation von Steckverbindern und Steuergeräten – ein typischer Grund für fliegende Fehler
            - IPO-Protokoll und Regelmäßigkeit der Prüfungen
            - 'Dieselautos mit urbaner Nutzung: Partikelfilter und deren Historie'
        fr:
          lead: 'In Frankreich gibt es eine detaillierte technische Kontrolle, und das ist ein guter Ausgangspunkt. Danach schauen wir, was die Vorschriften nicht erfassen: Dieselgruppenschaden und Abnutzung durch Stadtverkehr.'
          points:
            - Anmerkungen der technischen Kontrolle nach Jahren – was sich zwischen den Prüfungen wiederholt
            - Partikelfilter, EGR und Turbine bei Dieselmotoren
            - Kuppelung und Aufhängung nach intensivem Stadtbetrieb
            - 'Historie bei französischen Marken: verfügbare Teile aber auch eigene Schwachstellen'
        it:
          lead: Italienische Autos haben häufig kleinere Karosseriereparaturen mit schneller und günstiger Ausführung. Um die Dicke der Panels zu messen, benötigt man hier deutlich mehr Zeit als üblich.
          points:
            - Dickenmessung an allen Panels – Lackierungen nach städtischem Touchieren
            - 'Unterschied zwischen Nord und Süd: Salz an der Küste, übliche Abnutzung im Landesinneren'
            - Gasinstallation, sofern vorhanden – Installation und Zustand des Tanks
            - Regelmäßigkeit der revisione und versäumte Zeiträume
        pl:
          lead: Polen ist der größte Umschlagplatz für gecrashte Autos aus Westeuropa. Daher klären wir zuerst, was mit dieser Karosserie vor dem Verkauf geschehen ist.
          points:
            - Geometrie der Öffnungen und Schweißspuren – Wiederherstellung nach einem schweren Unfall
            - 'Einfuhrgeschichte: woher das Auto kam und in welchem Zustand'
            - Kilometerstand vergleichen wir mit europäischen Servicedatenbanken, dem Kilometerzähler glauben wir nicht
            - Airbags und deren Auslösung in der Vergangenheit
      closing:
        eyebrow: Haben Sie ein Auto gefunden?
        line1: Schicken Sie uns den Link
        line2: zur Anzeige –
        accentWord: wir kommen und schauen uns das an
        text: Wir fahren innerhalb eines bis zwei Tagen los. Der Bericht mit Fotos bleibt bei Ihnen, selbst wenn Sie nach ihm vom Kauf Abstand nehmen.
    cityVehicleSourcing:
      title: Fahrzeugauswahl
      descriptionFor: Wir suchen ein Auto in {cityLocation} mit vollständiger Überprüfung. Wir arbeiten in der gesamten Region {countryName}.
      casesHeadingFor: Fälle aus {countryGenitiveOrName}
      whyCityHeadingFor: Warum {cityName}
      reason1: Wir betrachten sowohl Händlerplätze als auch private Angebote
      reason2: Die VIN-Historie wird vor der Besichtigung überprüft
      reason3For: Unser Experte in {cityLocation}
      reason4Dekra: DEKRA / TÜV Überprüfung auf Anfrage
      reason4Generic: Unabhängige technische Expertise auf Anfrage
      otherCitiesLabelFor: 'Weitere Städte in {countryLocation}:'
      cityNotesHeadingFor: Automarkt in {cityLocation}
      cityNotesPointsLabel: Was bedeutet das in der Praxis
      cityNotes:
        berlin:
          lead: 'In Berlin gibt es die größte Auswahl in Deutschland mit einem bunten Mix an Verkäufern. Hier findet man alles: Firmenwagen mit voller Historie und importierte Angebote aus Osteuropa.'
          points:
            - Große Auswahl in allen Segmenten, inklusive seltener Ausstattungen
            - Viele private Verkäufer — der Preisverhandlung wird mehr Bedeutung beigemessen als bei Händlern
            - 'Urbaner Fahrbetrieb: Kupplung und Fahrwerk verschleißen schneller als bei Autobahnfahrzeugen'
        munich:
          lead: 'Teure Stadt mit teuren Autos. Hier gibt es mehr Premium-Fahrzeuge als irgendwo sonst in Deutschland, und der Zustand ist im Durchschnitt höher: solche Autos werden gut gepflegt.'
          points:
            - Starker Premium-Sektor, besonders BMW und Mercedes
            - Gut gepflegte Fahrzeuge mit vollständiger Händlerhistorie
            - Preise über dem Landesdurchschnitt — Ersparnis kommt durch den Zustand
        hamburg:
          lead: Hafenstadt und großes logistisches Zentrum. Von hier aus ist es praktisch, Autos weiter zu verschiffen, und der Markt hat überdurchschnittlich viele frische Importe.
          points:
            - Der Hafen ist nahe — der Versand lässt sich einfacher und günstiger organisieren
            - Viele Autos aus den nördlichen Bundesländern mit Autobahnkilometern
            - 'Feuchtes maritimes Klima: Karosserie und versteckte Hohlräume werden genauer geprüft'
        dusseldorf:
          lead: Zentrum von Nordrhein-Westfalen, dem am dichtesten besiedelten Bundesland Deutschlands. Die Verkaufsplätze sind nah beieinander, und die Grenze zu den Niederlanden und Belgien ist nur eine Stunde entfernt, wodurch regelmäßig Autos zum Verkauf kommen.
          points:
            - Wir schaffen es, mehrere Autos bei einem Besuch anzusehen — die Plätze sind nah beieinander
            - 'Einige Angebote mit niederländischen und belgischen Nummernschildern: die Historie und Dokumente prüfen wir separat'
            - Es gibt viele Verkäufer, die miteinander konkurrieren — Preisverhandlungen fallen leichter
        belgrade:
          lead: Unsere Basis. In Belgrad fahren wir am Tag der Anfrage zur Besichtigung, kennen die lokalen Verkäufer und sehen, welches Auto bereits seit zwei Monaten die Verkaufsplätze wechselt.
          points:
            - Besichtigung am Tag der Anfrage, ohne Wartezeit und Logistik
            - Wir kennen die lokalen Plätze und die Historie der Fahrzeuge, die dort stehen
            - Das Auto ist bereits verzollt — Import und Zoll sind nicht erforderlich
        novi-sad:
          lead: Die zweitgrößte Stadt Serbiens und eine Stunde Fahrt von Belgrad. Der Markt ist kleiner, aber die Preise sind oft ruhiger als in der Hauptstadt, und die Autos haben seltener mehrere Wiederverkäufe hinter sich.
          points:
            - Preise sind niedriger als in Belgrad bei vergleichbarem Zustand
            - Weniger Händler, häufiger der erste Besitzer
            - Wir fahren von Belgrad aus — keine zusätzlichen Gebühren für den Weg
        pancevo:
          lead: Pancevo gehört tatsächlich zur Metropolregion Belgrad, daher unterscheidet sich die Besichtigung hier nicht von der in der Hauptstadt. Der Markt ist klein, dafür sind die privaten Angebote interessanter.
          points:
            - Zwanzig Minuten von Belgrad — wir fahren gleich schnell
            - Kleiner Markt mit vielen privaten Verkäufern
            - Oft günstiger als in der Hauptstadt bei gleichem Zustand
        subotica:
          lead: 'Subotica liegt an der Grenze zu Ungarn, was sich am Markt zeigt: viele Autos, die aus der EU importiert wurden, und Verkäufer, die diese regelmäßig anbieten.'
          points:
            - Grenzmarkt — viele frische Importe aus der Europäischen Union
            - Die Historie vor dem Import überprüfen wir besonders gründlich
            - Bequeme Lage, wenn Sie das Auto weiter nach Norden transportieren wollen
        madrid:
          lead: 'Der Hauptstadtmarkt Spaniens: die größte Auswahl im Land und viele Autos aus Firmenflotten. Kontinentalklima, daher gibt es hier weniger Küstenkorrosion als an der Küste.'
          points:
            - Größte Auswahl in Spanien, einschließlich Firmenfahrzeuge
            - Weit weg vom Meer — Karosserien sind normalerweise sauberer als an der Küste
            - 'Heißer Sommer: Kunststoff, Lack und Klimaanlage überprüfen wir separat'
        barcelona:
          lead: Alles hängt von der Nähe zum Meer ab. Autos sehen von unten oft hervorragend aus, benötigen jedoch besondere Aufmerksamkeit auf versteckte Hohlräume und Elektrik.
          points:
            - 'Das Meer ist nahe, daher prüfen wir versteckte Hohlräume: von unten oft sauber, aber innen nicht'
            - Viele ehemalige Miet- und Carsharing-Fahrzeuge
            - Der Hafen ist nah, der Versand über den Seeweg wird einfacher organisiert
        zurich:
          lead: Zürich hat den teuersten Automarkt der Region. Hier werden maximale Ausstattungen bevorzugt, die beim Händler gewartet werden und früher verkauft als sie abgenutzt sind.
          points:
            - Maximale Ausstattungen und geringe Laufleistung
            - Händlerservice — die Historie ist fast immer vollständig
            - Schweiz gehört nicht zur EU, der Import wird separat abgewickelt
        geneva:
          lead: Genf liegt im französischsprachigen Teil der Schweiz, direkt an der Grenze zu Frankreich. Auf dem Markt sind deutlich mehr französische Marken als im deutschen Teil des Landes.
          points:
            - 'Gemischter Markt: Schweizer Zustand, französisches Sortiment'
            - Die Grenze zu Frankreich ist nah — es gibt Preisvergleiche
            - 'Die Formalitäten sind wie in der ganzen Schweiz: Export plus Import'
        paris:
          lead: 'Die größte Auswahl in Frankreich kommt mit der intensivsten Nutzung: dichter Verkehr und enge Parkplätze hinterlassen Spuren auf Karosserie und Federung.'
          points:
            - Die größte Auswahl in Frankreich, besonders französischer Marken
            - 'Urbaner Fahrbetrieb: Kupplung, Federung und kleine Karosserieschäden'
            - Viele Diesel — Partikelfilter und EGR priorisieren wir in erster Linie
        lyon:
          lead: Lyon ist ruhiger als Paris, sowohl in den Preisen als auch im Zustand der Fahrzeuge. Die Autobahn nach Süden liegt in der Nähe, daher finden sich häufig Autos mit gleichmäßiger Kilometerleistung.
          points:
            - Preise sind niedriger als in Paris bei vergleichbarem Angebot
            - Mehr Autobahnkilometer, weniger städtischer Verschleiß
            - Bequeme Verbindung nach Italien und Spanien, wenn wir breiter suchen
        milan:
          lead: 'Die Geschäftshauptstadt Italiens, und das zeigt sich auch auf dem Markt. Im Norden des Landes gelten bessere Straßenbedingungen: die Autos sind besser in Schuss als im Süden.'
          points:
            - Bester Auswahl im Premium-Sektor in Italien
            - Im Norden weniger Salz und Korrosion als im Süden des Landes
            - 'Dichte Stadt: Dickemesser für die Karosserien ist Pflicht'
        rome:
          lead: Ein großer Markt mit einer sehr intensiven städtischen Nutzung. Kleine Kratzer werden hier als normal angesehen und werden oft schnell repariert.
          points:
            - Viele Kleinwagen und Autos mit Gasanlagen
            - Häufige Nachlackierungen nach Stadtverkehr — wir überprüfen jedes Panel
            - Südlicher als Mailand — das Klima ist milder, aber näher am Meer
        warsaw:
          lead: Über Warschau gelangt der Hauptimport aus Westeuropa ins Land, und hier gibt es auch die größte Auswahl in Polen. Der Anteil an wiederaufbereiteten Fahrzeugen ist ebenfalls am höchsten.
          points:
            - Größte Auswahl in Polen, viele frische Importe aus der EU
            - Die Karosserie-Geometrie und Reparaturspuren prüfen wir zuerst
            - Kurze Transportwege — günstiger als aus Südeuropa
        krakow:
          lead: 'Krakau ist ruhiger als Warschau: der Markt ist kleiner, es gibt weniger Wiederverkäufe, und die Autos werden oft länger von einem Besitzer gehalten. Die Südpole steht logistischer näher an den Balkans.'
          points:
            - Weniger Händler als in Warschau, die Historie ist meistens klarer
            - Preise sind oft günstiger als in der Hauptstadt
            - Näher an der Route nach Süden — praktisch für die Lieferung nach Serbien
