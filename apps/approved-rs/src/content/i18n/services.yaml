          text: Dostavljamo automobil do vašeg grada i pomažemo da ga registrujete
      deliveryLineFor: Dovićemo automobil u bilo koji grad u zemlji. Ako ga treba izvesti u inostranstvo, preuzimamo izvoz i carinjenje i vozimo u {destinations} i bilo koju drugu zemlju.
      deliveryDestinations:
        - Bosnu i Hercegovinu
        - Hrvatsku
        - Severnu Makedoniju
        - Tursku
        - Kazahstan
        - Kirgistan
      citiesHeadingFor: Gde pregledamo automobile {countryLocation}
      citiesLead: Stručnjak odlazi po celoj zemlji, ali najčešće pregledamo automobile tamo gde ih najviše izlažu. Ovo je značaj za svaki grad.
      alsoInLabel: 'Takođe biramo u:'
      crossSellLabel: Treba vam auto iz inostranstva?
      countryNotesHeadingFor: Šta uzimamo u obzir {location}
      countryNotesPointsLabel: Na šta obratimo pažnju pre svega
      countryNotes:
        de:
          lead: 'Izbor ovde je veći nego na bilo kojem drugom tržištu u Evropi, a istorija servisiranja obično se može pratiti: većina automobila ima servisnu knjižicu sa potpisima dilera o svakom servisu. S druge strane, autobanski kilometraži. Dvesta hiljada za tri godine je ovde norma, a ne povod za sniženje cene.'
          points:
            - Servisna knjižica i markice dilera, proveravamo po VIN kodu kod službenog servisa
            - Protokol HU, koji svi nazivaju TÜV. Čitamo primedbe prethodne provere, a ne samo pečat
            - 'Automobili iz lizinga i korporativnih parkova: redovno servisirani, ali sa velikim pređenim km'
            - Zimski putevi sa reagensima, pa dno i pragove gledamo posebno
        rs:
          lead: Ovde smo na licu mesta, zato pregledamo automobil isti dan kada se obratite i bez uvoza. Tržište je malo, isti automobil prolazi kroz nekoliko prodavaca, pa se priča mora raspetljati.
          points:
            - Automobil je već carinjen i sa lokalnim tablicama, takse i carinjenje uvoza nisu potrebni
            - Kilometraža se često ispravlja prilikom preprodaje u zemlji, proveravamo prema beleškama tehničkog pregleda
            - Mnogi su uvezeni iz Nemačke i Italije, proveravamo šta je bilo sa automobilom pre uvoza
            - Pregled istog dana kada se obratite, bez čekanja na logistiku
        es:
          lead: Blaga zima i skoro da nema reagenasa na putevima, zato su donje strane španskih automobila obično znatno bolje nego nemačkih. Međutim, sunce i blizina mora utiču na boje, plastiku i sve gumene delove.
          points:
            - Kusturna plaža, zato tražimo koroziju prvenstveno u skrivenim mestima
            - Izgorela boja i napuknuti plastika enterijera se uračunavaju u cenu
            - 'Mnogo nekadašnjih iznajmljenih automobila: ravna kilometraža, ali stroga eksploatacija'
            - Protokol ITV, proveravamo primedbe i datume prolaska
        ch:
          lead: 'Švajcarska vozila su mnogo bolje održavana od proseka u Evropi: skupi servis disciplinuje, a pređene razdaljine su male. Međutim, Švajcarska nije u EU, pa je procedura uvoza drugačija, što treba unapred uvrstiti u budžet.'
          points:
            - Bogate verzije, ovde su ih uzimali češće nego kod komšija
            - MFK. Provera je stroga, ozbiljno se pripremaju za nju, i to je vidljivo na automobilu
            - 'Nije u EU: carina i dokumenti se ne obrađuju kao za zemlje Evropske Unije'
            - Cena je viša od tržišne, ali kasnije štedite na popravkama
        pt:
          lead: Tržište je malo, izbor je skromniji od španskog, ali i konkurencija za dobar automobil je manja. Klima je vlažna i slana, morska korozija se susreće i na novim automobilima.
          points:
            - Vlažnost i more, zato su skrivene šupljine i elektrika prioritet provere
            - 'Malo tržište: tražimo duže za konkretan zahtev nego u Nemačkoj'
            - Protokol IPO, čitamo primedbe prethodnih provera
            - Mnoge dizel i male klase vozila, veći modeli su retki
        fr:
          lead: Francuska to su pre svega dizel automobili i domaće marke. Peugeot, Renault i Citroën su ovde jeftiniji nego bilo gde u Evropi. Nemački premijum je naprotiv skuplji, i nema smisla ga ovde kupovati.
          points:
            - Francuske marke po najboljoj ceni u Evropi, a servis je jeftiniji
            - Dizeli, filter čestica i EGR ventil gledamo kao posebnu stavku
            - Contrôle technique. Protokoli su detaljni, proveravamo primedbe tokom godina
            - 'Gradska upotreba: prijanjanje i suspenzija se troše brže nego što je navedeno'
        it:
          lead: 'Italijansko tržište je dobro za male automobile i retke opreme, ali zahteva oprez: ovde se vozila eksploatišu intenzivno, a sitne karoserijske popravke se ne rade uvek pažljivo.'
          points:
            - Grad, česta manja udarca i popravke, mera debljine boje je obavezna
            - Jug i obala donose so i koroziju, sever je bliži nemačkim uslovima
            - Revisione, proveravamo redovnost, propuštanja se češće dešavaju
            - Mnogi automobili sa plinskom opremom, proveravamo to posebno
        pl:
          lead: 'Najveće tržište blizu nas: logistika je jeftina i brza. Ali Poljska je godinama bila glavni prevoznika za udarene automobile iz Zapadne Evrope, pa ovde proveravamo istoriju strožije nego bilo gde drugde.'
          points:
            - Visok udeo obnovljenih nakon udesa, geometrija karoserije je prioritet
            - 'Česte preprodaje: vozilo može promeniti nekoliko vlasnika u toku godine'
            - Kilometraža se često ispravlja pri uvozu, proveravamo sa servisnim bazama
            - Kratka distanca isporuke, jeftinije i brže nego iz Španije ili Portugala
      closing:
        eyebrow: Odakle da krenemo?
        line1: Opisujte vozilo,
        line2: koji tražite,
        accentWord: dalje naš posao
        text: Budžet, karoserija, menjač, par želja iznad. Mi tražimo, a vi gledate izveštaje o opcijama i odlučujete koju ćete pregledati uživo.
