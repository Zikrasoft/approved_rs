  de:
    vehicle-sourcing:
      hub:
        metaTitle: Autosuche in Europa mit Rundum-Service
        metaDescription: 'Wir finden Ihr Auto in DE, RS, ES, CH, IT, FR, PL und PT: Suche, Besichtigung, Preisverhandlung und Lieferung aus einer Hand.'
        title: Autosuche
        titleHighlight: mit Rundum-Service
        description: Wir finden Ihr Auto vor Ort im gewünschten Kaufland. Mit gründlicher Prüfung, Kaufbegleitung und Lieferung. Wählen Sie ein Land für weitere Details.
        breadcrumbLabel: Autosuche
        casesHeading: Erfolgreich vermittelte Fahrzeuge
        chooseCountryLabel: 'Land auswählen:'
        ctaLabel: Auto finden lassen
        heroPhotoAlt: Fahrzeugreihe auf dem Gelände eines Autohändlers
        processHeading: So läuft die Autosuche ab
        processLead: 'Von der Anfrage bis zur Schlüsselübergabe dauert es meist drei Tage bis zwei Wochen. Die meiste Zeit nimmt die Suche in Anspruch: Wir nehmen nicht gleich das erste passende Auto, sondern suchen weiter, bis bei der Prüfung keine Fragen offenbleiben.'
        processSteps:
          - n: '01'
            text: 'Wir besprechen Budget, Marke und Anforderungen: Was ist Ihnen wichtig, wo sind Kompromisse möglich?'
          - n: '02'
            text: Wir suchen passende Angebote vor Ort und sortieren schon am Telefon aus, was kritischen Nachfragen nicht standhält
          - n: '03'
            text: Wir prüfen das Auto vor Ort mit Lackschichtdickenmessgerät und Diagnosegerät, bei BMW mit der originalen Diagnosesoftware ISTA, und machen Fotos und Videos
          - n: '04'
            text: 'Sie erhalten unseren Bericht und eine klare Empfehlung: kaufen oder weitersuchen'
          - n: '05'
            text: Wir verhandeln den Preis, wickeln den Kauf ab und übergeben Ihnen das Auto oder liefern es bis vor die Tür
        includedHeading: Das ist enthalten
        includedLead: Unser Honorar steht vor Beginn fest und hängt nicht davon ab, wie viele Autos wir besichtigen. Raten wir nach der Prüfung vom Kauf ab, suchen wir ohne Aufpreis weiter.
        included:
          - title: Autosuche ohne Begrenzung der Angebote
            text: Wir suchen, bis wir ein Auto finden, an dem wir nichts auszusetzen haben. Ungeeignete Fahrzeuge auszusortieren gehört dazu und kostet nichts extra.
          - title: Ein Experte bei jeder Besichtigung vor Ort
            text: 'Wir messen die Lackschichtdicke an den Karosserieteilen, lesen die Steuergeräte aus und nutzen bei Bedarf eine Hebebühne. Alle Problemstellen halten wir in Fotos und Videos fest: Sie sehen, was wir sehen.'
          - title: Fahrzeughistorie und Rechtslage prüfen
            text: CarVertical-Bericht anhand der FIN, Wartungshistorie beim jeweiligen Vertragshändler, Kilometerstandabgleich sowie Prüfung auf Pfandrechte, Zulassungssperren und offene Versicherungsfälle.
          - title: Preisverhandlung und Kaufabwicklung
            text: Wir verhandeln den Preis unter Berücksichtigung festgestellter Mängel, bereiten die Unterlagen vor und begleiten die Vertragsunterzeichnung.
          - title: Lieferung und Zulassung
            text: Wir liefern das Auto in Ihre Stadt und helfen bei der Zulassung vor Ort. Alternativ übergeben wir Ihnen die Schlüssel an einem für Sie passenden Abholort.
          - title: Ein Ansprechpartner von Anfang bis Ende
            text: Ihr Ansprechpartner ist derselbe Experte, der das Auto besichtigt hat. Sie müssen Ihre Wünsche nicht bei jedem Anruf jemand anderem neu erklären.
        compareHeading: So unterscheiden sich die Automärkte
        compareLead: Dasselbe Modell in Deutschland und Polen kann bei Vorgeschichte und Preis zwei völlig unterschiedliche Angebote bedeuten.
        compareHint: Wählen Sie ein Land und erfahren Sie, worauf wir dort zuerst achten.
        compareLinkFor: Autosuche {location} im Detail
      title: Autosuche mit Rundum-Service
      descriptionFor: Wir finden Ihr Auto {location} im lokalen Angebot, ohne Import. Mit gründlicher Prüfung, Kaufbegleitung und Lieferung in Ihre Stadt.
      ctaLabel: Anfrage senden
      casesHeadingFor: Erfolgreiche Autokäufe {location}
      breadcrumbLabelFor: Autos {location}
      stepsFor:
        - n: '01'
          text: Sie senden uns eine Anfrage mit Ihren Anforderungen an Budget, Marke und Kilometerstand
        - n: '02'
          text: Wir suchen passende Fahrzeuge {location} nach Ihren Kriterien
        - n: '03'
          text: Ein unabhängiger Experte besichtigt und prüft das Fahrzeug
        - n: '04'
          text: Wir begleiten den Kauf und helfen bei Unterlagen und Formalitäten
        - n: '05'
          text: Wir liefern das Fahrzeug in Ihre Stadt und helfen bei der Zulassung
      deliveryLineFor: Wir liefern das Auto in jede Stadt des Landes. Soll es ins Ausland gehen, übernehmen wir Export und Zollabwicklung und liefern nach {destinations} sowie in jedes andere Land.
      deliveryDestinations:
        - Bosnien und Herzegowina
        - Kroatien
        - Nordmazedonien
        - Türkei
        - Kasachstan
        - Kirgisistan
      citiesHeadingFor: Wo wir Autos {countryLocation} besichtigen
      citiesLead: Unser Experte ist landesweit unterwegs. Meist besichtigen wir Autos dort, wo das Angebot am größten ist. Hier erfahren Sie, was das für die einzelnen Städte bedeutet.
      alsoInLabel: 'Wir suchen auch in:'
      crossSellLabel: Sie möchten ein Auto aus dem Ausland?
      countryNotesHeadingFor: Worauf wir {location} achten
      countryNotesPointsLabel: Das prüfen wir zuerst
      countryNotes:
        de:
          lead: 'Die Auswahl ist größer als auf jedem anderen europäischen Markt, und die Wartungshistorie lässt sich meist nachvollziehen: Die meisten Autos haben ein Scheckheft mit Händlernachweisen für jede Inspektion. Die Kehrseite sind hohe Autobahnkilometer. 200.000 Kilometer in drei Jahren sind hier normal und kein Grund für einen Preisnachlass.'
          points:
            - Scheckheft und Händlerstempel gleichen wir anhand der FIN mit den Daten der Vertragswerkstatt ab
            - 'HU-Bericht, meist einfach TÜV genannt: Wir lesen auch die Hinweise der letzten Prüfung, statt nur auf die Plakette zu schauen'
            - 'Leasingrückläufer und Flottenfahrzeuge: regelmäßig gewartet, aber oft mit hoher Laufleistung'
            - 'Streusalz im Winter: Unterboden und Schweller prüfen wir besonders sorgfältig'
        rs:
          lead: Hier sind wir direkt vor Ort und können das Auto noch am Tag Ihrer Anfrage besichtigen, ohne dass ein Import nötig ist. Der Markt ist klein, dasselbe Auto geht oft durch die Hände mehrerer Verkäufer. Seine Vorgeschichte müssen wir deshalb genau nachvollziehen.
          points:
            - Das Auto ist bereits verzollt und vor Ort zugelassen, Einfuhrzölle und Importformalitäten entfallen
            - Beim Weiterverkauf im Inland wird der Kilometerstand häufig manipuliert. Wir gleichen ihn mit den Prüfberichten der technischen Untersuchung ab
            - Viele Fahrzeuge stammen aus Deutschland und Italien. Wir prüfen auch ihre Vorgeschichte vor dem Import
            - Besichtigung am Tag der Anfrage, ohne logistische Wartezeiten
        es:
          lead: Milde Winter und kaum Streusalz sorgen dafür, dass der Unterboden spanischer Autos meist deutlich besser erhalten ist als bei deutschen Fahrzeugen. Dafür setzen Sonne und Meeresnähe dem Lack, den Kunststoffen und den Gummiteilen zu.
          points:
            - In Küstenregionen suchen wir vor allem in versteckten Hohlräumen nach Korrosion
            - Ausgeblichenen Lack und rissige Kunststoffe im Innenraum berücksichtigen wir bei der Preisbewertung
            - 'Viele ehemalige Mietwagen: gleichmäßige Laufleistung, aber starke Beanspruchung'
            - 'ITV-Prüfbericht: Wir gleichen die Hinweise und Prüftermine ab'
        ch:
          lead: 'Schweizer Autos sind deutlich besser gepflegt als der europäische Durchschnitt: Die hohen Wartungskosten fördern regelmäßige Pflege, die Laufleistungen sind gering. Die Schweiz gehört allerdings nicht zur EU. Die Einfuhr läuft deshalb anders ab, was wir von Anfang an im Budget berücksichtigen.'
          points:
            - Üppige Ausstattung, die hier häufiger bestellt wurde als in den Nachbarländern
            - 'MFK: Die Prüfung ist streng, die Vorbereitung entsprechend gründlich. Das merkt man dem Auto an'
            - 'Kein EU-Mitglied: Zollabfertigung und Einfuhrunterlagen unterscheiden sich von denen bei EU-Fahrzeugen'
            - Höherer Kaufpreis, dafür später weniger Reparaturkosten
        pt:
          lead: 'Der Markt ist klein, die Auswahl geringer als in Spanien. Dafür gibt es weniger Konkurrenz um gute Fahrzeuge. Das feuchte, salzhaltige Küstenklima hinterlässt Spuren: Korrosion kommt selbst bei neueren Autos vor.'
          points:
            - 'Feuchtigkeit und Meeresluft: Hohlräume und Fahrzeugelektrik stehen bei der Prüfung im Fokus'
            - 'Kleiner Markt: Die Suche nach einem bestimmten Wunschfahrzeug dauert länger als in Deutschland'
            - 'IPO-Prüfberichte: Wir prüfen die Mängelhinweise früherer Untersuchungen'
            - Viele Diesel und Kleinwagen, größere Modelle sind selten
        fr:
          lead: Frankreich ist vor allem ein Markt für Diesel und heimische Marken. Peugeot, Renault und Citroën sind hier günstiger als anderswo in Europa. Deutsche Premiummarken sind dagegen teurer, der Kauf lohnt sich hier kaum.
          points:
            - Französische Marken zu den besten Preisen in Europa, auch die Wartung ist günstiger
            - Bei Dieseln prüfen wir Partikelfilter und AGR-Ventil gesondert
            - 'Contrôle technique: Detaillierte Prüfberichte, deren Mängelhinweise wir über die Jahre abgleichen'
            - 'Stadtverkehr: Kupplung und Fahrwerk sind oft stärker verschlissen, als die Angaben vermuten lassen'
        it:
          lead: 'Der italienische Markt bietet viele Kleinwagen und seltene Ausstattungsvarianten, verlangt aber einen genauen Blick: Die Autos werden intensiv genutzt, kleinere Karosserieschäden nicht immer sauber repariert.'
          points:
            - 'Stadtverkehr, häufige Parkschäden und Nachlackierungen: Ein Lackschichtdickenmesser gehört dazu'
            - Im Süden und an der Küste droht Korrosion durch Salz, im Norden ähneln die Bedingungen denen in Deutschland
            - 'Revisione: Wir prüfen die Einhaltung der Prüfintervalle, versäumte Termine kommen häufiger vor'
            - Viele Fahrzeuge mit Gasanlage, die wir gesondert prüfen
        pl:
          lead: 'Der nächstgelegene große Markt: Der Transport ist kurz und günstig. Polen war allerdings jahrelang der wichtigste Umschlagplatz für Unfallwagen aus Westeuropa. Deshalb prüfen wir die Fahrzeughistorie hier besonders streng.'
          points:
            - 'Hoher Anteil instand gesetzter Unfallwagen: Die Karosseriegeometrie steht im Fokus'
            - 'Häufige Weiterverkäufe: Ein Auto kann innerhalb eines Jahres mehrfach den Besitzer wechseln'
            - Kilometerstände werden oft beim Import manipuliert. Wir gleichen sie mit Werkstattdatenbanken ab
            - Kurze Transportwege, günstiger und schneller als aus Spanien oder Portugal
      closing:
        eyebrow: Womit fangen wir an?
        line1: Beschreiben Sie uns
        line2: Ihr Wunschauto,
        accentWord: den Rest übernehmen wir
        text: Budget, Karosserieform, Getriebe und ein paar weitere Wünsche. Wir suchen, Sie sehen sich die Berichte zu passenden Fahrzeugen an und entscheiden, welches wir vor Ort prüfen sollen.
