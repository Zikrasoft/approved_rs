translations:
  en:
    vehicle-sourcing:
      hub:
        metaTitle: Complete Car Sourcing in Europe
        metaDescription: 'We source vehicles in Germany, Serbia, Spain, Switzerland, Italy, France, Poland, and Portugal: search, inspection, negotiation, and delivery.'
        title: Car Sourcing
        titleHighlight: complete
        description: We'll help you find a car in the country you're in or planning to buy in — full inspection, transaction support, and delivery included. Choose a country to see the details.
        breadcrumbLabel: Car Sourcing
        casesHeading: Real Car Sourcing Deals
        chooseCountryLabel: 'Select a Country:'
        ctaLabel: Find a Car
        heroPhotoAlt: Row of cars at a dealership
        processHeading: How Sourcing Works
        processLead: "From application to keys usually takes three days to two weeks. The longest part is finding the right car: we don't settle for the first suitable option and keep looking until we find one that checks out."
        processSteps:
          - n: '01'
            text: Discuss budget, brand, and requirements — what matters most and what you can compromise on
          - n: '02'
            text: Select options locally and narrow down by phone everything that doesn't pass your criteria
          - n: '03'
            text: Conduct an inspection using a thickness gauge and scanner, connecting to the dealership ISTA for BMW, taking photos and videos
          - n: '04'
            text: Send a report and advise directly on whether to proceed or keep looking
          - n: '05'
            text: Negotiate, finalize the deal, and deliver the car to you or transport it to your door
        includedHeading: What's Included
        includedLead: The fee is fixed before starting and does not depend on how many cars have to be inspected. If we say 'don't buy' after inspection, we continue searching at no extra cost.
        included:
          - title: Unlimited Search Options
            text: We keep working until we find a car that meets your standards. Rejecting an unsuitable option is included and costs nothing extra.
          - title: Expert Inspection for Every Viewing
            text: Thickness gauge for bodywork, scanner for control units, lift where needed. Photos and videos of all problematic areas — you see everything we do.
          - title: History and Legal Cleanliness Check
            text: CarVertical report by VIN, dealership service history for the make, mileage verification, liens, registration restrictions, and unresolved insurance events.
          - title: Negotiation and Deal Finalization
            text: We negotiate the price based on what we find, prepare documents, and assist with signing.
          - title: Delivery and Registration Assistance
            text: We transport the car to your city and help with the registration process — either handing over the keys where it's convenient for you.
          - title: One Point of Contact for the Entire Process
            text: You will work with the same expert who conducted the inspection. No need to explain your needs to each person who picks up the phone.
        compareHeading: How Markets Differ from Each Other
        compareLead: The same model in Germany and Poland can be two very different cars regarding history and price.
        compareHint: Select a country — we’ll show you what we look at first.
        compareLinkFor: Sourcing in {location} — in detail
      title: Complete Car Sourcing
      descriptionFor: We’ll find a car in {location} — among those already in the country, without importing from abroad. Full inspection, transaction support, and delivery to your city.
      ctaLabel: Submit Request
      casesHeadingFor: 'Real Deals: Car Sourcing in {location}'
      breadcrumbLabelFor: Car in {location}
      stepsFor:
        - n: '01'
          text: You submit a request with requirements — budget, brand, mileage
        - n: '02'
          text: We search for options in {location} based on your criteria
        - n: '03'
          text: An independent expert inspects and verifies the vehicle
        - n: '04'
          text: We manage the deal, assist with documents and registration
        - n: '05'
          text: We deliver the car to your city and help with the registration process
      deliveryLineFor: We’ll deliver the car to any city in the country. If it needs to be exported abroad, we take care of the export formalities and customs clearance — transporting to {destinations} and any other country.
      deliveryDestinations:
        - Bosnia and Herzegovina
        - Croatia
        - North Macedonia
        - Turkey
        - Kazakhstan
        - Kyrgyzstan
      citiesHeadingFor: Where We Look for Cars in {countryLocation}
      citiesLead: Experts travel throughout the country but we usually inspect cars where they are most frequently listed. Here’s what that means for each city.
      alsoInLabel: 'We also source in:'
      crossSellLabel: Need a car not from the local market?
      countryNotesHeadingFor: What We Consider in {location}
      countryNotesPointsLabel: Key Factors We Examine
      countryNotes:
        de:
          lead: 'The selection here is larger than any other market in Europe, and service history can typically be traced: most cars have a service book with dealer stamps for each service. The downside — highway mileage. Two hundred thousand kilometers in three years are common and not a reason for a discount.'
          points:
            - Service book and dealer stamps — we verify against the VIN with an official service
            - The HU protocol, known as TÜV, — we review past inspection remarks, not just the stamp
            - 'Cars from leasing and corporate fleets: serviced correctly but high mileage'
            - Winter roads with chemicals — we inspect the underside and sills separately
        rs:
          lead: We're local, so we inspect cars the day you inquire without any imports. The market is small, and the same car can pass through several sellers, making the history hard to untangle.
          points:
            - The car is already customs cleared and has local plates — no import duties or paperwork required
            - Mileage is often altered during resales within the country — we verify against technical inspection records
            - Many vehicles imported from Germany and Italy — we check the car's history prior to import
            - Inspection on the same day of inquiry, without waiting for logistics
        es:
          lead: Mild winters and minimal road chemicals mean that the underbody of Spanish cars is usually in better condition compared to German ones. However, sun exposure and proximity to the sea damage the paint, plastic, and rubber parts.
          points:
            - On the coast — we look for corrosion primarily in hidden cavities
            - Faded lacquer and cracked interior plastic — we factor this into the cost
            - 'Many former rental cars: consistent mileage but harsh usage'
            - ITV protocol — we check remarks and inspection dates
        ch:
          lead: 'Swiss cars are generally better maintained than the European average: expensive servicing ensures this, and mileage is typically low. However, Switzerland is not in the EU, so import procedures differ and we factor this into the budget upfront.'
          points:
            - Rich configurations are more common here than in neighboring countries
            - MFK inspections are stringent; preparation is serious, and this shows in the cars
            - 'Not in the EU: customs and paperwork are different than for EU countries'
            - Prices are higher than the market average, but you save on repairs later
        pt:
          lead: The market is small, with fewer options than in Spain, but competition for good cars is also lower. The climate is humid and salty — coastal corrosion is found even on newer vehicles.
          points:
            - Humidity and the sea mean hidden cavities and electrical components are priority in inspections
            - 'Small market: it takes longer to find specific requests compared to Germany'
            - IPO protocol — we read remarks from previous inspections
            - Many diesels and compact cars, large body types are rare
        fr:
          lead: France mainly features diesel and domestic brands. Peugeot, Renault, and Citroën are cheaper here than anywhere else in Europe. German premium brands are, conversely, more expensive, making them less worthwhile to buy here.
          points:
            - French brands offer the best prices in Europe, with lower servicing costs
            - For diesels, we pay special attention to the particulate filter and EGR valve
            - Contrôle technique — records are detailed and we cross-check remarks by year
            - 'City driving: tires and suspension wear out faster than advertised'
        it:
          lead: 'The Italian market is great for compact cars and rare configurations, but requires caution: vehicles here are used hard, and minor body repairs are not always done carefully.'
          points:
            - City — frequent minor impacts and touch-ups, a thickness gauge is essential
            - The south and coastline bring salt and corrosion, while the north has conditions closer to Germany
            - Revisione — we check consistency, as missed services are more common
            - Many cars have gas equipment — we inspect this separately
        pl:
          lead: 'The closest major market to us: logistics are cheap and short. However, Poland has been the main transit point for damaged cars from Western Europe for years, so we check the history here more rigorously than anywhere else.'
          points:
            - A high percentage of cars are restored after accidents — we prioritize body geometry
            - 'Frequent resales: a car can change owners several times in a year'
            - Mileage is often adjusted upon import — we verify with service records
            - Short delivery distance — cheaper and faster than from Spain or Portugal
      closing:
        eyebrow: Where do we start?
        line1: Describe the car you are looking for,
        line2: and we'll take it from there —
        accentWord: it's our job from that point.
        text: Budget, body type, gearbox, and a few preferences. We do the searching, and you review reports on options and decide which ones to check in person.
    vehicle-buyback:
