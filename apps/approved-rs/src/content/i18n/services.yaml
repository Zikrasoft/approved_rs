            text: Después de la firma, los riesgos asociados con la importación temporal caducada pasan a nosotros.
          - title: Valoración sin inspección
            text: Damos el precio basándonos en fotos y documentos. Vemos el coche solo cuando ambas partes han acordado el monto.
          - title: Formalización de la transacción
            text: Preparamos el contrato, la cancelación de registro y todos los documentos. De ti necesitamos la documentación del auto y tu firma.
          - title: Pago el día de la firma
