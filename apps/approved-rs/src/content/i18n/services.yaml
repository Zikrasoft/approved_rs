  es:
    vehicle-sourcing:
      hub:
        metaTitle: Selección de coches en Europa a medida
        metaDescription: 'Buscamos coches en Alemania, Serbia, España, Suiza, Italia, Francia, Polonia y Portugal: búsqueda, inspección, negociación y entrega a medida.'
        title: Selección de coches
        titleHighlight: a medida
        description: Seleccionamos un vehículo en el país donde se encuentra o planea comprar, haciendo una revisión completa, acompañamiento en la transacción y entrega a medida. Elige un país para ver los detalles.
        breadcrumbLabel: Selección de coches
        casesHeading: Transacciones reales de selección de coches
        chooseCountryLabel: 'Elige un país:'
        ctaLabel: Seleccionar coche
        heroPhotoAlt: Fila de coches en el concesionario
        processHeading: Cómo se lleva a cabo la selección
        processLead: 'Desde la solicitud hasta la entrega de las llaves, suele tardar entre tres días y dos semanas. Lo más prolongado es encontrar el coche adecuado: no tomamos el primer que aparece y seguimos buscando hasta encontrar uno sin dudas tras la revisión.'
        processSteps:
          - n: '01'
            text: 'Discutimos el presupuesto, marca y requisitos: qué es importante y qué se puede sacrificar'
          - n: '02'
            text: Filtramos opciones en el lugar y descartamos por teléfono todo lo que no cumple con nuestras preguntas
          - n: '03'
            text: Visitemos el coche con un medidor de grosor y escáner, conectamos el ISTA de concesionario para BMW, tomamos fotos y videos
          - n: '04'
            text: Enviamos un informe y decimos claramente si vale la pena comprar o seguir buscando
          - n: '05'
            text: Negociamos, firmamos el acuerdo y entregamos el coche a usted o lo llevamos a su puerta
        includedHeading: Qué incluye el servicio
        includedLead: La comisión se fija antes del inicio y no depende de cuántos coches tuvimos que revisar. Si tras la revisión decimos 'no lo compre', seguimos buscando sin coste adicional.
        included:
          - title: Búsqueda ilimitada de opciones
            text: Trabajamos hasta encontrar un coche sin defectos. El rechazo de una opción no exitosa se incluye en el servicio y no cuesta nada extra.
          - title: Visita de un experto a cada inspección
            text: 'Medidor de grosor para los paneles, escáner para los módulos, elevador donde es necesario. Fotos y videos de todos los lugares problemáticos: verá lo mismo que nosotros.'
          - title: Revisión de la historia y legalidad
            text: Informe de CarVertical por VIN, historial de servicio del concesionario para la marca, verificación del kilometraje, gravámenes, restricciones en el registro y eventos de seguros no cerrados.
          - title: Negociación y formalización del acuerdo
            text: Acuerdamos el precio basándonos en lo encontrado, preparamos los documentos y acompañamos la firma.
          - title: Entrega y registro
            text: Llevamos el coche a su ciudad y le ayudamos con el registro en el lugar — ya sea entregándole las llaves en un lugar que le resulte cómodo.
          - title: Una sola persona para todo el proceso
            text: Trabajará con el mismo especialista que realizó la inspección. No es necesario explicar la tarea nuevamente a cada persona que conteste el teléfono.
        compareHeading: Diferencias entre los mercados
        compareLead: Un mismo modelo en Alemania y Polonia — por historia y precio son dos coches diferentes.
        compareHint: Elija un país, le mostramos qué buscamos primero allí.
        compareLinkFor: Selección {location} — en detalle
      title: Selección de coches a medida
      descriptionFor: Seleccionamos un coche en {location} — entre los que ya están en este país, sin importar desde el extranjero. Revisión completa, acompañamiento en la transacción y entrega a su ciudad.
      ctaLabel: Dejar solicitud
      casesHeadingFor: 'Transacciones reales: selección de coches {location}'
      breadcrumbLabelFor: Coches {location}
      stepsFor:
        - n: '01'
          text: Deja una solicitud con requisitos — presupuesto, marca, kilometraje
        - n: '02'
          text: Buscamos opciones en {location} según tus criterios
        - n: '03'
          text: Un experto independiente revisa y verifica el coche
        - n: '04'
          text: Acompañamos la transacción, ayudamos con los documentos y el registro
        - n: '05'
          text: Entregamos el coche a su ciudad y ayudamos a registrarlo
      deliveryLineFor: Entregamos el coche en cualquier ciudad del país. Si necesita ser exportado, nos encargamos de la exportación y el despacho — llevamos a {destinations} y a cualquier otro país.
      deliveryDestinations:
        - Bosnia y Herzegovina
        - Croacia
        - Macedonia del Norte
        - Turquía
        - Kazajistán
        - Kirguistán
      citiesHeadingFor: Dónde revisamos coches en {countryLocation}
      citiesLead: El experto viaja por todo el país, pero generalmente revisamos coches donde más se ofrecen. Esto es lo que significa para cada ciudad.
      alsoInLabel: 'También seleccionamos en:'
      crossSellLabel: ¿Necesita un coche no local?
      countryNotesHeadingFor: Consideraciones en {location}
      countryNotesPointsLabel: Lo que revisamos primero
      countryNotes:
        de:
          lead: 'Aquí hay más opciones que en cualquier otro mercado de Europa, y la historia de servicio generalmente es rastreable: la mayoría de los coches tienen un libro de servicio con registros del concesionario para cada mantenimiento. El lado opuesto son los kilometrajes elevados. Doscientos mil en tres años es común aquí, no un motivo para un descuento.'
          points:
            - Libro de servicio y registros del concesionario — verificamos por VIN en el servicio oficial
            - Protocolo HU, que todos llaman TÜV — leemos los comentarios de la última inspección, no solo el sello
            - 'Coches de leasing y flotas corporativas: están bien mantenidos, pero tienen kilómetros altos'
            - Caminos de invierno con productos químicos — revisamos el chasis y los estribos por separado
        rs:
          lead: Aquí estamos presentes, así que inspeccionamos el coche el día de la solicitud y sin importar desde el extranjero. El mercado es pequeño, el mismo coche puede pasar por varios vendedores, y hay que desenredar la historia.
          points:
            - El coche ya está despachado y con matrícula local — no se necesitan aranceles ni documentación de importación
            - El kilometraje a menudo se modifica al revender dentro del país — verificamos con los registros de inspección técnica
            - Muchos coches importados de Alemania e Italia — revisamos qué ocurrió con el coche antes de la importación
            - Inspección el mismo día de la solicitud, sin esperar la logística
        es:
          lead: Invierno suave y casi sin productos químicos en las carreteras, por lo que el chasis de los coches españoles suele estar notablemente mejor que el de los alemanes. Sin embargo, el sol y la proximidad al mar afectan la pintura, el plástico y todas las partes de goma.
          points:
            - Costas — buscamos corrosión, sobre todo en cavidades ocultas
            - Laca desgastada y plástico agrietado en el interior — tenemos en cuenta en el precio
            - 'Muchos coches de alquiler: kilometraje uniforme, pero con uso intenso'
            - 'Protocolo ITV: revisamos observaciones y fechas de revisión'
        ch:
          lead: 'Los coches suizos suelen estar mejor cuidados que el promedio europeo: el mantenimiento costoso proporciona disciplina, y los kilómetros son bajos. Pero Suiza no está en la UE, por lo que la importación se gestiona de manera diferente, y eso lo incluimos en el presupuesto desde el principio.'
          points:
            - 'Equipamientos lujosos: aquí son más frecuentes que en los países vecinos'
            - 'MFK: la inspección es estricta, y se prepara con seriedad, lo cual es evidente en el coche'
            - 'No es la UE: la aduana y la documentación se gestionan de manera diferente a los países de la Unión Europea'
            - Precios más altos que el mercado, pero ahorras en reparaciones más adelante
        pt:
          lead: 'El mercado es pequeño, la elección es más limitada que en España, pero la competencia por buenos coches es menor. El clima es húmedo y salino: la corrosión costera se encuentra incluso en coches nuevos.'
          points:
            - 'Humedad y mar: cavidades ocultas y electricidad son prioridades en la inspección'
            - 'Mercado reducido: buscamos durante más tiempo en consulta específica que en Alemania'
            - 'Protocolo IPO: leemos las observaciones de inspecciones anteriores'
            - Muchos diéseles y utilitarios, las carrocerías grandes son escasas
        fr:
          lead: Francia se caracteriza sobre todo por los diéseles y marcas propias. Peugeot, Renault y Citroën tienen precios más bajos que en cualquier otro lugar de Europa. En cambio, los coches premium alemanes son más caros, y no tiene sentido comprarlos aquí.
          points:
            - 'Marcas francesas: el mejor precio en Europa y mantenimiento más barato'
            - 'Diéseles: revisamos el filtro de partículas y la válvula EGR como un punto separado'
            - 'Contrôle technique: los protocolos son detallados, revisamos las observaciones por año'
            - 'Uso urbano: el desgaste de la tracción y la suspensión ocurre más rápido de lo declarado'
        it:
          lead: 'El mercado italiano es bueno para utilitarios y configuraciones raras, pero requiere precaución: los coches aquí han sido muy utilizados, y a menudo las reparaciones menores de carrocería no se hacen con mucho cuidado.'
          points:
            - 'En la ciudad: frecuentes golpes menores y retoques, es imprescindible un medidor de grosor'
            - El sur y la costa generan sal y corrosión, el norte es más similar a las condiciones alemanas
            - 'Revisione: verificamos la regularidad, las omisiones son más frecuentes de lo habitual'
            - 'Muchos coches con equipamiento a gas: lo revisamos por separado'
        pl:
          lead: 'El mercado grande más cercano: la logística es barata y corta. Pero Polonia ha sido durante años el principal punto de tránsito para coches dañados de Europa Occidental, por lo que verificamos la historia aquí con más rigor que en cualquier otro lugar.'
          points:
            - 'Alta proporción de coches recuperados tras accidentes: la geometría de la carrocería es prioritaria'
            - 'Frecuentes reventas: el coche puede cambiar de propietario varias veces al año'
            - 'A menudo se ajusta el kilometraje a la hora de la importación: revisamos con bases de servicio'
            - 'Corto plazo de entrega: más barato y rápido que desde España o Portugal'
      closing:
        eyebrow: ¿Por dónde empezamos?
        line1: Describe el coche que buscas,
        line2: — aquí comienza nuestro trabajo
        accentWord: a partir de aquí nuestra labor
        text: Presupuesto, carrocería, transmisión y par de deseos extras. Nosotros buscamos, y usted revisa los informes de las opciones y decide cuál ver en persona.
