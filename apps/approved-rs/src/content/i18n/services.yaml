        - n: '02'
          text: Wir suchen Optionen in {location}, die Ihren Kriterien entsprechen
        - n: '03'
          text: Ein unabhängiger Experte besichtigt und überprüft das Auto
        - n: '04'
          text: Wir begleiten den Kauf, helfen bei den Dokumenten und der Anmeldung
        - n: '05'
          text: Wir liefern das Auto in Ihre Stadt und helfen bei der Zulassung
      deliveryLineFor: Wir liefern das Auto in jede Stadt des Landes. Wenn es ins Ausland exportiert werden muss, übernehmen wir den Export und die Zollabfertigung - wir liefern nach {destinations} und in jedes andere Land.
      deliveryDestinations:
        - Bosnien und Herzegowina
        - Kroatien
        - Nordmazedonien
        - Türkei
        - Kasachstan
        - Kirgisistan
      citiesHeadingFor: Wo wir Autos {countryLocation} besichtigen
      citiesLead: Der Experte fährt im ganzen Land, aber wir besichtigen am häufigsten Autos dort, wo sie am meisten angeboten werden. Das bedeutet Folgendes für jede Stadt.
      alsoInLabel: 'Wir suchen auch in:'
      crossSellLabel: Brauchen Sie kein lokales Auto?
      countryNotesHeadingFor: Was wir bei {location} berücksichtigen
      countryNotesPointsLabel: Worauf wir zuerst achten
      countryNotes:
        de:
          lead: 'Die Auswahl hier ist größer als in jedem anderen europäischen Markt, und die Servicegeschichte ist in der Regel nachvollziehbar: Die meisten Autos haben ein Serviceheft mit Einträgen des Händlers für jede Inspektion. Die Kehrseite - Autobahnmileage. Zweihunderttausend in drei Jahren ist hier normal und kein Grund für einen Preisnachlass.'
          points:
            - Serviceheft und Händlermarkierungen - wir überprüfen das per VIN bei einem offiziellen Service
            - HU-Protokoll, das alle TÜV nennen - wir lesen die Anmerkungen der letzten Inspektion und nicht nur den Stempel
            - 'Autos aus Leasing- und Fuhrparks: ordnungsgemäß gewartet, aber mit hohen Kilometerständen'
            - Winterstraßen mit Chemikalien - Unterboden und Schweller prüfen wir separat
        rs:
          lead: Hier sind wir vor Ort, daher besichtigen wir das Auto am selben Tag und ohne Import. Der Markt ist klein, dasselbe Auto wechselt oft den Besitzer, daher müssen wir die Geschichte entwirren.
          points:
            - Das Auto ist bereits verzollt und hat lokale Nummernschilder - Zölle und Importabwicklung sind nicht nötig
            - Der Kilometerstand wird beim Weiterverkauf häufig manipuliert - wir prüfen die Einträge des technischen Überprüfungsdienstes
            - Viele Fahrzeuge aus Deutschland und Italien - wir überprüfen, was mit dem Auto vor dem Import war
            - Besichtigung am Tag der Anfrage, ohne Wartezeiten für Logistik
        es:
          lead: Milde Winter und fast keine Chemikalien auf den Straßen, daher ist der Unterboden von spanischen Autos normalerweise deutlich besser als der deutscher. Gleichzeitig schädigen Sonne und Nähe zum Meer Lack, Kunststoff und Gummi.
          points:
            - An der Küste suchen wir Korrosion vor allem in versteckten Hohlräumen
            - Ausgebleichter Lack und rissiger Kunststoff im Innenraum - wir kalkulieren das in die Kosten ein
            - 'Viele ehemalige Mietwagen: gleichmäßiger Kilometerstand, aber intensive Nutzung'
            - ITV-Protokoll – wir vergleichen die Anmerkungen und Prüfdatums
        ch:
          lead: 'Schweizer Autos sind deutlich besser gepflegt als der europäische Durchschnitt: teure Wartung sorgt für Disziplin, die Laufleistungen sind gering. Aber die Schweiz gehört nicht zur EU, daher erfolgt der Import anders, was wir im Budget berücksichtigen.'
          points:
            - Reichhaltige Ausstattungen – hier wurden sie häufiger gewählt als bei den Nachbarn
            - MFK – die Inspektion ist streng, darauf wird ernsthaft vorbereitet, und das sieht man dem Auto an
            - 'Nicht EU: Zoll und Dokumente sind anders geregelt als für EU-Länder'
            - Preise über dem Markt, aber man spart später bei Reparaturen
        pt:
          lead: Der Markt ist klein, die Auswahl bescheidener als in Spanien, dafür ist der Wettbewerb um gute Autos geringer. Das Klima ist feucht und salzig – maritimer Rost tritt auch bei neuen Autos auf.
          points:
            - Feuchtigkeit und Meer – versteckte Hohlräume und Elektrik sind bei der Inspektion prioritär
            - 'Kleiner Markt: für spezifische Anfragen suchen wir länger als in Deutschland'
            - IPO-Protokoll – wir lesen die Anmerkungen der vorherigen Inspektionen
            - Viele Diesel und Kleinstwagen, große Karosserien sind selten
        fr:
          lead: Frankreich ist vor allem Diesel und heimische Marken. Peugeot, Renault und Citroën sind hier günstiger als überall in Europa. Deutsche Premiumfahrzeuge sind dagegen teurer, hier macht es wenig Sinn, sie zu kaufen.
          points:
            - Französische Marken bieten die besten Preise in Europa, und die Wartung ist billiger
            - Diesel – Partikelfilter und EGR-Ventil betrachten wir als separate Position
            - Contrôle technique – die Protokolle sind detailliert, wir vergleichen Anmerkungen über die Jahre
            - 'Städtischer Betrieb: Haftung und Aufhängung nutzen sich schneller ab als angegeben'
        it:
          lead: 'Der italienische Markt ist bekannt für Kleinwagen und seltene Ausstattungen, erfordert aber Vorsicht: Autos werden hier stark genutzt, und kleine Karosserie-Reparaturen werden nicht immer sorgfältig ausgeführt.'
          points:
            - Stadt – häufige kleine Dellen und Nachlackierungen, ein Lackmessgerät ist unerlässlich
            - Süden und Küste bringen Salz und Rost, der Norden hat bessere Bedingungen wie in Deutschland
            - Revisione – wir überprüfen Regelmäßigkeit, Auslassungen kommen öfter vor als gewöhnlich
            - Viele Autos mit Gasanlagen – wir schauen uns das separat an
        pl:
          lead: 'Der nächstgelegene große Markt: die Logistik ist günstig und kurz. Aber Polen war jahrelang der Hauptumschlagplatz für beschädigte Autos aus Westeuropa, daher prüfen wir die Historie hier strenger als irgendwo sonst.'
          points:
            - Hoher Anteil nach Unfällen wiederhergestellter Fahrzeuge – die Karosserie-Geometrie hat Vorrang
            - 'Häufige Weiterverkäufe: ein Auto wechselt im Jahr mehrere Besitzer'
            - Die Kilometerstände werden häufig beim Import korrigiert – wir vergleichen mit den Servicedaten
            - Kurze Lieferstrecke – günstiger und schneller als aus Spanien oder Portugal
      closing:
        eyebrow: Wie fangen wir an?
        line1: Beschreiben Sie das Auto,
        line2: das Sie suchen –
        accentWord: danach ist unsere Arbeit
        text: Budget, Karosserie, Getriebe, ein paar Wünsche dazu. Wir suchen, während Sie die Berichte zu den Optionen ansehen und entscheiden, welches Sie sich live anschauen möchten.
