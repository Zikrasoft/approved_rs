          - title: Proveru istorije i pravne čistoće
            text: CarVertical izveštaj prema VIN-u, servisna istorija dilera po marki, provera pređenih kilometara, zalozi, ograničenja na registraciju i neizmirena osiguravajuća događanja.
          - title: Pregovaranje i potpisivanje transakcije
            text: Dogovaramo cenu uzimajući u obzir šta smo našli, pripremamo dokumente i pratimo potpisivanje.
          - title: Dostava i registracija
            text: Dovozimo auto do vašeg grada i pomažemo sa registracijom na licu mesta — ili predajemo ključeve gde vam odgovara da ih preuzmete.
          - title: Jedna osoba za ceo proces
            text: S vama radi isti stručnjak koji je išao na pregled. Ne trebate ponovo objašnjavati zadatak svima ko bude na vezi.
