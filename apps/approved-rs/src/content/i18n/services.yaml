          points:
            - El flete marítimo es el principal tiempo, planifica en meses, no en semanas.
            - 'No se confirma la procedencia europea: el EUR1 no se aplica aquí, el arancel es más alto.'
            - 'Garantía y piezas de repuesto: verificamos si el modelo se apoya en el país destino.'
            - 'Vehículos eléctricos: revisamos el conector de carga y la compatibilidad con las redes locales.'
      closing:
        eyebrow: Calculamos la importación
        line1: Dime, ¿qué
        line2: coche necesitas, —
        accentWord: calcularemos hasta las matrículas
        text: 'El costo del coche, la logística, los aranceles y la documentación — una suma antes de comenzar. Después no aumentará: todo lo que surja en el camino será nuestra preocupación.'
    vehicle-inspection:
      title: Inspección de vehículos
      description: Inspección independiente del automóvil antes de la compra. Visita de un experto, diagnóstico, informe — sin obligación de compra.
      ctaLabel: Solicitar inspección
      casesHeading: Casos de inspección
      breadcrumbLabel: Inspección de vehículos
      steps:
        - n: '01'
          text: Carrocería y pintura — existencia de reparaciones o accidentes
        - n: '02'
          text: Suspensión, frenos
        - n: '03'
          text: Motor, caja de cambios, transmisión
        - n: '04'
          text: Electrónica e historial de servicio por VIN
        - n: '05'
          text: Limpieza legal — hipotecas, prohibiciones de registro, accidentes
      extraLine: Trabajamos en otros países de Europa, incluyendo Portugal — consulte al realizar su solicitud.
      hub:
        metaTitle: Inspección de vehículos antes de la compra en Europa
        metaDescription: 'Salimos al automóvil que usted ha encontrado: medidor de grosor, escáner, verificación de historial por VIN y un informe con fotos el mismo día. Trabajamos en ocho países de Europa.'
        title: Inspección de vehículos
        titleHighlight: antes de la compra
        description: "Nos dirigimos al automóvil que usted ha encontrado y le contamos lo que realmente tiene. El informe llega antes de que pague: si la respuesta es 'no lo compre', solo perderá el costo de la inspección."
        breadcrumbLabel: Inspección de vehículos
        casesHeading: Casos de inspección
        chooseCountryLabel: 'Elija un país:'
        ctaLabel: Solicitar inspección
        heroPhotoAlt: Automóvil en un elevador en el taller
        processHeading: Cómo se realiza la inspección
        processLead: Normalmente salimos uno o dos días después de la solicitud. La inspección toma entre una y dos horas, y enviamos el informe el mismo día, mientras el automóvil aún no ha sido vendido a otro comprador.
        processSteps:
          - n: '01'
            text: Envía el enlace del anuncio y los datos de contacto del vendedor
          - n: '02'
            text: Acordamos con el vendedor la fecha y lugar de la inspección
          - n: '03'
            text: Salimos con un medidor de grosor y un escáner; para BMW conectamos el ISTA del concesionario, y si es necesario, usamos el elevador
          - n: '04'
            text: Tomamos fotos y videos de todos los hallazgos, verificamos el historial por VIN
          - n: '05'
            text: Enviamos el informe y una respuesta directa — comprar, negociar o rechazar
        includedHeading: Qué incluye la inspección
        includedLead: 'Más de cien puntos en la lista de verificación, pero casi siempre hay cuatro áreas que importan: carrocería, motor con caja de cambios, suspensión y documentos. Son estas las que más a menudo nos llevan a desaconsejar una compra.'
        included:
          - title: Carrocería y pintura
            text: Medición de grosor en cada panel, geometría de los marcos, huellas de soldadura y masilla. Se puede ver si ha habido reparaciones que el vendedor no mencionó.
          - title: Motor y caja de cambios
            text: Parámetros con motor caliente, adaptaciones de la caja de cambios, errores en la memoria de los módulos. Es la zona más cara y la razón más frecuente de rechazo.
          - title: Suspensión y frenos
            text: Holguras, estado de la suspensión y el sistema de frenos. El kilometraje de carretera y las carreteras balcánicas desgastan el automóvil de manera diferente, y esto se nota.
          - title: Electrónica e historial por VIN
            text: Informe de CarVertical, historial de servicio del concesionario por marca, discrepancia en el kilometraje con el historial, errores de los módulos y huellas de airbags disparados.
          - title: Limpieza legal
            text: Hipotecas, prohibiciones de registro, accidentes no reportados y eventos de seguros — cosas que se revelan después de la compra.
          - title: Informe con fotos y videos
            text: Cada hallazgo se registra y se explica. El informe se queda con usted — es práctico para negociar, incluso si después decide comprar el automóvil.
        compareHeading: Qué cambia de un país a otro
        compareLead: Reglamento de ITV, problemas comunes de los autos locales y formas de ocultar el historial en todas partes.
        compareHint: Elija un país — le mostraremos qué se añade a la lista de verificación habitual.
        compareLinkFor: Inspección {location} — detalladamente
        mapHeading: Cuatro áreas que deciden la transacción
        mapLead: La lista de verificación es larga, pero casi siempre desaconsejamos basándonos en una de las cuatro áreas. Haga clic en el número en el esquema — le mostraremos qué revisa el experto y qué hemos encontrado allí.
      countryNotesHeadingFor: Cómo revisamos {location}
      countryNotesPointsLabel: Qué revisamos más allá de la lista de verificación habitual
      countryNotes:
        de:
          lead: 'En Alemania hay mucho en qué basarse: libro de servicio, protocolos HU y bases de datos VIN desarrolladas. Por lo tanto, la inspección aquí es, ante todo, la verificación de documentos contra lo que muestra el automóvil.'
          points:
            - Verificamos las marcas de mantenimiento del concesionario con el kilometraje a lo largo de los años
            - Observaciones del HU anterior — qué se reparó después de la inspección y qué simplemente se alargó
            - Suelo y umbrales después de los reactivos invernales, incluyendo cavidades ocultas
            - 'Pasado de leasing: mantenimiento uniforme con alto kilometraje'
        rs:
          lead: 'En Serbia salimos el mismo día que se solicita. La tarea principal es recuperar la historia del vehículo antes de la importación: los documentos locales solo muestran el último tramo de la vida del automóvil.'
          points:
            - País de origen y estado del vehículo antes de ser importado a Serbia
            - Lectura del odómetro frente a las marcas de la техпреглед за за последните години
            - Reparación de carrocería después de la importación — se hace más a menudo y más barato que en la UE
            - 'Parte legal: hipotecas y restricciones sobre el registro'
        es:
          lead: Los coches españoles generalmente se encuentran en buen estado por debajo, pero suelen sufrir de todo lo que está expuesto al sol y la sal. Cambiamos el enfoque de la corrosión en la parte inferior a las cavidades ocultas, la electricidad y el estado del interior.
          points:
            - Corrosión en cavidades ocultas cerca de la costa — puede estar limpio por debajo
            - Pintura, sellos y plástico después de años de sol
            - 'Pasado de alquiler: verificamos el kilometraje con el desgaste del interior'
            - Protocolo ITV y qué no se ha cerrado entre las inspecciones
        ch:
          lead: Los coches se preparan seriamente para el MFK, por lo que un protocolo reciente en sí mismo no dice mucho. Observamos qué se hizo justo antes de la inspección y qué ha estado funcionando desde el año pasado.
          points:
            - Qué se reemplazó justo antes del MFK — piezas nuevas en comparación con el resto
            - El mantenimiento es caro, por lo que verificamos si se han pospuesto los reglamentos
            - La equipación es rica, pero verificamos que cada opción aún funcione
            - 'Documentos de importación: Suiza no es la UE, el conjunto es diferente'
        pt:
          lead: 'Todo aquí está determinado por el clima marítimo húmedo. Comenzamos la inspección con la corrosión y la electricidad: lo que suele fallar es lo que vive en la humedad.'
          points:
            - Cavidades ocultas, largueros y puntos de anclaje de la suspensión
            - Oxidación de conectores y módulos — causa típica de errores intermitentes
            - Protocolo IPO y regularidad en las inspecciones
            - 'Diésel utilizado en ambientes urbanos: filtro de partículas y su historial'
        fr:
          lead: 'En Francia hay un contrôle technique detallado, y esto es un buen punto de partida. Luego verificamos lo que el reglamento no captura: durabilidad del grupo diésel y desgaste por tráfico urbano.'
          points:
            - Observaciones del contrôle technique a lo largo de los años — qué se repite de una inspección a la siguiente
            - Filtro de partículas, EGR y turbo en diésel
            - Embrague y suspensión después de un ciclo urbano denso
            - 'Historial de marcas francesas: piezas accesibles, pero con sus debilidades'
        it:
          lead: Los coches italianos llegan más que otros con reparaciones menores en la carrocería, hechas rápida y económicamente. Aquí se necesita notablemente más tiempo para medir el grosor en los paneles que de costumbre.
          points:
            - Medición de grosor en todos los paneles — repintados después de rozaduras urbanas
            - 'Diferencia entre el norte y el sur: sal cerca de la costa, desgaste normal en el interior del país'
            - Equipo de gas, si está instalado, — instalación y estado del cilindro
            - Regularidad de la revisione y periodos omitidos
        pl:
          lead: Polonia es el mayor mercado de tránsito para coches dañados de Europa Occidental. Por lo tanto, primero averiguamos qué se ha hecho con esta carrocería antes de la venta.
          points:
            - Geometría de los marcos y huellas de soldadura — restauración después de un grave accidente
            - 'Historia de importación: de dónde vino el automóvil y en qué estado'
            - Kilometraje verificado con bases de datos de servicio europeas, no confiamos en el odómetro
            - Airbags y su activación en el pasado
      closing:
        eyebrow: ¿Encontró el coche?
        line1: Envíe el enlace
        line2: del anuncio —
        accentWord: iremos a verlo
        text: Salimos en uno o dos días. El informe con fotos se queda con usted, incluso si después decide rechazar la compra.
    cityVehicleSourcing:
      title: Selección de vehículos
      descriptionFor: Te ayudamos a encontrar un automóvil en {cityLocation} con verificación completa. Trabajamos en toda la región de {countryName}.
      casesHeadingFor: Casos de {countryGenitiveOrName}
      whyCityHeadingFor: Por qué {cityName}
      reason1: Revisamos tanto concesionarios como anuncios privados
      reason2: Verificamos el historial por VIN antes de desplazarnos para la inspección
      reason3For: Nuestro experto en {cityLocation}
      reason4Dekra: Inspección DEKRA / TÜV bajo solicitud
      reason4Generic: Inspección técnica independiente bajo solicitud
      otherCitiesLabelFor: 'Otras ciudades en {countryLocation}:'
      cityNotesHeadingFor: Mercado automotriz de {cityLocation}
      cityNotesPointsLabel: ¿Qué ofrece esto en la práctica?
      cityNotes:
        berlin:
          lead: 'Berlín tiene la mayor selección en Alemania y una variedad de vendedores muy diversa. Aquí encontrarás todo: desde coches de flotas corporativas con historial completo hasta opciones de reventa que vienen de Europa del Este.'
          points:
            - Gran selección en cualquier segmento, incluyendo configuraciones raras
            - Muchos vendedores privados — la negociación es más realista que con los concesionarios
            - 'Ciclo urbano: el embrague y la suspensión se desgastan más rápidamente que en coches de carretera'
        munich:
          lead: 'Una ciudad cara con coches caros. Hay más vehículos de gama premium aquí que en cualquier otro lugar de Alemania, y su estado tiende a ser superior: se cuida de estos coches.'
          points:
            - Fuerte segmento premium, especialmente BMW y Mercedes
            - Coches bien mantenidos con historial completo de concesionario
            - Los precios son más altos que el promedio nacional — el ahorro proviene del estado
        hamburg:
          lead: Ciudad portuaria y gran centro logístico. Desde aquí es fácil enviar coches más lejos, y en el mercado es más común encontrar automóviles importados frescos.
          points:
            - El puerto cercano facilita y abarata el envío
            - Muchos coches de tierras del norte con kilometraje de carretera
            - 'Clima marino húmedo: revisamos la carrocería y espacios ocultos con más atención'
        dusseldorf:
          lead: Centro de Renania del Norte-Westfalia, la región más poblada de Alemania. Los concesionarios están muy cerca entre sí, y la frontera con los Países Bajos y Bélgica está a una hora, por lo que regularmente llegan coches aquí para la venta.
          points:
            - Podemos ver varios coches en una sola visita — concesionarios cercanos
            - 'Parte de las ofertas tienen matrículas holandesas y belgas: verificamos la historia y los documentos por separado'
            - Hay muchos vendedores y compiten entre sí — la negociación es más activa
        belgrade:
          lead: Nuestra base. En Belgrado hacemos la inspección el mismo día de la consulta, conocemos a los vendedores locales y sabemos qué coche ha estado rodando por los concesionarios en los últimos dos meses.
          points:
            - Inspección el mismo día de la consulta, sin esperas ni logística
            - Conocemos los concesionarios locales y la historia de los coches que tienen
            - El coche ya está despachado — no se necesitan permisos de importación ni aranceles
        novi-sad:
          lead: La segunda ciudad más grande de Serbia, y a una hora en coche de Belgrado. El mercado es más pequeño, pero los precios suelen ser más tranquilos que en la capital y los coches rara vez han pasado por múltiples reventas.
          points:
            - Precios más bajos que en Belgrado con estado comparable
            - Menos revendedores, más propiedades de primer dueño
            - Salimos desde Belgrado, sin costo adicional por el viaje
        pancevo:
          lead: Pancevo forma parte de la aglomeración belgradense, por lo que la inspección aquí no es diferente a la de la capital. El mercado es pequeño, pero los anuncios privados son más interesantes.
          points:
            - Veinte minutos desde Belgrado — llegamos igual de rápido
            - Mercado pequeño con predominancia de vendedores privados
            - A menudo más barato que la capital con el mismo estado
        subotica:
          lead: 'Subotica está en la frontera con Hungría, lo que se refleja en su mercado: muchos coches importados de la UE y vendedores que se dedican a ello de forma constante.'
          points:
            - Mercado fronterizo — mucho nuevo importado de la Unión Europea
            - Verificamos la historia antes de la importación de manera especialmente exhaustiva
            - Punto conveniente si planeas enviar el coche más al norte
        madrid:
          lead: 'El mercado capitalino de España: la mayor selección del país y muchos coches de flotas corporativas. Clima continental, por lo que la corrosión marina es menor que en la costa.'
          points:
            - La mayor selección en España, incluyendo coches corporativos
            - Alejado del mar — las carrocerías suelen estar más limpias que las costeras
            - 'Verano caluroso: revisamos plásticos, pintura y aire acondicionado por separado'
        barcelona:
          lead: Todo está determinado por la cercanía al mar. Los coches a menudo se ven genial por debajo, pero requieren atención a los espacios ocultos y la electricidad.
          points:
            - 'El mar está cerca, así que revisamos los espacios ocultos: por debajo a menudo está limpio, pero por dentro no'
            - Muchos coches de alquiler y carsharing
            - El puerto cercano facilita el envío por mar
        zurich:
          lead: Zúrich es el mercado automovilístico más caro de la región. Aquí las configuraciones son las más altas, son mantenidos en concesionarios, y se venden antes de que el coche se desgaste.
          points:
            - Máximas configuraciones y poco kilometraje
            - Mantenimiento en concesionario — el historial casi siempre es completo
            - Suiza no está en la UE, el proceso de importación se realiza por separado
        geneva:
          lead: Ginebra está en la parte francófona de Suiza, justo en la frontera con Francia. Hay notablemente más marcas francesas que en la parte alemana del país.
          points:
            - 'Mercado mixto: estado suizo, surtido francés'
            - Frontera con Francia cercana — hay comparación de precios
            - 'Los trámites son los mismos que en toda Suiza: exportación más importación'
        paris:
          lead: 'La mayor selección en Francia se ve acompañada de un uso muy intenso: tráfico denso y estacionamientos angostos dejan huellas en la carrocería y la suspensión.'
          points:
            - La mayor selección en Francia, especialmente de marcas francesas
            - 'Ciclo urbano: embrague, suspensión y daños menores en la carrocería'
            - Muchos diésel — revisamos el filtro de partículas y EGR primero
        lyon:
          lead: Lyon es más tranquilo que París tanto en precios como en estado de los coches. La carretera al sur está cerca, así que es más común conseguir coches con un kilometraje lineal.
          points:
            - Precios más bajos que en París con opciones comparables
            - Más kilometraje de carretera, menos desgaste urbano
            - Punto conveniente hacia Italia y España, si buscamos opciones más amplias
        milan:
          lead: 'Capital empresarial de Italia, y se nota en los precios del mercado. El norte del país se asemeja más a las condiciones alemanas: mejores carreteras, coches más cuidados que en el sur.'
          points:
            - La mejor selección de gama premium en Italia
            - El norte — menos sal y corrosión que en el sur del país
            - 'Ciudad densa: es imprescindible un medidor de espesor en los paneles'
        rome:
          lead: Gran mercado con un uso urbano muy intenso. Arañazos menores aquí se consideran parte de la vida, y a menudo se reparan de forma apresurada.
          points:
            - Muchos coches compactos y vehículos de gas
            - 'Reparaciones frecuentes después de contactos urbanos: revisamos cada panel'
            - Al sur de Milán — el clima es más suave, pero más cerca del mar
        warsaw:
          lead: Por Varsovia entra la mayor parte de la importación desde Europa Occidental, y aquí se encuentra la mayor selección en Polonia. La proporción de coches reacondicionados es también la más alta.
          points:
            - La mayor selección en Polonia, mucho nuevo importado de la UE
            - Verificamos la geometría de la carrocería y signos de reparaciones primero
            - Entrega económica — más barata que desde el sur de Europa
        krakow:
          lead: 'Cracovia es más tranquila que Varsovia: el mercado es más pequeño, hay menos reventas y los coches generalmente tienen un solo propietario por más tiempo. El sur de Polonia tiene mejor logística hacia los Balcanes.'
          points:
            - Menos revendedores que en Varsovia, la historia suele estar más limpia
            - Los precios a menudo son más bajos que en la capital
            - Más cerca de la ruta al sur — conveniente para la entrega a Serbia
