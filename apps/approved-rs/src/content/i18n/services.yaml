          points:
            - El trayecto es más largo que el alemán, el transporte en camión es más beneficioso que el traslado
            - La baja (baja) toma más tiempo que en Alemania
            - El certificado EUR1 lo gestionamos con el vendedor antes de la compra, luego es más complicado
            - Revisamos los coches de la costa en busca de corrosión oculta antes del envío
