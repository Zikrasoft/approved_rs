          - title: Autos mit russischen Nummern
            text: Die Hauptkategorie. Das Fahrzeug kann sich in jedem Land Europas befinden — wir kommen dorthin, wo es steht, und kümmern uns um den Export und den weiteren Verkauf.
          - title: Probleme mit Einfuhr und Fristen
            text: Nach der Unterzeichnung gehen die abgelaufene vorübergehende Einfuhr und die damit verbundenen Risiken auf uns über.
