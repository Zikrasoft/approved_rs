      hub:
        metaTitle: Autoauswahl in Europa ganz einfach
        metaDescription: 'Wir suchen Autos in Deutschland, Serbien, Spanien, der Schweiz, Italien, Frankreich, Polen und Portugal: Suche, Besichtigung, Preisverhandlung und Lieferung aus einer Hand.'
        title: Autoauswahl
        titleHighlight: ganz einfach
        description: Wir finden das passende Auto in dem Land, in dem Sie sich befinden oder wo Sie kaufen möchten - umfassende Prüfung, Unterstützung beim Kauf und Lieferung aus einer Hand. Wählen Sie ein Land, um Details zu sehen.
        breadcrumbLabel: Autoauswahl
        casesHeading: Echte Autoauswahl-Fälle
        chooseCountryLabel: 'Wählen Sie ein Land:'
        ctaLabel: Autoauswahl
        heroPhotoAlt: Reihe von Autos auf dem Gelände eines Händlers
        processHeading: So funktioniert die Auswahl
        processLead: 'Von der Anfrage bis zu den Schlüsseln dauert es normalerweise zwischen drei Tagen und zwei Wochen. Am längsten dauert die Autosuche: Das erste passende Auto nehmen wir nicht und schauen weiter, bis wir das finden, das nach der Prüfung keine Fragen aufwirft.'
        processSteps:
          - n: '01'
            text: Wir besprechen das Budget, die Marke und die Anforderungen - was wichtig ist und wovon Sie bereit sind, Abstand zu nehmen
          - n: '02'
            text: Wir selektieren Optionen vor Ort und filtern telefonisch alles heraus, das nicht den Anforderungen entspricht
          - n: '03'
            text: Wir fahren zur Besichtigung mit einem Lackdickenmessgerät und Scanner, für BMW verbinden wir uns mit dem Händler-ISTA, und machen Fotos und Videos
          - n: '04'
            text: Wir senden einen Bericht und sagen direkt, ob es sich lohnt, das Auto zu kaufen oder ob wir weiter suchen sollten
          - n: '05'
            text: Wir verhandeln, оформляем сделку und liefern das Auto zu Ihnen oder bringen es zu Ihrer Tür
        includedHeading: Was im Service enthalten ist
        includedLead: Die Provision wird vor Beginn festgelegt und hängt nicht davon ab, wie viele Autos wir besichtigen mussten. Wenn wir nach der Prüfung sagen «nicht kaufen», suchen wir weiter, dafür müssen Sie nichts extra bezahlen.
        included:
          - title: Suche ohne Begrenzung der Anzahl der Optionen
            text: Wir arbeiten, bis wir ein Auto finden, das keine Ansprüche aufwirft. Die Ablehnung eines misslungenen Autos gehört zum Service und kostet nichts zusätzlich.
          - title: Expertenbesuch bei jeder Besichtigung
            text: Lackdickenmessgerät für die Karosserie, Scanner für die Steuereinheiten, Bühne, wo nötig. Fotos und Videos von allen problematischen Bereichen - Sie sehen dasselbe wie wir.
          - title: Überprüfung der Historie und rechtlichen Sauberkeit
            text: CarVertical-Bericht per VIN, Händler-Servicehistory für die Marke, Kontrolle des Kilometerstands, Pfandrechte, Einschränkungen bei der Registrierung und offene Schadensfälle.
          - title: Verhandlung und Abschluss der Transaktion
            text: Wir verhandeln den Preis in Anbetracht des Gefundenen, bereiten die Dokumente vor und begleiten die Unterschrift.
          - title: Lieferung und Zulassung
            text: Wir bringen das Auto in Ihre Stadt und helfen Ihnen bei der Anmeldung vor Ort - entweder übergeben wir die Schlüssel dort, wo es Ihnen passt.
          - title: Ein Ansprechpartner für den gesamten Prozess
            text: Der gleiche Spezialist, der zur Besichtigung gefahren ist, arbeitet mit Ihnen zusammen. Sie müssen jedem, der ans Telefon geht, nicht erneut das Problem erklären.
        compareHeading: Wie sich die Märkte unterscheiden
        compareLead: Dasselbe Modell in Deutschland und Polen - in der Historie und im Preis sind das zwei verschiedene Autos.
        compareHint: Wählen Sie ein Land - wir zeigen, was wir dort als erstes untersuchen.
        compareLinkFor: Autoauswahl {location} - im Detail
      title: Autoauswahl ganz einfach
      descriptionFor: Wir finden ein Auto in {location} - aus den Fahrzeugen, die bereits in diesem Land sind, ohne Importe aus dem Ausland. Vollständige Überprüfung, Unterstützung beim Kauf und Lieferung in Ihre Stadt.
