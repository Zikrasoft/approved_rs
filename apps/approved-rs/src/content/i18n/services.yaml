          lead: 'Autos aus Spanien werden wegen des Karosseriezustands importiert: mildes Klima und fast keine Frostschutzmittel. Nachteil — die Strecke ist doppelt so lang wie die nach Deutschland, und das zeigt sich im Kostenvoranschlag.'
