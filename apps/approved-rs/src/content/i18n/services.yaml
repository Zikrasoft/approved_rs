        included:
          - title: Costo del vehículo
            text: Precio después de la negociación, no el que figura en el anuncio. Negociamos con el auto en la mano — esto suele amortiguar parte de los gastos.
          - title: Logística hasta el destino
            text: Transporte en camión o conducción con placas de tránsito. Calculamos ambas opciones y elegimos la más ventajosa para la situación específica.
          - title: Aranceles e impuestos
            text: La tasa depende del país de origen del vehículo y su antigüedad. Para autos de fabricación europea, el certificado EUR1 cambia radicalmente el cálculo — verificamos su disponibilidad antes de la compra.
          - title: Exportación y tránsito
            text: Dación de baja en el país vendedor, declaración de exportación, placas de tránsito y seguro para el traslado.
          - title: Despacho aduanal
            text: Declaración, agente aduanal y pago a la llegada. Preparamos el paquete con anticipación para que el auto no esté en el depósito más días de lo necesario.
          - title: Matrícula
            text: Inspección técnica, registro y placas. Recoges el auto que ya está listo para conducir.
