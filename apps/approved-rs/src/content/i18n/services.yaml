    vehicle-sourcing:
      hub:
        metaTitle: Fahrzeugauswahl in Europa - schlüsselfertig
        metaDescription: 'Fahrzeugsuche in Deutschland, Serbien, Spanien, Schweiz, Italien, Frankreich, Polen und Portugal: Suche, Besichtigung, Preisverhandlung und Lieferung.'
        title: Fahrzeugauswahl
        titleHighlight: schlüsselfertig
        description: Wir suchen ein Auto in dem Land, in dem Sie sich befinden oder das Sie kaufen möchten — vollständige Prüfung, Begleitung des Geschäfts und Lieferung. Wählen Sie ein Land, um die Details zu sehen.
        breadcrumbLabel: Fahrzeugauswahl
        casesHeading: Fälle der Fahrzeugauswahl
        chooseCountryLabel: 'Wählen Sie ein Land:'
        ctaLabel: Auto auswählen
        heroPhotoAlt: Reihe von Fahrzeugen auf dem Händlerplatz
        processHeading: So läuft die Auswahl ab
        processLead: 'Von der Anfrage bis zum Schlüssel dauert es normalerweise drei Tage bis zwei Wochen. Am längsten suchen wir ein Auto: Das erste passende nehmen wir nicht und schauen weiter, bis wir eines finden, bei dem nach der Prüfung keine Fragen offenbleiben.'
        processSteps:
          - n: '01'
            text: Wir besprechen Ihr Budget, die Marke und Anforderungen — was wichtig ist und wo Sie bereit sind zu verzichten.
          - n: '02'
            text: Wir selektieren Optionen vor Ort und filtern telefonisch alles, was nicht unseren Ansprüchen genügt.
          - n: '03'
            text: Wir fahren zur Besichtigung mit einem Lackmessgerät und Scanner, bei BMW verbinden wir uns mit dem Händlergerät ISTA, machen Fotos und Videos.
          - n: '04'
            text: Wir senden einen Bericht und sagen direkt, ob es sich lohnt oder ob wir weiter suchen sollten.
          - n: '05'
            text: Wir verhandeln, bereiten den Vertrag vor und übergeben das Auto an Sie oder bringen es bis zu Ihrer Haustür.
        includedHeading: Was in der Dienstleistung enthalten ist
        includedLead: Die Provision wird vor Beginn festgelegt und hängt nicht von der Anzahl der sichtbaren Autos ab. Wenn wir nach der Prüfung sagen 'nehmen Sie nicht' — suchen wir weiter, dafür müssen Sie nichts zusätzlich bezahlen.
        included:
          - title: Suche ohne Einschränkung der Anzahl von Optionen
            text: Wir arbeiten, bis wir ein Auto finden, bei dem es keine Beanstandungen gibt. Die Ablehnung eines nicht passenden Autos gehört zum Service und ist kostenlos.
          - title: Expertenbesuch bei jeder Besichtigung
            text: Lackmessgerät für die Karosserie, Scanner für die Module, Hebebühne, wo nötig. Fotos und Videos von allen problematischen Stellen — Sie sehen dasselbe wie wir.
          - title: Prüfung der Historie und Rechtslage
            text: CarVertical-Bericht per VIN, Händler-Servicehistorie nach Marke, Überprüfung des Kilometerstands, Pfandrechte, Registrierungseinschränkungen und nicht abgeschlossene Versicherungsfälle.
          - title: Verhandlung und Vertragsabschluss
            text: Wir handeln den Preis unter Berücksichtigung des Gesehenen aus, bereiten die Dokumente vor und begleiten die Unterzeichnung.
          - title: Lieferung und Zulassung
            text: Wir bringen das Auto in Ihre Stadt und helfen vor Ort bei der Anmeldung — entweder übergeben wir die Schlüssel dort, wo es Ihnen passt.
          - title: Eine Person für den gesamten Prozess
            text: Sie arbeiten mit dem gleichen Spezialisten, der zur Besichtigung gefahren ist. Es ist nicht nötig, jedem, der das Telefon abnimmt, die Aufgabe erneut zu erklären.
