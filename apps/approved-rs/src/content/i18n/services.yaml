  de:
    vehicle-sourcing:
      hub:
        metaTitle: 'Autokauf in Europa: Rundum-Service'
        metaDescription: Wir finden Autos in Deutschland, Serbien, Spanien, der Schweiz, Italien, Frankreich, Polen und Portugal. Suche, Besichtigung, Preisverhandlung und Lieferung.
        title: Autokauf
        titleHighlight: mit Rundum-Service
        description: Wir finden Ihr Auto in dem Land, in dem Sie leben oder kaufen möchten. Mit gründlicher Prüfung, Begleitung beim Kauf und Lieferung bis vor die Tür. Wählen Sie ein Land für weitere Informationen.
        breadcrumbLabel: Autokauf
        casesHeading: Erfolgreiche Autokäufe
        chooseCountryLabel: 'Land auswählen:'
        ctaLabel: Auto finden lassen
        heroPhotoAlt: Autos auf dem Gelände eines Händlers
        processHeading: So läuft die Suche ab
        processLead: 'Vom Auftrag bis zum Schlüssel dauert es meist drei Tage bis zwei Wochen. Die Suche nimmt am meisten Zeit in Anspruch: Wir nehmen nicht das erstbeste Auto, sondern suchen weiter, bis wir eines finden, bei dem die Prüfung keine Fragen offenlässt.'
        processSteps:
          - n: '01'
            text: 'Wir besprechen Budget, Marke und Ihre Anforderungen: Was ist wichtig, worauf können Sie verzichten?'
          - n: '02'
            text: Wir prüfen Angebote vor Ort und sortieren telefonisch alles aus, was unseren Fragen nicht standhält
          - n: '03'
            text: Wir fahren mit Lackschichtdickenmessgerät und Diagnosescanner zur Besichtigung. Bei BMW nutzen wir die Händlerdiagnose ISTA. Sie erhalten Fotos und Videos.
          - n: '04'
            text: Wir schicken Ihnen den Bericht und sagen offen, ob sich der Kauf lohnt oder wir weitersuchen sollten
          - n: '05'
            text: Wir verhandeln den Preis, wickeln den Kauf ab und übergeben Ihnen das Auto oder liefern es bis vor die Tür
        includedHeading: Was unser Service umfasst
        includedLead: Unsere Gebühr steht vor Beginn fest und hängt nicht davon ab, wie viele Autos wir besichtigen. Wenn wir nach der Prüfung vom Kauf abraten, suchen wir weiter, ohne Aufpreis.
        included:
          - title: Suche ohne Begrenzung der Angebote
            text: Wir suchen, bis wir ein Auto ohne Beanstandungen finden. Ein ungeeignetes Fahrzeug abzulehnen, ist im Service enthalten und kostet nichts extra.
          - title: Ein Experte bei jeder Besichtigung
            text: Lackschichtdickenmessung an den Karosserieteilen, Diagnose aller Steuergeräte und bei Bedarf eine Hebebühne. Fotos und Videos aller Problemstellen, damit Sie dasselbe sehen wie wir.
          - title: Prüfung der Fahrzeughistorie und Rechtslage
            text: CarVertical-Bericht anhand der VIN, Wartungshistorie beim Markenhändler, Kilometerstand, Finanzierung, Zulassungssperren und offene Versicherungsfälle.
          - title: Preisverhandlung und Kaufabwicklung
            text: Wir verhandeln den Preis anhand unserer Prüfergebnisse, bereiten die Unterlagen vor und begleiten die Vertragsunterzeichnung.
          - title: Lieferung und Zulassung
            text: Wir liefern das Auto in Ihre Stadt und helfen bei der Zulassung vor Ort oder übergeben Ihnen die Schlüssel an einem Ort Ihrer Wahl.
          - title: Ein Ansprechpartner von Anfang bis Ende
            text: Ihr Ansprechpartner ist derselbe Experte, der das Auto besichtigt hat. Sie müssen Ihr Anliegen nicht jedem am Telefon erneut erklären.
        compareHeading: So unterscheiden sich die Märkte
        compareLead: Dasselbe Modell kann in Deutschland und Polen bei Preis und Historie zwei völlig verschiedene Autos sein.
        compareHint: Wählen Sie ein Land und wir zeigen Ihnen, worauf wir dort zuerst achten.
        compareLinkFor: 'Autokauf {location}: alle Details'
      title: Autokauf mit Rundum-Service
      descriptionFor: Wir finden für Sie ein Auto {location}, das bereits im Land ist, ohne Import aus dem Ausland. Mit gründlicher Prüfung, Kaufbegleitung und Lieferung in Ihre Stadt.
      ctaLabel: Anfrage senden
      casesHeadingFor: 'Erfolgreiche Autokäufe: {location}'
      breadcrumbLabelFor: Autos {location}
      stepsFor:
        - n: '01'
          text: 'Sie senden eine Anfrage mit Ihren Anforderungen: Budget, Marke und Kilometerstand'
        - n: '02'
          text: Wir suchen passende Angebote {location}
        - n: '03'
          text: Ein unabhängiger Experte besichtigt und prüft das Auto
        - n: '04'
          text: Wir begleiten den Kauf und helfen bei Unterlagen und Formalitäten
        - n: '05'
          text: Wir liefern das Auto in Ihre Stadt und helfen bei der Zulassung
      deliveryLineFor: Wir liefern das Auto in jede Stadt des Landes. Wenn es ins Ausland soll, übernehmen wir den Export und die Zollabfertigung und liefern nach {destinations} sowie in jedes andere Land.
      deliveryDestinations:
        - Bosnien und Herzegowina
        - Kroatien
        - Nordmazedonien
        - Türkei
        - Kasachstan
        - Kirgisistan
      citiesHeadingFor: Wo wir Autos besichtigen {countryLocation}
      citiesLead: 'Unser Experte fährt im ganzen Land zu Besichtigungen. Am häufigsten suchen wir dort, wo die meisten Autos angeboten werden. Das bedeutet für die einzelnen Städte:'
      alsoInLabel: 'Wir suchen auch in:'
      crossSellLabel: Sie suchen ein Auto aus dem Ausland?
      countryNotesHeadingFor: Worauf wir achten {location}
      countryNotesPointsLabel: Das prüfen wir zuerst
      countryNotes:
        de:
          lead: 'Die Auswahl ist hier größer als in jedem anderen europäischen Markt, und die Wartungshistorie lässt sich meist gut nachvollziehen: Die meisten Autos haben ein Serviceheft mit Händlerstempeln für jede Wartung. Der Nachteil sind die vielen Autobahnkilometer. 200.000 Kilometer in drei Jahren sind hier normal und kein Grund für einen Preisnachlass.'
          points:
            - 'Serviceheft und Händlerstempel: Wir gleichen die Einträge anhand der VIN beim Vertragshändler ab'
            - HU-Prüfbericht, meist TÜV genannt. Wir lesen die Hinweise aus der letzten Prüfung, nicht nur den Stempel
            - 'Leasing- und Firmenwagen: regelmäßig gewartet, aber oft mit hoher Laufleistung'
            - 'Streusalz im Winter: Wir prüfen Unterboden und Schweller besonders gründlich'
        rs:
          lead: Wir sind vor Ort und können das Auto noch am Tag Ihrer Anfrage besichtigen, ohne Import. Der Markt ist klein, sodass ein Auto oft durch mehrere Hände geht. Seine Historie muss dann erst entwirrt werden.
          points:
            - Das Auto ist bereits verzollt und lokal zugelassen. Einfuhrabgaben und Importformalitäten entfallen
            - Bei Weiterverkäufen im Land wird der Kilometerstand oft manipuliert. Wir gleichen ihn mit den Einträgen der technischen Prüfungen ab
            - Viele Autos stammen aus Deutschland und Italien. Wir prüfen, was vor dem Import mit dem Auto passiert ist
            - Besichtigung noch am Tag Ihrer Anfrage, ohne Wartezeit für den Transport
        es:
          lead: Milde Winter und kaum Streusalz sorgen dafür, dass der Unterboden spanischer Autos meist deutlich besser erhalten ist als bei deutschen. Dafür setzen Sonne und Meeresnähe Lack, Kunststoff und Gummiteilen zu.
          points:
            - An der Küste suchen wir Korrosion vor allem in Hohlräumen
            - Verblasster Klarlack und rissige Kunststoffteile im Innenraum berücksichtigen wir beim Preis
            - 'Viele ehemalige Mietwagen: gleichmäßige Laufleistung, aber starke Beanspruchung'
            - 'ITV-Prüfbericht: Wir gleichen Hinweise und Prüfdaten ab'
        ch:
          lead: 'Schweizer Autos sind deutlich besser gepflegt als der europäische Durchschnitt: Die hohen Wartungskosten sorgen für Sorgfalt, und die Laufleistungen sind niedrig. Da die Schweiz nicht zur EU gehört, läuft der Import anders ab. Das berücksichtigen wir von Anfang an im Budget.'
          points:
            - Hochwertige Ausstattungen sind hier häufiger als in den Nachbarländern
            - 'MFK: Die Prüfung ist streng, Autos werden sorgfältig darauf vorbereitet, und das sieht man ihnen an'
            - 'Kein EU-Land: Zollabfertigung und Dokumente unterscheiden sich von denen für EU-Länder'
            - Höhere Preise als auf dem Markt, dafür sparen Sie später bei Reparaturen
        pt:
          lead: Der Markt ist klein und die Auswahl geringer als in Spanien, dafür ist die Konkurrenz um gute Autos niedriger. Das feuchte, salzige Klima begünstigt Rost an der Küste, selbst bei jüngeren Autos.
          points:
            - 'Feuchtigkeit und Meeresnähe: Hohlräume und Elektrik haben bei der Inspektion Priorität'
            - 'Kleiner Markt: Die Suche nach einem passenden Auto dauert länger als in Deutschland'
            - 'IPO-Prüfbericht: Wir lesen die Hinweise aus früheren Prüfungen'
            - Viele Diesel und Kleinwagen, größere Karosserien sind selten
        fr:
          lead: Frankreich steht vor allem für Diesel und einheimische Marken. Peugeot, Renault und Citroën sind hier günstiger als anderswo in Europa. Deutsche Premiummarken sind dagegen teurer und daher kaum interessant.
          points:
            - Französische Marken zu den besten Preisen in Europa, dazu günstigere Wartung
            - Bei Dieseln prüfen wir Partikelfilter und AGR-Ventil besonders genau
            - 'Contrôle technique: Die Prüfberichte sind detailliert, wir vergleichen die Hinweise über die Jahre hinweg'
            - 'Stadtbetrieb: Kupplung und Fahrwerk verschleißen schneller als angegeben'
        it:
          lead: 'Der italienische Markt ist interessant für Kleinwagen und seltene Ausstattungen, erfordert aber Vorsicht: Die Autos werden intensiv genutzt und kleinere Karosserieschäden nicht immer fachgerecht repariert.'
          points:
            - 'Stadtverkehr, häufige kleinere Schäden und Nachlackierungen: Lackschichtmessung ist Pflicht'
            - Im Süden und an der Küste drohen Salz und Rost, der Norden ähnelt eher den Bedingungen in Deutschland
            - 'Revisione: Wir prüfen die regelmäßigen Prüfungen, Auslassungen kommen häufiger vor'
            - Viele Autos mit Gasanlage, die wir gesondert prüfen
        pl:
          lead: 'Der nächste große Markt: Die Logistik ist günstig und schnell. Polen war jedoch jahrelang der wichtigste Umschlagplatz für Unfallwagen aus Westeuropa. Deshalb prüfen wir die Fahrzeughistorie hier besonders gründlich.'
          points:
            - 'Hoher Anteil an Unfallwagen: Die Karosseriegeometrie hat bei der Prüfung Priorität'
            - 'Häufige Weiterverkäufe: Ein Auto kann innerhalb eines Jahres mehrere Besitzer haben'
            - Der Kilometerstand wird beim Import oft manipuliert, wir gleichen ihn mit Werkstattdatenbanken ab
            - Kurze Transportstrecke, günstiger und schneller als aus Spanien oder Portugal
      closing:
        eyebrow: Womit fangen wir an?
        line1: Beschreiben Sie das Auto,
        line2: das Sie suchen,
        accentWord: den Rest übernehmen wir
        text: Budget, Karosserie, Getriebe und ein paar Wünsche. Wir suchen, Sie prüfen die Berichte zu den Angeboten und entscheiden, welches Auto Sie vor Ort besichtigen möchten.
    vehicle-buyback:
      hub:
        metaTitle: 'Autoankauf in Europa: russische Kennzeichen'
        metaDescription: Wir kaufen Autos mit russischen Kennzeichen in ganz Europa und mit serbischen Kennzeichen in Serbien. Bewertung anhand von Fotos in einer Stunde, Zahlung am Tag der Vertragsunterzeichnung.
        title: Autoankauf
        titleHighlight: ohne wochenlanges Feilschen
        description: 'Wir kaufen Autos, die sich nur schwer auf herkömmlichem Weg verkaufen lassen: russische Kennzeichen, abgelaufene Einfuhrfrist oder unklare Dokumente. Der Preis liegt unter dem Marktwert. Dafür geht es schnell und wir übernehmen den gesamten Verkaufsaufwand.'
        breadcrumbLabel: Autoankauf
        casesHeading: Echte Autoankäufe
        chooseCountryLabel: 'Land auswählen:'
        ctaLabel: Bewertung anfordern
        heroPhotoAlt: Autoschlüssel auf Geld und Dokumenten
        processHeading: So läuft der Autoankauf ab
        processLead: Vom ersten Kontakt bis zur Zahlung vergehen meist zwei bis drei Tage. Die meiste Zeit davon ist die Anfahrt zum Treffpunkt. Eine Bewertung anhand von Fotos erhalten Sie innerhalb einer Stunde.
        processSteps:
          - n: '01'
            text: Sie senden Fotos, Fahrzeugpapiere und eine ehrliche Beschreibung des Zustands
          - n: '02'
            text: Innerhalb einer Stunde nennen wir Ihnen den endgültigen Preis, ohne Preisspanne
          - n: '03'
            text: Wir vereinbaren den Treffpunkt am Standort des Autos. Ist es nicht fahrbereit, kommen wir mit einem Anhänger
          - n: '04'
            text: Wir prüfen das Auto vor Ort und bestätigen den Preis, sofern die Beschreibung zutrifft
          - n: '05'
            text: Wir unterschreiben den Vertrag und überweisen das Geld noch am selben Tag
        includedHeading: Was wir für Sie übernehmen
        includedLead: Für den Unterschied zwischen unserem Angebot und dem Marktwert übernehmen wir alles, was den Verkauf solcher Autos oft monatelang erschwert.
        included:
          - title: Autos mit russischen Kennzeichen
            text: 'Unsere wichtigste Kategorie. Das Auto kann sich überall in Europa befinden: Wir kommen zu seinem Standort und kümmern uns selbst um Abtransport und Weiterverkauf.'
          - title: Probleme mit Einfuhr und Fristen
            text: Nach der Vertragsunterzeichnung übernehmen wir die abgelaufene vorübergehende Einfuhr und die damit verbundenen Risiken.
          - title: Bewertung ohne Besichtigung
            text: Wir nennen den Preis anhand von Fotos und Fahrzeugpapieren. Wir kommen erst, wenn beide Seiten sich auf den Betrag geeinigt haben.
          - title: Abwicklung des Verkaufs
            text: Wir erstellen den Vertrag, melden das Auto ab und bereiten alle Unterlagen vor. Sie benötigen nur die Fahrzeugpapiere und Ihre Unterschrift.
          - title: Zahlung am Tag der Vertragsunterzeichnung
            text: Wir überweisen das Geld noch am selben Tag. Ratenzahlung oder Versprechen wie "Wir zahlen nach dem Weiterverkauf" gibt es bei uns nicht.
          - title: Eine ehrliche Absage
            text: Wenn das Auto für uns nicht infrage kommt, sagen wir es sofort und erklären warum. Wir halten Sie nicht hin und drücken den Preis nicht nachträglich.
      title: Autoankauf
      ctaLabel: Bewertung anfordern
      casesHeading: Echte Autoankäufe
      breadcrumbLabel: Autoankauf
      descriptionSerbia: Wir kaufen Autos mit russischen Kennzeichen unter Marktwert an, unabhängig davon, in welchem europäischen Land sie stehen. Außerdem kaufen wir Autos mit serbischen Kennzeichen in Serbien und Montenegro. Onlinebewertung, Abwicklung an einem Tag, Zahlung am Verkaufstag.
