            text: Der Satz hängt vom Ursprungsland des Fahrzeugs und dessen Alter ab. Bei europäischen Fahrzeugen ändert das EUR1-Zertifikat die Berechnung wesentlich — wir prüfen seine Verfügbarkeit vor dem Kauf.
          - title: Export und Transit
            text: Abmeldung im Verkaufsland, Exporterklärung, Transitnummern und Versicherung für die Überführung.
          - title: Zollabwicklung
            text: Erklärung, Broker und Zahlung am Ankunftsort. Wir bereiten das Paket im Voraus vor, damit das Auto nicht zusätzliche Tage im Lager steht.
          - title: Anmeldung
            text: Technische Inspektion, Registrierung und Nummernschilder. Sie holen das Fahrzeug ab, mit dem Sie sofort fahren können.
