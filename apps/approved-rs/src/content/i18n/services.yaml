    vehicle-inspection:
      title: Car inspection
      description: Independent pre-purchase car inspection. On-site expert inspection, diagnostics and a report, with no obligation to buy.
      ctaLabel: Book an inspection
      casesHeading: 'Real deals: pre-purchase inspections'
      breadcrumbLabel: Car inspection
      steps:
        - n: '01'
          text: Bodywork and paint, signs of repairs or accident damage
        - n: '02'
          text: Running gear, suspension and brakes
        - n: '03'
          text: Engine, gearbox and drivetrain
        - n: '04'
          text: Electronics and service history by VIN
        - n: '05'
          text: 'Legal checks: liens, registration restrictions and accident history'
      extraLine: We also work in other European countries, including Portugal. Ask us when you enquire.
      hub:
        metaTitle: Pre-purchase car inspections in Europe
        metaDescription: "We inspect cars you've found yourself: paint depth gauge, scanner, VIN history check and a photo report the same day. Available in eight European countries."
        title: Car inspection
        titleHighlight: before you buy
        description: 'We inspect the car you''ve found and tell you what it''s really like. You''ll get the report before paying: if we say "walk away", all you lose is the inspection fee.'
        breadcrumbLabel: Car inspection
        casesHeading: 'Real deals: pre-purchase inspections'
        chooseCountryLabel: 'Choose a country:'
        ctaLabel: Book an inspection
        heroPhotoAlt: Car on a lift at a garage
        processHeading: How the inspection works
        processLead: We usually visit within one or two days of your enquiry. The inspection takes about 90 minutes to two hours, and we send the report the same day, before another buyer takes the car.
        processSteps:
          - n: '01'
            text: Send us the listing link and the seller's contact details
          - n: '02'
            text: We arrange an inspection time and location with the seller
          - n: '03'
            text: We bring a paint depth gauge and scanner. For BMWs, we use the dealer-grade ISTA system, and put the car on a lift if needed
          - n: '04'
            text: We photograph and film every issue and check the car's history by VIN
          - n: '05'
            text: 'We send you the report and a straight answer: buy it, negotiate or walk away'
        includedHeading: What's included in the inspection
        includedLead: 'Our checklist covers over 100 points, but four areas usually matter most: bodywork, engine and gearbox, running gear, and paperwork. These are the areas that most often make us advise against a purchase.'
        included:
          - title: Bodywork and paint
            text: We measure paint depth on every panel and check panel gaps, welds and filler. This can reveal repairs the seller hasn't mentioned.
          - title: Engine and gearbox
            text: We check readings with the engine warm, gearbox adaptations and fault codes stored in the control modules. This is the most expensive area and the most common reason to walk away.
          - title: Running gear and brakes
            text: We check for play and assess the suspension and braking system. Motorway mileage and Balkan roads wear a car differently, and we can see the difference.
          - title: Electronics and VIN history
            text: CarVertical report, dealer service history by make, mileage discrepancies, control unit fault codes, and signs of deployed airbags.
          - title: Legal status
            text: 'Outstanding liens, registration bans, unresolved accidents, and insurance claims: issues that may surface only after purchase.'
          - title: Photo and video report
            text: We photograph and document every finding. You keep the report, and can use it to negotiate even if you decide to buy the car.
        compareHeading: What varies from country to country
        compareLead: Inspection rules, common problems with local cars, and ways of hiding a vehicle's history all vary by country.
        compareHint: Choose a country to see what we add to the standard checklist.
        compareLinkFor: More about inspections in {location}
        mapHeading: Four areas that can make or break a deal
        mapLead: The checklist is long, but we usually advise against a car because of one of four areas. Click a number on the diagram to see what our expert checks and what we've found.
      countryNotesHeadingFor: How we inspect cars in {location}
      countryNotesPointsLabel: What we check beyond the standard checklist
      countryNotes:
        de:
          lead: 'Germany offers plenty to work with: service books, HU inspection reports, and comprehensive VIN databases. So inspections here focus first on matching the documents with what the car shows.'
          points:
            - Compare dealer service stamps with odometer readings over the years
            - Check what was flagged at the previous HU, what was repaired, and what was simply left as is
            - Inspect the underbody and sills for winter road salt damage, including hidden cavities
            - 'Check for a leasing history: regular servicing despite high mileage'
        rs:
          lead: In Serbia, we can visit on the day you contact us. The main task is to reconstruct the car's history before it was imported, since local documents only show its most recent history.
          points:
            - Country of origin and the car's condition before it was imported to Serbia
            - Compare odometer readings with technical inspection records from previous years
            - Body repairs carried out after import, which are more common and cheaper than in the EU
            - 'Legal status: liens and registration restrictions'
        es:
          lead: Cars in Spain usually have clean underbodies, but suffer from sun and salt damage elsewhere. We focus less on underbody corrosion and more on hidden cavities, electrical systems, and the interior.
          points:
            - Corrosion in hidden cavities near the coast, even if the underbody is clean
            - Paint, seals, and plastic trim damaged by years of sun exposure
            - 'Rental history: compare mileage with the condition of the interior'
            - ITV inspection reports and any outstanding issues between inspections
        ch:
          lead: Cars are prepared thoroughly for the MFK, so a recent inspection report alone doesn't tell us much. We check what was done specifically to pass inspection and what has been neglected since last year.
          points:
            - What was replaced just before the MFK, and how new parts compare with the rest of the car
            - Servicing is expensive, so we check whether scheduled maintenance was put off
            - Cars often have lots of extras, but we check that every feature still works
            - 'Import paperwork: Switzerland is outside the EU, so the required documents differ'
        pt:
          lead: The damp maritime climate is the key factor here. We start by checking for corrosion and electrical problems, since damp conditions often cause failures.
          points:
            - Hidden cavities, chassis rails, and suspension mounting points
            - Corrosion on connectors and control units, a common cause of intermittent faults
            - IPO inspection reports and whether inspections were carried out regularly
            - 'Diesel cars used in the city: the DPF and its history'
        fr:
          lead: "France has detailed contrôle technique inspections, which are a good starting point. Then we look at what they don't catch: the condition of diesel components and wear from city driving."
          points:
            - Contrôle technique advisories over the years, and issues repeated at successive inspections
            - DPF, EGR, and turbocharger on diesel cars
            - Clutch and suspension wear from heavy city driving
            - 'History of French makes: parts are readily available, but each has its own weak spots'
        it:
          lead: Italian cars are more likely than others to have minor body repairs done quickly and cheaply. We spend considerably more time than usual checking panel paint thickness.
          points:
            - Measure paint thickness on every panel to find touch-ups after scrapes in the city
            - 'Differences between north and south: coastal salt exposure versus ordinary wear inland'
            - If fitted, check the LPG system installation and tank condition
            - Regularity of revisione inspections and any gaps
        pl:
          lead: Poland is the largest transit market for damaged cars from Western Europe. So our first priority is finding out what repairs were done to the body before sale.
          points:
            - Check door opening geometry and signs of welding, which may indicate repairs after a serious accident
            - 'Import history: where the car came from and what condition it was in'
            - Compare mileage with European service databases; don't take the odometer at face value
            - Airbags and whether they have deployed in the past
      closing:
        eyebrow: Found a car?
        line1: Send us the link
        line2: to the listing,
        accentWord: and we'll inspect it
        text: We can visit within one or two days. You keep the photo report, even if you decide not to buy the car.
    cityVehicleSourcing:
      title: Car sourcing
      descriptionFor: We'll find a car in {cityLocation} and thoroughly inspect it. We work throughout {countryName}.
      casesHeadingFor: Real deals in the {countryGenitiveOrName} market
      whyCityHeadingFor: Why {cityName}
      reason1: We check both dealer stock and private listings
      reason2: We check the VIN history before visiting the car
      reason3For: Our expert in {cityLocation}
      reason4Dekra: DEKRA / TÜV inspection on request
      reason4Generic: Independent mechanical inspection on request
      otherCitiesLabelFor: 'Other cities in {countryLocation}:'
      cityNotesHeadingFor: The car market in {cityLocation}
      cityNotesPointsLabel: What this means in practice
      cityNotes:
        berlin:
          lead: Berlin has the widest selection in Germany and the most varied mix of sellers. You'll find everything here, from company cars with complete service histories to resold cars brought in from Eastern Europe.
          points:
            - Huge selection in every segment, including rare trim levels
            - Plenty of private sellers, with more room to negotiate than at dealerships
            - City driving means more noticeable clutch and suspension wear than in motorway-driven cars
        munich:
          lead: An expensive city with expensive cars. Munich has more premium cars than anywhere else in Germany, and they tend to be in better condition because owners look after them.
          points:
            - Strong premium selection, especially BMW and Mercedes
            - Well-maintained cars with complete dealership service histories
            - Prices are above the national average, but you save on condition
        hamburg:
          lead: A port city and major logistics hub. It's easy to ship a car from here, and the market has more recently imported cars than usual.
          points:
            - The port is nearby, making shipping easier and cheaper
            - Many cars from northern Germany with motorway mileage
            - The damp maritime climate means we check the bodywork and hidden cavities more carefully
        dusseldorf:
          lead: The center of North Rhine-Westphalia, Germany's most populous state. Dealerships are close together, and the Dutch and Belgian borders are just an hour away, so cars from across the border regularly come up for sale here.
          points:
            - We can inspect several cars in one trip because dealerships are close together
            - Some listings have Dutch or Belgian plates, so we check their history and paperwork separately
            - There are plenty of sellers competing, so they're more open to negotiation
        belgrade:
          lead: Our home base. In Belgrade, we can inspect a car the same day you contact us. We know the local sellers and can spot a car that's been moving between lots for months.
          points:
            - Same-day inspection, with no waiting or travel logistics
            - We know the local lots and the history of the cars listed there
            - The car is already customs-cleared, so no import or customs duties are needed
        novi-sad:
          lead: Serbia's second-largest city, an hour's drive from Belgrade. The market is smaller, but prices are usually more reasonable than in the capital, and cars are less likely to have changed hands several times.
          points:
            - Lower prices than in Belgrade for similar condition
            - Fewer resellers, more cars offered by their first owner
            - We travel from Belgrade, with no extra travel charge
        pancevo:
          lead: Pancevo is effectively part of the Belgrade metro area, so inspections here are just as straightforward as in the capital. The market is small, but private listings can be more interesting.
          points:
            - Just 20 minutes from Belgrade, so we can get there just as quickly
            - A small market, mostly private sellers
            - Often cheaper than the capital for similar condition
        subotica:
          lead: 'Subotica sits on the Hungarian border, and the market reflects that: there are plenty of recently imported EU cars and sellers who specialize in them.'
          points:
            - Border market with plenty of recent imports from the EU
            - We check the car's history before import especially carefully
            - A convenient stop if you plan to drive the car farther north
        madrid:
          lead: Spain's capital has the country's widest selection and plenty of company cars. Its inland climate means less coastal corrosion than you'll find by the sea.
          points:
            - Spain's widest selection, including company cars
            - Away from the sea, bodywork is usually in better condition than on the coast
            - 'Hot summers: we check the plastics, paint and air conditioning separately'
        barcelona:
          lead: The proximity to the sea makes all the difference. Cars can look great underneath, but hidden cavities and electrical systems need extra attention.
          points:
            - 'The sea is close, so we check hidden cavities: the underside may be clean, but the inside may not be'
            - Plenty of former rental and car-sharing cars
            - The port is nearby, making sea freight easier to arrange
        zurich:
          lead: Zurich is the region's most expensive car market. Cars tend to have top-spec trim, dealer servicing and are sold before they've had time to wear out.
          points:
            - Top-spec trim and low mileage
            - Dealer-serviced, with a nearly always complete history
            - Switzerland is outside the EU, so import paperwork is handled separately
        geneva:
          lead: Geneva is in French-speaking Switzerland, right by the French border. French makes are much more common here than in the German-speaking part of the country.
          points:
            - 'A mixed market: Swiss condition, French selection'
            - France is just across the border, giving us prices to compare
            - 'The process is the same as elsewhere in Switzerland: export and import'
        paris:
          lead: "France's widest selection comes with some of the toughest driving conditions: heavy traffic and tight parking leave their mark on the bodywork and suspension."
          points:
            - France's widest selection, especially of French makes
            - City driving means clutch and suspension wear, plus minor body damage
            - Plenty of diesels, so we check the DPF and EGR first
        lyon:
          lead: Lyon is more relaxed than Paris, both in prices and car condition. The motorway south is nearby, so cars are more likely to have steady motorway mileage.
          points:
            - Lower prices than Paris for a similar selection
            - More motorway mileage, less city wear
            - Conveniently close to Italy and Spain if we widen the search
        milan:
          lead: "Italy's business capital, and the prices show it. Northern Italy is closer to German conditions: better roads and cars that are better maintained than in the south."
          points:
            - Italy's best selection of premium cars
            - In the north, there's less road salt and corrosion than in the south
            - 'Dense city driving: we check every panel with a paint thickness gauge'
        rome:
          lead: A large market with intense stop-and-go city driving. Minor scrapes are part of everyday life here, and repairs are often done in a hurry.
          points:
            - Lots of small cars and cars with LPG systems
            - Frequent touch-up paint after minor city collisions, so we inspect every panel
            - The climate is milder south of Milan, but the area is closer to the sea
        warsaw:
          lead: Most imports from Western Europe enter the country through Warsaw, which also has the widest selection in Poland. The share of repaired cars is highest here too.
          points:
            - The widest selection in Poland, with plenty of recent imports from the EU
            - We check the body alignment and signs of repairs first
            - A shorter delivery route, cheaper than from Southern Europe
        krakow:
          lead: 'Krakow is quieter than Warsaw: the market is smaller, there are fewer resellers, and cars are more likely to have had the same owner for longer. Southern Poland is also closer to the Balkans for transport.'
          points:
            - Fewer resellers than in Warsaw, and vehicle histories are usually cleaner
            - Prices are often lower than in the capital
            - Closer to the southbound route, making delivery to Serbia convenient
