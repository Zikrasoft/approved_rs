  de:
    vehicle-sourcing:
      hub:
        metaTitle: Fahrzeugbeschaffung in Europa, schlüsselfertig
        metaDescription: 'Wir finden Autos in Deutschland, Serbien, Spanien, der Schweiz, Italien, Frankreich, Polen und Portugal: Suche, Besichtigung, Preisverhandlung und Lieferung schlüsselfertig.'
        title: Fahrzeugauswahl
        titleHighlight: schlüsselfertig
        description: Wir wählen ein Fahrzeug aus dem Land, in dem Sie sich befinden oder das Sie kaufen möchten — vollständige Prüfung, Begleitung des Deals und Lieferung schlüsselfertig. Wählen Sie ein Land, um Details zu sehen.
        breadcrumbLabel: Fahrzeugauswahl
        casesHeading: Echte Deals bei der Fahrzeugauswahl
        chooseCountryLabel: 'Wählen Sie ein Land:'
        ctaLabel: Auto auswählen
        heroPhotoAlt: Reihe von Fahrzeugen auf dem Händlerplatz
        processHeading: So läuft die Auswahl ab
        processLead: 'Von der Anfrage bis zu den Schlüsseln dauert es normalerweise zwischen drei Tagen und zwei Wochen. Am längsten suchen wir nach einem Fahrzeug: Wir nehmen nicht das erste geeignete, sondern suchen weiter, bis wir das finden, zu dem es nach der Prüfung keine Fragen gibt.'
        processSteps:
          - n: '01'
            text: Diskutieren wir Budget, Marke und Anforderungen — was wichtig ist und wofür man bereit ist, Abstriche zu machen.
          - n: '02'
            text: Sehen wir uns vor Ort die Optionen an und filtern telefonisch alles aus, was nicht den Fragen standhält.
          - n: '03'
            text: Wir fahren zur Besichtigung mit Messgerät und Scanner, für BMW verbinden wir uns mit dem Händler-ISTA, machen Fotos und Videos.
          - n: '04'
            text: Wir senden den Bericht und sagen direkt, ob es sich lohnt, das Auto zu kaufen oder weiterzusuchen.
          - n: '05'
            text: Wir handeln, erledigen den Deal und übergeben das Fahrzeug an Sie oder bringen es zu Ihrer Tür.
        includedHeading: Was in die Arbeit einfließt
        includedLead: Die Provision wird vor Beginn festgelegt und hängt nicht davon ab, wie viele Fahrzeuge besichtigt werden mussten. Wenn wir nach der Prüfung sagen, 'nicht kaufen' — suchen wir weiter, dafür müssen Sie nichts extra bezahlen.
        included:
          - title: Suche ohne Begrenzung der Optionen
            text: Wir arbeiten, bis wir ein Auto finden, zu dem es keine Beanstandungen gibt. Die Ablehnung eines ungeeigneten Fahrzeugs gehört zur Arbeit und kostet nichts zusätzlich.
          - title: Expertenbesuch bei jeder Besichtigung
            text: Messgerät für die Karosserie, Scanner für die Steuergeräte, Hebebühne, wo nötig. Fotos und Videos von allen problematischen Bereichen — Sie sehen das Gleiche wie wir.
          - title: Überprüfung von Geschichte und rechtlicher Sauberkeit
            text: CarVertical Bericht nach VIN, Händler-Servicegeschichte zur Marke, Kilometerstandprüfung, Pfandrechte, Einschränkungen bei der Registrierung und offene Versicherungsereignisse.
          - title: Verhandlung und Vertragsabschluss
            text: Wir verhandeln den Preis unter Berücksichtigung der Funde, bereiten die Dokumente vor und begleiten die Unterzeichnung.
          - title: Lieferung und Zulassung
            text: Wir bringen das Auto in Ihre Stadt und helfen bei der Zulassung vor Ort — entweder übergeben wir die Schlüssel dort, wo es Ihnen passt, das Auto abzuholen.
          - title: Ein Ansprechpartner für den gesamten Prozess
            text: Sie arbeiten mit demselben Spezialisten, der zur Besichtigung gefahren ist. Es ist nicht nötig, jedem, der ans Telefon geht, die Aufgabe neu zu erklären.
        compareHeading: Wie sich die Märkte unterscheiden
        compareLead: Das gleiche Modell in Deutschland und Polen — hinsichtlich der Geschichte und des Preises zwei verschiedene Autos.
        compareHint: Wählen Sie ein Land und wir zeigen Ihnen, was wir dort zuerst ansehen.
        compareLinkFor: Auswahl {location} — im Detail
      title: Fahrzeugauswahl schlüsselfertig
      descriptionFor: Wir wählen ein Fahrzeug {location} — aus dem, was bereits in diesem Land ist, ohne Import aus dem Ausland. Vollständige Prüfung, Begleitung des Deals und Lieferung in Ihre Stadt.
      ctaLabel: Anfrage stellen
      casesHeadingFor: 'Echte Deals: Fahrzeugauswahl {location}'
      breadcrumbLabelFor: Auto {location}
      stepsFor:
        - n: '01'
          text: Sie stellen eine Anfrage mit den Anforderungen — Budget, Marke, Kilometerstand
        - n: '02'
          text: Wir suchen nach Optionen {location} anhand Ihrer Kriterien
        - n: '03'
          text: Ein unabhängiger Experte sieht sich das Fahrzeug an und prüft es
        - n: '04'
          text: Wir begleiten den Deal, helfen mit den Dokumenten und der Zulassung
        - n: '05'
          text: Wir liefern das Fahrzeug in Ihre Stadt und helfen bei der Zulassung
      deliveryLineFor: Wir liefern das Auto in jede Stadt des Landes. Sollte es ins Ausland gebracht werden müssen, übernehmen wir Export und Zollabfertigung — wir bringen es nach {destinations} und in jedes andere Land.
      deliveryDestinations:
        - Bosnien und Herzegowina
        - Kroatien
        - Nordmazedonien
        - Türkei
        - Kasachstan
        - Kirgisistan
      citiesHeadingFor: Wo wir Autos {countryLocation} ansehen
      citiesLead: Der Experte fährt im ganzen Land, aber häufig sehen wir Autos dort, wo sie am meisten angeboten werden. Das bedeutet folgendes für jede Stadt.
      alsoInLabel: 'Wir beschaffen auch in:'
      crossSellLabel: Brauchen Sie kein lokales Auto?
      countryNotesHeadingFor: Was wir in {location} berücksichtigen
      countryNotesPointsLabel: Worauf wir zuerst achten
      countryNotes:
        de:
          lead: 'Die Auswahl hier ist größer als auf jedem anderen europäischen Markt, und die Servicehistorie ist normalerweise nachvollziehbar: Die meisten Fahrzeuge haben ein Serviceheft mit vom Händler datierten Wartungen. Die Kehrseite sind die Autobahnkilometer. Zweihunderttausend Kilometer in drei Jahren sind hier normal, kein Grund für einen Rabatt.'
          points:
            - Serviceheft und Händlerstempel — wir prüfen nach VIN beim offiziellen Service
            - HU-Protokoll, das alle TÜV nennen — wir lesen die Anmerkungen der letzten Prüfung und nicht nur den Stempel
            - 'Fahrzeuge aus Leasing und Firmenflotten: gut gewartet, aber hohe Kilometerstände'
            - Winterstraßen mit Streusalz — Unterboden und Schweller sehen wir uns extra an
        rs:
          lead: Hier sind wir vor Ort, daher sehen wir das Auto am Tag der Anfrage und ohne Import. Der Markt ist klein, das gleiche Auto wechselt oft mehrere Verkäufer, und die Geschichte muss oft entschlüsselt werden.
          points:
            - Das Fahrzeug ist bereits verzollt und hat lokale Nummernschilder — keine Zölle und Einfuhrformalitäten nötig
            - Der Kilometerstand wird bei Weiterverkäufen innerhalb des Landes oft manipuliert — wir prüfen die Stempel der technischen Überprüfung
            - Viele importierte Fahrzeuge aus Deutschland und Italien — wir prüfen, was mit dem Fahrzeug vor dem Import war
            - Besichtigung am Tag der Anfrage, ohne Wartezeit für Logistik
        es:
          lead: Milde Winter und fast keine Streusalze auf den Straßen, daher ist der Unterboden spanischer Autos normalerweise sichtbar besser als bei deutschen. Allerdings leiden Lack, Kunststoff und alles Gummi durch Sonne und Nähe zum Meer.
          points:
            - An der Küste suchen wir Korrosion vor allem in den Hohlräumen
            - Verblasster Lack und rissiger Innenraum-Kunststoff — wir berücksichtigen dies im Preis
            - 'Viele frühere Mietwagen: gleichmäßiger Kilometerstand, aber harte Nutzung'
            - ITV-Protokoll — Anmerkungen und Durchfahrtsdaten abgleichen
        ch:
          lead: 'Schweizer Autos sind deutlich besser gepflegt als der europäische Durchschnitt: teure Wartung sorgt für Disziplin, die Laufleistungen sind gering. Aber die Schweiz ist nicht in der EU, daher gestaltet sich die Einfuhr anders, das berücksichtigen wir im Budget.'
          points:
            - Reiche Ausstattung — hier werden sie häufiger genommen als bei den Nachbarn
            - MFK — die Kontrolle ist streng, darauf wird sorgfältig vorbereitet, und das sieht man dem Auto an
            - 'Nicht in der EU: Zoll und Dokumente werden anders gehandhabt als in den EU-Ländern'
            - Preise über dem Markt, dafür sparen Sie später bei Reparaturen
        pt:
          lead: Markt klein, Auswahl bescheidener als in Spanien, aber die Konkurrenz um gute Autos ist geringer. Das Klima ist feucht und salzig – Küstenkorrosion tritt selbst bei neuen Autos auf.
          points:
            - Feuchtigkeit und Meer — versteckte Hohlräume und Elektrik haben Priorität bei der Inspektion
            - 'Kleiner Markt: für spezifische Anfragen suchen wir länger als in Deutschland'
            - IPO-Protokoll — Anmerkungen früherer Inspektionen lesen
            - Viele Dieselfahrzeuge und Kleinwagen, große Karosserien kommen selten vor
        fr:
          lead: Frankreich bedeutet vor allem Diesel und einheimische Marken. Peugeot, Renault und Citroën sind hier günstiger als überall sonst in Europa. Deutsche Premium-Marken sind hingegen teurer, daher macht es wenig Sinn, sie hier zu kaufen.
          points:
            - Französische Marken — beste Preise in Europa, und Wartung ist günstiger
            - Diesel — Partikelfilter und EGR-Ventil separat prüfen
            - Contrôle technique — die Protokolle sind ausführlich, wir prüfen die Anmerkungen nach Jahren
            - 'Stadtbetrieb: Reifen und Federung nutzen sich schneller ab als angegeben'
        it:
          lead: 'Der italienische Markt ist gut für Kleinwagen und seltene Ausstattung, erfordert aber Vorsicht: Hier werden Autos stark beansprucht und kleinere Karosseriereparaturen werden nicht immer sorgfältig durchgeführt.'
          points:
            - Stadt — häufige kleine Stöße und Ausbesserungen, Lackdickenmesser sind unerlässlich
            - Süden und Küsten bringen Salz und Korrosion, der Norden näher an den deutschen Verhältnissen
            - Revisione — wir prüfen die Regelmäßigkeit, Auslassungen sind häufiger als üblich
            - Viele Fahrzeuge mit Gasanlage — wir prüfen dies separat
        pl:
          lead: 'Nächster großer Markt zu uns: günstige und kurze Logistik. Aber Polen war jahrelang der Hauptumschlagplatz für beschädigte Fahrzeuge aus Westeuropa, daher prüfen wir die Geschichte hier strenger als überall sonst.'
          points:
            - Hoher Anteil an wiederhergestellten Fahrzeugen nach Unfall — Karosseriegeometrie hat Priorität
            - 'Häufige Weiterverkäufe: ein Auto wechselt innerhalb eines Jahres mehrere Besitzer'
            - Der Kilometerstand wird oft beim Import manipuliert — wir prüfen dies mit Servicedaten
            - Kurze Lieferstrecke — günstiger und schneller als aus Spanien oder Portugal
      closing:
        eyebrow: Wie beginnen wir?
        line1: Beschreiben Sie das Auto,
        line2: das Sie suchen, —
        accentWord: danach ist unsere Arbeit
        text: Budget, Karosserie, Getriebe, ein paar Wünsche oben drauf. Wir suchen, und Sie sehen sich die Berichte zu den Optionen an und entscheiden, welches Sie persönlich besichtigen möchten.
