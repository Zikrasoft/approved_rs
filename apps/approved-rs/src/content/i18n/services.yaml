    vehicle-inspection:
      title: Fahrzeugprüfung
      description: Unabhängige Fahrzeugprüfung vor dem Kauf. Experte vor Ort, Diagnose, Bericht ohne Kaufverpflichtung.
      ctaLabel: Überprüfung anfordern
      casesHeading: 'Reale Geschäfte: Überprüfung vor dem Kauf'
      breadcrumbLabel: Fahrzeugprüfung
      steps:
        - n: '01'
          text: Karosserie und Lack, Vorhandensein von Reparaturen oder Unfällen
        - n: '02'
          text: Fahrwerk, Federung, Bremsen
        - n: '03'
          text: Motor, Getriebe, Transmissionssystem
        - n: '04'
          text: Elektronik und Wartungshistorie nach VIN
        - n: '05'
          text: Rechtliche Unbedenklichkeit (Pfand, Registrierungssperre, Unfälle)
      extraLine: Wir arbeiten auch in anderen europäischen Ländern, einschließlich Portugal, bitte bei der Anfrage bestätigen.
      hub:
        metaTitle: Fahrzeugprüfung vor dem Kauf in Europa
        metaDescription: 'Wir fahren zu dem Auto, das Sie selbst gefunden haben: Lackmessgerät, Scanner, VIN-Historie und Bericht mit Fotos am selben Tag. Wir arbeiten in acht europäischen Ländern.'
        title: Fahrzeugprüfung
        titleHighlight: vor dem Kauf
        description: "Wir kommen zu dem Auto, das Sie selbst gefunden haben, und informieren Sie über den tatsächlichen Zustand. Der Bericht kommt, bevor Sie Geld übergeben: wenn die Antwort 'nicht kaufen' lautet, verlieren Sie nur die Kosten der Inspektion."
        breadcrumbLabel: Fahrzeugprüfung
        casesHeading: 'Reale Geschäfte: Überprüfung vor dem Kauf'
        chooseCountryLabel: 'Wählen Sie ein Land:'
        ctaLabel: Überprüfung anfordern
        heroPhotoAlt: Auto auf einer Hebebühne in der Werkstatt
        processHeading: So verläuft die Prüfung
        processLead: In der Regel fahren wir innerhalb eines bis zwei Tagen nach der Anfrage. Die Inspektion dauert anderthalb bis zwei Stunden, den Bericht senden wir noch am selben Tag, solange das Auto nicht an einen anderen Käufer verkauft wurde.
        processSteps:
          - n: '01'
            text: Sie senden den Link zur Anzeige und die Kontaktdaten des Verkäufers
          - n: '02'
            text: Wir vereinbaren mit dem Verkäufer einen Termin und Ort für die Besichtigung
          - n: '03'
            text: Wir kommen mit Lackmessgerät und Scanner, für BMW verbinden wir uns mit dem Händler-ISTA, bei Bedarf heben wir das Auto an.
          - n: '04'
            text: Wir machen Fotos und Videos aller Funde, überprüfen die Historie nach VIN
          - n: '05'
            text: Wir senden den Bericht und eine klare Antwort, ob kaufen, handeln oder ablehnen.
        includedHeading: Was zur Prüfung gehört
        includedLead: 'Über hundert Punkte auf der Checkliste, aber entscheidend sind fast immer vier Bereiche: Karosserie, Motor mit Getriebe, Fahrwerk und Dokumente. Genau nach diesen Bereichen raten wir häufig vom Kauf ab.'
        included:
          - title: Karosserie und Lackierung
            text: Lackmessung jeder Karosserieverkleidung, Geometrie der Öffnungen, Schweißnähte und Spachtelmasse. Sie sehen, ob es Reparaturen gab, die der Verkäufer nicht erwähnt hat.
          - title: Motor und Getriebe
            text: Parameter bei warmem Motor, Getriebeanpassungen, Fehler im Speicher der Steuergeräte. Der teuerste Bereich und häufigster Gründe für eine Ablehnung.
          - title: Fahrwerk und Bremsen
            text: Spiel, Zustand der Federung und des Bremssystems. Autobahnkilometer und Balkanstrecken belasten Fahrzeuge unterschiedlich, und das ist sichtbar.
          - title: Elektronik und Historie nach VIN
            text: CarVertical-Bericht, Händler-Servicehistorie nach Marke, Abweichungen der Kilometerstände und Fehlercodes sowie Spuren von ausgefallenen Airbags.
          - title: Rechtliche Sauberkeit
            text: 'Pfand, Registrierungssperre, offene Unfälle und Versicherungsereignisse: das, was nach dem Kauf aufkommt.'
          - title: Bericht mit Fotos und Videos
            text: Jede Entdeckung ist fotografiert und dokumentiert. Der Bericht bleibt bei Ihnen, damit Sie auch dann gut verhandeln können, falls Sie das Auto doch kaufen.
        compareHeading: Was sich von Land zu Land ändert
        compareLead: Regelungen zur technischen Inspektion, typische Schwächen lokaler Autos und Möglichkeiten, die Geschichte überall zu verschleiern.
        compareHint: Wählen Sie ein Land, und wir zeigen, was wir der normalen Checkliste hinzufügen.
        compareLinkFor: Überprüfung {location} im Detail
        mapHeading: Vier Bereiche, die den Deal entscheiden
        mapLead: Die Checkliste ist lang, aber wir raten fast immer in einem von vier Bereichen ab. Klicken Sie auf die Nummer im Diagramm, und wir zeigen, was der Experte überprüft und was wir dort gefunden haben.
      countryNotesHeadingFor: Wie wir {location} überprüfen
      countryNotesPointsLabel: Was wir über die Standard-Checkliste hinaus überprüfen
      countryNotes:
        de:
          lead: 'In Deutschland gibt es viel zu beachten: Serviceheft, HU-Protokolle und gut entwickelte VIN-Datenbanken. Daher ist die Prüfung hier in erster Linie ein Abgleich von Dokumenten mit dem, was das Auto zeigt.'
          points:
            - Wir vergleichen die Einträge des Händlerservices mit den Kilometerstandanzeigen über die Jahre
            - Anmerkungen aus der letzten HU, was nach der Überprüfung repariert wurde und was nur weitergeschoben wurde.
            - Unterboden und Schweller nach Winterchemikalien, einschließlich versteckter Hohlräume
            - 'Leasingvergangenheit: regelmäßige Wartung bei hohem Kilometerstand'
        rs:
          lead: 'In Serbien kommen wir am Tag der Anfrage. Das Hauptziel ist es, die Geschichte des Autos vor der Einfuhr zu rekonstruieren: lokale Dokumente zeigen nur den letzten Abschnitt der Lebensgeschichte des Fahrzeugs.'
          points:
            - Herkunftsland und Zustand des Fahrzeugs vor der Einfuhr nach Serbien
            - Kilometerstand gegenüber den Einträgen der technischen Inspektionen der vergangenen Jahre
            - Karosseriereparaturen nach der Einfuhr, die häufiger und günstiger durchgeführt werden als in der EU.
            - 'Rechtliche Aspekte: Pfand und Einschränkungen bei der Registrierung'
        es:
          lead: Spanische Autos haben in der Regel einen soliden Unterboden, leiden aber unter allem, was von Sonne und Salz betroffen ist. Wir verschieben die Überprüfung von der Korrosion unten auf versteckte Hohlräume, Elektrik und Zustand des Innenraums.
          points:
            - Korrosion in versteckten Hohlräumen an der Küste, selbst wenn von unten alles sauber aussieht.
            - Lack, Dichtungen und Kunststoff nach jahrelanger Sonneneinstrahlung
            - 'Vermietungshistorie: Wir vergleichen den Kilometerstand mit dem Verschleiß des Innenraums'
            - ITV-Protokoll und was zwischen den Inspektionen noch offen geblieben ist
        ch:
          lead: Beim MFK werden die Autos gründlich vorbereitet, daher sagt ein frisches Protokoll an sich wenig aus. Wir sehen, was direkt vor der Inspektion gemacht wurde und was seit letztem Jahr unverändert ist.
          points:
            - Was unmittelbar vor dem MFK ersetzt wurde, frische Teile im Vergleich zum Rest.
            - Die Wartung ist kostspielig, daher überprüfen wir, ob das Wartungsprogramm eingehalten wurde
            - Die Ausstattung ist umfangreich, aber wir prüfen, dass jede Option noch funktioniert.
            - 'Einfuhrdokumente: Die Schweiz ist nicht EU, die Anforderungen unterscheiden sich'
        pt:
          lead: 'Alles hängt hier vom feuchten Meeresklima ab. Die Prüfung beginnt mit Korrosion und Elektrik: Was oft versagt, lebt in der Feuchtigkeit.'
          points:
            - Versteckte Hohlräume, Längsträger und Aufhängepunkte
            - Korrosion an Steckern und Modulen, typische Ursache für flüchtige Fehler.
            - IPO-Protokoll und Regelmäßigkeit der Durchführungen
            - 'Diesel mit Stadtbetrieb: Dieselpartikelfilter und seine Historie'
        fr:
          lead: 'In Frankreich gibt es eine ausführliche contrôle technique, was einen guten Ausgangspunkt darstellt. Danach schauen wir auf Dinge, die die Vorschriften nicht erfassen: Ressourcen des Dieselmotors und Verschleiß durch Stadtverkehr.'
          points:
            - Anmerkungen zur contrôle technique über die Jahre, die sich von Inspektion zu Inspektion wiederholen.
            - Dieselpartikelfilter, EGR und Turbine
            - Kupplung und Federung nach intensivem Stadtbetrieb
            - 'Historie zu französischen Marken: Ersatzteile sind verfügbar, aber es gibt eigene Schwächen'
        it:
          lead: Italienische Autos kommen häufiger mit kleinen Karosseriereparaturen, die schnell und günstig gemacht werden. Bei der Dicke der Lackschicht auf den Paneelen benötigt man hier deutlich mehr Zeit als üblich.
          points:
            - Lackmessung an allen Paneelen, wir suchen nach Lacküberzügen nach städtischen Kratzern.
            - 'Unterschied zwischen Nord und Süd: Salz an der Küste, normaler Verschleiß im Landesinneren'
            - Gasanlage, falls vorhanden, Installation und Zustand des Tanks.
            - Regelmäßigkeit der revisione und versäumte Zeiträume
        pl:
          lead: Polen ist der größte Umschlagplatz für beschädigte Autos aus Westeuropa. Daher klären wir zuerst, was mit dieser Karosserie vor dem Verkauf gemacht wurde.
          points:
            - Geometrie der Öffnungen und Schweißspuren, Anzeichen von Wiederherstellung nach einem schweren Unfall.
            - 'Einfuhrgeschichte: Woher das Auto kam und in welchem Zustand'
            - Kilometerstand vergleichen wir mit europäischen Servicedaten, dem Kilometerzähler vertrauen wir nicht
            - Airbags und deren Auslösung in der Vergangenheit
      closing:
        eyebrow: Haben Sie ein Auto gefunden?
        line1: Bitte senden Sie uns den Link
        line2: auf die Anzeige,
        accentWord: wir kommen und schauen es uns an
        text: Wir fahren innerhalb von ein bis zwei Tagen. Der Bericht mit Fotos bleibt bei Ihnen, auch wenn Sie nach ihm vom Kauf absehen.
    cityVehicleSourcing:
      title: Autoauswahl
      descriptionFor: Wir finden ein Fahrzeug {cityLocation} mit vollständiger Überprüfung. Wir arbeiten in der gesamten Region {countryName}.
      casesHeadingFor: Reale Transaktionen auf dem Markt von {countryGenitiveOrName}
      whyCityHeadingFor: Warum {cityName}
      reason1: Wir schauen uns sowohl Händlerplätze als auch private Anzeigen an
      reason2: Die VIN-Geschichte überprüfen wir vor der Abfahrt zur Inspektion
      reason3For: Unser Experte {cityLocation}
      reason4Dekra: DEKRA / TÜV-Überprüfung auf Anfrage
      reason4Generic: Unabhängige technische Gutachtenerstellung auf Anfrage
      otherCitiesLabelFor: 'Andere Städte in {countryLocation}:'
      cityNotesHeadingFor: Automobilmarkt in {cityLocation}
      cityNotesPointsLabel: Was bedeutet das in der Praxis?
      cityNotes:
        berlin:
          lead: In Berlin gibt es die größte Auswahl in Deutschland und die vielfältigsten Verkäufer. Hier finden sich alles, von Firmenfahrzeugen mit vollständiger Historie bis zu Weiterverkaufsoptionen aus Osteuropa.
          points:
            - Riesige Auswahl in allen Segmenten, einschließlich seltener Ausstattungen
            - Viele private Verkäufer, die Preisverhandlungen sind realer als bei Händlern.
            - 'Städtischer Gebrauch: Reifen und Federung nutzen sich schneller ab als bei Autobahnfahrzeugen'
        munich:
          lead: 'Teure Stadt mit teuren Autos. Im Premiumsegment gibt es hier mehr Modelle als irgendwo sonst in Deutschland, und der Zustand ist im Durchschnitt besser: solche Fahrzeuge werden gut gepflegt.'
          points:
            - Starker Premium-Sektor, besonders BMW und Mercedes
            - Gut gepflegte Fahrzeuge mit vollständiger Händlerhistorie
            - Die Preise liegen über dem Landesdurchschnitt, die Einsparungen ergeben sich aus dem Fahrzeugzustand.
        hamburg:
          lead: Ein Hafenstadt und großes Logistikzentrum. Von hier aus ist der Versand von Autos einfach, und auf dem Markt findet man oft frische Importfahrzeuge.
          points:
            - Der Hafen ist in der Nähe, der Versand ist einfacher und günstiger zu organisieren.
            - Viele Autos aus den nordischen Ländern mit Autobahnkilometern
            - 'Feuchtes Seeklima: Karosserie und versteckte Hohlräume sorgfältiger prüfen'
        dusseldorf:
          lead: Zentrum von Nordrhein-Westfalen, dem am dichtesten besiedelten Bundesland Deutschlands. Die Verkaufsflächen sind dicht besetzt, und die Grenze zu den Niederlanden und Belgien ist eine Stunde entfernt, daher kommen regelmäßig Autos zum Verkauf.
          points:
            - Bei einem Ausflug schaffen wir es, mehrere Autos zu besichtigen, die Plätze sind nah beieinander.
            - 'Einige Angebote mit niederländischen und belgischen Nummernschildern: die Historie und Dokumente überprüfen wir gesondert'
            - Es gibt viele Verkäufer und sie konkurrieren miteinander, das Feilschen verläuft lebhafter.
        belgrade:
          lead: Unsere Basis. In Belgrad führen wir die Besichtigung am selben Tag durch, kennen die lokalen Verkäufer und sehen, welche Fahrzeuge seit zwei Monaten auf den Plätzen stehen.
          points:
            - Besichtigung am selben Tag, ohne Wartezeit und Logistik
            - Wir kennen die lokalen Märkte und die Historie der dort stehenden Fahrzeuge
            - Das Auto ist bereits verzollt, Einfuhr und Zollgebühren sind nicht erforderlich.
        novi-sad:
          lead: Die zweitgrößte Stadt Serbiens, eine Stunde von Belgrad entfernt. Der Markt ist kleiner, aber die Preise sind normalerweise ruhiger als in der Hauptstadt, und die Autos haben seltener mehrere Verkaufsrunden durchlaufen.
          points:
            - Preise sind niedriger als in Belgrad bei vergleichbarem Zustand
            - Weniger Händler, häufiger der Erstbesitzer
            - Wir fahren von Belgrad, keine separaten Kosten für die Anfahrt
        pancevo:
          lead: Pančevo gehört faktisch zur Metropolregion Belgrad, daher unterscheidet sich die Besichtigung hier nicht von der in der Hauptstadt. Der Markt ist klein, aber private Anzeigen sind interessanter.
          points:
            - Zwanzig Minuten von Belgrad, wir kommen ebenfalls schnell.
            - Kleiner Markt mit überwiegend privaten Verkäufern
            - Oft günstiger als in der Hauptstadt bei gleichem Zustand
        subotica:
          lead: 'Subotica liegt an der Grenze zu Ungarn, was sich auf den Markt auswirkt: viele Autos, die aus der EU eingeführt werden, und Verkäufer, die sich ständig damit beschäftigen.'
          points:
            - Grenzmärkte, viel frischer Import aus der Europäischen Union.
            - Die Historie vor dem Import überprüfen wir besonders gründlich
            - Ein bequemer Punkt, wenn Sie das Auto weiter nach Norden fahren möchten
        madrid:
          lead: 'Der Hauptstadtmarkt Spaniens: die größte Auswahl im Land und viele Autos aus Firmenflotten. Kontinentalklima, daher gibt es weniger Küstenschäden.'
          points:
            - Größte Auswahl in Spanien, einschließlich Firmenwagen
            - In größerer Entfernung vom Meer sind die Karosserien normalerweise sauberer als an der Küste.
            - 'Heiße Sommer: Kunststoff, Lack und Klimaanlage müssen gesondert geprüft werden'
        barcelona:
          lead: Alles hängt von der Nähe zum Meer ab. Autos sehen oft von unten gut aus, benötigen jedoch Aufmerksamkeit für versteckte Hohlräume und die Elektrik.
          points:
            - 'Das Meer in der Nähe, also prüfen wir versteckte Hohlräume: von unten oft sauber, aber innen nicht'
            - Viele ehemalige Miet- und Carsharing-Fahrzeuge
            - Hafen in der Nähe, der Versand auf dem Seeweg ist einfacher zu organisieren
        zurich:
          lead: Zürich ist der teuerste Automarkt in der Region. Hier werden maximale Ausstattungen gewählt, die bei Händlern gewartet werden, und zur Verkaufszeit ist das Auto oft noch nicht abgenutzt.
          points:
            - Maximalausstattungen und niedrige Kilometerzahl
            - Händlerwartung, die Historie ist fast immer umfassend.
            - Schweiz ist nicht in der EU, die Einfuhr erfolgt separat
        geneva:
          lead: Genf liegt im französischsprachigen Teil der Schweiz, direkt an der Grenze zu Frankreich. Französische Marken sind auf dem Markt deutlicher vertreten als in den deutschen Teilen des Landes.
          points:
            - 'Gemischter Markt: Schweizer Zustand, französisches Sortiment'
            - Die Grenze zu Frankreich ist in der Nähe, man kann die Preise vergleichen.
            - 'Die Regelung ist die gleiche wie in ganz Schweiz: Export plus Import'
        paris:
          lead: 'Die größte Auswahl in Frankreich kommt mit der härtesten Nutzung: dichter Verkehr und enge Parkplätze hinterlassen Spuren auf Karosserie und Fahrwerk.'
          points:
            - Die größte Auswahl in Frankreich, besonders bei französischen Marken
            - 'Städtischer Gebrauch: Reifen, Federung und kleine Karosserieschäden'
            - Viele Diesel,wir schauen zuerst auf den Partikelfilter und EGR.
        lyon:
          lead: Lyon ist ruhiger als Paris in Bezug auf Preise und Fahrzeugzustand. Die Autobahn nach Süden ist in der Nähe, also findet man häufiger Fahrzeuge mit stoischer Autobahnkilometrage.
          points:
            - Preise sind niedriger als in Paris bei vergleichbarem Angebot
            - Mehr Autobahnkilometer, weniger städtische Abnutzung
            - Angenehme Route nach Italien und Spanien, wenn man breiter sucht
        milan:
          lead: 'Die Geschäftshauptstadt Italiens, und das zeigt sich am Markt. Der Norden des Landes ist näher an den deutschen Bedingungen: die Straßen sind besser, die Fahrzeuge werden besser gepflegt als im Süden.'
          points:
            - Beste Auswahl im Premium-Sektor in Italien
            - Im Norden gibt es weniger Salz und Korrosion als im Süden des Landes.
            - 'Dichte Stadt: Lackstärkenmessgerät ist Pflicht'
        rome:
          lead: Ein großer Markt mit sehr dichter städtischer Nutzung. Kleine Kratzer gelten hier als normal, und werden oft hastig repariert.
          points:
            - Viele Kleinwagen und Fahrzeuge mit Gasanlage
            - Häufige Nachlackierungen nach städtischen Kontakten, wir überprüfen jedes Bauteil.
            - Südlich von Mailand ist das Klima milder, aber näher am Meer.
        warsaw:
          lead: Über Warschau erfolgt der Großteil der Importe aus Westeuropa, hier gibt es die größte Auswahl in Polen. Der Anteil an wiederaufbereiteten Fahrzeugen ist ebenfalls am höchsten.
          points:
            - Die größte Auswahl in Polen, viele frische Importe aus der EU
            - Die Geometrie der Karosserie und Reparaturspuren überprüfen wir zuerst
            - Kurze Lieferstrecke, günstiger als aus Südeuropa.
        krakow:
          lead: 'Krakau ist ruhiger als Warschau: der Markt ist kleiner, weniger Wiederverkäufer, und die Fahrzeuge haben oft einen längeren Vorbesitzer. Der Süden Polens ist logistisch näher zu den Balkanen.'
          points:
            - Weniger Zwischenhändler als in Warschau, die Historie ist meist sauberer
            - Preise sind oft niedriger als in der Hauptstadt
            - Nähe zur Route nach Süden, praktisch für die Lieferung nach Serbien.
