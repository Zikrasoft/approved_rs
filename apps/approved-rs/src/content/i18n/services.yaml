          - title: Autos mit russischen Nummern
            text: Hauptkategorie. Das Fahrzeug kann sich in jedem europäischen Land befinden – wir kommen dorthin, wo es steht, und kümmern uns selbst um den Export und den Weiterverkauf.
          - title: Probleme mit Einfuhr und Fristen
            text: Nach der Unterschrift gehen die abgelaufene vorübergehende Einfuhr und die damit verbundenen Risiken auf uns über.
