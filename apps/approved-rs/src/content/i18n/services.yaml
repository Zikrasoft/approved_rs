        - n: '02'
          text: Wir suchen Optionen in {location} nach Ihren Kriterien
        - n: '03'
          text: Ein unabhängiger Experte überprüft und inspiziert das Fahrzeug
        - n: '04'
          text: Wir begleiten den Vertrag, helfen bei den Dokumenten und der Zulassung
        - n: '05'
          text: Wir liefern das Fahrzeug in Ihre Stadt und helfen bei der Zulassung
      deliveryLineFor: Wir bringen das Auto in jede Stadt des Landes. Wenn es ins Ausland exportiert werden muss, übernehmen wir den Export und die Zollabwicklung — wir bringen es nach {destinations} und in jedes andere Land.
      deliveryDestinations:
        - Bosnien und Herzegowina
        - Kroatien
        - Nordmazedonien
        - Türkei
        - Kasachstan
        - Kirgisistan
      citiesHeadingFor: Wo wir Autos in {countryLocation} ansehen
      citiesLead: Der Experte fährt im ganzen Land, aber am häufigsten sehen wir Autos dort, wo sie am häufigsten angeboten werden. Das bedeutet Folgendes für jede Stadt.
      alsoInLabel: 'Wir beschaffen auch in:'
      crossSellLabel: Brauchen Sie kein lokales Fahrzeug?
      countryNotesHeadingFor: Was wir in {location} beachten
      countryNotesPointsLabel: Worauf wir zuerst achten
      countryNotes:
        de:
          lead: 'Hier ist die Auswahl größer als auf jedem anderen Markt in Europa, und die Servicehistorie ist normalerweise nachvollziehbar: Die meisten Autos haben ein Serviceheft mit den Eintragungen des Händlers über jede Wartung. Die Kehrseite — Autobahnkilometerstände. Zweihunderttausend in drei Jahren sind hier die Norm und kein Grund für einen Preisnachlass.'
          points:
            - Serviceheft und Händlervermerke — wir prüfen die VIN beim offiziellen Service
            - HU-Protokoll, das alle TÜV nennen — wir lesen die Bemerkungen der letzten Inspektion, nicht nur den Stempel
            - 'Autos aus Leasing und Fahrzeugpools: gut gewartet, aber hohe Kilometerstände'
            - Winterstraßen mit Streusalz — Unterboden und Schweller werden besonders inspiziert
        rs:
          lead: Hier sind wir vor Ort, daher besichtigen wir das Auto am Tag der Anfrage und ohne Import. Der Markt ist klein, das gleiche Auto wechselt oft den Besitzer, und die Historie muss entwirrt werden.
          points:
            - Das Auto ist bereits verzollt und hat lokale Kennzeichen — Zollgebühren und Importbearbeitung sind nicht erforderlich
            - Der Kilometerstand wird oft beim Weiterverkauf innerhalb des Landes verändert — wir vergleichen mit den Eintragungen des technischen Überprüfung
            - Viele Autos wurden aus Deutschland und Italien importiert — wir prüfen, was mit dem Auto vor dem Import war
            - Besichtigung am Tag der Anfrage, ohne warten auf Logistik
        es:
          lead: Milde Winter und fast keine Streumittel auf den Straßen, daher ist der Unterboden spanischer Autos normalerweise deutlich besser als der deutscher. Allerdings haben Sonne und Meeresnähe Einfluss auf Lack, Kunststoff und alles Gummiartige.
          points:
            - An der Küste suchen wir nach Korrosion insbesondere in versteckten Hohlräumen
            - Ausgeblichener Lack und rissiger Innenraumkunststoff — wir kalkulieren dies in die Kosten ein
            - 'Viele ehemalige Mietwagen: gleichmäßiger Kilometerstand, aber intensive Nutzung'
            - ITV-Protokoll — wir prüfen die Anmerkungen und Termine
        ch:
          lead: 'Schweizer Autos sind im Vergleich zum europäischen Durchschnitt deutlich besser gepflegt: teure Wartung diszipliniert, die Laufleistungen sind gering. Aber die Schweiz gehört nicht zur EU, daher erfolgt die Einfuhr anders, was wir im Budget berücksichtigen.'
          points:
            - Reiche Ausstattung — hier werden sie öfter gewählt als bei den Nachbarn
            - MFK — die Kontrolle ist streng, darauf wird ernsthaft vorbereitet, und das sieht man dem Auto an
            - 'Nicht EU: Zoll und Dokumente werden anders bearbeitet als in den EU-Staaten'
            - Die Preise liegen über dem Marktwert, dafür spart man später bei Reparaturen
        pt:
          lead: Der Markt ist klein, die Auswahl bescheidener als in Spanien, aber die Konkurrenz um ein gutes Auto ist geringer. Das Klima ist feucht und salzig — Küstenschäden sind selbst bei neuen Autos anzutreffen.
          points:
            - Feuchtigkeit und Meer — versteckte Hohlräume und Elektrik stehen im Fokus der Inspektion
            - 'Kleiner Markt: Für spezifische Anfragen dauert die Suche länger als in Deutschland'
            - IPO-Protokoll — wir lesen die Anmerkungen früherer Inspektionen
            - Viele Diesel und Kleinwagen, große Karosserien sind selten
        fr:
          lead: Frankreich ist vor allem Diesel und einheimische Marken. Peugeot, Renault und Citroën sind hier günstiger als irgendwo sonst in Europa. Deutsche Premium-Marken hingegen sind teurer und hier wenig sinnvoll zu erwerben.
          points:
            - Französische Marken — beste Preise in Europa, und die Wartung ist günstiger
            - Diesel — wir prüfen den Partikelfilter und das EGR-Ventil als eigene Position
            - Contrôle technique — die Protokolle sind detailliert, wir vergleichen die Anmerkungen über die Jahre
            - 'Städtische Nutzung: Haftung und Aufhängung nutzen sich schneller ab als angegeben'
        it:
          lead: 'Der italienische Markt glänzt mit Kleinwagen und seltenen Ausstattungen, erfordert aber Vorsicht: Autos werden hier stark genutzt, und kleinere Karosseriearbeiten werden nicht immer sorgfältig durchgeführt.'
          points:
            - Städtische Nutzung — häufig kleine Dellen und Lackierungen, ein Lackmessgerät ist Pflicht
            - Süden und Küste bringen Salz und Korrosion, der Norden ist näher an deutschen Bedingungen
            - Revisione — wir prüfen die Regelmäßigkeit, Auslassungen kommen häufiger vor
            - Viele Fahrzeuge mit Gasanlagen — wir prüfen diese separat
        pl:
          lead: 'Der nächstgelegene große Markt: die Logistik ist günstig und kurz. Doch Polen war jahrelang der Hauptumschlagplatz für Unfallfahrzeuge aus Westeuropa, daher prüfen wir die Geschichte hier strenger als irgendwo sonst.'
          points:
            - Hoher Anteil an nach einem Unfall wiederhergestellten Fahrzeugen — Karosserieschäden haben Priorität
            - 'Häufige Weiterverkäufe: das Auto wechselt innerhalb eines Jahres mehrfach den Besitzer'
            - Die Laufleistung wird häufig beim Import manipuliert — wir vergleichen mit den Service-Datenbanken
            - Kurze Lieferzeiten — günstiger und schneller als aus Spanien oder Portugal
      closing:
        eyebrow: Wie fangen wir an?
        line1: Beschreiben Sie das Auto,
        line2: das Sie suchen —
        accentWord: dann ist unsere Arbeit dran
        text: Budget, Karosserie, Getriebe, ein paar Wünsche obendrauf. Wir suchen für Sie, während Sie die Berichte zu den Optionen durchsehen und entscheiden, welches Sie persönlich anschauen möchten.
