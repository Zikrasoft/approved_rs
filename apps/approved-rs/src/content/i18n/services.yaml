translations:
  en:
    vehicle-sourcing:
      hub:
        metaTitle: Car sourcing in Europe made easy
        metaDescription: 'We source vehicles in Germany, Serbia, Spain, Switzerland, Italy, France, Poland, and Portugal: search, inspection, negotiation, and delivery service.'
        title: Car Sourcing
        titleHighlight: made easy
        description: We find a vehicle in the country where you are or plan to purchase — complete verification, transaction assistance, and delivery service. Choose a country to see the details.
        breadcrumbLabel: Car Sourcing
        casesHeading: Sourcing Cases
        chooseCountryLabel: 'Choose a country:'
        ctaLabel: Find a Car
        heroPhotoAlt: Row of vehicles at a dealer's lot
        processHeading: How Sourcing Works
        processLead: 'From application to key handover typically takes two to four weeks. The longest part is finding the car: we don’t settle for the first suitable one and keep looking until we find one that passes inspection without questions.'
        processSteps:
          - n: '01'
            text: We discuss your budget, preferred brand, and requirements — what’s important and what you’re willing to compromise on
          - n: '02'
            text: We sift through options on-site and eliminate those that don’t meet your criteria over the phone
          - n: '03'
            text: We conduct an inspection with a thickness gauge and scanner; for BMW, we connect to the dealer's ISTA, taking photos and videos
          - n: '04'
            text: We send a report and straightforwardly advise whether to proceed or continue searching
          - n: '05'
            text: We negotiate, finalize the deal, and deliver the car to you or drive it to your door
        includedHeading: What's Included
        includedLead: The commission is fixed before we start and does not depend on how many vehicles we inspect. If we say 'don't buy' after our check, we'll keep looking at no extra cost.
        included:
          - title: Unlimited Options Search
            text: We work until we find a car that meets your expectations. Rejecting a failed option is part of the service and incurs no additional cost.
          - title: Expert Inspection for Every Vehicle
            text: Thickness gauge on panels, scanner for systems, a lift when necessary. Photos and videos of all problem areas — you see exactly what we do.
          - title: History and Legal Verification
            text: CarVertical report by VIN, dealer service history by make, mileage confirmation, liens, registration restrictions, and unresolved insurance events.
          - title: Negotiation and Deal Finalization
            text: We negotiate the price based on findings, prepare documents, and assist with the signing process.
          - title: Delivery and Registration Assistance
            text: We transport the car to your city and help with local registration — or we hand over the keys wherever is convenient for you.
          - title: Single Point of Contact Throughout
            text: You work with the same specialist who inspected the car. No need to explain your needs to different handlers.
        compareHeading: How Markets Differ
        compareLead: The same model in Germany and Poland represents two distinct vehicles in terms of history and price.
        compareHint: Select a country — we’ll show you what to prioritize there.
        compareLinkFor: Sourcing {location} — in detail
      title: Car Sourcing Made Easy
      descriptionFor: We’ll find a vehicle in {location} — among cars already in this country, without importing from abroad. Complete verification, transaction assistance, and delivery to your city — all-inclusive, including customs clearance.
      ctaLabel: Submit a Request
      casesHeadingFor: 'Cases: Car Sourcing {location}'
      breadcrumbLabelFor: Cars {location}
      stepsFor:
        - n: '01'
          text: You submit a request with your requirements — budget, brand, mileage
        - n: '02'
          text: We search for options in {location} that meet your criteria
        - n: '03'
          text: An independent expert inspects and verifies the vehicle
        - n: '04'
          text: We assist with the transaction, helping with documents and registration
        - n: '05'
          text: We deliver the vehicle to your city — all-inclusive, including customs clearance
      deliveryLineFor: We deliver to {destinations} — and to any other country; we’ll discuss it upon request.
      deliveryDestinations:
        - Russia
        - Kazakhstan
        - Kyrgyzstan
        - Ukraine
        - Belarus
        - Bosnia and Herzegovina
        - Croatia
        - North Macedonia
        - Turkey
      citiesHeadingFor: Where We Inspect Cars in {countryLocation}
      citiesLead: Our expert covers the entire country, but we most often inspect cars where they are most frequently listed. Here’s what that means for each city.
      alsoInLabel: 'We also source in:'
      crossSellLabel: Need a car from elsewhere?
      countryNotesHeadingFor: What to Consider in {location}
      countryNotesPointsLabel: What We Check First
      countryNotes:
        de:
          lead: 'The selection here is larger than in any other market in Europe, and service history is usually traceable: most vehicles have a service booklet with dealer records of every maintenance. The flip side — highway mileage. Two hundred thousand in three years is the norm, not a reason for a discount.'
          points:
            - Service booklet and dealer records — we verify against VIN at official service
            - HU protocol, commonly referred to as TÜV — we read past inspection comments, not just the stamp
            - 'Cars from leasing and corporate fleets: maintained properly, but with high mileage'
            - Winter roads with de-icing agents — we inspect underbody and sills separately
        rs:
          lead: We are locally based, so we inspect cars the same day you contact us and without import delays. The market is small, and the same car can pass through several sellers, making the history complex to unravel.
          points:
            - The car is already cleared and on local plates — no import duties or registration needed
            - Mileage is often altered during resale within the country — we verify with technical inspection records
            - Many cars imported from Germany and Italy — we check their history prior to importation
            - Inspection on the spot, no waiting on logistics
        es:
          lead: Mild winters and almost no road de-icing agents mean that the underside of Spanish cars is generally in better condition than German cars. However, the sun and proximity to the sea can cause damage to paint, plastic, and rubber.
          points:
            - On the coast — we check for corrosion primarily in hidden cavities
            - Faded lacquer and cracked interior plastics — we account this in pricing
            - 'A lot of ex-rental cars: consistent mileage but harsh driving conditions'
            - ITV protocol — we check comments and inspection dates
        ch:
          lead: 'Swiss cars are typically better maintained than the European average: expensive maintenance encourages discipline, resulting in lower mileage. However, Switzerland is not part of the EU, so imports are handled differently, and we factor that into the budget.'
          points:
            - Higher-end trims — these are more commonly chosen than in neighboring countries
            - MFK — inspections are strict, taken seriously, and the results reflect the vehicle condition
            - 'Not in the EU: customs and documentation are processed differently than for EU countries'
            - Prices are higher than the market, but you save on repairs later
        pt:
          lead: The market is small, the selection is less than in Spain, but the competition for good cars is also lower. The humid and salty climate means coastal corrosion can occur even on newer vehicles.
          points:
            - Humidity and sea — we prioritize inspection of hidden cavities and electrical components
            - 'Small market: we spend more time searching for specific requests than in Germany'
            - IPO protocol — we read comments from previous inspections
            - Many diesel and small-engine cars, larger bodies are rare
        fr:
          lead: France is primarily about diesel and local makes. Peugeot, Renault, and Citroën are cheaper here than anywhere else in Europe. Conversely, German premium brands are more expensive, making purchases here less sensible.
          points:
            - French makes — best prices in Europe, and maintenance costs are lower
            - Diesels — we pay special attention to the diesel particulate filter and EGR valve
            - Contrôle technique — detailed protocols, we check comments across years
            - 'City driving: clutches and suspensions wear out faster than advertised'
        it:
          lead: 'The Italian market is good for small cars and unique trims, but requires caution: vehicles here are often driven hard, and minor body repairs are not always done carefully.'
          points:
            - Cities — frequent minor dings and touch-ups require a thickness gauge
            - The south and coastal areas introduce salt and corrosion, while the north is closer to German conditions
            - Revisione — we check regularity; missed inspections are more common than usual
            - Many vehicles equipped with gas systems — we inspect these separately
        pl:
          lead: 'The largest market closest to us: logistics are cheap and short. However, Poland has long been a major transit point for damaged vehicles from Western Europe, so we verify history here more rigorously than anywhere else.'
          points:
            - High share of vehicles restored after accidents — body geometry is a priority
            - 'Frequent resales: a car can change several owners in a year'
            - Mileage is often adjusted during import — we verify against service databases
            - Short delivery distance — cheaper and faster than from Spain or Portugal
      closing:
        eyebrow: How Shall We Begin?
        line1: Describe the car you are looking for,
        line2: and we will take it from here —
        accentWord: that's where we come in
        text: Budget, body type, transmission, a couple of preferences. We'll handle the search, and you can review reports on options and decide which ones to inspect in person.
    vehicle-buyback:
      hub:
        metaTitle: Buyback of Cars with Russian Plates in Europe
        metaDescription: We buy cars with Russian plates in any country in Europe and cars with Serbian plates in Serbia. Photo assessment within an hour, payment on the day of signing.
        title: Car Buyback
        titleHighlight: no haggling for weeks
        description: 'We take cars that are difficult to sell through traditional means: Russian plates, expired imports, disputed documents. The price is below market value — this is the cost of speed and the fact that we handle all the selling hassle.'
        breadcrumbLabel: Car Buyback
        casesHeading: Buyback Cases
        chooseCountryLabel: 'Select a country:'
        ctaLabel: Get a Quote
        heroPhotoAlt: Car keys on money and documents
        processHeading: How Buyback Works
        processLead: From the first message to the cash exchange typically takes two to three days, and most of that time is spent traveling to the meeting point. We provide a photo-based quote within an hour.
        processSteps:
          - n: '01'
            text: You send us photos, documents, and an honest description of the car's condition
          - n: '02'
            text: We give you a final price within an hour — no estimates, just the final number
          - n: '03'
            text: We arrange a meeting at the location of the car; if it’s not operational — we come with a trailer
          - n: '04'
            text: We inspect the car in person and confirm the price, if the description matches
          - n: '05'
            text: We sign the contract, and payment is made on the day of signing
        includedHeading: What We Handle
        includedLead: The difference between our price and the market value is what we take on, due to the reasons that prevent such cars from being sold for months.
        included:
          - title: Cars with Russian Plates
            text: Primary category. The car can be located in any country in Europe — we will come to where it is, and we handle the export and resale ourselves.
          - title: Import and Timing Issues
            text: After signing, any risks associated with expired temporary imports transfer to us.
          - title: Valuation Without an Inspection
            text: We provide a price based on photos and documents. We come only when both parties agree on the sum.
          - title: Transaction Processing
            text: We prepare the contract, deregistration, and all paperwork ourselves. You just provide the car documents and a signature.
          - title: Payment on Signing Day
            text: Payment is made on the same day. We do not offer deferred payment schemes or 'we’ll pay you after resale'.
          - title: Honest Refusal
            text: If the car isn't suitable for us, we’ll let you know right away and explain the reason. We won't drag it out or lower the price during the process.
      title: Car Buyback
      ctaLabel: Get a Quote
      casesHeading: Buyback Cases
      breadcrumbLabel: Car Buyback
      descriptionSerbia: We buy cars with Russian plates below market value — the car can be in any country in Europe. We also buy cars with Serbian plates in Serbia and Montenegro. Online valuation, processing in 1 day, payment on the day of the transaction.
      descriptionOtherFor: We buy cars with Russian plates below market value — the car can be in any country in Europe, including {name}. Online valuation, processing in 1 day, payment on the day of the transaction.
      step1: Send photos and a description of the car
      step2: We provide an online valuation based on photos within 1 hour — below market price
      step3Serbia: We meet for an inspection — Russian plates (in any country in Europe) or Serbian plates (Serbia, Montenegro)
      step3Other: We meet for an inspection — Russian plates, the car can be in any country in Europe
      step4: We finalize the transaction, cash on the day of signing
      closing:
        eyebrow: Want an assessment?
        line1: Send us photos
        line2: and documents —
        accentWord: we'll provide a price in an hour
        text: The assessment is free and comes with no obligations. If the price doesn't suit you, we can part ways without any pressure or follow-up calls.
    vehicle-import:
      hub:
        metaTitle: Car Import from Europe and China
        metaDescription: We import cars from Germany, Spain, Switzerland, and China to any country — selection, inspection, delivery, and customs clearance made easy.
        title: Car Import
        titleHighlight: from Europe and China
        description: The car is in Europe or China, and you are anywhere else. We select, inspect, and deliver it to you, including customs clearance.
        breadcrumbLabel: Car Import
        casesHeading: Import Cases
        euCardTitle: From Europe
        euCardText: Spain, Switzerland, and other countries — selection and delivery to any destination.
        chinaCardTitle: From China
        chinaCardText: New and used cars from China — delivered through a trusted partner.
        exploreLabel: Learn More
        ctaLabel: Calculate Import Cost
        heroPhotoAlt: Car carrier loaded with vehicles
        processHeading: How the Import Process Works
        processLead: Typically, it takes four to eight weeks from application to receiving your registration number, with the actual transportation taking the least time. A car travels a few days from Germany to Belgrade, while customs and registration can take several weeks.
        processSteps:
          - n: '01'
            text: We calculate the total cost upfront — car price, logistics, duties, and documentation.
          - n: '02'
            text: We locate and inspect the car in the country of origin.
          - n: '03'
            text: We purchase the car through our European company, deregister it, and prepare export documents.
          - n: '04'
            text: We transport it using a car carrier or self-drive with transit plates.
          - n: '05'
            text: We clear customs, register it, and hand you the keys.
        includedHeading: What Makes Up the Price
        includedLead: "When doing it yourself, the budget often gets shattered by the additional costs beyond the car's price. We calculate it in advance and fix it: the final amount should not differ from the initial estimate."
        included:
          - title: Cost of the Car
            text: The negotiated price, not the one from the ad. We negotiate on-site with the car in hand — this usually helps to recoup some costs.
          - title: Logistics to the Destination
            text: Car carrier or self-drive with transit plates. We calculate both options and choose the more cost-effective one for this specific route.
          - title: Duties and Taxes
