      cityNotesHeadingFor: Automobilsko tržište {cityLocation}
      cityNotesPointsLabel: Šta to donosi u praksi
      cityNotes:
        berlin:
          lead: 'U Berlinu je najveći izbor u Nemačkoj i najraznovrsniji sastav prodavaca. Tu se može naći sve: od automobila iz korporativnih flota sa kompletnom istorijom, do preprodajnih opcija koje su došle iz Istočne Evrope.'
          points:
            - Ogroman izbor u svim segmentima, uključujući retke varijante
            - Mnogi privatni prodavci — pregovaranje je stvarnije nego kod dilera
            - 'Gradskog ciklusa: kvačilo i suspenzija se brže troše nego kod vožnje na autoputu'
        munich:
          lead: 'Skup grad sa skupim automobilima. Premijum segment ovde je veći nego bilo gde drugde u Nemačkoj, a stanje je u proseku bolje: o takvim automobilima se brine.'
          points:
            - Snažan premijum segment, posebno BMW i Mercedes
            - Uuglađeni automobili sa kompletnom istorijom kod dilera
            - Cene su više od proseka u zemlji — ušteda dolazi od stanja
        hamburg:
          lead: Lučki grad i veliki logistički čvor. Odatle je praktično slati automobile dalje, a na tržištu se često nalaze sveže uvozni automobili.
          points:
            - Luka u blizini — lakše i jeftinije organizovati transport
            - Mnoge mašine iz severnih zemalja sa autoputnim pređenim kilometrima
            - 'Vlažna morska klima: karoseriju i skrivene prostore pregledamo pažljivije'
        dusseldorf:
          lead: Centar Severne Rajne-Vestfalije, najgušće naseljene pokrajine u Nemačkoj. Pločice su blizu jedna drugoj, a do granice sa Holandijom i Belgijom je sat vožnje, tako da iz tog razloga redovno dolaze automobili na prodaju.
          points:
            - Za jedan izlazak možemo pregledati nekoliko automobila — mesta su blizu
            - 'Deo ponuda sa holandskim i belgijskim registarskim tablicama: istoriju i dokumente proveravamo posebno'
            - Mnogi prodavci se takmiče međusobno — pregovor ide brže
        belgrade:
          lead: Naša baza. U Beogradu izlazimo na prozoru na dan zahteva, poznajemo lokalne prodavce i vidimo koja mašina već dva meseca kruži po placu.
          points:
            - Pregled na dan zahteva, bez čekanja i logistike
            - Poznajemo lokalne placeve i istoriju automobila koji su na njima
            - Automobil je već uvezen — uvoz i takse nisu potrebni
        novi-sad:
          lead: Drugi po veličini grad Srbije i sat vožnje od Beograda. Tržište je manje, ali su cene obično mirnije od beogradskih, a automobili ređe prošli kroz nekoliko preprodaja.
          points:
            - Cene su niže od beogradskih uz uporedivo stanje
            - Manje preprodavaca, češće se sreće prvi vlasnik
            - Izlazimo iz Beograda, nema dodatnog troška za put
        pancevo:
          lead: Pančevo praktično ulazi u beogradsku aglomeraciju, tako da prozori ovde nisu drugačiji od beogradskih. Tržište je malo, ali se zanimljiviji privatni oglasi često pojavljuju.
          points:
            - Dvadeset minuta od Beograda — izlazimo tako brzo
            - Malo tržište sa pretežno privatnim prodavcima
            - Često je jeftinije od Beograda uz isto stanje
        subotica:
          lead: 'Subotica se nalazi na granici sa Mađarskom, i to se vidi na tržištu: mnogo automobila, uvezenih iz EU, i prodavaca koji se time stalno bave.'
          points:
            - Granično tržište — mnogo svežeg uvoza iz Evropske unije
            - Istoriju pre uvoza proveravamo posebno pažljivo
            - Pogodna tačka ako planirate da vozite dalje na sever
        madrid:
          lead: 'Glavno tržište Španije: najveći izbor u zemlji i mnogo automobila iz korporativnih flota. Kontinentalna klima, pa je morska korozija ovde manja nego na obali.'
          points:
            - Najveći izbor u Španiji, uključujući korporativne automobile
            - Daleko od mora — karoserije su obično čistije od obalskih
            - 'Vruće leto: plastiku, lak i klimu proveravamo posebno'
        barcelona:
          lead: Sve određuje blizina mora. Automobili često izgledaju odlično sa dna, ali zahtevaju pažnju na skrivene prostore i elektricitet.
          points:
            - 'More je blizu, zato pregledamo skrivene prostore: s donje strane je često čisto, dok iznutra nije'
            - Mnoge nekadašnje iznajmljive i carsharig mašine
            - Luka u blizini, slanje morem je lakše organizovati
        zurich:
          lead: Cirih je najskuplje tržište automobila u regionu. Oprema ovde je na maksimalnom nivou, servisira se kod dilera, i prodaju se pre nego što automobil postane trošen.
          points:
            - Maksimalne opreme i mali pređeni kilometri
            - Diler servis — istorija je gotovo uvek potpuna
            - Švajcarska nije u EU, uvoz se obezbeđuje posebno
        geneva:
          lead: Ženeva se nalazi u frankofonoj oblasti Švajcarske, na samoj granici sa Francuskom. Francuskih marki na tržištu ima znatno više nego u nemačkom delu zemlje.
          points:
            - 'Mešovito tržište: švajcarsko stanje, francuski asortiman'
            - Granica sa Francuskom je blizu — ima sa čime uporediti po ceni
            - 'Procedura je ista kao i širom Švajcarske: izvoz plus uvoz'
        paris:
          lead: 'Najveći izbor u Francuskoj dolazi sa najrigoroznijim korišćenjem: gust promet i uske parkinge ostavljaju tragove na karoseriji i suspenziji.'
          points:
            - Najveći izbor u Francuskoj, posebno francuskih marki
            - 'Gradski ciklus: kvačilo, suspenzija i sitna oštećenja karoserije'
            - Mnogi dizeli — čestica filtera i EGR proveravamo prvo
        lyon:
          lead: Lyon je mirniji od Pariza i po cenama, i po stanju automobila. Autoput na jug je blizu, tako da se češće sreću automobili sa ravnim šosetskim pređenim kilometrima.
          points:
            - Cene su niže od pariških uz uporediv izbor
            - Više autoputnih pređenih kilometara, manje gradskog trošenja
            - Pogodno mesto za put ka Italiji i Španiji, ako tražimo šire
        milan:
          lead: 'Poslovna prestonica Italije, a to se vidi i na tržištu. Sever zemlje je bliži nemačkim uslovima: putevi su bolji, a automobili se bolje održavaju nego na jugu.'
          points:
            - Najbolji izbor premijum segmenta u Italiji
            - Sever — manje soli i korozije nego na jugu zemlje
            - 'Gust grad: merni uređaj na panelima je obavezan'
        rome:
          lead: Veliko tržište sa veoma gustim gradskim saobraćajem. Male ogrebotine ovde se smatraju normalnim, i često se brzo popravljaju.
          points:
            - Mnogo malih automobila i vozila sa gasnim uređajima
            - Česte popravke posle urbanih kontakata — proveravamo svaku panelu
            - Južnije od Milana — klima je blaža, ali bliže moru
        warsaw:
          lead: Kroz Varšavu ulazi glavni uvoz iz Zapadne Evrope, i ovde je najveći izbor u Poljskoj. Udeo obnovljenih automobila je takođe najveći.
          points:
            - Najveći izbor u Poljskoj, mnogo svežeg uvoza iz EU
            - Geometriju karoserije i tragove popravki proveravamo prvo
            - Kratka dostava — jeftinije nego iz Južne Evrope
        krakow:
          lead: 'Krakov je mirniji od Varšave: tržište je manje, preprodaja manje, a automobili često imaju jednog vlasnika duže. Jug Poljske je bliži Balkanima u logistici.'
          points:
            - Manje prekupaca nego u Varšavi, istorija obično čistija
            - Cene su često niže nego u prestonici
            - Bliže putu na jug — zgodno za isporuku u Srbiju
