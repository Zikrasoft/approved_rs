    vehicle-inspection:
      title: Car Inspection
      description: Independent inspection of a vehicle before purchase. Expert on-site, diagnostics, report — no obligation to buy.
      ctaLabel: Order Inspection
      casesHeading: Inspection Cases
      breadcrumbLabel: Car Inspection
      steps:
        - n: '01'
          text: Body and paintwork — signs of repairs or accidents
        - n: '02'
          text: Suspension, brakes, and running gear
        - n: '03'
          text: Engine, gearbox, transmission
        - n: '04'
          text: Electronics and service history by VIN
        - n: '05'
          text: Legal clean title — liens, registration restrictions, accidents
      extraLine: We also operate in other European countries, including Portugal — please inquire when placing your order.
      hub:
        metaTitle: Car Inspection Before Purchase in Europe
        metaDescription: 'We come to the vehicle you found: thickness gauge, scanner, VIN history check, and a report with photos the same day. We operate in eight European countries.'
        title: Car Inspection
        titleHighlight: Before Purchase
        description: "We come to the car you've found and tell you what's really going on with it. The report is sent before you pay: if the verdict is 'don't buy', you only lose the inspection fee."
        breadcrumbLabel: Car Inspection
        casesHeading: Inspection Cases
        chooseCountryLabel: 'Choose a Country:'
        ctaLabel: Order Inspection
        heroPhotoAlt: Car on a lift at the service
        processHeading: How the Inspection Works
        processLead: Typically, we dispatch within one to two days after your request. The inspection itself takes an hour and a half to two hours, and we send the report the same day, before the car is sold to someone else.
        processSteps:
          - n: '01'
            text: Send us the link to the ad and seller's contacts
          - n: '02'
            text: We arrange a time and place for the inspection with the seller
          - n: '03'
            text: We come with the thickness gauge and scanner, connecting to the BMW dealer's ISTA if necessary, and on a lift if needed
          - n: '04'
            text: We take photos and videos of all findings, checking the history by VIN
          - n: '05'
            text: We send you the report and a direct answer — buy, negotiate, or skip
        includedHeading: What's Included in the Inspection
        includedLead: 'More than a hundred checklist items, but almost always, four areas are decisive: body, engine with gearbox, suspension, and documents. We frequently advise against purchases based on these areas.'
        included:
          - title: Body and Paintwork
            text: Thickness measurement for each panel, geometry of openings, signs of welding and filler. Indicates any repairs not mentioned by the seller.
          - title: Engine and Gearbox
            text: Parameters on a warmed-up engine, gearbox adaptations, errors stored in the control units. The costliest area and the most common reason for rejection.
          - title: Suspension and Brakes
            text: Play, condition of the suspension and braking system. Highway mileage and Balkans roads wear a vehicle differently, and this is evident.
          - title: Electronics and VIN History
            text: CarVertical report, dealer service history by brand, discrepancies in mileage with history, errors in control units, and signs of deployed airbags.
          - title: Legal Clean Title
            text: Liens, registration restrictions, unresolved accidents and insurance claims — issues that arise only after purchase.
          - title: Report with Photos and Videos
            text: Every finding is captured and annotated. The report stays with you — it's useful for negotiations, even if you ultimately decide to buy the car.
        compareHeading: What Changes from Country to Country
        compareLead: Regulations on vehicle inspections, common issues with local cars, and ways to hide history differ everywhere.
        compareHint: Select a country — we'll show you what we add to the standard checklist.
        compareLinkFor: Inspection {location} — details
        mapHeading: Four Areas That Determine the Deal
        mapLead: The checklist is long, but we often advise against purchasing based on one of four areas. Click the number on the scheme — we'll show you what the expert looks for and what we've found there.
      countryNotesHeadingFor: How We Inspect in {location}
      countryNotesPointsLabel: What We Check Beyond the Standard Checklist
      countryNotes:
        de:
          lead: 'In Germany, there are reliable references: service books, HU protocols, and extensive VIN databases. Therefore, the inspection here primarily involves verifying documents against what the car shows.'
          points:
            - We cross-check dealer service records with odometer readings over the years
            - Notes from past HU inspections — what was fixed after the inspection and what was just patched up
            - Undercarriage and sills after winter reagents, including hidden cavities
            - 'Leasing history: consistent service despite high mileage'
        rs:
          lead: "In Serbia, we perform inspections on the day of contact. The main task is to restore the vehicle's history prior to import: local documents only show the car's last segment of its life."
          points:
            - Country of origin and the vehicle's condition before import to Serbia
            - Odometer readings against technical inspection records from previous years
            - Body repairs after import — these are done more frequently and cheaply than in the EU
            - 'Legal aspects: liens and restrictions on registration'
        es:
          lead: Spanish cars usually impress with undercarriage condition but disappoint with elements that suffer from sun and salt. We shift the focus of the inspection from corrosion below to hidden cavities, electronics, and interior condition.
          points:
            - Corrosion in hidden cavities near the coast — it may be clean underneath
            - Paint, seals, and plastic after many years of sun exposure
            - 'Rental history: we corroborate mileage with the condition of the interior'
            - ITV protocol and what remains unresolved between inspections
        ch:
          lead: Vehicles in Switzerland are seriously prepared for MFK, so a fresh protocol alone doesn't say much. We check what was done just before the inspection and what has been functioning independently since last year.
          points:
            - What was replaced just before MFK — new parts contrasted with the rest
            - Service is expensive, so we check for any deferred maintenance
            - Rich specifications, but we verify that each option still operates
            - 'Import documents: Switzerland is not in the EU, the set is different'
        pt:
          lead: 'Everything here hinges on the humid maritime climate. We start inspections with corrosion and electronics: issues commonly arise from what lives in moisture.'
          points:
            - Hidden cavities, longitudinal beams, and suspension mounting points
            - Oxidation of connectors and blocks — a typical cause of intermittent errors
            - IPO protocol and the frequency of inspections
            - 'City-driven diesel vehicles: particulate filter and its history'
        fr:
          lead: 'In France, the detailed contrôle technique is a good starting point. We then focus on what the regulations do not catch: diesel engine resources and wear from urban traffic.'
          points:
            - Notes from contrôle technique over the years — what recurs from inspection to inspection
            - Particulate filter, EGR, and turbo on diesels
            - Clutch and suspension after a dense urban cycle
            - 'History with French brands: accessible parts but their weak spots'
        it:
          lead: Italian cars often come with minor bodywork repairs done quickly and affordably. Thickness measurement on panels here takes noticeably more time than usual.
          points:
            - Thickness measurements on all panels — touch-ups after urban scrapes
            - 'Difference between north and south: salt by the coast, regular wear inland'
            - Gas equipment, if installed — installation and tank condition
            - Frequency of revisione and missed periods
        pl:
          lead: Poland is the largest transit market for crashed cars from Western Europe. Therefore, we first determine what has been done to the body before the sale.
          points:
            - Geometry of openings and welding traces — restoration after serious accidents
            - 'Import history: where the car came from and in what condition'
            - Mileage verified against European service databases, odometer readings are not trusted
            - Airbags and their deployment in the past
      closing:
        eyebrow: Found a car?
        line1: Send us the link
        line2: to the ad —
        accentWord: we'll come and inspect
        text: We dispatch within one to two days. The report with photos stays with you, even if you decide against buying after it.
    cityVehicleSourcing:
      title: Car Sourcing
      descriptionFor: We will find a car in {cityLocation} with a thorough check. We operate throughout the {countryName} region.
      casesHeadingFor: Cases from {countryGenitiveOrName}
      whyCityHeadingFor: Why {cityName}
      reason1: We check both dealer lots and private listings
      reason2: We verify history by VIN before going for inspection
      reason3For: Our expert in {cityLocation}
      reason4Dekra: DEKRA / TÜV inspection available upon request
      reason4Generic: Independent technical appraisal available upon request
      otherCitiesLabelFor: 'Other cities in {countryLocation}:'
      cityNotesHeadingFor: Car market in {cityLocation}
      cityNotesPointsLabel: What this means in practice
      cityNotes:
        berlin:
          lead: Berlin offers the largest selection in Germany, with a diverse range of sellers. You'll find everything from corporate fleet vehicles with full histories to resold options from Eastern Europe.
          points:
            - Huge selection in all segments, including rare configurations
            - Many private sellers — negotiation is more genuine than with dealers
            - 'Urban cycle: wear on clutch and suspension is more noticeable than with autobahn cars'
        munich:
          lead: 'An expensive city with pricey cars. The premium segment is larger here than anywhere else in Germany, and the average condition is higher: these cars are well cared for.'
          points:
            - Strong premium segment, especially BMW and Mercedes
            - Well-maintained cars with a complete dealer history
            - Prices are above the national average — savings come from condition
        hamburg:
          lead: A port city and major logistics hub. It's convenient to ship cars from here, and the market has a higher frequency of fresh imports.
          points:
            - Port nearby — easier and cheaper to arrange shipping
            - Many cars from northern regions with highway mileage
            - 'Wet maritime climate: we inspect the body and hidden cavities more carefully'
        dusseldorf:
          lead: The center of North Rhine-Westphalia, Germany's most densely populated state. Dealerships are closely packed, and the Netherlands and Belgium border is just an hour away, meaning cars regularly come here for sale.
          points:
            - We can look at several cars in one trip — dealerships are nearby
            - 'Some listings with Dutch and Belgian plates: we check their history and documents separately'
            - Many sellers competing with each other — negotiation is more favorable
        belgrade:
          lead: Our base. In Belgrade, we can inspect on the same day you contact us— we know local sellers and can recognize cars that have been circling the lots for months.
          points:
            - Inspection on the day of inquiry, without waiting or logistics
            - We know local lots and the history of the cars listed
            - The car is already customs cleared — no import fees required
        novi-sad:
          lead: The second-largest city in Serbia, just an hour's drive from Belgrade. The market is smaller, but prices are usually calmer than in the capital, and cars have less chance of having passed through multiple resales.
          points:
            - Prices are lower than in Belgrade for comparable conditions
            - Fewer resellers, first owners are more common
            - We travel from Belgrade, no separate charge for the trip
        pancevo:
          lead: Pancevo is effectively part of the Belgrade agglomeration, so inspections here are similar to the capital. The market is smaller, but private listings are often more interesting.
          points:
            - Twenty minutes from Belgrade — we can travel just as quickly
            - Small market, with a predominance of private sellers
            - Often cheaper than in the capital for the same condition
        subotica:
          lead: 'Subotica is on the border with Hungary, which is reflected in the market: many cars imported from the EU and sellers who are actively engaged in this trade.'
          points:
            - Border market — lots of fresh imports from the European Union
            - We verify history before import very thoroughly
            - Convenient point if you plan to drive the car further north
        madrid:
          lead: 'The capital market of Spain: the largest selection in the country and many cars from corporate fleets. The continental climate means less coastal corrosion than by the seaside.'
          points:
            - Largest selection in Spain, including corporate vehicles
            - Far from the sea — bodies are usually cleaner than coastal ones
            - 'Hot summers: we check plastic, paint and the air conditioning separately'
        barcelona:
          lead: Proximity to the sea makes a big difference. Cars often look great underneath, but require attention to hidden cavities and electrical systems.
          points:
            - 'The sea is nearby, so we check hidden cavities: often clean underneath, but not inside'
            - Many former rental and car-sharing vehicles
            - Port nearby, shipping by sea is easier to arrange
        zurich:
          lead: Zurich has the most expensive car market in the region. Maximum configurations are the norm here, maintained by dealers, and cars are sold before they wear out.
          points:
            - Maximum configurations and low mileage
            - Dealer maintenance — history is almost always complete
            - Switzerland is not in the EU, import handling is separate
        geneva:
          lead: Geneva is located in the French-speaking part of Switzerland, right on the border with France. There are noticeably more French brands in the market than in the German-speaking part of the country.
          points:
            - 'Mixed market: Swiss quality with a French selection'
            - Border with France nearby — easier to compare prices
            - 'The handling is the same as across Switzerland: export plus import'
        paris:
          lead: 'The largest selection in France comes with the harshest usage: tight traffic and cramped parking take a toll on the body and suspension.'
          points:
            - The largest selection in France, especially of French brands
            - 'Urban cycle: clutch, suspension, and minor body damages are common'
            - Many diesels — we check the particulate filter and EGR first
        lyon:
          lead: Lyon is calmer than Paris in terms of both prices and car conditions. The highway to the south is close, so highway mileage cars are more common.
          points:
            - Prices are lower than in Paris for comparable choices
            - More highway mileage, less urban wear
            - Convenient route to Italy and Spain if searching more widely
        milan:
          lead: 'The financial capital of Italy, and you can see the price tags in the market. The north of the country is closer to German conditions: better roads, better maintained cars than in the south.'
          points:
            - Best selection of premium segment cars in Italy
            - The north has less salt and corrosion than the south
            - 'Dense city: a thickness gauge for panels is essential'
        rome:
          lead: A large market with very dense urban usage. Minor scratches are considered a part of life here, often repaired hastily.
          points:
            - Many compact cars and vehicles with gas installations
            - Frequent touch-ups from urban contact — we check each panel
            - South of Milan — the climate is milder, but closer to the sea
        warsaw:
          lead: Most imports from Western Europe come through Warsaw, and it's also the largest selection in Poland. The share of restored vehicles is the highest here.
          points:
            - Largest selection in Poland, with much fresh import from the EU
            - We check the body geometry and signs of repairs first
            - Shorter delivery distance — cheaper than from Southern Europe
        krakow:
          lead: 'Krakow is quieter than Warsaw: the market is smaller, there are fewer resales, and cars often stay with one owner longer. Southern Poland is logistically closer to the Balkans.'
          points:
            - Fewer resellers than in Warsaw, history is usually cleaner
            - Prices are often lower than in the capital
            - Closer to the route south — convenient for delivery to Serbia
