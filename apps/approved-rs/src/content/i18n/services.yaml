    vehicle-inspection:
      title: Fahrzeuginspektion
      description: Unabhängige Überprüfung eines Autos vor dem Kauf. Besichtigung durch einen Experten, Diagnose, Bericht – ohne Kaufverpflichtung.
      ctaLabel: Inspektion anfordern
      casesHeading: Inspektionsfälle
      breadcrumbLabel: Fahrzeuginspektion
      steps:
        - n: '01'
          text: Karosserie und Lack – Reparaturen oder Unfälle
        - n: '02'
          text: Fahrwerk, Federung, Bremsen
        - n: '03'
          text: Motor, Getriebe, Antrieb
        - n: '04'
          text: Elektronik und Wartungshistorie über VIN
        - n: '05'
          text: Rechtliche Sauberkeit – Pfand, Eintragungsverbote, Unfälle
      extraLine: Wir bieten unsere Dienstleistungen auch in anderen europäischen Ländern an, einschließlich Portugal – fragen Sie bei der Anfrage nach.
      hub:
        metaTitle: Fahrzeuginspektion vor dem Kauf in Europa
        metaDescription: 'Wir kommen zu dem Auto, das Sie selbst gefunden haben: Lackprüfung, Diagnose, Überprüfung der Historie über VIN und Bericht mit Fotos am selben Tag. Wir arbeiten in acht europäischen Ländern.'
        title: Fahrzeuginspektion
        titleHighlight: vor dem Kauf
        description: 'Wir kommen zu dem Auto, das Sie selbst gefunden haben, und informieren Sie über den tatsächlichen Zustand. Der Bericht kommt, bevor Sie das Geld übergeben: Wenn die Antwort „nicht kaufen“ lautet, verlieren Sie nur die Kosten der Inspektion.'
        breadcrumbLabel: Fahrzeuginspektion
        casesHeading: Inspektionsfälle
        chooseCountryLabel: 'Wählen Sie ein Land:'
        ctaLabel: Inspektion anfordern
        heroPhotoAlt: Auto auf einer Hebebühne in der Werkstatt
        processHeading: Ablauf der Inspektion
        processLead: In der Regel fahren wir innerhalb von ein bis zwei Tagen nach der Anfrage los. Die Besichtigung selbst dauert anderthalb bis zwei Stunden, der Bericht wird am selben Tag verschickt, solange das Auto noch nicht an einen anderen Käufer verkauft wurde.
        processSteps:
          - n: '01'
            text: Sie senden uns den Link zur Anzeige und die Kontaktdaten des Verkäufers
          - n: '02'
            text: Wir vereinbaren mit dem Verkäufer einen Termin und einen Ort für die Besichtigung
          - n: '03'
            text: Wir kommen mit einem Lackmessgerät und einem Scanner, für BMW verbinden wir uns mit dem Händler-ISTA, falls erforderlich – auf die Hebebühne
          - n: '04'
            text: Wir machen Fotos und Videos von allen Funden, überprüfen die Historie über VIN
          - n: '05'
            text: Wir senden den Bericht und eine klare Antwort – kaufen, verhandeln oder ablehnen
        includedHeading: Was in die Inspektion einfließt
        includedLead: 'Über hundert Punkte auf der Checkliste, aber entscheidend sind fast immer vier Bereiche: Karosserie, Motor mit Getriebe, Fahrwerk und Dokumente. Genau auf diesen Punkten raten wir am häufigsten von einem Kauf ab.'
        included:
          - title: Karosserie und Lack
            text: Lackmessung an jedem Paneel, Geometrie der Öffnungen, Spuren von Schweiß- und Spachtelarbeiten. Es ist sichtbar, ob es Reparaturen gab, die der Verkäufer nicht erwähnt hat.
          - title: Motor und Getriebe
            text: Parameter bei warmem Motor, Getriebeanpassungen, Fehler in den Steuergeräten. Der teuerste Bereich und häufigster Grund für die Ablehnung.
          - title: Fahrwerk und Bremsen
            text: Spiel, Zustand der Federung und des Bremssystems. Autobahnfahrten und Balkanstraßen nutzen das Fahrzeug unterschiedlich ab, und das ist sichtbar.
          - title: Elektronik und Historie über VIN
            text: CarVertical-Bericht, Händlerwartungshistorie für die Marke, Diskrepanzen im Kilometerstand mit der Historie, Fehler in den Steuergeräten und Spuren von ausgelösten Airbags.
          - title: Rechtliche Sauberkeit
            text: Pfand, Anmeldesperren, offene Unfälle und Versicherungsfälle – das, was nach dem Kauf ans Licht kommt.
          - title: Bericht mit Foto und Video
            text: Jeder Fund wird dokumentiert und beschriftet. Der Bericht bleibt bei Ihnen – damit können Sie bequem verhandeln, selbst wenn Sie das Auto schließlich kaufen.
        compareHeading: Was sich von Land zu Land ändert
        compareLead: Regelungen zur Hauptuntersuchung, typische Mängel lokaler Fahrzeuge und Möglichkeiten, die Historie überall zu verheimlichen.
        compareHint: Wählen Sie ein Land – wir zeigen, was wir zur üblichen Checkliste hinzufügen.
        compareLinkFor: Inspektion {location} – im Detail
        mapHeading: Vier Bereiche, die den Deal entscheiden
        mapLead: Die Checkliste ist lang, aber wir raten fast immer in einem der vier Bereiche ab. Klicken Sie auf die Nummer im Diagramm – wir zeigen, was der Experte anschaut und was wir dort gefunden haben.
      countryNotesHeadingFor: Wie wir {location} überprüfen
      countryNotesPointsLabel: Was wir über die übliche Checkliste hinaus überprüfen
      countryNotes:
        de:
          lead: 'In Deutschland gibt es viel, worauf man sich stützen kann: das Serviceheft, HU-Protokolle und umfangreiche VIN-Datenbanken. Daher besteht die Inspektion hier in erster Linie darin, die Dokumente mit dem zu vergleichen, was das Auto zeigt.'
          points:
            - Wir vergleichen die Stempel aus der Händlerwartung mit den Kilometerständen über die Jahre
            - Anmerkungen des letzten HU – was nach der Prüfung repariert wurde und was nur hinausgezögert wurde
            - Unterboden und Schweller nach winterlichen Reagenzien, einschließlich versteckter Hohlräume
            - 'Leasinghistorie: ordnungsgemäße Wartung bei hohem Kilometerstand'
        rs:
          lead: 'In Serbien fahren wir am Tag der Anfrage los. Die Hauptaufgabe besteht darin, die Historie des Fahrzeugs bis zur Einfuhr wiederherzustellen: lokale Dokumente zeigen nur das letzte Segment des Lebens des Fahrzeugs.'
          points:
            - Herkunftsland und Zustand des Fahrzeugs vor der Einfuhr nach Serbien
            - Kilometerstand gegen Stempel des technischen Überprüfungs für die Vorjahre
            - Karosseriereparaturen nach der Einfuhr – die werden hier öfter und günstiger gemacht als in der EU
            - 'Rechtliche Aspekte: Pfand und Einschränkungen bei der Anmeldung'
        es:
          lead: Spanische Autos erfreuen sich normalerweise eines soliden Unterbodens, während sie in allem, was unter Sonnenlicht und Salz leidet, enttäuschen. Wir verlagern die Inspektion von der Korrosion unten auf versteckte Hohlräume, Elektronik und Zustand des Innenraums.
          points:
            - Korrosion in versteckten Hohlräumen an der Küste – unten kann es sauber sein
            - Lack, Dichtungen und Plastik nach jahrelanger Sonneneinstrahlung
            - 'Vermietungshistorie: Wir vergleichen den Kilometerstand mit dem Zustand des Innenraums'
            - ITV-Protokoll und was zwischen den Prüfungen noch offen geblieben ist
        ch:
          lead: Die MFK-Vorbereitung für Fahrzeuge wird hier ernst genommen, sodass ein frisches Protokoll alleine nicht viel aussagt. Wir schauen uns an, was genau vor der Inspektion gemacht wurde und was seit dem letzten Jahr unbeachtet geblieben ist.
          points:
            - Was wurde direkt vor der MFK ersetzt – neue Teile im Vergleich zu den übrigen
            - Wartung ist teuer, also prüfen wir, ob Wartungsarbeiten aufgeschoben wurden
            - Die Ausstattung ist umfangreich, aber wir überprüfen, ob jede Option noch funktioniert
            - 'Dokumente zur Einfuhr: Die Schweiz ist nicht die EU, die Anforderungen unterscheiden sich'
        pt:
          lead: 'Hier spielt das feuchte Meeresklima eine entscheidende Rolle. Unsere Inspektion beginnt mit Korrosion und Elektronik: Oft sind es die Dinge, die im Nassen leben, die Probleme machen.'
          points:
            - Versteckte Hohlräume, Längsträger und Befestigungspunkte der Federung
            - Korrosion von Steckverbindern und Steuergeräten – eine typische Ursache für sporadische Fehler
            - IPO-Protokoll und die Regelmäßigkeit der Inspektionen
            - 'Dieselmotoren mit Stadtbetrieb: Partikelfilter und seine Vorgeschichte'
        fr:
          lead: 'In Frankreich gibt es eine detaillierte Kontrolle technique, die einen guten Ausgangspunkt darstellt. Danach schauen wir uns an, was die Regulierung nicht erfasst: Verschleiß der Dieselmotoren und Abnutzung durch den Stadtverkehr.'
          points:
            - Anmerkungen zur contrôle technique über die Jahre – was im Inspection von Inspektion wiederholt wird
            - Partikelfilter, EGR und Turbolader bei Diesel-Fahrzeugen
            - Kupplung und Fahrwerk nach intensiven städtischen Zyklen
            - 'Historie für französische Marken: gut verfügbare Ersatzteile, aber auch eigene Schwächen'
        it:
          lead: Italienische Autos kommen häufiger mit kleinen Karosserie-Reparaturen, die schnell und günstig durchgeführt wurden. Es dauert hier deutlich länger, die Lackmessung an den Paneelen vorzunehmen als gewöhnlich.
          points:
            - Lackmessung an allen Paneelen – Nachlackierungen nach städtischen Parkunfällen
            - 'Unterschied zwischen Nord und Süd: Salz an der Küste, übliche Abnutzung im Landesinneren'
            - Gasysteme, wenn vorhanden, – Installation und Zustand des Behälters
            - Regelmäßigkeit der revisione und versäumte Fristen
        pl:
          lead: Polen ist der größte Umschlagplatz für beschädigte Fahrzeuge aus Westeuropa. Daher klären wir zuerst, was mit dieser Karosserie vor dem Verkauf gemacht wurde.
          points:
            - Geometrie der Öffnungen und Spuren von Schweißarbeiten – Wiederherstellung nach einem schweren Unfall
            - 'Einfuhrhistorie: Woher das Auto kam und in welchem Zustand'
            - Kilometerstand vergleichen wir mit europäischen Service-Datenbank, dem Kilometerzähler glauben wir nicht
            - Airbags und ihre Auslösungen in der Vergangenheit
      closing:
        eyebrow: Haben Sie ein Auto gefunden?
        line1: Schicken Sie uns den Link
        line2: zur Anzeige –
        accentWord: wir kommen und schauen uns das an
        text: Wir fahren innerhalb von ein bis zwei Tagen los. Der Bericht mit Fotos bleibt bei Ihnen, selbst wenn Sie danach vom Kauf zurücktreten.
    cityVehicleSourcing:
      title: Fahrzeugbeschaffung
      descriptionFor: Wir beschaffen ein Auto in {cityLocation} mit vollständiger Prüfung. Wir arbeiten in der gesamten Region {countryName}.
      casesHeadingFor: Fälle aus {countryGenitiveOrName}
      whyCityHeadingFor: Warum {cityName}
      reason1: Wir prüfen sowohl Händlerangebote als auch private Anzeigen.
      reason2: Die Historie anhand der VIN wird vor der Besichtigung überprüft.
      reason3For: Unser Experte in {cityLocation}
      reason4Dekra: DEKRA / TÜV-Prüfung auf Anfrage.
      reason4Generic: Unabhängige technische Expertise auf Anfrage.
      otherCitiesLabelFor: 'Weitere Städte in {countryLocation}:'
      cityNotesHeadingFor: Automarkt in {cityLocation}
      cityNotesPointsLabel: Was das praktisch bedeutet
      cityNotes:
        berlin:
          lead: 'Berlin bietet die größte Auswahl in Deutschland und die vielfältigste Zusammensetzung der Verkäufer. Hier gibt es alles: von Firmenfahrzeugen mit vollständiger Historie bis hin zu gewerblichen Anbietern aus Osteuropa.'
          points:
            - Riesige Auswahl in jedem Segment, einschließlich seltener Ausstattungen.
            - Viele private Verkäufer - Verhandlungen sind realistischer als bei Händlern.
            - 'Städtischer Betrieb: Kupplung und Aufhängung nutzen sich schneller ab als bei Autobahnfahrzeugen.'
        munich:
          lead: 'Eine teure Stadt mit teuren Autos. Im Premium-Segment gibt es hier mehr Fahrzeuge als andernorts in Deutschland, und der Zustand ist im Durchschnitt besser: solche Autos werden gut gepflegt.'
          points:
            - Starkes Premium-Segment, besonders BMW und Mercedes.
            - Gut erhaltene Fahrzeuge mit vollständiger Historie beim Händler.
            - Preise über dem Landesdurchschnitt - Einsparungen kommen durch den Zustand.
        hamburg:
          lead: Eine Hafenstadt und ein großes logistisches Zentrum. Von hier aus ist es bequem, Autos weiter zu versenden, und auf dem Markt gibt es häufig frische Importfahrzeuge.
          points:
            - Der Hafen in der Nähe - einfacher und günstiger Versand.
            - Viele Fahrzeuge aus den Nordländern mit Autobahnkilometern.
            - 'Feuchtes maritimes Klima: Wir prüfen Karosserie und versteckte Hohlräume genauer.'
        dusseldorf:
          lead: Zentrum von Nordrhein-Westfalen, dem bevölkerungsreichsten Bundesland Deutschlands. Die Verkaufsflächen sind dicht gedrängt, und die Grenze zu den Niederlanden und Belgien ist nur eine Stunde entfernt, weshalb regelmäßig Fahrzeuge zum Verkauf hierher kommen.
          points:
            - Wir schaffen es, mehrere Autos bei einem Besuch zu besichtigen - die Verkaufsflächen sind nah beieinander.
            - 'Einige Angebote haben niederländische und belgische Nummernschilder: die Historie und Dokumente werden separat geprüft.'
            - Wettbewerbsfähige Verkäufer - Verhandlungen sind oft leichter.
        belgrade:
          lead: Unsere Basis. In Belgrad besuchen wir die Besichtigung am Tag der Anfrage, kennen die lokalen Verkäufer und sehen, welches Auto bereits seit zwei Monaten im Umlauf ist.
          points:
            - Besichtigung am Tag der Anfrage, ohne Wartezeiten und Logistik.
            - Wir kennen die lokalen Verkaufsflächen und die Historie der Fahrzeuge, die dort stehen.
            - Das Auto ist bereits verzollt - Einfuhr und Zölle sind nicht erforderlich.
        novi-sad:
          lead: Die zweitgrößte Stadt Serbiens, eine Stunde von Belgrad entfernt. Der Markt ist kleiner, aber die Preise sind normalerweise ruhiger als in der Hauptstadt, und die Fahrzeuge haben seltener mehrere Eigentümer gewechselt.
          points:
            - Preise sind niedriger als in Belgrad bei vergleichbarem Zustand.
            - Weniger gewerbliche Verkäufer, häufig der Erstbesitzer.
            - Wir fahren von Belgrad aus, es gibt keine separate Gebühr für die Strecke.
        pancevo:
          lead: Pancevo gehört faktisch zur belgrader Agglomeration, daher unterscheidet sich die Besichtigung hier nicht von der in der Hauptstadt. Der Markt ist klein, dafür sind die privaten Angebote interessanter.
          points:
            - Zwanzig Minuten von Belgrad - wir sind ebenso schnell vor Ort.
            - Kleinere Markt mit einem Übergewicht an privaten Verkäufern.
            - Oft günstiger als die Hauptstadt bei demselben Zustand.
        subotica:
          lead: 'Subotica liegt an der Grenze zu Ungarn, und das ist am Markt zu erkennen: viele Autos, die aus der EU importiert wurden, und Verkäufer, die sich ständig damit beschäftigen.'
          points:
            - Grenzmarkt - viele frische Importe aus der Europäischen Union.
            - Die Historie vor dem Import prüfen wir besonders gründlich.
            - Praktischer Standort, wenn Sie planen, das Auto weiter in den Norden zu transportieren.
        madrid:
          lead: 'Der Hauptstadtmarkt Spaniens: die größte Auswahl im Land und viele Autos aus Firmenflotten. Das kontinentale Klima sorgt dafür, dass hier weniger Meereskorrosion als an der Küste auftritt.'
          points:
            - Größte Auswahl in Spanien, einschließlich Firmenfahrzeuge.
            - Weit weg vom Meer - Karosserien sind in der Regel sauberer als an der Küste.
            - 'Heiße Sommer: Plastik, Lack und Klimaanlage unbedingt prüfen.'
        barcelona:
          lead: Alles wird durch die Nähe zum Meer bestimmt. Fahrzeuge sehen oft von unten gut aus, benötigen jedoch Aufmerksamkeit für versteckte Hohlräume und Elektrik.
          points:
            - 'Das Meer ist nah, deshalb prüfen wir versteckte Hohlräume: von unten oft sauber, aber innen schmutzig.'
            - Viele ehemalige Mietwagen und Carsharing-Fahrzeuge.
            - Der Hafen in der Nähe, der Versand per See ist einfacher zu organisieren.
        zurich:
          lead: Zürich ist der teuerste Automarkt der Region. Hier wählt man maximale Ausstattungen, lässt beim Händler warten und verkauft früher, bevor das Auto müde wird.
          points:
            - Maximale Ausstattungen und geringe Kilometerlaufleistungen.
            - Händlerservice - die Historie ist fast immer vollständig.
            - Schweiz ist nicht in der EU, der Import muss separat abgewickelt werden.
        geneva:
          lead: Genf liegt im französischsprachigen Teil der Schweiz, direkt an der Grenze zu Frankreich. Auf dem Markt gibt es deutlich mehr französische Marken als im deutschsprachigen Teil des Landes.
          points:
            - 'Gemischter Markt: Schweizer Zustand, französisches Angebot.'
            - Die Grenze zu Frankreich ist nahe - es gibt Preiskriterien zu vergleichen.
            - 'Die Formalitäten sind die gleichen wie in der gesamten Schweiz: Export plus Import.'
        paris:
          lead: 'Die größte Auswahl in Frankreich kommt mit der härtesten Nutzung: dichter Verkehr und enge Parkplätze hinterlassen Spuren an Karosserie und Aufhängung.'
          points:
            - Die größte Auswahl in Frankreich, besonders von französischen Marken.
            - 'Städtischer Betrieb: Kupplung, Aufhängung und kleine Karosserieschäden.'
            - Viele Diesel - wir überprüfen Partikelfilter und EGR als erstes.
        lyon:
          lead: Lyon ist ruhiger als Paris, sowohl in Bezug auf die Preise als auch den Zustand der Fahrzeuge. Die Schnellstraße nach Süden ist in der Nähe, sodass eher Fahrzeuge mit gleichmäßigen Autobahnkilometern vorbeikommen.
          points:
            - Preise sind niedriger als in Paris, bei vergleichbarem Angebot.
            - Mehr Autobahnkilometer, weniger städtischer Verschleiß.
            - Praktische Verbindung nach Italien und Spanien, falls wir breiter suchen.
        milan:
          lead: 'Die Geschäftshauptstadt Italiens, und das spiegelt sich auch auf dem Markt wider. Der Norden des Landes ist näher an den deutschen Verhältnissen: die Straßen sind besser und die Fahrzeuge gepflegter als im Süden.'
          points:
            - Beste Auswahl im Premium-Segment in Italien.
            - Norden - weniger Salz und Korrosion als im Süden des Landes.
            - 'Dichter Verkehr: ein Lackschichtenmesser ist Pflicht.'
        rome:
          lead: Ein großer Markt mit einer sehr intensiven städtischen Nutzung. Kleine Kratzer gelten hier als Normalität des Lebens und werden oft schnell repariert.
          points:
            - Viele Kleinwagen und Fahrzeuge mit Gasanlage.
            - Häufiger wird nach städtischen Kontakten nachlackiert – wir überprüfen jede Karosserie.
            - Weiter südlich als Mailand - das Klima ist milder, aber näher am Meer.
        warsaw:
          lead: Über Warschau läuft der größte Import aus Westeuropa ins Land, und hier gibt es auch die größte Auswahl in Polen. Der Anteil an wiederaufbereiteten Fahrzeugen ist ebenfalls am höchsten.
          points:
            - Größte Auswahl in Polen, viele frische Importe aus der EU.
            - Karosseriegeometrie und Reparaturspuren prüfen wir zuerst.
            - Kurze Lieferwege - günstiger als aus Südeuropa.
        krakow:
          lead: 'Krakau ist ruhiger als Warschau: der Markt ist kleiner, weniger Wiederverkäufer und die Fahrzeuge haben häufig einen längeren Erstbesitzer. Der Süden Polens ist logistisch näher an den Balkanstaaten.'
          points:
            - Weniger Händler als in Warschau, die Historie ist normalerweise sauberer.
            - Preise sind oft niedriger als in der Hauptstadt.
            - Näher an der Route in den Süden - praktisch für den Transport nach Serbien.
