        includedHeading: Zusammensetzung des Preises
        includedLead: Bei einem Selbstimport übersteigen die Gesamtkosten oft den Preis des Autos. Wir kalkulieren im Voraus und stellen sicher, dass der Endpreis sich nicht von der ersten Schätzung unterscheidet.
        included:
          - title: Kosten des Fahrzeugs
            text: Preis nach Verhandlung, nicht der Inseratspreis. Wir verhandeln vor Ort – das deckt meist einen Teil der Kosten.
          - title: Logistik zum Zielort
            text: Autoanhänger oder Überführung mit Transitnummern. Wir kalkulieren beide Optionen und wählen die vorteilhaftere für die jeweilige Strecke.
          - title: Zölle und Steuern
            text: Der Satz hängt von dem Herkunftsland des Fahrzeugs und dessen Alter ab. Für europäische Fahrzeuge ändert das Zertifikat EUR1 die Berechnung erheblich – wir überprüfen dessen Vorhandensein vor dem Kauf.
          - title: Export und Transit
            text: Abmeldung im Verkaufsland, Exporterklärung, Transitnummern und Versicherung für die Überführung.
          - title: Zollabwicklung
            text: Erklärung, Makler und Zahlung am Ankunftsort. Wir bereiten das Paket im Voraus vor, damit das Auto nicht unnötig lange im Lager steht.
          - title: Zulassung
            text: Technische Prüfung, Registrierung und Nummernschilder. Sie nehmen das Auto ab, mit dem Sie sofort fahren können.
