        ctaLabel: Auto finden
        heroPhotoAlt: Reihe von Autos auf dem Gelände eines Händlers
        processHeading: Wie läuft die Beschaffung ab
        processLead: 'Von der Anfrage bis zu den Schlüsseln dauert es normalerweise zwischen drei Tagen und zwei Wochen. Am längsten suchen wir nach einem passenden Auto: das erste Geeignete nehmen wir nicht sofort, sondern suchen weiter, bis wir das finden, bei dem nach der Überprüfung keine Fragen offenbleiben.'
        processSteps:
          - n: '01'
            text: Wir besprechen das Budget, die Marke und die Anforderungen – was ist wichtig und worauf können Sie verzichten
          - n: '02'
            text: Wir suchen vor Ort nach Optionen und filtern telefonisch alles aus, was nicht den Anforderungen entspricht
          - n: '03'
            text: Wir fahren zur Besichtigung mit einem Lackdickenmesser und Scanner, bei BMW verbinden wir uns mit der Händler-ISTA, und machen Fotos und Videos
          - n: '04'
            text: Wir senden einen Bericht und sagen direkt, ob es sich lohnt oder ob wir weiter suchen sollten
          - n: '05'
            text: Wir handeln, schließen den Deal ab und übergeben das Auto an Sie oder bringen es zu Ihrer Tür
        includedHeading: Was in die Arbeit einfließt
        includedLead: Die Provision wird vor Beginn festgelegt und hängt nicht davon ab, wie viele Autos besichtigt werden mussten. Wenn wir nach der Überprüfung sagen 'nicht kaufen' – suchen wir weiter, dafür müssen Sie nichts extra bezahlen.
        included:
          - title: Suche ohne Beschränkung der Optionen
            text: Wir arbeiten, bis wir ein Auto finden, zu dem es keine Beanstandungen gibt. Die Ablehnung einer ungeeigneten Option gehört zur Arbeit und kostet nichts zusätzlich.
          - title: Vor-Ort-Besichtigung durch einen Experten
            text: Lackdickenmesser für die Karosserie, Scanner für die Blöcke, Hebebühne wo nötig. Fotos und Videos von allen problematischen Stellen – Sie sehen das Gleiche wie wir.
          - title: Überprüfung der Historie und rechtlichen Sauberkeit
            text: CarVertical-Bericht nach VIN, Händler-Servicehistorie nach Marke, Kilometerstand, Hypotheken, Registrierungseinschränkungen und nicht geschlossene Versicherungsschäden.
          - title: Verhandlung und Vertragsabschluss
            text: Wir vereinbaren den Preis basierend auf dem, was wir gefunden haben, bereiten die Dokumente vor und begleiten die Unterzeichnung.
          - title: Lieferung und Zulassung
            text: Wir bringen das Auto in Ihre Stadt und helfen bei der örtlichen Abwicklung – entweder übergeben wir die Schlüsseln dort, wo es Ihnen am besten passt.
          - title: Einer für den gesamten Prozess
            text: Mit Ihnen arbeitet derselbe Spezialist, der zur Besichtigung gefahren ist. Es ist nicht nötig, jedem, der ans Telefon geht, die Aufgabe erneut zu erklären.
        compareHeading: Worin sich die Märkte unterscheiden
        compareLead: Dasselbe Modell in Deutschland und Polen – in Bezug auf Historie und Preis sind das zwei verschiedene Autos.
        compareHint: Wählen Sie ein Land – wir zeigen, worauf wir dort zuerst achten.
