      citiesHeadingFor: Wo wir Autos in {countryLocation} besichtigen
      citiesLead: Der Experte fährt im ganzen Land, aber am häufigsten sehen wir Autos dort, wo sie am meisten angeboten werden. Das bedeutet Folgendes für jede Stadt.
      alsoInLabel: 'Wir suchen auch in:'
      crossSellLabel: Brauchen Sie kein lokales Auto?
      countryNotesHeadingFor: Was wir in {location} berücksichtigen
      countryNotesPointsLabel: Worauf wir zuerst achten
      countryNotes:
        de:
          lead: 'Die Auswahl hier ist größer als auf jedem anderen Markt in Europa, und die Servicehistorie ist meist nachvollziehbar: die meisten Autos haben ein Serviceheft mit Stempel des Händlers für jede Wartung. Die Kehrseite sind die Autobahnkilometer. Zweihunderttausend in drei Jahren sind hier normal und kein Grund für einen Preisnachlass.'
          points:
            - Serviceheft und Händlerstempel – wir überprüfen anhand der VIN bei einem offiziellen Service
            - HU-Protokoll, das alle TÜV nennen – wir lesen die Bemerkungen der letzten Überprüfung, nicht nur den Stempel
            - 'Autos aus Leasing und Unternehmensflotten: ordentlich gewartet, aber hohe Laufleistungen'
            - Winterstraßen mit Streumaterial – Unterboden und Schweller prüfen wir separat
        rs:
          lead: Hier sind wir vor Ort, weshalb wir das Auto am Tag der Anfrage und ohne Importbesichtigung sehen. Der Markt ist klein, dasselbe Auto wechselt oft den Besitzer, und die Geschichte muss entwirrt werden.
          points:
            - Das Auto ist bereits verzollt und hat lokale Nummernschilder – Zollgebühren und Einfuhrformalitäten sind nicht erforderlich
            - Die Laufleistung wird oft bei der Weiterveräufl von innen korrigiert – wir überprüfen mit den Stempeln des technischen Prüfberichts
            - Viele aus Deutschland und Italien importierte Autos – wir prüfen, was mit dem Auto vor dem Import passiert ist
            - Besichtigung am Tag der Anfrage, ohne auf Logistik zu warten
        es:
          lead: Milde Winter und fast keine Streumittel auf den Straßen, deswegen ist der Unterboden spanischer Autos meistens deutlich besser als bei deutschen. Allerdings schädigt die Sonne und die Nähe zum Meer den Lack, das Plastik und allen Gummi.
          points:
            - Küstenregion – Korrosion suchen wir vor allem in versteckten Hohlräumen
            - Ausgebleichter Klarlack und rissiges Innendekor – berücksichtigen wir in den Kosten
            - 'Viele ehemalige Mietwagen: gleichmäßiger Kilometerstand, aber strenge Nutzung'
            - ITV-Protokoll – wir überprüfen Bemerkungen und Prüfungsdaten
        ch:
          lead: 'Schweizer Autos sind deutlich besser gepflegt als im europäischen Durchschnitt: teure Wartung diszipliniert, die Laufleistungen sind gering. Aber die Schweiz gehört nicht zur EU, deshalb ist der Import anders und das müssen wir im Budget im Voraus einplanen.'
          points:
            - Reiche Ausstattung – hier werden sie häufiger gekauft als bei den Nachbarn
            - MFK – die Prüfung ist streng, darauf bereiten sich die Besitzer ernsthaft vor, und das sieht man dem Auto an
            - 'Nicht-EU: Zoll und Dokumente werden nicht wie für EU-Länder bearbeitet'
            - Preise sind höher als der Markt, dafür sparen Sie später bei Reparaturen
        pt:
          lead: Der Markt ist klein, die Auswahl ist bescheidener als die spanische, aber die Konkurrenz um gute Autos ist geringer. Das Klima ist feucht und salzig – Küstenauswirkungen sind sogar bei neuen Autos zu finden.
          points:
            - Feuchtigkeit und Meer – versteckte Hohlräume und Elektronik haben Vorrang bei der Inspektion
            - 'Kleiner Markt: für konkrete Anfragen suchen wir länger als in Deutschland'
            - IPO-Protokoll – wir überprüfen die Bemerkungen früherer Inspektionen
            - Viele Diesel und Kleinwagen, große Karosserien sind selten
        fr:
          lead: Frankreich bedeutet in erster Linie Diesel und eigene Marken. Peugeot, Renault und Citroën sind hier günstiger als irgendwo sonst in Europa. Deutscher Premium wiederum ist teurer, und es macht wenig Sinn, ihn hier zu kaufen.
          points:
            - Französische Marken – die besten Preise in Europa, und die Wartung ist günstiger
            - Diesel – DPF und EGR-Ventil betrachten wir als separate Position
            - Contrôle Technique – die Protokolle sind detailliert, wir überprüfen Bemerkungen über die Jahre
            - 'Städtische Nutzung: Kupplung und Federung verschleißen schneller als angegeben'
        it:
          lead: 'Der italienische Markt ist gut für Kleinwagen und seltene Ausstattungen, erfordert jedoch Vorsicht: Die Autos hier werden stark genutzt, und kleine Karosserieschäden werden nicht immer sorgfältig behoben.'
          points:
            - Stadt – häufig kleine Dellen und Nachlackierungen, ein Lackdickenmesser ist Pflicht
            - Süden und Küstenlinie bringen Salz und Korrosion, der Norden ähnelt mehr den deutschen Bedingungen
            - Revisione – wir überprüfen die Regelmäßigkeit, Auslassungen kommen häufiger vor als üblich
            - Viele Autos mit Gasanlage – wir prüfen diese separat
        pl:
          lead: 'Der nächstgelegene große Markt: Logistik ist billig und kurz. Aber Polen war jahrelang der Hauptumschlagplatz für beschädigte Autos aus Westeuropa, daher prüfen wir hier die Geschichte strenger als irgendwo sonst.'
          points:
            - Hoher Anteil an nach Unfällen wiederhergestellten Autos – Karosseriegeometrie hat Priorität
            - 'Häufige Weiterverkäufe: ein Auto wechselt oft innerhalb eines Jahres einige Besitzer'
            - Kilometerstände werden oft beim Import korrigiert – wir überprüfen mit Dienstleistungsdatenbanken
            - Kurze Transportwege – günstiger und schneller als aus Spanien oder Portugal
      closing:
        eyebrow: Wie fangen wir an?
        line1: Beschreiben Sie das Auto,
        line2: das Sie suchen –
        accentWord: danach ist unsere Arbeit
        text: Budget, Karosserie, Getriebe, ein paar Wünsche oben drauf. Wir suchen, während Sie die Berichte der Optionen anschauen und entscheiden, welches Sie persönlich ansehen möchten.
