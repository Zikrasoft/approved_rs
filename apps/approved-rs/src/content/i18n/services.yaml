      countryNotes:
        de:
          lead: 'U Nemačkoj postoje pouzdani izvori: servisna knjižica, izveštaji sa HU pregleda i razvijene baze podataka po VIN-u. Zato je provera auta pre kupovine ovde pre svega poređenje dokumentacije sa stvarnim stanjem vozila.'
          points:
            - Zapise o servisima u ovlašćenoj mreži upoređujemo sa zabeleženom kilometražom po godinama
            - 'Primedbe sa prethodnog HU pregleda: šta je popravljeno, a šta je samo ostavljeno za kasnije'
            - Podvozje i pragovi posle zimskog posipanja puteva, uključujući skrivene šupljine
            - 'Istorija lizinga: redovnost održavanja uprkos velikoj kilometraži'
        rs:
          lead: U Srbiji izlazimo na teren istog dana kada nam se javite. Glavni zadatak je da rekonstruišemo istoriju auta pre uvoza, jer domaća dokumentacija pokriva samo poslednji deo njegovog veka.
          points:
            - Zemlja porekla i stanje auta pre uvoza u Srbiju
            - Kilometraža na satu u odnosu na evidenciju tehničkih pregleda iz prethodnih godina
            - Limarske popravke posle uvoza, koje su češće i jeftinije nego u EU
            - 'Pravni status: zaloga i ograničenja za registraciju'
        es:
          lead: Automobili iz Španije uglavnom imaju dobro očuvano podvozje, ali sunce i so ostavljaju trag na drugim delovima. Zato pri pregledu auta pre kupovine veći naglasak stavljamo na skrivene šupljine, elektriku i enterijer nego na koroziju podvozja.
          points:
            - Korozija u skrivenim šupljinama kod vozila sa primorja, čak i kada podvozje izgleda čisto
            - Lak, zaptivke i plastika posle dugogodišnjeg izlaganja suncu
            - 'Prethodna upotreba u rentakaru: upoređujemo kilometražu sa tragovima habanja enterijera'
            - Izveštaj sa ITV pregleda i nedostaci koji nisu otklonjeni između pregleda
        ch:
          lead: Automobili se za MFK pregled ozbiljno pripremaju, pa svež izveštaj sam po sebi ne govori mnogo. Gledamo šta je urađeno neposredno pred pregled, a koji problemi se vuku još od prošle godine.
          points:
            - Šta je zamenjeno neposredno pred MFK i kako novi delovi izgledaju u odnosu na ostatak vozila
            - Održavanje je skupo, pa proveravamo da li su propisani servisi odlagani
            - Oprema je bogata, ali proveravamo da li svaka funkcija i dalje radi
            - 'Dokumentacija za uvoz: Švajcarska nije u EU, pa je potreban drugačiji skup dokumenata'
        pt:
          lead: Ovde je presudna vlažna primorska klima. Provera auta pre kupovine počinje od korozije i elektrike, jer najčešće otkazuju delovi stalno izloženi vlazi.
          points:
            - Skrivene šupljine, uzdužni nosači i tačke pričvršćenja vešanja
            - Oksidacija konektora i upravljačkih jedinica, čest uzrok povremenih grešaka
            - Izveštaj sa IPO pregleda i redovnost odlazaka na pregled
            - 'Dizelaši voženi po gradu: DPF filter i istorija intervencija na njemu'
        fr:
          lead: 'Francuski contrôle technique je detaljan i predstavlja dobru polaznu osnovu. Zatim proveravamo ono što taj pregled ne otkriva: preostali vek ključnih sklopova dizel motora i habanje od gradske vožnje.'
          points:
            - Primedbe sa contrôle technique pregleda po godinama i nedostaci koji se ponavljaju
            - DPF filter, EGR ventil i turbina kod dizelaša
            - Kvačilo i vešanje posle intenzivne gradske vožnje
            - 'Servisna istorija francuskih marki: delovi su dostupni, ali svaka ima svoje slabe tačke'
        it:
          lead: Automobili iz Italije češće od drugih stižu sa sitnim limarsko-farbarskim popravkama urađenim brzo i jeftino. Zato merenju debljine laka na svim panelima posvećujemo znatno više vremena nego inače.
          points:
            - Merenje debljine laka na svim panelima, tražimo tragove farbanja posle gradskih ogrebotina i čukanja
            - 'Razlike između severa i juga: uticaj soli na primorju i uobičajeno habanje u unutrašnjosti'
            - 'Plinski uređaj, ako je ugrađen: kvalitet ugradnje i stanje boce'
            - Redovnost revisione pregleda i propušteni termini
        pl:
          lead: Poljska je najveće preprodajno tržište za havarisane automobile iz Zapadne Evrope. Zato prvo utvrđujemo šta je na karoseriji rađeno pre prodaje.
          points:
            - Geometrija otvora karoserije i tragovi varenja kao pokazatelji popravke posle teškog udesa
            - 'Istorija uvoza: odakle je auto stigao i u kakvom stanju'
            - Kilometražu upoređujemo sa evropskim servisnim bazama, ne oslanjamo se samo na stanje na satu
            - Vazdušni jastuci i tragovi njihovog ranijeg aktiviranja
