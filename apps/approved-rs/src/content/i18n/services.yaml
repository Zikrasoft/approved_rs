  es:
    vehicle-sourcing:
      hub:
        metaTitle: Búsqueda y compra de coches en Europa, llave en mano
        metaDescription: Buscamos coches en Alemania, Serbia, España, Suiza, Italia, Francia, Polonia y Portugal. Inspección, negociación y entrega llave en mano.
        title: Búsqueda de coches
        titleHighlight: llave en mano
        description: Buscamos tu coche en el país donde estés o quieras comprarlo. Revisión completa, compra y entrega llave en mano. Elige un país para saber más.
        breadcrumbLabel: Búsqueda de coches
        casesHeading: Casos reales de búsqueda y compra
        chooseCountryLabel: 'Elige un país:'
        ctaLabel: Encontrar mi coche
        heroPhotoAlt: Fila de coches en la campa de un concesionario
        processHeading: Cómo buscamos tu coche
        processLead: 'Desde la solicitud hasta la entrega de llaves suelen pasar entre tres días y dos semanas. La búsqueda es lo que más tiempo lleva: no nos quedamos con el primer coche que encaje, seguimos hasta encontrar uno que supere la revisión sin objeciones.'
        processSteps:
          - n: '01'
            text: 'Hablamos del presupuesto, la marca y tus requisitos: qué es imprescindible y en qué puedes ceder'
          - n: '02'
            text: Seleccionamos coches en el mercado local y descartamos por teléfono los que no ofrecen respuestas convincentes
          - n: '03'
            text: Inspeccionamos el coche con un medidor de espesor de pintura y un equipo de diagnosis. En los BMW usamos ISTA, el sistema oficial de la marca. Hacemos fotos y vídeos
          - n: '04'
            text: Te enviamos un informe y te decimos claramente si merece la pena comprarlo o seguir buscando
          - n: '05'
            text: Negociamos el precio, tramitamos la compra y te entregamos el coche o lo llevamos a tu puerta
        includedHeading: Qué incluye el servicio
        includedLead: Acordamos una tarifa fija antes de empezar, independientemente de cuántos coches tengamos que revisar. Si tras la inspección te recomendamos no comprar, seguimos buscando sin coste adicional.
        included:
          - title: Búsqueda sin límite de candidatos
            text: Seguimos hasta encontrar un coche que supere todas las comprobaciones. Descartar uno que no esté a la altura forma parte del servicio y no tiene coste adicional.
          - title: Un experto en cada inspección
            text: 'Medimos el espesor de pintura de los paneles, hacemos una diagnosis de las unidades de control y usamos un elevador cuando hace falta. Fotografías y vídeos de cada punto problemático: ves lo mismo que nosotros.'
          - title: Comprobación del historial y de la situación legal
            text: Informe CarVertical por número de bastidor, historial de mantenimiento en la red oficial de la marca, verificación del kilometraje, cargas, restricciones de matriculación y siniestros pendientes de cierre.
          - title: Negociación y trámites de compra
            text: Negociamos el precio teniendo en cuenta lo detectado, preparamos la documentación y te acompañamos en la firma.
          - title: Entrega y matriculación
            text: Llevamos el coche a tu ciudad y te ayudamos con los trámites locales, o te entregamos las llaves donde te venga bien recogerlo.
          - title: Un único interlocutor de principio a fin
            text: Te atiende el mismo especialista que inspeccionó el coche. No tendrás que volver a explicar lo que buscas a cada persona que conteste al teléfono.
        compareHeading: Qué diferencia a cada mercado
        compareLead: El mismo modelo en Alemania y en Polonia puede ser muy distinto en historial y precio.
        compareHint: Elige un país y te mostramos qué comprobamos primero.
        compareLinkFor: 'Búsqueda de coches {location}: detalles'
      title: Búsqueda de coches llave en mano
      descriptionFor: Buscamos tu coche {location} entre los ya disponibles en el país, sin importarlo. Revisión completa, gestión de compra y entrega en tu ciudad.
      ctaLabel: Enviar solicitud
      casesHeadingFor: 'Casos reales: búsqueda de coches {location}'
      breadcrumbLabelFor: Coches {location}
      stepsFor:
        - n: '01'
          text: 'Envías una solicitud con tus requisitos: presupuesto, marca y kilometraje'
        - n: '02'
          text: Buscamos coches {location} que cumplan tus criterios
        - n: '03'
          text: Un experto independiente inspecciona y comprueba el coche
        - n: '04'
          text: Te acompañamos en la compra y te ayudamos con la documentación y los trámites
        - n: '05'
          text: Entregamos el coche en tu ciudad y te ayudamos a matricularlo
      deliveryLineFor: Entregamos el coche en cualquier ciudad del país. Si necesitas llevarlo al extranjero, nos encargamos de la exportación y del despacho de aduanas, con transporte a {destinations} y a cualquier otro país.
      deliveryDestinations:
        - Bosnia y Herzegovina
        - Croacia
        - Macedonia del Norte
        - Turquía
        - Kazajistán
        - Kirguistán
      citiesHeadingFor: Dónde inspeccionamos coches {countryLocation}
      citiesLead: Nuestro experto se desplaza por todo el país, aunque solemos inspeccionar coches donde se concentra la oferta. Esto es lo que puedes esperar en cada ciudad.
      alsoInLabel: 'También buscamos coches en:'
      crossSellLabel: ¿Prefieres importar un coche?
      countryNotesHeadingFor: Qué tenemos en cuenta {location}
      countryNotesPointsLabel: Qué comprobamos primero
      countryNotes:
        de:
          lead: 'La oferta es mayor que en cualquier otro mercado europeo y el historial de mantenimiento suele ser verificable: la mayoría de los coches tienen un libro de mantenimiento con los sellos del concesionario de cada revisión. La contrapartida son los kilómetros de autopista. Aquí, 200.000 km en tres años son normales, no un motivo para rebajar el precio.'
          points:
            - 'Libro de mantenimiento y sellos del concesionario: los contrastamos con el servicio oficial mediante el número de bastidor'
            - Informe de la inspección HU, conocida como TÜV. Leemos las observaciones de la última inspección, no nos limitamos al sello
            - 'Coches de leasing y flotas de empresa: mantenimiento regular, pero kilometrajes elevados'
            - En invierno se usan sales de deshielo, por eso revisamos a fondo los bajos y las taloneras
        rs:
          lead: 'Estamos aquí, por lo que podemos inspeccionar el coche el mismo día que nos contactas, sin necesidad de importarlo. El mercado es pequeño: un mismo coche puede pasar por varios vendedores y hay que reconstruir su historial.'
          points:
            - 'El coche ya ha pasado por aduanas y lleva matrícula local: no hay aranceles ni trámites de importación'
            - Es frecuente manipular el kilometraje al revender dentro del país; lo contrastamos con los registros de las inspecciones técnicas
            - 'Hay muchos coches importados de Alemania e Italia: comprobamos su historial anterior a la importación'
            - Inspección el mismo día de la solicitud, sin esperas por desplazamientos internacionales
        es:
          lead: Los inviernos suaves y el escaso uso de sales de deshielo hacen que los bajos de los coches españoles suelan estar bastante mejor que los de los alemanes. En cambio, el sol y la proximidad del mar castigan la pintura, los plásticos y los componentes de goma.
          points:
            - En las zonas costeras buscamos corrosión, sobre todo en las cavidades ocultas
            - Tenemos en cuenta el barniz deteriorado por el sol y los plásticos agrietados del habitáculo al valorar el coche
            - 'Muchos coches proceden de empresas de alquiler: kilometraje regular, pero uso intensivo'
            - 'Informe de ITV: contrastamos las observaciones y las fechas de las inspecciones'
        ch:
          lead: 'Los coches suizos están bastante mejor cuidados que la media europea: el alto coste del mantenimiento fomenta el cuidado y suelen tener pocos kilómetros. Pero Suiza no pertenece a la UE, así que los trámites de importación son distintos y lo tenemos en cuenta desde el presupuesto inicial.'
          points:
            - Equipamientos completos, más habituales aquí que en los países vecinos
            - 'MFK: una inspección exigente que los propietarios preparan a conciencia, y eso se nota en el coche'
            - 'Fuera de la UE: el despacho de aduanas y la documentación difieren de los de países comunitarios'
            - Precios por encima del mercado, pero con ahorro posterior en reparaciones
        pt:
          lead: Es un mercado pequeño, con menos oferta que el español, pero también con menos competencia por los buenos coches. El clima húmedo y salino provoca corrosión costera incluso en vehículos recientes.
          points:
            - Por la humedad y el mar, damos prioridad a las cavidades de la carrocería y al sistema eléctrico
            - 'Mercado pequeño: encontrar una configuración concreta lleva más tiempo que en Alemania'
            - 'Informe IPO: revisamos las observaciones de inspecciones anteriores'
            - Abundan los diésel y los coches de pequeña cilindrada; los modelos grandes son poco frecuentes
        fr:
          lead: Francia es, ante todo, un mercado de diésel y marcas nacionales. Peugeot, Renault y Citroën son aquí más baratos que en cualquier otro país europeo. Los modelos prémium alemanes, en cambio, son más caros y rara vez compensa comprarlos aquí.
          points:
            - Marcas francesas al mejor precio de Europa y con un mantenimiento más económico
            - En los diésel, revisamos por separado el filtro de partículas y la válvula EGR
            - 'Contrôle technique: informes detallados cuyas observaciones contrastamos año a año'
            - 'Uso urbano: el embrague y la suspensión pueden presentar más desgaste del declarado'
        it:
          lead: 'El mercado italiano destaca por los coches de pequeña cilindrada y las configuraciones poco comunes, pero exige cautela: los vehículos suelen tener un uso intensivo y las pequeñas reparaciones de carrocería no siempre están bien hechas.'
          points:
            - 'Uso urbano, pequeños golpes y retoques frecuentes: el medidor de espesor de pintura es imprescindible'
            - En el sur y la costa, sal y corrosión; en el norte, condiciones más parecidas a las alemanas
            - 'Revisione: comprobamos la periodicidad, ya que es más habitual encontrar inspecciones omitidas'
            - Muchos coches llevan instalación de gas, que revisamos por separado
        pl:
          lead: Es el gran mercado más cercano a nosotros, con un transporte rápido y económico. Pero durante años Polonia ha sido el principal punto de paso de coches siniestrados de Europa occidental, así que comprobamos su historial con más rigor que en ningún otro país.
          points:
            - 'Alta proporción de coches reparados tras accidentes: la geometría de la carrocería es prioritaria'
            - 'Reventas frecuentes: un coche puede pasar por varios propietarios en un año'
            - El kilometraje se manipula a menudo durante la importación; lo contrastamos con bases de datos de mantenimiento
            - Trayecto de entrega corto, más barato y rápido que desde España o Portugal
      closing:
        eyebrow: ¿Por dónde empezamos?
        line1: Cuéntenos qué coche
        line2: está buscando,
        accentWord: del resto nos encargamos nosotros
        text: Presupuesto, carrocería, cambio y alguna preferencia más. Nosotros buscamos; usted revisa los informes de las opciones y decide cuál quiere que inspeccionemos en persona.
