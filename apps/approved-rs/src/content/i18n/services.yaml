    vehicle-inspection:
      title: Inspección de vehículos
      description: Inspección independiente del automóvil antes de la compra. Visita de un experto, diagnóstico, informe — sin obligación de compra.
      ctaLabel: Solicitar inspección
      casesHeading: Casos de inspección
      breadcrumbLabel: Inspección de vehículos
      steps:
        - n: '01'
          text: Carrocería y pintura — presencia de reparaciones o accidentes
        - n: '02'
          text: Suspensión, frenos y tren de rodaje
        - n: '03'
          text: Motor, transmisión y caja de cambios
        - n: '04'
          text: Electrónica y historial de servicio por VIN
        - n: '05'
          text: Legalidad — gravámenes, prohibiciones de registro, accidentes
      extraLine: Operamos también en otros países de Europa, incluyendo Portugal, — consulte al realizar su solicitud.
      hub:
        metaTitle: Inspección de vehículos antes de la compra en Europa
        metaDescription: 'Asistimos al automóvil que usted encontró: medidor de grosor, escáner, verificación de historial por VIN e informe con fotos el mismo día. Operamos en ocho países de Europa.'
        title: Inspección de vehículos
        titleHighlight: antes de la compra
        description: "Asistimos al automóvil que usted encontró y le contamos lo que realmente tiene. El informe llega antes de que usted pague: si el resultado es 'no lo compre', solo pierde el costo de la inspección."
        breadcrumbLabel: Inspección de vehículos
        casesHeading: Casos de inspección
        chooseCountryLabel: 'Seleccione un país:'
        ctaLabel: Solicitar inspección
        heroPhotoAlt: Automóvil en elevador en el taller
        processHeading: Cómo se lleva a cabo la inspección
        processLead: Generalmente, asistimos dentro de uno o dos días después de la solicitud. La inspección en sí toma una hora y media a dos horas, y el informe lo enviamos el mismo día, mientras el automóvil aún está disponible.
        processSteps:
          - n: '01'
            text: Envía el enlace del anuncio y los contactos del vendedor
          - n: '02'
            text: Acordamos con el vendedor el tiempo y lugar de la inspección
          - n: '03'
            text: Asistimos con un medidor de grosor y escáner, para BMW conectamos el ISTA de concesionario, si es necesario — en el elevador
          - n: '04'
            text: Tomamos fotos y videos de todos los hallazgos, verificamos el historial por VIN
          - n: '05'
            text: Enviamos el informe y una respuesta directa — comprar, regatear o rechazar
        includedHeading: Qué incluye la inspección
        includedLead: 'Más de cien puntos en la lista de verificación, pero casi siempre son cuatro áreas las que deciden: carrocería, motor con caja de cambios, tren de rodaje y documentos. Es por estas áreas que con mayor frecuencia disuadimos de la compra.'
        included:
          - title: Carrocería y pintura
            text: Medidor de grosor en cada panel, geometría de las aberturas, huellas de soldaduras y masillas. Se puede ver si hubo reparaciones que el vendedor no mencionó.
          - title: Motor y caja de cambios
            text: Parámetros en el motor caliente, adaptaciones de la caja de cambios, errores en la memoria de los bloques. La área más costosa y la razón más común para rechazar.
          - title: Tren de rodaje y frenos
            text: Juegos, estado de la suspensión y sistema de frenos. El kilometraje de autopista y las carreteras balcánicas desgastan el vehículo de manera diferente, y eso se nota.
          - title: Electrónica e historial por VIN
            text: Informe de CarVertical, historial de servicio del concesionario por marca, discrepancias de kilometraje con el historial, errores de bloques y huellas de bolsas de aire activadas.
          - title: Legalidad
            text: Gravámenes, prohibiciones de registro, accidentes no cerrados y eventos de seguros — temas que surgen solo después de la compra.
          - title: Informe con fotos y videos
            text: Cada hallazgo está grabado y documentado. El informe se queda con usted — es útil para negociar, incluso si finalmente decide comprar el auto.
        compareHeading: Qué cambia de país a país
        compareLead: Regulaciones de inspección, fallas típicas de los vehículos locales y métodos para ocultar el historial en todas partes.
        compareHint: Seleccione un país — le mostraremos qué añadimos a la lista de verificación habitual.
        compareLinkFor: Inspección {location} — detalladamente
        mapHeading: Cuatro áreas que deciden el trato
        mapLead: La lista de verificación es larga, pero casi siempre disuadimos en una de las cuatro áreas. Presione el número en el esquema — le mostraremos qué observa el experto y qué hemos encontrado allí.
      countryNotesHeadingFor: Cómo inspeccionamos {location}
      countryNotesPointsLabel: Qué verificamos más allá de la lista de verificación habitual
      countryNotes:
        de:
          lead: 'En Alemania hay mucho en lo que basarse: libro de servicio, protocolos de HU y bases de datos de VIN bien desarrolladas. Por eso, la inspección aquí es, ante todo, una comparación de documentos con lo que muestra el automóvil.'
          points:
            - Comparamos las marcas del mantenimiento del concesionario con las lecturas del odómetro por años
            - Observaciones pasadas del HU — qué fue reparado después de la inspección y qué simplemente se omitió
            - Suelo y umbrales después de los reactivos invernales, incluyendo compartimentos ocultos
            - 'Historia de arrendamiento: mantenimiento uniforme con alto kilometraje'
        rs:
          lead: 'En Serbia, asistimos en el día de la consulta. La principal tarea es reconstruir la historia del automóvil hasta su entrada: los documentos locales solo muestran el último fragmento de la vida del automóvil.'
          points:
            - País de origen y estado del automóvil antes de su entrada a Serbia
            - Lectura del odómetro en comparación con las marcas de la inspección técnica en años anteriores
            - Reparaciones carroceras después de la entrada — se realizan con más frecuencia y a menor costo que en la UE
            - 'Parte legal: gravámenes y restricciones de registro'
        es:
          lead: Los coches españoles suelen ser buenos en el chasis y decepcionan en todo lo que sufre del sol y la sal. Tenemos que cambiar la inspección de corrosión inferior a los compartimentos ocultos, la electrónica y el estado del interior.
          points:
            - Corrosión en compartimentos ocultos en la costa — puede estar limpio por debajo
            - Pintura, sellado y plásticos después de años de sol
            - 'Historia de alquiler: comparamos el kilometraje con el tipo de desgaste del interior'
            - Protocolo ITV y lo que quedó sin cerrar entre inspecciones
        ch:
          lead: Los vehículos en preparación para MFK reciben un trato serio, por lo que un protocolo reciente, por sí solo, no dice mucho. Observamos lo que se hizo exactamente antes de la inspección y qué ha estado funcionando desde el año pasado.
          points:
            - Qué se reemplazó directamente antes del MFK — piezas nuevas en contraste con el resto
            - El mantenimiento es costoso, por lo que verificamos si se ha pospuesto algo
            - La configuración es rica, pero verificamos si cada opción aún funciona
            - 'Documentos para la entrada: Suiza no es la UE, el conjunto es diferente'
        pt:
          lead: 'Aquí todo depende del clima marino húmedo. Comenzamos la inspección con corrosión y electrónica: generalmente es lo que falla al vivir en la humedad.'
          points:
            - Compartimentos ocultos, largueros y puntos de anclaje de la suspensión
            - Oxidación de conectores y módulos — una causa común de errores intermitentes
            - Protocolo IPO y regularidad en las inspecciones
            - 'Diesel con uso urbano: filtro de partículas y su historia'
        fr:
          lead: 'En Francia, hay un contrôle technique detallado, y este es un buen punto de partida. Luego, observamos lo que la regulación no detecta: la durabilidad del grupo diésel y el desgaste por el tráfico urbano.'
          points:
            - Observaciones del contrôle technique por años — qué se repite de inspección a inspección
            - Filtro de partículas, EGR y turbocompresor en diésel
            - Embrague y suspensión después de un denso ciclo urbano
            - 'Historia de marcas francesas: repuestos disponibles, pero con sus puntos débiles'
        it:
          lead: Los coches italianos llegan a menudo con pequeñas reparaciones de carrocería, hechas rápida y baratamente. En estos vehículos se tarda notablemente más en utilizar el medidor de grosor en los paneles.
          points:
            - Medidor de grosor en todos los paneles — retoques después de golpes urbanos
            - 'La diferencia entre el norte y el sur: sal en la costa, desgaste habitual en el interior del país'
            - Equipos de gas, si están presentes — instalación y estado del tanque
            - Regularidad en la revisione y períodos faltantes
        pl:
          lead: Polonia es el mayor mercado de transbordo para vehículos dañados de Europa Occidental. Por lo tanto, lo primero que investigamos es lo que se ha hecho con esta carrocería antes de la venta.
          points:
            - Geometría de las aberturas y huellas de soldadura — restauración después de un accidente grave
            - 'Historia de importación: de dónde vino el coche y en qué estado'
            - Comparamos el kilometraje con las bases de datos de servicio europeas, no confiamos en el odómetro
            - Bolsas de aire y su activación en el pasado
      closing:
        eyebrow: ¿Encontró un coche?
        line1: Envíe el enlace
        line2: del anuncio —
        accentWord: iremos a verlo
        text: Asistimos en uno o dos días. El informe con fotos se queda con usted, incluso si después decide no comprar.
    cityVehicleSourcing:
      title: Selección de coches
      descriptionFor: Buscamos el coche en {cityLocation} con una revisión completa. Trabajamos en toda la región de {countryName}.
      casesHeadingFor: Casos de {countryGenitiveOrName}
      whyCityHeadingFor: Por qué {cityName}
      reason1: Revisamos tanto concesionarios como anuncios privados
      reason2: Verificamos el historial por VIN antes de salir a la inspección
      reason3For: Nuestro experto en {cityLocation}
      reason4Dekra: Inspección de DEKRA / TÜV a pedido
      reason4Generic: Inspección técnica independiente a pedido
      otherCitiesLabelFor: 'Otras ciudades en {countryLocation}:'
      cityNotesHeadingFor: El mercado automovilístico en {cityLocation}
      cityNotesPointsLabel: Qué significa esto en la práctica
      cityNotes:
        berlin:
          lead: 'Berlín tiene la mayor selección en Alemania y una variedad colorida de vendedores. Aquí puedes encontrar de todo: coches de flotas corporativas con un historial completo y opciones de reventa que llegan de Europa del Este.'
          points:
            - Amplia selección en cualquier segmento, incluyendo configuraciones raras
            - 'Muchos vendedores privados: las negociaciones son más reales que con los concesionarios'
            - 'Ciclo urbano: el embrague y la suspensión se desgastan más que en coches de carretera'
        munich:
          lead: 'Una ciudad cara con coches caros. La gama de vehículos premium aquí es más alta que en cualquier otra parte de Alemania, y el estado promedio es superior: se cuida bien de estos coches.'
          points:
            - Fuerte segmento premium, especialmente BMW y Mercedes
            - Coches bien cuidados con historial completo de concesionario
            - 'Precios más altos que el promedio nacional: el ahorro se basa en el estado'
        hamburg:
          lead: Ciudad portuaria y gran centro logístico. Desde aquí es conveniente enviar coches más allá, y en el mercado suelen aparecer coches importados frescos.
          points:
            - El puerto cercano facilita y abarata el envío
            - Muchos coches de regiones del norte con kilometrajes de carretera
            - 'Clima marino húmedo: revisamos la carrocería y los espacios ocultos con más cuidado'
        belgrade:
          lead: Nuestra base. En Belgrado, realizamos la inspección el día de la consulta, conocemos a los vendedores locales y vemos qué coche ha estado en el mercado durante dos meses.
          points:
            - Inspección el mismo día, sin esperas ni logística
            - Conocemos los mercados locales y la historia de los coches que están allí
            - El coche ya está despachado, no se necesitan gastos de importación ni aranceles
        novi-sad:
          lead: La segunda ciudad más grande de Serbia, a una hora en coche de Belgrado. El mercado es más pequeño, pero los precios generalmente son más tranquilos que en la capital, y los coches rara vez han pasado por varias reventas.
          points:
            - Precios más bajos que en Belgrado con condiciones comparables
            - Menos revendedores, es más común encontrar el primer propietario
            - Salimos de Belgrado, sin cargo adicional por el viaje
        pancevo:
          lead: Pancevo forma parte de la aglomeración de Belgrado, por lo que la inspección aquí no difiere de la capital. El mercado es pequeño, pero los anuncios privados son más interesantes.
          points:
            - 'Veinte minutos de Belgrado: salimos igual de rápido'
            - Mercado pequeño con predominio de vendedores privados
            - A menudo más barato que la capital con el mismo estado
        subotica:
          lead: 'Subotica está en la frontera con Hungría, y eso se nota en el mercado: muchos coches importados de la UE y vendedores que se dedican a esto continuamente.'
          points:
            - 'Mercado fronterizo: mucho nuevo importado de la Unión Europea'
            - Verificamos el historial hasta la importación de forma especial
            - Punto conveniente si planeas llevar el coche más al norte
        madrid:
          lead: 'El mercado de la capital de España: la mayor selección del país y muchos coches de flotas corporativas. Clima continental, por lo que hay menos corrosión marina que en la costa.'
          points:
            - La mayor selección en España, incluyendo coches corporativos
            - 'Lejos del mar: la carrocería suele estar más limpia que los coches costeros'
            - Verificamos por separado plástico, laca y aire acondicionado en el caluroso verano
        barcelona:
          lead: Todo depende de la proximidad al mar. Los coches a menudo se ven perfectamente por debajo, pero requieren atención a los espacios ocultos y la electricidad.
          points:
            - 'El mar está cerca, por lo que revisamos los espacios ocultos: por debajo a menudo está limpio, pero por dentro no'
            - Muchos coches de alquiler antiguos y de carsharing
            - Puerto cercano, el envío por mar es más fácil de organizar
        zurich:
          lead: Zúrich es el mercado automovilístico más caro de la región. Aquí se eligen las configuraciones más altas, se mantienen en concesionarios, y se venden antes de que el coche se desgaste.
          points:
            - Configuraciones máximas y pocos kilometrajes
            - 'Mantenimiento por concesionarios: el historial casi siempre está completo'
            - Suiza no está en la UE, la importación se gestiona por separado
        geneva:
          lead: Ginebra se encuentra en la parte francófona de Suiza, justo en la frontera con Francia. Hay muchas más marcas francesas en el mercado que en la parte alemana del país.
          points:
            - 'Mercado mixto: estado suizo, variedad francesa'
            - 'La frontera con Francia está cerca: hay precios comparativos'
            - 'La regulación es la misma que en toda Suiza: exportación más importación'
        paris:
          lead: 'La mayor selección en Francia viene con el uso más intenso: el tráfico denso y los aparcamientos estrechos dejan huellas en la carrocería y la suspensión.'
          points:
            - La mayor selección en Francia, especialmente de marcas francesas
            - 'Ciclo urbano: desgaste en el embrague, suspensión y daños menores en la carrocería'
            - 'Muchos diéseles: revisamos el filtro de partículas y el EGR como una prioridad'
        lyon:
          lead: Lyon es más tranquilo que París tanto en precios como en el estado de los coches. La carretera hacia el sur está cerca, por lo que es más común encontrar coches con un kilometraje más suave.
          points:
            - Precios más bajos que en París con una selección comparable
            - Más kilometrajes de carretera, menos desgaste urbano
            - Punto conveniente hacia Italia y España, si estamos buscando más
        milan:
          lead: 'La capital comercial de Italia, y esto se nota en el mercado. El norte del país se asemeja más a las condiciones alemanas: carreteras mejores, coches mejor cuidados que en el sur.'
          points:
            - La mejor selección en el segmento premium en Italia
            - En el norte hay menos sal y corrosión que en el sur
            - 'Ciudad densa: un medidor de grosor es obligatorio'
        rome:
          lead: Un gran mercado con un uso urbano muy intenso. Los pequeños rasguños aquí se consideran parte de la vida cotidiana, y a menudo se reparan de forma apresurada.
          points:
            - Muchos coches de bajo consumo y vehículos con gas
            - 'Frecuentes retoques después de contactos urbanos: revisamos cada panel'
            - Al sur de Milán, el clima es más suave, pero más cerca del mar
        warsaw:
          lead: A través de Varsovia, llega la mayor parte de la importación desde Europa Occidental, y aquí está la mayor selección en Polonia. La proporción de coches reconstruidos también es la más alta.
          points:
            - La mayor selección en Polonia, mucho nuevo importado de la UE
            - Verificamos la geometría de la carrocería y las señales de reparación como una prioridad
            - 'Costo de entrega corto: más barato que desde el sur de Europa'
        krakow:
          lead: 'Cracovia es más tranquila que Varsovia: el mercado es más pequeño, hay menos reventas, y los coches suelen tener un solo propietario por más tiempo. El sur de Polonia está más cerca de los Balcanes en logística.'
          points:
            - Menos revendedores que en Varsovia, la historia suele ser más limpia
            - Los precios son a menudo más bajos que en la capital
            - 'Más cerca de la ruta hacia el sur: conveniente para la entrega a Serbia'
