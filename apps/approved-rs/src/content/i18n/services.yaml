    vehicle-inspection:
      title: Car Inspection
      description: Independent car inspection before purchase. Expert visit, diagnostics, report — no obligation to buy.
      ctaLabel: Order an inspection
      casesHeading: 'Real deals: inspection before purchase'
      breadcrumbLabel: Car Inspection
      steps:
        - n: '01'
          text: Body and paintwork — check for repairs or accidents
        - n: '02'
          text: Chassis, suspension, brakes
        - n: '03'
          text: Engine, transmission, gearbox
        - n: '04'
          text: Electronics and service history by VIN
        - n: '05'
          text: Legal clearance — liens, registration bans, accidents
      extraLine: We also operate in other European countries, including Portugal — please clarify upon request.
      hub:
        metaTitle: Car inspection before purchase in Europe
        metaDescription: 'We come to inspect the car you found yourself: thickness gauge, scanner, VIN history check, and report with photos the same day. We work in eight countries across Europe.'
        title: Car Inspection
        titleHighlight: before purchase
        description: "We come to inspect the car you found yourself and tell you the real condition. The report arrives before you hand over your money: if the advice is 'don't buy', you only lose the cost of the inspection."
        breadcrumbLabel: Car Inspection
        casesHeading: 'Real deals: inspection before purchase'
        chooseCountryLabel: 'Select a country:'
        ctaLabel: Order an inspection
        heroPhotoAlt: Car on a lift in service
        processHeading: How the inspection is carried out
        processLead: Usually we visit within one to two days after the request. The inspection itself takes an hour and a half to two hours, and we send the report the same day, while the car is still available.
        processSteps:
          - n: '01'
            text: You send a link to the listing and seller's contact details
          - n: '02'
            text: We agree with the seller on time and place of inspection
          - n: '03'
            text: We arrive with a thickness gauge and scanner, connecting to BMW’s ISTA if needed, and a lift if necessary
          - n: '04'
            text: We take photos and videos of all findings, and check the history by VIN
          - n: '05'
            text: We send the report and a direct response — buy, negotiate, or reject
        includedHeading: What is included in the inspection
        includedLead: 'More than a hundred checklist items, but almost always four areas decide: body, engine with gearbox, chassis, and documents. These are the areas where we most often advise against purchase.'
        included:
          - title: Body and paintwork
            text: Thickness gauge on each panel, geometry of openings, traces of welding and filler. It shows if there was a repair that the seller did not mention.
          - title: Engine and gearbox
            text: Parameters on a warmed-up engine, gearbox adaptations, errors in memory blocks. The most expensive area and the most common reason for rejection.
          - title: Chassis and brakes
            text: Clearances, condition of the suspension and brake system. Highway mileage and Balkan roads wear cars differently, and this is evident.
          - title: Electronics and VIN history
            text: CarVertical report, dealer service history by make, mileage discrepancies, module errors, and airbag deployment traces.
          - title: Legal Clarity
            text: Liens, registration restrictions, unresolved accidents, and insurance claims are issues that may arise after purchase.
          - title: Report with Photos and Videos
            text: Each finding is photographed and labeled. The report remains with you, making negotiations easier, even if you decide to proceed with the purchase.
        compareHeading: What Changes from Country to Country
        compareLead: Regulations for inspections, common issues with local cars, and ways to hide histories vary everywhere.
        compareHint: Select a country — we'll show you what we add to the standard checklist.
        compareLinkFor: Inspection in {location} — in detail
        mapHeading: Four Areas That Decide the Deal
        mapLead: The checklist is long, but we often dissuade purchases based on one of four areas. Click on a number in the diagram — we'll show what the expert checks and what we've found there.
      countryNotesHeadingFor: How We Inspect {location}
      countryNotesPointsLabel: What We Check Beyond the Standard Checklist
      countryNotes:
        de:
          lead: "Germany has a solid foundation: service book, HU records, and well-developed VIN databases. Thus, inspections here primarily involve comparing documents with the vehicle's actual condition."
          points:
            - We verify dealer service marks against odometer readings over the years
            - Notes from past HUs — what was repaired after inspection and what was just postponed
            - Undercarriage and sills after winter reagents, including hidden cavities
            - 'Leasing history: consistent maintenance despite high mileage'
        rs:
          lead: In Serbia, we can be on-site the same day you contact us. Our main goal is to restore the car's history prior to import, as local documents only show the most recent chapter of the vehicle's life.
          points:
            - Country of origin and vehicle condition prior to import to Serbia
            - Odometer readings versus техпреглед marks from past years
            - Body repairs after import — these are often done more cheaply and frequently than in the EU
            - 'Legal aspects: liens and registration restrictions'
        es:
          lead: Spanish cars typically impress with their undercarriage but disappoint with items suffering from sun and salt. We shift the focus of our inspections from corrosion underneath to hidden cavities, electrics, and interior condition.
          points:
            - Corrosion in hidden cavities along the coast — the underside may look clean
            - Paint, seals, and plastics after years of sunshine
            - 'Rental history: we compare mileage with the wear pattern of the interior'
            - ITV record and any outstanding issues between inspections
        ch:
          lead: In Switzerland, vehicles are prepared seriously for MFK, so a fresh protocol alone doesn’t convey much. We look at what was done right before the inspection and what has persisted from last year.
          points:
            - What was replaced right before MFK — fresh parts against the old ones
            - Maintenance is costly, so we check for any postponed services
            - High-specification, but we verify that every option still works
            - 'Import documents: Switzerland is not in the EU, so the requirements differ'
        pt:
          lead: Everything here revolves around the humid coastal climate. We begin inspections with corrosion and electrics, as issues often stem from moisture.
          points:
            - Hidden cavities, side rails, and suspension mounting points
            - Oxidation of connectors and modules — a common cause of sporadic errors
            - IPO records and the regularity of inspections
            - 'Diesels from city use: particulate filters and their history'
        fr:
          lead: 'In France, detailed contrôle technique serves as a strong starting point. From there, we look into aspects that regulations might overlook: diesel group resources and wear from urban traffic.'
          points:
            - Observations from contrôle technique over the years — what recurs from inspection to inspection
            - Particulate filter, EGR, and turbo for diesels
            - Clutch and suspension after heavy urban use
            - 'History of French brands: accessible spare parts, but with specific weaknesses'
        it:
          lead: Italian cars often arrive with minor body repairs done quickly and cheaply. Here, a thickness gauge takes noticeably more time than usual across the panels.
          points:
            - Thickness gauge across all panels — touch-ups from urban bumps
            - 'Difference between north and south: salt along the coast, normal wear inland'
            - Gas equipment, if installed — setup and cylinder condition
            - Regularity of revisione and missed periods
        pl:
          lead: Poland is the largest transit market for damaged cars from Western Europe. Hence, we first investigate what has been done with the body before sale.
          points:
            - Geometry of openings and welding traces — restoration after serious accidents
            - 'Import history: where the car came from and in what condition'
            - We check mileage against European service records, we don’t trust the odometer
            - Airbags and their deployment history
      closing:
        eyebrow: Found a car?
        line1: Send us the link
        line2: to the listing —
        accentWord: we’ll come and check it out
        text: We’ll be out in one to two days. The report with photos stays with you, even if you choose to decline the purchase afterward.
    cityVehicleSourcing:
      title: Car Sourcing
      descriptionFor: We’ll help you find a car in {cityLocation} with a complete inspection. We operate throughout the {countryName} region.
      casesHeadingFor: Real Transactions in the {countryGenitiveOrName} Market
      whyCityHeadingFor: Why {cityName}
      reason1: We check both dealer lots and private ads
      reason2: We verify the VIN history before heading out for the inspection
      reason3For: Our expert in {cityLocation}
      reason4Dekra: DEKRA / TÜV inspection upon request
      reason4Generic: Independent technical expertise upon request
      otherCitiesLabelFor: 'Other cities in {countryLocation}:'
      cityNotesHeadingFor: The Automotive Market in {cityLocation}
      cityNotesPointsLabel: What This Means in Practice
      cityNotes:
        berlin:
          lead: "Berlin offers the largest selection in Germany, with the most diverse mix of sellers. You'll find everything here: cars from corporate fleets with full histories, as well as dealer options from Eastern Europe."
          points:
            - Huge variety in every segment, including rare configurations
            - Many private sellers — negotiation is more genuine than with dealers
            - 'City driving: tires and suspension wear out more noticeably than in highway cars'
        munich:
          lead: 'An expensive city with expensive cars. The premium segment here is larger than anywhere else in Germany, and the overall condition is usually better: these vehicles are well-maintained.'
          points:
            - Strong premium segment, especially BMW and Mercedes
            - Well-kept cars with complete dealership histories
            - Prices are above the national average — savings come from condition
        hamburg:
          lead: A port city and major logistics hub. It's convenient to ship cars from here, and you'll often find fresh imported vehicles on the market.
          points:
            - The port is nearby — easier and cheaper to arrange shipping
            - Many vehicles from northern regions with highway mileage
            - 'Humid maritime climate: we inspect the body and hidden cavities more carefully'
        dusseldorf:
          lead: The center of North Rhine-Westphalia, Germany's most densely populated state. Lots are crowded, and the border with the Netherlands and Belgium is just an hour away, so cars for sale frequently cross over.
          points:
            - We can check several cars in one trip — the lots are close to each other
            - 'Some listings have Dutch and Belgian plates: we check their histories and documents separately'
            - There are many sellers competing against each other — negotiations are more dynamic
        belgrade:
          lead: Our base. In Belgrade, we inspect cars the same day you contact us, we know local sellers, and we can see which cars have been circulating the lots for two months.
          points:
            - Inspection on the same day, no waiting or logistics
            - We know local lots and the histories of the cars on them
            - The car is already customs-cleared — no import duties or tariffs needed
        novi-sad:
          lead: The second largest city in Serbia, one hour’s drive from Belgrade. The market is smaller, but prices are usually calmer than in the capital, and cars have typically gone through fewer resales.
          points:
            - Prices are lower than in Belgrade for comparable condition
            - Fewer resellers, more first-time owners
            - We drive from Belgrade, with no extra charge for travel
        pancevo:
          lead: Pancevo is practically part of the Belgrade urban area, so our inspections here are similar to those in the capital. The market is small, but private listings can be quite interesting.
          points:
            - Twenty minutes from Belgrade — we can get out quickly
            - A small market with a predominance of private sellers
            - Often cheaper than the capital for the same condition
        subotica:
          lead: 'Subotica is on the border with Hungary, and you can see this in the market: lots of cars imported from the EU and sellers who specialize in this.'
          points:
            - Border market — lots of fresh imports from the European Union
            - We carefully check histories before import
            - Convenient location if you're planning to continue north with the vehicle
        madrid:
          lead: 'The capital market of Spain: the largest selection in the country and many vehicles from corporate fleets. The continental climate means less coastal corrosion here than on the coast.'
          points:
            - The largest selection in Spain, including corporate vehicles
            - Far from the sea — typically cleaner bodies than coastal cars
            - 'Hot summers: we check plastic parts, paint, and air conditioning carefully'
        barcelona:
          lead: Proximity to the sea influences everything. Cars often look great underneath, but require attention to hidden cavities and electrical systems.
          points:
            - 'With the sea nearby, we inspect hidden areas: underneath is often clean but the insides may not be'
            - Many ex-rental and car-sharing vehicles
            - The port is close, making shipping by sea easier
        zurich:
          lead: Zurich has the priciest auto market in the region. Here, buyers opt for top configurations, maintain them at dealerships, and sell them before they can show significant wear.
          points:
            - Top configurations and low mileage
            - Dealer servicing — almost always has a complete history
            - Switzerland is not in the EU, import is handled separately
        geneva:
          lead: Geneva is located in the French-speaking part of Switzerland, very close to the French border. There are noticeably more French brands on the market than in the German part of the country.
          points:
            - 'Mixed market: Swiss quality with a French selection'
            - The border with France is nearby — prices can be compared
            - 'The procedure is the same as throughout Switzerland: export plus import'
        paris:
          lead: 'France’s largest selection comes with the toughest usage: dense traffic and tight parking take their toll on the body and suspension.'
          points:
            - The largest selection in France, especially for French brands
            - 'City driving: tires, suspension, and minor body damage'
            - Many diesels — we check the particulate filter and EGR first
        lyon:
          lead: Lyon is calmer than Paris, both in terms of prices and condition. The highway to the south is close, so you’ll more likely find vehicles with steady highway mileage.
          points:
            - Prices are lower than in Paris with comparable selection
            - More highway mileage, less urban wear
            - Convenient access to Italy and Spain, if you’re looking further
        milan:
          lead: "Italy's business capital, which is reflected in the market prices. The north of the country is closer to German conditions: better roads and better-maintained cars than in the south."
          points:
            - The best selection of premium vehicles in Italy
            - The north has less salt and corrosion than the south
            - 'A dense city: a thickness gauge for panels is essential'
        rome:
          lead: A large market with very dense urban utilization. Minor scratches here are considered a part of life, and they're often repaired quickly.
          points:
            - Many small cars and vehicles with gas equipment
            - Frequent touch-ups from urban encounters — we check every panel
            - South of Milan — the climate is milder, but closer to the sea
        warsaw:
          lead: Warsaw is the main entry point for imports from Western Europe, and it also offers the largest selection in Poland. The share of restored vehicles is the highest here as well.
          points:
            - The largest selection in Poland, lots of fresh imports from the EU
            - We primarily check the body geometry and signs of repair
            - Shorter delivery distances — cheaper than from Southern Europe
        krakow:
          lead: 'Krakow is calmer than Warsaw: the market is smaller, there are fewer resales, and cars often stay with one owner for longer. Southern Poland is closer to the Balkans logistically.'
          points:
            - Fewer resellers than in Warsaw, the history is usually cleaner
            - Prices are often lower than in the capital
            - Closer to the route to the south — convenient for delivery to Serbia
