        includedHeading: Was die Kosten ausmacht
        includedLead: 'Bei eigenem Import übersteigt häufig der Betrag, was die Kosten des Fahrzeugs übersteigt. Wir berechnen dies im Voraus und legen es fest: das Endergebnis soll nicht vom ersten Angebot abweichen.'
        included:
          - title: Preis des Fahrzeugs
            text: Der Preis nach dem Feilschen, nicht der aus dem Angebot. Wir verhandeln mit dem Fahrzeug in der Hand bei der Besichtigung — das rentiert sich in der Regel und kompensiert einen Teil der Kosten.
          - title: Logistik zum Zielort
            text: Transporter oder Selbstüberführung mit Transitkennzeichen. Wir berechnen beide Optionen und wählen die günstigste für die jeweilige Strecke aus.
