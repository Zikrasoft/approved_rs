      hub:
        metaTitle: Provera automobila pre kupovine u Evropi
        metaDescription: 'Dolazimo do automobila koji ste sami pronašli: merač debljine, skener, provera istorije po VIN-u i izveštaj sa fotografijama istog dana. Radimo u osam evropskih zemalja.'
        title: Provera automobila
        titleHighlight: pre kupovine
        description: 'Dolazimo do automobila koji ste sami pronašli i objašnjavamo šta je s njim zapravo. Izveštaj dolazi pre nego što predate novac: ako je odgovor „ne uzimajte“, gubite samo troškove provere.'
        breadcrumbLabel: Provera automobila
        casesHeading: Slučajevi provere
        chooseCountryLabel: 'Odaberite zemlju:'
        ctaLabel: Zatražite proveru
        heroPhotoAlt: Automobil na dizalici u servisu
        processHeading: Kako se odvija provera
        processLead: Obično dolazimo unutar jednog do dva dana nakon prijave. Samo gledanje traje sat i po do dva, a izveštaj šaljemo istog dana, dok automobil još nije prodat drugom kupcu.
        processSteps:
          - n: '01'
            text: Šaljete link na oglas i kontakt informacije prodavca
          - n: '02'
            text: Dogovaramo se sa prodavcem o vremenu i mestu provere
          - n: '03'
            text: Dolazimo sa meračem debljine i skenerom, za BMW povezujemo se s dealer-ovim ISTA, po potrebi — na dizalicu
          - n: '04'
            text: Snimamo fotografije i video svih nalaza, proveravamo istoriju po VIN-u
          - n: '05'
            text: Šaljemo izveštaj i trenutni odgovor — uzeti, pregovarati ili odustati
        includedHeading: Šta je uključeno u proveru
        includedLead: 'Preko sto stavki na kontrolnoj listi, ali se gotovo uvek odlučuju četiri oblasti: karoserija, motor sa menjačem, osovina i dokumentacija. Tačno po njima najčešće odrađujemo odustajanje od kupovine.'
        included:
          - title: Karoserija i farba
            text: Merač debljine na svakoj paneli, geometrija otvora, tragovi zavarivanja i špaka. Vidljivo je da li je bilo popravki za koje prodavac nije pomenuo.
          - title: Motor i menjač
            text: Parametri na zagrejanom motoru, adaptacije menjača, greške u memoriji blokova. Najskuplja oblast i najčešći razlog za odbijanje.
          - title: Sistem za upravljanje i kočnice
            text: Igra, stanje suspenzije i kočionog sistema. Dužina pređene distance i balkanske putevi različito troše automobil, i to je vidljivo.
          - title: Elektronika i istorija po VIN-u
            text: Izveštaj CarVertical, istorija servisiranja kod dilera prema markama, razlike u pređenoj distanci sa istorijom, greške blokova i tragovi aktiviranih vazdušnih jastučića.
          - title: Pravna urednost
            text: Hipoteka, zabrana registracije, neizmirene saobraćajne nesreće i osiguravajući slučajevi — ono što se pojavljuje nakon kupovine.
          - title: Izveštaj sa fotografijama i video
            text: Svaki nalaz je snimljen i potpisan. Izveštaj ostaje kod vas — s njim je lako pregovarati, čak i ako na kraju uzmete automobil.
        compareHeading: Šta se menja od zemlje do zemlje
        compareLead: Regulativa tehničkog pregleda, tipične slabosti lokalnih automobila i načini skrivanja istorije su svuda različiti.
        compareHint: Odaberite zemlju — pokazat ćemo šta dodajemo u običnu kontrolnu listu.
        compareLinkFor: Provera {location} — detaljno
        mapHeading: Četiri oblasti koje odlučuju o transakciji
        mapLead: Kontrolna lista je duga, ali gotovo uvek odrađujemo odustajanje zbog jedne od četiri oblasti. Kliknite na broj na dijagramu — pokažemo šta proverava stručnjak i šta smo tamo pronašli.
      countryNotesHeadingFor: Kako proveravamo {location}
      countryNotesPointsLabel: Šta proveravamo pored obične kontrolne liste
      countryNotes:
        de:
          lead: 'U Nemačkoj imamo na šta da se oslonimo: servisna knjiga, protokoli HU i razvijene baze po VIN-u. Zato je provera ovde prvenstveno usklađivanje dokumenata s onim što pokazuje automobil.'
          points:
            - Oznake dilerskog servisiranja upoređujemo sa očitavanjem odometra kroz godine
            - Zapažanja prethodnog HU — šta je popravljeno posle pregleda, a šta se samo dovršilo
            - Donja strana i pragovi nakon zimskih hemikalija, uključujući skrivene prostore
            - 'Lizing prošlost: ravnomerno servisiranje pri velikim pređenim kilometrima'
        rs:
          lead: 'U Srbiji dolazimo na dan prijave. Glavni zadatak — vratiti istoriju automobila do uvoza: lokalni dokumenti pokazuju samo poslednji deo života automobila.'
          points:
            - Zemlja porekla i stanje automobila pre uvoza u Srbiju
            - Očitavanje odometra u poređenju sa zabeleskama tehničkog pregleda kroz prethodne godine
            - Popravke karoserije nakon uvoza — to rade češće i jeftinije nego u EU
            - 'Pravna strana: hipoteka i ograničenja na registraciju'
        es:
          lead: Španski automobili obično se raduju donjoj strani i razočaravaju svime što pati od sunca i soli. Proveru pomeramo sa korozije sa dna na skrivene prostore, elektriku i stanje enterijera.
          points:
            - Korozija u skrivenim prostorima uz obalu — s donje strane može biti čisto
            - Lak, brtve i plastika nakon višegodišnjeg sunčanog delovanja
            - 'Iznajmljena prošlost: upoređujemo pređeni put sa karakteristikom trošenja enterijera'
            - Protokol ITV i šta je ostalo neuređeno između pregleda
        ch:
          lead: Za MFK automobili se ozbiljno pripremaju, pa sveže protokol malo šta govori. Gledamo šta je urađeno tačno pre pregleda, a šta živi svoj život od prošle godine.
          points:
            - Šta je zamenjeno direktno pre MFK — sveže delove naspram ostalih
            - Servisiranje je skupo, pa proveravamo da li su odlagali redovne preglede
            - Pakovanje je bogato, ali proveravamo da li svaka opcija još uvek funkcioniše
            - 'Dokumentacija za uvoz: Švajcarska nije EU, paket se razlikuje'
        pt:
          lead: 'Sve ovde zavisi od vlažne morske klime. Proveru započinjemo s korozijom i električnim sistemom: najčešće nas izneveri ono što živi u vlazi.'
          points:
            - Skriveni prostori, ramovi i tačke učvršćenja suspenzije
            - Oksidacija konektora i blokova — čest uzrok nestabilnih grešaka
            - Protokol IPO i učestalost pregleda
            - 'Dizeli sa gradskom eksploatacijom: filtracija čađe i njena istorija'
        fr:
          lead: 'U Francuskoj detaljan contrôle technique, što je dobra polazna tačka. Dalje gledamo ono što regulativa ne obuhvata: resurs dizel grupe i trošenje od gradske gužve.'
          points:
            - Zapažanja contrôle technique po godinama — šta se ponavlja iz pregleda u pregled
            - Filter čađi, EGR i turbina na dizel motorima
            - Kvačilo i suspenzija posle gustog gradskog ciklusa
            - 'Istorija po francuskim markama: dostupne rezervne delove, ali svoje slabe tačke'
        it:
          lead: Italijanski automobili često dolaze sa sitnim popravkama karoserije, rađenim brzo i jeftino. Na merač debljine po panelima ovde treba znatno više vremena nego obično.
          points:
            - Merač debljine na svim panelima — prefarbavanja nakon gradskih povreda
            - 'Različitosti između severa i juga: so uz obalu, uobičajeno trošenje u unutrašnjosti'
            - Gasna oprema, ako postoji — instalacija i stanje boce
            - Učestalost revisione i propušteni periodi
        pl:
          lead: Poljska — najveće tranzitno tržište za oštećene automobile iz Zapadne Evrope. Zato prvo saznajemo šta se dešavalo sa ovom karoserijom pre prodaje.
          points:
            - Geometrija otvora i tragovi zavarivanja — obnova posle ozbiljne saobraćajne nesreće
            - 'Istorija uvoza: odakle je automobil došao i u kakvom je stanju'
            - Pređeni put upoređujemo sa evropskim servisnim bazama, odometru ne verujemo
            - Vazdušni jastučići i njihovo aktiviranje u prošlosti
      closing:
        eyebrow: Pronašli ste automobil?
        line1: Pošaljite link
        line2: na oglas —
        accentWord: doći ćemo i proveriti
        text: Dolazimo u jedan do dva dana. Izveštaj s fotografijama ostaje kod vas, čak i ako se nakon toga odreknete kupovine.
    cityVehicleSourcing:
      title: Autopodbor
      descriptionFor: Pronađite automobil u {cityLocation} sa kompletnom proverom. Radimo u čitavom regionu {countryName}.
      casesHeadingFor: Slučajevi iz {countryGenitiveOrName}
      whyCityHeadingFor: Zašto {cityName}
      reason1: Gledamo i kod dilera, i privatne oglase
      reason2: Proveravamo istoriju preko VIN pre izlaska na pregled
      reason3For: Naš ekspert u {cityLocation}
      reason4Dekra: DEKRA / TÜV provere na zahtev
      reason4Generic: Nezavisna tehnička provera na zahtev
      otherCitiesLabelFor: 'Ostali gradovi {countryLocation}:'
      cityNotesHeadingFor: Automobilsko tržište {cityLocation}
      cityNotesPointsLabel: Šta to praktično donosi
      cityNotes:
        berlin:
          lead: 'U Berlinu je najveći izbor u Nemačkoj i najsvestraniji sastav prodavaca. Tu se može naći sve: i automobili iz korporativnih parkova s kompletnom istorijom, i otkupljivani modeli koji dolaze iz Istočne Evrope.'
          points:
            - Ogroman izbor u svim segmentima, uključujući retke konfiguracije
            - Mnogi privatni prodavci — cene su realnije nego kod dilera
            - 'U urbanoj sredini: spojnice i suspenzije se više troše nego kod automobila sa autoputeva'
        munich:
          lead: 'Skupi grad s skupim automobilima. Premium segment ovde je veći nego bilo gde drugde u Nemačkoj, i prosek kondicije je viši: o takvim automobilima se brine.'
          points:
            - Snažan premium segment, posebno BMW i Mercedes
            - Očuvani automobili s kompletnom istorijom dilera
            - Cene više od proseka u zemlji — ušteda dolazi od stanja
        hamburg:
          lead: Lučki grad i veliki logistički čvor. Odatle je zgodno slati automobile dalje, a na tržištu često ima svežih uvoženih automobila.
          points:
            - Luka u blizini — lakše i jeftinije organizovati slanje
            - Mnogi automobili iz severnih oblasti s autoputskim pređenim kilometrima
            - 'Vlažna morska klima: karoseriju i skrivene delove pažljivije proveravamo'
        belgrade:
          lead: Naša baza. U Beogradu izlazimo na pregled u danu zahteva, poznajemo lokalne prodavce i vidimo koja mašina već drugi mesec kruži po oglasima.
          points:
            - Pregled u danu zahteva, bez čekanja i logistike
            - Poznajemo lokalne trgovine i istoriju automobila koji se nalaze na njima
            - Automobil je već carinjen — uvoz i dažbine nisu potrebni
        novi-sad:
          lead: Drugi po veličini grad Srbije, sat vožnje od Beograda. Tržište je manje, ali su cene obično mirnije nego u prestonici, a automobili ređe prolaze kroz nekoliko preprodaja.
          points:
            - Cene niže od beogradskih uz uporedivo stanje
            - Manje prekupaca, češće se sreće prvi vlasnik
            - Izlazimo iz Beograda, posebna cena za put nije potrebna
        pancevo:
          lead: Pančevo faktički pripada beogradskoj aglomeraciji, pa pregled ovde ne odstupa od glavnog grada. Tržište je malo, ali su privatni oglasi zanimljiviji.
          points:
            - Dvadeset minuta od Beograda — izlazimo isto brzo
            - Malo tržište s pretežno privatnim prodavcima
            - Često je jeftinije nego u prestonici uz isto stanje
        subotica:
          lead: 'Subotica se nalazi na granici s Mađarskom, i to se vidi na tržištu: mnogo automobila uvezenih iz EU i prodavaca koji se time konstantno bave.'
          points:
            - Granično tržište — mnogo svežeg uvoza iz Evropske unije
            - Istoriju pre uvoza proveravamo posebno pažljivo
            - Praktična tačka ako planirate da automobil šaljete severnije
        madrid:
          lead: 'Glavno tržište Španije: najveći izbor u zemlji i mnogo automobila iz korporativnih parkova. Kontinentalna klima, pa morska korozija ovde je manja nego na obali.'
          points:
            - Najveći izbor u Španiji, uključujući korporativne automobile
            - Daleko od mora — karoserije su obično čistije nego na obali
            - 'Vruće leto: plastika, lak i klima proveravaju se posebno'
        barcelona:
          lead: Sve zavisi od blizine mora. Automobili često izgledaju odlično s donje strane, ali zahtevaju pažnju na skrivene delove i elektriku.
          points:
            - 'More u blizini, pa proveravamo skrivene delove: s donje strane često čisto, a iznutra ne'
            - Mnogo nekadašnjih iznajmljivačkih i carsharing automobila
            - Luka u blizini, slanje morem se lakše organizuje
        zurich:
          lead: Cirih — najskuplje tržište automobila u regionu. Konfiguracije ovde su maksimum, servisiraju se kod dilera, a prodaju se ranije nego što automobil postane dotrajao.
          points:
            - Maksimalne konfiguracije i mali kilometraži
            - Dilerska usluga — istorija gotovo uvek potpuna
            - Švajcarska nije u EU, uvoz se obrađuje odvojeno
        geneva:
          lead: Ženeva se nalazi u frankofonoj oblasti Švajcarske, blizu granice s Francuskom. Francuskih marki na tržištu ima znatno više nego u nemačkom delu zemlje.
          points:
            - 'Mešovito tržište: švajcarsko stanje, francuski asortiman'
            - Granica s Francuskom blizu — ima s čim uporediti po ceni
            - 'Procedura je ista kao i u celoj Švajcarskoj: izvoz plus uvoz'
        paris:
          lead: 'Najveći izbor u Francuskoj dolazi s najstrožom eksploatacijom: gust saobraćaj i tesna parkiranja ostavljaju trag na karoseriji i suspenziji.'
          points:
            - Najveći izbor u Francuskoj, posebno francuskih marki
            - 'Urski ciklus: spojnice, suspenzije i sitne štete na karoseriji'
            - Mnogi dizeli — filter čađe i EGR prvo proveravamo
        lyon:
          lead: Lyon je mirniji od Pariza i po cenama i po stanju automobila. Autoput prema jugu je blizu, pa se često sreću automobili s redovnim kilometražama.
          points:
            - Cene niže od pariskih uz sličan izbor
            - Više autoputskih kilometara, manje gradskog trošenja
            - Praktična ruta do Italije i Španije, ako tražimo šire
        milan:
          lead: 'Poslovna prestonica Italije, i to se na tržištu vidi. Sever zemlje je bliži nemačkim uslovima: putevi su bolji, automobili bolje očuvani nego na jugu.'
          points:
            - Najbolji izbor premium segmenta u Italiji
            - Sever — manje soli i korozije nego na jugu zemlje
            - 'Gust grad: mjerač debljine boje obavezan'
        rome:
          lead: Veliko tržište s vrlo gustom gradskom eksploatacijom. Sitne ogrebotine ovde se smatraju načinom života, i često ih brzo popravljaju.
          points:
            - Mnogo malih automobila i vozila s plinskim instalacijama
            - Česte popravke nakon gradskih kontakata — provere svaku ploču
            - Južnije od Milana — klima je blaža, ali bliže moru
        warsaw:
          lead: Kroz Varšavu do zemlje dolazi glavni uvoz iz Zapadne Evrope, a ovde je i najveći izbor u Poljskoj. Udeo obnovljenih automobila takođe je najveći.
          points:
            - Najveći izbor u Poljskoj, mnogo svežeg uvoza iz EU
            - Geometriju karoserije i tragove popravki proveravamo kao prvo
            - Kratka dostavna ruta — jeftinije nego iz Južne Evrope
        krakow:
          lead: 'Krakov je mirniji od Varšave: tržište je manje, manje preprodaja, a automobili često imaju jednog vlasnika duže. Južna Poljska je bliža Balkanima po logistici.'
          points:
            - Manje prekupaca nego u Varšavi, istorija obično čistija
            - Cene često niže od beogradskih
            - Bliže ruti na jug — praktično za dostavu u Srbiju
