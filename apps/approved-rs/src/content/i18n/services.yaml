    vehicle-inspection:
      title: Inspección de automóvil
      description: Inspección independiente del vehículo antes de la compra. Visita del experto, diagnóstico, informe — sin obligación de compra.
      ctaLabel: Solicitar inspección
      casesHeading: 'Transacciones reales: inspección antes de la compra'
      breadcrumbLabel: Inspección de automóvil
      steps:
        - n: '01'
          text: Carrocería y pintura — presencia de reparaciones o accidente
        - n: '02'
          text: Suspensión, frenos
        - n: '03'
          text: Motor, caja, transmisión
        - n: '04'
          text: Electrónica e historial de servicio según VIN
        - n: '05'
          text: Claridad legal — embargos, prohibiciones de registro, accidentes
      extraLine: Trabajamos también en otros países de Europa, incluyendo Portugal, — consulte al solicitar.
      hub:
        metaTitle: Inspección de automóvil antes de la compra en Europa
        metaDescription: 'Nos desplazamos al coche que encontró usted mismo: medidor de espesor, escáner, verificación de historial según VIN y un informe con fotos el mismo día. Trabajamos en ocho países de Europa.'
        title: Inspección de automóvil
        titleHighlight: antes de la compra
        description: "Nos trasladamos al coche que usted encontró y le decimos cuál es su estado real. El informe llega antes de que entregue el dinero: si la respuesta es 'no lo compre', solo pierde el costo de la inspección."
        breadcrumbLabel: Inspección de automóvil
        casesHeading: 'Transacciones reales: inspección antes de la compra'
        chooseCountryLabel: 'Elija un país:'
        ctaLabel: Solicitar inspección
        heroPhotoAlt: Coche en elevador en el taller
        processHeading: Cómo se realiza la inspección
        processLead: Generalmente nos desplazamos dentro de uno o dos días tras la solicitud. La inspección en sí toma una hora y media a dos horas, y enviamos el informe el mismo día, antes de que el coche sea vendido a otro comprador.
        processSteps:
          - n: '01'
            text: Envía el enlace del anuncio y los contactos del vendedor
          - n: '02'
            text: Pactamos con el vendedor el tiempo y lugar de la inspección
          - n: '03'
            text: Nos dirigimos con medidor de espesor y escáner, para BMW conectamos el ISTA del concesionario, si es necesario, al elevador
          - n: '04'
            text: Tomamos fotos y videos de todos los hallazgos, verificamos el historial según VIN
          - n: '05'
            text: Enviamos el informe y una respuesta directa — comprar, negociar o rechazar
        includedHeading: Qué incluye la inspección
        includedLead: 'Más de cien puntos en la lista de verificación, pero casi siempre son cuatro áreas las que determinan: carrocería, motor con caja, suspensión y documentos. Es a través de estas áreas que más frecuentemente disuadimos de la compra.'
        included:
          - title: Carrocería y pintura
            text: Medidor de espesor en cada panel, geometría de los accesos, señales de soldadura y masilla. Se puede ver si hubo reparaciones que el vendedor no mencionó.
          - title: Motor y caja
            text: Parámetros en el motor caliente, adaptaciones de la caja, errores en la memoria de las unidades. La zona más cara y la razón más común de rechazo.
          - title: Suspensión y frenos
            text: Holguras, estado de la suspensión y sistema de frenos. El kilometraje en autopista y las carreteras balcánicas desgastan el coche de manera diferente, y eso se nota.
          - title: Electrónica e historial según VIN
            text: Informe de CarVertical, historial de servicio del concesionario por marca, discrepancia del kilometraje con la historia, errores de módulos y rastros de airbags desplegados.
          - title: Legalidad clara
            text: 'Embargos, restricciones de registro, accidentes no resueltos y eventos de seguros: todo lo que sale a la luz después de la compra.'
          - title: Informe con fotos y videos
            text: Cada hallazgo está documentado y etiquetado. El informe se queda con usted, ideal para negociar, incluso si al final decide no comprar el coche.
        compareHeading: Qué cambia de un país a otro
        compareLead: Reglamento de inspección técnica, problemas típicos de los coches locales y maneras de ocultar su historia en cada lugar.
        compareHint: Seleccione un país, le mostraremos qué se añade a la lista de verificación estándar.
        compareLinkFor: Inspección en {location} — en detalle
        mapHeading: Cuatro áreas que deciden la negociación
        mapLead: La lista de verificación es larga, pero casi siempre disuadimos por una de las cuatro áreas. Haga clic en el número del esquema, le mostramos qué revisa el experto y qué hemos encontrado allí.
      countryNotesHeadingFor: Cómo revisamos {location}
      countryNotesPointsLabel: Qué revisamos además de la lista de verificación estándar
      countryNotes:
        de:
          lead: 'En Alemania hay mucho en qué basarse: libro de servicios, protocolos de HU y bases de datos desarrolladas por VIN. Por eso, la revisión aquí es, ante todo, la comparación de documentos con lo que muestra el coche.'
          points:
            - Comparamos las marcas de mantenimiento del concesionario con el kilometraje año por año
            - 'Observaciones del HU anterior: lo que se reparó después de la inspección y lo que se postergó'
            - Bajo y umbrales después de los reactivos invernales, incluidas cavidades ocultas
            - 'Pasado de leasing: mantenimiento uniforme con un alto kilometraje'
        rs:
          lead: 'En Serbia salimos el mismo día de contacto. La principal tarea es restaurar la historia del coche antes de la importación: los documentos locales muestran solo el último tramo de vida del vehículo.'
          points:
            - País de origen y estado del coche antes de la importación a Serbia
            - Kilometraje frente a las marcas de la techanálisis de años pasados
            - Reparación de carrocería después de la importación — se realiza más a menudo y más barato que en la UE
            - 'Parte legal: embargos y restricciones de registro'
        es:
          lead: Los coches españoles suelen alegrar con su carrocería y decepcionar en lo que sufre por el sol y la sal. Cambiamos la inspección de la corrosión en la parte inferior a cavidades ocultas, electricidad y estado del interior.
          points:
            - Corrosión en cavidades ocultas cerca de la costa — por debajo puede estar limpio
            - Barniz, sellos y plásticos después de muchos años de sol
            - 'Pasado de alquiler: comparamos el kilometraje con el desgaste del interior'
            - Protocolo ITV y lo que queda pendiente entre las inspecciones
        ch:
          lead: Los coches en Suiza se preparan en serio para el MFK, por lo que un protocolo reciente por sí solo no dice mucho. Miramos qué se hizo justo antes de la inspección y qué vive su propia vida desde el año pasado.
          points:
            - Qué se reemplazó justo antes del MFK — piezas nuevas en comparación con las restantes
            - El mantenimiento es costoso, así que verificamos si se han pospuesto servicios
            - La equipación es rica, pero verificamos que cada opción aún funcione
            - 'Documentos de importación: Suiza no forma parte de la UE, el paquete es diferente'
        pt:
          lead: 'Aquí todo depende del húmedo clima marino. Comenzamos la revisión con corrosión y electricidad: lo que generalmente falla es lo que vive en la humedad.'
          points:
            - Cavidades ocultas, largueros y puntos de anclaje de la suspensión
            - Oxidación de conectores y módulos — causa típica de errores intermitentes
            - Protocolo IPO y regularidad de las inspecciones
            - 'Diéseles con uso urbano: filtro de partículas y su historia'
        fr:
          lead: 'En Francia, un detallado contrôle technique, y este es un buen punto de partida. Luego miramos lo que el reglamento no capta: la vida útil del grupo diésel y el desgaste por el tráfico urbano.'
          points:
            - Observaciones del contrôle technique por años — qué se repite de una inspección a otra
            - Filtro de partículas, EGR y turbocompresor en diéseles
            - Embrague y suspensión tras un ciclo urbano denso
            - 'Historia de marcas francesas: piezas de repuesto accesibles, pero con sus puntos débiles'
        it:
          lead: Los coches italianos llegan más a menudo con pequeñas reparaciones en la carrocería, hechas de forma rápida y económica. Con el medidor de grosor en paneles aquí se tarda notablemente más que normalmente.
          points:
            - Medidor de grosor en todos los paneles — retoques después de arañazos urbanos
            - 'Diferencia entre el norte y el sur: sal cerca de la costa, desgaste habitual en el interior del país'
            - Equipamiento de gas, si está instalado — instalación y estado del cilindro
            - Regularidad de la revisione y períodos perdidos
        pl:
          lead: Polonia es el mayor mercado de tránsito para coches siniestrados de Europa Occidental. Por eso, lo primero es averiguar qué se hizo con esa carrocería antes de la venta.
          points:
            - Geometría de los marcos y marcas de soldadura — restauración tras un accidente grave
            - 'Historia de importación: de dónde llegó el coche y en qué estado'
            - Comparar el kilometraje con las bases de datos de servicio europeas, no confiar en el odómetro
            - Airbags y su activación en el pasado
      closing:
        eyebrow: ¿Encontró el coche?
        line1: Envíe el enlace
        line2: del anuncio —
        accentWord: iremos y lo revisaremos
        text: Salimos en uno o dos días. El informe con fotos se queda con usted, incluso si después decide no proceder con la compra.
    cityVehicleSourcing:
      title: Selección de coches
      descriptionFor: Buscamos un coche en {cityLocation} con revisión completa. Trabajamos en toda la región {countryName}.
      casesHeadingFor: Operaciones reales en el mercado de {countryGenitiveOrName}
      whyCityHeadingFor: Por qué {cityName}
      reason1: Revisamos tanto concesionarios como anuncios particulares
      reason2: La historia por VIN la verificamos antes de salir a la inspección
      reason3For: Nuestro experto en {cityLocation}
      reason4Dekra: Verificación DEKRA / TÜV a solicitud
      reason4Generic: Experiencia técnica independiente a solicitud
      otherCitiesLabelFor: 'Otras ciudades en {countryLocation}:'
      cityNotesHeadingFor: Mercado automovilístico en {cityLocation}
      cityNotesPointsLabel: Qué ofrece esto en la práctica
      cityNotes:
        berlin:
          lead: Berlín tiene la mayor variedad en Alemania y una oferta diversa de vendedores. Aquí puedes encontrar desde coches de flotas corporativas con un historial completo hasta opciones de reventa provenientes de Europa del Este.
          points:
            - Amplia selección en todos los segmentos, incluyendo configuraciones raras
            - Muchos vendedores privados — el regateo es más real que con los concesionarios
            - 'Ciclo urbano: el desgaste de los neumáticos y la suspensión es más evidente que en coches de autopista'
        munich:
          lead: 'Una ciudad costosa con coches caros. Aquí hay más coches de gama premium que en cualquier otro lugar de Alemania, y en promedio están en mejor estado: los propietarios cuidan bien de ellos.'
          points:
            - Fuerte segmento premium, especialmente BMW y Mercedes
            - Coches bien mantenidos con un historial completo de concesionario
            - Precios por encima de la media nacional — el ahorro proviene del estado de los coches
        hamburg:
          lead: Ciudad portuaria y gran centro logístico. Desde aquí es fácil enviar coches a otros destinos, y el mercado tiene más variedad en coches importados recientes.
          points:
            - Puerto cercano — más fácil y barato organizar el envío
            - Muchos coches de tierras del norte con kilometrajes de carretera
            - 'Clima marítimo húmedo: revisamos la carrocería y los compartimentos ocultos con más atención'
        dusseldorf:
          lead: Centro de Renania del Norte-Westfalia, la región más densamente poblada de Alemania. Los espacios están muy juntos, y la frontera con los Países Bajos y Bélgica está a una hora, por lo que aquí llegan coches en venta con frecuencia.
          points:
            - En una visita podemos ver varios coches — los espacios están cerca
            - 'Algunas ofertas tienen matrículas holandesas y belgas: verificamos su historial y documentos por separado'
            - Hay muchos vendedores y compiten entre ellos — el regateo es más animado
        belgrade:
          lead: Nuestra base. En Belgrado realizamos la inspección el mismo día de la solicitud, conocemos a los vendedores locales y sabemos qué coches llevan dos meses en el mercado.
          points:
            - Inspección el mismo día, sin esperas ni logística
            - Conocemos los espacios locales y la historia de los coches que están allí
            - El coche ya está despachado — no se necesitan impuestos ni aranceles
        novi-sad:
          lead: La segunda ciudad más grande de Serbia, a una hora de Belgrado. El mercado es más pequeño, pero los precios suelen ser más tranquilos que los de la capital, y los coches han pasado por menos reventas.
          points:
            - Precios más bajos que en Belgrado con un estado comparable
            - Menos intermediarios, más coches de primer propietario
            - Salimos desde Belgrado, sin costo adicional por el viaje
        pancevo:
          lead: Pancevo forma parte de la aglomeración de Belgrado, por lo que la inspección aquí no difiere de la de la capital. El mercado es pequeño, pero las ofertas privadas son más interesantes.
          points:
            - Veinte minutos desde Belgrado — salimos igual de rápido
            - Mercado pequeño con predominancia de vendedores privados
            - A menudo más barato que en la capital manteniendo el mismo estado
        subotica:
          lead: 'Subotica está en la frontera con Hungría, y eso se refleja en el mercado: muchos coches importados de la UE y vendedores que se dedican a esto constantemente.'
          points:
            - Mercado fronterizo — mucho reciente importado de la Unión Europea
            - Verificamos el historial del coche antes de la importación especialmente detalladamente
            - Un punto conveniente si planeas llevar el coche más al norte
        madrid:
          lead: 'El mercado de la capital de España: la mayor variedad en el país y muchos coches de flotas corporativas. El clima continental significa que hay menos corrosión marina que en las costas.'
          points:
            - La mayor selección en España, incluidos coches corporativos
            - Lejos del mar — las carrocerías suelen estar más limpias que las costeras
            - 'Calurosos veranos: revisamos los plásticos, el brillo y el aire acondicionado por separado'
        barcelona:
          lead: Todo lo determina la proximidad al mar. Los coches a menudo lucen bien por debajo, pero requieren atención a los espacios ocultos y la parte eléctrica.
          points:
            - 'El mar está cerca, por lo que revisamos los espacios ocultos: desde abajo a menudo están limpios, pero por dentro no'
            - Muchos coches de alquiler y de carsharing antiguos
            - Con puerto cercano, organizar el envío por mar es más fácil
        zurich:
          lead: Zúrich es el mercado de coches más caro de la región. Aquí se eligen las configuraciones máximas, se mantienen en concesionarios y se venden antes de que el coche se desgaste.
          points:
            - Configuraciones máximas y bajo kilometraje
            - Mantenimiento en concesionarios — el historial casi siempre es completo
            - Suiza no está en la UE, el proceso de importación se gestiona por separado
        geneva:
          lead: Ginebra está en la parte francófona de Suiza, justo en la frontera con Francia. En el mercado hay notablemente más marcas francesas que en la parte alemana del país.
          points:
            - 'Mercado mixto: estado suizo, oferta francesa'
            - La frontera con Francia está cerca — hay comparación de precios
            - 'El proceso es el mismo que en toda Suiza: exportación más importación'
        paris:
          lead: 'La mayor selección de Francia viene con el uso más duro: el tráfico denso y los estacionamientos estrechos dejan marcas en la carrocería y la suspensión.'
          points:
            - La mayor selección en Francia, especialmente de marcas francesas
            - 'Ciclo urbano: neumáticos, suspensión y pequeños daños en la carrocería'
            - Muchos diésel — revisamos el filtro de partículas y EGR en primer lugar
        lyon:
          lead: Lyon es más tranquilo que París tanto en precios como en estado de los coches. La autopista hacia el sur está cerca, por lo que es más común encontrar coches con kilometraje de carretera.
          points:
            - Precios más bajos que los de París con una selección comparable
            - Más kilometrajes de autopista, menos desgaste urbano
            - Buena conexión a Italia y España, si buscamos más allá
        milan:
          lead: 'Capital empresarial de Italia, y eso se refleja en el mercado. El norte del país se asemeja a las condiciones alemanas: las carreteras son mejores y los coches están mejor cuidados que en el sur.'
          points:
            - La mejor selección de segmento premium en Italia
            - El norte — menos sal y corrosión que en el sur del país
            - 'Ciudad densa: es obligatorio usar un medidor de espesor en los paneles'
        rome:
          lead: Un gran mercado con un uso urbano muy intenso. Pequeños arañazos aquí se consideran parte de la vida diaria, y a menudo se reparan rápidamente.
          points:
            - Muchos coches pequeños y vehículos con equipo de gas
            - Frecuentes retoques después de contactos urbanos — verificamos cada panel
            - Al sur de Milán — el clima es más suave, pero más cerca del mar
        warsaw:
          lead: A través de Varsovia entra la mayor parte de la importación de Europa Occidental, y aquí está la mayor selección en Polonia. La proporción de coches reacondicionados también es la más alta.
          points:
            - La mayor selección en Polonia, mucho nuevo importado de la UE
            - Verificamos la geometría de la carrocería y las huellas de reparaciones como primera prioridad
            - Un corto trayecto de entrega — más barato que desde el sur de Europa
        krakow:
          lead: 'Kraków es más tranquilo que Varsovia: el mercado es más pequeño, hay menos reventa y los coches suelen tener un solo propietario por más tiempo. El sur de Polonia está más cerca de los Balcanes en términos logísticos.'
          points:
            - Menos revendedores que en Varsovia, la historia suele ser más limpia
            - Los precios a menudo son más bajos que en la capital
            - Más cerca de la ruta hacia el sur — conveniente para la entrega a Serbia
    caseChrome:
      autoLabel: Coche
      yearLabel: Año
