            - 'El IVA suizo se devuelve al exportar: lo tenemos en cuenta en el cálculo.'
            - 'Verificamos por separado el origen del coche: matrículas suizas no significan producción europea.'
            - El estado suele ser mejor que el promedio, pero el precio en la publicación es más alto.
