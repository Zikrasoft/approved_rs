        includedHeading: Was die Kosten ausmacht
        includedLead: 'Bei einem Eigenimport sprengt oft die Summe das Budget, was über dem Preis des Autos liegt. Wir berechnen dies im Voraus und fixieren es: das Ergebnis sollte nicht vom ersten Angebot abweichen.'
        included:
          - title: Kosten des Fahrzeugs
            text: Preis nach Verhandlung, nicht nach Anzeige! Wir verhandeln mit dem, was wir bei der Besichtigung in der Hand halten – das deckt in der Regel einen Teil der Kosten.
          - title: Logistik zum Zielort
            text: Autotransporter oder Überführung mit Transitnummern. Wir berechnen beide Varianten und wählen die vorteilhaftere für die jeweilige Strecke.
          - title: Zölle und Steuern
            text: Der Satz hängt vom Ursprungsland des Fahrzeugs und dessen Alter ab. Bei Fahrzeugen europäischer Produktion verändert das EUR1-Zertifikat die Berechnung grundlegend – wir prüfen, ob es vor dem Kauf vorhanden ist.
          - title: Export und Transit
            text: Abmeldung im Verkäuferland, Exportdeklaration, Transitnummern und Überführungsversicherung.
          - title: Zollabwicklung
            text: Deklaration, Broker und Zahlungen am Ankunftsort. Wir bereiten das Paket im Voraus vor, damit das Fahrzeug nicht unnötig lang im Lager steht.
          - title: Zulassung
            text: Technische Überprüfung, Registrierung und Nummernschilder. Sie nehmen das Auto in Empfang, mit dem Sie sofort fahren können.
