          points:
            - Flete marítimo — el plazo principal, planifique en meses, no en semanas
            - 'La procedencia europea no se confirma: el EUR1 no se aplica aquí, el arancel es más alto'
            - 'Servicio y repuestos: verificamos si el modelo se mantiene en el país de destino'
            - 'Vehículos eléctricos: comprobamos el tipo de conector y la compatibilidad con las redes locales'
