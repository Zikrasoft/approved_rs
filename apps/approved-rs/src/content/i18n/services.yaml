        heroPhotoAlt: Autoschlüssel auf Geld und Dokumenten
        processHeading: So läuft der Ankauf ab
        processLead: Vom ersten Kontakt bis zur Auszahlung dauert es in der Regel zwei bis drei Tage, wobei fast die gesamte Zeit für die Anreise zum Treffpunkt benötigt wird. Die Bewertung anhand von Fotos erfolgt innerhalb einer Stunde.
        processSteps:
          - n: '01'
            text: Sie senden Fotos, Dokumente und eine ehrliche Beschreibung des Zustands
          - n: '02'
            text: Wir nennen den Preis innerhalb einer Stunde — sofort endgültig, ohne Preisspanne
          - n: '03'
            text: Wir vereinbaren ein Treffen, wo das Auto steht; wenn es nicht fahrbereit ist — kommen wir mit einem Anhänger
          - n: '04'
            text: Wir prüfen das Auto vor Ort und bestätigen den Preis, wenn die Beschreibung übereinstimmt
          - n: '05'
            text: Vertrag unterzeichnen, das Geld wird am Tag der Unterzeichnung überwiesen
        includedHeading: Was wir übernehmen
        includedLead: Für die Differenz zwischen unserem Preis und dem Marktwert übernehmen wir alles, weshalb ein solches Auto seit Monaten nicht verkauft wird.
        included:
          - title: Fahrzeuge mit russischen Kennzeichen
            text: Hauptkategorie. Das Fahrzeug kann sich in jedem europäischen Land befinden — wir kommen dorthin, wo es steht, und kümmern uns um den Export und den weiteren Verkauf selbst.
          - title: Probleme mit Einfuhr und Fristen
            text: Nach der Unterzeichnung gehen die abgelaufene vorübergehende Einfuhr und die damit verbundenen Risiken auf uns über.
          - title: Bewertung ohne Besichtigung
            text: Den Preis nennen wir anhand von Fotos und Dokumenten. Wir kommen nur, wenn beide Seiten mit dem Betrag einverstanden sind.
          - title: Vertragsabwicklung
            text: Vertrag, Abmeldung und alle Unterlagen bereiten wir selbst vor. Von Ihnen benötigen wir die Dokumente für das Auto und Ihre Unterschrift.
          - title: Zahlung am Tag der Unterzeichnung
            text: Das Geld wird am selben Tag überwiesen. Ratenzahlungen oder «Zahlung nach dem Verkauf» gibt es bei uns nicht.
          - title: Ehrliche Ablehnung
            text: Wenn uns das Auto nicht zusagt, sagen wir das sofort und erklären den Grund. Wir werden nicht zögern oder den Preis währenddessen drücken.
