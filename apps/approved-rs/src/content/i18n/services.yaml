      citiesHeadingFor: Wo wir die Autos in {countryLocation} besichtigen
      citiesLead: Der Experte fährt im ganzen Land, aber am häufigsten schauen wir uns die Autos dort an, wo die meisten zum Verkauf angeboten werden. Was das für jede Stadt bedeutet, erfahren Sie hier.
      alsoInLabel: 'Wir beschaffen auch in:'
      crossSellLabel: Brauchen Sie kein lokales Auto?
      countryNotesHeadingFor: Was wir in {location} berücksichtigen
      countryNotesPointsLabel: Worauf wir in erster Linie schauen
      countryNotes:
        de:
          lead: 'Die Auswahl hier ist größer als auf jedem anderen Markt in Europa, und die Servicehistorie ist in der Regel nachvollziehbar: Die meisten Fahrzeuge verfügen über ein Serviceheft mit Stempeln des Händlers nach jedem Service. Die Kehrseite sind Autobahn-Kilometerstände. Zweihunderttausend Kilometer in drei Jahren sind hier die Norm und kein Grund für einen Preisnachlass.'
          points:
            - Serviceheft und Stempel des Händlers – wir vergleichen anhand der VIN beim offiziellen Service
            - HU-Protokoll, das alle TÜV nennen – wir lesen die Anmerkungen der letzten Inspektion, nicht nur den Stempel
            - 'Fahrzeuge aus Leasing und Unternehmensflotten: ordentlich gewartet, aber hohe Kilometerstände'
            - Winterstraßen mit Reagenzien – Unterboden und Schweller prüfen wir separat
        rs:
          lead: Hier sind wir vor Ort, daher schauen wir uns das Auto am Tag der Anfrage an und ohne Import. Der Markt ist klein, dasselbe Auto kann durch mehrere Verkäufer gehen, und die Historie muss entwirrt werden.
          points:
            - Das Auto ist bereits verzollt und hat lokale Kennzeichen – Zölle und Einfuhrformalitäten sind nicht erforderlich
            - Kilometerstände werden oft beim Weiterverkauf im Inland korrigiert – wir überprüfen sie anhand der technischen Prüfungsstempel
            - Viele Fahrzeuge stammen aus Deutschland und Italien – wir prüfen, was mit dem Auto vor dem Import war
            - Besichtigung am Tag der Anfrage, ohne auf Logistik warten zu müssen
        es:
          lead: Milde Winter und kaum Reagenzien auf den Straßen, weshalb die Unterböden bei spanischen Fahrzeugen in der Regel deutlich besser sind als die deutschen. Dafür schadet die Sonne und die Nähe zum Meer dem Lack, dem Kunststoff und allem Gummierten.
          points:
            - Küstengebiete – Korrosion suchen wir vor allem in verborgenen Hohlräumen
            - Verblasster Lack und rissiger Kunststoff im Innenraum – berücksichtigen wir im Preis
            - 'Viele ehemalige Mietwagen: gleichmäßiger Kilometerstand, aber intensive Nutzung'
            - ITV-Protokoll – wir überprüfen Anmerkungen und Termine
        ch:
          lead: 'Schweizer Autos sind deutlich besser gepflegt als der europäische Durchschnitt: teure Wartung fördert Disziplin, die Kilometerstände sind gering. Aber die Schweiz ist nicht in der EU, daher wird der Import anders gehandhabt, und das budgetieren wir im Voraus.'
          points:
            - Reichhaltige Ausstattungen – hier werden sie häufiger gewählt als bei den Nachbarn
            - MFK – die Inspektion ist streng, darauf bereitet man das Auto ernsthaft vor, und das sieht man am Fahrzeug
            - 'Nicht EU: Zoll und Dokumente werden nicht wie für EU-Staaten behandelt'
            - Preise über dem Markt, dafür sparen Sie später bei Reparaturen
        pt:
          lead: Der Markt ist klein, die Auswahl bescheidener als die spanische, aber die Konkurrenz um ein gutes Auto ist auch geringer. Das Klima ist feucht und salzig – maritimer Rost findet sich selbst bei neueren Autos.
          points:
            - Feuchtigkeit und Meer – versteckte Hohlräume und Elektrik genießen Vorrang bei der Inspektion
            - 'Kleiner Markt: für spezielle Anfragen suchen wir länger als in Deutschland'
            - IPO-Protokoll – wir überprüfen Anmerkungen früherer Inspektionen
            - Viele Diesel und Kleinwagen, keine großen Karosserien
        fr:
          lead: Frankreich bedeutet vor allem Diesel und eigene Marken. Peugeot, Renault und Citroën sind hier günstiger als irgendwo in Europa. Deutsche Premium Fahrzeuge sind dagegen teurer, und es macht kaum Sinn, sie hier zu kaufen.
          points:
            - Französische Marken – der beste Preis in Europa, und die Wartung ist günstiger
            - Diesel – Dieselpartikelfilter und EGR-Ventil prüfen wir als separate Position
            - Contrôle technique – die Protokolle sind detailliert, wir überprüfen Anmerkungen über die Jahre
            - 'Städtische Nutzung: Kupplung und Aufhängung nutzen sich schneller ab als angegeben'
        it:
          lead: 'Der italienische Markt ist gut für Kleinwagen und seltene Ausstattungen, erfordert jedoch Vorsicht: Die Autos werden hier stark genutzt, und kleine Karosserie-Reparaturen werden nicht immer ordentlich durchgeführt.'
          points:
            - Stadt – häufige kleine Stöße und Lackierungen, ein Lackmessgerät ist Pflicht
            - Der Süden und die Küste bringen Salz und Korrosion, der Norden ist ähnlich wie unter deutschen Bedingungen
            - Revisione – prüfen wir die Regelmäßigkeit, Auslassungen sind häufig
            - Viele Autos mit Gasanlage – wir schauen uns diese separat an
        pl:
          lead: 'Der nächstgelegene große Markt: die Logistik ist günstig und kurz. Aber Polen war jahrelang der Hauptumschlagplatz für Unfallautos aus Westeuropa, deshalb überprüfen wir die Historie hier strenger als irgendwo sonst.'
          points:
            - Hoher Anteil an nach Unfällen wiederhergestellten Fahrzeugen – Geometrie der Karosserie hat Vorrang
            - 'Häufige Wiederverkäufe: ein Auto kann innerhalb eines Jahres mehrere Besitzer wechseln'
            - Kilometerstände werden oft beim Import korrigiert – wir vergleichen sie mit den Werkstatthistorien
            - Kurze Lieferdistanzen – günstiger und schneller als aus Spanien oder Portugal
      closing:
        eyebrow: Wie fangen wir an?
        line1: Beschreiben Sie das Auto,
        line2: das Sie suchen –
        accentWord: dann ist unser Job
        text: Budget, Karosserie, Getriebe, ein paar Wünsche dazu. Wir suchen, während Sie die Berichte zu den Optionen ansehen und entscheiden, welche Sie live besichtigen möchten.
