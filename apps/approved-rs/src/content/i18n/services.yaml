    vehicle-inspection:
      title: Fahrzeugprüfung
      description: Unabhängige Prüfung des Fahrzeugs vor dem Kauf. Experteneinsatz, Diagnose, Bericht – ohne Kaufverpflichtung.
      ctaLabel: Prüfung anfordern
      casesHeading: 'Reale Transaktionen: Prüfung vor dem Kauf'
      breadcrumbLabel: Fahrzeugprüfung
      steps:
        - n: '01'
          text: Karosserie und Lackierung – Vorhandensein von Reparaturen oder Unfällen
        - n: '02'
          text: Fahrwerk, Aufhängung, Bremsen
        - n: '03'
          text: Motor, Getriebe, Transmission
        - n: '04'
          text: Elektronik und Wartungshistorie über die VIN
        - n: '05'
          text: Rechtliche Sauberkeit – Pfand, Registrierungssperre, Unfälle
      extraLine: Wir arbeiten auch in anderen Ländern Europas, einschließlich Portugal – bitte klären Sie dies bei der Anfrage.
      hub:
        metaTitle: Fahrzeugprüfung vor dem Kauf in Europa
        metaDescription: 'Wir fahren zu dem Fahrzeug, das Sie selbst gefunden haben: Lackdicker, Scanner, Prüfung der Geschichte über die VIN und Bericht mit Fotos am selben Tag. Wir arbeiten in acht europäischen Ländern.'
        title: Fahrzeugprüfung
        titleHighlight: vor dem Kauf
        description: 'Wir fahren zu dem Fahrzeug, das Sie selbst gefunden haben, und erzählen Ihnen, was wirklich damit ist. Der Bericht kommt, bevor Sie Geld übergeben: Wenn das Ergebnis „nicht kaufen“ ist, verlieren Sie nur die Prüfkosten.'
        breadcrumbLabel: Fahrzeugprüfung
        casesHeading: 'Reale Transaktionen: Prüfung vor dem Kauf'
        chooseCountryLabel: 'Wählen Sie ein Land:'
        ctaLabel: Prüfung anfordern
        heroPhotoAlt: Fahrzeug auf der Hebebühne in der Werkstatt
        processHeading: So verläuft die Prüfung
        processLead: In der Regel fahren wir innerhalb von ein bis zwei Tagen nach der Anfrage los. Die Inspektion selbst dauert anderthalb bis zwei Stunden, den Bericht schicken wir am selben Tag, solange das Auto noch nicht an einen anderen Käufer verkauft wurde.
        processSteps:
          - n: '01'
            text: Sie senden den Link zur Anzeige und die Kontaktdaten des Verkäufers
          - n: '02'
            text: Wir vereinbaren mit dem Verkäufer die Zeit und den Ort der Besichtigung
          - n: '03'
            text: Wir fahren mit Dickemessgerät und Scanner, bei BMW schließen wir uns an das Händler-ISTA an, bei Bedarf auf die Hebebühne
          - n: '04'
            text: Wir machen Fotos und Videos von allen Funden, prüfen die Geschichte über die VIN
          - n: '05'
            text: Wir senden den Bericht und eine klare Antwort – kaufen, verhandeln oder ablehnen
        includedHeading: Was in die Prüfung beinhaltet
        includedLead: 'Mehr als hundert Punkte auf der Checkliste, aber entscheidend sind fast immer vier Bereiche: Karosserie, Motor mit Getriebe, Fahrwerk und Dokumente. Nach diesen Bereichen überzeugen wir oft vom Kauf.'
        included:
          - title: Karosserie und Lackierung
            text: Dickemessgerät für jedes Paneel, Geometrie der Öffnungen, Schweiß- und Spachtelspuren. Sichtbar, ob es Reparaturen gab, von denen der Verkäufer nicht erwähnt hat.
          - title: Motor und Getriebe
            text: Parameter bei warmem Motor, Anpassungen des Getriebes, Fehler im Gedächtnis der Steuergeräte. Der teuerste Bereich und häufigste Grund für eine Ablehnung.
          - title: Fahrwerk und Bremsen
            text: Losbrechungen, Zustand des Fahrwerks und der Bremsanlage. Autobahnkilometer und Balkanstrecken belasten das Auto unterschiedlich, und das ist sichtbar.
          - title: Elektronik und Geschichte über die VIN
            text: CarVertical-Bericht, Händler-Servicehistorie für die Marke, Kilometerstandabweichungen, Fehlercodes und Hinweise auf ausgelöste Airbags.
          - title: Rechtslage
            text: Faillissement, Anmeldeverbot, ungeklärte Unfälle und Versicherungsereignisse - das sind Dinge, die nach dem Kauf aufkommen.
          - title: Bericht mit Foto und Video
            text: Jede Entdeckung ist dokumentiert. Der Bericht bleibt bei Ihnen — damit können Sie verhandeln, selbst wenn Sie das Auto letztendlich kaufen.
        compareHeading: Was sich von Land zu Land ändert
        compareLead: Vorschriften für die Fahrzeuginspektion, typische Mängel lokaler Autos und Methoden, um die Geschichte überall zu verstecken.
        compareHint: Wählen Sie ein Land aus — wir zeigen, was wir zur normalen Checkliste hinzufügen.
        compareLinkFor: Inspektion {location} — im Detail
        mapHeading: Vier Zonen, die den Deal entscheiden
        mapLead: Die Checkliste ist lang, aber wir raten fast immer von einem Kauf in einer der vier Zonen ab. Klicken Sie die Nummer im Schema an — wir zeigen, worauf der Experte achtet und was wir dort gefunden haben.
      countryNotesHeadingFor: Wie wir {location} überprüfen
      countryNotesPointsLabel: Was wir über die normale Checkliste hinaus prüfen
      countryNotes:
        de:
          lead: 'In Deutschland gibt es viel, auf das man sich stützen kann: Serviceheft, HU-Protokolle und umfassende Datenbanken nach VIN. Daher steht bei der Prüfung hier hauptsächlich die Überprüfung der Dokumente im Vordergrund.'
          points:
            - Die Eintragungen des Händler-Service vergleichen wir mit den Kilometerstandanzeigen gemäß den Jahren.
            - Anmerkungen zum letzten HU — was nach der Inspektion repariert wurde und was nur aufgeschoben wurde.
            - Unterboden und Schweller nach winterlichen Streumitteln, auch versteckte Hohlräume.
            - 'Leasinghistorie: gleichmäßige Pflege bei hohem Kilometerstand.'
        rs:
          lead: 'In Serbien fahren wir am Tag der Anfrage los. Die Hauptaufgabe besteht darin, die Fahrzeughistorie bis zur Einfuhr wiederherzustellen: Lokale Dokumente zeigen nur den letzten Lebensabschnitt des Autos.'
          points:
            - Herkunftsland und Zustand des Fahrzeugs vor der Einfuhr nach Serbien.
            - Kilometerstand gegen die Eintragungen der technischen Prüfung in den vergangenen Jahren.
            - Karosseriereparaturen nach der Einfuhr — diese werden häufiger und günstiger durchgeführt als in der EU.
            - 'Rechtliche Aspekte: Hypothek und Einschränkungen bei der Registrierung.'
        es:
          lead: Spanische Autos erfreuen sich in der Regel eines guten Unterbodens, enttäuschen jedoch in allem, was unter Sonne und Salz leidet. Wir legen den Fokus bei der Prüfung weniger auf Rost am Unterboden und mehr auf versteckte Hohlräume, Elektrik und den Zustand des Innenraums.
          points:
            - Rost in versteckten Hohlräumen an der Küste — unten kann alles rein erscheinen.
            - Lack, Dichtungen und Kunststoff nach jahrelanger Sonneneinstrahlung.
            - 'Vermietungshistorie: Wir vergleichen den Kilometerstand mit dem Abnutzungsgrad des Innenraums.'
            - ITV-Protokoll und was zwischen den Inspektionen offen geblieben ist.
        ch:
          lead: In der Schweiz werden die Autos ernsthaft auf die MFK vorbereitet, daher sagt ein frisches Protokoll allein nicht viel aus. Wir schauen, was genau vor der Inspektion gemacht wurde und was seit dem letzten Jahr ein Eigenleben führt.
          points:
            - Was direkt vor der MFK gewechselt wurde — neue Teile im Vergleich zum Rest.
            - Wartung ist teuer, daher prüfen wir, ob die Vorgaben einhalten wurden.
            - Reichhaltige Ausstattung, aber wir prüfen, ob jede Option noch funktioniert.
            - 'Einfuhrdokumente: Die Schweiz ist nicht in der EU, die Unterlagen unterscheiden sich.'
        pt:
          lead: 'Alles dreht sich um das feuchte, maritime Klima. Wir beginnen die Prüfung mit Rost und Elektrik: meist sind es Dinge, die unter Feuchtigkeit leiden.'
          points:
            - Versteckte Hohlräume, Längsträger und Aufhängungspunkte.
            - Korrosion von Steckverbindern und Steuergeräten — eine häufige Ursache für sporadische Fehler.
            - IPO-Protokoll und Regelmäßigkeit der Inspektion.
            - 'Diesel mit urbaner Nutzung: DPF und seine Geschichte.'
        fr:
          lead: 'In Frankreich gibt es eine detaillierte contrôle technique, die ein guter Ausgangspunkt ist. Anschließend schauen wir uns das an, was die Vorschriften nicht erfassen: Ressourcen der Dieselmotoren und Abnutzung durch Stadtverkehr.'
          points:
            - Anmerkungen zur contrôle technique über die Jahre — was sich von Inspektion zu Inspektion wiederholt.
            - Dieselpartikelfilter, EGR und Turbolader.
            - Kupplung und Aufhängung nach einem intensiven Stadtzyklus.
            - 'Historie bei französischen Marken: verfügbare Ersatzteile, aber eigene Schwachstellen.'
        it:
          lead: Italienische Autos kommen häufiger mit kleinen, schnell und günstig durchgeführten Karosseriereparaturen. Ein Lackmessgerät braucht hier deutlich länger als gewöhnlich.
          points:
            - Lackmessgerät an allen Blechen — Nachbesserungen nach urbanen Kollisionen.
            - 'Unterschied zwischen Nord und Süd: Salz an der Küste, übliche Abnutzung im Landesinneren.'
            - Gasinstallation, falls vorhanden — Einbau und Zustand des Tanks.
            - Regelmäßigkeit der revisione und versäumte Intervalle.
        pl:
          lead: Polen ist der größte Umschlagplatz für verunfallte Autos aus Westeuropa. Deshalb klären wir zunächst, was mit dieser Karosserie vor dem Verkauf gemacht wurde.
          points:
            - Die Geometrie der Öffnungen und Schweißspuren — Wiederherstellung nach einem schweren Unfall.
            - 'Einfuhrhistorie: woher kam das Auto und in welchem Zustand.'
            - Wir vergleichen den Kilometerstand mit europäischen Service-Datenbanken, dem Kilometerzähler vertrauen wir nicht.
            - Airbags und deren Auslösung in der Vergangenheit.
      closing:
        eyebrow: Haben Sie ein Auto gefunden?
        line1: Schicken Sie den Link
        line2: zur Anzeige —
        accentWord: wir kommen vorbei und werfen einen Blick darauf
        text: Wir fahren innerhalb von ein bis zwei Tagen los. Der Bericht mit Fotos bleibt bei Ihnen, auch wenn Sie sich danach gegen den Kauf entscheiden.
    cityVehicleSourcing:
      title: Fahrzeugauswahl
      descriptionFor: Wir suchen ein Auto in {cityLocation} mit vollständiger Prüfung. Wir arbeiten in der gesamten Region {countryName}.
      casesHeadingFor: Echte Geschäfte auf dem Markt {countryGenitiveOrName}
      whyCityHeadingFor: Warum {cityName}
      reason1: Wir schauen sowohl bei Händlerplätzen als auch in privaten Anzeigen.
      reason2: Die Geschichte prüfen wir anhand der VIN, bevor wir zur Besichtigung fahren.
      reason3For: Unser Experte in {cityLocation}
      reason4Dekra: DEKRA / TÜV-Prüfung auf Anfrage
      reason4Generic: Unabhängige technische Expertise auf Anfrage
      otherCitiesLabelFor: 'Weitere Städte in {countryLocation}:'
      cityNotesHeadingFor: Automarkt {cityLocation}
      cityNotesPointsLabel: Was das in der Praxis bringt
      cityNotes:
        berlin:
          lead: 'In Berlin gibt es die größte Auswahl in Deutschland und ein buntes Angebot an Verkäufern. Hier findet man alles: von Firmenfahrzeugen mit vollständiger Historie bis zu wiederverkauften Optionen aus Osteuropa.'
          points:
            - Riesige Auswahl in jedem Segment, inklusive seltener Ausstattungen
            - Viele private Verkäufer — Preisverhandlungen realistischer als bei Händlern
            - 'Städtischer Fahrzyklus: Reifen und Fahrwerk nutzen sich mehr ab als bei Autobahnfahrzeugen'
        munich:
          lead: 'Eine teure Stadt mit teuren Autos. Der Premium-Sektor ist hier größer als irgendwo sonst in Deutschland, und der Zustand der Fahrzeuge ist im Durchschnitt besser: hier wird gut auf die Autos geachtet.'
          points:
            - Starker Premium-Sektor, insbesondere BMW und Mercedes
            - Gut gepflegte Autos mit vollständiger Händlerhistorie
            - Preise über dem Bundesdurchschnitt — Einsparungen aufgrund des Zustands
        hamburg:
          lead: Eine Hafenstadt und großes Logistikzentrum. Von hier aus ist es einfach, Autos weiterzuversenden, und der Markt bietet häufig frische Importfahrzeuge.
          points:
            - Der Hafen in der Nähe — einfacher und günstiger Versand
            - Viele Fahrzeuge aus dem Norden mit Autobahnkilometern
            - 'Feuchtes Seeklima: Karosserie und Hohlräume genauer überprüfen'
        dusseldorf:
          lead: Zentrum von Nordrhein-Westfalen, dem am dichtesten besiedelten Bundesland Deutschlands. Die Plätze sind dicht beieinander, und die Grenze zu den Niederlanden und Belgien ist nur eine Stunde entfernt; daher kommen regelmäßig Autos zum Verkauf.
          points:
            - Wir können bei einem Besuch mehrere Autos anschauen — die Plätze sind nah beieinander
            - 'Einige Angebote mit holländischen und belgischen Nummern: die Historie und Papiere überprüfen wir separat'
            - Es gibt viele Verkäufer und sie konkurrieren — Preisverhandlungen sind lebhafter
        belgrade:
          lead: Unsere Basis. In Belgrad führen wir die Inspektion am Tag der Anfrage durch, kennen die lokalen Verkäufer und sehen, welches Fahrzeug schon seit zwei Monaten die Plätze wechselt.
          points:
            - Inspektion am Tag der Anfrage, ohne Wartezeit und Logistik
            - Wir kennen die lokalen Plätze und die Historie der dort angebotenen Fahrzeuge
            - Das Fahrzeug ist bereits verzollt — Einfuhr und Abgaben sind nicht notwendig
        novi-sad:
          lead: Die zweitgrößte Stadt Serbiens, eine Stunde von Belgrad entfernt. Der Markt ist kleiner, aber die Preise sind in der Regel ruhiger als in der Hauptstadt, und die Fahrzeuge haben seltener mehrere Verkaufswechsel erlebt.
          points:
            - Preise unter den belgrader Preisen bei vergleichbarem Zustand
            - Weniger Wiederverkäufer, häufiger der erste Besitzer
            - Wir fahren von Belgrad aus, keine zusätzlichen Kosten für die Strecke
        pancevo:
          lead: Pančevo gehört faktisch zur Belgrader Agglomeration, deshalb ist die Inspektion hier nicht anders als in der Hauptstadt. Der Markt ist klein, aber die privaten Angebote sind oft interessanter.
          points:
            - Zwanzig Minuten von Belgrad — wir fahren ebenso schnell
            - Kleiner Markt mit einer Mehrheit von privaten Verkäufern
            - Oft günstiger als in der Hauptstadt bei gleichem Zustand
        subotica:
          lead: 'Subotica liegt an der Grenze zu Ungarn, und das spiegelt sich im Markt wider: viele Fahrzeuge, die aus der EU importiert wurden, und Verkäufer, die sich ständig damit beschäftigen.'
          points:
            - Grenzmarkt — viele frische Importe aus der Europäischen Union
            - Die Historie vor dem Import überprüfen wir besonders sorgfältig
            - Bequemer Punkt, wenn Sie planen, das Auto weiter nach Norden zu fahren
        madrid:
          lead: 'Der Hauptstadtmarkt Spaniens: die größte Auswahl im Land und viele Autos aus Firmenflotten. Kontinentalklima, daher gibt es hier weniger Korrosion als an der Küste.'
          points:
            - Die größte Auswahl in Spanien, einschließlich Firmenfahrzeuge
            - Weit weg vom Meer — Karosserien sind normalerweise sauberer als die an der Küste
            - 'Heiße Sommer: Kunststoff, Lack und Klimaanlage prüfen wir gesondert'
        barcelona:
          lead: Alles hängt von der Nähe zum Meer ab. Autos sehen oft gut von unten aus, benötigen aber Aufmerksamkeit für versteckte Hohlräume und die Elektrik.
          points:
            - 'Das Meer ist nah, daher überprüfen wir versteckte Hohlräume: von unten ist es oft sauber, von innen aber nicht'
            - Viele ehemalige Miet- und Carsharingfahrzeuge
            - Der Hafen ist in der Nähe, der Versand per Schiff lässt sich einfacher organisieren
        zurich:
          lead: Zürich ist der teuerste Automarkt der Region. Hier werden maximal ausgestattete Fahrzeuge bevorzugt, die beim Händler gewartet werden und verkauft werden, bevor sie groß Abnutzung zeigen.
          points:
            - Maximal ausgestattete Fahrzeuge mit geringen Laufleistungen
            - Händlerwartung — die Historie ist fast immer vollständig
            - Schweiz nicht in der EU, Einfuhr wird separat abgewickelt
        geneva:
          lead: Genf liegt im französischsprachigen Teil der Schweiz, direkt an der Grenze zu Frankreich. Französische Marken sind auf dem Markt deutlich zahlreicher als im deutschen Teil des Landes.
          points:
            - 'Gemischter Markt: Schweizer Zustand, französisches Sortiment'
            - Die Grenze zu Frankreich ist nah — es gibt Preisvergleiche
            - 'Abwicklung wie überall in der Schweiz: Export plus Import'
        paris:
          lead: 'Die größte Auswahl in Frankreich kommt mit der härtesten Nutzung: dichter Verkehr und enge Parkplätze hinterlassen Spuren an Karosserie und Fahrwerk.'
          points:
            - Die größte Auswahl in Frankreich, insbesondere bei französischen Marken
            - 'Städtischer Fahrzyklus: Reifen, Fahrwerk und kleine Karosserieschäden'
            - Viele Diesel — Rußpartikelfilter und EGR überprüfen wir zuerst
        lyon:
          lead: Lyon ist ruhiger als Paris, sowohl bei Preisen als auch beim Zustand der Fahrzeuge. Die Autobahn nach Süden ist in der Nähe, daher findet man häufig Autos mit gleichmäßigen Autobahnkilometern.
          points:
            - Preise unter den Pariser Preisen bei vergleichbarem Angebot
            - Mehr Autobahnkilometer, weniger städtischer Verschleiß
            - Bequeme Anbindung an Italien und Spanien, wenn wir weiter suchen
        milan:
          lead: 'Die Geschäftshauptstadt Italiens, und das zeigt sich auch auf dem Markt. Der Norden des Landes ist näher an deutschen Bedingungen: die Straßen sind besser, die Autos gepflegter als im Süden.'
          points:
            - Die beste Auswahl im Premium-Sektor in Italien
            - Der Norden — weniger Salz und Korrosion als im Süden des Landes
            - 'Dichte Stadt: ein Lackdickenmessgerät ist unerlässlich'
        rome:
          lead: Ein großer Markt mit einer sehr dichten städtischen Nutzung. Kleine Kratzer gelten hier als normal, und werden oft schnell repariert.
          points:
            - Viele Kleinwagen und Autos mit Gasanlage
            - Häufige Nachlackierungen nach Stadtverkehr — wir prüfen jedes Blech
            - Südlich von Mailand — das Klima ist milder, aber näher am Meer
        warsaw:
          lead: Über Warschau kommt der Hauptimport aus Westeuropa ins Land, hier gibt es auch die größte Auswahl in Polen. Der Anteil der wiederaufbereiteten Fahrzeuge ist am höchsten.
          points:
            - Die größte Auswahl in Polen, viele frische Importe aus der EU
            - Die Geometrie der Karosserie und Reparaturspuren überprüfen wir zuerst
            - Kurze Lieferwege — günstiger als aus Südeuropa
        krakow:
          lead: 'Krakau ist ruhiger als Warschau: der Markt ist kleiner, weniger Wiederverkäufe, und die Autos bleiben öfter länger bei einem Besitzer. Der Süden Polens ist logistisch näher zu den Balkanländern.'
          points:
            - Weniger Händler als in Warschau, die Historie ist normalerweise sauberer
            - Preise sind oft niedriger als in der Hauptstadt
            - Näher an der Route nach Süden — praktisch für den Transport nach Serbien
