            - 'Europäische Herkunft kann nicht bestätigt werden: EUR1 wird hier nicht angewendet, Zollgebühren sind höher'
            - 'Garantie und Ersatzteile: Wir überprüfen, ob das Modell im Zielland unterstützt wird'
            - 'Elektroautos: Wir vergleichen den Ladeanschluss und die Kompatibilität mit den lokalen Netzwerken'
