        metaTitle: Autoauswahl in Europa – schlüsselfertig
        metaDescription: 'Wir suchen Autos in Deutschland, Serbien, Spanien, der Schweiz, Italien, Frankreich, Polen und Portugal: Suche, Besichtigung, Verhandlung und Lieferung schlüsselfertig.'
        title: Autoauswahl
        titleHighlight: schlüsselfertig
        description: Wir wählen ein Fahrzeug in dem Land aus, in dem Sie sich befinden oder den Kauf planen – umfassende Prüfung, Begleitung des Geschäfts und Lieferung schlüsselfertig. Wählen Sie ein Land, um die Details zu sehen.
        breadcrumbLabel: Autoauswahl
        casesHeading: Fälle der Autoauswahl
        chooseCountryLabel: 'Wählen Sie ein Land:'
        ctaLabel: Auto auswählen
        heroPhotoAlt: Reihe von Autos auf dem Ausstellungsgelände eines Händlers
        processHeading: So läuft die Auswahl ab
        processLead: 'Von der Anfrage bis zu den Schlüsseln dauert es in der Regel zwei bis vier Wochen. Am längsten suchen wir nach dem Auto: das erste geeignete nehmen wir nicht und suchen weiter, bis wir eines finden, zu dem nach der Prüfung keine Fragen offenbleiben.'
        processSteps:
          - n: '01'
            text: Wir besprechen das Budget, die Marke und die Anforderungen – was wichtig ist und worauf Sie bereit sind, zu verzichten.
          - n: '02'
            text: Wir filtern vor Ort die Optionen aus und sortieren telefonisch alles aus, was nicht den Anforderungen standhält.
          - n: '03'
            text: Wir fahren zur Besichtigung mit einem Messgerät und Scanner, bei BMW verbinden wir uns mit der Händler-ISTA, machen Fotos und Videos.
          - n: '04'
            text: Wir senden Ihnen einen Bericht und sagen offen, ob es sich lohnt, das Auto zu kaufen oder weiter zu suchen.
          - n: '05'
            text: Wir verhandeln, schließen den Deal ab und übergeben das Auto an Sie oder bringen es zu Ihrer Tür.
        includedHeading: Was in unsere Dienstleistungen enthalten ist
        includedLead: Die Provision wird vor Beginn festgelegt und hängt nicht davon ab, wie viele Autos wir besichtigt haben. Wenn wir nach der Prüfung sagen, "nehmen Sie es nicht" – suchen wir weiter, dafür müssen Sie nicht extra zahlen.
        included:
          - title: Suche ohne Begrenzung der Optionen
            text: Wir arbeiten, bis wir ein Auto finden, zu dem es keine Beschwerden gibt. Die Ablehnung eines unpassenden Exemplars ist im Service enthalten und kostet nichts zusätzlich.
          - title: Besuch eines Experten bei jeder Besichtigung
            text: Messgerät für die Karosserie, Scanner für die Komponenten, Hebebühne wo nötig. Fotos und Videos von allen problematischen Stellen – Sie sehen dasselbe wie wir.
          - title: Prüfung der Geschichte und rechtlichen Reinheit
            text: CarVertical Bericht nach VIN, dealer service history nach Marke, Kilometerstandkontrolle, Pfand, Registrierungseinschränkungen und offene Versicherungsfälle.
          - title: Verhandlung und Vertrag
            text: Wir verhandeln über den Preis unter Berücksichtigung der Funde, bereiten die Dokumente vor und begleiten die Unterzeichnung.
          - title: Lieferung und Zulassung
            text: Wir bringen das Auto in Ihre Stadt und helfen bei der Anmeldung vor Ort – oder wir übergeben die Schlüssel dort, wo es für Sie am bequemsten ist.
          - title: Ein Ansprechpartner für den gesamten Prozess
            text: Sie arbeiten mit demselben Spezialisten zusammen, der die Besichtigung durchgeführt hat. Es ist nicht nötig, jeder Person, die ans Telefon geht, die Aufgabe neu zu erklären.
        compareHeading: Wie sich die Märkte unterscheiden
        compareLead: Dasselbe Modell in Deutschland und Polen – bezüglich der Geschichte und des Preises ist das zwei verschiedene Autos.
        compareHint: Wählen Sie ein Land – wir zeigen Ihnen, worauf wir dort zuerst achten.
