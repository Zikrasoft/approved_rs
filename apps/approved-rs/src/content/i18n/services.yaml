    vehicle-inspection:
      title: Fahrzeuginspektion
      description: Unabhängige Überprüfung eines Fahrzeugs vor dem Kauf. Anfahrt des Experten, Diagnose, Bericht — ohne Kaufverpflichtung.
      ctaLabel: Inspektion anfordern
      casesHeading: Inspektionsfälle
      breadcrumbLabel: Fahrzeuginspektion
      steps:
        - n: '01'
          text: Karosserie und Lackierung — Vorhandensein von Reparaturen oder Unfällen
        - n: '02'
          text: Fahrwerk, Federung, Bremsen
        - n: '03'
          text: Motor, Getriebe, Antriebsstrang
        - n: '04'
          text: Elektronik und Servicehistorie anhand der VIN
        - n: '05'
          text: Rechtliche Sauberkeit — Pfand, Registrierungsverbot, Unfälle
      extraLine: Wir arbeiten auch in anderen europäischen Ländern, einschließlich Portugal — fragen Sie bei der Anfrage nach.
      hub:
        metaTitle: Fahrzeuginspektion vor dem Kauf in Europa
        metaDescription: 'Wir fahren zu dem Fahrzeug, das Sie selbst gefunden haben: Lackdickenmessgerät, Scanner, Überprüfung der VIN-Historie und Bericht mit Fotos am selben Tag. Wir sind in acht europäischen Ländern tätig.'
        title: Fahrzeuginspektion
        titleHighlight: vor dem Kauf
        description: 'Wir fahren zu dem Fahrzeug, das Sie selbst gefunden haben, und erklären, was tatsächlich damit ist. Der Bericht kommt, bevor Sie Ihr Geld übergeben: Wenn die Antwort lautet „nicht kaufen“, verlieren Sie nur die Kosten für die Inspektion.'
        breadcrumbLabel: Fahrzeuginspektion
        casesHeading: Inspektionsfälle
        chooseCountryLabel: 'Wählen Sie ein Land:'
        ctaLabel: Inspektion anfordern
        heroPhotoAlt: Auto auf einer Hebebühne im Service
        processHeading: So läuft die Inspektion ab
        processLead: In der Regel fahren wir innerhalb von ein bis zwei Tagen nach der Anfrage los. Die Besichtigung selbst dauert anderthalb bis zwei Stunden, den Bericht senden wir am selben Tag, während das Auto noch nicht zu einem anderen Käufer gegangen ist.
        processSteps:
          - n: '01'
            text: Sie senden den Link zur Anzeige und die Kontaktdaten des Verkäufers
          - n: '02'
            text: Wir einigen uns mit dem Verkäufer über Zeitpunkt und Ort der Besichtigung
          - n: '03'
            text: Wir fahren mit Dicke-Messgerät und Scanner, bei BMW verbinden wir uns mit dem Händler-ISTA, falls nötig — auf die Hebebühne
          - n: '04'
            text: Wir machen Fotos und Videos von allen Funden, überprüfen die Historie anhand der VIN
          - n: '05'
            text: Wir senden den Bericht und eine klare Empfehlung — kaufen, verhandeln oder ablehnen
        includedHeading: Was in die Inspektion einfließt
        includedLead: 'Über hundert Punkte auf der Checkliste, aber entscheidend sind fast immer vier Bereiche: Karosserie, Motor mit Getriebe, Fahrwerk und Dokumente. Gerade hier überzeugen wir am häufigsten vom Kauf ab.'
        included:
          - title: Karosserie und Lackierung
            text: Lackdickenmessung an jedem Panel, Geometrie der Öffnungen, Spuren von Schweiß- und Spachtelarbeiten. Sichtbar, ob Reparaturen vorgenommen wurden, die der Verkäufer nicht erwähnt hat.
          - title: Motor und Getriebe
            text: Parameter bei warmem Motor, Anpassungen des Getriebes, Fehler in den Computerspeichern. Der teuerste Bereich und häufigster Grund für Ablehnungen.
          - title: Fahrwerk und Bremsen
            text: Spiel, Zustand der Federung und Bremsanlage. Autobahnmileage und Balkanstraßen nutzen Autos unterschiedlich ab, und das ist sichtbar.
          - title: Elektronik und Historie anhand VIN
            text: CarVertical-Bericht, Händler-Servicehistorie markenspezifisch, Abweichungen der Kilometerstände in der Historie, Fehler der Steuergeräte und Hinweise auf ausgefallene Airbags.
          - title: Rechtliche Sauberkeit
            text: Pfand, Registrierungsbeschränkungen, offene Unfälle und Versicherungsfälle — das kommt oft erst nach dem Kauf ans Licht.
          - title: Bericht mit Fotos und Videos
            text: Jeder Fund ist fotografiert und kommentiert. Der Bericht bleibt bei Ihnen — er ist nützlich zur Verhandlung, selbst wenn Sie das Auto letztendlich kaufen.
        compareHeading: Was sich von Land zu Land ändert
        compareLead: Die Vorschriften zur Fahrzeuginspektion, typische Schwächen lokaler Fahrzeuge und Optionen, die Historie überall zu verbergen.
        compareHint: Wählen Sie ein Land — wir zeigen, was wir zur herkömmlichen Checkliste hinzufügen.
        compareLinkFor: Inspektion {location} — im Detail
        mapHeading: Vier Bereiche, die den Deal entscheiden
        mapLead: Die Checkliste ist lang, aber wir überzeugen fast immer in einem der vier Bereiche. Klicken Sie auf die Nummer im Diagramm — wir zeigen, was der Experte untersucht und was wir dort fanden.
      countryNotesHeadingFor: So überprüfen wir {location}
      countryNotesPointsLabel: Was wir über die übliche Checkliste hinaus prüfen
      countryNotes:
        de:
          lead: 'In Deutschland gibt es viele Grundlagen: Serviceheft, HU-Protokolle und entwickelte VIN-Datenbanken. Deshalb ist die Inspektion hier in erster Linie ein Abgleich der Dokumente mit dem, was das Auto tatsächlich zeigt.'
          points:
            - Wir prüfen die Werkstattangebote nach Jahren mit den Kilometerständen
            - Anmerkungen des letzten HU — was nach der Inspektion repariert wurde und was nur hinausgezögert wurde
            - Unterboden und Schweller nach Winterreagenzien, einschließlich versteckter Hohlräume
            - 'Leasingvergangenheit: regelmäßige Wartung bei hohem Kilometerstand'
        rs:
          lead: 'In Serbien fahren wir am Tag der Anfrage los. Das Hauptziel ist es, die Geschichte des Fahrzeugs bis zur Einfuhr wiederherzustellen: Lokale Dokumente zeigen nur den letzten Teil des Lebens des Autos.'
          points:
            - Herkunftsland und Zustand des Fahrzeugs vor der Einfuhr nach Serbien
            - Kilometerstand gegen die Jahreszahlen der technischen Inspektionen
            - Karosseriereparatur nach der Einfuhr — wird hier häufiger und günstiger durchgeführt als in der EU
            - 'Rechtliche Aspekte: Pfand und Einschränkungen bei der Registrierung'
        es:
          lead: Spanische Autos überzeugen meist durch ihren Unterboden und enttäuschen in allem, was unter Sonnenlicht und Salzwasser leidet. Die Inspektion verlagern wir von der Korrosion unter dem Auto in versteckte Hohlräume, Elektronik und Innenraumzustand.
          points:
            - Korrosion in versteckten Hohlräumen an der Küste — unter dem Auto kann es sauber sein
            - Lack, Dichtungen und Kunststoff nach jahrelangem Sonnenlicht
            - 'Mietvergangenheit: wir vergleichen den Kilometerstand mit dem Abnutzungsgrad des Innenraums'
            - ITV-Protokoll und was zwischen den Inspektionen ungeschlossen blieb
        ch:
          lead: Für MFK werden die Fahrzeuge ordentlich vorbereitet, daher sagt ein frisches Protokoll an sich wenig aus. Wir betrachten, was direkt vor der Inspektion gemacht wurde, und was seit dem letzten Jahr sein eigenes Leben führt.
          points:
            - Was unmittelbar vor der MFK ersetzt wurde — neue Teile im Vergleich zum Rest
            - Wartung ist teuer, daher prüfen wir, ob der Wartungsplan eingehalten wurde
            - Reichhaltige Ausstattung, aber wir überprüfen, dass jede Option noch funktioniert
            - 'Dokumente zur Einfuhr: die Schweiz ist nicht in der EU, das Set ist anders'
        pt:
          lead: 'Hier kommt alles auf das feuchte Meeresklima an. Wir beginnen die Inspektion mit Korrosion und Elektronik: Gewöhnlich sind es die Dinge, die im Nassen leben, die uns enttäuschen.'
          points:
            - Versteckte Hohlräume, Längsträger und Punkte zur Aufhängung
            - Oxidation von Steckern und Steuergeräten — eine typische Ursache für schwankende Fehler
            - IPO-Protokoll und Regelmäßigkeit der Inspektionen
            - 'Dieselfahrzeuge mit Stadtbetrieb: Partikelfilter und seine Historie'
        fr:
          lead: 'In Frankreich gibt es eine umfassende contrôle technique, das ist ein guter Ausgangspunkt. Danach betrachten wir, was die Vorschriften nicht erfassen: den Zustand der Dieselmotoren und den Verschleiß durch städtischen Verkehr.'
          points:
            - Anmerkungen der contrôle technique über die Jahre — was sich von Inspektion zu Inspektion wiederholt
            - Partikelfilter, EGR und Turbine bei Dieselmotoren
            - Kupplung und Federung nach einem intensiven Stadtverkehr
            - 'Historie bei französischen Marken: verfügbare Ersatzteile, aber eigene Schwächen'
        it:
          lead: Italienische Autos kommen häufiger mit kleinen Karosseriereparaturen, die schnell und günstig gemacht wurden. Hier benötigt das Messgerät an den Paneelen deutlich mehr Zeit als gewöhnlich.
          points:
            - Lackdickenmessung an allen Paneelen — Nachlackierungen nach städtischen Anstößen
            - 'Unterschied zwischen Nord und Süd: Salz an der Küste, gewöhnlicher Verschleiß im Landesinneren'
            - Gasanlage, wenn vorhanden — Installation und Zustand des Tanks
            - Regelmäßigkeit der revisione und versäumte Zeiträume
        pl:
          lead: Polen ist der größte Umschlagplatz für verunfallte Autos aus Westeuropa. Daher klären wir als erstes, was mit dieser Karosserie vor dem Verkauf gemacht wurde.
          points:
            - Geometrie der Öffnungen und Spuren von Schweißarbeiten — Wiederherstellung nach schweren Unfällen
            - 'Einfuhrhistorie: woher das Auto kam und in welchem Zustand'
            - Kilometerstand vergleichen wir mit europäischen Servicedaten, dem Tachometer glauben wir nicht
            - Airbags und deren Auslösung in der Vergangenheit
      closing:
        eyebrow: Haben Sie ein Auto gefunden?
        line1: Senden Sie den Link
        line2: zur Anzeige —
        accentWord: wir kommen vorbei und schauen uns das an
        text: Wir sind innerhalb von ein bis zwei Tagen unterwegs. Der Bericht mit Fotos bleibt bei Ihnen, selbst wenn Sie nach ihm vom Kauf absehen.
    cityVehicleSourcing:
      title: Fahrzeugbeschaffung
      descriptionFor: Wir finden ein Auto in {cityLocation} mit umfassender Überprüfung. Wir arbeiten in der gesamten Region {countryName}.
      casesHeadingFor: Fallstudien aus {countryGenitiveOrName}
      whyCityHeadingFor: Warum {cityName}
      reason1: Wir schauen sowohl bei Händlern als auch bei privaten Anzeigen.
      reason2: Die Geschichte anhand der VIN wird vor der Besichtigung überprüft.
      reason3For: Unser Experte in {cityLocation}
      reason4Dekra: DEKRA / TÜV-Prüfung auf Anfrage.
      reason4Generic: Unabhängige technische Expertise auf Anfrage.
      otherCitiesLabelFor: 'Weitere Städte in {countryLocation}:'
      cityNotesHeadingFor: Automarkt in {cityLocation}
      cityNotesPointsLabel: Was bedeutet das in der Praxis
      cityNotes:
        berlin:
          lead: 'In Berlin gibt es die größte Auswahl in Deutschland und die vielfältigste Gruppe von Verkäufern. Hier trifft man alles an: sowohl Fahrzeuge aus Unternehmensflotten mit voller Historie als auch Weiterverkäufe aus Osteuropa.'
          points:
            - Riesige Auswahl in jedem Segment, einschließlich seltener Ausstattungen.
            - Viele private Verkäufer — bessere Verhandlungsmöglichkeiten als bei Händlern.
            - 'Städtischer Betrieb: Kupplung und Federung nutzen sich schneller ab als bei Autobahnfahrzeugen.'
        munich:
          lead: 'Eine teure Stadt mit teuren Autos. Die Premium-Segmente sind hier zahlreicher als irgendwo sonst in Deutschland, und der Zustand ist im Durchschnitt besser: Diese Fahrzeuge werden gut gepflegt.'
          points:
            - Starkes Premium-Segment, insbesondere BMW und Mercedes.
            - Gepflegte Autos mit vollständiger Händlerhistorie.
            - Preise liegen über dem Landesdurchschnitt — Einsparungen ergeben sich aus dem Zustand.
        hamburg:
          lead: Eine Hafenstadt und ein großes logistasisches Zentrum. Von hier aus lässt sich das Auto bequem weiter verschicken, und der Markt hat oft frische Importfahrzeuge.
          points:
            - Der Hafen in der Nähe — einfacher und günstiger, um den Versand zu organisieren.
            - Viele Autos aus den nördlichen Regionen mit Autobahnkilometern.
            - 'Feuchtes Seeklima: Wir prüfen Karosserie und verborgene Hohlräume genauer.'
        belgrade:
          lead: Unsere Basis. In Belgrad führen wir die Besichtigung am Tag der Anfrage durch, kennen die lokalen Verkäufer und wissen, welches Auto seit zwei Monaten auf dem Markt ist.
          points:
            - Besichtigung am Tag der Anfrage, ohne Wartezeiten und Logistik.
            - Wir kennen die lokalen Märkte und die Geschichte der Fahrzeuge.
            - Das Auto ist bereits verzollt — Einfuhr und Zölle sind nicht erforderlich.
        novi-sad:
          lead: Die zweitgrößte Stadt Serbiens, eine Stunde von Belgrad entfernt. Der Markt ist kleiner, aber die Preise sind normalerweise ruhiger als in der Hauptstadt, und die Autos haben seltener mehrere Weiterverkäufe durchlaufen.
          points:
            - Preise sind unter den Belgrader Preisen bei vergleichbarem Zustand.
            - Weniger Weiterverkäufer, häufiger die Erstbesitzer.
            - Wir fahren von Belgrad — keine zusätzlichen Kosten für die Anfahrt.
        pancevo:
          lead: Pancevo gehört eigentlich zur Metropolregion Belgrad, daher unterscheidet sich die Besichtigung nicht von der in der Hauptstadt. Der Markt ist klein, dafür sind private Anzeigen interessanter.
          points:
            - Zwanzig Minuten von Belgrad — wir fahren genauso schnell hin.
            - Kleiner Markt mit einem Übergewicht an privaten Verkäufern.
            - Oft günstiger als in der Hauptstadt bei gleichem Zustand.
        subotica:
          lead: 'Subotica liegt an der Grenze zu Ungarn, was sich auch im Markt widerspiegelt: Viele Autos wurden aus der EU importiert, und die Verkäufer beschäftigen sich ständig damit.'
          points:
            - Grenzmarkt — viel frischeimporte aus der Europäischen Union.
            - Die Historie vor dem Import prüfen wir besonders sorgfältig.
            - Ein praktischer Standort, wenn Sie planen, das Auto weiter nach Norden zu bringen.
        madrid:
          lead: 'Der Hauptstadtmarkt Spaniens: die größte Auswahl im Land und viele Fahrzeuge aus Unternehmensflotten. Das kontinentale Klima sorgt dafür, dass es hier weniger Küstenkorrosion gibt.'
          points:
            - Die größte Auswahl in Spanien, einschließlich Firmenwagen.
            - Abseits des Meeres — Karosserien sind normalerweise sauberer als die an der Küste.
            - 'Heißer Sommer: Kunststoff, Lack und Klimaanlage überprüfen wir gesondert.'
        barcelona:
          lead: Alles wird durch die Nähe zum Meer bestimmt. Autos sehen unten oft fantastisch aus, benötigen jedoch Aufmerksamkeit für versteckte Hohlräume und die Elektrik.
          points:
            - 'Das Meer ist nah, deshalb prüfen wir versteckte Hohlräume: von unten oft sauber, aber innen nicht.'
            - Viele ehemalige Mietwagen und Carsharing-Fahrzeuge.
            - Der Hafen in der Nähe erleichtert den Versand per See.
        zurich:
          lead: Zürich ist der teuerste Automark im gesamten Raum. Hier sind die Ausstattungen maximal, es wird beim Händler gewartet, und die Autos werden verkauft, bevor sie wirklich alt werden.
          points:
            - Maximale Ausstattungen und geringe Laufleistungen.
            - Händlerwartung — die Historie ist fast immer vollständig.
            - Schweiz ist nicht in der EU, die Einfuhr wird gesondert geregelt.
        geneva:
          lead: Genf liegt im französischsprachigen Teil der Schweiz, direkt an der Grenze zu Frankreich. Auf dem Markt gibt es deutlich mehr französische Marken als im deutschen Teil des Landes.
          points:
            - 'Gemischter Markt: Schweizer Zustand, französisches Sortiment.'
            - Die Grenze zu Frankreich ist nah — es gibt Vergleichsmöglichkeiten bezüglich des Preises.
            - 'Die Formalitäten sind die gleichen wie in der ganzen Schweiz: Export plus Import.'
        paris:
          lead: 'Die größte Auswahl in Frankreich wird zusammen mit der härtesten Nutzung angeboten: dichter Verkehr und enge Parkplätze hinterlassen Spuren auf Karosserie und Fahrwerk.'
          points:
            - Die größte Auswahl in Frankreich, besonders bei französischen Marken.
            - 'Städtischer Betrieb: Kupplung, Federung und kleine Karosserieschäden.'
            - Viele Dieselfahrzeuge — Partikelfilter und EGR überprüfen wir zuerst.
        lyon:
          lead: Lyon ist ruhiger als Paris, sowohl bei den Preisen als auch beim Zustand der Fahrzeuge. Die Autobahn in Richtung Süden ist in der Nähe, weshalb es häufiger Fahrzeuge mit gleichmäßigen Autobahnkilometern gibt.
          points:
            - Preise liegen unter denen von Paris bei vergleichbarem Angebot.
            - Mehr Autobahnkilometer, weniger städtische Abnutzung.
            - Praktische Verbindung nach Italien und Spanien, wenn wir breiter suchen.
        milan:
          lead: 'Die Geschäftshauptstadt Italiens, und das sieht man auch auf dem Markt. Der Norden des Landes ähnelt eher den deutschen Bedingungen: die Straßen sind besser, die Autos gepflegter als im Süden.'
          points:
            - Die beste Auswahl im Premium-Segment in Italien.
            - Der Norden — weniger Salz und Korrosion als im Süden.
            - 'Dichter Verkehr in der Stadt: ein Schichtmesser ist obligatorisch.'
        rome:
          lead: Ein großer Markt mit sehr intensiver städtischer Nutzung. Kleine Kratzer gelten hier als Normalität und werden oft sehr schnell repariert.
          points:
            - Viele Kleinwagen und Autos mit Gasanlage.
            - Häufige Nachlackierungen nach städtischen Kontakten — wir prüfen jedes Blech.
            - Südlich von Mailand ist das Klima milder, aber näher am Meer.
        warsaw:
          lead: Durch Warschau gelangt der Hauptimport aus Westeuropa ins Land, und hier gibt es die größte Auswahl in Polen. Auch der Anteil an wiederhergestellten Fahrzeugen ist hier am höchsten.
          points:
            - Die größte Auswahl in Polen, viele frische Importe aus der EU.
            - Die Karosseriegeometrie und Reparaturspuren prüfen wir als erstes.
            - Kurzes Transportgewicht — günstiger als aus Südeuropa.
        krakow:
          lead: 'Krakau ist ruhiger als Warschau: der Markt ist kleiner, es gibt weniger Weiterverkäufe, und die Autos haben oft einen längerfristigen Erstbesitzer. Der Süden Polens ist logistisch näher zu den Balkanstaaten.'
          points:
            - Weniger Weiterverkäufer als in Warschau, die Historie ist normalerweise sauberer.
            - Preise sind oft niedriger als in der Hauptstadt.
            - Näher an der Route nach Süden — praktisch für die Lieferung nach Serbien.
