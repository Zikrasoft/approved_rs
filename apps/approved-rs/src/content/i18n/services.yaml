translations:
  en:
    vehicle-sourcing:
      hub:
        metaTitle: Car sourcing in Europe - turnkey service
        metaDescription: 'We source cars in Germany, Serbia, Spain, Switzerland, Italy, France, Poland, and Portugal: search, inspection, negotiation, and delivery included.'
        title: Car Sourcing
        titleHighlight: turnkey
        description: We source vehicles in the country you are located or plan to buy from — comprehensive inspection, deal support, and delivery included. Choose a country to see more details.
        breadcrumbLabel: Car Sourcing
        casesHeading: Real car sourcing deals
        chooseCountryLabel: 'Choose a country:'
        ctaLabel: Source a car
        heroPhotoAlt: A row of cars at the dealer's lot
        processHeading: How sourcing works
        processLead: "From request to keys usually takes from three days to two weeks. The longest part is the search: we don't settle for the first suitable car, we keep looking until we find one that checks all the boxes after inspection."
        processSteps:
          - n: '01'
            text: We discuss budget, brand, and requirements — what's important and what can be compromised
          - n: '02'
            text: We shortlist options onsite and filter out via phone all that doesn't meet our questions
          - n: '03'
            text: We inspect the car with a thickness gauge and scanner, for BMW we connect to the dealer's ISTA, and we take photos and videos
          - n: '04'
            text: We send a report and directly advise whether to buy it or continue searching
          - n: '05'
            text: We negotiate, finalize the deal, and deliver the car to you or bring it to your doorstep
        includedHeading: What's included in the service
        includedLead: The fee is fixed before we start and doesn't depend on how many cars we need to inspect. If we say 'don't buy' after the inspection, we keep searching at no extra charge.
        included:
          - title: Unlimited options search
            text: We work until we find a car that meets all your criteria. Declining a failed option is part of the service and incurs no additional cost.
          - title: Expert onsite for each inspection
            text: Thickness meter for the panels, scanner for the blocks, lift where needed. Photos and videos of all problematic areas — you see the same as we do.
          - title: History and legal status checks
            text: CarVertical report by VIN, dealer service history by brand, mileage verification, liens, registration restrictions, and unresolved insurance claims.
          - title: Negotiation and deal finalization
            text: We agree on the price based on findings, prepare documents, and assist with signing.
          - title: Delivery and registration assistance
            text: We deliver the car to your city and help with the registration — either handing over the keys where it's convenient for you to pick it up.
          - title: One point of contact for the entire process
            text: You work with the same specialist who went for the inspection. There's no need to explain your needs to each person who answers the phone.
        compareHeading: How the markets differ
        compareLead: The same model in Germany and Poland has different histories and prices.
        compareHint: Choose a country — we'll show you what we look for first there.
        compareLinkFor: Sourcing in {location} — details
      title: Turnkey Car Sourcing
      descriptionFor: We'll source a vehicle in {location} — from those that are already in this country, without importing from abroad. Comprehensive inspection, deal support, and delivery to your city.
      ctaLabel: Submit a request
      casesHeadingFor: 'Real deals: car sourcing in {location}'
      breadcrumbLabelFor: Cars in {location}
      stepsFor:
        - n: '01'
          text: You submit a request with your requirements — budget, brand, mileage
        - n: '02'
          text: We search for options in {location} based on your criteria
        - n: '03'
          text: An independent expert inspects and checks the vehicle
        - n: '04'
          text: We assist with the deal, help with documents and registration
        - n: '05'
          text: We deliver the vehicle to your city and help register it
      deliveryLineFor: We deliver the car to any city in the country. If it needs to be exported, we handle the customs clearance and transport to {destinations} or any other country.
      deliveryDestinations:
        - Bosnia and Herzegovina
        - Croatia
        - North Macedonia
        - Turkey
        - Kazakhstan
        - Kyrgyzstan
      citiesHeadingFor: Where we inspect cars in {countryLocation}
      citiesLead: An expert travels across the country, but we usually inspect cars where they are most commonly listed. Here's what it means for each city.
      alsoInLabel: 'We also source in:'
      crossSellLabel: Need a non-local vehicle?
      countryNotesHeadingFor: What we consider in {location}
      countryNotesPointsLabel: What we prioritize
      countryNotes:
        de:
          lead: 'The selection here is greater than in any other market in Europe, and service histories are usually traceable: most cars have a service book with dealer stamps for each service. However, the downside is highway mileage. Two hundred thousand kilometers in three years is standard, not a reason for a discount.'
          points:
            - Service book and dealer stamps — we verify against VIN at official service centers
            - HU protocol, commonly referred to as TÜV — we read comments from the last inspection, not only the stamp
            - 'Cars from leasing and corporate fleets: well maintained, but high mileage'
            - Wintry roads with de-icing agents — we inspect the undercarriage and sills separately
        rs:
          lead: We are on-site, so we inspect the vehicle on the same day of inquiry without need for import. The market is small, and the same car often passes through several sellers, so tracing its history can be complicated.
          points:
            - The vehicle is already cleared and has local plates — no import duties or clearance needed
            - Mileage often gets tampered with during local resale — we cross-check with the technical inspection records
            - Many imported cars from Germany and Italy — we check the car's history prior to import
            - Inspection on the same day, with no wait for logistics
        es:
          lead: Mild winters and almost no de-icing agents on the roads, so the undercarriage of Spanish cars is usually in much better shape than German ones. However, the sun and proximity to the sea take a toll on the paint, plastic, and rubber components.
          points:
            - Coastal areas — we look for corrosion primarily in hidden cavities
            - Faded lacquer and cracked interior plastics — we factor those into the cost
            - 'Many former rental cars: even mileage, but harsh usage'
            - ITV protocol — we check the remarks and inspection dates
        ch:
          lead: 'Swiss cars are generally better maintained than the European average: expensive servicing ensures discipline, and mileage is low. However, Switzerland is not in the EU, so imports are handled differently, which we budget for in advance.'
          points:
            - Rich configurations — they are more common here than in neighboring countries
            - MFK — inspections are strict, preparation is serious, and it shows in the car
            - 'Not EU: customs and documentation process differ from EU countries'
            - Prices are above market, but you save on repairs later
        pt:
          lead: The market is small, selection is more modest than in Spain, but competition for a good car is lower. The climate is humid and salty — seaside corrosion can be found even on newer cars.
          points:
            - Humidity and sea — hidden cavities and electrical issues are a priority during inspection
            - 'Small market: searching for specific requests takes longer than in Germany'
            - IPO protocol — we read the remarks from previous inspections
            - Many diesels and small cars, larger bodies are rare
        fr:
          lead: France is primarily about diesel and local brands. Peugeot, Renault, and Citroën are cheaper here than anywhere else in Europe. German premium brands, on the other hand, are more expensive, making them less sensible to buy here.
          points:
            - French brands offer the best prices in Europe, and servicing is cheaper
            - Diesels — checking the particulate filter and EGR valve separately is essential
            - Contrôle technique — protocols are detailed, we verify remarks by year
            - 'Urban use: tires and suspension wear out faster than stated'
        it:
          lead: 'The Italian market is great for small cars and rare configurations, but requires caution: cars here are heavily used, and minor body repairs are not always done carefully.'
          points:
            - City — frequent minor dents and touch-ups, a thickness gauge is essential
            - The south and coastal areas bring salt and corrosion, while the north is closer to German conditions
            - Revisione — we check the regularity, missed inspections occur more often than usual
            - Many cars come with gas equipment — we inspect it separately
        pl:
          lead: 'The largest market closest to us: logistics are cheap and short. However, Poland has long been the main transit point for damaged cars from Western Europe, so we verify the history more thoroughly here than elsewhere.'
          points:
            - High proportion of vehicles restored after accidents — body geometry is a priority
            - 'Frequent resales: a car often changes several owners within a year'
            - Mileage is often adjusted at the import stage — we check against service databases
            - Short delivery distance — cheaper and faster than from Spain or Portugal
      closing:
        eyebrow: How shall we begin?
        line1: Describe the car you are looking for,
        line2: ' — then it’s our job'
        accentWord: to handle the rest
        text: Budget, body style, transmission, and a couple of preferences on top. We search, and you review the reports on options and decide which ones to inspect in person.
    vehicle-buyback:
