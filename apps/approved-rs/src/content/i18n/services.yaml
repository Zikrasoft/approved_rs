  de:
    vehicle-sourcing:
      hub:
        metaTitle: Autoauswahl in Europa, schlüsselfertig
        metaDescription: 'Wir suchen Autos in Deutschland, Serbien, Spanien, der Schweiz, Italien, Frankreich, Polen und Portugal: Suche, Besichtigung, Verhandlung und Lieferung schlüsselfertig.'
        title: Autoauswahl
        titleHighlight: schlüsselfertig
        description: Wir suchen ein Auto in dem Land, in dem Sie sich befinden oder in dem Sie einen Kauf planen. Umfassende Prüfung, Begleitung des Geschäfts und schlüsselfertige Lieferung. Wählen Sie ein Land aus, um die Details zu sehen.
        breadcrumbLabel: Autoauswahl
        casesHeading: Echte Autoauswahl-Transaktionen
        chooseCountryLabel: 'Wählen Sie ein Land:'
        ctaLabel: Auto auswählen
        heroPhotoAlt: Reihe von Fahrzeugen auf dem Gelände eines Händlers
        processHeading: So funktioniert die Auswahl
        processLead: 'Von der Anfrage bis zu den Schlüsseln dauert es in der Regel zwischen drei Tagen und zwei Wochen. Am längsten suchen wir nach dem Auto: das erste passende nehmen wir nicht und suchen weiter, bis wir eins finden, zu dem nach der Prüfung keine Fragen bleiben.'
        processSteps:
          - n: '01'
            text: Wir besprechen Budget, Marke und Anforderungen, was wichtig ist und worauf man verzichten kann.
          - n: '02'
            text: Wir filtern Optionen vor Ort und eliminieren telefonisch alles, was nicht den Fragen standhält.
          - n: '03'
            text: Wir fahren zur Besichtigung mit einem Lackdickenmessgerät und Scanner, für BMW verbinden wir uns mit dem Händler-ISTA, machen Fotos und Videos
          - n: '04'
            text: Wir senden einen Bericht und sagen klar, ob es sich lohnt, das Auto zu kaufen oder ob wir weiter suchen.
          - n: '05'
            text: Wir verhandeln, schließen den Deal ab und übergeben das Auto an Sie oder bringen es zu Ihrer Tür.
        includedHeading: Was in der Leistung enthalten ist
        includedLead: Die Provision wird vor Beginn festgelegt und hängt nicht davon ab, wie viele Autos wir anschauen mussten. Wenn wir nach der Prüfung sagen, 'kaufen Sie nicht', suchen wir weiter, dafür müssen Sie nichts extra zahlen.
        included:
          - title: Unbegrenzte Anzahl an Optionen
            text: Wir arbeiten, bis wir ein Auto finden, zu dem es keine Beanstandungen gibt. Die Ablehnung einer unangemessenen Option gehört zur Arbeit und kostet nichts zusätzlich.
          - title: Expertise bei jeder Besichtigung
            text: 'Lackdickenmessgerät für die Karosserie, Scanner für die Module, Hebebühne, wo nötig. Fotos und Videos von allen problematischen Stellen: Sie sehen das gleiche wie wir.'
          - title: Überprüfung der Historie und rechtlichen Sauberkeit
            text: CarVertical-Bericht anhand der VIN, Händler-Servicehistorie nach Marke, Prüfung des Kilometerstands, Pfandrechte, Registrierungseinschränkungen und noch offene Versicherungsfälle.
          - title: Verhandlung und Vertragsabschluss
            text: Wir handeln den Preis basierend auf dem, was wir gefunden haben, bereiten die Unterlagen vor und begleiten die Unterzeichnung.
          - title: Lieferung und Zulassung
            text: Wir bringen das Auto in Ihre Stadt und helfen bei der Zulassung vor Ort oder übergeben die Schlüssel dort, wo es Ihnen am besten passt.
          - title: Eine Person für den gesamten Prozess
            text: Sie arbeiten mit demselben Spezialisten, der die Besichtigung durchgeführt hat. Es ist nicht nötig, jedem, der ans Telefon geht, die Aufgabe erneut erklären.
        compareHeading: Was die Märkte unterscheidet
        compareLead: Dasselbe Modell in Deutschland und Polen hat in Bezug auf die Geschichte und den Preis zwei unterschiedliche Autos.
        compareHint: Wählen Sie ein Land aus, und wir zeigen Ihnen, wonach wir dort zuerst Ausschau halten.
        compareLinkFor: Fahrzeugsuche {location} im Detail
      title: Schlüsselfertige Autoauswahl
      descriptionFor: Wir suchen ein Auto {location} aus denen, die bereits in diesem Land sind, ohne Import aus dem Ausland. Umfassende Prüfung, Geschäftsbegleitung und Lieferung in Ihre Stadt.
      ctaLabel: Anfrage einreichen
      casesHeadingFor: 'Echte Transaktionen: Autoauswahl {location}'
      breadcrumbLabelFor: Auto {location}
      stepsFor:
        - n: '01'
          text: Sie hinterlassen eine Anfrage mit Anforderungen (Budget, Marke, Kilometerstand)
        - n: '02'
          text: Wir suchen Optionen in {location} nach Ihren Kriterien
        - n: '03'
          text: Ein unabhängiger Experte inspiziert und überprüft das Fahrzeug
        - n: '04'
          text: Wir begleiten die Transaktion, helfen mit den Dokumenten und der Zulassung
        - n: '05'
          text: Wir liefern das Auto in Ihre Stadt und helfen Ihnen bei der Zulassung.
      deliveryLineFor: Wir liefern das Auto in jede Stadt des Landes. Wenn es ins Ausland gebracht werden muss, übernehmen wir den Export und die Zollabfertigung und bringen es nach {destinations} und in jedes andere Land.
      deliveryDestinations:
        - Bosnien und Herzegowina
        - Kroatien
        - Nordmazedonien
        - Türkei
        - Kasachstan
        - Kirgisistan
      citiesHeadingFor: Wo wir Fahrzeuge in {countryLocation} prüfen
      citiesLead: Der Experte fährt im ganzen Land, aber meistens prüfen wir Fahrzeuge dort, wo sie am häufigsten angeboten werden. Das bedeutet Folgendes für jede Stadt.
      alsoInLabel: 'Wir wählen auch in:'
      crossSellLabel: Brauchen Sie kein lokales Auto?
      countryNotesHeadingFor: Was wir in {location} berücksichtigen
      countryNotesPointsLabel: Worauf wir zuerst achten
      countryNotes:
        de:
          lead: 'Hier gibt es mehr Auswahl als in jedem anderen europäischen Markt, und die Servicehistorie lässt sich in der Regel zurückverfolgen: die meisten Fahrzeuge haben ein Serviceheft mit Eintragungen des Händlers für jede Inspektion. Die Kehrseite: Autobahnkilometer. Zweihunderttausend in drei Jahren sind hier normal und kein Grund für einen Preisnachlass.'
          points:
            - Serviceheft und Eintragungen des Händlers, wir prüfen nach VIN beim offiziellen Service.
            - Prüfprotokoll HU, das alle TÜV nennen. Wir lesen die Hinweise der letzten Inspektion, nicht nur den Stempel.
            - 'Fahrzeuge aus Leasing und Unternehmensflotten: gut gewartet, aber hohe Kilometerstände'
            - Winterstraßen mit Streusalz, daher prüfen wir Unterboden und Schweller separat.
        rs:
          lead: Hier sind wir vor Ort, deshalb besichtigen wir das Fahrzeug am Tag der Anfrage und ohne Einfuhr. Der Markt ist klein, dasselbe Fahrzeug kann durch mehrere Verkäufer gegangen sein, und die Historie muss entwirrt werden.
          points:
            - Das Auto ist bereits verzollt und hat lokale Nummernschilder, Zölle und die Einfuhrformalitäten sind nicht erforderlich.
            - Der Kilometerstand wird oft beim Wiederverkauf innerhalb des Landes manipuliert, wir prüfen die Eintragungen beim Technischen Überblick.
            - Viele importierte Autos aus Deutschland und Italien, wir prüfen, was mit dem Auto vor dem Import war.
            - Prüfung am Tag der Anfrage, ohne Wartezeit auf die Logistik
        es:
          lead: Milde Winter und kaum Chemikalien auf den Straßen, sodass der Unterboden spanischer Fahrzeuge in der Regel deutlich besser ist als der deutscher. Aber Sonne und Nähe zum Meer schädigen Lack, Kunststoffe und Gummi.
          points:
            - Küstenregion, daher suchen wir Rost zunächst in versteckten Hohlräumen.
            - Abgeblätterter Lack und rissiger Kunststoff im Innenraum berücksichtigen wir im Preis.
            - 'Viele ehemalige Mietwagen: gleichmäßiger Kilometerstand, aber harte Nutzung.'
            - ITV-Protokoll, wir prüfen die Hinweise und die Prüfungsdaten.
        ch:
          lead: 'Schweizer Fahrzeuge sind deutlich besser gewartet als der europäische Durchschnitt: teure Wartung sorgt für Disziplin, die Kilometerstände sind niedrig. Aber die Schweiz gehört nicht zur EU, daher erfolgt die Einfuhr anders, was wir frühzeitig im Budget einplanen.'
          points:
            - Reichhaltige Ausstattungen, hier wurden sie häufiger genommen als bei Nachbarn.
            - MFK. Die Prüfung ist streng, Vorbereitung ernsthaft, und das sieht man dem Auto an.
            - 'Nicht EU: Zoll und Dokumente werden anders behandelt als in den EU-Ländern'
            - Die Preise liegen über dem Markt, dafür sparen Sie später bei Reparaturen
        pt:
          lead: Der Markt ist klein, die Auswahl ist bescheidener als in Spanien, aber auch die Konkurrenz um gute Autos ist geringer. Das Klima ist feucht und salzig, Küstenkorrosion kommt selbst bei neueren Fahrzeugen vor.
          points:
            - Feuchtigkeit und Meer, deshalb priorisieren wir versteckte Hohlräume und die Elektrik bei der Inspektion.
            - 'Kleiner Markt: wir suchen länger nach spezifischen Anfragen als in Deutschland'
            - IPO-Protokoll, wir prüfen die Hinweise der vorherigen Inspektionen.
            - Viele Diesel und Kleinwagen, große Modelle sind selten
        fr:
          lead: Frankreich ist vor allem Diesel und eigene Marken. Peugeot, Renault und Citroën sind hier günstiger als irgendwo sonst in Europa. Deutscher Premium ist im Gegenteil teurer, und es macht wenig Sinn, ihn hier zu kaufen.
          points:
            - Französische Marken zu den besten Preisen in Europa und die Wartung ist günstiger.
            - Dieselfahrzeuge, DPF und EGR-Ventil sehen wir als separaten Punkt.
            - Contrôle technique. Protokolle sind detailliert, wir prüfen die Hinweise über die Jahre.
            - 'Städtischer Einsatz: Reifen und Federung verschleißen schneller als angegeben'
        it:
          lead: 'Der italienische Markt bietet viele Kleinwagen und seltene Ausstattungen, erfordert jedoch Vorsicht: die Fahrzeuge hier werden intensiv genutzt und kleine Karosseriearbeiten oft nicht sorgsam durchgeführt.'
          points:
            - Stadt, häufige kleine Dellen und Nachlackierungen, Lackdickenmessgerät ist Pflicht.
            - Süden und Küste bringen Salz und Korrosion, der Norden ist closer zu deutschen Bedingungen
            - Revisione, wir prüfen die Regelmäßigkeit, Ausfälle kommen häufiger vor als üblich.
            - Viele Autos mit Gasanlage, wir überprüfen diese separat.
        pl:
          lead: 'Der nächstgelegene große Markt: günstige und kurze Logistik. Aber Polen war jahrelang der Hauptumschlagplatz für beschädigte Fahrzeuge aus Westeuropa, daher überprüfen wir die Geschichte hier strenger als irgendwo sonst.'
          points:
            - Hoher Anteil an nach Unfällen reparierten Fahrzeugen, die Karosserie-Geometrie hat Priorität.
            - 'Häufige Weiterverkäufe: ein Fahrzeug wechselt innerhalb eines Jahres mehrere Besitzer'
            - Der Kilometerstand wird beim Import häufig manipuliert, wir prüfen die Daten mit den Service-Daten.
            - Kurze Transportwege, günstiger und schneller als aus Spanien oder Portugal.
      closing:
        eyebrow: Wie fangen wir an?
        line1: Beschreiben Sie das Fahrzeug,
        line2: die Sie suchen,
        accentWord: weiterer Schritt ist unser Job
        text: Budget, Karosserie, Getriebe, ein paar Wünsche obendrauf. Wir suchen, während Sie die Berichte über die Optionen ansehen und entscheiden, welche Sie vor Ort besichtigen möchten.
