vehicle-sourcing:
  hub:
    metaTitle: Автоподбор авто в Европе под ключ
    metaDescription: 'Подбираем авто в Германии, Сербии, Испании, Швейцарии, Италии, Франции, Польше и Португалии: поиск, выезд на осмотр, торг и доставка под ключ.'
    title: Автоподбор
    titleHighlight: под ключ
    description: Подбираем автомобиль в стране, где вы находитесь или планируете покупку, — полная проверка, сопровождение сделки и доставка под ключ. Выберите страну, чтобы увидеть детали.
    breadcrumbLabel: Автоподбор
    casesHeading: Кейсы автоподбора
    chooseCountryLabel: 'Выберите страну:'
    ctaLabel: Подобрать авто
    processHeading: Как проходит подбор
    processLead: >-
      От заявки до ключей обычно от трёх дней до двух недель. Дольше всего ищем машину: первую подходящую не берём и смотрим дальше, пока не попадётся та, к которой нет вопросов после проверки.
    processSteps:
      - n: '01'
        text: Обсуждаем бюджет, марку и требования — что важно, а чем готовы пожертвовать
      - n: '02'
        text: Отбираем варианты на месте и отсеиваем по телефону всё, что не выдерживает вопросов
      - n: '03'
        text: Выезжаем на осмотр с толщиномером и сканером, для BMW подключаем дилерскую ISTA, снимаем фото и видео
      - n: '04'
        text: Присылаем отчёт и говорим прямо, стоит брать или искать дальше
      - n: '05'
        text: Торгуемся, оформляем сделку и передаём машину вам или везём до двери
    includedHeading: Что входит в работу
    includedLead: >-
      Комиссия фиксируется до старта и не зависит от того, сколько машин пришлось отсмотреть. Если после проверки мы говорим «не берите» — ищем дальше, доплачивать за это не нужно.
    included:
      - title: Поиск без ограничения по числу вариантов
        text: >-
          Работаем, пока не найдём машину, к которой нет претензий. Отказ от неудачного варианта входит в работу и ничего не стоит дополнительно.
      - title: Выезд эксперта на каждый осмотр
        text: >-
          Толщиномер по панелям, сканер по блокам, подъёмник там, где он нужен. Фото и видео со всех проблемных мест — вы видите то же, что и мы.
      - title: Проверка истории и юридической чистоты
        text: >-
          Отчёт CarVertical по VIN, дилерская сервисная история по марке, сверка пробега, залог, ограничения на регистрацию и незакрытые страховые события.
      - title: Торг и оформление сделки
        text: >-
          Договариваемся о цене с учётом найденного, готовим документы и сопровождаем подписание.
      - title: Доставка и постановка на учёт
        text: >-
          Везём машину до вашего города и помогаем с оформлением на месте — либо передаём ключи там, где вам удобно её забрать.
      - title: Один человек на весь процесс
        text: >-
          С вами работает тот же специалист, что ездил на осмотр. Не нужно заново объяснять задачу каждому, кто возьмёт трубку.
    heroPhotoAlt: Ряд автомобилей на площадке дилера
    compareHeading: Чем рынки отличаются друг от друга
    compareLead: >-
      Одна и та же модель в Германии и в Польше — по истории и по цене это две разные машины.
    compareHint: Выберите страну — покажем, что смотрим там первым делом.
    compareLinkFor: Подбор {location} — подробно
  title: Автоподбор под ключ
  descriptionFor: Подберём автомобиль {location} — среди авто, которые уже в этой стране, без ввоза из-за рубежа. Полная проверка, сопровождение сделки и доставка до вашего города — под ключ, включая растаможку.
  ctaLabel: Оставить заявку
  casesHeadingFor: 'Кейсы: автоподбор {location}'
  breadcrumbLabelFor: Авто {location}
  stepsFor:
    - n: '01'
      text: Оставляете заявку с требованиями — бюджет, марка, пробег
    - n: '02'
      text: Ищем варианты {location} по вашим критериям
    - n: '03'
      text: Независимый эксперт осматривает и проверяет автомобиль
    - n: '04'
      text: Сопровождаем сделку, помогаем с документами и оформлением
    - n: '05'
      text: Доставляем автомобиль до вашего города — под ключ, включая растаможку
  deliveryLineFor: Доставляем в {destinations} — и в любую другую страну, обсудим при заявке.
  deliveryDestinations:
    - Россию
    - Казахстан
    - Кыргызстан
    - Украину
    - Беларусь
    - Боснию и Герцеговину
    - Хорватию
    - Северную Македонию
    - Турцию
  citiesHeadingFor: Где смотрим машины {countryLocation}
  citiesLead: >-
    Эксперт выезжает по всей стране, но чаще всего смотрим машины там, где их больше всего выставляют. Вот что это значит для каждого города.
  alsoInLabel: 'Также подбираем в:'
  crossSellLabel: Нужен не местный автомобиль?
  countryNotesHeadingFor: Что учитываем {location}
  countryNotesPointsLabel: На что смотрим в первую очередь
  countryNotes:
    de:
      lead: >-
        Выбор здесь больше, чем на любом другом рынке Европы, и история обслуживания обычно прослеживается: у большинства машин есть сервисная книжка с отметками дилера о каждом ТО. Обратная сторона — автобанные пробеги. Двести тысяч за три года здесь норма, а не повод для скидки.
      points:
        - Сервисная книжка и отметки дилера — сверяем по VIN у официального сервиса
        - Протокол HU, который все зовут TÜV, — читаем замечания прошлого осмотра, а не только штамп
        - 'Машины из лизинга и корпоративных парков: обслужены ровно, но пробеги большие'
        - Зимние дороги с реагентами — днище и пороги смотрим отдельно
    rs:
      lead: >-
        Здесь мы на месте, поэтому смотрим машину в день обращения и без ввоза. Рынок маленький, одна и та же машина успевает пройти через нескольких продавцов, и историю приходится распутывать.
      points:
        - Машина уже растаможена и на местных номерах — пошлины и оформление ввоза не нужны
        - Пробег часто правят при перепродаже внутри страны — сверяем с отметками техпрегледа
        - Много ввезённых из Германии и Италии авто — проверяем, что с машиной было до ввоза
        - Осмотр в день обращения, без ожидания логистики
    es:
      lead: >-
        Мягкая зима и почти нет реагентов на дорогах, поэтому днище у испанских машин обычно заметно лучше немецких. Зато солнце и близость моря бьют по краске, пластику и всему резиновому.
      points:
        - Побережье — коррозию ищем прежде всего в скрытых полостях
        - Выгоревший лак и растрескавшийся пластик салона — закладываем в стоимость
        - 'Много бывших прокатных машин: ровный пробег, но жёсткая эксплуатация'
        - Протокол ITV — сверяем замечания и даты прохождения
    ch:
      lead: >-
        Швейцарские машины ухожены заметно лучше среднего по Европе: дорогое обслуживание дисциплинирует, пробеги небольшие. Но Швейцария не в ЕС, поэтому ввоз оформляется иначе, и это закладываем в бюджет заранее.
      points:
        - Богатые комплектации — здесь их брали чаще, чем у соседей
        - MFK — осмотр строгий, к нему готовят всерьёз, и это видно по машине
        - 'Не ЕС: таможня и документы оформляются не так, как для стран Евросоюза'
        - Ценник выше рынка, зато экономите потом на ремонте
    pt:
      lead: >-
        Рынок небольшой, выбор скромнее испанского, зато и конкуренция за хорошую машину ниже. Климат влажный и солёный — приморская коррозия встречается даже на свежих авто.
      points:
        - Влажность и море — скрытые полости и электрика в приоритете осмотра
        - 'Небольшой рынок: под конкретный запрос ищем дольше, чем в Германии'
        - Протокол IPO — читаем замечания предыдущих осмотров
        - Много дизелей и малолитражек, крупные кузова попадаются редко
    fr:
      lead: >-
        Франция — это прежде всего дизель и собственные марки. Peugeot, Renault и Citroën здесь дешевле, чем где-либо в Европе. Немецкий премиум наоборот дороже, и брать его тут смысла мало.
      points:
        - Французские марки — лучшая цена в Европе, и обслуживание дешевле
        - Дизели — сажевый фильтр и клапан EGR смотрим отдельной позицией
        - Contrôle technique — протоколы подробные, сверяем замечания по годам
        - 'Городская эксплуатация: сцепление и подвеска изнашиваются быстрее заявленного'
    it:
      lead: >-
        Итальянский рынок хорош малолитражками и редкими комплектациями, но требует осторожности: машины тут эксплуатируют плотно, а мелкий кузовной ремонт делают не всегда аккуратно.
      points:
        - Город — частые мелкие удары и подкрасы, толщиномер обязателен
        - Юг и побережье дают соль и коррозию, север ближе к немецким условиям
        - Revisione — проверяем регулярность, пропуски встречаются чаще обычного
        - Много машин с газовым оборудованием — смотрим его отдельно
    pl:
      lead: >-
        Ближайший к нам крупный рынок: логистика дешёвая и короткая. Но Польша годами была главным перевалочным пунктом для битых машин из Западной Европы, поэтому историю здесь мы проверяем жёстче, чем где бы то ни было.
      points:
        - Высокая доля восстановленных после ДТП — геометрия кузова в приоритете
        - 'Частые перепродажи: машина успевает сменить нескольких владельцев за год'
        - Пробег нередко правят на этапе ввоза — сверяем с сервисными базами
        - Короткое плечо доставки — дешевле и быстрее, чем из Испании или Португалии
  closing:
    eyebrow: С чего начнём?
    line1: Опишите машину,
    line2: которую ищете, —
    accentWord: дальше наша работа
    text: >-
      Бюджет, кузов, коробка, пара пожеланий сверху. Ищем мы, а вы смотрите отчёты по вариантам и решаете, какой смотреть живьём.

vehicle-buyback:
  hub:
    metaTitle: Выкуп авто на русских номерах в Европе
    metaDescription: >-
      Выкупаем авто на русских номерах в любой стране Европы и машины на сербских номерах в Сербии. Оценка по фото за час, расчёт в день подписания.
    title: Выкуп авто
    titleHighlight: без торга по неделям
    description: >-
      Забираем машину, которую тяжело продать обычным способом: русские номера, просроченный ввоз, спорные документы. Цена ниже рыночной — это плата за скорость и за то, что все хлопоты по продаже мы берём на себя.
    breadcrumbLabel: Выкуп авто
    casesHeading: Кейсы выкупа
    chooseCountryLabel: 'Выберите страну:'
    ctaLabel: Получить оценку
    processHeading: Как проходит выкуп
    processLead: >-
      От первого сообщения до денег обычно два-три дня, и почти всё это время занимает дорога до места встречи. Оценку по фото даём в течение часа.
    processSteps:
      - n: '01'
        text: Присылаете фото, документы и честное описание состояния
      - n: '02'
        text: Называем цену в течение часа — сразу окончательную, без вилки
      - n: '03'
        text: Договариваемся о встрече там, где машина стоит; если она не на ходу — приезжаем с прицепом
      - n: '04'
        text: Осматриваем вживую и подтверждаем цену, если описание совпало
      - n: '05'
        text: Подписываем договор, деньги переводим в день подписания
    includedHeading: Что мы берём на себя
    includedLead: >-
      За разницу между нашей ценой и рыночной мы забираем себе всё, из-за чего такая машина и не продаётся месяцами.
    included:
      - title: Машины на русских номерах
        text: >-
          Основная категория. Автомобиль может находиться в любой стране Европы — приедем туда, где он стоит, а вывозом и дальнейшей перепродажей занимаемся сами.
      - title: Проблемы с ввозом и сроками
        text: >-
          После подписания просроченный временный ввоз и связанные с ним риски переходят на нас.
      - title: Оценка без осмотра
        text: >-
          Цену называем по фото и документам. Приезжаем, только когда обе стороны уже согласны по сумме.
      - title: Оформление сделки
        text: >-
          Договор, снятие с учёта и все бумаги готовим сами. От вас — документы на машину и подпись.
      - title: Расчёт в день подписания
        text: >-
          Деньги переводим в тот же день. Схем с рассрочкой и «доплатим после перепродажи» у нас нет.
      - title: Честный отказ
        text: >-
          Если машина нам не подходит, скажем сразу и объясним причину. Тянуть и сбивать цену по ходу не будем.
    heroPhotoAlt: Ключи от машины на деньгах и документах
  title: Выкуп авто
  ctaLabel: Получить оценку
  casesHeading: Кейсы выкупа
  breadcrumbLabel: Выкуп авто
  descriptionSerbia: Выкупаем автомобили на русских номерах ниже рыночной цены — машина может находиться в любой стране Европы. Также выкупаем авто на сербских номерах в Сербии и Черногории. Оценка онлайн, оформление за 1 день, перевод в день сделки.
  descriptionOtherFor: Выкупаем автомобили на русских номерах ниже рыночной цены — машина может находиться в любой стране Европы, включая {name}. Оценка онлайн, оформление за 1 день, перевод в день сделки.
  serbiaLinkLabel: Машина на сербских номерах?
  step1: Отправляете фото и описание автомобиля
  step2: Оцениваем онлайн по фото за 1 час — ниже рыночной цены
  step3Serbia: Встречаемся на осмотр — русские номера (в любой стране Европы) или сербские номера (Сербия, Черногория)
  step3Other: Встречаемся на осмотр — русские номера, машина может быть в любой стране Европы
  step4: Оформляем сделку, деньги в день подписания
  closing:
    eyebrow: Хотите оценку?
    line1: Пришлите фото
    line2: и документы —
    accentWord: цена будет за час
    text: >-
      Оценка бесплатная и ни к чему не обязывает. Если цена вас не устроит, расстанемся без уговоров и повторных звонков.

vehicle-import:
  hub:
    metaTitle: Привоз авто из Европы и Китая под ключ
    metaDescription: Привозим автомобили из Германии, Испании, Швейцарии и Китая в любую страну — подбор, проверка, доставка и растаможка под ключ.
    title: Привоз авто
    titleHighlight: из Европы и Китая
    description: Машина — в Европе или Китае, вы — где угодно. Подбираем, проверяем и привозим её к вам под ключ, включая растаможку.
    breadcrumbLabel: Привоз авто
    casesHeading: Кейсы привоза
    euCardTitle: Из Европы
    euCardText: Испания, Швейцария и другие страны — подбор и доставка в любую точку.
    chinaCardTitle: Из Китая
    chinaCardText: Новые и подержанные автомобили из Китая — доставка через проверенного партнёра.
    exploreLabel: Подробнее
    ctaLabel: Рассчитать привоз
    processHeading: Как проходит привоз
    processLead: >-
      Обычно от заявки до номеров проходит четыре-восемь недель, и дорога занимает в этом сроке меньше всего. Из Германии до Белграда машина едет несколько дней, а таможня и постановка на учёт тянутся неделями.
    processSteps:
      - n: '01'
        text: Считаем полную стоимость до старта — машина, логистика, пошлины, оформление
      - n: '02'
        text: Находим и проверяем автомобиль в стране отправления
      - n: '03'
        text: Выкупаем машину на свою европейскую компанию, снимаем с учёта и готовим экспортные документы
      - n: '04'
        text: Везём автовозом или своим ходом с транзитными номерами
      - n: '05'
        text: Проходим таможню, оформляем на учёт и отдаём ключи
    includedHeading: Из чего складывается цена
    includedLead: >-
      При самостоятельном привозе бюджет чаще всего ломает сумма того, что идёт сверх цены машины. Мы считаем её заранее и фиксируем: итог не должен отличаться от первого расчёта.
    included:
      - title: Стоимость самого автомобиля
        text: >-
          Цена после торга, а не из объявления. Торгуемся с найденным на осмотре на руках — это обычно и окупает часть расходов.
      - title: Логистика до места
        text: >-
          Автовоз или перегон с транзитными номерами. Считаем оба варианта и берём тот, что выгоднее на конкретном плече.
      - title: Пошлины и налоги
        text: >-
          Ставка зависит от страны происхождения машины и её возраста. Для автомобилей европейского производства сертификат EUR1 меняет расчёт принципиально — проверяем его наличие до покупки.
      - title: Экспорт и транзит
        text: >-
          Снятие с учёта в стране продавца, экспортная декларация, транзитные номера и страховка на перегон.
      - title: Таможенное оформление
        text: >-
          Декларация, брокер и оплата на месте прибытия. Готовим пакет заранее, чтобы машина не стояла на складе лишние дни.
      - title: Постановка на учёт
        text: >-
          Техосмотр, регистрация и номера. Забираете машину, на которой можно сразу ехать.
    heroPhotoAlt: Автовоз с загруженными автомобилями
  de:
    metaTitle: Авто из Германии под ключ — подбор и привоз
    metaDescription: Подберём и привезём автомобиль из Германии — проверка, оформление и растаможка под ключ. Доставляли в Сербию, Испанию и Португалию.
    title: Авто из Германии
    titleHighlight: под ключ
