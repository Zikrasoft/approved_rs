      citiesHeadingFor: Gde gledamo automobile {countryLocation}
      citiesLead: Stručnjak izlazi po celoj zemlji, ali najčešće gledamo automobile tamo gde ih ima najviše. Ovo je šta to znači za svaki grad.
      alsoInLabel: 'Takođe biramo u:'
      crossSellLabel: Treba vam automobil koji nije lokalni?
      countryNotesHeadingFor: Šta uzimamo u obzir {location}
      countryNotesPointsLabel: Na šta prvo obraćamo pažnju
      countryNotes:
        de:
          lead: 'Izbor ovde je veći nego na bilo kom drugom tržištu u Evropi, a istorija servisa se obično može pratiti: većina automobila ima servisnu knjižicu sa potvrdama dilera za svako održavanje. S druge strane, autoputne kilometraže su visoke. Dvesto hiljada za tri godine ovde je norma, a ne razlog za popust.'
          points:
            - Servisna knjižica i potpis dilera — proveravamo po VIN u zvaničnom servisu
            - Protokol HU, koji svi nazivaju TÜV — čitamo napomene prošlog pregleda, a ne samo štampu
            - 'Automobili iz lizinga i korporativnih flota: održavani su uredno, ali kilometraže su visoke'
            - Zimski putevi sa hemikalijama — dno i pragove proveravamo posebno
        rs:
          lead: Ovde smo na terenu, tako da pregledamo automobil istog dana kada stigne prijava i bez uvoza. Tržište je malo, isti automobil obično prođe kroz nekoliko prodavaca, a istoriju treba raščlaniti.
          points:
            - Automobil je već carinjen i ima lokalne registarske oznake — takse i procedure uvoza nisu potrebne
            - Pređeni kilometri se često menjaju prilikom preprodaje unutar zemlje — proveravamo sa podacima sa tehničkog pregleda
            - Mnogi automobili su uvezeni iz Nemačke i Italije — proveravamo šta je bilo s automobilom prije uvoza
            - Pregledamo u danu prijave, bez čekanja na logistiku
        es:
          lead: Blaga zima i gotovo bez hemikalija na putevima, zbog čega su donji delovi španskih automobila obično u boljem stanju od nemačkih. Ipak, sunce i blizina mora utiču na farbu, plastiku i sve gumene delove.
          points:
            - Obala — tražimo koroziju pre svega u skrivenim prelomima
            - Izgoreli lak i napukla plastika u enterijeru — uračunavamo u cenu
            - 'Mnogi bivši iznajmljeni automobili: ujednačena kilometraža, ali intenzivna upotreba'
            - Protokol ITV — proveravamo primedbe i datume pregleda
        ch:
          lead: 'Švajcarski automobili su u znatno boljem stanju od proseka u Evropi: skupo održavanje disciplinuje, a kilometraže su niske. Ali Švajcarska nije deo EU, što znači da se uvoz obavlja drugačije, i to uračunavamo u budžet unapred.'
          points:
            - Bogate opreme — ovde se više biraju nego kod komšija
            - MFK — pregled je strožiji, a automobili se ozbiljno pripremaju za njega, što se vidi
            - 'Nije deo EU: carina i dokumentacija se ne obrađuju na isti način kao za zemlje Evropske unije'
            - Cene su više od proseka, ali ćete na kraju štedeti na popravkama
        pt:
          lead: Tržište je malo, izbor je skromniji nego špansko, ali i konkurencija za dobar automobil je manja. Klima je vlažna i slana — obalna korozija se javlja čak i na novim automobilima.
          points:
            - Vlažnost i more — skriveni delovi i elektrika su prioritet za provere
            - 'Malo tržište: za specifičan zahtev tražimo duže nego u Nemačkoj'
            - Protokol IPO — čitamo primedbe prethodnih provere
            - Mnogo dizelaša i malih automobila, krupne karoserije su ređe
        fr:
          lead: Francuska je prvenstveno dizel i domaće marke. Peugeot, Renault i Citroën ovde su jeftiniji nego bilo gde u Evropi. Nemačka premijum vozila su, s druge strane, skuplja, tako da ovde nema mnogo smisla kupovati ih.
          points:
            - Francuske marke — najbolja cena u Evropi, a servis je jeftiniji
            - Dizeli — filter za čestice i EGR ventil proveravamo kao posebnu stavku
            - Contrôle technique — protokoli su detaljni, proveravamo primedbe po godinama
            - 'Gradska upotreba: spoj i suspenzija se brže troše nego što je navedeno'
        it:
          lead: 'Italijansko tržište je dobro za male automobile i retke opreme, ali zahteva oprez: automobili ovde se intenzivno koriste, a manji karoserijski popravci ne rade se uvek pažljivo.'
          points:
            - Grad — česti manji udarci i dotrajala farba, mjerač debljine boje je obavezan
            - Jug i obale donose so i koroziju, sever je bliži nemačkim uslovima
            - Revisione — proveravamo redovnost, propuštanja su češća nego obično
            - Mnoge automobile sa plinskim postrojenjima — proveravamo to posebno
        pl:
          lead: 'Najbliže veliko tržište: logistika je jeftina i brza. Ali Poljska je godinama bila glavna tačka za oštećene automobile iz Zapadne Evrope, tako da se ovde istorija proverava rigoroznije nego bilo gde drugde.'
          points:
            - Visok procenat obnovljenih nakon nesreće — geometrija karoserije je prioritet
            - 'Česte preprodaje: auto stigne da promeni nekoliko vlasnika u godini'
            - Kilometraža se često menja prilikom uvoza — proveravamo sa servisnim bazama
            - Kratko vreme dostave — jeftinije i brže nego iz Španije ili Portugala
      closing:
        eyebrow: Kako ćemo započeti?
        line1: Opisujte automobil,
        line2: koji tražite —
        accentWord: dalje je naš posao
        text: Budžet, karoserija, menjač, nekoliko želja. Mi tražimo, a vi gledate izveštaje o opcijama i odlučujete koji ćete videti uživo.
