translations:
  en:
    vehicle-sourcing:
      hub:
        metaTitle: Turnkey Car Sourcing in Europe
        metaDescription: 'We source vehicles in Germany, Serbia, Spain, Switzerland, Italy, France, Poland, and Portugal: search, inspection, negotiation, and delivery.'
        title: Car Sourcing
        titleHighlight: Turnkey
        description: We help you find a vehicle in the country where you are or plan to make a purchase — complete verification, transaction support, and delivery included. Select a country to see details.
        breadcrumbLabel: Car Sourcing
        casesHeading: Car Sourcing Cases
        chooseCountryLabel: 'Select a country:'
        ctaLabel: Get a Car
        heroPhotoAlt: A row of cars at a dealer's lot
        processHeading: How the Sourcing Process Works
        processLead: 'From request to keys usually takes three days to two weeks. The longest part is finding the right car: we won’t select the first suitable option and will keep looking until we find one that passes our checks.'
        processSteps:
          - n: '01'
            text: Discuss the budget, brand, and requirements — what matters and what can be sacrificed
          - n: '02'
            text: Filter options locally and eliminate those that don’t meet our questions via phone
          - n: '03'
            text: Perform onsite inspections with a thickness gauge and scanner; for BMW, connect to the dealer's ISTA, take photos and videos
          - n: '04'
            text: Send the report and clearly indicate whether to proceed or continue searching
          - n: '05'
            text: Negotiate the price, finalize the deal, and deliver the car to you or transport it to your door
        includedHeading: What’s Included
        includedLead: The commission is fixed from the start and does not depend on how many cars we had to view. If we say 'don’t buy' after the inspection, we continue searching without any extra charges.
        included:
          - title: Unlimited Options Search
            text: We work until we find a car without any issues. Refusing a failed option is included in the service at no extra cost.
          - title: Expert On-Site Inspection
            text: Thickness gauge for panels, scanner for modules, lift where needed. Photos and videos of all problematic areas — you see exactly what we see.
          - title: History and Legal Clearance Check
            text: CarVertical report by VIN, dealer service history per brand, mileage verification, liens, registration restrictions, and unresolved insurance events.
          - title: Negotiation and Deal Finalization
            text: We negotiate the price based on our findings, prepare documents, and assist with signing.
          - title: Delivery and Registration Assistance
            text: We transport the car to your city and assist with local registration — either handing over keys where you prefer to pick it up.
          - title: Single Point of Contact
            text: You work with the same specialist who conducted the inspection. No need to explain the task again to each person who answers the phone.
        compareHeading: How Markets Differ
        compareLead: The same model in Germany and Poland — in history and price, it’s two different cars.
        compareHint: Select a country — we'll show you what we look for there first.
        compareLinkFor: Sourcing in {location} — details
      title: Turnkey Car Sourcing
      descriptionFor: We’ll find a vehicle in {location} — among cars already in the country, avoiding imports. Complete inspection, deal support, and delivery to your city — turnkey, including customs clearance.
      ctaLabel: Submit a Request
      casesHeadingFor: 'Cases: Car Sourcing in {location}'
      breadcrumbLabelFor: Cars in {location}
      stepsFor:
        - n: '01'
          text: Submit a request with your requirements — budget, brand, mileage
        - n: '02'
          text: We search for options in {location} based on your criteria
        - n: '03'
          text: An independent expert inspects and verifies the vehicle
        - n: '04'
          text: We assist with the transaction, help with documents and registration
        - n: '05'
          text: We deliver the car to your city — turnkey, including customs clearance
      deliveryLineFor: We deliver to {destinations} — and any other country, can discuss upon request.
      deliveryDestinations:
        - Russia
        - Kazakhstan
        - Kyrgyzstan
        - Ukraine
        - Belarus
        - Bosnia and Herzegovina
        - Croatia
        - North Macedonia
        - Turkey
      citiesHeadingFor: Where We Inspect Cars in {countryLocation}
      citiesLead: The expert travels across the country, but we most often inspect cars where they are most available. Here is what it means for each city.
      alsoInLabel: 'We also source in:'
      crossSellLabel: Need a non-local vehicle?
      countryNotesHeadingFor: What We Consider in {location}
      countryNotesPointsLabel: What we prioritize first
      countryNotes:
        de:
          lead: 'The selection here is greater than in any other European market, and service history is usually traceable: most cars have a service book with dealer stamps for each maintenance. The downside is highway mileage. Two hundred thousand kilometers over three years is normal here, not a reason for a discount.'
          points:
            - Service book and dealer stamps — we verify using the VIN at an official service center
            - The HU protocol, commonly known as TÜV — we read notes from previous inspections, not just the stamp
            - 'Cars from leasing and corporate fleets: well-serviced but with high mileage'
            - Winter roads with chemicals — we examine the underside and sills separately
        rs:
          lead: We're on the ground here, so we inspect the car on the same day without import. The market is small, the same car often changes hands several times, making its history more complex to unravel.
          points:
            - The car is already cleared through customs and has local plates — no duties or import paperwork needed
            - Mileage is often adjusted when reselling domestically — we verify with technical inspection records
            - Many cars imported from Germany and Italy — we check their condition before import
            - Inspection on the same day, no waiting for logistics
        es:
          lead: With mild winters and almost no chemicals on the roads, the undercarriages of Spanish cars are usually in significantly better condition than their German counterparts. However, sun exposure and proximity to the sea take a toll on paint, plastic, and rubber.
          points:
            - On the coast — we look for corrosion primarily in hidden cavities
            - Faded lacquer and cracked interior plastic — we factor this into the price
            - 'Many former rental cars: even mileage, but they’ve seen rough use'
            - ITV protocol — we check notes and inspection dates
        ch:
          lead: 'Swiss cars are generally in better condition than the European average: expensive maintenance fosters discipline, and mileage tends to be low. However, Switzerland isn’t in the EU, so import procedures differ, and we account for that in the budget from the start.'
          points:
            - Rich equipment — buyers here often select more options than in neighboring countries
            - MFK — the inspection is strict, cars are prepared thoroughly, and it shows
            - 'Non-EU: customs and documentation processes differ compared to EU countries'
            - Prices are higher than the market, but you'll save on repairs later
        pt:
          lead: The market is small, with less selection than Spain, but the competition for a good car is lower. The humid, salty climate means coastal corrosion can be found even on newer cars.
          points:
            - Humidity and sea — hidden cavities and electrical components are prioritized during inspection
            - 'Small market: we often search longer for specific requests than in Germany'
            - IPO protocol — we read notes from previous inspections
            - Many diesel and compact cars, large bodies are rare
        fr:
          lead: France is primarily known for diesel and its own brands. Peugeot, Renault, and Citroën are cheaper here than anywhere else in Europe. German premiums, on the other hand, are more expensive, making them less sensible purchases here.
          points:
            - French brands offer the best prices in Europe, and maintenance is cheaper
            - Diesels — we check the particulate filter and EGR valve as separate items
            - Contrôle technique — detailed protocols, we verify notes across the years
            - 'Urban use: clutches and suspensions wear out faster than claimed'
        it:
          lead: 'The Italian market is good for small cars and rare configurations, but it requires caution: vehicles are heavily used here, and minor body repairs are not always done carefully.'
          points:
            - Cities — frequent minor dents and touch-ups, a thickness gauge is essential
            - The south and coast bring salt and corrosion, while the north is closer to German conditions
            - Revisione — we check for regularity; missing services occur more than usual
            - Many vehicles with gas equipment — we inspect it separately
        pl:
          lead: 'The largest market closest to us: logistics are cheap and quick. However, Poland has been a major transshipment point for damaged cars from Western Europe for years, so we scrutinize histories here more rigorously than anywhere else.'
          points:
            - High share of vehicles repaired after accidents — body geometry is a priority
            - 'Frequent resales: a car can change hands several times within a year'
            - Mileage is often adjusted during the import stage — we verify with service databases
            - Short delivery distance — cheaper and faster than from Spain or Portugal
      closing:
        eyebrow: How shall we begin?
        line1: Describe the car you are looking for,
        line2: and we will take it from there —
        accentWord: next, it’s our job
        text: Budget, body type, transmission, a couple of preferences on top. We search, while you review reports on options and decide which ones to inspect in person.
    vehicle-buyback:
      hub:
        metaTitle: Buyback of cars with Russian plates in Europe
        metaDescription: We buy cars with Russian plates in any European country and cars with Serbian plates in Serbia. Evaluation by photo in one hour, payment on the day of signing.
        title: Car Buyback
        titleHighlight: no haggling for weeks
        description: 'We take away cars that are hard to sell through regular means: Russian plates, expired imports, disputed documents. The price is below market value — this covers the speed of service and all the hassle of selling.'
        breadcrumbLabel: Car Buyback
        casesHeading: Buyback Cases
        chooseCountryLabel: 'Select a country:'
        ctaLabel: Get a Quote
        heroPhotoAlt: Car keys on money and documents
        processHeading: How the Buyback Process Works
        processLead: From the first message to receiving your money usually takes two to three days, with most of that time spent on the road to the meeting point. We provide a photo evaluation within an hour.
        processSteps:
          - n: '01'
            text: Send us photos, documents, and an honest description of the vehicle's condition
          - n: '02'
            text: We give you a price within an hour — a final offer, no negotiations
          - n: '03'
            text: We agree on a meeting place where the car is located; if it’s not drivable, we come with a trailer
          - n: '04'
            text: We inspect the car and confirm the price if the description matches
          - n: '05'
            text: We sign the contract, and the payment is made on the day of signing
        includedHeading: What We Handle
        includedLead: For the difference between our price and the market price, we manage everything that causes such a vehicle to remain unsold for months.
        included:
          - title: Cars with Russian plates
            text: The main category. The car can be in any European country — we’ll come to where it is, and we handle the export and resale.
          - title: Import and timeframe issues
            text: After signing, the expired temporary import and associated risks become our responsibility.
          - title: Evaluation without inspection
            text: We give a price based on photos and documents. We only come out when both parties agree on the amount.
          - title: Transaction processing
            text: We prepare the contract, unregister the vehicle, and handle all paperwork. All you need to provide are the vehicle documents and your signature.
          - title: Payment on the day of signing
            text: Payment is made the same day. We do not have schemes with installments or 'we’ll pay more after resale'.
          - title: Honest refusal
            text: If the vehicle isn’t suitable for us, we’ll let you know right away and explain why. We won’t drag it out or try to lower the price during the process.
      title: Car Buyback
      ctaLabel: Get a Quote
      casesHeading: Buyback Cases
