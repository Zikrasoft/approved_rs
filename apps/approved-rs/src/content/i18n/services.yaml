        accentWord: wir berechnen bis zur Zulassung
        text: 'Der Preis des Autos, Logistik, Zölle und Formalitäten - eine Summe vor dem Start. Danach erhöht sich der Preis nicht: Alles, was auf dem Weg auftaucht, ist unsere Sorge.'
    vehicle-inspection:
      title: Fahrzeuginspektion
      description: Unabhängige Inspektion eines Fahrzeugs vor dem Kauf. Expertenbesuch, Diagnose, Bericht – ohne Kaufverpflichtung.
      ctaLabel: Inspektion anfordern
      casesHeading: Inspektionsfälle
      breadcrumbLabel: Fahrzeuginspektion
      steps:
        - n: '01'
          text: Karosserie und Lack – Reparatur- oder Unfallschäden
        - n: '02'
          text: Fahrwerk, Federung, Bremsen
        - n: '03'
          text: Motor, Getriebe, Transmission
        - n: '04'
          text: Elektronik und Wartungshistorie anhand der VIN
        - n: '05'
          text: Rechtsgültigkeit – Pfand, Registrierungsverbote, Unfälle
      extraLine: Wir arbeiten auch in anderen Ländern Europas, einschließlich Portugal – fragen Sie bei der Anfrage nach.
      hub:
        metaTitle: Fahrzeuginspektion vor dem Kauf in Europa
        metaDescription: 'Wir kommen zu dem Fahrzeug, das Sie selbst gefunden haben: Lackmessgerät, Scanner, Prüfung der VIN-Historie und Bericht mit Fotos am selben Tag. Wir arbeiten in acht europäischen Ländern.'
        title: Fahrzeuginspektion
        titleHighlight: vor dem Kauf
        description: 'Wir kommen zu dem Fahrzeug, das Sie selbst gefunden haben, und erzählen Ihnen, was wirklich damit ist. Der Bericht kommt, bevor Sie das Geld übergeben: erhielt der Bericht die Antwort „nicht kaufen“, verlieren Sie nur die Kosten für die Inspektion.'
        breadcrumbLabel: Fahrzeuginspektion
        casesHeading: Inspektionsfälle
        chooseCountryLabel: 'Wählen Sie ein Land:'
        ctaLabel: Inspektion anfordern
        heroPhotoAlt: Fahrzeug auf einer Hebebühne in einer Werkstatt
        processHeading: Wie die Inspektion abläuft
        processLead: In der Regel fahren wir ein bis zwei Tage nach der Anfrage los. Die Inspektion selbst dauert anderthalb bis zwei Stunden, den Bericht senden wir am selben Tag, solange das Fahrzeug nicht an einen anderen Käufer verkauft wurde.
        processSteps:
          - n: '01'
            text: Sie senden den Link zur Anzeige und die Kontaktdaten des Verkäufers
          - n: '02'
            text: Wir vereinbaren mit dem Verkäufer einen Termin und einen Ort für die Besichtigung
          - n: '03'
            text: Wir fahren mit einem Lackmessgerät und einem Scanner, bei BMW verbinden wir uns mit der Händler-ISTA, falls nötig – auf die Hebebühne
          - n: '04'
            text: Wir machen Fotos und Videos von allen Befunden, überprüfen die Historie anhand der VIN
          - n: '05'
            text: Wir senden den Bericht und eine direkte Antwort – kaufen, verhandeln oder ablehnen
        includedHeading: Was in der Inspektion enthalten ist
        includedLead: 'Über hundert Punkte auf der Checkliste, aber fast immer entscheiden vier Bereiche: Karosserie, Motor mit Getriebe, Fahrwerk und Dokumente. Genau in diesen Bereichen warnen wir am häufigsten vor dem Kauf.'
        included:
          - title: Karosserie und Lack
            text: Lackmessung an jedem Paneel, Geometrie der Öffnungen, Schweiß- und Spachtelspuren. Man erkennt, ob es Reparaturen gab, von denen der Verkäufer nicht erwähnt hat.
          - title: Motor und Getriebe
            text: Parameter bei betriebswarmem Motor, Anpassungen am Getriebe, Fehler im Speicher der Einheiten. Das teuerste Gebiet und die häufigste Ablehnungsursache.
          - title: Fahrwerk und Bremsen
            text: Spiel, Zustand der Federung und Bremsanlage. Autobahnmeilen und Balkanstrecken nutzen das Fahrzeug unterschiedlich ab, und das ist sichtbar.
          - title: Elektronik und Historie zu VIN
            text: CarVertical-Bericht, Händlerdiensthistorie nach Marke, Abweichung des Kilometerstands von der Historie, Fehler aus den Steuergeräten und Hinweise auf aktivierte Airbags.
          - title: Rechtsgültigkeit
            text: Pfand, Registrierungsverbote, nicht geschlossene Unfälle und Versicherungsereignisse – Dinge, die nach dem Kauf ans Licht kommen.
          - title: Bericht mit Fotos und Videos
            text: Jeder Fund ist dokumentiert und beschrieben. Der Bericht bleibt bei Ihnen – damit können Sie gut verhandeln, auch wenn Sie das Auto dennoch kaufen.
        compareHeading: Was sich von Land zu Land ändert
        compareLead: Regelungen für technische Inspektionen, typische Mängel an lokalen Fahrzeugen und Methoden, um die Geschichte überall zu verschleiern.
        compareHint: Wählen Sie ein Land – wir zeigen, was wir zur normalen Checkliste hinzufügen.
        compareLinkFor: Inspektion in {location} – im Detail
        mapHeading: Vier Bereiche, die den Deal entscheiden
        mapLead: Die Checkliste ist lang, aber wir warnen fast immer in einem der vier Bereiche. Klicken Sie auf die Nummer in der Skizze – wir zeigen, was der Experte überprüft und was wir dort gefunden haben.
      countryNotesHeadingFor: Wie wir {location} überprüfen
      countryNotesPointsLabel: Was wir über die normale Checkliste hinaus überprüfen
      countryNotes:
        de:
          lead: 'In Deutschland gibt es viel, worauf man sich stützen kann: Serviceheft, HU-Protokolle und entwickelte Datenbanken zur VIN. Daher besteht die Inspektion hier in erster Linie aus der Überprüfung der Dokumente mit dem, was das Fahrzeug tatsächlich zeigt.'
          points:
            - Einstellungen der Händlerinspektion mit den Kilometerständen im Laufe der Jahre abgleichen
            - Bemerkungen des vorherigen HU – was nach der Inspektion repariert wurde und was einfach nur hinausgezögert wurde
            - Unterboden und Schweller nach winterlichen Reagenzien, einschließlich versteckter Hohlräume
            - 'Leasingvergangenheit: gleichmäßige Wartung bei hohem Kilometerstand'
        rs:
          lead: 'In Serbien fahren wir am Tag der Anfrage los. Die Hauptaufgabe besteht darin, die Geschichte des Fahrzeugs bis zur Einfuhr wiederherzustellen: Lokale Dokumente zeigen nur den letzten Abschnitt des Lebens des Fahrzeugs.'
          points:
            - Herkunftsland und Zustand des Fahrzeugs vor der Einfuhr nach Serbien
            - Kilometerstände im Vergleich zu den Eintragungen der technischen Überprüfung in den vergangenen Jahren
            - Karosseriereparatur nach der Einfuhr – diese wird hier häufiger und günstiger gemacht als in der EU
            - 'Rechtliche Aspekte: Pfand und Einschränkungen bei der Registrierung'
        es:
          lead: Spanische Fahrzeuge erfreuen normalerweise mit einem guten Unterboden, enttäuschen aber mit allem, was unter Sonne und Salz leidet. Wir verschieben die Inspektion vom Korrosionszustand des Unterbodens hin zu versteckten Hohlräumen, Elektrik und Zustand des Innenraums.
          points:
            - Korrosion in versteckten Hohlräumen an der Küste – von unten könnte es sauber sein
            - Lack, Dichtungen und Plastik nach jahrelanger Sonneneinstrahlung
            - 'Vermietungsgeschichte: Kilometerstand mit dem Abnutzungsgrad des Innenraums abgleichen'
            - ITV-Protokoll und was zwischen den Inspektionen noch offen ist
        ch:
          lead: In der Schweiz wird das MFK ernsthaft vorbereitet, daher sagt ein aktuelles Protokoll allein wenig aus. Wir sehen uns an, was genau vor der Inspektion gemacht wurde und was seit dem letzten Jahr noch besteht.
          points:
            - Was direkt vor der MFK ersetzt wurde – frische Teile im Vergleich zum Rest
            - Wartung ist teuer, deshalb überprüfen wir, ob Wartungen aufgeschoben wurden
            - Die Ausstattung ist umfangreich, aber wir überprüfen, ob jede Option noch funktioniert
            - 'Importdokumente: Die Schweiz ist nicht EU, die Unterlagen sind unterschiedlich'
        pt:
          lead: 'Hier dreht sich alles um das feuchte Meeresklima. Die Inspektion beginnt mit der Korrosion und der Elektrik: normalerweise sind die Probleme da, wo es feucht ist.'
          points:
            - Versteckte Hohlräume, Längsträger und Befestigungspunkte der Federung
            - Oxidation von Steckverbindungen und Steuergeräten – typischer Grund für sporadische Fehler
            - IPO-Protokoll und Regelmäßigkeit der Inspektionen
            - 'Dieselfahrzeuge aus Stadtbetrieb: Partikelfilter und dessen Geschichte'
        fr:
          lead: 'In Frankreich ist die detaillierte contrôle technique ein guter Ausgangspunkt. Weiterhin prüfen wir, was die Regulierung nicht erfasst: die Lebensdauer der Dieselmotoren und Abnutzung durch den Stadtverkehr.'
          points:
            - Anmerkungen der contrôle technique nach Jahren – was sich von Inspektion zu Inspektion wiederholt
            - Partikelfilter, EGR und Turbolader bei Dieselmotoren
            - Kupplung und Federung nach dem intensiven Stadtzyklus
            - 'Historie bei französischen Marken: verfügbare Ersatzteile, aber auch eigene Schwächen'
        it:
          lead: Italienische Fahrzeuge haben häufig kleine Karosseriereparaturen, die schnell und günstig durchgeführt werden. Hier dauert die Lackmessung an den Paneelen deutlich länger als gewöhnlich.
          points:
            - Lackmessung an allen Paneelen – Nachlackierungen nach urbanen Kratzern
            - 'Unterschied zwischen Nord- und Südeuropa: Salz an der Küste, normaler Verschleiß im Inland'
            - Gasinstallation, falls vorhanden – Installation und Zustand des Tanks
            - Regelmäßigkeit der revisione und versäumte Zeiträume
        pl:
          lead: Polen ist der größte Umschlagmarkt für beschädigte Fahrzeuge aus Westeuropa. Daher klären wir zunächst, was mit diesem Karosserieteil vor dem Verkauf geschehen ist.
          points:
            - Geometrie der Öffnungen und Schweißspuren – Wiederherstellung nach schweren Unfällen
            - 'Einfuhrhistorie: woher das Fahrzeug kam und in welchem Zustand'
            - Kilometerstände mit europäischen Servicedaten abgleichen, dem Kilometerzähler vertrauen wir nicht
            - Airbags und deren Auslösungen in der Vergangenheit
      closing:
        eyebrow: Haben Sie ein Fahrzeug gefunden?
        line1: Schicken Sie den Link
        line2: zur Anzeige –
        accentWord: wir kommen und sehen es uns an
        text: Wir fahren innerhalb von ein bis zwei Tagen. Der Bericht mit Fotos bleibt bei Ihnen, auch wenn Sie danach vom Kauf zurücktreten.
    cityVehicleSourcing:
      title: Fahrzeugbeschaffung
      descriptionFor: Wir finden ein Auto in {cityLocation} mit vollständiger Überprüfung. Wir arbeiten in der ganzen Region {countryName}.
      casesHeadingFor: Fälle aus {countryGenitiveOrName}
      whyCityHeadingFor: Warum {cityName}
      reason1: Wir schauen sowohl bei Händlerplätzen als auch in privaten Anzeigen.
      reason2: Die Historie nach VIN prüfen wir vor der Besichtigung.
      reason3For: Unser Experte in {cityLocation}
      reason4Dekra: DEKRA / TÜV-Prüfung auf Anfrage
      reason4Generic: Unabhängige technische Expertise auf Anfrage
      otherCitiesLabelFor: 'Andere Städte in {countryLocation}:'
      cityNotesHeadingFor: Automarkt in {cityLocation}
      cityNotesPointsLabel: Was das praktisch bedeutet
      cityNotes:
        berlin:
          lead: 'In Berlin gibt es die größte Auswahl in Deutschland und die bunteste Sammlung von Verkäufern. Hier findet man alles: von Autos aus Unternehmensflotten mit vollständiger Historie bis zu Wiederverkaufsvarianten, die aus Osteuropa stammen.'
          points:
            - Riesige Auswahl in allen Segmenten, einschließlich seltener Ausstattungen
            - Viele private Verkäufer – echte Verhandlungsmöglichkeiten im Vergleich zu Händlern
            - 'Städtischer Einsatz: Kupplung und Fahrwerk nutzen sich sichtbarer ab als bei Autobahnfahrzeugen'
        munich:
          lead: 'Eine teure Stadt mit teuren Autos. Im Premium-Segment gibt es hier mehr als irgendwo sonst in Deutschland, und der Zustand der Fahrzeuge ist im Durchschnitt höher: Diese Autos werden gut gepflegt.'
          points:
            - Starkes Premium-Segment, besonders BMW und Mercedes
            - Gepflegte Fahrzeuge mit vollständiger Händlerhistorie
            - Preise über dem Landesdurchschnitt – Einsparungen erfolgen durch den besseren Zustand
        hamburg:
          lead: Eine Hafenstadt und großes Logistikzentrum. Von hier aus ist es einfach, das Auto weiterzuversenden, und auf dem Markt findet man oft neue Importfahrzeuge.
          points:
            - Der Hafen ist in der Nähe – einfacher und günstiger Versand
            - Viele Autos aus den nördlichen Bundesländern mit Autobahnkilometern
            - 'Feuchtes Meeresklima: Karosserie und versteckte Hohlräume werden genauer geprüft'
        belgrade:
          lead: Unsere Basis. In Belgrad erfolgt die Besichtigung am Tag der Anfrage, wir kennen die lokalen Verkäufer und sehen, welches Auto seit zwei Monaten von Platz zu Platz wechselt.
          points:
            - Besichtigung am Tag der Anfrage, ohne Wartezeiten und Logistik
            - Wir kennen die lokalen Märkte und die Historie der Autos, die dort stehen
            - Das Auto ist bereits verzollt – Einfuhr und Steuern sind nicht erforderlich
        novi-sad:
          lead: Die zweitgrößte Stadt Serbiens und eine Stunde Fahrt von Belgrad entfernt. Der Markt ist kleiner, aber die Preise sind in der Regel ruhiger als die der Hauptstadt, und Autos haben seltener mehrere Besitzerwechsel.
          points:
            - Preise niedriger als in Belgrad bei vergleichbarem Zustand
            - Weniger Wiederverkäufer, öfter der Erstbesitzer zu finden
            - Fahrt von Belgrad ohne zusätzliche Gebühren für die Strecke
        pancevo:
          lead: Pančevo gehört praktisch zur Belgrader Agglomeration, daher unterscheidet sich die Besichtigung hier nicht von der in der Hauptstadt. Der Markt ist klein, aber private Anzeigen sind oft interessanter.
          points:
            - Zwanzig Minuten von Belgrad – wir fahren ebenso schnell los
            - Kleiner Markt mit Übergewicht privater Verkäufer
            - Häufig günstiger als in der Hauptstadt bei gleichem Zustand
        subotica:
          lead: 'Subotica liegt an der Grenze zu Ungarn, und das merkt man auf dem Markt: Viele Autos wurden aus der EU importiert, und Verkäufer beschäftigen sich ständig damit.'
          points:
            - Grenzmarkt – viele frische Importe aus der Europäischen Union
            - Die Historie vor dem Import prüfen wir besonders sorgfältig
            - Praktischer Standort, wenn Sie das Auto weiter nach Norden bringen möchten
        madrid:
          lead: 'Der Kapitalmarkt Spaniens: die größte Auswahl im Land und viele Autos aus Unternehmensflotten. Kontinentalklima, daher weniger Küstenausreibung als an der Küste.'
          points:
            - Größte Auswahl in Spanien, einschließlich Firmenfahrzeuge
            - Weit weg vom Meer – die Karosserien sind normalerweise sauberer als die der Küsten
            - 'Heißer Sommer: Kunststoff, Lack und Klimaanlage prüfen wir gesondert'
        barcelona:
          lead: Alles wird durch die Nähe zum Meer bestimmt. Autos sehen oft hervorragend von unten aus, benötigen jedoch Aufmerksamkeit für versteckte Hohlräume und Elektrik.
          points:
            - 'Das Meer ist in der Nähe, daher prüfen wir versteckte Hohlräume: von unten oft sauber, innen aber nicht'
            - Viele ehemalige Mietwagen und Carsharing-Fahrzeuge
            - Der Hafen ist nah, der Versand per See organisiert sich einfacher
        zurich:
          lead: Zürich ist der teuerste Automarkt der Region. Hier werden maximale Ausstattungen gewählt, regelmäßig beim Händler gewartet und verkauft, bevor das Fahrzeug an Abnutzung leidet.
          points:
            - Maximale Ausstattungen und niedrige Kilometerzahlen
            - Händlerwartung – die Historie ist fast immer vollständig
            - Schweiz nicht in der EU, Einfuhr wird separat geregelt
        geneva:
          lead: Genf liegt im französischsprachigen Teil der Schweiz, direkt an der Grenze zu Frankreich. Französische Marken sind auf dem Markt deutlich häufiger vertreten als im deutschen Teil des Landes.
          points:
            - 'Gemischter Markt: Schweizer Zustand, französisches Sortiment'
            - Die Grenze zu Frankreich ist nah – Preisvergleiche sind möglich
            - 'Die Formalitäten sind die gleichen wie in der ganzen Schweiz: Export plus Import'
        paris:
          lead: 'Die größte Auswahl in Frankreich wird durch die härtesten Betriebsbedingungen geboten: dichter Verkehr und enge Parkmöglichkeiten hinterlassen Spuren auf Karosserie und Fahrwerk.'
          points:
            - Die größte Auswahl in Frankreich, besonders bei französischen Marken
            - 'Städtischer Einsatz: Kupplung, Fahrwerk und kleinere Karosserieschäden'
            - Viele Diesel – Partikelfilter und EGR prüfen wir zuerst
        lyon:
          lead: Lyon ist ruhiger als Paris, sowohl in den Preisen als auch im Zustand der Fahrzeuge. Die Autobahn nach Süden verläuft in der Nähe, daher kommen öfter Autos mit gleichmäßiger, gerader Kilometerleistung.
          points:
            - Preise unter den Pariser bei vergleichbarem Angebot
            - Mehr Autobahnkilometer, weniger städtische Abnutzung
            - Günstige Verbindung nach Italien und Spanien, wenn wir breiter suchen
        milan:
          lead: 'Die Geschäftshauptstadt Italiens, und das zeigt sich auch auf dem Markt. Der Norden des Landes entspricht mehr den deutschen Verhältnissen: die Straßen sind besser und die Autos gepflegter als im Süden.'
          points:
            - Beste Auswahl im Premium-Segment in Italien
            - Der Norden – weniger Salz und Korrosion als im Süden des Landes
            - 'Dichter Stadtverkehr: Lackschichtmessgerät ist Pflicht'
        rome:
          lead: Ein großer Markt mit sehr starkem städtischen Einsatz. Kleine Kratzer werden hier als Norm angesehen und oft schnell und provisorisch repariert.
          points:
            - Viele Kleinstwagen und Fahrzeuge mit Gasanlage
            - Häufige Nachlackierungen nach städtischen Kontakten – wir prüfen jedes Panel
            - Südlich von Mailand – das Klima ist milder, aber näher am Meer
        warsaw:
          lead: Durch Warschau gelangt der hauptsächliche Import aus Westeuropa ins Land, und hier ist auch die größte Auswahl in Polen. Der Anteil der reparierten Fahrzeuge ist ebenfalls am höchsten.
          points:
            - Größte Auswahl in Polen, viele frische Importe aus der EU
            - Die Geometrie der Karosserie und Reparaturspuren prüfen wir zuerst
            - Kurze Lieferzeiten – günstiger als aus Südeuropa
        krakow:
          lead: 'Krakau ist ruhiger als Warschau: der Markt ist kleiner, es gibt weniger Wiederverkäufe und die Autos haben oft länger einen Besitzer. Der Süden Polens ist logistisch näher zu den Balkanstaaten.'
          points:
            - Weniger Wiederverkäufer als in Warschau, die Historie ist meist sauberer
            - Preise sind häufig niedriger als in der Hauptstadt
            - Näher an der Route nach Süden – praktisch für die Zustellung nach Serbien
