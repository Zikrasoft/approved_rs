            text: Biramo opcije na licu mesta i filtriramo putem telefona sve što ne zadovoljava pitanja
          - n: '03'
            text: Odlazimo na provere sa meračem debljine i skenerom, za BMW povezujemo dealerovu ISTA, snimamo fotografije i video
          - n: '04'
            text: Šaljemo izveštaj i govorimo otvoreno, da li se isplati kupiti ili tražiti dalje
          - n: '05'
            text: Pregovaramo, obavljamo transakciju i predajemo automobil vama ili ga dostavljamo na vaša vrata
