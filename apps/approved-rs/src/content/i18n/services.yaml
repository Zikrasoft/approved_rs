    vehicle-inspection:
      title: Provera auta
      description: Nezavisna provera automobila pre kupovine. Dolazak stručnjaka, dijagnostika, izveštaj — bez obaveze na kupovinu.
      ctaLabel: Naručiti proveru
      casesHeading: 'Stvarne transakcije: provera pre kupovine'
      breadcrumbLabel: Provera auta
      steps:
        - n: '01'
          text: Karoserija i lak — prisustvo popravki ili udesa
        - n: '02'
          text: Hodna, suspenzije, kočnice
        - n: '03'
          text: Motor, menjač, transmisija
        - n: '04'
          text: Elektronika i istorija usluge po VIN
        - n: '05'
          text: Pravna urednost — zalog, zabrana registracije, udesa
      extraLine: Radimo i u drugim zemljama Evrope, uključujući Portugal — proverite prilikom zahteva.
      hub:
        metaTitle: Provera auta pre kupovine u Evropi
        metaDescription: 'Dolazimo do automobila koji ste sami našli: merni uređaj, skener, provera istorije po VIN i izveštaj sa slikama istog dana. Radimo u osam zemalja Evrope.'
        title: Provera auta
        titleHighlight: pre kupovine
        description: "Dolazimo do automobila koji ste sami našli i objašnjavamo šta se zaista dešava. Izveštaj stiže pre nego što predate novac: ako je odgovor 'ne kupujte', gubite samo cenu provere."
        breadcrumbLabel: Provera auta
        casesHeading: 'Stvarne transakcije: provera pre kupovine'
        chooseCountryLabel: 'Izaberite zemlju:'
        ctaLabel: Naručiti proveru
        heroPhotoAlt: Automobil na dizalici u servisu
        processHeading: Kako se odvija provera
        processLead: Obično dolazimo u roku od jednog do dva dana nakon zahteva. Sam pregled traje jedan i po do dva sata, izveštaj šaljemo istog dana, dok auto još nije otišao drugom kupcu.
        processSteps:
          - n: '01'
            text: Šaljete link ka oglasu i kontakt podatke prodavca
          - n: '02'
            text: Dogovaramo se sa prodavcem o vremenu i mestu pregleda
          - n: '03'
            text: Dolazimo sa mernim uređajem i skenerom, za BMW povezuju se sa dilerskom ISTA, ako je potrebno — na dizalicu
          - n: '04'
            text: Pravimo fotografije i video svih pronađenih problema, proveravamo istoriju po VIN
          - n: '05'
            text: Šaljemo izveštaj i direktan odgovor — uzeti, pregovarati ili odustati
        includedHeading: Šta je uključeno u proveru
        includedLead: 'Preko stotinu stavki na kontrolnom spisku, ali gotovo uvek odlučuju četiri oblasti: karoserija, motor sa menjačem, suspenzija i dokumenti. U pravu su oni koji nas često odvrate od kupovine.'
        included:
          - title: Karoserija i lak
            text: Merni uređaj po svakoj paneli, geometrija otvora, tragovi zavarivanja i špaktel. Vidljivo je da li je bilo popravki o kojima prodavac nije spominjao.
          - title: Motor i menjač
            text: Parametri na zagrejanom motoru, adaptacije menjača, greške u memoriji jedinica. Najskuplja oblast i najčešći razlog odbijanja.
          - title: Hodna i kočnice
            text: Igranje, stanje suspenzije i kočionog sistema. Autobuski put i balkanske ceste koriste auto na različite načine, i to je vidljivo.
          - title: Elektronika i istorija po VIN
            text: Izveštaj CarVertical, servisna istorija po marki, razlika u pređenom putu sa istorijom, greške modula i tragovi aktiviranih vazdušnih jastučića.
          - title: Pravna čistota
            text: Hipoteka, zabrana registracije, nerazrešeni udesi i osiguravajući događaji — to što se otkriva tek nakon kupovine.
          - title: Izveštaj sa fotografijama i video snimcima
            text: Svaki nalaz je snimljen i potpisan. Izveštaj ostaje kod vas — sa njim možete pregovarati, čak i ako se odlučite za kupovinu vozila.
        compareHeading: Šta se menja od zemlje do zemlje
        compareLead: Propisi tehničkog pregleda, tipični problemi lokalnih automobila i načini skrivanja istorije su svuda različiti.
        compareHint: Izaberite zemlju — pokažemo vam šta dodajemo na običan kontrolni spisak.
        compareLinkFor: Provera {location} — detaljno
        mapHeading: Četiri zone koje odlučuju o transakciji
        mapLead: Kontrolni spisak je dug, ali se gotovo uvek odustaje zbog jedne od četiri zone. Pritiskom na broj na shemi — pokažemo šta stručnjak gleda i šta smo tamo pronašli.
      countryNotesHeadingFor: Kako proveravamo {location}
      countryNotesPointsLabel: Šta proveravamo iznad običnog kontrolnog spiska
      countryNotes:
        de:
          lead: 'U Nemačkoj imamo na šta da se oslonimo: servisna knjižica, HU protokoli i razvijene baze po VIN-u. Zbog toga je provera ovde pre svega upoređivanje dokumenata sa onim što pokazuje automobil.'
          points:
            - Upoređujemo beleške sa servisnog pregleda sa očitavanjem odometra po godinama
            - Zapažanja sa prethodnog HU — šta je popravljeno posle pregleda, a šta je samo odloženo
            - Donji deo i pragovi posle zimskih tretmana, uključujući skrivene prostorije
            - 'Lizing prošlost: uredno održavanje kod velike kilometraže'
        rs:
          lead: 'U Srbiji izlazimo na dan zahteva. Glavni zadatak je rekonstrukcija istorije automobila pre uvoza: lokalni dokumenti prikazuju samo poslednji deo života vozila.'
          points:
            - Zemlja porekla i stanje automobila pre uvoza u Srbiju
            - Očitavanje odometra u poređenju sa beleškama tehničkog pregleda iz prethodnih godina
            - Popravka karoserije posle uvoza — to se radi češće i jeftinije nego u EU
            - 'Pravna strana: hipoteka i ograničenja za registraciju'
        es:
          lead: Španska vozila obično se raduju donjim delovima, ali raduju se i svim stvarima koje pate od sunca i soli. Proveru prelazimo sa korozije sa dna na skrivene delove, elektriku i stanje enterijera.
          points:
            - Korozija u skrivenim prostorima uz obalu — s dna može delovati čisto
            - Lak, brtvila i plastika nakon višegodišnjeg sunca
            - 'Iznajmljivačka prošlost: upoređujemo pređeni put sa karakteristikama habanja enterijera'
            - ITV protokol i šta je ostalo otvoreno između pregleda
        ch:
          lead: Za MFK se automobili zaista pripremaju, pa sveže izveštaje sami po sebi ne govore mnogo. Gledamo šta je urađeno neposredno pre pregleda, a šta je ostalo iz prošle godine.
          points:
            - Šta je zamenjeno neposredno pre MFK — sveži delovi u poređenju s ostalim
            - Održavanje je skupo, pa proveravamo da li su propisi odloženi
            - Opremanje je bogato, ali proveravamo sve opcije da li još uvek rade
            - 'Dokumenti za uvoz: Švajcarska nije EU, set se razlikuje'
        pt:
          lead: 'Sve ovde zavisi od vlažne morske klime. Proveru počinjemo sa korozijom i elektrikom: obično iznevjeri ono što živi u vlažnosti.'
          points:
            - Skrivene prostore, donji delovi i tačke vezivanja suspenzije
            - Kiseljenje konektora i modula — tipična причина za nestabilne greške
            - IPO protokol i učestalost prolaska
            - 'Dizeli sa urbanom eksploatacijom: filter čađi i njegova istorija'
        fr:
          lead: 'U Francuskoj postoji detaljni contrôle technique, što je dobra polazna tačka. Sledeće proveravamo šta propisi ne hvataju: stanje dizelske grupe i habanje zbog gradskog saobraćaja.'
          points:
            - Zapažanja iz contrôle technique po godinama — šta se ponavlja iz pregleda u pregled
            - Filter čađi, EGR i turbina na dizel motorima
            - Kvačilo i suspenzija posle gustog urbanog ciklusa
            - 'Istorija kod francuskih marki: dostupni delovi, ali svoja slaba mesta'
        it:
          lead: Italijanska vozila češće dolaze s manjim karoserijskim popravkama, urađenim brzo i jeftino. Na merama debljine kod panela ovde se troši znatno više vremena nego obično.
          points:
            - Mere debljine na svim panelima — popravke posle gradskih ogrebanja
            - 'Razlika između severa i juga: so uz obalu, uobičajeno habanje u unutrašnjosti zemlje'
            - Plinske instalacije, ako postoje — ugradnja i stanje rezervoara
            - Učestalost revisione i propušteni periodi
        pl:
          lead: Poljska je najveće tranzitno tržište za udesa vozila iz Zapadne Evrope. Stoga prvo saznajemo šta je rađeno s tim karoserijama pre prodaje.
          points:
            - Geometrija otvora i tragovi zavarivanja — obnova posle ozbiljnog udesa
            - 'Istorija uvoza: odakle je auto došao i u kojem stanju'
            - Pređeni put upoređujemo s evropskim servisnim bazama, odometru ne verujemo
            - Vazdušni jastučići i njihovo aktiviranje u prošlosti
      closing:
        eyebrow: Našli ste auto?
        line1: Pošaljite link
        line2: na oglas —
        accentWord: doći ćemo i proveriti
        text: Izlazimo za jedan-dva dana. Izveštaj sa fotografijama ostaje kod vas, čak i ako se kasnije predomislite.
    cityVehicleSourcing:
      title: Auto izbor
      descriptionFor: Odabraćemo automobil {cityLocation} sa potpunom proverom. Radimo po celom regionu {countryName}.
      casesHeadingFor: Stvarne transakcije na tržištu {countryGenitiveOrName}
      whyCityHeadingFor: Zašto {cityName}
      reason1: Gledamo i prodajne placeve i privatne oglase
      reason2: Istoriju po VIN-u proveravamo pre izlaska na pregled
      reason3For: Naš stručnjak je iz {cityLocation}
      reason4Dekra: Provera DEKRA / TÜV na zahtev
      reason4Generic: Nezavisna tehnička ekspertiza na zahtev
      otherCitiesLabelFor: 'Ostali gradovi u {countryLocation}:'
      cityNotesHeadingFor: Automobilsko tržište {cityLocation}
      cityNotesPointsLabel: Šta to praktično donosi
      cityNotes:
        berlin:
          lead: 'U Berlinu je najveći izbor u Nemačkoj i najšarenija ponuda prodavaca. Ovde se može naći sve: od vozila iz korporativnih flota sa potpunom istorijom do polovnih opcija iz Istočne Evrope.'
          points:
            - Ogroman izbor u svim segmentima, uključujući retke verzije
            - Mnogi privatni prodavci — pregovaranje je realnije nego kod dilerâ
            - 'Gradski tip vožnje: gume i suspenzija se brže troše nego kod automobila s autoputeva'
        munich:
          lead: 'Skupi grad sa skupim automobilima. Premijum segment ovde je veći nego bilo gde drugde u Nemačkoj, a stanje u proseku bolje: o tim automobilima se brine.'
          points:
            - Jak premijum segment, posebno BMW i Mercedes
            - Paženi automobili sa potpunom istorijom servisiranja od dilera
            - Cene su više od proseka u zemlji — ušteda dolazi od stanja
        hamburg:
          lead: Lučki grad i veliki logistički čvor. Odavde je lako slati automobile dalje, a na tržištu se često nalaze sveži uvezeni automobili.
          points:
            - Luka u blizini — lakše i jeftinije organizovati transport
            - Mnogi automobili iz severnih delova s autoputskim pređenim kilometrima
            - 'Vlažna morska klima: pregled karoserije i skrivenih delova je obavezan'
        dusseldorf:
          lead: Centar Severne Rajne-Vestfalije, najgušće naseljene oblasti Nemačke. Pijace su gusto raspoređene, a do granice sa Holandijom i Belgijom je sat vremena vožnje, tako da redovno dolaze automobili na prodaju.
          points:
            - Za jedan odlazak stignemo da pregledamo nekoliko automobila — pijace su u blizini
            - 'Deo ponude dolazi sa holandskim i belgijskim registracijama: istoriju i dokumente proveravamo posebno'
            - Prodavaca je mnogo i oni se bore za kupce — pregovaranje ide lakše
        belgrade:
          lead: Naša baza. U Beogradu izlazimo na provere automobila istog dana kada nas kontaktirate, poznajemo lokalne prodavce i vidimo koje vozilo se već drugi mesec preprodaje.
          points:
            - Provera automobila pre kupovine istog dana, bez čekanja i logistike
            - Poznajemo lokalne pijace i istoriju automobila koji su na njima
            - Automobil je već uvežen — carinski postupak i dažbine nisu potrebni
        novi-sad:
          lead: Drugi po veličini grad u Srbiji i sat vožnje od Beograda. Tržište je manje, ali su cene obično niže od beogradskih, a automobili ređe prolaze kroz više preprodaja.
          points:
            - Cene su niže od beogradskih uz sličan kvalitet
            - Manje preprodavaca, češće je prvi vlasnik
            - Izlazimo iz Beograda, nema dodatnih troškova za put
        pancevo:
          lead: Pančevo zapravo pripada beogradskoj aglomeraciji, pa je provera ovde nalik na onu u glavnom gradu. Tržište je malo, ali privatni oglasi su često interesantniji.
          points:
            - Dvadest minuta od Beograda — izlazimo jednako brzo
            - Malo tržište sa pretežno privatnim prodavcima
            - Često je jeftinije od Beograda uz isti kvalitet
        subotica:
          lead: 'Subotica se nalazi na granici sa Mađarskom, a to se vidi na tržištu: mnogo automobila uvezenih iz EU i prodavaca koji se time redovno bave.'
          points:
            - Granično tržište — mnogo svežeg uvoza iz Evropske unije
            - Istoriju do uvoza proveravamo posebno temeljno
            - Praktična tačka ako nameravate da šaljete automobil dalje na sever
        madrid:
          lead: 'Glavno tržište Španije: najveći izbor u zemlji i mnogo automobila iz korporativnih flota. Kontinentalna klima, pa je morska korozija manja nego na obali.'
          points:
            - Najveći izbor u Španiji, uključujući korporativne automobile
            - Daleko od mora — karoserije su obično čistije nego na obali
            - 'Vruće leto: proveravamo plastiku, lak i klima uređaj posebno'
        barcelona:
          lead: Sve zavisi od blizine mora. Automobili često izgledaju odlično sa donje strane, ali zahtevaju pažnju na skrivene delove i elektronske komponente.
          points:
            - 'More je u blizini, pa proveravamo skrivene delove: sa donje strane često je čisto, ali unutar nije'
            - Mnogi su to nekadašnji iznajmljivani i deljeni automobili
            - Luka u blizini, slanje morem je lakše organizovati
        zurich:
          lead: Cirih je najskuplje tržište automobila u regionu. Opreme ovde su maksimalne, redovno se održavaju kod dilera, a prodaju se pre nego što se vozilo istroši.
          points:
            - Maksimalne čak i sa malim pređenim kilometrima
            - Dilersko održavanje — istorija je gotovo uvek potpuna
            - Švajcarska nije u EU, uvoz se obavlja posebno
        geneva:
          lead: Ženeva se nalazi u frankofonoj oblasti Švajcarske, neposredno na granici sa Francuskom. Francuskih marki na tržištu je znatno više nego u nemačkom delu zemlje.
          points:
            - 'Mešovito tržište: švajcarsko stanje, francuska ponuda'
            - Granica sa Francuskom blizu — ima čega da se uporedi po ceni
            - 'Postupak je isti kao i u celoj Švajcarskoj: izvoz plus uvoz'
        paris:
          lead: 'Najveći izbor u Francuskoj dolazi sa najstrožom upotrebom: gust saobraćaj i uske parkinge ostavljaju tragove na karoseriji i suspenziji.'
          points:
            - Najveći izbor u Francuskoj, posebno francuskih marki
            - 'Gradski ciklus: gume, suspenzija i sitna oštećenja karoserije'
            - Puno dizel vozila — čađavi filteri i EGR proveravamo u prvom redu
        lyon:
          lead: Lyon je smireniji od Pariza i po cenama i po stanju automobila. Autoput ka jugu je u blizini, pa se češće nalaze vozila sa malim pređenim kilometrima.
          points:
            - Cene su niže od pariskih uz sličan izbor
            - Više autoputskih pređenih kilometara, manje gradske upotrebe
            - Praktična ruta do Italije i Španije, ako pretražujemo šire
        milan:
          lead: 'Poslovna prestonica Italije, a to se na tržištu jasno vidi. Sever zemlje bliži je nemačkim uslovima: putevi su bolji, automobili su bolje održavani nego na jugu.'
          points:
            - Najbolji izbor premijum segmenta u Italiji
            - Sever — manje soli i korozije nego na jugu zemlje
            - 'Gust grad: merno uvođenje debljine na panelima je obavezno'
        rome:
          lead: Veliko tržište sa vrlo gustim urbanim saobraćajem. Sitne ogrebotine ovde se smatraju normalnim i često se brzo popravljaju.
          points:
            - Mnogo malih automobila i vozila sa plinskom opremom
            - Česte lakirane popravke nakon kontakata u gradu — proveravamo svaku panelu
            - Južnije od Milana — klima je blaža, ali bliže moru
        warsaw:
          lead: Kroz Varšavu ulazi glavni uvoz iz Zapadne Evrope, i ovde je najveći izbor u Poljskoj. Udeo obnovljenih automobila je takođe najviši.
          points:
            - Najveći izbor u Poljskoj, mnogo svežeg uvoza iz EU
            - Geometriju karoserije i tragove popravki proveravamo prvo
            - Kratka ruta dostave — jeftinije nego iz Južne Evrope
        krakow:
          lead: 'Krakov je mirniji od Varšave: tržište je manje, preprodaja je manje, a automobili često imaju jednog vlasnika duže. Jug Poljske je logistički bliži Balkanima.'
          points:
            - Manje preprodavaca nego u Varšavi, istorija je obično čistija
            - Cene su često niže nego u glavnom gradu
            - Bliže ruti na jug — zgodno za dostavu u Srbiju
