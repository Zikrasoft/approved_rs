        included:
          - title: Autos mit russischer Zulassung
            text: 'Unser Schwerpunkt. Das Auto kann in jedem europäischen Land stehen: Wir kommen zum Standort und kümmern uns selbst um die Ausfuhr und den Weiterverkauf.'
