      hub:
        metaTitle: Fahrzeugbeschaffung in Europa komplett
        metaDescription: 'Wir suchen Autos in Deutschland, Serbien, Spanien, der Schweiz, Italien, Frankreich, Polen und Portugal: Suche, Besichtigung, Verhandlung und Lieferung komplett.'
        title: Fahrzeugbeschaffung
        titleHighlight: komplett
        description: Wir finden das Auto in dem Land, in dem Sie sich befinden oder den Kauf planen — vollständige Überprüfung, Begleitung des Geschäfts und Lieferung komplett. Wählen Sie ein Land, um Details zu sehen.
        breadcrumbLabel: Fahrzeugbeschaffung
        casesHeading: Echte Aufträge zur Fahrzeugbeschaffung
        chooseCountryLabel: 'Wählen Sie ein Land:'
        ctaLabel: Auto auswählen
        heroPhotoAlt: Reihe von Autos auf dem Händlergelände
        processHeading: So läuft die Beschaffung ab
        processLead: 'Von der Anfrage bis zu den Schlüsseln dauert es normalerweise zwischen drei Tagen und zwei Wochen. Am längsten suchen wir nach einem Auto: das erste passende nehmen wir nicht, sondern schauen weiter, bis uns eines ohne Fragen nach der Überprüfung begegnet.'
        processSteps:
          - n: '01'
            text: Wir diskutieren das Budget, die Marke und die Anforderungen — was wichtig ist und wofür man bereit ist, zu verzichten
          - n: '02'
            text: Wir filtern vor Ort und schränken per Telefon alles aus, das nicht den Anforderungen genügt
          - n: '03'
            text: Wir fahren zur Besichtigung mit einem Lackdickenmesser und Scanner, für BMW verbinden wir die Händler-ISTA, machen Fotos und Videos
          - n: '04'
            text: Wir senden einen Bericht und sagen direkt, ob es sich lohnt, das Auto zu kaufen oder weiterzusuchen
          - n: '05'
            text: Wir verhandeln, schließen den Deal ab und übergeben das Auto an Sie oder bringen es zu Ihrer Tür
        includedHeading: Was ist in der Dienstleistung enthalten
        includedLead: Die Gebühr wird vor Beginn festgelegt und hängt nicht davon ab, wie viele Autos wir uns ansehen mussten. Wenn wir nach der Überprüfung sagen, „nimm es nicht“ — suchen wir weiter, wobei dafür keine zusätzlichen Kosten anfallen.
        included:
          - title: Uneingeschränkte Suche nach Optionen
            text: Wir arbeiten weiter, bis wir ein Auto finden, das keine Beanstandungen hat. Die Ablehnung eines ungeeigneten Modells ist Teil des Prozesses und kostet nichts extra.
          - title: Expertenbesuch bei jeder Besichtigung
            text: Lackdickenmesser an den Karosserieteilen, Scanner an den Steuergeräten, Hebebühne, wo sie benötigt wird. Fotos und Videos von allen problematischen Stellen — Sie sehen dasselbe wie wir.
          - title: Überprüfung der Historie und rechtlichen Klarheit
            text: CarVertical Bericht über die VIN, Händler-Servicehistory nach Marke, Prüfung des Kilometerstands, Pfand, Registrierungseinschränkungen und nicht abgeschlossene Versicherungsereignisse.
          - title: Verhandlung und Vertragsabschluss
            text: Wir vereinbaren den Preis unter Berücksichtigung der Funde, bereiten die Dokumente vor und begleiten die Unterzeichnung.
          - title: Lieferung und Zulassung
            text: Wir bringen das Auto in Ihre Stadt und helfen bei der örtlichen Zulassung — oder wir übergeben die Schlüssel dort, wo es für Sie am bequemsten ist.
          - title: Eine Person für den gesamten Prozess
            text: Sie arbeiten mit dem gleichen Spezialisten, der zur Besichtigung gefahren ist. Es ist nicht notwendig, jedem, der ans Telefon geht, die Aufgabe erneut zu erklären.
        compareHeading: Was unterscheidet die Märkte voneinander
        compareLead: Das gleiche Modell in Deutschland und Polen — in Bezug auf die Historie und den Preis handelt es sich um zwei verschiedene Autos.
        compareHint: Wählen Sie ein Land — wir zeigen Ihnen, worauf wir dort zuerst achten.
        compareLinkFor: Fahrzeugbeschaffung {location} — im Detail
      title: Fahrzeugbeschaffung komplett
      descriptionFor: Wir finden ein Auto in {location} — aus jenen, die bereits in diesem Land sind, ohne Import aus dem Ausland. Vollständige Überprüfung, Begleitung des Geschäfts und Lieferung in Ihre Stadt.
      ctaLabel: Anfrage senden
