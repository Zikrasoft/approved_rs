          lead: Pančevo je praktično deo šireg područja Beograda, pa se provera auta pre kupovine ovde organizuje isto kao u prestonici. Tržište je malo, ali među privatnim oglasima često ima zanimljivih ponuda.
          points:
            - Dvadeset minuta od Beograda, izlazimo na teren jednako brzo
            - Manje tržište na kojem preovlađuju privatni prodavci
            - Često povoljnije nego u prestonici za vozila u istom stanju
        subotica:
          lead: 'Subotica je uz granicu sa Mađarskom, što se vidi i u ponudi: mnogo je automobila uvezenih iz EU i prodavaca koji se time redovno bave.'
          points:
            - Pogranično tržište sa mnogo tek uvezenih automobila iz Evropske unije
            - Posebno detaljno proveravamo istoriju vozila pre uvoza
            - Pogodna lokacija ako planirate da automobil vozite dalje na sever
        madrid:
          lead: Tržište španske prestonice nudi najveći izbor u zemlji i mnogo vozila iz službenih flota. Klima je kontinentalna, pa je korozija izazvana morskim vazduhom ređa nego na obali.
          points:
            - Najveći izbor u Španiji, uključujući vozila iz službenih flota
            - Daleko od mora, karoserije su obično manje zahvaćene korozijom nego na obali
            - 'Vrela leta: posebno proveravamo plastiku, lak i klima-uređaj'
        barcelona:
          lead: Blizina mora ima presudan uticaj. Automobili često odozdo izgledaju odlično, ali zatvorene šupljine karoserije i električne instalacije zahtevaju posebnu pažnju.
          points:
            - 'Zbog blizine mora proveravamo zatvorene šupljine: podvozje često izgleda čisto, dok unutra ima korozije'
            - Mnogo bivših rentakar vozila i automobila iz sistema deljenja vozila
            - Luka je blizu, pa je lakše organizovati pomorski transport
        zurich:
          lead: Cirih je najskuplje tržište automobila u regionu. Kupci ovde biraju najbogatije pakete opreme, održavaju vozila u ovlašćenim servisima i prodaju ih pre nego što se pojave ozbiljniji znaci istrošenosti.
          points:
            - Najbogatiji paketi opreme i mala kilometraža
            - Održavanje u ovlašćenim servisima, gotovo uvek uz kompletnu servisnu istoriju
            - Švajcarska nije u EU, pa uvoz zahteva posebnu proceduru
        geneva:
          lead: Ženeva se nalazi u francuskom govornom području Švajcarske, tik uz granicu sa Francuskom. Francuske marke su ovde znatno zastupljenije nego u nemačkom delu zemlje.
          points:
            - Spoj švajcarske očuvanosti i francuskog izbora marki
            - Francuska granica je blizu, pa se cene lako mogu uporediti
            - 'Procedura je ista kao u ostatku Švajcarske: izvozni i uvozni postupak'
        paris:
          lead: 'Najveći izbor u Francuskoj prati i najzahtevnija eksploatacija: gust saobraćaj i tesna parking mesta ostavljaju tragove na karoseriji i trapu.'
          points:
            - Najveći izbor u Francuskoj, posebno francuskih marki
            - 'Gradska vožnja: istrošenost kvačila i trapa, uz sitna oštećenja karoserije'
            - Mnogo dizelaša, pa prvo proveravamo DPF i EGR ventil
        lyon:
          lead: Lion je povoljniji od Pariza, a automobili su uglavnom u boljem stanju. Blizu je autoput ka jugu, pa se češće nalaze vozila čija je kilometraža uglavnom pređena na otvorenom putu.
          points:
            - Niže cene nego u Parizu uz sličan izbor
            - Više kilometara na otvorenom putu, manje habanja od gradske vožnje
            - Dobra povezanost sa Italijom i Španijom ako širimo pretragu
        milan:
          lead: 'Poslovna prestonica Italije, što se vidi i po cenama automobila. Uslovi na severu zemlje bliži su nemačkim: putevi su bolji, a vozila održavanija nego na jugu.'
          points:
            - Najbolji izbor premijum automobila u Italiji
            - Sever zemlje, manje soli i korozije nego na jugu
            - 'Gust gradski saobraćaj: obavezno merimo debljinu laka na svim panelima karoserije'
        rome:
          lead: Veliko tržište automobila koji se intenzivno voze po gradu. Sitne ogrebotine ovde su uobičajene, a često se saniraju na brzinu.
          points:
            - Mnogo malih automobila i vozila sa ugrađenim plinom
            - Često dofarbavanje posle gradskih čukanja, proveravamo svaki deo karoserije
            - Klima je blaža nego u Milanu, ali je more bliže
        warsaw:
          lead: Preko Varšave stiže najveći deo uvoza iz Zapadne Evrope, a tu je i najveći izbor automobila u Poljskoj. Ujedno je najveći i udeo vozila popravljenih posle udesa.
          points:
            - Najveći izbor u Poljskoj, mnogo tek uvezenih vozila iz EU
            - Prvo proveravamo geometriju karoserije i tragove popravki
            - Kraća transportna ruta, niži troškovi nego iz Južne Evrope
        krakow:
          lead: 'Krakov je mirniji od Varšave: tržište je manje, preprodaja je ređa, a automobili češće duže ostaju kod istog vlasnika. Jug Poljske je i transportno bliži Balkanu.'
          points:
            - Manje preprodavaca nego u Varšavi, istorija vozila je obično urednija
            - Cene su često niže nego u prestonici
            - Bliže ruti ka jugu, pogodno za transport u Srbiju
