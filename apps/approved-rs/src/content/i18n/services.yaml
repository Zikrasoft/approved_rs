      citiesHeadingFor: Gde pregledamo automobile {countryLocation}
      citiesLead: Stručnjak izlazi na teren širom zemlje, ali najčešće pregledamo automobile tamo gde ih ima najviše u ponudi. Evo šta to znači za svaki grad.
      alsoInLabel: 'Automobile pronalazimo i u:'
      crossSellLabel: Tražite automobil iz inostranstva?
      countryNotesHeadingFor: Šta uzimamo u obzir {location}
      countryNotesPointsLabel: Šta prvo proveravamo
      countryNotes:
        de:
          lead: 'Ponuda je veća nego na bilo kom drugom evropskom tržištu, a servisna istorija se obično može pratiti: većina automobila ima servisnu knjižicu sa zapisima ovlašćenog servisa o svakom redovnom servisu. Mana su velike kilometraže na autoputu. Dvesto hiljada kilometara za tri godine je ovde uobičajeno, a ne razlog za popust.'
          points:
            - Servisna knjižica i zapisi ovlašćenog servisa, proveravamo ih po VIN broju
            - HU izveštaj, poznat kao TÜV. Čitamo napomene sa prethodnog pregleda, ne gledamo samo pečat
            - 'Automobili iz lizinga i službenih voznih parkova: redovno održavani, ali sa velikom kilometražom'
            - Zimski putevi posipani solju i hemikalijama, zato posebno proveravamo podvozje i pragove
        rs:
          lead: Ovde smo na licu mesta, pa auto možemo da pregledamo istog dana, bez uvoza. Tržište je malo i isti automobil često prođe kroz ruke nekoliko prodavaca, pa moramo pažljivo da istražimo njegovu istoriju.
          points:
            - Auto je već ocarinjen i ima domaće tablice, pa nema uvoznih dažbina ni dodatne uvozne procedure
            - Kilometraža se često vraća prilikom preprodaje u zemlji, zato je upoređujemo sa zapisima sa tehničkih pregleda
            - Mnogo je polovnih automobila uvezenih iz Nemačke i Italije, proveravamo šta se sa automobilom dešavalo pre uvoza
            - Pregled istog dana, bez čekanja na transport
        es:
          lead: Zime su blage, a putevi se gotovo ne posipaju solju i hemikalijama, pa je podvozje španskih automobila obično znatno bolje očuvano nego kod nemačkih. S druge strane, sunce i blizina mora oštećuju lak, plastiku i gumene delove.
          points:
            - Zbog blizine obale koroziju prvo tražimo u zatvorenim šupljinama
            - Izbledeli lak i ispucalu plastiku u kabini uzimamo u obzir pri proceni cene
            - 'Mnogo je bivših rent-a-car vozila: kilometraža može biti u redu, ali su intenzivno korišćena'
            - 'ITV izveštaj: proveravamo zabeležene nedostatke i datume pregleda'
        ch:
          lead: 'Švajcarski automobili su primetno bolje održavani od evropskog proseka: skupo održavanje podstiče vlasnike da vode računa o njima, a kilometraža je obično mala. Švajcarska nije u EU, pa se uvoz obavlja drugačije. To unapred uračunavamo u budžet.'
          points:
            - Bogata oprema, češća nego u susednim zemljama
            - MFK. Pregled je strog, vlasnici se za njega ozbiljno pripremaju, a to se vidi na automobilu
            - 'Nije u EU: carinjenje i dokumentacija razlikuju se od procedure za zemlje Evropske unije'
            - Cena je iznad tržišne, ali kasnije štedite na popravkama
        pt:
          lead: Tržište je malo, izbor skromniji nego u Španiji, ali je i konkurencija za dobar automobil slabija. Zbog vlažne, slane klime, korozija od mora javlja se i na novijim automobilima.
          points:
            - Vlaga i blizina mora, zato su skrivene šupljine i elektrika među prioritetima pri pregledu
            - 'Malo tržište: za konkretan zahtev tražimo duže nego u Nemačkoj'
            - 'IPO izveštaj: proveravamo primedbe sa prethodnih pregleda'
            - Mnogo dizelaša i malih automobila, veliki modeli karoserije su retki
        fr:
          lead: Francusko tržište poznato je pre svega po dizelašima i domaćim markama. Peugeot, Renault i Citroën ovde su jeftiniji nego bilo gde drugde u Evropi. Nemački premijum modeli su, naprotiv, skuplji, pa ih ovde nije isplativo kupovati.
          points:
            - Francuske marke po najboljim cenama u Evropi, uz jeftinije održavanje
            - Kod dizelaša posebno proveravamo DPF filter i EGR ventil
            - Contrôle technique. Izveštaji su detaljni, upoređujemo primedbe iz različitih godina
            - 'Gradska vožnja: kvačilo i vešanje habaju se brže nego što se navodi'
        it:
          lead: 'Italijansko tržište nudi dobar izbor malih automobila i retkih paketa opreme, ali zahteva oprez: automobili se intenzivno koriste, a manje popravke karoserije nisu uvek pažljivo urađene.'
          points:
            - Gradska vožnja, česti manji udarci i popravke laka, merač debljine laka je obavezan
            - Na jugu i uz obalu ima više soli i korozije, dok su uslovi na severu sličniji nemačkim
            - 'Revisione: proveravamo redovnost tehničkih pregleda, propusti su češći nego obično'
            - Mnogo automobila ima ugrađen plinski sistem, koji proveravamo zasebno
        pl:
          lead: 'Najbliže veliko tržište: prevoz je jeftin i brz. Ipak, Poljska je godinama bila glavno čvorište za havarisana vozila iz zapadne Evrope, zato istoriju automobila proveravamo temeljnije nego bilo gde drugde.'
          points:
            - Veliki udeo automobila popravljenih posle udesa, geometrija karoserije je prioritet
            - 'Česte preprodaje: automobil može promeniti nekoliko vlasnika za godinu dana'
            - Kilometraža se često vraća prilikom uvoza, zato je proveravamo u servisnim bazama
            - Kratka ruta prevoza, jeftinije i brže nego iz Španije ili Portugala
      closing:
        eyebrow: Odakle da počnemo?
        line1: Opišite automobil
        line2: koji tražite,
        accentWord: ostalo je naš posao
        text: Budžet, karoserija, menjač i još nekoliko želja. Mi tražimo, vi pregledate izveštaje o ponuđenim automobilima i odlučujete koji želite da pogledate uživo.
