            - Das EUR1-Zertifikat bestätigt die Herkunft und senkt den Zollsatz
            - 'Einheitliche Emissionsnormen: Ein Fahrzeug aus jedem EU-Land durchläuft die technische Prüfung gleich'
            - Je kürzer die Strecke, desto günstiger ist oft die Überführung statt der Transporter.
