    vehicle-inspection:
      title: Car Inspection
      description: Independent vehicle inspection before purchase. Expert on-site, diagnostics, report — no obligation to buy.
      ctaLabel: Order Inspection
      casesHeading: 'Real Deals: Pre-Purchase Inspection'
      breadcrumbLabel: Car Inspection
      steps:
        - n: '01'
          text: Body and paintwork — signs of repairs or previous accidents
        - n: '02'
          text: Chassis, suspension, brakes
        - n: '03'
          text: Engine, transmission, gearbox
        - n: '04'
          text: Electronics and service history by VIN
        - n: '05'
          text: Legal status — liens, registration bans, accidents
      extraLine: We also operate in other countries in Europe, including Portugal — please specify upon request.
      hub:
        metaTitle: Car Inspection Before Purchase in Europe
        metaDescription: 'We visit the car you found: thickness gauge, scanner, check history by VIN, and send a report with photos the same day. We operate in eight countries in Europe.'
        title: Car Inspection
        titleHighlight: before purchase
        description: "We visit the car you found and let you know the true condition. The report arrives before you pay: if the answer is “don't buy”, you only lose the inspection cost."
        breadcrumbLabel: Car Inspection
        casesHeading: 'Real Deals: Pre-Purchase Inspection'
        chooseCountryLabel: 'Select a country:'
        ctaLabel: Order Inspection
        heroPhotoAlt: Car on a lift at the service
        processHeading: How the Inspection Works
        processLead: Usually, we inspect within one to two days after the request. The inspection itself takes one and a half to two hours, and we send the report the same day while the car is still available for other buyers.
        processSteps:
          - n: '01'
            text: You send a link to the listing and seller's contact details
          - n: '02'
            text: We agree with the seller on the time and place of inspection
          - n: '03'
            text: We arrive with a thickness gauge and scanner, connecting the dealer's ISTA for BMW when needed, and may use a lift
          - n: '04'
            text: We take photos and videos of all findings, checking the history by VIN
          - n: '05'
            text: We send the report and a direct answer — buy, negotiate, or reject
        includedHeading: What’s Included in the Inspection
        includedLead: 'There are over a hundred checklist items, but decisions are usually made based on four areas: body, engine with transmission, chassis, and documents. These are the common reasons we advise against a purchase.'
        included:
          - title: Body and Paintwork
            text: Thickness measurements on each panel, geometry of openings, signs of welding and body filler. It reveals if there was a repair that the seller did not mention.
          - title: Engine and Transmission
            text: Parameters of the warmed-up engine, transmission adaptations, errors in control units. This is the most expensive area and the most common reason for refusal.
          - title: Chassis and Brakes
            text: Play, condition of the suspension and braking system. Highway mileage and Balkan roads wear down the car differently, and this is noticeable.
          - title: Electronics and VIN History
            text: CarVertical report, dealer service history by brand, mileage discrepancies with history, block errors, and evidence of deployed airbags.
          - title: Legal Cleanliness
            text: Liens, registration bans, unresolved accidents, and insurance events — these issues emerge after the purchase.
          - title: Report with Photos and Videos
            text: Every finding is documented with photos and annotations. The report stays with you — it’s helpful for negotiation, even if you decide to go ahead with the purchase.
        compareHeading: What Varies from Country to Country
        compareLead: Inspection regulations, common issues in local cars, and ways to hide history vary everywhere.
        compareHint: Select a country — we’ll show what we add to the standard checklist.
        compareLinkFor: Inspection in {location} — in detail
        mapHeading: Four Areas that Decide the Deal
        mapLead: The checklist is long, but we usually talk you out of a purchase based on one of four areas. Click the number on the map — we'll show what the expert examines and what we found there.
      countryNotesHeadingFor: How We Inspect in {location}
      countryNotesPointsLabel: What We Check Beyond the Standard Checklist
      countryNotes:
        de:
          lead: 'In Germany, we have solid references: service book, HU reports, and extensive VIN databases. Therefore, the inspection here mainly involves verifying documents against what the car shows.'
          points:
            - We cross-check dealer service records with odometer readings over the years.
            - Notes from previous HU inspections — what was repaired and what was just deferred.
            - Underbody and sills after winter chemicals, including hidden cavities.
            - 'Leasing history: consistent maintenance with high mileage.'
        rs:
          lead: "In Serbia, we conduct inspections the same day you contact us. The primary goal is to restore the car's history before import: local documents only show the last segment of the vehicle's life."
          points:
            - Country of origin and the condition of the car before import to Serbia.
            - Odometer readings against technical inspection records from previous years.
            - Bodywork repairs post-import — these are typically done more frequently and cheaply than in the EU.
            - 'Legal aspects: liens and registration restrictions.'
        es:
          lead: Spanish cars usually impress with their undercarriage but disappoint with everything affected by sun and salt. We shift our focus from corrosion underneath to hidden cavities, electrics, and interior condition.
          points:
            - Corrosion in hidden cavities near the coast — the underside may look clean.
            - Paint, seals, and plastics after years of sun exposure.
            - 'Rental history: we check the mileage against the wear patterns of the interior.'
            - ITV report and any unresolved issues between inspections.
        ch:
          lead: In Switzerland, cars are thoroughly prepared for MFK, so a fresh protocol tells us little. We check what was addressed just before the inspection and what has been maintained since last year.
          points:
            - What was replaced right before MFK — new parts compared to the rest.
            - Service can be expensive, so we check that maintenance wasn't deferred.
            - Rich equipment, but we verify that every option is still functional.
            - 'Import documents: Switzerland is not in the EU, the requirements differ.'
        pt:
          lead: 'Everything here revolves around the humid coastal climate. We begin inspections with a focus on corrosion and electrics: issues usually come from damp settings.'
          points:
            - Hidden cavities, longitudinal beams, and suspension mounting points.
            - Oxidation of connectors and blocks — a common cause of intermittent errors.
            - IPO report and inspection frequency.
            - 'Diesels used in urban settings: particulate filter and its history.'
        fr:
          lead: 'In France, detailed contrôle technique is a good starting point. We then look at issues the regulations might miss: diesel component lifespan and wear from urban traffic.'
          points:
            - Notations from contrôle technique over the years — what recurs from inspection to inspection.
            - Particulate filter, EGR, and turbo on diesels.
            - Clutch and suspension after intensive urban use.
            - 'History on French brands: accessible parts, but they have their weaknesses.'
        it:
          lead: Italian cars often arrive with minor bodywork repairs done quickly and cheaply. Using a thickness gauge on panels here takes significantly more time than usual.
          points:
            - Thickness gauge on all panels — touch-ups from city scrapes.
            - 'Difference between north and south: salt near the coast, standard wear inland.'
            - Gas systems, if present — installation and tank condition.
            - Regularity of revisione and any missed periods.
        pl:
          lead: Poland is the largest transshipment market for damaged cars from Western Europe. Therefore, we first find out what has been done with this body before the sale.
          points:
            - Geometry of openings and signs of welding — restoration after serious accidents.
            - 'Import history: where the car came from and in what condition.'
            - We cross-reference mileage with European service databases, the odometer is not trustworthy.
            - Airbags and their deployment history.
      closing:
        eyebrow: Found a car?
        line1: Send us the link
        line2: to the ad —
        accentWord: we’ll come and check it out
        text: We’ll go out within a day or two. The report with photos stays with you, even if you decide against the purchase afterward.
    cityVehicleSourcing:
      title: Car Sourcing
      descriptionFor: We’ll find a car in {cityLocation} with a full inspection. We operate throughout the {countryName} region.
      casesHeadingFor: Real Deals in the {countryGenitiveOrName} Market
      whyCityHeadingFor: Why {cityName}
      reason1: We look at both dealer lots and private ads.
      reason2: We check history by VIN before we go to inspect.
      reason3For: Our expert is in {cityLocation}
      reason4Dekra: DEKRA / TÜV inspection upon request
      reason4Generic: Independent technical review upon request
      otherCitiesLabelFor: 'Other cities in {countryLocation}:'
      cityNotesHeadingFor: The Automotive Market in {cityLocation}
      cityNotesPointsLabel: What This Means in Practice
      cityNotes:
        berlin:
          lead: Berlin offers the largest selection in Germany and the most diverse range of sellers. You can find everything here, from corporate fleet vehicles with complete histories to resale options from Eastern Europe.
          points:
            - Extensive selection in every segment, including rare configurations
            - Many private sellers — bargaining is more realistic than with dealers
            - 'Urban driving cycle: tires and suspension wear out more noticeably than highway vehicles'
        munich:
          lead: 'An expensive city with high-end vehicles. The premium segment is larger here than anywhere else in Germany, and the overall condition is generally better: these cars are well-maintained.'
          points:
            - Strong premium segment, especially BMW and Mercedes
            - Well-kept cars with complete dealer histories
            - Prices are above the national average — savings are due to condition
        hamburg:
          lead: A port city and major logistics hub. It's convenient to send cars from here, and you'll often find fresh import vehicles on the market.
          points:
            - The port is nearby — it's easier and cheaper to arrange shipping
            - Many cars from northern regions with highway mileage
            - 'Humid maritime climate: we inspect the body and hidden cavities more closely'
        dusseldorf:
          lead: The center of North Rhine-Westphalia, Germany's most populous state. Dealerships are tightly packed, and the border with the Netherlands and Belgium is just an hour away, so cars regularly come here for sale.
          points:
            - In one trip, we can check several cars since the dealerships are close together
            - 'Some offers have Dutch and Belgian license plates: we verify their history and documents separately'
            - There are many sellers competing with each other — negotiation is more vigorous
        belgrade:
          lead: Our base. In Belgrade, we conduct inspections on the same day as the request, know local sellers, and can see which cars have been circulating on the lots for two months.
          points:
            - Inspection on the same day as your inquiry, no waiting or logistics
            - We know local lots and the history of the cars on them
            - The car is already customs cleared — no import duties are needed
        novi-sad:
          lead: The second-largest city in Serbia, just an hour's drive from Belgrade. The market is smaller, but prices are usually calmer than in the capital, and cars have often gone through fewer resales.
          points:
            - Prices are lower than in Belgrade for comparable conditions
            - Fewer resellers, first owners are more common
            - We drive from Belgrade, no extra charge for travel
        pancevo:
          lead: Pančevo practically belongs to the Belgrade agglomeration, so inspections here are similar to those in the capital. The market is small, but private listings tend to be more interesting.
          points:
            - Twenty minutes from Belgrade — we can get there just as quickly
            - Small market with a predominance of private sellers
            - Often cheaper than in the capital for the same condition
        subotica:
          lead: 'Subotica is located on the border with Hungary, and this is evident in the market: many cars are imported from the EU, and sellers handling this business regularly.'
          points:
            - Border market — a lot of fresh imports from the European Union
            - History prior to import is checked very thoroughly
            - Convenient point if you plan to drive the car further north
        madrid:
          lead: 'The capital market of Spain: the largest selection in the country and many vehicles from corporate fleets. The continental climate means less coastal corrosion than on the shore.'
          points:
            - The largest selection in Spain, including corporate cars
            - Far from the sea — bodies are usually cleaner than coastal ones
            - 'Hot summers: we inspect plastic, paint, and air conditioning separately'
        barcelona:
          lead: Proximity to the sea makes all the difference. Cars often look great underneath, but they require attention to hidden cavities and electrical systems.
          points:
            - 'The sea is close, so we check hidden cavities: clean underneath but not inside'
            - Many former rental and car-sharing vehicles
            - The port is nearby, making sea shipping easier to arrange
        zurich:
          lead: Zurich is the most expensive car market in the region. Buyers tend to choose top trims, maintain them at dealerships, and sell them before they wear out.
          points:
            - Top trims and low mileage
            - Dealer service — histories are almost always complete
            - Switzerland is not in the EU; import procedures need to be completed separately
        geneva:
          lead: Geneva is located in the French-speaking part of Switzerland, right at the border with France. There are noticeably more French brands on the market than in the German part of the country.
          points:
            - 'Mixed market: Swiss condition, French selection'
            - The border with France is nearby — there's plenty to compare in terms of price
            - 'The process is the same as throughout Switzerland: export plus import'
        paris:
          lead: 'The largest selection in France comes with the harshest usage: dense traffic and tight parking leave marks on the body and suspension.'
          points:
            - The largest selection in France, especially for French brands
            - 'Urban driving cycle: tires, suspension, and minor body damage'
            - Many diesels — we check the particulate filter and EGR first
        lyon:
          lead: Lyon is calmer than Paris in terms of prices and vehicle condition. The highway to the south is nearby, leading to more cars with steady highway mileage.
          points:
            - Prices are lower than in Paris for comparable selections
            - More highway mileage, less urban wear
            - Convenient route to Italy and Spain if you're looking more broadly
        milan:
          lead: 'The business capital of Italy, and you can see its impact on the market. The north of the country has better road conditions: cars are in better shape than in the south.'
          points:
            - The best selection of premium vehicles in Italy
            - The north has less salt and corrosion than the south
            - 'Dense city: a thickness gauge for panels is essential'
        rome:
          lead: A large market with very dense urban operation. Minor scratches are considered a part of everyday life here, and they're often repaired quickly.
          points:
            - Many compact cars and vehicles with gas equipment
            - Frequent touch-ups after urban interactions — we inspect each panel
            - South of Milan — the climate is milder, but closer to the sea
        warsaw:
          lead: Most imports from Western Europe enter the country through Warsaw, where you’ll find the largest selection in Poland. It also has the highest share of refurbished cars.
          points:
            - The largest selection in Poland, with plenty of fresh imports from the EU
            - We first check the body geometry and signs of repair
            - Shorter delivery distance — cheaper than from Southern Europe
        krakow:
          lead: 'Krakow is calmer than Warsaw: a smaller market, fewer resales, and cars tend to stay with one owner longer. Southern Poland is logistically closer to the Balkans.'
          points:
            - Fewer resellers than in Warsaw, history is usually cleaner
            - Prices are often lower than in the capital
            - Closer to the route south — convenient for delivery to Serbia
