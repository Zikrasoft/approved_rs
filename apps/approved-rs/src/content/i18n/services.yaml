    vehicle-inspection:
      title: Fahrzeugprüfung
      description: Unabhängige Prüfung des Autos vor dem Kauf. Expertenbesuch, Diagnose, Bericht - ohne Kaufverpflichtung.
      ctaLabel: Prüfung anfordern
      casesHeading: 'Echte Deals: Prüfung vor dem Kauf'
      breadcrumbLabel: Fahrzeugprüfung
      steps:
        - n: '01'
          text: Karosserie und Lack - Vorhandensein von Reparaturen oder Unfällen
        - n: '02'
          text: Fahrwerk, Aufhängung, Bremsen
        - n: '03'
          text: Motor, Getriebe, Transmission
        - n: '04'
          text: Elektronik und Wartungshistorie per VIN
        - n: '05'
          text: Rechtsklarheit - Pfandrechte, Registrierungssperren, Unfälle
      extraLine: Wir arbeiten auch in anderen europäischen Ländern, einschließlich Portugal - уточните при заявке.
      hub:
        metaTitle: Fahrzeugprüfung vor dem Kauf in Europa
        metaDescription: 'Wir kommen zu dem Auto, das Sie selbst gefunden haben: Dickenmesser, Scanner, VIN-Historienprüfung und Bericht mit Fotos am selben Tag. Wir arbeiten in acht europäischen Ländern.'
        title: Fahrzeugprüfung
        titleHighlight: vor dem Kauf
        description: 'Wir kommen zu dem Auto, das Sie selbst gefunden haben, und erzählen Ihnen, was wirklich mit ihm ist. Der Bericht kommt bevor Sie das Geld überweisen: wenn die Antwort lautet „nicht kaufen“, verlieren Sie nur die Kosten der Prüfung.'
        breadcrumbLabel: Fahrzeugprüfung
        casesHeading: 'Echte Deals: Prüfung vor dem Kauf'
        chooseCountryLabel: 'Wählen Sie ein Land:'
        ctaLabel: Prüfung anfordern
        heroPhotoAlt: Auto auf einer Hebebühne in der Werkstatt
        processHeading: Wie die Prüfung abläuft
        processLead: In der Regel fahren wir innerhalb von ein bis zwei Tagen nach der Anfrage los. Die Besichtigung selbst dauert anderthalb bis zwei Stunden, den Bericht senden wir am selben Tag, solange das Auto noch nicht verkauft ist.
        processSteps:
          - n: '01'
            text: Sie senden uns den Link zur Anzeige und die Kontaktdaten des Verkäufers
          - n: '02'
            text: Wir vereinbaren mit dem Verkäufer die Zeit und den Ort der Besichtigung
          - n: '03'
            text: Wir fahren mit Dickenmesser und Scanner, bei BMW verbinden wir uns mit dem Händler-ISTA, wenn nötig - auf die Hebebühne
          - n: '04'
            text: Wir machen Fotos und Videos von allen Feststellungen, prüfen die Historie per VIN
          - n: '05'
            text: Wir senden den Bericht und die direkte Antwort - kaufen, verhandeln oder ablehnen
        includedHeading: Was zur Prüfung gehört
        includedLead: 'Über hundert Punkte auf der Checkliste, aber entscheiden tun fast immer vier Bereiche: Karosserie, Motor und Getriebe, Fahrwerk und Dokumente. Genau danach raten wir oft vom Kauf ab.'
        included:
          - title: Karosserie und Lack
            text: Dickenmesser an jedem Paneel, Geometrie der Öffnungen, Schweiß- und Spachtelspuren. Man sieht, ob es Reparaturen gab, die der Verkäufer nicht erwähnt hat.
          - title: Motor und Getriebe
            text: Parameter im warmen Motor, Anpassungen des Getriebes, Fehler in den Speichern. Der teuerste Bereich und der häufigste Grund für eine Ablehnung.
          - title: Fahrwerk und Bremsen
            text: Spiel, Zustand der Aufhängung und Bremsanlage. Autobahnkilometer und Balkanstrecken beanspruchen das Auto unterschiedlich, und das sieht man.
          - title: Elektronik und VIN-Historie
            text: CarVertical Bericht, dealerbasierte Servicehistorie der Marke, Kilometerstandsabweichungen mit der Historie, Fehler in Steuergeräten und Spuren von ausgelösten Airbags.
          - title: Rechtliche Flächen
            text: Pfand, Registrierungsbeschränkungen, offene Unfälle und Versicherungsereignisse - das kommt oft erst nach dem Kauf ans Licht.
          - title: Bericht mit Fotos und Videos
            text: Jede Feststellung ist dokumentiert und beschriftet. Der Bericht bleibt bei Ihnen - damit können Sie selbst beim Kauf verhandeln.
        compareHeading: Was sich von Land zu Land ändert
        compareLead: Regulierung der Hauptuntersuchung, typische Schwächen lokaler Fahrzeuge und Möglichkeiten, die Historie überall zu verbergen.
        compareHint: Wählen Sie ein Land - wir zeigen Ihnen, was wir zur normalen Checkliste hinzufügen.
        compareLinkFor: Überprüfung {location} - im Detail
        mapHeading: Vier Bereiche, die den Deal entscheiden
        mapLead: Die Checkliste ist lang, aber wir warnen fast immer in einem der vier Bereiche. Klicken Sie die Nummer auf dem Diagramm - wir zeigen, worauf der Experte achtet und was wir dort gefunden haben.
      countryNotesHeadingFor: Wie wir {location} überprüfen
      countryNotesPointsLabel: Was wir über die normale Checkliste hinaus überprüfen
      countryNotes:
        de:
          lead: 'In Deutschland gibt es viele Anhaltspunkte: Serviceheft, HU-Protokolle und umfangreiche VIN-Datenbanken. Daher steht hier bei der Prüfung zunächst der Abgleich der Dokumente mit dem, was das Auto zeigt, im Vordergrund.'
          points:
            - Wir prüfen die Einträge der Händler-Inspektionen mit den Kilometerständen über die Jahre.
            - Anmerkungen aus der letzten HU - was wurde nach der Inspektion repariert und was nur so hingezogen.
            - Unterboden und Schweller nach Wintersalzen, inklusive versteckter Hohlräume.
            - 'Leasingvergangenheit: gleichmäßige Wartung bei hohen Laufleistungen.'
        rs:
          lead: 'In Serbien kommen wir am Tag der Anfrage. Die Hauptaufgabe ist es, die Geschichte des Autos bis zur Einfuhr wiederherzustellen: lokale Dokumente zeigen nur den letzten Abschnitt des Lebens des Fahrzeugs.'
          points:
            - Ursprungsland und Zustand des Fahrzeugs vor der Einfuhr nach Serbien.
            - Kilometerstand im Vergleich zu den Einträgen der technischen Überprüfung der vergangenen Jahre.
            - Karosseriereparaturen nach der Einfuhr — diese geschehen häufig und günstiger als in der EU.
            - 'Rechtliche Aspekte: Pfand und Einschränkungen bei der Registrierung.'
        es:
          lead: Spanische Fahrzeuge erfreuen sich meist eines guten Unterbodens, während sie oft in Bezug auf Sonne und Salz leiden. Wir verschieben die Überprüfung vom Rost an der Unterseite hin zu versteckten Hohlräumen, der Elektrik und dem Zustand des Innenraums.
          points:
            - Rost in versteckten Hohlräumen an der Küste - von unten kann es sauber sein.
            - Lack, Dichtungen und Plastik nach jahrelanger Sonneneinstrahlung.
            - 'Vermietungshistorie: wir vergleichen den Kilometerstand mit dem Abnutzungsgrad des Innenraums.'
            - ITV-Protokoll und was zwischen den Untersuchungen noch offen geblieben ist.
        ch:
          lead: Für die MFK werden die Fahrzeuge ernsthaft vorbereitet, deshalb sagt ein frisches Protokoll alleine wenig aus. Wir schauen uns an, was genau vor der Untersuchung gemacht wurde und was seit dem letzten Jahr in Betrieb ist.
          points:
            - Was wurde direkt vor der MFK ausgetauscht - frische Teile im Vergleich zu den restlichen.
            - Wartung ist teuer, deshalb prüfen wir, ob Wartungen aufgeschoben wurden.
            - Ausstattung ist reichhaltig, aber wir prüfen, ob jede Option noch funktioniert.
            - 'Dokumente zur Einfuhr: Die Schweiz ist nicht EU, der Umfang unterscheidet sich.'
        pt:
          lead: 'Alles hier hängt vom feuchten maritimen Klima ab. Wir beginnen die Überprüfung mit Rost und Elektrik: oft ist das, was in der Feuchtigkeit leidet, das Problem.'
          points:
            - Versteckte Hohlräume, Längsträger und Punkte zur Aufhängung.
            - Korrosion an Steckverbindern und Steuergeräten - eine typische Ursache für sporadische Fehler.
            - IPO-Protokoll und Regelmäßigkeit der Prüfungen.
            - 'Diesel mit stadtnaher Nutzung: Partikelfilter und dessen Historie.'
        fr:
          lead: 'In Frankreich gibt es eine detaillierte Kontrolle technique, und das ist ein guter Ausgangspunkt. Danach sehen wir uns das an, was die Regulierung nicht erfasst: den Zustand der Dieselmotoren und den Verschleiß durch den Stadtverkehr.'
          points:
            - Anmerkungen der Kontrolle technique über die Jahre - was von Inspektion zu Inspektion wiederkehrt.
            - Partikelfilter, EGR und Turbine bei Dieselmotoren.
            - Kupplung und Federung nach dichtem Stadtverkehr.
            - 'Historie der französischen Marken: verfügbare Ersatzteile, aber auch eigene Schwachstellen.'
        it:
          lead: Italienische Fahrzeuge kommen häufiger mit kleinen Karosseriereparaturen, die schnell und günstig durchgeführt werden. Das Messen der Lackdicke an den Paneelen dauert hier deutlich länger als gewohnt.
          points:
            - Lackdickenmessung an allen Paneelen - Nachlackierungen nach städtischen Berührungen.
            - 'Unterschied zwischen Nord und Süd: Salz an der Küste, normaler Verschleiß im Landesinneren.'
            - Gasinstallation, wenn vorhanden - Installation und Zustand des Tanks.
            - Regelmäßigkeit der revisione und versäumte Zeiten.
        pl:
          lead: Polen ist der größte Umschlagplatz für Unfallwagen aus Westeuropa. Daher erforschen wir zunächst, was mit dieser Karosserie vor dem Verkauf gemacht wurde.
          points:
            - Geometrie der Öffnungen und Schweißspuren - Reparatur nach einem schweren Unfall.
            - 'Einfuhrenhistorie: woher das Auto kam und in welchem Zustand.'
            - Kilometerstand vergleichen wir mit europäischen Servicedatenbanken, dem Kilometerzähler misstrauen wir.
            - Airbags und deren Aktivierung in der Vergangenheit.
      closing:
        eyebrow: Haben Sie ein Auto gefunden?
        line1: Schicken Sie uns den Link
        line2: zu dem Angebot -
        accentWord: wir kommen vorbei und schauen es uns an
        text: Wir fahren innerhalb von ein bis zwei Tagen. Der Bericht mit Fotos bleibt bei Ihnen, auch wenn Sie sich anschließend gegen den Kauf entscheiden.
    cityVehicleSourcing:
      title: Autoauswahl
      descriptionFor: Wir suchen ein Auto in {cityLocation} mit vollständiger Überprüfung. Wir sind in der gesamten Region {countryName} aktiv.
      casesHeadingFor: Echte Transaktionen auf dem Markt von {countryGenitiveOrName}
      whyCityHeadingFor: Warum {cityName}
      reason1: Wir beobachten sowohl Händlerplätze als auch private Angebote.
      reason2: Die Historie über die VIN prüfen wir vor der Abfahrt zur Inspektion.
      reason3For: Unser Experte in {cityLocation}
      reason4Dekra: Überprüfung DEKRA / TÜV auf Anfrage.
      reason4Generic: Unabhängige technische Prüfung auf Anfrage.
      otherCitiesLabelFor: 'Andere Städte in {countryLocation}:'
      cityNotesHeadingFor: Automarkt {cityLocation}
      cityNotesPointsLabel: Was bedeutet das in der Praxis
      cityNotes:
        berlin:
          lead: 'In Berlin gibt es die größte Auswahl in Deutschland und die vielfältigsten Verkäufer. Hier findet man alles: von Firmenfahrzeugen mit vollständiger Historie bis hin zu Ankaufsangeboten aus Osteuropa.'
          points:
            - Eine riesige Auswahl in allen Segmenten, einschließlich seltener Ausstattungen
            - Viele Privatverkäufer - Verhandlungen sind realistischere als bei Händlern
            - 'Städtischer Verschleiß: Reifen und Aufhängung nutzen sich schneller ab als bei Autobahnfahrzeugen'
        munich:
          lead: 'Eine teure Stadt mit teuren Autos. Der Premium-Sektor ist hier größer als irgendwo sonst in Deutschland, und der Zustand ist im Durchschnitt höher: diese Fahrzeuge werden gut gepflegt.'
          points:
            - Starker Premium-Bereich, besonders BMW und Mercedes
            - Gepflegte Fahrzeuge mit vollständiger Händlerhistorie
            - Preise über dem Durchschnitt des Landes - Ersparnisse gehen auf Kosten des Zustands
        hamburg:
          lead: Eine Hafenstadt und großes Logistikzentrum. Von hier aus ist der Versand eines Autos einfacher, und auf dem Markt findet man häufiger frische Importfahrzeuge.
          points:
            - Der Hafen in der Nähe - einfacher und günstiger zu organisieren
            - Viele Fahrzeuge aus den nördlichen Bundesländern mit Autobahnkilometern
            - 'Feuchtes maritimes Klima: Wir prüfen Karosserie und versteckte Hohlräume genauer'
        dusseldorf:
          lead: Zentrum von Nordrhein-Westfalen, dem am dichtesten besiedelten Bundesland Deutschlands. Die Verkaufsflächen sind dicht beieinander, und die Grenze zu den Niederlanden und Belgien ist nur eine Stunde entfernt, daher kommen hier regelmäßig Fahrzeuge zum Verkauf.
          points:
            - Wir können bei einem Besuch mehrere Fahrzeuge ansehen - die Verkaufsflächen sind nah beieinander
            - 'Ein Teil der Angebote hat niederländische und belgische Nummernschilder: Wir prüfen die Historie und Dokumente separat'
            - Es gibt viele Verkäufer, die miteinander konkurrieren - Verhandlungen finden häufig statt
        belgrade:
          lead: Unsere Basis. In Belgrad führen wir Besichtigungen am Tag der Anfrage durch, kennen die lokalen Verkäufer und sehen, welches Auto seit zwei Monaten die Verkaufsflächen wechselt.
          points:
            - Besichtigung am Tag der Anfrage, ohne Wartezeit und Logistik
            - Wir kennen die lokalen Verkaufsflächen und die Historie der ausgestellten Fahrzeuge
            - Das Auto ist bereits verzollt - Einfuhr und Zölle sind nicht erforderlich
        novi-sad:
          lead: Die zweitgrößte Stadt Serbiens und eine Stunde Fahrt von Belgrad entfernt. Der Markt ist kleiner, die Preise sind aber normalerweise ruhiger als in der Hauptstadt, und die Autos haben seltener mehrere Wiederverkäufe durchlaufen.
          points:
            - Preise sind niedriger als in Belgrad bei vergleichbarem Zustand
            - Weniger Wiederverkäufer, öfter trifft man auf den ersten Besitzer
            - Wir fahren von Belgrad aus, es gibt keine zusätzlichen Kosten für die Fahrt
        pancevo:
          lead: Pančevo gehört faktisch zur Metropolregion Belgrad, daher unterscheidet sich die Besichtigung hier nicht von der in der Hauptstadt. Der Markt ist kleiner, aber die privaten Angebote sind oft interessanter.
          points:
            - Zwanzig Minuten von Belgrad - wir fahren ebenfalls schnell
            - Kleiner Markt mit einem Überhang an Privatverkäufern
            - Häufig günstiger als in der Hauptstadt bei gleichem Zustand
        subotica:
          lead: 'Subotica liegt an der Grenze zu Ungarn, und das spiegelt sich im Markt wider: viele Autos, die aus der EU importiert wurden, und Verkäufer, die sich ständig damit beschäftigen.'
          points:
            - Grenzmarkt - viele frische Importe aus der Europäischen Union
            - Die Historie vor dem Import prüfen wir besonders gründlich
            - Ein bequemer Standort, wenn Sie das Auto weiter nach Norden fahren wollen
        madrid:
          lead: 'Der Hauptstadtmarkt Spaniens: die größte Auswahl im Land und viele Fahrzeuge aus Firmenflotten. Das kontinentale Klima sorgt dafür, dass es hier weniger maritimer Rost gibt als an der Küste.'
          points:
            - Die größte Auswahl in Spanien, einschließlich Firmenfahrzeuge
            - Weit weg vom Meer - die Karosserien sind normalerweise sauberer als an der Küste
            - 'Heiße Sommer: Kunststoff, Lack und Klimaanlage prüfen wir separat'
        barcelona:
          lead: Hier ist die Nähe zum Meer entscheidend. Autos sehen oft von unten hervorragend aus, benötigen jedoch Aufmerksamkeit für versteckte Hohlräume und Elektrik.
          points:
            - 'Das Meer ist nah, daher prüfen wir versteckte Hohlräume: von unten oft sauber, während innen nicht'
            - Viele ehemalige Mietwagen und Carsharing-Fahrzeuge
            - Der Hafen ist in der Nähe, der Versand per See lässt sich einfacher organisieren
        zurich:
          lead: Zürich ist der teuerste Automarkt der Region. Die Ausstattungen sind hier maximal, die Fahrzeuge werden beim Händler gewartet und schneller verkauft, bevor sie verschleißen.
          points:
            - Maximal ausgestattet und mit niedrigen Laufleistungen
            - Händlerwartung - die Historie ist fast immer vollständig
            - Schweiz ist nicht in der EU, die Einfuhr wird gesondert abgewickelt
        geneva:
          lead: Genf liegt in der französischsprachigen Region der Schweiz, direkt an der Grenze zu Frankreich. Französische Marken sind auf dem Markt deutlich häufiger als in der deutschen Region.
          points:
            - 'Gemischter Markt: schweizerischer Zustand, französisches Sortiment'
            - Die Grenze zu Frankreich ist nah - es gibt Preisvergleiche
            - 'Die Abwicklung ist wie in der ganzen Schweiz: Export plus Import'
        paris:
          lead: 'Die größte Auswahl in Frankreich kommt mit der härtesten Nutzung: dichter Verkehr und enge Parkplätze hinterlassen ihre Spuren an Karosserie und Aufhängung.'
          points:
            - Die größte Auswahl in Frankreich, besonders bei französischen Marken
            - 'Städtischer Betrieb: Haftung, Aufhängung und kleine Karosserieschäden'
            - Viele Diesel - der Rußfilter und EGR werden zuerst geprüft
        lyon:
          lead: Lyon ist ruhiger als Paris, sowohl in Bezug auf die Preise als auch den Zustand der Fahrzeuge. Die Autobahn nach Süden ist in der Nähe, daher findet man häufiger Autos mit gleichmäßigem Autobahnkilometerstand.
          points:
            - Preise sind niedriger als in Paris bei vergleichbarem Angebot
            - Mehr Autobahnkilometer, weniger städtischer Verschleiß
            - Bequemer Zugang nach Italien und Spanien, wenn wir breiter suchen
        milan:
          lead: Die Geschäftshauptstadt Italiens, was sich in den Preisen auf dem Markt bemerkbar macht. Der Norden des Landes hat bessere Straßenverhältnisse als der Süden, sodass die Fahrzeuge besser erhalten sind.
          points:
            - Die beste Auswahl im Premium-Segment in Italien
            - Im Norden gibt es weniger Salz und Korrosion als im Süden
            - 'Dichter Stadtraum: ein Lackdickenmessgerät ist ein Muss'
        rome:
          lead: Ein großer Markt mit intensiver städtischer Nutzung. Kleine Kratzer gelten hier als Normalität und werden häufig hastig repariert.
          points:
            - Viele Kleinwagen und Fahrzeuge mit Gasanlage
            - Häufige Nachlackierungen nach Stadtverkehr — wir prüfen jedes Blech
            - Südlich von Mailand — das Klima ist milder, aber näher zum Meer
        warsaw:
          lead: Über Warschau gelangt der Hauptimport aus Westeuropa ins Land, hier gibt es die größte Auswahl in Polen. Der Anteil der wiederaufbereiteten Fahrzeuge ist ebenfalls am höchsten.
          points:
            - Die größte Auswahl in Polen, viele frische Importe aus der EU
            - Die Karosserie-Geometrie und Spuren von Reparaturen prüfen wir zuerst
            - Kurzes Lieferwegen — günstiger als aus Südeuropa
        krakow:
          lead: 'Krakau ist ruhiger als Warschau: der Markt ist kleiner, es gibt weniger Wiederverkäufer und die Fahrzeuge haben oft einen längeren Vorbesitzer. Der Süden Polens ist logistisch näher zu den Balkanstaaten.'
          points:
            - Weniger Händler als in Warschau, die Vorgeschichte ist meist klarer
            - Preise sind oft niedriger als in der Hauptstadt
            - Näher an der Route nach Süden — praktisch für den Transport nach Serbien
