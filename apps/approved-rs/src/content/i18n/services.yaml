          - title: Exportación y tránsito
            text: Baja en el país de origen, declaración de exportación, matrículas de tránsito y seguro para la conducción.
          - title: Despacho aduanal
            text: Declaración, agente de aduanas y pago en el lugar de llegada. Preparamos el paquete de antemano para que el auto no esté parado en el almacén días extra.
          - title: Registro
            text: Inspección técnica, registro y matrículas. Recoges el auto en el que puedes salir inmediatamente.
