            - El IVA suizo se devuelve al exportar — lo tenemos en cuenta en el cálculo.
            - 'La procedencia del vehículo se verifica por separado: los números suizos no significan producción europea.'
            - El estado suele ser mejor que la media, pero el precio en el anuncio también es más alto.
