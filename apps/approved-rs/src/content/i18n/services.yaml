        title: Compra de autos
        titleHighlight: sin regateo durante semanas
        description: 'Recogemos el auto que es difícil de vender por métodos convencionales: matrícula rusa, importación caducada, documentos en disputa. El precio es inferior al de mercado — esto se debe a la rapidez y a que nos ocupamos de todos los trámites de la venta.'
        breadcrumbLabel: Compra de autos
        casesHeading: Casos de compra
        chooseCountryLabel: 'Elige un país:'
        ctaLabel: Obtener evaluación
        heroPhotoAlt: Llaves de auto sobre dinero y documentos
        processHeading: Cómo se realiza la compra
        processLead: Desde el primer mensaje hasta el pago suelen pasar de dos a tres días, y casi todo este tiempo se destina al viaje hasta el lugar de encuentro. Ofrecemos evaluación a través de fotos en una hora.
        processSteps:
          - n: '01'
            text: Envías fotos, documentos y una descripción honesta del estado.
          - n: '02'
            text: Te damos el precio en una hora — inmediatamente el definitivo, sin rango.
          - n: '03'
            text: Nos ponemos de acuerdo para encontrarnos donde está el auto; si no arranca, llegamos con un remolque.
          - n: '04'
            text: Inspeccionamos en persona y confirmamos el precio, si la descripción coincide.
          - n: '05'
            text: Firmamos el contrato, el dinero se transfiere el día de la firma.
        includedHeading: Qué cubrimos
        includedLead: Por la diferencia entre nuestro precio y el de mercado, cubrimos todo lo que hace que ese auto no se venda durante meses.
        included:
          - title: Autos con matrícula rusa
            text: Categoría principal. El automóvil puede estar en cualquier país de Europa — iremos a donde se encuentra, y nos encargamos de la exportación y posterior reventa.
          - title: Problemas con la importación y plazos
            text: Tras la firma, los riesgos de importación temporales caducados y relacionados pasan a ser nuestros.
          - title: Evaluación sin inspección
            text: Damos el precio basándonos en fotos y documentos. Vamos solo cuando ambas partes ya están de acuerdo sobre la suma.
          - title: Tramitación del negocio
            text: Nosotros preparamos el contrato, la baja del registro y todos los documentos. De tu parte, solo necesitamos los documentos del auto y tu firma.
          - title: Pago el día de la firma
            text: El dinero se transfiere el mismo día. No ofrecemos esquemas de pago a plazos ni 'pagaremos después de la reventa'.
          - title: Negativa honesta
            text: Si el auto no es adecuado para nosotros, lo diremos de inmediato y explicaremos la razón. No alargaremos el proceso ni negociamos el precio más adelante.
