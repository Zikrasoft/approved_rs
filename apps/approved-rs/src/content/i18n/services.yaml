    vehicle-inspection:
      title: Provera auta
      description: Nezavisna provera automobila pre kupovine. Izliaz eksperta, dijagnostika, izveštaj — bez obaveze kupovine.
      ctaLabel: Zatražite proveru
      casesHeading: 'Prave transakcije: provera pre kupovine'
      breadcrumbLabel: Provera auta
      steps:
        - n: '01'
          text: Karoserija i lak — prisustvo popravke ili sudara
        - n: '02'
          text: Hod, suspenzija, kočnice
        - n: '03'
          text: Motor, menjač, transmisija
        - n: '04'
          text: Elektronika i istorija održavanja prema VIN
        - n: '05'
          text: Pravna čistoća — zalozi, zabrana registracije, sudari
      extraLine: Radimo i u drugim zemljama Evrope, uključujući Portugaliju — proverite prilikom prijave.
      hub:
        metaTitle: Provera auta pre kupovine u Evropi
        metaDescription: 'Izlazimo do automobila koji ste sami našli: merni uređaj, skener, provera istorije prema VIN i izveštaj sa fotografijama isti dan. Radimo u osam zemalja Evrope.'
        title: Provera auta
        titleHighlight: pre kupovine
        description: 'Izlazimo do automobila koji ste sami našli i govorimo vam šta je sa njim zapravo. Izveštaj stigne pre nego što uplatite novac: ako odgovor bude „ne kupujte“, gubite samo cenu provere.'
        breadcrumbLabel: Provera auta
        casesHeading: 'Prave transakcije: provera pre kupovine'
        chooseCountryLabel: 'Izaberite zemlju:'
        ctaLabel: Zatražite proveru
        heroPhotoAlt: Automobil na dizalici u servisu
        processHeading: Kako se vrši provera
        processLead: Obično izlazimo u roku od jedan do dva dana nakon prijave. Sam uvid traje sat i po do dva, izveštaj šaljemo istog dana, dok auto još nije otišao drugom kupcu.
        processSteps:
          - n: '01'
            text: Šaljete link na oglas i kontakte prodavca
          - n: '02'
            text: Dogovaramo se s prodavcem o vremenu i mestu provere
          - n: '03'
            text: Izlazimo s mernim uređajem i skenerom, za BMW se povezuje sa dilerom ISTA, po potrebi — na dizalicu
          - n: '04'
            text: Snimamo fotografije i video svih uočenih nepravilnosti, proveravamo istoriju prema VIN
          - n: '05'
            text: Šaljemo izveštaj i direktan odgovor — uzeti, pregovarati ili odustati
        includedHeading: Šta je uključeno u proveru
        includedLead: 'Više od stotinu stavki na kontrolnoj listi, ali najvažnije su gotovo uvek četiri oblasti: karoserija, motor sa menjačem, hodna i dokumentacija. Upravo po njima najčešče odrađujemo odustajanje od kupovine.'
        included:
          - title: Karoserija i lak
            text: Merni uređaj po svakoj paneli, geometrija otvora, tragovi zavarivanja i kitovanja. Vidljivo je da li je bila popravka o kojoj prodavac nije pomenuo.
          - title: Motor i menjač
            text: Parametri na zagrejanom motoru, adaptacije menjača, greške u memoriji blokova. Najskuplja zona i najčešći razlog odbijanja.
          - title: Hodna i kočnice
            text: Lufti, stanje suspenzije i kočionog sistema. Autobusni pređeni put i balkanske ceste troše auto na drugačiji način, i to se vidi.
          - title: Elektronika i istorija prema VIN
            text: Izveštaj CarVertical, istorija servisa, razlike u pređenom putu, greške blokova i tragovi aktiviranih vazdušnih jastučića.
          - title: Pravna čistoća
            text: Zalozi, zabrane registracije, otvorene nezgode i osiguravajući događaji — sve ono što se otkriva posle kupovine.
          - title: Izveštaj sa fotografijama i video zapisima
            text: Svaki nalaz je zabeležen i potpisan. Izveštaj ostaje kod vas — lakše je pregovarati, čak i ako se odlučite da kupite vozilo.
        compareHeading: Šta se menja od zemlje do zemlje
        compareLead: Regulativa tehničkog pregleda, tipične mane lokalnih automobila i načini prikrivanja istorije na različitim mestima.
        compareHint: Izaberite zemlju — pokažemo šta dodajemo na običan kontrolni spisak.
        compareLinkFor: Provera {location} — detaljno
        mapHeading: Četiri zone koje odlučuju o transakciji
        mapLead: Kontrolni spisak je dugačak, ali skoro uvek odustajemo zbog jedne od četiri zone. Kliknite na broj na planu — pokažemo šta stručnjak gleda i šta smo tamo pronašli.
      countryNotesHeadingFor: Kako proveravamo {location}
      countryNotesPointsLabel: Šta proveravamo pored uobičajenog kontrolnog spiska
      countryNotes:
        de:
          lead: 'U Nemačkoj postoji mnogo podataka: servisna knjižica, HU protokoli i razvijene baze podataka po VIN-u. Zato je provera ovde prvenstveno usklađivanje dokumenata sa onim što vozilo pokazuje.'
          points:
            - Uporedimo beleške od delatnosti sa očitanjima kilometraže godišnje
            - Zapažanja prethodnog HU — šta je popravljeno nakon pregleda, a šta je samo privučeno
            - Donji deo i pragovi posle zimskih hemikalija, uključujući skrivene šupljine
            - 'Lizing istorija: ujednačeno održavanje pri velikoj kilometraži'
        rs:
          lead: 'U Srbiji izlazimo na dan zahteva. Glavni cilj je povratak istorije vozila do uvoza: lokalni dokumenti pokazuju samo poslednji deo života automobila.'
          points:
            - Zemlja porekla i stanje vozila pre uvoza u Srbiju
            - Očitavanje kilometraže u poređenju sa zapisima tehničkog pregleda iz prethodnih godina
            - Popravka karoserije posle uvoza — češće i jeftinije nego u EU
            - 'Pravna strana: zalog i ograničenja u registraciji'
        es:
          lead: Španska vozila obično se raduju dobrom donjem delu, ali kvarovi usled sunca i soli mogu biti problem. Fokusiramo proveru sa korozije na skrivene šupljine, elektriku i stanje enterijera.
          points:
            - Korozija u skrivenim prostorima uz obalu — s donje strane može izgledati čisto
            - Lak, brtvila i plastika nakon dugog izlaganja suncu
            - 'Iznajmljeno prošlost: upoređujemo pređeni put sa stanjem enterijera'
            - ITV protokol i šta je ostalo otvoreno između pregleda
        ch:
          lead: U Švajcarskoj se preparacija za MFK uzima veoma ozbiljno, tako da sveže izveštaje malo govore. Proučavamo šta je konkretno urađeno neposredno pre pregleda, a šta funkcioniše iz prošle godine.
          points:
            - Šta je zamenjeno neposredno pre MFK — sveži delovi na osnovu ostatka
            - Održavanje je skupo pa proveravamo da li su odložili redovne preglede
            - Paket je bogat, ali proveravamo da li svaka opcija još uvek funkcioniše
            - 'Dokumenti za uvoz: Švajcarska nije EU, komplet se razlikuje'
        pt:
          lead: 'Sve se svodi na vlažnu morsku klimu. Proveru započinjemo sa korozijom i elektrikom: obično izda što živi u vlažnom okruženju.'
          points:
            - Skrivene šupljine, dužine i tačke oslanjanja vešanja
            - Kiseljenje priključaka i blokova — tipičan uzrok povremenih grešaka
            - IPO protokol i regularnost pregleda
            - 'Dizeli sa gradskom upotrebom: filter čestica i njegova istorija'
        fr:
          lead: 'U Francuskoj se sprovodi detaljan contrôle technique, što je dobra polazna tačka. Zatim gledamo ono što regulativa ne pokriva: resurs diesel motora i habanje usled gradskog saobraćaja.'
          points:
            - Zapažanja od contrôle technique kroz godine — što se ponavlja iz pregleda u pregled
            - Filter čestica, EGR i turbina na dizelima
            - Kvačilo i vešanje posle gustog gradskog ciklusa
            - 'Istorija francuskih marki: dostupni delovi, ali svoja slaba mesta'
        it:
          lead: Italijanska vozila često dolaze sa sitnim popravkama karoserije, urađenim brzo i jeftino. Merenje debljine boje na panelima ovde traje znatno duže nego obično.
          points:
            - Merenje debljine boje na svim panelima — prefarbane površine nakon uličnih dodira
            - 'Razlika između severa i juga: so uz obalu, uobičajeno habanje u unutrašnjosti zemlje'
            - Plinska oprema, ako je prisutna — instalacija i stanje rezervoara
            - Regularnost revisione i propuštena razdoblja
        pl:
          lead: Poljska je najveća luka za oštećena vozila iz Zapadne Evrope. Stoga prvo utvrđujemo šta je rađeno sa tom karoserijom pre prodaje.
          points:
            - Geometrija otvora i tragovi zavarivanja — obnova nakon ozbiljne nesreće
            - 'Istorija uvoza: odakle je vozilo došlo i u kakvom stanju'
            - Pređeni put proveravamo sa evropskim servisnim bazama, kilometražu ne verujemo
            - Vazdušni jastučići i njihovo aktiviranje u prošlosti
      closing:
        eyebrow: Pronašli ste vozilo?
        line1: Pošaljite link
        line2: na oglas —
        accentWord: doći ćemo i proveriti
        text: Izlazimo za jedan do dva dana. Izveštaj sa fotografijama ostaje kod vas, čak i ako se nakon njega odlučite da ne kupite.
    cityVehicleSourcing:
      title: Izbor automobila
      descriptionFor: Pronađite automobil {cityLocation} uz potpunu proveru. Radimo širom regiona {countryName}.
      casesHeadingFor: Prave transakcije na tržištu {countryGenitiveOrName}
      whyCityHeadingFor: Zašto {cityName}
      reason1: Gledamo i kod dilera i privatnih oglasa
      reason2: Istoriju po VIN-u proveravamo pre odlaska na pregled
      reason3For: Naš stručnjak {cityLocation}
      reason4Dekra: Provera DEKRA / TÜV na zahtev
      reason4Generic: Nezavisna tehnička ekspertiza na zahtev
      otherCitiesLabelFor: 'Ostali gradovi {countryLocation}:'
      cityNotesHeadingFor: Tržište automobila {cityLocation}
      cityNotesPointsLabel: Šta to donosi u praksi
      cityNotes:
        berlin:
          lead: 'U Berlinu je najveći izbor u Nemačkoj i najraznolikija ponuda prodavaca. Ovde se može naći sve: i automobili iz korporativnih parkova sa potpunom istorijom, i preprodavane opcije koje dolaze iz Istočne Evrope.'
          points:
            - Ogroman izbor u svakoj klasi, uključujući retke konfiguracije
            - Mnogi privatni prodavci — pregovarati je realnije nego sa dilerima
            - 'Gradski ciklus: prijem i suspenzija se brže troše nego kod automobila sa autoputa'
        munich:
          lead: 'Skupi grad sa skupim automobilima. Premijum-segment ovde ima više nego bilo gde drugde u Nemačkoj, a stanje je u proseku bolje: o tim automobilima se vodi računa.'
          points:
            - Snažan premijum-segment, posebno BMW i Mercedes
            - Pažljivo održavani automobili sa potpunom istorijom dilera
            - Cene su više od prosečnih u zemlji — ušteda dolazi zbog stanja
        hamburg:
          lead: Lučki grad i veliki logistički čvor. Odavde je lako poslati automobil dalje, a na tržištu su češće sveže uvezene vozila.
          points:
            - Luka u blizini — lakše i jeftinije organizovati slanje
            - Mnogi automobili iz severnih zemalja sa dugim pređenim kilometrima
            - 'Vlažna morska klima: pažljivije gledamo na karoseriju i skrivene prostore'
        dusseldorf:
          lead: Centar Severne Rajne-Vestfalije, najgušće naseljenog nemačkog regiona. Auto-placi su blizu jedan drugom, a do granice sa Holandijom i Belgijom je sat vožnje, pa redovno dolaze automobili na prodaju.
          points:
            - Za jedan izlazak možemo pregledati nekoliko automobila — placi su blizu
            - 'Deo ponuda sa holandskim i belgijskim registracijama: istoriju i dokumente proveravamo odvojeno'
            - Mnogi prodavci i međusobno se takmiče — pregovaranje ide lakše
        belgrade:
          lead: Naša baza. U Beogradu izlazimo na provere automobila istog dana kada nas kontaktirate, poznajemo lokalne prodavce i znamo koja vozila su već mesecima na placu.
          points:
            - Provera istog dana, bez čekanja i logistike
            - Poznajemo lokalne placeve i istoriju automobila koji se na njima nalaze
            - Automobil je već carinjen — uvoz i takse nisu potrebne
        novi-sad:
          lead: Drugi po veličini grad u Srbiji i sat vožnje od Beograda. Tržište je manje, ali i cene su obično stabilnije od beogradskih, a automobili ređe prolaze kroz nekoliko preprodaja.
          points:
            - Cene su niže od beogradskih uz uporedivo stanje
            - Manje preprodavaca, češće se sreće prvi vlasnik
            - Izlazimo iz Beograda, nema dodatne naknade za put
        pancevo:
          lead: Pančevo praktično pripada beogradskoj aglomeraciji, tako da provere ovde ne odstupaju od beogradskih. Tržište je malo, ali privatni oglasi su zanimljiviji.
          points:
            - Dvadeset minuta od Beograda — izlazimo jednako brzo
            - Malo tržište sa pretežno privatnim prodavcima
            - Često je jeftinije od glavnog grada uz isto stanje
        subotica:
          lead: 'Subotica se nalazi na granici sa Mađarskom, i to se vidi na tržištu: mnogo automobila uveženih iz EU, i prodavci koji se time stalno bave.'
          points:
            - Granično tržište — mnogo svežeg uvoza iz Evropske unije
            - Istoriju do uvoza proveravamo posebno pažljivo
            - Praktična tačka ako planirate da automobil gurate dalje na sever
        madrid:
          lead: 'Glavno tržište Španije: najveći izbor u zemlji i mnogo automobila iz korporativnih parkova. Kontinentalna klima, pa morska korozija ovde je manje izražena nego na obali.'
          points:
            - Najveći izbor u Španiji, uključujući korporativna vozila
            - Daleko od mora — karoserije su obično čišće od obalnih
            - 'Vruće leto: plastiku, lak i klimatsku uređaj posebno proveravamo'
        barcelona:
          lead: Sve zavisi od blizine mora. Automobili često izgledaju odlično sa donje strane, ali zahtevaju pažnju na skrivene prostore i električne sisteme.
          points:
            - 'More je blizu, pa gledamo skrivene prostore: odozdo često čisto, a iznutra ne'
            - Mnogo bivših iznajmljenih i carsharing automobila
            - Luka u blizini, slanje morem je lakše organizovati
        zurich:
          lead: Cirih je najskuplje tržište automobila u regionu. Konfiguracije su ovde maksimalne, servisiraju ih kod dilera i prodaju pre nego što se auto umori.
          points:
            - Maksimalne konfiguracije i mali pređeni kilometri
            - Dilerska usluga — istorija gotovo uvek potpuna
            - Švajcarska nije u EU, uvoz se obrađuje posebno
        geneva:
          lead: Ženeva se nalazi u frankofonoj regiji Švajcarske, na samoj granici sa Francuskom. Francuskih marki na tržištu ima znatno više nego u nemačkom delu zemlje.
          points:
            - 'Mešovito tržište: švajcarsko stanje, francuski asortiman'
            - Granica sa Francuskom je blizu — ima se s čim uporediti po ceni
            - 'Procedura je ista kao širom Švajcarske: izvoz plus uvoz'
        paris:
          lead: 'Najveći izbor u Francuskoj donosi i najstrožiju eksploataciju: gust promet i uske parkinge ostavljaju tragove na karoseriji i suspenziji.'
          points:
            - Najveći izbor u Francuskoj, posebno francuskih marki
            - 'Gradski ciklus: prijem, suspenzija i sitna oštećenja karoserije'
            - Mnogi dizeli — filtr će čađe i EGR gledamo u prvom redu
        lyon:
          lead: Lyon je mirniji od Pariza i po cenama i po stanju automobila. Autoput ka jugu je blizu, zato se češće nalaze automobili sa ravnim šossisima.
          points:
            - Cene su niže od pariskih uz uporediv izbor
            - Više šossisnog pređenih kilometara, manje gradskog trošenja
            - Povoljna ruta do Italije i Španije, ako tražimo šire
        milan:
          lead: 'Poslovna prestonica Italije, i po novcu se to vidi na tržištu. Sever zemlje je bliži nemačkim uslovima: putevi su bolji, automobili očuvaniji nego na jugu.'
          points:
            - Najbolji izbor premijum-segmenta u Italiji
            - Sever — manje soli i korozije nego na jugu zemlje
            - 'Gust grad: mjerač debljine po panelima je obavezan'
        rome:
          lead: Veliko tržište sa vrlo gustim gradskim prometom. Manje ogrebotine ovde se smatraju normalnim, a često ih brzo popravljaju.
          points:
            - Mnogo malih automobila i vozila sa plinskom opremom
            - Česte farbanja nakon kontakata u gradu — proveravamo svaku tačku
            - Južnije od Milana — klima je blaža, ali bliže moru
        warsaw:
          lead: Kroz Varšavu u zemlju dolazi glavna uvoz roba iz Zapadne Evrope, i ovde je najveći izbor u Poljskoj. Udeo obnovenih automobila je takođe najveći.
          points:
            - Najveći izbor u Poljskoj, mnogo svežeg uvoza iz EU
            - Proveravamo geometriju karoserije i tragove popravke kao prioritet
            - Kratka rampa isporuke — jeftinije nego iz Južne Evrope
        krakow:
          lead: 'Krakov je mirniji od Varšave: tržište je manje, preprodaja je manje, a vozila često imaju jednog vlasnika duže. Jug Poljske je bliži Balkanima po logistici.'
          points:
            - Manje prekupaca nego u Varšavi, istorija je obično čistija
            - Cene su često niže od beogradskih
            - Bliže je putu na jug — praktično za isporuku u Srbiju
