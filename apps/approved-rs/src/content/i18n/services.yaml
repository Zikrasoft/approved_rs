        included:
          - title: Precio del coche
            text: El precio después de la negociación, no el del anuncio. Negociamos con la oferta en mano y esto generalmente cubre parte de los gastos.
          - title: Logística al destino
            text: Transporte en carro o conducción con matrículas de tránsito. Calculamos ambas opciones y elegimos la que sea más rentable en ese tramo específico.
          - title: Aranceles e impuestos
            text: 'La tasa depende del país de origen del coche y su antigüedad. Para coches de producción europea, el certificado EUR1 afecta significativamente el cálculo: verificamos su disponibilidad antes de la compra.'
          - title: Exportación y tránsito
            text: Baja en el país del vendedor, declaración de exportación, matrículas de tránsito y seguro para la conducción.
          - title: Trámites aduaneros
            text: Declaración, agente de aduana y pago en el lugar de llegada. Preparamos el paquete con anticipación para que el coche no quede parado en el almacén más días de lo necesario.
          - title: Matriculación
            text: Inspección técnica, registro y matrículas. Recibes un coche listo para conducir.
