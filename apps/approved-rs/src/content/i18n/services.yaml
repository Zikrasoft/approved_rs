  es:
    vehicle-sourcing:
      hub:
        metaTitle: Selección de autos en Europa llave en mano
        metaDescription: 'Seleccionamos autos en Alemania, Serbia, España, Suiza, Italia, Francia, Polonia y Portugal: búsqueda, inspección, negociación y entrega llave en mano.'
        title: Selección de autos
        titleHighlight: llave en mano
        description: Seleccionamos un automóvil en el país donde se encuentra o planea comprar, con revisión completa, acompañamiento de la transacción y entrega llave en mano. Elija el país para ver los detalles.
        breadcrumbLabel: Selección de autos
        casesHeading: Transacciones reales de selección de autos
        chooseCountryLabel: 'Elija el país:'
        ctaLabel: Seleccionar auto
        heroPhotoAlt: Fila de automóviles en el concesionario
        processHeading: Cómo se lleva a cabo la selección
        processLead: 'Desde la solicitud hasta las llaves, generalmente de tres días a dos semanas. Buscamos la mejor opción: no tomamos la primera que encontramos y seguimos buscando hasta dar con una que no presente problemas tras la revisión.'
        processSteps:
          - n: '01'
            text: 'Discutimos el presupuesto, la marca y los requisitos: qué es importante y qué se puede sacrificar'
          - n: '02'
            text: Seleccionamos opciones en el lugar y descartamos por teléfono todo lo que no cumple con los requisitos
          - n: '03'
            text: Realizamos la inspección con un medidor de espesor y escáner, para BMW conectamos al servicio ISTA, tomamos fotos y videos
          - n: '04'
            text: Enviamos un informe y decimos claramente si vale la pena comprar o seguir buscando
          - n: '05'
            text: Negociamos, formalizamos la transacción y le entregamos el auto o lo llevamos a su puerta
        includedHeading: Qué incluye el servicio
        includedLead: La comisión se fija antes de comenzar y no depende de cuántos autos se revisen. Si después de la inspección decimos «no compre», seguimos buscando sin costos adicionales.
        included:
          - title: Búsqueda sin límite en la cantidad de opciones
            text: Trabajamos hasta encontrar un auto que cumpla con sus expectativas. Renunciar a una opción no exitosa está incluido en el servicio y no tiene costo extra.
          - title: Visita del experto a cada inspección
            text: Medidor de espesor para paneles, escáner para componentes, elevador donde sea necesario. Fotos y videos de todos los puntos problemáticos — usted ve lo mismo que nosotros.
          - title: Verificación de la historia y legalidad
            text: Informe CarVertical por VIN, historial de servicio del concesionario por marca, comprobación del kilometraje, gravámenes, restricciones de registro y eventos de seguro no cerrados.
          - title: Negociación y formalización de la transacción
            text: Negociamos el precio considerando lo encontrado, preparamos los documentos y acompañamos la firma.
          - title: Entrega y registro
            text: Llevamos el auto a su ciudad y ayudamos con el registro en el lugar — o entregamos las llaves donde sea cómodo para usted recogerlo.
          - title: Una persona para todo el proceso
            text: Usted trabaja con el mismo especialista que realizó la inspección. No necesita explicar de nuevo la tarea a cada persona que conteste.
        compareHeading: En qué se diferencian los mercados
        compareLead: El mismo modelo en Alemania y Polonia es, en términos de historia y precio, dos autos diferentes.
        compareHint: Elija el país — le mostraremos qué revisamos allí primero.
        compareLinkFor: Selección {location} — en detalle
      title: Selección de autos llave en mano
      descriptionFor: Seleccionaremos un auto {location} — entre aquellos que ya están en este país, sin importar desde el extranjero. Revisión completa, acompañamiento de la transacción y entrega a su ciudad.
      ctaLabel: Enviar solicitud
      casesHeadingFor: 'Transacciones reales: selección de autos {location}'
      breadcrumbLabelFor: Autos {location}
      stepsFor:
        - n: '01'
          text: 'Envía una solicitud con los requisitos: presupuesto, marca, kilometraje'
        - n: '02'
          text: Buscamos opciones {location} según sus criterios
        - n: '03'
          text: Un experto independiente inspecciona y verifica el automóvil
        - n: '04'
          text: Acompañamos la transacción, ayudamos con documentos y registros
        - n: '05'
          text: Entregamos el automóvil a su ciudad y ayudamos a registrarlo
      deliveryLineFor: Entregaremos el auto en cualquier ciudad del país. Si necesita ser exportado, nos encargamos de la exportación y el despacho — llevamos a {destinations} y a cualquier otro país.
      deliveryDestinations:
        - Bosnia y Herzegovina
        - Croacia
        - Macedonia del Norte
        - Turquía
        - Kazajistán
        - Kirguistán
      citiesHeadingFor: Dónde revisamos autos {countryLocation}
      citiesLead: El experto se desplaza por todo el país, pero más a menudo revisamos autos en las zonas donde hay más disponibles. Esto es lo que esto significa para cada ciudad.
      alsoInLabel: 'También seleccionamos en:'
      crossSellLabel: ¿Necesita un auto que no sea local?
      countryNotesHeadingFor: Qué consideramos en {location}
      countryNotesPointsLabel: En qué nos fijamos primero
      countryNotes:
        de:
          lead: 'Aquí hay más opciones que en cualquier otro mercado de Europa, y la historia de mantenimiento suele ser trazable: la mayoría de los autos tienen un libro de servicio con sellos del concesionario para cada mantenimiento. La contracara son los altos kilometrajes. Doscientos mil en tres años es lo normal, no un motivo para descuento.'
          points:
            - Libro de servicio y sellos del concesionario — verificamos por VIN en el servicio oficial
            - Protocolo HU, comúnmente llamado TÜV — leemos comentarios de la inspección pasada, no solo el sello
            - 'Autos de leasing y flotas corporativas: mantenimiento regular, pero con altos kilometrajes'
            - Carreteras invernales con reactivos — revisamos el chasis y los umbrales por separado
        rs:
          lead: Aquí estamos localmente, por lo que revisamos el auto el mismo día de la solicitud y sin importación. El mercado es pequeño, el mismo auto puede pasar por varios vendedores, y hay que desenredar la historia.
          points:
            - El auto ya está despachado y con matrícula local — no se necesitan tarifas ni tramitación de importación
            - El kilometraje suele ser manipulado al revender en el país — verificamos con los registros de inspección técnica
            - Hay muchos autos importados de Alemania e Italia — verificamos qué sucedió con el auto antes de la importación
            - Inspección el mismo día de la solicitud, sin esperar la logística
        es:
          lead: Invierno suave y casi sin reactivos en las carreteras, por lo que el chasis de los autos españoles suele estar en mejor estado que el de los alemanes. Sin embargo, el sol y la cercanía del mar afectan la pintura, el plástico y todo lo de goma.
          points:
            - En la costa — buscamos corrosión primero en huecos ocultos
            - Barniz descolorido y plástico del interior agrietado — se considera en el precio
            - 'Muchos autos de alquiler: kilometraje uniforme, pero un uso severo'
            - Protocolo ITV, verificamos las observaciones y las fechas de las inspecciones
        ch:
          lead: 'Los coches suizos están notablemente mejor cuidados que el promedio europeo: el mantenimiento costoso lo asegura, y los kilometrajes son bajos. Pero Suiza no está en la UE, por lo que la importación se maneja de manera diferente, y lo consideramos en el presupuesto desde el principio.'
          points:
            - Equipos ricos, aquí se eligen más que en los países vecinos
            - MFK, la inspección es rigurosa, se prepara a fondo y se nota en el coche
            - 'No UE: la aduana y la documentación se gestionan de manera diferente a los países de la Unión Europea'
            - El precio es más alto que el mercado, pero ahorras después en reparaciones
        pt:
          lead: El mercado es pequeño, la selección es más limitada que en España, pero la competencia por un buen coche es menor. El clima es húmedo y salino, la corrosión marina se encuentra incluso en coches nuevos.
          points:
            - Humedad y mar, cavidades ocultas y la electricidad son prioritarias en la inspección
            - 'Mercado pequeño: se tarda más en buscar lo específico que en Alemania'
            - Protocolo IPO, revisamos las observaciones de inspecciones anteriores
            - Muchos diéseles y coches pequeños, las carrocerías grandes son raras
        fr:
          lead: Francia se caracteriza sobre todo por coches diésel y marcas propias. Peugeot, Renault y Citroën aquí son más baratos que en cualquier parte de Europa. El premium alemán, por el contrario, es más caro, por lo que no tiene mucho sentido comprarlo aquí.
          points:
            - Las marcas francesas ofrecen el mejor precio en Europa, y el mantenimiento es más barato
            - Diéseles, el filtro de partículas y la válvula EGR son temas a revisar especialmente
            - Contrôle technique, los protocolos son detallados, verificamos observaciones por año
            - 'Uso urbano: el desgaste de la tracción y la suspensión es más rápido de lo indicado'
        it:
          lead: 'El mercado italiano es bueno para coches pequeños y equipamientos raros, pero requiere precaución: aquí los coches son muy usados y las reparaciones de carrocería no siempre se hacen con cuidado.'
          points:
            - En la ciudad hay frecuentes golpes menores y pintadas, es obligatorio el medidor de grosor
            - El sur y la costa traen sal y corrosión, el norte está más cerca de las condiciones alemanas
            - Revisione, verificamos la regularidad, las omisiones son más comunes de lo habitual
            - Muchos coches con equipo a gas, los revisamos por separado
        pl:
          lead: 'El mercado más grande cercano a nosotros: la logística es barata y corta. Pero Polonia ha sido durante años el principal punto de transbordo para coches dañados de Europa Occidental, por lo que aquí verificamos la historia más rigurosamente que en cualquier otro lugar.'
          points:
            - Alta proporción de coches restaurados después de accidentes, la geometría de la carrocería es prioritaria
            - 'Frecuentes reventas: un coche puede cambiar de propietario varias veces al año'
            - El kilometraje a menudo se ajusta en la fase de importación, verificamos con bases de datos de servicio
            - Corta distancia de entrega, más barata y rápida que desde España o Portugal
      closing:
        eyebrow: ¿Por dónde empezamos?
        line1: Describe el coche que buscas,
        line2: —
        accentWord: el resto es nuestro trabajo
        text: Presupuesto, carrocería, caja, un par de deseos adicionales. Lo buscamos, y vosotros miráis los informes de las opciones y decidís cuál inspeccionar en persona.
    vehicle-buyback:
      hub:
        metaTitle: Compra de coches con matrículas rusas en Europa
        metaDescription: Compramos coches con matrículas rusas en cualquier país de Europa y coches con matrículas serbias en Serbia. Evaluación por foto en una hora, pago el día de la firma.
        title: Compra de coches
        titleHighlight: sin regateos por semanas
        description: 'Recogemos coches que es difícil vender por métodos ordinarios: matrículas rusas, importación caducada, documentos en disputa. El precio es más bajo que el del mercado, esto es lo que pagas por la rapidez y por encargarnos de todas las molestias de la venta.'
