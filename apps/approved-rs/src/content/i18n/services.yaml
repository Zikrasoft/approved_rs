          - title: Poseta stručnjaka na svakoj pro veri
            text: 'Mera debljine boje, skener blokova, dizalica gde je potrebna. Fotografije i video svih problematičnih mesta: vidite isto što i mi.'
          - title: Provera istorije i pravne ispravnosti
