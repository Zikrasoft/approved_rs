      deliveryLineFor: Dostavićemo automobil u bilo koji grad u zemlji. Ako je potrebno da se izveze u inostranstvo, preuzimamo izvoz i carinjenje — vozimo u {destinations} i u bilo koju drugu zemlju.
      deliveryDestinations:
