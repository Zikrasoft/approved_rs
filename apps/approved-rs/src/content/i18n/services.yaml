      descriptionSerbia: We buy vehicles with Russian plates below market price — the car can be in any European country. We also buy cars with Serbian plates in Serbia and Montenegro. Online evaluation, processing in 1 day, payment on the day of the deal.
      descriptionOtherFor: We buy vehicles with Russian plates below market price — the car can be in any European country, including {name}. Online evaluation, processing in 1 day, payment on the day of the deal.
      serbiaLinkLabel: Car with Serbian plates?
      step1: Send photos and a description of the vehicle
      step2: We assess online by photo in 1 hour — below market price
      step3Serbia: We meet for inspection — Russian plates (in any European country) or Serbian plates (Serbia, Montenegro)
      step3Other: We meet for inspection — Russian plates, car can be in any European country
      step4: We process the deal, payment on the day of signing
      closing:
        eyebrow: Want a quote?
        line1: Send us photos
        line2: and documents —
        accentWord: the price will be ready in an hour
        text: The evaluation is free and doesn’t obligate you in any way. If you're not satisfied with the price, we’ll part ways without pressure or follow-up calls.
    vehicle-import:
      hub:
        metaTitle: Car Import from Europe and China Turnkey
        metaDescription: We import cars from Germany, Spain, Switzerland, and China to any country — sourcing, inspection, delivery, and customs clearance all included.
        title: Car Import
        titleHighlight: from Europe and China
        description: The car is in Europe or China, and you are anywhere. We source, inspect, and deliver it to you turnkey, including customs clearance.
        breadcrumbLabel: Car Import
        casesHeading: Import Cases
        euCardTitle: From Europe
        euCardText: Spain, Switzerland, and other countries — sourcing and delivery to any location.
        chinaCardTitle: From China
        chinaCardText: New and used cars from China — delivery through a trusted partner.
        exploreLabel: Learn More
        ctaLabel: Calculate Import
        heroPhotoAlt: Car carrier loaded with vehicles
        processHeading: How Import Works
        processLead: Typically, it takes four to eight weeks from application to registration, with the journey being the shortest part. A car travels a few days from Germany to Belgrade, while customs clearance and registration take weeks.
        processSteps:
          - n: '01'
            text: We calculate the total cost before starting — vehicle, logistics, duties, documentation.
          - n: '02'
