      citiesHeadingFor: Gde gledamo automobile {countryLocation}
      citiesLead: Stručnjak izlazi širom zemlje, ali najčešće gledamo automobile tamo gde ih najviše izlažu. Evo šta to znači za svaki grad.
      alsoInLabel: 'Takođe biramo u:'
      crossSellLabel: Trebate automobil iz inostranstva?
      countryNotesHeadingFor: Šta uzimamo u obzir {location}
      countryNotesPointsLabel: Na šta prvo obraćamo pažnju
      countryNotes:
        de:
          lead: 'Ponuda je ovde veća nego na bilo kom drugom tržištu Evrope, a istorija održavanja obično se prati: većina automobila ima servisnu knjižicu sa potvrdama od servisera za svako održavanje. Negativna strana su visoki kilometraže.'
          points:
            - Servisna knjižica i potvrde servisa – proveravamo po VIN kodu kod zvaničnog servisa
            - Protokol HU, koji svi nazivaju TÜV, – čitamo beleške sa prethodnog pregleda, a ne samo pečat
            - 'Automobili iz lizinga i korporativnih flota: redovno održavani, ali sa visokim kilometražama'
            - Zimski putevi sa hemikalijama – gledamo donji deo i pragove posebno
        rs:
          lead: Ovde smo na terenu, tako da gledamo automobil na dan upita i bez uvoza. Tržište je malo, jedan te isti automobil često prođe kroz više prodavaca, i moramo raspetljati njegovu istoriju.
          points:
            - Automobil je već carinjen i ima domaće registarske tablice – takse i procedura uvoza nisu potrebne
            - Kilometraža se često menja prilikom preprodaje unutar zemlje – proveravamo sa evidencijama tehničkog pregleda
            - Mnogo automobila uvezenih iz Nemačke i Italije – proveravamo šta se dešavalo sa automobilom pre uvoza
            - Pregled na dan upita, bez čekanja na logistiku
        es:
          lead: Blaga zima i skoro da nema hemikalija na putevima, zato su donji delovi španskih automobila obično u znatno boljem stanju od nemačkih. Međutim, sunce i blizina mora loše deluju na boju, plastiku i gumu.
          points:
            - Obala – koroziju tražimo pre svega u skrivenim prostorima
            - Izgorela boja i napuknuti enterijer – uključujemo u cenu
            - 'Mnogo bivših rentakar automobila: redovna kilometraža, ali rigorozna eksploatacija'
            - Protokol ITV – proveravamo beleške i datume pregleda
        ch:
          lead: 'Švajcarski automobili su značajno bolje očuvani od proseka u Evropi: skupo održavanje dovodi do disciplina, a kilometraže su male. Međutim, Švajcarska nije u EU, pa se uvoz obavlja drugačije, što unapred uključujemo u budžet.'
          points:
            - Bogate opreme – ovde su ih uzimali više nego kod komšija
            - MFK – striktna prozivka, dobro se pripremaju za njega, i to se vidi na automobilu
            - 'Nije EU: carina i dokumentacija se ne tretiraju kao za zemlje Evropske unije'
            - Cene su više od tržišnih, ali ćete kasnije štedeti na popravkama
        pt:
          lead: Tržište je malo, izbor je skromniji nego u Španiji, ali je i konkurencija za dobre automobile manja. Klima je vlažna i slana – morska korozija se javlja i na svežim automobilima.
          points:
            - Vlažnost i more – skriveni prostori i elektrika su prioritet pregleda
            - 'Malo tržište: tražimo duže za konkretan zahtev nego u Nemačkoj'
            - Protokol IPO – čitamo beleške sa prethodnih pregleda
            - Mnogo dizel automobila i malih motora, veća karoserija se retko sreće
        fr:
          lead: Francuska je pre svega dizel i domaće marke. Peugeot, Renault i Citroën su ovde jeftiniji nego bilo gde u Evropi. Nemačke premijum marke su, s druge strane, skuplje i nema smisla uzimati ih ovde.
          points:
            - Francuske marke – najbolja cena u Evropi, a održavanje je jeftinije
            - Dizeli – proveravamo filter čestica i EGR ventil kao posebnu stavku
            - Contrôle technique – protokoli su detaljni, proveravamo beleške po godinama
            - 'Upravljačka eksploatacija: kvačilo i suspenzija se brže troše nego što se navodi'
        it:
          lead: 'Italijansko tržište je dobro za male automobile i retke opreme, ali zahteva oprez: automobili se ovde intenzivno koriste, a sitni popravci karoserije ne rade uvek pažljivo.'
          points:
            - Grad – česti sitni udarci i farbanja, debljinomer je obavezan
            - Jug i obala donose so i koroziju, sever bliže nemačkim uslovima
            - Revisione – proveravamo redovnost, propušteni termini se javljaju često
            - Mnogo automobila sa plinom – proveravamo posebno
        pl:
          lead: 'Najbliže veće tržište: logistika je jeftina i brza. Međutim, Poljska je godinama bila glavno prevozničko mesto za oštećene automobile iz Zapadne Evrope, pa ovde proveravamo istoriju rigoroznije nego bilo gde drugde.'
          points:
            - Visok udeo obnovljenih automobila nakon nesreća – geometrija karoserije je prioritet
            - 'Česte preprodaje: auto može promeniti nekoliko vlasnika u godini'
            - Kilometraža se često menja tokom uvoza – proveravamo sa servisnim bazama
            - Kratka putanja isporuke – jeftinija i brža nego iz Španije ili Portugala
      closing:
        eyebrow: Kako da počnemo?
        line1: Opisujte automobil
        line2: koji tražite, —
        accentWord: dalje je naš posao
        text: Budžet, karoserija, menjač, nekoliko želja. Mi tražimo, a vi gledate izveštaje o ponudama i odlučujete koji da pogledate uživo.
