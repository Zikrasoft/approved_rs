        processLead: Usualmente, desde la solicitud hasta la matriculación pasan de cuatro a ocho semanas, siendo el transporte la parte más corta de este periodo. Desde Alemania a Belgrado, el coche tarda varios días en llegar, mientras que el proceso de aduana y matriculación puede durar semanas.
        processSteps:
          - n: '01'
            text: Calculamos el costo total antes de empezar - coche, logística, aranceles, documentación
          - n: '02'
            text: Buscamos y verificamos el coche en el país de origen
          - n: '03'
            text: Compramos el coche a nuestra empresa europea, lo damos de baja y preparamos la documentación de exportación
