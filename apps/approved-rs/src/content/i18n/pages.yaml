      heading: Datenschutzrichtlinie
      lastUpdated: 'Letzte Aktualisierung: Juni 2026'
      sections:
        - title: Welche Daten wir sammeln
          text: Bei der Einreichung einer Anfrage sammeln wir den Namen und Kontaktinformationen (Telegram/Telefon), die Sie in das Formular eingeben. Wir protokollieren auch die Seite, von der die Anfrage gesendet wurde.
        - title: Wie wir die Daten verwenden
          text: Die Daten aus der Anfrage werden nur zur Rückmeldung verwendet. Wir geben die Anfrage nicht an Dritte weiter und verwenden sie nicht für Werbung. Unabhängig von den Anfragen arbeiten Web-Analysen — Google und Yandex erhalten anonymisierte Daten über Seitenaufrufe.
        - title: Datenspeicherung
          text: Anfragen werden in einem geschützten Cloud-Speicher Vercel Blob aufbewahrt; der Zugriff darauf ist nur unserem Team gestattet. Sie können jederzeit die Löschung Ihrer Daten anfordern, indem Sie uns über Telegram kontaktieren.
        - title: Cookies
          text: Die Webseite verwendet technische Cookies, ohne die sie nicht funktioniert, sowie analytische Cookies. Im Banner am unteren Bildschirmrand können Sie ablehnen; die Auswahl wird im Browser gespeichert. Yandex.Metrica zeichnet Sitzungen auf (Mausbewegungen, Scrollen und Klicks). Das Antragsformular haben wir aus den Aufzeichnungen ausgeschlossen, dessen Inhalt gelangt nicht dorthin. Wenn Sie über Werbung zu uns gekommen sind und keine Zustimmung zur Analyse gegeben haben, speichert die Webseite dies — die Quelle und die Kampagne — für 30 Tage, damit wir sehen, welche Werbung Anfragen generiert.
      contactTitle: Kontakt
      contactBefore: 'Bei Fragen zur Datenschutzrichtlinie kontaktieren Sie uns bitte über '
      contactLinkText: Telegram
