      metaTitle: Datenschutzerklärung
      metaDescription: 'Datenschutzerklärung von {siteName}: Welche Daten wir erheben und verwenden und wie Sie deren Löschung beantragen können.'
      heading: Datenschutzerklärung
      lastUpdated: 'Zuletzt aktualisiert: November 2026'
      sections:
        - title: Welche Daten wir erheben
          text: Wenn Sie eine Anfrage senden, erfassen wir Ihren Namen und die Kontaktdaten (Telegram/Telefon), die Sie ins Formular eingeben. Außerdem speichern wir die Seite, von der aus die Anfrage gesendet wurde.
        - title: Wie wir Daten verwenden
          text: 'Die Daten aus Ihrer Anfrage verwenden wir ausschließlich, um uns dazu bei Ihnen zurückzumelden. Wir geben Anfragen nicht an Dritte weiter und nutzen sie nicht für Werbung. Unabhängig davon läuft eine Webanalyse: Google und Yandex erhalten anonymisierte Daten zu Seitenaufrufen.'
        - title: Datenspeicherung
          text: Anfragen werden im geschützten Cloud-Speicher Vercel Blob gespeichert. Nur unser Team hat Zugriff darauf. Sie können jederzeit die Löschung Ihrer Daten beantragen, indem Sie uns auf Telegram schreiben.
        - title: Cookies
          text: Die Website verwendet technische Cookies, ohne die sie nicht funktioniert, sowie Analyse-Cookies. Sie können diese über den Link "Cookie-Einstellungen" unten auf der Website ablehnen. Ihre Auswahl wird im Browser gespeichert. Yandex.Metrica zeichnet Sitzungen auf, darunter Mausbewegungen, Scrollen und Klicks. Das Anfrageformular haben wir von der Aufzeichnung ausgeschlossen, seine Inhalte werden nicht erfasst. Wenn Sie über eine Anzeige auf die Website gelangt sind und der Analyse nicht widersprochen haben, speichert die Website diese Information (Quelle und Kampagne) 30 Tage lang, damit wir sehen können, welche Werbung zu Anfragen führt. Solange Sie nicht widersprochen haben, speichert die Website eine zufällige, anonyme Browser-ID im Browserspeicher und in unserem eigenen Cookie visitor_id, damit der Klick auf einen Messenger und eine Anfrage desselben Besuchers nicht als separate Einträge erfasst werden. Nach Ihrem Widerspruch werden die ID und das Cookie gelöscht.
