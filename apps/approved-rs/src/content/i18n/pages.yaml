      metaTitle: Política de privacidad
      metaDescription: 'Política de privacidad y procesamiento de datos personales del sitio {siteName}: qué datos recopilamos, cómo los usamos y cómo solicitar su eliminación.'
      heading: Política de privacidad
      lastUpdated: 'Última actualización: junio 2026'
      sections:
        - title: Qué datos recopilamos
          text: Al enviar una solicitud, recopilamos el nombre y los datos de contacto (Telegram/teléfono) que introduces en el formulario. También registramos la página desde la que se envió la solicitud.
        - title: Cómo usamos los datos
          text: 'Los datos de la solicitud se utilizan solo para la retroalimentación relacionada con ella. No compartimos las solicitudes con terceros ni las usamos para publicidad. La analítica web funciona de forma separada: Google y Yandex obtienen datos anónimos sobre la visualización de páginas.'
        - title: Almacenamiento de datos
          text: Las solicitudes se almacenan en un espacio de almacenamiento en la nube protegido de Vercel Blob; el acceso es solo para nuestro equipo. Puedes solicitar la eliminación de tus datos en cualquier momento, escribiéndonos por Telegram.
        - title: Cookies
          text: 'El sitio utiliza cookies técnicas, sin las cuales no funciona, y analíticas. Puedes rechazar en el banner en la parte inferior de la pantalla; la selección se guarda en el navegador. Yandex.Metrica registra sesiones (movimiento del cursor, desplazamiento y clics). Hemos excluido el formulario de la grabación, su contenido no aparece allí. Si llegaste a través de publicidad y no rechazas la analítica, el sitio recuerda esto: la fuente y la campaña, durante 30 días, para que veamos qué publicidad genera solicitudes.'
