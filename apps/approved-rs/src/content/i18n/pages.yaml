  emptyState: Кейсы скоро появятся.
  tabIntros:
    vehicle-sourcing: >-
      Каждая машина в этом списке прошла осмотр до покупки. Варианты, которые мы забраковали по дороге к ним, сюда не попали.
    vehicle-buyback: >-
      Машины, которые сложно продать обычным путём: русские номера, просроченный ввоз, спорные документы. Владелец получал деньги в день сделки, а все хлопоты по дальнейшей судьбе автомобиля брали на себя мы.
    vehicle-inspection: >-
      Клиент нашёл машину сам, мы съездили и посмотрели. Часть этих историй закончилась покупкой, часть — отказом, и отказ мы считаем таким же результатом.
    vehicle-import: >-
      Привоз из Европы и Китая под ключ: от поиска в стране отправления до номеров. В стоимость этих кейсов входит всё — машина, логистика, пошлины и оформление.
  closingHeading: Похожая задача?
  closingLine1: Расскажите,
  closingLine2: что ищете, —
  closingLine3: подберём и вам
  closingText: >-
    Достаточно марки, бюджета и пары пожеланий сверху. Ответим в течение двух часов и скажем честно, реально ли это за такие деньги.
