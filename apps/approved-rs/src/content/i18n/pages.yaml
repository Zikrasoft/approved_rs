      heading: Privacy Policy
      lastUpdated: 'Last updated: June 2026'
      sections:
        - title: What data we collect
          text: When submitting a request, we collect your name and contact information (Telegram/phone) entered in the form. We also log the page from which the request was sent.
        - title: How we use data
          text: 'The data from the request is used only for feedback regarding it. We do not share requests with third parties and do not use them for advertising. Web analytics operates separately from requests: Google and Yandex receive anonymized data on page views.'
        - title: Data storage
          text: Requests are stored in a secure Vercel Blob cloud storage; only our team has access. You can request the deletion of your data at any time by writing to us on Telegram.
        - title: Cookies
          text: The site uses technical cookies, without which it does not function, and analytics. You can decline this in the banner at the bottom of the screen; your choice is saved in the browser. Yandex.Metrica records sessions (cursor movement, scrolling, and clicks). We excluded the request form from the recording, its content is not captured. If you arrived through advertising and did not decline analytics, the site remembers this (source and campaign) for 30 days, so we can see which ads lead to requests.
