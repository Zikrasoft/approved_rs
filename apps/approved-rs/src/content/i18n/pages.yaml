privacy:
  metaTitle: Политика конфиденциальности
  metaDescription: 'Политика конфиденциальности и обработки персональных данных сайта {siteName}: какие данные мы собираем, как их используем и как запросить удаление.'
  heading: Политика конфиденциальности
  lastUpdated: 'Последнее обновление: июнь 2026'
  sections:
    - title: Какие данные мы собираем
      text: При отправке заявки мы собираем имя и контактные данные (Telegram/телефон), которые вы вводите в форму. Мы также фиксируем страницу, с которой отправлена заявка.
    - title: Как мы используем данные
      text: Данные из заявки используются только для обратной связи по ней. Заявку мы не передаём третьим лицам и не используем для рекламы. Отдельно от заявок работает веб-аналитика — Google и Яндекс получают обезличенные данные о просмотре страниц.
    - title: Хранение данных
      text: Заявки хранятся в защищённом облачном хранилище Vercel Blob; доступ к ним есть только у нашей команды. Вы можете запросить удаление ваших данных в любое время, написав нам в Telegram.
    - title: Cookies
      text: Сайт использует технические cookies, без которых он не работает, и аналитические. В баннере внизу экрана можно отказаться; выбор сохраняется в браузере. Метрика записывает сессии — движение курсора, прокрутку и клики. Форма заявки из записи исключена — имя, телефон, ник и комментарий в неё не попадают. Если вы пришли по рекламе и не отказались от аналитики, сайт запоминает это — источник и кампанию — на 30 дней, чтобы мы видели, какая реклама приводит заявки.
  contactTitle: Контакт
  contactBefore: 'По вопросам конфиденциальности обратитесь к нам через '
  contactLinkText: Telegram
