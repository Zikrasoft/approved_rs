      metaTitle: Privacy Policy
      metaDescription: 'Privacy policy and processing of personal data on {siteName}: what data we collect, how we use it, and how to request deletion.'
      heading: Privacy Policy
      lastUpdated: 'Last updated: June 2026'
      sections:
        - title: What Data We Collect
          text: When you submit a request, we collect your name and contact details (Telegram/phone), which you enter in the form. We also log the page from which the request was sent.
        - title: How We Use Data
          text: Request data is used solely for feedback regarding that request. We do not share requests with third parties or use them for advertising. Web analytics operates separately — Google and Yandex receive anonymized data about page views.
        - title: Data Storage
          text: Requests are stored in a secure Vercel Blob cloud storage; only our team has access to them. You can request the deletion of your data at any time by messaging us on Telegram.
        - title: Cookies
          text: The site uses technical cookies that are essential for its operation, as well as analytical cookies. You can opt-out via the banner at the bottom of the screen; your choice will be saved in your browser. Yandex.Metrica logs sessions (cursor movement, scrolling, and clicks). We excluded the request form from the logs, so its contents do not appear. If you arrived via advertising and did not opt-out of analytics, the site remembers this — the source and campaign — for 30 days so that we can see which ads yield requests.
