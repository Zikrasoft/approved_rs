        - title: Qué datos recopilamos
          text: Al enviar una solicitud, recopilamos tu nombre y datos de contacto (Telegram/teléfono) que introduces en el formulario. También registramos la página desde la que se envió la solicitud.
        - title: Cómo usamos los datos
          text: 'Los datos de la solicitud se utilizan únicamente para dar seguimiento a la misma. No compartimos la solicitud con terceros ni la utilizamos con fines publicitarios. Aparte de las solicitudes, contamos con análisis web: Google recibe datos anonimizados sobre la visualización de páginas.'
        - title: Almacenamiento de datos
          text: Las solicitudes se almacenan en un almacenamiento en la nube seguro de Vercel Blob; solo nuestro equipo tiene acceso. Puedes solicitar la eliminación de tus datos en cualquier momento escribiéndonos por Telegram.
        - title: Cookies
          text: 'El sitio utiliza cookies técnicas, sin las cuales no funcionaría, y cookies analíticas. Se puede optar por no participar a través del banner en la parte inferior de la pantalla; la elección se guarda en el navegador. Si llegaste a través de un anuncio y no rechazaste el análisis, el sitio recuerda esto: la fuente y la campaña, por 30 días, para que podamos ver qué publicidad genera solicitudes.'
