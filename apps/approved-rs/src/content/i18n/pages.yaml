        vehicle-import: 'Importación de Europa y China llave en mano: desde la búsqueda en el país de origen hasta la matriculación. El precio final de cada transacción incluye todo: vehículo, logística, impuestos y tramitación.'
      closingHeading: ¿Tienes una tarea similar?
      closingLine1: Cuéntanos,
      closingLine2: qué estás buscando —
      closingLine3: te ayudaremos también
      closingText: Solo necesitamos la marca, el presupuesto y un par de deseos adicionales. Responderemos en un plazo de dos horas y te diremos honestamente si es posible por ese precio.
