      metaTitle: Privacy Policy
      metaDescription: 'Privacy and personal data policy for {siteName}: what data we collect, how we use it and how to request its deletion.'
      heading: Privacy Policy
      lastUpdated: 'Last updated: November 2026'
      sections:
        - title: What data we collect
          text: When you submit a request, we collect the name and contact details (Telegram/phone) you enter in the form. We also record the page you submitted the request from.
        - title: How we use your data
          text: "We use data from your request only to respond to it. We don't share requests with third parties or use them for advertising. Web analytics operates separately: Google and Yandex receive anonymized data about page views."
        - title: Data storage
          text: Requests are stored in Vercel Blob's secure cloud storage and are accessible only to our team. You can request deletion of your data at any time by messaging us on Telegram.
        - title: Cookies
          text: The site uses essential cookies required for it to work, as well as analytics cookies. You can opt out using the "Cookie settings" link at the bottom of the site; your choice is saved in your browser. Yandex Metrica records sessions, including cursor movements, scrolling and clicks. We exclude the enquiry form from recordings, so its contents are not captured. If you arrived via an ad and have not opted out of analytics, the site remembers this information (the source and campaign) for 30 days so we can see which ads generate enquiries. Until you opt out, the site stores a random anonymous browser ID in your browser's memory and in our own visitor_id cookie, so that clicking a messenger link and submitting an enquiry by the same visitor are not treated as separate records. After you opt out, the ID and cookie are deleted.
