      metaDescription: 'Datenschutzrichtlinie und Verarbeitung persönlicher Daten auf der Website {siteName}: welche Daten wir sammeln, wie wir sie verwenden und wie Sie deren Löschung anfordern können.'
      heading: Datenschutzrichtlinie
      lastUpdated: 'Letzte Aktualisierung: Juni 2026'
      sections:
        - title: Welche Daten wir sammeln
          text: Bei der Anfrage erfassen wir Ihren Namen und Ihre Kontaktdaten (Telegram/Telefon), die Sie im Formular eingeben. Wir protokollieren auch die Seite, von der die Anfrage gesendet wurde.
        - title: Wie wir die Daten verwenden
          text: Die Daten aus der Anfrage werden nur zur Kontaktaufnahme verwendet. Wir geben die Anfrage nicht an Dritte weiter und nutzen sie nicht für Werbung. Separat von Anfragen arbeitet die Webanalyse — Google und Yandex erhalten anonymisierte Daten über Seitenaufrufe.
        - title: Speicherung der Daten
          text: Anfragen werden in einem geschützten Cloud-Speicher Vercel Blob gespeichert; der Zugriff darauf haben nur unsere Teammitglieder. Sie können jederzeit die Löschung Ihrer Daten anfordern, indem Sie uns über Telegram kontaktieren.
        - title: Cookies
          text: Die Website verwendet technische Cookies, ohne die sie nicht funktioniert, sowie analytische Cookies. Im Banner am unteren Bildschirmrand können Sie ablehnen; Ihre Auswahl wird im Browser gespeichert. Yandex.Metrica zeichnet Sessions auf (Mausbewegungen, Scrollen und Klicks). Das Anfrageformular haben wir von dieser Aufzeichnung ausgeschlossen, sein Inhalt gelangt dort nicht hin. Wenn Sie über Werbung kamen und der Analyse nicht widersprochen haben, speichert die Website dies — Quelle und Kampagne — für 30 Tage, damit wir sehen, welche Werbung Anfragen generiert.
      contactTitle: Kontakt
      contactBefore: 'Bei Fragen zur Privatsphäre kontaktieren Sie uns bitte über '
      contactLinkText: Telegram
