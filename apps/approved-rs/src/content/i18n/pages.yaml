      heading: Datenschutzrichtlinie
      lastUpdated: 'Letzte Aktualisierung: Juni 2026'
      sections:
        - title: Welche Daten wir sammeln
          text: Bei der Anfrage sammeln wir Ihren Namen und Kontaktdaten (Telegram/Telefon), die Sie im Formular eingeben. Wir speichern auch die Seite, von der die Anfrage gesendet wurde.
        - title: Wie wir die Daten verwenden
          text: Die Daten aus der Anfrage werden nur zur Rückmeldung verwendet. Anfragen werden nicht an Dritte weitergegeben und nicht für Werbung genutzt. Unabhängig von den Anfragen erfolgt die Webanalyse — Google und Yandex erhalten anonymisierte Daten über die Seitenansichten.
        - title: Datenaufbewahrung
          text: Anfragen werden in einem gesicherten Cloud-Speicher von Vercel Blob aufbewahrt; nur unser Team hat Zugriff darauf. Sie können jederzeit die Löschung Ihrer Daten anfordern, indem Sie uns über Telegram kontaktieren.
        - title: Cookies
          text: Die Website verwendet technische Cookies, ohne die sie nicht funktioniert, und analytische — Google Analytics und Yandex.Metrik. Die Analyse wird beim ersten Laden der Seite aktiviert. Im Banner am unteren Bildschirmrand können Sie ablehnen, und dann wird sie beim nächsten Laden nicht mehr aktiviert; die Auswahl wird im Browser gespeichert. Yandex.Metrika zeichnet die Sitzungen auf — Mausbewegungen, Scrollen und Klicks. Das Antragsformular wird aus der Aufzeichnung ausgeschlossen — Name, Telefon, Nick und Kommentar gelangen nicht hinein.
