        - title: Cookies
          text: Sajt koristi tehničke cookies, bez kojih ne radi, i analitičke. U baneru na dnu ekrana možete se odjaviti; izbor se čuva u pregledaču. Yandex.Metrika beleži sesije (pokret miša, skrolovanje i klikove). Formu zahteva smo iz evidencije isključili, njen sadržaj ne ulazi u analizu. Ako ste došli putem reklame i niste se odjavili od analitike, sajt pamti to — izvor i kampanju — na 30 dana, kako bismo videli koja reklama donosi zahteve.
