        vehicle-buyback: 'Autos que son difíciles de vender por métodos convencionales: matrículas rusas, importación caducada, documentación en disputa. El propietario recibió el dinero el día de la transacción, y nosotros nos encargamos de todos los problemas relacionados con el futuro del vehículo.'
        vehicle-inspection: El cliente encontró el auto por su cuenta, nosotros fuimos a revisarlo. Algunas de estas historias terminaron en compra, otras en negativa, y consideramos la negativa como un resultado válido.
        vehicle-import: 'Importación desde Europa y China llave en mano: desde la búsqueda en el país de origen hasta las placas. El costo de estos casos incluye todo: auto, logística, aranceles y trámites.'
      closingHeading: ¿Tienes una tarea similar?
      closingLine1: Cuéntanos,
      closingLine2: qué buscas, —
      closingLine3: te ayudaremos también
      closingText: Solo necesitamos la marca, presupuesto y un par de deseos adicionales. Responderemos en un plazo de dos horas y te diremos honestamente si es posible por este precio.
