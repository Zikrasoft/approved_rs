      metaTitle: Privacy Policy
      metaDescription: 'Privacy policy and personal data processing for {siteName}: what data we collect, how we use it, and how to request deletion.'
      heading: Privacy Policy
      lastUpdated: 'Last updated: June 2026'
      sections:
        - title: What data we collect
          text: When submitting a request, we collect your name and contact information (Telegram/phone) entered in the form. We also log the page from which the request was sent.
        - title: How we use data
          text: Data from requests is used solely for follow-up communication. We do not share requests with third parties or use them for advertising. Web analytics operates separately - Google and Yandex receive anonymized data about page views.
        - title: Data storage
          text: Requests are stored in a secure Vercel Blob cloud storage; access is limited to our team. You may request deletion of your data anytime by messaging us on Telegram.
        - title: Cookies
          text: The site uses technical cookies necessary for its operation and analytic cookies. You can opt out using the banner at the bottom of the screen; the choice is stored in the browser. Metrics record sessions - cursor movement, scrolling, and clicks. The request form is excluded from the recordings – name, phone, nickname, and comments do not appear. If you arrived via an ad and did not opt out of analytics, the site remembers this - the source and campaign - for 30 days, allowing us to see which ads generate requests.
