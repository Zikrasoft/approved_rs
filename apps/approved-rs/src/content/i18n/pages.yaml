        - title: Cookies
          text: Sajt koristi tehničke kolačiće, bez kojih ne može da radi, kao i analitičke kolačiće. Možete ih odbiti putem linka "Podešavanja kolačića" pri dnu sajta; vaš izbor se čuva u pregledaču. Yandex Metrica snima sesije (kretanje kursora, pomeranje stranice i klikove). Obrazac za upit izuzeli smo iz snimanja, tako da se njegov sadržaj ne beleži. Ako ste došli preko oglasa i niste odbili analitiku, sajt pamti izvor i kampanju 30 dana, kako bismo videli koji oglasi donose upite. Dok ne odbijete analitiku, sajt čuva nasumični anonimni identifikator pregledača u memoriji pregledača i u našem kolačiću visitor_id, kako se klik na dugme za slanje poruke i upit istog posetioca ne bi prikazali kao zasebni zapisi. Nakon odbijanja, identifikator i kolačić se brišu.
