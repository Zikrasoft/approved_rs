    privacy:
      metaTitle: Privacy Policy
      metaDescription: 'Privacy policy and personal data handling on {siteName}: what data we collect, how we use it, and how to request deletion.'
      heading: Privacy Policy
      lastUpdated: 'Last updated: June 2026'
      sections:
        - title: What Data We Collect
          text: When submitting a request, we collect your name and contact details (Telegram/phone) that you enter in the form. We also log the page from which the request was sent.
        - title: How We Use Data
          text: The data from the request is used solely for feedback regarding it. We do not share requests with third parties or use them for advertising. Separately, web analytics operate — Google and Yandex receive anonymized data on page views.
        - title: Data Storage
          text: Requests are stored in a secure cloud storage system, Vercel Blob; access is limited to our team. You can request deletion of your data anytime by contacting us on Telegram.
        - title: Cookies
          text: The site uses technical cookies, without which it doesn't work, and analytical cookies from Google Analytics and Yandex.Metrica. Analytics is initiated on the first page load. In the banner at the bottom of the screen, you can opt-out, and it won’t be activated on subsequent loads; your choice is saved in the browser. Yandex.Metrica records sessions — cursor movements, scrolling, and clicks. The request form is excluded from recording — name, phone, nickname, and comments are not captured.
