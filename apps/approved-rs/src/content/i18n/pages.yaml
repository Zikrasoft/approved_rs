      heading: Privacy Policy
      lastUpdated: 'Last updated: June 2026'
      sections:
        - title: What data we collect
          text: When you submit an enquiry, we collect the name and contact details (Telegram/phone number) you enter in the form. We also record which page the enquiry was submitted from.
        - title: How we use your data
          text: 'We use the details in your enquiry only to respond to it. We do not share your enquiry with third parties or use it for advertising. Website analytics operates separately from enquiries: Google and Yandex receive anonymised page-view data.'
        - title: Data storage
          text: Enquiries are stored securely in Vercel Blob cloud storage, with access restricted to our team. You can request deletion of your data at any time by messaging us on Telegram.
        - title: Cookies
          text: The website uses essential cookies that it needs to function, as well as analytics cookies. You can decline analytics cookies in the banner at the bottom of the screen; your choice is saved in your browser. Yandex Metrica records sessions, including cursor movements, scrolling and clicks. We have excluded the enquiry form from these recordings, so its contents are not captured. If you arrive through an ad and have not declined analytics, the website remembers the ad source and campaign for 30 days so we can see which ads generate enquiries.
