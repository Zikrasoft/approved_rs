      metaDescription: 'Datenschutzrichtlinie und Verarbeitung personenbezogener Daten der Website {siteName}: welche Daten wir sammeln, wie wir sie nutzen und wie Sie die Löschung anfordern können.'
      heading: Datenschutzrichtlinie
      lastUpdated: 'Letzte Aktualisierung: Juni 2026'
      sections:
        - title: Welche Daten sammeln wir
          text: Bei der Anfrage sammeln wir den Namen und die Kontaktdaten (Telegram/Telefon), die Sie in das Formular eingeben. Wir protokollieren auch die Seite, von der die Anfrage gesendet wurde.
        - title: Wie wir Daten verwenden
          text: Daten aus Anfragen werden nur für die Rückmeldung verwendet. Die Anfragen werden nicht an Dritte weitergegeben und nicht für Werbung genutzt. Die Webanalyse funktioniert unabhängig von Anfragen — Google und Yandex erhalten anonymisierte Daten über Seitenaufrufe.
        - title: Speicherung der Daten
          text: Anfragen werden in einem sicheren Cloud-Speicher (Vercel Blob) aufbewahrt; nur unser Team hat Zugang. Sie können jederzeit die Löschung Ihrer Daten anfordern, indem Sie uns über Telegram kontaktieren.
        - title: Cookies
          text: Die Website verwendet technische Cookies, ohne die sie nicht funktioniert, sowie analytische Cookies. Im Banner am unteren Bildschirmrand können Sie dies ablehnen; die Auswahl wird im Browser gespeichert. Die Metrik erfasst Sitzungen — Mausbewegungen, Scrollverhalten und Klicks. Die Anfrageformulare sind von dieser Aufzeichnung ausgeschlossen — Name, Telefon, Nickname und Kommentar gelangen nicht hinein. Wenn Sie über Werbung gekommen sind und die Analyse nicht abgelehnt haben, merkt sich die Website das — Quelle und Kampagne — für 30 Tage, damit wir sehen, welche Werbung Anfragen generiert.
