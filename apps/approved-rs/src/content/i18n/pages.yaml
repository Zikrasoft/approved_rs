          text: The website uses technical cookies essential for its operation and analytical cookies. You can opt out via the banner at the bottom of the screen; the choice is saved in your browser. If you arrived via an ad and did not opt out of analytics, the site remembers this — the source and campaign — for 30 days to show us which ads generate requests.
