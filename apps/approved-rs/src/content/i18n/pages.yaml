      heading: Datenschutzrichtlinie
      lastUpdated: 'Letzte Aktualisierung: Juni 2026'
      sections:
        - title: Welche Daten wir sammeln
          text: Bei der Anfrage sammeln wir den Namen und die Kontaktdaten (Telegram/Telefon), die Sie in das Formular eingeben. Wir protokollieren auch die Seite, von der die Anfrage gesendet wurde.
        - title: Wie wir die Daten verwenden
          text: Die Daten aus der Anfrage werden nur zur Rückmeldung verwendet. Wir geben die Anfrage nicht an Dritte weiter und nutzen sie nicht für Werbung. Unabhängig von den Anfragen erfolgt die Web-Analyse — Google und Yandex erhalten anonymisierte Daten über Seitenaufrufe.
        - title: Datenspeicherung
          text: Anfragen werden in einem geschützten Cloud-Speicher Vercel Blob aufbewahrt; auf sie hat nur unser Team Zugriff. Sie können jederzeit die Löschung Ihrer Daten anfordern, indem Sie uns über Telegram kontaktieren.
        - title: Cookies
          text: Die Website verwendet technische Cookies, ohne die sie nicht funktioniert, sowie analytische. Im Banner am unteren Bildschirmrand können Sie zustimmen oder ablehnen; die Auswahl wird im Browser gespeichert. Die Analytics registriert Sitzungen — Mausbewegungen, Scrollen und Klicks. Das Anfrageformular ist von diesen Aufzeichnungen ausgeschlossen — Name, Telefon, Nickname und Kommentar gelangen nicht hinein. Wenn Sie über Werbung gekommen sind und auf Analytics nicht verzichten, speichert die Website dies — Quelle und Kampagne — für 30 Tage, damit wir sehen können, welche Werbung Anfragen generiert.
