      heading: Privacy Policy
      lastUpdated: 'Last updated: June 2026'
      sections:
        - title: What Data We Collect
          text: When you submit a request, we collect your name and contact information (Telegram/phone) that you enter in the form. We also log the page from which the request was submitted.
        - title: How We Use Your Data
          text: Data from the request is used solely for follow-up. We do not share requests with third parties or use them for advertising. Web analytics operates separately — Google and Yandex receive anonymized data about page views.
        - title: Data Storage
          text: Requests are stored in a secure cloud storage Vercel Blob; access is limited to our team. You can request the deletion of your data at any time by messaging us on Telegram.
        - title: Cookies
          text: The website uses technical cookies that are necessary for its operation, along with analytics cookies. You can opt out through the banner at the bottom of the screen; the choice is saved in the browser. Metrics track sessions — mouse movements, scrolls, and clicks. The request form is excluded from the recording — name, phone, nickname, and comments do not get logged. If you accessed us through an ad and did not opt out of analytics, the site remembers this — source and campaign — for 30 days so we can see which ads lead to requests.
