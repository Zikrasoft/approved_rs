      metaTitle: Datenschutzrichtlinie
      metaDescription: 'Datenschutzrichtlinie und Verarbeitung der personenbezogenen Daten der Website {siteName}: welche Daten wir sammeln, wie wir sie nutzen und wie Sie deren Löschung anfordern können.'
      heading: Datenschutzrichtlinie
      lastUpdated: 'Letzte Aktualisierung: Juni 2026'
      sections:
        - title: Welche Daten wir sammeln
          text: Bei der Anfrage sammeln wir den Namen und die Kontaktdaten (Telegram/Telefon), die Sie in das Formular eingeben. Wir protokollieren auch die Seite, von der die Anfrage gesendet wurde.
        - title: Wie wir die Daten verwenden
          text: Die Daten aus der Anfrage werden ausschließlich für die Rückmeldung dazu verwendet. Wir geben die Anfrage nicht an Dritte weiter und verwenden sie nicht für Werbung. Unabhängig von den Anfragen läuft die Web-Analyse - Google erhält anonymisierte Daten zu den Seitenaufrufen.
        - title: Datenspeicherung
          text: Anfragen werden in einem geschützten Cloud-Speicher Vercel Blob aufbewahrt; auf sie hat nur unser Team Zugriff. Sie können jederzeit die Löschung Ihrer Daten anfordern, indem Sie uns über Telegram kontaktieren.
        - title: Cookies
          text: Die Website verwendet technische Cookies, ohne die sie nicht funktioniert, sowie analytische Cookies. Im Banner am unteren Bildschirmrand kann man ablehnen; die Auswahl wird im Browser gespeichert. Wenn Sie über Werbung auf die Seite gekommen sind und die Analyse nicht abgelehnt haben, speichert die Seite dies - die Quelle und die Kampagne - für 30 Tage, damit wir sehen, welche Werbung Anfragen generiert.
      contactTitle: Kontakt
      contactBefore: 'Bei Fragen zur Privatsphäre kontaktieren Sie uns über '
      contactLinkText: Telegram
