        vehicle-sourcing: Cada coche en esta lista ha sido inspeccionado antes de la compra. Las opciones que descalificamos en el camino no están incluidas.
        vehicle-buyback: 'Coches difíciles de vender por métodos habituales: matrículas rusas, importación tardía, documentos discutibles. El propietario recibió el pago el día del trato, y todos los problemas sobre el futuro del coche fueron asumidos por nosotros.'
        vehicle-inspection: El cliente encontró el coche por su cuenta, nosotros fuimos y lo revisamos. Algunas de estas historias terminaron en la compra, otras en rechazo, y consideramos el rechazo también como un resultado.
        vehicle-import: 'Importación de coches de Europa y China a medida: desde la búsqueda en el país de origen hasta la matriculación. El precio final de cada operación incluye todo: vehículo, logística, aranceles y trámite.'
      closingHeading: ¿Una tarea similar?
      closingLine1: Cuéntanos,
      closingLine2: qué estás buscando, —
      closingLine3: seleccionaremos uno para ti
      closingText: Solo necesitamos la marca, el presupuesto y un par de deseos adicionales. Responderemos en dos horas y te diremos honestamente si es posible por ese dinero.
