privacy:
  metaTitle: Политика конфиденциальности
  metaDescription: 'Политика конфиденциальности и обработки персональных данных сайта {siteName}: какие данные мы собираем, как их используем и как запросить удаление.'
  heading: Политика конфиденциальности
  lastUpdated: 'Последнее обновление: июнь 2026'
  sections:
    - title: Какие данные мы собираем
      text: При отправке заявки мы собираем имя и контактные данные (Telegram/телефон), которые вы вводите в форму. Мы также фиксируем страницу, с которой отправлена заявка.
    - title: Как мы используем данные
      text: Собранные данные используются исключительно для обратной связи по вашей заявке. Мы не передаём данные третьим лицам и не используем их для рекламы.
    - title: Хранение данных
      text: Заявки хранятся в защищённом облачном хранилище Vercel Blob; доступ к ним есть только у нашей команды. Вы можете запросить удаление ваших данных в любое время, написав нам в Telegram.
    - title: Cookies
      text: Сайт использует технические cookies, необходимые для работы сайта, а также аналитические cookies Google Analytics и Яндекс.Метрики — но только после вашего согласия. При первом визите вы можете принять или отклонить использование аналитических cookies в баннере внизу экрана; ваш выбор сохраняется в браузере.
