        - title: Cookies
          text: Sajt koristi tehničke kolačiće, bez kojih ne funkcioniše, i analitičke. U baneru na dnu ekrana možete se odjaviti; izbor se čuva u pretraživaču. Yandex.Metrika beleži sesije (pokret kursora, skrolovanje i klikove). Formu zahteva smo isključili iz beleženja, njen sadržaj se tamo ne pojavljuje. Ako ste došli putem reklame i niste se odjavili od analitike, sajt pamti to — izvor i kampanju — na 30 dana, kako bismo videli koja reklama donosi zahteve.
