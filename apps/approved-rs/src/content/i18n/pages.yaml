    privacy:
      metaTitle: Política de privacidad
      metaDescription: 'Política de privacidad de {siteName}: qué datos personales recogemos, cómo los utilizamos y cómo solicitar su eliminación.'
      heading: Política de privacidad
      lastUpdated: 'Última actualización: junio de 2026'
      sections:
        - title: Qué datos recogemos
          text: Al enviar una solicitud, recogemos el nombre y los datos de contacto (Telegram/teléfono) que introduces en el formulario. También registramos la página desde la que se envía la solicitud.
        - title: Cómo utilizamos los datos
          text: 'Utilizamos los datos de la solicitud únicamente para responder a ella. No compartimos tu solicitud con terceros ni la usamos con fines publicitarios. La analítica web funciona de forma independiente: Google y Yandex reciben datos anonimizados sobre las visitas a las páginas.'
        - title: Almacenamiento de los datos
          text: Las solicitudes se guardan en Vercel Blob, un servicio de almacenamiento seguro en la nube al que solo tiene acceso nuestro equipo. Puedes solicitar la eliminación de tus datos en cualquier momento escribiéndonos por Telegram.
        - title: Cookies
          text: La web utiliza cookies técnicas, necesarias para su funcionamiento, y cookies analíticas. Puedes rechazar las analíticas en el aviso de la parte inferior de la pantalla; tu elección se guarda en el navegador. Yandex Metrica graba las sesiones (movimientos del cursor, desplazamientos y clics). Hemos excluido el formulario de solicitud de estas grabaciones, por lo que su contenido no se registra. Si llegas a través de un anuncio y no rechazas la analítica, la web guarda esa información (origen y campaña) durante 30 días para que podamos saber qué anuncios generan solicitudes.
