      metaTitle: Privacy Policy
      metaDescription: 'Privacy policy and personal data processing for {siteName}: what data we collect, how we use it, and how to request deletion.'
      heading: Privacy Policy
      lastUpdated: 'Last updated: June 2026'
      sections:
        - title: What data we collect
          text: When submitting a request, we collect your name and contact details (Telegram/phone) that you enter in the form. We also log the page from which the request was sent.
        - title: How we use data
          text: The data from the request is used only for feedback regarding that request. We do not share requests with third parties or use them for advertising. Web analytics operates separately — Google and Yandex receive anonymized data on page views.
        - title: Data storage
          text: Requests are stored in a secure cloud storage Vercel Blob; only our team has access to them. You can request the deletion of your data at any time by messaging us on Telegram.
        - title: Cookies
          text: The site uses technical cookies, without which it does not function, and analytical cookies. You can opt-out via the banner at the bottom of the screen; your choice is saved in the browser. Yandex.Metrica records sessions (mouse movement, scrolling, and clicks). We excluded the request form from this recording, so its content isn’t captured. If you visited from an ad and did not opt-out of analytics, the site remembers this — source and campaign — for 30 days so we can track which ads generate requests.
