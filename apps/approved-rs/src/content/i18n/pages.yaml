      metaDescription: 'Datenschutz auf {siteName}: Welche personenbezogenen Daten wir erheben, wie wir sie verwenden und wie Sie deren Löschung beantragen können.'
      heading: Datenschutzerklärung
      lastUpdated: 'Zuletzt aktualisiert: Juni 2026'
      sections:
        - title: Welche Daten wir erheben
          text: Wenn Sie eine Anfrage senden, erfassen wir den Namen und die Kontaktdaten (Telegram/Telefon), die Sie im Formular angeben. Außerdem speichern wir, von welcher Seite die Anfrage gesendet wurde.
        - title: Wie wir Ihre Daten verwenden
          text: 'Die Angaben aus Ihrer Anfrage verwenden wir ausschließlich, um Ihnen darauf zu antworten. Wir geben Ihre Anfrage nicht an Dritte weiter und nutzen sie nicht für Werbung. Unabhängig von den Anfragen läuft die Webanalyse: Google und Yandex erhalten anonymisierte Daten zu Seitenaufrufen.'
        - title: Speicherung der Daten
          text: Anfragen werden im geschützten Cloud-Speicher Vercel Blob gespeichert. Nur unser Team hat Zugriff darauf. Sie können jederzeit die Löschung Ihrer Daten verlangen, indem Sie uns auf Telegram schreiben.
        - title: Cookies
          text: Die Website verwendet technisch notwendige Cookies sowie Analyse-Cookies. Im Banner am unteren Bildschirmrand können Sie die Analyse ablehnen; Ihre Auswahl wird im Browser gespeichert. Yandex Metrica zeichnet Sitzungen auf, einschließlich Mausbewegungen, Scrollen und Klicks. Das Anfrageformular haben wir von der Aufzeichnung ausgeschlossen, seine Inhalte werden nicht erfasst. Wenn Sie über eine Anzeige auf die Website kommen und der Analyse nicht widersprochen haben, speichert die Website die Quelle und Kampagne für 30 Tage. So erkennen wir, welche Werbung zu Anfragen führt.
