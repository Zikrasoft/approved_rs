      heading: Datenschutzrichtlinie
      lastUpdated: 'Letzte Aktualisierung: Juni 2026'
      sections:
        - title: Welche Daten wir sammeln
          text: Bei der Einreichung einer Anfrage sammeln wir Name und Kontaktdaten (Telegram/Telefon), die Sie in das Formular eingeben. Wir protokollieren auch die Seite, von der die Anfrage gesendet wurde.
        - title: Wie wir die Daten verwenden
          text: Die Daten aus der Anfrage werden nur für die Rückmeldung dazu verwendet. Wir geben die Anfrage nicht an Dritte weiter und verwenden sie nicht für Werbung. Separat von den Anfragen arbeitet Web-Analyse — Google erhält anonymisierte Daten über die Seitenansichten.
        - title: Speicherung der Daten
          text: Anfragen werden in einem sicheren Cloud-Speicher (Vercel Blob) aufbewahrt; der Zugriff darauf ist nur unserm Team möglich. Sie können jederzeit die Löschung Ihrer Daten anfordern, indem Sie uns über Telegram schreiben.
        - title: Cookies
          text: Die Webseite verwendet technische Cookies, ohne die sie nicht funktioniert, sowie analytische. Im Banner am unteren Bildschirmrand können Sie ablehnen; die Auswahl wird im Browser gespeichert. Wenn Sie über Werbung gekommen sind und der Analyse nicht widersprochen haben, merkt sich die Webseite dies — die Quelle und die Kampagne — für 30 Tage, damit wir sehen können, welche Werbung Anfragen generiert.
