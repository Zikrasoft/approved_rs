    privacy:
      metaTitle: Política de privacidad
      metaDescription: 'Política de privacidad y tratamiento de datos personales del sitio {siteName}: qué datos recopilamos, cómo los usamos y cómo solicitar su eliminación.'
      heading: Política de privacidad
      lastUpdated: 'Última actualización: junio 2026'
      sections:
        - title: Qué datos recopilamos
          text: Al enviar una solicitud, recopilamos el nombre y los datos de contacto (Telegram/teléfono) que introduzcas en el formulario. También registramos la página desde la cual se envió la solicitud.
        - title: Cómo usamos los datos
          text: Los datos de la solicitud se utilizan únicamente para la retroalimentación sobre ella. No compartimos la solicitud con terceros ni la usamos para publicidad. Separadamente, la analítica web — Google y Yandex reciben datos anónimos sobre la visualización de páginas.
        - title: Almacenamiento de datos
          text: Las solicitudes se almacenan en un almacenamiento en la nube seguro Vercel Blob; solo nuestro equipo tiene acceso a ellas. Puedes solicitar la eliminación de tus datos en cualquier momento enviándonos un mensaje en Telegram.
        - title: Cookies
          text: El sitio utiliza cookies técnicas, sin las cuales no funciona, y cookies analíticas. Puedes rechazarlo en el banner en la parte inferior de la pantalla; la elección se guarda en el navegador. Yandex.Metrica registra las sesiones (movimiento del cursor, desplazamiento y clics). Excluimos el formulario de registro de este registro, su contenido no se incluye. Si llegaste a través de publicidad y no rechazaste la analítica, el sitio recuerda esto — la fuente y la campaña — durante 30 días, para que veamos qué publicidad genera solicitudes.
