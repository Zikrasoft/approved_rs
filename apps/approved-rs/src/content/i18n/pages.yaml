      heading: Política de privacidad
      lastUpdated: 'Última actualización: junio de 2026'
      sections:
        - title: Qué datos recopilamos
          text: Al enviar una solicitud, recopilamos tu nombre y datos de contacto (Telegram/teléfono) que introduces en el formulario. También registramos la página desde la que se envió la solicitud.
        - title: Cómo usamos los datos
          text: 'Los datos de la solicitud se utilizan solo para la retroalimentación. No compartimos la solicitud con terceros ni la utilizamos para publicidad. La analítica web opera de forma independiente: Google y Yandex reciben datos anonimizados sobre la visualización de páginas.'
        - title: Almacenamiento de datos
          text: Las solicitudes se almacenan en un almacén en la nube protegido Vercel Blob; solo nuestro equipo tiene acceso a ellas. Puede solicitar la eliminación de sus datos en cualquier momento, escribiéndonos por Telegram.
        - title: Cookies
          text: El sitio utiliza cookies técnicas, sin las cuales no funciona, y analíticas. Puede rechazar en el banner en la parte inferior de la pantalla; la selección se guarda en el navegador. Yandex.Metrica registra las sesiones (movimiento del cursor, desplazamiento y clics). Excluimos el formulario de solicitud del registro, su contenido no se guarda allí. Si llegas por publicidad y no rechazas la analítica, el sitio recuerda esto (fuente y campaña) durante 30 días, para que veamos qué publicidad genera solicitudes.
