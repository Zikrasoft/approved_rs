      heading: Datenschutzrichtlinie
      lastUpdated: 'Letzte Aktualisierung: Juni 2026'
      sections:
        - title: Welche Daten wir sammeln
          text: Bei der Anfrage sammeln wir den Namen und die Kontaktdaten (Telegram/Telefon), die Sie in das Formular eingeben. Wir protokollieren auch die Seite, von der die Anfrage gesendet wurde.
        - title: Wie wir die Daten verwenden
          text: 'Die Daten aus der Anfrage werden nur für die Rückmeldung dazu verwendet. Wir geben die Anfrage nicht an Dritte weiter und nutzen sie nicht für Werbung. Unabhängig von den Anfragen arbeitet die Web-Analyse: Google und Yandex erhalten anonymisierte Daten über Seitenaufrufe.'
        - title: Datenspeicherung
          text: Anfragen werden in einem geschützten Cloud-Speicher, Vercel Blob, gespeichert; nur unser Team hat Zugang dazu. Sie können jederzeit die Löschung Ihrer Daten anfordern, indem Sie uns über Telegram schreiben.
        - title: Cookies
          text: Die Website verwendet technische Cookies, ohne die sie nicht funktioniert, sowie analytische. Im Banner unten auf dem Bildschirm können Sie ablehnen; die Auswahl wird im Browser gespeichert. Yandex.Metrica zeichnet Sitzungen auf (Mausbewegungen, Scrollen und Klicks). Das Formular für die Anfrage haben wir aus der Aufzeichnung ausgeschlossen, dessen Inhalt wird dort nicht erfasst. Wenn Sie über Werbung gekommen sind und nicht von der Analyse abgelehnt haben, merkt sich die Website dies (Quelle und Kampagne) für 30 Tage, damit wir sehen, welche Werbung Anfragen bringt.
