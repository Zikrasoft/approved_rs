      metaDescription: 'Política de privacidad y tratamiento de datos personales de {siteName}: qué datos recopilamos, cómo los usamos y cómo solicitar su eliminación.'
      heading: Política de privacidad
      lastUpdated: 'Última actualización: noviembre de 2026'
      sections:
        - title: Qué datos recopilamos
          text: Cuando envías una solicitud, recopilamos el nombre y los datos de contacto (Telegram/teléfono) que introduces en el formulario. También registramos desde qué página la envías.
        - title: Cómo usamos los datos
          text: 'Solo usamos los datos de la solicitud para responderte. No la compartimos con terceros ni usamos los datos con fines publicitarios. Por separado, usamos herramientas de analítica web: Google y Yandex reciben datos anonimizados sobre las páginas visitadas.'
        - title: Almacenamiento de datos
          text: Las solicitudes se guardan en el almacenamiento seguro en la nube Vercel Blob, al que solo tiene acceso nuestro equipo. Puedes solicitar la eliminación de tus datos en cualquier momento escribiéndonos por Telegram.
        - title: Cookies
          text: El sitio utiliza cookies técnicas, necesarias para su funcionamiento, y cookies analíticas. Puedes rechazarlas desde el enlace "Configuración de cookies" al pie de la página; tu elección se guarda en el navegador. Yandex Metrica registra las sesiones (movimientos del cursor, desplazamientos y clics). Excluimos el formulario de contacto de estas grabaciones, por lo que su contenido no se registra. Si llegas desde un anuncio y no rechazas las cookies analíticas, el sitio guarda el origen y la campaña durante 30 días para que podamos saber qué anuncios generan solicitudes. Mientras no las rechaces, el sitio guarda en la memoria del navegador y en nuestra propia cookie visitor_id un identificador aleatorio y anónimo del navegador, para que el clic en un servicio de mensajería y la solicitud de un mismo visitante no aparezcan como registros distintos. Al rechazarlas, el identificador y la cookie se eliminan.
