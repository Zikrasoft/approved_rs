      sections:
        - title: What data we collect
          text: When submitting a request, we collect your name and contact information (Telegram/phone) entered in the form. We also log the page from which the request was sent.
        - title: How we use data
          text: The data from the application is used solely for follow-up purposes. We do not share applications with third parties and do not use them for advertising. Web analytics operates separately — Google receives anonymized data on page views.
        - title: Data storage
          text: Requests are stored in a secure Vercel Blob cloud storage; access is limited to our team. You may request deletion of your data anytime by messaging us on Telegram.
        - title: Cookies
          text: The site uses essential technical cookies that are necessary for its operation, as well as analytical cookies. You can opt out via the banner at the bottom of the screen; your choice will be saved in the browser. If you arrived via an ad and did not opt out of analytics, the site remembers the source and campaign for 30 days, so we can see which ads generate applications.
