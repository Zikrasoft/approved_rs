      heading: Datenschutzrichtlinie
      lastUpdated: 'Letzte Aktualisierung: Juni 2026'
      sections:
        - title: Welche Daten wir sammeln
          text: Bei der Einsendung einer Anfrage sammeln wir Ihren Namen und Ihre Kontaktdaten (Telegram/Telefon), die Sie in das Formular eingeben. Wir erfassen auch die Seite, von der die Anfrage gesendet wurde.
        - title: Wie wir die Daten verwenden
          text: Die gesammelten Daten werden ausschließlich zur Rückmeldung zu Ihrer Anfrage verwendet. Wir geben keine Daten an Dritte weiter und verwenden sie nicht für Werbung.
        - title: Datenspeicherung
          text: Anfragen werden in einem gesicherten Cloud-Speicher von Vercel Blob gespeichert; nur unser Team hat Zugriff darauf. Sie können jederzeit die Löschung Ihrer Daten anfordern, indem Sie uns über Telegram anschreiben.
        - title: Cookies
          text: Die Website verwendet technische Cookies, die für den Betrieb der Website erforderlich sind, sowie analytische Cookies von Google Analytics und Yandex.Metrica – aber nur mit Ihrem Einverständnis. Bei Ihrem ersten Besuch können Sie die Verwendung von analytischen Cookies im Banner am unteren Bildschirmrand akzeptieren oder ablehnen; Ihre Auswahl wird im Browser gespeichert.
