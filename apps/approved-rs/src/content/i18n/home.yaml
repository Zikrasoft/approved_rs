    trustCards:
      - title: Transparencia total
        text: 'Te enviamos una lista detallada de más de 100 puntos y vídeos de cada detalle: carrocería, interior y tren de rodaje. Verás el coche como si estuvieras allí.'
      - title: Seguridad en la compra
        text: 'Pagos por etapas y condiciones claras. Te acompañamos con la documentación en cada fase: trámites, despacho de aduanas y matriculación. Sin sorpresas.'
      - title: Conocimiento local
        text: 'Conocemos cada mercado: los kilómetros de autopista en Alemania, las particularidades de la carrocería de los coches españoles y los trámites para matricular coches extranjeros en Serbia.'
    testimonialsHeading: Lo que dicen nuestros clientes
    testimonials:
      - quote: '"Trajeron un BMW Serie 3 de Múnich a Belgrado. Todo perfecto, desde la inspección hasta la matriculación. Nos ahorraron un montón de quebraderos de cabeza con los trámites."'
        name: Aleksandr
        caption: BMW 320d, Alemania → Serbia
      - quote: '"Llevaba tiempo buscando un Skoda Octavia en buen estado. Encontraron uno en España y un experto independiente lo inspeccionó. Todo coincidía con la descripción."'
        name: Mijaíl
        caption: Skoda Octavia, España → Rusia
      - quote: '"Matricular un coche con matrícula extranjera parecía complicado. El equipo me guio en cada paso y al mes ya estaba conduciendo. Lo recomiendo."'
        name: Dmitri
        caption: VW Passat, Alemania → Serbia
    ctaEyebrow: ¿Empezamos?
    ctaHeading:
      line1: Cuéntanos
      line2: qué coche
      accentWord: buscas
    ctaSubtext: Respondemos en un plazo de 2 horas. Consulta gratuita.
    ctaTelegramLabel: Escríbenos por Telegram
    ctaStatResponse:
      value: 2 h
      label: respuesta
    origin:
      heading: De dónde importamos
      note: Entregamos en cualquier país. Cuéntanos tu caso al contactarnos
      euTitle: Desde Europa
      euText: Alemania, España, Suiza y otros países europeos. Buscamos coches allí, los inspeccionamos antes de la compra, tramitamos la exportación, los transportamos y hacemos el despacho de aduanas. Te damos el precio final antes de cerrar el trato, no al cruzar la frontera.
      euCta: Calcula la importación desde Europa
      chinaTitle: Desde China
      chinaText: Coches nuevos y usados de China a través de un socio de confianza. Los buscamos según tu presupuesto, los inspeccionamos antes del envío, los transportamos y hacemos el despacho de aduanas, igual que con los coches europeos.
      chinaCta: Calcula la importación desde China
      chinaTags:
        - Nuevos
        - Usados
        - Todo incluido
    catalogue:
      heading: Últimas operaciones
      subtext: 'No son anuncios: cada coche fue encontrado, inspeccionado y tramitado antes de entregárselo a su nuevo dueño. El precio indicado es el que pagó.'
      allCountriesLabel: Todos los países
      moreLabel: Mostrar más {rest}
    inspection:
      heading: Más de 100 puntos, pero cuatro son decisivos
      subtext: La lista de revisión es larga, pero casi siempre recomendamos no seguir adelante por problemas en una de estas cuatro áreas. Pulsa un número del esquema para ver qué revisa el experto y qué hemos encontrado.
      hint: Pulsa un número del esquema
      ctaLabel: Encargar una inspección
      pointsLabel: Más de 100 puntos
      mediaLabel: fotos y vídeos
      reportLabel: informe antes de decidir
      zones:
        - title: Carrocería y pintura
          text: Medimos el espesor de pintura en cada panel y revisamos la geometría de las aberturas y los rastros de soldadura y masilla. Así detectamos reparaciones que el vendedor quizá no mencione.
          points:
            - Paneles repintados o retocados
            - Holguras y geometría tras un golpe
            - Óxido en los bajos y los pasos de rueda
            - Cristales y faros originales
        - title: Motor y caja de cambios
          text: Comprobamos los parámetros con el motor caliente, las adaptaciones de la caja de cambios y los fallos registrados en las centralitas. Es el área más cara y el motivo más frecuente para descartar un coche.
          points:
            - Estiramiento de la cadena de distribución
            - Fugas y sudoración de aceite
            - Adaptaciones y tirones de la caja de cambios
            - Compresión y humos de escape
          finding: 'BMW M340 de 2025 con poco kilometraje: el diagnóstico detectó un estiramiento de la cadena de distribución de cerca del 20 %. Lo descubrimos antes de cerrar el trato y el cliente pudo negociar el precio.'
        - title: Suspensión y frenos
          text: Revisamos el coche en un elevador, las holguras, la suspensión y el sistema de frenos. Los kilómetros de autopista en Alemania y las carreteras de los Balcanes desgastan el coche de forma distinta.
          points:
            - Holguras en brazos y rótulas
            - Fugas en los amortiguadores
            - Desgaste de discos y pastillas
            - Cremallera de dirección y guardapolvos
        - title: Electrónica, VIN y documentación
          text: 'Consultamos el historial de mantenimiento por VIN, comprobamos si han manipulado el cuentakilómetros, revisamos los fallos electrónicos y verificamos la situación legal: embargos, prohibiciones de matriculación y accidentes sin resolver.'
          points:
            - Kilometraje que no coincide con el historial
            - Fallos registrados en las centralitas
            - Embargos y prohibiciones de matriculación
            - Accidentes y siniestros pendientes de resolución
    findingLabel: 'Detectamos:'
    heroPhotoAlt: Berlina en una carretera europea
    ctaPhotoAlt: Detalle de la carrocería impecable y la rueda de un coche
  de:
    metaTitle: Auto finden, importieren und verkaufen in Europa
    metaDescription: Auto finden oder aus Europa und China importieren lassen. Mit Prüfung und Kaufabwicklung. Wir sind europaweit tätig.
    journey:
      - title: Fahrzeugsuche
        desc: Wir finden, prüfen und liefern Ihr Wunschauto zum passenden Budget, schlüsselfertig in Deutschland, Spanien, Serbien und der Schweiz.
      - title: Import
        desc: Das Auto steht nicht in Ihrem Land? Wir finden und importieren es schlüsselfertig aus Deutschland, Europa oder China, inklusive Zollabwicklung.
      - title: Fahrzeugprüfung
        desc: Ein unabhängiger Experte prüft das Auto vor dem Kauf anhand von über 100 Punkten und dokumentiert alles per Video.
        note: Auto selbst gefunden? Prüfung separat beauftragen
      - title: Kauf und Abwicklung
        desc: Wir übernehmen Kaufabwicklung und Zollabfertigung für Fahrzeuge mit ausländischen Kennzeichen.
        note: Auto bereits im Ausland? Wir helfen bei der Zulassung
    heroLine1: Wir finden Ihr Auto.
    heroLine2: Wir prüfen es.
    heroLine3: Wir liefern es.
    heroSubtext: Wir finden Ihr Auto in Deutschland, Spanien, der Schweiz oder Serbien. Steht es in einem anderen Land, bringen wir es zu Ihnen, inklusive Prüfung, Abwicklung und Zoll.
    statClients:
      value: 200+
      label: Kunden
    statCountries:
      label: Länder
    statYears:
      value: 5 Jahre
      label: am Markt
    journeyHeading: Ein Weg, von der Suche bis zum Schlüssel
    journeySubtext: Fahrzeugsuche, Import, Prüfung und Kaufabwicklung sind keine getrennten Leistungen, sondern Schritte auf dem Weg zu Ihrem Auto. Sie können jederzeit einsteigen.
    whyUsHeading: Warum Kunden uns wählen
    whyUsSubtext: Ein Autokauf im Ausland wirft Fragen auf. So schaffen wir Klarheit.
    trustCards:
      - title: Volle Transparenz
        text: 'Sie erhalten eine ausführliche Checkliste mit über 100 Prüfpunkten und Videos zu allen Details: Karosserie, Innenraum und Fahrwerk. So sehen Sie das Auto, als wären Sie selbst vor Ort.'
      - title: Sichere Abwicklung
        text: 'Zahlung in Etappen und klare Bedingungen. Wir begleiten Sie bei allen Unterlagen: Kaufabwicklung, Zollabfertigung und Zulassung. Keine bösen Überraschungen.'
      - title: Marktkenntnis vor Ort
        text: 'Wir kennen die Besonderheiten jedes Marktes: hohe Autobahnkilometer in Deutschland, typische Karosserieprobleme spanischer Autos und die Zulassung mit ausländischen Kennzeichen in Serbien.'
    testimonialsHeading: Das sagen unsere Kunden
    testimonials:
      - quote: '"Wir haben einen BMW 3er aus München nach Belgrad gebracht. Alles lief reibungslos, von der Prüfung bis zur Zulassung. Die ganze Abwicklung hat uns viel Stress erspart."'
        name: Alexander
        caption: BMW 320d, Deutschland → Serbien
      - quote: '"Ich habe lange nach einem gut erhaltenen Skoda Octavia gesucht. Das Team fand ein passendes Auto in Spanien und ließ es unabhängig prüfen. Alles entsprach der Beschreibung."'
        name: Mikhail
        caption: Skoda Octavia, Spanien → Russland
      - quote: '"Die Zulassung mit ausländischen Kennzeichen erschien kompliziert. Das Team hat mich durch jeden Schritt begleitet, und nach einem Monat war ich schon unterwegs. Klare Empfehlung."'
        name: Dmitri
        caption: VW Passat, Deutschland → Serbien
    ctaEyebrow: Bereit loszulegen?
    ctaHeading:
      line1: Erzählen Sie uns,
      line2: welches Auto
      accentWord: Sie suchen
    ctaSubtext: Wir antworten innerhalb von 2 Stunden. Die Beratung ist kostenlos.
    ctaTelegramLabel: Auf Telegram schreiben
    ctaStatResponse:
      value: 2 Std.
      label: Antwortzeit
    origin:
      heading: Woher wir Autos importieren
      note: Wir liefern in jedes Land. Details besprechen wir bei Ihrer Anfrage.
      euTitle: Aus Europa
      euText: Deutschland, Spanien, die Schweiz und weitere Länder Europas. Wir suchen vor Ort, prüfen das Auto vor dem Kauf, erledigen die Ausfuhr, liefern es und kümmern uns um die Zollabfertigung. Den Gesamtpreis nennen wir vor dem Kauf, nicht erst nach der Grenze.
      euCta: Import aus Europa berechnen
      chinaTitle: Aus China
      chinaText: Neue und gebrauchte Autos aus China über einen geprüften Partner. Wir suchen passend zu Ihrem Budget, prüfen vor dem Versand und organisieren Lieferung und Zollabfertigung, wie bei Importen aus Europa.
      chinaCta: Import aus China berechnen
      chinaTags:
        - Neuwagen
        - Gebrauchtwagen
        - Komplettservice
    catalogue:
      heading: Unsere letzten Käufe
      subtext: 'Keine Inserate: Jedes Auto wurde für einen Kunden gefunden, geprüft, abgewickelt und übergeben. Angegeben ist der tatsächlich gezahlte Preis.'
      allCountriesLabel: Alle Länder
      moreLabel: Weitere {rest} anzeigen
    inspection:
      heading: 100 Prüfpunkte, vier entscheidende Bereiche
      subtext: Die Checkliste ist lang, doch meist sind es vier Bereiche, die vom Kauf abraten lassen. Klicken Sie auf eine Nummer, um zu sehen, was der Experte prüft und was wir dort schon gefunden haben.
      hint: Nummer in der Grafik anklicken
      ctaLabel: Prüfung beauftragen
      pointsLabel: 100+ Prüfpunkte
      mediaLabel: Fotos und Videos
      reportLabel: Bericht vor Ihrer Entscheidung
      zones:
        - title: Karosserie und Lack
          text: Lackschichtmessung an jedem Karosserieteil, Prüfung der Spaltmaße sowie Suche nach Schweiß- und Spachtelspuren. So erkennen wir Reparaturen, die der Verkäufer vielleicht nicht erwähnt hat.
          points:
            - Nachlackierte und ausgebesserte Teile
            - Spaltmaße und Karosseriegeometrie nach einem Unfall
            - Rost an Schwellern und Radläufen
            - Originalität von Scheiben und Scheinwerfern
        - title: Motor und Getriebe
          text: Messwerte bei warmem Motor, Getriebeanpassungen und gespeicherte Steuergerätefehler. Der teuerste Bereich und der häufigste Grund, vom Kauf abzuraten.
          points:
            - Gelängte Steuerkette
            - Öllecks und Undichtigkeiten
            - Getriebeanpassungen und Schaltrucke
            - Kompression und Abgasrauch
          finding: 'BMW M340 aus dem Jahr 2025 mit geringer Laufleistung: Die Diagnose zeigte, dass die Steuerkette um etwa 20 % gelängt war. Wir entdeckten es vor dem Kauf, sodass der Kunde einen guten Grund zum Verhandeln hatte.'
        - title: Fahrwerk und Bremsen
          text: Prüfung auf der Hebebühne, Spiel sowie Zustand von Fahrwerk und Bremsanlage. Autobahnkilometer in Deutschland und Straßen auf dem Balkan beanspruchen Autos unterschiedlich.
          points:
            - Spiel an Lenkern und Traggelenken
            - Undichte Stoßdämpfer
            - Verschleiß an Bremsscheiben und Bremsbelägen
            - Lenkgetriebe und Manschetten
        - title: Elektronik, VIN und Dokumente
          text: 'Servicehistorie anhand der VIN, Tachomanipulation, Elektronikfehler und rechtliche Prüfung: bestehende Finanzierung, Zulassungssperren und nicht abgeschlossene Unfallschäden.'
          points:
            - Abweichende Laufleistung laut Historie
            - Fehler in den Steuergeräten
            - Finanzierung und Zulassungssperre
            - Nicht abgeschlossene Unfallschäden und Versicherungsfälle
    findingLabel: 'Festgestellt:'
    heroPhotoAlt: Limousine auf einer europäischen Autobahn
    ctaPhotoAlt: Nahaufnahme einer sauberen Karosserie und eines Autorads
