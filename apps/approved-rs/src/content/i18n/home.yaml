  en:
    metaTitle: Car sourcing, import, and buyback in Europe
    metaDescription: Car sourcing in your country or importing vehicles from Europe and China — all-inclusive. Inspection and buyback services. We serve Russian speakers worldwide.
    journey:
      - title: Sourcing
        desc: We find, verify, and deliver a car within your budget — all-inclusive, in Germany, Spain, Serbia, and Switzerland.
      - title: Import
        desc: Is the car in another country? We'll source and bring it from Germany, Europe, or China — all-inclusive, including customs clearance.
      - title: Inspection
        desc: An independent expert inspects the car before purchase — covering 100+ points with video documentation.
        note: Found the car yourself? We can arrange an inspection separately.
      - title: Buyback
        desc: We handle the buyback and customs clearance for vehicles with foreign plates.
        note: Is the car already abroad? We can help with the paperwork.
    heroLine1: Found.
    heroLine2: Verified.
    heroLine3: Delivered.
    heroSubtext: We'll source, inspect, process, and deliver a vehicle from Germany, Spain, or Serbia. One journey, one team.
    statClients:
      value: 200+
      label: clients
    statCountries:
      label: countries
    statYears:
      value: 5 years
      label: in the market
    journeyHeading: 'One journey: from search to keys'
    journeySubtext: Car sourcing, import, inspection, and buyback — not separate services, but stages of your car's journey. You can start at any step.
    whyUsHeading: Why choose us
    whyUsSubtext: Buying a car from another country raises questions. Here’s how we address them.
    trustCards:
      - title: Complete transparency
        text: 'We provide a detailed checklist (100+ points) and videos of every detail: body, interior, mechanics. You see the car as if you were standing next to it.'
      - title: Transaction security
        text: 'Payment in stages and clear conditions. We assist with all documentation throughout the process: registration, customs clearance, registration — no surprises.'
      - title: Local expertise
        text: 'We know the specifics of each market: the autobahn mileage of Germany, the nuances of Spanish car bodies, and the specifics of foreign plate registration in Serbia.'
    testimonialsHeading: What clients say
    testimonials:
      - quote: “They brought my BMW 3 series from Munich to Belgrade. Everything was clear — from inspection to registration. Saved me tons of nerves during the paperwork.”
        name: Александр
        caption: BMW 320d, Germany → Serbia
      - quote: “I spent a long time searching for a Skoda Octavia in good condition. The team found an option in Spain, inspected it with an independent expert — everything matched the description.”
        name: Михаил
        caption: Skoda Octavia, Spain → Russia
      - quote: “Registering with foreign plates seemed complicated. The team guided me through every step — and within a month, I was already driving. Highly recommend.”
        name: Дмитрий
        caption: VW Passat, Germany → Serbia
    ctaEyebrow: Ready to get started?
    ctaHeading:
      line1: Tell us about
      line2: your
      accentWord: vehicle
    ctaSubtext: We respond within 2 hours. Consultation is free.
