  - quote: «Долго искал Skoda Octavia в хорошем состоянии. Ребята нашли вариант в Испании, проверили независимым экспертом — всё совпало с описанием.»
    name: Михаил
    caption: Skoda Octavia, Испания → Россия
  - quote: «Оформление на иностранные номера казалось сложным. Команда провела через каждый шаг — и через месяц я уже ездил. Рекомендую.»
    name: Дмитрий
    caption: VW Passat, Германия → Сербия
