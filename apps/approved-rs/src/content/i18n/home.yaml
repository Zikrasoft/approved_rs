    trustCards:
      - title: Transparencia total
        text: 'Te enviamos un informe detallado con más de 100 puntos y vídeos de cada detalle: carrocería, interior y tren de rodaje. Verás el coche como si estuvieras allí.'
      - title: Una operación segura
        text: 'Pagos por etapas y condiciones claras. Gestionamos la documentación en cada fase: compra, despacho de aduanas y matriculación. Sin sorpresas.'
      - title: Conocimiento de cada mercado
        text: 'Conocemos las particularidades de cada mercado: los kilómetros de autopista en Alemania, el estado de las carrocerías en España y los trámites de los coches con matrícula extranjera en Serbia.'
    testimonialsHeading: Lo que dicen nuestros clientes
    testimonials:
      - quote: «Me trajeron un BMW Serie 3 de Múnich a Belgrado. Todo fue sobre ruedas, desde la inspección hasta la matriculación. Me ahorraron muchos quebraderos de cabeza con los trámites.»
        name: Aleksandr
        caption: BMW 320d, Alemania → Serbia
      - quote: «Llevaba mucho tiempo buscando un Skoda Octavia en buen estado. Encontraron uno en España, lo revisó un experto independiente y todo coincidía con la descripción.»
        name: Mijaíl
        caption: Skoda Octavia, España → Rusia
      - quote: «Los trámites para un coche con matrícula extranjera parecían complicados. El equipo me guio en cada paso y al mes ya estaba conduciendo. Los recomiendo.»
        name: Dmitri
        caption: VW Passat, Alemania → Serbia
    ctaEyebrow: ¿Empezamos?
    ctaHeading:
      line1: Cuéntanos
      line2: qué coche
      accentWord: estás buscando
    ctaSubtext: Respondemos en un plazo de 2 horas. La consulta es gratuita.
    ctaTelegramLabel: Escríbenos por Telegram
    ctaStatResponse:
      value: 2 h
      label: para responder
    origin:
      heading: De dónde traemos los coches
      note: Entregamos en cualquier país. Lo concretamos al recibir tu solicitud
      euTitle: De Europa
      euText: Alemania, España, Suiza y otros países europeos. Buscamos el coche sobre el terreno, lo inspeccionamos antes de comprarlo y gestionamos la exportación, el transporte y el despacho de aduanas. Conocerás el precio final antes de comprar, no después de cruzar la frontera.
      euCta: Calcular la importación desde Europa
      chinaTitle: De China
      chinaText: Coches nuevos y de segunda mano de China a través de un colaborador de confianza. Buscamos según tu presupuesto, revisamos el coche antes del envío y gestionamos el transporte y el despacho de aduanas, igual que desde Europa.
      chinaCta: Calcular la importación desde China
      chinaTags:
        - Nuevos
        - De segunda mano
        - Todo incluido
    catalogue:
      heading: Últimas operaciones
      subtext: 'Esto no son anuncios: cada coche ya se ha buscado, revisado, tramitado y entregado a su dueño. El precio que ves es el que pagó.'
      allCountriesLabel: Todos los países
      moreLabel: Mostrar otros {rest}
    inspection:
      heading: Cien puntos de revisión, cuatro áreas decisivas
      subtext: La lista es larga, pero casi siempre desaconsejamos una compra por problemas en una de estas cuatro áreas. Pulsa un número del esquema para ver qué revisa el experto y qué hemos encontrado.
      hint: Pulsa un número del esquema
      ctaLabel: Solicitar una inspección
      pointsLabel: Más de 100 puntos
      mediaLabel: fotos y vídeos
      reportLabel: informe antes de decidir
      zones:
        - title: Carrocería y pintura
          text: Medimos el espesor de la pintura en cada panel, comprobamos la geometría de los huecos y buscamos rastros de soldadura y masilla. Así detectamos reparaciones que el vendedor ha olvidado mencionar.
          points:
            - Paneles repintados y retoques de pintura
            - Holguras y geometría tras un golpe
            - Corrosión en los estribos y pasos de rueda
            - Cristales y faros originales
        - title: Motor y caja de cambios
          text: Comprobamos los parámetros con el motor caliente, las adaptaciones de la caja de cambios y los códigos de avería almacenados en las centralitas. Es el área más cara de reparar y el motivo más frecuente para descartar una compra.
          points:
            - Estiramiento de la cadena de distribución
            - Fugas y rezumes
            - Adaptaciones y tirones de la caja de cambios
            - Compresión y humos de escape
          finding: 'BMW M340 de 2025 con pocos kilómetros: el diagnóstico reveló un estiramiento de la cadena de distribución de alrededor del 20 %. Lo detectamos antes de la compra y el cliente pudo usarlo para negociar el precio.'
        - title: Tren de rodaje y frenos
          text: 'Revisamos el coche en el elevador: holguras, estado de la suspensión y sistema de frenos. Los kilómetros de autopista en Alemania y las carreteras de los Balcanes desgastan el coche de formas distintas.'
          points:
            - Holguras en brazos de suspensión y rótulas
            - Fugas en los amortiguadores
            - Desgaste de discos y pastillas de freno
            - Cremallera de dirección y guardapolvos
        - title: Electrónica, VIN y documentación
          text: 'Comprobamos el historial de mantenimiento por VIN, posibles manipulaciones del kilometraje, fallos electrónicos y la situación legal: cargas, restricciones de matriculación y siniestros pendientes de cierre.'
          points:
            - Kilometraje que no coincide con el historial
            - Códigos de avería almacenados en las centralitas
            - Cargas y restricciones de matriculación
            - Accidentes y partes de seguro pendientes de cierre
    findingLabel: 'Detectamos:'
    heroPhotoAlt: Berlina en una autopista europea
    ctaPhotoAlt: Primer plano de la carrocería limpia y una rueda de un coche
  de:
    metaTitle: Autosuche, Import und Ankauf in Europa
    metaDescription: Wir finden Ihr Auto vor Ort oder importieren es aus Europa und China. Alles aus einer Hand, inklusive Prüfung und Ankauf. Europaweit für Sie da.
    journey:
      - title: Autosuche
        desc: Wir finden, prüfen und liefern Ihr Wunschauto passend zu Ihrem Budget. Alles aus einer Hand, in Deutschland, Spanien, Serbien und der Schweiz.
      - title: Import
        desc: Ihr Wunschauto steht im Ausland? Wir finden es und importieren es aus Deutschland, Europa oder China. Inklusive Zollabwicklung und aller Formalitäten.
      - title: Fahrzeugprüfung
        desc: Ein unabhängiger Sachverständiger prüft das Auto vor dem Kauf anhand von über 100 Punkten und dokumentiert alles per Video.
        note: Auto selbst gefunden? Wir organisieren auch eine separate Prüfung
      - title: Ankauf
        desc: Wir übernehmen den Ankauf und die Zollabwicklung für Fahrzeuge mit ausländischer Zulassung.
        note: Das Auto steht bereits im Ausland? Wir helfen bei den Formalitäten
    heroLine1: Wir finden Ihr Auto.
    heroLine2: Prüfen es.
    heroLine3: Bringen es zu Ihnen.
    heroSubtext: Wir finden Ihr Auto in Deutschland, Spanien, der Schweiz oder Serbien. Steht es in einem anderen Land, bringen wir es zu Ihnen, inklusive Prüfung, Formalitäten und Zollabwicklung.
    statClients:
      value: 200+
      label: Kunden
    statCountries:
      label: Länder
    statYears:
      value: 5 Jahre
      label: am Markt
    journeyHeading: 'Ein Weg: von der Suche bis zur Schlüsselübergabe'
    journeySubtext: Autosuche, Import, Prüfung und Ankauf sind keine voneinander getrennten Leistungen, sondern Etappen auf dem Weg zu Ihrem Auto. Sie können bei jedem Schritt einsteigen.
    whyUsHeading: Warum Kunden uns wählen
    whyUsSubtext: Ein Autokauf im Ausland wirft Fragen auf. So schaffen wir Klarheit.
    trustCards:
      - title: Volle Transparenz
        text: 'Sie erhalten eine ausführliche Checkliste mit über 100 Prüfpunkten und Videos zu jedem Detail: Karosserie, Innenraum und Fahrwerk. Sie sehen das Auto, als stünden Sie selbst daneben.'
      - title: Sicherer Kauf
        text: 'Zahlung in Etappen und klare Bedingungen. Wir begleiten sämtliche Formalitäten: Kaufabwicklung, Verzollung und Zulassung. Ohne Überraschungen.'
      - title: Marktkenntnis vor Ort
        text: 'Wir kennen die Besonderheiten jedes Marktes: hohe Autobahn-Laufleistungen in Deutschland, typische Karosseriethemen bei spanischen Autos und die Formalitäten für Fahrzeuge mit ausländischer Zulassung in Serbien.'
    testimonialsHeading: Das sagen unsere Kunden
    testimonials:
      - quote: „Sie haben einen BMW 3er von München nach Belgrad gebracht. Alles lief reibungslos, von der Besichtigung bis zur Zulassung. Bei den Formalitäten haben sie uns jede Menge Nerven gespart.“
        name: Alexander
        caption: BMW 320d, Deutschland → Serbien
      - quote: „Ich habe lange nach einem Skoda Octavia in gutem Zustand gesucht. Das Team hat einen in Spanien gefunden und von einem unabhängigen Sachverständigen prüfen lassen. Alles entsprach der Beschreibung.“
        name: Michail
        caption: Skoda Octavia, Spanien → Russland
      - quote: „Die Abwicklung mit ausländischen Kennzeichen erschien mir kompliziert. Das Team hat mich durch jeden Schritt begleitet, und nach einem Monat war ich schon unterwegs. Klare Empfehlung.“
        name: Dmitri
        caption: VW Passat, Deutschland → Serbien
    ctaEyebrow: Bereit für den ersten Schritt?
    ctaHeading:
      line1: Erzählen Sie uns
      line2: von dem Auto,
      accentWord: das Sie suchen
    ctaSubtext: Wir antworten innerhalb von 2 Stunden. Die Beratung ist kostenlos.
    ctaTelegramLabel: Auf Telegram schreiben
    ctaStatResponse:
      value: 2 Std.
      label: Antwortzeit
    origin:
      heading: Woher wir Autos importieren
      note: Wir liefern in jedes Land. Die Details klären wir bei Ihrer Anfrage.
      euTitle: Aus Europa
      euText: Deutschland, Spanien, die Schweiz und weitere europäische Länder. Wir suchen vor Ort, prüfen vor dem Kauf und übernehmen Export, Transport und Verzollung. Den Gesamtpreis nennen wir vor dem Kauf, nicht erst nach dem Grenzübertritt.
      euCta: Importkosten aus Europa berechnen
      chinaTitle: Aus China
      chinaText: Neu- und Gebrauchtwagen aus China über einen bewährten Partner. Wir suchen passend zu Ihrem Budget, prüfen vor dem Versand und übernehmen Transport und Verzollung. Der Ablauf ist derselbe wie beim Import aus Europa.
      chinaCta: Importkosten aus China berechnen
      chinaTags:
        - Neuwagen
        - Gebrauchtwagen
        - Alles aus einer Hand
    catalogue:
      heading: Zuletzt vermittelte Fahrzeuge
      subtext: 'Hier stehen keine Inserate: Jedes Auto wurde gefunden, geprüft, vollständig abgewickelt und an seinen Besitzer übergeben. Angegeben ist der tatsächlich gezahlte Preis.'
      allCountriesLabel: Alle Länder
      moreLabel: Weitere {rest} anzeigen
    inspection:
      heading: Hundert Prüfpunkte, vier entscheidende Bereiche
      subtext: 'Die Checkliste ist lang. Doch wenn wir vom Kauf abraten, liegt es fast immer an einem von vier Bereichen. Klicken Sie auf eine Nummer in der Grafik: Wir zeigen, was der Sachverständige prüft und was wir dabei schon entdeckt haben.'
      hint: Klicken Sie auf eine Nummer in der Grafik
      ctaLabel: Fahrzeugprüfung beauftragen
      pointsLabel: 100+ Prüfpunkte
      mediaLabel: Fotos und Videos
      reportLabel: Prüfbericht vor der Kaufentscheidung
      zones:
        - title: Karosserie und Lack
          text: Lackschichtmessung an jedem Karosserieteil, Geometrie der Karosserieöffnungen sowie Schweiß- und Spachtelspuren. So erkennen wir Reparaturen, die der Verkäufer nicht erwähnt hat.
          points:
            - Ganz- und Teillackierungen von Karosserieteilen
            - Spaltmaße und Karosseriegeometrie nach Unfällen
            - Rost an Schwellern und Radläufen
            - Originalität von Scheiben und Leuchten
        - title: Motor und Getriebe
          text: Messwerte bei betriebswarmem Motor, Getriebeadaptionswerte und Fehlerspeicher der Steuergeräte. Hier drohen die höchsten Kosten, und hier liegt der häufigste Grund, vom Kauf abzuraten.
          points:
            - Steuerkettenlängung
            - Undichtigkeiten und Ölnebel
            - Getriebeadaptionswerte und Schaltruckeln
            - Kompression und Abgasrauch
          finding: 'BMW M340, Baujahr 2025, mit geringer Laufleistung: Die Diagnose ergab eine Steuerkettenlängung von rund 20 %. Wir haben sie vor dem Kauf entdeckt und dem Kunden damit ein Argument für die Preisverhandlung geliefert.'
        - title: Fahrwerk und Bremsen
          text: Auf der Hebebühne prüfen wir Spiel sowie den Zustand von Fahrwerk und Bremsanlage. Deutsche Autobahnkilometer beanspruchen ein Auto anders als Straßen auf dem Balkan.
          points:
            - Spiel an Querlenkern und Traggelenken
            - Undichte Stoßdämpfer
            - Verschleiß an Bremsscheiben und Bremsbelägen
            - Lenkgetriebe und Staubschutzmanschetten
        - title: Elektronik, FIN und Fahrzeugpapiere
          text: 'Servicehistorie anhand der FIN, Tachomanipulation, Elektronikfehler und rechtlicher Status: Pfandrechte, Zulassungssperren und offene Unfallschäden.'
          points:
            - Abweichungen zwischen Kilometerstand und Historie
            - Fehlerspeicher der Steuergeräte
            - Pfandrechte und Zulassungssperren
            - Offene Unfall- und Versicherungsfälle
    findingLabel: 'Entdeckt:'
    heroPhotoAlt: Limousine auf einer europäischen Fernstraße
    ctaPhotoAlt: Nahaufnahme einer sauberen Autokarosserie und eines Rads
