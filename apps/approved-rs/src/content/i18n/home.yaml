  de:
    metaTitle: Fahrzeugauswahl, Import und Rückkauf von Autos in Europa
    metaDescription: Fahrzeugauswahl in Ihrem Land oder Import von Autos aus Europa und China — schlüsselfertig. Überprüfung und Rückkauf. Wir arbeiten für russischsprachige Kunden weltweit.
    journey:
      - title: Fahrzeugsuche
        desc: Wir finden, prüfen und liefern das Fahrzeug nach Ihrem Budget — schlüsselfertig in Deutschland, Spanien, Serbien und der Schweiz.
      - title: Import
        desc: Das Auto befindet sich nicht in Ihrem Land? Wir finden und bringen es aus Deutschland, Europa oder China — schlüsselfertig, inklusive Zollabfertigung.
      - title: Überprüfung
        desc: Ein unabhängiger Experte inspiziert das Fahrzeug vor dem Kauf — nach über 100 Punkten mit Video.
        note: Haben Sie das Auto selbst gefunden? Wir bieten eine separate Überprüfung an.
      - title: Rückkauf
        desc: Wir kümmern uns um den Rückkauf und die Zollabfertigung des Fahrzeugs mit ausländischen Kennzeichen.
        note: Das Auto ist bereits im Ausland? Wir helfen Ihnen bei der Anmeldung.
    heroLine1: Gefunden.
    heroLine2: Geprüft.
    heroLine3: Geliefert.
    heroSubtext: Wir finden, prüfen, organisieren und bringen ein Auto aus Deutschland, Spanien oder Serbien. Ein Weg, ein Team.
    statClients:
      value: 200+
      label: Kunden
    statCountries:
      label: Länder
    statYears:
      value: 5 Jahre
      label: auf dem Markt
    journeyHeading: 'Ein Weg: von der Suche bis zu den Schlüsseln'
    journeySubtext: Fahrzeugauswahl, Import, Überprüfung und Rückkauf — nicht verschiedene Dienstleistungen, sondern Schritte eines gemeinsamen Weges für Ihr Auto. Sie können bei jedem Schritt einsteigen.
    whyUsHeading: Warum uns wählen
    whyUsSubtext: Der Kauf eines Fahrzeugs aus einem anderen Land wirft Fragen auf. So nehmen wir Ihnen diese ab.
    trustCards:
      - title: Volle Transparenz
        text: 'Wir senden Ihnen eine detaillierte Checkliste (über 100 Punkte) und Videos zu jedem Detail: Karosserie, Innenraum, Fahrwerk. Sie sehen das Auto, als stünden Sie direkt daneben.'
      - title: Sicherheit der Transaktion
        text: 'Schrittweise Zahlung und klare Bedingungen. Wir begleiten die Dokumente in allen Phasen: Anmeldung, Zollabfertigung, Registrierung — ohne Überraschungen.'
      - title: Lokale Expertise
        text: 'Wir kennen die Besonderheiten jedes Marktes: Autobahnkilometer in Deutschland, Merkmale der Karosserie spanischer Autos, Besonderheiten der Anmeldung ausländischer Kennzeichen in Serbien.'
    testimonialsHeading: Was Kunden sagen
    testimonials:
      - quote: „Wir haben einen BMW 3er aus München nach Belgrad geliefert bekommen. Alles lief reibungslos — von der Inspektion bis zur Zulassung. Wir haben eine Menge Nerven beim Papierkram gespart.“
        name: Александр
        caption: BMW 320d, Deutschland → Serbien
      - quote: „Ich habe lange nach einer Skoda Octavia in gutem Zustand gesucht. Die Jungs haben eine Option in Spanien gefunden, von einem unabhängigen Experten prüfen lassen — alles war wie beschrieben.“
        name: Михаил
        caption: Skoda Octavia, Spanien → Russland
      - quote: „Die Anmeldung auf ausländische Kennzeichen schien kompliziert. Das Team hat mir durch jeden Schritt geholfen — und nach einem Monat konnte ich schon fahren. Ich empfehle es.“
        name: Дмитрий
        caption: VW Passat, Deutschland → Serbien
    ctaEyebrow: Bereit anzufangen?
    ctaHeading:
      line1: Erzählen Sie uns
      line2: von Ihrem
      accentWord: Auto
    ctaSubtext: Wir antworten innerhalb von 2 Stunden. Die Beratung ist kostenlos.
    ctaTelegramLabel: Nachricht an Telegram senden
    ctaStatClients:
      value: 200+
      label: Kunden
    ctaStatCountries:
      label: Länder
    ctaStatYears:
      value: 5 Jahre
      label: Erfahrung
