  de:
    metaTitle: Autobeschaffung, Import und Rückkauf in Europa
    metaDescription: Autobeschaffung in Ihrem Land oder Import aus Europa und China – schlüsselfertig. Prüfung und Rückkauf. Wir arbeiten für Russischsprachige weltweit.
    journey:
      - title: Auswahl
        desc: Wir finden, prüfen und liefern das Auto passend zu Ihrem Budget – schlüsselfertig, in Deutschland, Spanien, Serbien und der Schweiz.
      - title: Import
        desc: Das Auto ist nicht in Ihrem Land? Wir wählen es aus und bringen es aus Deutschland, Europa oder China – schlüsselfertig, einschließlich Zollabwicklung.
      - title: Prüfung
        desc: Ein unabhängiger Experte inspiziert das Auto vor dem Kauf – über 100 Punkte mit Video.
        note: Haben Sie das Auto selbst gefunden? Wir führen die Prüfung separat durch.
      - title: Rückkauf
        desc: Wir kümmern uns um den Rückkauf und die Zollabwicklung des Fahrzeugs mit ausländischen Nummernschildern.
        note: Das Auto ist bereits im Ausland? Wir helfen Ihnen bei der Abwicklung.
    heroLine1: Gefunden.
    heroLine2: Geprüft.
    heroLine3: Geliefert.
    heroSubtext: Wir wählen, prüfen, bearbeiten und bringen Fahrzeuge aus Deutschland, Spanien oder Serbien. Ein Weg, ein Team.
