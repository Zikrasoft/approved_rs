translations:
  en:
    metaTitle: Car Sourcing, Imports and Buyouts Across Europe
    metaDescription: Find a car locally or import one from Europe or China, with everything handled for you. Inspections and buyouts. Operating across Europe.
    journey:
      - title: Sourcing
        desc: We find, inspect and deliver a car within your budget in Germany, Spain, Serbia and Switzerland, handling everything for you.
      - title: Importing
        desc: Is your car in another country? We'll find it and bring it over from Germany, elsewhere in Europe or China, handling everything, including customs clearance.
      - title: Inspection
        desc: An independent expert carries out a 100+ point pre-purchase inspection, complete with video.
        note: Found a car yourself? We can arrange a standalone inspection
      - title: Buyout
        desc: We handle the purchase and customs clearance of cars with foreign registration.
        note: Car already abroad? We'll help with the paperwork
    heroLine1: We'll find your car.
    heroLine2: Inspect it.
    heroLine3: Deliver it.
    heroSubtext: We'll find your car in Germany, Spain, Switzerland or Serbia. If it's in another country, we'll bring it to you, handling the inspection, paperwork and customs clearance.
    statClients:
      value: 200+
      label: clients
    statCountries:
      label: countries
    statYears:
      value: 5 years
      label: in business
    journeyHeading: One journey, from the search to the keys
    journeySubtext: Sourcing, importing, inspection and buyout aren't separate services. They're stages of your car's journey. You can join at any stage.
    whyUsHeading: Why choose us
    whyUsSubtext: Buying a car abroad raises questions. Here's how we put your mind at ease.
    trustCards:
      - title: Complete transparency
        text: We send you a detailed 100+ point checklist and video of every detail, covering the bodywork, interior and suspension. See the car as if you were standing beside it.
      - title: A secure purchase
        text: Staged payments and clear terms. We handle the paperwork at every stage, from purchase to customs clearance and registration. No surprises.
      - title: Local expertise
        text: 'We know what to look for in each market: German autobahn mileage, bodywork issues on Spanish cars and the finer points of foreign-registration paperwork in Serbia.'
    testimonialsHeading: What our clients say
    testimonials:
      - quote: '"They brought a BMW 3 Series from Munich to Belgrade. Everything went smoothly, from the inspection to registration. Saved me a lot of stress over the paperwork."'
        name: Alexander
        caption: BMW 320d, Germany → Serbia
      - quote: '"I''d been looking for a Skoda Octavia in good condition for ages. The team found one in Spain and had an independent expert inspect it. Everything matched the description."'
        name: Mikhail
        caption: Skoda Octavia, Spain → Russia
      - quote: '"The paperwork for foreign registration seemed complicated. The team guided me through every step, and a month later I was already driving. Highly recommended."'
        name: Dmitry
        caption: VW Passat, Germany → Serbia
    ctaEyebrow: Ready to get started?
    ctaHeading:
      line1: Tell us
      line2: about the car
      accentWord: you're looking for
    ctaSubtext: We reply within 2 hours. Your consultation is free.
    ctaTelegramLabel: Message us on Telegram
    ctaStatResponse:
      value: 2 hrs
      label: response time
    origin:
      heading: Where we source cars
      note: We can deliver to any country. Let's discuss it when you enquire
      euTitle: From Europe
      euText: Germany, Spain, Switzerland and elsewhere in Europe. We source locally, inspect before purchase, handle export paperwork, transport and customs clearance. You'll know the total cost before you buy, not after the car crosses the border.
      euCta: Get a quote for importing from Europe
      chinaTitle: From China
      chinaText: New and used cars from China through a trusted partner. We source within your budget, inspect before shipping, and handle delivery and customs clearance just as we do for European imports.
      chinaCta: Get a quote for importing from China
      chinaTags:
        - New
        - Used
        - Fully managed
    catalogue:
      heading: Recent purchases
      subtext: These aren't listings. Every car here has been sourced, inspected, cleared and handed over to its owner. The price shown is what they paid.
      allCountriesLabel: All countries
      moreLabel: Show {rest} more
    inspection:
      heading: A hundred checks. Four areas that make or break a deal.
      subtext: The checklist is long, but we usually advise against a purchase because of an issue in one of four areas. Tap a number on the diagram to see what our expert checks and what we've found.
      hint: Tap a number on the diagram
      ctaLabel: Book an inspection
      pointsLabel: 100+ checks
      mediaLabel: photos and video
      reportLabel: report before you decide
      zones:
        - title: Bodywork and paint
          text: Paint depth readings on every panel, body opening alignment, and signs of welding or filler. These reveal repairs the seller may have forgotten to mention.
          points:
            - Resprayed panels and paint touch-ups
            - Panel gaps and alignment after a collision
            - Corrosion in sills and wheel arches
            - Original glass and lights
        - title: Engine and gearbox
          text: Operating readings with the engine warm, gearbox adaptation values and stored fault codes. This is the most expensive area to repair and the most common reason to walk away.
          points:
            - Timing chain stretch
            - Leaks and oil seepage
            - Gearbox adaptation values and harsh shifts
            - Compression and exhaust smoke
          finding: 'A low-mileage 2025 BMW M340: diagnostics indicated around 20% timing chain stretch. We caught it before purchase, giving the client leverage to negotiate.'
        - title: Suspension and brakes
          text: An inspection on a lift to check for play and assess the suspension and brakes. German autobahn mileage and Balkan roads wear a car differently.
          points:
            - Play in suspension arms and ball joints
            - Leaking shock absorbers
            - Brake disc and pad wear
            - Steering rack and protective boots
        - title: Electronics, VIN and paperwork
          text: VIN-based service history, mileage tampering, electronic faults and legal checks for outstanding finance, registration restrictions and unresolved accident claims.
          points:
            - Mileage discrepancies in the vehicle history
            - Stored fault codes
            - Outstanding finance and registration restrictions
            - Unresolved accident and insurance claims
    findingLabel: 'What we found:'
    heroPhotoAlt: A saloon on a European motorway
    ctaPhotoAlt: Close-up of a car's clean bodywork and wheel
  sr:
    metaTitle: Pronalaženje, uvoz i otkup automobila u Evropi
    metaDescription: Pronalazimo auto u vašoj zemlji ili ga uvozimo iz Evrope i Kine po sistemu ključ u ruke. Provera auta pre kupovine i otkup. Radimo širom Evrope.
    journey:
      - title: Pronalaženje auta
        desc: Pronalazimo, proveravamo i isporučujemo auto prema vašem budžetu, po sistemu ključ u ruke, u Nemačkoj, Španiji, Srbiji i Švajcarskoj.
      - title: Uvoz
        desc: Auto nije u vašoj zemlji? Pronalazimo ga i dovozimo iz Nemačke, drugih evropskih zemalja ili Kine, po sistemu ključ u ruke, uz carinjenje.
      - title: Provera auta pre kupovine
        desc: Nezavisni stručnjak proverava više od 100 stavki na automobilu pre kupovine, uz video-snimke.
        note: Sami ste našli auto? Organizujemo i samo proveru
      - title: Otkup
        desc: Obavljamo otkup i carinjenje automobila sa stranim tablicama.
        note: Auto je već u inostranstvu? Pomoći ćemo oko papirologije
    heroLine1: Pronaći ćemo auto.
    heroLine2: Proverićemo ga.
    heroLine3: Dovešćemo ga.
    heroSubtext: Pronalazimo auto u Nemačkoj, Španiji, Švajcarskoj ili Srbiji. Ako je u drugoj zemlji, dovozimo ga do vas, uz proveru, papirologiju i carinjenje.
    statClients:
      value: 200+
      label: klijenata
    statCountries:
      label: zemalja
    statYears:
      value: 5 godina
      label: na tržištu
    journeyHeading: 'Jedan put: od potrage do ključeva'
    journeySubtext: Pronalaženje, uvoz, provera i otkup nisu odvojene usluge, već koraci na putu do vašeg automobila. Možete nam se obratiti u bilo kojoj fazi.
    whyUsHeading: Zašto nas biraju
    whyUsSubtext: Kupovina auta iz druge zemlje otvara mnoga pitanja. Evo kako ih rešavamo.
    trustCards:
      - title: Potpuna transparentnost
        text: 'Šaljemo detaljnu kontrolnu listu sa više od 100 stavki i video-snimke svakog detalja: karoserije, enterijera i trapa. Vidite auto kao da stojite pored njega.'
      - title: Sigurna kupovina
        text: 'Plaćanje po fazama i jasni uslovi. Vodimo računa o dokumentaciji u svakom koraku: kupovina, carinjenje i registracija. Bez iznenađenja.'
      - title: Poznavanje lokalnih tržišta
        text: 'Znamo osobenosti svakog tržišta: kilometražu sa nemačkih autoputeva, stanje karoserije automobila iz Španije i specifičnosti papirologije za vozila sa stranim tablicama u Srbiji.'
    testimonialsHeading: Šta kažu naši klijenti
    testimonials:
      - quote: „Dovezli su mi BMW serije 3 iz Minhena u Beograd. Sve je prošlo kako treba, od provere auta pre kupovine do registracije. Poštedeli su me gomile stresa oko papirologije.“
        name: Aleksandar
        caption: BMW 320d, Nemačka → Srbija
      - quote: „Dugo sam tražio Skoda Octavia u dobrom stanju. Momci su našli auto u Španiji, organizovali proveru kod nezavisnog stručnjaka i sve je bilo kao u opisu.“
        name: Mihailo
        caption: Skoda Octavia, Španija → Rusija
      - quote: „Papirologija za strane tablice delovala mi je komplikovano. Tim me je proveo kroz svaki korak i posle mesec dana već sam vozio. Sve preporuke.“
        name: Dmitrij
        caption: VW Passat, Nemačka → Srbija
    ctaEyebrow: Spremni da krenemo?
    ctaHeading:
      line1: Recite nam
      line2: kakav auto
      accentWord: tražite
    ctaSubtext: Odgovaramo u roku od 2 sata. Konsultacije su besplatne.
    ctaTelegramLabel: Pišite nam na Telegramu
    ctaStatResponse:
      value: 2 h
      label: rok za odgovor
    origin:
      heading: Odakle dovozimo automobile
      note: Dostavljamo u bilo koju zemlju. Detalje dogovaramo kada nam se javite
      euTitle: Iz Evrope
      euText: Nemačka, Španija, Švajcarska i druge evropske zemlje. Pronalazimo auto na licu mesta, radimo proveru auta pre kupovine, sređujemo izvoz, prevoz i carinjenje. Konačnu cenu znate pre kupovine, a ne tek posle prelaska granice.
      euCta: Izračunajte troškove uvoza iz Evrope
      chinaTitle: Iz Kine
      chinaText: Novi i polovni automobili iz Kine preko proverenog partnera. Pronalazimo auto prema vašem budžetu, proveravamo ga pre slanja i organizujemo prevoz i carinjenje, po istom principu kao za Evropu.
      chinaCta: Izračunajte troškove uvoza iz Kine
      chinaTags:
        - Novi
        - Polovni
        - Ključ u ruke
    catalogue:
      heading: Nedavne kupovine
      subtext: 'Ovo nisu oglasi: svaki auto smo pronašli, proverili, završili papirologiju i predali vlasniku. Prikazana je cena koju je kupac zaista platio.'
      allCountriesLabel: Sve zemlje
      moreLabel: Prikaži još {rest}
    inspection:
      heading: Sto stavki, četiri ključne oblasti
      subtext: Kontrolna lista je duga, ali razlozi da odustanete od kupovine gotovo uvek se kriju u jednoj od četiri oblasti. Kliknite na broj na šemi da vidite šta stručnjak proverava i šta smo tu već pronalazili.
      hint: Kliknite na broj na šemi
      ctaLabel: Zakažite proveru auta pre kupovine
      pointsLabel: 100+ stavki
      mediaLabel: fotografije i video-snimci
      reportLabel: izveštaj pre odluke
      zones:
        - title: Karoserija i lak
          text: Merenje debljine laka na svakom panelu, geometrija otvora, tragovi varenja i gitovanja. Tako otkrivamo popravke koje je prodavac prećutao.
          points:
            - Prefarbani i dofarbavani paneli
            - Zazori i geometrija posle udara
            - Korozija na pragovima i rubovima blatobrana
            - Originalnost stakala i svetlosnih sklopova
        - title: Motor i menjač
          text: Radni parametri zagrejanog motora, adaptacione vrednosti menjača i memorisane greške u upravljačkim jedinicama. Ovde su kvarovi najskuplji i najčešće su razlog za odustajanje od kupovine.
          points:
            - Istezanje razvodnog lanca
            - Curenje i orošavanje uljem
            - Adaptacione vrednosti i trzaji menjača
            - Kompresija i dim iz auspuha
          finding: 'BMW M340 iz 2025. sa malom kilometražom: dijagnostika je pokazala istezanje razvodnog lanca od oko 20 %. Otkrili smo to pre kupovine i klijent je dobio argument za pregovore o ceni.'
        - title: Trap i kočnice
          text: Pregled na dizalici, provera lufta, stanja oslanjanja i kočionog sistema. Kilometri na nemačkim autoputevima i balkanski putevi ne troše auto na isti način.
          points:
            - Luft u ramenima i kuglama
            - Curenje amortizera
            - Istrošenost diskova i pločica
            - Letva volana i manžetne
        - title: Elektronika, VIN i dokumentacija
          text: 'Servisna istorija po VIN broju, vraćena kilometraža, greške elektronike i pravni status: zaloga, zabrana registracije i nerešeni predmeti vezani za saobraćajne nezgode.'
          points:
            - Neslaganje kilometraže sa servisnom istorijom
            - Memorisane greške u upravljačkim jedinicama
            - Zaloga i zabrana registracije
            - Nerešeni predmeti nezgoda i zahtevi za naknadu štete
    findingLabel: 'Otkrili smo:'
    heroPhotoAlt: Limuzina na evropskom autoputu
    ctaPhotoAlt: Čista karoserija i točak automobila u krupnom planu
