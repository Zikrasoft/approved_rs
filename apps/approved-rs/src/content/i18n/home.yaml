        desc: Is the car not in your country? We will source and import it from Germany, Europe, or China — end-to-end, including customs clearance.
      - title: Inspection
        desc: An independent expert inspects the vehicle before purchase — over 100 points with video documentation.
        note: Found the car yourself? We can arrange an inspection separately.
      - title: Buyback
        desc: We handle the buyback and customs clearance for vehicles with foreign plates.
        note: Is the car already abroad? We can help with the paperwork.
