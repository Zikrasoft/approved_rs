            - Curenje i prozori
            - Prilagodbe i udarci menjača
            - Kompresija i dimenzionalnost
          finding: 'BMW M340 iz 2025. godine sa malo kilometara: dijagnostika je pokazala produžavanje lanca bregaste osovine od oko 20 %. Pronašli smo to pre transakcije — klijent je dobio argument za pregovaranje.'
        - title: Suspenzija i kočnice
          text: Podiznica, lučne osovine, stanje suspenzije i kočionog sistema. Nemački autobahanski kilometri i balkanske ceste troše automobil na različite načine.
          points:
            - Luže poluosovina i kugličnih
            - Curenje amortizera
            - Trošenje diskova i kočnica
            - Kuglična ležaja i zaptivke
        - title: Elektronika, VIN i dokumenti
          text: Servisna istorija prema VIN-u, izvrnuti kilometraži, greške u elektronici i pravna čistoća — hipoteka, zabrana registracije, otvoreni udesi.
          points:
