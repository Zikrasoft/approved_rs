translations:
  en:
    metaTitle: Car Sourcing, Import and Buyback in Europe
    metaDescription: Car sourcing in your country or import from Europe and China — turnkey. Inspection and buyback. Serving Russian speakers globally.
    journey:
      - title: Sourcing
        desc: We find, inspect, and deliver a car that fits your budget — turnkey, in Germany, Spain, Serbia, and Switzerland.
      - title: Import
        desc: Is the car not in your country? We'll find and bring it from Germany, Europe, or China — turnkey, including customs clearance.
      - title: Inspection
        desc: An independent expert inspects the car before purchase — over 100 points with video.
        note: Found the car yourself? We'll arrange a separate inspection.
      - title: Buyback
        desc: We handle the buyback and customs clearance for vehicles with foreign plates.
        note: Is the car already abroad? We'll help you with the paperwork.
    heroLine1: Found.
    heroLine2: Checked.
    heroLine3: Delivered.
    heroSubtext: We’ll find, inspect, process, and deliver your car from Germany, Spain, or Serbia. One journey, one team.
    statClients:
      value: 200+
      label: clients
    statCountries:
      label: countries
    statYears:
      value: 5 years
      label: in the market
    journeyHeading: 'One Journey: From Search to Keys'
    journeySubtext: Car sourcing, import, inspection, and buyback are not separate services but phases of your car's journey. You can start at any step.
    whyUsHeading: Why Choose Us
    whyUsSubtext: Buying a car from another country raises questions. Here’s how we address them.
    trustCards:
      - title: Complete Transparency
        text: 'We send a detailed checklist (over 100 points) and videos of every detail: body, interior, drivetrain. You see the car as if you were standing next to it.'
      - title: Transaction Security
        text: 'Staged payments and clear terms. We accompany documents throughout all stages: processing, customs, registration — no surprises.'
      - title: Local Expertise
        text: 'We know the specifics of each market: highway mileage in Germany, unique features of Spanish cars, nuances of registering foreign plates in Serbia.'
    ctaEyebrow: Ready to start?
    ctaHeading:
      line1: Tell us about your
      line2: car
      accentWord: automobile
    ctaSubtext: We respond within 2 hours. Consultation is free.
    ctaTelegramLabel: Message on Telegram
    ctaStatClients:
      value: 200+
      label: clients
    ctaStatCountries:
      label: countries
    ctaStatYears:
      value: 5 years
      label: experience
    ctaStatResponse:
      value: 2 hr
      label: response
    origin:
      heading: Where We Source From
      note: We can deliver to any country — let's discuss during your inquiry.
      euTitle: From Europe
      euText: Germany, Spain, Switzerland, and other European countries. We source locally, inspect before purchase, handle export, and take care of customs. We provide the total cost before the deal, not after the border.
      euCta: Calculate import from Europe
      chinaTitle: From China
      chinaText: New and used cars from China through a trusted partner. Sourcing to your budget, inspection before shipment, and customs — following the same process as Europe.
      chinaCta: Calculate import from China
      chinaTags:
        - New
        - Used
        - Turnkey
    catalogue:
      heading: What You Can Get for This Budget
      subtext: 'There are no listings here: every car is found, inspected, processed, and handed over to a client. The price is what they paid.'
      budgetLabel: Budget for the car, up to
      allCountriesLabel: All countries
      countTemplate: '{shown} of {total} match'
      moreLabel: Show more {rest}
      emptyText: In this budget for the selected country, we haven't closed any deals yet. Reach out — we'll honestly tell you what's realistically available.
    inspection:
      heading: One Hundred Points, Four Key Areas
      subtext: The checklist is long, but almost always, deals are declined for reasons in one of four areas. Click on the number in the diagram — we’ll show you what the expert checks and what we’ve found.
      hint: Click the number on the diagram
      ctaLabel: Order Inspection
      pointsLabel: 100+ points
      mediaLabel: photos and videos
      reportLabel: report before decision
      zones:
        - title: Body and Paint
          text: Thickness readings on each panel, geometry of openings, signs of welding and fillers. This reveals whether repairs have been made that the seller forgot to mention.
          points:
            - Repainting and touch-ups on panels
            - Gaps and geometry post-impact
            - Corrosion in sills and arches
            - Originality of glasses and optics
        - title: Engine and Transmission
          text: Parameters when the engine is warmed up, transmission adaptations, errors in block memory. This is the most expensive area — and the most common reason for rejection.
          points:
            - Timing chain stretch
            - Leaks and weeping
            - Adaptations and transmission jerks
            - Compression and smoke issues
          finding: '2025 BMW M340 with low mileage: diagnostics showed timing chain stretch of about 20%. We found this before the deal — giving the client a bargaining chip.'
        - title: Suspension and Brakes
          text: Lift, play, condition of the suspension and brake system. German highway mileage and Balkan roads wear a car differently.
          points:
            - Play in control arms and ball joints
            - Leaking shock absorbers
            - Wear on discs and pads
            - Steering rack and boots
        - title: Electronics, VIN, and Documents
          text: Service history by VIN, tampered mileage, electronic errors, and legal cleanliness — pledges, registration bans, unresolved accidents.
          points:
            - Mileage discrepancies with history
            - Errors in block memory
            - Pledges and registration bans
            - Unresolved accidents and insurance claims
    findingLabel: 'Found:'
    heroPhotoAlt: Ineos Grenadier sourced in Germany and handed over to the client
    ctaPhotoAlt: Close-up of a clean car body and wheel
