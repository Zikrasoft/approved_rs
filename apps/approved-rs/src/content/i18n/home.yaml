    inspection:
      heading: Sto tačaka, od kojih se četiri odlučuju
      subtext: Kontrolna lista je dugačka, ali gotovo uvek se od posla odustaje zbog jedne od četiri zone. Kliknite na broj na šemi — pokažaćemo šta ekspert gleda i šta smo tu otkrili.
