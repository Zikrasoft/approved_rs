catalogue:
  heading: Последние сделки
  subtext: 'Здесь нет объявлений: каждая машина найдена, проверена, оформлена и передана человеку. Цена — та, которую он заплатил.'
  allCountriesLabel: Все страны
  moreLabel: 'Показать ещё {rest}'
inspection:
  heading: Сто пунктов, из которых решают четыре
  subtext: Чек-лист длинный, но от сделки отговаривают почти всегда по одной из четырёх зон. Нажмите номер на схеме — покажем, что смотрит эксперт и что мы там находили.
  hint: Нажмите номер на схеме
  ctaLabel: Заказать проверку
  pointsLabel: 100+ пунктов
  mediaLabel: фото и видео
  reportLabel: отчёт до решения
  zones:
    - title: Кузов и лакокрасочное покрытие
      text: Толщиномер по каждой панели, геометрия проёмов, следы сварки и шпаклёвки. Отсюда видно, был ли ремонт, о котором продавец забыл.
      points:
        - Перекрас и подкрас панелей
        - Зазоры и геометрия после удара
        - Коррозия в порогах и арках
        - Оригинальность стёкол и оптики
    - title: Двигатель и коробка
      text: Параметры на прогретом моторе, адаптации коробки, ошибки в памяти блоков. Самая дорогая зона — и самая частая причина отказа.
      points:
        - Растяжение цепи ГРМ
        - Течи и запотевания
        - Адаптации и толчки коробки
        - Компрессия и дымность
      finding: >-
        BMW M340 2025 года с небольшим пробегом: диагностика показала растяжение цепи ГРМ около 20 %. Нашли до сделки — у клиента появился аргумент для торга.
    - title: Ходовая и тормоза
      text: Подъёмник, люфты, состояние подвески и тормозной системы. Немецкий автобанный пробег и балканские дороги изнашивают машину по-разному.
      points:
        - Люфты рычагов и шаровых
        - Течь амортизаторов
        - Износ дисков и колодок
        - Рулевая рейка и пыльники
    - title: Электроника, VIN и документы
      text: Сервисная история по VIN, скрученный пробег, ошибки электроники и юридическая чистота — залог, запрет регистрации, незакрытые ДТП.
      points:
        - Расхождение пробега с историей
        - Ошибки в памяти блоков
        - Залог и запрет на регистрацию
        - Незакрытые ДТП и страховые события
