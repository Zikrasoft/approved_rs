    catalogue:
      heading: Poslednje realizovane kupovine
      subtext: 'Ovo nisu oglasi: svaki automobil smo pronašli, proverili, sredili dokumentaciju i predali vlasniku. Prikazana je cena koju je platio.'
      allCountriesLabel: Sve zemlje
      moreLabel: Prikaži još {rest}
    inspection:
      heading: Od 100 tačaka, četiri najčešće presude
      subtext: Kontrolna lista je duga, ali se od kupovine najčešće odustaje zbog problema u jednoj od četiri oblasti. Kliknite na broj na šemi i pokazaćemo šta stručnjak proverava i šta smo tamo otkrili.
      hint: Kliknite na broj na šemi
      ctaLabel: Naručite proveru
      pointsLabel: 100+ tačaka
      mediaLabel: fotografije i video
      reportLabel: izveštaj pre odluke
      zones:
        - title: Karoserija i lak
          text: Merač debljine laka za svaki panel, geometrija otvora, tragovi varenja i gitovanja. Tako se vidi da li je automobil popravljan, a da prodavac to nije pomenuo.
          points:
            - Delovi karoserije koji su ponovo lakirani
            - Razmaci između panela i geometrija nakon sudara
            - Korozija na pragovima i u rubovima blatobrana
            - Da li su stakla i svetla originalni
        - title: Motor i menjač
          text: Parametri zagrejanog motora, adaptacije menjača i greške sačuvane u upravljačkim jedinicama. Ovo je najskuplja oblast i najčešći razlog za odustajanje od kupovine.
          points:
            - Istezanje lanca razvoda
            - Curenje i orošavanje uljem
            - Adaptacije menjača i trzaji
            - Kompresija i dim iz izduva
          finding: 'BMW M340 iz 2025. sa malom kilometražom: dijagnostika je pokazala da je lanac razvoda istegnut oko 20%. Otkrili smo to pre kupovine, što je klijentu dalo osnov za pregovore o ceni.'
        - title: Trap i kočnice
          text: Pregled na dizalici, zazori, stanje vešanja i kočionog sistema. Vožnja po nemačkim autoputevima i balkanskim putevima različito troši automobil.
          points:
            - Zazori na ramenima i kuglama
            - Curenje amortizera
            - Istrošenost diskova i pločica
            - Letva volana i manžetne
        - title: Elektronika, VIN i dokumentacija
          text: 'Servisna istorija prema VIN-u, vraćena kilometraža, greške elektronike i pravna provera: zaloga, zabrana registracije i nerešene saobraćajne nezgode.'
          points:
            - Nepoklapanje kilometraže sa servisnom istorijom
            - Greške sačuvane u upravljačkim jedinicama
            - Zaloga i zabrana registracije
            - Nerešene saobraćajne nezgode i osiguravajući slučajevi
