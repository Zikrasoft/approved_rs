translations:
  en:
    metaTitle: Car Sourcing, Import, and Buyback in Europe
    metaDescription: Car sourcing in your country or importing from Europe and China — all-inclusive. Inspection and buyback. Serving across Europe.
    journey:
      - title: Sourcing
        desc: We find, inspect, and deliver the car that fits your budget — all-inclusive, in Germany, Spain, Serbia, and Switzerland.
      - title: Import
        desc: Is the car not in your country? We'll source and bring it from Germany, Europe, or China — all-inclusive, including customs clearance.
      - title: Inspection
        desc: An independent expert inspects the vehicle before purchase — over 100 points with video.
        note: Found the car yourself? We can request a separate inspection.
      - title: Buyback
        desc: We handle the buyback and customs clearance of cars with foreign plates.
        note: The car already abroad? We’ll assist with the paperwork.
    heroLine1: We'll find the car.
    heroLine2: We'll inspect it.
    heroLine3: We'll deliver it.
    heroSubtext: We'll source a car from Germany, Spain, Switzerland, or Serbia, and if it's in another country, we’ll bring it to you with inspection, paperwork, and customs clearance.
    statClients:
      value: 200+
      label: clients
    statCountries:
      label: countries
    statYears:
      value: 5 years
      label: in the market
    journeyHeading: 'One journey: from search to keys'
    journeySubtext: Car sourcing, import, inspection, and buyback — not different services, but stages of one journey for your vehicle. You can start at any step.
    whyUsHeading: Why choose us
    whyUsSubtext: Buying a car from another country raises questions. Here’s how we address them.
    trustCards:
      - title: Complete Transparency
        text: 'We send a detailed checklist (100+ points) and video of every detail: body, interior, drivetrain. You see the car as if you were standing next to it.'
      - title: Transaction Safety
        text: 'Step-by-step payment and clear terms. We guide the paperwork at every stage: registration, customs clearance, registration — no surprises.'
      - title: Local Expertise
        text: 'We know the specifics of each market: autobahn mileage in Germany, Spanish car body specifics, nuances of registering foreign plates in Serbia.'
    testimonialsHeading: What clients say
    testimonials:
      - quote: “They delivered a BMW 3 Series from Munich to Belgrade. Everything was clear — from inspection to registration. I saved a lot of stress on the paperwork.”
        name: Александр
        caption: BMW 320d, Germany → Serbia
      - quote: “I was looking for a Skoda Octavia in good condition for a long time. They found a great option in Spain and had it inspected by an independent expert — everything matched the description.”
        name: Михаил
        caption: Skoda Octavia, Spain → Russia
      - quote: “Registering with foreign plates seemed complicated. The team guided me through every step — and within a month, I was driving. I recommend them.”
        name: Дмитрий
        caption: VW Passat, Germany → Serbia
    ctaEyebrow: Ready to get started?
    ctaHeading:
      line1: Tell us
      line2: about the car
      accentWord: you are looking for
    ctaSubtext: We respond within 2 hours. Consultation is free.
    ctaTelegramLabel: Message us on Telegram
    ctaStatResponse:
      value: 2 hours
      label: response
    origin:
      heading: Where we source from
      note: We deliver to any country — let's discuss upon your request
      euTitle: From Europe
      euText: Germany, Spain, Switzerland, and other European countries. We source on-site, inspect before purchase, handle export, delivery, and customs clearance. The final amount is provided before the transaction, not after crossing the border.
      euCta: Calculate import from Europe
      chinaTitle: From China
      chinaText: New and used cars from China through a trusted partner. Sourcing within your budget, inspection before shipment, delivery, and customs clearance — following the same process as with Europe.
      chinaCta: Calculate import from China
      chinaTags:
        - New
        - Used
        - All-inclusive
    catalogue:
      heading: Latest Transactions
      subtext: 'There are no ads here: every car is found, inspected, processed, and handed over to the client. The price is the one they paid.'
      allCountriesLabel: All countries
      moreLabel: Show more {rest}
    inspection:
      heading: One hundred points, out of which four are decisive
      subtext: The checklist is long, but clients are usually deterred by one of four zones. Click on the number in the diagram — we’ll show you what the expert checks and what we found.
      hint: Click the number on the diagram
      ctaLabel: Order inspection
      pointsLabel: 100+ points
      mediaLabel: photos and videos
      reportLabel: report before decision
      zones:
        - title: Body and Paint
          text: Thickness measurement on each panel, geometry of openings, signs of welding and body filler. This reveals any repairs the seller may have omitted.
          points:
            - Repainting and touch-ups
            - Gaps and geometry after a collision
            - Rust in thresholds and arches
            - Originality of glass and optics
        - title: Engine and Transmission
          text: Parameters on a warmed engine, transmission adaptations, error codes in the memory. This is the most expensive zone — and the most common reason for refusal.
          points:
            - Timing chain stretch
            - Leaks and seeps
            - Transmission adaptations and jerks
            - Compression and smoke levels
          finding: '2025 BMW M340 with low mileage: diagnostics revealed timing chain stretch of about 20%. Found before the deal — the client had leverage for negotiation.'
        - title: Suspension and Brakes
          text: Lifts, play, condition of the suspension and braking system. German autobahn mileage and Balkan roads wear down cars differently.
          points:
            - Play in control arms and ball joints
            - Leaking shock absorbers
            - Wear on discs and pads
            - Steering rack and boots
        - title: Electronics, VIN, and Documents
          text: Service history by VIN, odometer tampering, electronic errors, and legal issues — liens, registration bans, unresolved accidents.
          points:
            - Mileage discrepancy with history
            - Error codes in the memory
            - Liens and registration bans
            - Unresolved accidents and insurance claims
    findingLabel: 'Found:'
    heroPhotoAlt: Sedan on a European highway
    ctaPhotoAlt: Clean car body and wheel close-up
  sr:
    metaTitle: Izbor, uvoz i otkup automobila u Evropi
    metaDescription: Izbor automobila u zemlji ili uvoz iz Evrope i Kine — sve uključeno. Provera i otkup. Radimo širom Evrope.
    journey:
      - title: Izbor
        desc: Pronalaženje, provera i dostava automobila u okviru vašeg budžeta — sve uključeno, u Nemačkoj, Španiji, Srbiji i Švajcarskoj.
      - title: Uvoz
        desc: Auto nije u vašoj zemlji? Pomoći ćemo da ga izaberemo i dovedemo iz Nemačke, Evrope ili Kine — sve uključeno, uključujući carinjenje.
      - title: Provera
        desc: Nezavisni ekspert pregledava automobil pre kupovine — po 100+ tačaka sa videom.
        note: Našli ste auto sami? Moguće je naručiti provere posebno
      - title: Otkup
        desc: Obrađujemo otkup i carinjenje automobila sa stranim registarskim tablicama.
        note: Auto je već u inostranstvu? Pomoći ćemo vam da ga obradite
    heroLine1: Naći ćemo auto.
    heroLine2: Proverićemo.
    heroLine3: Dovešćemo.
    heroSubtext: Izaberi auto u Nemačkoj, Španiji, Švajcarskoj ili Srbiji, a ako je u drugoj zemlji, dovešćemo ga uz provere, obradu i carinjenje.
    statClients:
      value: 200+
      label: klijenata
    statCountries:
      label: zemalja
    statYears:
      value: 5 godina
      label: na tržištu
    journeyHeading: 'Jedan put: od pretrage do ključeva'
    journeySubtext: Izbor, uvoz, provera i otkup — nisu različite usluge, već faze jednog putovanja vašeg automobila. Možete započeti sa bilo kojom fazom.
    whyUsHeading: Zašto nas izabiraju
    whyUsSubtext: Kupovina automobila iz druge zemlje postavlja pitanja. Evo kako ih rešavamo.
    trustCards:
      - title: Potpuna transparentnost
        text: 'Šaljemo detaljan ček-list (100+ tačaka) i video svakog detalja: karoserija, enterijer, podvozje. Vidite automobil kao da stojite pored njega.'
      - title: Bezbednost transakcije
        text: 'Postepeno plaćanje i jasni uslovi. Pomažemo sa dokumentima na svim fazama: obrada, carinjenje, registracija — bez iznenađenja.'
      - title: Lokalna ekspertiza
        text: 'Znamo specifičnosti svakog tržišta: kilometraže na nemačkim autoputevima, karakteristike karoserije španskih automobila, detalje o obradi stranih registarskih tablica u Srbiji.'
    testimonialsHeading: Šta kažu klijenti
    testimonials:
      - quote: «Dovezli su BMW 3 serije iz Minhena u Beograd. Sve je bilo jasno — od pregleda do registracije. Uštedeli smo puno nerviranja oko obrade.»
        name: Aleksandar
        caption: BMW 320d, Nemačka → Srbija
      - quote: «Dugo sam tražio Škodu Octaviu u dobrom stanju. Ekipa je našla opciju u Španiji, proverili su je nezavisnim ekspertom — sve se poklopilo sa opisom.»
        name: Mihail
        caption: Škoda Octavia, Španija → Rusija
      - quote: «Obrada stranih registarskih tablica delovala je komplikovano. Tim je vodio kroz svaki korak — i već za mesec dana sam vozio. Preporučujem.»
        name: Dmitrij
        caption: VW Passat, Nemačka → Srbija
    ctaEyebrow: Spremni za početak?
    ctaHeading:
      line1: Recite nam
      line2: o kolima,
      accentWord: koje tražite
    ctaSubtext: Odgovaramo u roku od 2 sata. Konsultacije su besplatne.
    ctaTelegramLabel: Pitajte na Telegramu
    ctaStatResponse:
      value: 2 h
      label: odgovor
    origin:
      heading: Odakle uvozimo
      note: Dovešćemo u svaku zemlju — raspravimo to prilikom prijave
      euTitle: Iz Evrope
      euText: Nemačka, Španija, Švajcarska i druge zemlje Evrope. Izbor na licu mesta, provere pre kupovine, obrada izvoza, transport i carinjenje. Konačnu cenu nazivamo pre transakcije, a ne posle prelaska granice.
      euCta: Izračunajte uvoz iz Evrope
      chinaTitle: Iz Kine
      chinaText: Novi i polovni automobili iz Kine kroz proverenog partnera. Izbor prema vašem budžetu, provera pre slanja, dostava i carinjenje — istim redosledom kao i za Evropu.
      chinaCta: Izračunajte uvoz iz Kine
      chinaTags:
        - Novi
        - Sa pređenim kilometrima
        - Sve uključeno
    catalogue:
      heading: Poslednje transakcije
      subtext: 'Ovde nema oglasa: svaki auto je pronađen, proveren, obrađen i predat osobi. Cena je ona koju je platio.'
      allCountriesLabel: Sve zemlje
      moreLabel: Prikaži još {rest}
    inspection:
      heading: Sto tačaka, kroz koje se odlučuje kao po četiri
      subtext: Ček-lista je duga, ali se gotovo uvek zbog jedne od četiri oblasti nailazi na odbijanje transakcije. Kliknite broj na šemi — pokazaćemo šta ekspert gleda i šta smo tamo našli.
      hint: Kliknite broj na šemi
      ctaLabel: Naručite proveru
      pointsLabel: 100+ tačaka
      mediaLabel: fotografije i video
      reportLabel: izveštaj do odluke
      zones:
        - title: Karoserija i zaštita od korozije
          text: Merenje debljine po svakoj panele, geometrija otvora, tragovi varenja i kitovanja. Odatle se može videti da li je bilo popravke o kojoj prodavac nije obavestio.
          points:
            - Lakat i prelakiranje panela
            - Udaljenosti i geometrija posle udarca
            - Korozija u pragovima i lukovima
            - Originalnost stakala i svetala
        - title: Motor i menjač
          text: Parametri na zagrejanom motoru, adaptacije menjača, greške u memoriji blokova. Najskuplja oblast — i najčešći razlog odbijanja.
          points:
            - Produženje lanca GRM
            - Curenje i vlažnost
            - Adaptacije i trzaji menjača
            - Kompresija i dim
          finding: 'BMW M340 iz 2025. godine sa malim pređenim kilometrima: dijagnostika je pokazala produženje lanca GRM oko 20 %. Pronašli smo to pre transakcije — klijent je dobio argument za pregovaranje.'
        - title: Podvozje i kočnice
          text: Dizalica, lufozi, stanje podvozja i sistema kočenja. Nemačka kilometraža na autoputima i balkanske ceste drugačije troše automobile.
          points:
            - Lufozi rukava i kuglica
            - Curenje amortizera
            - Habanje diskova i pločica
            - Kormilo i zaštite
        - title: Elektronika, VIN i dokumenti
          text: Servisna istorija po VIN-u, prevrnuta kilometraža, greške elektronike i pravna ispravnost — zalozi, zabrane registracije, neusaglašeni sudski slučajevi.
          points:
            - Neslaganje kilometraže sa istorijom
            - Greške u memoriji blokova
            - Zalozi i zabrana registracije
            - Neusaglašeni sudski slučajevi i osiguravajući događaji
    findingLabel: 'Pronašli smo:'
    heroPhotoAlt: Sedan na evropskom autoputu
    ctaPhotoAlt: Čista karoserija i točak automobila izbliza
