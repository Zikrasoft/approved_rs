      subtext: 'Aquí no hay anuncios: cada auto ha sido encontrado, verificado, gestionado y entregado a una persona. El precio es el que realmente pagó.'
      budgetLabel: Presupuesto para el auto, hasta
      allCountriesLabel: Todos los países
