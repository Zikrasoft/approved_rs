translations:
  en:
    metaTitle: Car Sourcing, Import and Buyback in Europe
    metaDescription: Car sourcing in your country or importing from Europe and China, fully managed. Inspection and buyback. We operate across all of Europe.
    journey:
      - title: Sourcing
        desc: We find, inspect, and deliver a car tailored to your budget, fully managed in Germany, Spain, Serbia, and Switzerland.
      - title: Importing
        desc: Is the car not in your country? We'll find and bring it from Germany, Europe, or China—fully managed, including customs clearance.
      - title: Inspection
        desc: An independent expert inspects the car before purchase—covering 100+ points with video.
        note: Found the car yourself? We can provide inspection separately.
      - title: Buyback
        desc: We handle the buyback and customs clearance for vehicles with foreign plates.
        note: Is the vehicle already abroad? We can help with the paperwork.
    heroLine1: We will find the car.
    heroLine2: We will inspect it.
    heroLine3: We will deliver it.
    heroSubtext: We will source a car in Germany, Spain, Switzerland, or Serbia, and if it’s in another country, we’ll bring it to you with inspection, paperwork, and customs clearance.
    statClients:
      value: 200+
      label: clients
    statCountries:
      label: countries
    statYears:
      value: 5 years
      label: in the market
    journeyHeading: 'One Journey: From Search to Keys'
    journeySubtext: Car sourcing, importing, inspection, and buyback aren't separate services but stages of your car's journey. You can enter at any step.
    whyUsHeading: Why Choose Us
    whyUsSubtext: Buying a car from another country raises questions. Here’s how we address them.
    trustCards:
      - title: Full Transparency
        text: 'We provide a detailed checklist (100+ points) and videos of every detail: bodywork, interior, undercarriage. You see the car as if you stood next to it.'
      - title: Safe Transactions
        text: 'Staged payments and clear conditions. We guide you through the paperwork at every stage: registration, customs clearance—no surprises.'
      - title: Local Expertise
        text: 'We know the specifics of each market: highway mileage in Germany, body features of Spanish cars, nuances of registering foreign plates in Serbia.'
    testimonialsHeading: What Our Clients Say
    testimonials:
      - quote: «They brought a BMW 3 Series from Munich to Belgrade. Everything was organized—from inspection to registration. Saved me a lot of hassle with the paperwork.»
        name: Александр
        caption: BMW 320d, Germany → Serbia
      - quote: «I spent a long time looking for a Skoda Octavia in good condition. These guys found an option in Spain, inspected it with an independent expert—it matched the description perfectly.»
        name: Михаил
        caption: Skoda Octavia, Spain → Russia
      - quote: «Registering foreign plates seemed complicated. The team guided me through every step—and within a month I was driving. Highly recommended.»
        name: Дмитрий
        caption: VW Passat, Germany → Serbia
    ctaEyebrow: Ready to get started?
    ctaHeading:
      line1: Tell us
      line2: about the car,
      accentWord: you’re looking for
    ctaSubtext: We’ll respond within 2 hours. Consultation is free.
    ctaTelegramLabel: Message on Telegram
    ctaStatResponse:
      value: 2 hrs
      label: response
    origin:
      heading: Where We Source From
      note: We can deliver to any country—discuss when you apply.
      euTitle: From Europe
      euText: Germany, Spain, Switzerland, and other European countries. We source locally, inspect before purchase, handle export paperwork, delivery, and customs clearance. The final price is quoted before the deal, not after crossing the border.
      euCta: Calculate import from Europe
      chinaTitle: From China
      chinaText: New and used vehicles from China through a trusted partner. Sourcing within your budget, pre-shipment inspection, delivery, and customs clearance—the same process as for Europe.
      chinaCta: Calculate import from China
      chinaTags:
        - New
        - Used
        - Fully managed
    catalogue:
      heading: Recent Deals
      subtext: 'There are no ads here: every car is found, inspected, documented, and delivered to a person. The price is what they paid.'
      allCountriesLabel: All Countries
      moreLabel: Show more {rest}
    inspection:
      heading: One Hundred Points, Four Key Areas
      subtext: The checklist is long, but nearly all deals fall through due to issues in one of four areas. Click a number on the diagram to see what the expert inspects and the issues we’ve identified.
      hint: Click a number on the diagram
      ctaLabel: Order Inspection
      pointsLabel: 100+ points
      mediaLabel: photos and videos
      reportLabel: report before decision
      zones:
        - title: Body and Paintwork
          text: Thickness measurements for each panel, gap geometry, signs of welding and body filler. This reveals whether there has been any repair the seller did not mention.
          points:
            - Repaint and touch-ups on panels
            - Gaps and geometry post-impact
            - Corrosion in sills and wheel arches
            - Authenticity of glass and optics
        - title: Engine and Transmission
          text: Parameters from a warmed-up engine, transmission adaptations, error codes in memory. This is the most expensive area and the most common reason for rejection.
          points:
            - Wear on the timing chain
            - Leaks and weeping
            - Adaptations and transmission jerks
            - Compression and smoke levels
          finding: '2025 BMW M340 with low mileage: diagnostics showed a timing chain wear of about 20%. Identified before the deal—gave the client leverage for negotiation.'
        - title: Suspension and Brakes
          text: Lift, play, condition of the suspension and braking system. German autobahn mileage and Balkan roads wear a car differently.
          points:
            - Play in the control arms and ball joints
            - Shock absorber leaks
            - Wear on discs and pads
            - Steering rack and bellows
        - title: Electronics, VIN, and Documents
          text: Service history by VIN, odometer fraud, electronic errors, and legal cleanliness—mortgages, registration restrictions, unresolved accidents.
          points:
            - Discrepancies in mileage with history
            - Errors in control unit memory
            - Mortgages and registration bans
            - Unresolved accidents and insurance claims
    findingLabel: 'Identified:'
    heroPhotoAlt: Sedan on a European highway
    ctaPhotoAlt: Clean body and wheel of a car close-up
  sr:
    metaTitle: Sourcing, uvoz i otkup automobila iz Evrope
    metaDescription: Sourcing automobila u svojoj zemlji ili uvoz automobila iz Evrope i Kine — pod ključ. Provera i otkup. Radimo u celoj Evropi.
    journey:
      - title: Sourcing
        desc: Nalazimo, proveravamo i dostavljamo automobil prema vašem budžetu — pod ključ, u Nemačkoj, Španiji, Srbiji i Švajcarskoj.
      - title: Uvoz
        desc: Automobil nije u vašoj zemlji? Pronaći ćemo i dovesti ga iz Nemačke, Evrope ili Kine — pod ključ, uključujući carinjenje.
      - title: Provera
        desc: Nezavisni stručnjak pregledava automobil pre kupovine — po 100+ tačaka sa videom.
        note: Pronašli ste auto sami? Naručujemo provere odvojeno.
      - title: Otkup
        desc: Obrađujemo otkup i carinjenje automobila sa stranim registarskim oznakama.
        note: Automobil je već u inostranstvu? Pomoći ćemo da se pravilno obradi.
    heroLine1: Naći ćemo automobil.
    heroLine2: Proverićemo.
    heroLine3: Dovesti ćemo.
    heroSubtext: Pronaći ćemo automobil u Nemačkoj, Španiji, Švajcarskoj ili Srbiji, a ako je u drugoj zemlji, dovešćemo ga uz provere, obradu i carinjenje.
    statClients:
      value: 200+
      label: klijenata
    statCountries:
      label: zemalja
    statYears:
      value: 5 godina
      label: na tržištu
    journeyHeading: 'Jedan put: od pretrage do ključeva'
    journeySubtext: Sourcing, uvoz, provera i otkup — nisu različite usluge, već faze jednog putovanja vašeg automobila. Možete da uđete sa bilo koje tačke.
    whyUsHeading: Zašto nas biraju
    whyUsSubtext: Kupovina automobila iz druge zemlje postavlja pitanja. Evo kako ih rešavamo.
    trustCards:
      - title: Potpuna transparentnost
        text: 'Šaljemo detaljnu listu provere (100+ tačaka) i video svakog detalja: karoserija, enterijer, mehanika. Vidite automobil kao da ste pored njega.'
      - title: Sigurnost transakcije
        text: 'Postepeno plaćanje i jasni uslovi. Pratimo dokumente u svim fazama: obrada, carinjenje, registracija — bez iznenađenja.'
      - title: Lokalna stručnost
        text: 'Znamo specifičnosti svakog tržišta: kilometraža na nemačkim autoputevima, karakteristike karoserija španskih automobila, nijanse obrade na stranim registarskim oznakama u Srbiji.'
    testimonialsHeading: Šta kažu klijenti
    testimonials:
      - quote: «Doveli su BMW serije 3 iz Minhena u Beograd. Sve jasno — od provere do registracije. Uštedeli smo gomilu živaca pri obradi.»
        name: Aleksandar
        caption: BMW 320d, Nemačka → Srbija
      - quote: «Dugo sam tražio Škodu Octaviu u dobrom stanju. Momci su našli opciju u Španiji, proverili nezavisnim stručnjakom — sve se poklopilo sa opisom.»
        name: Mihail
        caption: Škoda Octavia, Španija → Rusija
      - quote: «Obrada stranih registarskih oznaka delovala je komplikovano. Tim je prošao kroz svaki korak — i mesec dana kasnije već sam vozio. Preporučujem.»
        name: Dmitrij
        caption: VW Passat, Nemačka → Srbija
    ctaEyebrow: Spremni da počnete?
    ctaHeading:
      line1: Podelite sa nama
      line2: o automobilu,
      accentWord: koji tražite
    ctaSubtext: Odgovaramo u roku od 2 sata. Konsultacija je besplatna.
    ctaTelegramLabel: Pisati na Telegram
    ctaStatResponse:
      value: 2 č
      label: odgovor
    origin:
      heading: Odakle uvozimo
      note: Dovesti ćemo u svaku zemlju — razgovaraćemo pri prijavi
      euTitle: Iz Evrope
      euText: Nemačka, Španija, Švajcarska i druge zemlje Evrope. Pronalazimo na licu mesta, proveravamo pre kupovine, obrađujemo izvoz, dovodimo i carinimo. Konačnu cenu navodimo pre transakcije, a ne nakon prelaska granice.
      euCta: Izračunati uvoz iz Evrope
      chinaTitle: Iz Kine
      chinaText: Novi i polovni automobili iz Kine preko proverenog partnera. Sourcing prema vašem budžetu, provera pre slanja, dostava i carinjenje — istim redosledom kao i za Evropu.
      chinaCta: Izračunati uvoz iz Kine
      chinaTags:
        - Novi
        - Sa pređenim kilometrima
        - Pod ključ
    catalogue:
      heading: Poslednje transakcije
      subtext: 'Ovde nema oglasa: svaki automobil je pronađen, proveran, obrađen i predat osobi. Cena je ona koju je platio.'
      allCountriesLabel: Sve zemlje
      moreLabel: Prikaži još {rest}
    inspection:
      heading: Sto tačaka, od kojih se odlučuje po četiri
      subtext: Lista provere je duga, ali se transakcije gotovo uvek otkazuju zbog jedne od četiri oblasti. Pritisnite broj na šemi — pokazaćemo šta stručnjak proverava i šta smo tu našli.
      hint: Pritisnite broj na šemi
      ctaLabel: Naručiti provere
      pointsLabel: 100+ tačaka
      mediaLabel: foto i video
      reportLabel: izveštaj pre odluke
      zones:
        - title: Karoserija i lak
          text: Mera debljine po svakom panelu, geometrija otvora, tragovi zavarivanja i kitovanja. Odatle se vidi da li je bilo popravki o kojima prodavac nije obavestio.
          points:
            - Prebojanost i popravke panela
            - Prolazi i geometrija nakon udara
            - Korozija u pragovima i točkovima
            - Originalnost stakala i svetala
        - title: Motor i menjač
          text: Parametri na zagrijanom motoru, adaptacije menjača, greške u memoriji modula. Najskuplja zona — i najčešći razlog odbijanja.
          points:
            - Produžetak lanca TIMING
            - Curenja i zamućenja
            - Adaptacije i trzaji menjača
            - Kompresija i dimljenje
          finding: 'BMW M340 2025. godine sa malom kilometražom: dijagnostika je pokazala produženje lanca TIMING od oko 20 %. Pronađeno pre transakcije — klijent je dobio argument za pregovaranje.'
        - title: Mehanika i kočnice
          text: Podizanje, luftovi, stanje ovjšenog dela i kočionog sistema. Nemačka kilometraža i balkanske ceste troše automobil na različite načine.
          points:
            - Luftovi u rukama i kuglama
            - Curenje amotizera
            - Habanje diskova i obloga
            - Upravljačka letva i prašnici
        - title: Elektronika, VIN i dokumentacija
          text: Servisna istorija po VIN-u, lažna kilometraža, greške u elektronici i pravna ispravnost — hipoteka, zabrana registracije, neotvorene nezgode.
          points:
            - Neslaganje kilometraže sa istorijom
            - Greške u memoriji modula
            - Hipoteka i zabrana registracije
            - Neotvorene nezgode i osiguravajući događaji
    findingLabel: 'Pronašli smo:'
    heroPhotoAlt: Sedan na evropskom autoputu
    ctaPhotoAlt: Čista karoserija i kotač automobila izbliza
