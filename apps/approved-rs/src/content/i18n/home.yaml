  de:
    metaTitle: Autosourcing, Import und Rückkauf in Europa
    metaDescription: Autosourcing im eigenen Land oder aus Europa und China — schlüsselfertig. Inspektion und Rückkauf. Wir sind in ganz Europa tätig.
    journey:
      - title: Sourcing
        desc: Wir finden, prüfen und liefern ein Fahrzeug nach Ihrem Budget — schlüsselfertig, in Deutschland, Spanien, Serbien und der Schweiz.
      - title: Import
        desc: Das Fahrzeug ist nicht in Ihrem Land? Wir finden und liefern es aus Deutschland, Europa oder China — schlüsselfertig, einschließlich Zollabwicklung.
      - title: Inspektion
        desc: Unabhängiger Experte prüft das Fahrzeug vor dem Kauf — über 100 Punkte mit Video.
        note: Haben Sie das Auto selbst gefunden? Wir bieten eine separate Inspektion an.
      - title: Rückkauf
        desc: Wir kümmern uns um den Rückkauf und die Zollabwicklung von Fahrzeugen mit ausländischen Kennzeichen.
        note: Ihr Fahrzeug ist bereits im Ausland? Wir helfen bei der Abwicklung.
    heroLine1: Wir finden das Auto.
    heroLine2: Wir prüfen es.
    heroLine3: Wir liefern es.
    heroSubtext: Wir finden Autos in Deutschland, Spanien, der Schweiz oder Serbien, und wenn es in einem anderen Land ist, bringen wir es mit Inspektion, Abwicklung und Zollabfertigung zu Ihnen.
    statClients:
      value: 200+
      label: Kunden
    statCountries:
      label: Länder
    statYears:
      value: 5 Jahre
      label: auf dem Markt
    journeyHeading: 'Ein Weg: von der Suche zu den Schlüsseln'
    journeySubtext: Autosourcing, Import, Inspektion und Rückkauf sind nicht verschiedene Dienstleistungen, sondern Schritte auf dem Weg Ihres Fahrzeugs. Sie können an jedem Punkt einsteigen.
    whyUsHeading: Warum wir gewählt werden
    whyUsSubtext: Der Kauf eines Autos aus einem anderen Land wirft Fragen auf. So nehmen wir Ihnen diese.
    trustCards:
      - title: Vollständige Transparenz
        text: 'Wir senden Ihnen eine detaillierte Checkliste (über 100 Punkte) und Videos zu jedem Detail: Karosserie, Innenraum, Fahrwerk. Sie sehen das Fahrzeug, als ob Sie direkt daneben stehen.'
      - title: Sicherheit der Transaktion
        text: 'Zahlung in Raten und verständliche Bedingungen. Wir begleiten die Dokumente in allen Phasen: Abwicklung, Zoll, Registrierung — ohne Überraschungen.'
      - title: Lokale Expertise
        text: 'Wir kennen die Besonderheiten jedes Marktes: Autobahnfahrten in Deutschland, Karosserieeigenschaften spanischer Autos, Feinheiten der Zulassung mit ausländischen Nummern in Serbien.'
    testimonialsHeading: Was unsere Kunden sagen
    testimonials:
      - quote: «Wir haben einen BMW der 3er Reihe von München nach Belgrad gebracht. Alles genau — von der Inspektion bis zur Zulassung. Wir haben eine Menge Nerven bei der Abwicklung gespart.»
        name: Александр
        caption: BMW 320d, Deutschland → Serbien
      - quote: «Ich habe lange nach einer Skoda Octavia in gutem Zustand gesucht. Die Jungs fanden eine Option in Spanien, prüften sie mit einem unabhängigen Experten — alles stimmte mit der Beschreibung überein.»
        name: Михаил
        caption: Skoda Octavia, Spanien → Russland
      - quote: «Die Zulassung mit ausländischen Nummern schien kompliziert. Das Team führte mich durch jeden Schritt — und nach einem Monat konnte ich schon fahren. Ich empfehle.»
        name: Дмитрий
        caption: VW Passat, Deutschland → Serbien
    ctaEyebrow: Bereit anzufangen?
    ctaHeading:
      line1: Erzählen Sie uns
      line2: von dem Auto,
      accentWord: das Sie suchen
    ctaSubtext: Wir antworten innerhalb von 2 Stunden. Beratung ist kostenlos.
    ctaTelegramLabel: Nachricht an Telegram senden
    ctaStatResponse:
      value: 2 Std.
      label: Antwort
    origin:
      heading: Von wo liefern wir
      note: Lieferung in jedes Land — besprechen wir bei der Anfrage
      euTitle: Aus Europa
      euText: Deutschland, Spanien, die Schweiz und andere europäische Länder. Wir suchen vor Ort, prüfen vor dem Kauf, kümmern uns um den Export, liefern und zollabfertigen. Den Endpreis nennen wir vor der Transaktion, nicht nach der Grenze.
      euCta: Import aus Europa kalkulieren
      chinaTitle: Aus China
      chinaText: Neue und gebrauchte Fahrzeuge aus China über einen geprüften Partner. Sourcing nach Ihrem Budget, Prüfung vor dem Versand, Lieferung und Zollabwicklung — gleiches Verfahren wie in Europa.
      chinaCta: Import aus China kalkulieren
      chinaTags:
        - Neu
        - Gebraucht
        - Schlüsselfertig
    catalogue:
      heading: Letzte Geschäfte
      subtext: 'Hier gibt es keine Anzeigen: jedes Fahrzeug wurde gefunden, geprüft, abgewickelt und an eine Person übergeben. Der Preis ist der, den er gezahlt hat.'
      allCountriesLabel: Alle Länder
      moreLabel: Weitere {rest} anzeigen
    inspection:
      heading: Hundert Punkte, von denen vier entscheiden
      subtext: Die Checkliste ist lang, aber bei den Verkaufsabschlüssen scheitern in der Regel fast immer eines von vier Bereichen. Drücken Sie die Nummer im Schema — wir zeigen, was der Experte sieht und was wir dort gefunden haben.
      hint: Drücken Sie die Nummer im Schema
      ctaLabel: Inspektion anfordern
      pointsLabel: 100+ Punkte
      mediaLabel: Fotos und Videos
      reportLabel: Bericht bis zur Entscheidung
      zones:
        - title: Karosserie und Lackierung
          text: Messgerät für jede Paneele, Geometrie der Öffnungen, Schweiß- und Spachtelspuren. Hieran erkennt man, ob es einen Reparatur gab, die der Verkäufer verschwiegen hat.
          points:
            - Lackieren und Nachlackieren von Paneelen
            - Spaltmaße und Geometrie nach einem Unfall
            - Rost in den Schwellen und Radkästen
            - Originalität von Glas und Beleuchtung
        - title: Motor und Getriebe
          text: Parameter bei betriebswarmem Motor, Anpassungen des Getriebes, Fehler im Speichersystem. Der teuerste Bereich — und der häufigste Grund für Ablehnungen.
          points:
            - Dehnung der Steuerkette
            - Leckagen und Schwitzungen
            - Anpassungen und Ruckeln des Getriebes
            - Kompression und Rauchen
          finding: 'BMW M340 2025 mit geringem Kilometerstand: Die Diagnose zeigte eine Dehnung der Steuerkette von etwa 20 %. Wir haben es vor der Transaktion gefunden — der Kunde hatte ein Argument für die Verhandlung.'
        - title: Fahrwerk und Bremsen
          text: Hebebühne, Spiel, Zustand der Aufhängung und Bremsanlage. Deutscher Autobahnfahrverlauf und Balkanstraßen belasten das Fahrzeug unterschiedlich.
          points:
            - Spiel an den Lagern und Kugelgelenken
            - Ölverlust bei Stoßdämpfern
            - Verschleiß von Scheiben und Belägen
            - Lenkgetriebe und Gummis
        - title: Elektronik, VIN und Dokumente
          text: Servicehistorie anhand der VIN, manipulierte Kilometerstände, elektronische Fehler und rechtliche Sauberkeit — Pfandrechte, Registrierungsverbote, nicht abgeschlossene Unfälle.
          points:
            - Abweichungen des Kilometerstandes von der Historie
            - Fehler im Speichersystem
            - Pfändung und Registrierungsverbote
            - Nicht abgeschlossene Unfälle und Schadensfälle
    findingLabel: 'Gefunden:'
    heroPhotoAlt: Limousine auf europäischer Autobahn
    ctaPhotoAlt: Saubere Karosserie und Rad des Fahrzeugs im Detail
