translations:
  en:
    metaTitle: Car Sourcing, Import, and Buyback in Europe
    metaDescription: Car sourcing in your country or import from Europe and China, fully managed. Inspection and buyback, operating across Europe.
    journey:
      - title: Sourcing
        desc: We find, inspect, and deliver a car within your budget, fully managed, in Germany, Spain, Serbia, and Switzerland.
      - title: Import
        desc: Is the car not in your country? We'll source and import it from Germany, Europe, or China, including customs clearance.
      - title: Inspection
        desc: An independent expert inspects the car before purchase, checking over 100 points with video evidence.
        note: Found the car yourself? We can request a separate inspection.
      - title: Buyback
        desc: We handle the buyback and customs clearance of cars with foreign plates.
        note: Is the car already abroad? We can assist with the paperwork.
    heroLine1: We'll find the car.
    heroLine2: We'll inspect it.
    heroLine3: We'll deliver it.
    heroSubtext: We source cars in Germany, Spain, Switzerland, or Serbia. If it's in another country, we'll deliver it to you with inspection, paperwork, and customs clearance included.
    statClients:
      value: 200+
      label: clients
    statCountries:
      label: countries
    statYears:
      value: 5 years
      label: in the market
    journeyHeading: 'One journey: from search to keys'
    journeySubtext: Car sourcing, import, inspection, and buyback are not separate services, but stages of a single journey for your car. You can start at any step.
    whyUsHeading: Why choose us
    whyUsSubtext: Buying a car from another country raises questions. Here’s how we address them.
    trustCards:
      - title: Complete Transparency
        text: 'We send a detailed checklist (100+ points) and video of every detail: body, interior, drivetrain. You see the car as if you were standing next to it.'
      - title: Transaction Safety
        text: 'Step-by-step payment with clear terms. We assist with documentation at every stage: registration, customs clearance, and licensing. No surprises.'
      - title: Local Expertise
        text: 'We know the specifics of each market: autobahn mileage in Germany, Spanish car body specifics, nuances of registering foreign plates in Serbia.'
    testimonialsHeading: What clients say
    testimonials:
      - quote: '"They brought a BMW 3 Series from Munich to Belgrade. Everything was smooth, from inspection to registration. Saved me a lot of stress with the paperwork."'
        name: Александр
        caption: BMW 320d, Germany → Serbia
      - quote: '"I was searching for a Skoda Octavia in good condition for a long time. They found an option in Spain, checked it with an independent expert, and everything matched the description."'
        name: Михаил
        caption: Skoda Octavia, Spain → Russia
      - quote: '"Registering a foreign license plate seemed complicated. The team guided me through every step and within a month, I was already driving. Highly recommend."'
        name: Дмитрий
        caption: VW Passat, Germany → Serbia
    ctaEyebrow: Ready to get started?
    ctaHeading:
      line1: Tell us
      line2: about the car
      accentWord: you are looking for
    ctaSubtext: We respond within 2 hours. Consultation is free.
    ctaTelegramLabel: Message us on Telegram
    ctaStatResponse:
      value: 2 hours
      label: response
    origin:
      heading: Where we source from
      note: We can deliver to any country, discuss upon request.
      euTitle: From Europe
      euText: Germany, Spain, Switzerland, and other European countries. We source locally, inspect before purchase, handle export documentation, deliver, and manage customs clearance. We provide the final price before the deal, not after crossing the border.
      euCta: Calculate import from Europe
      chinaTitle: From China
      chinaText: New and used cars from China through a trusted partner. Sourcing based on your budget, inspection before shipping, delivery and customs clearance in the same manner as in Europe.
      chinaCta: Calculate import from China
      chinaTags:
        - New
        - Used
        - All-inclusive
    catalogue:
      heading: Latest Transactions
      subtext: 'There are no ads here: each car is found, inspected, documented, and handed over to the client. The price shown is what they paid.'
      allCountriesLabel: All countries
      moreLabel: Show more {rest}
    inspection:
      heading: One hundred points, out of which four are decisive
      subtext: The checklist is extensive, but deals are most often rejected based on one of four areas. Click on the number in the diagram, and we will show what the expert inspects and what we found there.
      hint: Click the number on the diagram
      ctaLabel: Order inspection
      pointsLabel: 100+ points
      mediaLabel: photos and videos
      reportLabel: report before decision
      zones:
        - title: Body and Paint
          text: Thickness measurement on each panel, geometry of openings, signs of welding and body filler. This reveals if there were repairs the seller forgot to mention.
          points:
            - Repainting and touch-ups
            - Gaps and geometry after a collision
            - Rust in thresholds and arches
            - Originality of glass and optics
        - title: Engine and Transmission
          text: Parameters of a warmed-up engine, gearbox adaptations, errors in memory blocks. This is the most expensive area and the most common reason for rejections.
          points:
            - Timing chain stretch
            - Leaks and seeps
            - Transmission adaptations and jerks
            - Compression and smoke levels
          finding: 'BMW M340 2025 with low mileage: diagnostics revealed a stretch in the timing chain of about 20%. Found before the deal, giving the client leverage for negotiation.'
        - title: Suspension and Brakes
          text: Lifts, play, condition of the suspension and braking system. German autobahn mileage and Balkan roads wear the car differently.
          points:
            - Play in control arms and ball joints
            - Leaking shock absorbers
            - Wear on discs and pads
            - Steering rack and boots
        - title: Electronics, VIN, and Documents
          text: 'Service history by VIN, odometer rollback, electronic errors, and legal status: liens, registration bans, unresolved accidents.'
          points:
            - Mileage discrepancy with history
            - Error codes in the memory
            - Liens and registration bans
            - Unresolved accidents and insurance claims
    findingLabel: 'Found:'
    heroPhotoAlt: Sedan on a European highway
    ctaPhotoAlt: Clean car body and wheel close-up
  sr:
    metaTitle: Izbor, uvoz i otkup automobila u Evropi
    metaDescription: Auto izbor u Srbiji ili uvoz automobila iz Evrope i Kine. Provera i otkup. Radimo širom Evrope.
    journey:
      - title: Izbor
        desc: Nalazimo, proveravamo i dostavljamo automobil unutar vašeg budžeta, ključno, iz Nemačke, Španije, Srbije i Švajcarske.
      - title: Uvoz
        desc: Automobil nije u vašoj zemlji? Pronaći ćemo i dovesti ga iz Nemačke, Evrope ili Kine sa svim uslugama uključujući carinjenje.
      - title: Provera
        desc: Nezavisni stručnjak vrši provere automobila pre kupovine prema 100+ tačaka sa video zapisima.
        note: Našli ste auto sami? Moguće je naručiti provere posebno
      - title: Otkup
        desc: Obrađujemo otkup i carinjenje automobila sa stranim registarskim tablicama.
        note: Automobil je već u inostranstvu? Pomoći ćemo u njegovom uređivanju.
    heroLine1: Naći ćemo auto.
    heroLine2: Proverićemo.
    heroLine3: Dovesti ćemo ga.
    heroSubtext: Pronaći ćemo automobil u Nemačkoj, Španiji, Švajcarskoj ili Srbiji, a ako je u drugoj zemlji, dovešćemo ga sa proverom, uređivanjem i carinjenjem.
    statClients:
      value: 200+
      label: klijenata
    statCountries:
      label: zemalja
    statYears:
      value: 5 godina
      label: na tržištu
    journeyHeading: 'Jedan put: od pretrage do ključeva'
    journeySubtext: Auto izbor, uvoz, provera i otkup nisu različite usluge, već koraci jednog puta vašeg automobila. Možete započeti sa bilo kojeg koraka.
    whyUsHeading: Zašto nas izabiraju
    whyUsSubtext: Kupovina automobila iz druge zemlje postavlja pitanja. Evo kako ih rešavamo.
    trustCards:
      - title: Potpuna transparentnost
        text: 'Šaljemo detaljan ček-list (100+ tačaka) i video svakog detalja: karoserija, enterijer, podvozje. Vidite automobil kao da stojite pored njega.'
      - title: Bezbednost transakcije
        text: 'Postepeno plaćanje i jasni uslovi. Pratimo dokumente na svim stepenima: uređivanje, carinjenje, registracija. Bez iznenađenja.'
      - title: Lokalna ekspertiza
        text: 'Znamo specifičnosti svakog tržišta: kilometraže na nemačkim autoputevima, karakteristike karoserije španskih automobila, detalje o obradi stranih registarskih tablica u Srbiji.'
    testimonialsHeading: Šta kažu klijenti
    testimonials:
      - quote: «Doveli su BMW 3 serije iz Minhena u Beograd. Sve je bilo jasno, od provere do registracije. Uštedeli smo mnogo nerve oko dokumentacije.»
        name: Aleksandar
        caption: BMW 320d, Nemačka → Srbija
      - quote: «Dugo sam tražio Skodu Octaviu u dobrom stanju. Momci su pronašli opciju u Španiji, proverili je nezavisnim stručnjakom, sve se poklapalo sa opisom.»
        name: Mihail
        caption: Škoda Octavia, Španija → Rusija
      - quote: «Uređivanje na stranim tablicama delovalo je komplikovano. Tim me je proveo kroz svaki korak, i već posle mesec dana sam vozio. Preporučujem.»
        name: Dmitrij
        caption: VW Passat, Nemačka → Srbija
    ctaEyebrow: Spremni za početak?
    ctaHeading:
      line1: Recite nam
      line2: o kolima,
      accentWord: koje tražite
    ctaSubtext: Odgovaramo u roku od 2 sata. Konsultacije su besplatne.
    ctaTelegramLabel: Pitajte na Telegramu
    ctaStatResponse:
      value: 2 h
      label: odgovor
    origin:
      heading: Odakle uvozimo
      note: Doveli ćemo u svaku zemlju, razgovaraćemo prilikom prijave.
      euTitle: Iz Evrope
      euText: Nemačka, Španija, Švajcarska i druge zemlje Evrope. Pronalazimo na licu mesta, proveravamo pre kupovine, uređujemo izvoz, donosimo i carinimo. Konačan iznos saopštavamo pre transakcije, a ne posle prelaska granice.
      euCta: Izračunajte uvoz iz Evrope
      chinaTitle: Iz Kine
      chinaText: Novi i polovni automobili iz Kine putem proverenog partnera. Izbor prema vašem budžetu, provera pre slanja, dostava i carinjenje na isti način kao u Evropi.
      chinaCta: Izračunajte uvoz iz Kine
      chinaTags:
        - Novi
        - Sa pređenim kilometrima
        - Sve uključeno
    catalogue:
      heading: Poslednje transakcije
      subtext: 'Ovde nema oglasa: svaki automobil je pronađen, proveren, uređen i predan osobi. Cena je ta koju je platio.'
      allCountriesLabel: Sve zemlje
      moreLabel: Pokaži još {rest}
    inspection:
      heading: Sto tačaka, kroz koje se odlučuje kao po četiri
      subtext: Lista za proveru je duga, ali gotovo uvek se posao otkazuje zbog jedne od četiri oblasti. Kliknite broj na šemi, i pokazat ćemo šta stručnjak proverava i šta smo pronašli.
      hint: Kliknite broj na šemi
      ctaLabel: Naručite proveru
      pointsLabel: 100+ tačaka
      mediaLabel: fotografije i video
      reportLabel: izveštaj pre odluke
      zones:
        - title: Karoserija i zaštita od korozije
          text: Mera debljine po svakoj panelu, geometrija otvora, tragovi zavarivanja i malterisanja. Ovdje se vidi da li je bilo popravki za koje je prodavac zaboravio.
          points:
            - Lakat i prelakiranje panela
            - Udaljenosti i geometrija posle udarca
            - Korozija u pragovima i lukovima
            - Originalnost stakala i optike
        - title: Motor i menjač
          text: Parametri na zagrijanom motoru, adaptacije menjača, greške u memoriji kontrolnih blokova. Najskuplja zona i najčešći razlog odbijanja.
          points:
            - Produženje lanca GRM
            - Curenje i vlažnost
            - Adaptacije i trzaji menjača
            - Kompresija i dim
          finding: 'BMW M340 iz 2025. godine sa malim pređenim kilometražom: dijagnostika je pokazala produženje lanca bregaste osovine oko 20 %. Pronašli smo to pre posla, i klijent je dobio argument za pregovaranje.'
        - title: Podvozje i kočnice
          text: Dizalica, klimave delove, stanje suspenzije i kočionog sistema. Nemačka autoputna pređena distanca i balkanske ceste troše automobil različito.
          points:
            - Lufozi rukava i kuglica
            - Curenje amortizera
            - Habanje diskova i pločica
            - Kormilo i zaštite
        - title: Elektronika, VIN i dokumenti
          text: 'Servisna istorija po VIN-u, prevara u kilometraži, greške u elektronici i pravna čistoća: hipotekarna zaduženja, zabrane registracije, nerazrešeni udesi.'
          points:
            - Neslaganje kilometraže sa istorijom
            - Greške u memoriji blokova
            - Zalozi i zabrana registracije
            - Neusaglašeni sudski slučajevi i osiguravajući događaji
    findingLabel: 'Pronašli smo:'
    heroPhotoAlt: Sedan na evropskom autoputu
    ctaPhotoAlt: Čista karoserija i točak automobila izbliza
  es:
    metaTitle: Selección, importación y compra de autos en Europa
    metaDescription: Selección de auto en su país o importación de Europa y China. Inspección y recompra. Trabajamos en toda Europa.
    journey:
      - title: Selección
        desc: Buscamos, inspeccionamos y entregamos el automóvil según su presupuesto, llave en mano, en Alemania, España, Serbia y Suiza.
