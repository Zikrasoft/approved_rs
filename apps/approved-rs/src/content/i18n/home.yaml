    catalogue:
      heading: Últimas transacciones
      subtext: 'Aquí no hay anuncios: cada automóvil ha sido encontrado, revisado, documentado y entregado a su dueño. El precio es el que se pagó.'
      allCountriesLabel: Todos los países
      moreLabel: Mostrar más {rest}
    inspection:
      heading: Cien puntos, de los cuales cuatro deciden
      subtext: La lista de verificación es larga, pero casi siempre es por una de las cuatro zonas que se desaconseja la transacción. Haga clic en el número en el esquema para ver qué revisa el experto y qué hemos encontrado.
      hint: Haga clic en el número en el esquema
      ctaLabel: Solicitar inspección
      pointsLabel: 100+ puntos
      mediaLabel: fotos y vídeos
      reportLabel: informe antes de decidir
      zones:
        - title: Carrocería y pintura
          text: Mediciones de grosor en cada panel, geometría de aberturas, señales de soldadura y masilla. Desde aquí se ve si hubo reparación que el vendedor olvidó mencionar.
          points:
            - Reacondicionado y repintado de paneles
            - Alineación y geometría tras un impacto
            - Corrosión en los umbrales y arcos
            - Originalidad de los cristales y óptica
        - title: Motor y transmisión
          text: Parámetros en motor caliente, adaptaciones de la transmisión, errores en la memoria de módulos. La zona más cara y la razón más común de rechazo.
          points:
            - Alargamiento de la cadena de distribución
            - Fugas y humedades
            - Adaptaciones y tirones de la transmisión
            - Compresión y emisión de humo
          finding: 'BMW M340 2025 con bajo kilometraje: diagnóstico mostró alargamiento de la cadena de distribución alrededor del 20 %. Lo encontramos antes de la transacción — el cliente tuvo un argumento para negociar.'
        - title: Suspensión y frenos
          text: Elevador, holguras, estado de la suspensión y sistema de frenos. El kilometraje en autopistas alemanas y las carreteras balcánicas desgastan el coche de diferentes maneras.
          points:
            - Holguras en brazos y rótulas
            - Fugas de amortiguadores
            - Desgaste de discos y pastillas
            - Dirección y fuelles
        - title: Electrónica, VIN y documentos
          text: Historial de servicio por VIN, kilometraje manipulado, errores en la electrónica y legalidad — embargos, prohibiciones de matriculación, accidentes no resueltos.
          points:
            - Inconsistencia en el kilometraje con el historial
            - Errores en la memoria de módulos
            - Embargo y prohibición de matriculación
            - Accidentes no resueltos y eventos asegurados
