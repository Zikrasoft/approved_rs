      value: 2 Std.
      label: Antwort
    origin:
      heading: Woher wir importieren
      note: Wir liefern in jedes Land — besprechen wir bei der Anfrage.
      euTitle: Aus Europa
      euText: Deutschland, Spanien, Schweiz und andere EU-Länder. Wir wählen vor Ort aus, überprüfen vor dem Kauf, kümmern uns um den Export, bringen und zollabfertigen. Den Endpreis nennen wir vor dem Deal und nicht nach der Grenze.
      euCta: Import aus Europa berechnen
      chinaTitle: Aus China
      chinaText: Neue und gebrauchte Autos aus China über einen vertrauenswürdigen Partner. Auswahl nach Ihrem Budget, Überprüfung vor dem Versand, Lieferung und Zollabfertigung — im gleichen Verfahren wie in Europa.
      chinaCta: Import aus China berechnen
      chinaTags:
        - Neu
        - Gebraucht
        - Schlüsselfertig
    catalogue:
      heading: Was man für dieses Geld bekommt
      subtext: 'Hier gibt es keine Anzeigen: jedes Auto wurde gefunden, geprüft, formalisiert und an die Person übergeben. Der Preis ist der, den er bezahlt hat.'
      budgetLabel: Budget für das Auto, bis
      allCountriesLabel: Alle Länder
      countTemplate: Passend {shown} von {total}
      moreLabel: Weitere {rest} anzeigen
      emptyText: In diesem Budget haben wir im ausgewählten Land bisher keine Deals abgeschlossen. Schreiben Sie uns — wir sagen ehrlich, was man wirklich bekommen kann.
    inspection:
      heading: Hundert Punkte, von denen vier entscheiden
      subtext: Die Checkliste ist lang, aber fast immer zieht man bei einem Deal aus einem der vier Bereiche zurück. Drücken Sie die Nummer auf dem Diagramm — wir zeigen Ihnen, was der Experte prüft und was wir dort gefunden haben.
      hint: Drücken Sie die Nummer im Diagramm
      ctaLabel: Überprüfung anfordern
      pointsLabel: Über 100 Punkte
      mediaLabel: Fotos und Videos
      reportLabel: Bericht vor der Entscheidung
      zones:
        - title: Karosserie und Lackierung
          text: Messgerät für jede Paneelstärke, Geometrie der Öffnungen, Spuren von Schweiß- und Spachtelarbeiten. Hier sieht man, ob es Reparaturen gab, die der Verkäufer vergessen hat.
          points:
            - Lackierung und Nachlackierung der Paneele
            - Spaltmaße und Geometrie nach einem Unfall
            - Korrosion in Schweller und Radkästen
            - Originalität der Fenster und Lichter
        - title: Motor und Getriebe
          text: Parameter bei warmem Motor, Anpassungen des Getriebes, Fehler im Speicher der Steuergeräte. Der teuerste Bereich — und häufigste Grund für einen Rückzug.
          points:
            - Dehnung der Steuerkette
            - Öl- und Feuchtigkeitslecks
            - Anpassungen und Ruckeln des Getriebes
            - Kompression und Abgasemissionen
          finding: 'BMW M340 von 2025 mit geringem Kilometerstand: Die Diagnose zeigte eine Dehnung der Steuerkette von etwa 20 %. Wir fanden es vor dem Deal — der Kunde hatte einen Argument für den Preisnachlass.'
        - title: Fahrwerk und Bremsen
          text: Hebebühne, Spiel, Zustand der Aufhängung und Bremsanlage. Die deutschen Autobahnkilometer und die Balkanstraßen beanspruchen das Auto unterschiedlich.
          points:
            - Spiel in den Streben und Gelenken
            - Öllecks an den Stoßdämpfern
            - Abnutzung der Scheiben und Beläge
            - Lenkgetriebe und Gummimanschetten
        - title: Elektronik, VIN und Dokumente
          text: Serviceliste über die VIN, gefälschter Kilometerstand, Fehler in der Elektronik und rechtliche Sauberkeit — Hypotheken, Registrierungssperren, nicht abgeschlossene Unfälle.
          points:
            - Abweichung des Kilometerstands von der Historie
            - Fehler im Speicher der Steuergeräte
            - Hypotheken und Registrierungssperren
            - Nicht abgeschlossene Unfälle und Versicherungsereignisse
    findingLabel: 'Gefunden:'
    heroPhotoNote: an den Kunden übergeben
    heroPhotoAlt: Ineos Grenadier, in Deutschland gefunden und an den Kunden übergeben
    ctaPhotoAlt: Saubere Karosserie und Rad des Fahrzeugs aus der Nähe
