    whyUsHeading: Por qué nos eligen
    whyUsSubtext: Comprar un automóvil de otro país genera dudas. Así es como las resolvemos.
    trustCards:
      - title: Total transparencia
        text: 'Enviamos una lista de verificación detallada (más de 100 puntos) y videos de cada detalle: carrocería, interior, mecánica. Usted ve el automóvil como si estuviera junto a él.'
      - title: Seguridad en la transacción
        text: 'Pago por etapas y condiciones claras. Acompañamos los documentos en todas las etapas: formalización, aduana, registro, sin sorpresas.'
      - title: Experiencia local
        text: 'Conocemos las particularidades de cada mercado: los kilometrajes de las autopistas alemanas, las características de la carrocería de los autos españoles, los detalles del registro con matrículas extranjeras en Serbia.'
    testimonialsHeading: Lo que dicen los clientes
    testimonials:
      - quote: «Trajeron un BMW Serie 3 de Múnich a Belgrado. Todo claro, desde la inspección hasta el registro. Ahorramos un montón de nervios en la formalización.»
        name: Александр
        caption: BMW 320d, Alemania → Serbia
      - quote: '«Busqué durante mucho tiempo un Skoda Octavia en buen estado. Los chicos encontraron una opción en España, la comprobaron con un experto independiente: todo coincidió con la descripción.»'
        name: Михаил
        caption: Skoda Octavia, España → Rusia
      - quote: «La formalización con matrícula extranjera parecía complicada. El equipo me guió a través de cada paso y en un mes ya estaba conduciendo. Lo recomiendo.»
        name: Дмитрий
        caption: VW Passat, Alemania → Serbia
    ctaEyebrow: ¿Listos para empezar?
    ctaHeading:
      line1: Cuéntanos
      line2: sobre el coche,
      accentWord: que buscas
