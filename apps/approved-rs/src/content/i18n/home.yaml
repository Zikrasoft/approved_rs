      heading: Desde dónde importamos
      note: Entregaremos a cualquier país — lo discutimos al solicitar
      euTitle: Desde Europa
      euText: Alemania, España, Suiza y otros países de Europa. Seleccionamos en el lugar, revisamos antes de la compra, gestionamos la exportación, transportamos y despachamos. El monto final se establece antes de la transacción, no después de pasar la frontera.
      euCta: Calcular importación desde Europa
      chinaTitle: Desde China
      chinaText: Autos nuevos y usados de China a través de un socio confiable. Selección según su presupuesto, inspección antes del envío, entrega y despacho aduanal — todo con el mismo procedimiento que en Europa.
