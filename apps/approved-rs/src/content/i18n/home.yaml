    origin:
      heading: Odakle uvozimo
      note: Dostavljamo u bilo koju zemlju, detalje dogovaramo nakon upita
      euTitle: Iz Evrope
      euText: Nemačka, Španija, Švajcarska i druge evropske zemlje. Pronalazimo automobil na licu mesta, obavljamo provera auta pre kupovine, pripremamo izvoznu dokumentaciju, prevozimo i carinimo. Ukupnu cenu saopštavamo pre kupovine, ne nakon prelaska granice.
