        text: 'Pago por etapas y condiciones claras. Acompañamos la documentación en todas las fases: formalización, despacho aduanal, registro — sin sorpresas.'
      - title: Experticia local
        text: 'Conocemos las particularidades de cada mercado: kilometrajes de autopista en Alemania, características de la carrocería de autos españoles, detalles en la formalización de placas extranjeras en Serbia.'
    testimonialsHeading: Lo que dicen los clientes
    testimonials:
      - quote: «Importaron un BMW 3 Series de Múnich a Belgrado. Todo claro — desde la revisión hasta la inscripción. Ahorramos muchos nervios en la formalización.»
        name: Александр
        caption: BMW 320d, Alemania → Serbia
      - quote: «Estuve mucho tiempo buscando un Skoda Octavia en buen estado. Ellos encontraron uno en España, lo verificaron con un experto independiente — todo coincidió con la descripción.»
        name: Михаил
        caption: Skoda Octavia, España → Rusia
      - quote: «Formalizar con placas extranjeras parecía complicado. El equipo me guió en cada paso — y en un mes ya estaba conduciendo. Lo recomiendo.»
