      chinaTitle: Iz Kine
      chinaText: Novi i polovni automobili iz Kine preko proverenog partnera. Pronalazimo automobil u okviru vašeg budžeta, proveravamo ga pre slanja, prevozimo i carinimo, kao i za automobile iz Evrope.
