    origin:
      heading: Odakle uvozimo
      note: Dostavićemo u svaku zemlju — razgovaraćemo o tome prilikom zahteva
      euTitle: Iz Evrope
      euText: Nemačka, Španija, Švajcarska i druge evropske zemlje. Pronalazimo ih na licu mesta, pregledamo pre kupovine, obrađujemo izvoz, transportujemo i carinimo. Konačnu cenu javljamo pre transakcije, a ne posle granice.
      euCta: Izračunajte uvoz iz Evrope
      chinaTitle: Iz Kine
      chinaText: Novi i polovni automobili iz Kine preko proverenog partnera. Izbor prema vašem budžetu, provera pre slanja, dostava i carinjenje — isto kao i u Evropi.
