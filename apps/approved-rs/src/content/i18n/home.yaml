        desc: Nalazimo, proveravamo i isporučujemo automobil u skladu sa vašim budžetom — sve uključeno, u Nemačkoj, Španiji, Srbiji i Švajcarskoj.
      - title: Uvezi
        desc: Auto nije u vašoj zemlji? Pronaći ćemo i uvezićemo ga iz Nemačke, Evrope ili Kine — sve uključeno, uključujući carinjenje.
      - title: Proveri
        desc: Nezavisni stručnjak će pregledati automobil pre kupovine — prema 100+ kriterijuma sa video zapisima.
        note: Da li ste sami našli auto? Možemo naručiti proveru posebno.
      - title: Otkupi
        desc: Uređujemo otkup i carinjenje automobila sa stranim registarskim oznakama.
        note: Auto već u inostranstvu? Pomoći ćemo vam da ga sredite.
