    text: 'Поэтапная оплата и понятные условия. Сопровождаем документы на всех этапах: оформление, растаможка, регистрация. Без сюрпризов.'
  - title: Локальная экспертиза
    text: 'Знаем специфику каждого рынка: автобанные пробеги Германии, особенности кузова испанских авто, нюансы оформления на иностранные номера в Сербии.'
testimonialsHeading: Что говорят клиенты
testimonials:
