    whyUsHeading: Warum uns wählen
    whyUsSubtext: Der Kauf eines Autos aus einem anderen Land wirft Fragen auf. So nehmen wir Ihnen diese.
    trustCards:
      - title: Vollständige Transparenz
        text: 'Wir senden eine detaillierte Checkliste (über 100 Punkte) und Videos zu jedem Detail: Karosserie, Innenraum, Fahrwerk. Sie sehen das Auto, als stünden Sie daneben.'
      - title: Sicherheit der Transaktion
        text: 'Schrittweise Zahlung und klare Bedingungen. Wir begleiten die Dokumente auf allen Etappen: Abwicklung, Zoll, Registrierung – ohne Überraschungen.'
      - title: Lokale Expertise
        text: 'Wir kennen die Besonderheiten jedes Marktes: Autobahnfahrten in Deutschland, spezifische Eigenschaften spanischer Fahrzeuge, Details zur Anmeldung auf ausländische Nummern in Serbien.'
    ctaEyebrow: Bereit zu starten?
