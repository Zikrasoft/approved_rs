    ctaTelegramLabel: Escribir en Telegram
    ctaStatResponse:
      value: 2 h
      label: respuesta
    origin:
      heading: De dónde importamos
      note: Entregamos en cualquier país, discutiremos al solicitar
      euTitle: Desde Europa
      euText: Alemania, España, Suiza y otros países de Europa. Seleccionamos en el lugar, inspeccionamos antes de la compra, gestionamos la exportación, lo llevamos y legalizamos. El precio final se determina antes de la transacción, no después de la frontera.
      euCta: Calcular importación desde Europa
      chinaTitle: Desde China
      chinaText: Coches nuevos y usados de China a través de un socio confiable. Selección dentro de su presupuesto, chequeo antes del envío, entrega y legalización, todo siguiendo el mismo proceso que con Europa.
      chinaCta: Calcular importación desde China
      chinaTags:
        - Nuevos
        - Usados
        - Todo incluido
    catalogue:
      heading: Últimos tratos
      subtext: 'No hay anuncios aquí: cada coche ha sido encontrado, revisado, formalizado y entregado a su dueño. El precio es el que él pagó.'
      allCountriesLabel: Todos los países
      moreLabel: Mostrar más {rest}
    inspection:
      heading: Cien puntos, de los cuales cuatro deciden
      subtext: La lista de verificación es larga, pero casi siempre se desaconseja la transacción por una de las cuatro áreas. Haga clic en el número del esquema y le mostraremos qué revisa el experto y qué hemos encontrado allí.
      hint: Haga clic en el número del esquema
      ctaLabel: Solicitar inspección
      pointsLabel: 100+ puntos
      mediaLabel: fotos y videos
      reportLabel: informe antes de la decisión
      zones:
        - title: Carrocería y pintura
          text: Medidor de espesor en cada panel, geometría de los umbrales, signos de soldaduras y masilla. De aquí se ve si ha habido reparaciones de las que el vendedor se olvidó.
          points:
            - Repintado y retoque de paneles
            - Ajustes y geometría tras un golpe
            - Corrosión en los umbrales y arcos
            - Originalidad de cristales y ópticas
        - title: Motor y caja
          text: Parámetros en motor caliente, adaptaciones de la caja, errores en la memoria de las unidades. La zona más costosa y la razón más común para rechazar.
          points:
            - Alargamiento de la cadena de distribución
            - Fugas y sudoraciones
            - Adaptaciones y tirones de la caja
            - Compresión y ahumado
          finding: 'BMW M340 2025 con bajo kilometraje: diagnóstico mostró un alargamiento de la cadena de distribución de alrededor del 20 %. Se encontró antes de la transacción, dando al cliente un argumento para negociar.'
        - title: Mecánica y frenos
          text: Elevador, holguras, estado de la suspensión y sistema de frenos. El kilometraje en autopista alemana y las carreteras balcánicas desgastan el coche de manera diferente.
          points:
            - Holguras en los brazos y esferas
            - Fuga de amortiguadores
            - Desgaste de discos y pastillas
            - Crema de dirección y fuelles
        - title: Electrónica, VIN y documentos
          text: 'Historial de servicio según VIN, kilometraje manipulado, errores en la electrónica y limpieza legal: gravámenes, prohibiciones de registro, sin daños no resueltos.'
          points:
            - Desviación de kilometraje del historial
            - Errores en la memoria de las unidades
            - Gravámenes y prohibiciones de registro
            - Accidentes no resueltos y sucesos de seguros
