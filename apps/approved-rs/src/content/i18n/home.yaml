      euText: Alemania, España, Suiza y otros países de la UE. Seleccionamos en el lugar, inspeccionamos antes de la compra, gestionamos la exportación, transportamos y hacemos el despacho aduanero. Comunicamos el costo total antes de la transacción, no después de la frontera.
      euCta: Calcular importación desde Europa
      chinaTitle: Desde China
      chinaText: Autos nuevos y usados de China a través de un socio confiable. Selección según su presupuesto, verificación antes del envío, entrega y despacho aduanero — del mismo modo que en Europa.
      chinaCta: Calcular importación desde China
      chinaTags:
        - Nuevos
        - Usados
        - Llave en mano
    catalogue:
      heading: Lo que se puede obtener con este presupuesto
      subtext: 'Aquí no hay anuncios: cada coche se ha encontrado, verificado, tramitado y entregado a una persona. El precio es aquel que efectivamente pagó.'
      budgetLabel: Presupuesto para el auto, hasta
      allCountriesLabel: Todos los países
      countTemplate: Se ajusta {shown} de {total}
      moreLabel: Mostrar más {rest}
      emptyText: En este presupuesto en el país seleccionado, aún no hemos cerrado transacciones. Escríbanos — le diremos honestamente qué es realmente posible conseguir.
    inspection:
      heading: Cien puntos, de los cuales cuatro deciden
      subtext: La lista de verificación es extensa, pero casi siempre se desaconseja la transacción por una de las cuatro áreas. Haga clic en el número del esquema — le mostraremos qué revisa el experto y qué hemos encontrado allí.
      hint: Haga clic en el número del esquema
      ctaLabel: Solicitar inspección
      pointsLabel: 100+ puntos
      mediaLabel: fotos y videos
      reportLabel: informe antes de la decisión
      zones:
        - title: Carrocería y pintura
          text: Medición de grosor en cada panel, geometría de huecos, señales de soldadura y masillado. De aquí se puede ver si ha habido reparaciones de las que el vendedor se olvidó.
          points:
            - Repintado y retoques en paneles
            - Ajustes y geometría después del impacto
            - Corrosión en umbrales y arcos
            - Originalidad de los cristales y ópticas
        - title: Motor y caja de cambios
          text: Parámetros en el motor caliente, adaptaciones de la caja, errores en la memoria de los módulos. La zona más costosa — y la causa más frecuente de rechazo.
          points:
            - Alargamiento de la cadena de distribución
            - Fugas y humedad
            - Adaptaciones y tirones en la caja
            - Compresión y humos
          finding: 'BMW M340 2025 con bajo kilometraje: el diagnóstico mostró un alargamiento de la cadena de distribución de aproximadamente el 20%. Lo encontramos antes de la transacción — el cliente obtuvo un argumento para negociar.'
        - title: Suspensión y frenos
          text: Elevador, holguras, estado de la suspensión y el sistema de frenos. El kilometraje en autopista de Alemania y las carreteras balcánicas desgastan el coche de manera diferente.
          points:
            - Holguras en brazos y rótulas
            - Fugas en amortiguadores
            - Desgaste de discos y pastillas
            - Caja de dirección y fuelles
        - title: Electrónica, VIN y documentos
          text: Historial de servicio según el VIN, kilometraje manipulado, errores en la electrónica y limpieza jurídica — gravamen, prohibición de registro, accidentes no resueltos.
          points:
            - Desviación de kilometraje respecto a la historia
            - Errores en la memoria de los módulos
            - Gravamen y prohibición de registro
            - Accidentes no resueltos y eventos asegurados
