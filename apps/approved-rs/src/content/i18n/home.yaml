      - title: Lokalna ekspertiza
        text: 'Poznajemo specifičnosti svakog tržišta: autobahnski kilometraži u Nemačkoj, karakteristike karoserije španskih automobila, pikanterije oko registracije stranih registarskih oznaka u Srbiji.'
