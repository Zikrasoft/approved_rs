    origin:
      heading: Where we source from
      note: We can deliver to any country — let's discuss it when you apply
      euTitle: From Europe
      euText: Germany, Spain, Switzerland, and other EU countries. We source on-site, inspect before purchase, handle export paperwork, and ensure delivery and customs clearance. We quote the final amount before the deal, not after the border.
      euCta: Calculate import from Europe
      chinaTitle: From China
      chinaText: New and used cars from China through a trusted partner. Sourcing according to your budget, inspection before shipping, delivery and customs clearance — in the same manner as for Europe.
      chinaCta: Calculate import from China
      chinaTags:
        - New
        - Used
        - All-inclusive
    catalogue:
      heading: What you can get for this price
      subtext: 'There are no listings here: each car is sourced, inspected, processed, and handed over to the client. The price is what he paid.'
      budgetLabel: Budget for the car, up to
      allCountriesLabel: All countries
      countTemplate: Matches {shown} out of {total}
      moreLabel: Show more {rest}
      emptyText: We have not closed any deals in this budget in the selected country yet. Write to us — we'll honestly tell you what can be realistically acquired.
    inspection:
      heading: One hundred points, four zones that make the decision
      subtext: The checklist is long, but we often decline deals based on one of four zones. Click a number on the diagram — we’ll show what the expert checks and what issues we've found there.
      hint: Click a number on the diagram
      ctaLabel: Order inspection
      pointsLabel: 100+ points
      mediaLabel: photos and videos
      reportLabel: report before decision
      zones:
        - title: Body and paintwork
          text: Thickness gauge for each panel, geometry of openings, signs of welding and filling. This reveals whether there was a repair that the seller forgot to mention.
          points:
            - Repainting and touching up panels
            - Gaps and geometry post-accident
            - Corrosion in thresholds and arches
            - Originality of glass and optics
        - title: Engine and transmission
          text: Parameters at operating temperature, transmission adaptations, fault codes in memory. This is the most expensive zone — and the most common reason for refusal.
          points:
            - Timing chain stretch
            - Leaks and sweating
            - Adaptive shifts and jerks
            - Compression and smoke
          finding: '2025 BMW M340 with low mileage: diagnostics showed a timing chain stretch of about 20%. We found this before the deal — the client had leverage for negotiation.'
        - title: Chassis and brakes
          text: Lift, play, condition of suspension and braking system. German autobahn mileage and Balkan roads wear out a car differently.
          points:
            - Looseness of arms and ball joints
            - Shock absorber leaks
            - Wear of discs and pads
            - Steering rack and bellows
        - title: Electronics, VIN and documents
          text: Service history by VIN, odometer rollback, electronic errors, and legal integrity — lien, registration bans, unresolved accidents.
          points:
            - Odometer discrepancies with history
            - Fault codes in memory
            - Liens and registration bans
            - Unresolved accidents and insurance events
