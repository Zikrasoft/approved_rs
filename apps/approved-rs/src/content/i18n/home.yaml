translations:
  en:
    metaTitle: Car Sourcing, Import and Buyback in Europe
    metaDescription: Car sourcing in your country or importing from Europe and China — all-inclusive. Inspection and buyback. We operate throughout Europe.
    journey:
      - title: Sourcing
        desc: We find, verify, and deliver a car that fits your budget — all-inclusive, in Germany, Spain, Serbia, and Switzerland.
      - title: Import
        desc: Is the car not in your country? We'll source and import it from Germany, Europe, or China — all-inclusive, including customs clearance.
      - title: Inspection
        desc: An independent expert inspects the car before purchase — over 100 points with video.
        note: Found the car yourself? We can arrange the inspection separately
      - title: Buyback
        desc: We handle the buyback and customs clearance of vehicles with foreign plates.
        note: Is the car already abroad? We can help with the paperwork
    heroLine1: We'll find your car.
    heroLine2: We'll check it.
    heroLine3: We'll bring it.
    heroSubtext: We source cars in Germany, Spain, Switzerland, or Serbia, and if it's in another country, we'll bring it to you with inspection, paperwork, and customs clearance.
    statClients:
      value: 200+
      label: clients
    statCountries:
      label: countries
    statYears:
      value: 5 years
      label: in the market
    journeyHeading: 'One journey: from search to keys'
    journeySubtext: Car sourcing, import, inspection, and buyback are not different services but stages in your vehicle's journey. You can join at any step.
    whyUsHeading: Why choose us
    whyUsSubtext: Buying a car from another country raises questions. Here's how we address them.
    trustCards:
      - title: Full transparency
        text: 'We send a detailed checklist (100+ points) and videos of every detail: body, interior, suspension. You see the car as if you were standing next to it.'
      - title: Transaction safety
        text: 'Step-by-step payment and clear terms. We guide all paperwork at every stage: registration, customs clearance, vehicle registration — no surprises.'
      - title: Local expertise
        text: 'We know the specifics of each market: German autobahn mileage, features of Spanish cars, and nuances for foreign plate registration in Serbia.'
    testimonialsHeading: What our clients say
    testimonials:
      - quote: «They brought a BMW 3 series from Munich to Belgrade. Everything was clear — from inspection to registration. Saved a lot of hassle with the paperwork.»
        name: Александр
        caption: BMW 320d, Germany → Serbia
      - quote: «I searched for a Skoda Octavia in good condition for a long time. The team found an option in Spain, checked it with an independent expert — it matched the description perfectly.»
        name: Михаил
        caption: Skoda Octavia, Spain → Russia
      - quote: «Registering with foreign plates seemed complicated. The team guided me through every step — and within a month, I was already driving. Highly recommend.»
        name: Дмитрий
        caption: VW Passat, Germany → Serbia
    ctaEyebrow: Ready to get started?
    ctaHeading:
      line1: Tell us about the
      line2: car you’re looking for
      accentWord: that you want
    ctaSubtext: We respond within 2 hours. Consultation is free.
    ctaTelegramLabel: Message us on Telegram
    ctaStatResponse:
      value: 2 hrs
      label: response
    origin:
      heading: Where we source from
      note: We can deliver to any country — we'll discuss it upon inquiry
      euTitle: From Europe
      euText: Germany, Spain, Switzerland, and other European countries. We source locally, inspect before purchase, handle export, transport, and customs clearance. We'll provide the final cost before the deal, not after crossing the border.
      euCta: Calculate import from Europe
      chinaTitle: From China
      chinaText: New and used cars from China through a trusted partner. Sourcing based on your budget, inspection before shipping, delivery and customs clearance — following the same process as for Europe.
      chinaCta: Calculate import from China
      chinaTags:
        - New
        - Used
        - All-inclusive
    catalogue:
      heading: Recent deals
      subtext: 'There are no listings here: each car has been found, inspected, processed, and handed over to a person. The price is what they actually paid.'
      allCountriesLabel: All countries
      moreLabel: Show more {rest}
    inspection:
      heading: One hundred points, four areas define the outcome
      subtext: The checklist is long, but deals usually fall through over one of four areas. Click the number on the diagram — we'll show you what the expert checks and what we've found.
      hint: Click the number on the diagram
      ctaLabel: Order an inspection
      pointsLabel: 100+ points
      mediaLabel: photos and videos
      reportLabel: report before a decision
      zones:
        - title: Body and paintwork
          text: Measurement of each panel, door geometry, signs of welding and filler. This reveals if any repairs were done that the seller forgot to mention.
          points:
            - Repainting and touch-ups on panels
            - Gaps and geometry after impact
            - Rust in sills and wheel arches
            - Originality of glass and optics
        - title: Engine and transmission
          text: Parameters on a warmed-up engine, transmission adaptations, errors in the block memory. This is the most expensive area — and the most common reason for rejection.
          points:
            - Stretching of the timing chain
            - Leaks and sweat
            - Transmission adaptations and jolts
            - Compression and smoke levels
          finding: '2025 BMW M340 with low mileage: diagnostics showed a 20% stretch in the timing chain. We discovered this before the deal — the client had a bargaining chip.'
        - title: Suspension and brakes
          text: Elevator inspection, play, condition of the suspension and braking system. German autobahn mileage and Balkan roads wear vehicles differently.
          points:
            - Play in control arms and ball joints
            - Leak in the shock absorbers
            - Wear of discs and pads
            - Steering rack and dust boots
        - title: Electronics, VIN, and documents
          text: Service history by VIN, tampered mileage, electronic errors, and legal clarity — liens, registration bans, unresolved accidents.
          points:
            - Discrepancy in mileage with history
            - Errors in block memory
            - Liens and registration bans
            - Unresolved accidents and insurance claims
    findingLabel: 'Found:'
    heroPhotoAlt: Sedan on a European highway
    ctaPhotoAlt: Clean body and wheel of a car up close
  sr:
    metaTitle: Auto pretraga, transport i otkup automobila u Evropi
    metaDescription: Auto pretraga u vašoj zemlji ili transport automobila iz Evrope i Kine – sve na jednom mestu. Provera i otkup. Radimo u celoj Evropi.
    journey:
      - title: Pretraga
        desc: Pronalažemo, proveravamo i dostavljamo automobil unutar vašeg budžeta – sve na jednom mestu, u Nemačkoj, Španiji, Srbiji i Švajcarskoj.
      - title: Transport
        desc: Auto nije u vašoj zemlji? Pronaći ćemo i dovesti ga iz Nemačke, Evrope ili Kine – sve na jednom mestu, uključujući carinjenje.
      - title: Provera
        desc: Nezavisni stručnjak pregleda automobil pre kupovine – više od 100 tačaka uz video.
        note: Pronašli ste auto sami? Naravno, možemo naručiti proverenje posebno.
      - title: Otkup
        desc: Uređujemo otkup i carinjenje automobila sa stranim registarskim tablicama.
        note: Auto je već u inostranstvu? Pomoći ćemo da ga registrujete.
    heroLine1: Naći ćemo auto.
    heroLine2: Proverićemo.
    heroLine3: Dovestićemo.
    heroSubtext: Pronaći ćemo auto u Nemačkoj, Španiji, Švajcarskoj ili Srbiji, a ako je u drugoj zemlji, dovešćemo ga do vas uz provere, registraciju i carinjenje.
    statClients:
      value: 200+
      label: klijenata
    statCountries:
      label: zemalja
    statYears:
      value: 5 godina
      label: na tržištu
    journeyHeading: 'Jedan put: od pretrage do ključeva'
    journeySubtext: Auto pretraga, transport, provera i otkup – nisu različite usluge, već faze jednog puta vašeg automobila. Možete početi s bilo kojim korakom.
    whyUsHeading: Zašto nas biraju
    whyUsSubtext: Kupovina auta iz druge zemlje donosi pitanja. Evo kako ih rešavamo.
    trustCards:
      - title: Potpuna transparentnost
        text: 'Šaljemo detaljnu listu (više od 100 tačaka) i video svakog detalja: karoserija, enterijer, mehanika. Vidite auto kao da stojite pored njega.'
      - title: Sigurnost transakcije
        text: 'Postepeno plaćanje i jasni uslovi. Pratimo dokumentaciju na svim fazama: registracija, carinjenje, registracija – bez iznenađenja.'
      - title: Lokalna stručnost
        text: 'Znao sam specifičnosti svakog tržišta: autobahnske kilometraže u Nemačkoj, karakteristike karoserije španskih automobila, detalje registracije stranih registarskih tablica u Srbiji.'
    testimonialsHeading: Šta kažu klijenti
    testimonials:
      - quote: «Doveli su BMW 3 serije iz Minhena u Beograd. Sve je bilo jasno – od pregleda do registracije. Uštedeli smo hrpu živaca oko registracije.»
        name: Aleksandar
        caption: BMW 320d, Nemačka → Srbija
      - quote: «Dugo sam tražio Škodu Oktaviju u dobrom stanju. Momci su našli opciju u Španiji, proverili nezavisnim stručnjakom – sve se poklopilo s opisom.»
        name: Mihail
        caption: Škoda Oktavija, Španija → Rusija
      - quote: «Registracija na stranim tablicama delovala je komplikovano. Tim me provedo kroz svaki korak – i mesec dana kasnije već sam vozio. Preporučujem.»
        name: Dmitrij
        caption: VW Passat, Nemačka → Srbija
    ctaEyebrow: Spremni za početak?
    ctaHeading:
      line1: Ispričajte nam
      line2: o automobilu,
      accentWord: koji tražite
    ctaSubtext: Odgovaramo u roku od 2 sata. Konsultacija je besplatna.
    ctaTelegramLabel: Pitajte na Telegramu
    ctaStatResponse:
      value: 2 h
      label: odgovor
    origin:
      heading: Odakle dovožimo
      note: Dovodimo u svaku zemlju – dogovaraćemo se prilikom prijave
      euTitle: Iz Evrope
      euText: Nemačka, Španija, Švajcarska i druge zemlje Evrope. Pronađemo na licu mesta, proveravamo pre kupovine, završavamo izvoz, prevozimo i carinimo. Konačnu cenu nazivamo pre transakcije, a ne posle granice.
      euCta: Izračunati transport iz Evrope
      chinaTitle: Iz Kine
      chinaText: Novi i polovni automobili iz Kine preko proverenih partnera. Pretraga u skladu s vašim budžetom, provera pre slanja, dostava i carinjenje – na isti način kao i za Evropu.
      chinaCta: Izračunati transport iz Kine
      chinaTags:
        - Novi
        - Sa pređenim kilometrima
        - Sve na jednom mestu
    catalogue:
      heading: Poslednje transakcije
      subtext: 'Ovde nema oglasa: svaki automobil je pronađen, proveren, registrovan i predat osobi. Cena je ona koju je on platio.'
      allCountriesLabel: Sve zemlje
      moreLabel: Prikaži još {rest}
    inspection:
      heading: Sto tačaka, od kojih rešavaju četiri
      subtext: Lista je dugačka, ali se gotovo uvek transakcije odbijaju zbog jednog od četiri područja. Pritisnite broj na dijagramu – pokazat ćemo šta stručnjak proverava i šta smo tamo pronalazili.
      hint: Pritisnite broj na dijagramu
      ctaLabel: Naručiti proveru
      pointsLabel: 100+ tačaka
      mediaLabel: fotografije i video
      reportLabel: izveštaj pre odluke
      zones:
        - title: Karoserija i lak
          text: Mera debljine po svakoj paneli, geometrija otvora, tragovi zavarivanja i kitovanja. Odatle se vidi da li je bilo popravki o kojima prodavac nije govorio.
          points:
            - Prebojanost i prefarbavanje panela
            - Razmaci i geometrija posle udarca
            - Korozija na pragovima i blatobranima
            - Originalnost stakala i svetala
        - title: Motor i menjač
          text: Parametri na zagrejanom motoru, adaptacije menjača, greške u memoriji uređaja. Najskuplja zona — i najčešći razlog odbijanja.
          points:
            - Produžetak lanca TIM-a
            - Curenje i zamagljivanje
            - Adaptacije i trzaji menjača
            - Kompresija i dimnost
          finding: 'BMW M340 iz 2025. godine sa malim brojem pređenih kilometara: dijagnostika je pokazala produženje lanca TIM-a od oko 20 %. Pronašli smo pre sporazuma – klijent je dobio argument za pregovaranje.'
        - title: Oprema i kočnice
          text: Dizalica, lufta, stanje suspenzije i kočionog sistema. Nemačka autobahnska kilometraža i balkanske ceste troše auto na različite načine.
          points:
            - Luftovi u polugama i kuglama
            - Curanje amortizera
            - Habanje diskova i pločica
            - Servo upravljač i zaštitnici
        - title: Elektronika, VIN i dokumenti
          text: Servisna istorija po VIN-u, prepravljen kilometraža, greške u elektronici i pravna čistoća – založna prava, zabrana registracije, nezatvoreni udesi.
          points:
            - Razlika u kilometraži s istorijom
            - Greške u memoriji uređaja
            - Založna prava i zabrana registracije
            - Nezatvoreni udesi i osiguranje
    findingLabel: 'Pronašli smo:'
    heroPhotoAlt: Limuzina na evropskom autoputu
    ctaPhotoAlt: Čista karoserija i točak automobila u krupnom planu
