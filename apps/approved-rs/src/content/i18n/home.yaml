    inspection:
      heading: Sto tačaka, od kojih četiri odlučuju
      subtext: Checklist je dug, ali gotovo uvek se odluka o transakciji donosi zbog jedne od četiri oblasti. Kliknite na broj na shemi — pokazujemo šta proverava stručnjak i šta smo tamo pronašli.
