translations:
  en:
    metaTitle: Car Sourcing, Import, and Buyback in Europe
    metaDescription: Car sourcing in your country or importing a vehicle from Europe and China — all-inclusive. Inspection and buyback services. We cater to Russian speakers worldwide.
    journey:
      - title: Sourcing
        desc: We find, inspect, and deliver vehicles tailored to your budget — all-inclusive, in Germany, Spain, Serbia, and Switzerland.
      - title: Import
        desc: Is the car outside your country? We'll source and import it from Germany, Europe, or China — all-inclusive, including customs clearance.
      - title: Inspection
        desc: An independent expert inspects the vehicle before purchase — over 100 checkpoints with video documentation.
        note: Found the car yourself? We can arrange a separate inspection.
      - title: Buyback
        desc: We handle the buyback and customs clearance for vehicles with foreign plates.
        note: Is the car already abroad? We can assist with the paperwork.
    heroLine1: Found.
    heroLine2: Inspected.
    heroLine3: Delivered.
    heroSubtext: We’ll source, inspect, and manage the import of your vehicle from Germany, Spain, or Serbia. One path, one team.
    statClients:
      value: 200+
      label: clients
    statCountries:
      label: countries
    statYears:
      value: 5 years
      label: in the market
    journeyHeading: 'One journey: from search to keys'
    journeySubtext: Car sourcing, import, inspection, and buyback — these aren’t separate services, but stages of your vehicle’s journey. You can start at any step.
    whyUsHeading: Why choose us
    whyUsSubtext: Buying a car from another country raises questions. Here’s how we address them.
    trustCards:
      - title: Complete Transparency
        text: 'We provide a detailed checklist (100+ points) and video documentation of every detail: bodywork, interior, drivetrain. You see the car as if you are right next to it.'
      - title: Safe Transactions
        text: 'Staged payments and clear terms. We assist with documents at every step: registration, customs clearance — no surprises.'
      - title: Local Expertise
        text: 'We know the specifics of each market: German autobahn mileage, peculiarities of Spanish vehicle bodies, and nuances of registration for foreign plates in Serbia.'
    ctaEyebrow: Ready to start?
    ctaHeading:
      line1: Tell us about your
      line2: vehicle
      accentWord: vehicle
    ctaSubtext: We respond within 2 hours. Consultation is free.
    ctaTelegramLabel: Message on Telegram
    ctaStatClients:
      value: 200+
      label: clients
    ctaStatCountries:
      label: countries
    ctaStatYears:
      value: 5 years
      label: experience
    ctaStatResponse:
      value: 2 hrs
      label: response time
    origin:
      heading: Where we import from
      note: We can deliver to any country — we can discuss it during your inquiry
      euTitle: From Europe
      euText: Germany, Spain, Switzerland, and other EU countries. We source on-site, inspect before purchase, handle export documentation, transport, and customs clearance. We provide the final cost before the deal, not after crossing the border.
      euCta: Calculate import from Europe
      chinaTitle: From China
      chinaText: New and used vehicles from China through a trusted partner. Sourcing according to your budget, pre-shipment inspection, delivery, and customs clearance — following the same process as for Europe.
      chinaCta: Calculate import from China
      chinaTags:
        - New
        - Used
        - All-inclusive
    catalogue:
      heading: What you can expect for that budget
      subtext: 'There are no listings here: every car is sourced, inspected, processed, and handed over to the client. The price reflects what they paid.'
      budgetLabel: Budget for the car, up to
      allCountriesLabel: All countries
      countTemplate: '{shown} out of {total} available'
      moreLabel: Show more {rest}
      emptyText: We haven’t closed deals in this budget range in the selected country yet. Contact us — we’ll let you know honestly what is realistically available.
    inspection:
      heading: One hundred points, from which four matter
      subtext: The checklist is long, but deals are usually scuttled over one of four areas. Click the number on the diagram to see what the expert checks and what we’ve found.
      hint: Click the number on the diagram
      ctaLabel: Order an inspection
      pointsLabel: 100+ points
      mediaLabel: photos and videos
      reportLabel: report before the decision
      zones:
        - title: Body and Paintwork
          text: Thickness measurements on each panel, geometry of openings, signs of welding and body filler. This reveals whether repairs were made that the seller forgot to mention.
          points:
            - Repainting and touch-ups
            - Gaps and geometry after impacts
            - Corrosion in sills and arches
            - Originality of glass and lighting
        - title: Engine and Transmission
          text: Parameters on a warmed-up engine, transmission adaptations, errors in block memory. This is the most expensive area — and the most common reason for refusal.
          points:
            - Timing chain stretch
            - Leaks and seepage
            - Adaptation and jolts of the transmission
            - Compression and exhaust smoke
          finding: '2025 BMW M340 with low mileage: diagnostics revealed around 20% timing chain stretch. We discovered this before the deal — giving the client leverage for negotiation.'
        - title: Suspension and Brakes
          text: Lift measurements, play, condition of suspension and braking systems. German autobahn use and Balkan roads wear a car in different ways.
          points:
            - Play in control arms and ball joints
            - Leakage in shock absorbers
            - Wear on discs and pads
            - Steering rack and bellows
        - title: Electronics, VIN, and Documents
          text: Service history by VIN, altered mileage, electronic errors, and legal clean status — liens, registration bans, unresolved accidents.
          points:
            - Mileage discrepancies with history
            - Errors in block memory
            - Liens and registration bans
            - Unresolved accidents and insurance events
    findingLabel: 'We found:'
    heroPhotoNote: delivered to the client
    heroPhotoAlt: Ineos Grenadier sourced in Germany and delivered to the client
    ctaPhotoAlt: Clean body and wheel of the car in close-up
