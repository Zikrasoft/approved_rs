          text: Tachometar na svakoj ploči, geometrija otvora, tragovi zavarivanja i špakhla. Ovde se vidi da li je bilo popravki za koje je prodavac zaboravio.
          points:
            - Prebojana i dotjerana ploča
            - Razmaci i geometrija nakon udarca
            - Kiselina u pragovima i lukovima
            - Originalnost stakala i svetala
        - title: Motor i menjač
          text: Parametri na zagrejanom motoru, prilagodbe menjača, greške u memoriji blokova. Najskuplja zona — i najčešći razlog odbijanja.
          points:
