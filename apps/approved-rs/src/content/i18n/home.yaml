  de:
    metaTitle: Autowahl, Import und Rückkauf von Autos in Europa
    metaDescription: Fahrzeugauswahl im Heimatland oder Import von Autos aus Europa und China. Prüfung und Rückkauf. Wir arbeiten in ganz Europa.
    journey:
      - title: Wahl
        desc: Wir finden, überprüfen und liefern das Auto nach Ihrem Budget, schlüsselfertig in Deutschland, Spanien, Serbien und der Schweiz.
      - title: Import
        desc: Das Auto ist nicht in Ihrem Land? Wir finden es und importieren es aus Deutschland, Europa oder China schlüsselfertig, inklusive Zollabwicklung.
      - title: Prüfung
        desc: Ein unabhängiger Experte überprüft das Fahrzeug vor dem Kauf nach über 100 Punkten mit Video.
        note: Haben Sie das Auto selbst gefunden? Wir führen die Prüfung separat durch.
      - title: Rückkauf
        desc: Wir kümmern uns um den Rückkauf und die Zollabfertigung von Fahrzeugen mit ausländischen Nummernschildern.
        note: Das Auto ist schon im Ausland? Wir helfen Ihnen bei der Abwicklung.
    heroLine1: Wir finden das Auto.
    heroLine2: Wir prüfen es.
    heroLine3: Wir bringen es.
    heroSubtext: Wir suchen ein Auto in Deutschland, Spanien, der Schweiz oder Serbien, und wenn es in einem anderen Land ist, bringen wir es zu Ihnen mit Überprüfung, Abwicklung und Zoll.
    statClients:
      value: 200+
      label: Kunden
    statCountries:
      label: Länder
    statYears:
      value: 5 Jahre
      label: auf dem Markt
    journeyHeading: 'Ein Weg: von der Suche bis zu den Schlüsseln'
    journeySubtext: Die Fahrzeugauswahl, der Import, die Prüfung und der Rückkauf sind nicht verschiedene Dienstleistungen, sondern Schritte auf dem Weg Ihres Fahrzeugs. Sie können jederzeit einsteigen.
    whyUsHeading: Warum uns wählen
    whyUsSubtext: Der Kauf eines Autos aus einem anderen Land wirft Fragen auf. So gehen wir diese an.
    trustCards:
      - title: Vollständige Transparenz
        text: 'Wir senden eine detaillierte Checkliste (über 100 Punkte) und Videos zu jedem Detail: Karosserie, Innenraum, Fahrwerk. Sie sehen das Auto, als ob Sie direkt daneben stehen.'
      - title: Sicherheit der Transaktion
        text: 'Zahlung in Raten und transparente Bedingungen. Wir begleiten die Dokumente in allen Phasen: Abwicklung, Zoll, Registrierung. Ohne Überraschungen.'
      - title: Lokale Expertise
        text: 'Wir kennen die Besonderheiten jedes Marktes: Autobahnkilometer in Deutschland, Merkmale spanischer Autos, Details zur Abwicklung von ausländischen Nummernschildern in Serbien.'
    testimonialsHeading: Das sagen unsere Kunden
    testimonials:
      - quote: «Wir haben einen BMW 3er aus München nach Belgrad gebracht. Alles lief glatt, von der Inspektion bis zur Zulassung. Wir haben eine Menge Nerven bei der Abwicklung gespart.»
        name: Александр
        caption: BMW 320d, Deutschland → Serbien
      - quote: «Ich habe lange nach einem Skoda Octavia in gutem Zustand gesucht. Die Jungs fanden ein Angebot in Spanien, überprüften es durch einen unabhängigen Experten, alles stimmte mit der Beschreibung überein.»
        name: Михаил
        caption: Skoda Octavia, Spanien → Russland
      - quote: «Die Zulassung auf ausländischen Nummern erschien mir kompliziert. Das Team begleitete mich durch jeden Schritt, und nach einem Monat konnte ich schon fahren. Empfehlenswert.»
        name: Дмитрий
        caption: VW Passat, Deutschland → Serbien
    ctaEyebrow: Bereit zu starten?
    ctaHeading:
      line1: Erzählen Sie uns
      line2: von dem Auto,
      accentWord: das Sie suchen
    ctaSubtext: Wir antworten innerhalb von 2 Stunden. Beratung ist kostenlos.
    ctaTelegramLabel: Nachricht bei Telegram senden
    ctaStatResponse:
      value: 2 Std.
      label: Antwort
    origin:
      heading: Von wo wir importieren
      note: Wir liefern in jedes Land, Details besprechen wir bei der Anfrage
      euTitle: Aus Europa
      euText: Deutschland, Spanien, Schweiz und andere europäische Länder. Wir suchen vor Ort, überprüfen vor dem Kauf, erledigen die Ausfuhr, bringen und verzollen. Den Endpreis nennen wir vor dem Deal, nicht nach der Grenze.
      euCta: Import aus Europa berechnen
      chinaTitle: Aus China
      chinaText: Neue und gebrauchte Fahrzeuge aus China über einen geprüften Partner. Auswahl nach Ihrem Budget, Prüfung vor Versand, Lieferung und Zollabwicklung nach dem gleichen Verfahren wie in Europa.
      chinaCta: Import aus China berechnen
      chinaTags:
        - Neu
        - Gebraucht
        - Schlüsselfertig
    catalogue:
      heading: Neueste Geschäfte
      subtext: 'Hier gibt es keine Anzeigen: Jedes Auto wurde gefunden, überprüft, abgewickelt und an die Person übergeben. Der angegebene Preis ist der, den sie gezahlt haben.'
      allCountriesLabel: Alle Länder
      moreLabel: Weitere {rest} anzeigen
    inspection:
      heading: Hundert Punkte, von denen vier entscheiden
      subtext: Die Checkliste ist lang, aber die Entscheidung wird fast immer aufgrund eines der vier Bereiche abgelehnt. Klicken Sie auf die Nummer im Schema, und wir zeigen Ihnen, was der Experte überprüft und was wir dort gefunden haben.
      hint: Klicken Sie auf die Nummer im Diagramm
      ctaLabel: Prüfung bestellen
      pointsLabel: 100+ Punkte
      mediaLabel: Fotos und Videos
      reportLabel: Bericht vor der Entscheidung
      zones:
        - title: Karosserie und Lackierung
          text: Lackdickenmessung jeder Fläche, Geometrie der Öffnungen, Spuren von Schweißungen und Spachtelmasse. Daraus ist ersichtlich, ob es eine vergessene Reparatur gab.
          points:
            - Neulackierung und Nachlackierung von Platten
            - Spaltmaße und Geometrie nach dem Unfall
            - Rost in Schweller und Radkästen
            - Originalität der Scheiben und Beleuchtung
        - title: Motor und Getriebe
          text: Parameter bei warmem Motor, Anpassungen des Getriebes, Speicherfehler. Der teuerste Bereich und die häufigste Ablehnungsursache.
          points:
            - Dehnung der Steuerkette
            - Ölundichtigkeiten und schwitzende Stellen
            - Anpassungen und Ruckeln des Getriebes
            - Kompression und Rauchentwicklung
          finding: 'BMW M340 2025 mit geringer Laufleistung: Die Diagnose zeigte eine Dehnung der Steuerkette von etwa 20 %. Wir fanden es vor dem Deal, und der Kunde hatte ein Argument für Verhandlungen.'
        - title: Fahrwerk und Bremsen
          text: Bühne, Spiel, Zustand der Aufhängung und Bremsanlage. Deutsche Autobahnkilometer und Balkanjahrgänge nutzen das Auto unterschiedlich ab.
          points:
            - Spiel in den Querlenkern und Kugelgelenken
            - Ölundichtigkeiten der Dämpfer
            - Verschleiß der Scheiben und Beläge
            - Lenkgetriebe und Staubschutz
        - title: Elektronik, VIN und Dokumente
          text: 'Servicehistorie über die VIN, manipulierte Kilometerstände, Fehler in der Elektronik und rechtliche Klarheit: Pfand, Zulassungsverbot, offene Unfälle.'
          points:
            - Diskrepanz der Kilometerstände mit der Historie
            - Fehler im Speicher der Steuergeräte
            - Pfandrechte und Registrierungssperren
            - Ungeklärte Unfälle und Versicherungsschäden
    findingLabel: 'Wir haben gefunden:'
    heroPhotoAlt: Limousine auf europäischer Autobahn
    ctaPhotoAlt: Saubere Karosserie und Rad in naher Ansicht
