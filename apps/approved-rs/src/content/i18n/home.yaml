        text: 'Pago por etapas y condiciones claras. Acompañamos los documentos en todas las etapas: tramitación, aduana, registro, sin sorpresas.'
      - title: Experiencia local
        text: 'Conocemos las particularidades de cada mercado: kilometraje de autopista en Alemania, características de la carrocería de coches españoles, aspectos de documentación en Serbia.'
    testimonialsHeading: Lo que dicen los clientes
    testimonials:
      - quote: «Trajeron un BMW de la serie 3 de Múnich a Belgrado. Todo perfecto, desde la inspección hasta la matriculación. Ahorros de tiempo y nervios en la tramitación.»
        name: Александр
        caption: BMW 320d, Alemania → Serbia
      - quote: «Busqué durante mucho tiempo una Skoda Octavia en buen estado. El equipo encontró una opción en España, la revisaron con un experto independiente — todo coincidió con la descripción.»
        name: Михаил
        caption: Skoda Octavia, España → Rusia
      - quote: «El registro de matrículas extranjeras parecía complicado. El equipo me guió en cada paso, y en un mes ya estaba conduciendo. Lo recomiendo.»
        name: Дмитрий
        caption: VW Passat, Alemania → Serbia
    ctaEyebrow: ¿Listo para empezar?
    ctaHeading:
      line1: Cuéntanos
      line2: sobre el coche,
      accentWord: que buscas
    ctaSubtext: Respondemos en 2 horas. Consulta gratuita.
    ctaTelegramLabel: Escribir por Telegram
    ctaStatResponse:
      value: 2 h
      label: respuesta
    origin:
      heading: De dónde importamos
      note: Entregamos a cualquier país, lo discutiremos en la solicitud.
      euTitle: De Europa
      euText: Alemania, España, Suiza y otros países de Europa. Buscamos en el lugar, inspeccionamos antes de la compra, gestionamos la exportación, transportamos y aduanamos. Informamos la cantidad total antes de la transacción, no después de la frontera.
      euCta: Calcular importación de Europa
      chinaTitle: De China
      chinaText: Coches nuevos y usados de China a través de socios confiables. Sourcing según su presupuesto, verificación antes del envío, entrega y aduana, de la misma manera que desde Europa.
      chinaCta: Calcular importación de China
      chinaTags:
        - Nuevos
        - Usados
        - Todo incluido
    catalogue:
      heading: Últimas transacciones
      subtext: 'Aquí no hay anuncios: cada coche fue encontrado, inspeccionado, documentado y entregado a su propietario. El precio es el que se pagó.'
      allCountriesLabel: Todos los países
      moreLabel: Mostrar más {rest}
    inspection:
      heading: Cien puntos, de los cuales cuatro suelen decidir
      subtext: La lista de verificación es larga, pero generalmente se desestima la transacción por una de las cuatro áreas. Haga clic en el número en el esquema y le mostraremos lo que verifica el experto y lo que hemos encontrado allí.
      hint: Haga clic en el número en el esquema
      ctaLabel: Solicitar inspección
      pointsLabel: 100+ puntos
      mediaLabel: fotos y videos
      reportLabel: informe antes de decidir
      zones:
        - title: Carrocería y pintura
          text: Medición del grosor en cada panel, geometría de los marcos, señales de soldadura y masilla. Aquí se puede ver si hubo una reparación de la que el vendedor se olvidó.
          points:
            - Pintura y retoque de paneles
            - Desajustes y geometría después del impacto
            - Corrosión en los umbrales y arcos
            - Originalidad de los cristales y luces
        - title: Motor y transmisión
          text: Parámetros del motor en funcionamiento, adaptaciones de la transmisión, errores en la memoria de las unidades. La zona más costosa y la razón más común de desestimación.
          points:
            - Estiramiento de la cadena de distribución
            - Fugas y humedad
            - Adaptaciones y tirones en la transmisión
            - Compresión y emisión de humo
          finding: 'BMW M340 2025 con bajo kilometraje: el diagnóstico mostró un estiramiento de la cadena de distribución de aproximadamente 20 %. Lo detectamos antes de la transacción — el cliente tuvo un argumento para negociar.'
        - title: Suspensión y frenos
          text: Elevador, holguras, condición de la suspensión y sistema de frenos. El kilometraje de autopista alemán y las carreteras balcánicas desgastan el coche de diferentes maneras.
          points:
            - Holguras en brazos y esferas
            - Fugas en los amortiguadores
            - Desgaste de discos y pastillas
            - Crema dirección y fuelles
        - title: Electrónica, VIN y documentos
          text: Historial de servicio según el VIN, kilometraje manipulado, errores en la electrónica y limpieza legal — hipotecas, prohibiciones de registro, accidentes no cerrados.
          points:
            - Desajuste de kilometraje con el historial
            - Errores en la memoria de las unidades
            - Hipoteca y prohibición de registro
            - Accidentes no cerrados y eventos asegurados
