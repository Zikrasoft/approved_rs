      moreLabel: Mostrar más {rest}
      emptyText: En este presupuesto, en el país seleccionado no hemos cerrado ninguna transacción hasta ahora. Escríbanos — diremos honestamente lo que se puede conseguir.
    inspection:
      heading: Cien puntos, de los cuales cuatro deciden
      subtext: La lista de verificación es larga, pero casi siempre desaconsejan la transacción por una de las cuatro áreas. Presione un número en el esquema — le mostraremos lo que el experto revisa y qué hemos encontrado allí.
      hint: Presione un número en el esquema
      ctaLabel: Pedir inspección
