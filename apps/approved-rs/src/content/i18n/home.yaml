    catalogue:
      heading: Qué puedes comprar por este dinero
      subtext: 'Aquí no hay anuncios: cada auto está encontrado, verificado, tramitado y entregado a una persona. El precio es el que pagó él.'
      budgetLabel: Presupuesto para el auto, hasta
      allCountriesLabel: Todos los países
      countTemplate: Se ajusta {shown} de {total}
      moreLabel: Mostrar más {rest}
      emptyText: En este presupuesto, aún no hemos cerrado acuerdos en el país elegido. Escríbenos y te diremos honestamente qué se puede conseguir.
    inspection:
      heading: Cien puntos, de los cuales cuatro deciden
      subtext: La lista de verificación es larga, pero casi siempre desaconsejan la venta por alguna de las cuatro áreas. Haz clic en el número en el esquema — te mostramos qué revisa el experto y qué hemos encontrado.
      hint: Haz clic en el número en el esquema
      ctaLabel: Solicitar inspección
      pointsLabel: 100+ puntos
      mediaLabel: fotos y videos
      reportLabel: informe antes de decidir
      zones:
        - title: Carrocería y pintura
          text: Medición de grosor en cada panel, geometría de los marcos, huellas de soldaduras y masillas. Aquí se puede ver si hubo reparación de la que el vendedor se olvidó.
          points:
            - Repintado y retoque de paneles
            - Desajustes y geometría después de un impacto
            - Corrosión en los umbrales y arcos
            - Originalidad de los cristales y ópticas
        - title: Motor y transmisión
          text: Parámetros en motor caliente, adaptaciones de la transmisión, fallos en la memoria de los bloques. La zona más costosa — y la más frecuente causa de rechazo.
          points:
            - Alargamiento de la cadena de distribución
            - Fugas y condensaciones
            - Adaptaciones y tirones en la transmisión
            - Compresión y humos
          finding: 'BMW M340 2025 con bajo kilometraje: el diagnóstico mostró un alargamiento de la cadena de distribución del 20 %. Lo encontramos antes de la transacción — el cliente tuvo un argumento para negociar.'
        - title: Suspensión y frenos
          text: Elevador, holguras, estado de la suspensión y sistema de frenos. El kilometraje en autopista alemana y las carreteras balcánicas desgastan el auto de manera diferente.
          points:
            - Holguras en brazos y esferas
            - Fugas de amortiguadores
            - Desgaste de discos y pastillas
            - Crema de dirección y fuelles
        - title: Electrónica, VIN y documentos
          text: Historial de servicio por VIN, kilometraje manipulado, fallos de electrónica y limpieza legal — embargos, prohibición de registro, accidentes no reportados.
          points:
            - Discrepancia de kilometraje con historia
            - Errores en la memoria de bloques
            - Embargos y prohibición de registro
            - Accidentes no reportados y eventos de seguros
