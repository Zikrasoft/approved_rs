        desc: Gestionamos la compra y el despacho aduanal de vehículos con placas extranjeras.
        note: ¿El auto ya está en el extranjero? Lo ayudamos a formalizarlo
    heroLine1: Encontraremos el auto.
    heroLine2: Lo verificaremos.
    heroLine3: Lo traeremos.
    heroSubtext: Seleccionamos su auto en Alemania, España, Suiza o Serbia, y si está en otro país, lo llevamos a usted con inspección, formalización y despacho aduanal.
    statClients:
      value: 200+
      label: clientes
    statCountries:
