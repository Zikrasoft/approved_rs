  de:
    metaTitle: Autoauswahl, Import und Ankauf von Autos in Europa
    metaDescription: Autoauswahl im eigenen Land oder Import aus Europa und China — schlüsselfertig. Prüfung und Ankauf. Wir agieren in ganz Europa.
    journey:
      - title: Suche
        desc: Wir finden, prüfen und liefern das Auto nach Ihrem Budget — schlüsselfertig in Deutschland, Spanien, Serbien und der Schweiz.
      - title: Import
        desc: Das Auto ist nicht in Ihrem Land? Wir suchen und bringen es aus Deutschland, Europa oder China — schlüsselfertig inklusive Zollabwicklung.
      - title: Überprüfung
        desc: Ein unabhängiger Experte inspiziert das Fahrzeug vor dem Kauf — nach mehr als 100 Punkten mit Video.
        note: Haben Sie das Auto selbst gefunden? Wir können die Prüfung separat anfordern.
      - title: Ankauf
        desc: Wir kümmern uns um den Ankauf und die Zollabwicklung von Fahrzeugen mit ausländischen Nummernschildern.
        note: Ist das Auto bereits im Ausland? Wir helfen bei der Abwicklung.
    heroLine1: Wir finden das Auto.
    heroLine2: Wir prüfen es.
    heroLine3: Wir bringen es.
    heroSubtext: Wir finden das Auto in Deutschland, Spanien, der Schweiz oder Serbien. Sollte es in einem anderen Land sein, bringen wir es zu Ihnen mit Prüfung, Abwicklung und Zoll.
    statClients:
      value: 200+
      label: Kunden
    statCountries:
      label: Länder
    statYears:
      value: 5 Jahre
      label: auf dem Markt
    journeyHeading: 'Ein Weg: vom Suchen zu den Schlüsseln'
    journeySubtext: Autoauswahl, Import, Prüfung und Ankauf — nicht unterschiedliche Dienstleistungen, sondern Etappen eines gemeinsamen Weges für Ihr Fahrzeug. Man kann an jedem Punkt einsteigen.
    whyUsHeading: Warum uns wählen
    whyUsSubtext: Der Kauf eines Autos aus einem anderen Land wirft Fragen auf. So nehmen wir Ihnen diese.
    trustCards:
      - title: Volle Transparenz
        text: 'Wir senden eine detaillierte Checkliste (über 100 Punkte) und Videos zu jedem Detail: Karosserie, Innenraum, Fahrwerk. Sie sehen das Fahrzeug, als stünden Sie daneben.'
      - title: Sicherheit der Transaktion
        text: 'Schrittweise Zahlung und klare Bedingungen. Wir begleiten die Dokumente in allen Phasen: Abwicklung, Zoll, Registrierung — ohne Überraschungen.'
      - title: Lokale Expertise
        text: 'Wir kennen die Besonderheiten jedes Marktes: Autobahnfahrten in Deutschland, Merkmale spanischer Fahrzeuge, Aspekte der Zulassung für ausländische Nummernschilder in Serbien.'
    testimonialsHeading: Was Kunden sagen
    testimonials:
      - quote: „Wir haben einen BMW 3er aus München nach Belgrad bringen lassen. Alles war klar — von der Inspektion bis zur Zulassung. Haben viele Nerven bei der Abwicklung gespart.“
        name: Alexander
        caption: BMW 320d, Deutschland → Serbien
      - quote: „Ich habe lange nach einem Skoda Octavia in gutem Zustand gesucht. Die Leute fanden eine Option in Spanien, prüften sie mit einem unabhängigen Experten — alles stimmte mit der Beschreibung überein.“
        name: Mikhail
        caption: Skoda Octavia, Spanien → Russland
      - quote: „Die Zulassung von ausländischen Nummernschildern schien kompliziert. Das Team begleitete mich durch jeden Schritt — und nach einem Monat konnte ich bereits fahren. Ich empfehle.“
        name: Dmitry
        caption: VW Passat, Deutschland → Serbien
    ctaEyebrow: Bereit zu starten?
    ctaHeading:
      line1: Erzählen Sie uns
      line2: von dem Auto,
      accentWord: das Sie suchen
    ctaSubtext: Wir antworten innerhalb von 2 Stunden. Beratung ist kostenlos.
    ctaTelegramLabel: Nachricht auf Telegram
    ctaStatResponse:
      value: 2 Std.
      label: Antwort
    origin:
      heading: Woher importieren wir
      note: Wir liefern in jedes Land — Details besprechen wir bei Anfrage.
      euTitle: Aus Europa
      euText: Deutschland, Spanien, Schweiz und andere europäische Länder. Wir suchen vor Ort, prüfen vor dem Kauf, organisieren den Export, bringen und verzollen. Den Gesamtpreis nennen wir vor dem Deal, nicht nach der Grenze.
      euCta: Import aus Europa berechnen
      chinaTitle: Aus China
      chinaText: Neue und gebrauchte Autos aus China über einen geprüften Partner. Auswahl gemäß Ihrem Budget, Prüfung vor dem Versand, Lieferung und Zollabwicklung — in gleicher Weise wie in Europa.
      chinaCta: Import aus China berechnen
      chinaTags:
        - Neu
        - Gebraucht
        - Schlüsselfertig
    catalogue:
      heading: Letzte Transaktionen
      subtext: 'Hier gibt es keine Anzeigen: jedes Auto wurde gefunden, geprüft, abgewickelt und übergeben. Der Preis ist der, den der Käufer bezahlt hat.'
      allCountriesLabel: Alle Länder
      moreLabel: Weitere {rest} anzeigen
    inspection:
      heading: Hundert Punkte, aus denen vier entscheiden
      subtext: Die Checkliste ist lang, aber fast immer wird von der Transaktion aufgrund eines der vier Bereiche abgeraten. Klicken Sie auf die Nummer im Diagramm — wir zeigen, was der Experte überprüft und was wir dort gefunden haben.
      hint: Klicken Sie auf die Nummer im Diagramm
      ctaLabel: Überprüfung anfordern
      pointsLabel: 100+ Punkte
      mediaLabel: Fotos und Videos
      reportLabel: Bericht vor Entscheidung
      zones:
        - title: Karosserie und Lack
          text: Punktzahlmesser für jedes Blech, Geometrie der Öffnungen, Spuren von Schweiß und Spachtelmasse. Hier sieht man, ob es einen vergessenen Reparatur gab.
          points:
            - Lackierungen und Nachlackierungen der Bleche
            - Spaltmaße und Geometrie nach einem Unfall
            - Korrosion an den Schwellern und Radhäusern
            - Originalität von Glas und Beleuchtung
        - title: Motor und Getriebe
          text: Parameter bei warmem Motor, Anpassungen des Getriebes, Fehler im Gedächtnis der Steuergeräte. Der teuerste Bereich — und die häufigste Ursache für Ablehnung.
          points:
            - Dehnung der Steuerkette
            - Leckagen und Nässe
            - Anpassungen und Ruckeln des Getriebes
            - Kompression und Rußbildung
          finding: 'BMW M340 2025 mit geringem Kilometerstand: Die Diagnose zeigte eine Dehnung der Steuerkette von etwa 20 %. Wir fanden das vor dem Abschluss — der Kunde hatte ein Argument für Verhandlungen.'
        - title: Fahrwerk und Bremsen
          text: Bühne, Spiel, Zustand der Aufhängung und des Bremssystems. Deutsche Autobahnfahrten und Balkastraßen nutzen das Fahrzeug unterschiedlich ab.
          points:
            - Spiel in den Lenkern und Kugellagern
            - Ölleckagen bei Stoßdämpfern
            - Abnutzung der Scheiben und Beläge
            - Lenkgetriebe und Staubschutz
        - title: Elektronik, VIN und Dokumente
          text: Servicehistorie nach VIN, manipulierte Kilometerstände, Fehler in der Elektronik und rechtliche Sauberkeit — Pfandrechte, Zulassungsverbot, nicht abgeschlossene Unfälle.
          points:
            - Abweichung des Kilometerstands von der Historie
            - Fehler im Gedächtnis der Steuergeräte
            - Pfandrechte und Zulassungsverbot
            - Nicht abgeschlossene Unfälle und Versicherungsereignisse
    findingLabel: 'Gefunden:'
    heroPhotoAlt: Limousine auf einer europäischen Autobahn
    ctaPhotoAlt: Reiner Karosserie und Rad des Fahrzeugs im Detail
