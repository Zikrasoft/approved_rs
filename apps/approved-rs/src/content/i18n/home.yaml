      allCountriesLabel: Todos los países
      moreLabel: Mostrar más {rest}
    inspection:
      heading: Cien puntos de los cuales se deciden cuatro
      subtext: La lista de verificación es extensa, pero casi siempre las decisiones se deben a una de cuatro áreas. Toque un número en el esquema — le mostraremos qué revisa el experto y qué encontramos.
      hint: Toque un número en el esquema
      ctaLabel: Solicitar inspección
      pointsLabel: 100+ puntos
      mediaLabel: fotos y videos
      reportLabel: informe antes de decidir
      zones:
        - title: Carrocería y pintura
          text: Medición de espesor en cada panel, geometría de marcos, señales de soldadura y enmasillado. Desde aquí se puede ver si ha habido reparaciones que el vendedor ha olvidado.
          points:
            - Pintura y retoques en paneles
            - Espacios y geometría después de un accidente
            - Corrosión en umbrales y arcos
            - Originalidad de cristales y ópticas
        - title: Motor y transmisión
          text: Parámetros en motor caliente, adaptaciones de la transmisión, errores en memoria de módulos. La zona más costosa — y la causa más común de rechazo.
          points:
            - Alargamiento de la cadena de distribución
            - Fugas y sudoraciones
            - Adaptaciones y tirones en la transmisión
            - Compresión y humo
          finding: 'BMW M340 2025 con poco kilometraje: diagnóstico mostró alargamiento de la cadena de distribución del 20 %. Lo encontramos antes de la transacción — el cliente tuvo un argumento para negociar.'
        - title: Suspensión y frenos
          text: Elevador, holguras, estado de la suspensión y sistema de frenos. El kilometraje en autopista alemana y las carreteras balcánicas desgastan el auto de manera diferente.
          points:
            - Holguras en brazos y rótulas
            - Fugas en amortiguadores
            - Desgaste de discos y pastillas
            - Dirección y fuelles
        - title: Electrónica, VIN y documentos
          text: Historial de servicio por VIN, kilometraje manipulado, errores electrónicos y estado legal — gravámenes, prohibiciones de registro, accidentes no cerrados.
          points:
            - Discrepancia de kilometraje con el historial
            - Errores en memoria de módulos
            - Gravámenes y prohibiciones de registro
            - Accidentes no cerrados y eventos asegurados
