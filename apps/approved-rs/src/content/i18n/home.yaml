  de:
    metaTitle: Fahrzeugsuche, Import und Rückkauf in Europa
    metaDescription: Fahrzeugsuche in Ihrem Land oder Import aus Europa und China – schlüsselfertig. Prüfung und Rückkauf. Wir arbeiten für russischsprachige Kunden weltweit.
    journey:
      - title: Fahrzeugauswahl
        desc: Wir finden, prüfen und liefern das Auto nach Ihrem Budget – schlüsselfertig, in Deutschland, Spanien, Serbien und der Schweiz.
      - title: Import
        desc: Das Auto ist nicht in Ihrem Land? Wir suchen und importieren es aus Deutschland, Europa oder China – schlüsselfertig, einschließlich Zollabwicklung.
      - title: Prüfung
        desc: Ein unabhängiger Experte prüft das Fahrzeug vor dem Kauf – nach über 100 Punkten mit Video.
        note: Haben Sie das Auto selbst gefunden? Dann können wir die Prüfung separat bestellen.
      - title: Rückkauf
        desc: Wir kümmern uns um den Rückkauf und die Zollabwicklung des Fahrzeugs mit ausländischen Kennzeichen.
        note: Das Fahrzeug ist bereits im Ausland? Wir helfen bei der Abwicklung.
    heroLine1: Gefunden.
    heroLine2: Geprüft.
    heroLine3: Geliefert.
    heroSubtext: Wir finden, prüfen, bearbeiten und importieren Ihr Auto aus Deutschland, Spanien oder Serbien. Ein Weg, ein Team.
