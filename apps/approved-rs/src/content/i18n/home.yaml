    origin:
      heading: Von wo wir importieren
      note: Wir liefern in jedes Land – besprechen wir bei der Anfrage
      euTitle: Aus Europa
      euText: Deutschland, Spanien, Schweiz und andere EU-Länder. Wir beschaffen lokal, inspizieren vor dem Kauf, kümmern uns um den Export, transportieren und zollabwickeln. Den Endpreis nennen wir vor der Transaktion, nicht nach der Grenze.
      euCta: Import aus Europa kalkulieren
      chinaTitle: Aus China
      chinaText: Neue und gebrauchte Fahrzeuge aus China über einen geprüften Partner. Beschaffung nach Ihrem Budget, Prüfung vor dem Versand, Lieferung und Zollabwicklung – im gleichen Verfahren wie aus Europa.
      chinaCta: Import aus China kalkulieren
      chinaTags:
        - Neu
        - Gebraucht
        - Schlüsselfertig
    catalogue:
      heading: Was bekommt man für dieses Geld
      subtext: 'Hier gibt es keine Anzeigen: jedes Auto wurde gefunden, geprüft, dokumentiert und an den Kunden übergeben. Der Preis ist der, den er gezahlt hat.'
      budgetLabel: Budget für das Auto, bis
      allCountriesLabel: Alle Länder
      countTemplate: '{shown} aus {total} passen'
      moreLabel: Weitere anzeigen {rest}
      emptyText: Für dieses Budget haben wir im gewählten Land bisher keine Transaktionen abgeschlossen. Schreiben Sie uns – wir sagen Ihnen ehrlich, was Sie wirklich bekommen können.
    inspection:
      heading: Hundert Punkte, von denen vier entscheiden
      subtext: Die Checkliste ist lang, doch fast immer wird von einem der vier Bereiche von der Transaktion abgeraten. Klicken Sie die Nummer auf dem Diagramm an – wir zeigen Ihnen, was der Experte sieht und was wir dort gefunden haben.
      hint: Klicken Sie die Nummer auf dem Diagramm an
      ctaLabel: Prüfung anfordern
      pointsLabel: 100+ Punkte
      mediaLabel: Fotos und Videos
      reportLabel: Bericht vor der Entscheidung
      zones:
        - title: Karosserie und Lack
          text: Lackschichtdicke an jedem Paneel, Geometrie der Öffnungen, Spuren von Schweiß- und Spachtelarbeiten. Hier sieht man, ob eine Reparatur stattgefunden hat, die der Verkäufer vergessen hat.
          points:
            - Lackierung und Nachlackierung von Panelen
            - Spaltmaße und Geometrie nach einem Schlag
            - Korrosion in den Schwellen und Radkästen
            - Originalität der Fenster und Beleuchtung
        - title: Motor und Getriebe
          text: Parameter bei warmem Motor, Anpassungen des Getriebes, Fehler im Speicher der Steuergeräte. Der teuerste Bereich – und häufigster Grund für eine Ablehnung.
          points:
            - Dehnung der Steuerketten
            - Ölleckagen und -nässe
            - Anpassungen und Ruckeln des Getriebes
            - Kompression und Rauchentwicklung
          finding: 'BMW M340, Baujahr 2025 mit geringem Kilometerstand: Die Diagnose zeigte eine Dehnung der Steuerkette von etwa 20 %. Wir haben es vor der Transaktion gefunden – der Kunde hatte ein Argument für die Verhandlung.'
        - title: Fahrwerk und Bremsen
          text: Hebebühne, Spiel, Zustand der Federung und Bremsanlage. Deutsche Autobahnfahrten und Balkanstrecken beanspruchen das Fahrzeug unterschiedlich.
          points:
            - Spiel der Querlenker und Kugellager
            - Ölleckagen bei Stoßdämpfern
            - Abnutzung der Bremsscheiben und -klötze
            - Lenkungsmechanik und Manschetten
        - title: Elektronik, VIN und Dokumente
          text: Servicehistorie anhand der VIN, manipulierte Kilometerstände, Fehler in der Elektronik und rechtliche Sauberkeit – Pfandrechte, Zulassungsverbote, unbehandelte Unfälle.
          points:
            - Abweichungen im Kilometerstand zur Historie
            - Fehler im Speicher der Steuergeräte
            - Pfandrechte und Zulassungsverbote
            - Unbehandelte Unfälle und Versicherungsereignisse
    findingLabel: 'Gefunden:'
    heroPhotoNote: an den Kunden übergeben
    heroPhotoAlt: Ineos Grenadier, in Deutschland beschafft und an den Kunden übergeben
    ctaPhotoAlt: Saubere Karosserie und Reifen des Fahrzeugs im Nahaufnahme
