  de:
    metaTitle: Autoauswahl, Import und Rückkauf in Europa
    metaDescription: Autoauswahl im eigenen Land oder Import von Autos aus Europa und China — schlüsselfertig. Prüfung und Rückkauf. Wir sind in ganz Europa tätig.
    journey:
      - title: Auswahl
        desc: Wir finden, prüfen und liefern das Auto nach Ihrem Budget — schlüsselfertig, in Deutschland, Spanien, Serbien und der Schweiz.
      - title: Import
        desc: Das Auto ist nicht in Ihrem Land? Wir suchen und bringen es aus Deutschland, Europa oder China — schlüsselfertig, inklusive Zollabwicklung.
      - title: Prüfung
        desc: Ein unabhängiger Experte untersucht das Auto vor dem Kauf — über 100 Punkte mit Video.
        note: Haben Sie das Auto selbst gefunden? Wir können die Prüfung separat beauftragen.
      - title: Rückkauf
        desc: Wir kümmern uns um den Rückkauf und die Zollabwicklung des Fahrzeugs mit ausländischen Kennzeichen.
        note: Das Auto ist bereits im Ausland? Wir helfen Ihnen bei der Abwicklung.
    heroLine1: Wir finden das Auto.
    heroLine2: Wir prüfen es.
    heroLine3: Wir bringen es.
    heroSubtext: Wir suchen ein Auto in Deutschland, Spanien, der Schweiz oder Serbien. Wenn es in einem anderen Land ist, bringen wir es mit Prüfung, Abwicklung und Zollabwicklung zu Ihnen.
    statClients:
      value: 200+
      label: Kunden
    statCountries:
      label: Länder
    statYears:
      value: 5 Jahre
      label: auf dem Markt
    journeyHeading: 'Ein Weg: vom Suchen zum Schlüssel'
    journeySubtext: Autoauswahl, Import, Prüfung und Rückkauf sind keine getrennten Dienstleistungen, sondern Schritte eines Weges für Ihr Auto. Sie können an jedem Schritt einsteigen.
    whyUsHeading: Warum uns wählen
    whyUsSubtext: Der Kauf eines Autos aus einem anderen Land wirft Fragen auf. So lösen wir diese.
    trustCards:
      - title: Volle Transparenz
        text: 'Wir senden Ihnen eine detaillierte Checkliste (über 100 Punkte) und Videos von jedem Detail: Karosserie, Innenraum, Fahrwerk. Sie sehen das Fahrzeug so, als stünden Sie daneben.'
      - title: Sicherheit der Transaktion
        text: 'Etappenweise Zahlung und klare Bedingungen. Wir begleiten die Unterlagen in allen Phasen: Abwicklung, Zoll, Registrierung — ohne Überraschungen.'
      - title: Lokale Expertise
        text: 'Wir kennen die Besonderheiten jedes Marktes: Autobahnkilometer in Deutschland, Karosserie-Details spanischer Autos, Nuancen der Abwicklung mit ausländischen Kennzeichen in Serbien.'
    testimonialsHeading: Das sagen Kunden
    testimonials:
      - quote: „Wir haben einen BMW 3er von München nach Belgrad gebracht. Alles lief reibungslos — von der Inspektion bis zur Registrierung. Wir haben eine Menge Nerven beim Abwicklungsprozess gespart.“
        name: Александр
        caption: BMW 320d, Deutschland → Serbien
      - quote: „Ich habe lange nach einer Skoda Octavia in gutem Zustand gesucht. Die Jungs haben eine Möglichkeit in Spanien gefunden, sie mit einem unabhängigen Experten geprüft — alles stimmte mit der Beschreibung überein.“
        name: Михаил
        caption: Skoda Octavia, Spanien → Russland
      - quote: „Die Zulassung mit ausländischen Kennzeichen schien kompliziert. Das Team hat mich durch jeden Schritt begleitet — und nach einem Monat fuhr ich schon. Ich empfehle es.“
        name: Дмитрий
        caption: VW Passat, Deutschland → Serbien
    ctaEyebrow: Bereit zu starten?
    ctaHeading:
      line1: Erzählen Sie uns
      line2: von dem Auto,
      accentWord: das Sie suchen
    ctaSubtext: Wir antworten innerhalb von 2 Stunden. Die Beratung ist kostenlos.
    ctaTelegramLabel: Nachricht über Telegram senden
    ctaStatResponse:
      value: 2 Std.
      label: Antwort
    origin:
      heading: Von wo wir bringen
      note: Wir liefern in jedes Land — besprechen wir bei Anfrage
      euTitle: Aus Europa
      euText: Deutschland, Spanien, die Schweiz und andere europäische Länder. Wir suchen vor Ort, prüfen vor dem Kauf, kümmern uns um den Export und den Transport. Der Endpreis wird vor dem Deal angegeben, nicht nach dem Grenzübergang.
      euCta: Import aus Europa kalkulieren
      chinaTitle: Aus China
      chinaText: Neue und gebrauchte Fahrzeuge aus China über einen geprüften Partner. Auswahl nach Ihrem Budget, Prüfung vor dem Versand, Lieferung und Zollabwicklung — in der gleichen Reihenfolge wie in Europa.
      chinaCta: Import aus China kalkulieren
      chinaTags:
        - Neu
        - Gebraucht
        - Schlüsselfertig
    catalogue:
      heading: Aktuelle Deals
      subtext: 'Hier gibt es keine Anzeigen: Jedes Fahrzeug wurde gefunden, geprüft, registriert und an die Person übergeben. Der Preis ist der, den er bezahlt hat.'
      allCountriesLabel: Alle Länder
      moreLabel: Weitere {rest} anzeigen
    inspection:
      heading: Hundert Punkte, von denen vier entscheiden
      subtext: Die Checkliste ist lang, aber die meisten Abbrüche bei Geschäften geschehen immer aus einem der vier Bereiche. Klicken Sie auf die Nummer auf dem Diagramm — wir zeigen, was der Experte prüft und was wir dort gefunden haben.
      hint: Klicken Sie auf die Nummer auf dem Diagramm
      ctaLabel: Prüfung beauftragen
      pointsLabel: 100+ Punkte
      mediaLabel: Fotos und Videos
      reportLabel: Bericht vor der Entscheidung
      zones:
        - title: Karosserie und Lackierung
          text: Lackdickenmessung an jeder Fläche, Geometrie der Öffnungen, Schweiß- und Spachtelspuren. Von hier aus sieht man, ob es eine Reparatur gab, die der Verkäufer vergessen hat.
          points:
            - Lackierung und Nachlackierung von Flächen
            - Spaltmaße und Geometrie nach einem Unfall
            - Rost in den Schwellen und Radkästen
            - Originalität der Scheiben und Lichter
        - title: Motor und Getriebe
          text: Parameter bei warmem Motor, Getriebeanpassungen, Fehler im Gedächtnis der Steuergeräte. Der teuerste Bereich — und die häufigste Ablehnungsursache.
          points:
            - Dehnung der Steuerkette
            - Leckagen und Schwitzen
            - Anpassungen und Ruckeln des Getriebes
            - Kompression und Rauchentwicklung
          finding: 'BMW M340 2025 mit geringem Kilometerstand: Die Diagnose zeigte eine Dehnung der Steuerkette von etwa 20 %. Wir haben es vor dem Deal gefunden — der Kunde hatte ein Argument für die Preisverhandlung.'
        - title: Fahrwerk und Bremsen
          text: Hebebühne, Spiel, Zustand von Fahrwerk und Bremssystem. Deutsche Autobahnkilometer und Balkastraßen beanspruchen Autos unterschiedlich.
          points:
            - Spiel in den Lenkern und Kugelgelenken
            - Leckagen der Stoßdämpfer
            - Verschleiß von Scheiben und Belägen
            - Lenkstangen und Staubschutz
        - title: Elektronik, VIN und Dokumente
          text: Servicegeschichte nach VIN, manipulierte Kilometerstände, Elektronikfehler und rechtliche Sauberkeit — Pfandrechte, Registerverbote, ungeklärte Unfälle.
          points:
            - Abweichungen des Kilometerstands von der Historie
            - Fehler im Gedächtnis der Steuergeräte
            - Pfandrechte und Registerverbote
            - Ungeklärte Unfälle und Versicherungsereignisse
    findingLabel: 'Gefunden:'
    heroPhotoAlt: Limousine auf europäischer Autobahn
    ctaPhotoAlt: Saubere Karosserie und Rad des Fahrzeugs im Close-Up
