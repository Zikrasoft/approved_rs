    journeySubtext: Selección, importación, inspección y compra — no son servicios diferentes, sino etapas de un solo camino para su automóvil. Puede comenzar en cualquier paso.
    whyUsHeading: Por qué nos eligen
    whyUsSubtext: La compra de un auto en otro país genera preguntas. Así es como las resolvemos.
    trustCards:
      - title: Total transparencia
        text: 'Proporcionamos una lista detallada (más de 100 puntos) y video de cada detalle: carrocería, interior, mecánica. Usted verá el automóvil como si estuviera al lado.'
