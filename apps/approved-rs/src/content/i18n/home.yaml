    origin:
      heading: De dónde traemos
      note: Entregamos en cualquier país — lo discutimos al solicitar
      euTitle: Desde Europa
      euText: Alemania, España, Suiza y otros países europeos. Seleccionamos en el lugar, inspeccionamos antes de la compra, gestionamos la exportación, traemos y tramitamos. Indicamos el costo total antes de la transacción, no después de la frontera.
      euCta: Calcular importación desde Europa
      chinaTitle: Desde China
      chinaText: Autos nuevos y usados de China a través de un socio confiable. Selección según su presupuesto, revisión antes del envío, entrega y aduana — de la misma manera que desde Europa.
      chinaCta: Calcular importación desde China
