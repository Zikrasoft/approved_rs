metaTitle: Автоподбор, привоз и выкуп авто в Европе
metaDescription: Автоподбор в своей стране или привоз авто из Европы и Китая под ключ. Проверка и выкуп. Работаем по всей Европе.
journey:
  - title: Подбор
    desc: Находим, проверяем и доставляем автомобиль под ваш бюджет, под ключ, в Германии, Испании, Сербии и Швейцарии.
  - title: Привоз
    desc: Машина не в вашей стране? Подберем и привезем ее из Германии, Европы или Китая под ключ, включая растаможку.
  - title: Проверка
    desc: Независимый эксперт осматривает автомобиль перед покупкой по 100+ пунктам с видео.
    note: Нашли машину сами? Закажем проверку отдельно
  - title: Выкуп
    desc: Оформляем выкуп и растаможку автомобиля на иностранных номерах.
    note: Машина уже за границей? Поможем ее оформить
heroLine1: Машину найдем.
heroLine2: Проверим.
heroLine3: Привезем.
