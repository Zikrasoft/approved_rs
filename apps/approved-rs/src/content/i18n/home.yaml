            - Curenje i vlagu
            - Prilagođavanja i trzaji menjača
            - Komprimacija i dimljivost
          finding: 'BMW M340 iz 2025. godine sa malim pređenim kilometrima: dijagnostika je pokazala produženje lanca VVT od oko 20 %. Otkriveno pre dogovora — klijent je dobio argument za pregovaranje.'
        - title: Šasija i kočnice
          text: Dizalica, luftovi, stanje suspenzije i kočionog sistema. Nemački autoputevi i balkanske ceste troše automobil na različite načine.
          points:
            - Luftovi u krakovima i kuglama
            - Curenje amortizera
            - Trošenje diskova i pločica
            - Volan i gumenjaci
        - title: Elektronika, VIN i dokumenti
          text: Servisna istorija po VIN-u, prevara kilometraže, greške u elektronici i pravna čistoća — zalozi, zabrana registracije, nerazrešeni sudari.
          points:
