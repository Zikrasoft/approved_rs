    catalogue:
      heading: Šta se može nabaviti za taj novac
      subtext: 'Ovde nema oglasa: svaki automobil je pronađen, pregledan, registrovan i predat čoveku. Cena je ona koju je platao.'
      budgetLabel: Budžet za automobil, do
      allCountriesLabel: Sve zemlje
      countTemplate: Odgovara {shown} od {total}
      moreLabel: Prikaži još {rest}
      emptyText: U ovaj budžet u izabranoj zemlji još nismo obavili transakcije. Pišite nam — reći ćemo vam iskreno šta se može uzeti.
    inspection:
      heading: Stotinu tačaka, od kojih rešavaju četiri
      subtext: Kontrolni spisak je dugačak, ali vas skoro uvek odbijaju zbog jedne od četiri zone. Pritisnite broj na dijagramu — pokazaćemo šta proverava ekspert i šta smo tamo pronašli.
      hint: Pritisnite broj na dijagramu
      ctaLabel: Naručite proveru
      pointsLabel: 100+ tački
      mediaLabel: fotografije i video
      reportLabel: izveštaj pre odluke
      zones:
        - title: Karoserija i lak
          text: Mera debljine po svakoj paneli, geometrija otvora, tragovi zavarivanja i kitovanja. Odavde se vidi da li je bilo popravki o kojima prodavac nije obavestio.
          points:
            - Prefarbavanje i dotiranje panela
            - Razmaci i geometrija nakon udarca
            - Korozija u pragovima i lukovima
            - Originalnost stakala i svetala
        - title: Motor i menjač
          text: Parametri na zagrejanom motoru, prilagodbe menjača, greške u memoriji blokova. Najskuplja zona — i najčešći razlog za odbijanje.
          points:
            - Produžetak lanca GRE
            - Curjenja i zamućenja
            - Prilagodbe i trzaji menjača
            - Kompresija i dimljivost
          finding: 'BMW M340 2025. godine sa malim pređenim kilometrima: dijagnostika je pokazala produženje lanca GRE od oko 20 %. Pronašli smo to pre transakcije — klijent je dobio argument za pregovor.'
        - title: Ovjes i kočnice
          text: Dizalica, luftovi, stanje ovjesa i kočionog sistema. Nemački auto-putni pređeni kilometri i balkanske ceste troše automobil na različite načine.
          points:
            - Luftovi krakova i kugličnih zglobova
            - Curenje amortizera
            - Trošenje diskova i kočnica
            - Upravljačka letva i čuvari
        - title: Elektronika, VIN i dokumenti
          text: Servisna istorija po VIN-u, manipulisan pređeni kilometri, greške u elektronici i pravna čistoća — zalozi, zabrana registracije, neregistrovani udesi.
          points:
            - Prašina razlike pređene kilometre sa istorijom
            - Greške u memoriji blokova
            - Zalozi i zabrana registracije
            - Neregistrovani udesi i osiguravajući događaji
