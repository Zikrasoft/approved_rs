      - title: Inspección
        desc: Un experto independiente revisa el automóvil antes de la compra en más de 100 puntos con video.
        note: ¿Encontró el coche usted mismo? Pedimos la inspección por separado
      - title: Compra
        desc: Gestionamos la compra y la aduana de un automóvil con matrícula extranjera.
        note: ¿El coche ya está en el extranjero? Le ayudamos a formalizarlo.
    heroLine1: Encontraremos el coche.
    heroLine2: Lo revisaremos.
    heroLine3: Lo traeremos.
    heroSubtext: Seleccionamos coches en Alemania, España, Suiza o Serbia, y si está en otro país, lo traemos a usted con inspección, formalización y despacho aduanero.
    statClients:
      value: 200+
      label: clientes
    statCountries:
      label: países
    statYears:
      value: 5 años
      label: en el mercado
    journeyHeading: 'Un camino: de la búsqueda a las llaves'
    journeySubtext: La selección de auto, importación, inspección y recompra no son servicios diferentes, sino etapas de un mismo camino para su automóvil. Puede entrar en cualquier paso.
    whyUsHeading: Por qué nos eligen
    whyUsSubtext: La compra de un auto en otro país genera dudas. Así es como las resolvemos.
    trustCards:
      - title: Total transparencia
        text: 'Enviamos una lista de verificación detallada (más de 100 puntos) y video de cada detalle: carrocería, interior, mecánica. Ve el automóvil como si estuvieras al lado.'
      - title: Seguridad en la transacción
        text: 'Pago por etapas y condiciones claras. Acompañamos los documentos en todas las etapas: formalización, despacho aduanero, registro. Sin sorpresas.'
      - title: Expertise local
        text: 'Conocemos las especificidades de cada mercado: kilometrajes en autopistas alemanas, características de la carrocería de autos españoles, detalles en la tramitación para matrículas extranjeras en Serbia.'
    testimonialsHeading: Lo que dicen nuestros clientes
    testimonials:
      - quote: «Trajeron un BMW Serie 3 de Múnich a Belgrado. Todo claro, desde la inspección hasta la matrícula. Ahorré un montón de nervios en la formalización.»
        name: Aleksandr
        caption: BMW 320d, Alemania → Serbia
      - quote: «Busqué mucho tiempo un Skoda Octavia en buen estado. Los chicos encontraron una opción en España, la revisaron con un experto independiente, todo coincidió con la descripción.»
        name: Mikhail
        caption: Skoda Octavia, España → Rusia
      - quote: «Formalizar con matrículas extranjeras parecía complicado. El equipo me guió a través de cada paso, y en un mes ya estaba conduciendo. Lo recomiendo.»
        name: Dmitry
        caption: VW Passat, Alemania → Serbia
    ctaEyebrow: ¿Listo para comenzar?
    ctaHeading:
      line1: Cuéntanos sobre
      line2: el coche que buscas
