translations:
  en:
    metaTitle: Car Sourcing, Importing and Buyback in Europe
    metaDescription: Car sourcing in your country or importing from Europe and China - turnkey service. Inspection and buyback. We operate across Europe.
    journey:
      - title: Sourcing
        desc: We find, inspect, and deliver the vehicle within your budget - turn-key in Germany, Spain, Serbia, and Switzerland.
      - title: Importing
        desc: Is the car not in your country? We'll find and bring it from Germany, Europe, or China - turnkey, including customs clearance.
      - title: Inspection
        desc: An independent expert examines the vehicle before purchase - over 100 checkpoints with video.
        note: Found the car yourself? We can arrange a separate inspection.
      - title: Buyback
        desc: We handle the buyback and customs clearance for vehicles with foreign plates.
        note: Is the car already abroad? We can assist with the paperwork.
    heroLine1: We'll find the car.
    heroLine2: We'll check it.
    heroLine3: We'll bring it.
    heroSubtext: We source cars from Germany, Spain, Switzerland, or Serbia, and if it's in another country, we'll bring it to you with inspection, paperwork, and customs clearance.
    statClients:
      value: 200+
      label: clients
    statCountries:
      label: countries
    statYears:
      value: 5 years
      label: in the market
    journeyHeading: 'One Journey: From Search to Keys'
    journeySubtext: Car sourcing, importing, inspection, and buyback - not separate services, but stages of your vehicle's journey. You can start at any step.
    whyUsHeading: Why Choose Us
    whyUsSubtext: Buying a car from another country raises questions. Here’s how we address them.
    trustCards:
      - title: Full Transparency
        text: 'We send a detailed checklist (100+ points) and videos of each detail: body, interior, mechanics. You see the vehicle as if you were standing next to it.'
      - title: Transaction Safety
        text: 'Step-by-step payment and clear terms. We assist with documentation at every stage: registration, customs clearance - no surprises.'
      - title: Local Expertise
        text: 'We understand the specifics of each market: autobahn mileage in Germany, the characteristics of Spanish vehicles, the nuances of registering with foreign plates in Serbia.'
    testimonialsHeading: What Clients Say
    testimonials:
      - quote: “They brought a BMW 3 Series from Munich to Belgrade. Everything was precise - from inspection to registration. Saved me a lot of stress with the paperwork.”
        name: Alexander
        caption: BMW 320d, Germany → Serbia
      - quote: “I searched a long time for a Skoda Octavia in good condition. The guys found an option in Spain, checked it with an independent expert - everything matched the description.”
        name: Mikhail
        caption: Skoda Octavia, Spain → Russia
      - quote: “Registering with foreign plates seemed complicated. The team guided me through each step - and within a month, I was already driving. Highly recommend.”
        name: Dmitry
        caption: VW Passat, Germany → Serbia
    ctaEyebrow: Ready to start?
    ctaHeading:
      line1: Tell us about the
      line2: car you’re looking for,
      accentWord: you're searching for
    ctaSubtext: We respond within 2 hours. Consultation is free.
    ctaTelegramLabel: Message us on Telegram
    ctaStatResponse:
      value: 2 h
      label: response
    origin:
      heading: Where We Import From
      note: We can deliver to any country - let's discuss when you apply
      euTitle: From Europe
      euText: Germany, Spain, Switzerland, and other European countries. We source locally, inspect before purchase, handle export paperwork, transportation, and customs clearance. We quote the final price before the deal, not after the border.
      euCta: Calculate import from Europe
      chinaTitle: From China
      chinaText: New and used vehicles from China through a trusted partner. Sourcing based on your budget, inspection before shipping, delivery, and customs clearance - same process as with Europe.
      chinaCta: Calculate import from China
      chinaTags:
        - New
        - Used
        - Turnkey
    catalogue:
      heading: Recent Deals
      subtext: 'No ads here: each vehicle is found, inspected, documented, and handed over to a buyer. The price is what they paid.'
      allCountriesLabel: All Countries
      moreLabel: Show more {rest}
    inspection:
      heading: One Hundred Checkpoints, Four Areas of Concern
      subtext: The checklist is extensive, but almost always, deals fall through for one of four areas. Click the number on the diagram - we’ll show you what the expert checks and what we’ve encountered.
      hint: Click the number on the diagram
      ctaLabel: Order Inspection
      pointsLabel: 100+ checkpoints
      mediaLabel: photos and videos
      reportLabel: report before decision
      zones:
        - title: Body and Paint
          text: Thickness gauge for each panel, geometry of openings, signs of welding and putty. This reveals whether there was a repair the seller forgot to mention.
          points:
            - Repainting and touch-ups
            - Panel gaps and geometry after an impact
            - Corrosion in sills and wheel arches
            - Originality of glass and lighting
        - title: Engine and Transmission
          text: Parameters on a warmed-up engine, transmission adaptations, faults in block memory. The most expensive zone and the most common reason for rejection.
          points:
            - Timing chain stretch
            - Leaks and sweating
            - Adaptations and transmission jolts
            - Compression and smoke
          finding: '2025 BMW M340 with low mileage: diagnostics showed a timing chain stretch of about 20%. We found this before the deal - the client had leverage for negotiation.'
        - title: Chassis and Brakes
          text: Lift, play, condition of the suspension and braking system. German autobahn mileage and Balkan roads wear a vehicle differently.
          points:
            - Play in arms and ball joints
            - Leaking shock absorbers
            - Wear on discs and pads
            - Steering rack and dust boots
        - title: Electronics, VIN, and Documents
          text: Service history via VIN, odometer fraud, electronic errors, and legal status - liens, registration bans, unresolved accidents.
          points:
            - Discrepancy between mileage and history
            - Errors in block memory
            - Liens and registration bans
            - Unresolved accidents and insurance events
    findingLabel: 'Found:'
    heroPhotoAlt: Sedan on a European highway
    ctaPhotoAlt: Close-up of a clean vehicle body and wheel
  sr:
    metaTitle: Autoizbor, uvoz i otkup automobila u Evropi
    metaDescription: Autoizbor u zemlji ili uvoz automobila iz Evrope i Kine — sve uključeno. Provera i otkup. Radimo u celoj Evropi.
    journey:
      - title: Izbor
        desc: Pronalažemo, proveravamo i dostavljamo automobil u skladu sa vašim budžetom — sve uključeno, u Nemačkoj, Španiji, Srbiji i Švajcarskoj.
      - title: Uvoz
        desc: Automobil nije u vašoj zemlji? Pronaći ćemo i dovesti ga iz Nemačke, Evrope ili Kine — sve uključeno, uključujući carinjenje.
      - title: Provera
        desc: Nezavisni ekspert pregleda automobil pre kupovine — prema 100+ stavki sa videom.
        note: Pronašli ste auto sami? Naravno, možemo naručiti proveru posebno
      - title: Otkup
        desc: Uređujemo otkup i carinjenje automobila na stranim tablicama.
        note: Automobil je već u inostranstvu? Pomoći ćemo vam da ga uredite
    heroLine1: Naći ćemo auto.
    heroLine2: Proverićemo.
    heroLine3: Dovesti ćemo.
    heroSubtext: Pronaći ćemo automobil u Nemačkoj, Španiji, Švajcarskoj ili Srbiji, a ako je u drugoj zemlji, dovesti ćemo ga kod vas uz proveru, sređivanje i carinjenje.
    statClients:
      value: 200+
      label: klijenata
    statCountries:
      label: zemalja
    statYears:
      value: 5 godina
      label: na tržištu
    journeyHeading: 'Jedan put: od pretrage do ključeva'
    journeySubtext: Autoizbor, uvoz, provera i otkup — to nisu različite usluge, već faze jednog puta vašeg automobila. Možete započeti sa bilo kojeg koraka.
    whyUsHeading: Zašto nas biraju
    whyUsSubtext: Kupovina automobila iz druge zemlje postavlja pitanja. Evo kako ih rešavamo.
    trustCards:
      - title: Potpuna transparentnost
        text: 'Šaljemo detaljnu listu (100+ stavki) i video svakog detalja: limarija, enterijer, mehanika. Vidite automobil kao da stojite pored njega.'
      - title: Sigurnost transakcije
        text: 'Postepeno plaćanje i jasni uslovi. Pratimo dokumente na svim koracima: sređivanje, carinjenje, registracija — bez iznenađenja.'
      - title: Lokalna stručnost
        text: 'Poznajemo specifičnosti svakog tržišta: kilometraže iz Nemačke, detalji limarije španskih automobila, nuances u registraciji na strane tablice u Srbiji.'
    testimonialsHeading: Šta kažu klijenti
    testimonials:
      - quote: «Doveli su BMW serije 3 iz Minhena u Beograd. Sve je bilo jasno — od pregleda do registracije. Uštedeli smo mnogo živaca na sređivanju.»
        name: Aleksandar
        caption: BMW 320d, Nemačka → Srbija
      - quote: «Dugo sam tražio Skodu Octaviju u dobrom stanju. Ekipa je pronašla opciju u Španiji, proverili su je nezavisnim stručnjakom — sve se poklopilo s opisom.»
        name: Mihail
        caption: Skoda Octavia, Španija → Rusija
      - quote: «Sređivanje na strane tablice delovalo je komplikovano. Tim me provodio kroz svaki korak — i već za mesec dana sam vozio. Preporučujem.»
        name: Dmitrij
        caption: VW Passat, Nemačka → Srbija
    ctaEyebrow: Spremni za početak?
    ctaHeading:
      line1: Ispričajte nam
      line2: o automobilu,
      accentWord: koji tražite
    ctaSubtext: Odgovaramo u roku od 2 sata. Konsultacija je besplatna.
    ctaTelegramLabel: Pitati na Telegramu
    ctaStatResponse:
      value: 2 č
      label: odgovor
    origin:
      heading: Odakle uvozimo
      note: Dovesti ćemo u svaku zemlju — dogovorićemo se prilikom prijave
      euTitle: Iz Evrope
      euText: Nemačka, Španija, Švajcarska i druge evropske zemlje. Pronalazimo na licu mesta, proveravamo pre kupovine, sredimo izvoz, donesemo i carinimo. Konačnu cenu navodimo pre posla, a ne posle granice.
      euCta: Izračunati uvoz iz Evrope
      chinaTitle: Iz Kine
      chinaText: Novi i polovnjaci iz Kine preko proverenog partnera. Izbor prema vašem budžetu, provera pre slanja, dostava i carinjenje — na isti način kao i za Evropu.
      chinaCta: Izračunati uvoz iz Kine
      chinaTags:
        - Novi
        - Sa pređenim kilometrima
        - Sve uključeno
    catalogue:
      heading: Poslednji poslovi
      subtext: 'Ovde nema oglasa: svaki automobil je pronađen, proveren, sređen i predat osobi. Cena je ona koju je platio.'
      allCountriesLabel: Sve zemlje
      moreLabel: Prikaži još {rest}
    inspection:
      heading: Stotinu stavki, od kojih se rešava četiri
      subtext: Spisak je dug, ali gotovo uvek se za transakciju odustaje zbog jedne od četiri zone. Pritisnite broj na dijagramu — pokazaćemo šta ekspert gleda i šta smo tamo našli.
      hint: Pritisnite broj na dijagramu
      ctaLabel: Naručiti provere
      pointsLabel: 100+ stavki
      mediaLabel: fotografije i video
      reportLabel: izveštaj pre odluke
      zones:
        - title: Limarija i lak
          text: Merni uređaj za svaki panel, geometrija prozora, tragovi zavara i špakhla. Odavde se vidi da li je bilo popravki koje prodavac nije naveo.
          points:
            - Precrtavanje i popravke panela
            - Razmaci i geometrija nakon udara
            - Korozi u pragovima i lukovima
            - Originalnost stakala i svetala
        - title: Motor i menjač
          text: Parametri na zagrejanom motoru, adaptacije menjača, greške u memoriji blokova. Najskuplja zona — i najčešći razlog odbijanja.
          points:
            - Produženje lanca GRM-a
            - Curjenja i izmaglica
            - Adaptacija i trzaji menjača
            - Kompresija i dimnost
          finding: 'BMW M340 iz 2025. godine sa malom kilometražom: dijagnostika je pokazala produženje lanca GRM-a oko 20 %. Našli smo to pre posla — kupac je dobio argument za pregovaranje.'
        - title: Oprema i kočnice
          text: Podizanje, kočenje, stanje ovjesa i kočionog sistema. Nemačka autoputna kilometraža i balkanske ceste otkazuju auto na različite načine.
          points:
            - Rasponi poluga i kuglastih zglobova
            - Curenje amortizera
            - Trošenje diskova i pločica
            - Upravljačka šina i čaure
        - title: Elektronika, VIN i dokumenti
          text: Servisna istorija po VIN-u, skrenuta kilometraža, greške elektronike i pravna čistoća — hipoteka, zabrana registracije, otvoreni udes.
          points:
            - Razlika u kilometraži sa istorijom
            - Greške u memoriji blokova
            - Hipoteka i zabrana registracije
            - Otvoreni udarci i osiguravajući događaji
    findingLabel: 'Našli smo:'
    heroPhotoAlt: Sedan na evropskom autoputu
    ctaPhotoAlt: Čista karoserija i točak automobila iz blizine
