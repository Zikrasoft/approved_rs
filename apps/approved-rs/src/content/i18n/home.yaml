      mediaLabel: fotos y videos
      reportLabel: informe antes de decidir
      zones:
        - title: Carrocería y pintura
          text: Medidor de grosor por cada panel, geometría de aperturas, trazas de soldadura y masilla. Desde aquí se puede ver si hubo una reparación que el vendedor olvidó mencionar.
          points:
            - Pintura y retoque de paneles
            - Ajustes y geometría tras un accidente
            - Corrosión en umbrales y arcos
            - Originalidad de cristales y ópticas
        - title: Motor y caja
          text: Parámetros en motor caliente, adaptaciones de la caja, errores en la memoria de los bloques. La zona más cara — y la razón más frecuente para rechazar.
          points:
            - Estiramiento de la cadena de distribución
            - Fugas y humedad
            - Adaptaciones y tirones en la caja
            - Compresión y humo
          finding: 'BMW M340 2025 con poco kilometraje: la diagnosis mostró un estiramiento de la cadena de distribución de aproximadamente el 20 %. Lo encontramos antes de la transacción — el cliente tuvo un argumento para negociar.'
        - title: Suspensión y frenos
          text: Elevador, holguras, estado de la suspensión y del sistema de frenos. El recorrido por autopista en Alemania y las carreteras balcánicas desgastan el automóvil de diferentes maneras.
          points:
            - Holguras en brazos y rótulas
            - Fugas de amortiguadores
            - Desgaste de discos y pastillas
            - Dirección y fuelles
        - title: Electrónica, VIN y documentos
          text: Historia de servicios según el VIN, kilometraje manipulado, errores en la electrónica y limpieza legal — gravamen, restricción de registro, siniestros no cerrados.
          points:
            - Discrepancia de kilometraje con la historia
            - Errores en la memoria de bloques
            - Gravamen y restricción de registro
            - Siniestros no cerrados y eventos de seguros
