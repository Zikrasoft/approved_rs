    heroLine1: Encontraremos el coche.
    heroLine2: Lo inspeccionaremos.
    heroLine3: Lo traeremos.
    heroSubtext: Seleccionamos coches en Alemania, España, Suiza o Serbia, y si se encuentra en otro país, lo traeremos a usted con inspección, formalización y aduana.
    statClients:
      value: 200+
      label: clientes
    statCountries:
      label: países
    statYears:
      value: 5 años
      label: en el mercado
