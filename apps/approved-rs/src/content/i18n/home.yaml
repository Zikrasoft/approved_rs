        text: 'Pago por etapas y condiciones claras. Acompañamos los documentos en cada paso: tramitación, aduana, registro — sin sorpresas.'
      - title: Expertise local
        text: 'Conocemos las especificidades de cada mercado: kilometrajes en autopistas alemanas, características de la carrocería de autos españoles, detalles en la tramitación para matrículas extranjeras en Serbia.'
    testimonialsHeading: Lo que dicen nuestros clientes
    testimonials:
      - quote: «Trajeron un BMW Serie 3 de Múnich a Belgrado. Todo claro, desde la inspección hasta la matriculación. Ahorra mucho estrés en la tramitación.»
        name: Aleksandr
        caption: BMW 320d, Alemania → Serbia
      - quote: «Busqué mucho un Skoda Octavia en buen estado. El equipo encontró una opción en España, y la revisaron con un experto independiente — todo coincidía con la descripción.»
        name: Mikhail
        caption: Skoda Octavia, España → Rusia
      - quote: «La matriculación con matrícula extranjera parecía complicada. El equipo me guió en cada paso — y en un mes ya estaba conduciendo. Los recomiendo.»
        name: Dmitry
        caption: VW Passat, Alemania → Serbia
