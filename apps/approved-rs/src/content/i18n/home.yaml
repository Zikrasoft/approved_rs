    origin:
      heading: Woher wir importieren
      note: Lieferung in jedes Land – besprechen wir bei der Anfrage
      euTitle: Aus Europa
      euText: Deutschland, Spanien, Schweiz und andere europäische Länder. Wir suchen vor Ort, prüfen vor dem Kauf, kümmern uns um den Export, transportieren und verzollen. Den Endpreis nennen wir vor dem Deal und nicht nach der Grenze.
      euCta: Import aus Europa berechnen
      chinaTitle: Aus China
      chinaText: Neue und gebrauchte Autos aus China über einen vertrauenswürdigen Partner. Auswahl nach Ihrem Budget, Prüfung vor dem Versand, Lieferung und Zollabwicklung – in der gleichen Reihenfolge wie in Europa.
      chinaCta: Import aus China berechnen
      chinaTags:
        - Neu
        - Gebraucht
        - Schlüsselfertig
    catalogue:
      heading: Was kann man für dieses Geld bekommen
      subtext: 'Hier gibt es keine Anzeigen: Jedes Auto wurde gefunden, geprüft, abgewickelt und an den Kunden übergeben. Der Preis ist der, den er bezahlt hat.'
      budgetLabel: Budget für das Auto, bis
      allCountriesLabel: Alle Länder
      countTemplate: Geeignet {shown} von {total}
      moreLabel: Weitere {rest} anzeigen
      emptyText: In diesem Budget haben wir in dem gewählten Land bisher keine Geschäfte abgeschlossen. Schreiben Sie uns – wir sagen ehrlich, was realistisch ist.
    inspection:
      heading: Hunderte von Punkten, von denen vier entscheiden
      subtext: Die Checkliste ist lang, aber fast immer wird der Deal aufgrund eines der vier Bereiche abgelehnt. Klicken Sie auf die Nummer im Diagramm – wir zeigen, was der Experte überprüft und was wir dort gefunden haben.
      hint: Klicken Sie auf die Nummer im Diagramm
      ctaLabel: Prüfung bestellen
      pointsLabel: 100+ Punkte
      mediaLabel: Fotos und Videos
      reportLabel: Bericht vor der Entscheidung
      zones:
        - title: Karosserie und Lackierung
          text: Lackdickenmessung an jedem Paneel, Geometrie der Öffnungen, Schweiß- und Spachtelspuren. So erkennt man, ob eine Reparatur stattgefunden hat, die der Verkäufer verschwiegen hat.
          points:
            - Lackierung und Nachlackierung von Paneelen
            - Spaltmaße und Geometrie nach einem Aufprall
            - Rost in Schwellen und Radkästen
            - Originalität von Scheiben und Scheinwerfern
        - title: Motor und Getriebe
          text: Parameter bei betriebswarmem Motor, Anpassungen des Getriebes, Fehler im Speicher der Steuergeräte. Der teuerste Bereich – und der häufigste Grund für eine Ablehnung.
          points:
            - Dehnung der Steuerkette
            - Leckagen und Schwitzungen
            - Anpassungen und Ruckeln des Getriebes
            - Kompression und Abgasentwicklung
          finding: 'BMW M340 von 2025 mit geringer Laufleistung: Die Diagnose ergab eine Dehnung der Steuerkette von etwa 20 %. Wir haben es vor dem Deal gefunden – der Kunde hatte ein Argument für die Verhandlung.'
        - title: Fahrwerk und Bremsen
          text: Bühne, Spiel, Zustand des Fahrwerks und der Bremsanlage. Deutsche Autobahnkilometer und Balkanstrecken beanspruchen das Auto unterschiedlich.
          points:
            - Spiel an Lagern und Gelenken
            - Ölverlust bei Stoßdämpfern
            - Verschleiß von Scheiben und Belägen
            - Lenkgetriebe und Staubschutz
        - title: Elektronik, VIN und Dokumente
          text: Servicehistorie über die VIN, gefälschte Kilometerstände, Fehler in der Elektronik und rechtliche Sauberkeit – Hypotheken, Registrierungssperren, ungeklärte Unfälle.
          points:
            - Abweichungen im Kilometerstand zur Historie
            - Fehler im Speicher der Steuergeräte
            - Hypotheken und Sperren für die Registrierung
            - Ungeschlossene Unfälle und Versicherungsereignisse
    findingLabel: 'Gefunden:'
    heroPhotoAlt: Ineos Grenadier, in Deutschland ausgewählt und an den Kunden übergeben
    ctaPhotoAlt: Saubere Karosserie und Rad des Fahrzeugs im Detail
