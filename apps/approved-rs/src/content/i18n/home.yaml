translations:
  en:
    metaTitle: Car Sourcing, Import & Buyback in Europe
    metaDescription: Find a car locally or import one from Europe or China, fully handled. Inspections and buyback. Serving all of Europe.
    journey:
      - title: Car sourcing
        desc: We find, inspect and deliver a car to fit your budget, fully handled in Germany, Spain, Serbia and Switzerland.
      - title: Import
        desc: The car isn't in your country? We'll find and import it from Germany, elsewhere in Europe or China, including customs clearance.
      - title: Inspection
        desc: An independent expert inspects the car before purchase, checks 100+ items and records a video.
        note: Found a car yourself? Book an inspection on its own
      - title: Buyback
        desc: We handle the purchase and customs clearance of cars with foreign plates.
        note: Car already abroad? We'll help you get the paperwork sorted
    heroLine1: We'll find your car.
    heroLine2: Inspect it.
    heroLine3: Bring it to you.
    heroSubtext: We'll find a car in Germany, Spain, Switzerland or Serbia. If it's elsewhere, we'll bring it to you, with inspection, paperwork and customs clearance included.
    statClients:
      value: 200+
      label: clients
    statCountries:
      label: countries
    statYears:
      value: 5 years
      label: in business
    journeyHeading: One journey, from search to keys
    journeySubtext: Car sourcing, importing, inspection and buyback aren't separate services. They're steps in your car's journey, and you can start at any stage.
    whyUsHeading: Why choose us
    whyUsSubtext: Buying a car from another country raises questions. Here's how we put your mind at ease.
    trustCards:
      - title: Full transparency
        text: We send a detailed checklist of 100+ items and videos of every detail, from the body and interior to the suspension. You'll see the car as if you were right there.
      - title: A secure transaction
        text: 'Payments are made in stages, with clear terms. We handle the paperwork at every step: purchase, customs clearance and registration. No surprises.'
      - title: Local expertise
        text: 'We know each market inside out: high-mileage German motorway cars, the bodywork quirks of Spanish cars, and the ins and outs of registering cars with foreign plates in Serbia.'
    testimonialsHeading: What our clients say
    testimonials:
      - quote: '"They brought a BMW 3 Series from Munich to Belgrade. Everything went smoothly, from inspection to registration. They saved me a ton of stress with the paperwork."'
        name: Alexander
        caption: BMW 320d, Germany → Serbia
      - quote: '"I''d been looking for a Skoda Octavia in good condition for ages. The team found one in Spain and had an independent expert inspect it. Everything matched the description."'
        name: Mikhail
        caption: Skoda Octavia, Spain → Russia
      - quote: '"Registering a car with foreign plates seemed complicated. The team guided me through every step, and a month later I was driving. Highly recommend."'
        name: Dmitry
        caption: VW Passat, Germany → Serbia
    ctaEyebrow: Ready to get started?
    ctaHeading:
      line1: Tell us
      line2: about the car
      accentWord: you're looking for
    ctaSubtext: We reply within 2 hours. The consultation is free.
    ctaTelegramLabel: Message us on Telegram
    ctaStatResponse:
      value: 2 hrs
      label: response time
    origin:
      heading: Where we source cars
      note: We deliver to any country. Let's discuss it when you get in touch
      euTitle: From Europe
      euText: Germany, Spain, Switzerland and elsewhere in Europe. We source locally, inspect before purchase, handle export paperwork, transport and customs clearance. We tell you the total cost before the deal, not after the border.
      euCta: Get an import quote from Europe
      chinaTitle: From China
      chinaText: New and used cars from China through a trusted partner. We find one to fit your budget, inspect it before shipping, then handle delivery and customs clearance, just as we do for cars from Europe.
      chinaCta: Get an import quote from China
      chinaTags:
        - New
        - Used
        - Fully handled
    catalogue:
      heading: Recent deals
      subtext: These aren't listings. Every car was found, inspected, processed and handed over to its new owner. The price shown is what they paid.
      allCountriesLabel: All countries
      moreLabel: Show {rest} more
    inspection:
      heading: 100 checks. Four deal-breakers.
      subtext: The checklist is long, but almost every reason to walk away comes down to one of four areas. Select a number on the diagram to see what the expert checks and what we've found.
      hint: Select a number on the diagram
      ctaLabel: Book an inspection
      pointsLabel: 100+ items
      mediaLabel: photos and videos
      reportLabel: report before you decide
      zones:
        - title: Bodywork and paint
          text: We measure paint thickness on every panel and check panel gaps, welds and filler. This reveals repairs the seller may have forgotten to mention.
          points:
            - Repainted and touched-up panels
            - Panel gaps and post-accident alignment
            - Rust in sills and wheel arches
            - Whether the glass and lights are original
        - title: Engine and transmission
          text: We check readings with the engine warm, transmission adaptations and fault codes in the control units. It's the most expensive area and the most common reason to walk away.
          points:
            - Timing chain stretch
            - Leaks and seepage
            - Transmission adaptations and jerking
            - Compression and exhaust smoke
          finding: 'A 2025 BMW M340 with low mileage: diagnostics showed the timing chain had stretched by about 20%. We caught it before the deal, giving the client leverage to negotiate.'
        - title: Suspension and brakes
          text: We use a lift to check for play and assess the suspension and braking system. German motorway miles and Balkan roads wear a car differently.
          points:
            - Play in suspension arms and ball joints
            - Leaking shock absorbers
            - Brake disc and pad wear
            - Steering rack and rubber boots
        - title: Electronics, VIN and paperwork
          text: We check the service history by VIN, odometer tampering, electronic fault codes and legal status, including liens, registration restrictions and unresolved accident claims.
          points:
            - Mileage discrepancies in the vehicle history
            - Fault codes in the control units
            - Liens and registration restrictions
            - Unresolved accidents and insurance claims
    findingLabel: 'We found:'
    heroPhotoAlt: Sedan on a European highway
    ctaPhotoAlt: Close-up of a car's clean bodywork and wheel
  sr:
    metaTitle: Uvoz, pronalaženje i otkup automobila u Evropi
    metaDescription: Pronalazimo automobile u vašoj zemlji ili ih uvozimo iz Evrope i Kine po sistemu ključ u ruke. Provera i otkup. Radimo širom Evrope.
    journey:
      - title: Pronalaženje
        desc: Pronalazimo, proveravamo i dovozimo automobil u okviru vašeg budžeta, po sistemu ključ u ruke, u Nemačkoj, Španiji, Srbiji i Švajcarskoj.
      - title: Uvoz
        desc: Automobil nije u vašoj zemlji? Pronaći ćemo ga i uvesti iz Nemačke, drugih evropskih zemalja ili Kine, po sistemu ključ u ruke, uključujući carinjenje.
      - title: Provera
        desc: Nezavisni stručnjak obavlja provera auta pre kupovine u više od 100 tačaka i snima video.
        note: Već ste pronašli automobil? Možete zasebno naručiti proveru
      - title: Otkup
        desc: Obavljamo otkup i carinjenje automobila sa stranim tablicama.
        note: Automobil je već u inostranstvu? Pomoći ćemo vam oko papirologije
    heroLine1: Pronaći ćemo auto.
    heroLine2: Proveriti.
    heroLine3: Dovesti.
    heroSubtext: Pronaći ćemo automobil u Nemačkoj, Španiji, Švajcarskoj ili Srbiji. Ako je u nekoj drugoj zemlji, dovešćemo ga do vas, uz proveru, sređivanje dokumentacije i carinjenje.
    statClients:
      value: 200+
      label: klijenata
    statCountries:
      label: zemalja
    statYears:
      value: 5 godina
      label: na tržištu
    journeyHeading: 'Jedan put: od potrage do ključeva'
    journeySubtext: Pronalaženje, uvoz, provera i otkup automobila nisu različite usluge, već koraci na putu vašeg automobila do vas. Možete početi od bilo kog koraka.
    whyUsHeading: Zašto nas biraju
    whyUsSubtext: Kupovina automobila iz druge zemlje otvara mnoga pitanja. Evo kako ih rešavamo.
    trustCards:
      - title: Potpuna transparentnost
        text: 'Šaljemo detaljnu kontrolnu listu sa više od 100 stavki i snimke svakog detalja: karoserije, enterijera i trapa. Videćete automobil kao da ste pored njega.'
      - title: Sigurna kupovina
        text: 'Plaćanje u fazama i jasni uslovi. Pratimo dokumentaciju u svakom koraku: sređivanje papira, carinjenje i registraciju. Bez neprijatnih iznenađenja.'
      - title: Poznajemo lokalno tržište
        text: 'Poznajemo specifičnosti svakog tržišta: veliku kilometražu na nemačkim autoputevima, stanje karoserije španskih automobila i procedure za strane tablice u Srbiji.'
    testimonialsHeading: Šta kažu naši klijenti
    testimonials:
      - quote: '"Dovezli su BMW serije 3 iz Minhena u Beograd. Sve je išlo glatko, od pregleda do registracije. Uštedeli su nam mnogo živaca oko papirologije."'
        name: Aleksandar
        caption: BMW 320d, Nemačka → Srbija
      - quote: '"Dugo sam tražio dobro očuvanu Škodu Octaviju. Pronašli su je u Španiji i angažovali nezavisnog stručnjaka za proveru. Sve se poklapalo sa opisom."'
        name: Mihailo
        caption: Škoda Octavia, Španija → Rusija
      - quote: '"Mislio sam da će papirologija za strane tablice biti komplikovana. Tim me je vodio kroz svaki korak, a već mesec dana kasnije sam vozio automobil. Preporučujem."'
        name: Dmitrij
        caption: VW Passat, Nemačka → Srbija
    ctaEyebrow: Spremni da počnemo?
    ctaHeading:
      line1: Recite nam
      line2: kakav automobil
      accentWord: tražite
    ctaSubtext: Odgovaramo u roku od 2 sata. Konsultacije su besplatne.
