        - title: Karoserija i lak
          text: Merni alat po svakoj paneli, geometrija otvora, tragovi zavarivanja i špajanja. Odatle se vidi da li je bilo popravke o kojoj prodavac nije obavestio.
          points:
            - Prebojenje i dotjerivanje panela
            - Razmaci i geometrija posle udarca
            - Kroznost u pragovima i lukovima
            - Originalnost stakala i svetala
        - title: Motor i menjač
          text: Parametri na zagrejanom motoru, prilagođavanje menjača, greške u memoriji blokova. Najskuplja zona — i najčešći razlog za odbijanje.
          points:
