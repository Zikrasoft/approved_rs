translations:
  en:
    metaTitle: Car Sourcing, Importing, and Buyback in Europe
    metaDescription: Sourcing cars in your country or importing from Europe and China made easy. Inspection and buyback provided. We operate across Europe.
    journey:
      - title: Sourcing
        desc: We find, inspect, and deliver the car to fit your budget - all done for you in Germany, Spain, Serbia, and Switzerland.
      - title: Importing
        desc: Is the car not in your country? We can source and bring it from Germany, Europe, or China - fully managed, including customs clearance.
      - title: Inspection
        desc: An independent expert inspects the car before purchase - over 100 points with video documentation.
        note: Found the car yourself? We can order the inspection separately.
      - title: Buyback
        desc: We handle the buyback and customs clearance of cars with foreign plates.
        note: Already abroad? We can help you with the paperwork.
    heroLine1: We’ll find your car.
    heroLine2: We’ll inspect it.
    heroLine3: We’ll deliver it.
    heroSubtext: We can source cars in Germany, Spain, Switzerland, or Serbia, and if it’s in another country, we’ll deliver it to you along with inspection, documentation, and customs clearance.
    statClients:
      value: 200+
      label: clients
    statCountries:
      label: countries
    statYears:
      value: 5 years
      label: on the market
    journeyHeading: 'One journey: from search to keys'
    journeySubtext: Car sourcing, importing, inspection, and buyback are not different services but steps in one journey of your car. You can start at any step.
    whyUsHeading: Why choose us
    whyUsSubtext: Buying a car from another country raises questions. Here’s how we address them.
    trustCards:
      - title: Complete Transparency
        text: 'We send a detailed checklist (100+ points) and videos covering every detail: body, interior, drive. You see the car as if you were standing next to it.'
      - title: Transaction Safety
        text: 'Staged payments and clear conditions. We assist with documents at every step: registration, customs clearance, and ownership transfer - no surprises.'
      - title: Local Expertise
        text: 'We know the specifics of each market: autobahn mileage in Germany, characteristics of Spanish cars, nuances of registering foreign plates in Serbia.'
    testimonialsHeading: What our clients say
    testimonials:
      - quote: “They brought a BMW 3 Series from Munich to Belgrade. Everything was clear - from inspection to registration. Saved a ton of hassle with the paperwork.”
        name: Александр
        caption: BMW 320d, Germany → Serbia
      - quote: “I searched for a Skoda Octavia in good condition for a long time. They found a variant in Spain, inspected it with an independent expert - everything matched the description.”
        name: Михаил
        caption: Skoda Octavia, Spain → Russia
      - quote: “Registering a vehicle with foreign plates seemed complicated. The team guided me through each step - and within a month I was driving. Highly recommend.”
        name: Дмитрий
        caption: VW Passat, Germany → Serbia
    ctaEyebrow: Ready to get started?
    ctaHeading:
      line1: Tell us about
      line2: the car you’re
      accentWord: looking for
    ctaSubtext: We respond within 2 hours. Consultation is free.
    ctaTelegramLabel: Message us on Telegram
    ctaStatResponse:
      value: 2 hrs
      label: response
    origin:
      heading: Where we source from
      note: We can deliver to any country - we’ll discuss when you apply
      euTitle: From Europe
      euText: Germany, Spain, Switzerland, and other European countries. We source on-site, inspect before purchase, handle export, delivery, and customs clearance. Final costs are provided before the deal, not after the border.
      euCta: Calculate import from Europe
      chinaTitle: From China
      chinaText: New and used cars from China through a trusted partner. Sourcing within your budget, inspection before shipment, delivery, and customs clearance - all the same process as for Europe.
      chinaCta: Calculate import from China
      chinaTags:
        - New
        - Used
        - Fully managed
    catalogue:
      heading: Latest Deals
      subtext: 'No ads here: every car is found, inspected, registered, and handed over to a customer. The price is what they paid.'
      allCountriesLabel: All countries
      moreLabel: Show more {rest}
    inspection:
      heading: One hundred points, four zones where decisions are made
      subtext: The checklist is long, but almost always, decisions are based on one of four areas. Click the number on the diagram to see what the expert checks and what we found.
      hint: Click the number on the diagram
      ctaLabel: Order an inspection
      pointsLabel: 100+ points
      mediaLabel: photos and videos
      reportLabel: report before decision
      zones:
        - title: Body and Paintwork
          text: Thickness measurement on each panel, geometry of gaps, signs of welding and filler. This shows if there was a repair the seller forgot about.
          points:
            - Repainting and touch-ups
            - Gaps and geometry post-accident
            - Corrosion in sills and arches
            - Originality of glasses and optics
        - title: Engine and Transmission
          text: Parameters on a warmed-up engine, transmission adaptations, errors in memory logs. The most expensive zone - and the most common reason for rejection.
          points:
            - Timing chain stretch
            - Leaks and sweating
            - Transmission adaptations and jerks
            - Compression and smoke levels
          finding: 'BMW M340 2025 with low mileage: diagnostics showed timing chain stretch of about 20 %. Found before the deal - gave the client leverage to negotiate.'
        - title: Suspension and Brakes
          text: Lift, play, condition of suspension and brake system. German autobahn mileage and Balkan roads wear vehicles differently.
          points:
            - Play in arms and ball joints
            - Shock absorber leaks
            - Wear of discs and pads
            - Steering rack and bellows
        - title: Electronics, VIN, and Documents
          text: Service history by VIN, tampered mileage, electronic errors and legal cleanliness — liens, registration bans, unresolved accidents.
          points:
            - Mileage discrepancies with history
            - Errors in memory logs
            - Liens and registration bans
            - Unresolved accidents and insurance events
    findingLabel: 'Found:'
    heroPhotoAlt: Sedan on a European highway
    ctaPhotoAlt: Close-up of clean car body and wheel
  sr:
    metaTitle: Auto-sourcing, uvoz i otkup automobila u Evropi
    metaDescription: Auto-sourcing u vašoj zemlji ili uvoz automobila iz Evrope i Kine - sve uključeno. Provera i otkup. Radimo širom Evrope.
    journey:
      - title: Sourcing
        desc: Nalazimo, proveravamo i dostavljamo auto prema vašem budžetu - sve uključeno, u Nemačkoj, Španiji, Srbiji i Švajcarskoj.
      - title: Uvoz
        desc: Auto nije u vašoj zemlji? Naći ćemo i dovesti ga iz Nemačke, Evrope ili Kine - sve uključeno, uključujući carinjenje.
      - title: Provera
        desc: Nezavisni stručnjak proverava auto pre kupovine - više od 100 tačaka sa videom.
        note: Našli ste auto sami? Možemo naručiti proveru odvojeno
      - title: Otkup
        desc: Obrađujemo otkup i carinjenje automobila sa stranim registarskim tablicama.
        note: Auto već u inostranstvu? Pomoći ćemo oko formalnosti
    heroLine1: Naći ćemo auto.
    heroLine2: Proverićemo.
    heroLine3: Dovest ćemo ga.
    heroSubtext: Pronaći ćemo auto u Nemačkoj, Španiji, Švajcarskoj ili Srbiji, a ako je u drugoj zemlji, dopremićemo ga uz proveru, formalnosti i carinjenje.
    statClients:
      value: 200+
      label: klijenata
    statCountries:
      label: zemalja
    statYears:
      value: 5 godina
      label: na tržištu
    journeyHeading: 'Jedan put: od pretrage do ključeva'
    journeySubtext: Auto-sourcing, uvoz, provera i otkup - nisu različite usluge, već faze jednog putovanja vašeg automobila. Možete započeti u bilo kojoj fazi.
    whyUsHeading: Zašto nas biraju
    whyUsSubtext: Kupovina automobila iz druge zemlje može izazvati pitanja. Evo kako ih razrešavamo.
    trustCards:
      - title: Potpuna transparentnost
        text: 'Šaljemo detaljan kontrolni list (preko 100 tačaka) i video svakog detalja: karoserija, enterijer, podvozje. Vidite auto kao da stojite pored njega.'
      - title: Sigurnost transakcije
        text: 'Postepeno plaćanje i jasni uslovi. Pratimo dokumentaciju na svim fazama: registracija, carinjenje, registrovanje - bez iznenađenja.'
      - title: Lokalna ekspertiza
        text: 'Poznajemo specifičnosti svakog tržišta: kilometraže automobila u Nemačkoj, karakteristike karoserija španskih automobila, posebnosti registracije na stranim tablicama u Srbiji.'
    testimonialsHeading: Šta kažu klijenti
    testimonials:
      - quote: «Doveli su BMW 3 serije iz Minhena u Beograd. Sve je proteklo savršeno - od provere do registrovanja. Uštedeli smo puno nervoze na procedurama.»
        name: Aleksandar
        caption: BMW 320d, Nemačka → Srbija
      - quote: «Dugo sam tražio Škodu Octaviju u dobrom stanju. Momci su našli opciju u Španiji, proverili su je s nezavisnim stručnjakom - sve se poklapalo s opisom.»
        name: Mihail
        caption: Škoda Octavia, Španija → Rusija
      - quote: «Procedura registracije na stranim tablicama delovala je komplikovano. Tim me je vodio kroz svaki korak - i mesec dana kasnije, već sam vozio. Preporučujem.»
        name: Dmitrij
        caption: VW Passat, Nemačka → Srbija
    ctaEyebrow: Spremni da počnemo?
    ctaHeading:
      line1: Recite nam
      line2: o automobilu,
      accentWord: koji tražite
    ctaSubtext: Odgovaramo u roku od 2 sata. Konsultacije su besplatne.
    ctaTelegramLabel: Pisati na Telegram
    ctaStatResponse:
      value: 2 h
      label: odgovor
    origin:
      heading: Odakle dovozimo
      note: Dopremamo u svaku zemlju - razgovaraćemo o tome prilikom prijave
      euTitle: Iz Evrope
      euText: Nemačka, Španija, Švajcarska i druge evropske zemlje. Pronalazimo na licu mesta, proveravamo pre kupovine, sređujemo izvoz, dovozimo i carinimo. Konačnu cenu objavljujemo pre transakcije, a ne posle prelaska granice.
      euCta: Izračunaj uvoz iz Evrope
      chinaTitle: Iz Kine
      chinaText: Novi i polovnjaci iz Kine preko proverenog partnera. Pronalazak u okviru vašeg budžeta, provera pre slanja, dostava i carinjenje - na isti način kao i iz Evrope.
      chinaCta: Izračunaj uvoz iz Kine
      chinaTags:
        - Novi
        - Sa prevoženjem
        - Sve uključeno
    catalogue:
      heading: Poslednji poslovi
      subtext: 'Ovde nema oglasa: svaki auto je pronađen, proveren, registrovan i predat osobi. Cena je ona koju je platio.'
      allCountriesLabel: Sve zemlje
      moreLabel: Prikaži još {rest}
    inspection:
      heading: Stotinu tačaka, od kojih četiri odlučuju
      subtext: Kontrolni list je dug, ali od transakcije vas obično odvraća jedna od četiri oblasti. Kliknite na broj na shemi - pokažemo šta proverava stručnjak i šta smo tamo pronašli.
      hint: Kliknite na broj na shemi
      ctaLabel: Naručite proveru
      pointsLabel: 100+ tačaka
      mediaLabel: fotografije i video
      reportLabel: izveštaj pre odluke
      zones:
        - title: Karoserija i lak
          text: Mera debljine po svakoj panele, geometrija otvora, tragovi varenja i spakovanja. Odatle se može videti da li je bilo popravki koje prodavac nije naveo.
          points:
            - Prebojan hrom i panele
            - Zadovoljstvo i geometrija nakon udarca
            - Korozija u pragovima i lukovima
            - Originalnost stakala i svetala
        - title: Motor i menjač
          text: Parametri na zagrejanom motoru, adaptacije menjača, greške u memoriji blokova. Najskuplja oblast - i najčešći uzrok odbijanja.
          points:
            - Produženje lanca GPRM
            - Curanje i kapljanje
            - Adaptacije i trzaji menjača
            - Kompresija i dimljivost
          finding: 'BMW M340 2025. godine s malim prevoženjem: dijagnostika je pokazala produženje lanca GPRM od oko 20%. Pronašli smo pre transakcije - klijent je stekao argument za pregovor.'
        - title: Podvozje i kočnice
          text: Dizalica, luftovi, stanje podvozja i kočionog sistema. Nemačka putna kilometraža i balkanske ceste troše auto drugačije.
          points:
            - Luftovi spojki i kugličnih zglobova
            - Curenje amortizera
            - Habanje diskova i kočnica
            - Upravljačka šipka i čizme
        - title: Elektronika, VIN i dokumenti
          text: Servisna istorija prema VIN-u, manipulisani prevozi, greške elektronike i pravna čistoća - hipoteka, zabrana registracije, nezatvoreni udesi.
          points:
            - Neusklađenost prevoza s istorijom
            - Greške u memoriji blokova
            - Hipoteka i zabrana registracije
            - Nezatvoreni udesi i osiguravajuća događanja
    findingLabel: 'Pronađeno:'
    heroPhotoAlt: Sedan na evropskom autoputu
    ctaPhotoAlt: Čista karoserija i točak automobila izbliza
  es:
    metaTitle: Selección, importación y compra de autos en Europa
    metaDescription: Selección de autos en su país o importación desde Europa y China — todo incluido. Inspección y compra. Operamos en toda Europa.
