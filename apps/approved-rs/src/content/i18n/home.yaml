  de:
    metaTitle: Autowahl, Import und Rückkauf von Autos in Europa
    metaDescription: Autowahl im eigenen Land oder Import von Autos aus Europa und China — schlüsselfertig. Prüfung und Rückkauf. Wir arbeiten in ganz Europa.
    journey:
      - title: Wahl
        desc: Wir finden, prüfen und liefern das Auto innerhalb Ihres Budgets — schlüsselfertig, in Deutschland, Spanien, Serbien und der Schweiz.
      - title: Import
        desc: Auto nicht in Ihrem Land? Wir finden und bringen es aus Deutschland, Europa oder China — schlüsselfertig, inklusive Zollabfertigung.
      - title: Prüfung
        desc: Ein unabhängiger Experte inspiziert das Fahrzeug vor dem Kauf — über 100 Prüfpunkte mit Video.
        note: Haben Sie das Auto selbst gefunden? Wir führen die Prüfung separat durch.
      - title: Rückkauf
        desc: Wir kümmern uns um den Rückkauf und die Zollabfertigung von Fahrzeugen mit ausländischen Nummernschildern.
        note: Ist das Auto bereits im Ausland? Wir helfen bei der Abwicklung.
    heroLine1: Wir finden das Auto.
    heroLine2: Wir prüfen es.
    heroLine3: Wir bringen es.
    heroSubtext: Wir wählen ein Auto in Deutschland, Spanien, der Schweiz oder Serbien aus. Wenn es in einem anderen Land ist, bringen wir es zu Ihnen mit Prüfung, Abwicklung und Zollabfertigung.
    statClients:
      value: 200+
      label: Kunden
    statCountries:
      label: Länder
    statYears:
      value: 5 Jahre
      label: auf dem Markt
    journeyHeading: 'Ein Weg: von der Suche bis zu den Schlüsseln'
    journeySubtext: Autowahl, Import, Prüfung und Rückkauf — keine verschiedenen Dienstleistungen, sondern Schritte auf dem Weg Ihres Fahrzeugs. Sie können an jedem Schritt einsteigen.
    whyUsHeading: Warum uns wählen
    whyUsSubtext: Der Kauf eines Autos aus einem anderen Land wirft Fragen auf. So gehen wir diese an.
    trustCards:
      - title: Vollständige Transparenz
        text: 'Wir senden eine detaillierte Checkliste (über 100 Punkte) und Videos zu jedem Detail: Karosserie, Innenraum, Fahrwerk. Sie sehen das Auto, als ob Sie direkt daneben stehen.'
      - title: Sicherheit der Transaktion
        text: 'Zahlung in Raten und klare Bedingungen. Wir begleiten die Dokumente in allen Phasen: Abwicklung, Zollabfertigung, Registrierung — keine Überraschungen.'
      - title: Lokale Expertise
        text: 'Wir kennen die Besonderheiten jedes Marktes: Autobahnkilometer in Deutschland, Merkmale spanischer Autos, Details zur Abwicklung von ausländischen Nummernschildern in Serbien.'
    testimonialsHeading: Das sagen unsere Kunden
    testimonials:
      - quote: „Wir haben einen BMW 3er aus München nach Belgrad gebracht. Alles klar — von der Besichtigung bis zur Zulassung. Wir haben eine Menge Nerven bei der Abwicklung gespart.“
        name: Александр
        caption: BMW 320d, Deutschland → Serbien
      - quote: „Ich habe lange nach einer Skoda Octavia in gutem Zustand gesucht. Die Jungs haben eine Option in Spanien gefunden, von einem unabhängigen Experten prüfen lassen — alles stimmte mit der Beschreibung überein.“
        name: Михаил
        caption: Skoda Octavia, Spanien → Russland
      - quote: „Die Abwicklung mit ausländischen Nummernschildern schien kompliziert. Das Team hat uns durch jeden Schritt geführt — nach einem Monat bin ich schon gefahren. Ich empfehle.“
        name: Дмитрий
        caption: VW Passat, Deutschland → Serbien
    ctaEyebrow: Bereit zu starten?
    ctaHeading:
      line1: Erzählen Sie uns
      line2: von dem Auto,
      accentWord: das Sie suchen
    ctaSubtext: Wir antworten innerhalb von 2 Stunden. Beratung ist kostenlos.
    ctaTelegramLabel: Nachricht bei Telegram senden
    ctaStatResponse:
      value: 2 Std.
      label: Antwort
    origin:
      heading: Von wo wir importieren
      note: Wir liefern in jedes Land — besprechen wir bei der Anfrage.
      euTitle: Aus Europa
      euText: Deutschland, Spanien, die Schweiz und andere europäische Länder. Wir wählen vor Ort aus, prüfen vor dem Kauf, kümmern uns um den Export, bringen und zollen. Den Endbetrag nennen wir vor dem Deal, nicht nach der Grenze.
      euCta: Import aus Europa berechnen
      chinaTitle: Aus China
      chinaText: Neue und gebrauchte Fahrzeuge aus China über einen vertrauenswürdigen Partner. Auswahl nach Ihrem Budget, Prüfung vor dem Versand, Lieferung und Zollabfertigung — in der gleichen Reihenfolge wie in Europa.
      chinaCta: Import aus China berechnen
      chinaTags:
        - Neu
        - Gebraucht
        - Schlüsselfertig
    catalogue:
      heading: Neueste Geschäfte
      subtext: 'Hier gibt es keine Anzeigen: jedes Auto ist gefunden, geprüft, abgewickelt und an eine Person übergeben. Der Preis ist der, den sie bezahlt haben.'
      allCountriesLabel: Alle Länder
      moreLabel: Weitere anzeigen {rest}
    inspection:
      heading: Hundert Punkte, von denen vier entscheiden
      subtext: Die Checkliste ist lang, aber die meisten Deals scheitern fast immer aus einem der vier Bereiche. Klicken Sie auf die Nummer im Diagramm — wir zeigen, wonach der Experte sieht und was wir dort gefunden haben.
      hint: Klicken Sie auf die Nummer im Diagramm
      ctaLabel: Prüfung bestellen
      pointsLabel: 100+ Punkte
      mediaLabel: Fotos und Videos
      reportLabel: Bericht vor Entscheidung
      zones:
        - title: Karosserie und Lackierung
          text: Lackstärke jeder Platten, Geometrie der Öffnungen, Schweiß- und Spachtelspuren. Hier sieht man, ob eine Reparatur durchgeführt wurde, die der Verkäufer vergessen hat.
          points:
            - Neulackierung und Nachlackierung von Platten
            - Spaltmaße und Geometrie nach dem Unfall
            - Rost in Schweller und Radkästen
            - Originalität der Scheiben und Leuchten
        - title: Motor und Getriebe
          text: Parameter bei warmem Motor, Anpassungen des Getriebes, Fehler im Speicher der Steuergeräte. Der teuerste Bereich — und die häufigste Grund für eine Ablehnung.
          points:
            - Dehnung der Steuerkette
            - Ölundichtigkeiten und schwitzende Stellen
            - Anpassungen und Ruckeln des Getriebes
            - Kompression und Rauchentwicklung
          finding: 'BMW M340 2025 mit geringem Kilometerstand: Die Diagnose ergab eine Dehnung der Steuerkette von ca. 20 %. Wir haben es vor dem Deal gefunden — der Kunde hatte ein Argument für die Verhandlung.'
        - title: Fahrwerk und Bremsen
          text: Hebebühne, Spiel, Zustand der Aufhängung und Bremssystem. Deutsche Autobahnkilometer und Balkanstrecken beanspruchen das Auto anders.
          points:
            - Spiel in den Querlenkern und Kugelgelenken
            - Ölundichtigkeiten der Dämpfer
            - Verschleiß der Scheiben und Beläge
            - Lenkgetriebe und Staubschutz
        - title: Elektronik, VIN und Dokumente
          text: Servicehistorie über die VIN, manipulierte Kilometerstände, Fehler in der Elektronik und rechtliche Sauberkeit — Pfandrechte, Registrierungsverbote, unklare Unfälle.
          points:
            - Diskrepanz der Kilometerstände mit der Historie
            - Fehler im Speicher der Steuergeräte
            - Pfandrechte und Registrierungssperren
            - Ungeklärte Unfälle und Versicherungsschäden
    findingLabel: 'Wir haben gefunden:'
    heroPhotoAlt: Limousine auf europäischer Autobahn
    ctaPhotoAlt: Saubere Karosserie und Rad in naher Ansicht
