    journeySubtext: Autobeschaffung, Import, Prüfung und Rückkauf – keine verschiedenen Dienstleistungen, sondern Schritte auf dem Weg Ihres Fahrzeugs. Sie können jederzeit einsteigen.
    whyUsHeading: Warum wählen uns unsere Kunden
    whyUsSubtext: Der Kauf eines Autos aus einem anderen Land wirft Fragen auf. So beantworten wir diese.
    trustCards:
      - title: Vollständige Transparenz
        text: 'Wir senden Ihnen eine detaillierte Checkliste (über 100 Punkte) und Videos von jedem Detail: Karosserie, Innenraum, Fahrwerk. Sie sehen das Fahrzeug so, als würden Sie daneben stehen.'
      - title: Sicherheit der Transaktion
        text: 'Zahlung in Raten und klare Bedingungen. Wir begleiten die Dokumente in allen Phasen: Formalitäten, Zollabwicklung, Registrierung – ohne Überraschungen.'
      - title: Lokale Expertise
        text: 'Wir kennen die Besonderheiten jedes Marktes: Autobahnfahrten in Deutschland, Merkmale spanischer Autos, Details zur Zulassung ausländischer Kennzeichen in Serbien.'
    ctaEyebrow: Bereit zu starten?
