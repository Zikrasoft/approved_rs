    origin:
      heading: Woher wir importieren
      note: Wir liefern in jedes Land – besprechen wir bei Anfrage
      euTitle: Aus Europa
      euText: Deutschland, Spanien, Schweiz und andere europäische Länder. Wir wählen vor Ort aus, inspizieren vor dem Kauf, erledigen den Export, transportieren und zollabwickeln. Den Gesamtpreis nennen wir vor dem Deal, nicht nach der Grenze.
      euCta: Import aus Europa kalkulieren
      chinaTitle: Aus China
      chinaText: Neue und gebrauchte Autos aus China über einen geprüften Partner. Auswahl nach Ihrem Budget, Prüfung vor dem Versand, Lieferung und Zollabwicklung – im gleichen Verfahren wie in Europa.
      chinaCta: Import aus China kalkulieren
      chinaTags:
        - Neu
        - Gebraucht
        - Schlüsselfertig
    catalogue:
      heading: Was man für dieses Geld bekommt
      subtext: 'Hier gibt es keine Anzeigen: Jedes Auto ist gefunden, geprüft, registriert und an eine Person übergeben. Der Preis ist der, den er bezahlt hat.'
      budgetLabel: Budget für das Auto, bis
      allCountriesLabel: Alle Länder
      countTemplate: '{shown} von {total} verfügbar'
      moreLabel: Noch mehr zeigen {rest}
      emptyText: In diesem Budget in dem ausgewählten Land haben wir bisher keine Deals abgeschlossen. Schreiben Sie uns – wir sagen ehrlich, was man wirklich bekommen kann.
    inspection:
      heading: Hundert Punkte, von denen vier entscheiden
      subtext: Die Checkliste ist lang, aber fast immer wird wegen einer der vier Zonen vom Deal abgeraten. Klicken Sie auf die Nummer im Diagramm – wir zeigen, was der Experte prüft und was wir dort gefunden haben.
      hint: Klicken Sie auf die Nummer im Diagramm
      ctaLabel: Prüfung anfordern
      pointsLabel: 100+ Punkte
      mediaLabel: Fotos und Videos
      reportLabel: Bericht vor der Entscheidung
      zones:
        - title: Karosserie und Lack
          text: Messgerät für jede Paneel, Geometrie der Öffnungen, Spuren von Schweiß- und Spachtelarbeiten. Daraus ist ersichtlich, ob es Reparaturen gab, die der Verkäufer vergessen hat.
          points:
            - Neulackierung und Überlackierung von Paneelen
            - Spaltmaße und Geometrie nach einem Unfall
            - Rost in Schwellen und Radkästen
            - Originalität von Scheiben und Scheinwerfern
        - title: Motor und Getriebe
          text: Parameter bei warmem Motor, Anpassungen des Getriebes, Fehler im Speicher der Steuergeräte. Die teuerste Zone – und die häufigste Ursache für eine Ablehnung.
          points:
            - Dehnung der Steuerkette
            - Öl-Lecks und Anfeuchtungen
            - Anpassungen und Ruckeln des Getriebes
            - Kompression und Rauchentwicklung
          finding: 'BMW M340 2025 mit wenig Kilometerstand: Die Diagnose zeigte eine Dehnung der Steuerkette von etwa 20 %. Wir haben es vor dem Deal gefunden – der Kunde hatte ein Argument für die Verhandlung.'
        - title: Fahrwerk und Bremsen
          text: Bühne, Spiel, Zustand des Fahrwerks und Bremsanlage. Deutsche Autobahnfahrten und Balkanstraßen nutzen Autos unterschiedlich ab.
          points:
            - Spiel in Querlenkern und Kugelgelenken
            - Öl-Leckagen der Dämpfer
            - Abnutzung der Scheiben und Beläge
            - Lenkgetriebe und Staubschutz
        - title: Elektronik, VIN und Dokumente
          text: Servicehistorie über die VIN, manipulierte Kilometerstände, Fehler der Elektronik und rechtliche Sauberkeit – Pfandrechte, Registrierungsverbote, ungeklärte Unfälle.
          points:
            - Abweichungen beim Kilometerstand mit Historie
            - Fehler im Speicher der Steuergeräte
            - Pfandrechte und Registrierungsverbot
            - Ungeklärte Unfälle und Versicherungsereignisse
    findingLabel: 'Gefunden:'
    heroPhotoAlt: Limousine auf einer europäischen Autobahn
    ctaPhotoAlt: Saubere Karosserie und Auto-Rad im Close-up
