      - title: Experiencia local
        text: 'Conocemos las especificidades de cada mercado: millas en autopista de Alemania, particularidades de la carrocería de los autos españoles, y detalles sobre la tramitación de matrículas extranjeras en Serbia.'
    testimonialsHeading: Lo que dicen los clientes
    testimonials:
      - quote: «Trajeron un BMW Serie 3 de Múnich a Belgrado. Todo claro - desde la inspección hasta el registro. Ahorramos un montón de nervios en la tramitación.»
        name: Александр
        caption: BMW 320d, Alemania → Serbia
      - quote: «Busqué durante mucho tiempo un Skoda Octavia en buen estado. Ellos encontraron una opción en España, la revisaron con un experto independiente - todo coincidió con la descripción.»
        name: Михаил
        caption: Skoda Octavia, España → Rusia
      - quote: «La tramitación de matrículas extranjeras parecía complicada. El equipo me guió paso a paso - y en un mes ya estaba conduciendo. Lo recomiendo.»
        name: Дмитрий
        caption: VW Passat, Alemania → Serbia
    ctaEyebrow: ¿Listo para comenzar?
    ctaHeading:
      line1: Cuéntanos sobre
      line2: el auto que buscas
      accentWord: que estás buscando
    ctaSubtext: Respondemos en un plazo de 2 horas. La consulta es gratuita.
    ctaTelegramLabel: Escribir por Telegram
    ctaStatResponse:
      value: 2 h
      label: respuesta
    origin:
      heading: De dónde traemos
      note: Entregamos en cualquier país - lo discutimos al solicitar
      euTitle: Desde Europa
      euText: Alemania, España, Suiza y otros países europeos. Seleccionamos en el lugar, inspeccionamos antes de la compra, tramitamos la exportación, la llevamos y la aduanamos. Le informamos el precio total antes de la transacción, y no después de cruzar la frontera.
      euCta: Calcular importación desde Europa
      chinaTitle: Desde China
      chinaText: Autos nuevos y usados de China a través de un socio de confianza. Selección según su presupuesto, inspección previa al envío, entrega y aduana - en el mismo orden que en Europa.
      chinaCta: Calcular importación desde China
      chinaTags:
        - Nuevos
        - Usados
        - Todo incluido
    catalogue:
      heading: Últimos tratos
      subtext: 'Aquí no hay anuncios: cada automóvil ha sido encontrado, revisado, tramitado y entregado a una persona. El precio es el que él pagó.'
      allCountriesLabel: Todos los países
      moreLabel: Mostrar más {rest}
    inspection:
      heading: Cien puntos, de los cuales cuatro deciden
      subtext: La lista de verificación es larga, pero casi siempre se rechaza la transacción por una de las cuatro áreas. Haga clic en el número en el diagrama - le mostramos qué revisa el experto y qué encontramos allí.
      hint: Haga clic en el número en el diagrama
      ctaLabel: Solicitar inspección
      pointsLabel: 100+ puntos
      mediaLabel: fotos y videos
      reportLabel: informe antes de decidir
      zones:
        - title: Carrocería y pintura
          text: Medidor de grosor para cada panel, geometría de los recortes, rastros de soldadura y masilla. Desde aquí se puede ver si hubo una reparación de la que el vendedor se olvidó.
          points:
            - Repintado y retoques de paneles
            - Hendiduras y geometría después de un impacto
            - Corrosión en umbrales y arcos
            - Originalidad de los vidrios y ópticas
        - title: Motor y caja
          text: Parámetros en motor caliente, adaptaciones de la caja, errores en la memoria de los módulos. Es la zona más costosa - y la razón de rechazo más común.
          points:
            - Estiramiento de la cadena del árbol de levas
            - Fugas y humedecimientos
            - Adaptaciones y golpes en la caja
            - Compresión y humo
          finding: 'BMW M340 2025 con poco kilometraje: el diagnóstico mostró un estiramiento de la cadena del árbol de levas de aproximadamente 20 %. Lo encontramos antes de la transacción - ahora el cliente tiene un argumento para negociar.'
        - title: Suspensión y frenos
          text: Elevador, holguras, estado de la suspensión y del sistema de frenos. El kilometraje en autopista alemana y las carreteras balcánicas desgastan el automóvil de manera diferente.
          points:
            - Holguras en brazos y esferas
            - Fugas en los amortiguadores
            - Desgaste de discos y pastillas
            - Rótula y fuelles
        - title: Electrónica, VIN y documentos
          text: Historial de servicio por VIN, kilometraje manipulado, errores electrónicos y limpieza legal - embargos, prohibiciones de registro, accidentes no resueltos.
          points:
            - Discrepancia en el kilometraje con el historial
            - Errores en la memoria de los módulos
            - Embargo y prohibición de registro
            - Accidentes no resueltos y eventos de seguros
    findingLabel: 'Encontramos:'
    heroPhotoAlt: Sedán en una carretera europea
    ctaPhotoAlt: Carrocería limpia y rueda del automóvil en primer plano
  de:
    metaTitle: Fahrzeugbeschaffung, Import und Rückkauf in Europa
    metaDescription: Fahrzeugbeschaffung in Ihrem Land oder Import aus Europa und China – schlüsselfertig. Inspektion und Rückkauf. Wir arbeiten in ganz Europa.
    journey:
      - title: Fahrzeugauswahl
        desc: Wir finden, prüfen und liefern das Auto nach Ihrem Budget – schlüsselfertig, in Deutschland, Spanien, Serbien und der Schweiz.
      - title: Import
        desc: Das Auto ist nicht in Ihrem Land? Wir finden es und bringen es aus Deutschland, Europa oder China – schlüsselfertig, inklusive Zollabwicklung.
      - title: Inspektion
        desc: Ein unabhängiger Experte prüft das Fahrzeug vor dem Kauf – über 100 Punkte mit Video-Dokumentation.
        note: Haben Sie das Auto selbst gefunden? Wir können die Inspektion separat bestellen
      - title: Rückkauf
        desc: Wir kümmern uns um den Rückkauf und die Zollabwicklung eines Fahrzeugs mit ausländischen Kennzeichen.
        note: Das Auto ist bereits im Ausland? Wir helfen Ihnen bei der Abwicklung
    heroLine1: Wir finden das Auto.
    heroLine2: Wir prüfen es.
    heroLine3: Wir bringen es.
    heroSubtext: Wir wählen ein Auto in Deutschland, Spanien, der Schweiz oder Serbien aus und bringen es, wenn es in einem anderen Land ist, zu Ihnen mit Prüfung, Abwicklung und Zollabfertigung.
    statClients:
      value: 200+
      label: Kunden
    statCountries:
      label: Länder
    statYears:
      value: 5 Jahre
      label: auf dem Markt
    journeyHeading: 'Ein Weg: vom Finden zu den Schlüsseln'
    journeySubtext: Fahrzeugbeschaffung, Import, Inspektion und Rückkauf – sind keine verschiedenen Dienstleistungen, sondern Schritte auf dem Weg Ihres Fahrzeugs. Sie können an jedem Schritt einsteigen.
    whyUsHeading: Warum uns wählen
    whyUsSubtext: Der Kauf eines Autos aus einem anderen Land wirft Fragen auf. So beantworten wir sie.
    trustCards:
      - title: Vollständige Transparenz
        text: 'Wir senden Ihnen eine detaillierte Checkliste (über 100 Punkte) und Videos zu jedem Detail: Karosserie, Innenraum, Fahrwerk. Sie sehen das Fahrzeug so, als stünden Sie daneben.'
      - title: Sicherheit der Transaktion
        text: 'Schrittweise Zahlung und verständliche Bedingungen. Wir unterstützen die Dokumente in allen Phasen: Abwicklung, Zoll, Registrierung – ohne Überraschungen.'
      - title: Lokale Expertise
        text: 'Wir kennen die Besonderheiten jedes Marktes: Autobahnkilometer in Deutschland, Merkmale spanischer Fahrzeuge, Aspekte der Abwicklung für ausländische Kennzeichen in Serbien.'
    testimonialsHeading: Was unsere Kunden sagen
    testimonials:
      - quote: „Wir haben einen BMW 3er aus München nach Belgrad gebracht. Alles lief klar – von der Besichtigung bis zur Zulassung. Wir haben uns eine Menge Nerven beim Papierkram gespart.“
        name: Александр
        caption: BMW 320d, Deutschland → Serbien
      - quote: „Ich habe lange nach einer Skoda Octavia in gutem Zustand gesucht. Die Jungs fanden einen in Spanien, überprüften ihn durch einen unabhängigen Experten – alles stimmte mit der Beschreibung überein.“
        name: Михаил
        caption: Skoda Octavia, Spanien → Russland
      - quote: „Die Abwicklung für ausländische Kennzeichen schien kompliziert. Das Team begleitete mich durch jeden Schritt – und nach einem Monat konnte ich schon fahren. Ich empfehle es.“
        name: Дмитрий
        caption: VW Passat, Deutschland → Serbien
    ctaEyebrow: Bereit zu starten?
    ctaHeading:
      line1: Erzählen Sie uns
      line2: von dem Auto,
      accentWord: das Sie suchen
    ctaSubtext: Wir antworten innerhalb von 2 Stunden. Die Beratung ist kostenlos.
    ctaTelegramLabel: Nachricht in Telegram senden
    ctaStatResponse:
      value: 2 Std.
      label: Antwort
    origin:
      heading: Wo wir importieren
      note: Wir liefern in jedes Land – sprechen wir bei der Anfrage.
      euTitle: Aus Europa
      euText: Deutschland, Spanien, Schweiz und andere europäische Länder. Wir wählen vor Ort aus, prüfen vor dem Kauf, kümmern uns um den Export, transportieren und erledigen die Zollabwicklung. Den Endpreis nennen wir vor dem Deal, nicht nach der Grenze.
      euCta: Import aus Europa kalkulieren
      chinaTitle: Aus China
      chinaText: Neue und gebrauchte Fahrzeuge aus China über einen vertrauenswürdigen Partner. Auswahl nach Ihrem Budget, Prüfung vor dem Versand, Lieferung und Zollabwicklung – im gleichen Verfahren wie in Europa.
      chinaCta: Import aus China kalkulieren
      chinaTags:
        - Neu
        - Gebraucht
        - Schlüsselfertig
    catalogue:
      heading: Aktuelle Transaktionen
      subtext: 'Hier gibt es keine Anzeigen: jedes Auto wurde gefunden, geprüft, abgewickelt und an die Person übergeben. Der Preis ist der, den sie bezahlt hat.'
      allCountriesLabel: Alle Länder
      moreLabel: Weitere {rest} anzeigen
    inspection:
      heading: Hundert Punkte, von denen vier entscheidend sind
      subtext: Die Checkliste ist lang, aber meist wird man aus einem der vier Bereiche vom Deal abgehalten. Klicken Sie auf die Nummer im Diagramm – wir zeigen, was der Experte prüft und was wir dort gefunden haben.
      hint: Klicken Sie auf die Nummer im Diagramm
      ctaLabel: Inspektion bestellen
      pointsLabel: 100+ Punkte
      mediaLabel: Fotos und Videos
      reportLabel: Bericht vor der Entscheidung
      zones:
        - title: Karosserie und Lackierung
          text: Lackdicke pro Paneel, Geometrie der Öffnungen, Schweiß- und Spachtelspuren. Daraus ist ersichtlich, ob es eine Reparatur gab, die der Verkäufer vergessen hat.
          points:
            - Lackieren und Nachlackieren der Paneele
            - Spaltmaße und Geometrie nach einem Unfall
            - Rost in Schweller und Radkästen
            - Originalität der Scheiben und Lichter
        - title: Motor und Getriebe
          text: Parameter bei warmem Motor, Getriebeanpassungen, Fehler im Steuergerät. Der teuerste Bereich – und die häufigste Ursache für einen Abbruch.
          points:
            - Verschleiß der Steuerkette
            - Undichtigkeiten und Schmierverluste
            - Getriebeanpassungen und ruckartiges Schalten
            - Kompression und Abgaswerte
          finding: 'BMW M340 2025 mit geringer Laufleistung: Die Diagnose zeigte einen Verschleiß der Steuerkette von etwa 20 %. Wir fanden es vor dem Deal – der Kunde hatte ein Argument für Verhandlungen.'
        - title: Fahrwerk und Bremsen
          text: Hebebühne, Spiel, Zustand der Aufhängung und der Bremsanlage. Deutsche Autobahnkilometer und Balkanzufahrten beanspruchen das Fahrzeug unterschiedlich.
          points:
            - Spiel von Quer- und Lenkstangen
            - Undichtigkeiten der Stoßdämpfer
            - Verschleiß der Scheiben und Beläge
            - Lenkgetriebe und Manschetten
        - title: Elektronik, VIN und Dokumente
          text: Servicehistorie über die VIN, manipulierter Kilometerstand, Elektronikfehler und rechtliche Sauberkeit – Pfand, Registrierungssperre, nicht geschlossene Unfälle.
          points:
            - Abweichung des Kilometerstands von der Historie
            - Fehler im Steuergerät
            - Pfand und Registrierungsverbot
            - Nicht geschlossene Unfälle und versicherungsrelevante Ereignisse
    findingLabel: 'Gefunden:'
    heroPhotoAlt: Limousine auf einer europäischen Autobahn
    ctaPhotoAlt: Saubere Karosserie und Rad des Fahrzeugs im Close-up
