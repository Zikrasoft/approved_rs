    origin:
      heading: De dónde traemos
      note: Entregamos a cualquier país, discutimos al hacer la solicitud
      euTitle: Desde Europa
      euText: Alemania, España, Suiza y otros países europeos. Seleccionamos in situ, inspeccionamos antes de la compra, formalizamos la exportación, transportamos y despachamos. El precio final se indica antes del trato, no después de cruzar la frontera.
      euCta: Calcular importación desde Europa
      chinaTitle: Desde China
      chinaText: Automóviles nuevos y usados de China a través de un socio confiable. Selección según su presupuesto, inspección antes del envío, entrega y despacho aduanero de la misma manera que en Europa.
      chinaCta: Calcular importación desde China
      chinaTags:
        - Nuevos
        - Con kilometraje
        - Con todo incluido
    catalogue:
      heading: Últimas transacciones
      subtext: 'Aquí no hay anuncios: cada automóvil está encontrado, inspeccionado, formalizado y entregado a una persona. El precio indicado es el que él pagó.'
      allCountriesLabel: Todos los países
      moreLabel: Mostrar más {rest}
    inspection:
      heading: Cien puntos, de los cuales cuatro deciden
      subtext: La lista de verificación es larga, pero casi siempre se rechaza el trato por una de las cuatro áreas. Toque el número en el esquema, y le mostraremos qué está revisando el experto y qué encontramos allí.
      hint: Haga clic en el número en el esquema
      ctaLabel: Solicitar inspección
      pointsLabel: 100+ puntos
      mediaLabel: fotos y vídeos
      reportLabel: informe antes de la decisión
      zones:
        - title: Carrocería y pintura
          text: Medición de grosor en cada panel, geometría de los marcos, indicios de soldadura y masilla. Aquí se ve si hubo una reparación de la que el vendedor olvidó hablar.
          points:
            - Reacondicionado y repintado de paneles
            - Alineación y geometría tras un impacto
            - Corrosión en los umbrales y arcos
            - Originalidad de los vidrios y ópticas
        - title: Motor y transmisión
          text: Parámetros con el motor caliente, adaptaciones de transmisión, errores en la memoria de los bloques. La zona más cara y la causa más común de rechazo.
          points:
            - Alargamiento de la cadena de distribución
            - Fugas y humedades
            - Adaptaciones y tirones de la transmisión
            - Compresión y emisión de humo
          finding: 'BMW M340 2025 con bajo kilometraje: diagnóstico mostró la elongación de la cadena de distribución alrededor del 20 %. Se encontró antes del trato, y el cliente tuvo un argumento para la negociación.'
        - title: Suspensión y frenos
          text: Elevador, holguras, estado de la suspensión y del sistema de frenos. El kilometraje en autopistas alemanas y las carreteras balcánicas desgastan el coche de manera diferente.
          points:
            - Holguras en brazos y rótulas
            - Fugas de amortiguadores
            - Desgaste de discos y pastillas
            - Dirección y fuelles
        - title: Electrónica, VIN y documentos
          text: 'Historial de servicio por VIN, kilometraje manipulado, errores en la electrónica y limpieza legal: gravámenes, prohibición de registro, accidentes no cerrados.'
          points:
            - Inconsistencia en el kilometraje con el historial
            - Errores en la memoria de módulos
            - Embargo y prohibición de matriculación
            - Accidentes no resueltos y eventos asegurados
