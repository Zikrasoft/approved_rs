        - Nuevos
        - Usados
        - Llave en mano
    catalogue:
      heading: Qué se puede obtener por este dinero
      subtext: 'No hay anuncios aquí: cada coche ha sido encontrado, verificado, documentado y entregado a una persona. El precio es el que pagó.'
      budgetLabel: Presupuesto para el coche, hasta
      allCountriesLabel: Todos los países
      countTemplate: Se ajustan {shown} de {total}
      moreLabel: Mostrar más {rest}
      emptyText: Hasta ahora no hemos cerrado ninguna operación en este presupuesto en el país seleccionado. Escríbenos — te diremos honestamente qué se puede conseguir.
    inspection:
      heading: Cien puntos, de los cuales cuatro deciden
      subtext: La lista de verificación es larga, pero casi siempre se desaconseja la transacción por una de las cuatro áreas. Haz clic en el número del esquema — te mostraremos qué verifica el experto y qué hemos encontrado allí.
      hint: Haz clic en el número en el esquema
      ctaLabel: Solicitar verificación
      pointsLabel: 100+ puntos
      mediaLabel: fotos y videos
      reportLabel: informe antes de la decisión
      zones:
        - title: Carrocería y pintura
          text: Medidor de grosor en cada panel, geometría de los marcos, signos de soldadura y masilla. Aquí se puede ver si hubo una reparación que el vendedor omitió.
          points:
            - Pintura y retoque de paneles
            - Alineación y geometría tras un impacto
            - Corrosión en los umbrales y pasarruedas
            - Originalidad de cristales y ópticas
        - title: Motor y transmisión
          text: Parámetros con el motor en caliente, adaptaciones de la transmisión, errores en la memoria de los bloques. La zona más costosa — y la razón más común de rechazo.
          points:
            - Estiramiento de la cadena del árbol de levas
            - Fugas y humedecimientos
            - Adaptaciones y tirones en la caja de cambios
            - Compresión y emisión de humo
          finding: 'BMW M340 2025 con bajo kilometraje: el diagnóstico mostró un estiramiento de la cadena del árbol de levas de alrededor del 20%. Lo encontramos antes de la transacción — el cliente obtuvo un argumento para la negociación.'
        - title: Suspensión y frenos
          text: Elevador, holguras, estado de la suspensión y del sistema de frenos. El kilometraje en autopista alemana y las carreteras balcánicas desgastan el coche de manera diferente.
          points:
            - Holguras en las rótulas y esferas
            - Fugas en los amortiguadores
            - Desgaste de discos y pastillas
            - Cremallera de dirección y fuelles
        - title: Electrónica, VIN y documentos
          text: Historial de servicio según el VIN, kilometraje alterado, errores en la electrónica y limpieza legal — gravámenes, prohibiciones de registro, accidentes no resueltos.
          points:
            - Discrepancia de kilometraje con el historial
            - Errores en la memoria de los bloques
            - Gravámenes y prohibición de registro
            - Accidentes no resueltos y eventos de seguros
