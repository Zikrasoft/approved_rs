      value: 5 godina
      label: na tržištu
    journeyHeading: 'Jedan put: od pretrage do ključeva'
    journeySubtext: Auto izbor, uvoz, provera i otkup — nisu različite usluge, već koraci jednog puta vašeg automobila. Možete započeti s bilo kojeg koraka.
    whyUsHeading: Zašto nas biraju
    whyUsSubtext: Kupovina automobila iz druge zemlje postavlja pitanja. Evo kako ih razjašnjavamo.
    trustCards:
      - title: Potpuna transparentnost
        text: 'Šaljemo detaljan kontrolni spisak (100+ tačaka) i video svakog detalja: karoserija, enterijer, mehanička stanja. Vidite automobil kao da stojite pored njega.'
      - title: Sigurnost transakcije
        text: 'Fazna uplata i jasni uslovi. Pratimo dokumente na svim koracima: registracija, carinjenje, registracija — bez iznenađenja.'
      - title: Lokalna ekspertiza
        text: 'Znamo specifičnosti svake tržišne sredine: auto-putne pređene kilometre u Nemačkoj, karakteristike karoserija španskih automobila, detalje o registraciji na strane tablice u Srbiji.'
    ctaEyebrow: Spremni da počnemo?
    ctaHeading:
      line1: Recite nam
      line2: o svom
      accentWord: automobilu
    ctaSubtext: Odgovaramo u roku od 2 sata. Konsultacija je besplatna.
