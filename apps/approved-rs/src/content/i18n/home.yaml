  de:
    metaTitle: Autobeschaffung, Import und Rückkauf von Fahrzeugen in Europa
    metaDescription: Wir übernehmen die Autobeschaffung in Ihrem Land oder den Import von Fahrzeugen aus Europa und China – schlüsselfertig. Prüfung und Rückkauf. Wir arbeiten für russischsprachige Kunden weltweit.
    journey:
      - title: Beschaffung
        desc: Wir finden, prüfen und liefern das Fahrzeug innerhalb Ihres Budgets – schlüsselfertig in Deutschland, Spanien, Serbien und der Schweiz.
      - title: Import
        desc: Das Auto ist nicht in Ihrem Land? Wir beschaffen und importieren es aus Deutschland, Europa oder China – schlüsselfertig, inklusive Zollabwicklung.
      - title: Prüfung
        desc: Ein unabhängiger Experte inspiziert das Fahrzeug vor dem Kauf – nach über 100 Punkten mit Video.
        note: Haben Sie das Auto selbst gefunden? Wir bieten die Prüfung separat an.
      - title: Rückkauf
        desc: Wir kümmern uns um den Rückkauf und die Zollabwicklung des Fahrzeugs mit ausländischen Kennzeichen.
        note: Das Auto ist bereits im Ausland? Wir helfen bei der Formalitäten.
    heroLine1: Gefunden.
    heroLine2: Geprüft.
    heroLine3: Geliefert.
    heroSubtext: Wir beschaffen, prüfen, regeln die Formalitäten und bringen Ihr Fahrzeug aus Deutschland, Spanien oder Serbien. Ein Weg, ein Team.
