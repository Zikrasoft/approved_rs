whyUsHeading: Почему выбирают нас
whyUsSubtext: Покупка авто из другой страны вызывает вопросы. Вот как мы их снимаем.
trustCards:
  - title: Полная прозрачность
    text: 'Высылаем подробный чек-лист (100+ пунктов) и видео каждого нюанса: кузов, салон, ходовая. Вы видите автомобиль так, как будто стоите рядом.'
  - title: Безопасность сделки
    text: 'Поэтапная оплата и понятные условия. Сопровождаем документы на всех этапах: оформление, растаможка, регистрация. Без сюрпризов.'
  - title: Локальная экспертиза
    text: 'Знаем специфику каждого рынка: автобанные пробеги Германии, особенности кузова испанских авто, нюансы оформления на иностранные номера в Сербии.'
testimonialsHeading: Что говорят клиенты
testimonials:
  - quote: «Привезли BMW 3 серии из Мюнхена в Белград. Все четко, от осмотра до постановки на учет. Сэкономили кучу нервов на оформлении.»
    name: Александр
    caption: BMW 320d, Германия → Сербия
  - quote: «Долго искал Skoda Octavia в хорошем состоянии. Ребята нашли вариант в Испании, проверили независимым экспертом, все совпало с описанием.»
    name: Михаил
    caption: Skoda Octavia, Испания → Россия
  - quote: «Оформление на иностранные номера казалось сложным. Команда провела через каждый шаг, и через месяц я уже ездил. Рекомендую.»
    name: Дмитрий
    caption: VW Passat, Германия → Сербия
