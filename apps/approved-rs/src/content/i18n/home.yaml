    journeyHeading: 'Ein Weg: von der Suche bis zu den Schlüsseln'
    journeySubtext: Fahrzeugsuche, Import, Prüfung und Rückkauf – das sind keine unterschiedlichen Dienstleistungen, sondern Schritte eines gemeinsamen Weges Ihres Fahrzeugs. Sie können an jedem Schritt einsteigen.
    whyUsHeading: Warum uns wählen
    whyUsSubtext: Der Kauf eines Autos aus einem anderen Land wirft Fragen auf. So nehmen wir Ihnen diese.
    trustCards:
      - title: Volle Transparenz
        text: 'Wir senden eine detaillierte Checkliste (über 100 Punkte) und Videos zu jedem Detail: Karosserie, Innenraum, Fahrwerk. Sie sehen das Fahrzeug, als stünden Sie daneben.'
      - title: Sicherheit der Transaktion
        text: 'Zahlung in Raten und klare Bedingungen. Wir begleiten die Dokumente in allen Phasen: Abwicklung, Zoll, Registrierung – ohne Überraschungen.'
      - title: Lokale Expertise
        text: 'Wir kennen die Besonderheiten jedes Marktes: Autobahnkilometer in Deutschland, Eigenheiten von spanischen Autos, Besonderheiten bei der Zulassung ausländischer Kennzeichen in Serbien.'
    ctaEyebrow: Bereit zu starten?
