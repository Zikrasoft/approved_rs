vehicle-sourcing:
  title: Автоподбор авто под ключ {location}
  description: 'Автоподбор под ключ {location}: поиск, независимая проверка, сопровождение сделки и доставка до вашего города. Оставьте заявку, и мы свяжемся в Telegram.'
vehicle-buyback:
  title: 'Выкуп авто {location}: срочно, любые номера'
  description: 'Срочный выкуп автомобилей {location} на любых номерах: иностранных, российских или сербских. Оценка онлайн, оформление за 1 день, перевод в день сделки.'
vehicle-inspection:
  title: Проверка авто {location} перед покупкой
  description: Независимая проверка автомобиля {location}. Выезд эксперта, осмотр кузова и ходовой, отчет. Защитите себя от покупки битого авто.
translations:
  en:
    vehicle-sourcing:
      title: End-to-End Car Sourcing {location}
      description: "End-to-end car sourcing {location}: search, independent inspection, purchase support and delivery to your city. Enquire and we'll contact you on Telegram."
    vehicle-buyback:
      title: 'Sell Your Car {location}: Fast, Any Plates'
      description: Fast car buying {location}, with foreign, Russian or Serbian plates. Online valuation, paperwork in one day and payment on the day of sale.
    vehicle-inspection:
      title: Pre-Purchase Car Inspection {location}
      description: Independent car inspection {location}. On-site expert, bodywork and suspension checks, plus a report. Avoid buying a car with hidden accident damage.
  sr:
    vehicle-sourcing:
      title: Izbor auta po sistemu ključ u ruke {location}
      description: 'Izbor auta po sistemu ključ u ruke {location}: potraga, nezavisna provera, pomoć pri kupovini i dostava do vašeg grada. Javite nam se putem Telegrama.'
    vehicle-buyback:
      title: Hitan otkup auta {location}, sve tablice
      description: Hitan otkup auta {location} sa stranim, ruskim ili srpskim tablicama. Onlajn procena, završetak posla za 1 dan i uplata na dan kupoprodaje.
    vehicle-inspection:
      title: Nezavisna provera auta pre kupovine {location}
      description: Nezavisna provera auta pre kupovine {location}. Dolazak stručnjaka, pregled karoserije i trapa, izveštaj. Izbegnite kupovinu havarisanog auta.
  es:
    vehicle-sourcing:
      title: Búsqueda de coches llave en mano {location}
      description: 'Búsqueda de coches {location}: inspección independiente, gestión de compra y entrega en tu ciudad. Envía tu solicitud y te contactamos por Telegram.'
    vehicle-buyback:
      title: Compra inmediata de coches {location}, cualquier matrícula
      description: Compramos tu coche {location} con matrícula extranjera, rusa o serbia. Tasación online, trámites en un día y transferencia el día de la venta.
    vehicle-inspection:
      title: Inspección de coches {location} antes de comprar
      description: Inspección independiente de coches {location}. Un experto revisa carrocería y suspensión y emite un informe. Evita comprar un coche siniestrado.
  de:
    vehicle-sourcing:
      title: Fahrzeugsuche mit Rundum-Service {location}
      description: 'Autosuche aus einer Hand {location}: Suche, unabhängiger Check, Kaufbegleitung und Lieferung in Ihre Stadt. Jetzt anfragen, wir melden uns per Telegram.'
    vehicle-buyback:
      title: 'Autoankauf {location}: sofort, alle Kennzeichen'
      description: Sofortiger Autoankauf {location}, auch mit ausländischen Kennzeichen. Online-Bewertung, Abwicklung in 1 Tag, Überweisung am Kauftag.
    vehicle-inspection:
      title: Gebrauchtwagencheck {location} vor dem Kauf
      description: Unabhängiger Gebrauchtwagencheck {location}. Experte vor Ort, Prüfung von Karosserie und Fahrwerk, Prüfbericht. Schutz vor dem Kauf eines Unfallwagens.
