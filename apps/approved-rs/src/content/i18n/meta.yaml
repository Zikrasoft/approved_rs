vehicle-sourcing:
  title: Автоподбор авто под ключ {location}
  description: 'Автоподбор под ключ {location}: поиск, независимая проверка, сопровождение сделки и доставка до вашего города. Оставьте заявку — свяжемся в Telegram.'
vehicle-buyback:
  title: Выкуп авто {location} — срочно, любые номера
  description: Срочный выкуп автомобилей {location} на любых номерах — иностранных, российских или сербских. Оценка онлайн, оформление за 1 день, перевод в день сделки.
vehicle-inspection:
  title: Проверка авто {location} перед покупкой
  description: Независимая проверка автомобиля {location}. Выезд эксперта, осмотр кузова и ходовой, отчёт. Защитите себя от покупки битого авто.
translations:
  en:
    vehicle-sourcing:
      title: Car Sourcing Service in {location}
      description: "Full-service car sourcing in {location}: search, independent inspection, transaction support, and delivery to your city. Submit your request — we'll connect via Telegram."
    vehicle-buyback:
      title: Car Buyback in {location} — Fast, Any Plates
      description: Fast car buyback in {location} for any plates — foreign, Russian, or Serbian. Online assessment, paperwork in 1 day, transfer on the deal day.
    vehicle-inspection:
      title: Car Inspection in {location} Before Purchase
      description: Independent car inspection in {location}. Expert visit, body and suspension check, report included. Protect yourself from buying a damaged vehicle.
  sr:
    vehicle-sourcing:
      title: Autopodbor automobila po meri {location}
      description: 'Autopodbor po meri {location}: traženje, nezavisna provera, praćenje transakcije i dostava do vašeg grada. Ostavite zahtev - javićemo se na Telegram.'
    vehicle-buyback:
      title: Otkupljenje automobila {location} - hitno, svi brojevi
      description: Hitno otkupljenje automobila {location} na svim brojevima - stranih, ruskih ili srpskih. Procena online, obrada za 1 dan, transfer na dan transakcije.
    vehicle-inspection:
      title: Provera auta {location} pre kupovine
      description: Nezavisna provera automobila {location}. Dolazak eksperta, pregled karoserije i ovjesa, izveštaj. Zaštitite se od kupovine oštećenog automobila.
  es:
    vehicle-sourcing:
      title: Selección de autos llave en mano {location}
      description: 'Selección llave en mano {location}: búsqueda, revisión independiente, acompañamiento de la transacción y entrega a tu ciudad. Deja tu solicitud - nos comunicaremos por Telegram.'
    vehicle-buyback:
      title: Compra de autos {location} - urgente, cualquier matrícula
      description: Compra urgente de vehículos {location} con cualquier matrícula - extranjera, rusa o serbia. Evaluación en línea, tramitación en 1 día, transferencia el día de la transacción.
    vehicle-inspection:
      title: Inspección de autos {location} antes de la compra
      description: Inspección independiente de vehículos {location}. Visita de un experto, revisión de carrocería y suspensión, informe. Protéggete de la compra de un vehículo dañado.
  de:
    vehicle-sourcing:
      title: Fahrzeugbeschaffung schlüsselfertig {location}
      description: 'Fahrzeugbeschaffung schlüsselfertig {location}: Suche, unabhängige Prüfung, Begleitung des Verkaufs und Lieferung in Ihre Stadt. Stellen Sie eine Anfrage - wir kontaktieren Sie über Telegram.'
    vehicle-buyback:
      title: Autoankauf {location} - schnell, alle Nummern
      description: Schneller Autoankauf {location} für alle Nummernschilder - ausländisch, russisch oder serbisch. Online-Bewertung, Abwicklung in 1 Tag, Überweisung am Tag des Verkaufs.
    vehicle-inspection:
      title: Fahrzeugprüfung {location} vor dem Kauf
      description: Unabhängige Fahrzeugprüfung {location}. Gutachter vor Ort, Überprüfung von Karosserie und Fahrwerk, Bericht. Schützen Sie sich vor dem Kauf eines beschädigten Fahrzeugs.
