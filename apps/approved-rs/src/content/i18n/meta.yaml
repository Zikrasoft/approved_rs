vehicle-sourcing:
  title: Автоподбор авто под ключ {location}
  description: 'Автоподбор под ключ {location}: поиск, независимая проверка, сопровождение сделки и доставка до вашего города. Оставьте заявку — свяжемся в Telegram.'
vehicle-buyback:
  title: Выкуп авто {location} — срочно, любые номера
  description: Срочный выкуп автомобилей {location} на любых номерах — иностранных, российских или сербских. Оценка онлайн, оформление за 1 день, перевод в день сделки.
vehicle-inspection:
  title: Проверка авто {location} перед покупкой
  description: Независимая проверка автомобиля {location}. Выезд эксперта, осмотр кузова и ходовой, отчёт. Защитите себя от покупки битого авто.
translations:
  en:
    vehicle-sourcing:
      title: Car Sourcing Made Easy {location}
      description: "Turnkey car sourcing in {location}: search, independent inspection, deal support, and delivery to your city. Submit a request — we'll contact you on Telegram."
    vehicle-buyback:
      title: Car Buyback {location} — Fast, Any Plates
      description: Instant buyback of cars in {location} with any plates — foreign, Russian, or Serbian. Online valuation, paperwork in 1 day, transfer on the sale day.
    vehicle-inspection:
      title: Car Inspection {location} Before Purchase
      description: Independent vehicle inspection in {location}. Expert visit, body and undercarriage check, report. Protect yourself from buying a damaged car.
  sr:
    vehicle-sourcing:
      title: Pregled automobila po meri {location}
      description: 'Pregled automobila po meri {location}: traženje, nezavisna provera, pratnja transakciji i dostava do vašeg grada. Ostavite zahtev - javićemo se na Telegramu.'
    vehicle-buyback:
      title: Otkup automobila {location} — hitno, sve vrste
      description: Hitni otkup automobila {location} svih registarskih brojeva — stranih, ruskih ili srpskih. Procena online, završavanje za 1 dan, prenos na dan transakcije.
    vehicle-inspection:
      title: Provera auta {location} pre kupovine
      description: Nezavisna provera automobila {location}. Dolazak eksperta, pregled karoserije i ovjesa, izveštaj. Zaštitite se od kupovine oštećenog automobila.
  es:
    vehicle-sourcing:
      title: Selección de vehículos llave en mano {location}
      description: 'Selección de vehículos {location}: búsqueda, verificación independiente, acompañamiento de la transacción y entrega a su ciudad. Envíe su solicitud, nos pondremos en contacto por Telegram.'
    vehicle-buyback:
      title: Compra de vehículos {location} - urgente, cualquier matrícula
      description: Compra urgente de automóviles {location} con cualquier matrícula, ya sean extranjeras, rusas o serbias. Evaluación en línea, gestión en 1 día, transferencia el mismo día de la transacción.
    vehicle-inspection:
      title: Inspección de vehículos {location} antes de la compra
      description: Inspección independiente de vehículos {location}. Visita del experto, revisión de la carrocería y la mecánica, informe. Protéjase de comprar un vehículo dañado.
  de:
    vehicle-sourcing:
      title: Fahrzeugbeschaffung komplett {location}
      description: 'Fahrzeugbeschaffung {location}: Suche, unabhängige Prüfung, Begleitung des Kaufes und Lieferung in Ihre Stadt. Anfrage hinterlassen — wir kontaktieren Sie über Telegram.'
    vehicle-buyback:
      title: Autoankauf {location} — schnell, alle Nummern
      description: Schneller Autoankauf {location} mit allen Nummernschildern — ausländischen, russischen oder serbischen. Online-Bewertung, Abwicklung in 1 Tag, Überweisung am Tag des Kaufs.
    vehicle-inspection:
      title: Fahrzeugprüfung {location} vor dem Kauf
      description: Unabhängige Prüfung des Fahrzeugs {location}. Vor-Ort-Expertise, Inspektion von Karosserie und Fahrwerk, Bericht. Schützen Sie sich vor dem Kauf eines beschädigten Autos.
