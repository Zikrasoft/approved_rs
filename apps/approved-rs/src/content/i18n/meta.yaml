vehicle-sourcing:
  title: Автоподбор авто под ключ {location}
  description: 'Автоподбор под ключ {location}: поиск, независимая проверка, сопровождение сделки и доставка до вашего города. Оставьте заявку — свяжемся в Telegram.'
vehicle-buyback:
  title: Выкуп авто {location} — срочно, любые номера
  description: Срочный выкуп автомобилей {location} на любых номерах — иностранных, российских или сербских. Оценка онлайн, оформление за 1 день, перевод в день сделки.
vehicle-inspection:
  title: Проверка авто {location} перед покупкой
  description: Независимая проверка автомобиля {location}. Выезд эксперта, осмотр кузова и ходовой, отчёт. Защитите себя от покупки битого авто.
translations:
  en:
    vehicle-sourcing:
      title: Car Sourcing Service {location}
      description: "Complete car sourcing in {location}: search, independent inspection, transaction support, and delivery to your city. Submit your request — we'll contact you on Telegram."
    vehicle-buyback:
      title: Car Buyback {location} — urgent, any plates
      description: Urgent car buyback in {location} for any plates — foreign, Russian, or Serbian. Online valuation, processing in 1 day, transfer on the transaction day.
    vehicle-inspection:
      title: Car Inspection {location} Before Purchase
      description: Independent vehicle inspection in {location}. Expert visit, body and drivetrain inspection, report. Protect yourself from buying a damaged car.
  sr:
    vehicle-sourcing:
      title: Izbor automobila po meri {location}
      description: 'Izbor automobila {location}: pretraga, nezavisna provera, pratnja toku transakcije i dostava do vašeg grada. Ostavite zahtev — javićemo se preko Telegrama.'
    vehicle-buyback:
      title: Otkupljenje automobila {location} — hitno, sve registracije
      description: Hitno otkupljenje automobila {location} na svim registracijama — stranih, ruskih ili srpskih. Procena online, obrada za 1 dan, transfer na dan transakcije.
    vehicle-inspection:
      title: Provera auta {location} pre kupovine
      description: Nezavisna provera automobila {location}. Dolazak eksperta, pregled karoserije i vešanja, izveštaj. Zaštitite se od kupovine slupanog auta.
  es:
    vehicle-sourcing:
      title: Compra de coches llave en mano {location}
      description: 'Compra de coches llave en mano {location}: búsqueda, inspección independiente, apoyo en la transacción y entrega a tu ciudad. Envía tu solicitud, nos contactaremos por Telegram.'
    vehicle-buyback:
      title: Compra de coches {location} — urgente, cualquier matrícula
      description: Compra urgente de vehículos {location} con cualquier matrícula — extranjera, rusa o serbia. Evaluación online, trámite en 1 día, transferencia el día de la transacción.
    vehicle-inspection:
      title: Inspección de coches {location} antes de la compra
      description: Inspección independiente de automóviles {location}. Salida del experto, revisión de la carrocería y el sistema de suspensión, informe. Protéggete de comprar un coche dañado.
  de:
    vehicle-sourcing:
      title: Fahrzeugbeschaffung schlüsselfertig {location}
      description: 'Schlüsselfertige Fahrzeugbeschaffung {location}: Suche, unabhängige Überprüfung, Begleitung des Kaufs und Lieferung in Ihre Stadt. Lassen Sie uns eine Anfrage da — wir kontaktieren Sie über Telegram.'
    vehicle-buyback:
      title: Autoankauf {location} - schnell, für alle Nummern
      description: Schneller Autoankauf {location} für alle Nummern - ausländische, russische oder serbische. Online Bewertung, Abwicklung an einem Tag, Überweisung am Tag des Kaufs.
    vehicle-inspection:
      title: Fahrzeugprüfung {location} vor dem Kauf
      description: Unabhängige Fahrzeugprüfung {location}. Anfahrt des Experten, Sichtprüfung der Karosserie und Fahrwerk, Bericht. Schützen Sie sich vor dem Kauf eines beschädigten Fahrzeugs.
