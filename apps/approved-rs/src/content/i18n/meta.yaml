vehicle-sourcing:
  title: Автоподбор авто под ключ {location}
  description: 'Автоподбор под ключ {location}: поиск, независимая проверка, сопровождение сделки и доставка до вашего города. Оставьте заявку — свяжемся в Telegram.'
vehicle-buyback:
  title: Выкуп авто {location} — срочно, любые номера
  description: Срочный выкуп автомобилей {location} на любых номерах — иностранных, российских или сербских. Оценка онлайн, оформление за 1 день, перевод в день сделки.
vehicle-inspection:
  title: Проверка авто {location} перед покупкой
  description: Независимая проверка автомобиля {location}. Выезд эксперта, осмотр кузова и ходовой, отчёт. Защитите себя от покупки битого авто.
translations:
  en:
    vehicle-sourcing:
      title: Complete Car Sourcing {location}
      description: "Complete car sourcing {location}: search, independent inspection, transaction support, and delivery to your city. Submit a request — we'll contact you on Telegram."
    vehicle-buyback:
      title: Car Buyback {location} — urgent, any license plates
      description: Urgent car buyback {location} for any license plates — foreign, Russian, or Serbian. Online evaluation, processing in 1 day, transfer on the transaction day.
    vehicle-inspection:
      title: Car Inspection {location} Before Purchase
      description: Independent car inspection {location}. Expert visit, body and undercarriage check, report. Protect yourself from buying a damaged vehicle.
  sr:
    vehicle-sourcing:
      title: Pronalazak automobila po meri {location}
      description: 'Pronalazak automobila po meri {location}: pretraga, nezavisna provera, vođenje postupka i dostava do vašeg grada. Ostavite zahtev — javićemo se na Telegram.'
    vehicle-buyback:
      title: Otkupljenje automobila {location} — hitno, svi brojevi
      description: Hitno otkupljenje automobila {location} sa svim brojevima — stranih, ruskih ili srpskih. Procena online, obrada za 1 dan, prenos na dan transakcije.
    vehicle-inspection:
      title: Provera auta {location} pre kupovine
      description: Nezavisna provera automobila {location}. Dolazak eksperta, pregled karoserije i vešanja, izveštaj. Zaštitite se od kupovine oštećenog automobila.
  es:
    vehicle-sourcing:
      title: Servicio de compra de coches a medida {location}
      description: 'Compra de coches a medida {location}: búsqueda, revisión independiente, acompañamiento en la transacción y entrega en su ciudad. Deje su solicitud, nos contactaremos por Telegram.'
    vehicle-buyback:
      title: Compra de coches {location} — urgente, cualquier matrícula
      description: Compra urgente de coches {location} con cualquier matrícula — extranjera, rusa o serbia. Valoración online, tramitación en 1 día, transferencia el día de la transacción.
    vehicle-inspection:
      title: Inspección de coches {location} antes de comprar
      description: Inspección independiente de un coche {location}. Visita del experto, revisión de carrocería y suspensión, informe. Protéjase de comprar un coche dañado.
  de:
    vehicle-sourcing:
      title: Fahrzeugbeschaffung schlüsselfertig {location}
      description: 'Schlüsselfertige Fahrzeugbeschaffung {location}: Suche, unabhängige Überprüfung, Begleitung des Kaufs und Lieferung in Ihre Stadt. Anfrage stellen — wir kontaktieren Sie über Telegram.'
    vehicle-buyback:
      title: Autoankauf {location} — schnell, alle Nummern
      description: Schneller Autoankauf {location} mit allen Nummern — ausländisch, russisch oder serbisch. Online-Bewertung, Abwicklung in 1 Tag, Überweisung am Tag des Kaufs.
    vehicle-inspection:
      title: Fahrzeugprüfung {location} vor dem Kauf
      description: Unabhängige Fahrzeugprüfung {location}. Experteneinsatz, Inspektion von Karosserie und Fahrwerk, Bericht. Schützen Sie sich vor dem Kauf eines beschädigten Fahrzeugs.
