vehicle-sourcing:
  title: Автоподбор авто под ключ {location}
  description: 'Автоподбор под ключ {location}: поиск, независимая проверка, сопровождение сделки и доставка до вашего города. Оставьте заявку, и мы свяжемся в Telegram.'
vehicle-buyback:
  title: 'Выкуп авто {location}: срочно, любые номера'
  description: 'Срочный выкуп автомобилей {location} на любых номерах: иностранных, российских или сербских. Оценка онлайн, оформление за 1 день, перевод в день сделки.'
vehicle-inspection:
  title: Проверка авто {location} перед покупкой
  description: Независимая проверка автомобиля {location}. Выезд эксперта, осмотр кузова и ходовой, отчет. Защитите себя от покупки битого авто.
translations:
  en:
    vehicle-sourcing:
      title: Turnkey car sourcing {location}
      description: "Turnkey car sourcing {location}: search, independent inspection, deal support and delivery to your city. Get in touch and we'll message you on Telegram."
    vehicle-buyback:
      title: 'We buy cars {location}: fast, any plates'
      description: Fast car buyback {location}, with foreign, Russian or Serbian plates. Online valuation, paperwork in 1 day, payment on the day of sale.
    vehicle-inspection:
      title: Pre-purchase car inspection {location}
      description: Independent car inspection {location}. Expert visit, body and suspension check, detailed report. Avoid buying a damaged car.
  sr:
    vehicle-sourcing:
      title: Auto po meri, ključ u ruke {location}
      description: 'Auto po meri {location}: potraga, nezavisna provera, podrška pri kupovini i dostava do vašeg grada. Pošaljite upit, javljamo se na Telegramu.'
    vehicle-buyback:
      title: 'Otkup automobila {location}: brzo, sve tablice'
      description: 'Hitan otkup automobila {location}, bez obzira na tablice: strane, ruske ili srpske. Procena online, završetak za 1 dan, isplata na dan kupovine.'
    vehicle-inspection:
      title: provera auta pre kupovine {location}
      description: Nezavisna provera auta pre kupovine {location}. Izlazak stručnjaka, pregled karoserije i trapa, izveštaj. Izbegnite kupovinu havarisanog auta.
  es:
    vehicle-sourcing:
      title: Búsqueda de coches a medida {location}
      description: 'Búsqueda integral de coches {location}: localización, inspección independiente, gestión de la compra y entrega en tu ciudad. Escríbenos y te contactamos por Telegram.'
    vehicle-buyback:
      title: Compramos coches {location}, con cualquier matrícula
      description: Compramos coches urgentemente {location}, con matrícula extranjera, rusa o serbia. Tasación online, trámites en 1 día y pago el mismo día.
    vehicle-inspection:
      title: Inspección de coches antes de comprar {location}
      description: Inspección independiente de coches {location}. Un experto revisa la carrocería y la suspensión y te entrega un informe. Evita comprar un coche accidentado.
  de:
    vehicle-sourcing:
      title: 'Auto finden lassen {location}: Rundum-Service'
      description: 'Auto finden lassen {location}: Suche, unabhängige Prüfung, Kaufbegleitung und Lieferung in Ihre Stadt. Anfrage senden, wir melden uns per Telegram.'
    vehicle-buyback:
      title: 'Autoankauf {location}: schnell, alle Kennzeichen'
      description: 'Schneller Autoankauf {location}, unabhängig vom Kennzeichen: ausländisch, russisch oder serbisch. Online-Bewertung, Abwicklung in 1 Tag, Zahlung am Verkaufstag.'
    vehicle-inspection:
      title: Auto prüfen lassen {location} vor dem Kauf
      description: 'Unabhängige Fahrzeugprüfung {location}: Vor-Ort-Termin, Kontrolle von Karosserie und Fahrwerk, Bericht. Schützen Sie sich vor einem Unfallwagen.'
