vehicle-sourcing:
  title: Автоподбор авто под ключ {location}
  description: 'Автоподбор под ключ {location}: поиск, независимая проверка, сопровождение сделки и доставка до вашего города. Оставьте заявку — свяжемся в Telegram.'
vehicle-buyback:
  title: Выкуп авто {location} — срочно, любые номера
  description: Срочный выкуп автомобилей {location} на любых номерах — иностранных, российских или сербских. Оценка онлайн, оформление за 1 день, перевод в день сделки.
vehicle-inspection:
  title: Проверка авто {location} перед покупкой
  description: Независимая проверка автомобиля {location}. Выезд эксперта, осмотр кузова и ходовой, отчёт. Защитите себя от покупки битого авто.
translations:
  en:
    vehicle-sourcing:
      title: Turnkey Vehicle Sourcing {location}
      description: 'Turnkey vehicle sourcing in {location}: search, independent inspection, transaction support, and delivery to your city. Submit your request — we will contact you on Telegram.'
    vehicle-buyback:
      title: Car Buyback {location} — Urgent, Any Plates
      description: Urgent car buyback in {location} for any plates — foreign, Russian, or Serbian. Online valuation, processing in 1 day, transfer on the day of the transaction.
    vehicle-inspection:
      title: Car Inspection {location} Before Purchase
      description: Independent car inspection in {location}. Expert visit, body and running gear inspection, report. Protect yourself from buying a damaged vehicle.
  sr:
    vehicle-sourcing:
      title: Odabir automobila po meri {location}
      description: 'Odabir automobila po meri {location}: pretraga, nezavisna provera, pratnja pri kupovini i dostava do vašeg grada. Ostavite zahtev — javićemo se na Telegram.'
    vehicle-buyback:
      title: Otkupljujemo auto {location} — hitno, bilo koji registracijski broj
      description: Hitni otkup automobila {location} sa bilo kojim registracijskim brojem — stranih, ruskih ili srpskih. Procena online, završavanje za 1 dan, isplata na dan transakcije.
    vehicle-inspection:
      title: Provera automobila {location} pre kupovine
      description: Nezavisna provera automobila {location}. Dolazak stručnjaka, pregled karoserije i mehanike, izveštaj. Zaštitite se od kupovine oštećenog automobila.
  es:
    vehicle-sourcing:
      title: Búsqueda de autos llave en mano {location}
      description: 'Búsqueda de autos llave en mano {location}: localización, inspección independiente, acompañamiento en la transacción y entrega a su ciudad. Envíe su solicitud y nos comunicaremos por Telegram.'
    vehicle-buyback:
      title: Compra de autos {location} — urgente, cualquier matrícula
      description: Compra urgente de automóviles {location} con cualquier matrícula — extranjera, rusa o serbia. Evaluación online, tramitación en 1 día, transferencia el día de la transacción.
    vehicle-inspection:
      title: Inspección de autos {location} antes de la compra
      description: Inspección independiente de vehículos {location}. Visita del experto, revisión de la carrocería y el chasis, informe. Protéjase de la compra de un auto accidentado.
  de:
    vehicle-sourcing:
      title: Fahrzeugbeschaffung schlüsselfertig {location}
      description: 'Schlüsselfertige Fahrzeugbeschaffung {location}: Suche, unabhängige Prüfung, Begleitung des Verkaufs und Lieferung zu Ihnen. Hinterlassen Sie eine Anfrage — wir kontaktieren Sie über Telegram.'
    vehicle-buyback:
      title: Autoankauf {location} – dringend, alle Nummernschilder
      description: Dringender Autoankauf {location} für alle Nummernschilder – ausländische, russische oder serbische. Online-Bewertung, Abwicklung innerhalb von 1 Tag, Überweisung am Tag des Verkaufs.
    vehicle-inspection:
      title: Fahrzeugprüfung {location} vor dem Kauf
      description: Unabhängige Fahrzeugprüfung {location}. Expertenbesuch, Inspektion der Karosserie und des Fahrwerks, Bericht. Schützen Sie sich vor dem Kauf eines beschädigten Fahrzeugs.
