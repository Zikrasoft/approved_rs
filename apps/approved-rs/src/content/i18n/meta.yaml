vehicle-sourcing:
  title: Автоподбор авто под ключ {location}
  description: 'Автоподбор под ключ {location}: поиск, независимая проверка, сопровождение сделки и доставка до вашего города. Оставьте заявку — свяжемся в Telegram.'
vehicle-buyback:
  title: Выкуп авто {location} — срочно, любые номера
  description: Срочный выкуп автомобилей {location} на любых номерах — иностранных, российских или сербских. Оценка онлайн, оформление за 1 день, перевод в день сделки.
vehicle-inspection:
  title: Проверка авто {location} перед покупкой
  description: Независимая проверка автомобиля {location}. Выезд эксперта, осмотр кузова и ходовой, отчёт. Защитите себя от покупки битого авто.
translations:
  en:
    vehicle-sourcing:
      title: Car Sourcing Services {location}
      description: "Comprehensive car sourcing in {location}: searching, independent inspection, transaction support, and delivery to your city. Submit a request - we'll contact you via Telegram."
    vehicle-buyback:
      title: Car Buyback in {location} - Quick, Any Plates
      description: Quick car buyback in {location} for any plates - foreign, Russian, or Serbian. Online evaluation, processing in 1 day, transfer on the day of the deal.
    vehicle-inspection:
      title: Car Inspection in {location} Before Purchase
      description: Independent vehicle inspection in {location}. Expert visit, body and suspension assessment, report provided. Protect yourself from buying a damaged car.
  sr:
    vehicle-sourcing:
      title: Odabir automobila po meri {location}
      description: 'Odabir automobila po meri {location}: pretraga, nezavisna provera, podrška prilikom kupovine i dostava do vašeg grada. Ostavite zahtev — javićemo se na Telegram.'
    vehicle-buyback:
      title: Otkupljenje automobila {location} — hitno, sve registarske oznake
      description: Hitno otkupljenje automobila {location} sa svim registarskim oznakama — stranim, ruskim ili srpskim. Procena online, obrada za 1 dan, prenos na dan kupovine.
    vehicle-inspection:
      title: Provera auta {location} pre kupovine
      description: Nezavisna provera automobila {location}. Izlazak eksperta, pregled karoserije i šasije, izveštaj. Zaštitite se od kupovine oštećenog automobila.
  es:
    vehicle-sourcing:
      title: Seleccion de coches llave en mano {location}
      description: 'Selección de coches llave en mano {location}: búsqueda, inspección independiente, acompañamiento de la transacción y entrega a su ciudad. Envíe su solicitud, nos contactaremos por Telegram.'
    vehicle-buyback:
      title: Compra de coches {location} — urgente, cualquier matrícula
      description: Compra urgente de coches {location} con cualquier matrícula — extranjera, rusa o serbia. Evaluación en línea, trámite en 1 día, transferencia el día de la transacción.
    vehicle-inspection:
      title: Inspección de coches {location} antes de comprar
      description: Inspección independiente de coches {location}. Salida del experto, revisión de la carrocería y suspensión, informe. Protéjase de comprar un coche accidentado.
  de:
    vehicle-sourcing:
      title: Fahrzeugbeschaffung schlüsselfertig {location}
      description: 'Fahrzeugbeschaffung schlüsselfertig {location}: Suche, unabhängige Prüfung, Begleitung des Deals und Lieferung in Ihre Stadt. Kontaktieren Sie uns über Telegram.'
    vehicle-buyback:
      title: Autoankauf {location} – schnell, alle Nummern
      description: Schneller Autoankauf {location} mit allen Nummern – ausländischen, russischen oder serbischen. Online-Bewertung, Abwicklung in 1 Tag, Übertragung am Tag des Kaufs.
    vehicle-inspection:
      title: Fahrzeugprüfung {location} vor dem Kauf
      description: Unabhängige Fahrzeugprüfung {location}. Experte kommt zu Ihnen, Inspektion von Karosserie und Fahrwerk, Bericht. Schützen Sie sich vor dem Kauf eines beschädigten Fahrzeugs.
