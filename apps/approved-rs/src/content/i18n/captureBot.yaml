      request: Submit an inquiry
      site: Learn more on the site
    contacts:
      button: Contact Us
      text: We're here for you — message or call us.
      hours: Available 24/7, no days off
    manager:
      button: Message the manager
      text: Send your question in one message — the manager will reply right here.
    partners:
      button: Partners
      text: Repairs and detailing — with partners we trust. Choose who to contact.
