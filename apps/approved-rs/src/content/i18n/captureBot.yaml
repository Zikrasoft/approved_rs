  de:
    greeting: Hallo! Danke für Ihre Nachricht – Ihre Anfrage liegt uns vor, wir melden uns gleich.
    lookingFor: Sagen Sie uns kurz, welches Auto Sie interessiert oder wobei Sie Hilfe brauchen.
    budget: Und mit welchem Budget rechnen Sie?
    phoneAsk: Teilen Sie Ihre Telefonnummer, damit wir Sie erreichen können – oder überspringen Sie diesen Schritt.
    phoneOffer: Wenn Ihnen ein Anruf lieber ist, teilen Sie Ihre Nummer, dann rufen wir an. Wenn nicht, einfach überspringen.
