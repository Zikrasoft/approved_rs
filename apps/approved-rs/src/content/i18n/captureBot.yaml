greeting: Здравствуйте! Спасибо, что написали — мы уже видим ваше обращение и скоро ответим.
lookingFor: Расскажите в двух словах, какая машина вас интересует или с чем нужна помощь.
budget: И на какой бюджет вы рассчитываете?
phoneAsk: Чтобы мы могли с вами связаться, поделитесь номером телефона — или пропустите этот шаг.
phoneOffer: Если удобнее по телефону, поделитесь номером, и мы позвоним. Если нет, просто пропустите.
phoneButton: Поделиться номером
phoneSkip: Пропустить
thanks: Спасибо! Передали менеджеру — он скоро с вами свяжется.
received: Приняли, менеджер увидит ваше сообщение.
menu:
  text: Чем можем помочь? Выберите, что вас интересует.
  back: « Назад
services:
  button: Услуги
  text: Вот с чем мы помогаем. Выберите услугу — расскажем подробнее.
card:
  request: Оставить заявку
  site: Подробнее на сайте
translations:
  en:
    greeting: Hello! Thanks for getting in touch — we can see your enquiry and we'll come back to you shortly.
    lookingFor: Tell us in a couple of words which car you have in mind, or what you need a hand with.
    budget: And what budget are you working with?
    phoneAsk: Share your phone number so we can reach you — or skip this step.
    phoneOffer: If a call suits you better, share your number and we'll ring you. If not, just skip it.
    phoneButton: Share my number
    phoneSkip: Skip
    thanks: Thank you! I've passed this on to the manager — they'll be in touch with you soon.
    received: Got it, your manager will see your message.
  sr:
    greeting: Zdravo! Hvala što ste se javili — već smo primili vašu poruku i uskoro ćemo odgovoriti.
    lookingFor: Recite nam ukratko koju mašinu tražite ili u čemu vam treba pomoć.
    budget: Koji je vaš budžet?
    phoneAsk: Da bismo mogli da vas kontaktiramo, podelite nam svoj broj telefona — ili preskočite ovaj korak.
    phoneOffer: Ako vam je lakše putem telefona, podelite broj, pa ćemo pozvati. Ako ne, samo preskočite.
    phoneButton: Podeliti broj
    phoneSkip: Preskočiti
    thanks: Hvala! Prosledili smo manageru — uskoro će vas kontaktirati.
    received: Primili smo, manager će videti vašu poruku.
  es:
    greeting: ¡Hola! Gracias por escribirnos, ya vemos tu consulta y te respondemos enseguida.
    lookingFor: Cuéntanos en dos palabras qué coche te interesa o en qué necesitas ayuda.
    budget: ¿Y con qué presupuesto cuentas?
    phoneAsk: Comparte tu número de teléfono para que podamos contactarte, o salta este paso.
    phoneOffer: Si prefieres que te llamemos, comparte tu número. Si no, sáltatelo sin problema.
    phoneButton: Compartir mi número
    phoneSkip: Omitir
    thanks: ¡Gracias! Se lo hemos transmitido al gerente, pronto se pondrá en contacto contigo.
    received: Recibido, el gestor verá tu mensaje.
  de:
    greeting: Hallo! Danke für Ihre Nachricht – Ihre Anfrage liegt uns vor, wir melden uns gleich.
    lookingFor: Sagen Sie uns kurz, welches Auto Sie interessiert oder wobei Sie Hilfe brauchen.
    budget: Und mit welchem Budget rechnen Sie?
    phoneAsk: Teilen Sie Ihre Telefonnummer, damit wir Sie erreichen können – oder überspringen Sie diesen Schritt.
    phoneOffer: Wenn Ihnen ein Anruf lieber ist, teilen Sie Ihre Nummer, dann rufen wir an. Wenn nicht, einfach überspringen.
    phoneButton: Nummer teilen
    phoneSkip: Überspringen
    thanks: Danke! Wir haben es dem Manager weitergeleitet — er wird sich bald bei Ihnen melden.
    received: Angekommen, Ihr Ansprechpartner sieht Ihre Nachricht.
