packages:
  - 'apps/*'
  - 'packages/*'

# pnpm v11 format
allowBuilds:
  esbuild: true
  sharp: true
  '@parcel/watcher': true
  '@swc/core': true
  msgpackr-extract: true
  protobufjs: true
  '@medusajs/telemetry': false
# Glob, not exact-versioned entries — pnpm auto-generated this list pinned
# to the versions resolved at the time `vercel` was added; a future `vercel`
# bump changes every one of those versions, and an exact-pinned list would
# silently go stale (pnpm docs use this exact glob form, e.g. '@myorg/*',
# for "allow all packages from one source").
minimumReleaseAgeExclude:
  - '@vercel/*'
  - vercel
# pnpm v9/v10 format (for Vercel, which supports up to pnpm 10)
onlyBuiltDependencies:
  - esbuild
  - sharp
  - '@parcel/watcher'
  - msgpackr-extract
  - '@swc/core'
  - protobufjs
packageExtensions:
  '@medusajs/core-flows':
    dependencies:
      uuid: 11.1.1
overrides:
  zod@4: 4.6.7
  devalue@5: 5.9.4
  body-parser@1: 1.20.9
  multer@2: 2.5.0
  undici@6: 6.29.1
  undici@7: 7.30.1
  undici@8: 8.12.3
  lodash@4: 4.18.1
  follow-redirects@1: 1.16.2
