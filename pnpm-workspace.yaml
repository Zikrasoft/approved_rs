packages:
  - 'apps/*'
  - 'packages/*'

# pnpm v11 format
allowBuilds:
  esbuild: true
  sharp: true
  '@parcel/watcher': true
# Glob, not exact-versioned entries — pnpm auto-generated this list pinned
# to the versions resolved at the time `vercel` was added; a future `vercel`
# bump changes every one of those versions, and an exact-pinned list would
# silently go stale (pnpm docs use this exact glob form, e.g. '@myorg/*',
# for "allow all packages from one source").
minimumReleaseAgeExclude:
  - '@vercel/*'
  - vercel
# pnpm v9/v10 format (for Vercel, which supports up to pnpm 10)
onlyBuiltDependencies:
  - esbuild
  - sharp
  - '@parcel/watcher'
